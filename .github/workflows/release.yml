name: Create FoundryVTT Module Release

env:
  PROJECT_URL: "https://github.com/${{ github.repository }}"
  LATEST_MANIFEST_URL: "https://github.com/${{ github.repository }}/releases/latest/download/module.json"
  RELEASE_MODULE_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip"

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------
      # Checkout
      #
      # lfs:true demande à actions/checkout de récupérer les objets
      # Git LFS. On force ensuite fetch + checkout pour garantir que
      # le working tree contient bien les vrais fichiers.
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      # ------------------------------------------------------------
      # Git LFS
      # ------------------------------------------------------------
      - name: Materialize Git LFS files
        shell: bash
        run: |
          echo "===== Git LFS ====="
          git lfs version

          echo ""
          echo "Téléchargement des objets LFS pour le commit de release..."
          git lfs fetch origin "${GITHUB_SHA}"

          echo ""
          echo "Matérialisation des objets LFS dans le working tree..."
          git lfs checkout

          echo ""
          echo "===== État LFS ====="
          git lfs status

      # ------------------------------------------------------------
      # Vérification LFS
      #
      # Empêche de publier des pointeurs Git LFS à la place
      # des vrais fichiers.
      # ------------------------------------------------------------
      - name: Verify Git LFS files
        shell: bash
        run: |
          POINTERS="$(grep -RIl \
            '^version https://git-lfs.github.com/spec/v1' \
            assets/ \
            || true)"

          if [ -n "$POINTERS" ]; then
            echo "❌ Des pointeurs Git LFS sont encore présents :"
            echo "$POINTERS"
            exit 1
          fi

          echo "✅ Aucun pointeur Git LFS détecté dans assets/"

      # ------------------------------------------------------------
      # Validation des fichiers OGG
      #
      # Vérifie que chaque .ogg est réellement un conteneur Ogg
      # et non un pointeur LFS ou un fichier mal renommé.
      # ------------------------------------------------------------
      - name: Validate OGG assets
        shell: bash
        run: |
          FAILED=0
          COUNT=0

          while IFS= read -r -d '' FILE; do
            COUNT=$((COUNT + 1))
            MAGIC="$(head -c 4 "$FILE")"

            if [ "$MAGIC" != "OggS" ]; then
              echo "❌ Fichier OGG invalide : $FILE"
              file "$FILE" || true
              FAILED=1
            fi
          done < <(find assets -type f -name '*.ogg' -print0)

          echo "Fichiers OGG contrôlés : $COUNT"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "✅ Tous les fichiers .ogg commencent par OggS"

      # ------------------------------------------------------------
      # pnpm + Node + cache
      #
      # Version identique au poste de développement :
      # pnpm 11.24.0 / Node 22
      #
      # install:false évite une installation automatique : le
      # pnpm install --frozen-lockfile reste explicite juste après.
      # ------------------------------------------------------------
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 11.24.0
          runtime: node@22
          cache: true
          install: false

      # ------------------------------------------------------------
      # Dépendances
      # ------------------------------------------------------------
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------
      # Version de la release
      #
      # Accepte :
      #   0.1.0
      #   v0.1.0
      #
      # Dans les deux cas VERSION = 0.1.0
      # ------------------------------------------------------------
      - name: Extract Version From Tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Tag     : $TAG"
          echo "Version : $VERSION"

      # ------------------------------------------------------------
      # Exécution des tests
      #
      # Bloquant : une release ne peut pas être publiée si les
      # tests échouent (exit != 0).
      # ------------------------------------------------------------
      - name: Run Tests
        run: pnpm test

      # ------------------------------------------------------------
      # Audit des sources YAML
      # ------------------------------------------------------------
      - name: Audit Pack Sources
        run: pnpm packs:audit

      # ------------------------------------------------------------
      # Nettoyage des anciens artefacts LevelDB
      #
      # packs/ contient uniquement des artefacts générés.
      # Une release repart toujours de zéro.
      # ------------------------------------------------------------
      - name: Clean Generated Packs
        shell: bash
        run: |
          echo "Suppression des anciens packs générés..."
          rm -rf packs
          echo "✅ Répertoire packs/ nettoyé"

      # ------------------------------------------------------------
      # Compilation YAML -> Foundry LevelDB
      # ------------------------------------------------------------
      - name: Build Foundry LevelDB Packs
        run: pnpm packs:build

      # ------------------------------------------------------------
      # Validation des datastores générés
      # ------------------------------------------------------------
      - name: Validate Generated Pack Datastores
        run: |
          node <<'NODE'
          const fs = require("fs");

          const manifest = JSON.parse(
            fs.readFileSync("module.json", "utf8")
          );

          let hasError = false;

          console.log("===== Datastores Foundry =====");

          for (const pack of manifest.packs ?? []) {
            const packPath = pack.path;

            if (!fs.existsSync(packPath)) {
              console.error(
                `❌ Datastore absent : ${pack.name} -> ${packPath}`
              );
              hasError = true;
              continue;
            }

            const files = fs.readdirSync(packPath);

            if (files.length === 0) {
              console.error(
                `❌ Datastore vide/invalide : ${pack.name} -> ${packPath}`
              );
              hasError = true;
              continue;
            }

            console.log(`✅ ${pack.name} -> ${packPath}`);
          }

          if (hasError) {
            process.exit(1);
          }

          console.log("✅ Tous les datastores déclarés ont été générés");
          NODE

      # ------------------------------------------------------------
      # Génération du manifest de release
      #
      # Le module.json du repository n'est pas modifié :
      # nous travaillons uniquement dans le runner.
      # ------------------------------------------------------------
      - name: Update Module Manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROJECT_URL: ${{ env.PROJECT_URL }}
          MANIFEST_URL: ${{ env.LATEST_MANIFEST_URL }}
          DOWNLOAD_URL: ${{ env.RELEASE_MODULE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "module.json";
          const manifest = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          manifest.version = process.env.VERSION;
          manifest.url = process.env.PROJECT_URL;
          manifest.manifest = process.env.MANIFEST_URL;
          manifest.download = process.env.DOWNLOAD_URL;

          fs.writeFileSync(
            path,
            JSON.stringify(manifest, null, 2) + "\n"
          );

          console.log("Manifest de release :");
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      # ------------------------------------------------------------
      # Validation du manifest
      # ------------------------------------------------------------
      - name: Validate Module Manifest
        run: |
          node <<'NODE'
          const fs = require("fs");

          const manifest = JSON.parse(
            fs.readFileSync("module.json", "utf8")
          );

          const required = [
            "id",
            "title",
            "version",
            "manifest",
            "download"
          ];

          for (const key of required) {
            if (!manifest[key]) {
              throw new Error(
                `module.json : champ obligatoire absent : ${key}`
              );
            }
          }

          console.log(
            `✅ Manifest valide : ${manifest.id} ${manifest.version}`
          );
          console.log(`Manifest : ${manifest.manifest}`);
          console.log(`Download : ${manifest.download}`);
          NODE

      # ------------------------------------------------------------
      # Création du module Foundry
      #
      # Uniquement les fichiers nécessaires au runtime.
      # ------------------------------------------------------------
      - name: Create Module Archive
        shell: bash
        run: |
          rm -f module.zip

          zip \
            --recurse-paths \
            module.zip \
            module.json \
            README-WARBOUND-DA.md \
            assets/ \
            scripts/ \
            styles/ \
            packs/

      # ------------------------------------------------------------
      # Validation de l'archive finale
      #
      # Vérifie l'artefact réellement publié, sans extraire les
      # centaines de Mo d'assets sur le runner.
      # ------------------------------------------------------------
      - name: Validate Module Archive
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess
          import sys
          import zipfile

          archive = "module.zip"

          lfs_files = subprocess.check_output(
              ["git", "lfs", "ls-files", "-n"],
              text=True
          ).splitlines()

          with zipfile.ZipFile(archive, "r") as z:
              names = set(z.namelist())
              errors = []

              # Vérifie les fichiers LFS réellement présents dans le ZIP.
              for path in lfs_files:
                  if path not in names:
                      continue

                  with z.open(path) as f:
                      prefix = f.read(64)

                  if prefix.startswith(
                      b"version https://git-lfs.github.com/spec/v1"
                  ):
                      errors.append(
                          f"Pointeur Git LFS dans le ZIP : {path}"
                      )

              # Vérifie également tous les OGG de l'archive.
              for path in names:
                  if not path.lower().endswith(".ogg"):
                      continue

                  with z.open(path) as f:
                      magic = f.read(4)

                  if magic != b"OggS":
                      errors.append(
                          f"OGG invalide dans le ZIP : {path}"
                      )

              if errors:
                  for error in errors:
                      print(f"❌ {error}")
                  sys.exit(1)

          print("✅ Archive valide : aucun pointeur LFS et tous les OGG commencent par OggS")
          PY

      # ------------------------------------------------------------
      # Inspection du ZIP
      # ------------------------------------------------------------
      - name: Inspect Module Archive
        shell: bash
        run: |
          echo "===== Taille ====="
          ls -lh module.zip

          echo ""
          echo "===== Contenu racine / premiers fichiers ====="
          unzip -l module.zip | sed -n '1,100p'

          echo ""
          echo "===== module.json ====="
          unzip -p module.zip module.json

      # ------------------------------------------------------------
      # Publication des deux artefacts dans la release existante
      # ------------------------------------------------------------
      - name: Upload Release Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.release.name }}
          tag: ${{ github.event.release.tag_name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          artifacts: "./module.json,./module.zip"
          body: ${{ github.event.release.body }}