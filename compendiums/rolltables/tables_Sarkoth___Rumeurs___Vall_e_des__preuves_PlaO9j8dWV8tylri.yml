  - _id: 057f4a956488f735
    type: text
    name: Son venin traverse les antidotes
    description: >-
      <p>« Les queues de scorpides, on sait quoi en faire. Mais le poison de
      Sarkoth ? Même les vieux remèdes n’aiment pas ça. »</p>
    img: icons/svg/d20-black.svg
    weight: 1
    range:
      - 3
      - 3
    drawn: false
    flags:
      world:
        sarkoth:
          sourceRumorNumber: 3
          suggestedSpeakers:
            - 'un guérisseur '
            - 'un garde '
            - un ancien chasseur
          mjTruth: >-
            Partiellement vraie dans Warbound. La Horde sait fabriquer des
            antidotes contre les scorpides ordinaires. Le venin de Sarkoth est
            plus complexe et résiste mieux aux remèdes habituels.
