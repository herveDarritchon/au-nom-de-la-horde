  <p>Rumeurs de terrain : recrues, péons, chasseurs et pisteurs. 5 rumeurs à
  tirer au d5.</p><p><strong>MJ :</strong> Les rumeurs ne sont pas toutes
  exactes. Les détails de vérité et de contexte restent dans le journal «
  Rumeurs autour de Sarkoth ». Adapter leur disponibilité à l’évolution des
  événements.</p>
