    type: text
    name: Il est plus gros que les autres
    description: >-
      <p>« Si tu vois un scorpide qui te paraît gros, recule. Si tu vois
      Sarkoth, cours. »</p>
    img: icons/svg/d20-black.svg
    weight: 1
    range:
      - 1
      - 1
