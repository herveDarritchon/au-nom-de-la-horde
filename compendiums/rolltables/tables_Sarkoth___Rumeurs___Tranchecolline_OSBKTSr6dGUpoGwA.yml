  - _id: 753fe012d74078fc
    type: text
    name: Quelqu’un a déplacé son nid
    description: >-
      <p>« J’ai parlé à un péon revenu de la Vallée. Ils ont bouché une vieille
      fissure pour renforcer le chemin. Depuis, la grosse bestiole ne tient plus
      en place. »</p>
    img: icons/svg/d20-black.svg
    weight: 1
    range:
      - 4
      - 4
    drawn: false
    flags:
      world:
        sarkoth:
          sourceRumorNumber: 14
          suggestedSpeakers:
