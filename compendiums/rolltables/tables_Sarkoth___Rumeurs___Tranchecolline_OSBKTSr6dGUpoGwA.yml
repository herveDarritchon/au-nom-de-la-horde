  - _id: d756a0d6f49c1594
    type: text
    name: Son venin vaut une fortune
    description: >-
      <p>« Une fiole de venin de Sarkoth ? À Orgrimmar, un apothicaire te
      paierait ça plus cher qu’un kodo. »</p>
    img: icons/svg/d20-black.svg
    weight: 1
    range:
      - 3
      - 3
    drawn: false
    flags:
      world:
        sarkoth:
          sourceRumorNumber: 13
          suggestedSpeakers:
            - 'un marchand '
            - 'un contrebandier '
            - un aventurier qui aime embellir ses histoires
          mjTruth: >-
            Exagérée. Le venin est précieux, mais sa valeur commerciale n’est
            pas encore établie à cette époque.
