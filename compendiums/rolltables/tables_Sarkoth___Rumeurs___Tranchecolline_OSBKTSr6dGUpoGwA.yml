  - _id: d60a4eb4ca04fc31
    type: text
    name: Gornek veut sa tête
    description: >-
      <p>« On raconte que Gornek a promis une belle récompense à celui qui
      rapportera la pince de Sarkoth. »</p>
    img: icons/svg/d20-black.svg
    weight: 1
    range:
      - 2
      - 2
    drawn: false
    flags:
      world:
        sarkoth:
          sourceRumorNumber: 12
          suggestedSpeakers:
            - 'une recrue récemment arrivée '
            - 'un voyageur '
            - un garde qui répète une version simplifiée de l’histoire
          mjTruth: >-
            Fausse ou très déformée. Gornek veut surtout protéger les recrues et
            sauver Hana’zua. Il n’a pas nécessairement lancé de chasse
            officielle.
