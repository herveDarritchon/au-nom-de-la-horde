  - _id: 3b190d6a2352537d
    type: text
    name: Les Trolls veulent qu’on la laisse tranquille
    description: >-
      <p>« Les Trolls du sud disent que la vieille scorpide était là avant nous.
      Facile à dire quand elle ne dort pas devant leur porte. »</p>
    img: icons/svg/d20-black.svg
    weight: 1
    range:
      - 5
      - 5
    drawn: false
    flags:
      world:
        sarkoth:
          sourceRumorNumber: 15
          suggestedSpeakers:
            - 'un garde orc '
            - 'un péon '
            - un voyageur un peu agacé
          mjTruth: >-
            Partiellement vraie. Certains Trolls connaissent ou respectent
            Sarkoth comme une très vieille créature locale. Cela ne signifie pas
            que Sen’jin a officiellement demandé à la Horde de la protéger.
