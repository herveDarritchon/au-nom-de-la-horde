folder: yWmpx7cN5Ydiwrw9
name: 'Sarkoth — Rumeurs : Tranchecolline'
img: modules/warbound-campaign-content/assets/images/icons/tables-aleatoires/durotar/scorpides/cof2-tables-aleatoires-scorpidde-durotar.png
description: >-
  <p>Rumeurs de passage : convois, voyageurs et marchands. 5 rumeurs à tirer au
  d5.</p><p><strong>MJ :</strong> Les rumeurs ne sont pas toutes exactes. Les
  détails de vérité et de contexte restent dans le journal « Rumeurs autour de
  Sarkoth ». Adapter leur disponibilité à l’évolution des événements.</p>
results:
  - _id: 44414e4d4e6477c1
    type: text
    name: Les convois du sud changent de route
    description: >-
      <p>« Deux chariots ont pris le détour cette semaine. Les conducteurs
      disent qu’un gros scorpide coupe le passage. »</p>
    img: icons/svg/d20-black.svg
    weight: 1
    range:
      - 1
      - 1
    drawn: false
    flags:
      world:
        sarkoth:
          sourceRumorNumber: 11
          suggestedSpeakers:
            - 'un convoyeur '
            - 'un garde '
            - un marchand de l’auberge
          mjTruth: >-
            Partiellement vraie. Sarkoth s’approche davantage des zones
            fréquentées, mais elle ne cherche pas à bloquer les convois
            volontairement.
