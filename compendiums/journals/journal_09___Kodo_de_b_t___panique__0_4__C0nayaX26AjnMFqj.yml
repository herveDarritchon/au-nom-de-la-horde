    sort: 200000
    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Annexe Warbound — Kolkar et kodo, restitution des échanges des 3 et 7 novembre 2026</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h2>Conduite du kodo : ce qui est autorisé</h2>\n<p><strong>[ACQUIS — principe narratif]</strong> Le kodo peut sursauter, tirer sur ses sangles ou chercher à s’écarter d’un danger. Les PJ doivent pouvoir agir <strong>avant</strong> qu’une perte irréversible survienne. Le sens exact d’une éventuelle fuite, ses dégâts et les renversements doivent être déterminés à la table, pas imposés par une mécanique non validée.</p>\n<p><strong>[PROPOSITION]</strong> Gurok ou un autre PJ consacre une action à rassurer ou maîtriser la bête ; un test réussi pourrait réduire la panique de <strong>1 point</strong>. <strong>Le coût exact, la caractéristique, le DD et la possibilité de répéter cette manœuvre restent à définir.</strong></p>\n<h3>Ce que le MJ suit concrètement</h3>\n<ol><li>Décrire le stimulus : distance, violence, blessures, bruit, projectiles.</li><li>Décider si la scène exige un test ; annoncer que le barème est encore proposé, sans le transformer en règle canonique.</li><li>Noter le résultat réellement retenu dans @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{la jauge vivante} ; la macro n’automatise aucun jet et ne décide pas de fuite.</li><li>Permettre aux PJ de protéger la bête et les sacs, d’apaiser, de se dégager, de retenir un compagnon, selon la fiction et les actions COF2.</li><li>Consigner les conséquences avérées : blessure, perte de sac, détour, temps de réarrimage, puis @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{retard}.</li></ol>\n<p><strong>Ne pas confondre :</strong> panique de la bête et état préjudiciable officiel COF2 ; kodo de bât et kodo attelé à un chariot ; variation de jauge et dégâts automatiques. Aucune attaque de piétinement chiffrée n’est validée.</p>\n<p>@UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Déclencheurs} · @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.ZvRQjvSnNoUwN1YH]{Mémento} · @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Jauge, déclencheurs et statut}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Panique vivante — macro MJ} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p>"
