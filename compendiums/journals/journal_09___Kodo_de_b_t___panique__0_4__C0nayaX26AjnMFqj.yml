      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Annexe Warbound — Kolkar et kodo, restitution des échanges des 3 et 7 novembre 2026</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h2>Le kodo de Gurok : panique progressive</h2>\n<p><strong>[ACQUIS]</strong> C’est un <strong>kodo de bât, sans charrette, non dressé au combat</strong>, conduit par <strong>Gurok</strong>. La panique est progressive, en réaction aux faits observables. <strong>Jauge Warbound de quatre points (0–4)</strong> : mécanisme de scénario, pas un état officiel COF2.</p>\n<p><strong>Limite des décisions récupérées :</strong> les effets détaillés des paliers 1, 2, 3, 4, le seuil d’emballement, la durée et les dégâts éventuels ne sont <strong>pas verrouillés</strong>. L’ancien modèle 0–6 a été écarté ; ne pas en reprendre les seuils.</p>\n<h3>Déclencheurs évoqués — valeurs NON validées</h3>\n<table style=\"width:100%;border-collapse:collapse\"><thead><tr><th>Situation</th><th>DD <em>proposé</em></th><th>État de la décision</th></tr></thead><tbody>\n<tr><td>Cris, bruit, flèche proche</td><td>10</td><td>[PROPOSITION]</td></tr>\n<tr><td>Combat au contact du kodo</td><td>15</td><td>[PROPOSITION]</td></tr>\n<tr><td>Explosion, magie, choc violent proche</td><td>20</td><td>[PROPOSITION]</td></tr>\n<tr><td>Kodo directement blessé</td><td>25</td><td>[PROPOSITION]</td></tr></tbody></table>\n<p><strong>[PROPOSITION]</strong> Tester uniquement sur événement significatif, pas à chaque round. Réussite = pas de montée ; échec = montée à déterminer selon la gravité. Les incréments +1/+2/+3 ont été évoqués, <strong>sans barème final approuvé</strong>.</p>\n<p>@UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.LOcdmBycO3NqJCkw]{Conduite &amp; apaisement} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Compteur de panique} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan}.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.LOcdmBycO3NqJCkw]{Conduite, apaisement et suites}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Panique vivante — macro MJ} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p>"
