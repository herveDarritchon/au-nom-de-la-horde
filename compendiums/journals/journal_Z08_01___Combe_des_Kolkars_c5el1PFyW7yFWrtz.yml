        <h1>PNJ — Khurdan le Fier</h1>
            <p><strong>ID :</strong> PNJ-Z08-01-01 · <strong>POI :</strong> Z08-01 · <strong>Zone :</strong> Z08</p>
            <p><strong>Origine / statut :</strong> Original Warbound — chef local non nommé dans Classic</p>
            <p><strong>Fonction :</strong> Chef de bande Kolkar contrôlant un accès de combe · <strong>Faction / allégeance réelle (MJ) :</strong> Kolkar</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Obtenir le contrôle d’un passage utile vers Sen’jin.</td></tr><tr><th>Motivation profonde</th><td>Il doit nourrir ses cavaliers et conserver son prestige.</td></tr><tr><th>Obstacle</th><td>Son camp ne peut tenir un siège prolongé.</td></tr>
              <tr><th>Ligne rouge</th><td>Reconnaître que Sen’jin lui dicte une frontière sans concession.</td></tr><tr><th>Peut offrir</th><td>Répit, droit de passage conditionnel, information sur des mouvements de cavaliers.</td></tr><tr><th>En échange</th><td>Eau, retrait d’un guetteur adverse ou échange équitable.</td></tr>
              <tr><th>Attitude initiale</th><td>Confiant, impatient devant les hésitations.</td></tr><tr><th>S'il n'arrive rien</th><td>Teste la défense d’une autre piste.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Harnachement orné de bandes rouges délavées.</p><p><strong>Voix et comportement :</strong> Marque un petit cercle dans la poussière avec un sabot.</p><p><strong>Signe émotionnel :</strong> Sa crinière se hérisse lorsqu’on met en cause son autorité.</p>
            <blockquote><p><strong>Première réplique :</strong> « Une piste appartient à ceux qui savent la tenir. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Que donnez-vous pour traverser sans sang ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Ses éclaireurs occupent des points de vue et surveillent des passages.</td></tr><tr><th>Après échange, aide ou observation</th><td>Il peut révéler qu’un ravitaillement inhabituel lui parvient parfois.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>MJ : il reçoit une aide opportuniste liée à Zalazane, sans se considérer son serviteur ; ne nommer Zalazane qu’avec preuve ou confession motivée.</td></tr><tr><th>Il demande</th><td>Eau, retrait d’un guetteur adverse ou échange équitable.</td></tr>
              <tr><th>Il peut proposer</th><td>Répit, droit de passage conditionnel, information sur des mouvements de cavaliers.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Reconnaître que Sen’jin lui dicte une frontière sans concession.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Tolère un passage limité et évite un affrontement coûteux.</td></tr><tr><th>S'ils négocient</th><td>Accepte une transaction temporaire avec un témoin Kolkar.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Envoie un défi ou prépare une interception, pas forcément une charge suicidaire.</td></tr><tr><th>S'ils l'ignorent</th><td>Teste la défense d’une autre piste.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z08-01. <strong>Relations / autres lieux :</strong> Nom original ; ne remplace pas rétroactivement les trois chefs non nommés du matériau Classic.</p>
