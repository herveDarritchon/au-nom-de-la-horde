      content: |-
        <h1>PNJ — Vezha Trace-Sèche</h1>
            <p><strong>ID :</strong> PNJ-Z08-01-02 · <strong>POI :</strong> Z08-01 · <strong>Zone :</strong> Z08</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Éclaireuse Kolkar cherchant une sortie honorable · <strong>Faction / allégeance réelle (MJ) :</strong> Kolkar — sous l’autorité de Khurdan, loyauté conditionnelle</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Éviter la mort de jeunes cavaliers dans un raid trop ambitieux.</td></tr><tr><th>Motivation profonde</th><td>La survie de sa bande compte plus que les discours des chefs.</td></tr><tr><th>Obstacle</th><td>Elle ne peut s’opposer publiquement à un ordre.</td></tr>
              <tr><th>Ligne rouge</th><td>Trahir l’emplacement des familles de son clan.</td></tr><tr><th>Peut offrir</th><td>Observation de patrouilles, avertissement discret, rencontre neutre.</td></tr><tr><th>En échange</th><td>Assurance que les PJ n’attaqueront pas les familles ou les blessés.</td></tr>
              <tr><th>Attitude initiale</th><td>Froide, toujours prête au départ.</td></tr><tr><th>S'il n'arrive rien</th><td>Le raid part avant qu’une solution négociée n’émerge.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Ficelles de repérage nouées à sa lance.</p><p><strong>Voix et comportement :</strong> Ne répond jamais deux fois à la même question.</p><p><strong>Signe émotionnel :</strong> Garde un sabot légèrement orienté vers la sortie.</p>
            <blockquote><p><strong>Première réplique :</strong> « Regardez où nos jeunes ne veulent plus aller. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Pouvez-vous négocier sans nous humilier ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Une bande contourne régulièrement une route pourtant plus courte.</td></tr><tr><th>Après échange, aide ou observation</th><td>Raconte que certains vivres apparaissent sans explication claire.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ignore l’identité de l’appui de Zalazane ; peut soupçonner une transaction extérieure.</td></tr><tr><th>Il demande</th><td>Assurance que les PJ n’attaqueront pas les familles ou les blessés.</td></tr>
              <tr><th>Il peut proposer</th><td>Observation de patrouilles, avertissement discret, rencontre neutre.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Trahir l’emplacement des familles de son clan.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Offre un délai avant un raid ou un chemin d’observation.</td></tr><tr><th>S'ils négocient</th><td>Accepte une négociation au nom d’une partie des cavaliers.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Se retire et prévient le camp d’une intrusion armée.</td></tr><tr><th>S'ils l'ignorent</th><td>Le raid part avant qu’une solution négociée n’émerge.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z08-01. <strong>Relations / autres lieux :</strong> Ne pas en faire automatiquement une alliée pro-Horde.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z08/Z07 : une fenêtre diplomatique existe ou se referme.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
