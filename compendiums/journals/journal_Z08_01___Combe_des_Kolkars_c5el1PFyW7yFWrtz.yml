        <h1>Combe des Kolkars</h1>

        <p><strong>Identifiant :</strong> Z08-01</p>

        <p><strong>Zone géographique :</strong> Z08 — Combe des Kolkars et
        pistes du sud-ouest</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Zone
        d'influence</p>

        <h2>Fonction dans la campagne</h2>

        <p>Secteur de présence territoriale des centaures Kolkar.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Zone d’influence liée au nœud
        [2] ; extension possible.</p>

        <p><strong>Repère géographique :</strong> Pistes de cavaliers et
        itinéraires d’incursion menaçant les approches de Sen’jin.</p>

        <p><strong>Factions et influences :</strong> Kolkar ; Zalazane (soutien
        clandestin, sans commandement des centaures).</p>

        <p><strong>Références et réserves :</strong> [FAC] [CLASSIC]</p>

        <p><em>Cette zone n’ajoute pas automatiquement un septième nœud
        principal au pointcrawl.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
