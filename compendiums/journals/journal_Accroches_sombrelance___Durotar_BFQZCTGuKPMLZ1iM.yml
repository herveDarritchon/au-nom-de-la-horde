  - name: La dette de Sen’jin
    type: text
    sort: 400000
    text:
      content: >-
        <h2>La dette de Sen’jin</h2>

        <h3>Situation</h3>

        <p>Un ancien guerrier affirme que son père avait promis assistance à une
        famille désormais coincée sur les Îles.</p>

        <p>La promesse n’a aucune force officielle.</p>

        <p>Pour lui, cela ne change rien.</p>

        <h3>Qui ?</h3>

        <p><strong>L’ancien guerrier</strong> veut honorer la parole
        familiale.</p>

        <p><strong>Ses proches</strong> craignent qu’il se lance lui-même dans
        une expédition impossible.</p>

        <p><strong>La famille des Îles</strong> peut encore être vivante,
        dispersée ou sous emprise.</p>

        <p><strong>Les anciens de Sen’jin</strong> ne sont pas nécessairement
        d’accord sur ce que vaut aujourd’hui cette promesse.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>La dette est authentique mais ancienne.</p>

        <p>Elle peut porter sur une personne, une urne, un masque, une arme
        familiale ou la simple obligation de vérifier ce qu’est devenue la
        famille concernée.</p>

        <h3>Quand ?</h3>

        <p>L’ancien agit maintenant parce qu’un récent témoignage laisse penser
        que quelqu’un de cette famille est encore vivant.</p>

        <h3>Où ?</h3>

        <p>Sen’jin pour les témoignages.</p>

        <p>Les Îles de l’Écho pour la vérification éventuelle.</p>

        <h3>Pourquoi ?</h3>

        <p>Pour l’ancien, la construction d’un nouveau foyer ne permet pas
        d’effacer les obligations contractées avant l’exil.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ entendent une dispute familiale.</li><li>L’ancien cherche
        une embarcation plutôt que des aventuriers.</li><li>Un pêcheur affirme
        avoir reconnu un symbole familial sur une île.</li></ul>

        <h3>Approches possibles</h3>

        <p>Vérifier d’abord les témoignages, accompagner l’ancien, convaincre
        quelqu’un d’autre de prendre la relève, établir un contact depuis la
        côte ou considérer que la dette ne concerne pas les PJ.</p>

        <h3>Complication</h3>

        <p>Les personnes recherchées peuvent ne pas vouloir être « sauvées »
        immédiatement.</p>

        <p>Elles peuvent protéger d’autres captifs et refuser de partir tant
        qu’ils ne le peuvent pas eux aussi.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>L’ancien finit par trouver quelques jeunes volontaires et tente
        l’expédition avec des moyens insuffisants.</p>

        <h3>Conséquences possibles</h3>

        <p>La dette peut être honorée autrement que prévu, transmise à une
        nouvelle génération, considérée comme accomplie par un simple témoignage
        ou transformer une famille de Sen’jin en alliée durable des PJ.</p>
      format: 1
