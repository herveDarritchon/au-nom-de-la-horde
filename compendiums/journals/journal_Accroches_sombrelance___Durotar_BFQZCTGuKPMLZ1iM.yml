  - name: Le masque sans famille
    type: text
    sort: 1700000
    text:
      content: >-
        <h2>Le masque sans famille</h2>

        <h3>Situation</h3>

        <p>Un masque funéraire disparaît d’une habitation de Sen’jin.</p>

        <p>Étrangement, la famille concernée refuse de signaler officiellement
        le vol.</p>

        <h3>Qui ?</h3>

        <p><strong>La famille</strong> veut récupérer l’objet sans révéler
        certains détails.</p>

        <p><strong>Le voleur éventuel</strong> poursuit un objectif encore
        inconnu.</p>

        <p><strong>Les voisins</strong> transforment le silence en rumeurs.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Le masque a réellement disparu.</p>

        <p>Le silence de la famille peut venir d’un conflit d’héritage, de
        l’identité du défunt ou du fait qu’un membre de la famille a lui-même
        pris l’objet.</p>

        <h3>Quand ?</h3>

        <p>La disparition a été constatée récemment.</p>

        <p>Chaque jour augmente la probabilité que quelqu’un vende, cache ou
        utilise l’objet ailleurs.</p>

        <h3>Où ?</h3>

        <p>Sen’jin d’abord.</p>

        <p>La piste peut rester entièrement locale.</p>

        <h3>Pourquoi ?</h3>

        <p>Le masque possède surtout une valeur familiale et rituelle.</p>

        <p>Rendre l’affaire publique obligerait peut-être la famille à expliquer
        quelque chose qu’elle préfère garder privé.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ entendent parler de la disparition.</li><li>Un membre
        plus jeune de la famille les approche sans prévenir ses
        anciens.</li><li>Ils voient quelqu’un tenter de transporter discrètement
        l’objet.</li></ul>

        <h3>Approches possibles</h3>

        <p>Enquête discrète, médiation familiale, surveillance, confrontation ou
        refus de s’impliquer dans une affaire privée.</p>

        <h3>Complication</h3>

        <p>Le masque n’a peut-être jamais appartenu légalement ou
        traditionnellement à la branche de la famille qui le conservait.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>La famille règle probablement l’affaire elle-même.</p>

        <p>La résolution peut cependant laisser une rancœur durable.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent gagner la confiance d’une famille, révéler un conflit
        d’héritage, restaurer un objet à son propriétaire légitime ou découvrir
        qu’aucun crime n’a réellement été commis.</p>
      format: 1
