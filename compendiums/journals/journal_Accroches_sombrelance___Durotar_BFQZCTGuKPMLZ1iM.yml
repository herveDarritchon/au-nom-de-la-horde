  - name: Contexte
    type: text
    sort: 0
    text:
      content: >-
        <h1>Accroches sombrelance — Durotar</h1>

        <h2>En bref</h2>

        <p>Les Sombrelance constituent une couche vivante du sandbox de Durotar
        plutôt qu’une campagne secondaire isolée. Sen’jin est relié
        naturellement aux Îles de l’Écho, aux routes côtières, aux ressources
        rares du sud, aux Kolkar et aux autres communautés de la Horde. Les
        situations proposées ici doivent pouvoir apparaître pendant que les PJ
        poursuivent d’autres objectifs et continuer d’évoluer s’ils les
        ignorent. :chatgpt-content-reference{index="0"}</p>

        <p>Le principal noyau narratif disponible dans les sources concerne
        Zalazane, les Sombrelance sous emprise et la relation inachevée de la
        communauté avec les Îles de l’Écho. Autour de ce noyau s’ajoutent des
        problèmes beaucoup plus ordinaires : eau, chasse, familles, dettes,
        voyageurs, traditions, relations avec les Orcs ou mémoire de
        Strangleronce. :chatgpt-content-reference{index="1"}</p>

        <h2>Identité</h2>

        <p>Sen’jin raconte une autre facette du thème central de Durotar.</p>

        <p>À Razor Hill, la Horde bâtit une nouvelle terre.</p>

        <p>À Sen’jin, les Sombrelance bâtissent également cette nouvelle terre
        alors que leur ancien foyer proche reste en partie inaccessible.</p>

        <p>Cette tension permet de faire exister simultanément :</p>

        <ul><li>l’appartenance à la Horde ;</li><li>les priorités particulières
        des Sombrelance ;</li><li>la mémoire des exils ;</li><li>la pression de
        Zalazane ;</li><li>les traditions spirituelles ;</li><li>la nécessité
        très concrète de vivre dans une région pauvre.</li></ul>

        <h2>Histoire utile</h2>

        <p>Les éléments nécessaires pour jouer ces accroches sont simples :</p>

        <ul><li>Sen’jin constitue l’ancrage sombrelance du sud de Durotar
        ;</li><li>les Îles de l’Écho restent liées à Zalazane ;</li><li>certains
        trolls sous son contrôle ne sont pas des adversaires volontaires
        ;</li><li>la pression Kolkar menace également les ressources et les
        routes du sud ;</li><li>les Sombrelance portent avec eux une histoire
        plus ancienne liée aux terres trolls de l’est.</li></ul>

        <p>Il n’est pas nécessaire de transformer tous ces éléments en une même
        intrigue.</p>

        <h2>Territoire et lieux importants</h2>

        <p><strong>Sen’jin</strong> sert de hub social et de point de
        retour.</p>

        <p><strong>Les Îles de l’Écho</strong> offrent exploration,
        infiltration, sauvetage et situations liées à Zalazane.</p>

        <p><strong>La côte sud</strong> permet de faire entrer pêcheurs, épaves,
        étrangers et relations avec Tiragarde.</p>

        <p><strong>Les pistes de chasse</strong> mettent en jeu Kolkar,
        ressources et sanctuaires.</p>

        <p><strong>Razor Hill</strong> reste suffisamment proche pour que les
        choix faits au sud puissent affecter les relations avec les Orcs et la
        logistique de la Horde.</p>

        <h2>Population et organisation</h2>

        <p>Les accroches utilisent surtout des rôles plutôt qu’une multitude de
        PNJ nommés :</p>

        <ul><li>anciens ;</li><li>pêcheurs ;</li><li>chasseurs
        ;</li><li>familles de disparus ;</li><li>jeunes volontaires
        ;</li><li>chamans et gardiens de sanctuaires ;</li><li>patrouilles de la
        Horde ;</li><li>voyageurs ;</li><li>étrangers trolls ;</li><li>habitants
        de Razor Hill.</li></ul>

        <p>Un nom n’est nécessaire que lorsqu’un personnage devient réellement
        important à la table.</p>

        <h2>Personnalités importantes</h2>

        <p><strong>Vol’jin — figure majeure des Sombrelance —</strong> son
        autorité ou son nom peuvent être invoqués par d’autres, y compris sans
        qu’il ait personnellement donné d’ordre.</p>

        <p><strong>Zalazane — menace des Îles de l’Écho —</strong> son influence
        crée des captifs, des peurs et des divisions sans devoir expliquer tous
        les problèmes du sud.</p>

        <p><strong>Maître Gadrin — figure de savoir —</strong> ses recherches
        peuvent ouvrir des perspectives au-delà de Durotar.</p>

        <p><strong>Minshina — figure liée aux traditions et à l’arc des Îles
        —</strong> son souvenir et les objets qui lui sont associés peuvent
        servir de point d’entrée vers l’histoire de Zalazane.</p>

        <h2>Relations</h2>

        <p>Les Sombrelance et les Orcs appartiennent au même ensemble politique,
        mais cela n’efface pas les conflits pratiques.</p>

        <p>Une ressource rare peut être disputée.</p>

        <p>Une priorité militaire peut être différente.</p>

        <p>Une tradition peut être mal comprise.</p>

        <p>Ces désaccords doivent rester des situations concrètes plutôt qu’une
        hostilité artificielle entre peuples.</p>

        <p>Les Kolkar représentent une pression indépendante de Zalazane.</p>

        <p>Les trolls venus de Strangleronce peuvent réveiller des identités et
        obligations antérieures à la Horde.</p>

        <h2>Tensions actuelles</h2>

        <p>Les accroches reposent principalement sur :</p>

        <ul><li>le sort des captifs de Zalazane ;</li><li>l’impatience face à
        l’inaction autour des Îles ;</li><li>les ressources limitées
        ;</li><li>la pression Kolkar ;</li><li>les traditions spirituelles
        ;</li><li>les familles séparées ;</li><li>les visiteurs étrangers
        ;</li><li>la mémoire de Strangleronce ;</li><li>l’équilibre entre
        nouveau foyer et ancien héritage.</li></ul>

        <h2>Secrets et zones d’ombre</h2>

        <h3>Canon / établi dans les sources fournies</h3>

        <p>Le matériau fourni établit l’existence de Zalazane, de Sombrelance
        placés sous son emprise, de la pression Kolkar et de l’importance de
        Sen’jin et des Îles de l’Écho dans le sud de Durotar.</p>

        <h3>Déduction raisonnable</h3>

        <p>Une communauté confrontée à des proches captifs, à un territoire
        difficile et à plusieurs exils peut produire :</p>

        <ul><li>volontaires impatients ;</li><li>familles divisées
        ;</li><li>débats sur le retour ;</li><li>conflits sur les ressources
        ;</li><li>obligations anciennes ;</li><li>récits et traditions
        contradictoires.</li></ul>

        <h3>Adaptation de campagne</h3>

        <p>Les situations précises ci-dessous — prisonnier étranger, sanctuaire
        déplacé, bateau échoué, point d’eau contesté, expéditions clandestines,
        survivants cachés ou phénomènes spirituels — sont des créations
        destinées à produire du jeu.</p>

        <h2>Ce qu’un voyageur remarque</h2>

        <ul><li>Les Îles restent toujours présentes à l’horizon de
        Sen’jin.</li><li>Les pêcheurs regardent la mer autant que leurs
        filets.</li><li>Les jeunes parlent plus facilement de reprendre les Îles
        que les anciens.</li><li>Les chasseurs connaissent précisément les
        points d’eau et leurs usages.</li><li>Certaines conversations sur
        Zalazane deviennent brusquement personnelles.</li><li>Les rites et
        petits sanctuaires existent au milieu des activités
        quotidiennes.</li><li>Les Orcs et les Trolls coopèrent constamment sans
        nécessairement partager toutes les mêmes priorités.</li><li>Les
        histoires venues de Strangleronce attirent immédiatement l’attention de
        certains Sombrelance.</li></ul>
      format: 1
