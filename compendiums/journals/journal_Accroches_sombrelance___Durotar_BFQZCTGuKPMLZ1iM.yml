  - name: Quelque chose change sous la terre
    type: text
    sort: 2000000
    text:
      content: >-
        <h2>Quelque chose change sous la terre</h2>

        <h3>Situation</h3>

        <p>Des Sombrelance habitués aux rites et aux signes naturels rapportent
        plusieurs anomalies difficiles à expliquer.</p>

        <p>Elles semblent devenir plus nettes lorsqu’on se dirige vers le
        nord.</p>

        <h3>Qui ?</h3>

        <p><strong>Les observateurs sombrelance</strong> veulent comprendre
        avant de tirer des conclusions.</p>

        <p><strong>Les ouvriers et responsables de la Horde</strong> peuvent
        considérer ces inquiétudes comme trop vagues.</p>

        <p><strong>D’autres habitants</strong> relient immédiatement le
        phénomène aux travaux menés plus au nord.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Cette situation constitue un lien extrêmement léger avec le fil rouge
        de Ragefire.</p>

        <p>Les signes peuvent inclure :</p>

        <ul><li>vibrations inhabituelles ;</li><li>chaleur souterraine
        ;</li><li>comportements animaux modifiés ;</li><li>réactions
        spirituelles difficiles à interpréter.</li></ul>

        <p>Ils ne révèlent pas encore la cause.</p>

        <h3>Quand ?</h3>

        <p>Les phénomènes existaient peut-être auparavant, mais leur répétition
        commence seulement à produire un motif identifiable.</p>

        <h3>Où ?</h3>

        <p>Plusieurs points de Durotar, avec une intensité ou une fréquence qui
        semble augmenter vers le nord.</p>

        <h3>Pourquoi ?</h3>

        <p>Les travaux et excavations constituent une explication plausible mais
        encore non démontrée.</p>

        <p>Il est également possible que certains phénomènes n’aient aucun
        rapport entre eux.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Un chaman ou un chasseur mentionne une observation.</li><li>Les
        PJ ressentent eux-mêmes une vibration pendant une autre
        aventure.</li><li>Deux témoins décrivent séparément le même
        phénomène.</li></ul>

        <h3>Approches possibles</h3>

        <p>Comparer les lieux, cartographier les occurrences, interroger
        ouvriers et chasseurs, inspecter le terrain, ignorer pour l’instant ou
        conserver simplement l’information.</p>

        <h3>Complication</h3>

        <p>Une partie des témoignages est faussement reliée au phénomène.</p>

        <p>Durotar possède déjà ses propres dangers naturels et tout n’est pas
        nécessairement le signe d’une seule cause.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les anomalies restent d’abord mineures.</p>

        <p>Si le fil rouge progresse, elles deviennent progressivement plus
        difficiles à ignorer.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent disposer d’un avertissement précoce, se tromper de
        cause, convaincre certains responsables de surveiller les travaux ou
        simplement accumuler une information qui ne prendra son sens que
        beaucoup plus tard.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
          entryId: esprits-du-nord
          sourceHash: 484f6f1c
