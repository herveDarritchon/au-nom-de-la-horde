  - name: Le tambour des Îles
    type: text
    sort: 300000
    text:
      content: >-
        <h2>Le tambour des Îles</h2>

        <h3>Situation</h3>

        <p>Depuis trois nuits, un tambour résonne au large.</p>

        <p>Les anciens reconnaissent un ancien rythme sombrelance associé à un
        rassemblement.</p>

        <p>Quelqu’un répond depuis les environs de Sen’jin.</p>

        <h3>Qui ?</h3>

        <p><strong>Les anciens</strong> veulent comprendre qui utilise un signal
        connu.</p>

        <p><strong>La personne qui répond</strong> veut conserver son
        anonymat.</p>

        <p><strong>L’émetteur des Îles</strong> cherche manifestement à obtenir
        une réaction.</p>

        <p><strong>Les habitants</strong> projettent leurs propres espoirs et
        peurs sur les sons.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Les signaux sont réellement intentionnels.</p>

        <p>La personne de Sen’jin possède une raison personnelle de répondre :
        parent resté sur les Îles, ancien contact ou tentative discrète de
        confirmer qu’un groupe libre existe encore.</p>

        <h3>Quand ?</h3>

        <p>Le phénomène a commencé trois nuits auparavant.</p>

        <p>Le rythme est envoyé peu après la tombée de la nuit.</p>

        <h3>Où ?</h3>

        <p>Sen’jin et la côte pour la réponse.</p>

        <p>Une portion des Îles pour le signal initial.</p>

        <h3>Pourquoi ?</h3>

        <p>Le tambour permet de communiquer sans envoyer immédiatement une
        embarcation.</p>

        <p>Le secret protège également ceux qui émettent le signal.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ entendent eux-mêmes le tambour.</li><li>Un ancien leur
        explique sa signification.</li><li>Ils surprennent quelqu’un quittant
        discrètement Sen’jin avec un petit tambour.</li></ul>

        <h3>Approches possibles</h3>

        <p>Observer, répondre au signal, suivre la personne de Sen’jin,
        attendre, interroger les anciens ou tenter une traversée discrète.</p>

        <h3>Complication</h3>

        <p>Le rythme utilisé est ancien et plusieurs interprétations de sa
        signification existent.</p>

        <p>Les PJ peuvent parfaitement comprendre qu’il s’agit d’un appel sans
        savoir exactement ce que l’appel demande.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les échanges continuent quelques nuits puis cessent.</p>

        <p>Personne ne sait si l’arrêt signifie que le contact a réussi ou que
        l’émetteur a été découvert.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent établir un nouveau canal vers les Îles, exposer
        involontairement les émetteurs, apprendre l’existence de survivants ou
        simplement comprendre qu’une activité indépendante de Zalazane persiste
        là-bas.</p>
      format: 1
