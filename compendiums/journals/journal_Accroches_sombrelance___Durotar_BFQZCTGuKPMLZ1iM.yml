  - name: Les yeux des Kolkar
    type: text
    sort: 1900000
    text:
      content: >-
        <h2>Les yeux des Kolkar</h2>

        <h3>Situation</h3>

        <p>Les attaques Kolkar diminuent brusquement autour de plusieurs
        pistes.</p>

        <p>Les chasseurs n’en sont pas rassurés.</p>

        <p>Ils voient davantage d’observateurs qu’auparavant.</p>

        <h3>Qui ?</h3>

        <p><strong>Les éclaireurs Kolkar</strong> veulent comprendre les
        habitudes locales.</p>

        <p><strong>Les chasseurs sombrelance</strong> craignent qu’une attaque
        plus organisée se prépare.</p>

        <p><strong>Les gardes de la Horde</strong> peuvent interpréter
        l’accalmie comme une amélioration.</p>

        <h3>Quoi ?</h3>

        <p>Les Kolkar observent réellement les déplacements.</p>

        <p>Ils ne préparent pas nécessairement un assaut général.</p>

        <p>Ils peuvent chercher une route, une ressource mal défendue ou une
        occasion particulière.</p>

        <h3>Quand ?</h3>

        <p>Le changement de comportement date de quelques jours.</p>

        <h3>Où ?</h3>

        <p>Pistes de chasse, points d’eau et routes secondaires au sud.</p>

        <h3>Pourquoi ?</h3>

        <p>L’observation permet aux Kolkar de choisir où exercer leur pression
        plutôt que gaspiller des hommes dans des raids sans objectif.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ découvrent un observateur.</li><li>Un chasseur rapporte
        plusieurs traces identiques.</li><li>Une patrouille annonce fièrement
        que les raids diminuent, déclenchant la réaction sceptique des
        Sombrelance.</li></ul>

        <h3>Approches possibles</h3>

        <p>Contre-pistage, surveillance, capture d’un éclaireur, modification
        volontaire des habitudes, désinformation ou attente.</p>

        <h3>Complication</h3>

        <p>Les Kolkar peuvent s’intéresser à une ressource dont les Sombrelance
        eux-mêmes ignorent encore l’importance.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les Kolkar finissent par identifier une faiblesse exploitable.</p>

        <p>Le prochain incident sera plus ciblé que les précédents.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent anticiper une attaque, découvrir la véritable cible,
        créer une fausse piste ou provoquer une escalade en attaquant des
        observateurs qui n’avaient encore reçu aucun ordre offensif.</p>
      format: 1
