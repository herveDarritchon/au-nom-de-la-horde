  - name: Une île pour les vivants
    type: text
    sort: 1600000
    text:
      content: >-
        <h2>Une île pour les vivants</h2>

        <h3>Situation</h3>

        <p>Plusieurs Sombrelance proposent un projet limité : ne pas reprendre
        toutes les Îles de l’Écho, mais seulement une petite île
        périphérique.</p>

        <p>Ils veulent en faire un refuge et un poste d’observation.</p>

        <h3>Qui ?</h3>

        <p><strong>Les promoteurs du projet</strong> veulent créer une présence
        permanente.</p>

        <p><strong>Les prudents</strong> craignent de provoquer Zalazane.</p>

        <p><strong>Les familles de captifs</strong> voient immédiatement l’île
        comme une base possible pour de futurs sauvetages.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>L’idée est réaliste mais exige de comprendre qui occupe réellement
        l’île, comment y débarquer et si elle peut être approvisionnée.</p>

        <h3>Quand ?</h3>

        <p>Une récente observation laisse penser que l’île est moins occupée
        qu’auparavant.</p>

        <p>Cette occasion peut ne pas durer.</p>

        <h3>Où ?</h3>

        <p>Une petite île périphérique de l’archipel.</p>

        <p>Sen’jin fournit les personnes et ressources nécessaires.</p>

        <h3>Pourquoi ?</h3>

        <p>Un objectif limité paraît plus atteignable qu’une reconquête
        générale.</p>

        <p>Le projet transforme également la géographie du sandbox si les
        Sombrelance réussissent.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Le projet est discuté publiquement à Sen’jin.</li><li>Des
        éclaireurs recherchent des informations.</li><li>Une famille propose une
        pirogue en échange d’une place sur la future île.</li></ul>

        <h3>Approches possibles</h3>

        <p>Reconnaître le terrain, négocier avec ses occupants, débarquer
        discrètement, créer un accord avec des survivants locaux, repousser une
        menace ou conseiller d’abandonner le projet.</p>

        <h3>Complication</h3>

        <p>L’île n’est pas vide.</p>

        <p>Quelques Sombrelance sous emprise y vivent également, rendant toute
        prise par la force beaucoup plus problématique.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le projet peut attendre, être tenté avec des moyens limités ou être
        abandonné après une nouvelle observation inquiétante.</p>

        <h3>Conséquences possibles</h3>

        <p>Une réussite crée un nouveau nœud de pointcrawl, raccourcit les
        futures incursions et change concrètement l’équilibre autour des Îles.
        Un échec peut rendre Zalazane plus attentif sans supprimer
        définitivement l’idée.</p>
      format: 1
