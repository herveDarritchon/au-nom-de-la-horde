  - name: Le mauvais prisonnier
    type: text
    sort: 500000
    text:
      content: >-
        <h2>Le mauvais prisonnier</h2>

        <h3>Situation</h3>

        <p>Une patrouille de la Horde capture un troll inconnu près de la
        frontière sud.</p>

        <p>Il n’est pas Sombrelance.</p>

        <p>Ses marques évoquent les tribus de Strangleronce.</p>

        <h3>Qui ?</h3>

        <p><strong>Le prisonnier</strong> veut éviter d’être exécuté avant
        d’avoir expliqué pourquoi il est venu.</p>

        <p><strong>Les gardes</strong> veulent savoir s’il s’agit d’un
        espion.</p>

        <p><strong>Les Sombrelance</strong> reconnaissent que son identité
        tribale change la nature de l’affaire.</p>

        <p><strong>Certains habitants</strong> préféreraient ne pas réveiller de
        vieilles histoires de Strangleronce.</p>

        <h3>Quoi ?</h3>

        <p>La source ne fixe pas son identité.</p>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Il peut être messager, naufragé, exilé, pèlerin, mercenaire ou
        individu venu spécifiquement chercher quelqu’un.</p>

        <p>Sa présence doit avoir une raison compréhensible, pas annoncer
        automatiquement une invasion.</p>

        <h3>Quand ?</h3>

        <p>Il vient d’être capturé.</p>

        <p>Le temps joue surtout contre lui parce qu’une décision peut être
        prise avant que quelqu’un comprenne ses marques.</p>

        <h3>Où ?</h3>

        <p>Route du sud, poste de garde puis éventuellement Sen’jin.</p>

        <h3>Pourquoi ?</h3>

        <p>La patrouille voit un étranger armé.</p>

        <p>Les Sombrelance voient une personne portant une histoire culturelle
        identifiable.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ croisent la patrouille.</li><li>On leur demande s’ils
        connaissent quelqu’un capable d’identifier les marques
        tribales.</li><li>Le prisonnier reconnaît un Sombrelance et l’appelle
        par un ancien titre.</li></ul>

        <h3>Approches possibles</h3>

        <p>Interroger, vérifier son trajet, contacter des anciens, le libérer
        sous surveillance, le considérer comme ennemi ou attendre que la Horde
        tranche.</p>

        <h3>Complication</h3>

        <p>Le prisonnier dit vrai sur son identité mais ment sur la personne
        qu’il cherche.</p>

        <p>Il sait que donner immédiatement le véritable nom rendrait son
        objectif impossible.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>La Horde prend une décision pragmatique selon les informations dont
        elle dispose.</p>

        <p>Le prisonnier peut être transféré, détenu ou expulsé.</p>

        <h3>Conséquences possibles</h3>

        <p>La situation peut ouvrir un contact vers Strangleronce, réveiller une
        ancienne dette, créer un conflit personnel ou ne produire qu’une
        rencontre révélant que tous les trolls étrangers ne constituent pas une
        menace collective.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
          entryId: mauvais-prisonnier
          sourceHash: 584bccc0
