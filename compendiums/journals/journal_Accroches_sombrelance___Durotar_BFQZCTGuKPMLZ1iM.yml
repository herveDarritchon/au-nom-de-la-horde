  - name: Le bateau de Tiragarde
    type: text
    sort: 1000000
    text:
      content: >-
        <h2>Le bateau de Tiragarde</h2>

        <h3>Situation</h3>

        <p>Des pêcheurs sombrelance découvrent une embarcation humaine échouée
        au sud.</p>

        <p>À bord : un blessé, des vivres, une carte et un objet que les
        pêcheurs affirment reconnaître comme appartenant aux leurs.</p>

        <h3>Qui ?</h3>

        <p><strong>Le survivant humain</strong> veut être soigné et repartir
        vivant.</p>

        <p><strong>Les pêcheurs</strong> veulent récupérer l’objet.</p>

        <p><strong>Les autorités de la Horde</strong> peuvent s’intéresser à la
        carte et à l’origine du bateau.</p>

        <h3>Quoi ?</h3>

        <p>Le survivant affirme ne pas avoir volé l’objet.</p>

        <p>Il peut dire vrai.</p>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Il a pu l’acheter, le recevoir d’un tiers, le trouver dans une épave
        ou ignorer complètement son origine.</p>

        <h3>Quand ?</h3>

        <p>Le bateau s’est échoué récemment.</p>

        <p>L’état du blessé impose une décision plus rapide que l’enquête sur
        l’objet.</p>

        <h3>Où ?</h3>

        <p>Côte sud de Durotar.</p>

        <p>La carte peut éventuellement renvoyer vers Tiragarde ou vers un autre
        point côtier.</p>

        <h3>Pourquoi ?</h3>

        <p>Les pêcheurs reconnaissent quelque chose possédant une valeur
        culturelle que le survivant ne comprend peut-être pas.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ accompagnent les pêcheurs.</li><li>Le survivant est amené
        à Sen’jin.</li><li>Une patrouille de la Horde arrive avant que les
        pêcheurs aient décidé quoi faire.</li></ul>

        <h3>Approches possibles</h3>

        <p>Soigner d’abord, interroger, examiner la carte, rechercher la
        provenance de l’objet, restituer l’objet sans autre enquête ou retenir
        le survivant.</p>

        <h3>Complication</h3>

        <p>La carte possède une importance militaire sans que le survivant
        lui-même soit un soldat ou un espion.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les pêcheurs récupèrent probablement l’objet et les autorités de la
        Horde prennent en charge l’humain.</p>

        <p>Les deux affaires deviennent alors séparées.</p>

        <h3>Conséquences possibles</h3>

        <p>La situation peut améliorer ou dégrader les relations locales avec
        des humains, fournir une information sur Tiragarde, révéler un trafic ou
        simplement montrer qu’un objet volé peut changer plusieurs fois de mains
        avant d’être retrouvé.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
