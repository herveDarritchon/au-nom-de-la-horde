  - name: Le sanctuaire vide
    type: text
    sort: 600000
    text:
      content: >-
        <h2>Le sanctuaire vide</h2>

        <h3>Situation</h3>

        <p>Un petit sanctuaire fréquenté par les chasseurs sombrelance a été
        entièrement débarrassé de ses offrandes.</p>

        <p>Même les coquillages, os gravés et objets sans valeur ont
        disparu.</p>

        <h3>Qui ?</h3>

        <p><strong>Les chasseurs</strong> veulent savoir qui a profané le
        lieu.</p>

        <p><strong>Le gardien du sanctuaire</strong> évite les questions.</p>

        <p><strong>Des habitants</strong> accusent déjà les Kolkar, des Orcs ou
        les hommes de Zalazane.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Le gardien a lui-même déplacé les offrandes.</p>

        <p>Il estime que le loa auquel elles étaient destinées ne répond plus
        correctement à cet endroit.</p>

        <p>Il n’est cependant pas certain de comprendre la cause.</p>

        <h3>Quand ?</h3>

        <p>Les objets ont été déplacés récemment.</p>

        <p>Le gardien comptait agir discrètement mais quelqu’un a découvert le
        sanctuaire vide avant qu’il puisse expliquer sa décision.</p>

        <h3>Où ?</h3>

        <p>Sur une piste de chasse à proximité de Sen’jin.</p>

        <p>Le gardien a caché les offrandes dans un autre lieu qu’il considère
        plus approprié.</p>

        <h3>Pourquoi ?</h3>

        <p>Il veut protéger une pratique qu’il juge devenue incorrecte.</p>

        <p>Les autres habitants interprètent son silence comme la preuve qu’un
        ennemi a agi.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ entendent les premières accusations.</li><li>Ils
        découvrent eux-mêmes le sanctuaire.</li><li>Un chasseur demande
        simplement s’ils ont vu quelqu’un transporter des objets
        rituels.</li></ul>

        <h3>Approches possibles</h3>

        <p>Chercher les traces, parler au gardien, surveiller le lieu, examiner
        d’autres sanctuaires ou laisser les Sombrelance régler leur propre
        affaire.</p>

        <h3>Complication</h3>

        <p>Un second sanctuaire montre effectivement un phénomène
        inhabituel.</p>

        <p>Le gardien n’a donc peut-être pas raison sur l’explication, mais il
        n’a pas entièrement tort sur le problème.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les accusations se renforcent.</p>

        <p>Le gardien continue de déplacer discrètement d’autres offrandes.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent éviter un conflit injustifié, révéler un véritable
        phénomène spirituel, discréditer le gardien ou au contraire faire de lui
        une source importante pour comprendre des changements plus larges.</p>
      format: 1
