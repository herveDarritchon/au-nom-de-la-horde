  - name: La querelle du puits
    type: text
    sort: 800000
    text:
      content: >-
        <h2>La querelle du puits</h2>

        <h3>Situation</h3>

        <p>Une caravane venue de Razor Hill arrive à un point d’eau
        habituellement utilisé par les chasseurs de Sen’jin.</p>

        <p>Les deux groupes ont besoin de remplir leurs réserves
        immédiatement.</p>

        <h3>Qui ?</h3>

        <p><strong>Les chasseurs sombrelance</strong> veulent conserver un accès
        fiable avant plusieurs jours de chasse.</p>

        <p><strong>Les convoyeurs orcs</strong> doivent poursuivre leur
        route.</p>

        <p><strong>Les responsables locaux</strong> veulent empêcher qu’un
        problème de logistique devienne une affaire politique.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Personne n’a organisé le conflit.</p>

        <p>Le point d’eau fournit simplement moins que nécessaire pour répondre
        aux besoins simultanés des deux groupes.</p>

        <h3>Quand ?</h3>

        <p>La tension apparaît pendant une période de forte utilisation ou de
        baisse temporaire du niveau d’eau.</p>

        <h3>Où ?</h3>

        <p>À proximité de Sen’jin, sur une piste utilisée par les chasseurs et
        les voyageurs.</p>

        <h3>Pourquoi ?</h3>

        <p>Dans Durotar, l’eau constitue une ressource concrète.</p>

        <p>Chaque groupe possède une justification raisonnable et estime que
        céder maintenant lui coûtera davantage plus tard.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ arrivent pendant la dispute.</li><li>La caravane qu’ils
        accompagnent s’arrête au point d’eau.</li><li>Les chasseurs viennent se
        plaindre à Sen’jin après avoir dû renoncer à remplir leurs
        réserves.</li></ul>

        <h3>Approches possibles</h3>

        <p>Négocier un partage, trouver une seconde source, organiser des
        horaires, réparer ou améliorer l’accès, prendre parti ou simplement
        empêcher la violence immédiate.</p>

        <h3>Complication</h3>

        <p>Le débit réduit peut avoir une cause naturelle sans rapport avec le
        conflit : obstruction, déplacement du terrain, contamination locale ou
        simple variation temporaire.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les responsables locaux trouvent probablement un compromis, mais une
        altercation peut laisser une rancœur personnelle durable.</p>

        <h3>Conséquences possibles</h3>

        <p>Une solution pratique peut améliorer la route, créer une règle
        d’usage reconnue ou révéler une ressource secondaire. Une décision
        injuste peut au contraire transformer une dispute ponctuelle en symbole
        d’un ressentiment plus large.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
          entryId: querelle-du-puits
          sourceHash: f9ca267f
