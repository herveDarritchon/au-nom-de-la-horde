  - name: Le pêcheur revenu deux fois
    type: text
    sort: 100000
    text:
      content: >-
        <h2>Le pêcheur revenu deux fois</h2>

        <h3>Situation</h3>

        <p>Un pêcheur sombrelance disparu depuis plusieurs jours revient seul à
        Sen’jin.</p>

        <p>Quelques heures plus tard, une patrouille arrivant par la côte
        affirme avoir retrouvé son cadavre.</p>

        <p>Les deux événements sont suffisamment proches pour rendre impossible
        une explication confortable.</p>

        <h3>Qui ?</h3>

        <p><strong>Le pêcheur revenu</strong> veut retrouver les siens et
        comprendre pourquoi tout le monde le regarde comme une menace.</p>

        <p><strong>Sa famille</strong> veut croire qu’il est bien celui qu’il
        prétend être.</p>

        <p><strong>La patrouille</strong> veut que quelqu’un identifie le corps
        avant qu’il se décompose.</p>

        <p><strong>Les habitants les plus inquiets</strong> craignent une
        manipulation liée aux Îles.</p>

        <h3>Quoi ?</h3>

        <p>La source ne définit pas la réponse.</p>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Le corps et le survivant peuvent tous deux être réels sans nécessiter
        un double magique : erreur d’identification, parent ressemblant au
        disparu, corps défiguré, mensonge sincère ou événement lié aux pratiques
        de Zalazane.</p>

        <p>Le MJ peut choisir l’explication seulement lorsqu’elle devient
        nécessaire.</p>

        <h3>Quand ?</h3>

        <p>Le pêcheur a disparu quelques jours auparavant.</p>

        <p>Son retour et la découverte du corps se produisent le même jour.</p>

        <p>Si personne ne vérifie rapidement, le corps devient plus difficile à
        identifier.</p>

        <h3>Où ?</h3>

        <p>Sen’jin pour le survivant.</p>

        <p>Une portion isolée de la côte pour le cadavre.</p>

        <p>Les derniers lieux où le pêcheur a réellement été vu peuvent
        constituer un troisième site.</p>

        <h3>Pourquoi ?</h3>

        <p>La puissance de la situation vient de deux témoignages crédibles qui
        semblent incompatibles.</p>

        <p>Les expériences liées à Zalazane rendent immédiatement plausible une
        explication surnaturelle, même si elle n’est pas nécessairement
        correcte.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ assistent au retour du pêcheur.</li><li>La patrouille
        demande simplement quelqu’un connaissant l’homme pour identifier le
        corps.</li><li>Une dispute éclate devant la famille lorsqu’un habitant
        accuse le survivant d’être un imposteur.</li></ul>

        <h3>Approches possibles</h3>

        <p>Interroger séparément les témoins, inspecter le corps, retracer le
        trajet du survivant, rechercher son embarcation, attendre de voir si son
        comportement devient anormal ou refuser de participer à la panique.</p>

        <h3>Complication</h3>

        <p>Le survivant connaît un détail familial intime que personne
        d’extérieur ne devrait connaître.</p>

        <p>Le cadavre porte pourtant également un objet personnel qui lui
        appartenait.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>La famille protège le survivant.</p>

        <p>Une partie de Sen’jin commence à l’éviter.</p>

        <p>Le corps est finalement enterré sans certitude et l’affaire devient
        une histoire que chacun raconte différemment.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent restaurer la confiance envers le survivant, révéler
        une seconde identité, découvrir une piste vers les Îles ou simplement
        démontrer que la communauté s’est emballée sans disposer des faits.</p>
      format: 1
