  - name: Ce que cherche Gadrin
    type: text
    sort: 1800000
    text:
      content: >-
        <h2>Ce que cherche Gadrin</h2>

        <h3>Situation</h3>

        <p>Maître Gadrin pose depuis quelque temps des questions sur des
        traditions, substances ou connaissances qui ne semblent pas exister en
        Durotar.</p>

        <p>Plusieurs personnes cherchent à comprendre pourquoi.</p>

        <h3>Qui ?</h3>

        <p><strong>Maître Gadrin</strong> poursuit une recherche dont le contenu
        exact n’est pas établi dans les sources.</p>

        <p><strong>Les curieux</strong> imaginent qu’il prépare quelque chose
        d’important.</p>

        <p><strong>Des voyageurs trolls</strong> peuvent posséder des fragments
        d’information.</p>

        <h3>Quoi ?</h3>

        <p>La source fournit seulement l’idée que sa recherche peut ouvrir vers
        d’autres traditions trolls et éventuellement vers des régions
        extérieures à Durotar.</p>

        <p><strong>Information à vérifier / non établie dans les sources
        fournies.</strong></p>

        <h3>Quand ?</h3>

        <p>La recherche est déjà en cours mais n’a pas nécessairement
        d’échéance.</p>

        <h3>Où ?</h3>

        <p>Sen’jin pour les premiers contacts.</p>

        <p>Les réponses peuvent se trouver hors de Durotar.</p>

        <h3>Pourquoi ?</h3>

        <p>Gadrin possède suffisamment de savoir pour avoir identifié une lacune
        qu’il ne peut pas résoudre localement.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ croisent plusieurs voyageurs interrogés par
        Gadrin.</li><li>Gadrin leur pose une question liée à un lieu qu’ils
        connaissent.</li><li>Un marchand propose de vendre une information qu’il
        pense recherchée par Gadrin.</li></ul>

        <h3>Approches possibles</h3>

        <p>Aider, observer, questionner directement Gadrin, chercher des sources
        extérieures ou laisser la recherche évoluer en arrière-plan.</p>

        <h3>Complication</h3>

        <p>Plusieurs personnes prétendent posséder l’information recherchée et
        certaines cherchent simplement à profiter de la réputation de
        Gadrin.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Gadrin poursuit sa recherche lentement par ses propres réseaux.</p>

        <h3>Conséquences possibles</h3>

        <p>Cette accroche peut ouvrir une future route hors de Durotar, fournir
        un contact ou rester une simple preuve que les habitants importants ont
        leurs propres activités indépendamment des PJ.</p>
      format: 1
