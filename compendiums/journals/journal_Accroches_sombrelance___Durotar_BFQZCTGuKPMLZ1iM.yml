  - name: Ceux qu’on ne doit pas tuer
    type: text
    sort: 200000
    text:
      content: >-
        <h2>Ceux qu’on ne doit pas tuer</h2>

        <h3>Situation</h3>

        <p>Une petite pirogue arrive de nuit depuis les Îles de l’Écho avec
        trois Sombrelance épuisés.</p>

        <p>Deux supplient qu’on les aide.</p>

        <p>Le troisième attaque brutalement quiconque approche.</p>

        <h3>Qui ?</h3>

        <p><strong>Les deux fugitifs libres</strong> veulent mettre leur
        compagnon en sécurité sans le tuer.</p>

        <p><strong>Le captif sous emprise</strong> agit contre sa volonté.</p>

        <p><strong>Les gardes de Sen’jin</strong> veulent empêcher qu’un
        individu dangereux entre dans le village.</p>

        <p><strong>Une famille locale</strong> peut reconnaître le captif comme
        un proche disparu.</p>

        <h3>Quoi ?</h3>

        <p>Le troisième troll est encore sous l’influence de Zalazane.</p>

        <p>Il n’est pas venu volontairement attaquer Sen’jin.</p>

        <p>Les deux autres ont réussi à l’emmener parce qu’ils espéraient qu’une
        fois loin des Îles quelqu’un saurait le libérer.</p>

        <h3>Quand ?</h3>

        <p>Les fugitifs viennent de réussir leur évasion.</p>

        <p>Ils savent que leur disparition peut être remarquée rapidement.</p>

        <h3>Où ?</h3>

        <p>La scène commence sur la plage ou à proximité de Sen’jin.</p>

        <p>Les informations qu’ils transportent concernent les Îles de
        l’Écho.</p>

        <h3>Pourquoi ?</h3>

        <p>Les fugitifs ont préféré prendre le risque d’emporter leur compagnon
        plutôt que l’abandonner à Zalazane.</p>

        <p>Les gardes, eux, voient d’abord un individu violent représentant un
        danger immédiat.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ assistent à l’arrivée de la pirogue.</li><li>Un garde les
        appelle lorsqu’il reconnaît un PJ capable de maîtriser quelqu’un sans le
        tuer.</li><li>Les cris réveillent une partie du village.</li></ul>

        <h3>Approches possibles</h3>

        <p>Immobiliser le captif, tenter de communiquer, utiliser des moyens
        spirituels ou magiques, interroger les fugitifs, isoler l’individu,
        chercher une personne ayant déjà vu ce type d’emprise.</p>

        <h3>Complication</h3>

        <p>Les fugitifs affirment que d’autres captifs peuvent encore être
        sauvés.</p>

        <p>Mais ils refusent de révéler immédiatement où ils se cachent, de peur
        que l’information ne remonte jusqu’à Zalazane.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les gardes finissent par maîtriser le captif par la force.</p>

        <p>Il peut survivre, mais l’épisode renforce l’idée qu’il est plus sûr
        de tuer les serviteurs de Zalazane que de tenter de les libérer.</p>

        <h3>Conséquences possibles</h3>

        <p>Cette scène peut modifier durablement la manière dont les PJ abordent
        les trolls des Îles, créer un contact parmi les fugitifs ou révéler
        qu’une approche non létale peut ouvrir des possibilités que le combat
        fermerait.</p>
      format: 1
