  - name: Les traces de Minshina
    type: text
    sort: 900000
    text:
      content: >-
        <h2>Les traces de Minshina</h2>

        <h3>Situation</h3>

        <p>Un étranger ou un habitant discret interroge plusieurs anciens sur
        Minshina.</p>

        <p>Il cherche surtout à savoir où certains objets rituels ont été
        déplacés après l’exode des Îles.</p>

        <h3>Qui ?</h3>

        <p><strong>Le chercheur</strong> poursuit un objectif qu’il ne révèle
        pas entièrement.</p>

        <p><strong>Les anciens</strong> n’apprécient pas tous que ces questions
        soient posées publiquement.</p>

        <p><strong>Les familles liées aux objets</strong> peuvent considérer
        l’affaire comme privée.</p>

        <h3>Quoi ?</h3>

        <p>La source ne fixe pas l’identité du chercheur.</p>

        <p>Il peut être parent d’une victime, jeune initié, partisan de Zalazane
        ou personne sincèrement intéressée par les rites.</p>

        <p>L’important est qu’il connaît suffisamment le sujet pour poser des
        questions précises.</p>

        <h3>Quand ?</h3>

        <p>Il vient de commencer ses recherches.</p>

        <p>Les questions répétées finissent par attirer l’attention.</p>

        <h3>Où ?</h3>

        <p>Sen’jin pour les témoignages.</p>

        <p>D’anciens lieux de stockage, sanctuaires ou caches peuvent être
        concernés ensuite.</p>

        <h3>Pourquoi ?</h3>

        <p>Minshina et les objets liés à sa mémoire peuvent fournir des éléments
        utiles pour comprendre ou affronter l’influence de Zalazane.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ entendent le même nom revenir dans plusieurs
        conversations.</li><li>Un ancien leur demande s’ils savent qui pose ces
        questions.</li><li>Le chercheur les approche directement après avoir
        appris qu’ils connaissent les Îles.</li></ul>

        <h3>Approches possibles</h3>

        <p>Observer, interroger le chercheur, consulter les anciens, chercher
        les objets avant lui, l’aider ou décider que l’affaire relève uniquement
        des Sombrelance.</p>

        <h3>Complication</h3>

        <p>Le chercheur peut être parfaitement sincère sur son but immédiat tout
        en travaillant pour quelqu’un d’autre.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Il finit par découvrir au moins une partie des informations qu’il
        cherche.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent accélérer l’arc autour de Minshina, protéger une
        cache, révéler une connaissance oubliée ou attirer l’attention sur un
        objet que personne ne surveillait jusque-là.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
          entryId: traces-de-minshina
          sourceHash: 057b56dc
