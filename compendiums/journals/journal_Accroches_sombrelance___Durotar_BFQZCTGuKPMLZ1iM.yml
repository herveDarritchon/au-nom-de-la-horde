  - name: Celui qui veut repartir
    type: text
    sort: 1200000
    text:
      content: >-
        <h2>Celui qui veut repartir</h2>

        <h3>Situation</h3>

        <p>Un Sombrelance annonce publiquement qu’il quitte Durotar.</p>

        <p>Il ne rejoint pas Zalazane.</p>

        <p>Il veut retourner à Strangleronce.</p>

        <h3>Qui ?</h3>

        <p><strong>Le départant</strong> pense que son peuple a trop sacrifié de
        son identité en multipliant les exils.</p>

        <p><strong>Sa famille</strong> ne partage pas nécessairement son
        choix.</p>

        <p><strong>Quelques jeunes</strong> trouvent ses arguments
        convaincants.</p>

        <p><strong>Les anciens</strong> peuvent accepter son droit à partir sans
        approuver son discours.</p>

        <h3>Quoi ?</h3>

        <p>Il n’y a pas de conspiration.</p>

        <p>Le personnage exprime une position personnelle : une nouvelle terre
        ne remplace pas forcément celle des ancêtres.</p>

        <h3>Quand ?</h3>

        <p>Son départ est prévu prochainement.</p>

        <p>La discussion devient importante parce qu’il ne cherche plus à
        convaincre en privé.</p>

        <h3>Où ?</h3>

        <p>Sen’jin.</p>

        <p>La destination annoncée est Strangleronce.</p>

        <h3>Pourquoi ?</h3>

        <p>L’installation en Durotar a donné un nouveau foyer aux Sombrelance,
        mais elle n’efface pas l’existence d’une histoire antérieure.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ assistent à son annonce.</li><li>Un jeune leur demande ce
        qu’ils pensent de son discours.</li><li>Sa famille cherche quelqu’un
        connaissant les routes vers l’est.</li></ul>

        <h3>Approches possibles</h3>

        <p>Discuter, aider à préparer le voyage, tenter de le convaincre de
        rester, écouter sans intervenir ou chercher à comprendre pourquoi il
        choisit précisément maintenant.</p>

        <h3>Complication</h3>

        <p>Il possède peut-être une raison privée qu’il ne veut pas exposer :
        personne à retrouver, dette ancienne, héritage familial ou crainte de
        mourir loin de sa terre natale.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Il part.</p>

        <p>Quelques autres peuvent le suivre, mais cela ne provoque pas un exode
        général.</p>

        <h3>Conséquences possibles</h3>

        <p>Le départ peut créer un contact futur vers Strangleronce, ouvrir une
        discussion identitaire durable ou rester simplement le choix personnel
        d’un membre de la communauté.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
          entryId: celui-qui-veut-repartir
          sourceHash: 784546fe
