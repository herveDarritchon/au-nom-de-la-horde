  - name: Les voix des Îles
    type: text
    sort: 1300000
    text:
      content: >-
        <h2>Les voix des Îles</h2>

        <h3>Situation</h3>

        <p>Des signaux intermittents apparaissent depuis une zone des Îles
        considérée comme contrôlée par Zalazane.</p>

        <p>Ils proviennent de Sombrelance encore libres.</p>

        <h3>Qui ?</h3>

        <p><strong>Les survivants cachés</strong> veulent évacuer plusieurs
        proches sous emprise.</p>

        <p><strong>Les captifs</strong> ne comprennent pas nécessairement qu’on
        cherche à les sauver.</p>

        <p><strong>Les hommes de Zalazane</strong> ignorent encore précisément
        où se trouve le groupe.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Un petit groupe libre survit clandestinement sur les Îles.</p>

        <p>Il ne cherche pas à vaincre Zalazane.</p>

        <p>Son objectif immédiat est beaucoup plus limité : sortir quelques
        personnes avant d’être découvert.</p>

        <h3>Quand ?</h3>

        <p>Le groupe ne pourra pas rester caché indéfiniment.</p>

        <p>Les patrouilles se rapprochent progressivement de sa zone.</p>

        <h3>Où ?</h3>

        <p>Une île ou un secteur côtier des Îles de l’Écho.</p>

        <p>Un point d’accostage discret peut exister.</p>

        <h3>Pourquoi ?</h3>

        <p>Les survivants refusent d’abandonner leurs proches mais n’ont pas
        assez de moyens pour les maîtriser et les transporter seuls.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les signaux sont remarqués depuis Sen’jin.</li><li>Un fugitif
        atteint la côte.</li><li>Un pêcheur découvre un objet laissé
        volontairement comme message.</li></ul>

        <h3>Approches possibles</h3>

        <p>Reconnaissance, infiltration, contact discret, rituel, diversion,
        extraction nocturne, négociation avec des captifs ou abandon de
        l’opération.</p>

        <h3>Complication</h3>

        <p>Certaines personnes que les survivants veulent évacuer occupent
        désormais des fonctions utiles dans le dispositif de Zalazane.</p>

        <p>Les retirer peut immédiatement alerter les autres.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le groupe tente une extraction seul ou change de cache.</p>

        <p>Il peut disparaître sans que Sen’jin sache s’il a fui ou été
        capturé.</p>

        <h3>Conséquences possibles</h3>

        <p>Une réussite peut ouvrir un point d’accostage secret, fournir des
        témoins directs des Îles ou créer un réseau de survivants. Une opération
        trop visible peut rendre les futures incursions beaucoup plus
        difficiles.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
