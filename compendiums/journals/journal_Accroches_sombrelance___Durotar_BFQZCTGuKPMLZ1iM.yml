  - name: Les volontaires
    type: text
    sort: 700000
    text:
      content: >-
        <h2>Les volontaires</h2>

        <h3>Situation</h3>

        <p>Plusieurs jeunes Sombrelance accumulent discrètement nourriture,
        cordages et armes près d’une pirogue.</p>

        <p>Ils affirment vouloir seulement reconnaître une petite île.</p>

        <p>Personne ne les croit vraiment.</p>

        <h3>Qui ?</h3>

        <p><strong>Les volontaires</strong> veulent prouver qu’il est possible
        de reprendre l’initiative.</p>

        <p><strong>Leurs familles</strong> veulent éviter une expédition
        suicidaire.</p>

        <p><strong>Certains anciens</strong> comprennent leur frustration mais
        contestent leur méthode.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Les jeunes ont découvert une vraie faiblesse : une petite position de
        Zalazane semble temporairement moins surveillée.</p>

        <p>Leur renseignement est correct.</p>

        <p>Leur plan, lui, est incomplet.</p>

        <h3>Quand ?</h3>

        <p>Ils veulent partir lors de la prochaine nuit favorable.</p>

        <h3>Où ?</h3>

        <p>Sen’jin pour la préparation.</p>

        <p>Une petite île périphérique pour l’objectif.</p>

        <h3>Pourquoi ?</h3>

        <p>L’attente et les récits de reconquête future ne leur suffisent
        plus.</p>

        <p>Ils veulent obtenir un résultat limité maintenant.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ découvrent les réserves cachées.</li><li>Un parent
        inquiet leur parle.</li><li>Un volontaire tente d’acheter discrètement
        du matériel auprès d’eux.</li></ul>

        <h3>Approches possibles</h3>

        <p>Les convaincre d’attendre, améliorer leur plan, les accompagner,
        informer les anciens, exploiter leur renseignement autrement ou ne pas
        intervenir.</p>

        <h3>Complication</h3>

        <p>L’île est faiblement gardée parce qu’un autre problème mobilise les
        hommes de Zalazane.</p>

        <p>Cette faiblesse est donc réelle mais temporaire.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les jeunes partent.</p>

        <p>Ils peuvent revenir avec une information importante, revenir blessés
        ou ne pas revenir du tout.</p>

        <h3>Conséquences possibles</h3>

        <p>Leur initiative peut ouvrir une nouvelle route, créer une génération
        de jeunes éclaireurs, provoquer une réaction de Zalazane ou produire une
        rancœur durable si les adultes les ont empêchés d’agir sans proposer
        d’alternative.</p>
      format: 1
