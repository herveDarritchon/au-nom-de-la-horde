  - name: Le loa qui ne répond plus
    type: text
    sort: 1500000
    text:
      content: >-
        <h2>Le loa qui ne répond plus</h2>

        <h3>Situation</h3>

        <p>Plusieurs chasseurs rapportent séparément que des rites habituels
        donnent des signes inhabituels autour d’un même secteur.</p>

        <p>Personne ne s’accorde sur leur signification.</p>

        <h3>Qui ?</h3>

        <p><strong>Les chasseurs</strong> veulent savoir si le territoire reste
        sûr.</p>

        <p><strong>Les anciens</strong> proposent plusieurs interprétations.</p>

        <p><strong>Les plus sceptiques</strong> pensent que les changements sont
        naturels.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Quelque chose perturbe réellement certains phénomènes observés lors
        des rites.</p>

        <p>La cause n’est pas nécessairement spirituelle.</p>

        <p>Un indice très léger peut pointer vers des vibrations, une chaleur
        souterraine ou d’autres changements physiques liés au nord.</p>

        <h3>Quand ?</h3>

        <p>Les premiers signes isolés remontent à quelque temps, mais leur
        répétition les rend seulement maintenant visibles comme motif.</p>

        <h3>Où ?</h3>

        <p>Un secteur précis de Durotar fréquenté par les chasseurs.</p>

        <p>Les anomalies semblent plus fortes dans une direction donnée.</p>

        <h3>Pourquoi ?</h3>

        <p>Les pratiques spirituelles servent ici de moyen d’observation du
        monde autant que de croyance.</p>

        <p>Les Sombrelance remarquent un changement sans automatiquement en
        connaître la cause.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Un chasseur raconte son expérience.</li><li>Les PJ assistent à
        un rite dont le résultat surprend tout le monde.</li><li>Une piste
        animale se comporte anormalement dans le même secteur.</li></ul>

        <h3>Approches possibles</h3>

        <p>Comparer les observations, explorer le terrain, consulter plusieurs
        interprètes, rechercher une cause matérielle, attendre ou considérer
        qu’il n’y a pas encore suffisamment d’éléments.</p>

        <h3>Complication</h3>

        <p>Deux traditions différentes donnent des interprétations opposées du
        même phénomène.</p>

        <p>Aucune ne dispose encore de preuve décisive.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les chasseurs commencent à éviter certaines zones.</p>

        <p>La modification de leurs habitudes peut suffire à créer de nouveaux
        problèmes de ressources.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent identifier tôt un signe du fil rouge, révéler une
        cause indépendante, modifier les routes de chasse ou simplement établir
        qu’un phénomène réel existe sans encore savoir pourquoi.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
          entryId: loa-qui-ne-repond-plus
          sourceHash: 75cefc22
