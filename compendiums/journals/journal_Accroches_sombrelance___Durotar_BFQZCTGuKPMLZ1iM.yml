  - name: Le sang de Strangleronce
    type: text
    sort: 1400000
    text:
      content: >-
        <h2>Le sang de Strangleronce</h2>

        <h3>Situation</h3>

        <p>Un troll venu de l’est arrive à Sen’jin.</p>

        <p>Il ne cherche ni Vol’jin ni une confrontation avec la Horde.</p>

        <p>Il réclame un vieil exilé par son nom.</p>

        <h3>Qui ?</h3>

        <p><strong>Le visiteur</strong> veut que l’exilé honore une dette
        antérieure à son installation en Durotar.</p>

        <p><strong>L’exilé sombrelance</strong> considère cette partie de sa vie
        comme terminée.</p>

        <p><strong>Sa famille actuelle</strong> ne connaissait peut-être pas
        cette dette.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>La dette peut concerner une promesse, un objet, un crime, une
        protection reçue autrefois ou une personne abandonnée.</p>

        <p>Le visiteur n’a pas nécessairement l’intention de recourir à la
        violence.</p>

        <h3>Quand ?</h3>

        <p>Le visiteur a entrepris un long voyage pour retrouver cette
        personne.</p>

        <p>Il n’acceptera probablement pas de repartir après une simple fin de
        non-recevoir.</p>

        <h3>Où ?</h3>

        <p>Sen’jin pour la confrontation.</p>

        <p>Les preuves ou témoins éventuels se trouvent peut-être bien au-delà
        de Durotar.</p>

        <h3>Pourquoi ?</h3>

        <p>Pour le visiteur, changer de tribu, de continent ou d’alliance
        politique n’efface pas automatiquement une obligation ancienne.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ assistent à la confrontation.</li><li>L’exilé leur
        demande de vérifier les affirmations du visiteur.</li><li>Le visiteur
        cherche un médiateur qui ne soit pas directement impliqué.</li></ul>

        <h3>Approches possibles</h3>

        <p>Médiation, enquête sur l’ancienne dette, négociation d’un nouvel
        accord, refus d’intervenir ou accompagnement vers une personne
        susceptible de témoigner.</p>

        <h3>Complication</h3>

        <p>Le visiteur dit la vérité sur la dette.</p>

        <p>Mais l’exilé possède lui aussi une bonne raison de ne pas l’honorer
        selon les termes originaux.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>La communauté finit par devoir prendre position sur une affaire
        qu’elle aurait préféré laisser privée.</p>

        <h3>Conséquences possibles</h3>

        <p>La dette peut être payée autrement, publiquement annulée, transmise
        ou devenir la base d’un futur contact avec une autre tribu troll.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-hooks
          entryId: sang-de-strangleronce
          sourceHash: c10bfad1
