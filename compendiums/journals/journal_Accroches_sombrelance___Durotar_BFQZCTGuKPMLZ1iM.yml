  - name: La chasse interdite
    type: text
    sort: 1100000
    text:
      content: >-
        <h2>La chasse interdite</h2>

        <h3>Situation</h3>

        <p>Une bête inhabituelle apparaît près de Sen’jin et attaque du bétail
        ou menace les chasseurs.</p>

        <p>Un vieux pisteur refuse pourtant catégoriquement qu’on la tue.</p>

        <h3>Qui ?</h3>

        <p><strong>Le chasseur</strong> affirme reconnaître un signe associé à
        un loa.</p>

        <p><strong>Les habitants menacés</strong> veulent simplement que le
        danger disparaisse.</p>

        <p><strong>D’autres chasseurs</strong> ne sont pas certains de
        l’interprétation de leur ancien.</p>

        <h3>Quoi ?</h3>

        <p>La bête est réellement inhabituelle.</p>

        <p>Le signe observé par le chasseur est également réel.</p>

        <p>Ce que cela signifie reste ouvert.</p>

        <p>Il peut s’agir d’un comportement animal, d’une marque rituelle posée
        par quelqu’un ou d’un phénomène spirituel.</p>

        <h3>Quand ?</h3>

        <p>La créature vient d’apparaître dans un territoire où elle n’était pas
        observée auparavant.</p>

        <h3>Où ?</h3>

        <p>Pistes et terrains de chasse autour de Sen’jin.</p>

        <p>Son origine peut se situer plus loin.</p>

        <h3>Pourquoi ?</h3>

        <p>Le conflit vient du fait que les deux interprétations ont une
        logique.</p>

        <p>La créature est dangereuse.</p>

        <p>La tuer immédiatement peut cependant détruire la seule piste
        permettant de comprendre pourquoi elle est là.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ rencontrent la créature.</li><li>Un chasseur les empêche
        de poursuivre une traque.</li><li>Des habitants demandent simplement
        qu’on protège les alentours.</li></ul>

        <h3>Approches possibles</h3>

        <p>Observer, suivre, capturer, repousser, accomplir un rite, rechercher
        l’origine du signe ou tuer la créature malgré l’interdiction.</p>

        <h3>Complication</h3>

        <p>La bête ne cherche peut-être pas à s’installer.</p>

        <p>Elle fuit elle-même quelque chose.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les chasseurs finissent par agir.</p>

        <p>La créature est probablement tuée ou repoussée avant que la raison de
        son déplacement soit comprise.</p>

        <h3>Conséquences possibles</h3>

        <p>Les PJ peuvent découvrir une nouvelle menace, confirmer ou contredire
        l’interprétation spirituelle, éviter des pertes ou provoquer une tension
        avec ceux qui considéraient l’animal comme porteur d’un signe.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
