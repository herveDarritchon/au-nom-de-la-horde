        <h1>Hana'zua</h1>

        <blockquote><p><strong>[CANON] lié à Sarkoth ; développement
        [ADAPTATION]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Il incarne la pression sociale autour des
        épreuves et la question : jusqu'où faut-il aller pour prouver sa valeur
        ?</p>

        <h2>Présence</h2><p>Jeune Orc, peau verte vive, cheveux très sombres,
        athlétique, lance de chasse, couteau et quelques bandages anciens.</p>

        <h2>Voix et répliques</h2><ul><li>« Pas encore. »</li><li>« On n'avait
        pas fini. »</li><li>« J'ai eu peur. Tu ne le racontes pas. »</li></ul>

        <h2>Veut</h2><p>Être quelqu'un dont on se souvient.</p>

        <h2>Craint</h2><ul><li>être ordinaire</li><li>être pris en
        pitié</li></ul>
