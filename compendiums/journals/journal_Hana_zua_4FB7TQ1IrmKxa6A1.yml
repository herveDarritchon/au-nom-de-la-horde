    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Accepter un défi ; le battre
        sans l'humilier ; rire avec lui ; le sauver sans exhiber sa peur ; lui
        dire franchement lorsqu'il a été stupide.</p>

        <h2>La perdre / devenir son adversaire</h2><p>L'humilier devant les
        autres ; utiliser sa blessure pour gagner du prestige ; mentir sur
        Sarkoth ; traiter sa peur comme de la lâcheté.</p>

        <h2>Liens personnels possibles</h2>

        <h3>Tu ne le racontes pas</h3><p>Après l'attaque de Sarkoth, il avoue à
        un PJ qu'il a eu peur et lui demande de garder le secret.</p><h3>Le défi
        jamais terminé</h3><p>Avant Sarkoth, Hana'zua et un PJ se lancent un
        défi ridicule. Après sa blessure : « On n'avait pas fini. »</p><h2>S'il
        devient un allié</h2><p>Ami, rival loyal ou dette vivante. Il peut plus
        tard revenir comme combattant ou éclaireur.</p><h2>S'il devient
        hostile</h2><p>Une humiliation publique ou une trahison de confiance
        peut transformer la rivalité en blessure durable.</p>
