        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Une recrue raconte qu'Hana'zua a affronté
        trois scorpides. Il est là et peut accepter la gloire ou corriger
        l'histoire selon ce qu'il est devenu.</p>

        <h2>Évolution hors champ</h2><p>Il reprend l'entraînement hors champ. Sa
        manière de raconter Sarkoth change selon la relation avec les PJ.</p>

