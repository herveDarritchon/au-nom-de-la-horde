      content: >-
        <h1>Issues et récompenses</h1>


        <h2>Yarrog est capturé</h2>

        <p>Les PJ gagnent une source d’informations, mais aussi un menteur
        expérimenté. Le Repaire peut ensuite être fouillé calmement.</p>


        <h2>Yarrog est tué</h2>

        <p>Le médaillon prouve son affiliation, mais plusieurs réponses
        disparaissent avec lui : qui lui donnait des ordres, qui il avait
        recruté, où partaient les informations.</p>


        <h2>Yarrog s’échappe</h2>

        <p>Résultat parfaitement valable. Le Repaire devient la preuve
        matérielle de son rôle. Yarrog peut réapparaître plus tard à Skull Rock,
        sur les routes, à Orgrimmar ou à travers ses intermédiaires.</p>


        <h2>Les PJ gardent le secret</h2>

        <p>Ils peuvent surveiller le Repaire, identifier des contacts, suivre un
        messager ou laisser Yarrog croire qu’il n’est pas démasqué.</p>


        <h2>La Horde reprend le lieu</h2>

        <p>Le Repaire peut devenir un poste d’observation, une cache de
        patrouille, un raccourci ou un lieu surveillé.</p>


        <h2>Récompenses</h2>

        <h3>Matérielles</h3>

        <ul>

        <li>médaillon de la Lame ardente ;</li>

        <li>composants de démonologie ;</li>

        <li>petite bourse ;</li>

        <li>matériel récupérable.</li>

        </ul>


        <h3>Sociales</h3>

        <ul>

        <li>confiance de Zureetha ;</li>

        <li>reconnaissance de Gornek ;</li>

        <li>dette d’une recrue libérée de l’influence de Yarrog.</li>

        </ul>


        <h3>Informations</h3>

        <ul>

        <li>noms partiels ;</li>

        <li>descriptions de contacts ;</li>

        <li>fragment de code ;</li>

        <li>piste vers une autre cellule.</li>

        </ul>


        <h3>Exploration</h3>

        <ul>

        <li>sortie haute ;</li>

        <li>nouveau raccourci du pointcrawl.</li>

        </ul>


        <h2>Payoff</h2>

        <blockquote>

        <p><strong>« Yarrog nous observait depuis combien de temps ?
        »</strong></p>

        <p><strong>« Qui d’autre travaille pour eux ? »</strong></p>

        </blockquote>
