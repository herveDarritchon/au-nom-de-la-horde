        <h1>Salle 2 — La cache des confidences</h1>

        <blockquote>

        <p><strong>Fonction :</strong> enquête / rôleplay indirect<br>

        <strong>Question :</strong> les PJ comprennent-ils ce que Yarrog fait
        réellement dans la Vallée ?</p>

        </blockquote>


        <h2>Description</h2>

        <p>Une galerie latérale débouche sur un espace étroit qui ressemble
        d’abord à une réserve ordinaire. C’est pourtant la pièce la plus riche
        en informations du Repaire.</p>


        <h2>Contenu</h2>

        <ul>

        <li>vêtements ordinaires ;</li>

        <li>matériel d’écriture ;</li>

        <li>nourriture ;</li>

        <li>corde ;</li>

        <li>composants de démonologie ;</li>

        <li>quelques pièces ;</li>

        <li>petits objets appartenant à plusieurs Orcs ;</li>

        <li>messages sans signature ;</li>

        <li>fragments de cartes ;</li>

        <li>notes sur les déplacements de recrues.</li>

        </ul>


        <h2>À ne pas placer ici</h2>

        <ul>

        <li>liste complète des membres ;</li>

        <li>carte de toutes les cellules ;</li>

        <li>lettre du « grand chef » ;</li>

        <li>preuve expliquant tout le réseau.</li>

        </ul>


        <p>Le Repaire doit <strong>ouvrir le mystère</strong>, pas le
        résoudre.</p>


        <h2>Indices</h2>

        <table>

        <thead><tr><th>Indice</th><th>Ce qu’il suggère</th></tr></thead>

        <tbody>

        <tr><td>Objets appartenant à plusieurs recrues</td><td>Yarrog entretient
        des relations personnelles.</td></tr>

        <tr><td>Horaires et départs notés</td><td>Il collecte des
        informations.</td></tr>

        <tr><td>Mentions de Tranchecolline ou Sen’jin</td><td>Son activité
        dépasse la Vallée.</td></tr>

        <tr><td>Message parlant d’« écouter » quelqu’un</td><td>Il travaille par
        influence, pas seulement par contrainte.</td></tr>

        <tr><td>Matériel rituel très limité</td><td>Ce n’est pas un grand
        sanctuaire démoniaque.</td></tr>

        </tbody>

        </table>


        <h2>Message possible</h2>

        <blockquote>

        <p>« Celui dont je t’ai parlé partira bientôt vers Tranchecolline.<br>

        Continue à l’écouter. Ne lui demande rien. »</p>

        </blockquote>


        <h2>Twist optionnel lié à un PJ</h2>

        <p>Parmi les objets, un PJ reconnaît une boucle, un talisman, une pièce
        d’équipement, une écriture ou un petit cadeau offert à quelqu’un qu’il
        connaît.</p>

        <p>Cette personne n’est pas nécessairement membre de la Lame ardente :
        elle peut être manipulée, observée, utilisée comme source involontaire
        ou en cours de recrutement.</p>
