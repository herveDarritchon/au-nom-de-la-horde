        <h1>Salle 1 — La faille et les familiers</h1>

        <blockquote>

        <p><strong>Fonction :</strong> entrée gardée / seuil à franchir<br>

        <strong>Question :</strong> les PJ entrent-ils sans alerter Yarrog ?</p>

        </blockquote>


        <h2>Description</h2>

        <p>Une cassure discrète dans la falaise laisse sortir un mince filet
        d’eau. L’entrée semble naturelle. Aucun symbole de la Lame ardente n’est
        visible.</p>


        <h2>Ce que les PJ voient</h2>

        <ul>

        <li>traces orques ;</li>

        <li>empreintes griffues ;</li>

        <li>marques de petites charges transportées ;</li>

        <li>pierres déplacées régulièrement ;</li>

        <li>quelques os rongés ;</li>

        <li>odeur âcre venant de la faille.</li>

        </ul>


        <p><strong>Information automatique :</strong> le lieu n’est pas une
        simple tanière. Des Orcs et des créatures y circulent régulièrement.</p>


        <h2>Les vils familiers</h2>

        <p>La première cavité sert de zone de repos à quelques <strong>vils
        familiers</strong>. Ils sont surtout :</p>

        <ul>

        <li>guetteurs ;</li>

        <li>nuisibles ;</li>

        <li>messagers ;</li>

        <li>système d’alarme vivant.</li>

        </ul>


        <p>Ils ne doivent pas provoquer automatiquement une initiative.</p>


        <h2>Approches possibles</h2>

        <ul>

        <li>se faufiler ;</li>

        <li>attendre ;</li>

        <li>distraire les familiers ;</li>

        <li>les attirer avec de la nourriture ;</li>

        <li>les effrayer ;</li>

        <li>les éliminer rapidement ;</li>

        <li>les suivre s’ils repartent vers les profondeurs.</li>

        </ul>


        <h2>Conséquence essentielle</h2>

        <p>Si un familier atteint Yarrog, choisir <strong>une seule</strong>
        réaction :</p>

        <ul>

        <li>un document important est déplacé ;</li>

        <li>la recrue présente est renvoyée ;</li>

        <li>Yarrog prépare la sortie haute ;</li>

        <li>le médaillon est dissimulé ;</li>

        <li>un traqueur gangrené est déplacé vers le bassin.</li>

        </ul>


        <p><strong>Indice :</strong> les familiers savent où aller lorsqu’ils
        sont effrayés. Ils ne se dispersent pas au hasard. Quelqu’un les
        utilise.</p>
