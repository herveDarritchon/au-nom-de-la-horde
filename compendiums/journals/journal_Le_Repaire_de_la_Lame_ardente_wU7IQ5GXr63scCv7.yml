        <h1>Salle 4 — Le Cénacle</h1>

        <blockquote>

        <p><strong>Fonction :</strong> climax<br>

        <strong>Question :</strong> que font les PJ maintenant qu’ils savent
        ?</p>

        </blockquote>


        <h2>Description</h2>

        <p>Le Cénacle est une corniche naturelle dominant le bassin. Il ne
        ressemble pas à un grand temple démoniaque.</p>


        <ul>

        <li>trois ou quatre sièges de pierre ;</li>

        <li>petit foyer ;</li>

        <li>pierre plate servant de table ;</li>

        <li>quelques bougies ;</li>

        <li>tapis grossier ;</li>

        <li>cercle rituel discret ;</li>

        <li>caisse de composants ;</li>

        <li>petite cache derrière une dalle.</li>

        </ul>


        <p>Le lieu ne peut accueillir qu’un petit nombre de personnes.
        <strong>Yarrog recrute individuellement.</strong></p>


        <h2>Situation recommandée</h2>

        <p><strong>Yarrog est avec une recrue.</strong></p>

        <p>La recrue :</p>

        <ul>

        <li>n’est pas prisonnière ;</li>

        <li>est venue volontairement ;</li>

        <li>ne pense pas servir la Lame ardente ;</li>

        <li>croit peut-être que Yarrog est l’un des rares adultes qui l’écoute
        réellement.</li>

        </ul>


        <p>Avant que les PJ se montrent, ils peuvent entendre :</p>

        <blockquote>

        <p>« Tu n’as rien à me prouver.<br>

        Mais demande-toi pourquoi ceux qui te donnent des ordres ne t’expliquent
        jamais rien. »</p>

        </blockquote>


        <h2>Yarrog face aux PJ</h2>

        <p>Yarrog ne déclenche pas immédiatement l’initiative. Il veut savoir
        :</p>

        <ul>

        <li>ce qu’ils savent ;</li>

        <li>depuis quand ;</li>

        <li>qui les a envoyés ;</li>

        <li>s’ils ont prévenu quelqu’un ;</li>

        <li>s’il peut encore sauver sa couverture.</li>

        </ul>


        <blockquote><p>« Vous m’avez suivi. Pourquoi ? »</p></blockquote>


        <h2>Décisions possibles</h2>

        <ul>

        <li>l’accuser ;</li>

        <li>montrer les preuves ;</li>

        <li>le capturer ;</li>

        <li>le laisser parler ;</li>

        <li>convaincre la recrue ;</li>

        <li>feindre de ne pas tout savoir ;</li>

        <li>négocier ;</li>

        <li>chercher qui lui donne des ordres ;</li>

        <li>le laisser fuir pour le suivre ;</li>

        <li>provoquer un combat.</li>

        </ul>


        <h2>Si combat il y a</h2>

        <p>Le combat doit poursuivre un objectif :</p>

        <ul>

        <li>empêcher Yarrog d’atteindre la sortie haute ;</li>

        <li>protéger la recrue ;</li>

        <li>récupérer le médaillon ;</li>

        <li>empêcher la destruction d’un message ;</li>

        <li>capturer Yarrog vivant.</li>

        </ul>


        <p><strong>Priorité de Yarrog :</strong> sauver son réseau et fuir. Il
        ne combat pas jusqu’à la mort par principe.</p>
