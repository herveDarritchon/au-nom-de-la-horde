        <h1>Salle 3 — Le bassin noir</h1>

        <blockquote>

        <p><strong>Fonction :</strong> complication / choix dangereux<br>

        <strong>Question :</strong> les PJ avancent-ils vite ou prennent-ils le
        temps de comprendre le lieu ?</p>

        </blockquote>


        <h2>Description</h2>

        <p>La galerie descend vers une vaste cavité occupée par un bassin
        naturel. L’eau est sombre, mais pas intrinsèquement maléfique. La
        présence de Yarrog l’a seulement souillée par endroits.</p>


        <ul>

        <li>plafond élevé ;</li>

        <li>roches humides ;</li>

        <li>racines sèches ;</li>

        <li>vapeur légère ;</li>

        <li>reflets rouge-orange de braises ;</li>

        <li>faible lueur gangrenée dans une fissure ;</li>

        <li>corniche du Cénacle visible au-dessus.</li>

        </ul>


        <h2>La galerie basse</h2>

        <p>Un passage étroit longe le bassin. Des <strong>traqueurs
        gangrenés</strong> l’utilisent. Ils constituent le principal danger
        physique du donjon, mais doivent fonctionner comme un
        <strong>obstacle</strong>, pas comme un pack.</p>


        <p>Ils peuvent :</p>

        <ul>

        <li>flairer les intrus ;</li>

        <li>barrer le passage ;</li>

        <li>poursuivre un PJ isolé ;</li>

        <li>protéger l’accès au Cénacle ;</li>

        <li>se replier sur un ordre.</li>

        </ul>


        <h2>Trois routes</h2>

        <h3>Route A — Galerie basse</h3>

        <p>Rapide, mais dangereuse. Risque de confrontation avec les
        traqueurs.</p>


        <h3>Route B — Bassin</h3>

        <p>Plus discrète. Les PJ progressent dans l’eau ou longent les rochers.
        Risques : bruit, glissade, équipement mouillé, difficulté à fuir
        rapidement.</p>


        <h3>Route C — Observer</h3>

        <p>Prendre du temps permet de repérer les habitudes des traqueurs, un
        passage sous la corniche et l’endroit d’où proviennent les voix du
        Cénacle.</p>


        <h2>Révélation</h2>

        <p>Les traqueurs répondent à des sons, gestes ou ordres. Ils ne se
        comportent pas comme des animaux sauvages : <strong>quelqu’un les
        contrôle</strong>.</p>


        <h2>En cas de bruit ou d’échec</h2>

        <p>Ne rajoute pas des ennemis. Fais évoluer la situation :</p>

        <ul>

        <li>Yarrog interrompt sa conversation ;</li>

        <li>une recrue tente de partir ;</li>

        <li>un message est brûlé ;</li>

        <li>la sortie haute est ouverte ;</li>

        <li>les traqueurs se replient vers le Cénacle.</li>

        </ul>
