        <h1>Indices, états et réactions</h1>


        <h2>Réseau d’indices</h2>

        <p>Aucune information essentielle ne doit dépendre d’un seul test.</p>


        <table>

        <thead><tr><th>Information essentielle</th><th>Source 1</th><th>Source
        2</th><th>Source 3</th></tr></thead>

        <tbody>

        <tr><td>Des Orcs utilisent le lieu</td><td>Traces à
        l’entrée</td><td>Matériel dans la cache</td><td>Yarrog /
        recrue</td></tr>

        <tr><td>Les créatures sont contrôlées</td><td>Comportement des
        traqueurs</td><td>Familier qui rejoint Yarrog</td><td>Ordres
        entendus</td></tr>

        <tr><td>Yarrog espionne les recrues</td><td>Notes</td><td>Objets
        personnels</td><td>Conversation au Cénacle</td></tr>

        <tr><td>Le réseau dépasse la Vallée</td><td>Mentions de
        Tranchecolline</td><td>Message incomplet</td><td>Sortie haute /
        messager</td></tr>

        <tr><td>Yarrog appartient à la Lame
        ardente</td><td>Médaillon</td><td>Symbole caché</td><td>Aveu / preuves
        croisées</td></tr>

        </tbody>

        </table>


        <h2>État du donjon</h2>

        <table>

        <thead><tr><th>État</th><th>Modifications</th></tr></thead>

        <tbody>

        <tr><td><strong>Secret</strong></td><td>Cache complète, recrue possible,
        Yarrog confiant.</td></tr>

        <tr><td><strong>Méfiance</strong></td><td>Certains messages ont disparu,
        Yarrog est prudent.</td></tr>

        <tr><td><strong>Compromis</strong></td><td>Recrutement suspendu,
        documents déplacés, fuite préparée.</td></tr>

        <tr><td><strong>Abandonné</strong></td><td>Documents brûlés, caches
        vidées, créatures laissées libres.</td></tr>

        <tr><td><strong>Contrôlé par la Horde</strong></td><td>La grotte devient
        un point connu et surveillé.</td></tr>

        </tbody>

        </table>


        <h2>Règle de réaction</h2>

        <p>Une alerte ne signifie pas « plus de monstres ». Elle doit changer le
        comportement du lieu :</p>

        <ul>

        <li>preuve déplacée ;</li>

        <li>recrue évacuée ;</li>

        <li>message brûlé ;</li>

        <li>sortie préparée ;</li>

        <li>créatures repositionnées.</li>

        </ul>
