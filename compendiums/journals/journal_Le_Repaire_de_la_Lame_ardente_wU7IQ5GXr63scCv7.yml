        <h1>Le Repaire de la Lame ardente</h1>

        <blockquote>

        <p><strong>Zone :</strong> Vallée des Épreuves, Durotar<br>

        <strong>Format :</strong> Donjon à 5 salles / lieu d’aventure court<br>

        <strong>Faction :</strong> Lame ardente<br>

        <strong>Figure principale :</strong> Yarrog Baneshadow<br>

        <strong>Durée visée :</strong> 60 à 90 minutes si les PJ vont droit au
        but ; jusqu’à une demi-séance s’ils enquêtent, surveillent ou
        négocient.<br>

        <strong>Budget de combat :</strong> 0 à 1 combat majeur.</p>

        </blockquote>


        <h2>Fonction dramatique</h2>

        <p>Le Repaire doit faire comprendre aux PJ que la corruption de la
        Vallée est <strong>organisée</strong>, que Yarrog les observe et que ce
        lieu n’est qu’une <strong>cellule d’un réseau plus vaste</strong>.</p>


        <p><strong>Ne pas jouer :</strong></p>

        <blockquote><p>familiers → traqueurs → Yarrog → loot</p></blockquote>


        <p><strong>Jouer plutôt :</strong></p>

        <blockquote><p><strong>intrusion → observation → découverte → doute →
        confrontation → révélation</strong></p></blockquote>


        <h2>Ce qu’est réellement le lieu</h2>

        <p>Le Repaire n’est ni un temple, ni une base militaire, ni le quartier
        général de la Lame ardente. C’est un <strong>poste avancé
        clandestin</strong> utilisé pour :</p>

        <ul>

        <li>observer les nouvelles recrues ;</li>

        <li>stocker des informations et du matériel compromettant ;</li>

        <li>recevoir discrètement des recrues ou sympathisants ;</li>

        <li>contrôler quelques créatures démoniaques ;</li>

        <li>transmettre des renseignements hors de la Vallée ;</li>

        <li>préparer une fuite si la couverture de Yarrog tombe.</li>

        </ul>


        <h2>Schéma des 5 salles</h2>

        <pre>               [5] SORTIE HAUTE
                            Récompense / révélation
                                 |
                       [4] LE CÉNACLE
                            Climax / Yarrog
                                 |
                       [3] LE BASSIN NOIR
                          + GALERIE BASSE
                            Complication
                            /          \
                  [2] LA CACHE      détour risqué
                   Enquête
                            \          /
                     [1] FAILLE D’ENTRÉE
                      + FAMILIERS
                      Gardien / seuil</pre>

        <h2>Accroches</h2>

        <ul>

        <li><strong>Yarrog devient suspect :</strong> plusieurs indices
        convergent vers lui.</li>

        <li><strong>Une créature mène au Repaire :</strong> un familier ou un
        traqueur fuit vers la grotte.</li>

        <li><strong>Une recrue disparaît :</strong> elle s’est peut-être rendue
        volontairement au Cénacle.</li>

        <li><strong>Surveillance discrète :</strong> les PJ suivent Yarrog sans
        l’accuser publiquement.</li>

        </ul>


        <h2>Question de mise en scène</h2>

        <blockquote>

        <p><strong>Le Repaire doit révéler une organisation, pas seulement un
        ennemi.</strong></p>

        </blockquote>
