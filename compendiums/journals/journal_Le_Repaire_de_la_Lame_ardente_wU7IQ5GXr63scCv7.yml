        <h1>Salle 5 — La sortie haute</h1>

        <blockquote>

        <p><strong>Fonction :</strong> récompense / révélation / ouverture<br>

        <strong>Question :</strong> que font les PJ de ce qu’ils viennent
        d’apprendre ?</p>

        </blockquote>


        <h2>Description</h2>

        <p>Une fissure étroite rejoint les hauteurs de la Vallée. Elle explique
        comment Yarrog pouvait entrer et sortir discrètement du Repaire.</p>


        <h2>Récompense concrète</h2>

        <p>Les PJ découvrent un <strong>raccourci du pointcrawl</strong> vers
        les hauteurs du nord de la Vallée.</p>


        <h2>La vraie récompense : l’information</h2>

        <p>Les PJ doivent pouvoir reconstruire les éléments suivants :</p>

        <ol>

        <li>Yarrog appartient bien à la <strong>Lame ardente</strong>.</li>

        <li>Il utilisait le Repaire pour <strong>observer et
        recruter</strong>.</li>

        <li>Plusieurs personnes de la Vallée ont été approchées.</li>

        <li>Certaines ne savent probablement pas pour qui elles
        travaillent.</li>

        <li>Yarrog <strong>transmet ses informations à quelqu’un
        d’autre</strong>.</li>

        <li>Le Repaire n’est qu’une cellule locale.</li>

        </ol>


        <h2>Piste vers Skull Rock</h2>

        <p>Ne jamais donner un panneau « prochaine quête ». Utiliser une trace
        subtile :</p>

        <ul>

        <li>même formule dans un message ;</li>

        <li>mention des « frères du nord » ;</li>

        <li>composant venant des environs de Skull Rock ;</li>

        <li>sceau partiel ;</li>

        <li>ordre de transférer une recrue vers un autre cercle ;</li>

        <li>itinéraire incomplet.</li>

        </ul>


        <blockquote><p><strong>Conclusion recherchée :</strong> « Il y en a
        d’autres. »</p></blockquote>
