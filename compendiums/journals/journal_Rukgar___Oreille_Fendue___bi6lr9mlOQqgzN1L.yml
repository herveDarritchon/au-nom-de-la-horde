  - name: 02 · Jouer ce péon
    type: text
    sort: 200000
    text:
      format: 1
      content: >-
        <h1>Interprétation et liens</h1><h2>Comment l’incarner</h2><p>Ne donne
        pas sa confiance facilement. Il parle franchement à ceux qui l’écoutent
        sans l’interrompre.</p><h2>Ce qu’il sait, croit et
        dissimule</h2><dl><dt><strong>Sait</strong></dt><dd>Un chemin vers
        l’Antre, l’état de certains étais, les bruits et les mouvements
        ressentis avant un récent
        éboulement.</dd><dt><strong>Croit</strong></dt><dd>Que les coups
        entendus avant la chute annonçaient un danger inhabituel ; il ne sait
        pas ce qui les provoquait.</dd><dt><strong>Cache</strong></dt><dd>Il a
        omis de signaler une petite fissure avant son dernier départ, de peur de
        prolonger son quart.</dd></dl><h2>Son
        entourage</h2><table><thead><tr><th>Personne</th><th>Relation
        actuelle</th></tr></thead><tbody><tr><td>Mogra</td><td>Reconnaît sa
        compétence en construction ; ils sont en désaccord sur la conduite à
        tenir.</td></tr><tr><td>Thazz’rill</td><td>Le contremaître doute de son
        témoignage.</td></tr><tr><td>Kragosh</td><td>Le traite comme un mauvais
        exemple.</td></tr><tr><td>Dorga</td><td>Compatit sans pouvoir le
        défendre ouvertement.</td></tr></tbody></table><h2>Une phrase à
        placer</h2><blockquote><p>« J’ai entendu la roche bouger. Vous pouvez
        rire. Moi, je n’y retourne pas. »</p></blockquote>
