  - name: 03 · Scènes et réactions
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>Scènes et décisions</h1><h2>Trois occasions de jeu</h2><h3>Le
        refus</h3><p>Au moment d’entrer dans la galerie, Rukgar pose sa pioche
        et refuse l’ordre devant tout le monde.</p><h3>Des coups dans la
        pierre</h3><p>Les PJ peuvent l’accompagner pour inspecter la zone,
        regarder les étais, écouter et se faire une
        opinion.</p><h3>L’accusation</h3><p>Sous pression, Rukgar accuse un
        collègue de sabotage sans preuve solide. Les PJ doivent distinguer ses
        craintes des faits.</p><h2>Réactions à quelques choix des
        PJ</h2><table><thead><tr><th>Approche des PJ</th><th>Réaction ou
        conséquence</th></tr></thead><tbody><tr><td>Le forcer à retourner sous
        terre</td><td>Il obéit peut-être, mais panique ou quitte le chantier ;
        sa confiance est détruite.</td></tr><tr><td>Examiner le
        risque</td><td>Des étais mal placés peuvent expliquer une part du danger
        ; sa peur n’est pas feinte, même s’il n’a pas raison sur
        tout.</td></tr><tr><td>Le réaffecter provisoirement</td><td>Un conflit
        se déplace vers Kragosh, qui réclame la même rigueur pour les
        autres.</td></tr></tbody></table><h2>Si les PJ n’interviennent
        pas</h2><p>Thazz’rill envoie d’autres péons ; un étai mal fixé provoque
        une frayeur ou un accident, sans nécessairement confirmer toute
        l’interprétation de Rukgar.</p><p><em>Ces scènes sont des opportunités,
        pas une suite de quêtes imposées. Elles peuvent se résoudre sans jet de
        dés.</em></p>
