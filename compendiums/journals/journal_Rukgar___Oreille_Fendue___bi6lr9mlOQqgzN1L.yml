  - name: 01 · Portrait et accroche
    type: text
    sort: 100000
    text:
      format: 1
      content: >-
        <h1>Rukgar « Oreille-Fendue »</h1><p><em>Adaptation Warbound · Vallée
        des Épreuves · Journal MJ</em></p><blockquote><p>« J’ai entendu la roche
        bouger. Vous pouvez rire. Moi, je n’y retourne pas.
        »</p></blockquote><h2>En un
        regard</h2><dl><dt><strong>Rôle</strong></dt><dd>Le réfractaire · peur /
        témoignage</dd><dt><strong>Aspect</strong></dt><dd>Orc nerveux à
        l’oreille déchirée. Il surveille les sorties, écoute le bruit des
        galeries et évite de se placer sous les lourdes
        poutres.</dd><dt><strong>Désir</strong></dt><dd>Ne plus être envoyé dans
        une galerie qu’il estime dangereuse ; obtenir qu’un responsable prenne
        ses observations au
        sérieux.</dd><dt><strong>Crainte</strong></dt><dd>Être enseveli vivant
        ou passer pour un lâche devant les nouvelles
        recrues.</dd><dt><strong>Défaut</strong></dt><dd>Il devient agressif
        sous la pression et est capable d’accuser injustement un
        collègue.</dd></dl><h2>Première impression à la table</h2><p>Ne donne
        pas sa confiance facilement. Il parle franchement à ceux qui l’écoutent
        sans l’interrompre.</p><h2>Contact avec les PJ</h2><p>Un guide prudent
        qui a besoin d’être cru mais peut rendre service aux aventuriers dans
        les passages difficiles.</p><p><em>Statut : PNJ original de la campagne.
        Repère canonique du secteur : le contremaître Thazz’rill et les péons de
        la Vallée.</em></p>
