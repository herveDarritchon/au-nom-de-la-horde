  - name: Secret MJ — Le vieux chantier
    type: text
    sort: 100
    text:
      format: 1
      content: |-
        <h1>Secret MJ — Le vieux chantier</h1>
              <p><strong>Ne pas révéler automatiquement pendant le premier trajet.</strong></p>
              <p>Grumek a déjà travaillé sur un chantier lié aux premières excavations sous ou autour du site d’Orgrimmar. Son équipe a atteint une paroi qui ne ressemblait pas à une formation naturelle : pierres ajustées, marques taillées et chaleur anormale. Le contremaître a fait interrompre le travail et les ouvriers ont été déplacés. On leur a parlé d’une ancienne galerie instable.</p><p>Grumek a gardé un petit éclat sombre arraché à cette zone, simplement parce qu’il s’agissait de l’une des premières pierres qu’il avait sorties lui-même. Il n’a aucune idée de la fonction réelle de la paroi, du scellement ou du danger enfoui. Le morceau peut devenir plus tard une preuve visuelle ou matérielle lorsque les PJ rencontrent une roche, des marques ou une chaleur similaires.</p><p>Le twist doit fonctionner en rétrospective : lorsque Grumek comprend qu’il a déjà vu quelque chose de comparable, il peut devenir un témoin inattendu du fil rouge. Il ne doit pas expliquer la vérité à la place des PJ.</p><p>Ne pas faire raconter ce souvenir pendant le premier trajet sans raison. Laisser d’abord les PJ formuler leurs propres hypothèses. Grumek peut ensuite intervenir : « J’ai déjà vu ça. » Si les PJ ne s’intéressent jamais à lui, le secret peut rester inutilisé.</p><p>Ce secret ne signifie pas que Grumek est un traître, un agent du Cercle de la Pierre brisée ou un informateur secret. Il ne connaît ni le scellement, ni la menace sous Ragefeu, ni la raison réelle de l’arrêt du chantier.</p>
              <p><strong>Actor :</strong> @UUID[Actor.GhDvHPN42QOdvgqn]{Grumek Gros-Bras}</p>
              <p><strong>Retour :</strong> @UUID[JournalEntry.unXDn8E42FSnKBZd]{Fiche de Grumek}</p>
