  - name: MJ — continuité et conséquences
    type: text
    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Adaptation Warbound — événements de la séance 1 et scène Gornek fournis par le MJ (7 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>Raccorder à la séance 1 sans réécrire ce qui s’est passé</h3><p>Le rassemblement se déroule <strong>après</strong> le réveil, les exercices de Jazty et Sorez, les observations de Gurok et Volzan près du chantier et l’incident du scorpide caché dans les rochers. Conserver la version réellement jouée : ne pas décider après coup que le mât est tombé, qu’un péon est blessé ou que le scorpide a été combattu.</p><p>Si des conséquences ont été établies, laisser Thazz’rill, les péons ou les recrues réagir en conséquence, par un regard ou une remarque brève. Ne pas rejouer toute la scène du mât.</p>\n<h3>Décisions immédiates</h3><ul><li>Gurok décide de sa réponse à Gornek ; aucune obligation de partager le jugement de l’instructeur.</li><li>Jazty commande le détachement de quatre PJ, sans autorité sur Rukha ni les transporteurs.</li><li>Les PJ choisissent répartition, reconnaissance, vérification des vivres et rythme du départ.</li><li>Le rendez-vous à Roche-Sèche est un objectif horaire, non un déclencheur de scène imposé.</li></ul>\n<h3>État initial à reporter</h3><p><strong>Retard :</strong> 0 point lors du départ, sauf décision explicite en jeu. <strong>Convoi 1 :</strong> un kodo de bât chargé de vivres, eau et bois, sans chariot. <strong>Convoi 2 :</strong> n’est rejoint qu’à Roche-Sèche : kodo lourd, chariot et caisses de Mâche-Roc.</p>\n<h3>Vigilance éditoriale : noms propres</h3><p><strong>[À CONFIRMER]</strong> Dans la scène transmise, Gornek dit « Galadar ». Le dossier de référence de Gurok nomme son père « Galvangar ». La macro conserve <strong>Galadar tel que fourni</strong>, sans décider de la continuité à la place du MJ. De même, la scène emploie les noms « Sorez », « Jazty » et « Volzan » tels que transmis ; vérifier les conventions de nommage du monde si nécessaire.</p>\n<p><strong>Après la scène :</strong> ouvrir @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{Départ} ; consulter @UUID[JournalEntry.x5IUDrYYtOGNPkrH.JournalEntryPage.k3GjUnWLeeK4ZFnN]{Rôles de voyage} et @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{À jouer — l’affectation de Gornek}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.x5IUDrYYtOGNPkrH.JournalEntryPage.k3GjUnWLeeK4ZFnN]{Rôles, progression, rythme} \_ · \_ @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.qERFsqM51AlqFbnx.JournalEntryPage.KNf6AOB6jD73KkQF]{Comportements, limites et connaissances} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table} \_ · \_ @UUID[JournalEntry.1w5SomDLshDAWOoC.JournalEntryPage.MXJysq678UIyw76D]{Points ouverts, sans réponses inventées}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{Scène suivante →}</p>"
