  - name: À jouer — l’affectation de Gornek
    type: text
    text:
      format: 1
      content: "<p></p><small><p><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — événements de la séance 1 et scène Gornek</p></small><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>Les derniers conseils</h3><blockquote style=\"border-left:4px solid #bd8950;padding:8px 12px\"><p><strong>À LIRE OU REFORMULER</strong></p><p>Gornek se tient devant l’entrée de la Grande Hutte, un rouleau d’ordres à la main. « Votre formation est terminée. Maintenant, il n’y aura plus un instructeur derrière chacun de vos pas, la bleusaille. »</p><p>« Gurok. Sorez. Jazty. Volzan. Vous quatre, approchez. »</p></blockquote><hr><h4>Yarrog t'interpelle Sorek</h4><blockquote style=\"border-left:4px solid rgb(189, 137, 80);padding:8px 12px\"><p><strong>À LIRE OU REFORMULER</strong></p><p>Alors que tu te prépares à rejoindre tes compagnons, <strong>Yarrog</strong> t'interpelle <strong>Sorez</strong>.</p><p>« <span>Sorkez ! Viens donc par ici un instant. J'aimerais te parler avant que tu partes.</span> »</p><p>Le démoniste attend que tu t'approches.</p><p><span><strong>Au joueur :</strong></span> « Est-ce que tu lui réponds ? Est ce que tu t'approches ? »</p><div><div></div><div><div><p><span>« Sorkez, ta façon de manier la magie m'intrigue. Tu agis à l'instinct, sans toujours comprendre les forces que tu manipules. C'est un don rare, mais dangereux s'il reste incontrôlé. »</span></p><p><span>« Reviens me voir de temps en temps. Je pourrais t'aider à comprendre ton pouvoir et à le maîtriser. Crois-moi, tu as un potentiel que tu ne soupçonnes pas encore. »</span></p></div></div></div><div></div></blockquote><p><span><strong>Au joueur :</strong></span> « Que penses-tu de cette proposition ? Est-ce que tu lui réponds ? »</p><hr><h4>Un mot à Gurok</h4><blockquote style=\"border-left:4px solid #bd8950;padding:8px 12px\"><p><span><strong>À LIRE OU REFORMULER</strong></span></p><p>Gornek te murmure: « <strong>Gurok. </strong>Je veux que tu gardes un oeil sur le reste du groupe. Tu es le seul <strong>\"vrai\"</strong> membre de la Horde. ». Puis reprends à haute voix: «<strong> Je connais le capitaine Galadar d’Alterac. Ton père</strong>. J'espère que tu lui feras honneur, je sais qu'il compte sur toi. »</p></blockquote><p><strong>Au joueur :</strong> « Est ce que tu lui réponds ? » C’est le jugement de Gornek, pas une vérité sur Gurok.</p><hr><h4><span>Un mot à Sorkez</span></h4><blockquote style=\"border-left:4px solid #bd8950;padding:8px 12px\"><p><span><strong>À LIRE OU REFORMULER</strong></span></p><p><span>Gornek te retient Sorkez d'un geste alors que tu t'apprête à rejoindre les autres.</span></p><p><span>« <strong>Sorkez</strong>. Attends un instant. »</span></p><p><span>Il baisse légèrement la voix.</span></p><p><span>« Un troll Sombrelance qui pratique la démonologie… On n'en croise pas tous les jours. Et je sais que ta manière de manier cette magie est plutôt inhabituelle. »</span></p><p><span>Il le regarde un moment avant de poursuivre.</span></p><p><span>« Écoute-moi bien. Les démons ont laissé suffisamment de mauvais souvenirs à notre peuple. Certains se méfieront de toi rien qu'en apprenant ce que tu es. D'autres, au contraire, s'intéresseront beaucoup trop à ce que tu sais faire. »</span></p><p><span>« Fais attention à tes fréquentations, Sorkez. Surtout à ceux qui te promettent de t'aider. Tous ceux qui offrent leur savoir ne le font pas gratuitement. »</span></p></blockquote><p><strong>Au joueur :</strong> « Est ce que tu lui réponds ? ».</p><hr><div><div><div><h4><span>Un mot à Vol’kar</span></h4><blockquote style=\"border-left:4px solid rgb(189, 137, 80);padding:8px 12px\"><p><span><strong>À LIRE OU REFORMULER</strong></span></p><p><span>Gornek, à Vol’kar :</span></p><p><span>« Vol’kar ! Shikrik m’a demandé de te transmettre un message. Elle estime que tu as appris ce qu’elle pouvait t’enseigner ici. »</span></p><p><span>« À Tranchecolline, cherche un chaman du nom de Swart. Il forme les nôtres à la caserne. Shikrik pense qu’il pourra t’aider à poursuivre ton apprentissage. »</span></p><p><span>Gornek esquisse un sourire.</span></p><p><span>« Elle m’a aussi demandé de te dire une chose : essaie d'écouter les éléments autant que tu aimes t'écouter parler ! »</span></p><p><span>« Allez, rejoins les autres. Vous avez de la route. »</span></p></blockquote><p><span>Au joueur : « Comment réagis-tu aux paroles de Gornek ? Lui parles-tu de tes rencontres avec d'autres démonistes, notamment Yarrog, ou préfères-tu garder cela pour toi ? »</span></p></div></div></div><hr><h4>Le commandement pour Jazty</h4><blockquote style=\"border-left:4px solid rgb(189, 137, 80);padding:8px 12px\"><p><strong>À LIRE OU REFORMULER</strong></p><p>Gornek prend Jazti par l'épaule, montre la piste de Roche-Sèche, proche de la combe des Kolkar. « Depuis un certain temps, l’activité des Kolkar s’est intensifiée mais récemment on a réussi à contrôler l'entrée de la combe des Kolkar donc la piste devrait être sûre ! »</p><p>« Observez les hauteurs. Ne courez pas après le premier assaillant venu comme des bourriques. <strong>Protégez-vous et protégez le convoi. Soyez une meute.</strong> »</p></blockquote><p><strong>Au joueur :</strong> « Est ce que tu réponds ? Adresses-tu quelques mots à tes compagnons ? ».</p><h3>Avant de partir</h3><p>Qui prend l’ordre ? Qui vérifie le kodo et son chargement ? Que demandent-ils au sujet des Kolkar ? Qui décide l’itinéraire ? Répondre aux questions légitimes sans retenir artificiellement les informations connues.</p><h4>Les Pommes-Cactus</h4><p>Galgar va confier <strong>deux gros sac de pommes-cactus</strong> au PJs, qu'il installe dans des saccoches du Kodo.</p><blockquote style=\"border-left:4px solid #bd8950;padding:8px 12px\"><p><strong>À LIRE — LE DÉPART</strong></p><p>Galgar vérifie les sacs de pommes-cactus. « Celles-là, c’est pour Tranchecolline. Pas pour votre petit déjeuner… ».<br>Le kodo renâcle sous ses sacoches. <br>Il examine une corde d’arrimage : « Si celle-là se détend, c’est la moitié du repas de Tranchecolline qui finit dans la poussière. »</p></blockquote><p><strong>MJ — </strong>Ce dernier détail prépare un enjeu matériel sans imposer un incident.</p><p><strong>Sortie :</strong> Jazty organise librement la marche. <strong>À ce stade, il n’y a ni chariot ni foreuse avec les quatre PJ :</strong> seulement le kodo de vivres. Passer à @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{Quitter la vallée et prendre la route}.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.cSAfIG6ANfQMYzlm]{MJ — continuité et conséquences}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.x5IUDrYYtOGNPkrH.JournalEntryPage.k3GjUnWLeeK4ZFnN]{Rôles, progression, rythme} \_ · \_ @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.qERFsqM51AlqFbnx.JournalEntryPage.KNf6AOB6jD73KkQF]{Comportements, limites et connaissances} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table} \_ · \_ @UUID[JournalEntry.1w5SomDLshDAWOoC.JournalEntryPage.MXJysq678UIyw76D]{Points ouverts, sans réponses inventées}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{Scène suivante →}</p>"
