  - name: Décisions & conséquences
    type: text
    sort: 200000
    text:
      format: 1
      content: "<p></p><small><p><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Adaptation Warbound — événements de la séance 1 et scène Gornek fournis par le MJ (7 novembre 2026)</p></small><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>Départ — décisions et conséquences</h3><p>Après le rassemblement de @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{Gornek}, les PJ partent avec un kodo de bât transportant les vivres destinés à Tranchecolline. Le convoi de Mâche-Roc, déjà chargé, les attend à @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{Roche-Sèche}.</p><p><strong>Décisions ouvertes :</strong> confirmer ou ajuster les postes de surveillance, rythme, reconnaissance de la route, vérification du bât ; déterminer qui tranche pour l’itinéraire. Jazty commande les quatre PJ et la sûreté du détachement, <strong>pas Rukha ni les convoyeurs</strong>.</p><p><strong>Conséquences à noter :</strong> retard initial (normalement 0), état de l’animal, des sangles et des vivres ; relation avec les convoyeurs. Reporter uniquement des événements effectivement survenus.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{À jouer — récit &amp; situations}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{À jouer — l’affectation de Gornek} \_ · \_ @UUID[JournalEntry.x5IUDrYYtOGNPkrH.JournalEntryPage.k3GjUnWLeeK4ZFnN]{Rôles, progression, rythme} \_ · \_ @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.qERFsqM51AlqFbnx.JournalEntryPage.KNf6AOB6jD73KkQF]{Comportements, limites et connaissances} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{← Scène précédente} \_ · \_ @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{Scène suivante →}</p>"
