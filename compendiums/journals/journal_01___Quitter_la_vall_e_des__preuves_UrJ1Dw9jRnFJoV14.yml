    text:
      format: 1
      content: "<p></p><small><p><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement</p></small><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>MATINÉE AVANCÉE · PREMIERS PAS DU DÉTACHEMENT</h3><blockquote style=\"border-left:4px solid #bd8950;padding:8px 12px\"><p><strong>À LIRE OU REFORMULER</strong></p><p>Le soleil monte déjà au-dessus de la vallée des Épreuves. Derrière vous, le nouveau mât et la bannière de la Horde, les exercices du matin ont repris et les péons s’affairent encore autour du chantier, là où un scorpide vous a donné votre dernière leçon bien malgré lui. <br>Les dernières consignes de Gornek en tête, vous gagnez la route : terre sèche, pierres rougies, chaleur grandissante. <br>Le kodo avance d’un pas lourd, ses sacoches balançant au rythme de ses pas et la carriole qu'il tire grince sous le poids de sa cargaison. Bientôt, le nouveau mât disparaît derrière une crête, et la vallée laisse place aux pistes de Durotar. Vous êtes maintenant seuls et au commande.</p></blockquote><p>Vous escortez <strong>un kodo de bât avec un chariot</strong>, portant deux saccoches de pommes-cactus, et dans la cariole de la viande de sanglier séchée, et une cargaison d'eau et bois.</p><p style=\"border-left:3px solid #a9814d;padding-left:10px\"><strong>MJ — </strong>Si Jazty a déjà réparti les rôles devant Gornek, ne pas recommencer la discussion. Demander seulement où chacun marche, qui observe les hauteurs et si le groupe reconnaît la piste. Sinon, laisser les PJ se répartir les postes maintenant. Voir @UUID[JournalEntry.x5IUDrYYtOGNPkrH.JournalEntryPage.k3GjUnWLeeK4ZFnN]{Voyage : guide, éclaireur, voyageurs}.</p><small><p><span style=\"text-decoration:underline\"><strong><span style=\"text-decoration:underline\">Départ :</span></strong></span> @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{état initial du premier convoi} ; @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{retard à 0} sauf faits établis en jeu. Les ordres complets se trouvent dans @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{l’affectation de Gornek}.</p></small><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.3kKuxwg91Pyw0JQb]{Décisions &amp; conséquences}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{À jouer — l’affectation de Gornek} \_ · \_ @UUID[JournalEntry.x5IUDrYYtOGNPkrH.JournalEntryPage.k3GjUnWLeeK4ZFnN]{Rôles, progression, rythme} \_ · \_ @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.qERFsqM51AlqFbnx.JournalEntryPage.KNf6AOB6jD73KkQF]{Comportements, limites et connaissances} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{← Scène précédente} \_ · \_ @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{Scène suivante →}</p>"
