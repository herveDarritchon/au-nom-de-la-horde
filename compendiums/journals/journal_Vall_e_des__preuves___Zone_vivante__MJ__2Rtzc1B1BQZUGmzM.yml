        <h2>8 — Le Repaire de la Lame ardente</h2>

        <p><strong>[ACQUIS Warbound] à partir du Burning Blade Coven
        canonique.</strong></p>

        <p>Petit poste clandestin servant à observer, recruter, stocker et
        communiquer.</p>

        <p>Sous-lieux :</p>

        <ul>

        <li>faille d'entrée ;</li>

        <li>chambre des familiers ;</li>

        <li>cache ;</li>

        <li>bassin noir ;</li>

        <li>galerie basse ;</li>

        <li>Cénacle ;</li>

        <li>sortie haute.</li>

        </ul>

        <p>Le payoff doit être :</p>

        <blockquote>

        <p><strong>Yarrog n'était pas seul, il observait des gens, et quelqu'un
        attendait ses informations.</strong></p>

        </blockquote>

        <hr>
