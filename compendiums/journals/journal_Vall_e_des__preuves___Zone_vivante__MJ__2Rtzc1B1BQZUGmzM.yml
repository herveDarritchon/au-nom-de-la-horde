  - sort: 3100000
    name: 30 · Évolutions sans les PJ
    type: text
    _id: 2d899d4e15eb4df0
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>13. Faire évoluer la Vallée sans les PJ</h1>

        <p>L'inaction n'est pas automatiquement une punition.</p>

        <p>Mais les autres personnages continuent d'agir.</p>

        <p>Après une excursion importante, faire évoluer <strong>une ou deux
        situations maximum</strong>.</p>

        <h3>Si les PJ ignorent Sarkoth</h3>

        <ul>

        <li>Hana'zua se dégrade ;</li>

        <li>d'autres recrues peuvent tenter leur chance ;</li>

        <li>Sarkoth reste territorial.</li>

        </ul>

        <h3>Si les PJ ignorent les tensions des péons</h3>

        <ul>

        <li>Thazz'rill durcit temporairement la discipline ;</li>

        <li>certains travailleurs accélèrent ;</li>

        <li>d'autres cessent de lui signaler leurs problèmes.</li>

        </ul>

        <h3>Si les PJ ignorent les familiers</h3>

        <ul>

        <li>Zureetha enquête par ses propres moyens ;</li>

        <li>une nouvelle apparition confirme que le phénomène n'est pas
        accidentel.</li>

        </ul>

        <h3>Si les PJ ignorent Yarrog</h3>

        <p>Yarrog choisit une personne et avance d'une seule étape :</p>

        <ul>

        <li>gagne sa confiance ;</li>

        <li>demande un service ;</li>

        <li>obtient une information ;</li>

        <li>l'amène éventuellement au Cénacle.</li>

        </ul>

        <p>Ne pas tout faire d'un coup.</p>

        <hr>
