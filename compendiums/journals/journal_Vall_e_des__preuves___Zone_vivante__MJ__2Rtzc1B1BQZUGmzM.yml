  - sort: 400000
    name: 03 · Tension C — Sarkoth
    type: text
    _id: 6c19c942c702f425
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>C — Sarkoth : trophée, menace ou animal ?</h2>

        <p>Hana'zua a été grièvement blessé par Sarkoth. Pour plusieurs jeunes,
        tuer le scorpide serait un exploit.</p>

        <p>Mais Sarkoth est territorial.</p>

        <p><strong>Question :</strong></p>

        <blockquote>

        <p><strong>Les PJ doivent-ils réellement le tuer ?</strong></p>

        </blockquote>

        <p>Ils peuvent :</p>

        <ul>

        <li>le tuer ;</li>

        <li>sauver Hana'zua et partir ;</li>

        <li>le chasser ;</li>

        <li>comprendre ce qu'il protège ;</li>

        <li>empêcher d'autres recrues de le provoquer ;</li>

        <li>utiliser le terrain pour éviter le combat.</li>

        </ul>

        <p><strong>Conséquences :</strong></p>

        <ul>

        <li>Sarkoth tué : prestige, dette possible de Hana'zua, territoire
        modifié ;</li>

        <li>Sarkoth vivant : débat sur les choix des PJ, animal récurrent de la
        Vallée ;</li>

        <li>Sarkoth déplacé : problème potentiellement reporté ailleurs.</li>

        </ul>

        <hr>
