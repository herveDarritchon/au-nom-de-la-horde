        <h1>7. Rencontre majeure — Sarkoth</h1>

        <p>Sarkoth n'est pas un PNJ social, mais une présence identifiable.</p>

        <h3>Signes</h3>

        <ul>

        <li>énorme dard sombre ;</li>

        <li>carapace balafrée ;</li>

        <li>pince déformée ;</li>

        <li>traces profondes ;</li>

        <li>territoire nettement marqué.</li>

        </ul>

        <h3>Comportement</h3>

        <ul>

        <li>observe ;</li>

        <li>menace ;</li>

        <li>cherche à faire reculer ;</li>

        <li>attaque si l'intrus persiste ;</li>

        <li>peut fuir s'il est gravement blessé.</li>

        </ul>

        <h3>Règle</h3>

        <p>Ne pas le jouer comme un monstre qui attend immobile dans une zone
        d'aggro.</p>

        <p>Il possède :</p>

        <ul>

        <li>un territoire ;</li>

        <li>des habitudes ;</li>

        <li>une logique animale.</li>

        </ul>

        <hr>
