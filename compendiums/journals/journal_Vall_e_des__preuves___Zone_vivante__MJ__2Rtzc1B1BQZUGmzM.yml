  - sort: 3300000
    name: 32 · Mémoire de la zone
    type: text
    _id: e1169c0a0576285e
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>15. Mémoire de la zone</h1>

        <p>Après chaque séance dans la Vallée, ajouter une petite section :</p>

        <h2>ÉTABLI EN JEU</h2>

        <h3>Personnes</h3>

        <ul>

        <li>Qui apprécie les PJ ?</li>

        <li>Qui leur en veut ?</li>

        <li>Qui leur doit quelque chose ?</li>

        <li>Qui les prend comme exemple ?</li>

        </ul>

        <h3>Lieux</h3>

        <ul>

        <li>Sarkoth est-il encore vivant ?</li>

        <li>Le plateau est-il toujours dangereux ?</li>

        <li>Le Repaire est-il secret, surveillé, abandonné ou contrôlé ?</li>

        <li>Le chantier a-t-il changé ?</li>

        </ul>

        <h3>Informations</h3>

        <ul>

        <li>Que savent les PJ sur Yarrog ?</li>

        <li>Que sait Yarrog sur les PJ ?</li>

        <li>Zureetha dispose-t-elle de preuves ?</li>

        <li>Gornek considère-t-il les PJ comme fiables ?</li>

        </ul>

        <h3>Une conséquence visible au prochain passage</h3>

        <p>Écrire <strong>une seule phrase</strong>.</p>

        <p>Exemples :</p>

        <blockquote>

        <p>« Deux recrues imitent désormais la manière de combattre du guerrier
        PJ. »</p>

        </blockquote>

        <blockquote>

        <p>« Les péons cessent de parler quand les PJ arrivent. »</p>

        </blockquote>

        <blockquote>

        <p>« Une griffe de Sarkoth est accrochée près de l'Antre. »</p>

        </blockquote>

        <blockquote>

        <p>« Yarrog n'est plus visible depuis deux jours. »</p>

        </blockquote>

        <hr>
