  - sort: 2700000
    name: 26 · Situation 2 — La meilleure histoire
    type: text
    _id: ac5a13a89fa73212
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>SITUATION 2 — La meilleure histoire gagne</h2>

        <p>Deux recrues reviennent avec la même défense de sanglier et deux
        versions incompatibles de la chasse.</p>

        <p>Gornek refuse de trancher :</p>

        <blockquote>

        <p>« Vous étiez dehors. Pas moi. Réglez ça. »</p>

        </blockquote>

        <h3>Vérité</h3>

        <p>Les deux ont contribué.</p>

        <p>L'une a porté le coup final.</p>

        <p>L'autre a empêché le sanglier de tuer son camarade.</p>

        <h3>Choix</h3>

        <p>Qui mérite le crédit ?</p>

        <p>Ou faut-il refuser le principe même du « seul vainqueur » ?</p>

        <h3>Impact</h3>

        <p>Les recrues observent comment les PJ définissent :</p>

        <blockquote>

        <p><strong>l'honneur.</strong></p>

        </blockquote>

        <hr>
