  - sort: 2800000
    name: 27 · Situation 3 — Hana’zua et Sarkoth
    type: text
    _id: 1453818dcfffd4b5
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>SITUATION 3 — Hana'zua et Sarkoth</h2>

        <p>Utiliser la fiche détaillée de Sarkoth.</p>

        <h3>Nœud</h3>

        <p>Hana'zua est en danger.</p>

        <p>Sarkoth représente un enjeu personnel pour un PJ.</p>

        <p>Deux recrues peuvent également vouloir intervenir pour gagner du
        prestige.</p>

        <h3>Choix</h3>

        <ul>

        <li>tuer ;</li>

        <li>sauver ;</li>

        <li>contenir ;</li>

        <li>observer ;</li>

        <li>détourner ;</li>

        <li>laisser les autres agir.</li>

        </ul>

        <h3>Impact</h3>

        <p>Modifier au moins :</p>

        <ul>

        <li>un lien personnel ;</li>

        <li>la réputation des PJ ;</li>

        <li>l'état du plateau.</li>

        </ul>

        <hr>
