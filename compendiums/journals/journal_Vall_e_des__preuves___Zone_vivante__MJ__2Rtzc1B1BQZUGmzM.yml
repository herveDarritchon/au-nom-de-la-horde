  - sort: 3000000
    name: 29 · Situation 5 — Yarrog rend service
    type: text
    _id: ba53bbc21cb5e80a
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>SITUATION 5 — Yarrog rend service</h2>

        <p>Avant toute révélation, Yarrog aide réellement les PJ ou quelqu'un
        qu'ils apprécient.</p>

        <p>Exemples :</p>

        <ul>

        <li>conseil sur une piste ;</li>

        <li>remède simple contre une brûlure ;</li>

        <li>intervention contre une créature ;</li>

        <li>recommandation auprès d'un artisan ;</li>

        <li>défense d'une recrue injustement humiliée.</li>

        </ul>

        <h3>Règle</h3>

        <p>Le service doit être <strong>réel</strong>.</p>

        <p>Yarrog n'a pas organisé le problème.</p>

        <h3>Impact</h3>

        <p>Quand la vérité apparaîtra, les joueurs ne pourront pas réduire toute
        la relation à :</p>

        <blockquote>

        <p>« Tout était faux. »</p>

        </blockquote>

        <hr>
