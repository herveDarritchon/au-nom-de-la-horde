  - sort: 2500000
    name: 24 · Rumeurs (d8)
    type: text
    _id: f537bbb4db7d6397
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>11. Rumeurs</h1>

        <p>Toutes les rumeurs ne sont pas exactes.</p>

        <p>Mais aucune ne doit être un mensonge artificiel du MJ uniquement
        destiné à piéger les joueurs.</p>

        <table>

        <thead>

        <tr>

        <th style="text-align:right">d8</th>

        <th>Rumeur</th>

        <th>Lecture MJ</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="text-align:right">1</td>

        <td>« Sarkoth a déjà tué trois Orcs. »</td>

        <td>Exagération d'un danger réel.</td>

        </tr>

        <tr>

        <td style="text-align:right">2</td>

        <td>« Thazz'rill a perdu sa pioche et accuse tout le monde. »</td>

        <td>Vrai ou presque.</td>

        </tr>

        <tr>

        <td style="text-align:right">3</td>

        <td>« Les petites créatures rouges ont peur de certains mots. »</td>

        <td>Piste exploitable.</td>

        </tr>

        <tr>

        <td style="text-align:right">4</td>

        <td>« Yarrog connaît quelqu'un à Orgrimmar qui peut trouver du travail à
        n'importe qui. »</td>

        <td>Mélange de vrai et de manipulation.</td>

        </tr>

        <tr>

        <td style="text-align:right">5</td>

        <td>« Hana'zua est allé défier Sarkoth pour impressionner quelqu'un.
        »</td>

        <td>À décider selon ce qui sert le PJ lié à Sarkoth.</td>

        </tr>

        <tr>

        <td style="text-align:right">6</td>

        <td>« Zureetha voit des démons partout. »</td>

        <td>Jugement d'un sceptique.</td>

        </tr>

        <tr>

        <td style="text-align:right">7</td>

        <td>« Un péon a vu une lumière verte dans les rochers. »</td>

        <td>Vrai mais incomplet.</td>

        </tr>

        <tr>

        <td style="text-align:right">8</td>

        <td>« Gornek se souvient de tous ceux qui mentent dans leur premier
        rapport. »</td>

        <td>Probablement une légende utile.</td>

        </tr>

        </tbody>

        </table>

        <hr>
