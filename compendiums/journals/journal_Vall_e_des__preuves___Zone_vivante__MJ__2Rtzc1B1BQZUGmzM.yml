        <h2>4 — Les pistes des sangliers et des cactus</h2>

        <p><strong>[CANON] sangliers, pommes de cactus ; détails
        [ADAPTATION].</strong></p>

        <p>Zone ouverte de chasse et de cueillette.</p>

        <p>On y croise :</p>

        <ul>

        <li>sangliers tachetés ;</li>

        <li>cactus ;</li>

        <li>chasseurs débutants ;</li>

        <li>cueilleurs ;</li>

        <li>traces de combats maladroits.</li>

        </ul>

        <p><strong>Galgar</strong> peut y lancer des défis culinaires ou de
        cueillette.</p>

        <p>Cette zone sert aussi de respiration : une scène agréable peut
        simplement rester agréable.</p>

        <hr>
