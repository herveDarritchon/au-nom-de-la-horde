        <h2>YARROG BANESHADOW</h2>

        <p><strong>[CANON] Orc démoniste de la Lame ardente ; rôle social
        [ACQUIS Warbound].</strong></p>

        <h3>Fonction</h3>

        <p>Premier antagoniste pouvant être :</p>

        <blockquote>

        <p><strong>connu avant d'être identifié comme ennemi.</strong></p>

        </blockquote>

        <h3>Apparence publique</h3>

        <ul>

        <li>vêtements de voyage usés ;</li>

        <li>protections simples ;</li>

        <li>attitude calme ;</li>

        <li>rien de démoniaque ostensiblement visible ;</li>

        <li>écoute plus qu'il ne parle.</li>

        </ul>

        <h3>Veut</h3>

        <p>Identifier deux ou trois personnes utiles :</p>

        <ul>

        <li>recrues ;</li>

        <li>informateurs ;</li>

        <li>futurs relais.</li>

        </ul>

        <h3>Ce qui le rend dangereux</h3>

        <p>Il n'invente pas tous les problèmes.</p>

        <p>Il voit quelqu'un d'humilié, frustré ou isolé et lui dit :</p>

        <blockquote>

        <p>« Je comprends. »</p>

        </blockquote>

        <h3>Règle de jeu</h3>

        <p>Yarrog doit rendre <strong>au moins un véritable service</strong>
        avant que sa couverture ne soit révélée.</p>

        <p>S'il paraît immédiatement coupable, son potentiel est perdu.</p>

        <h3>Entrée possible</h3>

        <p>S'il connaît déjà un PJ :</p>

        <blockquote>

        <p>« Ah. Toi. Ça fait un moment. »</p>

        </blockquote>

        <h3>Questions innocentes</h3>

        <ul>

        <li>« Vous partez où demain ? »</li>

        <li>« Gornek vous a confié quoi ? »</li>

        <li>« Thazz'rill râle encore ? »</li>

        <li>« Zureetha s'intéresse toujours à ces créatures ? »</li>

        </ul>

        <p>Chaque réponse lui apprend quelque chose.</p>

        <hr>
