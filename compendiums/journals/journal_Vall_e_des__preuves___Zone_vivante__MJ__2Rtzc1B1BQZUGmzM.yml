        <h1>5. Lieux de la Vallée</h1>

        <h2>1 — L'Antre</h2>

        <p><strong>[CANON] lieu ; détails [ADAPTATION].</strong></p>

        <p>Cœur social de la Vallée.</p>

        <p>On y trouve :</p>

        <ul>

        <li>consignes ;</li>

        <li>entraînement ;</li>

        <li>mentors ;</li>

        <li>travailleurs ;</li>

        <li>rumeurs ;</li>

        <li>recrues qui comparent leurs blessures ;</li>

        <li>Yarrog lorsqu'il entretient sa couverture.</li>

        </ul>

        <p>L'Antre doit paraître <strong>en construction</strong>, pas
        parfaitement organisé : bois fraîchement taillé, abris réparés, armes
        contre les murs, peaux tendues, poussière, disputes, exercice
        martial.</p>

        <h3>À chaque retour</h3>

        <p>Montrer au moins un changement :</p>

        <ul>

        <li>un blessé aidé reprend l'entraînement ;</li>

        <li>une recrue humiliée détourne le regard ;</li>

        <li>un péon salue les PJ ;</li>

        <li>Yarrog parle à quelqu'un qu'ils connaissent ;</li>

        <li>une rumeur circule sur leur dernier exploit.</li>

        </ul>

        <hr>
