        <h2>7 — Les reliefs corrompus</h2>

        <p><strong>[ADAPTATION] à partir des vils familiers.</strong></p>

        <p>Crevasses et petits reliefs où apparaissent les premières traces
        anormales :</p>

        <ul>

        <li>animaux locaux absents ;</li>

        <li>os rongés ;</li>

        <li>odeur âcre ;</li>

        <li>petites empreintes griffues ;</li>

        <li>pierres noircies.</li>

        </ul>

        <p>Fonction :</p>

        <blockquote>

        <p>faire passer les PJ du danger naturel à la présence organisée.</p>

        </blockquote>

        <hr>
