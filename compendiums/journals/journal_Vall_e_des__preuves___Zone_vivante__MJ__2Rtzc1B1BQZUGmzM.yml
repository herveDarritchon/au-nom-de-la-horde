  - sort: 3400000
    name: 33 · Introductions de classe
    type: text
    _id: 16c0cb9b320ba5fe
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>16. Introductions de classe</h1>

        <p>Les quêtes Classic de tablette et de parchemin doivent rester de
        <strong>petites scènes de personnage</strong>, pas devenir des aventures
        autonomes.</p>

        <h3>Usage</h3>

        <p>Quand un PJ rencontre un mentor :</p>

        <ul>

        <li>donner un conseil concret ;</li>

        <li>poser une question sur ce qu'il veut devenir ;</li>

        <li>introduire un détail de tradition ;</li>

        <li>éventuellement lancer un micro-défi de quelques minutes.</li>

        </ul>

        <h3>Mentors présents dans le matériau Classic</h3>

        <p>Selon la race et la classe :</p>

        <ul>

        <li><strong>Jen'shan</strong> ;</li>

        <li><strong>Rwag</strong> ;</li>

        <li><strong>Shikrik</strong> ;</li>

        <li><strong>Nartok</strong> ;</li>

        <li><strong>Mai'ah</strong> ;</li>

        <li><strong>Ken'jai</strong>.</li>

        </ul>

        <p>Ne pas forcer une scène pour chaque personnage.</p>

        <p>Utiliser seulement celles qui donnent du relief au PJ.</p>

        <hr>
