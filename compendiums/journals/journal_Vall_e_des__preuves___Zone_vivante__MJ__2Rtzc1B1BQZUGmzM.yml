  - sort: 500000
    name: 04 · Tension D — Les vils familiers
    type: text
    _id: 3c089ba6566ccf71
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>D — Quelque chose ne devrait pas être ici</h2>

        <p>Des <strong>vils familiers</strong> apparaissent.</p>

        <p>Contrairement aux sangliers et scorpides, ils ne font pas partie du
        paysage naturel de Durotar.</p>

        <p><strong>Zureetha Fargaze</strong> prend la menace au sérieux.</p>

        <p>Les PJ peuvent :</p>

        <ul>

        <li>tuer les familiers ;</li>

        <li>en suivre un ;</li>

        <li>en capturer un ;</li>

        <li>surveiller les reliefs ;</li>

        <li>interroger les recrues ;</li>

        <li>alerter tout le camp.</li>

        </ul>

        <p><strong>Conséquences :</strong></p>

        <ul>

        <li>les tuer sécurise la zone à court terme mais détruit des pistes
        ;</li>

        <li>les suivre rapproche du Repaire ;</li>

        <li>alerter publiquement la Vallée pousse Yarrog à devenir plus
        prudent.</li>

        </ul>

        <hr>
