        <h2>3 — Le chantier de Thazz'rill</h2>

        <p><strong>[CANON] Thazz'rill, péons, pioche ; organisation
        [ADAPTATION].</strong></p>

        <p>Tas de bois, outils, cordages, charrettes, fosses, abris de
        repos.</p>

        <p>Ce lieu montre que la Horde n'est pas seulement une armée :</p>

        <blockquote>

        <p><strong>des gens fabriquent réellement un foyer.</strong></p>

        </blockquote>

        <p>La pioche de Thazz'rill peut être :</p>

        <ul>

        <li>oubliée dans une zone dangereuse ;</li>

        <li>empruntée sans permission ;</li>

        <li>utilisée pour ouvrir une cavité ;</li>

        <li>cachée par un péon voulant forcer une pause.</li>

        </ul>

        <p>Choisir la version qui crée le meilleur conflit au moment où les PJ
        s'y intéressent.</p>

        <hr>
