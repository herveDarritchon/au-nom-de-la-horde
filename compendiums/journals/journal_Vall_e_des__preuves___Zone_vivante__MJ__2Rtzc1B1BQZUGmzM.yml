        <h2>6 — Le plateau de Sarkoth</h2>

        <p><strong>[ACQUIS Warbound].</strong></p>

        <p>Plateau au relief cassé avec :</p>

        <ul>

        <li>rampe exposée ;</li>

        <li>ressaut rocheux ;</li>

        <li>fissures ;</li>

        <li>vieille carcasse ;</li>

        <li>traces profondes ;</li>

        <li>zone protégée par Sarkoth.</li>

        </ul>

        <p>La scène doit permettre observation, pistage, contournement, fuite et
        combat éventuel.</p>

        <p>Le comportement territorial de Sarkoth doit être compréhensible sans
        dépendre d'un jet unique.</p>

        <hr>
