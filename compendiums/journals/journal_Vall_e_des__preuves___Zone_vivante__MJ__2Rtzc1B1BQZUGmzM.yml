      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>6. PNJ principaux</h1>

        <h2>GORNEK</h2>

        <p><strong>[CANON] personnage et rôle de point de contact ; personnalité
        [ADAPTATION].</strong></p>

        <h3>Fonction à la table</h3>

        <p>Gornek permet aux PJ de comprendre ce que la Vallée attend d'eux.</p>

        <p>Ce n'est pas un distributeur de quêtes.</p>

        <p>Il :</p>

        <ul>

        <li>écoute les rapports ;</li>

        <li>évalue les recrues ;</li>

        <li>oriente vers les mentors ;</li>

        <li>décide qui mérite plus de responsabilité ;</li>

        <li>se souvient des personnes qui tiennent parole.</li>

        </ul>

        <h3>Jeu</h3>

        <p>Il parle peu et pose des questions courtes.</p>

        <p>Quand une recrue raconte un exploit :</p>

        <blockquote>

        <p>« Et qu'est-ce que tu as appris ? »</p>

        </blockquote>

        <h3>Veut</h3>

        <p>Que ceux qui quittent la Vallée soient capables, fiables et
        lucides.</p>

        <h3>Craint</h3>

        <ul>

        <li>la vantardise qui gaspille des recrues ;</li>

        <li>la perte d'autorité des cadres ;</li>

        <li>l'illusion de compétence.</li>

        </ul>

        <h3>Relations</h3>

        <p><strong>Avec Thazz'rill :</strong> respect mutuel mais conflit
        possible sur l'usage des recrues comme main-d'œuvre.</p>

        <p><strong>Avec Zureetha :</strong> il écoute les faits, mais refuse de
        transformer chaque rumeur en crise.</p>

        <h3>Avec les PJ</h3>

        <p>Il apprécie :</p>

        <ul>

        <li>un rapport clair ;</li>

        <li>l'aveu d'une erreur ;</li>

        <li>une initiative qui produit un résultat.</li>

        </ul>

        <p>Il méprise :</p>

        <ul>

        <li>la vantardise vide ;</li>

        <li>les excuses permanentes ;</li>

        <li>le sacrifice d'autrui pour paraître fort.</li>

        </ul>

        <hr>
