        <h2>5 — Les terres à scorpides</h2>
        <p><strong>[CANON] scorpides ; détails [ADAPTATION].</strong></p>
        <p>Terrain plus cassé et dangereux.</p>
        <p>Les scorpides ordinaires sont un danger du territoire.</p>
        <p>Ils ne sont pas tous « les serviteurs de Sarkoth ».</p>
        <p>Usage :</p>
        <ul>
        <li>récolte de venin ;</li>
        <li>pistage ;</li>
        <li>sauvetage ;</li>
        <li>apprentissage de la faune ;</li>
        <li>première piste vers le plateau de Sarkoth.</li>
        </ul>
        <hr>
