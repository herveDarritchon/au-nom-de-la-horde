  - sort: 3900000
    name: 38 · Checklist et synthèse MJ
    type: text
    _id: 605839b1e525afac
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>22. Checklist MJ</h1>

        <p>Avant la séance :</p>

        <ul>

        <li>☐ au moins deux PNJ veulent quelque chose maintenant ;</li>

        <li>☐ aucun conflit n'attend passivement l'activation d'une quête ;</li>

        <li>☐ les PJ peuvent parler, contourner, aider, combattre ou refuser
        ;</li>

        <li>☐ Sarkoth reste indépendant de la Lame ardente ;</li>

        <li>☐ Yarrog n'est pas immédiatement caricatural ;</li>

        <li>☐ au moins une scène ne contient aucun danger caché ;</li>

        <li>☐ une décision peut modifier une relation ou un lieu ;</li>

        <li>☐ une situation ignorée possède une évolution plausible ;</li>

        <li>☐ aucune révélation essentielle ne dépend d'un seul jet ;</li>

        <li>☐ la Vallée reste reconnaissable comme Warcraft ;</li>

        <li>☐ les souvenirs du MMO ne donnent pas automatiquement la
        solution.</li>

        </ul>

        <hr>

        <h1>23. Résumé opérationnel</h1>

        <h3>Quand les PJ arrivent</h3>

        <p>Montrer :</p>

        <ul>

        <li><strong>Gornek</strong> : « Trouvez votre place. »</li>

        <li><strong>Thazz'rill</strong> : « Il faut bâtir. »</li>

        <li><strong>Hana'zua / Sarkoth</strong> : « Prouver sa valeur peut
        coûter cher. »</li>

        <li><strong>Zureetha</strong> : « Quelque chose d'anormal est ici.
        »</li>

        <li><strong>Yarrog</strong> : « Je peux t'écouter. »</li>

        </ul>

        <h3>Les choix peuvent changer</h3>

        <ul>

        <li>qui leur fait confiance ;</li>

        <li>qui les admire ;</li>

        <li>qui leur en veut ;</li>

        <li>l'état d'un lieu ;</li>

        <li>la survie d'un PNJ ;</li>

        <li>la présence de Sarkoth ;</li>

        <li>la couverture de Yarrog ;</li>

        <li>les informations disponibles plus tard.</li>

        </ul>

        <h3>Payoff</h3>

        <p>Les joueurs doivent quitter la Vallée avec l'impression :</p>

        <blockquote>

        <p><strong>« Nous n'avons pas seulement terminé une zone de départ. Nous
        avons déjà commencé à laisser une trace dans la Horde. »</strong></p>

        </blockquote>

        <hr>
