  - sort: 2300000
    name: 22 · Relations entre PNJ
    type: text
    _id: 37fe214c2a9b665d
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>9. Relations entre les principaux PNJ</h1>

        <pre><code class="language-text">                         GORNEK
                          autorité / évaluation
                          /                 \
                         /                   \
                THAZZ'RILL ---------------- ZUREETHA
                travail / ordre            vigilance
                     \                       /
                      \                     /
                       \                   /
                         recrues de la Vallée
                             /         \
                            /           \
                        HANA'ZUA       YARROG
                       prestige        écoute / influence
                            \           /
                             \         /
                               les PJ
        </code></pre>

        <h3>Gornek ↔ Thazz'rill</h3>

        <p>Ils ont besoin l'un de l'autre.</p>

        <p>Gornek veut des recrues prêtes.<br>

        Thazz'rill veut des bras capables de travailler.</p>

        <p>Ils peuvent se disputer la même main-d'œuvre.</p>

        <h3>Gornek ↔ Zureetha</h3>

        <p>Même but général : protéger la Vallée.</p>

        <p>Différence :</p>

        <ul>

        <li>Gornek veut des preuves avant de bouleverser le camp ;</li>

        <li>Zureetha considère parfois qu'attendre la preuve parfaite laisse le
        problème s'installer.</li>

        </ul>

        <h3>Thazz'rill ↔ Yarrog</h3>

        <p>Yarrog trouve naturellement des personnes frustrées parmi les
        travailleurs.</p>

        <p>Thazz'rill peut ne pas voir le danger :</p>

        <blockquote>

        <p>« S'il arrive à les faire travailler, qu'il leur parle autant qu'il
        veut. »</p>

        </blockquote>

        <h3>Zureetha ↔ Yarrog</h3>

        <p>Au départ, elle cherche une <strong>cause</strong>, pas forcément
        Yarrog.</p>

        <p>Elle ne doit pas résoudre l'enquête à la place des PJ.</p>

        <h3>Hana'zua ↔ recrues</h3>

        <p>Son accident devient un récit.</p>

        <p>Selon les actions des PJ, il peut être vu comme :</p>

        <ul>

        <li>un avertissement ;</li>

        <li>un héros malchanceux ;</li>

        <li>un imprudent ;</li>

        <li>un survivant respecté.</li>

        </ul>

        <hr>
