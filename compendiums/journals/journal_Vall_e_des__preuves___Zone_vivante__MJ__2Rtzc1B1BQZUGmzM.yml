        <h2>2 — L'aire des épreuves</h2>

        <p><strong>[ADAPTATION].</strong></p>

        <p>Espace ouvert près de l'Antre : cercle dans la poussière, mannequins,
        pierres de lancer, cibles.</p>

        <p>Usage :</p>

        <ul>

        <li>duel ;</li>

        <li>pari ;</li>

        <li>entraînement ;</li>

        <li>concours ;</li>

        <li>humiliation ;</li>

        <li>démonstration de classe.</li>

        </ul>

        <p>Ceux qui brillent ici deviennent connus très vite.</p>

        <p>Ceux qui trichent aussi.</p>

        <hr>
