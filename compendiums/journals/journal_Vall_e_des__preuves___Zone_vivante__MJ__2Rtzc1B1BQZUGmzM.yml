  - sort: 200000
    name: 01 · Tension A — Faire ses preuves
    type: text
    _id: 5b820669f41c0b55
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>4. Cinq tensions actives</h1>

        <p>Il n'est pas nécessaire de faire jouer les cinq simultanément. Deux
        ou trois suffisent.</p>

        <h2>A — Faire ses preuves… mais jusqu'où ?</h2>

        <p>Les jeunes recrues sont encouragées à montrer qu'elles peuvent
        survivre dans Durotar. Le problème commence lorsque certains confondent
        <strong>courage</strong> et <strong>prise de risque
        absurde</strong>.</p>

        <p><strong>Acteurs :</strong> Gornek, Hana'zua, recrues ambitieuses,
        PJ.</p>

        <p><strong>Conflit :</strong> trop protéger les recrues vide les
        épreuves de leur sens ; laisser tout faire transforme la Vallée en
        machine à produire des blessés.</p>

        <p><strong>Choix possibles :</strong></p>

        <ul>

        <li>valoriser les défis traditionnels ;</li>

        <li>imposer des règles de sécurité ;</li>

        <li>sauver discrètement un imprudent ;</li>

        <li>humilier publiquement quelqu'un ;</li>

        <li>proposer une autre manière de faire ses preuves.</li>

        </ul>

        <p><strong>Conséquences :</strong></p>

        <ul>

        <li>valoriser l'audace brute augmente le prestige martial des PJ, mais
        encourage l'imitation ;</li>

        <li>valoriser la maîtrise donne aux PJ une image plus responsable, mais
        certains vétérans les trouvent mous ;</li>

        <li>humilier quelqu'un règle le problème immédiat, mais crée une
        rancune.</li>

        </ul>

        <hr>
