  - sort: 3700000
    name: 36 · Première heure de jeu
    type: text
    _id: 87d2a86429febfdd
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>19. Exemple de première heure de jeu</h1>

        <p>Cet exemple n'est <strong>pas un scénario obligatoire</strong>.</p>

        <h3>Arrivée</h3>

        <p>Les PJ découvrent l'Antre en activité.</p>

        <p>Thazz'rill hurle sur un péon.</p>

        <p>Deux recrues se disputent pour une histoire de sanglier.</p>

        <p>Yarrog discute tranquillement avec quelqu'un en réparant une
        sangle.</p>

        <h3>Contact</h3>

        <p>Gornek accueille les PJ et demande :</p>

        <blockquote>

        <p>« Vous savez pourquoi vous êtes ici ? »</p>

        </blockquote>

        <p>Il écoute leurs réponses.</p>

        <p>Il ne leur donne pas quatre quêtes.</p>

        <h3>Mouvement</h3>

        <p>Les PJ choisissent ce qui les attire :</p>

        <ul>

        <li>parler aux recrues ;</li>

        <li>aider le péon ;</li>

        <li>chercher leur mentor ;</li>

        <li>parler à Yarrog ;</li>

        <li>quitter l'Antre ;</li>

        <li>demander où trouver à manger.</li>

        </ul>

        <h3>Première conséquence</h3>

        <p>Quel que soit leur choix, <strong>quelqu'un se souvient
        d'eux</strong>.</p>

        <hr>
