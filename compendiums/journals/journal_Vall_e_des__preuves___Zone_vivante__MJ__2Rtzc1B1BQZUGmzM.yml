      content: >-
        <h2>ZUREETHA FARGAZE</h2>

        <p><strong>[CANON] liée aux vils familiers et au médaillon de la Lame
        ardente ; personnalité [ADAPTATION].</strong></p>

        <h3>Fonction</h3>

        <p>Introduire la différence entre :</p>

        <blockquote>

        <p><strong>danger naturel</strong> et <strong>menace qui n'a rien à
        faire ici</strong>.</p>

        </blockquote>

        <h3>Jeu</h3>

        <p>Zureetha examine avant de conclure.</p>

        <p>Une carcasse, une trace, une brûlure ou un morceau de tissu
        l'intéresse davantage qu'une rumeur.</p>

        <h3>Veut</h3>

        <p>Comprendre l'origine des manifestations démoniaques avant qu'elles ne
        s'installent durablement.</p>

        <h3>Craint</h3>

        <p>Deux erreurs :</p>

        <ul>

        <li>sous-estimer une infiltration réelle ;</li>

        <li>déclencher une chasse aux sorcières inutile.</li>

        </ul>

        <h3>Relation avec Gornek</h3>

        <p>Même objectif général, méthode différente.</p>

        <ul>

        <li>Gornek veut éviter la panique.</li>

        <li>Zureetha veut éviter le déni.</li>

        </ul>

        <p>Aucun des deux n'a automatiquement raison.</p>

        <h3>Avec les PJ</h3>

        <p>Elle valorise ceux qui distinguent clairement :</p>

        <ul>

        <li><strong>ce qu'ils ont vu</strong> ;</li>

        <li><strong>ce qu'ils pensent</strong> ;</li>

        <li><strong>ce qu'on leur a raconté</strong>.</li>

        </ul>

        <hr>
