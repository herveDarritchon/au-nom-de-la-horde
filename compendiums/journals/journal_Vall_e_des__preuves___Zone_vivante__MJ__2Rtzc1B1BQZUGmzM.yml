      content: >-
        <h2>CONTREMAÎTRE THAZZ'RILL</h2>

        <p><strong>[CANON] personnage lié aux péons et à sa pioche ;
        personnalité [ADAPTATION].</strong></p>

        <h3>Fonction</h3>

        <p>Faire sentir que la Horde se construit grâce à du travail réel.</p>

        <p>Il produit humour, friction et choix sociaux.</p>

        <h3>Jeu</h3>

        <p>Toujours couvert de poussière.</p>

        <p>Il considère qu'un outil mal rangé est une offense personnelle.</p>

        <h3>Veut</h3>

        <p>Que le travail soit fait <strong>aujourd'hui</strong>.</p>

        <h3>Craint</h3>

        <p>Être considéré comme incapable de tenir ses équipes.</p>

        <h3>Qualité</h3>

        <p>Il ne demande pas à un péon de porter une charge qu'il serait
        lui-même incapable de soulever.</p>

        <h3>Défaut</h3>

        <p>Il suppose trop facilement :</p>

        <blockquote>

        <p>problème = paresse.</p>

        </blockquote>

        <h3>Avec les PJ</h3>

        <p>Ils gagnent sa confiance en :</p>

        <ul>

        <li>travaillant vraiment ;</li>

        <li>réglant un conflit sans tout bloquer ;</li>

        <li>lui rapportant sa pioche ;</li>

        <li>tenant leur parole.</li>

        </ul>

        <p><strong>Ils l'humilient :</strong> il s'en souvient.</p>

        <p><strong>Ils lui donnent toujours raison :</strong> les péons les
        voient comme ses auxiliaires.</p>

        <p><strong>Ils lui prouvent qu'un péon avait raison :</strong> il râle,
        mais change sa consigne si les faits sont clairs.</p>

        <hr>
