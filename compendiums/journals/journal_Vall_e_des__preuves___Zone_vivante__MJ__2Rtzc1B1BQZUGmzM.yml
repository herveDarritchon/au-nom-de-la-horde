  - sort: 3600000
    name: 35 · Préparation de séance
    type: text
    _id: c40724f4f15063dd
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>18. Préparation minimale avant la séance</h1>

        <p>Avant que les PJ entrent dans la Vallée, décider seulement :</p>

        <ol>

        <li>

        <p><strong>Quel PJ est lié à Sarkoth ?</strong><br>

        Choisir le lien dans sa fiche dédiée.</p>

        </li>

        <li>

        <p><strong>Quel PJ possède un lien avec Yarrog ?</strong><br>

        Même léger.</p>

        </li>

        <li>

        <p><strong>Quelle recrue ou quel péon les joueurs peuvent-ils rapidement
        apprécier ?</strong><br>

        Korga, Druk, Morka, Grak ou une création liée à leurs historiques.</p>

        </li>

        <li>

        <p><strong>Quelle tension est déjà visible ?</strong><br>

        Épreuve / péons / Sarkoth / familiers / Yarrog.</p>

        </li>

        <li>

        <p><strong>Que se passera-t-il si les PJ ne s'en mêlent pas
        ?</strong><br>

        Une phrase suffit.</p>

        </li>

        </ol>

        <hr>
