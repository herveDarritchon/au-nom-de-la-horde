  - sort: 3200000
    name: 31 · Matrice d’impact
    type: text
    _id: c0faa2cfc47b0af7
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>14. Matrice d'impact</h1>

        <p>Le but n'est pas d'ajouter une jauge de réputation.</p>

        <p>La question est :</p>

        <blockquote>

        <p><strong>Qu'est-ce qui sera différent quand les PJ reviendront
        ?</strong></p>

        </blockquote>

        <table>

        <thead>

        <tr>

        <th>Décision</th>

        <th>Effet immédiat</th>

        <th>Effet visible plus tard</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Soutenir durement Thazz'rill</td>

        <td>chantier discipliné</td>

        <td>les péons parlent moins spontanément aux PJ</td>

        </tr>

        <tr>

        <td>Défendre les péons</td>

        <td>reconnaissance des travailleurs</td>

        <td>Thazz'rill exige que leur méthode prouve son efficacité</td>

        </tr>

        <tr>

        <td>Tuer Sarkoth</td>

        <td>prestige</td>

        <td>plateau libéré, nouvelle faune ou nouveaux chasseurs</td>

        </tr>

        <tr>

        <td>Épargner Sarkoth</td>

        <td>débat</td>

        <td>certains admirent les PJ, d'autres les trouvent trop tendres</td>

        </tr>

        <tr>

        <td>Sauver Hana'zua</td>

        <td>dette</td>

        <td>Hana'zua devient allié ou rival selon sa manière de vivre
        l'affaire</td>

        </tr>

        <tr>

        <td>Suivre un familier</td>

        <td>piste vers la source</td>

        <td>Yarrog peut comprendre qu'il est surveillé</td>

        </tr>

        <tr>

        <td>Accuser Yarrog trop tôt</td>

        <td>agitation</td>

        <td>il réduit son exposition et exploite le doute</td>

        </tr>

        <tr>

        <td>Capturer Yarrog</td>

        <td>preuve + prisonnier</td>

        <td>réseau perturbé mais pas détruit</td>

        </tr>

        <tr>

        <td>Tuer Yarrog</td>

        <td>menace immédiate supprimée</td>

        <td>informations perdues, réseau survivant plus difficile à lire</td>

        </tr>

        <tr>

        <td>Démasquer Yarrog avec preuves</td>

        <td>crise de confiance</td>

        <td>les recrues réévaluent leurs relations et certains contacts
        disparaissent</td>

        </tr>

        </tbody>

        </table>

        <hr>
