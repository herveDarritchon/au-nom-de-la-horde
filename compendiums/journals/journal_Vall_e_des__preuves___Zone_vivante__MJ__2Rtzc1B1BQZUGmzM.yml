        <h2>GALGAR</h2>

        <p><strong>[CANON] lié aux pommes de cactus ; développement
        [ADAPTATION].</strong></p>

        <h3>Fonction</h3>

        <p>Respiration et vie locale.</p>

        <p>Galgar rappelle que chaque PNJ n'est pas une conspiration.</p>

        <h3>Jeu</h3>

        <p>Il est excessivement fier de ses recettes.</p>

        <p>Il peut lancer des défis inoffensifs sur :</p>

        <ul>

        <li>le choix des pommes ;</li>

        <li>la cueillette ;</li>

        <li>la résistance aux épines ;</li>

        <li>la meilleure cuisson.</li>

        </ul>

        <p>Il peut fournir une rumeur parce que les jeunes viennent manger chez
        lui.</p>

        <p>Mais parfois :</p>

        <blockquote>

        <p>il veut simplement faire goûter quelque chose aux PJ.</p>

        </blockquote>

        <p>Et c'est très bien.</p>

        <hr>
