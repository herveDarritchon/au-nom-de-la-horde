  - sort: 2600000
    name: 25 · Situation 1 — Les péons
    type: text
    _id: f123ac6e60b13668
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>12. Situations ouvertes prêtes à jouer</h1>

        <h2>SITUATION 1 — Qui a besoin d'être réveillé ?</h2>

        <p>Trois péons ne travaillent pas.</p>

        <p>Leurs raisons sont différentes :</p>

        <ul>

        <li>l'un est réellement paresseux ;</li>

        <li>l'un a travaillé toute la nuit après un accident ;</li>

        <li>le troisième refuse de retourner près d'une crevasse où il a entendu
        quelque chose.</li>

        </ul>

        <p>Thazz'rill veut une solution immédiate.</p>

        <h3>Choix</h3>

        <p>Punir tout le monde ?<br>

        Enquêter ?<br>

        Réorganiser le travail ?<br>

        Aller voir la crevasse ?</p>

        <h3>Impact</h3>

        <p>La décision façonne :</p>

        <ul>

        <li>la relation avec Thazz'rill ;</li>

        <li>la manière dont les travailleurs parlent aux PJ ;</li>

        <li>éventuellement une première piste vers les familiers.</li>

        </ul>

        <hr>
