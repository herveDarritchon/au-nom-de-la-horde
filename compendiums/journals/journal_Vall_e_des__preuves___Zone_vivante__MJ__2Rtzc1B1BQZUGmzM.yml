  - sort: 600000
    name: 05 · Tension E — Yarrog écoute
    type: text
    _id: 23fc1e35deba5f02
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>E — Yarrog écoute</h2>

        <p>Yarrog se présente comme un démoniste de la Horde parmi d'autres.</p>

        <p>Il ne demande pas :</p>

        <blockquote>

        <p>« Veux-tu rejoindre la Lame ardente ? »</p>

        </blockquote>

        <p>Il demande :</p>

        <blockquote>

        <p>« Alors ? Comment ça se passe avec Gornek ? »</p>

        </blockquote>

        <p>Sa méthode :</p>

        <ol>

        <li>écouter ;</li>

        <li>rendre un service ;</li>

        <li>valoriser ;</li>

        <li>demander un petit service ;</li>

        <li>tester le secret ;</li>

        <li>seulement ensuite révéler davantage.</li>

        </ol>

        <p>Les PJ peuvent lui faire confiance, l'utiliser, le surveiller,
        l'accuser, le suivre, le capturer, le tuer ou le laisser croire qu'il
        n'est pas découvert.</p>

        <p><strong>Conséquences :</strong></p>

        <ul>

        <li>accusation sans preuve : Yarrog peut gagner en crédibilité et
        réduire ses activités visibles ;</li>

        <li>surveillance : accès possible à son réseau ;</li>

        <li>capture : informations mais interrogatoire difficile ;</li>

        <li>mort : preuve grâce au médaillon, mais réseau plus difficile à
        remonter ;</li>

        <li>démasquage public : crise de confiance parmi les jeunes
        recrutés.</li>

        </ul>

        <hr>
