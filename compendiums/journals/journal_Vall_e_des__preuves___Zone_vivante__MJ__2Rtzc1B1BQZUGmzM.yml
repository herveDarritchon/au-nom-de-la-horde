  - sort: 3800000
    name: 37 · Départ et retours ultérieurs
    type: text
    _id: cba93a07d5e4ceaf
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>20. Sortir de la Vallée</h1>

        <p>La Vallée n'est pas destinée à devenir le hub permanent de la
        saison.</p>

        <p>Son rôle est de donner aux PJ :</p>

        <ul>

        <li>des premières relations ;</li>

        <li>une première réputation ;</li>

        <li>une histoire personnelle ;</li>

        <li>une perception de la jeune Horde ;</li>

        <li>éventuellement une première menace non résolue.</li>

        </ul>

        <p>Ils peuvent emporter :</p>

        <ul>

        <li>la dette de Hana'zua ;</li>

        <li>le respect ou la rancune de Thazz'rill ;</li>

        <li>la confiance de Gornek ;</li>

        <li>un contact avec Zureetha ;</li>

        <li>un lien ambigu avec Yarrog ;</li>

        <li>une réputation liée à Sarkoth ;</li>

        <li>une piste vers la Lame ardente.</li>

        </ul>

        <p>Tous ces fils n'ont pas besoin d'être résolus avant le départ.</p>

        <blockquote>

        <p><strong>Un bon lieu de campagne continue d'exister après que les PJ
        l'ont quitté.</strong></p>

        </blockquote>

        <hr>

        <h1>21. Retour ultérieur</h1>

        <p>Si les PJ reviennent plus tard, ne présenter jamais exactement la
        même Vallée.</p>

        <p>Choisir :</p>

        <ol>

        <li><strong>une conséquence de leur passage</strong> ;</li>

        <li><strong>une évolution indépendante</strong> ;</li>

        <li><strong>une personne connue</strong>.</li>

        </ol>

        <h3>Exemples</h3>

        <p><strong>Sarkoth mort :</strong> des chasseurs utilisent désormais le
        plateau comme terrain d'épreuve.</p>

        <p><strong>Sarkoth vivant :</strong> on raconte que les PJ sont « ceux
        qui ont laissé le vieux scorpide en vie ».</p>

        <p><strong>Thazz'rill allié :</strong> il leur réserve un coin sec et du
        matériel.</p>

        <p><strong>Thazz'rill hostile :</strong></p>

        <blockquote>

        <p>« J'ai du travail. Vous aussi, sûrement. »</p>

        </blockquote>

        <p><strong>Yarrog échappé :</strong> une recrue a disparu.</p>

        <p><strong>Yarrog capturé :</strong> certains refusent encore de croire
        qu'il appartenait à la Lame ardente.</p>

        <p><strong>Repaire repris :</strong> la Horde utilise la sortie haute
        comme poste d'observation.</p>

        <hr>
