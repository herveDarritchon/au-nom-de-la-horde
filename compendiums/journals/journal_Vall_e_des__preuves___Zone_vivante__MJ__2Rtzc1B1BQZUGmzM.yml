  - sort: 2400000
    name: 23 · Scènes courtes (d10)
    type: text
    _id: 41c34c488be4fc68
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>10. Scènes courtes pour animer la Vallée</h1>

        <p>Utiliser une scène lorsque les PJ traversent la zone ou reviennent à
        l'Antre.</p>

        <p>Ne pas transformer chaque scène en quête.</p>

        <table>

        <thead>

        <tr>

        <th style="text-align:right">d10</th>

        <th>Scène</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="text-align:right">1</td>

        <td>Deux recrues se disputent pour savoir laquelle a réellement tué le
        sanglier dont elles rapportent la défense.</td>

        </tr>

        <tr>

        <td style="text-align:right">2</td>

        <td>Un péon dort réellement au travail. Thazz'rill arrive dans quelques
        secondes.</td>

        </tr>

        <tr>

        <td style="text-align:right">3</td>

        <td>Galgar cherche un volontaire pour goûter une recette beaucoup trop
        épicée.</td>

        </tr>

        <tr>

        <td style="text-align:right">4</td>

        <td>Une jeune recrue demande à un PJ comment il a obtenu une
        cicatrice.</td>

        </tr>

        <tr>

        <td style="text-align:right">5</td>

        <td>Zureetha compare les blessures laissées sur deux carcasses
        différentes.</td>

        </tr>

        <tr>

        <td style="text-align:right">6</td>

        <td>Yarrog aide calmement quelqu'un à réparer une sangle et écoute ses
        problèmes.</td>

        </tr>

        <tr>

        <td style="text-align:right">7</td>

        <td>Un scorpide s'est glissé sous un tas de matériel. Personne ne veut
        mettre la main dessous.</td>

        </tr>

        <tr>

        <td style="text-align:right">8</td>

        <td>Un mentor corrige brutalement mais efficacement la posture d'un
        élève.</td>

        </tr>

        <tr>

        <td style="text-align:right">9</td>

        <td>Hana'zua, s'il a survécu, entend quelqu'un raconter une version
        complètement fausse de son combat contre Sarkoth.</td>

        </tr>

        <tr>

        <td style="text-align:right">10</td>

        <td>Un groupe quitte la Vallée pour le reste de Durotar : pendant
        quelques instants, l'endroit redevient ce qu'il est vraiment, un lieu de
        départ.</td>

        </tr>

        </tbody>

        </table>

        <hr>
