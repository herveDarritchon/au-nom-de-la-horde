        <h2>HANA'ZUA</h2>

        <p><strong>[CANON] lié à Sarkoth ; personnalité
        [ADAPTATION].</strong></p>

        <h3>Fonction</h3>

        <p>Donner un visage humain à la pression sociale autour des
        épreuves.</p>

        <h3>Première apparition recommandée</h3>

        <p>Blessé et empoisonné, mais surtout furieux contre lui-même.</p>

        <p>Il ne veut pas devenir :</p>

        <blockquote>

        <p>« celui qui a perdu contre Sarkoth ».</p>

        </blockquote>

        <h3>Veut</h3>

        <p>Survivre sans perdre complètement la face.</p>

        <h3>Craint</h3>

        <p>La pitié davantage que la douleur.</p>

        <h3>Défaut</h3>

        <p>Il minimise sa blessure.</p>

        <h3>Qualité</h3>

        <p>Une fois sauvé, il ne ment pas sur ce qu'il a vu.</p>

        <h3>Dilemme</h3>

        <p>Il peut vouloir la mort de Sarkoth.</p>

        <p>Les PJ ne sont pas obligés d'être d'accord.</p>

        <p>S'ils épargnent l'animal, Hana'zua devra décider si cela représente
        pour lui :</p>

        <ul>

        <li>une sagesse ;</li>

        <li>une humiliation ;</li>

        <li>une dette.</li>

        </ul>

        <p>Cette réaction peut évoluer en jeu.</p>

        <hr>
