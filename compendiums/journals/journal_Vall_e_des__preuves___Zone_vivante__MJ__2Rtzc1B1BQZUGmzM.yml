      content: >-
        <h1>Vallée des Épreuves — Zone vivante</h1>

        <blockquote>

        <p><strong>Warbound — Au Nom de la Horde</strong><br>

        <strong>Région :</strong> Durotar<br>

        <strong>Usage :</strong> document MJ opérationnel<br>

        <strong>Fonction :</strong> faire de la Vallée des Épreuves une zone de
        jeu avec enjeux, conflits, choix et conséquences<br>

        <strong>Principe :</strong> reconnaissance WoW → incertitude → choix →
        conséquence → récompense</p>

        </blockquote>

        <hr>

        <h1>1. Intention de jeu</h1>

        <p>La Vallée des Épreuves ne doit pas être une zone tutorielle où les PJ
        enchaînent :</p>

        <blockquote>

        <p>tuer des sangliers → tuer des scorpides → réveiller des péons → tuer
        Sarkoth → tuer Yarrog.</p>

        </blockquote>

        <p>Elle doit donner immédiatement le ton de <strong>Warbound</strong>
        :</p>

        <blockquote>

        <p><strong>La Horde est en train de se construire. Ses membres essaient
        de trouver leur place, ses cadres prennent des décisions parfois
        discutables, la nature de Durotar reste dangereuse, et des ennemis
        exploitent déjà les fissures de cette jeune société.</strong></p>

        </blockquote>

        <p>Les personnages arrivent dans une Vallée qu'ils reconnaissent, mais
        où les situations n'ont plus une solution écrite d'avance.</p>

        <p>La zone doit permettre de :</p>

        <ul>

        <li>se faire une réputation ;</li>

        <li>choisir qui écouter ;</li>

        <li>défendre ou contester une décision ;</li>

        <li>nouer des relations récurrentes ;</li>

        <li>résoudre certaines situations autrement que dans WoW ;</li>

        <li>laisser derrière eux une Vallée différente de celle qu'ils ont
        trouvée.</li>

        </ul>

        <hr>

        <h1>2. Statut des éléments</h1>

        <h2>[CANON] — socle Warcraft Classic</h2>

        <p>La Vallée des Épreuves et l'Antre concentrent notamment :</p>

        <ul>

        <li><strong>Gornek</strong> ;</li>

        <li>les sangliers de <strong>La dent tranchante</strong> ;</li>

        <li>les scorpides de <strong>L'aiguillon du scorpide</strong> ;</li>

        <li><strong>Galgar</strong> et ses pommes de cactus ;</li>

        <li>les <strong>vils familiers</strong> ;</li>

        <li><strong>Contremaître Thazz'rill</strong>, les péons et sa pioche
        ;</li>

        <li><strong>Hana'zua</strong> et <strong>Sarkoth</strong> ;</li>

        <li><strong>Zureetha Fargaze</strong> et la présence de la Lame ardente
        ;</li>

        <li><strong>Yarrog Baneshadow</strong>, son médaillon et le Burning
        Blade Coven ;</li>

        <li>plusieurs scènes d'introduction vers des mentors de classe.</li>

        </ul>

        <h2>[ACQUIS] — Warbound</h2>

        <ul>

        <li><strong>Sarkoth est lié à l'historique d'un PJ.</strong></li>

        <li>Sarkoth reste un animal territorial : il n'est pas secrètement au
        service de la Lame ardente.</li>

        <li><strong>Yarrog</strong> est un recruteur clandestin, observateur et
        espion de la Lame ardente.</li>

        <li>Yarrog peut avoir un lien préalable avec un PJ et doit être
        intéressant <strong>avant</strong> d'être suspect.</li>

        <li>Le <strong>Burning Blade Coven</strong> devient dans la campagne le
        <strong>Repaire de la Lame ardente</strong>.</li>

        <li>Sa chambre de réunion est appelée <strong>le Cénacle</strong>.</li>

        <li>Le Repaire doit révéler une organisation, pas seulement fournir un
        boss à tuer.</li>

        </ul>

        <h2>[ADAPTATION]</h2>

        <p>Les tensions, personnalités détaillées, lieux secondaires, scènes de
        vie et conséquences ci-dessous sont des outils de campagne Warbound.</p>

        <hr>

        <h1>3. Question dramatique de la Vallée</h1>

        <blockquote>

        <p><strong>Que signifie « faire ses preuves » dans la nouvelle Horde
        ?</strong></p>

        </blockquote>

        <p>Pour certains :</p>

        <blockquote>

        <p>obéir, tenir bon et montrer qu'on est capable d'affronter
        Durotar.</p>

        </blockquote>

        <p>Pour d'autres :</p>

        <blockquote>

        <p>savoir quand un ordre est stupide, protéger les siens et ne pas
        gaspiller des vies.</p>

        </blockquote>

        <p>Pour Yarrog :</p>

        <blockquote>

        <p>comprendre que la Horde n'a peut-être pas de place pour vous… et
        qu'il existe d'autres personnes prêtes à vous écouter.</p>

        </blockquote>

        <p>La Vallée est donc un lieu d'<strong>initiation sociale autant que
        martiale</strong>.</p>

        <hr>
