  - sort: 3500000
    name: 34 · Trois registres de jeu
    type: text
    _id: cd377d402646c700
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <h1>17. Trois registres à alterner</h1>
        <h2>Vie</h2>
        <ul>
        <li>Galgar ;</li>
        <li>entraînement ;</li>
        <li>cuisine ;</li>
        <li>paris ;</li>
        <li>rivalités ;</li>
        <li>départs vers le reste de Durotar.</li>
        </ul>
        <h2>Danger</h2>
        <ul>
        <li>sangliers ;</li>
        <li>scorpides ;</li>
        <li>Sarkoth ;</li>
        <li>accidents ;</li>
        <li>terrain.</li>
        </ul>
        <h2>Ombre</h2>
        <ul>
        <li>familiers ;</li>
        <li>questions de Zureetha ;</li>
        <li>influence de Yarrog ;</li>
        <li>Repaire.</li>
        </ul>
        <h3>Règle</h3>
        <p>Ne jamais enchaîner systématiquement :</p>
        <blockquote>
        <p>vie → indice démoniaque<br>
        animal → indice démoniaque<br>
        péon → indice démoniaque<br>
        dispute → indice démoniaque.</p>
        </blockquote>
        <p>La Lame ardente est une menace réelle.</p>
        <p>Elle n'est pas l'explication de toute la Vallée.</p>
        <hr>
