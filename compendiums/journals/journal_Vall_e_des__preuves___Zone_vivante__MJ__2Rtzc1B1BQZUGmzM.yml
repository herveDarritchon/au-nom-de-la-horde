        <h1>8. PNJ secondaires prêts à jouer</h1>

        <p>Tous sont <strong>[ADAPTATION]</strong>.</p>

        <h2>Korga — recrue trop pressée</h2>

        <p>Jeune Orque persuadée que chaque problème est une occasion de prouver
        sa valeur.</p>

        <p><strong>Veut :</strong> être remarquée par Gornek.<br>

        <strong>Craint :</strong> passer pour ordinaire.<br>

        <strong>Détail :</strong> compte à voix haute les cicatrices qu'elle
        considère « méritées ».<br>

        <strong>Produit :</strong> défi, rivalité, accident, admiration sincère
        des PJ.</p>

        <h2>Druk — péon qui connaît tout le monde</h2>

        <p>Il travaille lentement, mais voit tout.</p>

        <p><strong>Veut :</strong> travailler sans se faire hurler dessus.<br>

        <strong>Craint :</strong> être envoyé dans un endroit vraiment
        dangereux.<br>

        <strong>Détail :</strong> donne un surnom à chaque outil.<br>

        <strong>Produit :</strong> humour, rumeurs, informations de terrain.</p>

        <p>Il n'est pas secrètement un grand espion.</p>

        <h2>Morka — chasseuse en devenir</h2>

        <p>Jeune chasseuse qui observe les bêtes plus qu'elle ne raconte ses
        exploits.</p>

        <p><strong>Veut :</strong> comprendre Durotar assez bien pour partir
        seule.<br>

        <strong>Craint :</strong> devoir tuer un animal uniquement pour
        impressionner quelqu'un.<br>

        <strong>Produit :</strong> contrepoint lors de l'affaire Sarkoth.</p>

        <h2>Grak — admirateur de Yarrog</h2>

        <p>Recrue qui cite souvent Yarrog :</p>

        <blockquote>

        <p>« Yarrog dit que… »</p>

        </blockquote>

        <p><strong>Veut :</strong> être pris au sérieux.<br>

        <strong>Craint :</strong> redevenir quelqu'un que personne n'écoute.</p>

        <p>Il n'est pas encore membre de la Lame ardente.</p>

        <p>Le sauver de Yarrog peut signifier simplement :</p>

        <blockquote>

        <p>lui offrir une autre relation dans laquelle il se sent reconnu.</p>

        </blockquote>

        <hr>
