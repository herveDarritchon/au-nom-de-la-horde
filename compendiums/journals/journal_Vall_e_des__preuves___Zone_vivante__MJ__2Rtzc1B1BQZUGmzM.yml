  - sort: 300000
    name: 02 · Tension B — Le travail des péons
    type: text
    _id: 54b13dbd6264d0d2
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>B — Qui porte réellement la nouvelle Horde ?</h2>

        <p>La Vallée est un lieu d'entraînement, mais aussi un lieu où l'on
        travaille. Les péons réparent, transportent, creusent et bâtissent.</p>

        <p><strong>Thazz'rill</strong> veut des résultats.</p>

        <p>Tous les péons n'ont pas la même raison de ralentir :</p>

        <ul>

        <li>l'un est réellement paresseux ;</li>

        <li>l'un est épuisé ;</li>

        <li>l'un refuse de retourner près d'une zone qu'il juge dangereuse
        ;</li>

        <li>un autre en a simplement assez d'être traité comme un idiot.</li>

        </ul>

        <p><strong>Choix possibles :</strong></p>

        <ul>

        <li>soutenir l'autorité de Thazz'rill ;</li>

        <li>défendre les péons ;</li>

        <li>travailler avec eux ;</li>

        <li>enquêter au cas par cas ;</li>

        <li>transformer le travail en compétition ;</li>

        <li>confronter Thazz'rill.</li>

        </ul>

        <p><strong>Conséquences :</strong></p>

        <ul>

        <li>soutenir Thazz'rill rend le contremaître loyal aux PJ, mais les
        péons leur parlent moins ;</li>

        <li>défendre les travailleurs leur donne des contacts utiles, mais
        irrite Thazz'rill ;</li>

        <li>trouver un compromis crée une relation durable avec les deux
        côtés.</li>

        </ul>

        <hr>
