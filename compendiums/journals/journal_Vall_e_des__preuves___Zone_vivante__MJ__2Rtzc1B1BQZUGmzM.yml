  - sort: 2900000
    name: 28 · Situation 4 — Le familier qui fuit
    type: text
    _id: 8fee0f1e91db0157
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>SITUATION 4 — Le familier qui fuit</h2>

        <p>Un vil familier est surpris près de l'Antre.</p>

        <p>S'il est attaqué, il tente de fuir.</p>

        <h3>Choix</h3>

        <p><strong>Le tuer :</strong> danger supprimé.</p>

        <p><strong>Le suivre :</strong> danger encore actif, mais piste
        nouvelle.</p>

        <p><strong>Le capturer :</strong> Zureetha peut l'étudier.</p>

        <h3>Impact</h3>

        <p>La manière d'agir détermine combien de temps Yarrog dispose pour
        comprendre qu'on se rapproche de lui.</p>

        <hr>
