        <h1>8. Création des personnages — 25 à 35 min</h1>

        <p>Ne pas faire remplir un questionnaire de quinze questions.</p>

        <p>Chaque joueur doit pouvoir présenter son personnage avec
        <strong>quatre réponses</strong>.</p>

        <h2>Les quatre questions</h2>

        <h3>1. Qui es-tu ?</h3>

        <blockquote>

        <p>Nom, peuple, classe et concept en une phrase.</p>

        </blockquote>

        <p>Exemple :</p>

        <blockquote>

        <p>« Je suis un jeune chasseur troll Sombrelance qui veut prouver qu'il
        peut servir la Horde sans renier les traditions de son peuple. »</p>

        </blockquote>

        <h3>2. Pourquoi es-tu aujourd'hui à Razor Hill ?</h3>

        <p>Une raison simple suffit :</p>

        <ul>

        <li>affectation ;</li>

        <li>voyage ;</li>

        <li>commerce ;</li>

        <li>recherche de travail ;</li>

        <li>entraînement ;</li>

        <li>escorte ;</li>

        <li>visite ;</li>

        <li>recherche de quelqu'un ;</li>

        <li>ordre reçu ;</li>

        <li>passage vers Orgrimmar ;</li>

        <li>autre raison proposée par le joueur.</li>

        </ul>

        <h3>3. Qu'est-ce que tu cherches ?</h3>

        <p>Pas nécessairement un objectif de campagne.</p>

        <p>Exemples :</p>

        <ul>

        <li>gloire ;</li>

        <li>argent ;</li>

        <li>reconnaissance ;</li>

        <li>connaissance ;</li>

        <li>puissance ;</li>

        <li>indépendance ;</li>

        <li>un maître ;</li>

        <li>une place dans la Horde ;</li>

        <li>protéger quelqu'un ;</li>

        <li>réparer une faute ;</li>

        <li>voir le monde.</li>

        </ul>

        <h3>4. Pourquoi partirais-tu à l'aventure avec ce groupe ?</h3>

        <p>La réponse peut être simple :</p>

        <ul>

        <li>camaraderie ;</li>

        <li>dette ;</li>

        <li>ordre commun ;</li>

        <li>intérêt ;</li>

        <li>amitié ;</li>

        <li>nécessité ;</li>

        <li>ambition ;</li>

        <li>famille ;</li>

        <li>confiance professionnelle.</li>

        </ul>

        <hr>

        <h1>9. Construire le groupe — 10 min</h1>

        <p>Le but n'est pas de créer quatre inconnus qui attendent qu'un PNJ les
        réunisse.</p>

        <h2>Question collective</h2>

        <blockquote>

        <p><strong>Pourquoi est-il naturel que vos personnages agissent ensemble
        lorsqu'un problème se présente ?</strong></p>

        </blockquote>

        <p>Obtenir <strong>une phrase de groupe</strong>.</p>

        <p>Exemples :</p>

        <blockquote>

        <p>« Nous avons déjà effectué plusieurs escortes ensemble pour la Horde.
        »</p>

        </blockquote>

        <blockquote>

        <p>« Nous sommes tous arrivés récemment à Razor Hill et nous avons
        décidé de chercher du travail ensemble. »</p>

        </blockquote>

        <blockquote>

        <p>« Deux d'entre nous se connaissent déjà et les autres ont rejoint le
        groupe au cours du voyage. »</p>

        </blockquote>

        <blockquote>

        <p>« Un même supérieur nous a envoyés à Razor Hill, mais nous restons
        libres de nos méthodes. »</p>

        </blockquote>

        <h2>Option rapide : un lien chacun</h2>

        <p>Si le temps le permet, chaque joueur complète une seule phrase
        concernant un autre PJ :</p>

        <blockquote>

        <p><strong>« Je sais que je peux compter sur lui/elle parce que…
        »</strong></p>

        </blockquote>

        <p>Pas besoin d'écrire une histoire complète.</p>

