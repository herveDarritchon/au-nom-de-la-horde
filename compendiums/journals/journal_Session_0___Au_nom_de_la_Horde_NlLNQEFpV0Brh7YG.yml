    text:
      format: 1
      content: >-
        <h1>20. Sources de cadrage du projet</h1>

        <p>Ce conducteur synthétise les choix déjà établis dans les documents de
        campagne :</p>

        <ul>

        <li><strong>Campagne Horde — De Durotar à Ragefire Chasm</strong> :
        promesse de campagne, cinq mouvements, reconnaissance avant subversion,
        premier incident du convoi et vol sélectif de matériel.</li>

        <li><strong>Durotar — Guide de zone et pointcrawl — Saison 1</strong> :
        Razor Hill comme hub, Durotar comme territoire de saison, situations
        évolutives, information comme récompense et persistance des
        conséquences.</li>

        <li><strong>Durotar — Quêtes WoW Classic adaptées à Champions of
        Azeroth</strong> : conversion du convoi de Thunder Ridge / Drygulch en
        situation ouverte et premier indice du sabotage ciblé.</li>

        <li><strong>Charte WoW → Champions of Azeroth</strong> : logique de
        conception « Reconnaissance → Incertitude → Choix → Conséquence →
        Récompense ».</li>

        <li><strong>Chroniques Oubliées Fantasy 2</strong> : progression par
        niveau et acquisition de capacités ; Warbound conserve le moteur COF2 en
        l'adaptant au ressenti Warcraft.</li>

        </ul>

        <hr>
