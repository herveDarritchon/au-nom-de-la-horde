      content: >-
        <h1>18. Checklist juste avant de lancer la partie</h1>

        <ul>

        <li>[ ] Niveau de départ définitivement fixé.</li>

        <li>[ ] Règles Warbound de création annoncées clairement.</li>

        <li>[ ] Personnages disponibles dans Foundry.</li>

        <li>[ ] Razor Hill prêt à être montré.</li>

        <li>[ ] Ambiance musicale Durotar prête.</li>

        <li>[ ] Convoi / survivant disponibles si nécessaire.</li>

        <li>[ ] Aucun marqueur ou journal joueur ne révèle la structure du fil
        rouge.</li>

        <li>[ ] Les joueurs voient une carte du monde, pas une checklist de
        scénarios.</li>

        <li>[ ] Les secrets de Ragefire restent entièrement côté MJ.</li>

        <li>[ ] Je suis prêt à terminer la soirée sur <strong>leur
        décision</strong>, même si ce n'est pas celle que j'avais
        anticipée.</li>

        </ul>

        <hr>

        <h1>19. Fiche MJ ultra-courte</h1>

        <p>Si je dois mener toute la soirée avec une seule page mentale :</p>

        <blockquote>

        <p><strong>PROMESSE</strong><br>

        Durotar familier, mais un monde de JdR où les choix changent réellement
        les choses.</p>

        <p><strong>STRUCTURE</strong><br>

        Razor Hill → plusieurs pistes → choix des PJ → excursion → conséquences
        → retour.</p>

        <p><strong>ATTENTE</strong><br>

        Les joueurs sont acteurs. Je prépare les situations, pas leurs
        solutions.</p>

        <p><strong>COMBAT</strong><br>

        Pas de grind. Un combat doit avoir un enjeu.</p>

        <p><strong>PROGRESSION</strong><br>

        Jalons + capacités + contacts + réputation + informations + accès.</p>

        <p><strong>WOW</strong><br>

        Les souvenirs sont bienvenus, mais ne donnent pas automatiquement la
        vérité.</p>

        <p><strong>PERSONNAGES</strong><br>

        Qui es-tu ? Pourquoi Razor Hill ? Que cherches-tu ? Pourquoi ce groupe
        ?</p>

        <p><strong>PROLOGUE</strong><br>

        Razor Hill vit → le convoi arrive endommagé → les richesses sont
        intactes → du matériel technique manque.</p>

        <p><strong>FIN</strong><br>

        « Qu'est-ce que vous décidez de faire ? »</p>

        <p><strong>SESSION 1</strong><br>

        Commencer directement par leur réponse.</p>

        </blockquote>

        <hr>

        <h1>Principe final</h1>

        <blockquote>

        <p><strong>Je ne vais pas raconter aux joueurs une histoire dans
        Warcraft.</strong></p>

        <p><strong>Je vais mettre Durotar en mouvement, leur donner des raisons
        de s'y intéresser, puis leur demander ce qu'ils décident d'en
        faire.</strong></p>

        </blockquote>
