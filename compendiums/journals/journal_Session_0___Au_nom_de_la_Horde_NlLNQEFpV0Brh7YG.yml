        <h1>WARBOUND — AU NOM DE LA HORDE</h1>

        <h2>Session 0 — Prendre en main la campagne</h2>

        <blockquote>

        <p><strong>But de ce soir :</strong> les joueurs doivent comprendre
        <strong>comment fonctionne la campagne</strong>, créer des personnages
        qui ont une raison d'agir ensemble, puis <strong>prendre leur première
        décision de campagne avant la fin de la séance</strong>.</p>

        </blockquote>

        <hr>

        <h1>0. Résultat attendu</h1>

        <p>À la fin de la Session 0, les joueurs doivent savoir :</p>

        <ul>

        <li>quel type de campagne ils vont jouer ;</li>

        <li>pourquoi <strong>Durotar</strong> est le territoire principal de la
        Saison 1 ;</li>

        <li>pourquoi <strong>Razor Hill</strong> est leur point d'attache ;</li>

        <li>comment fonctionne le <strong>bac à sable cadré</strong> ;</li>

        <li>que plusieurs situations peuvent exister en même temps ;</li>

        <li>qu'ils choisissent eux-mêmes ce qu'ils poursuivent ;</li>

        <li>que le monde continue d'évoluer lorsqu'ils n'interviennent pas
        ;</li>

        <li>que résoudre un problème ne signifie pas nécessairement combattre
        ;</li>

        <li>comment fonctionne la progression des personnages et de leur
        influence dans le monde ;</li>

        <li>pourquoi leurs connaissances de <em>World of Warcraft</em> sont
        utiles sans être un mode d'emploi de la campagne ;</li>

        <li>pourquoi leurs personnages vont agir ensemble.</li>

        </ul>

        <p>Et surtout :</p>

        <blockquote>

        <p><strong>La Session 1 doit commencer par une décision prise par les
        joueurs pendant la Session 0.</strong></p>

        </blockquote>

        <hr>

        <h1>1. Plan de la soirée</h1>

        <p>Durée cible : <strong>environ 2 heures</strong>.</p>

        <table>

        <thead>

        <tr>
          <th style="text-align:right">Temps</th>
          <th>Séquence</th>
          <th>Objectif</th>
        </tr>

        </thead>

        <tbody>

        <tr>
          <td style="text-align:right">5 min</td>
          <td>Pitch</td>
          <td>Comprendre la promesse</td>
        </tr>

        <tr>
          <td style="text-align:right">15 min</td>
          <td>Comment fonctionne la campagne</td>
          <td>Comprendre le bac à sable cadré</td>
        </tr>

        <tr>
          <td style="text-align:right">10 min</td>
          <td>Ce que j'attends des joueurs</td>
          <td>Installer la prise d'initiative</td>
        </tr>

        <tr>
          <td style="text-align:right">10 min</td>
          <td>Progression et récompenses</td>
          <td>Comprendre ce qui fait avancer les PJ</td>
        </tr>

        <tr>
          <td style="text-align:right">5 min</td>
          <td>WoW, Warbound et le métagame</td>
          <td>Poser le rapport au MMO</td>
        </tr>

        <tr>
          <td style="text-align:right">25–35 min</td>
          <td>Personnages</td>
          <td>Finaliser le concept et les mécaniques</td>
        </tr>

        <tr>
          <td style="text-align:right">10 min</td>
          <td>Construire le groupe</td>
          <td>Donner une raison d'agir ensemble</td>
        </tr>

        <tr>
          <td style="text-align:right">20–30 min</td>
          <td>Prologue à Razor Hill</td>
          <td>Entrer réellement dans la campagne</td>
        </tr>

        <tr>
          <td style="text-align:right">5 min</td>
          <td>Première décision</td>
          <td>Déterminer le départ de la Session 1</td>
        </tr>

        </tbody>

        </table>

        <blockquote>

        <p><strong>Si le temps manque :</strong> raccourcir les discussions de
        background.<br>

        <strong>Ne pas supprimer le prologue.</strong> Le but est que la soirée
        se termine sur du jeu et sur une décision des PJ.</p>

        </blockquote>

        <hr>
