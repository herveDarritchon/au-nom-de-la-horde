    text:
      format: 1
      content: >-
        <h1>15. Secrets MJ — ne pas révéler pendant la Session 0</h1>

        <h2>Ce que les joueurs peuvent voir</h2>

        <ul>

        <li>une attaque réelle ;</li>

        <li>des victimes réelles ;</li>

        <li>une cargaison réellement volée ;</li>

        <li>un choix étrange dans ce qui a été emporté ;</li>

        <li>plusieurs priorités possibles.</li>

        </ul>

        <h2>Ce qu'ils ne doivent pas encore savoir</h2>

        <ul>

        <li>que ce vol appartient au fil rouge de la saison ;</li>

        <li>que les vols et sabotages vont converger vers un même projet ;</li>

        <li>les motivations réelles du groupe responsable ;</li>

        <li>l'existence ou le rôle futur d'un chaman renégat ;</li>

        <li>la véritable raison pour laquelle certains travaux sont ciblés
        ;</li>

        <li>le rôle futur du commanditaire de la Horde ;</li>

        <li>la nature du danger situé dans les profondeurs ;</li>

        <li>le renversement prévu autour de Ragefire Chasm.</li>

        </ul>

        <h2>Règle d'or</h2>

        <blockquote>

        <p><strong>Ne jamais mentir avec les indices.</strong></p>

        <p>Les joueurs doivent pouvoir mal interpréter des faits vrais.</p>

        <p>La révélation future doit leur permettre de repenser aux premiers
        événements et de se dire :</p>

        <p><strong>« Tout était déjà là. On ne comprenait simplement pas encore
        pourquoi. »</strong></p>

        </blockquote>

        <hr>

        <h1>16. Si les joueurs prennent une direction imprévue</h1>

        <p>Ne pas chercher à les remettre immédiatement sur « le scénario ».</p>

        <h2>Ils veulent ignorer le convoi</h2>

        <p>Très bien.</p>

        <p>Demander ce qu'ils font à la place.</p>

        <p>Le convoi et ses conséquences continueront d'exister.</p>

        <h2>Ils veulent accompagner le blessé</h2>

        <p>Très bien.</p>

        <p>Cette scène peut leur permettre d'obtenir témoignages, contacts et
        informations.</p>

        <h2>Ils veulent alerter immédiatement Orgrimmar</h2>

        <p>Très bien.</p>

        <p>L'information remonte dans la chaîne de commandement, mais ils ne
        reçoivent pas automatiquement la vérité en retour.</p>

        <h2>Ils veulent retrouver la cargaison</h2>

        <p>Très bien.</p>

        <p>La Session 1 commencera par cette piste.</p>

        <h2>Ils veulent poursuivre immédiatement les assaillants</h2>

        <p>Très bien.</p>

        <p>Terminer la Session 0 au moment où ils quittent Razor Hill.</p>

        <h2>Ils accusent immédiatement une faction connue de WoW</h2>

        <p>Ne pas corriger leur théorie.</p>

        <p>Demander :</p>

        <blockquote>

        <p><strong>« Qu'est-ce qui vous fait penser ça ? »</strong></p>

        </blockquote>

        <p>Puis laisser les faits confirmer ou infirmer progressivement leur
        hypothèse.</p>

        <hr>
