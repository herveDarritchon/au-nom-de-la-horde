  - sort: 400000
    name: Prologue — Razor Hill
    type: text
    _id: 99df86e2abc49d35
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>10. Prologue joué — Razor Hill — 20 à 30 min</h1>

        <blockquote>

        <p><strong>Cette partie est obligatoire.</strong></p>

        <p>Ne pas terminer la Session 0 après la création des fiches.</p>

        </blockquote>

        <hr>

        <h2>10.1 Mise en scène</h2>

        <p>Lancer l'ambiance sonore de Durotar.</p>

        <p>Afficher Razor Hill ou une vue générale de Durotar.</p>

        <p>Puis lire ou reformuler :</p>

        <blockquote>

        <p>La chaleur de Durotar écrase la terre rouge.</p>

        <p>Le vent soulève par moments une poussière sèche qui vient se coller
        aux bottes, aux sabots, aux roues des chariots et aux palissades.</p>

        <p>Razor Hill n'est pas une grande ville. C'est un carrefour de la Horde
        : des gardes, des peons, des chasseurs, des artisans, des voyageurs et
        des convois qui remontent vers Orgrimmar ou descendent vers Sen'jin.</p>

        <p>Au nord, derrière les reliefs, se trouve la capitale.</p>

        <p>Ici, personne n'attend immobile qu'un aventurier vienne cliquer sur
        lui.</p>

        <p>Tout le monde a quelque chose à faire.</p>

        <p>Et aujourd'hui, vous êtes là.</p>

        </blockquote>

        <p>Puis faire un tour de table :</p>

        <blockquote>

        <p><strong>« Où est ton personnage à cet instant, et qu'est-il en train
        de faire ? »</strong></p>

        </blockquote>

        <p>Une ou deux phrases chacun.</p>

        <p>Ne pas créer de grande scène individuelle.</p>

        <p>Le but est seulement de les faire <strong>entrer dans Razor
        Hill</strong>.</p>

        <hr>

        <h1>11. L'incident — le convoi</h1>

        <p>Après quelques minutes de jeu, introduire l'événement.</p>

        <h2>Déclenchement</h2>

        <blockquote>

        <p>Des voix s'élèvent du côté de la route du nord.</p>

        <p>Quelques habitants se retournent.</p>

        <p>Un kodo apparaît dans la poussière.</p>

        <p>Il tire un chariot dont une roue est voilée et dont un côté porte
        plusieurs impacts.</p>

        <p>Le conducteur tient à peine assis.</p>

        <p>Derrière lui…</p>

        <p><strong>le second chariot du convoi n'est pas là.</strong></p>

        </blockquote>

        <p>Laisser les joueurs réagir.</p>

        <p>Ne pas faire arriver immédiatement un officier qui leur donne une
        mission.</p>

        <hr>

        <h1>12. Ce que les PJ peuvent apprendre</h1>

        <p>Les informations importantes ne doivent pas être bloquées derrière un
        jet obligatoire.</p>

        <h2>Évidence immédiate</h2>

        <p>Ils peuvent constater rapidement :</p>

        <ul>

        <li>le convoi a été attaqué ;</li>

        <li>le conducteur est blessé ;</li>

        <li>d'autres membres du convoi manquent ;</li>

        <li>plusieurs caisses ont été ouvertes ;</li>

        <li>une partie de la cargaison a disparu ;</li>

        <li>le convoi venait du nord / empruntait les routes de Durotar.</li>

        </ul>

        <h2>En examinant la cargaison</h2>

        <p>Ils peuvent découvrir :</p>

        <ul>

        <li>les vivres sont encore là ;</li>

        <li>l'essentiel des armes est encore là ;</li>

        <li>l'argent ou les biens immédiatement revendables n'ont pas été pris
        ;</li>

        <li>les disparitions concernent des caisses beaucoup moins séduisantes
        pour des pillards ordinaires.</li>

        </ul>

        <h2>En demandant ce qui manque</h2>

        <p>Un peon, artisan, garde chargé de l'inventaire ou survivant peut
        expliquer qu'il manque essentiellement :</p>

        <ul>

        <li>des outils ;</li>

        <li>des pièces métalliques ;</li>

        <li>du matériel de soutènement ;</li>

        <li>du matériel utilisé pour des travaux lourds / de forage.</li>

        </ul>

        <blockquote>

        <p><strong>Ne pas présenter ce détail comme une révélation
        majeure.</strong></p>

        <p>À ce stade, il doit seulement provoquer :</p>

        <p><strong>« C'est bizarre. Pourquoi voler ça ? »</strong></p>

        </blockquote>

        <hr>

        <h1>13. Le premier choix</h1>

        <p>Créer plusieurs urgences sans les transformer en menu de jeu
        vidéo.</p>

        <p>Selon les questions des joueurs, faire émerger naturellement :</p>

        <ul>

        <li><strong>le blessé</strong> — son état demande peut-être des soins
        ;</li>

        <li><strong>les disparus</strong> — tout le monde n'est pas revenu
        ;</li>

        <li><strong>la scène de l'attaque</strong> — elle peut contenir des
        traces ;</li>

        <li><strong>les assaillants</strong> — ils ont probablement encore de
        l'avance ;</li>

        <li><strong>la cargaison</strong> — comprendre exactement ce qui manque
        ;</li>

        <li><strong>la route</strong> — faut-il prévenir ou protéger d'autres
        voyageurs ?</li>

        </ul>

        <p>Puis demander :</p>

        <blockquote>

        <p><strong>« Qu'est-ce que vous voulez faire ? »</strong></p>

        </blockquote>

        <p>Ne pas suggérer la meilleure réponse.</p>

        <p>Laisser le groupe discuter.</p>

        <hr>

        <h1>14. Fin de la Session 0</h1>

        <p>Lorsque le groupe s'est mis d'accord :</p>

        <blockquote>

        <p><strong>« Très bien. Donc votre priorité est… »</strong></p>

        </blockquote>

        <p>Reformuler précisément leur décision.</p>

        <p>Exemples :</p>

        <blockquote>

        <p>« Vous commencez par retrouver les disparus. »</p>

        </blockquote>

        <blockquote>

        <p>« Vous repartez immédiatement sur les traces des assaillants. »</p>

        </blockquote>

        <blockquote>

        <p>« Vous restez d'abord à Razor Hill pour comprendre ce qui a été volé
        et pourquoi. »</p>

        </blockquote>

        <blockquote>

        <p>« Vous sécurisez le blessé puis vous retournez sur le lieu de
        l'attaque. »</p>

        </blockquote>

        <p>Puis conclure :</p>

        <blockquote>

        <p><strong>« C'est là que commencera notre première véritable aventure.
        »</strong></p>

        </blockquote>

        <p>La Session 1 commencera donc <strong>par leur plan</strong>, pas par
        une quête imposée.</p>

        <hr>
