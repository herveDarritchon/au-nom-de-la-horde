        <h1>2. Pitch de la campagne — 5 min</h1>

        <h2>À dire aux joueurs</h2>

        <blockquote>

        <p>Vous allez jouer de jeunes aventuriers, membres ou alliés de la
        Horde, dans <strong>Durotar</strong>.</p>

        <p>Pendant la première saison, Durotar sera notre véritable terrain de
        jeu. <strong>Razor Hill sera votre point d'attache</strong> : l'endroit
        où vous revenez, où vous retrouvez des gens, où vous entendez parler de
        ce qui se passe et où vous voyez les conséquences de vos actions.</p>

        <p>Vous allez reconnaître énormément de choses de <em>World of
        Warcraft</em> : les lieux, les peuples, les créatures, certaines
        factions, certains personnages et certaines situations.</p>

        <p>Mais le principe n'est pas de refaire les quêtes du MMO avec des
        dés.</p>

        <p>Ici, vous pourrez enquêter, négocier, prendre parti, vous tromper,
        contourner un problème, laisser une situation de côté, revenir plus tard
        et surtout <strong>changer ce qui se passe</strong>.</p>

        <p>Il existe une véritable intrigue de campagne. Mais elle ne vous sera
        pas donnée sous la forme d'une suite de quêtes principales à suivre dans
        l'ordre.</p>

        <p><strong>Vous allez la découvrir en jouant.</strong></p>

        </blockquote>

        <h2>Message essentiel</h2>

        <blockquote>

        <p><strong>WoW vous donne un monde familier. Le JdR vous donne la
        liberté d'agir dessus.</strong></p>

        </blockquote>

        <hr>

        <h1>3. Expliquer le bac à sable cadré — 15 min</h1>

        <p>Ne pas vendre la campagne comme un « sandbox total ».</p>

        <p>Elle possède :</p>

        <ul>

        <li>un territoire clairement défini ;</li>

        <li>des acteurs et factions ;</li>

        <li>des situations qui évoluent ;</li>

        <li>un fil rouge ;</li>

        <li>une progression dramatique ;</li>

        <li>une destination finale vers laquelle certains événements
        convergeront.</li>

        </ul>

        <p>Mais <strong>le trajet appartient aux joueurs</strong>.</p>

        <h2>Schéma à montrer</h2>

        <pre><code class="language-text">                         DUROTAR
                                    │
                                    ▼
                               RAZOR HILL
                              votre point d'ancrage
                                    │
                   ┌────────────────┼────────────────┐
                   ▼                ▼                ▼
               rumeurs          incidents         personnes
               problèmes         pistes            occasions
                   │                │                │
                   └────────────────┼────────────────┘
                                    ▼
                            VOUS CHOISISSEZ
                                    │
                                    ▼
                          préparation / départ
                                    │
                                    ▼
                    exploration • enquête • social
                      danger • combat éventuel
                                    │
                                    ▼
                               CONSÉQUENCES
                                    │
                                    ▼
                             retour à Razor Hill
                                    │
                                    ▼
                     le monde a changé / nouvelles pistes
        </code></pre>

        <h2>À dire aux joueurs</h2>

        <blockquote>

        <p>À certains moments, vous aurez plusieurs pistes devant vous.</p>

        <p>Je ne vous dirai pas systématiquement laquelle est « la bonne » ou
        laquelle est « la quête principale ».</p>

        <p><strong>C'est vous qui déciderez ce qui mérite votre
        attention.</strong></p>

        <p>Une affaire que vous laissez de côté ne sera pas forcément congelée
        jusqu'à votre retour. Des personnages et des factions continueront
        d'agir.</p>

        <p>Certaines situations seront liées entre elles. D'autres n'auront
        absolument rien à voir.</p>

        <p>Vous ne pourrez probablement pas tout régler, et c'est
        volontaire.</p>

        </blockquote>

        <h2>Exemple abstrait à donner</h2>

        <blockquote>

        <p>Imaginons que vous appreniez au même moment :</p>

        <ul>

        <li>qu'une patrouille a disparu ;</li>

        <li>qu'un marchand affirme que ses convois sont attaqués ;</li>

        <li>qu'un habitant de Razor Hill cherche quelqu'un ;</li>

        <li>et qu'un voyageur rapporte un problème à Sen'jin.</li>

        </ul>

        <p>Ce n'est pas une liste de quatre quêtes à nettoyer.</p>

        <p>Vous choisissez ce qui vous intéresse, ce qui vous paraît urgent ou
        ce qui concerne votre personnage.</p>

        </blockquote>

        <h2>À ne PAS dire</h2>

        <p>Ne pas révéler :</p>

        <ul>

        <li>combien de « zones de contenu » sont préparées ;</li>

        <li>combien de donjons existent ;</li>

        <li>quelles situations appartiennent au fil rouge ;</li>

        <li>quelles pistes sont « principales » ou « secondaires » ;</li>

        <li>vers quoi converge exactement l'intrigue.</li>

        </ul>

        <blockquote>

        <p><strong>Le joueur doit voir Durotar. Pas l'architecture du scénario
        située derrière Durotar.</strong></p>

        </blockquote>

        <hr>

        <h1>4. Ce que j'attends des joueurs — 10 min</h1>

        <h2>À dire clairement</h2>

        <blockquote>

        <p>Cette campagne fonctionne mieux si vos personnages sont
        <strong>acteurs</strong>.</p>

        <p>Je vais mettre devant vous des lieux, des personnes, des tensions,
        des rumeurs, des indices et des problèmes.</p>

        <p>J'attends de vous que vous posiez des questions, que vous discutiez
        entre vous et que vous décidiez ce que vous voulez faire.</p>

        <p>Je ne vais pas toujours terminer une scène en disant :</p>

        <p>« Votre prochaine mission consiste à… »</p>

        <p>Parfois la question sera simplement :</p>

        <p><strong>« Qu'est-ce que vous faites ? »</strong></p>

        </blockquote>

        <h3>Les cinq comportements que la campagne récompense</h3>

        <ol>

        <li><p><strong>Être curieux</strong><br>

        Interroger, observer, fouiller, écouter, confronter des versions.</p>

        </li>

        <li><p><strong>Prendre des décisions</strong><br>

        Choisir une piste signifie parfois en laisser une autre évoluer.</p>

        </li>

        <li><p><strong>Prendre des initiatives</strong><br>

        Aller voir quelqu'un, tendre un piège, proposer un accord, surveiller un
        lieu, préparer une expédition.</p>

        </li>

        <li><p><strong>Accepter les conséquences</strong><br>

        Une bonne décision n'est pas forcément une décision sans coût.</p>

        </li>

        <li><p><strong>Chercher des solutions de JdR</strong><br>

        Négociation, intimidation, infiltration, exploration, ruse, alliances,
        fuite, capture ou combat.</p>

        </li>

        </ol>

        <h2>Règle MJ à annoncer</h2>

        <blockquote>

        <p>Si vous inventez une solution à laquelle je n'avais pas pensé, ce
        n'est pas un problème.</p>

        <p><strong>Je ne prépare pas vos solutions. Je prépare les situations et
        leurs réactions.</strong></p>

        </blockquote>

        <hr>

        <h1>5. Combat : nous ne jouons pas à WoW avec des dés — 5 min</h1>

        <h2>À dire</h2>

        <blockquote>

        <p>Dans <em>World of Warcraft</em>, tuer des créatures est une activité
        fondamentale.</p>

        <p>Ici, un combat prend beaucoup plus de temps et doit servir quelque
        chose.</p>

        <p>Vous pouvez éviter une confrontation, faire fuir des adversaires,
        capturer quelqu'un, négocier, contourner une patrouille ou obtenir votre
        objectif sans initiative.</p>

        <p><strong>Éviter intelligemment un combat n'est pas rater du
        contenu.</strong></p>

        <p>Inversement, lorsqu'un combat important aura lieu, il devra avoir un
        enjeu : protéger quelqu'un, empêcher une fuite, tenir une position,
        récupérer quelque chose, interrompre une action, survivre à une
        situation ou obtenir une information.</p>

        </blockquote>

        <h3>Conséquence importante</h3>

        <p>Les personnages ne doivent pas être pensés uniquement comme :</p>

        <ul>

        <li>tank ;</li>

        <li>DPS ;</li>

        <li>heal.</li>

        </ul>

        <p>Ils sont des personnages de JdR ayant aussi :</p>

        <ul>

        <li>des connaissances ;</li>

        <li>des compétences sociales ;</li>

        <li>des contacts ;</li>

        <li>des capacités d'exploration ;</li>

        <li>des convictions ;</li>

        <li>des moyens d'agir sur le monde.</li>

        </ul>

        <hr>

        <h1>6. Progression — 10 min</h1>

        <h2>6.1 Progression mécanique</h2>

        <blockquote>

        <p>Vous ne gagnerez pas vos niveaux parce que vous avez tué suffisamment
        de monstres.</p>

        <p>La progression se fera <strong>par étapes importantes de l'aventure
        et de la campagne</strong>.</p>

        <p>Résoudre un problème par la négociation, découvrir une information
        décisive, explorer un lieu important ou changer durablement une
        situation peut faire avancer la campagne autant qu'une victoire au
        combat.</p>

        </blockquote>

        <h3>Rappel COF2</h3>

        <p>À chaque passage de niveau, COF2 fait progresser le personnage et lui
        donne notamment de nouveaux points de capacité. Warbound conserve cette
        logique générale.</p>

        <h3>Paramètres Warbound actuellement retenus</h3>

        <ul>

        <li>le personnage reçoit son <strong>rang 1 de Voie</strong> selon les
        règles Warbound retenues pour la création ;</li>

        <li>les <strong>Talents raciaux indépendants</strong> utilisent les
        règles Warbound définies pour la campagne ;</li>

        <li>une capacité formulée comme utilisable « une fois par combat » suit
        la logique COF2 de <strong>récupération rapide</strong>, et ne se
        recharge pas simplement parce qu'une nouvelle initiative commence ;</li>

        <li>la campagne vise une progression relativement contenue : la montée
        en puissance doit accompagner les grandes étapes de la Saison 1 plutôt
        qu'une succession rapide de niveaux ;</li>

        <li><strong>si le cadrage actuel est maintenu</strong>, la première
        grande spécialisation / voie de prestige Warbound est prévue autour du
        <strong>niveau 4</strong>.</li>

        </ul>

        <blockquote>

        <p><strong>MJ — à confirmer avant de l'annoncer :</strong> niveau exact
        de départ et cible finale de Saison 1.</p>

        </blockquote>

        <hr>

        <h2>6.2 Une deuxième progression : votre place dans Durotar</h2>

        <p>Les niveaux ne sont pas la seule progression importante.</p>

        <p>Les PJ pourront aussi gagner :</p>

        <ul>

        <li>des contacts ;</li>

        <li>des alliés ;</li>

        <li>des faveurs ;</li>

        <li>de la réputation ;</li>

        <li>des informations ;</li>

        <li>des cartes ;</li>

        <li>des passages sûrs ;</li>

        <li>des raccourcis ;</li>

        <li>des endroits où dormir ou se ravitailler ;</li>

        <li>la confiance d'un groupe ;</li>

        <li>l'hostilité d'un autre ;</li>

        <li>l'accès à certains lieux ou personnes.</li>

        </ul>

        <h2>À dire</h2>

        <blockquote>

        <p>Une information importante ou quelqu'un qui vous doit une faveur peut
        être une récompense aussi précieuse qu'une meilleure arme.</p>

        <p>Au début, Durotar sera surtout une carte connue de vos souvenirs de
        joueurs.</p>

        <p>Progressivement, il doit devenir <strong>votre Durotar</strong> : les
        personnes que vous connaissez, les routes que vous maîtrisez, les
        ennemis que vous vous êtes faits et les endroits que vos décisions ont
        transformés.</p>

        </blockquote>

        <hr>

        <h1>7. Vos connaissances de World of Warcraft — 5 min</h1>

        <h2>À dire</h2>

        <blockquote>

        <p>Je ne vais pas vous demander de faire semblant d'avoir oublié
        <em>World of Warcraft</em>.</p>

        <p>Au contraire : reconnaître un endroit, une créature ou un personnage
        fait partie du plaisir.</p>

        <p>Si vous savez quelque chose en tant que joueur, on se demandera
        simplement si votre personnage possède lui aussi une raison de le
        savoir.</p>

        <p>Mais il y a une règle beaucoup plus importante :</p>

        <p><strong>ce qui était vrai dans WoW ne garantit pas que la situation
        se résoudra ici de la même manière.</strong></p>

        <p>Vous pouvez reconnaître le décor sans connaître la réponse.</p>

        </blockquote>

        <h2>Formule de campagne</h2>

        <blockquote>

        <p><strong>Reconnaissance → incertitude → choix →
        conséquences.</strong></p>

        </blockquote>

        <h2>À retenir</h2>

        <p><strong>WoW est notre mémoire commune.<br>

        Ce n'est pas le script de la campagne.</strong></p>

        <hr>
