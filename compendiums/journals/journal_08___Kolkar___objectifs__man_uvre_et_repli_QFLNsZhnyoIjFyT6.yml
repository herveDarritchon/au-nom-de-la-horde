  - name: Action « Coup de serpe »
    type: text
    sort: 200000
    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Annexe Warbound — Kolkar et kodo, restitution des échanges des 3 et 7 novembre 2026</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h2>Manœuvre de pillage : « Coup de serpe »</h2>\n<table style=\"width:100%;border-collapse:collapse\"><thead><tr><th>Élément</th><th>Arbitrage</th><th>Statut</th></tr></thead><tbody>\n<tr><td>Coût</td><td><strong>Une action d’attaque</strong></td><td>[ACQUIS — règle de rencontre]</td></tr>\n<tr><td>Jet</td><td>Test d’<strong>AGI</strong></td><td>[ACQUIS]</td></tr>\n<tr><td>Difficulté</td><td><strong>DD 15</strong></td><td>[PROPOSITION — non validée]</td></tr>\n<tr><td>Réussite</td><td>Tranche l’attache et <strong>saisit le sac dans la même action</strong></td><td>[ACQUIS]</td></tr>\n<tr><td>Échec</td><td>Attache tranchée, mais <strong>sac tombé au sol</strong></td><td>[ACQUIS]</td></tr>\n<tr><td>Reprendre un sac au sol</td><td>Une autre action serait requise ; « action d’attaque » a été suggérée</td><td>[PROPOSITION — coût ouvert]</td></tr>\n<tr><td>Fuir avec le sac</td><td>Mouvement disponible dans le tour COF2</td><td>[ACQUIS — intention]</td></tr></tbody></table>\n<p><strong>[RÈGLE COF2]</strong> En principe, un tour permet une action limitée, ou une action d’attaque et une de mouvement, ou deux actions de mouvement. <strong>Le « Coup de serpe » n’est pas une capacité officielle :</strong> sa description est propre au scénario. Source : Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions, 2024, section « Actions », p. 210–211 (référence reprise des échanges).</p>\n<p>Une défense astucieuse (cacher les attaches, couvrir un flanc, protéger Gurok, repousser le voleur) doit pouvoir modifier la fiction ; aucun bonus numérique supplémentaire n’a été définitivement validé.</p>\n<p>@UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Retrait} · @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{Scène} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan des sacs}.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Objectifs, retrait et initiative}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Jauge, déclencheurs et statut} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ — faits établis en jeu}</p>"
