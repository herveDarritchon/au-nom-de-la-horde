    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Annexe Warbound — Kolkar et kodo, restitution des échanges des 3 et 7 novembre 2026</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h2>Raid au Rocher fendu : logique tactique</h2>\n<p><strong>[ACQUIS — Warbound]</strong> Trois centaures Kolkar, <strong>un éclaireur sur le talus et deux estafettes</strong>. Deux sacs de provisions/eau au plus sont visés. But : voler puis décrocher. Il ne s’agit pas d’un ordre d’exterminer la Horde ; cette attaque est indépendante de la Pierre Brisée.</p>\n<table style=\"width:100%;border-collapse:collapse\"><thead><tr><th>Déclencheur</th><th>Réaction prévue</th><th>Statut</th></tr></thead><tbody>\n<tr><td>Éclaireur neutralisé / capturé / maîtrisé</td><td>Opération perdue ; les deux estafettes cessent le vol et fuient.</td><td>[ACQUIS]</td></tr>\n<tr><td>Deux sacs emportés</td><td>Fin du raid, fuite avec le butin.</td><td>[ACQUIS]</td></tr>\n<tr><td>Une estafette à la moitié de ses PV</td><td>Elle se retire. La seconde peut essayer une dernière fois de voler un sac, puis fuit sans tenir compte du résultat.</td><td>[ACQUIS]</td></tr>\n<tr><td>Les risques dépassent l’intérêt du butin</td><td>Repli volontaire plus tôt.</td><td>[PROPOSITION ; seuil à fixer en jeu]</td></tr></tbody></table>\n<p>Les Kolkar prennent la fuite dans le cadre des <strong>tours et déplacements COF2</strong> : l’ordre tactique ne donne ni mouvement gratuit ni téléportation. Un Kolkar avec son sac utilise son mouvement restant si possible.</p>\n<p><strong>Situation ouverte :</strong> neutraliser l’éclaireur peut suffire ; les PJ peuvent négocier, repousser, protéger, poursuivre ou laisser filer. Ne pas provoquer une seconde vague pour forcer un combat.</p>\n<p>@UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{Scène Kolkar} · @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.ZvRQjvSnNoUwN1YH]{Mémento} · @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Coup de serpe} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Conséquences}.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Action « Coup de serpe »}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Jauge, déclencheurs et statut} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ — faits établis en jeu}</p>"
