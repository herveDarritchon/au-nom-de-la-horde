      content: >-
        <h2 data-heading="1. Pitch &amp; Prémisse">1. Pitch &amp;
        Prémisse</h2><p><strong>Accroche (Pitch) :</strong> Les PJ sont chargés
        d’escorter depuis la @UUID[JournalEntry.3804DaSpkWC1bBzY]{Mine de
        Roche-Sèche} jusqu’à
        @UUID[JournalEntry.7tGmUEcyGu1BeheM]{Tranchecolline} (Razor Hill) un
        convoi stratégique pour la Horde. Sa cargaison la plus précieuse est
        censée être @UUID[JournalEntry.H8dpEah73C7TluZP]{Mâche-Roc}, la célèbre
        foreuse de la mine, réquisitionnée pour des travaux sous Orgrimmar. Mais
        le voyage va les confronter à trois dangers de nature volontairement
        différente : une menace locale, une manipulation magique, et une tension
        diplomatique.<br><strong>Thème &amp; Tonalité :</strong> Voyage,
        Escorte, Découverte des vraies menaces de Durotar,
        Faux-semblants.<br><strong>Durée estimée :</strong> 1
        session<br><strong>Niveau recommandé :</strong> Débutant (Niveau
        1)</p><hr><h2 data-heading="2. La Vérité &amp; L'Iceberg de
        l'Enquête">2. La Vérité &amp; L'Iceberg de l'Enquête</h2><p><strong>Ce
        qui s'est réellement passé (Backstory)
        :</strong></p><ul><li><p><strong>La Vérité cachée :</strong>
        <strong>@UUID[JournalEntry.H8dpEah73C7TluZP]{Mâche-Roc}</strong> n’est
        déjà plus dans le convoi. Avant l'arrivée des PJ,
        @UUID[JournalEntry.vC91ivaZT7R8IJdF]{Krosh Pèse-Charge,} acheté par un
        intermédiaire du Cercle de la Pierre Brisée, a fait remplacer ses
        éléments par des caisses lestées de pierres. Le sabotage a eu lieu
        <em>avant</em> même le départ.</p></li><li><p><strong>Niveau 0 (Surface
        / Accroche) :</strong> Les PJ doivent défendre le convoi contre les
        périls de la route, pensant protéger l'équipement de la
        Horde.</p></li><li><p><strong>Niveau -1 (Première couche) :</strong>
        Lors de l'attaque des sangliers, un indice magique suggère qu'une force
        intelligente (un chaman du Cercle) a manipulé les bêtes pour ralentir ou
        désorganiser le convoi à distance.</p></li></ul>
