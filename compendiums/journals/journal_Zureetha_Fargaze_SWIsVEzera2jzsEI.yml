        <h1>Zureetha Fargaze</h1>

        <blockquote><p><strong>[CANON] liée aux vils familiers et à Yarrog ;
        développement [ADAPTATION]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Elle introduit l'enquête et le doute
        rationnel. Elle distingue ce qui a été vu de ce qui est seulement
        supposé.</p>

        <h2>Présence</h2><p>Jeune adulte, peau vert sauge, cheveux acajou,
        carnet, pinces, sacoche d'outils et de fioles.</p>

        <h2>Voix et répliques</h2><ul><li>« Montrez-moi ce que vous savez. Pas
        ce que vous croyez. »</li><li>« Tu l'as vu ? »</li><li>« Alors dis-moi
        qui l'a vu. »</li></ul>

        <h2>Veut</h2><p>Comprendre les manifestations anormales avant qu'elles
        ne deviennent une crise.</p>

        <h2>Craint</h2><ul><li>minimiser une menace réelle</li><li>accuser un
        innocent</li><li>provoquer une panique qui ferait disparaître la
        véritable piste</li></ul>
