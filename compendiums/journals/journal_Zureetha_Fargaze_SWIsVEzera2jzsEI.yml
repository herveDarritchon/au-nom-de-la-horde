      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Rapporter des observations
        exactes ; admettre ce qu'on ignore ; conserver les indices ; distinguer
        hypothèse et fait.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Inventer un détail ;
        détruire une preuve ; accuser publiquement sans fondement ; lui cacher
        volontairement un indice important.</p>

        <h2>Liens personnels possibles</h2>

        <h3>La première personne qu'elle croit</h3><p>Un PJ raconte quelque
        chose d'étrange que tout le monde minimise. « Je te crois. Maintenant,
        prouve-le-moi. »</p><h3>Le secret professionnel</h3><p>Un PJ lui confie
        une information privée. Zureetha la garde tant qu'elle ne met personne
        immédiatement en danger.</p><h3>La nuit d'autopsie</h3><p>Zureetha et un
        PJ travaillent plusieurs heures sur une créature morte. La relation naît
        du travail partagé.</p><h2>S'il devient un allié</h2><p>Une partenaire
        d'enquête fiable quand quelque chose ne colle pas ; elle aide à poser
        les bonnes questions plutôt qu'à livrer la réponse.</p><h2>S'il devient
        hostile</h2><p>Si elle considère les PJ peu fiables, elle vérifie tout
        et peut refuser publiquement de soutenir une accusation importante.</p>
