        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Elle montre deux traces à un PJ : « Je
        sais ce que j'en pense. Je veux savoir ce que toi tu vois. »</p>

        <h2>Évolution hors champ</h2><p>Elle accumule de nouveaux indices hors
        champ et peut devenir un contact récurrent sur les affaires
        surnaturelles de Durotar.</p>

