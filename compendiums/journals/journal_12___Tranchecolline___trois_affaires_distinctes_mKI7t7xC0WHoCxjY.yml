    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Document maître évolutif — v0.2 (5 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>H. Arrivée à Tranchecolline</h3><p>[ACQUIS / FICHE À INTÉGRER]  L’arrivée ouvre trois affaires distinctes : Takrin reçoit les convois et doit traiter la livraison de Mâche-Roc ; Gar’Thok considère la conduite des PJ ; Grosk s’intéresse à une livraison séparée de deux sacs de pommes de cactus.</p>\n<p style=\"margin-left:1em\">• Décisions ouvertes aux PJ — rendre compte, présenter des preuves, expliquer les retards et pertes, négocier ou demander assistance ; gérer séparément les trois interlocuteurs.</p>\n<p style=\"margin-left:1em\">• Conséquences à reporter — évaluation fondée sur actes observables et témoignages ; accueil et services potentiels ; relations locales durables.</p>\n<p><small>À écrire / vérifier : reprendre le texte exact de la fiche MJ d’arrivée si disponible ; ne pas inventer son barème ou ses répliques au-delà de la synthèse déjà échangée.</small></p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.mKI7t7xC0WHoCxjY.JournalEntryPage.XzZax3Ebhu42fEJy]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.mKI7t7xC0WHoCxjY.JournalEntryPage.hDqWnLNlaF3QBVhe]{Garde-fou de continuité}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.0OSSsrkorZZNsVqG.JournalEntryPage.SBZRXxq5BRejGgK4]{Trois affaires à ne pas confondre} \_ · \_ @UUID[JournalEntry.ntFjmKdDE6Mcpsuc.JournalEntryPage.D4UtndmnLmtqTgNQ]{Informations établies &amp; limites} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table} \_ · \_ @UUID[JournalEntry.1w5SomDLshDAWOoC.JournalEntryPage.