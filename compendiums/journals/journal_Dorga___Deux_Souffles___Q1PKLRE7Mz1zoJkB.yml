  - name: 02 · Jouer ce péon
    type: text
    sort: 200000
    text:
      format: 1
      content: >-
        <h1>Interprétation et liens</h1><h2>Comment l’incarner</h2><p>Elle parle
        peu, aide sans le dire et donne plus qu’elle ne possède. Elle est
        sensible aux gestes simples, jamais aux grands discours.</p><h2>Ce qu’il
        sait, croit et dissimule</h2><dl><dt><strong>Sait</strong></dt><dd>Qui
        remplace qui au chantier, quelles charges sont trop lourdes, quels
        ouvriers tirent sur leurs
        forces.</dd><dt><strong>Croit</strong></dt><dd>Que sa valeur dépend du
        travail qu’elle peut encore
        accomplir.</dd><dt><strong>Cache</strong></dt><dd>Elle cumule ses
        corvées et celles de Grubnak. Sa fatigue est plus grave qu’elle ne
        l’admet à Drog.</dd></dl><h2>Son
        entourage</h2><table><thead><tr><th>Personne</th><th>Relation
        actuelle</th></tr></thead><tbody><tr><td>Drog</td><td>Son petit frère,
        jeune recrue de la Vallée ; sa fierté et sa principale
        inquiétude.</td></tr><tr><td>Mogra</td><td>Amie proche qui veut la
        protéger, parfois contre son avis.</td></tr><tr><td>Grubnak</td><td>Elle
        reprend ses tâches et commence à en
        souffrir.</td></tr><tr><td>Zugmog</td><td>Elle l’aide et l’encourage
        comme un jeune parent éloigné.</td></tr></tbody></table><h2>Une phrase à
        placer</h2><blockquote><p>« Je peux encore porter un sac. Mais après, il
        faudra que quelqu’un me relève. »</p></blockquote>
