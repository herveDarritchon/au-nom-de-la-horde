  - name: 03 · Scènes et réactions
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>Scènes et décisions</h1><h2>Trois occasions de jeu</h2><h3>Le
        fardeau</h3><p>Lors d’une tâche banale, Dorga chancelle et se rattrape
        discrètement à une poutre. Quelqu’un doit finir son portage.</p><h3>La
        visite de Drog</h3><p>Drog vient lui raconter son entraînement ; elle
        cache ses mains tremblantes sous la table.</p><h3>Une place près du
        feu</h3><p>Au repas, elle remercie timidement le PJ qui lui a apporté de
        l’eau, puis lui demande de ne rien dire à son frère.</p><h2>Réactions à
        quelques choix des PJ</h2><table><thead><tr><th>Approche des
        PJ</th><th>Réaction ou conséquence</th></tr></thead><tbody><tr><td>La
        forcer à se reposer</td><td>Sa santé s’améliore, mais elle peut
        considérer qu’on lui retire sa dignité si rien n’est décidé avec
        elle.</td></tr><tr><td>Réorganiser le travail avec son
        accord</td><td>Elle accepte un rôle moins épuisant et aide à enseigner
        aux plus jeunes. Thazz’rill demande qui prendra les charges
        restantes.</td></tr><tr><td>Ignorer le signal</td><td>Elle se blesse ou
        s’effondre lors d’une autre corvée ; Drog cherche un
        responsable.</td></tr></tbody></table><h2>Si les PJ n’interviennent
        pas</h2><p>Elle accumule les tâches jusqu’à une blessure qui la rend
        temporairement incapable de travailler ; Drog se met en colère contre
        l’encadrement.</p><p><em>Ces scènes sont des opportunités, pas une suite
        de quêtes imposées. Elles peuvent se résoudre sans jet de dés.</em></p>
