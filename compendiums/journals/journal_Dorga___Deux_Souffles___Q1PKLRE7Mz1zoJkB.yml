  - name: 04 · Secrets et devenir (MJ)
    type: text
    sort: 400000
    text:
      format: 1
      content: >-
        <h1>MJ — Secrets et continuité</h1><h2>Vérité / point de
        vigilance</h2><p>Ne transforme pas Dorga en simple objet de compassion.
        Même épuisée, elle reste compétente, décidée et parfois désagréable
        lorsqu’elle se sent diminuée.</p><h2>Ce que le PNJ ne dit pas
        spontanément</h2><p>Elle cumule ses corvées et celles de Grubnak. Sa
        fatigue est plus grave qu’elle ne l’admet à Drog.</p><h2>Évolution
        envisageable</h2><p>Drog devient potentiellement garde à Tranchecolline.
        Il connaît les noms de ceux qui ont pris soin de sa sœur — ou de ceux
        qui l’ont humiliée.</p><h2>Fil de mémoire des PJ</h2><ul><li>Qui lui a
        parlé avec respect, et qui l’a humilié ?</li><li>Quelle promesse les PJ
        ont-ils faite ?</li><li>Quelle décision des PJ a réellement changé sa
        vie ?</li><li>Que demandera-t-il aux PJ la prochaine fois qu’ils se
        croiseront ?</li></ul><h2>Continuité ouverte</h2><p>Les événements
        ci-dessus sont des propositions. Les faits établis pendant la partie
        priment sur cette préparation. L’amitié, l’hostilité et le destin de ce
        péon ne sont pas décidés à l’avance.</p>
