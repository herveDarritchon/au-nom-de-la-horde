  - name: 01 · Portrait et accroche
    type: text
    sort: 100000
    text:
      format: 1
      content: >-
        <h1>Dorga « Deux-Souffles »</h1><p><em>Adaptation Warbound · Vallée des
        Épreuves · Journal MJ</em></p><blockquote><p>« Je peux encore porter un
        sac. Mais après, il faudra que quelqu’un me relève.
        »</p></blockquote><h2>En un
        regard</h2><dl><dt><strong>Rôle</strong></dt><dd>L’épuisée · solidarité
        / fierté</dd><dt><strong>Aspect</strong></dt><dd>Orque massive et
        vieillissante, mains crevassées, dos raide, regard doux et vigilant.
        Elle s’arrête parfois au milieu d’une phrase pour reprendre son
        souffle.</dd><dt><strong>Désir</strong></dt><dd>Que son jeune frère Drog
        réussisse son entraînement et qu’ils puissent obtenir une affectation
        stable et digne.</dd><dt><strong>Crainte</strong></dt><dd>Être perçue
        comme inutile ; faire perdre à Drog sa chance de devenir
        guerrier.</dd><dt><strong>Défaut</strong></dt><dd>Elle refuse l’aide,
        minimise ses douleurs et peut brusquer ceux qui cherchent à lui éviter
        un effort.</dd></dl><h2>Première impression à la table</h2><p>Elle parle
        peu, aide sans le dire et donne plus qu’elle ne possède. Elle est
        sensible aux gestes simples, jamais aux grands discours.</p><h2>Contact
        avec les PJ</h2><p>La promesse faite à Drog, le souvenir d’un repas
        partagé ou le respect gagné en traitant Dorga comme une personne et non
        une victime.</p><p><em>Statut : PNJ original de la campagne. Repère
        canonique du secteur : le contremaître Thazz’rill et les péons de la
        Vallée.</em></p>
