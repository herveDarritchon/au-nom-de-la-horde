  - name: 02 · Jouer ce péon
    type: text
    sort: 200000
    text:
      format: 1
      content: >-
        <h1>Interprétation et liens</h1><h2>Comment l’incarner</h2><p>Il
        s’attache au premier PJ qui prend réellement le temps de l’écouter. Il
        répète ses gestes, sa façon de parler et parfois ses erreurs.</p><h2>Ce
        qu’il sait, croit et
        dissimule</h2><dl><dt><strong>Sait</strong></dt><dd>Les raccourcis
        empruntés par les apprentis, les bruits de camp et les histoires qu’il a
        entendues sur les héros — sans toujours distinguer les
        faits.</dd><dt><strong>Croit</strong></dt><dd>Qu’un péon a échoué et que
        seul un guerrier mérite une
        chanson.</dd><dt><strong>Cache</strong></dt><dd>Il s’entraîne avec des
        outils la nuit, songe à entrer seul dans l’Antre pour rapporter un
        trophée et embellit régulièrement ses exploits.</dd></dl><h2>Son
        entourage</h2><table><thead><tr><th>Personne</th><th>Relation
        actuelle</th></tr></thead><tbody><tr><td>Dorga</td><td>L’encourage comme
        un parent ; il aide parfois son frère Drog à
        s’entraîner.</td></tr><tr><td>Brakka</td><td>Lui sert de généreuses
        portions et l’écoute.</td></tr><tr><td>Grubnak</td><td>Lui transmet de
        mauvais conseils sur la manière d’échapper aux
        corvées.</td></tr><tr><td>Mogra</td><td>Le juge maladroit mais pourrait
        lui apprendre un vrai métier.</td></tr></tbody></table><h2>Une phrase à
        placer</h2><blockquote><p>« C’est vrai qu’à Orgrimmar, il y a des héros
        qui ont combattu des démons ? »</p></blockquote>
