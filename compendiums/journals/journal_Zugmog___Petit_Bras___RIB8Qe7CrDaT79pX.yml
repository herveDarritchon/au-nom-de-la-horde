  - name: 04 · Secrets et devenir (MJ)
    type: text
    sort: 400000
    text:
      format: 1
      content: >-
        <h1>MJ — Secrets et continuité</h1><h2>Vérité / point de
        vigilance</h2><p>Ne décrète pas qu’il doit devenir guerrier. Le meilleur
        développement possible peut être la découverte qu’un artisan ou un
        protecteur mérite tout autant de respect.</p><h2>Ce que le PNJ ne dit
        pas spontanément</h2><p>Il s’entraîne avec des outils la nuit, songe à
        entrer seul dans l’Antre pour rapporter un trophée et embellit
        régulièrement ses exploits.</p><h2>Évolution envisageable</h2><p>Garde,
        apprenti guerrier, artisan ou rival amical à Tranchecolline ; sa
        trajectoire dépend des héros qu’il choisit d’imiter.</p><h2>Fil de
        mémoire des PJ</h2><ul><li>Qui lui a parlé avec respect, et qui l’a
        humilié ?</li><li>Quelle promesse les PJ ont-ils faite ?</li><li>Quelle
        décision des PJ a réellement changé sa vie ?</li><li>Que demandera-t-il
        aux PJ la prochaine fois qu’ils se croiseront ?</li></ul><h2>Continuité
        ouverte</h2><p>Les événements ci-dessus sont des propositions. Les faits
        établis pendant la partie priment sur cette préparation. L’amitié,
        l’hostilité et le destin de ce péon ne sont pas décidés à l’avance.</p>
