  - name: 03 · Scènes et réactions
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>Scènes et décisions</h1><h2>Trois occasions de jeu</h2><h3>Le
        premier récit</h3><p>Il réclame à un PJ l’histoire de son premier
        combat, puis pose une question qui le touche personnellement : « Tu
        avais peur ? »</p><h3>La pelle de guerre</h3><p>Il s’entraîne contre un
        mannequin avec sa pelle et casse une pièce de charpente.</p><h3>La
        disparition</h3><p>Pour se montrer digne, il part seul vers un endroit
        dangereux ; les PJ peuvent lui donner des raisons de revenir avant
        l’accident.</p><h2>Réactions à quelques choix des
        PJ</h2><table><thead><tr><th>Approche des PJ</th><th>Réaction ou
        conséquence</th></tr></thead><tbody><tr><td>Encourager ses exploits sans
        limites</td><td>Il prend davantage de risques pour plaire à son
        modèle.</td></tr><tr><td>Le former sans le rabaisser</td><td>Il apprend
        la prudence et peut progresser vers le métier de son
        choix.</td></tr><tr><td>Le ridiculiser publiquement</td><td>Il cherche
        une reconnaissance ailleurs, peut-être auprès d’un mentor plus
        brutal.</td></tr></tbody></table><h2>Si les PJ n’interviennent
        pas</h2><p>Il se rapproche d’un groupe de recrues plus téméraires et
        risque un accident ou une mauvaise rencontre.</p><p><em>Ces scènes sont
        des opportunités, pas une suite de quêtes imposées. Elles peuvent se
        résoudre sans jet de dés.</em></p>
