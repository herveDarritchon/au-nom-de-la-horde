  - name: 01 · Portrait et accroche
    type: text
    sort: 100000
    text:
      format: 1
      content: >-
        <h1>Zugmog « Petit-Bras »</h1><p><em>Adaptation Warbound · Vallée des
        Épreuves · Journal MJ</em></p><blockquote><p>« C’est vrai qu’à
        Orgrimmar, il y a des héros qui ont combattu des démons ?
        »</p></blockquote><h2>En un
        regard</h2><dl><dt><strong>Rôle</strong></dt><dd>Le rêveur · admiration
        / initiation</dd><dt><strong>Aspect</strong></dt><dd>Jeune orc encore
        dégingandé, gants de travail trop larges, ecchymoses récentes. Il tient
        une pelle comme une arme dès qu’il pense être
        observé.</dd><dt><strong>Désir</strong></dt><dd>Prouver qu’il mérite sa
        place parmi les guerriers et accomplir un exploit dont on
        parlera.</dd><dt><strong>Crainte</strong></dt><dd>Rester péon toute sa
        vie et décevoir ceux dont il recherche
        l’estime.</dd><dt><strong>Défaut</strong></dt><dd>Il s’expose à des
        dangers absurdes pour être admiré et enjolive souvent ses
        expériences.</dd></dl><h2>Première impression à la table</h2><p>Il
        s’attache au premier PJ qui prend réellement le temps de l’écouter. Il
        répète ses gestes, sa façon de parler et parfois ses
        erreurs.</p><h2>Contact avec les PJ</h2><p>Une promesse d’entraînement,
        une imitation amusante, la première leçon sur la peur ou sur ce qu’est
        vraiment un acte honorable.</p><p><em>Statut : PNJ original de la
        campagne. Repère canonique du secteur : le contremaître Thazz’rill et
        les péons de la Vallée.</em></p>
