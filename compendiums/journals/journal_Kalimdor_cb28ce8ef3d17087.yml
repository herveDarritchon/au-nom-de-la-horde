  - _id: d26977c697af601a
    name: Kalimdor
    type: text
    text:
      content: >-
        <p>Continent majestueux et sauvage situé à l'ouest d'Azeroth,
        <strong>Kalimdor</strong> est une terre de contrastes profonds. Séparé
        des Royaumes de l'Est par le vaste océan et le Maelström, ce territoire
        ancestral abrite des déserts arides, des forêts luxuriantes et des
        montagnes imposantes. C'est sur ces terres anciennes que la Horde
        cherche aujourd'hui à bâtir son avenir après la Troisième Guerre,
        cohabitant de manière précaire avec des peuples aux traditions
        millénaires et une faune particulièrement dangereuse. Sur la côte est du
        continent s'étend la région rocailleuse de
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.16b7eb16efab8226.JournalEntryPage.c27c85bb2e09710f]{Durotar}</strong>,
        devenue le nouveau foyer des Orcs et de leurs alliés, et dominée au nord
        par leur jeune capitale,
        @UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.cd074187891352fa.JournalEntryPage.e0870bccc64bf3dc]{Orgrimmar}.</p>

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Maps/kalimdor-map-fr.webp?v=c8f0afc657e5"
        alt="kalimdor-map-fr.png" class="default-width"></p>
      format: 1
