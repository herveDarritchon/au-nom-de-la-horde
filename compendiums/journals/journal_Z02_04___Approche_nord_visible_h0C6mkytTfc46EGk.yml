  - name: 04 • PNJ — Margoz
    type: text
    sort: 400000
    ownership:
      default: 0
      TjbWhMczNyKieD8D: 3
    text:
      format: 1
      content: |-
        <h1>PNJ — Margoz</h1>
            <p><strong>ID :</strong> PNJ-Z02-04-01 · <strong>POI :</strong> Z02-04 · <strong>Zone :</strong> Z02</p>
            <p><strong>Origine / statut :</strong> Classic — rôle d’observateur selon guide des quêtes</p>
            <p><strong>Fonction :</strong> Informateur de la Horde sur les mouvements cultistes · <strong>Faction / allégeance réelle (MJ) :</strong> Horde (observation extérieure)</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Vérifier quelle voie est réellement utilisée par les cultistes.</td></tr><tr><th>Motivation profonde</th><td>Une alerte erronée peut coûter des vies à la Horde.</td></tr><tr><th>Obstacle</th><td>Il voit les approches, pas l’intérieur des grottes.</td></tr>
              <tr><th>Ligne rouge</th><td>Lancer un assaut sans indice de présence.</td></tr><tr><th>Peut offrir</th><td>Croquis d’itinéraire, traces relevées, information sur les heures de passage.</td></tr><tr><th>En échange</th><td>Une observation recoupée plutôt qu’un récit invérifiable.</td></tr>
              <tr><th>Attitude initiale</th><td>Circonspect envers les PJ pressés.</td></tr><tr><th>S'il n'arrive rien</th><td>Signale un danger réel mais attribue peut-être trop d’incidents au culte.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Cartes froissées coincées dans une sacoche élimée.</p><p><strong>Voix et comportement :</strong> Pose des questions brèves, observe les réponses.</p><p><strong>Signe émotionnel :</strong> Rabaisse sa carte d’un geste sec quand une hypothèse ne tient pas.</p>
            <blockquote><p><strong>Première réplique :</strong> « Un pas dans la poussière prouve une visite, pas une conspiration. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Qu’avez-vous vu vous-mêmes ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des signes récurrents existent près d’un accès.</td></tr><tr><th>Après échange, aide ou observation</th><td>Peut reconnaître un type d’insigne ou un détour suspect.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ne connaît pas la chaîne de commandement du réseau ; peut confondre menaces distinctes.</td></tr><tr><th>Il demande</th><td>Une observation recoupée plutôt qu’un récit invérifiable.</td></tr>
              <tr><th>Il peut proposer</th><td>Croquis d’itinéraire, traces relevées, information sur les heures de passage.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Lancer un assaut sans indice de présence.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Indique une fenêtre d’approche discrète.</td></tr><tr><th>S'ils négocient</th><td>Partage ses notes contre une promesse de lui rapporter les observations.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Coupe court et avertit ses supérieurs d’une intrusion risquée.</td></tr><tr><th>S'ils l'ignorent</th><td>Signale un danger réel mais attribue peut-être trop d’incidents au culte.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z02-04. <strong>Relations / autres lieux :</strong> Personnage mobile : point de rencontre fixé ici pour la Saison 1.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z02/R06 : degré de surveillance accru ou accès de reconnaissance plus sûr.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
