  - _id: 723ab99b7ca274d6
    name: 06 · Routes et accès
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Routes, accès et compromis — Z08</h2><p>Aucune liaison principale
        R01–R08 n’a ici un terminus explicite ; utiliser les corridors
        documentés dans le pointcrawl et les liaisons à créer
        ci-dessous.</p><h3>Liaisons proposées non encore
        validées</h3><table><thead><tr><th>Code provisoire</th><th>Connexion
        logique</th><th>À régler avant
        utilisation</th></tr></thead><tbody><tr><td><code>RX-02</code></td><td>Z07
        Sen'jin ↔ <strong>Z08 Combe des Kolkars</strong></td><td>Pistes de raid
        et accès réels, conséquences d'un parcours hors
        piste</td></tr></tbody></table><h3>État actuel (à
        compléter)</h3><table><thead><tr><th>Route</th><th>Connaissance des
        PJ</th><th>Accès</th><th>État /
        compromis</th></tr></thead><tbody><tr><td>RX-02</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr></tbody></table><blockquote><p><strong>Les huit
        liaisons sont des choix qualitatifs, pas des distances.</strong> Les
        trajets Rxx et RX-xx n’ont pas de durée ni de kilométrage validés. Ne
        pas transformer une liaison cachée en chemin connu sans découverte en
        jeu.</p></blockquote>
