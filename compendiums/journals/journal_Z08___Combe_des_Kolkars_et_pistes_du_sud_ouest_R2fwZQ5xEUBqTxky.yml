  - _id: 06b134961299719f
    name: 02 · Factions et secrets MJ
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Factions et influences — Z08</h2><p><strong>Kolkar</strong>,
        contrôle local ; <strong>Zalazane</strong> leur apporte un soutien
        opportuniste secret, <strong>sans leur commander</strong> ; patrouilles
        sombrelances ou de la Horde <strong>en réaction</strong>, non occupation
        initiale.</p><h3>Matrice des influences du
        référentiel</h3><table><thead><tr><th>Faction</th><th>Implantation /
        contrôle pertinent</th><th>Incursions, clandestinité ou influence
        indirecte</th><th>Effet sur les voyages (mise en
        scène)</th></tr></thead><tbody><tr><td><strong>Kolkar</strong></td><td>Z08</td><td>Raids
        et pression sur Z07</td><td>Traces de cavaliers, guetteurs, voies
        contournées, urgence de
        défense</td></tr><tr><td><strong>Zalazane</strong></td><td>Z09</td><td>Influence
        secrète sur Kolkar Z08, effet indirect Z07</td><td>Soutien masqué,
        indices d'une coopération intéressée (pas de contrôle des
        Kolkar)</td></tr><tr><td><strong>Horde</strong></td><td>Z01, Z04, Z07
        (Sombrelances), corridors de Z03 et Z10</td><td>Patrouilles / logistique
        en Z05, Z06, Z08</td><td>Convois, relais, pistes entretenues, sécurité
        variable</td></tr></tbody></table><blockquote><p><strong>Attention
        :</strong> une infiltration, un sabotage ou une manipulation ne signifie
        pas que la faction contrôle publiquement le territoire. Les relations
        secrètes ne doivent pas être divulguées automatiquement. Une faction
        hostile ne rend pas mécaniquement toute la région « en guerre
        ».</p></blockquote>
