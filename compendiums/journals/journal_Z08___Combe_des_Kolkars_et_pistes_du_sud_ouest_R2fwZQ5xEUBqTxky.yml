  - _id: 6b09a6a8e69fe406
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z08</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z08-01</code> Combe des
        Kolkars</td><td>Zone d'influence</td><td>[FAC]
        [CLASSIC]</td></tr><tr><td><code>Z08-02</code> Axes de raid vers
        Sen'jin</td><td>Routes</td><td>[FAC]</td></tr><tr><td><code>Z08-03</code>
        Guetteurs / pistes de cavaliers</td><td>Sites
        potentiels</td><td>[PROP]</td></tr></tbody></table><h3>Implantation et
        rôle des lieux</h3><p><code>Z08-01</code> Combe des Kolkars <strong>[FAC
        / CLASSIC]</strong> ; <code>Z08-02</code> voies d'incursion vers Sen'jin
        <strong>[FAC]</strong> ; <code>Z08-03</code> points d'observation ou
        pistes de cavaliers <strong>[PROP : lieux précis à décider en
        jeu]</strong>.</p><h3>Connaissance des PJ (à renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
