    text:
      format: 1
      content: |-
        <h1>PNJ — Kuz</h1>
            <p><strong>ID :</strong> PNJ-Z05-02-01 · <strong>POI :</strong> Z05-02 · <strong>Zone :</strong> Z05</p>
            <p><strong>Origine / statut :</strong> Classic — rôle à Durotar : adaptation Warbound</p>
            <p><strong>Fonction :</strong> Chef de garde des terriers · <strong>Faction / allégeance réelle (MJ) :</strong> Tranchecrins — courant guerrier</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Empêcher la fuite d’informations sur les galeries évacuées.</td></tr><tr><th>Motivation profonde</th><td>Il protège la force affichée du clan.</td></tr><tr><th>Obstacle</th><td>Les familles évitent une partie des terriers, ce qui fragilise ses défenses.</td></tr>
              <tr><th>Ligne rouge</th><td>Admettre publiquement que la galerie est devenue dangereuse.</td></tr><tr><th>Peut offrir</th><td>Autorisation ponctuelle de circuler, échange de prisonnier, avertissement tactique.</td></tr><tr><th>En échange</th><td>Démonstration que les PJ n’exploitent pas le trouble.</td></tr>
              <tr><th>Attitude initiale</th><td>Soupçonneux ; reconnaît les négociateurs déterminés.</td></tr><tr><th>S'il n'arrive rien</th><td>Verrouille une galerie, aggravant la promiscuité.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Défense d’épine fendue sur le casque.</p><p><strong>Voix et comportement :</strong> Parle haut pour être entendu des autres.</p><p><strong>Signe émotionnel :</strong> Sa voix monte d’un ton lorsqu’on mentionne les galeries fermées.</p>
            <blockquote><p><strong>Première réplique :</strong> « Personne ne traverse ces tunnels sans que je le sache. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Pourquoi voulez-vous atteindre cette galerie précisément ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des passages ont été murés depuis l’intérieur.</td></tr><tr><th>Après échange, aide ou observation</th><td>La fermeture précède les dernières incursions de la Horde.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Il accuse la Horde sans preuve ; ne connaît pas le réseau du Cercle.</td></tr><tr><th>Il demande</th><td>Démonstration que les PJ n’exploitent pas le trouble.</td></tr>
              <tr><th>Il peut proposer</th><td>Autorisation ponctuelle de circuler, échange de prisonnier, avertissement tactique.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Admettre publiquement que la galerie est devenue dangereuse.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Laisse évacuer un groupe vulnérable sous escorte.</td></tr><tr><th>S'ils négocient</th><td>Cède une entrée secondaire contre un échange réel.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Déclenche l’alarme mais peut éviter une mêlée près des enfants.</td></tr><tr><th>S'ils l'ignorent</th><td>Verrouille une galerie, aggravant la promiscuité.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z05-02. <strong>Relations / autres lieux :</strong> Courant Lok ; statut de PNJ déplacé dans l’adaptation Warbound.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z05-02 : accès de terrier conditionnel ou condamné.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
