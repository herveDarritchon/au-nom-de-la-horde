        <h1>Terriers de l'Épine-Rouge</h1>

        <p><strong>Identifiant :</strong> Z05-02</p>

        <p><strong>Zone géographique :</strong> Z05 — Terres des Tranchecrins et
        lisière occidentale</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Mini-donjon
        Warbound</p>

        <h2>Fonction dans la campagne</h2>

        <p>Mini-donjon Warbound ; entrée exacte à placer.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Nœud [3] du pointcrawl.</p>

        <p><strong>Repère géographique :</strong> Terriers, ronces, ressources
        revendiquées et pistes de raids aux frontières du carrefour.</p>

        <p><strong>Factions et influences :</strong> Tranchecrins (territoire
        contesté ; courant guerrier et courant de Mutiledent) ; Horde aux
        lisières.</p>

        <p><strong>Références et réserves :</strong> [GUIDE]</p>

        <p><em>La piste vers Sen’jin est l’expression locale d’une liaison ;
        elle ne devient pas un second lieu indépendant ni un territoire acquis à
        la Horde.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
