        <h1>PNJ — Mahra Terre-Sourde</h1>
            <p><strong>ID :</strong> PNJ-Z05-02-02 · <strong>POI :</strong> Z05-02 · <strong>Zone :</strong> Z05</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Géomancienne tranchecrine des galeries · <strong>Faction / allégeance réelle (MJ) :</strong> Tranchecrins — indépendance communautaire</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Décider s’il faut abandonner une galerie dangereuse.</td></tr><tr><th>Motivation profonde</th><td>Elle écoute le sol plus que les chefs de guerre.</td></tr><tr><th>Obstacle</th><td>Elle n’a pas l’autorité politique pour imposer l’évacuation.</td></tr>
              <tr><th>Ligne rouge</th><td>Sacrifier les jeunes à une démonstration de pouvoir.</td></tr><tr><th>Peut offrir</th><td>Observation de tremblements, passage secondaire, argument crédible pour négocier.</td></tr><tr><th>En échange</th><td>Protection des familles et absence de pillage.</td></tr>
              <tr><th>Attitude initiale</th><td>Méfiance scientifique envers les certitudes tribales.</td></tr><tr><th>S'il n'arrive rien</th><td>Ferme la galerie ; les familles se déplacent vers une ressource contestée.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Petits cailloux polis enfilés sur une corne.</p><p><strong>Voix et comportement :</strong> Frappe la roche pour interrompre une dispute.</p><p><strong>Signe émotionnel :</strong> Garde une paume contre la roche lorsque sa communauté est menacée.</p>
            <blockquote><p><strong>Première réplique :</strong> « Sous vos pieds, la terre ne choisit pas son camp. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Si je vous montre le danger, aiderez-vous à déplacer les petits ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>La chaleur anormale est perceptible dans une galerie.</td></tr><tr><th>Après échange, aide ou observation</th><td>Distingue des bruits d’affaissement de ceux d’une troupe en marche.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ne peut relier ces phénomènes aux travaux d’Orgrimmar sans enquête ; rester une piste, pas une révélation.</td></tr><tr><th>Il demande</th><td>Protection des familles et absence de pillage.</td></tr>
              <tr><th>Il peut proposer</th><td>Observation de tremblements, passage secondaire, argument crédible pour négocier.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Sacrifier les jeunes à une démonstration de pouvoir.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Organise une sortie des familles et témoigne auprès des deux camps.</td></tr><tr><th>S'ils négocient</th><td>Accorde un passage en échange de sécurité pour les terriers.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Refuse de mener les PJ dans un sanctuaire.</td></tr><tr><th>S'ils l'ignorent</th><td>Ferme la galerie ; les familles se déplacent vers une ressource contestée.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
