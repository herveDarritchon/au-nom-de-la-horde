  - _id: 6fe85a4cbfa80826
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z07</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z07-01</code> Village de
        Sen'jin</td><td><strong>Nœud [2]</strong></td><td>[PC]
        [FAC]</td></tr><tr><td><code>Z07-02</code> Grève des
        Sombrelances</td><td>Littoral</td><td>[CLASSIC]</td></tr><tr><td><code>Z07-03</code>
        Pêche, chasse, départs insulaires</td><td>Ressources /
        accès</td><td>[FAC] — à préciser</td></tr><tr><td><code>Z07-04</code>
        Sentier vers
        Tiragarde</td><td>Route</td><td>[PC]</td></tr><tr><td><code>Z07-05</code>
        Route de
        Tranchecolline</td><td>Route</td><td>[PC]</td></tr></tbody></table><h3>Implantation
        et rôle des lieux</h3><p><code>Z07-01</code> Village de Sen'jin
        <strong>[2]</strong> ; <code>Z07-02</code> Grève des Sombrelances
        <strong>[CLASSIC]</strong> ; <code>Z07-03</code> voies de pêche, chasse
        et approche des îles <strong>[FAC / GUIDE, emplacements précis à
        fixer]</strong> ; <code>Z07-04</code> piste côtière vers Tiragarde
        <strong>[PC]</strong> ; <code>Z07-05</code> route terrestre vers
        Tranchecolline <strong>[PC]</strong>.</p><h3>Connaissance des PJ (à
        renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
