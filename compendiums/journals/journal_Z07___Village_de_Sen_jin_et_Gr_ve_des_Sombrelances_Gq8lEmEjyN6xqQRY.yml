      content: >-
        <h2>Routes, accès et compromis — Z07</h2><h3>Liaisons principales
        R01–R08</h3><table><thead><tr><th>Route</th><th>Liaison / zones
        d'arrivée</th><th>Tag et compromis établis</th><th>Terrain / danger **de
        départ
        proposé**</th><th>Statut</th></tr></thead><tbody><tr><td><strong>R01</strong></td><td>Tranchecolline
        Z04 ↔ Sen'jin Z07</td><td><strong>Route du sud fréquentée</strong> ;
        convois et chaleur</td><td>Route utilisable (pas de ÷2 automatique) ;
        <strong>frontalière DD 10</strong> sur partie exposée</td><td>Connue si
        révélée aux PJ</td></tr><tr><td><strong>R07</strong></td><td>Sen'jin Z07
        ↔ Tiragarde Z06</td><td><strong>Sentier côtier</strong> ; raccourci
        sombrelance et exposition à la côte</td><td>Secteur côtier <strong>DD 15
        sauvage</strong> si non sécurisé ; vérifier terrain
        difficile</td><td><strong>Conditionnel</strong> si accès/savoir local
        requis</td></tr><tr><td><strong>R08</strong></td><td>Sen'jin Z07 ↔
        Terres Tranchecrins Z05</td><td><strong>Piste sèche</strong> ; approche
        alternative discrète</td><td>Terrain à fixer ; <strong>DD 15
        sauvage</strong> en secteur contesté</td><td>Peu fréquentée / à
        découvrir</td></tr></tbody></table><h3>Liaisons proposées non encore
        validées</h3><table><thead><tr><th>Code provisoire</th><th>Connexion
        logique</th><th>À régler avant
        utilisation</th></tr></thead><tbody><tr><td><code>RX-02</code></td><td>Z07
        Sen'jin ↔ <strong>Z08 Combe des Kolkars</strong></td><td>Pistes de raid
        et accès réels, conséquences d'un parcours hors
        piste</td></tr><tr><td><code>RX-03</code></td><td>Z07 Sen'jin ↔
        <strong>Z09 Îles de l'Écho</strong></td><td><strong>Procédure de
        traversée maritime</strong> (NON fournie par COF2 voyage
        terrestre)</td></tr><tr><td><code>RX-04</code></td><td>Z04 ou Z07 ↔
        <strong>Z10 Vallée des Épreuves</strong></td><td>Connexion prologue à
        déterminer <strong>avant</strong> de l'affirmer
        accessible</td></tr></tbody></table><h3>État actuel (à
        compléter)</h3><table><thead><tr><th>Route</th><th>Connaissance des
        PJ</th><th>Accès</th><th>État /
        compromis</th></tr></thead><tbody><tr><td>R01</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>R07</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td></tr><tr><td>R08</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>RX-02</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td></tr><tr><td>RX-03</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>RX-04</td><td>À renseigner</td><td>À
        renseigner</td><td>À
        renseigner</td></tr></tbody></table><blockquote><p><strong>Les huit
        liaisons sont des choix qualitatifs, pas des distances.</strong> Les
        trajets Rxx et RX-xx n’ont pas de durée ni de kilométrage validés. Ne
        pas transformer une liaison cachée en chemin connu sans découverte en
