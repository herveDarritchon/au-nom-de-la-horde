    ownership:
      default: 0
      TjbWhMczNyKieD8D: 3
    text:
      format: 1
      content: |-
        <h1>PNJ — Maren le Récupérateur</h1>
            <p><strong>ID :</strong> PNJ-Z06-02-01 · <strong>POI :</strong> Z06-02 · <strong>Zone :</strong> Z06</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Marin épuisé vivant des épaves · <strong>Faction / allégeance réelle (MJ) :</strong> Kul Tiras — soldat détaché / survie personnelle</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Récupérer une malle sans être aperçu des patrouilles des deux camps.</td></tr><tr><th>Motivation profonde</th><td>Elle contient les derniers effets d’un compagnon disparu.</td></tr><tr><th>Obstacle</th><td>Les épaves sont surveillées et peu sûres.</td></tr>
              <tr><th>Ligne rouge</th><td>Sacrifier un survivant pour une cargaison.</td></tr><tr><th>Peut offrir</th><td>Noms de soldats épuisés, traces de récupérations côtières, chemin discret.</td></tr><tr><th>En échange</th><td>Aide à extraire la malle ou à retrouver la famille du disparu.</td></tr>
              <tr><th>Attitude initiale</th><td>Méfiant mais non idéologue.</td></tr><tr><th>S'il n'arrive rien</th><td>Une patrouille met la main sur la malle et un témoin disparaît.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Veste marine trop grande, corde usée en bandoulière.</p><p><strong>Voix et comportement :</strong> Raconte les faits en regardant l’eau.</p><p><strong>Signe émotionnel :</strong> Touche une vieille corde dès qu’il est question d’un disparu.</p>
            <blockquote><p><strong>Première réplique :</strong> « Les épaves gardent mieux les secrets que les officiers. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Vous voulez une preuve ou un autre prisonnier ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Les mêmes hommes fouillent plusieurs fois la même épave.</td></tr><tr><th>Après échange, aide ou observation</th><td>Peut indiquer une fenêtre où les patrouilles se croisent mal.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Pense que des officiers cachent une pénurie ; ne sait rien d’une manipulation extérieure.</td></tr><tr><th>Il demande</th><td>Aide à extraire la malle ou à retrouver la famille du disparu.</td></tr>
              <tr><th>Il peut proposer</th><td>Noms de soldats épuisés, traces de récupérations côtières, chemin discret.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Sacrifier un survivant pour une cargaison.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Montre un passage côtier, sans annuler le danger du trajet.</td></tr><tr><th>S'ils négocient</th><td>Accepte une aide discrète et témoigne sur le moral du fort.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Prend la mer ou fuit la côte si menacé.</td></tr><tr><th>S'ils l'ignorent</th><td>Une patrouille met la main sur la malle et un témoin disparaît.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z06-02. <strong>Relations / autres lieux :</strong> Plausible sur la côte ; aucun naufrage précis n’est canonisé.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z06/R07 : accès d’approche ou indice sur la division de Tiragarde.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
