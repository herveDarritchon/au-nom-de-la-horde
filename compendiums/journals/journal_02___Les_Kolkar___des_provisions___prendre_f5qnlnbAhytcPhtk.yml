  - name: Décisions & conséquences
    type: text
    sort: 200000
    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Mécanique Kolkar–kodo, restitution des échanges du 3 novembre et continuité du 7 novembre 2026 ; règles proposées signalées</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h2>Résolution MJ — les trois objectifs qui comptent</h2>\n<p><strong>[ACQUIS]</strong> Ce raid Kolkar vise à <strong>emporter jusqu’à deux sacs de provisions/eau</strong> et à repartir ; ce n’est pas un combat à mort. Les PJ choisissent s’ils défendent le bât, protègent le kodo et les péons, poursuivent ou laissent décrocher les assaillants. La scène produit plusieurs issues légitimes.</p>\n<table style=\"width:100%;border-collapse:collapse\"><thead><tr><th>Déclencheur observable</th><th>Consigne MJ acquise</th></tr></thead><tbody>\n<tr><td>Éclaireur sur le talus <strong>neutralisé ou maîtrisé</strong></td><td>Opération caduque : <strong>les deux estafettes abandonnent le vol et fuient</strong>.</td></tr>\n<tr><td>Les <strong>deux sacs</strong> visés ont été pris</td><td>Objectif atteint : <strong>repli</strong> ; les Kolkar ne prolongent pas le combat.</td></tr>\n<tr><td>Une estafette tombe à <strong>la moitié de ses PV</strong></td><td>Elle décroche ; <strong>l’autre peut tenter un dernier vol</strong>, puis fuit, succès ou non.</td></tr>\n<tr><td>Défense devenue trop dangereuse</td><td><strong>[PROPOSITION]</strong> Retrait anticipé plausible ; aucun seuil chiffré établi.</td></tr>\n</tbody></table>\n<p>« Fuir immédiatement » indique une <strong>décision tactique</strong> ; appliquer les actions et mouvements disponibles dans l’ordre d’initiative COF2. Ne pas téléporter les estafettes hors de la battlemap.</p>\n<h3>Ce qui change après la rencontre</h3>\n<p>Noter <strong>les sacs réellement volés</strong>, les liens coupés, les sacs tombés/récupérés, les blessures du kodo et des personnes, les éventuels prisonniers, les détours et le <strong>retard réellement subi</strong>. Ni dommages ni pénurie n’apparaissent sans événement joué. Le second convoi <strong>attend toujours</strong> à Roche-Sèche.</p>\n<p><strong>Renvois :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Action de vol} · @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Kodo} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ} · @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Retard S02} · @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{Accueil à Roche-Sèche}.</p>\n<p><small><strong>Restent ouverts :</strong> profils Warbound/COF2 des Kolkar et du kodo ; DD définitifs ; coûts d’action non confirmés ; effets des quatre niveaux de panique. Les valeurs proposées ne sont pas des règles COF2 officielles.</small></p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.ZvRQjvSnNoUwN1YH]{Mémento MJ — tactique et décisions}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Objectifs, retrait et initiative} \_ · \_ @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Action « Coup de serpe »} \_ · \_ @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Jauge, déclencheurs et statut} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Panique vivante — macro MJ} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ — faits établis en jeu} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{← Scène précédente} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{Scène suivante →}</p>"
