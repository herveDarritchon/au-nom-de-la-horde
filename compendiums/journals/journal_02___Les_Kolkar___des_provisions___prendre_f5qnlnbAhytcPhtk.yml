  - name: Mémento MJ — tactique et décisions
    type: text
    sort: 300000
    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Annexe Warbound — Kolkar et kodo, restitution des échanges des 3 et 7 novembre 2026</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h2>En plein combat — mémento</h2>\n<p><strong>Terrain :</strong> passage du Rocher fendu ; talus de l’éclaireur, couvert rocheux, deux voies de repli. <strong>Cible :</strong> sacs du bât (aucune charrette).</p>\n<table style=\"width:100%;border-collapse:collapse\"><thead><tr><th>Acteur</th><th>Priorité</th><th>Seuil de fin</th></tr></thead><tbody>\n<tr><td>Éclaireur</td><td>Observer, donner le signal, couvrir le vol depuis la hauteur.</td><td>Sa neutralisation/maîtrise déclenche le retrait des deux estafettes.</td></tr>\n<tr><td>Estafette 1</td><td>Prendre un sac par @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Coup de serpe}, puis fuir.</td><td>Se replie à la moitié de ses PV, ou après le vol.</td></tr>\n<tr><td>Estafette 2</td><td>Prendre le deuxième sac, puis fuir.</td><td>Si l’autre décroche à mi-PV : <strong>une ultime tentative</strong>, puis fuite.</td></tr>\n</tbody></table>\n<h3>Ordre de vérification à chaque action significative</h3>\n<ol><li>Le commandement Kolkar est-il neutralisé ? Si oui, repli immédiat des estafettes.</li><li>Une estafette vient-elle d’atteindre la moitié de ses PV ? Si oui, elle fuit et l’autre ne peut tenter qu’un dernier vol.</li><li>Deux sacs sont-ils emportés ? Si oui, les Kolkar quittent l’affrontement.</li><li>Un événement menace-t-il le kodo ? Si oui, regarder @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{le cadre de panique}, <em>sans jet systématique à chaque round</em>.</li><li>Après le combat : consigner @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{le bilan} et le @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{retard}.</li></ol>\n<p><strong>Éviter :</strong> faire combattre les Kolkar jusqu’au dernier PV ; créer un piétinement automatique ; imposer un seuil de fuite de groupe non validé ; confondre kodo de bât et chariot de Mâche-Roc.</p>\n<p><strong>Règles :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Fuite des Kolkar} · @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Coup de serpe} · @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Kodo} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Panique vivante}.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.XQnetYn9TOcJZB8b]{Décisions &amp; conséquences}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Objectifs, retrait et initiative} \_ · \_ @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Action « Coup de serpe »} \_ · \_ @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Jauge, déclencheurs et statut} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Panique vivante — macro MJ} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ — faits établis en jeu} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{← Scène précédente} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntr