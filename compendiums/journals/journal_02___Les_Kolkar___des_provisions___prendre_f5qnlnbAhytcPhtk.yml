pages:
  - name: À jouer — récit & situations
    type: text
    sort: 100000
    text:
      format: 1
      content: "<p></p><small><p><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement </p></small><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><p>Cette scène se déroule au passage du <strong>Rocher fendu</strong>, avant Roche-Sèche. <strong>Gurok conduit un kodo de bât, chargé de provisions et d’eau, sans chariot.</strong> Jazty dirige l’escorte. Le chariot de Mâche-Roc n’apparaît qu’à Roche-Sèche.</p><p><strong>Accès MJ pendant le combat :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.ZvRQjvSnNoUwN1YH]{Mémento tactique de l’embuscade} · @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Objectifs et fuite des Kolkar} · @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Coup de serpe} · @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Panique du kodo} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Compteur vivant du kodo} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan à reporter}.</p><p><em>MATIN · TENSION, ACTION, PUIS APRÈS-COUP</em></p><blockquote style=\"border-left:4px solid #bd8950;padding:8px 12px\"><p><strong>À LIRE OU REFORMULER</strong></p><p>Un grondement de sabots trouble le rythme du kodo. Sur les hauteurs, un mouvement soulève la poussière. Une silhouette centaure apparaît, puis une seconde, plus bas, déjà à portée du chemin. L'un des Kolkar tient une lame courte à la main. Il ne regarde ni vos armes ni vos bourses : ses yeux suivent les sacs attachés aux flancs du kodo. Puis les autres surgissent, vite, assez près pour vous forcer à réagir.</p></blockquote><p>Jouer l'intention des assaillants sans la déclarer comme une information de MJ : ils cherchent les vivres. Un éclaireur sur le talus couvre deux estafettes : chacune vise un sac, puis se replie. Ils décrochent dès que l'opération tourne mal ; l'affrontement n'a pas pour objet d'exterminer l'escorte.</p><p style=\"border-left:3px solid #a9814d;padding-left:10px\"><strong>MJ — </strong>Ce que les PJ perçoivent. Les Kolkar jettent des coups d'œil aux sacs, cherchent à atteindre les sangles du bât et hésitent à s'engager dans une mêlée prolongée. Si un PJ défend le chargement, l'adversaire peut renoncer à ce côté et tenter l'autre.</p><p style=\"border-left:3px solid #a9814d;padding-left:10px\"><strong>MJ — </strong>Si le kodo panique. Le kodo se cabre ; les sacoches tirent sur leurs sangles et un péon se jette sur le côté pour ne pas être renversé. Décrire d'abord le danger physique ; proposer une possibilité d'intervention avant de raconter une perte irréversible.</p><p style=\"border-left:3px solid #a9814d;padding-left:10px\"><strong>MJ — </strong>Si un péon est menacé. Un travailleur attrape un paquet tombé, puis comprend trop tard qu'il est sous les pattes du kodo affolé. Ce danger peut remplacer une tentative de vol, sans imposer qu'il survienne si les PJ ont déjà mis les personnes à l'abri.</p><p>Ne pas chercher à faire durer l'affrontement après que son enjeu est résolu. Les survivants s'éloignent avec ce qu'ils ont pu emporter, ou sans rien. L'important est ce qui reste sur la route.</p><blockquote style=\"border-left:4px solid #bd8950;padding:8px 12px\"><p><strong>APRÈS LE DANGER</strong></p><p>Quand le bruit des sabots s'éloigne, la poussière retombe lentement sur les sacs et les épaules. Le kodo souffle fort. Un péon compte les ballots du bout des doigts ; un autre reste accroupi près d’un ballot tombé, à reprendre son souffle. La route n'a pas changé. Le convoi, si.</p></blockquote><table style=\"width:100%;border-collapse:collapse\"><thead><tr><th><p>SITUATION</p></th><th><p>À FAIRE VIVRE</p></th></tr></thead><tbody><tr><td><p>Chargement préservé</p></td><td><p>Un convoyeur remercie ceux qui sont restés près des vivres. Il repart volontiers dès que les sangles sont vérifiées.</p></td></tr><tr><td><p>Marchandises perdues</p></td><td><p>Le responsable fait compter les pièces disparues ; il demande un récit précis, sans attribuer automatiquement les pertes à une faute des PJ.</p></td></tr><tr><td><p>Péon aidé ou abandonné</p></td><td><p>La personne concernée se souviendra des gestes reçus. Son attitude au bivouac sera plus parlante qu’un score de réputation.</p></td></tr><tr><td><p>Attelage éprouvé</p></td><td><p>Le travail de remise en ordre devient visible : corde à remplacer, bête à apaiser, sacs à réarrimer. Cela peut coûter du temps.</p></td></tr></tbody></table><p></p><small><p>Renvoi au document maître v0.2 : actions de pillage, panique du kodo et retards (sections 2.B, 3 et 4 bis.2) ; résultats mécaniques encore à finaliser dans le maître.</p></small><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.XQnetYn9TOcJZB8b]{Décisions &amp; conséquences} \_ · \_ @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.ZvRQjvSnNoUwN1YH]{Mémento MJ — tactique et décisions}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Objectifs, retrait et initiative} \_ · \_ @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Action « Coup de serpe »} \_ · \_ @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Jauge, déclencheurs et statut} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.bCjp2iO5Zucz6Yee]{Panique vivante — macro MJ} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ — faits établis en jeu} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{← Scène précédente} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{Scène suivante →}</p>"
