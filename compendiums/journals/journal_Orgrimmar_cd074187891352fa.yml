  - _id: e0870bccc64bf3dc
    name: Orgrimmar
    type: text
    text:
      content: >-
        <p>Nichée dans une vallée fortifiée au nord de
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.16b7eb16efab8226.JournalEntryPage.c27c85bb2e09710f]{Durotar}</strong>,
        <strong>Orgrimmar</strong> est la jeune et imposante capitale de la
        nouvelle Horde. Nommée en l'honneur de l'ancien Chef de guerre
        <em><strong>Orgrim Marteau-du-Destin</strong></em>, la cité est le cœur
        politique et militaire de la nation naissante bâtie par
        <strong>Thrall</strong>. C'est une ville en pleine construction, où la
        roche rouge, le bois et le cuir s'entremêlent au rythme incessant des
        pioches, des caravanes et du grondement des forges. Trolls, Taurens et
        Orcs y affluent pour prêter allégeance et participer à l'émergence de ce
        nouveau foyer.</p>

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/orgrimmar.webp?v=bb446a891a65"
        alt="orgrimmar.jpg" width="500"></p>
      format: 1
