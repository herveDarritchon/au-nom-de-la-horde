      content: >-
        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Les PJ constatent que ses traces ne
        dépassent presque jamais certaines limites. La scène doit permettre de
        comprendre qu'il défend un territoire.</p>

        <h2>Évolution hors champ</h2><p>S'il reste vivant, il devient un élément
        permanent du paysage. S'il meurt, le territoire libéré peut être occupé
        par d'autres prédateurs ou chasseurs.</p>

