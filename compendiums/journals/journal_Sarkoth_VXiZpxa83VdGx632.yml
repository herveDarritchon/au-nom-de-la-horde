  - sort: 200000
    name: Relations avec les PJ
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Ce n'est pas une relation
        sociale : les PJ peuvent comprendre ses limites territoriales et agir en
        conséquence.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Provocation, intrusion
        persistante, poursuite ou attaque.</p>

        <h2>Liens personnels possibles</h2>

        <h3>Le passé d'un PJ</h3><p>Honte, dette, histoire familiale, mensonge,
        peur ou envie de se prouver quelque chose.</p><h3>Le
        territoire</h3><p>S'il reste vivant, les PJ peuvent apprendre à
        contourner sa zone et finir par parler de lui comme d'une présence
        permanente.</p><h2>S'il devient un allié</h2><p>Pas un allié au sens
        humain. S'il survit, son territoire devient un fait connu et
        éventuellement exploitable.</p><h2>S'il devient hostile</h2><p>Peut être
        tué, chassé ou rester une menace locale. Il ne travaille pas pour Yarrog
        et n'est pas automatiquement lié au fil rouge.</p>
