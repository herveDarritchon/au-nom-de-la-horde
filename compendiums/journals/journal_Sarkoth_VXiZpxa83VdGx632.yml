        <h1>Sarkoth</h1>

        <blockquote><p><strong>[CANON] scorpide emblématique ; lien personnel
        [ACQUIS WARBAND]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Une relation sans paroles. Danger naturel
        de Durotar et miroir possible du passé d'un PJ.</p>

        <h2>Présence</h2><p>Scorpide massif, carapace balafrée, dard sombre,
        territoire nettement marqué.</p>

        <h2>Voix et répliques</h2><ul><li>—</li></ul>

        <h2>Veut</h2><p>Défendre son territoire.</p>

        <h2>Craint</h2><ul><li>être acculé</li><li>être gravement
        blessé</li><li>voir son territoire envahi</li></ul>
