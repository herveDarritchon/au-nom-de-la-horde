  - _id: 30d9ba7f31ed7a9f
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z01</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z01-01</code>
        Orgrimmar</td><td>Convergence</td><td>[PC]
        [FAC]</td></tr><tr><td><code>Z01-02</code> Portes et voies de
        convois</td><td>Couloir fonctionnel</td><td>[FAC] — géométrie à
        préciser</td></tr><tr><td><code>Z01-03</code> Travaux /
        approvisionnement d'excavation</td><td>Projet de campagne</td><td>[FAC]
        — emplacement à préciser</td></tr><tr><td><code>Z01-04</code> Seuil vers
        le Gouffre de Ragefeu</td><td>Transition donjon</td><td>[PC]
        [FAC]</td></tr></tbody></table><h3>Implantation et rôle des
        lieux</h3><p><code>Z01-01</code> Orgrimmar (destination de convergence)
        ; <code>Z01-02</code> portes et voies d'accès des convois
        <strong>[fonction de campagne, emplacement exact à fixer]</strong> ;
        <code>Z01-03</code> approvisionnements des travaux d'excavation
        <strong>[FAC — campagne, pas POI Classic fixé]</strong> ;
        <code>Z01-04</code> accès au Gouffre de Ragefeu <strong>[seuil, non
        sous-zone de voyage]</strong>.</p><h3>Connaissance des PJ (à
        renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
