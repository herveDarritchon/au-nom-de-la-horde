      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Repères de zone —
        Z01</h2><table><thead><tr><th>Champ</th><th>Information</th></tr></thead><tbody><tr><td>Nom</td><td>Portes
        et abords d'Orgrimmar</td></tr><tr><td>Situation / limite</td><td>Nord,
        axe d'arrivée des convois et abords immédiats de la
        capitale</td></tr><tr><td>Influence
        structurante</td><td><strong>Horde</strong> ; Lame ardente et Cercle en
        clandestin</td></tr><tr><td>Statut dans la
        campagne</td><td>Convergence</td></tr><tr><td>Danger COF2 de départ (à
        confirmer)</td><td><strong>Civilisée DD 10</strong> pour l'accès
        sécurisé ; <strong>frontalière DD 10</strong> hors des
        protections</td></tr><tr><td>Distance et durée</td><td><strong>Non
        calibrées</strong> : à renseigner par liaison /
        tronçon.</td></tr></tbody></table><h3>Situation de
        départ</h3><p>carrefour nord entre la capitale, les sorties vers le
        reste de Durotar et les convois acheminant matériaux et ouvriers. Le
        <strong>Gouffre de Ragefeu</strong> est un objectif <strong>souterrain
        distinct</strong>, non un secteur à traverser pendant une marche
        ordinaire. [PC] [FAC]</p><blockquote><p><strong>Document réservé au
        MJ.</strong> Le zonage, les DD et les incidents sont des propositions
        Warbound. Les secrets des factions ne sont pas connus des PJ. La
        difficulté effective est fixée <strong>par trajet avant le jet du
        Guide</strong>, pas automatiquement pour toute la
        zone.</p></blockquote><h3>Mémo : comment utiliser cette zone</h3><ol>

        <li>Situer le trajet et les POI réellement connus.</li>

        <li>Montrer les itinéraires plausibles et leurs compromis.</li>

        <li>Choisir ellipse, scène ou journée de voyage Warbound V2.</li>

        <li>En cas de journée jouée : Guide INT (Survie) d’abord, Éclaireur PER
        (Survie) et Voyageurs CON (Survie) ensuite.</li>

        <li>Appliquer le bilan COF2, puis mettre à jour les POI, routes et
        factions concernés.</li>

        </ol>
