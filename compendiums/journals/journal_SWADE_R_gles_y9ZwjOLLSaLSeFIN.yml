  - sort: 200000
    name: Race
    type: text
    _id: eVkEPkNzJRfUH6fO
    system: {}
    title:
      show: false
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <h2>Race</h2><p class="p2">Azeroth abrite de nombreux peuples aux
        origines, cultures et aptitudes très différentes :
        <strong>@UUID[.abdFf6AaiOWMLsgL]{Orcs}</strong>, Trolls, Taurens,
        Réprouvés, Elfes de sang et bien d’autres. Votre choix de race définit
        une part importante de l’identité de votre personnage et lui accorde les
        Capacités innées propres à son peuple.</p><p>Vous pouvez choisir
        n’importe quelle race disponible dans la campagne. Chaque race Warbound
        possède ses propres forces, faiblesses et options de
        personnalisation.</p><p>▶ À la création, choisissez également un Atout
        racial ou culturel parmi ceux proposés pour votre race. Il représente
        une tradition, un héritage ou une aptitude particulière de votre
        personnage et permet de différencier deux héros issus d’un même
        peuple.</p><p class="p1"></p>
    video:
