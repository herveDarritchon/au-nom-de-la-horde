      content: >-
        <h1>CRÉATION DE PERSONNAGE</h1><p class="p2">Les grands héros sont
        davantage qu’une suite de caractéristiques et de chiffres, mais dans un
        système de jeu, c’est sans aucun doute un point de départ. Pour créer
        votre héros, munissez-vous d’une feuille de personnage (disponible sur
        le site de Black Book Éditions), ou photocopiez celle que vous trouverez
        à la fin de cet ouvrage, et suivez les étapes suivantes.</p>
