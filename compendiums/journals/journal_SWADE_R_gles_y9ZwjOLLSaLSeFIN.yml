  - sort: 400000
    name: Les Attributs
    type: text
    _id: 0EJ0sb7HXqXAWsHL
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <h3>Les Attributs</h3><p>Chaque personnage commence le jeu avec un d4
        dans chaque <strong>Attribut</strong>. Vous disposez de 5 points à
        répartir comme vous le souhaitez pour les augmenter. Améliorer l’un
        d’entre eux d’un type de dé (par exemple, de d4 à d6) coûte 1 point avec
        une limite : vous ne pouvez aller au-delà du d12.</p><p class="p1"><span
        class="s1">▶ </span><span class="s2"><strong>Agilité :</strong>
        </span>elle représente la souplesse, la rapidité et la dextérité de
        votre héros.</p><p class="p1"><span class="s1">▶ </span><span
        class="s2"><strong>Âme :</strong> </span>elle représente la sagesse
        innée et sa volonté. L’Âme est particulièrement importante car il aide
        votre héros à se ressaisir après une blessure.</p><p class="p1"><span
        class="s1">▶ </span><span class="s2"><strong>Force :</strong>
        </span>elle reflète la puissance et la condition physique générale. La
        Force sert également à déterminer les dégâts de votre personnage en
        combat de corps à corps.</p><p class="p1"><span class="s1">▶
        </span><span class="s2"><strong>Intellect :</strong> </span>il reflète
        la connaissance de votre héros sur son monde et sa culture, sa capacité
        de réflexion et sa finesse d’esprit.</p><p class="p1"><span class="s1">▶
        </span><span class="s2"><strong>Vigueur :</strong> </span>il représente
        l’endurance, la résistance aux maladies, poisons ou toxines et le niveau
        de douleur et de dégâts physiques que votre héros peut supporter.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    ownership:
      default: -1
      i2MQVvBnWjyhmgzX: 3
