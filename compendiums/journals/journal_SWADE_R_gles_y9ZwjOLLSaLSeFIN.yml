  - sort: 600000
    name: Caractéristiques Dérivées
    type: text
    _id: JsCXWEgwKNmT332a
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <h3>Caractéristiques dérivées</h3><p class="p2">Votre fiche de
        personnage comporte encore quelques trous, en particulier les
        caractéristiques dérivées :</p><p class="p2">L’<span
        class="s1">Allure</span> représente la rapidité de déplacement en cases
        du personnage dans un round de combat standard. Les humains se déplacent
        de cases dans un round. Chaque case représente un carré de 2 mètres de
        côté dans le « monde réel ».</p><p class="p2">Le <span
        class="s1">Charisme</span> réunit l’apparence, les manières et l’effet
        que le personnage provoque chez les autres. Notez +0 sauf si vous avez
        choisi un Atout ou un Handicap modifiant ce score. Les jets de
        Persuasion et de Réseaux sont modifiés par le Charisme qui sert
        également au MJ à déterminer la réaction des personnages non-joueurs
        envers votre héros.</p><p class="p2">La <span class="s1">Parade</span>
        est égale à 2 plus la moitié de la Compétence Combat du personnage (2
        s’il ne possède pas Combat), à quoi on ajoute les bonus pour les
        boucliers ou certaines armes. La Parade représente la Difficulté des
        attaques de corps à corps dont votre personnage est la cible.</p><p
        class="p2">Si la Compétence de Combat est supérieure à d12, d12+1 par
        exemple, on ajoute la moitié du bonus arrondi à l’inférieur. Par
        exemple, avec d12+1 en Combat, on a une Parade de 8, alors qu’on a une
        Parade de 9 avec d12+2.</p><p class="p2">La <span
        class="s1">Résistance</span> indique le seuil de souffrance du héros, sa
        capacité à encaisser les coups. La Résistance est égale à 2 plus la
        moitié de votre Vigueur, à quoi on ajoute l’Armure (utilisez la valeur
        d’armure pour le torse). La Résistance pour une Vigueur supérieure à d12
        est calculée de la même manière que la parade.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
