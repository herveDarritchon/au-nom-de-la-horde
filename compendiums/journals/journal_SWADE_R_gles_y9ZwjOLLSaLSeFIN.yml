  - sort: 250000
    name: Trolls
    type: text
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <blockquote><p><strong>« Là où les autres pansent leurs plaies, le Troll
        revient déjà dans la chasse. »</strong></p></blockquote><p>Les Trolls
        Sombrelance appartiennent à un peuple ancien d’Azeroth, façonné par la
        survie, la chasse et une relation profondément spirituelle au monde qui
        l’entoure.</p><p>Leur corps possède une capacité de <strong>régénération
        exceptionnelle</strong> : les blessures qui immobiliseraient longtemps
        d’autres peuples ne suffisent pas toujours à tenir un Troll à terre.
        Lorsque la situation devient critique, ils peuvent également entrer dans
        un bref état de <strong>Berserker</strong>, poussant brutalement leur
        rythme d’action malgré la douleur et la pression du combat.</p><p>Mais
        tous les Sombrelance ne suivent pas la même voie. Certains deviennent
        chasseurs de bêtes, d’autres perpétuent leur maîtrise traditionnelle de
        l’arc ou des armes de jet. Leur caractère, leurs serments et leur
        rapport aux anciennes traditions varient tout autant d’un individu à
        l’autre.</p><hr><h2>Traits raciaux</h2><p><strong>Taille :</strong>
        0<br><strong>Allure :</strong> 6<br><strong>Langues :</strong> Zandali
        et Orc</p><h3>@UUID[Item.nKUBXMBTUSMA23g8]{Régénération
        troll}</h3><h3>@UUID[Item.6M9lCsUGpgY6iAWC]{Berserker}</h3><hr><h2>Une
        faiblesse personnelle</h2><p>Les Sombrelance ont connu l’exil, les
        rivalités et les luttes pour leur survie, mais ces expériences n’ont pas
        façonné tous les Trolls de la même manière.</p><p>À la création,
        choisissez <strong>un Handicap Mineur</strong> représentant le
        caractère, le passé, les obligations ou les ennemis de votre
        personnage.</p><p>Exemples appropriés :</p><p><strong>Rancunier • Têtu •
        Suspicieux • Serment • Ennemi</strong></p><p>Un autre Handicap Mineur
        peut être choisi avec l’accord du MJ s’il représente réellement le
        personnage et produit des situations intéressantes en
        jeu.</p><blockquote><p>Cette faiblesse décrit <strong>votre
        Troll</strong>, pas l’ensemble du peuple
        Sombrelance.</p></blockquote><hr><h2>Héritage Sombrelance</h2><p>À la
        création, choisissez <strong>un</strong> des Atouts raciaux
        suivants.</p><h3>@UUID[Item.HcOd2vtKnUvy4iuJ]{Tueur de
        bêtes}</h3><h3>@UUID[Item.AEzYhbEoP5cpzyIc]{Maîtrise de
        l’arc}</h3><h3>@UUID[Item.63choqpgZ6BErjkt]{Maîtrise du
        lancer}</h3><p>Ces choix représentent davantage l’éducation, les
        traditions et l’expérience du personnage que sa nature biologique. Deux
        Trolls issus du même village peuvent ainsi avoir développé des talents
        très différents.</p><hr><h2>Loas et traditions</h2><p>La spiritualité
        occupe une place importante dans la culture Sombrelance. Les Loas
        peuvent être des guides, des protecteurs, des figures redoutées ou les
        destinataires de rites et de serments transmis depuis des
        générations.</p><p>Cette relation ne constitue cependant pas une
        capacité automatique de tous les Trolls. Un personnage peut être
        profondément dévoué à un Loa, simplement respecter les traditions de son
        peuple ou entretenir avec elles une relation beaucoup plus
        distante.</p><p>Au fil de ses <strong>Progressions</strong>, un Troll
        pourra approfondir cette dimension et développer des Atouts liés à
        certains Loas ou à des traditions particulières.</p><hr><h2>Un peuple de
        chasseurs et de survivants</h2><p>Les longues silhouettes, les défenses
        et la régénération des Trolls les rendent immédiatement reconnaissables,
        mais ne déterminent ni leur métier ni leur tempérament.</p><p>Un
        Sombrelance peut être chasseur, guerrier, chaman, voleur, mage ou suivre
        une voie totalement différente. Ce qui unit son peuple n’est pas une
        manière unique de combattre, mais une extraordinaire capacité à
        <strong>survivre, s’adapter et revenir dans la lutte lorsque d’autres
        seraient déjà tombés</strong>.</p>
