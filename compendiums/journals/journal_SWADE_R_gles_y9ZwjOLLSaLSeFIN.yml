  - sort: 700000
    name: Atouts & Handicaps
    type: text
    _id: VJTxZRumubF2mHQC
    system: {}
    title:
      show: false
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <h2>Atouts et Handicaps</h2><p>Les grands héros sont bien plus qu’une
        simple liste de Compétences et d’Attributs. Ce qui les rend uniques,
        c’est ce mélange de dons particuliers, de pouvoirs spéciaux et de
        défauts tragiques.</p><p>Un personnage choisit des Atouts en les
        équilibrant avec des Handicaps. Vous trouverez une liste détaillée
        d’Atouts et de Handicaps dans les paragraphes suivants. Vous en
        découvrirez encore d’autres dans les univers Savage Worlds
        publiés.</p><p>Vous pouvez choisir jusqu’à un Handicap Majeur et deux
        Handicaps Mineurs. Un Handicap Majeur donne 2 points et un Handicap
        Mineur 1 point.</p><p>Pour 2 points vous pouvez :</p><p>▶ Augmenter un
        Attribut d’un type de dé (vous pouvez le faire avant de prendre vos
        Compétences).</p><p>▶ Choisir un Atout.</p><p>Pour 1 point vous pouvez
        :</p><p>▶ Gagner un point de Compétence.</p><p>▶ Doubler vos fonds de
        départ (si vous débutez avec 500 $, vous obtenez 500 $ de plus).</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
