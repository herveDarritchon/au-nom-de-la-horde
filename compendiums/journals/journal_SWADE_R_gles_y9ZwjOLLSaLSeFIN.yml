  - sort: 900000
    name: ARCHÉTYPES
    type: text
    _id: tpfmN4iw7LaeUiAV
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Archétypes</h1><p>Vous aurez parfois besoin de créer rapidement un
        personnage pour un scénario ou une convention. Dans ce genre de
        situation, un archétype peut s’avérer un bon choix. Il suffit d’y
        adjoindre un nom, quelques Handicaps, de l’équipement, puis de répartir
        les quelques points de Compétence restant, et vous êtes prêts à
        jouer.</p><p class="p1">Les archétypes qui suivent sont tous des humains
        Novice, incluant l’Atout gratuit de cette race.</p>
