        <h1>RACES</h1><p>Tous les héros ne sont pas humains. Suivent quelques
        races communes à plusieurs univers de jeux. Utilisez-les telles quelles,
        ou modifiez-les pour les adapter à un univers particulier. Immédiatement
        suivant les descriptions des races, vous trouverez un ensemble de
        conseils pour créer vos propres races.</p>
