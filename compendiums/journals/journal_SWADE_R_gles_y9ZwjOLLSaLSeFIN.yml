  - sort: 250000
    name: Réprouvés
    type: text
    system: {}
    title:
      show: true
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <blockquote><p><em><strong>« Un corps qui ne devrait plus vivre, une
        volonté qui refuse pourtant de se rendre.
        »</strong></em></p></blockquote><p>Les <strong>Réprouvés</strong> sont
        des morts-vivants ayant brisé l’emprise du Roi-Liche et repris
        possession de leur propre volonté. Leur existence est un paradoxe :
        leurs corps portent encore les marques de la mort, mais leurs pensées,
        leurs ambitions et leurs choix leur appartiennent de nouveau.</p><p>Ils
        ne sont ni les serviteurs dociles du Fléau, ni les êtres qu’ils étaient
        autrefois. Certains cherchent à préserver ce qui subsiste de leur
        ancienne vie ; d’autres considèrent cette existence nouvelle comme une
        rupture définitive avec le passé. Tous savent cependant ce que signifie
        avoir perdu sa liberté — et ce qu’il en coûte pour la
        reprendre.</p><hr><h2>Nature réprouvée</h2><p>Tous les Réprouvés
        possèdent les capacités raciales suivantes
        :</p><h3>@UUID[Item.072oqUTJ0Gh8Hgah]{Résistance à
        l’Ombre}</h3><h3>@UUID[Item.Mn1h0EmWrrdkLZjy]{Respiration
        aquatique}</h3><hr><h2>Héritage réprouvé</h2><p>À la création,
        choisissez <strong>un</strong> des Atouts raciaux disponibles pour votre
        campagne.</p><h3>@UUID[Item.SR66qxC8WmB1VoF0]{Volonté des
        Réprouvés}</h3><h3>@UUID[Item.hS7UO9Dj3GjIYT39]{TOUCHÉ du
        Tombeau}</h3><hr><h2>Mort, mémoire et identité</h2><p>Devenir Réprouvé
        ne constitue pas une origine commune au sens d'un clan ou d'une tribu.
        Chacun possédait une vie avant la mort : une famille, un métier, des
        convictions, des fidélités et parfois des ennemis.</p><p>La question
        n'est donc pas seulement de savoir <strong>qui votre personnage est
        aujourd'hui</strong>, mais aussi ce qu'il conserve de celui ou celle
        qu'il était autrefois.</p><p>A-t-il retrouvé des souvenirs de sa vie
        passée ? Cherche-t-il encore ceux qu'il connaissait ? Considère-t-il son
        ancien nom comme le sien ? Sa mort l'a-t-elle transformé, ou n'a-t-elle
        fait que révéler une part de lui-même qu'il ignorait ?</p><p>Deux
        Réprouvés peuvent avoir subi le même sort et en tirer des conclusions
        radicalement opposées.</p><hr><h2>Parmi la Horde</h2><p>L'alliance avec
        la Horde n'efface ni l'étrangeté ni la méfiance que peut provoquer un
        Réprouvé. Orcs, Trolls et Taurens n'ont aucune raison de considérer
        naturellement un cadavre animé comme un compagnon ordinaire.</p><p>Cette
        réaction reste cependant <strong>une question de fiction et de
        relations</strong>, pas un désavantage racial automatique.</p><p>Votre
        personnage peut chercher à gagner la confiance de ses alliés, cultiver
        volontairement son apparence inquiétante, rester distant ou considérer
        la Horde comme une alliance pragmatique plutôt que comme une nouvelle
        famille.</p><p>Ce sont ses actes qui détermineront progressivement la
        place qu'il occupera parmi les vivants.</p><hr>
