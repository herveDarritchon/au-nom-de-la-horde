  - sort: 500000
    name: Les Compétences
    type: text
    _id: EO3O7eyHUZDXrgXr
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <h3>Les Compétences</h3><p class="p2">Les Compétences représentent les
        aptitudes apprises comme le Tir, le Combat, les connaissances
        professionnelles ou scientifiques et ainsi de suite. Elles sont
        générales et englobent tous les aspects qui leur sont reliés.</p><p
        class="p2">Par exemple Tir englobe les fusils, les arcs, les
        lance-roquettes et toutes les armes à distance.</p><p class="p2">Vous
        disposez de 15 points à répartir entre vos Compétences. Chaque dé de
        Compétence coûte 1 point (en commençant à d4) tant qu’il est inférieur
        ou égal à l’Attribut dont il dépend (noté entre parenthèses près du nom
        de la Compétence). Chaque dé de Compétence supérieur à l’Attribut dont
        il dépend coûte 2 points.</p><p>De même que pour les Attributs, aucune
        Compétence ne peut dépasser d12.</p><blockquote><p><span
        style="text-decoration:underline"><strong><span
        style="text-decoration:underline">EXEMPLE</span></strong></span></p><p
        class="p2">Combat dépend d’Agilité. Un personnage ayant d8 en Agilité
        peut prendre Combat en ne dépensant qu’un point par type de dé jusqu’à
        d8. Prendre un d10 coûtera 2 points et un d12 coûtera 2 points de
        plus.</p></blockquote>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    ownership:
      default: -1
      i2MQVvBnWjyhmgzX: 3
