  - sort: 250000
    name: Orcs
    type: text
    _id: abdFf6AaiOWMLsgL
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <blockquote><p><strong>« Tenir. Frapper au bon moment. Choisir ce que
        l’honneur exige. »</strong></p></blockquote><p>Les Orcs sont un peuple
        de survivants. Arrachés à Draenor, marqués par les guerres et la
        corruption démoniaque, ils cherchent désormais à bâtir une nouvelle
        patrie en Azeroth.</p><p>Puissants et endurants, les Orcs sont capables
        d’encaisser des coups qui feraient plier d’autres combattants. Mais leur
        véritable force ne réside pas seulement dans leur physique : lorsqu’un
        Orc décide que le moment est venu de frapper, sa <strong>Fureur
        sanguinaire</strong> peut transformer quelques secondes de combat en un
        déchaînement brutal.</p><p>Tous les Orcs ne sont pourtant pas des
        guerriers sanguinaires. Leur caractère, leur rapport à l’honneur et
        leurs traditions varient profondément selon leur clan, leur histoire et
        leurs choix. Certains deviennent des meneurs respectés, d’autres
        perfectionnent une tradition martiale, tandis que d’autres encore
        suivent des voies très éloignées du champ de bataille.</p><hr><h2>Traits
        raciaux</h2><p><strong>Taille :</strong> 0<br><strong>Allure :</strong>
        6<br><strong>Langues :</strong> Orc et une autre langue selon l’origine
        du personnage ou la
        campagne.</p><h3>@UUID[Item.xX7suvhtfbYlHDiJ]{Solidité
        orque}</h3><h3>@UUID[Item.X9SGwmB9jv0mB34v]{Fureur
        sanguinaire}</h3><hr><h2>Une faiblesse personnelle</h2><p>Les Orcs
        partagent une histoire difficile, mais ils ne portent pas tous les mêmes
        cicatrices.</p><p>À la création, choisissez <strong>un Handicap
        Mineur</strong> représentant une faiblesse liée à votre personnage, son
        clan, son passé ou sa réputation.</p><p>Exemples appropriés
        :</p><p><strong>@UUID[Item.hE6w2sGiBvtQL5SV]{Déshonoré} •
        @UUID[Item.4rHhmUJreJIzL6yL]{Ennemi} •
        @UUID[Item.iTIQXnpa8ISl5Ces]{Étranger} •
        @UUID[Item.7Z4kVDJIIAQUMgzU]{Impitoyable} •
        @UUID[Item.zJjW1F4h0ruDbF0t]{Bizarrerie}</strong></p><p>Un autre
        Handicap Mineur peut être choisi avec l’accord du MJ s’il représente
        réellement le personnage et produit des situations intéressantes en
        jeu.</p><blockquote><p>Cette faiblesse décrit <strong>votre
        Orc</strong>, pas l’ensemble du peuple
        orc.</p></blockquote><hr><h2>Héritage orc</h2><p>À la création,
        choisissez <strong>un</strong> des Atouts raciaux
        suivants.</p><h3>@UUID[Item.vpEdVamoRd2gc9DE]{Commandement}</h3><h3>@UUID[Item.4kbi3WQxTqnqSnJd]{Maîtrise
        de la hache}</h3><hr><h2>Clans et traditions</h2><p>Frostwolf, Warsong
        et les nombreux autres clans orcs peuvent profondément influencer
        l’éducation, les convictions et les relations de votre
        personnage.</p><p>Ils ne constituent cependant pas des sous-races. Deux
        Orcs d’un même clan peuvent être très différents, tandis que deux
        membres de clans rivaux peuvent partager davantage de valeurs qu’ils ne
        l’imaginent.</p><p>Votre clan est avant tout une <strong>origine, une
        culture et un réseau de relations</strong> : à vous de déterminer ce que
        votre personnage en conserve, ce qu’il rejette et ce qu’il souhaite
        transmettre.</p><hr>
