  - sort: 800000
    name: Histoire Personnelle
    type: text
    _id: zF1TOfZsZJ0EPSQw
    system: {}
    title:
      show: false
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <h2>Histoire Personnelle</h2><p>Terminez la création du personnage en
        détaillant son histoire et son passé. Déterminez les raisons de son
        implication ainsi que ses buts. Vous pouvez également choisir de
        commencer la partie avec votre personnage en l’état, et rajouter ces
        détails plus tard.</p><p>Il peut être aussi intéressant de discuter avec
        les autres joueurs afin de déterminer si les personnages se connaissent
        dès le début de l’aventure, et si oui, des circonstances de leurs
        rencontres. Vous pourrez aussi optimiser le groupe de personnages, afin
        de disposer d’un vaste assortiment de Compétences différentes. Mais
        choisissez quoi qu’il arrive un personnage que vous avez envie de jouer.
        Il n’y a pas de raison que vous preniez le rôle de soigneur du groupe si
        vous n’en ressentez pas l’envie.</p>
    video:
