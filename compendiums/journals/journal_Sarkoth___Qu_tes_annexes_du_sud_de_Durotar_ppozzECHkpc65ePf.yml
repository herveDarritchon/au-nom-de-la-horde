  - _id: ilEx76cubjcdrw7B
    name: 2. Le convoi aux roues mordues
    type: text
    sort: 300000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>2. Le convoi aux roues mordues</h2>

        <h3>Qui, quoi, quand, où, comment ?</h3>

        <ul>

        <li><strong>Quand :</strong> Lors d’un ravitaillement de l’Antre, avant,
        pendant ou après les événements concernant Hana’zua et Sarkoth.</li>

        <li><strong>Où :</strong> Cour des convois de Tranchecolline, puis piste
        de ravitaillement jusqu’à l’Antre, avec un passage friable où le chariot
        s’enlise.</li>

        <li><strong>Qui :</strong> Rogza, conductrice orque, deux péons, un
        apprenti chargé des provisions et les scorpides attirés par la
        cargaison.</li>

        <li><strong>Quoi :</strong> Un lot de viande avariée caché sous les
        provisions attire les scorpides. Les vivres doivent parvenir aux recrues
        sans transporter le danger avec eux.</li>

        <li><strong>Comment :</strong> Inspecter les caisses et les traces,
        protéger le chariot bloqué, identifier l’odeur qui attire les bêtes et
        sauver les vivres sains en nettoyant ou réorganisant le convoi.</li>

        </ul>


        <h3>L'accroche</h3>

        <p>Rogza paie pour des gardes : son dernier convoi a dû faire demi-tour
        après avoir été suivi par des scorpides affamés. Elle accuse Sarkoth ou
        ses rejetons d'avoir « pris goût aux chariots ». La prochaine livraison
        contient des vivres attendus à l'Antre.</p>

        <p><em>À lire lorsque la colonne s'arrête :</em></p>

        <blockquote>

        <p>La roue s'enfonce dans un sol friable. Sous le chariot, de petits
        coups secs résonnent contre les planches. Puis une queue segmentée
        émerge d'une ornière. Une autre apparaît près des tonneaux et, derrière
        le convoi, le sable se met à bouger.</p>

        </blockquote>

        <h3>Ce qui se passe</h3>

        <p>Une partie des provisions a tourné sous la chaleur. Le responsable du
        chargement a tenté de sauver sa cargaison en enfouissant des
        <strong>restes de viande avariée</strong> sous des sacs propres. L'odeur
        attire les scorpides des environs. Ils ne poursuivent pas d'ordre de
        Sarkoth : ils suivent une source de nourriture.</p>

        <h3>À jouer</h3>

        <p><strong>Au départ.</strong> Le garçon insiste pour qu'on ne touche
        pas aux caisses du fond. Un jus sombre fuit d'une planche ; quelques
        scorpides suivent déjà les roues.</p>

        <p><strong>Sur la route.</strong> Le convoi traverse un passage étroit,
        exposé à une attaque de plusieurs jeunes scorpides. Le chariot doit être
        dégagé rapidement ; abandonner toute la cargaison condamnerait les
        recrues à manquer de provisions.</p>

        <p><strong>Le choix logistique.</strong> Les personnages peuvent isoler
        et détruire la viande avariée, nettoyer le chariot, détourner les
        scorpides avec un appât, chercher une piste rocheuse ou escorter des
        vivres par petits groupes.</p>

        <h3>Choix et conséquences</h3>

        <p>Si Rogza livre l'essentiel de sa cargaison, les recrues mangent et
        les convois apprennent à mieux trier les vivres. Si les PJ cachent le
        problème, les scorpides reviennent au prochain voyage. Si le chargement
        est perdu, Gornek doit rationner et demander un nouvel
        approvisionnement. L'apprenti peut être sanctionné ou apprendre de son
        erreur ; il n'a pas cherché à saboter le convoi.</p>

        <p><strong>Sarkoth vivante ou morte :</strong> cette affaire fonctionne
        dans les deux cas. Sa réputation sert de fausse explication commode à un
        problème beaucoup plus terre à terre.</p>

        <hr>
