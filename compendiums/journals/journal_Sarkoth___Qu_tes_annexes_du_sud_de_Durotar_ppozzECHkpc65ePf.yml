        <h1>Sarkoth — Sept quêtes autour de la Mère rouge</h1>

        <h2>Journal des quêtes annexes — Sud de Durotar</h2>

        <blockquote>

        <p><strong>Secteurs :</strong> Vallée des Épreuves, village de Sen’jin,
        pistes vers Tranchecolline<br>

        <strong>Figures récurrentes :</strong> Sarkoth, Hana’zua, Gornek, les
        péons, chasseurs et guérisseurs<br>

        <strong>Durée indicative :</strong> une scène développée à une courte
        séance par quête<br>

        <strong>Usage :</strong> ces situations sont indépendantes de l'affaire
        du venin de Hana’zua. Les aventuriers peuvent en vivre plusieurs, dans
        n'importe quel ordre compatible avec les événements déjà survenus.</p>

        </blockquote>

        <p><strong>Situation du secteur.</strong> Les scorpides ne constituent
        pas une armée. Ils suivent leurs proies, occupent des abris, défendent
        leurs petits et réagissent aux déplacements des autres créatures.
        Sarkoth, appelée <strong>la Mère rouge</strong>, est une vieille
        matriarche dont la présence influence le territoire de nombreuses bêtes
        plus jeunes. Les travaux, les convois et les chasseurs de la Horde
        bouleversent parfois cet équilibre. Les habitants, eux, ont de bonnes
        raisons de vouloir rendre Durotar habitable.</p>

