        <tr>
          <th>Quête</th>
          <th>Départ</th>
          <th>Ton</th>
          <th>Moment le plus naturel</th>
        </tr>

        </thead>

        <tbody>

        <tr>
          <td><strong>1. La griffe et l'honneur</strong></td>
          <td>Vallée des Épreuves / Sen’jin</td>
          <td>Rôle, rivalité, secours</td>
          <td>Après le sort de Hana’zua</td>
        </tr>

        <tr>
          <td><strong>2. Le convoi aux roues mordues</strong></td>
          <td>Route de Tranchecolline</td>
          <td>Escorte, action, découverte</td>
          <td>Avant, pendant ou après</td>
        </tr>

        <tr>
          <td><strong>3. La couvée disparue</strong></td>
          <td>Vallée des Épreuves / Sen’jin</td>
          <td>Enquête, poursuite, dilemme</td>
          <td>Dès que le refuge est connu</td>
        </tr>

        <tr>
          <td><strong>4. Les fioles du faux guérisseur</strong></td>
          <td>Tranchecolline</td>
          <td>Enquête sociale, urgence</td>
          <td>Dès que le venin est réputé</td>
        </tr>

        <tr>
