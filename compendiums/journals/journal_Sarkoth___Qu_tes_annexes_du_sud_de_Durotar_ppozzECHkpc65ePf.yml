          <td>Sud de la Vallée</td>
          <td>Exploration, sauvetage</td>
          <td>À tout moment</td>
        </tr>

        <tr>
          <td><strong>6. Les pierres de la frontière</strong></td>
          <td>Piste des péons</td>
          <td>Négociation, aménagement</td>
          <td>Après les incidents du plateau</td>
        </tr>

        <tr>
          <td><strong>7. Le territoire sans mère</strong></td>
          <td>Vallée / chemin de Sen’jin</td>
          <td>Survie, conséquences, chasse</td>
          <td>Si Sarkoth meurt ou part</td>
        </tr>

