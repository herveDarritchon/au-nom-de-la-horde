  - _id: JA9pnwXYfkvrY4o9
    name: 3. La couvée disparue
    type: text
    sort: 400000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>3. La couvée disparue</h2>

        <h3>Qui, quoi, quand, où, comment ?</h3>

        <ul>

        <li><strong>Quand :</strong> Dès que le refuge de ponte de Sarkoth est
        connu, qu’elle soit encore présente ou non, avant que les jeunes
        scorpides ne soient vendus.</li>

        <li><strong>Où :</strong> Petit abri de ponte près du plateau, piste
        vers Sen’jin, point de transaction des paniers et chariot transportant
        du sel.</li>

        <li><strong>Qui :</strong> Tzali, jeune chasseuse troll en difficulté,
        Mogu, intermédiaire marchand, des acheteurs, trois jeunes scorpides
        capturés et, éventuellement, Sarkoth.</li>

        <li><strong>Quoi :</strong> Trois jeunes scorpides ont été capturés pour
        être vendus. Deux sont transportés dans des paniers ; le troisième s’est
        échappé dans un chargement de sel.</li>

        <li><strong>Comment :</strong> Examiner les traces de capture, remonter
        la piste commerciale, retrouver les trois scorpides et régler le sort
        des captifs sans ignorer les besoins de Tzali ni mettre les voyageurs en
        péril.</li>

        </ul>


        <h3>L'accroche</h3>

        <p>Des coquilles brisées et des traces de bottes sont découvertes près
        d'un petit abri de ponte. Au même moment, à Sen’jin, quelqu'un cherche
        discrètement un acheteur pour « des scorpides encore petits, faciles à
        dresser ». Les jeunes créatures ne sont pas un trésor : elles peuvent
        blesser quiconque les manipule.</p>

        <h3>Ce qui se passe</h3>

        <p>Tzali a capturé <strong>trois jeunes scorpides</strong> dans des
        paniers doublés de cuir pour obtenir de quoi nourrir sa famille. Mogu
        lui a promis une somme importante, mais cherche surtout à revendre les
        bêtes à des chasseurs attirés par leur venin. Un des paniers s'est
        renversé pendant le trajet : le troisième petit s'est caché dans la
        cargaison de sel d'un chariot.</p>

        <h3>À jouer</h3>

        <p><strong>Sur le plateau.</strong> Les traces de bottes et de paniers
        mènent à un replat accessible sans entrer dans le refuge principal. Les
        personnages peuvent découvrir une corde coupée et des empreintes de
        sandales trolls.</p>

        <p><strong>Sur la piste.</strong> Deux paniers changent de mains. Les
        acheteurs se disputent le prix et veulent se débarrasser de la couvée si
        elle devient difficile à transporter. Le dernier scorpide est caché dans
        un chariot où il peut piquer un innocent.</p>

        <p><strong>Au dénouement.</strong> Il faut décider où installer ou
        relâcher les petits sans provoquer une attaque. Sarkoth, si elle vit,
        n'accepte pas que l'on s'approche brutalement de son refuge. Si elle est
        morte, les jeunes devront trouver un autre abri sûr.</p>

        <h3>Choix et conséquences</h3>

        <p>Les PJ peuvent racheter les paniers, convaincre Tzali, arrêter Mogu,
        tromper les acheteurs, libérer les captifs ou leur trouver un enclos
        temporaire. Tzali n'est pas une ennemie jurée : elle a besoin de
        nourriture et a sous-estimé le danger. L'exposer publiquement peut
        décourager le braconnage, mais aggraver sa situation familiale.</p>

        <p><strong>Conséquence durable :</strong> si Mogu s'en tire, le trafic
        se déplacera vers d'autres créatures de Durotar. Si les PJ trouvent une
        alternative honnête à la chasse aux œufs, Tzali peut devenir une
        informatrice utile.</p>

        <hr>
