  - _id: 3hEJLuWqYeKTAOj1
    name: 6. Les pierres de la frontière
    type: text
    sort: 700000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>6. Les pierres de la frontière</h2>

        <h3>Qui, quoi, quand, où, comment ?</h3>

        <ul>

        <li><strong>Quand :</strong> Après plusieurs incidents autour du
        plateau, quand une décision sur la circulation devient urgente : un
        chariot doit repartir dès le lendemain.</li>

        <li><strong>Où :</strong> Poste de Gornek, piste courte longeant les
        rochers et détour du plateau bas avec son gué et sa pente
        difficile.</li>

        <li><strong>Qui :</strong> Gornek, Korga et ses péons, un représentant
        des convoyeurs, des chasseurs locaux et les voyageurs qui dépendent du
        ravitaillement.</li>

        <li><strong>Quoi :</strong> Il faut choisir une route durablement
        praticable sans rendre les convois trop lents ni provoquer de nouvelles
        rencontres dangereuses avec les scorpides.</li>

        <li><strong>Comment :</strong> Reconnaître les deux tracés, constater
        leurs faiblesses, négocier la répartition des travaux et prévoir une
        solution provisoire pour le convoi du lendemain.</li>

        </ul>


        <h3>L'accroche</h3>

        <p>Les incidents du plateau ont montré qu'un simple panneau ne suffit
        pas. Gornek veut une route sûre ; Korga dispose de peu de péons ; les
        convoyeurs refusent un détour trop long ; les chasseurs demandent de
        laisser de l'espace aux scorpides. Aucun des groupes n'a les moyens
        d'imposer seul sa solution.</p>

        <h3>Les deux tracés</h3>

        <p><strong>La piste courte</strong> longe les rochers où passent
        régulièrement les scorpides. Elle facilite le ravitaillement, mais
        expose les jeunes recrues à des rencontres dangereuses. Pour la
        sécuriser, il faudrait maintenir des gardes ou modifier encore le
        relief.</p>

        <p><strong>Le détour du plateau bas</strong> est plus long, avec un gué
        pierreux et une pente difficile pour les chariots. Il préserve les
        abords du refuge, mais exige des travaux et ralentit les livraisons.</p>

        <h3>À jouer</h3>

        <p><strong>La reconnaissance.</strong> Les aventuriers parcourent les
        deux pistes. Ils découvrent une portion friable sur la courte et un
        passage à renforcer sur la longue. Des marques naturelles de scorpides
        révèlent leurs voies habituelles, sans permettre de garantir qu'ils n'en
        sortiront jamais.</p>

        <p><strong>Les négociations.</strong> Gornek veut une décision
        applicable rapidement. Les péons demandent des outils et des bras. Les
        convoyeurs cherchent à partager la charge. Les chasseurs proposent de
        marquer une limite que les recrues devront apprendre à respecter.</p>

        <p><strong>Une difficulté immédiate.</strong> Un chariot doit partir le
        lendemain. Les personnages doivent définir un trajet provisoire avant
        que les travaux soient terminés.</p>

        <h3>Choix et conséquences</h3>

        <p>Les PJ peuvent choisir une piste, financer ou aider les travaux,
        ménager un passage de faune, accompagner provisoirement les convois ou
        établir des consignes de garde. <strong>Aucune solution ne supprime le
        coût :</strong> temps, travail, ravitaillement ou risque devront être
        assumés par quelqu'un.</p>

        <p>Si Sarkoth vit, la route doit tenir compte de sa présence sans
        supposer qu'elle obéira à des bornes. Si elle est morte, de nouveaux
        scorpides peuvent occuper les lieux, ce qui rend les décisions de
        sécurité tout aussi importantes.</p>

        <p><strong>Récompense :</strong> Gornek peut confier aux PJ la
        reconnaissance d'autres pistes ; leur avis devient écouté au poste et
        dans la cour des convois.</p>

        <hr>
