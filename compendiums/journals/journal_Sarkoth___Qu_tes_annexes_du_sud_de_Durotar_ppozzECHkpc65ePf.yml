  - _id: 456NKv7aFucZ8GX2
    name: 1. La griffe et l'honneur
    type: text
    sort: 200000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>1. La griffe et l'honneur</h2>

        <h3>Qui, quoi, quand, où, comment ?</h3>

        <ul>

        <li><strong>Quand :</strong> Après l’affrontement entre Hana’zua et
        Sarkoth, dès que des récits contradictoires circulent sur son courage.
        Si Hana’zua est mort, Razu veut venger sa mémoire ; si Sarkoth est
        morte, il cherche un autre trophée.</li>

        <li><strong>Où :</strong> À l’Antre ou auprès de voyageurs venus de
        Sen’jin, puis dans un défilé rocheux de la Vallée des Épreuves.</li>

        <li><strong>Qui :</strong> Razu, jeune Troll admirateur de Hana’zua,
        deux recrues qui l’accompagnent, Hana’zua s’il a survécu, Gornek et un
        scorpide adulte.</li>

        <li><strong>Quoi :</strong> Razu veut rapporter une griffe pour rétablir
        l’honneur de Hana’zua. Cette recherche de trophée met trois jeunes
        recrues en danger sur une corniche instable.</li>

        <li><strong>Comment :</strong> Suivre le départ de Razu, retrouver le
        groupe dans le défilé, gérer la corniche friable et le scorpide, puis
        décider de la vérité à faire connaître sur Hana’zua et son combat.</li>

        </ul>


        <h3>L'accroche</h3>

        <p>Razu raconte que Hana’zua aurait vaincu Sarkoth à lui seul, ou au
        contraire qu'il aurait fui comme un lâche. Il cherche désespérément une
        preuve pour rétablir l'honneur du jeune Troll : une griffe, une portion
        de carapace, voire la tête d'un scorpide assez grand pour faire
        illusion. Deux recrues l'accompagnent sur les hauteurs.</p>

        <p><em>À entendre auprès des recrues :</em></p>

        <blockquote>

        <p>« Hana’zua aurait dû revenir avec une pince. Razu dit qu'avant demain
        il en rapportera une, lui. Même si la vieille scorpide est toujours là.
        »</p>

        </blockquote>

        <h3>Ce qui se passe</h3>

        <p>Razu n'a jamais rencontré Sarkoth. Il confond courage et trophée, et
        pense sincèrement aider son ami. Il a entraîné ses compagnons dans un
        défilé où un <strong>scorpide adulte</strong> défend son abri. Les trois
        jeunes sont mal équipés pour le terrain et leur retraite est coupée par
        une corniche friable.</p>

        <h3>À jouer</h3>

        <p><strong>Au départ.</strong> Les personnages trouvent un paquet de
        vivres oublié, trois séries de traces et un témoin ayant entendu Razu
        parler de la « grande pince ».</p>

        <p><strong>Dans le défilé.</strong> Un pan de roche cède sous les pieds
        d'une recrue. Razu refuse d'abandonner la chasse tant qu'il n'a pas un
        trophée. Le scorpide se tient devant une fissure, menaçant mais ne
        poursuivant pas ceux qui s'éloignent.</p>

        <p><strong>Au retour.</strong> Hana’zua, s'il est vivant, doit répondre
        aux récits qui circulent ; Gornek rappelle que la vallée n'a pas besoin
        de morts supplémentaires pour entretenir une réputation.</p>

        <h3>Choix et conséquences</h3>

        <p>Les PJ peuvent sauver les recrues par la ruse, tenir le scorpide à
        distance, l'affronter ou convaincre Razu de renoncer. Ils peuvent aussi
        fabriquer un récit glorieux, dire publiquement la vérité ou demander à
        Hana’zua de raconter lui-même ce qui s'est passé. <strong>La vérité peut
        coûter à Razu sa fierté, mais lui gagner une leçon durable.</strong></p>

        <p>Si Hana’zua est mort, Razu veut venger sa mémoire plutôt que prouver
        sa victoire. Si Sarkoth est morte, il tente de retrouver une autre
        grande bête pour rapporter un trophée fictif : l'enjeu reste le
        même.</p>

        <p><strong>Suite possible :</strong> Razu devient un éclaireur prudent
        ou, humilié, s'engage avec des chasseurs moins scrupuleux.</p>

        <hr>
