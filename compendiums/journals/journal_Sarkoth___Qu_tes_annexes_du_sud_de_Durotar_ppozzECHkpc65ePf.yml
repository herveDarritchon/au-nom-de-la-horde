  - _id: kPsTIdIIx3XoYY1B
    name: 7. Le territoire sans mère
    type: text
    sort: 800000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>7. Le territoire sans mère</h2>

        <h3>Qui, quoi, quand, où, comment ?</h3>

        <ul>

        <li><strong>Quand :</strong> Quelques jours après la mort ou le départ
        de Sarkoth. Si elle demeure sur place, une sécheresse ou un déplacement
        de jeunes scorpides peut produire le même déséquilibre.</li>

        <li><strong>Où :</strong> Vallée des Épreuves et chemins vers Sen’jin :
        abri à outils, point d’eau temporaire et ancien passage de la Mère
        rouge.</li>

        <li><strong>Qui :</strong> Gornek, chasseurs Sombrelance, péons des
        pistes, deux scorpides adultes rivaux et plusieurs scorpides plus jeunes
        déplacés.</li>

        <li><strong>Quoi :</strong> Les secteurs de chasse laissés libres sont
        disputés. Des scorpides se rapprochent des habitations et réserves
        d’eau, tandis que les habitants envisagent de brûler ou détruire leurs
        abris.</li>

        <li><strong>Comment :</strong> Examiner les trois foyers, distinguer les
        conflits territoriaux d’une prétendue vengeance, protéger les provisions
        et choisir entre déplacement, surveillance, fermeture d’abris ou
        élimination ciblée.</li>

        </ul>


        <h3>L'accroche</h3>

        <p>Depuis que Sarkoth a disparu, les petites piqûres se multiplient en
        plusieurs endroits à la fois. Les recrues parlent d'une vengeance de ses
        rejetons. Un groupe de chasseurs demande l'autorisation de nettoyer tous
        les abris scorpides autour de la route.</p>

        <h3>Ce qui se passe</h3>

        <p>La disparition de la matriarche a libéré ses secteurs de chasse. Deux
        <strong>scorpides adultes</strong> se disputent les abris les plus frais
        ; les plus jeunes fuient vers des crevasses proches des chemins et des
        réserves d'eau. Il n'y a aucune attaque coordonnée et aucun esprit
        vengeur.</p>

        <h3>À jouer</h3>

        <p><strong>Trois foyers.</strong> Des scorpides se sont installés sous
        un abri à outils ; un autre groupe suit la piste d'un point d'eau
        temporaire ; deux adultes s'affrontent près d'un ancien passage de la
        Mère rouge. Les personnages peuvent visiter les sites dans l'ordre
        voulu.</p>

        <p><strong>Indices.</strong> Les traces montrent plusieurs tailles et
        directions. Les attaques se produisent lorsque les habitants approchent
        des abris ou des points d'eau. Des carcasses de petites bêtes signalent
        la présence de nouveaux territoires de chasse.</p>

        <p><strong>L'urgence.</strong> Des péons menacent de brûler l'abri à
        outils alors que des provisions y sont entreposées. Les chasseurs
        préfèrent tuer les adultes immédiatement, mais risquent de faire fuir
        les plus jeunes dans d'autres crevasses.</p>

        <h3>Choix et conséquences</h3>

        <p>Les PJ peuvent condamner les abris accessibles depuis les chemins,
        dégager un couloir vers des rochers moins fréquentés, déplacer
        temporairement les vivres et les points d'eau, capturer ou abattre les
        adultes les plus dangereux, ou organiser la surveillance de quelques
        secteurs sensibles.</p>

        <p>Éliminer les scorpides près des habitations sauve des vies, mais
        <strong>une extermination improvisée</strong> risque de simplement les
        disperser. Un aménagement bien pensé limite durablement les rencontres,
        même si le plateau reste sauvage.</p>

        <p><strong>Variante si Sarkoth vit :</strong> une sécheresse ou le
        départ forcé de plusieurs jeunes scorpides crée le même déséquilibre sur
        un secteur périphérique, sans transformer Sarkoth en responsable
        consciente des incidents.</p>

        <hr>
