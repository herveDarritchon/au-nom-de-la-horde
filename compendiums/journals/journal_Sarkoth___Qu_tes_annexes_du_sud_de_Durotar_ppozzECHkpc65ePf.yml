  - _id: Hxvk1r8zTAC7Kqky
    name: 4. Les fioles du faux guérisseur
    type: text
    sort: 500000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>4. Les fioles du faux guérisseur</h2>

        <h3>Qui, quoi, quand, où, comment ?</h3>

        <ul>

        <li><strong>Quand :</strong> Lorsque la réputation du venin de Sarkoth
        et des antidotes s’est diffusée dans la région, alors qu’un péon
        empoisonné est en danger.</li>

        <li><strong>Où :</strong> Auberge, étals de vente et réserves d’un
        marchand à Tranchecolline.</li>

        <li><strong>Qui :</strong> Mogu, vendeur des prétendus antidotes, une
        guérisseuse de passage, le péon malade, sa famille, des clients trompés
        et les gardes.</li>

        <li><strong>Quoi :</strong> Mogu vend comme antivenin rare un remède
        ordinaire fortement dilué. Son mensonge compromet les soins d’un blessé
        et risque de provoquer la colère des habitants.</li>

        <li><strong>Comment :</strong> Faire soigner le péon en priorité,
        comparer les fioles, vérifier achats et témoignages, confronter Mogu et
        obtenir une réparation sans laisser dégénérer la situation.</li>

        </ul>


        <h3>L'accroche</h3>

        <p>Un marchand propose un « antidote de la Mère rouge », prétendument
        efficace contre tous les scorpides. Après l'avoir bu, un péon empoisonné
        s'affaiblit au lieu de guérir. Sa famille vient demander de l'aide aux
        personnages, tandis que le vendeur affirme que le malade a simplement
        trop attendu.</p>

        <h3>Ce qui se passe</h3>

        <p>Les fioles contiennent <strong>un remède ordinaire très
        dilué</strong>, vendu comme une préparation rare. Le produit n'est pas
        magique ; il est seulement insuffisant contre les intoxications graves.
        Mogu a acheté des ingrédients bon marché et ment sur leur provenance
        pour profiter de la peur née autour de Sarkoth.</p>

        <h3>À jouer</h3>

        <p><strong>Le malade.</strong> Il faut d'abord obtenir de vrais soins,
        sans attendre la fin de l'enquête. Une guérisseuse peut administrer un
        antidote adapté au type de scorpide responsable de la piqûre.</p>

        <p><strong>Les indices.</strong> Plusieurs flacons ont une odeur
        identique à celle de l'antidote courant. Le registre du vendeur montre
        des achats bon marché en grande quantité ; une fiole prétendument
        ancienne porte une étiquette trop récente. D'autres clients témoignent
        d'effets très variables.</p>

        <p><strong>La confrontation.</strong> Mogu propose un remboursement
        discret, prétend protéger la liberté du commerce ou tente de quitter
        Tranchecolline avec ses dernières caisses. Des clients en colère peuvent
        vouloir le lyncher avant qu'il ait rendu l'argent et révélé ses circuits
        d'approvisionnement.</p>

        <h3>Choix et conséquences</h3>

        <p>Les PJ peuvent recueillir des témoignages, saisir les stocks avec
        l'appui des gardes, exiger des remboursements ou laisser Gornek informer
        les postes de recrues. Un marchand arrêté ne rend pas automatiquement
        les soins disponibles : la vraie difficulté est de rétablir la confiance
        et les réserves médicales.</p>

        <p><strong>Sarkoth vivante ou morte :</strong> la fraude utilise son
        nom, pas son venin. Si la vraie préparation est rare, l'escroquerie
        devient plus tentante encore.</p>

        <hr>
