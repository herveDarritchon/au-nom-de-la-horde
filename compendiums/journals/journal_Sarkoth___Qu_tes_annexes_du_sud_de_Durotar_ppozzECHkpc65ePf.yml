  - _id: PlSFp4FIebIE9O9b
    name: Suivre les conséquences en campagne
    type: text
    sort: 900000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Suivre les conséquences en campagne</h2>

        <table>

        <thead>

        <tr>
          <th>Ce que les personnages ont fait</th>
          <th>Évolution possible du sud de Durotar</th>
        </tr>

        </thead>

        <tbody>

        <tr>
          <td>Ils ont épargné Sarkoth et protégé son refuge.</td>
          <td>Des chasseurs souhaitent profiter de son venin ; les routes doivent respecter ses abords.</td>
        </tr>

        <tr>
          <td>Ils l'ont tuée ou chassée.</td>
          <td>D'autres scorpides occupent les abris libérés ; les patrouilles redoutent une nouvelle vague d'incidents.</td>
        </tr>

        <tr>
          <td>Ils ont montré l'origine réelle d'un danger.</td>
          <td>Gornek ou les convoyeurs leur font davantage confiance pour de nouvelles reconnaissances.</td>
        </tr>

        <tr>
          <td>Ils ont laissé courir des récits mensongers.</td>
          <td>Les trophées et les faux remèdes gagnent en valeur aux yeux des habitants.</td>
        </tr>

        <tr>
          <td>Ils ont aidé des péons et protégé les vivres.</td>
          <td>L'Antre et Tranchecolline reconnaissent leur utilité dans la construction de la jeune Horde.</td>
        </tr>

        <tr>
          <td>Ils ont livré des braconniers aux autorités.</td>
          <td>Le commerce clandestin peut se déplacer ; certains chasseurs apprécient moins leur intervention.</td>
        </tr>

        </tbody>

        </table>

        <p><strong>Repère MJ :</strong> les quêtes n'exigent pas que Sarkoth
        soit toujours en vie. Certaines parlent de sa réputation ou des traces
        qu'elle a laissées, d'autres explorent les conséquences concrètes de sa
        disparition. Il n'est pas nécessaire de les jouer toutes : choisis
        celles qui découlent des décisions déjà prises par les aventuriers.</p>
