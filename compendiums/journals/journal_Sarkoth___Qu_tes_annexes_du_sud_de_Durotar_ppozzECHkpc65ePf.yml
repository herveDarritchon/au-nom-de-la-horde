  - _id: VIFhP2tgi3QQC344
    name: 5. La mue du ravin
    type: text
    sort: 600000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>5. La mue du ravin</h2>

        <h3>Qui, quoi, quand, où, comment ?</h3>

        <ul>

        <li><strong>Quand :</strong> À tout moment pendant les travaux des
        pistes, après la disparition d’un péon et avant la tombée de la
        nuit.</li>

        <li><strong>Où :</strong> Sentier méridional de la Vallée des Épreuves,
        puis ravin escarpé où une immense mue s’est coincée entre deux
        parois.</li>

        <li><strong>Qui :</strong> Korga, responsable des travaux, un péon
        coincé sur une corniche et les petits scorpides vivant dans les fissures
        du ravin.</li>

        <li><strong>Quoi :</strong> En tentant de récupérer de la chitine d’une
        ancienne mue, un péon a provoqué un éboulement et s’est retrouvé bloqué,
        la jambe prise sous les pierres.</li>

        <li><strong>Comment :</strong> Repérer un accès sûr, éviter d’ébranler
        les abris des scorpides, dégager ou hisser le blessé, puis décider si la
        mue peut être récupérée sans causer un nouvel effondrement.</li>

        </ul>


        <h3>L'accroche</h3>

        <p>Un péon chargé de repérer des pierres pour réparer une piste ne
        revient pas. Son dernier message évoquait une <strong>carapace de
        scorpide gigantesque</strong>, peut-être une vieille mue de Sarkoth,
        coincée dans un ravin. Korga craint un accident et demande qu'on le
        retrouve avant la tombée de la nuit.</p>

        <p><em>À lire au bord du ravin :</em></p>

        <blockquote>

        <p>Une immense carapace vide, couleur de cuivre terni, est accrochée
        entre deux parois. Elle ressemble à un scorpide pétrifié. Plus bas, un
        souffle rauque monte d'un amas de pierres. Tout près, de petites
        silhouettes se glissent dans les fissures.</p>

        </blockquote>

        <h3>Ce qui se passe</h3>

        <p>Le péon voulait dégager les plaques de chitine, utilisables comme
        matériau de protection. Un bloc s'est détaché sous son poids et l'a
        coincé sur une corniche. Les petits scorpides qui vivent à l'ombre du
        ravin s'agitent à chaque chute de caillou.</p>

        <h3>À jouer</h3>

        <p><strong>Trouver le bon accès.</strong> La descente directe est
        dangereuse. Une fente latérale mène derrière la vieille mue ; une corde
        ou une reconnaissance attentive permet de distinguer les pierres
        instables.</p>

        <p><strong>Récupérer le blessé.</strong> Le péon a une jambe coincée.
        Les personnages doivent répartir leur poids, le hisser ou déblayer
        prudemment. Des scorpides défendent leurs abris s'ils sont piétinés.</p>

        <p><strong>La carapace.</strong> Elle peut être laissée sur place,
        détachée par morceaux sans nouveaux éboulements ou récupérée plus tard,
        lorsque le passage aura été sécurisé.</p>

        <h3>Choix et conséquences</h3>

        <p>Sauver le péon sans provoquer l'effondrement donne la priorité aux
        vies plutôt qu'au matériau. Korga peut utiliser une partie de la chitine
        pour protéger les mains des ouvriers ou consolider un équipement léger.
        Si les personnages insistent pour prendre toute la mue immédiatement,
        ils risquent d'endommager davantage le ravin.</p>

        <p>Si Sarkoth est vivante, sa mue ne lui confère aucune propriété
        magique ni lien de contrôle sur les autres scorpides. Si elle est morte,
        cette carapace reste une trace tangible de son ancienneté.</p>

        <hr>
