        <h1>Donjon de Tiragarde</h1>

        <p><strong>Identifiant :</strong> Z06-01</p>

        <p><strong>Zone géographique :</strong> Z06 — Côte des Naufrages et
        Tiragarde</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Nœud [4],
        mini-donjon</p>

        <h2>Fonction dans la campagne</h2>

        <p>Position de la garnison de Kul Tiras et mini-donjon.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Nœud [4] du pointcrawl.</p>

        <p><strong>Repère géographique :</strong> Fort humain et côte orientale,
        théâtre de tensions militaires et diplomatiques.</p>

        <p><strong>Factions et influences :</strong> Garnison de Tiragarde /
        forces de Kul Tiras ; Horde en pression ; Lame ardente (manipulation
        indirecte, pas alliance).</p>

        <p><strong>Références et réserves :</strong> [PC] [FAC]</p>

        <p><em>L’influence politique de Jaina ne correspond pas à une garnison
        alliée placée sous ses ordres directs dans cette zone.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
