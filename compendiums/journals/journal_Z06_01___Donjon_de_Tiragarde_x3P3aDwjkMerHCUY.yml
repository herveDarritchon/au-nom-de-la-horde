  - name: 04 • PNJ — Lieutenant Benedict
    type: text
    sort: 400000
    ownership:
      default: 0
      TjbWhMczNyKieD8D: 3
    text:
      format: 1
      content: |-
        <h1>PNJ — Lieutenant Benedict</h1>
            <p><strong>ID :</strong> PNJ-Z06-01-01 · <strong>POI :</strong> Z06-01 · <strong>Zone :</strong> Z06</p>
            <p><strong>Origine / statut :</strong> Classic — officier de Tiragarde selon factions V3</p>
            <p><strong>Fonction :</strong> Commandant de la garnison du fort · <strong>Faction / allégeance réelle (MJ) :</strong> Kul Tiras — ligne dominante irréductible</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Maintenir le fort et montrer que ses soldats ont encore l’initiative.</td></tr><tr><th>Motivation profonde</th><td>Il craint de voir l’héritage militaire de Kul Tiras réduit à une retraite honteuse.</td></tr><tr><th>Obstacle</th><td>Les stocks et le moral ne suivent pas ses ambitions.</td></tr>
              <tr><th>Ligne rouge</th><td>Abandonner les siens sans garantie de sécurité.</td></tr><tr><th>Peut offrir</th><td>Audience, sauf-conduit temporaire, échange de prisonniers, ordre écrit.</td></tr><tr><th>En échange</th><td>Garantie concrète ou preuve qui modifie son calcul militaire.</td></tr>
              <tr><th>Attitude initiale</th><td>Militaire, rigide, mais soucieux de ses hommes.</td></tr><tr><th>S'il n'arrive rien</th><td>Prépare une opération qui accroîtra la pression entre Horde et garnison.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Gants soigneusement tirés sur des mains fatiguées.</p><p><strong>Voix et comportement :</strong> Fait parler ses interlocuteurs avant de répondre.</p><p><strong>Signe émotionnel :</strong> Réajuste ses gants lorsqu’on conteste le récit d’un officier.</p>
            <blockquote><p><strong>Première réplique :</strong> « Vous me demandez de retenir mes hommes. Qu’apportez-vous comme garantie ? »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Pourquoi votre commandement respecterait-il cette trêve ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Le fort renforce ses rondes après un incident frontalier.</td></tr><tr><th>Après échange, aide ou observation</th><td>Un ordre récent divise la garnison et certains soldats veulent négocier.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>MJ : n’est pas présumé savoir que la Lame ardente manipule indirectement les irréductibles.</td></tr><tr><th>Il demande</th><td>Garantie concrète ou preuve qui modifie son calcul militaire.</td></tr>
              <tr><th>Il peut proposer</th><td>Audience, sauf-conduit temporaire, échange de prisonniers, ordre écrit.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Abandonner les siens sans garantie de sécurité.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Autorise une entrevue avec les pragmatiques ou un échange limité.</td></tr><tr><th>S'ils négocient</th><td>Accorde une pause contre des prisonniers rendus et une vérification réciproque.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Renforce l’alerte et peut ordonner une sortie militaire.</td></tr><tr><th>S'ils l'ignorent</th><td>Prépare une opération qui accroîtra la pression entre Horde et garnison.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z06-01. <strong>Relations / autres lieux :</strong> Jaina représente une paix politique distante, pas son autorité directe sur la garnison.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z06/R03 : trêve limitée, escalade ou division interne accrue.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
