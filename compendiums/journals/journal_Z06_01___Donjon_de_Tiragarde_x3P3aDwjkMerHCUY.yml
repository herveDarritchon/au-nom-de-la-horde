        <h1>PNJ — Éliane Maréclaire</h1>
            <p><strong>ID :</strong> PNJ-Z06-01-02 · <strong>POI :</strong> Z06-01 · <strong>Zone :</strong> Z06</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Officière de ravitaillement pragmatique · <strong>Faction / allégeance réelle (MJ) :</strong> Kul Tiras — courant pragmatique</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Éviter que la garnison manque de soins et de nourriture.</td></tr><tr><th>Motivation profonde</th><td>Les soldats ne survivront pas à un siège voulu par les plus durs.</td></tr><tr><th>Obstacle</th><td>Benedict soupçonne les partisans du compromis de faiblesse.</td></tr>
              <tr><th>Ligne rouge</th><td>Dénoncer publiquement un camarade sans preuve.</td></tr><tr><th>Peut offrir</th><td>État des stocks, contact d’un soldat épuisé, proposition d’échange.</td></tr><tr><th>En échange</th><td>Garanties pour les blessés et aucun assaut pendant la négociation.</td></tr>
              <tr><th>Attitude initiale</th><td>Polie, tendue, surveille les portes.</td></tr><tr><th>S'il n'arrive rien</th><td>Établit un contact de secours discret sans les PJ.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Encre sur les manches, manteau réparé.</p><p><strong>Voix et comportement :</strong> Parle bas sans jamais implorer.</p><p><strong>Signe émotionnel :</strong> Ses yeux glissent vers l’infirmerie quand on parle d’assaut.</p>
            <blockquote><p><strong>Première réplique :</strong> « Un fort peut tenir une journée de plus, pas une année de rancune. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Si un blessé vous appartenait, que demanderiez-vous ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des rations sont distribuées en quantité réduite.</td></tr><tr><th>Après échange, aide ou observation</th><td>Des soldats souhaitent discrètement un accord de libération.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ignore les manipulations de la Lame ardente ; ses doutes portent sur les décisions de ses chefs.</td></tr><tr><th>Il demande</th><td>Garanties pour les blessés et aucun assaut pendant la négociation.</td></tr>
              <tr><th>Il peut proposer</th><td>État des stocks, contact d’un soldat épuisé, proposition d’échange.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Dénoncer publiquement un camarade sans preuve.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Fournit un itinéraire de transfert pour blessés.</td></tr><tr><th>S'ils négocient</th><td>Cherche un échange réaliste de vivres et de détenus.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Se referme ; continue tout de même à protéger les blessés.</td></tr><tr><th>S'ils l'ignorent</th><td>Établit un contact de secours discret sans les PJ.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
