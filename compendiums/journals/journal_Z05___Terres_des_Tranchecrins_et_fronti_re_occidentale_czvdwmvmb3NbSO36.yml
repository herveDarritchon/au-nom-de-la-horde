  - _id: 2a769a582a4ab0e5
    name: 07 · Suivi du territoire (MJ)
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Suivi dynamique du territoire — Z05</h2><h3>Transformations et
        évolutions possibles</h3><p>trêve, frontière reconnue, couloir de
        passage, évacuation ou raids accrus ; rapport de force entre les deux
        courants ajusté d'après les actions des PJ.</p><h3>État de campagne —
        mise à jour MJ</h3><table><thead><tr><th>Axe</th><th>État /
        note</th></tr></thead><tbody><tr><td>Pression actuelle</td><td><strong>À
        renseigner :</strong> calme / tension /
        crise.</td></tr><tr><td>Transformation persistante</td><td><strong>À
        renseigner :</strong> non / oui et une
        phrase.</td></tr><tr><td>Influences visibles</td><td><strong>À
        renseigner :</strong> ce que les PJ savent
        réellement.</td></tr><tr><td>Routes ouvertes / perdues</td><td><strong>À
        renseigner</strong> selon les liaisons
        ci-dessus.</td></tr><tr><td>Dernière modification</td><td><strong>À
        renseigner :</strong> séance et conséquence.</td></tr><tr><td>Si les PJ
        arrivent maintenant</td><td><strong>À renseigner :</strong> une scène
        d’ouverture située.</td></tr><tr><td>Si les PJ n’interviennent
        pas</td><td><strong>À renseigner :</strong> une évolution logique, non
        une sanction automatique.</td></tr></tbody></table><h3>Maintenance après
        chaque séance</h3><ul>

        <li>Noter uniquement les changements qui ont une cause
        fictionnelle.</li>

        <li>Mettre à jour un POI, une route ou une influence lorsqu’un choix ou
        une action de faction le justifie.</li>

        <li>Répercuter une découverte critique dans sa zone <strong>et</strong>
        dans le registre des routes si nécessaire.</li>

