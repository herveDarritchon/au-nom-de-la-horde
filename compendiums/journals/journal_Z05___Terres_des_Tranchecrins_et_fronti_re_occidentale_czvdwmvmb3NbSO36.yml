  - _id: eb09a68ad0d85dea
    name: 02 · Factions et secrets MJ
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Factions et influences — Z05</h2><p><strong>Tranchecrins</strong>
        dominants localement, <strong>deux tendances</strong> : guerriers (Lok
        Plaie-des-orcs, Nak, Kuz dans l'adaptation Warbound) et courant
        pragmatique de <strong>Mutiledent</strong> ; Horde en progression sur
        les lisières. <strong>Mutiledent n'est pas « pro-Horde
        ».</strong></p><h3>Matrice des influences du
        référentiel</h3><table><thead><tr><th>Faction</th><th>Implantation /
        contrôle pertinent</th><th>Incursions, clandestinité ou influence
        indirecte</th><th>Effet sur les voyages (mise en
        scène)</th></tr></thead><tbody><tr><td><strong>Tranchecrins</strong></td><td>Z05</td><td>Pression
        sur Z04 et sur couloir Z05↔Z07</td><td>Marques de territoires, raids,
        groupes non uniformes,
        négociation</td></tr><tr><td><strong>Horde</strong></td><td>Z01, Z04,
        Z07 (Sombrelances), corridors de Z03 et Z10</td><td>Patrouilles /
        logistique en Z05, Z06, Z08</td><td>Convois, relais, pistes entretenues,
        sécurité
        variable</td></tr></tbody></table><blockquote><p><strong>Attention
        :</strong> une infiltration, un sabotage ou une manipulation ne signifie
        pas que la faction contrôle publiquement le territoire. Les relations
        secrètes ne doivent pas être divulguées automatiquement. Une faction
        hostile ne rend pas mécaniquement toute la région « en guerre
        ».</p></blockquote>
