      content: >-
        <h2>Routes, accès et compromis — Z05</h2><h3>Liaisons principales
        R01–R08</h3><table><thead><tr><th>Route</th><th>Liaison / zones
        d'arrivée</th><th>Tag et compromis établis</th><th>Terrain / danger **de
        départ
        proposé**</th><th>Statut</th></tr></thead><tbody><tr><td><strong>R02</strong></td><td>Tranchecolline
        Z04 ↔ Terres Tranchecrins Z05</td><td><strong>Piste ouest
        contestée</strong> ; incursions, négociation</td><td>Piste
        <strong>sauvage DD 15</strong> près du territoire</td><td>Information /
        sécurité variables</td></tr><tr><td><strong>R08</strong></td><td>Sen'jin
        Z07 ↔ Terres Tranchecrins Z05</td><td><strong>Piste sèche</strong> ;
        approche alternative discrète</td><td>Terrain à fixer ; <strong>DD 15
        sauvage</strong> en secteur contesté</td><td>Peu fréquentée / à
        découvrir</td></tr></tbody></table><h3>État actuel (à
        compléter)</h3><table><thead><tr><th>Route</th><th>Connaissance des
        PJ</th><th>Accès</th><th>État /
        compromis</th></tr></thead><tbody><tr><td>R02</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>R08</td><td>À renseigner</td><td>À
        renseigner</td><td>À
        renseigner</td></tr></tbody></table><blockquote><p><strong>Les huit
        liaisons sont des choix qualitatifs, pas des distances.</strong> Les
        trajets Rxx et RX-xx n’ont pas de durée ni de kilométrage validés. Ne
        pas transformer une liaison cachée en chemin connu sans découverte en
        jeu.</p></blockquote>
