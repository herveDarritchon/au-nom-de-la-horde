  - _id: 73a3c3a4fd90cdbc
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z05</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z05-01</code> Terres des
        Tranchecrins</td><td><strong>Nœud [3]</strong></td><td>[PC]
        [FAC]</td></tr><tr><td><code>Z05-02</code> Terriers de
        l'Épine-Rouge</td><td>Mini-donjon
        Warbound</td><td>[GUIDE]</td></tr><tr><td><code>Z05-03</code> Pistes de
        raid
        occidentales</td><td>Routes</td><td>[PC]</td></tr><tr><td><code>Z05-04</code>
        Piste sèche vers
        Sen'jin</td><td>Route</td><td>[GUIDE]</td></tr><tr><td><code>Z05-05</code>
        Franges de la Furie-du-Sud</td><td>Limite géographique</td><td>[CLASSIC]
        — cadrage fin à confirmer</td></tr></tbody></table><h3>Implantation et
        rôle des lieux</h3><p><code>Z05-01</code> Terres des Tranchecrins
        <strong>[3]</strong> ; <code>Z05-02</code> <strong>Terriers de
        l'Épine-Rouge</strong> <strong>[mini-donjon Warbound, entrée exacte à
        fixer]</strong> ; <code>Z05-03</code> pistes de raids vers
        Tranchecolline <strong>[PC]</strong> ; <code>Z05-04</code> piste sèche
        vers Sen'jin <strong>[GUIDE]</strong> ; <code>Z05-05</code> franges de
        la Furie-du-Sud <strong>[CLASSIC ; découpage précis à
        confirmer]</strong>.</p><h3>Connaissance des PJ (à renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
