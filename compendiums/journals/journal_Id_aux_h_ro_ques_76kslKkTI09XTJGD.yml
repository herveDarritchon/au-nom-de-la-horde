      content: >-
        <h1>Mettre les Idéaux en jeu</h1>

        <p>Un Idéal est surtout utile lorsqu’il transforme une situation
        ordinaire en <strong>choix de personnage</strong>. Les exemples
        ci-dessous illustrent la logique attendue dans Warbound.</p>


        <table>

        <thead><tr><th>Idéal</th><th>Situation</th><th>Mise en jeu
        significative</th></tr></thead>

        <tbody>

        <tr><td><strong>Loyauté</strong></td><td>Un éclaireur de la Horde reste
        derrière pendant une retraite.</td><td>Le PJ revient le chercher alors
        que le groupe pourrait s’échapper sans risque.</td></tr>

        <tr><td><strong>Vérité</strong></td><td>Les PJ découvrent qu’un officier
        respecté a dissimulé un danger lié aux travaux sous
        Orgrimmar.</td><td>Le PJ révèle l’information malgré le risque de perdre
        un allié puissant ou de créer une crise.</td></tr>

        <tr><td><strong>Respect du vivant</strong></td><td>Une solution rapide
        consiste à incendier un secteur entier pour éliminer une
        menace.</td><td>Le PJ cherche une solution plus difficile afin d’éviter
        de détruire inutilement la faune ou un lieu sacré.</td></tr>

        <tr><td><strong>Justice</strong></td><td>Un saboteur capturé a commis
        des crimes mais affirme avoir tenté d’empêcher une
        catastrophe.</td><td>Le PJ refuse une exécution immédiate et exige que
        les faits soient établis.</td></tr>

        <tr><td><strong>Rédemption</strong></td><td>Un ancien cultiste de la
        Lame ardente propose des informations en échange d’une chance de quitter
        le culte.</td><td>Le PJ accepte de prendre le risque de lui faire
        confiance plutôt que de choisir la solution la plus sûre.</td></tr>

        <tr><td><strong>Devoir</strong></td><td>La mission officielle exige de
        tenir une position alors qu’un objectif personnel important devient
        accessible.</td><td>Le PJ renonce à son intérêt immédiat pour accomplir
        la responsabilité qu’il a acceptée.</td></tr>

        <tr><td><strong>Équilibre</strong></td><td>Une exploitation minière
        utile à la Horde perturbe manifestement un site élémentaire.</td><td>Le
        PJ s’oppose à une extension pourtant rentable et cherche une solution
        acceptable pour les deux besoins.</td></tr>

        <tr><td><strong>Unité</strong></td><td>Orcs et Trolls se rejettent la
        responsabilité d’un échec.</td><td>Le PJ prend un risque politique ou
        personnel pour maintenir la coopération plutôt que choisir son propre
        camp.</td></tr>

        </tbody>

        </table>


        <h2>Conflit entre deux Idéaux</h2>

        <p>Les meilleurs choix apparaissent souvent lorsque deux valeurs
        légitimes s’opposent. <strong>Loyauté</strong> peut entrer en conflit
        avec <strong>Justice</strong>. <strong>Vérité</strong> peut s’opposer à
        <strong>Protection</strong>. <strong>Tradition</strong> peut s’opposer à
        <strong>Liberté</strong>.</p>

        <p>Il n’existe pas de réponse correcte imposée par les règles. Le joueur
        décide quelle valeur l’emporte dans cette situation et accepte les
        conséquences de ce choix.</p>


        <h2>Pour le MJ</h2>

        <ul>

        <li>Ne demande pas au joueur de « tester son Idéal » : présente une
        situation où deux intérêts sont réellement en tension.</li>

        <li>N’utilise pas l’Idéal comme un ordre mental qui dicte une
        action.</li>

        <li>Récompense une décision qui révèle le personnage, pas une simple
        déclaration d’intention.</li>

        <li>Fais revenir les conséquences : une personne épargnée, une vérité
        révélée ou une promesse tenue doit pouvoir compter plus tard.</li>

        </ul>
