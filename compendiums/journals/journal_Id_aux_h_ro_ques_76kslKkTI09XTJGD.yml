      content: >-
        <h1>Choisir un Idéal</h1>


        <h2>Choix rapide</h2>

        <p>Choisis d’abord la question qui ressemble le plus à ton personnage
        :</p>

        <table>

        <thead><tr><th>Mon personnage veut surtout…</th><th>Idéaux
        possibles</th></tr></thead>

        <tbody>

        <tr><td>protéger les autres.</td><td><strong>Protection, Compassion,
        Abnégation, Sens du sacrifice, Solidarité</strong></td></tr>

        <tr><td>rester fidèle aux siens.</td><td><strong>Loyauté, Fraternité,
        Devoir, Unité, Héritage</strong></td></tr>

        <tr><td>agir avec droiture.</td><td><strong>Honneur, Honnêteté, Justice,
        Vérité, Responsabilité</strong></td></tr>

        <tr><td>défendre l’autonomie et la dignité.</td><td><strong>Liberté,
        Égalité, Dignité, Mérite, Clémence</strong></td></tr>

        <tr><td>préserver le monde et ses traditions.</td><td><strong>Équilibre,
        Respect du vivant, Respect des ancêtres, Tradition,
        Mémoire</strong></td></tr>

        <tr><td>devenir meilleur malgré les
        épreuves.</td><td><strong>Rédemption, Espoir, Persévérance,
        Détermination, Humilité</strong></td></tr>

        <tr><td>comprendre avant d’agir.</td><td><strong>Sagesse, Éducation,
        Découverte, Tempérance, Vérité</strong></td></tr>

        <tr><td>servir quelque chose qui le dépasse.</td><td><strong>Foi,
        Devoir, Tradition, Unité, Sens du sacrifice</strong></td></tr>

        </tbody>

        </table>


        <h2>Trois questions utiles</h2>

        <ol>

        <li><strong>Quand cet Idéal pourrait-il coûter quelque chose à mon
        personnage ?</strong></li>

        <li><strong>Avec quelle autre valeur pourrait-il entrer en conflit
        ?</strong></li>

        <li><strong>Quel acte concret montrerait cet Idéal sans avoir besoin de
        le déclarer à voix haute ?</strong></li>

        </ol>


        <h2>Tirage aléatoire facultatif</h2>

        <p>Lance <strong>1d2</strong> :</p>

        <ul>

        <li><strong>1 :</strong> table des 20 Idéaux issus de COF2 ;</li>

        <li><strong>2 :</strong> table des 20 Idéaux ajoutés pour Warbound.</li>

        </ul>

        <p>Puis lance <strong>1d20</strong> sur la table correspondante. Si le
        résultat ne correspond pas au personnage que tu veux jouer, choisis-en
        un autre : l’Idéal sert l’interprétation, pas le hasard.</p>
