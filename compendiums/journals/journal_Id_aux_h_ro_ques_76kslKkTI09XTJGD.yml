        <h1>Idéaux héroïques — COF2</h1>

        <p>Ces 20 Idéaux proviennent de la table de <strong>Chroniques Oubliées
        Fantasy 2</strong>. Leur formulation est conservée ; la colonne
        d’interprétation précise leur usage dans Warbound.</p>

        <table><thead><tr><th>Idéal</th><th>Interprétation
        Warbound</th><th>Mises en jeu typiques</th></tr></thead><tbody>

        <tr><td><strong>Abnégation</strong></td><td>Tu fais volontiers passer
        les besoins d’autrui avant ton intérêt personnel.</td><td>Accepter une
        charge, céder une ressource, rester en arrière pour aider.</td></tr>

        <tr><td><strong>Clémence</strong></td><td>Tu préfères épargner
        lorsqu’une issue moins définitive reste possible.</td><td>Prisonnier
        épargné, ennemi relâché sous conditions, vengeance refusée.</td></tr>

        <tr><td><strong>Compassion</strong></td><td>La souffrance d’autrui
        compte, y compris lorsque la victime n’est ni proche ni
        alliée.</td><td>Secourir un inconnu, aider un adversaire blessé,
        détourner des ressources d’un objectif.</td></tr>

        <tr><td><strong>Courage</strong></td><td>Tu agis malgré la peur lorsque
        quelque chose mérite d’être défendu.</td><td>Tenir une position, entrer
        dans un lieu terrifiant, affronter une menace pour protéger
        autrui.</td></tr>

        <tr><td><strong>Égalité</strong></td><td>La naissance, le peuple, le
        rang ou la richesse ne déterminent pas la valeur d’une
        personne.</td><td>Défendre un inférieur, contester un privilège, traiter
        un ennemi avec la même dignité.</td></tr>

        <tr><td><strong>Éducation</strong></td><td>Le savoir et sa transmission
        permettent aux individus et aux peuples de progresser.</td><td>Protéger
        un savoir, enseigner, préférer comprendre plutôt que détruire.</td></tr>

        <tr><td><strong>Fraternité</strong></td><td>Ceux qui partagent une
        épreuve ou une cause doivent se soutenir.</td><td>Refuser d’abandonner
        un compagnon, partager une ressource, défendre un membre du
        groupe.</td></tr>

        <tr><td><strong>Frugalité</strong></td><td>Tu refuses le gaspillage et
        considères les ressources comme précieuses.</td><td>Réparer plutôt que
        jeter, rationner, renoncer à un confort inutile.</td></tr>

        <tr><td><strong>Générosité</strong></td><td>Tu partages volontiers
        temps, ressources et richesse avec ceux qui en ont besoin.</td><td>Don,
        récompense abandonnée, aide matérielle à une communauté.</td></tr>

        <tr><td><strong>Honnêteté</strong></td><td>Tu évites le mensonge et
        préfères des relations fondées sur la franchise.</td><td>Dire une vérité
        coûteuse, refuser une tromperie avantageuse, assumer une
        faute.</td></tr>

        <tr><td><strong>Honneur</strong></td><td>Tu veux pouvoir répondre de tes
        actes devant les autres et devant toi-même.</td><td>Tenir parole,
        refuser un avantage déloyal, accepter les conséquences de ses
        choix.</td></tr>

        <tr><td><strong>Humilité</strong></td><td>Tu reconnais tes limites et la
        valeur des autres.</td><td>Demander de l’aide, céder la place à plus
        compétent, admettre une erreur.</td></tr>

        <tr><td><strong>Justice</strong></td><td>Les actes doivent avoir des
        conséquences équitables, quelle que soit la puissance du
        responsable.</td><td>Défendre une victime, enquêter malgré les
        pressions, s’opposer à un allié fautif.</td></tr>

        <tr><td><strong>Liberté</strong></td><td>Nul ne devrait être réduit en
        esclavage, soumis ou privé arbitrairement de son destin.</td><td>Libérer
        un captif, refuser une domination, aider quelqu’un à choisir sa propre
        voie.</td></tr>

        <tr><td><strong>Loyauté</strong></td><td>Tu ne renies pas facilement
        ceux à qui tu as donné ta parole ou que tu considères comme les
        tiens.</td><td>Revenir chercher un allié, respecter un engagement,
        défendre son groupe malgré le coût.</td></tr>

        <tr><td><strong>Pacifisme</strong></td><td>Tu cherches à éviter la
        violence lorsque d’autres solutions restent possibles.</td><td>Négocier,
        épargner, accepter une solution plus longue pour éviter un
        combat.</td></tr>

        <tr><td><strong>Protection</strong></td><td>La force a d’abord de la
        valeur lorsqu’elle sert à protéger.</td><td>S’interposer, défendre des
        civils, choisir une position moins avantageuse pour couvrir
        autrui.</td></tr>

        <tr><td><strong>Sens du sacrifice</strong></td><td>Tu acceptes de payer
        personnellement le prix d’une cause qui le mérite.</td><td>Prendre un
        risque à la place d’un autre, abandonner une récompense, rester pour
        permettre une fuite.</td></tr>

        <tr><td><strong>Solidarité</strong></td><td>Une communauté ne survit que
        si ses membres s’entraident.</td><td>Partager des ressources, défendre
        un village, soutenir ceux qui subissent les conséquences d’une
        crise.</td></tr>

        <tr><td><strong>Vérité</strong></td><td>Tu cherches et défends la vérité
        même lorsqu’elle dérange ou remet en cause tes
        certitudes.</td><td>Révéler une information gênante, poursuivre une
        enquête, refuser un mensonge utile.</td></tr>

        </tbody></table>
