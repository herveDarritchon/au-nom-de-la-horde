      content: >-
        <h1>Idéaux héroïques — Règles Warbound</h1>

        <blockquote>

        <p><strong>Principe :</strong> un Idéal est une boussole. Il indique ce
        vers quoi le personnage essaie de tendre lorsque la situation lui laisse
        un vrai choix. Il ne remplace jamais le libre arbitre du joueur et ne
        constitue pas un alignement.</p>

        </blockquote>


        <h2>1. Origine de la règle</h2>

        <p>Warbound reprend la règle des <strong>Idéaux héroïques</strong> de
        <em>Chroniques Oubliées Fantasy 2</em>. COF2 les utilise avec les
        Travers pour donner une ligne directrice d’interprétation au personnage
        et prévoit qu’une interprétation particulièrement appropriée d’un trait
        puisse permettre de récupérer un point de chance.</p>

        <p>Warbound conserve ce principe, élargit la liste à <strong>40
        Idéaux</strong> et précise quand un Idéal mérite réellement une
        récompense.</p>


        <h2>2. À la création</h2>

        <ul>

        <li>Chaque PJ choisit normalement <strong>1 Idéal héroïque</strong> et
        <strong>1 Travers</strong>.</li>

        <li>L’Idéal doit correspondre à la manière dont le joueur souhaite
        interpréter son personnage.</li>

        <li>Le choix est libre : il n’existe aucune obligation de tirer l’Idéal
        au hasard.</li>

        <li>Si le joueur veut un tirage aléatoire, lancer <strong>1d2</strong>
        pour choisir la table COF2 ou Warbound, puis <strong>1d20</strong>.</li>

        <li>Le MJ peut autoriser un <strong>second Idéal</strong> si le concept
        du personnage ou la campagne le justifie. Cela n’accorde aucun avantage
        automatique supplémentaire.</li>

        </ul>


        <h2>3. Un Idéal n’est pas un ordre</h2>

        <p>Un Idéal indique ce que le personnage considère comme important. Il
        peut néanmoins le trahir, hésiter, faire un compromis ou choisir une
        autre valeur lorsque deux principes entrent en conflit.</p>

        <p>Il n’existe <strong>aucune pénalité automatique</strong> pour avoir
        agi contre son Idéal. En revanche, une contradiction importante peut
        devenir un excellent élément d’évolution du personnage.</p>


        <h2>4. Mettre un Idéal en jeu</h2>

        <p>Un Idéal devient intéressant lorsqu’il rencontre une <strong>tension
        réelle</strong>. Le joueur doit avoir quelque chose à gagner en
        l’ignorant et quelque chose à perdre en le respectant.</p>

        <p>Une mise en jeu significative peut entraîner :</p>

        <ul>

        <li>un risque personnel ;</li>

        <li>une dépense de temps ou de ressources ;</li>

        <li>une occasion perdue ;</li>

        <li>une solution plus difficile ;</li>

        <li>un conflit avec un allié, une faction ou une autorité ;</li>

        <li>un sacrifice ;</li>

        <li>une conséquence durable.</li>

        </ul>


        <h2>5. Récompense : récupérer 1 point de chance</h2>

        <p>Lorsqu’un joueur interprète son Idéal d’une manière particulièrement
        appropriée et que ce choix a un <strong>poids réel dans la
        scène</strong>, le MJ peut lui faire récupérer immédiatement <strong>1
        point de chance (PC)</strong>, sans dépasser son maximum.</p>

        <p>Dans Warbound, on considère qu’un Idéal mérite généralement cette
        récompense lorsqu’il pousse le personnage à accepter un <strong>coût, un
        risque ou un renoncement réel</strong> alors qu’une solution plus
        avantageuse était disponible.</p>

        <p>Un même Idéal ne devrait normalement permettre de récupérer
        qu’<strong>1 PC par scène</strong>. La récompense reste exceptionnelle
        et n’est jamais automatique.</p>


        <h2>6. Quand ne pas donner de PC</h2>

        <ul>

        <li>Le joueur rappelle simplement qu’il possède l’Idéal.</li>

        <li>Le choix conforme à l’Idéal est aussi la solution la plus simple et
        la plus avantageuse, sans tension particulière.</li>

        <li>Le comportement n’a aucune conséquence réelle.</li>

        <li>Le joueur provoque artificiellement la même situation à répétition
        pour récupérer des PC.</li>

        <li>L’Idéal sert de prétexte pour bloquer la partie ou imposer une
        décision aux autres joueurs.</li>

        <li>Le même choix a déjà déclenché une récupération de PC grâce à un
        Travers : <strong>une même décision ne rapporte pas deux
        fois</strong>.</li>

        </ul>


        <h2>7. Idéal héroïque et Idéal contraignant</h2>

        <p>Un <strong>Idéal héroïque</strong> décrit une valeur à laquelle le
        personnage aspire. Un <strong>Idéal contraignant</strong> est un Travers
        : la valeur est poussée assez loin pour devenir régulièrement une source
        de complications.</p>

        <p>Exemple : <strong>Loyauté</strong> peut être un Idéal. Si le
        personnage refuse presque toujours d’abandonner un compagnon, même
        lorsque cela met systématiquement sa propre vie ou la mission en danger,
        cette loyauté peut devenir le Travers <strong>Loyal</strong>.</p>


        <h2>8. Faire évoluer un Idéal</h2>

        <p>Un Idéal peut changer lorsque le personnage évolue. Après un
        événement important, le joueur peut proposer au MJ de remplacer son
        Idéal par un autre qui correspond mieux à ce qu’est devenu le héros.</p>

        <p>Un Idéal peut également se renforcer, entrer en conflit avec un
        autre, être remis en question ou devenir un Travers si son
        interprétation devient réellement contraignante.</p>


        <blockquote>

        <p><strong>Test simple :</strong> si respecter l’Idéal ne demande jamais
        aucun choix au personnage, il reste décoratif. S’il force chaque
        décision et retire le libre arbitre du joueur, il est devenu trop
        contraignant.</p>

        </blockquote>
