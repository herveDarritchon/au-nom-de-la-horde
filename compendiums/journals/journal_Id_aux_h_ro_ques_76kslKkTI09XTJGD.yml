        <h1>Idéaux héroïques — Warbound</h1>

        <p>Ces 20 Idéaux complètent la table COF2 avec des thèmes
        particulièrement adaptés à Azeroth : héritage, rédemption, ancêtres,
        équilibre, devoir, survie morale et reconstruction.</p>

        <table><thead><tr><th>Idéal</th><th>Interprétation
        Warbound</th><th>Mises en jeu typiques</th></tr></thead><tbody>

        <tr><td><strong>Devoir</strong></td><td>Tu accomplis ce qui doit être
        fait même lorsque personne ne t’y oblige.</td><td>Mission poursuivie
        malgré le coût personnel, responsabilité assumée, poste tenu.</td></tr>

        <tr><td><strong>Détermination</strong></td><td>Tu ne renonces pas à une
        cause simplement parce qu’elle devient difficile.</td><td>Nouvel essai,
        poursuite après un revers, objectif maintenu malgré
        l’adversité.</td></tr>

        <tr><td><strong>Discipline</strong></td><td>Tu maîtrises tes instincts
        et restes fidèle à tes engagements sous pression.</td><td>Refuser une
        provocation, tenir une formation, respecter un plan difficile.</td></tr>

        <tr><td><strong>Équilibre</strong></td><td>Aucun pouvoir, peuple ou
        besoin ne doit croître au point de détruire tout ce qui
        l’entoure.</td><td>Limiter une exploitation, rechercher un compromis,
        protéger un cycle naturel ou spirituel.</td></tr>

        <tr><td><strong>Espoir</strong></td><td>Même après la défaite ou la
        catastrophe, quelque chose peut encore être
        reconstruit.</td><td>Encourager, reconstruire, donner une seconde chance
        lorsque tout semble perdu.</td></tr>

        <tr><td><strong>Héritage</strong></td><td>Tu veux préserver ce que les
        générations précédentes ont transmis et t’en montrer
        digne.</td><td>Sauver un lieu, un rite, un objet ou une mémoire au prix
        d’un détour ou d’un risque.</td></tr>

        <tr><td><strong>Mémoire</strong></td><td>Les morts, les défaites et les
        erreurs du passé ne doivent pas être oubliés.</td><td>Honorer les
        victimes, conserver une preuve, refuser d’effacer une faute
        historique.</td></tr>

        <tr><td><strong>Persévérance</strong></td><td>Tomber n’est pas échouer
        tant que tu te relèves.</td><td>Continuer après une défaite, reprendre
        une piste abandonnée, supporter une épreuve prolongée.</td></tr>

        <tr><td><strong>Rédemption</strong></td><td>Une personne ou un peuple ne
        doit pas être condamné à jamais par ses fautes passées.</td><td>Offrir
        une seconde chance, accepter une reddition, aider quelqu’un à réparer
        ses actes.</td></tr>

        <tr><td><strong>Respect des ancêtres</strong></td><td>Tu écoutes et
        honores ceux qui sont venus avant toi.</td><td>Consulter un ancien,
        respecter un rite funéraire, préserver une tradition
        ancestrale.</td></tr>

        <tr><td><strong>Respect du vivant</strong></td><td>La terre, les bêtes
        et les êtres vivants ne sont pas de simples ressources à
        exploiter.</td><td>Épargner une créature, limiter une exploitation,
        chercher une solution compatible avec l’environnement.</td></tr>

        <tr><td><strong>Responsabilité</strong></td><td>Celui qui possède du
        pouvoir doit répondre des conséquences de son usage.</td><td>Assumer une
        erreur, demander des comptes à un supérieur, réparer un dommage
        causé.</td></tr>

        <tr><td><strong>Sagesse</strong></td><td>Tu préfères comprendre avant
        d’agir et regarder au-delà de la victoire immédiate.</td><td>Observer,
        consulter, renoncer à un succès rapide aux conséquences
        dangereuses.</td></tr>

        <tr><td><strong>Tempérance</strong></td><td>Tu maîtrises colère,
        ambition, faim de pouvoir et désir de vengeance.</td><td>Refuser une
        escalade, différer une vengeance, renoncer à un pouvoir
        dangereux.</td></tr>

        <tr><td><strong>Tradition</strong></td><td>Les coutumes et rites d’un
        peuple constituent une richesse qu’il faut préserver.</td><td>Défendre
        un rite, consulter les anciens, refuser une solution qui détruirait une
        pratique essentielle.</td></tr>

        <tr><td><strong>Unité</strong></td><td>Des peuples différents peuvent
        accomplir ensemble ce qu’aucun ne pourrait accomplir
        seul.</td><td>Chercher une alliance, défendre un allié d’un autre
        peuple, accepter un compromis culturel.</td></tr>

        <tr><td><strong>Dignité</strong></td><td>Tu refuses l’humiliation pour
        toi comme pour les autres, même dans la défaite.</td><td>Protéger un
        prisonnier, refuser une humiliation publique, traiter un adversaire
        vaincu avec respect.</td></tr>

        <tr><td><strong>Découverte</strong></td><td>L’inconnu mérite d’être
        exploré et compris plutôt que simplement craint.</td><td>Explorer une
        piste, étudier un phénomène, accepter un détour pour apprendre quelque
        chose.</td></tr>

        <tr><td><strong>Foi</strong></td><td>Tu places ta confiance dans quelque
        chose qui dépasse ton intérêt immédiat : Lumière, esprits, Loa,
        éléments, peuple ou idéal.</td><td>Respecter un rite, agir selon une
        conviction malgré l’incertitude, défendre un principe
        spirituel.</td></tr>

        <tr><td><strong>Mérite</strong></td><td>La valeur se démontre par les
        actes plutôt que par le rang, la naissance ou les titres.</td><td>Donner
        sa chance à un inconnu, contester un privilège, juger quelqu’un sur ce
        qu’il accomplit.</td></tr>

        </tbody></table>
