      content: >-
        <h2>Gabarit — Fiche d’une route</h2>

        <p>Dupliquer cette page uniquement pour les routes qui ont besoin d’un
        suivi propre.</p>


        <table>

        <tbody>

        <tr><th>Connexion</th><td>Point A → Point B</td></tr>

        <tr><th>Nom / tag</th><td>Route logistique, sentier côtier, piste
        contestée…</td></tr>

        <tr><th>Connaissance</th><td>Inconnue / Repérée / Connue /
        Maîtrisée</td></tr>

        <tr><th>Accès</th><td>Ouvert / Conditionnel / Bloqué / Caché</td></tr>

        <tr><th>Compromis</th><td>Rapide mais visible ; discret mais dangereux ;
        etc.</td></tr>

        <tr><th>État actuel</th><td>Une seule information si elle influence le
        trajet</td></tr>

        <tr><th>Condition de découverte / réouverture</th><td>Seulement si
        nécessaire</td></tr>

        <tr><th>Événement potentiel</th><td>Seulement s’il produit une décision
        ou une conséquence</td></tr>

        </tbody>

        </table>


        <blockquote><p><strong>Filtre :</strong> une route n’a pas besoin d’un
        événement à chaque voyage. La répétition doit montrer la maîtrise
        croissante du territoire, pas générer du remplissage.</p></blockquote>
