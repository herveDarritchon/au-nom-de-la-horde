    image: {}
    text:
      format: 1
      content: >-
        <h2>Carte logique — Saison 1</h2>

        <p>Le réseau est une <strong>carte de décisions</strong>, pas une carte
        à l’échelle. Razor Hill est le hub principal. Orgrimmar reste longtemps
        une destination de convergence, puis devient le seuil vers Ragefire
        Chasm.</p>


        <pre>[6] SKULL ROCK
              /       \
             /         \
        [5] THUNDER RIDGE      \ voie nord
              /     \           \
             /       \           \
        [3] RAZORMANE --- [1] RAZOR HILL --- [4] TIRAGARDE
               \              |
                \             |
                 \        [2] SEN’JIN
                  \__________/

                            ↓
                       ORGRIMMAR
                            ↓
                    RAGEFIRE CHASM</pre>

        <h3>Les six points structurants</h3>

        <table>

        <thead><tr><th>#</th><th>Point</th><th>Fonction dans le
        sandbox</th></tr></thead>

        <tbody>

        <tr><td>1</td><td><strong>Razor Hill</strong></td><td>Hub principal :
        retour, nouvelles, ressources, conséquences et choix de
        pistes.</td></tr>

        <tr><td>2</td><td><strong>Sen’jin</strong></td><td>Hub culturel
        secondaire : Darkspear, côte, rites, informations et
        raccourcis.</td></tr>

        <tr><td>3</td><td><strong>Razormane Grounds</strong></td><td>Frontière
        territoriale contestée : négociation, raids, ressources,
        mini-donjon.</td></tr>

        <tr><td>4</td><td><strong>Tiragarde / Scuttle
        Coast</strong></td><td>Frontière humaine : enjeu militaire,
        diplomatique, côte et mini-donjon.</td></tr>

        <tr><td>5</td><td><strong>Thunder Ridge / Drygulch</strong></td><td>Zone
        sauvage et logistique : routes de matériaux, ravins, caches et fil
        rouge.</td></tr>

        <tr><td>6</td><td><strong>Skull Rock</strong></td><td>Secret hostile :
        Lame ardente, savoir interdit, mini-donjon et fausse piste
        crédible.</td></tr>

        </tbody>

        </table>


        <h3>Extensions</h3>

        <p><strong>Vallée des Épreuves :</strong> point de prologue ou lieu
        d’origine. <strong>Îles de l’Écho :</strong> extension Darkspear. Ne les
        ajouter au réseau actif que lorsqu’elles produisent réellement du
        jeu.</p>


        <blockquote><p><strong>Rappel :</strong> un lieu n’a pas besoin d’être
        un point parce qu’il existe dans WoW. Il devient un point lorsqu’il
        produit une décision, une information, une relation, un danger ou une
        ressource distincte.</p></blockquote>
