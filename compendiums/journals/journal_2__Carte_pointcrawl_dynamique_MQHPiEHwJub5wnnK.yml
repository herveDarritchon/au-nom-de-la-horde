    text:
      format: 1
      content: >-
        <h2>Carte pointcrawl dynamique de Durotar — Mode d’emploi MJ</h2>

        <blockquote>

        <p><strong>Objectif :</strong> répondre rapidement à quatre questions :
        où les PJ peuvent-ils aller, que savent-ils des lieux et des routes,
        qu’est-ce qui s’y passe maintenant, et qu’est-ce qui a changé depuis
        leur dernier passage ?</p>

        </blockquote>

        <blockquote>

        <p><strong>Règle d’or :</strong> la carte ne sert pas à dire aux joueurs
        où aller. Elle sert au MJ à savoir ce qu’ils trouveront, quel que soit
        l’endroit où ils décident d’aller.</p>

        </blockquote>


        <h3>Pourquoi l’utiliser ?</h3>

        <table>

        <thead><tr><th>Besoin</th><th>Réponse du pointcrawl</th></tr></thead>

        <tbody>

        <tr><td>Improviser un détour</td><td>Consulter les points accessibles,
        les routes et l’état actuel de la destination.</td></tr>

        <tr><td>Donner de vrais choix</td><td>Plusieurs destinations peuvent
        évoluer en parallèle sans ordre imposé.</td></tr>

        <tr><td>Valoriser l’exploration</td><td>Routes, raccourcis, guides et
        informations deviennent de vraies récompenses.</td></tr>

        <tr><td>Montrer les conséquences</td><td>Un lieu visité ne revient pas
        automatiquement à son état initial.</td></tr>

        <tr><td>Préserver le rythme</td><td>Les trajets sans enjeu sont ellipsés
        ; seuls les segments qui comptent deviennent des scènes.</td></tr>

        </tbody>

        </table>


        <h3>Quand l’utiliser ?</h3>

        <ul>

        <li>Quand les PJ choisissent entre plusieurs problèmes ou
        destinations.</li>

        <li>Quand ils retournent dans une zone déjà visitée.</li>

        <li>Quand ils cherchent un autre chemin ou un raccourci.</li>

        <li>Quand une faction agit hors champ.</li>

        <li>Quand une piste ignorée doit évoluer.</li>

        <li>Quand ils choisissent une destination que le MJ n’avait pas prévue
        pour cette séance.</li>

        </ul>


        <h3>Quand ne pas l’utiliser ?</h3>

        <ul>

        <li>Pour le déplacement précis d’un combat : utiliser une scène
        tactique.</li>

        <li>Pour l’exploration détaillée d’un donjon : utiliser sa propre carte
        ou son propre pointcrawl interne.</li>

        <li>Pour une scène sociale locale : utiliser le journal du lieu et ses
        PNJ.</li>

        <li>Pour un voyage sans choix ni conséquence : faire une ellipse.</li>

        <li>Pour simuler chaque kilomètre, ration ou journée : ce système n’est
        pas un système de survie.</li>

        </ul>


        <h3>Les quatre axes à ne pas mélanger</h3>

        <table>

        <thead><tr><th>Axe</th><th>Valeurs</th><th>Question</th></tr></thead>

        <tbody>

        <tr><td><strong>Connaissance</strong></td><td>Inconnu → Repéré → Connu →
        Maîtrisé</td><td>Que savent les PJ ?</td></tr>

        <tr><td><strong>Accessibilité</strong></td><td>Ouvert / Conditionnel /
        Bloqué / Caché</td><td>Peuvent-ils y aller ?</td></tr>

        <tr><td><strong>Pression</strong></td><td>Calme / Tension /
        Crise</td><td>Que se passe-t-il maintenant ?</td></tr>

        <tr><td><strong>Transformation</strong></td><td>Non / Oui</td><td>Le
        lieu a-t-il changé durablement ?</td></tr>

        </tbody>

        </table>


        <h3>Les 30 secondes du MJ</h3>

        <ol>

        <li>Où veulent-ils aller ?</li>

        <li>Est-ce connu et accessible ?</li>

        <li>Quel est l’état actuel du point ?</li>

        <li>La route mérite-t-elle une scène ?</li>

        <li>Quelle situation les accueille ?</li>

        <li>Qu’est-ce qui changera selon leur décision ?</li>

        </ol>
