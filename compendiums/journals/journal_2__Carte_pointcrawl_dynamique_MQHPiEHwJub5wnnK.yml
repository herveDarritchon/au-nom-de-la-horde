      content: >-
        <h2>Gabarit — Fiche d’un point</h2>

        <p>Dupliquer cette page pour créer un journal de point relié à une Map
        Note Foundry.</p>


        <table>

        <tbody>

        <tr><th>Nom / fonction</th><td>...</td></tr>

        <tr><th>Connaissance des PJ</th><td>Inconnu / Repéré / Connu /
        Maîtrisé</td></tr>

        <tr><th>Pression actuelle</th><td>Calme / Tension / Crise</td></tr>

        <tr><th>Transformé ?</th><td>Non / Oui — préciser en une
        phrase</td></tr>

        <tr><th>Accessible par</th><td>Routes actuellement utilisables</td></tr>

        <tr><th>Présences / acteurs</th><td>2 à 4 maximum</td></tr>

        <tr><th>Ce qui se passe maintenant</th><td>2 ou 3 situations visibles
        maximum</td></tr>

        <tr><th>Dernière visite / dernier changement</th><td>Une
        phrase</td></tr>

        <tr><th>Si les PJ arrivent maintenant</th><td>Une scène d’ouverture
        concrète</td></tr>

        <tr><th>Si personne n’intervient</th><td>Une prochaine évolution
        logique</td></tr>

        <tr><th>Payoffs possibles</th><td>Information, contact, accès,
        raccourci, ressource, transformation</td></tr>

        </tbody>

        </table>


        <h3>Test d’acceptation</h3>

        <blockquote><p>Si tu retires ce point de la carte, les joueurs
        perdent-ils un choix, une relation, une information, une route, une
        ressource ou un conflit distinct ? Si non, ce n’est probablement pas un
        point : c’est un décor à l’intérieur d’un autre point.</p></blockquote>
