        <h2>Après la séance — Maintenance minimale</h2>

        <p>La mise à jour doit prendre <strong>quelques minutes</strong>, pas
        devenir une simulation complète de Durotar.</p>


        <ul>

        <li>☐ Noter où terminent les PJ.</li>

        <li>☐ Mettre à jour les points directement modifiés par leurs
        actions.</li>

        <li>☐ Mettre à jour les routes directement modifiées.</li>

        <li>☐ Inscrire une transformation persistante si un lieu a réellement
        changé.</li>

        <li>☐ Faire avancer au maximum une ou deux situations hors champ ayant
        une raison de progresser.</li>

        <li>☐ Modifier la connaissance des PJ : point repéré, route découverte,
        raccourci maîtrisé, accès perdu.</li>

        <li>☐ Réécrire « Si les PJ arrivent maintenant » uniquement pour les
        destinations plausibles de la prochaine séance.</li>

        </ul>


        <h3>Journal express des changements</h3>

        <table>

        <thead><tr><th>Élément</th><th>Avant</th><th>Après</th><th>Cause</th></tr></thead>

        <tbody>

        <tr><td>Point / route</td><td>À renseigner</td><td>À
        renseigner</td><td>PJ / faction / fil rouge / autre</td></tr>

        <tr><td>Point / route</td><td>À renseigner</td><td>À
        renseigner</td><td>PJ / faction / fil rouge / autre</td></tr>

        <tr><td>Point / route</td><td>À renseigner</td><td>À
        renseigner</td><td>PJ / faction / fil rouge / autre</td></tr>

        </tbody>

        </table>


        <blockquote><p><strong>Limite de complexité :</strong> si tu dois
        simuler chaque faction, route et point après chaque séance, le système
        est devenu trop lourd. Faire évoluer le monde par conséquences
        significatives, pas par comptabilité exhaustive.</p></blockquote>
