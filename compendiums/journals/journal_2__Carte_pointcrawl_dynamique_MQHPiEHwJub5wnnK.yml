  - sort: 600000
    name: 05 — Procédure en jeu
    type: text
    _id: b4581cca5a3b012e
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Procédure en jeu</h2>


        <h3>1. Au moment du choix</h3>

        <p>Présenter <strong>ce que les PJ savent</strong>, pas ce que le MJ
        sait. Les destinations apparaissent par la fiction : rumeur, voyageur,
        signe, demande, carte, blessé, patrouille, conséquence visible.</p>


        <h3>2. Pendant le voyage</h3>

        <p>Pour chaque segment, demander : <strong>« Cette route apporte-t-elle
        quelque chose maintenant ? »</strong></p>

        <table>

        <thead><tr><th>Réponse</th><th>Traitement</th></tr></thead>

        <tbody>

        <tr><td>Non</td><td>Ellipse descriptive de quelques phrases.</td></tr>

        <tr><td>Oui, pour l’ambiance</td><td>Un détail, une rencontre brève ou
        un signe de l’état de Durotar.</td></tr>

        <tr><td>Oui, pour un choix</td><td>Obstacle, détour, personne ou
        information demandant une décision.</td></tr>

        <tr><td>Oui, pour une conséquence</td><td>Montrer ce qu’une faction ou
        les actions passées des PJ ont changé.</td></tr>

        <tr><td>Oui, pour une scène majeure</td><td>Jouer la scène seulement si
        son issue peut modifier la campagne.</td></tr>

        </tbody>

        </table>


        <h3>3. À l’arrivée</h3>

        <p>Ne pas réciter la fiche du lieu. Ouvrir avec le champ <strong>« Si
        les PJ arrivent maintenant »</strong> : barricade nouvelle, silence
        inhabituel, dispute, fumée, blessés, convoi, patrouille absente…</p>


        <h3>4. Lors d’un retour</h3>

        <p>Montrer au maximum <strong>deux changements importants</strong> :</p>

        <ul>

        <li>un changement causé directement ou indirectement par les PJ ;</li>

        <li>un changement causé par le monde, une faction ou l’escalade.</li>

        </ul>


        <h3>5. Si les PJ prennent une direction imprévue</h3>

        <ol>

        <li>Vérifier connaissance et accès.</li>

        <li>Lire la fonction du point.</li>

        <li>Choisir la pression actuelle.</li>

        <li>Utiliser « Si les PJ arrivent maintenant » ou en écrire une
        phrase.</li>

        <li>Improviser autour des acteurs et de l’enjeu, pas autour d’un
        scénario pré-écrit.</li>

        </ol>
