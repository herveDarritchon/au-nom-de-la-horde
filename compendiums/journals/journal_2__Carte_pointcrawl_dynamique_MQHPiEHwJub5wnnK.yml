      content: >-
        <h2>Tableau de suivi — Points</h2>

        <p>Cette page est le <strong>registre opérationnel</strong>. Avant la
        séance, ne renseigner en détail que les destinations plausibles. Les
        cases « À renseigner » sont volontairement ouvertes : le guide ne fixe
        pas un état initial unique de campagne.</p>


        <table>

        <thead><tr><th>Point</th><th>Connaissance</th><th>Pression</th><th>Transformé
        ?</th><th>Ce qui se passe maintenant</th></tr></thead>

        <tbody>

        <tr><td><strong>Razor Hill</strong></td><td>À renseigner</td><td>À
        renseigner</td><td>Non / Oui</td><td>À renseigner</td></tr>

        <tr><td><strong>Sen’jin</strong></td><td>À renseigner</td><td>À
        renseigner</td><td>Non / Oui</td><td>À renseigner</td></tr>

        <tr><td><strong>Razormane Grounds</strong></td><td>À
        renseigner</td><td>À renseigner</td><td>Non / Oui</td><td>À
        renseigner</td></tr>

        <tr><td><strong>Tiragarde / Scuttle Coast</strong></td><td>À
        renseigner</td><td>À renseigner</td><td>Non / Oui</td><td>À
        renseigner</td></tr>

        <tr><td><strong>Thunder Ridge / Drygulch</strong></td><td>À
        renseigner</td><td>À renseigner</td><td>Non / Oui</td><td>À
        renseigner</td></tr>

        <tr><td><strong>Skull Rock</strong></td><td>À renseigner</td><td>À
        renseigner</td><td>Non / Oui</td><td>À renseigner</td></tr>

        </tbody>

        </table>


        <h3>Pour chaque destination réellement active</h3>

        <table>

        <thead><tr><th>Champ</th><th>Note MJ</th></tr></thead>

        <tbody>

        <tr><td>Accès actuellement utilisables</td><td>À renseigner</td></tr>

        <tr><td>Présences / acteurs (2 à 4 max.)</td><td>À renseigner</td></tr>

        <tr><td>Situations visibles (2 ou 3 max.)</td><td>À renseigner</td></tr>

        <tr><td>Dernier changement</td><td>À renseigner</td></tr>

        <tr><td><strong>Si les PJ arrivent maintenant</strong></td><td>À
        renseigner en une scène concrète</td></tr>

        <tr><td><strong>Si personne n’intervient</strong></td><td>À renseigner
        avec une seule évolution logique</td></tr>

        <tr><td>Payoff possible</td><td>Information / contact / accès /
        raccourci / ressource / transformation</td></tr>

        </tbody>

        </table>


        <blockquote><p><strong>Discipline :</strong> tous les lieux ne doivent
        pas être en crise simultanément. Un point calme peut rester intéressant
        grâce à ses relations, informations, opportunités et conséquences
        passées.</p></blockquote>
