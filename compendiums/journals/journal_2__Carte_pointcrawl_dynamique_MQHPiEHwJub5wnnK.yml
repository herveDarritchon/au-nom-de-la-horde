      content: >-
        <h2>Tableau de suivi — Routes et raccourcis</h2>

        <p>Une route est un <strong>choix et un compromis</strong>, pas une
        obligation de rencontre. Elle reste plus légère qu’une fiche de
        lieu.</p>


        <h3>Registre des routes</h3>

        <table>

        <thead><tr><th>Connexion</th><th>Connaissance</th><th>Accès</th><th>Tag
        / compromis</th><th>État actuel</th></tr></thead>

        <tbody>

        <tr><td>Razor Hill → Thunder Ridge / Drygulch</td><td>À
        renseigner</td><td>À renseigner</td><td>Route logistique</td><td>À
        renseigner</td></tr>

        <tr><td>Thunder Ridge / Drygulch → Skull Rock</td><td>À
        renseigner</td><td>À renseigner</td><td>Accès secondaire /
        potentiellement caché</td><td>À renseigner</td></tr>

        <tr><td>Autre connexion</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td><td>À renseigner</td></tr>

        <tr><td>Autre connexion</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td><td>À renseigner</td></tr>

        <tr><td>Autre connexion</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td><td>À renseigner</td></tr>

        <tr><td>Autre connexion</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td><td>À renseigner</td></tr>

        </tbody>

        </table>


        <h3>Ce qu’une route doit contenir</h3>

        <ul>

        <li><strong>Connaissance :</strong> Inconnue / Repérée / Connue /
        Maîtrisée.</li>

        <li><strong>Accès :</strong> Ouvert / Conditionnel / Bloqué /
        Caché.</li>

        <li><strong>Tag :</strong> fréquentée, logistique, contestée,
        surveillée, rapide, discrète, côtière, dangereuse…</li>

        <li><strong>Compromis :</strong> ce que les PJ gagnent et ce qu’ils
        risquent.</li>

        <li><strong>État actuel :</strong> un seul changement pertinent,
        uniquement s’il influence un choix.</li>

        <li><strong>Déblocage :</strong> seulement si une découverte, une
        ressource, un guide ou une autorisation est nécessaire.</li>

        </ul>


        <blockquote><p><strong>Règle de voyage :</strong> pas de jet automatique
        à chaque trajet. Si le voyage n’apporte ni choix, ni information, ni
        conséquence, le décrire en quelques phrases et passer à la scène
        suivante.</p></blockquote>
