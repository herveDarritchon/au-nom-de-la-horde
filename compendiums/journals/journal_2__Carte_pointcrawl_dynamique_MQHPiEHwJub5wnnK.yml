      content: >-
        <h2>Exemple — Thunder Ridge / Drygulch</h2>

        <p>Exemple tiré du guide pour montrer comment une aventure de zone met
        directement à jour le pointcrawl.</p>


        <table>

        <tbody>

        <tr><th>Connaissance</th><td>Connu : les PJ savent où se trouvent les
        ravins et les routes logistiques.</td></tr>

        <tr><th>Pression</th><td>Tension : un convoi attendu n’est pas
        arrivé.</td></tr>

        <tr><th>Accès</th><td>Route Razor Hill → Thunder Ridge ouverte ; sentier
        vers Skull Rock encore caché.</td></tr>

        <tr><th>Situation visible</th><td>Un survivant empoisonné revient ; du
        matériel technique manque.</td></tr>

        <tr><th>Si les PJ arrivent maintenant</th><td>Le convoi est abandonné
        dans un ravin ; traces de bêtes et traces d’un groupe léger se
        superposent.</td></tr>

        <tr><th>Si personne n’intervient</th><td>La cache des saboteurs est
        déplacée et la Horde renforce ses patrouilles.</td></tr>

        <tr><th>Payoff</th><td>Identifier le caractère ciblé du vol ; sauver un
        survivant ; repérer une piste ; éventuellement découvrir un accès
        secondaire.</td></tr>

        <tr><th>Transformation possible</th><td>La route logistique devient
        surveillée, ou au contraire mieux sécurisée selon les choix des
        PJ.</td></tr>

        </tbody>

        </table>


        <h3>Ce que l’excursion peut modifier</h3>

        <ul>

        <li>la pression du point : Tension → Calme ou Crise ;</li>

        <li>l’état d’une route ;</li>

        <li>la connaissance d’une connexion cachée ;</li>

        <li>une conséquence persistante visible au prochain passage.</li>

        </ul>
