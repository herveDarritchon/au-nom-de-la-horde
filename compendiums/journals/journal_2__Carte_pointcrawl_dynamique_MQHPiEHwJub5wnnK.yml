  - sort: 1100000
    name: 10 — Référence rapide
    type: text
    _id: f90ed8de2f9015d2
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Référence rapide MJ</h2>


        <h3>Connaissance</h3>

        <table>

        <thead><tr><th>Niveau</th><th>Sens</th></tr></thead>

        <tbody>

        <tr><td><strong>Inconnu</strong></td><td>Ne pas présenter comme option
        fictionnelle.</td></tr>

        <tr><td><strong>Repéré</strong></td><td>Nom, rumeur, silhouette,
        témoignage ; piste possible mais mal connue.</td></tr>

        <tr><td><strong>Connu</strong></td><td>Visité ou suffisamment renseigné
        ; accès principaux et dangers évidents connus.</td></tr>

        <tr><td><strong>Maîtrisé</strong></td><td>Contacts, habitudes, secrets,
        terrain ou raccourcis bien compris.</td></tr>

        </tbody>

        </table>


        <h3>Accessibilité</h3>

        <p><strong>Ouvert</strong> — sans condition particulière.
        <strong>Conditionnel</strong> — ressource, accord, guide ou préparation.
        <strong>Bloqué</strong> — conséquence fictionnelle temporaire.
        <strong>Caché</strong> — connexion existante mais non connue des PJ.</p>


        <h3>Pression</h3>

        <p><strong>Calme</strong> — aucune urgence locale.
        <strong>Tension</strong> — quelque chose évolue. <strong>Crise</strong>
        — un événement en cours modifie activement le lieu, les acteurs ou les
        accès.</p>


        <h3>Erreurs à éviter</h3>

        <ul>

        <li>Transformer la carte en menu de quêtes.</li>

        <li>Tout révéler dès le départ.</li>

        <li>Mettre un événement sur chaque route.</li>

        <li>Faire avancer toutes les menaces en même temps.</li>

        <li>Utiliser « Bloqué » pour forcer le scénario.</li>

        <li>Réinitialiser un lieu après la visite.</li>

        <li>Confondre vue MJ et vue joueurs.</li>

        <li>Ajouter un point uniquement parce qu’il existe dans WoW.</li>

        </ul>


        <h3>Carte MJ / carte joueurs</h3>

        <table>

        <thead><tr><th>Vue MJ</th><th>Vue joueurs</th></tr></thead>

        <tbody>

        <tr><td>Tous les points utiles, secrets, routes cachées, pression
        réelle, évolutions futures.</td><td>Seulement les lieux connus ou
        repérés, routes découvertes et informations obtenues.</td></tr>

        <tr><td>Acteurs secrets, fil rouge, « si personne n’intervient
        ».</td><td>Rumeurs, signes visibles et conséquences observées.</td></tr>

        </tbody>

        </table>


        <blockquote><p><strong>Phrase-guide :</strong> Comment Durotar vit-il
        aujourd’hui, et qu’est-ce que les actions des factions ou des PJ
        viennent changer ?</p></blockquote>
