  - sort: 500000
    name: 04 — Préparer une séance
    type: text
    _id: 1346da2f9fefaff8
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Préparer une séance avec le pointcrawl</h2>

        <p>Le but n’est pas de préparer Durotar entier. Préparer seulement les
        choix réellement atteignables.</p>


        <table>

        <thead><tr><th>Étape</th><th>Action MJ</th><th>Fait</th></tr></thead>

        <tbody>

        <tr><td>1. Localiser les PJ</td><td>Marquer le point actuel et les
        routes immédiatement accessibles.</td><td>☐</td></tr>

        <tr><td>2. Choisir 2 ou 3 pistes visibles</td><td>Ne pas transformer le
        hub en tableau de vingt quêtes.</td><td>☐</td></tr>

        <tr><td>3. Préparer les destinations plausibles</td><td>Pour chacune :
        situation d’arrivée, acteur principal, enjeu et complication
        possible.</td><td>☐</td></tr>

        <tr><td>4. Vérifier les routes</td><td>Noter seulement ce qui peut
        modifier un choix de voyage.</td><td>☐</td></tr>

        <tr><td>5. Faire avancer une force non traitée</td><td>Une faction, une
        horloge ou le fil rouge peut agir hors champ.</td><td>☐</td></tr>

        <tr><td>6. Préparer un payoff</td><td>Information, relation, raccourci,
        ressource ou transformation.</td><td>☐</td></tr>

        </tbody>

        </table>


        <h3>Préparation minimale d’une destination</h3>

        <ol>

        <li><strong>Si les PJ arrivent maintenant :</strong> une scène
        d’ouverture concrète.</li>

        <li><strong>Acteur principal :</strong> qui agit ou réagit ?</li>

        <li><strong>Enjeu :</strong> quelle décision peut être prise ?</li>

        <li><strong>Complication possible :</strong> une seule suffit.</li>

        <li><strong>Si personne n’intervient :</strong> quelle évolution logique
        ?</li>

        <li><strong>Payoff :</strong> qu’est-ce que les PJ peuvent réellement
        gagner ou changer ?</li>

        </ol>


        <blockquote><p><strong>Limite de préparation :</strong> si une
        destination ne peut raisonnablement pas être choisie à cette séance,
        elle n’a pas besoin d’être détaillée maintenant.</p></blockquote>
