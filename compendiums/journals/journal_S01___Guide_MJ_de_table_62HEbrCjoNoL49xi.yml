  - _id: i6kADn67zrr1GW2H
    name: 00 · Tableau de bord
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">AU NOM DE LA HORDE — SESSION
        1</h2>

        <h2 style="margin-top:1em">Le mât rouge et l’escorte de Mâche-Roc</h2>

        <p><strong>GUIDE DE TABLE · MJ UNIQUEMENT · WARBOUND / COF2 · 4 PJ
        NIVEAU 1</strong><br>

        Vallée des Épreuves → mine de Roche-Sèche → Tranchecolline<br>

        Adaptation opérationnelle du <em>Guide MJ V5 consolidé (25 octobre
        2026)</em>. Les propositions de rythme et d’arbitrage ci-dessous sont
        des aides de maîtrise, pas de nouveaux faits canoniques.</p>

        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">00 — TABLEAU DE BORD : GARDER
        SOUS LES YEUX</h2>

        <p><strong>La séance en une phrase.</strong> Quatre recrues nouvellement
        réunies livrent des vivres à Tranchecolline et escortent le chargement
        d’une foreuse depuis Roche-Sèche. Elles affrontent des dangers distincts
        ; à l’arrivée, il apparaît que la foreuse avait déjà disparu avant leur
        prise en charge.</p>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Temps de table*</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Scène</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Ce que les joueurs décident /
        obtiennent</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">0–30 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Le mât
        rouge</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Jazty et Sorez finissent un
        entraînement ; Gurok lit des traces ; Volzan revient des collines.
        Scorpide et chute du mât <strong>facultatifs</strong>.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">30–45 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Gornek</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Affectation officielle ; Jazty
        chef du détachement ; rappel de Galadar à Gurok ; avertissement
        Kolkar.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">45–60 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Le kodo</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Arrimage, responsabilités,
        route et vigilance.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">60–105 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Les
        Kolkar</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Protéger le kodo de vivres :
        combat, discussion, ruse ou détour. <strong>Avant la mine.</strong></td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">105–120 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Reprendre la
        route</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Vivres perdus ou sauvés,
        blessures, temps écoulé. Scène compressible.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">120–155 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Roche-Sèche</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Rukha accueille selon l’état du
        groupe ; quatre caisses scellées <strong>déjà chargées</strong> ;
        inspection possible.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">155–195 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Les
        sangliers</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Sauver travailleurs, attelages
        et chariot ; anomalie magique perceptible.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">195–225 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Tiragarde</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Négocier ou gérer une
        patrouille humaine ; combattre n’est pas obligatoire.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">225–250 min</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Tranchecolline</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Valider <strong>d’abord les
        vivres</strong>, ouvrir les caisses, découvrir les pierres ou
        officialiser un vol déjà découvert.</td>

        </tr>

        </tbody>

        </table>

        <p>*Repères pour une séance de <strong>4 à 5 h</strong> ; ce ne sont ni
        des horaires dans la fiction ni des scènes obligatoirement consommées
        jusqu’au bout.</p>

        <p style="border-left:3px solid #b56d31;padding:7px
        10px;background:rgba(181,109,49,0.07)"><strong>Ne jamais inverser les
        deux chargements :</strong> ① un seul <strong>kodo de bât</strong>
        quitte la Vallée, avec les vivres de Tranchecolline ; ② à
        <strong>Roche-Sèche</strong>, il rejoint les <strong>chariots et kodos
        de traction</strong> déjà chargés pour Mâche-Roc. Les Kolkar s’attaquent
        au premier, avant Roche-Sèche. Les sangliers et les humains apparaissent
        après le départ de la mine.</p>

        <p style="border-left:4px solid #9e2e2e;padding:8px
        12px;background:rgba(190,40,40,.10);font-weight:bold"><strong>LES QUATRE
        VÉRITÉS À NE PAS PERDRE (MJ).</strong></p>

        <ul>

        <li><strong>Krosh Pèse-Charge</strong> a participé à la substitution des
        quatre caisses <strong>avant l’arrivée des PJ</strong>. Les sceaux
        couvrent déjà des pierres et du remblai.</li>

        <li><strong>Les Kolkar</strong> cherchent uniquement de la nourriture
        et, si possible, le kodo ; ils ignorent tout de Mâche-Roc.</li>

        <li><strong>Un chaman du Cercle de la Pierre Brisée</strong> perturbe à
        distance les sangliers. Les PJ n’en découvrent pas automatiquement
        l’origine.</li>

        <li><strong>Yarrog surveille Sorez sur ordre de Neeru Lamefeu</strong>,
        mais reste à l’arrière-plan ce soir. <strong>Le scorpide du mât est
        ordinaire</strong> : pas Sarkoth, pas un agent du complot.</li>

        </ul>

        <p style="border-left:3px solid #b56d31;padding:7px
        10px;background:rgba(181,109,49,0.07)"><strong>Si l’heure tourne
        :</strong> terminer à <strong>Roche-Sèche</strong> avec les caisses en
        attente, ou après la <strong>charge des sangliers</strong>. Ne précipite
        pas Tiragarde et l’épilogue pour cocher toutes les cases. Si la
        révélation arrive tôt, jouer les réactions ; ne pas la refermer.</p>
      markdown: ''
