  - _id: jHGK8fS9xZS405iu
    name: 05 · La charge des sangliers
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">05 — LA CHARGE DES SANGLIERS :
        TROIS URGENCES</h2>

        <p><strong>Vérité MJ.</strong> Un chaman du <strong>Cercle de la Pierre
        Brisée</strong> a perturbé la harde <strong>à distance</strong> pour
        ralentir et déstabiliser l’escorte. Aucun chaman ennemi n’apparaît
        automatiquement sur la piste. Les sangliers ne visent
        <strong>pas</strong> spécifiquement les vivres.</p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE.</strong>

        Les insectes se taisent. Un kodo secoue la tête. Des branches cassent en
        cascade ; une harde de sangliers surgit des broussailles, lancée à une
        vitesse absurde, les yeux affolés. Le premier heurte un chariot, une
        roue saute sur une pierre, un convoyeur tombe et l’attelage se tend
        dangereusement. <strong>Que faites-vous ?</strong></p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Jouer la scène comme
        une urgence, pas comme une extermination.</strong></p></blockquote>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Danger immédiat</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Ce qu’un PJ peut tenter</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Coût plausible si laissé sans
        protection</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Un convoyeur à
        terre</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">L’extraire, couvrir,
        soigner.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Blessure, travailleur
        immobilisé.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Le chariot de Mâche-Roc
        penche</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Soulager, retenir, caler
        l’essieu.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Caisse tombée, roue faussée,
        <strong>contenu dévoilé si brisée</strong>.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Les kodos tirent en
        panique</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Dételer, rassurer, détourner la
        charge.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Attelage rompu, retard et
        réparations.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Arbitrage conseillé (aide MJ, pas règle maison
        obligatoire).</strong> Au premier tour, énonce les trois urgences ;
        chaque action pertinente protège, améliore ou réduit un risque. Si un
        danger est abandonné trop longtemps, applique <strong>une conséquence
        fictionnelle proportionnée</strong>. Évite l’enchaînement de jets
        identiques contre la même difficulté ; laisse les pouvoirs et idées des
        PJ modifier le problème.</p>

        <p><strong>Informations honnêtes :</strong> Gurok remarque <strong>sans
        jet</strong> que les bêtes foncent contre des obstacles au lieu de les
        éviter. Après la charge, les traces convergent puis se dispersent de
        manière peu naturelle. Volzan peut percevoir une perturbation
        spirituelle et Sorez un résidu de magie, <strong>sans déduire
        automatiquement le nom du Cercle</strong>. La Lumière de Jazty
        n’identifie pas à elle seule un rituel chamanique.</p>

        <p><strong>Si une caisse s’ouvre :</strong> les pierres sont visibles,
        maintenant. Ne retarde pas la découverte par un hasard artificiel ;
        transformer le reste du parcours en protection d’une preuve et recherche
        d’explication.</p>

        <p><strong>Sortie.</strong> Soins, état des roues, reprise des
        attelages, éventuellement question : « Qu’avez-vous vu d’anormal ? »
        Puis avancer vers Tiragarde.</p>
      markdown: ''
