  - _id: A3SQO8ReCN8RfDGJ
    name: 09 · Ajuster le rythme
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">09 — AJUSTER LA SÉANCE AU
        RYTHME RÉEL</h2>

        <p><strong>Le bon critère n’est pas “avons-nous atteint le chapitre 9 ?”
        ; c’est :</strong> les joueurs ont-ils commencé à se connaître, pris une
        décision collective et vu sa conséquence ?</p>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Moment de table</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Conduite recommandée</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Ouverture qui
        s’étire</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Laisser naître l’interaction ;
        supprimer <strong>l’incident facultatif du mât</strong> plutôt que
        presser les dialogues.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Kolkar résolus très
        vite</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Ne pas rajouter une vague :
        valoriser l’évitement, avancer vers Roche-Sèche.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Premier combat prend
        longtemps</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Compresser l’interlude et les
        échanges de trajet. S’arrêter à la mine si nécessaire.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Forte enquête à la
        mine</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Lui donner de l’espace : c’est
        un vrai choix de PJ. Ne pas forcer le départ pour préserver le texte
        final.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Les joueurs sont
        fatigués mais encore engagés</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Finir après les sangliers avec
        une conséquence nette sur l’état du convoi ; Tiragarde attendra.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Le groupe atteint
        Tranchecolline</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Prendre le temps de remercier
        pour les vivres <strong>avant</strong> l’ouverture des caisses.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Trois fins de séance satisfaisantes :</strong></p>

        <ol>

        <li><strong>Roche-Sèche</strong> : le convoi déjà prêt, Rukha et Borka
        présentés ; choix « inspecter ou repartir » posé. Bon arrêt après un
        gros Kolkar.</li>

        <li><strong>Après les sangliers</strong> : un convoyeur est sauvé ou
        blessé, une roue est réparée ou une caisse s’est ouverte. Bon arrêt
        après une scène d’action.</li>

        <li><strong>Tranchecolline</strong> : livraison des vivres reconnue,
        puis découverte des pierres ou reconnaissance officielle du vol. Fin
        idéale mais non obligatoire.</li>

        </ol>

        <p><strong>Question de conclusion aux joueurs, si tu souhaites un tour
        bref :</strong> « Quel moment vous a fait comprendre quelque chose de
        nouveau sur l’un de vos compagnons ? » Ne remplace pas l’épilogue de
        fiction par une discussion méta si la table est encore dans
        l’action.</p>

        <p><strong>Avant de lancer Foundry / la table :</strong> avoir à portée
        de main les <strong>fiches COF2 du scorpide, des Kolkar et des
        sangliers</strong> (ou une adaptation validée), les quatre fiches PJ,
        une carte de la piste ou un croquis simple du défilé, et une note pour
        les cargaisons. Les caractéristiques de ces adversaires <strong>ne
        figurent pas dans le document V5</strong> : ne pas prétendre qu’elles y
        sont définies.</p>
      markdown: ''
