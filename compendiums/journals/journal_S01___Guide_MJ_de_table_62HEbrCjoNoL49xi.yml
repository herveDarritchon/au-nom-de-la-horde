  - _id: 2mUgI4hTuBX2D2Dw
    name: 03 · La route et les Kolkar
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">03 — LA ROUTE ET LES KOLKAR :
        PROTÉGER, PAS “NETTOYER”</h2>

        <p><strong>Situation.</strong> La piste longe la combe des Kolkar.
        <strong>Trois centaures indicatifs</strong> (effectif à ajuster à tes
        profils COF2) cherchent à dérober les vivres et éventuellement le kodo.
        Le chef veut nourrir sa bande et repartir vivant.</p>

        <p><strong>Indices avant le contact :</strong> sabots récents,
        broussailles foulées, pierre déplacée sur les hauteurs, trace de
        guetteur. Si Gurok ou un autre repère le dispositif, donne une vraie
        possibilité : formation différente, approche prudente, cache de vivres,
        négociation en position favorable ou détour. <strong>Ne rejoue pas quand
        même une surprise automatique.</strong></p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE — si les PJ
        arrivent sans avoir neutralisé la menace.</strong>

        La piste se resserre entre deux talus. Le kodo ralentit ; des cailloux
        roulent d’en haut. Une silhouette disparaît derrière un rocher. Puis une
        voix : « <strong>Laissez la bête et les sacs. Vous pourrez continuer à
        pied.</strong> » Deux centaures se montrent sur les hauteurs ; un
        troisième cherche à atteindre la longe.</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0 15px;background:rgba(181,109,49,0.09)"><p><strong>Le
        terrain en trois zones :</strong> passage du kodo (étroit), roches et
        talus accessibles, échappée de recul ou de contournement.
        <strong>Tactique kolkar :</strong> un tente la longe ou une sacoche ;
        deux couvrent et menacent. Ils rompent le contact si le butin devient
        trop coûteux.</p></blockquote>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Approche des PJ</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Réaction cohérente des
        Kolkar</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Parler / offrir une
        part de vivres</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Le chef peut accepter un
        prélèvement limité pour épargner la troupe ; tenir compte du rapport de
        force.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Protéger le kodo /
        tenir la piste</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Pillards cherchent sacs isolés
        ou une ouverture ; la défense du chargement prime sur les PV
        ennemis.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Contourner / tromper /
        préparer une embuscade inverse</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Leur tentative peut échouer ou
        changer de lieu ; récompense concrète à la prudence.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Combattre / capturer /
        poursuivre</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Fuite possible ; un captif
        connaît sa bande et ses besoins, <strong>pas la fraude des
        caisses</strong>.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Céder tout le
        ravitaillement</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">La troupe continue, mais
        Tranchecolline sera privée de vivres ; perte importante à assumer, pas
        fin de l’aventure.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Trois enjeux à garder visibles :</strong>
        <strong>kodo</strong> ; <strong>eau et nourriture</strong> ;
        <strong>sécurité des compagnons</strong>. Un PJ peut sécuriser l’un de
        ces enjeux sans “gagner le combat”. Ne place pas toutes les conséquences
        sur un simple jet.</p>

        <p><strong>Après l’incident — demander :</strong> « Que faites-vous
        d’abord : soigner, réarrimer, pister, poursuivre ou repartir ? » Noter :
        cargaison intacte / partielle / majeure ; kodo blessé ? ; pertes
        humaines ? ; à l’heure / retard limité / fort retard.</p>

        <p><strong>Si les vivres sont perdus :</strong> à Roche-Sèche, les
        mineurs peuvent éventuellement aider avec des réserves ou accepter une
        dette ; <strong>ne rétablis pas gratuitement la cargaison</strong>. Si
        les PJ évitent les Kolkar, <strong>ils ont réussi</strong> : ne les
        oblige pas à combattre.</p>

        <p><strong>Sortie.</strong> Route vers la mine. Un échange libre entre
        PJ suffit, sans seconde scène de débrief imposée.</p>
      markdown: ''
