  - _id: Uf4nwuSGehwiw7KZ
    name: 07 · Tranchecolline
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">07 — TRANCHECOLLINE : UNE
        RÉUSSITE, PUIS LE MANQUE</h2>

        <p style="border-left:3px solid #b56d31;padding:7px
        10px;background:rgba(181,109,49,0.07)"><strong>Principe intangible
        :</strong> réceptionner <strong>d’abord les vivres</strong>. Montrer les
        conséquences réelles des choix kolkar : même après un trajet difficile,
        les PJ ont apporté quelque chose d’utile. Seulement ensuite, réception
        des quatre caisses.</p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE —
        arrivée.</strong>

        Les palissades de Tranchecolline dominent la piste. Des gardes viennent
        vers les chariots poussiéreux ; les kodos soufflent bruyamment. Un
        responsable examine l’ordre de Gornek et le rapport de Rukha. Au dépôt,
        un quartier-maître défait les sangles de votre kodo : « <strong>Ça, au
        moins, c’est arrivé. Les nôtres en avaient besoin.</strong> »</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Donner la parole au
        détachement.</strong> Que rapportent-ils des Kolkar, de la harde, des
        humains ? Quel état des vivres ? Le réceptionnaire ne devine pas leurs
        fautes ou mérites : il écoute.</p></blockquote>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE — si les
        caisses n’ont pas été ouvertes plus tôt.</strong>

        On rompt le premier sceau. Un ouvrier soulève le couvercle, repousse une
        toile grasse, puis s’arrête. Il plonge la main dans le remplissage et en
        sort… une pierre. Il la laisse tomber. Un second couvercle cède, puis un
        troisième. <strong>Du remblai, des cailloux, des ferrailles.</strong>
        Pas de moteur. Pas de tête de forage. <strong>Mâche-Roc n’est pas
        là.</strong></p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Laisser les joueurs
        réagir immédiatement.</strong> Le responsable fait protéger les caisses,
        les bordereaux et les témoins. Il <strong>n’accuse pas
        automatiquement</strong> les PJ. Leur premier rapport et leur conduite
        comptent.</p></blockquote>

        <p><strong>Cinq réponses disponibles sans piège à jet unique
        :</strong></p>

        <ul>

        <li><strong>Quand ?</strong> Bourrage ancien ; clous sous poussière
        uniforme ; sceaux apposés <strong>après</strong> la substitution, avant
        la route.</li>

        <li><strong>Qui a signé ?</strong> Bordereaux au nom de <strong>Krosh
        Pèse-Charge</strong>, Roche-Sèche ; témoin important, culpabilité encore
        à établir aux yeux des PJ.</li>

        <li><strong>Les Kolkar ?</strong> Ils visaient le kodo de vivres, pas
        les caisses de forage.</li>

        <li><strong>Les sangliers ?</strong> Comportement anormal ; cause
        précise encore inconnue à ce stade.</li>

        <li><strong>Qui connaissait l’envoi ?</strong> Responsables de la mine
        et des transports ; recouper les documents.</li>

        </ul>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE — clôture
        possible.</strong>

        Le responsable pose le bordereau sur la table et montre la signature. «
        Quelqu’un a fait escorter quatre caisses de pierres par la Horde. Et
        quelqu’un savait exactement ce qu’elles auraient dû contenir.
        <strong>Racontez-moi ce qui s’est passé avant votre départ de
        Roche-Sèche.</strong> »</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0 15px;background:rgba(181,109,49,0.09)"><p><strong>Si
        le vol était déjà connu :</strong> cette scène devient <strong>la remise
        officielle des preuves et l’ouverture de l’enquête</strong>, pas une
        seconde surprise. Les PJ peuvent aussi décider de ne pas venir
        immédiatement à Tranchecolline : faire réagir les responsables selon
        leurs actions, sans téléporter la révélation.</p></blockquote>
      markdown: ''
