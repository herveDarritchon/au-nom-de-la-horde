  - _id: vPu9ChltOYZU14kh
    name: 08 · PNJ, secrets et imprévus
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">08 — PNJ, SECRETS ET BRANCHES
        IMPREVUES</h2>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">PNJ / force</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Objectif immédiat</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Comment le jouer</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Gornek</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Donner les ordres et éprouver
        un groupe de recrues.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Sobre et exigeant ; son avis
        sur Galadar et Gurok est personnel.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Thazz’rill</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Lever un mât neuf sans blesser
        ses péons.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Pratique, impatient, travaille
        avec eux.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Galgar</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Que les vivres atteignent les
        habitants.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Une pointe d’humour ; pas un
        donneur de quête supplémentaire.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Yarrog</strong>
        <strong>[SECRET]</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Observer Sorez et gagner sa
        confiance pour Neeru.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Serviable en apparence,
        <strong>pas d’approche programmée</strong>.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Rukha</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Protéger bêtes, convoyeurs et
        chargement.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Directe, juste, ne couvre pas
        Krosh.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Borka</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Respecter la machine qui a
        sauvé six mineurs.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Fier, affectivement attaché à
        Mâche-Roc.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Krosh</strong>
        <strong>[COMPLICE]</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Faire partir les caisses
        <strong>sans ouverture</strong>.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Administratif, presse les gens
        ; aucune omniscience.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Chef
        kolkar</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Nourriture / kodo, sans y
        laisser sa bande.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Calcule, menace, négocie ou
        fuit.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Chef
        humain</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Informations sur les mouvements
        de la Horde.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Prudent, pas suicidaire ni
        gratuitement belliqueux.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Réceptionnaire</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Vérifier les livraisons et
        préserver les preuves.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Méthodique, suspend les
        accusations.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Trois faits personnels à respecter :</strong> Volzan a un ami
        survivant de l’attaque de <strong>Sarkoth</strong> avec séquelles,
        <strong>sans détails fixés</strong> ; Sorez connaît <strong>déjà
        Yarrog</strong> mais son degré de confiance dépend du joueur ; Gurok est
        fils de <strong>Galadar d’Alterac</strong>, sans histoire intime
        décrétée par Gornek. Jazty est un paladin sin’dorei <strong>exceptionnel
        à cette époque</strong>, non la preuve d’une affiliation générale des
        Elfes de sang à la Horde.</p>

        <p><strong>Si les joueurs font autrement que prévu :</strong></p>

        <ul>

        <li><strong>Ils évitent les Kolkar :</strong> récompenser l’observation
        et la route choisie ; la mine est toujours là.</li>

        <li><strong>Ils arrivent à Roche-Sèche à la nuit :</strong> le convoi
        <strong>attend toujours</strong>, Rukha propose dormir / repartir ; rien
        ne se volatilise pendant la nuit.</li>

        <li><strong>Ils ouvrent les caisses à la mine :</strong> autoriser la
        découverte et l’enquête ; la mission devient transport de preuves /
        recherche de responsables.</li>

        <li><strong>Ils accusent ou arrêtent Krosh :</strong> il proteste,
        invoque les bordereaux et son autorité ; la suite repose sur témoignages
        et preuves, pas sur une confession automatique.</li>

        <li><strong>Ils ne rejoignent pas le convoi :</strong> Rukha protège ses
        attelages et demande des instructions ; ne pas la faire partir sans
        escorte comme punition scénaristique.</li>

        <li><strong>Ils veulent chasser le chaman après les sangliers :</strong>
        aucune présence immédiate garantie. Donner seulement les traces
        réellement disponibles ; possibilité de suite ultérieure.</li>

        <li><strong>Ils combattent les humains :</strong> conséquences
        politiques et matérielles plausibles, sans transformer tout Durotar en
        guerre ouverte d’un coup.</li>

        </ul>

        <p><strong>Garde-fou :</strong> le mystère du vol est
        <strong>distinct</strong> du pillage kolkar, du scorpide naturel et de
        la surveillance de Sorez. Les sangliers sont influencés, mais
        <strong>l’identité du commanditaire ne tombe pas du ciel</strong>.</p>
      markdown: ''
