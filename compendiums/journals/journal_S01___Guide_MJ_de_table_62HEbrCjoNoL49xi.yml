  - _id: nb5fofpdEjgEnxmY
    name: 00 bis · Les quatre PJ
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">00 BIS — LES PJ ET LES RÉFLEXES
        DU MJ</h2>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">PJ</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Lui donner une première
        prise</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Lui rendre la main plus tard</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Jazty</strong>, paladin
        sin’dorei</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Dernière passe contre Sorez ; «
        Qu’essaies-tu de lui apprendre ? »</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Chef du détachement,
        <strong>pas</strong> supérieur de Rukha. Répartir les rôles, décider
        face aux Kolkar et aux humains.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Sorez</strong>, troll
        démoniste</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Réagir librement à
        l’entraînement ; aucun résultat imposé.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Lire les signes d’une influence
        magique, employer sa magie sans interprétation forcée. Yarrog en toile
        de fond seulement.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Gurok</strong>, orc
        chasseur</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Observer des indices discrets
        au sol près du chantier.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Pister, choisir une route, voir
        venir les Kolkar ; remarque de Gornek sur son père, Galadar
        d’Alterac.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Volzan</strong>, troll
        chaman</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Descendre des hauteurs après un
        recueillement ; scorpides dérangés.</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Rapports aux animaux et aux
        esprits, sangliers anormaux. Son ami a survécu à l’attaque de Sarkoth
        avec des séquelles ; <strong>détails non définis</strong>.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Cinq règles de conduite :</strong> (1) Une description
        courte, puis <strong>« Que faites-vous ? »</strong> ; (2) attendre que
        <strong>les quatre PJ aient joué</strong> avant tout incident du mât ;
        (3) les PNJ veulent quelque chose, ils ne distribuent pas des
        cinématiques ; (4) si une action logique révèle un indice,
        <strong>donne-le</strong>, sans exiger un jet gratuit ; (5) leurs
        réussites sont vraies, même lorsque le vol est révélé.</p>

        <p><strong>Résolution rapide.</strong> Ne jette les dés que lorsqu’une
        issue est incertaine et intéressante. Pour la marche, si tu appliques
        les rôles Warbound : <strong>Guide = INT (Survie)</strong>,
        <strong>Éclaireur = PER (Survie)</strong>, <strong>Voyageurs = CON
        (Survie)</strong>, sur <strong>un seul test collectif de
        journée</strong> ; vigilance d’embuscade séparée si pertinente. Utilise
        les difficultés, caractéristiques et blocs de créatures de tes fiches
        Warbound/COF2. <strong>Ce guide ne remplace pas les profils chiffrés des
        adversaires.</strong></p>

        <p><strong>État à noter, pas à comptabiliser au kilo :</strong> kodo
        (indemne / blessé / perdu), vivres (intacts / perte partielle / perte
        majeure), temps (à l’heure / retard limité / fort retard), blessés,
        inspection des caisses (oui/non), identité connue de Krosh, attitude de
        Rukha, issue Tiragarde.</p>
      markdown: ''
