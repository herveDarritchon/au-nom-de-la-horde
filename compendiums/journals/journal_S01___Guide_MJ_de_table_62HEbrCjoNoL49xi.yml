  - _id: NzEJ8DQjJbICwZoz
    name: 04 · Mine de Roche-Sèche
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">04 — ROCHE-SÈCHE : LE CONVOI
        EST DÉJÀ PRÊT</h2>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE —
        arrivée.</strong>

        Un marteau frappe l’acier derrière les ateliers de Roche-Sèche. Dans la
        cour poussiéreuse, <strong>quatre caisses cerclées de fer</strong> sont
        déjà fixées sur les chariots, attelés à leurs propres kodos. Des
        ouvriers attendent. Une Orque au visage fatigué jauge votre troupe et
        les sacs du kodo. « <strong>Rukha. Je m’occupe du convoi. Vous êtes les
        gens de Gornek ?</strong> »</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0 15px;background:rgba(181,109,49,0.09)"><p><strong>PNJ
        actifs :</strong> <strong>Rukha</strong>, responsable honnête des
        convoyeurs (sécurité et bêtes) ; <strong>Borka</strong>, vieux mineur
        attaché à la foreuse ; <strong>Krosh Pèse-Charge</strong>, responsable
        des inventaires <strong>complice de la substitution</strong>. La machine
        avait sauvé <strong>six mineurs</strong> d’un
        éboulement.</p></blockquote>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Si les PJ arrivent…</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Rukha dit / fait…</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>À l’heure, chargement
        préservé</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">« Parfait. On est prêts. Vous
        pouvez vérifier vos attelages. »</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Avec retard
        limité</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">« Qu’est-ce qui vous a retenus
        ? » Écoute le rapport, n’accuse pas automatiquement.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>À la tombée du
        jour</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Propose une nuit sous garde
        puis le départ à l’aube ; un départ tardif reste discutable.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Avec un blessé ou des
        vivres manquants</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">S’occupe d’abord des bêtes et
        des blessés, puis de l’horaire.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Borka, près d’une caisse.</strong> « Mâche-Roc nous a tirés
        de là-dessous. Six mineurs. Ramenez-la-nous entière, hein ? »
        <strong>Krosh</strong>, surtout si quelqu’un veut vérifier : « Les
        sceaux sont faits, les signatures aussi. On a déjà assez perdu de temps.
        » Rukha peut autoriser une inspection contradictoire raisonnable.</p>

        <p style="border-left:4px solid #9e2e2e;padding:8px
        12px;background:rgba(190,40,40,.10);font-weight:bold"><strong>LES QUATRE
        CAISSES — SECRET MJ :</strong></p>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Caisse</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Étiquette officielle</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Réalité</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>1</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Moteur et transmission</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Pierres et rebuts de
        ferraille.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>2</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Tête de forage</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Pierres maintenues par du bois
        de bourrage.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>3</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Châssis démonté</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Pierres et déchets
        miniers.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>4</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Tuyaux et rechanges</td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Roches et quincaillerie
        banale.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Indices accessibles sans accusation miracle :</strong> poids
        très homogène ; graisse surtout <strong>sur l’extérieur</strong> ;
        bordereaux <strong>signés par Krosh</strong> sans vérification
        contradictoire devant les PJ. Ouvrir une caisse <strong>révèle les
        pierres</strong>. Les scellés ne sont pas un obstacle absolu ; si les PJ
        insistent, Rukha peut faire constater l’ouverture.</p>

        <p><strong>Si le vol est trouvé maintenant :</strong> basculer en
        enquête et décisions : inspecter les autres caisses, retenir les
        documents, interroger Krosh, prévenir Gornek, reporter le trajet ou
        amener la preuve à Tranchecolline. <strong>Ne fais pas partir les
        caisses pour sauver le twist.</strong> Ne désigne pas Krosh coupable
        sans éléments observés.</p>

        <p><strong>Si départ normal :</strong> Rukha gère les convoyeurs et
        attelages, Jazty les quatre PJ. Le <strong>kodo de vivres</strong>
        rejoint le convoi de la foreuse ; il n’a jamais transporté les pièces de
        Mâche-Roc.</p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE —
        convoi.</strong>

        Les chariots s’ébranlent sous les efforts des kodos de traction. Le
        vôtre marche à côté, chargé des provisions rescapées. Devant l’entrée de
        la mine, Borka suit longtemps du regard les lourdes caisses avant de
        retourner au travail.</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Sortie.</strong> Faire
        désigner la nouvelle formation ; une seule respiration relationnelle si
        elle vient naturellement.</p></blockquote>
