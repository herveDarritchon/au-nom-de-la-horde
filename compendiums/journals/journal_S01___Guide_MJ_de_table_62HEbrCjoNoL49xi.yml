  - _id: ZTyPrXaIrKhRABmP
    name: 06 · Tiragarde
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">06 — TIRAGARDE : LA TENSION
        SANS COMBAT OBLIGÉ</h2>

        <p><strong>Vérité MJ.</strong> Une patrouille humaine liée aux forces de
        <strong>Tiragarde</strong> et à l’héritage de <strong>Daelin
        Portvaillant</strong> suit les mouvements de la Horde. Elle veut de
        l’information et ne souhaite pas perdre ses hommes dans une escarmouche
        inutile. <strong>Aucun lien avec le vol.</strong></p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE.</strong>

        Quatre silhouettes humaines émergent entre les rochers. Leurs couleurs
        sont usées par la poussière. L’un lève la main, paume ouverte ; les
        armes restent visibles, mais personne ne charge. « <strong>Halte. D’où
        vient ce convoi ? Et où va-t-il ?</strong> » Son regard passe des
        caisses scellées au kodo chargé de vivres.</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Rukha, à voix basse
        :</strong> « Vous êtes l’escorte. Moi, je n’ai aucune envie de perdre un
        kodo parce que quelqu’un veut gagner une dispute. »</p></blockquote>

        <p><strong>Le soldat veut savoir :</strong> provenance, destination,
        nature apparente du convoi et intention militaire. Il ne connaît pas
        nécessairement Mâche-Roc. Il peut croire une explication plausible, se
        tendre sous menace ou accepter une sortie honorable.</p>

        <table class="table-striped"
        style="border-collapse:collapse;width:100%;margin:12px
        0;font-size:0.95em">

        <thead>

        <tr>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Choix des PJ</th>

        <th style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.45);text-align:left">Ce que la patrouille peut
        faire</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Dire une partie de la
        vérité / parlementer</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Questions supplémentaires, puis
        passage sans combat si l’explication paraît suffisante.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Mentir / feinter /
        contourner</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Se faire soupçonner, demander
        des vérifications ou devoir accepter un détour.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Invoquer Gornek /
        montrer l’ordre</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Évalue le document et les
        conséquences d’un incident diplomatique.</td>

        </tr>

        <tr>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top"><strong>Intimider /
        attaquer</strong></td>

        <td style="padding:6px 8px;border:1px solid
        rgba(110,110,110,.3);vertical-align:top">Défense et repli possibles ;
        descriptions des PJ susceptibles de circuler à Tiragarde.</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Jazty.</strong> Certains soldats peuvent s’étonner d’un
        paladin sin’dorei aux côtés de la Horde. Pas de discours imposé sur sa
        loyauté ni de consensus parmi les humains. Offrir la parole au joueur,
        pas une épreuve d’identité obligée.</p>

        <p><strong>Sortie.</strong> Passage obtenu, détour, rupture ou conflit ;
        note ce que les humains <strong>ont réellement vu ou appris</strong>. Le
        convoi continue si la voie est libre.</p>
      markdown: ''
