  - _id: TEdYHYIgTHE2UFwj
    name: '02 · Gornek : l’affectation'
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">02 — GORNEK : L’AFFECTATION ET
        LES ORDRES</h2>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE —
        rassemblement.</strong>

        Gornek attend devant l’Antre, un rouleau d’ordres à la main. « Votre
        formation est terminée. Il n’y aura plus un instructeur derrière chacun
        de vos pas. » Il lit quelques noms. « <strong>Gurok. Sorez. Jazty.
        Volzan.</strong> Vous quatre, approchez. »</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Temps de personnage —
        Gurok.</strong> Gornek : « <strong>Gurok. Le capitaine Galadar
        d’Alterac. Ton père.</strong> Je connais son nom. Il serait temps que tu
        lui fasses honneur, non par tes exercices, mais quand d’autres
        compteront sur toi. » <strong>Question au joueur :</strong> « Que
        réponds-tu ? » C’est le jugement <strong>de Gornek</strong>, pas une
        vérité imposée sur Gurok.</p></blockquote>

        <p><strong>Temps de commandement — Jazty.</strong> Gornek : «
        <strong>Jazty, tu prendras la tête de ce détachement.</strong> C’est à
        toi que je demanderai des comptes. Un bon chef écoute ceux qui
        connaissent la piste. » <strong>Question :</strong> « Adresses-tu
        quelques mots à tes compagnons ? Répartis-tu les rôles ? » Il commande
        la sûreté des quatre, <strong>pas Rukha ni les convoyeurs</strong>.</p>

        <p><strong>Avertissement réel.</strong> Gornek montre la piste vers
        Roche-Sèche, proche des terres de la <strong>combe des Kolkar</strong> :
        activité récente plus forte, guetteurs et pillards. « Observez les
        hauteurs. Ne courez pas tous après le premier assaillant.
        <strong>N’oubliez pas ce que vous protégez. Soyez vigilants.</strong> »
        Le danger n’est pas une attaque inévitable.</p>

        <p><strong>L’ordre, en deux étapes :</strong></p>

        <ol>

        <li>Partir immédiatement de la Vallée avec <strong>un kodo de
        bât</strong> : pommes, pommes-cactus de Galgar, viande de sanglier
        séchée, eau, bois ; destination finale
        <strong>Tranchecolline</strong>.</li>

        <li>Faire étape à la <strong>mine de Roche-Sèche</strong>, où le convoi
        <strong>déjà chargé</strong> de la foreuse gobeline
        <strong>Mâche-Roc</strong> les attend. Rejoindre l’escorte de
        <strong>Rukha</strong> et conduire <strong>les deux chargements</strong>
        jusqu’à Tranchecolline. Mâche-Roc doit ensuite servir aux travaux sous
        Orgrimmar.</li>

        </ol>

        <p><strong>Échéance souple.</strong> Attendus à la mine <strong>vers le
        milieu du jour</strong> ; arriver tard pourra changer l’accueil ou
        justifier une nuit sur place, sans faire partir le convoi à leur
        place.</p>

        <p><strong>Questions utiles :</strong> Qui prend l’ordre ? Qui vérifie
        le kodo ? Que veulent-ils savoir des Kolkar ? Qui décide l’itinéraire ?
        Répondre sans cacher des éléments connus pour fabriquer une
        surprise.</p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE —
        départ.</strong>

        Le kodo renâcle sous ses sacoches. Galgar vérifie les paniers de
        pommes-cactus. « Celles-là, c’est pour Tranchecolline. Pas pour votre
        petit déjeuner… Enfin, pas toutes. » Le mât neuf et la bannière rouge
        restent derrière vous ; devant, les rochers brûlants de Durotar.</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Sortie.</strong> Jazty
        organise librement la marche ; chacun peut prendre une tâche. <strong>Le
        kodo de vivres accompagne les quatre PJ, sans chariot de foreuse à ce
        stade.</strong></p></blockquote>
      markdown: ''
