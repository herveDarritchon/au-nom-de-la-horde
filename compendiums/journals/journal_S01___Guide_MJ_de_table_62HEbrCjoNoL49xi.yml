  - _id: xvWzJSzKSUw3PEYd
    name: 01 · Le mât rouge
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <h2 style="border-bottom:1px solid
        rgba(150,115,60,.45);padding-bottom:5px">01 — LE MÂT ROUGE : FAIRE
        NAÎTRE LE GROUPE</h2>

        <p><strong>Fonction.</strong> Présenter un Durotar vivant et une Horde
        qui accueille de nouvelles recrues. Faire parler et agir <strong>Jazty,
        Sorez, Gurok puis Volzan</strong> dans un espace continu. Ne pas
        fabriquer d’amitié antérieure.</p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE —
        ouverture.</strong>

        Le bois frappe le bois dans l’air chaud de la Vallée des Épreuves.
        Devant l’Antre, des recrues achèvent leurs exercices. Plus loin, les
        maillets cognent : des péons aménagent un nouveau terrain d’accueil et
        d’entraînement. Un mât de bois neuf repose à côté d’une fosse
        fraîchement creusée. Dans l’aire d’exercice, Jazty et Sorez sont engagés
        dans leur dernière passe.</p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0 15px;background:rgba(181,109,49,0.09)"><p><strong>1 —
        Donner la parole à Jazty et Sorez.</strong> « Jazty, qu’essaies-tu de
        lui apprendre ou de vérifier ? » « Sorez, comment t’y prends-tu ? »
        L’exercice peut finir sur un geste, une discussion, une feinte ou un
        test <strong>facultatif</strong> ; n’impose ni vainqueur ni
        chute.</p></blockquote>

        <p><strong>2 — Raccorder à Gurok.</strong> Lors d’un temps de
        respiration, montrer Gurok accroupi près de pierres au bord du chantier
        : brindille cassée bas, poussière fraîche, petits cailloux déplacés. «
        Gurok, comment cherches-tu à comprendre ce passage ? » Si ses gestes le
        justifient, ajouter des frottements de carapace ou une piste vers le
        mât. <strong>Ne dis pas “scorpide” d’entrée</strong> : les signes sont
        d’abord ambigus.</p>

        <p><strong>3 — Faire arriver Volzan sans coupe ni flashback.</strong>
        Des pas roulent sur le gravier ; Volzan revient des hauteurs, où il
        s’est recueilli. Il a remarqué des scorpides quittant des abris rocheux
        depuis que l’on remue la terre. « Volzan, qu’est-ce qui te préoccupe ?
        Et que fais-tu en voyant Gurok ? » Laisser les PJ rapprocher — ou non —
        leurs observations.</p>

        <p><strong>4 — Laisser les relations se faire.</strong> Deux à quatre
        minutes d’échanges spontanés peuvent suffire ; aucun PNJ n’a besoin de
        commenter leurs pensées. Thazz’rill dirige le chantier. Yarrog peut
        apparaître <strong>une seule fois</strong>, aidant une autre recrue,
        sans aborder Sorez.</p>

        <p><strong>OPTION — incident du mât, uniquement si les 4 PJ ont
        agi.</strong> Un <strong>scorpide ordinaire</strong> dérangé émerge près
        de la fosse. Un péon effrayé risque de lâcher une corde ; le mât menace
        alors de basculer. Si les PJ ont anticipé, <strong>pas d’accident
        forcé</strong>.</p>

        <p style="margin:12px 0 4px;font-weight:bold"><strong>À DIRE — si le
        danger se déclenche.</strong>

        « TIREZ ! » crie Thazz’rill. Le mât se soulève. Entre les pierres, une
        carapace sombre remue, puis un dard apparaît. Un ouvrier recule et lâche
        sa corde ; le bois part de côté. <strong>Que faites-vous ?</strong></p>

        <blockquote style="border-left:4px solid #b56d31;padding:7px
        13px;margin:4px 0
        15px;background:rgba(181,109,49,0.09)"><p><strong>Issues :</strong>
        prévenir, retenir la corde, mettre les péons à l’abri, écarter le
        scorpide, combattre, laisser passer, ou ne pas intervenir. Les ouvriers
        réagissent aussi. Note mât sauvé / réparations, éventuel blessé et
        regard de Thazz’rill. <strong>Ni Sarkoth ni
        conspiration.</strong></p></blockquote>

        <p><strong>Sortie.</strong> Le chantier reprend, un appel rassemble les
        recrues devant l’Antre : <strong>Gornek annonce les
        affectations</strong>. Si le groupe échange déjà bien, coupe l’incident
        facultatif et avance.</p>
      markdown: ''
