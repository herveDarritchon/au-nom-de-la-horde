        <h1>Contremaître Thazz'rill</h1>

        <blockquote><p><strong>[CANON] personnage ; développement
        [ADAPTATION]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Il incarne la construction concrète de la
        jeune Horde : quelqu'un doit bâtir, réparer, transporter et
        terminer.</p>

        <h2>Présence</h2><p>Orc d'âge mûr, peau jaune-verte, cheveux brun-roux,
        tablier de cuir, pioche, corde, crochet et outils partout. Presque
        toujours couvert de poussière.</p>

        <h2>Voix et répliques</h2><ul><li>« Si je dois venir vérifier, c'est que
        c'est déjà mal fait ! »</li><li>« Je ne demande pas vite. Je demande
        fini. »</li></ul>

        <h2>Veut</h2><p>Que les choses avancent aujourd'hui. Chaque structure
        terminée est pour lui une victoire réelle de la Horde.</p>

        <h2>Craint</h2><ul><li>être considéré comme incapable de tenir ses
        équipes</li><li>perdre du temps</li><li>voir les problèmes réels se
        cacher derrière la paresse apparente</li></ul>
