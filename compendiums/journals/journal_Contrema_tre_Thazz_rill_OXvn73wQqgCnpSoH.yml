  - sort: 200000
    name: Relations avec les PJ
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Travailler réellement avec
        lui ; ne pas craindre de se salir ; rendre un outil perdu ; défendre un
        péon quand il a raison ; proposer une meilleure solution.</p>

        <h2>La perdre / devenir son adversaire</h2><p>L'humilier devant ses
        travailleurs ; promettre de l'aide puis disparaître ; utiliser son
        équipe sans demander ; traiter les péons comme des ressources.</p>

        <h2>Liens personnels possibles</h2>

        <h3>La pioche prêtée</h3><p>« Tu me la ramènes. Pas une autre. Celle-là.
        » Si elle est perdue, cassée ou revient couverte de sang, l'objet
        devient une histoire commune.</p><h3>Le travail terminé
        ensemble</h3><p>Après une nuit à réparer une structure, Thazz'rill tend
        une gourde : « T'es moins inutile que tu en as l'air. »</p><h3>Le péon
        protégé</h3><p>Un PJ prend la défense d'un péon que Thazz'rill accuse à
        tort. S'il découvre son erreur, il change la consigne sans grand
        discours.</p><h2>S'il devient un allié</h2><p>Matériel, réparations,
        ouvriers, connaissance des chantiers et reconnaissance des outils ou
        méthodes.</p><h2>S'il devient hostile</h2><p>Terriblement peu
        coopératif. « Vous avez besoin d'une corde ? Dommage. J'ai besoin de
        toutes mes cordes. »</p>
