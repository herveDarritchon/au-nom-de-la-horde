        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Une corde casse sur un chantier.
        Thazz'rill choisit immédiatement de sauver le péon coincé plutôt que le
        matériel, puis passe une heure à hurler sur la corde.</p>

        <h2>Évolution hors champ</h2><p>Il termine hors champ une structure
        commencée à la première séance ou est plus tard affecté à un chantier de
        Tranchecolline ou d'Orgrimmar.</p>

