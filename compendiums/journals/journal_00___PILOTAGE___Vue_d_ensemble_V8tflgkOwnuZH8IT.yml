      content: "<p></p><small><p><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Navigation</p></small><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><p><strong>Point d’entrée pour diriger le voyage des deux convois.</strong> Deux journées indicatives. La structure propose des bifurcations ; les décisions et le temps écoulé restent souverains.</p><p><strong>En cours de partie :</strong> ouvrir la scène à jouer ; passer à sa page « Décisions / conséquences » si elle existe ; consulter les règles contextuelles ; reporter l’état du convoi et les minutes au registre.</p><h3>Scènes — Jour 1</h3><p>@UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{00 — Gornek : affectation et ordres (après la séance 1)}</p><p>@UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{01 — Sur la route : quitter la vallée des Épreuves}</p><p>@UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{02 — Les Kolkar et les vivres} · @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.ZvRQjvSnNoUwN1YH]{Mémento combat}</p><p>@UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{03 — Roche-Sèche : le second convoi}</p><p>@UUID[JournalEntry.CUSS9LNh1aVHmC4H.JournalEntryPage.3cuZoMID9cx1JnQ9]{04 — La route entre les incidents}</p><p>@UUID[JournalEntry.zg0ZrdYd7H5Uc8gY.JournalEntryPage.4Z4q8B2PkX86MtE5]{05 — La ruée dans le goulet}</p><p>@UUID[JournalEntry.gQ9DSemaiBWIjW0r.JournalEntryPage.M3exRvSKspw29FSl]{06 — Piste et point d’eau (facultatif)}</p><p>@UUID[JournalEntry.x3XLdzGIaU5xDuhh.JournalEntryPage.eR76EoKqNGdyiYQ7]{07 — Le choix du crépuscule}</p><p>@UUID[JournalEntry.6ueaE9YrYzfXxCzY.JournalEntryPage.BVe2Ow8tudCrRSVz]{08 — Trois manières de passer la nuit}</p><p>@UUID[JournalEntry.mzWDxHVfwUij