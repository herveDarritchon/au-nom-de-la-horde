    text:
      format: 1
      content: "<p></p><small><p><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Livret narratif — v0.1 (7 novembre 2026) ; Document maître évolutif — v0.2 (5 novembre 2026)</p></small><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><p><strong>Continuité déjà jouée :</strong> lever et exercices du matin, scorpide découvert près du chantier de Thazz’rill. @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{Gornek attribue la mission} ensuite, puis @UUID[JournalEntry.UrJ1Dw9jRnFJoV14.JournalEntryPage.btMMdwxw1qmeZCQW]{le convoi prend la route} en matinée. Les incidents suivants sont des situations ouvertes.</p><table style=\"width:100%;border-collapse:collapse\"><thead><tr><th><p>MOMENT INDICATIF</p></th><th><p>SCÈNE</p></th></tr></thead><tbody><tr><td><p>Aube et matin</p></td><td><p>Ordres de Gornek, départ de la vallée ; tentative de pillage des Kolkar.</p></td></tr><tr><td><p>Vers midi</p></td><td><p>Roche-Sèche : arrivée, aperçus de la mine, jonction avec le lourd convoi.</p></td></tr><tr><td><p>Après-midi</p></td><td><p>Route calme, puis ruée d’animaux dans le goulet ; enquête facultative.</p></td></tr><tr><td><p>Crépuscule et nuit</p></td><td><p>Décision de poursuivre, rejoindre la halte ou établir un bivouac de fortune.</p></td></tr><tr><td><p>Lendemain</p></td><td><p>Départ selon l’état du groupe ; patrouille de Tiragarde ; suite vers Tranchecolline.</p></td></tr></tbody></table><p></p><small><p>Les horaires précis et la localisation cartographique de la halte restent à calibrer. Les scènes peuvent se décaler en fonction de la partie.</p></small><p>Mission : deux convois de la Horde progressent à travers le sud de Durotar. Leur voyage est ponctué d’une tentative de pillage, d’une anomalie de cargaison, d’une ruée et d’une rencontre avec des soldats humains. Les personnages doivent arbitrer entre protection, compréhension des incidents, respect du calendrier et relations avec les convoyeurs.</p><table style=\"width:100%;border-collapse:collapse\"><thead><tr><th><p>Moment indicatif</p></th><th><p>Séquence</p></th><th><p>Statut / fonction</p></th></tr></thead><tbody><tr><td><p>Jour 1 — aube</p></td><td><p>Affectation par Gornek puis départ</p></td><td><p>[ACQUIS] Définir rôle d’escorte et état initial.</p></td></tr><tr><td><p>Jour 1 — matin</p></td><td><p>Embuscade des Kolkar</p></td><td><p>[ACQUIS] Pillage tactique / panique du kodo.</p></td></tr><tr><td><p>Jour 1 — midi environ</p></td><td><p>Mine de Roche-Sèche / deuxième convoi</p></td><td><p>[ACQUIS] Anomalie de la livraison, enquête facultative.</p></td></tr><tr><td><p>Jour 1 — après-midi</p></td><td><p>Route puis ruée dans le goulet</p></td><td><p>[ACQUIS] Crise collective puis piste vers le point d’eau.</p></td></tr><tr><td><p>Jour 1 — soir/nuit</p></td><td><p>Halte prévue ou bivouac de fortune</p></td><td><p>[PROPOSITION] Déterminé par le retard et les choix.</p></td></tr><tr><td><p>Jour 2</p></td><td><p>Patrouille de Tiragarde</p></td><td><p>[À DÉFINIR] Rencontre humaine influencée par l’état du groupe.</p></td></tr><tr><td><p>Suite du voyage</p></td><td><p>Arrivée à Tranchecolline</p></td><td><p>[ACQUIS] Trois interlocuteurs, trois affaires distinctes.</p></td></tr></tbody></table><p></p><small><p><strong><span style=\"text-decoration:underline\">Horaires ci-dessus :</span></strong> repères narratifs, non calendrier validé. La localisation de la halte dans le tronçon Tranchecolline–Sen’jin, les distances précises et le détour compatible avec la rencontre de Tiragarde restent à caler sur une carte Classic. Les scènes peuvent glisser d’une séance à l’autre.</p></small><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire interactif} \_ · \_ @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.y7QBivdSPBY2IFyq]{Conduite de la table}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{À jouer — l’affectation de Gornek} \_ · \_ @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table} \_ · \_ @UUID[JournalEntry.1w5SomDLshDAWOoC.JournalEntryPage.MXJysq678UIyw76D]{Points ouverts, sans réponses inventées}</p>"
