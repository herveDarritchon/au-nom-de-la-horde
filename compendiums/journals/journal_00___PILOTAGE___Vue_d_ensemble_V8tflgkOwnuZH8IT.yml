  - name: Conduite de la table
    type: text
    sort: 200000
    text:
      format: 1
      content: "<p></p><small><p><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement</p></small><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>Cadre narratif</h3><p>Ce document est le compagnon narratif. Il contient ce que les personnages peuvent entendre, voir, demander et provoquer. Les règles, les tableaux de retard et les effets de récupération restent dans le document maître ; on y renvoie lorsqu'une situation exige une résolution.</p><p>La narration suit deux journées de voyage, et non un découpage obligatoire en séances. Certaines parties sont prêtes à jouer, d'autres restent volontairement ouvertes : ce livret ne présume ni du contenu réel des caisses, ni de l'identité des auteurs de la substitution, ni de la mission de la patrouille humaine.</p><h3>Cadre du document maître</h3><p>RÉSERVÉ AU MJ</p><p><strong><span style=\"text-decoration:underline\">Objectif du document :</span></strong> conserver une vue d’ensemble de l’aventure tout en laissant chaque scène ouverte. Les deux journées décrites ne correspondent pas nécessairement à deux séances de jeu. La suite dépend du temps réellement pris par les PJ.</p><p style=\"border-left:3px solid #a9814d;padding-left:10px\"><strong>MJ — </strong>Textes encadrés. Ils peuvent être lus tels quels, raccourcis ou reformulés. Ne jamais décrire comme accompli un événement que les PJ auraient pu éviter.</p><p style=\"border-left:3px solid #a9814d;padding-left:10px\"><strong>MJ — </strong>Répliques des PNJ. Ce sont des phrases possibles, pas un dialogue à déclencher en entier. Un péon qui est mort, blessé ou absent ne doit pas parler depuis le camp.</p><p style=\"border-left:3px solid #a9814d;padding-left:10px\"><strong>MJ — </strong>Conséquences. À chaque clôture de scène, observer les personnes, le matériel, les informations et le temps. Le compteur du document maître rend la perte de temps mesurable.</p><p>Les scènes sont des situations et des points de bifurcation, non une suite d’événements obligatoires. À chaque modification, préciser ce qui a été décidé, proposé, à vérifier, ou établi en jeu. L’état du convoi et le retard relient les scènes sans forcer les choix.</p><table style=\"width:100%;border-collapse:collapse\"><thead><tr><th><p>Marqueur</p></th><th><p>Sens</p></th></tr></thead><tbody><tr><td><p>[ACQUIS]</p></td><td><p>Retenu dans les échanges ; conserver jusqu’à décision contraire.</p></td></tr><tr><td><p>[PROPOSITION]</p></td><td><p>Mécanique ou détail de mise en scène à éprouver et ajuster.</p></td></tr><tr><td><p>[À DÉFINIR]</p></td><td><p>Scène ou règle volontairement incomplète.</p></td></tr><tr><td><p>[À VÉRIFIER]</p></td><td><p>Géographie, horaire, canon Warcraft ou formulation mécanique à contrôler.</p></td></tr><tr><td><p>[ÉTABLI EN JEU]</p></td><td><p>Résultat des actes réels des joueurs ; prime sur la préparation.</p></td></tr></tbody></table><h3>Portée du module jouable</h3><p>[ACQUIS / ADAPTATION WARBOUND] Ce module relie l’embuscade Kolkar, l’arrêt à Roche-Sèche, la ruée des animaux et la décision de bivouac. Il prend environ 10 à 15 minutes de jeu hors enquête volontaire : peu de jets, mais des effets visibles sur le lendemain. Il ne remplace ni les scènes précédentes ni la procédure quotidienne de progression COF2.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire interactif} \_ · \_ @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Pk7bkEGylXFabBDu]{Chronologie indicative}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.nzbiDQbliZ1X1wJV.JournalEntryPage.ZojXMuDDgUpTJ9EI]{À jouer — l’affectation de Gornek} \_ · \_ @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table} \_ · \_ @UUID[JournalEntry.1w5SomDLshDAWOoC.JournalEntryPage.MXJysq678UIyw76D]{Points ouverts, sans réponses inventées}</p>"
