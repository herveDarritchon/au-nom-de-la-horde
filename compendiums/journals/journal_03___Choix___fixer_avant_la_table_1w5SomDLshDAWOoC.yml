    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Document maître évolutif — v0.2 (5 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><p>Les points ci-dessous ne sont pas des omissions involontaires. Ils doivent être décidés par le MJ ou laissés ouverts à l’improvisation explicite.</p><p style=\"margin-left:1em\">• RÉALISÉ EN v0.2 — Module de voyage et de bivouac ajouté (§ 4 bis) ; restent à tester les seuils, les heures de trajet et les variantes liées aux décisions des PJ.</p>\n<p style=\"margin-left:1em\">• PRIORITÉ 2 — Concevoir la patrouille de Tiragarde comme une situation ouverte, influencée par les décisions du jour 1.</p>\n<p style=\"margin-left:1em\">• PRIORITÉ 3 — Calibrer géographie, distance et horaires du trajet ; vérifier cohérence de la halte et de la patrouille.</p>\n<p style=\"margin-left:1em\">• ACTUALISÉ EN v3 — Objectifs et conditions de repli Kolkar, « Coup de serpe » et jauge kodo à quatre points sont documentés ; restent à valider les profils COF2, DD proposés, paliers de panique et coûts d’action. Voir @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Kolkar} et @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{kodo}. Pour Roche-Sèche et la ruée, conserver les points non tranchés.</p>\n<p style=\"margin-left:1em\">• PRIORITÉ 5 — Rattacher la fiche MJ d’arrivée à Tranchecolline et prévoir les variantes selon l’état du convoi et les informations recueillies.</p>\n<p style=\"margin-left:1em\">• PRIORITÉ 6 — Préparer aides de jeu Foundry : table de retard, suivi des chariots, battle maps et fiches de PNJ si nécessaires.</p><h3>Éléments non figés dans les deux sources</h3><ul><li>Composition exacte des péons, noms des responsables, inventaire et état des attelages au départ.</li><li>Kolkar : conditions de fuite [ACQUIS] désormais détaillées ; restent ouverts les profils COF2/Warbound, les DD encore proposés, les coûts d’action non validés et les effets précis de la jauge 0–4 du kodo.</li><li>Mâche-Roc : contenu réel et substitution, méthode, auteur, indices disponibles, réactions à la réception.</li><li>Ruée : séquençage, déclencheurs précis et conséquences mécaniques à caler.</li><li>Halte : distances, horaire d’arrivée et coucher du soleil, position sur carte Classic, gardien éventuel.</li><li>Tiragarde : effectif, mission, ordres, raisons de sa présence, attitude initiale et diplomatie.</li><li>Tranchecolline : détailler les trois accueils à partir d’une fiche source non fournie.</li><li>Ne pas relier d’office la mine, la ruée et la patrouille à une conspiration unique.</li></ul><p>1. Échanges de préparation du 5 novembre 2026 : deux convois, retard, nuit, bivouac et patrouille.</p>\n<p>2. « Warbound — Rôles et progression du voyage » : responsabilités et test quotidien collectif.</p>\n<p>3. « Au Nom de la Horde — Saison 1 », charte narrative v1.0 (14/10/2026) : scènes ouvertes, canon et adaptation.</p>\n<p>4. Laurent Bernasconi, Chroniques Oubliées Fantasy 2, BBE, 2024, p. 221–222 et 232–236 : récupération, marche forcée, voyage et bivouac.</p>\n<p><small>Contrainte de création : n’attribuer ni le vol de la mine, ni la ruée, ni la patrouille de Tiragarde à une conspiration unique sans l’avoir établi. L’enquête récompense la curiosité mais n’est jamais une condition d’accès à l’étape suivante. La chronologie ci-dessus est un outil de MJ, non une obligation imposée aux joueurs.</small></p>\n<p><strong>Ajout v3 :</strong> @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.XvmWhkg6jMaXiwa4]{Manœuvre de pillage} · @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.LOcdmBycO3NqJCkw]{Action d’apaisement non validée} · @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan concret du raid}.</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.QFLNsZhnyoIjFyT6.JournalEntryPage.YPfjrbEMuFNSWRAJ]{Objectifs, retrait et initiative} \_ · \_ @UUID[JournalEntry.C0nayaX26AjnMFqj.JournalEntryPage.c37Mg5eMeoP52oNB]{Jauge, déclencheurs et statut} \_ · \_ @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ — faits établis en jeu} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.gQ9DSemaiBWIjW0r.JournalEntryPage.M3exRvSKspw29FSl]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.MsoGRC7psQf0kvNd.JournalEntryPage.rQLBJ5TIhx8qRgK8]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.mKI7t7xC0WHoCxjY.JournalEntryPage.XzZax3Ebhu42fEJy]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.McGRaABF1Kc2N3iz.JournalEntryPage.lUmqFUpJHrpuIf2R]{Situation ouverte}</p>"
