    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>La prendre au sérieux, lui
        donner une responsabilité, l'entraîner sans la flatter.</p>

        <h2>La perdre / devenir son adversaire</h2><p>La mépriser, la
        ridiculiser ou encourager ses prises de risque uniquement pour le
        spectacle.</p>

        <h2>Liens personnels possibles</h2>

        <h3>Le modèle</h3><p>Korga choisit un PJ comme modèle et copie ses
        expressions, sa manière de tenir son arme et surtout ses
        comportements.</p><h3>Le mauvais exemple</h3><p>Si son modèle valorise
        toujours la prise de risque, Korga prend de plus en plus de
        risques.</p><h2>S'il devient un allié</h2><p>Peut devenir une petite
        sœur symbolique, une admiratrice utile et une future
        combattante.</p><h2>S'il devient hostile</h2><p>Si elle se sent
        méprisée, elle devient une rivale qui cherche à prouver que son ancien
        modèle n'est pas exceptionnel.</p>
