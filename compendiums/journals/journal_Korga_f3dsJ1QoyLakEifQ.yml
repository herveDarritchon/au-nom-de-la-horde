        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Elle reproduit maladroitement une
        technique vue chez un PJ et refuse d'admettre qu'elle ne la maîtrise
        pas.</p>

        <h2>Évolution hors champ</h2><p>Elle peut se blesser hors champ en
        imitant un PJ ou, au contraire, devenir plus disciplinée si celui-ci lui
        enseigne la maîtrise.</p>

