        <h1>Korga</h1>

        <blockquote><p><strong>[ADAPTATION WARBAND]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Elle rend visibles les conséquences de
        l'exemple donné par les PJ aux jeunes recrues.</p>

        <h2>Présence</h2><p>Jeune recrue énergique avec arme d'entraînement et
        cicatrices qu'elle compte comme des trophées.</p>

        <h2>Voix et répliques</h2><ul><li>« Celle-là ? Méritée. »</li><li>« Tu
        ferais quoi, toi ? »</li></ul>

        <h2>Veut</h2><p>Être reconnue par Gornek.</p>

        <h2>Craint</h2><ul><li>être oubliée</li><li>rester ordinaire</li></ul>
