        <h2>17. Références et limites de la version</h2>

        <h3>17.1. Règles de référence COF2</h3>

        <p><strong>Laurent Bernasconi</strong>, <em>Chroniques Oubliées Fantasy,
        deuxième édition</em>, <strong>Black Book Éditions, 2024</strong>, PDF
        fourni dans le projet. Passages utilisés :</p>

        <ul>

        <li><strong>p. 39–42</strong> : progression, coûts en PC, niveaux
        minimaux des rangs, voies et limites ;</li>

        <li><strong>p. 43</strong> : signification et progression du dé évolutif
        <code>d4°</code> ;</li>

        <li><strong>p. 98–99</strong> : forgesort et voie des élixirs, référence
        de puissance et de distinction entre artisanat et capacités magiques
        ;</li>

        <li><strong>p. 157</strong> : voie de prestige de l’enchanteur ;</li>

        <li><strong>p. 190</strong> : équipement courant, potion de soins
        <code>1d4° PV</code>, prix de 10 pa et limite par récupération rapide
        ;</li>

        <li><strong>p. 193</strong> : équipement de qualité, avantages, coût
        marchand de référence, difficulté et temps de fabrication ;</li>

        <li><strong>p. 242–249</strong> : objets magiques, leur fabrication,
        potions et risques d’utilisation.</li>

        </ul>

        <p><strong>Guide officiel du système COF2 pour Foundry VTT</strong>,
        version documentée de 2026, PDF fourni dans le projet : organisation des
        voies, capacités et équipements pour le suivi numérique. Aucun
        automatisme de craft n’en a été déduit.</p>

        <h3>17.2. Source d’inspiration du modèle libre</h3>

        <p><strong>KibblesTasty</strong>, <em>Kibbles’ Crafting Guide — Simply
        and Specific Crafting Rules for 5th Edition</em>,
        <strong>v1.0.7</strong>, PDF fourni. En particulier : introduction et
        moteur de crafting, matériaux interchangeables, récolte et recyclage,
        alchimie, forge et annexe sur la création de nouveaux objets (notamment
        p. 4–9, 24 et suivantes, 41 et suivantes, 133 et suivantes du document).
        <strong>Ce guide est conçu pour D&amp;D 5e et n’est pas une source des
        règles COF2</strong> ; ses recettes chiffrées, prix, tests de compétence
        et temps par tranches ne sont pas transplantés tels quels.</p>

        <h3>17.3. Références internes Warbound</h3>

        <ul>

        <li><strong>Échanges de conception du système d’artisanat</strong> :
        décisions de limiter à deux métiers, conserver les recettes
        découvrables, adopter cinq rangs, utiliser les PC, éviter la fabrication
        par listes fermées et maintenir le principe freeform.</li>

        <li><strong><code>Warbound_Artisanat_V0.2_Forge_Alchimie.md</code></strong>
        : premier état détaillé des capacités, propriétés, limites et cas de
        test, consolidé dans le présent document.</li>

        <li><strong><code>Au_Nom_de_la_Horde_S1_Charte_de_direction_narrative.md</code></strong>
        : cadre de Durotar, identité de la Horde et distinction entre contenu
        canonique, adaptation et pistes de campagne.</li>

        <li><strong><code>Warbound_Synthese_Regles_de_Voyage.md</code></strong>
        : contexte des déplacements, temps de voyage et haltes, à prendre en
        compte si les PJ travaillent durant une expédition.</li>

        </ul>

        <h3>17.4. Hiérarchie des règles</h3>

        <ol>

        <li><strong>Règles COF2</strong> pour les mécanismes fondamentaux,
        lorsqu’ils n’ont pas été explicitement modifiés par Warbound.</li>

        <li><strong>Décisions validées Warbound</strong> pour l’architecture des
        métiers.</li>

        <li><strong>Règles V0.2 en test</strong> pour les capacités de forge et
        d’alchimie et la procédure universelle proposée.</li>

        <li><strong>Arbitrages du MJ</strong> lorsque la situation n’est pas
        couverte, <strong>notés comme tels</strong> pour pouvoir être
        revus.</li>

        </ol>

        <p>Les <strong>noms, exemples de recettes et projets nouveaux</strong>
        inclus dans ce guide sont des <strong>créations Warbound</strong>. Ils
        ne doivent pas être présentés comme des recettes ou objets établis dans
        le canon de <em>World of Warcraft</em>.</p>

