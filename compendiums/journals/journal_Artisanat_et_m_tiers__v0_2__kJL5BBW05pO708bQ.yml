        <p><em>Page réservée au MJ — le contenu ci-dessous relève de la
        conception et des tests.</em></p>

        <h2>15. Vérification de l’équilibrage et protocole de test</h2>

        <p>Cette version est <strong>jouable à l’essai</strong>, mais plusieurs
        paramètres demandent une vérification. Le guide doit favoriser les
        retours de table plutôt que masquer les incertitudes.</p>

        <h3>15.1. Les questions à suivre</h3>

        <table>

        <thead>

        <tr>

        <th>Sujet</th>

        <th>Risque</th>

        <th>Ce qu’il faut observer</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>Coût en PC</strong></td>

        <td>L’artisan perd trop de possibilités de classe pour trop peu de
        scènes</td>

        <td>Fréquence réelle des occasions de métier, satisfaction du
        joueur</td>

        </tr>

        <tr>

        <td><strong>Forge rang 3</strong></td>

        <td>Le +1 permanent banalise la qualité d’équipement</td>

        <td>Rareté des matériaux, taux de succès et nombre d’objets
        produits</td>

        </tr>

        <tr>

        <td><strong>Reprise de forge</strong></td>

        <td>L’échec devient presque sans effet</td>

        <td>Coût du temps supplémentaire et conséquences en cas de second
        échec</td>

        </tr>

        <tr>

        <td><strong>Forge rang 4</strong></td>

        <td>Le dé bonus d’un outil est trop général</td>

        <td>Utilisations concrètes et domaines couverts</td>

        </tr>

        <tr>

        <td><strong>Forge rang 5</strong></td>

        <td>Deux propriétés semblent anecdotiques ou, au contraire, trop
        fortes</td>

        <td>Intérêt d’un chef-d’œuvre face au coût en PC et ressources</td>

        </tr>

        <tr>

        <td><strong>Alchimie rang 3</strong></td>

        <td>Trop de consommables accumulés</td>

        <td>Quantité de ressources, demande réelle, possibilités de vente</td>

        </tr>

        <tr>

        <td><strong>Alchimie rang 4</strong></td>

        <td>« Une propriété » reste trop floue</td>

        <td>Comparaison avec les capacités et consommables COF2</td>

        </tr>

        <tr>

        <td><strong>Alchimie rang 5</strong></td>

        <td>Une potion magistrale concurrence les soins de classe</td>

        <td>Fréquence d’accès, puissance du dé évolutif, contraintes</td>

        </tr>

        <tr>

        <td><strong>Économie</strong></td>

        <td>Fabrication/revente procure un revenu infini</td>

        <td>Coût effectif, disponibilité des ingrédients, prix de rachat</td>

        </tr>

        <tr>

        <td><strong>Rythme de table</strong></td>

        <td>Le craft détourne la séance de l’aventure</td>

        <td>Temps passé à régler les calculs et les procédures</td>

        </tr>

        </tbody>

        </table>

        <h3>15.2. Trois essais courts recommandés</h3>

        <p><strong>Essai A — Forge de rang 1–2 :</strong> un PJ doit fabriquer
        un équipement ordinaire, puis réparer un chariot abîmé avec des
        matériaux récupérés. Tester surtout la fluidité de la décision et le
        caractère utile du rang 2.</p>

        <p><strong>Essai B — Forge de rang 3 :</strong> choisir un objet de
        qualité, calculer difficulté, durée, ressources exceptionnelles et
        éventuelle reprise. Vérifier si la probabilité de succès justifie
        l’investissement.</p>

        <p><strong>Essai C — Alchimie de rang 1–3 :</strong> préparer une potion
        ordinaire, analyser un poison, puis fabriquer trois doses d’une même
        formule. Vérifier le temps de résolution et le stock de consommables
        obtenu.</p>

        <p>Les rangs 4–5 sont à tester ensuite avec des personnages simulés de
        niveau approprié, car la saison 1 n’y donnera normalement pas accès.</p>

        <h3>15.3. Décisions restant ouvertes [À TRANCHER]</h3>

        <ol>

        <li><strong>Économie :</strong> coûts exacts en matériaux des objets
        courants, potions et matériaux rares ; aucun taux universel n’est encore
        validé.</li>

        <li><strong>Équilibrage :</strong> confirmer ou réviser les propriétés
        techniques de forge, notamment <strong>Outil spécialisé</strong>.</li>

        <li><strong>Puissance magistrale :</strong> valider ou supprimer
        l’exemple d’effet <strong>2d4° PV</strong>, et fixer explicitement le
        traitement des dés évolutifs pour les nouvelles préparations fabriquées
        et utilisées par des PJ différents.</li>

        <li><strong>Changement de métier :</strong> procédure pour abandonner un
        métier ou remplacer une voie, et éventuelle récupération de PC.</li>

        <li><strong>Enchantement professionnel :</strong> articulation avec la
        voie de prestige et les règles de fabrication magique COF2.</li>

        <li><strong>Six voies restantes :</strong> ingénierie, travail du cuir,
        couture, enchantement, cuisine et secourisme ; aucune capacité chiffrée
        n’est validée à ce stade.</li>

        <li><strong>Équipement exotique :</strong> interactions futures avec les
        règles de matériaux et équipements exotiques de COF2.</li>

        <li><strong>Cas de règles spécifiques :</strong> traitements
        particuliers des poisons, explosifs, pièges, capacités offensives et
        effets surnaturels, non couverts par les deux voies présentées.</li>

        </ol>

        <p><strong>Ne pas considérer la résolution de ces points comme acquise
        par le simple fait qu’un MJ tranche ponctuellement pour une
        scène.</strong> Consigner les arbitrages si l’on souhaite les
        transformer plus tard en règles durables.</p>

