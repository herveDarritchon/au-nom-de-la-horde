        <h2>5. Matériaux, récolte, recyclage et économie</h2>

        <h3>5.1. Inventaire léger [VALIDÉ pour le principe]</h3>

        <p>On ne tient <strong>pas</strong> une liste obligatoire de cinquante
        minerais, racines, morceaux de peau ou essences pour chaque recette.
        Regrouper les composants ordinaires par <strong>familles
        fonctionnelles</strong>.</p>

        <table>

        <thead>

        <tr>

        <th>Famille</th>

        <th>Usages typiques</th>

        <th>Exemple de description fictionnelle</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Métaux et minerais</td>

        <td>Forge, armatures, pièces</td>

        <td>Fer usuel, métal récupéré d’une armure</td>

        </tr>

        <tr>

        <td>Bois, os et matériaux organiques</td>

        <td>Outils, manches, constructions</td>

        <td>Bois sec, corne, os travaillé</td>

        </tr>

        <tr>

        <td>Cuir, peaux, fibres et tissus</td>

        <td>Équipements, protections, couture</td>

        <td>Cuir souple, étoffe résistante</td>

        </tr>

        <tr>

        <td>Réactifs végétaux ou animaux</td>

        <td>Alchimie, soins, poisons</td>

        <td>Plante apaisante, venin de scorpide</td>

        </tr>

        <tr>

        <td>Pièces et mécanismes</td>

        <td>Ingénierie, réparations</td>

        <td>Ressorts, axes, rouages récupérés</td>

        </tr>

        <tr>

        <td>Essences ou matières magiques</td>

        <td>Enchantement, procédés surnaturels</td>

        <td>Substance chargée d’énergie élémentaire</td>

        </tr>

        </tbody>

        </table>

        <p>Deux ingrédients peuvent être substituables <strong>si leur fonction
        est compatible</strong>, pas simplement parce qu’ils valent autant
        d’argent. Ce principe vient notamment du <em>Kibbles’ Crafting
        Guide</em>, mais les effets numériques de ses composants D&amp;D 5e ne
        sont <strong>pas repris</strong>.</p>

        <h3>5.2. Une propriété descriptive n’est pas un bonus</h3>

        <p>Les matériaux inhabituels peuvent être qualifiés de « corrosif », «
        isolant », « inflammable », « résistant à la chaleur », « chargé
        d’énergie », « soporifique », etc. Ce sont des <strong>indices de ce
        qu’ils pourraient permettre</strong>. Leur découverte n’accorde pas
        instantanément +1, des DM supplémentaires ou une immunité.</p>

        <p>Le PJ doit proposer ce qu’il cherche à obtenir, et le MJ détermine si
        :</p>

        <ul>

        <li>la matière suffit pour un usage ordinaire ;</li>

        <li>une recette particulière est nécessaire ;</li>

        <li>il faut une technique de rang supérieur ;</li>

        <li>il s’agit d’un effet magique relevant d’un autre cadre.</li>

        </ul>

        <h3>5.3. Récolte et extraction</h3>

        <p><strong>Pas de voies de récolte dans cette version.</strong> La
        question porte sur les moyens et le contexte.</p>

        <p>Exemples :</p>

        <ul>

        <li>Récolter une plante commune connue sur un trajet habituel : souvent
        aucun jet.</li>

        <li>Chercher une plante spécifique sous la pression d’un orage : test
        approprié, temps engagé et conséquence annoncée.</li>

        <li>Prélever une poche de venin sans se blesser : outils adaptés et test
        lorsque l’opération est risquée.</li>

        <li>Extraire un minerai d’une paroi : pic, accès au gisement, temps et
        éventuellement soutien ; ce n’est pas une capacité « minage rang 2
        ».</li>

        <li>Récupérer les ferrures d’un chariot brisé : les ferrures existent
        réellement et leur état compte.</li>

        </ul>

        <p>La récolte est une <strong>action située dans le monde</strong>, pas
        un quota à optimiser. Le groupe doit pouvoir ignorer la plupart des
        ressources sans handicaper sa progression principale.</p>

        <h3>5.4. Récupération et recyclage</h3>

        <p><strong>Rang 2 de la forge [V0.2] :</strong> au maximum <strong>25 %
        de la valeur des matériaux ordinaires nécessaires à la
        fabrication</strong> peut être remplacée par des pièces récupérées
        <strong>réellement possédées et compatibles</strong>. Celles-ci sont
        consommées.</p>

        <p>Ce plafond n’autorise <strong>ni duplication d’objets ni création de
        métal gratuit</strong> : un morceau de récupération utilisé pour une
        fabrication n’existe plus dans la réserve. Les composants rares
        indispensables ne sont pas remplacés automatiquement.</p>

        <p><strong>Exemple :</strong> si une fabrication nécessite des matériaux
        ordinaires évalués à 8 pa, le forgeron de rang 2 peut, avec suffisamment
        de pièces compatibles, remplacer au plus <strong>2 pa</strong> de
        matériaux ordinaires par ces pièces. Il doit encore fournir l’équivalent
        des <strong>6 pa</strong> restants et les éventuels matériaux
        particuliers.</p>

        <p><strong>Important :</strong> ce plafond de 25 % est un avantage
        professionnel propre à la V0.2 de la forge. Il ne veut pas dire qu’un
        artisan ne peut jamais fondre ou recycler davantage de métal dans le
        monde : de tels travaux peuvent être traités séparément par le MJ.</p>

        <h3>5.5. Valeur marchande et coût de fabrication</h3>

        <p><strong>Ne pas confondre :</strong></p>

        <ol>

        <li>le <strong>prix public</strong> d’un objet vendu par un marchand
        ;</li>

        <li>la <strong>valeur des matériaux</strong> réellement nécessaires
        ;</li>

        <li>le <strong>temps de travail</strong> ;</li>

        <li>le <strong>prix de rachat</strong> qu’un marchand accepterait de
        payer.</li>

        </ol>

        <p><strong>[COF2]</strong> Le prix indicatif d’un objet de qualité est
        <strong>2 × prix ordinaire + 100 pa</strong>. C’est une <strong>valeur
        de référence</strong>, pas le coût en matières premières imposé à chaque
        artisan.</p>

        <p><strong>[COF2]</strong> La potion de soins ordinaire 1d4° PV a un
        prix marchand de référence de <strong>10 pa</strong>.</p>

        <p><strong>[À TRANCHER]</strong> Aucun barème universel « fabriquer
        coûte 50 % du prix de vente » n’est validé. Une proposition préliminaire
        de <strong>5 pa de ressources pour une potion de 10 pa</strong> a été
        évoquée comme <strong>hypothèse de playtest</strong>, non comme règle de
        l’économie Warbound. Elle ne doit pas s’étendre automatiquement aux
        armes, objets rares et objets magiques.</p>

        <p><strong>Pratique recommandée [MJ] :</strong> avant la fabrication,
        annoncer un coût approximatif et les éléments spéciaux. Ne fixer un prix
        exact que si la dépense compte dans la scène. Éviter les cycles d’achat,
        fabrication et revente garantissant un profit mathématique infini.</p>

        <hr>
