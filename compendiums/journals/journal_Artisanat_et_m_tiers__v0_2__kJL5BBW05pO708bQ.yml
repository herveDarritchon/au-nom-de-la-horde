        <h2>4. Tests, difficultés et conséquences</h2>

        <h3>4.1. Quand lance-t-on les dés ?</h3>

        <p><strong>Pas de test</strong> si les trois conditions suivantes sont
        réunies :</p>

        <ol>

        <li>Le PJ maîtrise l’opération.</li>

        <li>Il dispose des moyens et du temps appropriés.</li>

        <li>Le résultat ne présente pas de véritable incertitude ou d’enjeu
        particulier.</li>

        </ol>

        <p><strong>Test</strong> si un facteur change : matériau inconnu,
        équipement incomplet, échéance serrée, danger, tentative de qualité
        exceptionnelle, méthode expérimentale, etc.</p>

        <p><strong>Un test de fabrication doit pouvoir changer la
        situation.</strong> Si un échec n’entraînerait que « tu recommences »
        sans coût ni conséquence, mieux vaut souvent résoudre la scène sans
        lancer les dés.</p>

        <h3>4.2. Calcul du test [V0.2]</h3>

        <blockquote>

        <p><strong>Test professionnel = 1d20 + modificateur de caractéristique
        appropriée + (rang de métier + 2)</strong>.</p>

        </blockquote>

        <p><strong>Le bonus rang + 2</strong> s’applique <strong>uniquement aux
        tests relevant directement du métier possédé</strong>. Il n’existe pas
        de bonus de profession sans rang de voie.</p>

        <p>Caractéristique selon la tâche, jamais automatiquement identique pour
        l’ensemble du métier :</p>

        <ul>

        <li><strong>FOR (Forge)</strong> : façonner ou travailler physiquement
        une pièce métallique.</li>

        <li><strong>INT (Forge)</strong> : analyser une technique ou un
        assemblage métallique.</li>

        <li><strong>INT (Alchimie)</strong> : interpréter, doser, stabiliser ou
        concevoir une préparation.</li>

        <li><strong>PER (Alchimie)</strong> : observer les signes sensoriels
        d’une réaction, lorsque cela est véritablement pertinent.</li>

        </ul>

        <p><strong>Non-cumul [V0.2] :</strong> deux bonus représentant
        <em>exactement la même expertise</em> ne sont pas additionnés ; on
        retient le meilleur. Ne pas supprimer pour autant des bonus ayant un
        autre objet et autorisés par COF2.</p>

        <h3>4.3. Difficultés de référence</h3>

        <table>

        <thead>

        <tr>

        <th style="text-align:right">Difficulté</th>

        <th>Usage indicatif</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="text-align:right"><strong>10</strong></td>

        <td>Opération simple mais effectuée avec une incertitude réelle</td>

        </tr>

        <tr>

        <td style="text-align:right"><strong>15</strong></td>

        <td>Travail délicat, matière inhabituelle, contrainte modérée</td>

        </tr>

        <tr>

        <td style="text-align:right"><strong>20</strong></td>

        <td>Opération très technique ou dangereuse</td>

        </tr>

        <tr>

        <td style="text-align:right"><strong>25</strong></td>

        <td>Conception exceptionnelle ou incertitude sévère</td>

        </tr>

        </tbody>

        </table>

        <p>Ces valeurs constituent un <strong>barème d’artisanat V0.2</strong>,
        non une affirmation selon laquelle COF2 imposerait précisément ces
        seuils à tous les métiers. Le MJ peut s’appuyer sur les difficultés
        générales de COF2 et ajuster à la situation.</p>

        <p>Pour les <strong>armes et armures de qualité</strong>, appliquer
        obligatoirement le <strong>+10 à la difficulté</strong> de COF2 sur la
        difficulté normale retenue (§7.1).</p>

        <h3>4.4. Résultat d’un échec</h3>

        <p>Avant de lancer, indiquer <strong>ce qui est en jeu</strong> : délai,
        perte partielle de matériaux, pièce incomplète, défaut ou complication.
        Le MJ peut notamment choisir :</p>

        <ul>

        <li><strong>Retard :</strong> il faut ajouter du temps avant un nouvel
        essai.</li>

        <li><strong>Matériaux consommés :</strong> tout ou partie d’un composant
        utilisé n’est plus récupérable.</li>

        <li><strong>Objet imparfait :</strong> il fonctionne mais n’obtient pas
        la propriété supérieure recherchée.</li>

        <li><strong>Blocage :</strong> la méthode choisie n’est pas viable dans
        les conditions présentes ; il faut changer d’approche.</li>

        <li><strong>Conséquence fictionnelle :</strong> fumée visible, outil
        endommagé, réaction incontrôlée, alerte donnée à une faction, etc., si
        la scène le justifie.</li>

        </ul>

        <p><strong>Ne pas détruire automatiquement tous les matériaux sur chaque
        échec banal.</strong> Ne pas offrir non plus des tentatives gratuites
        illimitées : chaque nouveau test doit correspondre à du travail, un
        changement de méthode ou une conséquence réellement prise en compte.</p>

        <p><strong>Échec critique :</strong> employer les règles COF2
        applicables aux tests et annoncer une conséquence proportionnée ; le
        rang 3 de forge prévoit une issue particulière pour la reprise, décrite
        au §8.4.</p>

        <h3>4.5. Assistance et collaboration [MJ]</h3>

        <p>Un autre PJ peut aider <strong>s’il consacre réellement le temps et
        possède un apport plausible</strong> : tenir la pièce, alimenter le feu,
        chercher une plante, faire un travail complémentaire. Le fait de
        prononcer « j’aide » ne donne pas automatiquement un bonus numérique.
        Utiliser, si nécessaire, les règles de collaboration et de tests
        collectifs de COF2 applicables à la situation.</p>

        <p>Un forgeron et un ingénieur peuvent contribuer au même projet, chacun
        sur la partie correspondant à son métier. <strong>Le PJ principal ne
        s’approprie pas les rangs du second</strong> ; l’entraide permet de
        répartir les tâches, pas de cumuler toutes les capacités sur une
        fiche.</p>

