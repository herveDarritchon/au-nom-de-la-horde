  - sort: 1200000
    name: 11 — Exemples de forge et d’analyse
    type: text
    _id: iqZuRCxNPgvYOJD0
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>11. Exemples détaillés de résolution</h2>

        <p>Les exemples ci-dessous montrent <strong>la manière dont le MJ
        applique les règles</strong>, et distinguent les chiffres fixés par COF2
        de ceux choisis pour l’exemple.</p>

        <h3>Exemple 1 — Une épée ordinaire, sans recette individuelle</h3>

        <p><strong>Situation :</strong> un PJ Forge rang 1 demande à fabriquer
        une épée en fer pour un compagnon. La forge est accessible et les
        matériaux ordinaires sont disponibles.</p>

        <ol>

        <li><strong>Intention :</strong> épée ordinaire correspondant à un
        modèle connu.</li>

        <li><strong>Métier :</strong> forge, rang 1 suffisant.</li>

        <li><strong>Recette :</strong> pas de recette individuelle à
        trouver.</li>

        <li><strong>Moyens :</strong> métal, forge, outils, temps.</li>

        <li><strong>Incertitude :</strong> aucune si les conditions sont
        normales.</li>

        <li><strong>Résultat :</strong> l’épée possède les caractéristiques
        <strong>normales</strong> de l’arme COF2 correspondante.</li>

        </ol>

        <p><strong>Ce que le MJ n’ajoute pas :</strong> une recette d’« épée en
        fer » comme capacité, un jet automatique toutes les deux heures, un
        bonus de DM parce que le joueur a fait une belle description.</p>

        <h3>Exemple 2 — Une réparation urgente sur la route</h3>

        <p><strong>Situation :</strong> une ferrure est abîmée. Le groupe doit
        repartir rapidement. Un PJ Forge rang 2 possède quelques outils
        portatifs et des morceaux de métal compatibles.</p>

        <p>Le MJ estime qu’une réparation maîtrisée prendrait normalement
        <strong>2 heures</strong>. Grâce au rang 2, elle prend <strong>1
        heure</strong>.</p>

        <ul>

        <li>Si le travail reste réalisable avec le matériel disponible, il peut
        réussir sans jet.</li>

        <li>Si l’urgence, la chaleur ou l’improvisation rendent la réparation
        incertaine, le MJ demande un test, par exemple <strong>FOR (Forge)
        difficulté 15</strong>, en annonçant le risque d’une réparation fragile
        ou d’un retard.</li>

        <li>Si une pièce essentielle manque complètement, la capacité n’invente
        pas le métal nécessaire.</li>

        </ul>

        <p><strong>Valeur de jeu :</strong> le métier offre une autre solution
        que « abandonner le chariot ».</p>

        <h3>Exemple 3 — Fabriquer une arme de qualité : calcul complet</h3>

        <p><strong>Situation :</strong> une PJ Forge rang 3, <strong>FOR
        +3</strong>, veut produire une épée de qualité conférant <strong>+1 à
        l’attaque</strong>.</p>

        <p>Pour l’illustration, le MJ estime le travail ordinaire à <strong>4
        heures</strong> et sa difficulté de base à <strong>10</strong>.</p>

        <p><strong>Calcul :</strong></p>

        <ul>

        <li><strong>Difficulté de qualité :</strong> 10 + 10 (COF2) =
        <strong>20</strong>.</li>

        <li><strong>Durée de qualité :</strong> 4 h × 3 (COF2) = <strong>12
        heures</strong>.</li>

        <li><strong>Bonus au test :</strong> FOR +3 + (rang 3 + 2) =
        <strong>+8</strong>.</li>

        <li><strong>Réussite :</strong> un résultat naturel de <strong>12 ou
        davantage</strong> au d20 permet d’atteindre 20 ; cela représente
        <strong>9 résultats sur 20, soit 45 %</strong>, en dehors des éventuels
        traitements particuliers des critiques.</li>

        <li><strong>Reprise [V0.2] :</strong> si le test final échoue, ajouter
        <strong>6 heures</strong> (50 % de 12 h), et refaire <strong>une seule
        fois</strong> le test, sans nouveaux matériaux.</li>

        <li><strong>Issue :</strong> si les deux tests échouent normalement,
        l’épée reste une épée <strong>ordinaire</strong> ; les matériaux
        exceptionnels de la tentative ont été dépensés.</li>

        </ul>

        <p><strong>Repère d’équilibrage :</strong> avec deux tentatives
        indépendantes à <strong>45 %</strong> chacune, la probabilité d’obtenir
        au moins une réussite ordinaire serait de <strong>1 − (0,55 × 0,55) =
        69,75 %</strong>, avant particularités des échecs critiques. Ce calcul
        est <strong>un exemple</strong>, pas une nouvelle règle.</p>

        <p><strong>À ne pas confondre avec le prix :</strong> une épée longue à
        <strong>6 pa</strong> vaudrait <strong>112 pa</strong> en qualité
        supérieure selon la formule marchande COF2 ; cela <strong>ne signifie
        pas</strong> que la PJ paie automatiquement 112 pa de matières
        premières.</p>

        <h3>Exemple 4 — Modifier une arme ne lui confère pas une magie
        gratuite</h3>

        <p><strong>Situation :</strong> un PJ Forge rang 2 veut recouvrir une
        lame d’argent « pour qu’elle soit magique contre toutes les créatures
        surnaturelles ».</p>

        <p>Le MJ distingue deux demandes :</p>

        <ul>

        <li><strong>Réaliser un traitement de surface ou une lame argentée
        :</strong> adaptation de forge plausible si les moyens existent.</li>

        <li><strong>Obtenir un effet particulier contre une créature :</strong>
        à vérifier dans les règles propres à cette créature, à l’argent ou à
        l’équipement magique ; <strong>pas d’effet supplémentaire
        automatique</strong> parce que le métal a changé.</li>

        </ul>

        <p>Le joueur peut obtenir un résultat matériel réel sans que le MJ
        invente une immunité contournée ou un bonus de DM.</p>

        <h3>Exemple 5 — Une propriété technique au rang 4</h3>

        <p><strong>Situation :</strong> un PJ Forge rang 4 conçoit un appareil
        de levage pour récupérer une charrette dans un ravin. Il choisit la
        propriété <strong>Outil spécialisé</strong>, dédiée à l’emploi de cet
        appareil pour soulever et maintenir des charges dans des conditions
        déterminées.</p>

        <p>Le MJ valide : « Donne <strong>un dé bonus</strong> aux tests hors
        combat visant à utiliser <strong>cet appareil précis</strong> pour
        soulever ou stabiliser une charge lourde ». Il refuse la formulation «
        dé bonus à tous les tests de Force ».</p>

        <p>Une fois l’outil construit, son effet est écrit sur sa fiche. Aucun
        bonus aux attaques, aux DM ou à la DEF.</p>

        <h3>Exemple 6 — Analyser un ingrédient alchimique</h3>

        <p><strong>Situation :</strong> un PJ Alchimie rang 1 trouve une sève
        inconnue. <strong>INT +2</strong>, rang 1 : bonus professionnel
        <strong>+3</strong>, total <strong>+5</strong>.</p>

        <p>Il l’étudie <strong>10 minutes</strong>. Le MJ demande <strong>INT
        (Alchimie) difficulté 15</strong> : le d20 doit afficher <strong>10 ou
        plus</strong>. Une réussite révèle une <strong>propriété
        principale</strong>, par exemple irritante ; cela ne révèle ni toutes
        les recettes possibles ni sa toxicité exacte à chaque dose.</p>

        <p>En cas d’échec, le MJ peut dire que l’analyse n’est pas concluante et
        qu’un meilleur laboratoire ou un échantillon supplémentaire est
        nécessaire. Il ne doit pas inventer un effet létal sur simple échec si
        aucun risque de ce type n’avait été établi.</p>
