  - sort: 1400000
    name: 13 — Questions fréquentes
    type: text
    _id: fdIXC239S6Atatmi
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>12. Arbitrages du MJ et questions fréquentes</h2>

        <h3>12.1. « Puis-je fabriquer n’importe quoi puisque je suis rang 1 ?
        »</h3>

        <p><strong>Non.</strong> Le rang 1 couvre les <strong>objets
        ordinaires</strong> relevant du métier. L’absence de liste fermée ne
        supprime ni les limites physiques, ni les installations, ni les
        difficultés inhabituelles, ni les domaines des autres métiers.</p>

        <h3>12.2. « Une épée à deux mains demande-t-elle un rang supérieur à une
        dague ? »</h3>

        <p><strong>Pas par principe.</strong> Plus de matière et de temps ne
        signifie pas toujours une nouvelle capacité. Une arme très particulière
        peut en revanche demander un savoir spécialisé.</p>

        <h3>12.3. « Une recette rare permet-elle de contourner le rang ? »</h3>

        <p><strong>Non, pas automatiquement.</strong> Elle fournit une méthode.
        Le rang requis, les matériaux et les outils restent pertinents. Un
        apprentissage auprès d’un artisan peut permettre de réaliser une
        opération ponctuelle sous sa conduite, sans octroyer sa capacité au
        PJ.</p>

        <h3>12.4. « Puis-je avoir deux métiers et toutes les récoltes ? »</h3>

        <p><strong>Oui pour les savoir-faire de récolte</strong>, dans la mesure
        où le personnage les apprend et possède le matériel ; ils n’ont pas de
        voie propre en V0.2. <strong>Non</strong> pour un troisième métier parmi
        les huit voies.</p>

        <h3>12.5. « L’artisan peut-il vendre toutes ses fabrications ? »</h3>

        <p><strong>Oui si un acheteur existe</strong>, mais il n’existe pas de
        vente automatique au prix public, ni de prix d’achat des matières fixé
        universellement. Le MJ tient compte de la demande locale, du temps, des
        installations et du risque. La campagne ne devient pas une simulation
        économique indépendante.</p>

        <h3>12.6. « Les outils spécialisés rendent-ils inutiles les autres
        personnages ? »</h3>

        <p>C’est un risque à surveiller. La propriété de rang 4 doit toujours
        viser <strong>une tâche étroite</strong>. Un outil qui donne un dé bonus
        à presque toutes les actions d’exploration ne respecte pas la V0.2.</p>

        <h3>12.7. « Puis-je faire une potion d’invisibilité, un explosif ou une
        arme enflammée ? »</h3>

        <p><strong>Pas par simple liberté narrative du craft.</strong> Vérifier
        d’abord si l’effet existe dans COF2 et de quel système il relève : sort,
        capacité de classe, objet magique, piège ou autre. Une <strong>recette
        particulière</strong> et un <strong>mécanisme encadré</strong> peuvent
        permettre d’étudier la demande ultérieurement ; ce n’est pas un droit
        accordé par la voie générale.</p>

        <h3>12.8. « Peut-on cumuler qualité, propriété technique et magie ?
        »</h3>

        <p>La qualité COF2 et une propriété <strong>technique non
        magique</strong> peuvent coexister si elles ont chacune été obtenues et
        sont compatibles. <strong>Leur coexistence n’ouvre pas des bonus
        chiffrés implicites</strong>. La <strong>magie</strong>, si elle
        intervient, suit ses propres règles de fabrication et de cumul COF2.</p>

        <h3>12.9. « Un rang 5 peut-il fabriquer dix chefs-d’œuvre ? »</h3>

        <p>Il peut <strong>entreprendre</strong> des projets si la fiction, les
        ingrédients, l’atelier et le temps le permettent. Le rang 5 n’accorde
        pas des objets gratuits ; chaque projet exige ses propres jalons et
        ressources. Pour une formule magistrale, la V0.2 prévoit une
        <strong>préparation unique par projet</strong> et non une production
        industrielle. La disponibilité et l’éventuelle répétition des composants
        rares relèvent de la campagne.</p>

        <h3>12.10. « Qu’en est-il des créatures et ressources de Durotar ?
        »</h3>

        <p>Ne pas attribuer mécaniquement une propriété à une partie de créature
        sur la seule base de son nom. Un venin de scorpide peut être intéressant
        pour une recherche contre un poison ; cela ne définit
        <strong>pas</strong> automatiquement un antidote universel, une dose de
        poison offensif et une nouvelle potion de soins.</p>

        <h3>12.11. « Que faire si l’effet demandé n’est prévu nulle part ?
        »</h3>

        <p>Utiliser la <strong>grille d’arbitrage</strong> :</p>

        <ol>

        <li>L’effet est-il <strong>purement narratif ou matériel</strong>, ou
        donne-t-il un avantage mécanique ?</li>

        <li>Existe-t-il déjà <strong>une capacité ou un objet COF2</strong>
        accomplissant le même effet ?</li>

        <li>Son usage est-il <strong>permanent, réutilisable ou
        consommable</strong> ?</li>

        <li>Un rang <strong>4 ou 5</strong> est-il nécessaire ? Une
        <strong>recette</strong> existe-t-elle ?</li>

        <li>Quel <strong>coût réel</strong> en temps, ressources et risques le
        justifie ?</li>

        <li>Le MJ est-il prêt à <strong>réutiliser exactement cette même
        règle</strong> lors de la prochaine fabrication ?</li>

        </ol>

        <p>Si l’effet modifie directement le combat et n’a pas de référence
        d’équilibre claire, <strong>différer sa validation</strong> plutôt que
        d’improviser un gros bonus définitif.</p>

        <hr>
