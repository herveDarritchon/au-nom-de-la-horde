      content: >-
        <h2>10. Créations exceptionnelles et projets à jalons</h2>

        <h3>10.1. Pourquoi des jalons ?</h3>

        <p>Un projet à jalons sert pour une création qui mérite
        <strong>plusieurs choix ou étapes significatives</strong>. Il ne
        transforme pas chaque journée de forge en jet obligatoire.</p>

        <p>La structure s’inspire de l’idée de projets et de progrès fictionnels
        présente dans certains jeux de rôle, mais <strong>les jalons décrits ici
        sont une règle maison Warbound</strong>.</p>

        <h3>10.2. La fiche de projet</h3>

        <pre><code class="language-markdown">### Projet : [nom]

        - Artisan principal / rang :

        - Collaborateurs :

        - Objet / effet exact convenu :

        - Métier(s) mobilisé(s) :

        - Recette ou méthode :

        - Atelier et outils :

        - Matériaux ordinaires :

        - Matériaux rares :

        - Risque principal :

        - Jalons :
          - [ ] 1. [...]
          - [ ] 2. [...]
          - [ ] 3. [...]
        - Tests éventuels et conséquences en cas d'échec :

        - Résultat obtenu :

        </code></pre>

        <h3>10.3. Trois jalons <strong>significatifs</strong> au minimum pour un
        chef-d’œuvre ou une formule magistrale [V0.2]</h3>

        <p>Un jalon peut être :</p>

        <ul>

        <li>analyser un alliage inconnu ;</li>

        <li>obtenir l’accès à un atelier ou convaincre un maître ;</li>

        <li>acquérir une substance adaptée ;</li>

        <li>vérifier expérimentalement une propriété ;</li>

        <li>concevoir un assemblage ;</li>

        <li>exécuter une opération réellement délicate ;</li>

        <li>éprouver la création dans des conditions représentatives.</li>

        </ul>

        <p><strong>Ce qui ne constitue pas un bon jalon :</strong> « travailler
        deux heures », « travailler encore deux heures », « travailler deux
        heures de plus ».</p>

        <p>Le MJ précise quels jalons demandent <strong>un test</strong>,
        lesquels demandent seulement <strong>du temps</strong>, et lesquels sont
        de véritables <strong>situations d’aventure</strong>.</p>

        <h3>10.4. Exemple : un outil de mine remarquable</h3>

        <p><strong>But :</strong> fabriquer un outil capable de passer d’une
        configuration de levage à une configuration de maintien
        (<strong>Modulaire</strong>) et de résister aux efforts d’un chantier
        dangereux (<strong>Renforcé</strong>).</p>

        <p><strong>Pré requis :</strong> Forge rang 5, matière adaptée, atelier,
        accord sur les propriétés.</p>

        <p><strong>Jalons possibles :</strong></p>

        <ol>

        <li>Examiner les contraintes de la galerie et établir deux
        configurations compatibles.</li>

        <li>Se procurer ou fabriquer les pièces et les mécanismes
        indispensables.</li>

        <li>Assembler l’outil, puis vérifier son fonctionnement et sa
        résistance.</li>

        </ol>

        <p>Le travail d’étude peut bénéficier de l’aide d’un ingénieur ; ce
        dernier apporte ses propres connaissances, pas un transfert automatique
        de rang.</p>

        <p><strong>En cas d’échec :</strong> le MJ applique les risques fixés
        pour le jalon. <strong>Une reprise de jalon technique raté sans nouveaux
        matériaux</strong>, mais avec temps supplémentaire, est permise
        <strong>une seule fois</strong> grâce au rang 5 de forge.</p>

        <h3>10.5. Exemple : un antidote encore inconnu</h3>

        <p>Un alchimiste découvre un venin qu’il ne sait pas traiter. Au rang 2,
        il peut l’analyser ; <strong>il n’obtient pas automatiquement une
        recette de guérison</strong>. À partir des connaissances et ressources
        réelles, une recherche peut être entreprise.</p>

        <ul>

        <li>Comprendre la propriété nocive et rechercher un réactif susceptible
        de la contrer.</li>

        <li>Consulter un spécialiste, découvrir une formule ancienne ou mener
        une expérimentation appropriée.</li>

        <li>Préparer puis vérifier l’antidote dans des conditions sûres.</li>

        </ul>

        <p>Si la demande consiste seulement à <strong>retrouver une formule
        existante</strong>, un alchimiste moins avancé peut participer à ces
        scènes. Si elle consiste à <strong>inventer une formule
        nouvelle</strong>, le rang 4 est normalement la référence de la
        V0.2.</p>

        <hr>
