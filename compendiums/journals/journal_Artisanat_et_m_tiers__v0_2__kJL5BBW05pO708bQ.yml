      content: >-
        <h2>14. Outils de table et suivi sur Foundry VTT</h2>

        <p>La V0.2 ne requiert <strong>aucune macro, automatisation ou module
        Foundry supplémentaire</strong> pour être jouée. Le guide officiel du
        système COF2 pour Foundry v14 documente déjà les voies, capacités et
        équipements. On peut commencer par un simple <strong>journal de campagne
        et une fiche de personnage</strong>.</p>

        <h3>14.1. Ce que le joueur doit noter</h3>

        <pre><code class="language-markdown">#### Métiers du personnage

        - Métier 1 : Forge — rang 2

        - Métier 2 : Alchimie — rang 1


        #### Bonus professionnel

        - Forge : rang 2 + 2 = +4 (en plus de la caractéristique appropriée)

        - Alchimie : rang 1 + 2 = +3 (en plus de la caractéristique appropriée)


        #### Recettes connues

        - [Recette] — catégorie — effet — source — réalisable ?


        #### Ressources particulières

        - [Composant] — quantité si nécessaire — propriété — origine


        #### Projets en cours

        - [Projet] — jalons effectués — ressources engagées — reste à faire

        </code></pre>

        <p>Un suivi de ressources <strong>par lots narratifs</strong> suffit
        normalement ; quantifiez précisément uniquement les consommables, les
        composants coûteux ou ceux dont la quantité crée un véritable choix.</p>

        <h3>14.2. Ce que le MJ doit garder dans son journal</h3>

        <ul>

        <li>Liste des <strong>recettes effectivement introduites en jeu</strong>
        et de leurs effets validés.</li>

        <li>Accès aux <strong>ateliers</strong> et aux
        <strong>mentors</strong>.</li>

        <li>Réserve des <strong>composants rares</strong> mis en circulation et
        leur utilisation.</li>

        <li>Projets à jalons et conséquences éventuelles.</li>

        <li>Liste des <strong>arbitrages précédents</strong> afin de résoudre
        les situations semblables de manière cohérente.</li>

        </ul>

        <p><strong>Conseil :</strong> si une recette ou un objet maison revient
        plusieurs fois, rédiger sa fiche définitive. Si l’objet était ponctuel,
        une description courte suffit.</p>

        <hr>
