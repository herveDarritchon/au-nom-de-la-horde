  - sort: 1300000
    name: 12 — Exemples d’alchimie et de recettes
    type: text
    _id: 9YAXoS0Cbz8dVYtZ
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Exemples détaillés — suite</h2>

        <h3>Exemple 7 — Un antidote contre un venin de scorpide</h3>

        <p><strong>Situation :</strong> un personnage a été empoisonné par un
        scorpide. Un PJ Alchimie rang 2 souhaite élaborer un antidote.</p>

        <ol>

        <li>Il prélève ou étudie un échantillon du venin.</li>

        <li>L’analyse de rang 2 prend <strong>30 minutes</strong> et, si le
        poison n’est pas familier, appelle un test <strong>INT (Alchimie) de
        difficulté au moins 15</strong>.</li>

        <li>La réussite renseigne la <strong>propriété nocive</strong> et une
        piste d’antidote ; elle ne guérit personne.</li>

        <li>Le PJ cherche une formule existante, un mentor ou des ingrédients
        appropriés ; si la formule doit être réellement inventée, les capacités
        de rang supérieur peuvent devenir pertinentes.</li>

        <li>Une fois la recette et les moyens réunis, il prépare un
        <strong>antidote à effet précis</strong>, limité au venin concerné.</li>

        </ol>

        <p><strong>Enjeu de scénario :</strong> si le patient est en danger
        immédiat, les 30 minutes d’analyse sont une contrainte réelle ; d’autres
        PJ peuvent chercher simultanément une aide ou une solution
        différente.</p>

        <h3>Exemple 8 — Trois potions en un seul lot</h3>

        <p><strong>Situation :</strong> un PJ Alchimie rang 3 connaît une
        formule ordinaire, normalement réalisable en <strong>2 heures pour une
        dose</strong>, et dispose des ingrédients pour <strong>trois
        doses</strong>.</p>

        <ul>

        <li><strong>Sans rang 3 :</strong> repère de travail <strong>6
        heures</strong> si on traite successivement les doses.</li>

        <li><strong>Avec rang 3 :</strong> <strong>2 h + 1 h + 1 h = 4
        heures</strong>.</li>

        <li><strong>Matières consommées :</strong> exactement l’équivalent de
        <strong>trois doses</strong>, pas une.</li>

        <li><strong>Test :</strong> un seul test final <strong>si un jet est
        pertinent</strong>.</li>

        <li><strong>Échec :</strong> conséquence annoncée avant le jet, qui peut
        affecter la totalité du lot.</li>

        </ul>

        <p><strong>Limite :</strong> on ne produit pas trois potions magistrales
        grâce à cette capacité. L’utilisation des potions de soins reste limitée
        par COF2.</p>

        <h3>Exemple 9 — Une formule alchimique originale mais non magique</h3>

        <p><strong>Situation :</strong> une PJ Alchimie rang 4 veut créer une
        pâte pour masquer temporairement l’odeur d’un chargement de viande aux
        animaux pisteurs.</p>

        <p>Le MJ accepte <strong>une propriété utilitaire ciblée</strong> : «
        masque l’odeur de ce chargement pendant une période définie tant que la
        pâte tient ». Il convient du temps, du mode d’application et des
        réactifs.</p>

        <p>Le MJ <strong>ne promet pas</strong> de « rendre automatiquement
        toutes les créatures incapables de détecter le groupe » ni d’accorder un
        dé bonus général à tous les tests de Discrétion. Une créature peut
        encore repérer le chargement autrement.</p>

        <p>La formule peut être <strong>reproduite</strong> lorsque ses
        conditions et ingrédients sont réunis.</p>

        <h3>Exemple 10 — Formule magistrale de soins</h3>

        <p><strong>Situation :</strong> au rang 5, un alchimiste tente une
        préparation unique plus puissante qu’une potion ordinaire.</p>

        <ul>

        <li><strong>Projet :</strong> trois jalons significatifs minimum.</li>

        <li><strong>Ingrédients :</strong> réactifs usuels appropriés et au
        moins un élément rare.</li>

        <li><strong>Fabrication :</strong> pas de lot de trois doses.</li>

        <li><strong>Effet expérimental :</strong> <strong><code>2d4°
        PV</code></strong>, sous réserve de l’arbitrage explicite du MJ
        concernant la puissance et l’évolution du dé (§7.6).</li>

        <li><strong>Consommation :</strong> le plafond des potions de soins
        reste applicable.</li>

        </ul>

        <p><strong>Pourquoi encadrer ?</strong> Un objet consommable répétable
        peut concurrencer le rôle d’une capacité de soin ; ni les PC investis ni
        la rareté annoncée dans la fiction ne suffisent à eux seuls à en
        garantir l’équilibre.</p>

        <h3>Exemple 11 — Une recette découverte avant de pouvoir la
        réaliser</h3>

        <p><strong>Situation :</strong> un guerrier Forge rang 1 découvre un
        manuscrit décrivant un procédé métallurgique exceptionnel.</p>

        <p>Le MJ inscrit la recette dans son carnet. Le personnage peut
        l’étudier, la négocier ou la montrer à un maître, mais <strong>le
        document ne lui confère pas automatiquement le rang 4</strong> ni des
        matériaux impossibles à trouver.</p>

        <p><strong>Récompense réelle :</strong> le savoir découvert peut servir
        plus tard, déclencher une rencontre, faire gagner du temps de recherche
        ou constituer un objet d’échange.</p>

        <h3>Exemple 12 — Deux métiers sur un même objet</h3>

        <p><strong>Situation :</strong> la troupe veut fabriquer un piège
        combinant une armature métallique et un mécanisme sophistiqué.</p>

        <ul>

        <li>Le <strong>forgeron</strong> réalise les éléments métalliques dans
        les limites de sa voie.</li>

        <li>L’<strong>ingénieur</strong>, s’il est présent, traite la conception
        et l’assemblage mécanique.</li>

        <li>À défaut, le groupe peut chercher une recette, solliciter un PNJ
        compétent, réduire l’ambition ou faire une autre proposition.</li>

        </ul>

        <p>Le MJ n’autorise pas le forgeron à reproduire automatiquement toute
        l’ingénierie du monde au motif qu’il sait travailler le métal.</p>

        <hr>
