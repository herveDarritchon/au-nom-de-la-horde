    image: {}
    text:
      format: 1
      content: >-
        <h2>3. La procédure universelle de fabrication</h2>

        <h3>3.1. La boucle en six questions</h3>

        <p>Pour toute demande, le MJ procède dans cet ordre :</p>

        <ol>

        <li><strong>Intention :</strong> <em>Que souhaites-tu fabriquer ou
        transformer, et à quoi cela doit-il servir ?</em></li>

        <li><strong>Métier et maîtrise :</strong> <em>Est-ce réalisable dans ce
        métier ? Le rang du PJ suffit-il à la technique envisagée ?</em></li>

        <li><strong>Connaissance :</strong> <em>Est-ce un travail de routine,
        une recette spécialisée, une recette exceptionnelle ou une invention
        ?</em></li>

        <li><strong>Moyens :</strong> <em>Dispose-t-on d’un matériel, d’un
        atelier, du temps et des ressources adéquats ?</em></li>

        <li><strong>Incertitude :</strong> <em>Le résultat mérite-t-il un test ?
        Quelle est la difficulté, et que risque-t-on de perdre ?</em></li>

        <li><strong>Résultat :</strong> <em>Quel objet est produit ? Avec
        quelles propriétés exactes, quels coûts et quelles conséquences
        ?</em></li>

        </ol>

        <p>Une fabrication habituelle peut être résolue en trente secondes de
        conversation. Un chef-d’œuvre peut nécessiter un projet de plusieurs
        aventures.</p>

        <h3>3.2. Classer la demande avant de calculer</h3>

        <table>

        <thead>

        <tr>

        <th>Catégorie</th>

        <th>Caractéristiques</th>

        <th>Réponse du MJ</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>Geste simple</strong></td>

        <td>Entretien, tâche élémentaire, geste appris par historique</td>

        <td>Possible sans voie si cohérent ; souvent automatique</td>

        </tr>

        <tr>

        <td><strong>Fabrication ordinaire</strong></td>

        <td>Objet du métier et techniques familières</td>

        <td>Rang 1 en principe ; ressources et temps ; jet seulement s’il existe
        une incertitude</td>

        </tr>

        <tr>

        <td><strong>Adaptation</strong></td>

        <td>Réparation improvisée, récupération, substitution</td>

        <td>Rang 2 ou méthode connue ; ajuster contraintes et durée</td>

        </tr>

        <tr>

        <td><strong>Travail de qualité</strong></td>

        <td>Ouvrage supérieur au standard</td>

        <td>Rang 3 en forge V0.2 ; appliquer les exigences de COF2</td>

        </tr>

        <tr>

        <td><strong>Création originale</strong></td>

        <td>Propriété ou formule réellement nouvelle</td>

        <td>Rang 4, ou recette spécialisée fournissant explicitement la
        méthode</td>

        </tr>

        <tr>

        <td><strong>Chef-d’œuvre / magistrale</strong></td>

        <td>Création hors normes, combinaison ou puissance exceptionnelle</td>

        <td>Rang 5, conditions spécifiques et projet à jalons</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Le matériau ne définit pas le rang à lui seul.</strong> Il
        n’existe pas un rang « bronze », puis un rang « fer », puis un rang «
        argent ». La question est toujours la difficulté réelle de travailler ce
        matériau et d’obtenir l’effet demandé.</p>

        <h3>3.3. Les outils et l’atelier sont de vraies contraintes</h3>

        <p>Posséder une capacité ne permet pas de créer un objet à partir de
        rien. Une forge, un foyer, un marteau et une enclume servent à un
        travail des métaux. Des récipients, un dispositif de chauffe et de
        filtration peuvent être nécessaires à une préparation alchimique. Des
        opérations modestes peuvent être entreprises avec du matériel
        transportable ; d’autres exigent des installations permanentes.</p>

        <p>Trois situations typiques :</p>

        <ul>

        <li><strong>Atelier approprié :</strong> tous les moyens existent. La
        fabrication de routine est possible dans de bonnes conditions.</li>

        <li><strong>Atelier imparfait :</strong> la tentative peut être
        autorisée si elle reste plausible ; délai augmenté, test plus difficile
        ou qualité impossible selon le manque.</li>

        <li><strong>Absence d’un élément indispensable :</strong> la fabrication
        n’est pas réalisable tant qu’on ne trouve pas une solution. Un jet élevé
        ne crée pas une enclume ou un réactif absent.</li>

        </ul>

        <p>Ne demandez pas un jet juste pour vérifier qu’un personnage sait
        accomplir son métier chez lui.</p>

        <h3>3.4. Temps de travail [V0.2]</h3>

        <table>

        <thead>

        <tr>

        <th>Travail</th>

        <th>Repère de temps</th>

        <th>Difficulté de référence <strong>si</strong> un test est
        justifié</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Entretien ou petite réparation</td>

        <td>15 min à 1 h</td>

        <td>10</td>

        </tr>

        <tr>

        <td>Petit objet ou préparation ordinaire</td>

        <td>2 à 4 h</td>

        <td>10 à 15</td>

        </tr>

        <tr>

        <td>Ouvrage complexe ou préparation délicate</td>

        <td>1 à 3 jours</td>

        <td>15 à 20</td>

        </tr>

        <tr>

        <td>Recherche difficile, innovation</td>

        <td>Projet à jalons</td>

        <td>20 à 25 ou davantage</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Ces durées sont des repères Warbound</strong>, pas un
        catalogue exhaustif officiel. Ajustez-les à la taille, à la matière, aux
        quantités et à l’atelier. Une lourde armure n’est pas réalisée aussi
        vite qu’une dague sous prétexte qu’elles sont toutes deux « ordinaires
        ».</p>

        <p>Un projet peut être suspendu et repris si le procédé s’y prête
        (forge, construction). Une préparation instable peut exiger une
        opération ininterrompue (certaines formules alchimiques). Le MJ
        l’annonce avant le début du travail.</p>

        <p><strong>Pendant les voyages :</strong> utiliser les temps calmes ou
        le bivouac si l’espace et le matériel le permettent ; ne pas introduire
        de « deux heures de craft gratuites » qui annuleraient automatiquement
        les conséquences du voyage ou de la récupération. Vérifier la cohérence
        avec les règles de voyage et de repos de Warbound.</p>

        <hr>
