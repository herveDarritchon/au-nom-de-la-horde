      content: >-
        <h2>6. Recettes, recherches et transmission des savoirs</h2>

        <h3>6.1. À quoi sert une recette ?</h3>

        <p>Une recette est <strong>un ensemble de connaissances</strong> :
        formule, méthode de trempe, dispositif, séquence opératoire, traitement
        d’un réactif, secret d’assemblage, etc. C’est un <strong>objet
        d’exploration et de narration</strong> : elle peut être vendue, copiée,
        transmise, volée, discutée avec un maître, retrouvée dans un coffre ou
        reconstituée en étudiant un objet.</p>

        <p>Une recette n’est <strong>pas</strong> un rang de métier, n’accorde
        <strong>pas</strong> de PC et ne débloque <strong>pas</strong> toute une
        famille de créations.</p>

        <h3>6.2. Trois catégories</h3>

        <table>

        <thead>

        <tr>

        <th>Catégorie</th>

        <th>Accès</th>

        <th>Effet en jeu</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>Technique courante</strong></td>

        <td>Formation générale, pratique, mentor</td>

        <td>Les objets habituels du métier sont fabriqués sans recette nommée
        pour chaque variante</td>

        </tr>

        <tr>

        <td><strong>Recette spécialisée</strong></td>

        <td>Maître, livre, butin, échange, investigation, expérimentation</td>

        <td>Apporte une technique ou une formule particulière que l’on ne déduit
        pas simplement du savoir courant</td>

        </tr>

        <tr>

        <td><strong>Recette exceptionnelle</strong></td>

        <td>Secret, aventure, manuscrit rare, projet de recherche</td>

        <td>Fournit les conditions d’une création hors norme ; peut rester
        inutilisable tant que les prérequis manquent</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Exemples :</strong></p>

        <ul>

        <li>Forge : pas besoin de recette distincte pour chaque dague, épée
        courte ou épée à deux mains <strong>ordinaire</strong>.</li>

        <li>Forge : un traité sur la manière de travailler un alliage très
        inhabituel peut constituer une <strong>recette
        spécialisée</strong>.</li>

        <li>Alchimie : apprendre un <strong>antidote spécifique</strong> est une
        découverte utile, même si le PJ connaît déjà les méthodes générales de
        mélange.</li>

        <li>Alchimie : une formule exceptionnelle consignant une préparation
        rare peut être découverte bien avant le niveau requis pour la
        réaliser.</li>

        </ul>

        <h3>6.3. Ce que possède le PJ : recette, compréhension et maîtrise</h3>

        <p>Consigner trois informations distinctes :</p>

        <ol>

        <li><strong>La recette a-t-elle été trouvée ?</strong> (support matériel
        ou enseignement)</li>

        <li><strong>A-t-elle été comprise ou apprise ?</strong> (lecture,
        enseignement, étude)</li>

        <li><strong>Le PJ sait-il l’exécuter maintenant ?</strong> (rang,
        outils, réactifs, environnement)</li>

        </ol>

        <p>Cela évite une confusion courante : un personnage peut conserver
        précieusement une recette qu’il comprend partiellement, ou savoir quel
        effet il recherche sans disposer du matériel pour le produire.</p>

        <p><strong>[MJ]</strong> Si la recette est rédigée dans une langue
        inconnue, codée, incomplète ou liée à un procédé perdu, sa compréhension
        peut devenir une scène ou un projet. Mais ne mettez pas un verrou
        supplémentaire arbitraire sur toutes les recettes acquises.</p>

        <h3>6.4. Inventer une recette</h3>

        <p>La <strong>Forge rang 4</strong> peut développer une méthode
        produisant une propriété technique. L’<strong>Alchimie rang 4</strong>
        peut développer une formule reproductible à <strong>une propriété
        utilitaire</strong> ; le <strong>rang 5</strong> permet une association
        de propriétés ou une formule magistrale selon ses limites.</p>

        <p><strong>Procédure courte :</strong></p>

        <ol>

        <li>Le joueur énonce <strong>l’effet précis souhaité</strong>.</li>

        <li>Le MJ vérifie s’il existe un équivalent déjà défini dans COF2 et
        s’il n’empiète pas sur une capacité de classe.</li>

        <li>Le groupe identifie les connaissances, outils et ressources
        indispensables.</li>

        <li>Le MJ décide d’une expérience simple ou d’un projet à jalons.</li>

        <li>La recette obtenue est inscrite dans le carnet du personnage avec
        <strong>son effet exact et ses limites</strong>.</li>

        </ol>

        <p><strong>Important :</strong> « rang 4 = invention » ne veut
        <strong>pas</strong> dire « inventer une potion ayant n’importe quel
        effet que je décris ». Une formule d’invisibilité magique ou une arme
        infligeant des DM élémentaires relève potentiellement d’un autre cadre
        de règles.</p>

        <h3>6.5. Modèle de fiche de recette</h3>

        <pre><code class="language-markdown">#### Nom de la recette

        - Métier :

        - Catégorie : courante / spécialisée / exceptionnelle

        - Rang de référence :

        - Origine ou inventeur :

        - Effet recherché :

        - Effet mécanique exact :

        - Limites / durée / cible / conditions d'utilisation :

        - Ingrédients ordinaires :

        - Composant particulier (s'il existe) :

        - Outils / atelier :

        - Temps / difficulté si un jet est nécessaire :

        - Coût matériel convenu avec le MJ :

        - Qui possède ou maîtrise la recette ? :

        - Statut : connue / incomplète / comprise / réalisable

        </code></pre>

