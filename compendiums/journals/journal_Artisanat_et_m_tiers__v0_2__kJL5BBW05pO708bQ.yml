    text:
      format: 1
      content: >-
        <h2>9. Voie de l’alchimie — cinq rangs</h2>

        <p><strong>Voie professionnelle de Warbound — entièrement [V0.2], non
        officielle COF2.</strong></p>

        <p><strong>Domaine :</strong> préparations non magiques ou alchimiques
        adaptées (soins ordinaires, remèdes, analyses, huiles, antidotes,
        réactifs), puis innovations et formules magistrales.
        <strong>Caractéristique :</strong> INT principalement, PER pour
        certaines observations.</p>

        <blockquote>

        <p><strong>Attention à l’équilibrage :</strong> l’alchimie fabrique des
        <strong>consommables</strong>. Le rang 3 améliore la
        <strong>productivité</strong>, sans produire de doses gratuites ni
        modifier arbitrairement la puissance d’une potion.</p>

        </blockquote>

        <h3>9.1. Rang 1 — Art des préparations (1 PC)</h3>

        <p><strong>Effets :</strong></p>

        <ul>

        <li>Bonus professionnel <strong>rang + 2</strong> aux tests
        d’alchimie.</li>

        <li>Fabrique les préparations courantes dont il maîtrise le principe,
        avec ingrédients et installations adaptés.</li>

        <li>Peut examiner un composant <strong>non magique</strong> pendant
        <strong>10 minutes</strong> et tenter d’identifier sa propriété
        dominante par un test <strong>INT (Alchimie)</strong> difficulté
        <strong>10 ou 15</strong>.</li>

        <li>Peut apprendre à fabriquer une <strong>potion de soins
        ordinaire</strong> de COF2 (<code>1d4° PV</code>) ; la formule doit
        néanmoins être connue.</li>

        </ul>

        <p><strong>Limites :</strong> identifier une propriété n’est pas
        découvrir instantanément toutes les recettes auxquelles le réactif peut
        servir ; une potion ordinaire n’annule pas les limites de consommation
        COF2.</p>

        <h3>9.2. Rang 2 — Science des réactifs (1 PC)</h3>

        <p><strong>Effets :</strong></p>

        <ul>

        <li>Peut <strong>substituer</strong> un ingrédient ordinaire d’une
        recette par un autre <strong>réellement compatible</strong> : si
        l’équivalence est connue, aucune vérification supplémentaire ; sinon
        test <strong>INT (Alchimie) difficulté 15</strong>, avec <strong>+1
        heure</strong> de préparation.</li>

        <li>Peut analyser un <strong>poison non magique</strong> en <strong>30
        minutes</strong> pour déterminer sa propriété dominante et les
        conditions d’un <strong>possible antidote</strong> : test de difficulté
        <strong>15 ou plus</strong> selon le poison.</li>

        </ul>

        <p><strong>Limites :</strong> l’analyse ne constitue pas un antidote ;
        le remplacement d’un ingrédient ne contourne pas les composants
        véritablement uniques d’une recette.</p>

        <p><strong>Exemple :</strong> après l’examen d’un venin de scorpide,
        l’alchimiste sait quel type d’effet l’antidote doit neutraliser, mais
        doit encore trouver les ressources et élaborer ou obtenir la formule
        adaptée.</p>

        <h3>9.3. Rang 3 — Art des dosages (2 PC)</h3>

        <p><strong>Effet :</strong> pour une formule <strong>ordinaire et
        maîtrisée</strong>, fabriquer <strong>jusqu’à trois doses en un seul
        lot</strong> en fournissant <strong>tous les ingrédients pour chaque
        dose</strong>, avec <strong>+1 h par dose au-delà de la
        première</strong>. Un <strong>seul test final éventuel</strong> est
        effectué pour le lot.</p>

        <table>

        <thead>

        <tr>

        <th style="text-align:right">Doses</th>

        <th style="text-align:right">Temps pour une formule prenant normalement
        2 h</th>

        <th>Ingrédients consommés</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td style="text-align:right">1</td>

        <td style="text-align:right">2 h</td>

        <td>Une dose</td>

        </tr>

        <tr>

        <td style="text-align:right">2</td>

        <td style="text-align:right">3 h</td>

        <td>Deux doses</td>

        </tr>

        <tr>

        <td style="text-align:right">3</td>

        <td style="text-align:right">4 h</td>

        <td>Trois doses</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Limites :</strong> pas de gain d’ingrédients, pas de
        quatrième dose par lot, pas de fabrication automatique en lots pour des
        recettes instables, rares, exceptionnelles ou magistrales. Le MJ annonce
        avant le test ce qu’un échec du lot compromet ; pas de triple réussite
        automatique sur un seul jet.</p>

        <h3>9.4. Rang 4 — Recherche alchimique (2 PC)</h3>

        <p><strong>Effet :</strong> concevoir et mettre au point une
        <strong>recette nouvelle, reproductible, dotée d’une seule propriété
        utilitaire</strong>, à partir de réactifs étudiés. Le joueur et le MJ
        définissent avant la recherche : l’effet, sa portée, sa durée
        éventuelle, ses conditions et les ressources nécessaires.</p>

        <p>Ce rang peut aussi permettre de <strong>modifier la forme ou le mode
        d’application d’une préparation connue</strong> sans en augmenter
        automatiquement l’effet.</p>

        <p><strong>Exemples de fonctions acceptables à étudier :</strong>
        neutraliser une odeur précise, nettoyer une substance identifiée,
        stabiliser une préparation fragile, protéger ponctuellement un matériel
        contre un agent défini. Chaque nouvelle recette exige une analyse de
        faisabilité.</p>

        <p><strong>Limites :</strong> pas de potion reproduisant librement des
        sorts, ni de « dé bonus à tous les tests », ni de DM élémentaires créés
        sans règle spécifique.</p>

        <p><strong>Différence avec le rang 5 :</strong> le rang 4 développe
        <strong>une fonction utilitaire</strong> ; le rang 5 peut associer
        <strong>deux fonctions</strong> ou élaborer une formule magistrale à
        effet borné.</p>

        <h3>9.5. Rang 5 — Formule magistrale (2 PC)</h3>

        <p><strong>Effets :</strong></p>

        <ul>

        <li>Peut entreprendre un <strong>projet d’au moins trois jalons</strong>
        pour créer <strong>une préparation unique</strong>, combinant
        <strong>deux propriétés utilitaires compatibles</strong> ou renforçant
        un effet simple <strong>dans une limite acceptée par le
        MJ</strong>.</li>

        <li>Exige au moins <strong>un réactif rare adapté</strong> et une
        méthode spécialement mise au point.</li>

        <li>Une <strong>formule magistrale ne bénéficie pas du lot de trois
        doses du rang 3</strong>.</li>

        <li><strong>Exemple expérimental de référence :</strong> une potion
        magistrale de soins pouvant restaurer <strong><code>2d4°
        PV</code></strong>, au lieu de la potion ordinaire de <code>1d4°</code>,
        sous contrôle des règles de consommation de COF2 (§7.4 et §7.6).</li>

        </ul>

        <p><strong>Limites :</strong> ce cas <strong>ne généralise pas</strong>
        un doublement de toutes les potions. Il ne remplace pas les capacités
        magiques du forgesort. Le statut et l’évolution du dé doivent être
        arbitrés clairement pour cette nouvelle formule avant sa première
        utilisation.</p>

        <h3>9.6. Huit demandes à l’alchimie — référence de table</h3>

        <table>

        <thead>

        <tr>

        <th>Demande</th>

        <th style="text-align:right">Rang indicatif</th>

        <th>Traitement</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Préparer un baume banal</td>

        <td style="text-align:right">Sans voie ou 1</td>

        <td>Geste simple selon historique, ou préparation courante</td>

        </tr>

        <tr>

        <td>Fabriquer une potion de soins ordinaire</td>

        <td style="text-align:right">1</td>

        <td>Formule connue ; <code>1d4° PV</code> ; limite COF2 de
        consommation</td>

        </tr>

        <tr>

        <td>Reconnaître un composant végétal</td>

        <td style="text-align:right">1</td>

        <td>Observation 10 min ; test si incertain</td>

        </tr>

        <tr>

        <td>Remplacer une plante d’une formule</td>

        <td style="text-align:right">2</td>

        <td>Substitution compatible, test si équivalence inconnue</td>

        </tr>

        <tr>

        <td>Étudier le venin d’un scorpide</td>

        <td style="text-align:right">2</td>

        <td>Analyse 30 min ; ne soigne pas le venin par elle-même</td>

        </tr>

        <tr>

        <td>Préparer trois doses d’une formule ordinaire</td>

        <td style="text-align:right">3</td>

        <td>Lot et ingrédients ×3 ; temps réduit ; un test éventuel</td>

        </tr>

        <tr>

        <td>Mettre au point un liquide qui masque une odeur donnée</td>

        <td style="text-align:right">4</td>

        <td>Une propriété utilitaire clairement bornée</td>

        </tr>

        <tr>

        <td>Créer une préparation magistrale de soins</td>

        <td style="text-align:right">5</td>

        <td>Projet ≥3 jalons ; réactif rare ; équilibre à vérifier</td>

        </tr>

        </tbody>

        </table>

