  - sort: 1500000
    name: 14 — L’artisanat en Durotar
    type: text
    _id: 1RH3PovZYZ0xrMj7
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>13. Artisanat dans la campagne de Durotar</h2>

        <p>L’artisanat doit soutenir la promesse de la saison : une
        <strong>Horde encore jeune</strong> s’installe en Kalimdor et tente de
        construire un territoire durable. Les artisans ne sont pas seulement des
        fabricants d’équipement de combat ; leur métier leur permet de
        participer à cette construction.</p>

        <p>Les exemples suivants sont <strong>des situations proposées pour
        Warbound</strong>, non des affirmations de canon sur des recettes ou PNJ
        existants.</p>

        <h3>13.1. Tranchecolline — un atelier qui compte</h3>

        <p>Tranchecolline est le point d’ancrage de la saison. Une forge locale,
        un marchand d’outils ou un artisan itinérant peuvent offrir <strong>un
        atelier, des ressources, un enseignement ou des commandes</strong>.</p>

        <p><strong>Scènes possibles :</strong></p>

        <ul>

        <li>Réparer rapidement les ferrures d’une charrette pour permettre à un
        groupe de reprendre la route.</li>

        <li>Rendre service à un maître artisan pour obtenir l’accès à une
        installation.</li>

        <li>Découvrir qu’une pièce récupérée présente une propriété
        inconnue.</li>

        <li>Apprendre une <strong>recette spécialisée</strong> sans être obligé
        de se lancer dans une longue quête d’ingrédients.</li>

        </ul>

        <p>Le métier donne ainsi des <strong>contacts</strong>, de la
        <strong>reconnaissance</strong>, des <strong>occasions de choix</strong>
        et une utilité pratique.</p>

        <h3>13.2. Village de Sen’jin — recettes et transmission</h3>

        <p>Une préparation contre un venin local peut être transmise par un
        spécialiste ou étudiée avec son aide. Le joueur doit alors décider s’il
        partage ses connaissances, échange un service ou recherche une solution
        par lui-même.</p>

        <p><strong>Exemple de recette fictive, créée pour Warbound
        :</strong></p>

        <pre><code class="language-markdown">#### Baume contre le venin des
        scorpides

        - Catégorie : recette spécialisée [WARBOUND, non canon WoW]

        - Métier : alchimie

        - Rang de référence : 2 recommandé pour analyser ou adapter la
        préparation

        - Effet : traitement d'un venin de scorpide explicitement identifié

        - Limite : pas un remède universel contre tous les poisons

        - Composants : réactif curatif compatible, échantillon étudié, excipient

        - Temps de référence : 2 h (V0.2, ajustable)

        - Test : seulement en cas d'incertitude ou de contrainte ; difficulté à
        fixer

        - Acquisition : enseignement, document, étude en jeu

        </code></pre>

        <p>La découverte de cette recette doit fournir <strong>une occasion de
        jouer</strong>, pas un objectif consistant à tuer dix scorpides pour
        monter une compétence.</p>

        <h3>13.3. Une ressource rare peut créer une décision</h3>

        <p>Le groupe récupère un minerai ou une substance inhabituelle.
        Plusieurs choix s’offrent à lui :</p>

        <ul>

        <li>l’utiliser immédiatement pour une réparation urgente ;</li>

        <li>le confier à un artisan compétent ;</li>

        <li>l’échanger contre des fournitures nécessaires ;</li>

        <li>l’étudier pour un projet futur ;</li>

        <li>le remettre à une communauté qui en a besoin.</li>

        </ul>

        <p>La récompense est intéressante précisément parce qu’<strong>elle n’a
        pas une utilisation unique imposée par un menu de recettes</strong>.</p>

        <h3>13.4. Préserver le rythme de la campagne</h3>

        <p>Une campagne de <strong>10 à 15 séances</strong> se terminant vers le
        <strong>niveau 4</strong> ne doit pas devenir une chaîne de fabrication
        sans fin.</p>

        <p>En pratique :</p>

        <ul>

        <li>Introduire une <strong>occasion de craft significative</strong>
        lorsqu’elle découle d’une situation, non à chaque halte.</li>

        <li>Autoriser les <strong>fabrications courantes hors champ</strong>
        quand elles ne génèrent aucun choix.</li>

        <li>Faire des <strong>recettes spécialisées</strong> des récompenses
        ponctuelles et identifiables.</li>

        <li>Garder les <strong>composants exceptionnels</strong> rares et liés à
        des découvertes plutôt qu’à une répétition de combats.</li>

        <li>Ne pas laisser le métier d’un PJ résoudre à lui seul tous les
        problèmes d’une faction ou d’un village : il offre <strong>des
        options</strong>, pas des solutions automatiques.</li>

        </ul>

