        <h2>16. Fiche réflexe du MJ</h2>

        <blockquote>

        <p><strong>À garder près de l’écran : fabrication en 60
        secondes</strong></p>

        <ol>

        <li><strong>Objet voulu ?</strong> Obtenir une description fonctionnelle
        précise.</li>

        <li><strong>Métier / rang ?</strong> Pas de recette individuelle pour un
        objet ordinaire.</li>

        <li><strong>Recette spéciale ?</strong> Oui seulement si technique ou
        effet particuliers.</li>

        <li><strong>Moyens ?</strong> Outils, atelier, matériaux, temps ; sans
        eux, pas d’objet « par magie ».</li>

        <li><strong>Incertitude ?</strong> Si non, réussite sans jet. Si oui :
        <code>1d20 + carac + rang + 2</code>.</li>

        <li><strong>Difficulté ?</strong> Repère 10 / 15 / 20 / 25 ;
        <strong>+10</strong> si équipement de qualité COF2.</li>

        <li><strong>Temps ?</strong> Estimation adaptée ; <strong>×3</strong> si
        équipement de qualité COF2.</li>

        <li><strong>Échec ?</strong> Conséquence annoncée avant le jet ; ne pas
        effacer gratuitement tous les efforts.</li>

        <li><strong>Résultat ?</strong> Noter objet, effet exact, limites,
        ressources consommées et éventuelle recette.</li>

        </ol>

        </blockquote>

        <h4>Récapitulatif des deux voies V0.2</h4>

        <table>

        <thead>

        <tr>

        <th>Rang</th>

        <th>Forge</th>

        <th>Alchimie</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>1</strong></td>

        <td>Bonus rang + 2, objets courants, réparation légère 30 min</td>

        <td>Bonus rang + 2, préparations courantes, analyse 10 min</td>

        </tr>

        <tr>

        <td><strong>2</strong></td>

        <td>Réparations/transfos deux fois plus rapides, récupération jusqu’à 25
        % des matériaux ordinaires</td>

        <td>Substitution, analyse de poison 30 min</td>

        </tr>

        <tr>

        <td><strong>3</strong></td>

        <td>Qualité COF2, une reprise de finition (+50 % du temps)</td>

        <td>Jusqu’à 3 doses, ingrédients × doses, +1 h par dose
        additionnelle</td>

        </tr>

        <tr>

        <td><strong>4</strong></td>

        <td>Une propriété technique non magique par conception</td>

        <td>Une nouvelle recette reproductible à une propriété utilitaire</td>

        </tr>

        <tr>

        <td><strong>5</strong></td>

        <td>Deux propriétés techniques, projet ≥3 jalons, reprise d’un
        jalon</td>

        <td>Deux propriétés ou formule magistrale, projet ≥3 jalons, dose
        unique</td>

        </tr>

        </tbody>

        </table>

        <h4>Petit glossaire COF2 / Warbound</h4>

        <table>

        <thead>

        <tr>

        <th>Abréviation / terme</th>

        <th>Sens dans ce guide</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>MJ / PJ</strong></td>

        <td>Maître de jeu / personnage joueur</td>

        </tr>

        <tr>

        <td><strong>PC</strong></td>

        <td>Points de capacité investis dans les rangs des voies</td>

        </tr>

        <tr>

        <td><strong>Rang</strong></td>

        <td>Degré acquis dans une voie de métier, de 1 à 5</td>

        </tr>

        <tr>

        <td><strong>FOR / INT / PER / AGI / CON</strong></td>

        <td>Caractéristiques de COF2 : Force, Intelligence, Perception, Agilité,
        Constitution</td>

        </tr>

        <tr>

        <td><strong>DM / DEF / PV</strong></td>

        <td>Dommages / Défense / points de vigueur du personnage (souvent
        appelés points de vie dans la conversation)</td>

        </tr>

        <tr>

        <td><strong>pa / po</strong></td>

        <td>Pièce d’argent / pièce d’or, selon l’économie du livre COF2</td>

        </tr>

        <tr>

        <td><strong>d4°</strong></td>

        <td>Dé évolutif de COF2 ; ce n’est <strong>pas</strong> un dé
        explosif</td>

        </tr>

        <tr>

        <td><strong>Dé bonus</strong></td>

        <td>Mécanisme de test COF2 ; ne pas le remplacer par un +5
        improvisé</td>

        </tr>

        <tr>

        <td><strong>Recette</strong></td>

        <td>Connaissance ou méthode de fabrication, distincte d’un rang</td>

        </tr>

        <tr>

        <td><strong>Jalon</strong></td>

        <td>Étape significative d’un projet exceptionnel, pas une tranche
        horaire obligatoire</td>

        </tr>

        </tbody>

        </table>

        <h4>Le test final de cohérence</h4>

        <p>Avant de valider une fabrication, demander :</p>

        <p><strong>« Si j’accorde cet objet maintenant, suis-je prêt à laisser
        les mêmes personnages ou d’autres artisans le reproduire dans des
        circonstances similaires, avec les mêmes règles et les mêmes coûts ?
        »</strong></p>

        <p>Si la réponse est non, il faut préciser ce qui rend cette création
        véritablement <strong>unique</strong> (ressource non reproductible,
        condition exceptionnelle, recette incomplète, intervention d’un tiers,
        etc.) ou modifier son effet.</p>

        <hr>
