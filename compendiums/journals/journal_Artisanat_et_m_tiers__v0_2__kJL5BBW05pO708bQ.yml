    text:
      format: 1
      content: >-
        <h2>7. Qualité, magie et consommables</h2>

        <h3>7.1. Armes et armures de qualité [COF2]</h3>

        <p>Le livre de base de COF2 prévoit :</p>

        <table>

        <thead>

        <tr>

        <th>Équipement de qualité</th>

        <th>Avantage officiel</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>Arme</strong></td>

        <td><strong>+1 aux tests d’attaque OU +1 aux DM</strong>, choix stable,
        pas les deux</td>

        </tr>

        <tr>

        <td><strong>Armure</strong></td>

        <td>La pénalité d’encombrement aux tests d’AGI est <strong>réduite de
        1</strong></td>

        </tr>

        </tbody>

        </table>

        <p>La fabrication exige des matériaux exceptionnels et précieux et
        applique :</p>

        <ul>

        <li><strong>difficulté normale de fabrication +10</strong> ;</li>

        <li><strong>temps de travail normal ×3</strong> ;</li>

        <li>valeur marchande indicative <strong>2 × prix normal + 100
        pa</strong>.</li>

        </ul>

        <p><strong>[V0.2]</strong> Pour un PJ utilisant la voie de la forge, la
        capacité <strong>Forge de qualité (rang 3)</strong> formalise l’accès à
        cette fabrication et lui donne une reprise de finition décrite au §8.4.
        Ce prérequis <strong>n’est pas dans COF2</strong> : il sert à structurer
        l’évolution des PJ de Warbound, sans nier que des artisans PNJ de haut
        niveau puissent réaliser de tels ouvrages.</p>

        <p><strong>Exemple :</strong> une épée longue ordinaire à 6 pa a, selon
        la formule COF2, une valeur de référence <strong>(6 × 2) + 100 = 112
        pa</strong> en qualité supérieure. Ce montant n’est pas un devis
        automatique de matériaux.</p>

        <h3>7.2. La qualité ne s’accumule pas</h3>

        <p>Un objet de qualité ne gagne pas un second +1 parce qu’il est poli,
        reforgé puis retrempé. Une arme ne peut pas cumuler « +1 attaque » et «
        +1 DM » au seul titre de cette qualité.</p>

        <p>Aux rangs 4 et 5, une <strong>propriété technique</strong> peut être
        ajoutée <strong>si elle est distincte et compatible</strong> : par
        exemple une épée de qualité dont les parties démontables permettent une
        configuration non-combattante. Cela ne crée ni bonus de DEF ni nouveau
        bonus d’attaque implicite.</p>

        <h3>7.3. Forge remarquable ≠ objet magique</h3>

        <p>Une fabrication sophistiquée peut être <strong>exceptionnelle sans
        être magique</strong>. Les effets permanents magiques relèvent de la
        création d’objets magiques, traitée séparément par COF2.</p>

        <p>COF2 présente notamment une <strong>voie de prestige de
        l’enchanteur</strong> et des <strong>règles de création d’objets
        magiques</strong>, dont l’accès doit être encadré par le MJ (réf. §17).
        <strong>La future voie professionnelle d’enchantement de Warbound n’est
        pas encore écrite</strong> : ne pas la confondre avec la voie de
        prestige ni considérer qu’elle confère automatiquement celle-ci.</p>

        <p><strong>[COF2]</strong> Le livre donne également un cadre de
        fabrication magique différent des objets ordinaires. Ne pas le remplacer
        silencieusement par la simple difficulté 20 de l’artisanat.</p>

        <h3>7.4. Potion de soins ordinaire [COF2]</h3>

        <ul>

        <li><strong>Effet :</strong> restitue <strong>1d4° PV</strong>.</li>

        <li><strong>Prix marchand indicatif :</strong> <strong>10
        pa</strong>.</li>

        <li><strong>Limitation :</strong> un personnage ne bénéficie pas des
        effets de plus d’<strong>une potion de soins par récupération rapide (30
        min)</strong>.</li>

        </ul>

        <p>Le signe <strong><code>°</code></strong> est important : dans COF2,
        c’est un <strong>dé évolutif</strong>, et non un dé explosif. Son
        évolution générale suit le niveau du personnage : <strong>d4 aux niveaux
        1–5, d6 aux niveaux 6–8, d8 aux niveaux 9–11, d10 aux niveaux 12–14, d12
        à partir du niveau 15</strong>. <strong>Ne pas lire <code>1d4°</code>
        comme <code>1d4</code> fixe à tous les niveaux.</strong></p>

        <p><strong>[À TRANCHER]</strong> Pour une <strong>formule magistrale
        inventée par Warbound</strong>, le niveau de référence à employer
        lorsqu’un artisan fabrique la préparation et qu’un autre personnage la
        consomme n’a pas été explicitement fixé dans nos décisions. En
        attendant, appliquer les règles de COF2 aux potions ordinaires sans
        introduire discrètement une règle de « niveau du fabricant » dans le
        système. Déterminer et noter l’effet exact d’une préparation magistrale
        lors de sa validation par le MJ.</p>

        <h3>7.5. Consommables et actions [COF2]</h3>

        <p>Le chapitre consacré aux objets magiques indique que <strong>boire
        une potion</strong> utilise normalement <strong>une action de
        mouvement</strong>, avec un arbitrage possible du MJ pour une
        consommation en pleine mêlée. Cela concerne les potions appropriées à ce
        cadre ; ne pas supposer qu’appliquer un onguent, utiliser un bandage ou
        administrer un antidote suit nécessairement le même temps d’action sans
        que sa fiche le dise.</p>

        <p>Le livre propose également des <strong>risques de mélange
        d’effets</strong> lorsque plusieurs potions restent actives. Pour ces
        situations, appliquer les règles de potions de COF2, et non une table
        inventée par Warbound. Le plafond spécifique des <strong>potions de
        soins</strong> reste applicable.</p>

        <h3>7.6. Alchimie ≠ voie des élixirs du forgesort</h3>

        <p>Le <strong>forgesort</strong> de COF2 dispose de capacités magiques
        de classe, notamment d’une <strong>voie des élixirs</strong>. L’alchimie
        professionnelle de Warbound <strong>ne copie pas</strong>
        automatiquement ses effets, ses durées, son économie de préparations ni
        ses capacités de combat.</p>

        <p><strong>[V0.2]</strong> Le rang 5 d’alchimie propose à titre
        expérimental une <strong>formule magistrale de soins à <code>2d4°
        PV</code></strong>, mais :</p>

        <ul>

        <li>elle exige un projet important et un ingrédient rare approprié
        ;</li>

        <li>elle ne se produit pas en lots ;</li>

        <li>elle reste soumise aux limites de consommation des soins ;</li>

        <li>elle n’autorise pas à doubler librement toutes les autres potions
        ;</li>

        <li><strong>son équilibrage et le traitement exact du <code>°</code>
        lors de son utilisation restent à confirmer</strong>.</li>

        </ul>

