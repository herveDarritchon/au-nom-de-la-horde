    text:
      format: 1
      content: >-
        <h2>8. Voie de la forge — cinq rangs</h2>

        <p><strong>Voie professionnelle de Warbound — entièrement [V0.2], non
        officielle COF2.</strong></p>

        <p><strong>Domaine :</strong> armes métalliques, armures métalliques,
        ferrures, outils, pièces forgées, réparations et transformations.
        <strong>Caractéristique :</strong> principalement FOR pour le travail
        physique, parfois INT pour l’étude et la conception.</p>

        <blockquote>

        <p><strong>Rappel :</strong> une dague, une épée à une main, une épée à
        deux mains, une pointe de lance ou une ferrure ne sont pas autant de
        capacités différentes. Le rang exprime la maîtrise, non un type d’arme
        débloqué.</p>

        </blockquote>

        <h3>8.1. Rang 1 — Main du forgeron (1 PC)</h3>

        <p><strong>Effets :</strong></p>

        <ul>

        <li>Bonus professionnel <strong>rang + 2</strong> aux tests de
        forge.</li>

        <li>Reconnaît sans jet les caractéristiques ordinaires d’un ouvrage
        métallique dont le fonctionnement est apparent.</li>

        <li>Fabrique les objets métalliques courants à partir d’outils,
        ressources et installations appropriés.</li>

        <li>Peut accomplir une <strong>réparation légère en 30 minutes</strong>
        avec l’outillage adapté.</li>

        </ul>

        <p><strong>Limites :</strong> pas de restauration instantanée d’un objet
        détruit ; les réparations importantes exigent des pièces, davantage de
        travail et parfois une installation fixe.</p>

        <p><strong>Exemple :</strong> dans un village, le forgeron réalise une
        dague de fer ordinaire. Si les matériaux sont disponibles et qu’aucune
        contrainte n’existe, aucun test n’est nécessaire.</p>

        <h3>8.2. Rang 2 — Ingéniosité du forgeron (1 PC)</h3>

        <p><strong>Effets :</strong></p>

        <ul>

        <li><strong>Divise par deux le temps</strong> d’une <strong>réparation
        ou transformation maîtrisée</strong> (pas celui de toutes les
        fabrications).</li>

        <li>Lors d’une fabrication, peut remplacer <strong>jusqu’à 25 % de la
        valeur des matériaux ordinaires</strong> par des pièces récupérées
        compatibles et réellement possédées.</li>

        <li>Peut effectuer les <strong>travaux physiquement réalisables</strong>
        avec un outillage ou un atelier de fortune, sous réserve des limites
        annoncées par le MJ.</li>

        </ul>

        <p><strong>Limites :</strong> ne crée ni métal ni composants rares ; pas
        de réduction générale de moitié du temps de fabrication des armes de
        qualité ; pas de dispense de forge pour une opération exigeant une
        forge.</p>

        <p><strong>Exemple :</strong> une réparation normalement estimée à 2
        heures peut prendre <strong>1 heure</strong> avec ce rang, si le travail
        est maîtrisé. Les pièces récupérées utilisées dans l’opération sont
        retirées de l’inventaire.</p>

        <h3>8.3. Rang 3 — Forge de qualité (2 PC)</h3>

        <p><strong>Effets :</strong></p>

        <ul>

        <li>Peut fabriquer des <strong>armes et armures de qualité</strong>
        conformément à COF2 (§7.1).</li>

        <li>Après un <strong>échec au test final de qualité</strong>, peut
        effectuer <strong>une seule reprise</strong> : <strong>+50 % du temps de
        fabrication initial</strong> et <strong>un nouveau test</strong>,
        <strong>sans dépense de nouveaux matériaux</strong>.</li>

        </ul>

        <p><strong>Résolution de la reprise :</strong></p>

        <ul>

        <li>Si le second test réussit : la qualité recherchée est obtenue.</li>

        <li>Si le second test échoue <strong>sans critique</strong> : l’objet
        existe et reste utilisable <strong>comme un objet ordinaire</strong>,
        sans bonus de qualité. Les matériaux exceptionnels ont été
        consommés.</li>

        <li>Si un échec critique survient : appliquer une conséquence appropriée
        annoncée par le MJ ; la reprise n’annule pas automatiquement ce
        risque.</li>

        </ul>

        <p><strong>Limites :</strong> une seule reprise, uniquement après
        l’échec du test final de qualité. Pas d’annulation générale de tous les
        échecs d’artisanat.</p>

        <p><strong>Exemple détaillé :</strong> le MJ fixe une épée de qualité à
        <strong>difficulté 20</strong> (base 10 + 10 COF2) et <strong>12 heures
        de travail</strong> (base 4 h ×3). Le forgeron échoue. Il peut
        travailler <strong>6 heures supplémentaires</strong> et retenter le test
        <strong>une fois</strong>. À défaut, l’épée est ordinaire.</p>

        <h3>8.4. Rang 4 — Métallurgie inventive (2 PC)</h3>

        <p><strong>Effet :</strong> peut concevoir un objet possédant
        <strong>une propriété technique non magique</strong> issue de la table
        suivante ou une propriété de puissance comparable validée <strong>avant
        fabrication</strong>.</p>

        <table>

        <thead>

        <tr>

        <th>Propriété [V0.2]</th>

        <th>Effet mécanique exact</th>

        <th>Ce que cela <strong>ne fait pas</strong></th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>Modulaire</strong></td>

        <td>L’objet possède deux configurations correspondant chacune à un objet
        standard existant. <strong>10 min</strong> pour changer de
        configuration.</td>

        <td>Pas de cumul simultané des caractéristiques des deux
        configurations.</td>

        </tr>

        <tr>

        <td><strong>Renforcé</strong></td>

        <td><strong>+5 aux tests</strong> effectués pour savoir si
        <strong>l’objet lui-même</strong> résiste à une casse ou une
        détérioration physique.</td>

        <td>Pas de bonus à la <strong>DEF du porteur</strong>, aux DM ni aux
        attaques.</td>

        </tr>

        <tr>

        <td><strong>Outil spécialisé</strong></td>

        <td><strong>Un dé bonus</strong> à une <strong>catégorie très étroite de
        tests hors combat</strong>, déterminée à la conception, lorsque l’outil
        est réellement utilisé.</td>

        <td>Pas de bonus général à toutes les compétences ni de dé bonus à
        l’attaque.</td>

        </tr>

        <tr>

        <td><strong>Adaptable</strong></td>

        <td>Peut être ajusté à <strong>deux conditions d’usage</strong> définies
        à la création, en <strong>10 min</strong>.</td>

        <td>Pas de nouvel effet chiffré offensif ou défensif.</td>

        </tr>

        </tbody>

        </table>

        <p>Une propriété technique n’est pas nécessairement une invention «
        faite sur place en quelques minutes » : conception, essais, atelier,
        matériaux ou recette peuvent être nécessaires. Elle peut coexister avec
        une <strong>qualité COF2</strong> si toutes les conditions de celle-ci
        sont aussi remplies.</p>

        <p><strong>Attention à la portée de l’outil spécialisé :</strong> « dé
        bonus pour utiliser ce cric sur la serrure d’une grille minière rouillée
        » est étroit ; « dé bonus à tous les tests de bricolage » est
        <strong>trop large</strong>. Le MJ contrôle ce point.</p>

        <h3>8.5. Rang 5 — Chef-d’œuvre du maître forgeron (2 PC)</h3>

        <p><strong>Effets :</strong></p>

        <ul>

        <li>Peut entreprendre un ouvrage singulier combinant <strong>jusqu’à
        deux propriétés techniques différentes</strong> compatibles, et
        éventuellement la qualité COF2 si elle a été obtenue séparément.</li>

        <li>Peut mettre au point <strong>sa propre méthode</strong> plutôt que
        devoir trouver une recette préexistante, à condition de disposer des
        savoirs, des outils et des ressources plausibles.</li>

        <li>Lors du projet, peut <strong>reprendre une fois un jalon technique
        raté sans devoir réunir à nouveau les matériaux de ce jalon</strong>,
        mais doit investir le temps correspondant. Cette reprise n’assure pas le
        succès.</li>

        <li>La création exige un <strong>projet d’au moins trois jalons
        significatifs</strong> (§10).</li>

        </ul>

        <p><strong>Limites :</strong> pas de troisième propriété technique ; pas
        de bonus automatique aux attaques ou aux DM ; pas d’enchantement
        permanent gratuit ; pas de procédé impossible rendu possible par un seul
        jet.</p>

        <p><strong>Exemple :</strong> un outil de franchissement exceptionnel
        pourrait combiner <strong>Modulaire</strong> (deux configurations) et
        <strong>Renforcé</strong> (résistance à la casse) dans un projet long.
        Une épée de qualité comportant ces deux fonctions garde <strong>un seul
        bonus de qualité COF2</strong> si les conditions de qualité sont
        remplies.</p>

        <h3>8.6. Douze demandes à la forge — référence de table</h3>

        <table>

        <thead>

        <tr>

        <th>Demande</th>

        <th style="text-align:right">Rang indicatif</th>

        <th>Traitement</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Entretenir une dague</td>

        <td style="text-align:right">Sans voie ou 1</td>

        <td>Entretien simple, selon l’historique</td>

        </tr>

        <tr>

        <td>Forger une dague de fer</td>

        <td style="text-align:right">1</td>

        <td>Fabrication courante</td>

        </tr>

        <tr>

        <td>Forger une épée longue</td>

        <td style="text-align:right">1</td>

        <td>Fabrication ordinaire, forge et temps appropriés</td>

        </tr>

        <tr>

        <td>Forger une épée à deux mains</td>

        <td style="text-align:right">1</td>

        <td>Plus de matière et de temps, <strong>pas</strong> de nouvelle
        capacité</td>

        </tr>

        <tr>

        <td>Réparer une armure</td>

        <td style="text-align:right">1</td>

        <td>Travail proportionné aux dégâts</td>

        </tr>

        <tr>

        <td>Réaliser une lame argentée</td>

        <td style="text-align:right">2</td>

        <td>Traitement/adaptation ; <strong>aucune propriété magique
        implicite</strong></td>

        </tr>

        <tr>

        <td>Transformer une vieille hache en pointe de lance</td>

        <td style="text-align:right">2</td>

        <td>Recyclage réel et transformation</td>

        </tr>

        <tr>

        <td>Réparer une ferrure pendant un voyage</td>

        <td style="text-align:right">2</td>

        <td>Temps réduit si réparation maîtrisée et outils suffisants</td>

        </tr>

        <tr>

        <td>Forger une épée de qualité (+1 attaque)</td>

        <td style="text-align:right">3</td>

        <td>Qualité COF2, coût et risque associés</td>

        </tr>

        <tr>

        <td>Fabriquer une armure de qualité</td>

        <td style="text-align:right">3</td>

        <td>Qualité COF2, pas de bonus automatique en DEF</td>

        </tr>

        <tr>

        <td>Créer un outil renforcé dans un matériau étrange</td>

        <td style="text-align:right">4</td>

        <td>Étude, une propriété technique, matériau compatible</td>

        </tr>

        <tr>

        <td>Forger un chef-d’œuvre à deux propriétés</td>

        <td style="text-align:right">5</td>

        <td>Projet ≥3 jalons, deux propriétés au maximum</td>

        </tr>

        </tbody>

        </table>

