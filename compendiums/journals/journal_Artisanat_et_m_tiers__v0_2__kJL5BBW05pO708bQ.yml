  - sort: 200000
    name: 01 — Philosophie du craft
    type: text
    _id: eBMw2eL2Uy3ysOqe
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>1. Objectif et philosophie</h2>

        <h3>1.1. Pourquoi un système d’artisanat ?</h3>

        <p>Dans <em>World of Warcraft</em>, l’artisanat se présente souvent
        comme une progression par points de compétence et recettes d’objets à
        débloquer. C’est une expérience satisfaisante dans un MMO, mais une
        transposition littérale peut devenir pesante en jeu de rôle sur table :
        listes de minerais, composants comptés à l’unité, fabrication répétée
        d’objets sans intérêt, recettes permettant seulement de changer le
        matériau d’une épée.</p>

        <p>Pour <strong>Warbound</strong>, nous voulons une autre expérience
        :</p>

        <ul>

        <li>Un personnage <strong>imagine un objet</strong>, puis le groupe
        cherche comment le réaliser.</li>

        <li>Son métier <strong>compte pendant l’aventure</strong> : réparer une
        ferrure, examiner un venin, improviser un outil, employer des ressources
        trouvées sur place.</li>

        <li>Une ressource inhabituelle est une <strong>possibilité
        narrative</strong>, pas un simple nombre supplémentaire dans
        l’inventaire.</li>

        <li>Les <strong>recettes retrouvées</strong> dans un atelier abandonné,
        chez un mentor ou sur un adversaire peuvent être de véritables
        récompenses.</li>

        <li>Le système encourage la <strong>coopération</strong> avec les
        artisans et les autres personnages, plutôt qu’un cycle de « collecte →
        fabrication → expérience ».</li>

        <li>La mécanique reste <strong>compatible avec COF2</strong> :
        caractéristiques, tests de difficulté, points de capacité, voies et
        règles officielles d’équipement.</li>

        </ul>

        <p><strong>Exemple d’intention :</strong> « Je veux transformer les
        pièces métalliques trouvées dans les décombres en renforts pour le
        chariot » est une demande normale. Le MJ n’exige pas une <em>recette de
        renfort de chariot rang 2</em> ; il vérifie la maîtrise, les matériaux,
        les outils et la situation.</p>

        <h3>1.2. Ce que le système n’est pas</h3>

        <ul>

        <li><strong>Pas</strong> une conversion point pour point de la
        compétence de métier de WoW Classic.</li>

        <li><strong>Pas</strong> une voie contenant « dague de bronze », « dague
        de fer », « épée de bronze », etc.</li>

        <li><strong>Pas</strong> une économie complète de production
        industrielle ou de commerce.</li>

        <li><strong>Pas</strong> un moyen d’obtenir gratuitement des bonus
        permanents ou de remplacer les capacités des classes.</li>

        <li><strong>Pas</strong> une raison de jeter un dé toutes les deux
        heures de travail.</li>

        </ul>

        <p>L’inspiration du guide de KibblesTasty est conservée — métiers,
        outils, matériaux, collecte, recyclage, recettes et possibilités
        d’invention — mais non son moteur D&amp;D 5e de tests et de comptabilité
        de temps successifs. <strong>Warbound utilise COF2, pas D&amp;D
        5e.</strong></p>

        <h3>1.3. Les trois dimensions d’un artisan</h3>

        <table>

        <thead>

        <tr>

        <th>Dimension</th>

        <th>Question à poser</th>

        <th>Représentation</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>Métier</strong></td>

        <td>Dans quel domaine travaille-t-il ?</td>

        <td>Une voie professionnelle choisie parmi les métiers</td>

        </tr>

        <tr>

        <td><strong>Maîtrise</strong></td>

        <td>Avec quelle sûreté et quelle ambition travaille-t-il ?</td>

        <td>Rang 1 à 5, payé en PC</td>

        </tr>

        <tr>

        <td><strong>Connaissances et moyens</strong></td>

        <td>Que sait-il faire précisément, et avec quoi ?</td>

        <td>Recettes, mentors, objets étudiés, outils, atelier, matières
        premières</td>

        </tr>

        </tbody>

        </table>

        <p>La progression en rang <strong>ne remplace pas les
        ressources</strong>. Une recette exceptionnelle <strong>ne remplace pas
        le rang</strong>. Une ressource rare <strong>ne dispense pas de
        compétence</strong>.</p>

        <hr>
