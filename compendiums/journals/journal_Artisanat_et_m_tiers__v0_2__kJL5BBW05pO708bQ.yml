    image: {}
    text:
      format: 1
      content: >-
        <h2>Bienvenue dans l’artisanat de Warbound</h2>

        <p><strong>Cette V0.2 est un prototype de règles jouable et non une
        version définitivement équilibrée.</strong> Les principes de structure
        ont été validés, tandis que les capacités chiffrées de forge et
        d’alchimie doivent encore être testées.</p>

        <blockquote>

        <p><strong>Règle d’or :</strong> une voie décrit ce que l’artisan sait
        <strong>entreprendre</strong>. Elle n’est <strong>pas</strong> un
        catalogue d’objets à débloquer. Les recettes sont des connaissances à
        découvrir en jeu.</p>

        </blockquote>

        <h4>Les règles essentielles</h4>

        <ul>

        <li><strong>Deux métiers maximum</strong> par personnage, chacun sous la
        forme d’une voie à <strong>cinq rangs</strong>.</li>

        <li><strong>Forge et alchimie</strong> disposent de voies complètes en
        V0.2 ; les six autres métiers sont annoncés mais leurs capacités ne sont
        pas encore établies.</li>

        <li>Les métiers de <strong>récolte</strong> (herboristerie, minage,
        dépeçage, pêche) ne nécessitent pas une voie.</li>

        <li><strong>Recettes courantes</strong> : inutiles pour les fabrications
        ordinaires. <strong>Recettes spécialisées ou exceptionnelles</strong> :
        trouvées, apprises, achetées ou inventées.</li>

        <li>Si le travail est <strong>maîtrisé</strong>, les <strong>outils et
        ingrédients disponibles</strong> et qu’il n’y a <strong>pas
        d’incertitude</strong>, <strong>aucun test</strong> n’est
        nécessaire.</li>

        <li>Sinon : <strong>1d20 + caractéristique appropriée + rang
        professionnel + 2</strong> contre la difficulté fixée par le MJ.</li>

        <li>Aucun matériau rare, recette ou rang ne permet d’obtenir
        automatiquement une propriété magique.</li>

        </ul>

        <h4>Utilisation dans Foundry</h4>

        <p>Chaque chapitre est une <strong>page</strong> à ouvrir depuis le
        sommaire du journal. Commencez par « 02 — Métiers et progression », puis
        « 03 — Fabriquer un objet ». Les voies de forge et d’alchimie sont
        détaillées plus loin. Une page « Suivi de l’équilibrage » est destinée
        au MJ uniquement.</p>

        <p><strong>Légende :</strong> <code>[VALIDÉ]</code> = décision retenue
        pour Warbound ; <code>[COF2]</code> = règle du jeu de base ;
        <code>[V0.2]</code> = proposition jouable en test ; <code>[MJ]</code> =
        arbitrage contextuel ; <code>[À TRANCHER]</code> = décision non encore
        fixée.</p>
