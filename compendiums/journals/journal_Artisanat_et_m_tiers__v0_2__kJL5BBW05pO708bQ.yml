  - sort: 300000
    name: 02 — Métiers et progression
    type: text
    _id: zE6LKTh3kAC13GbX
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>2. Métiers, apprentissage et progression</h2>

        <h3>2.1. Deux métiers au maximum [VALIDÉ]</h3>

        <p>Un PJ peut développer <strong>deux métiers au maximum</strong>. C’est
        un choix d’identité : le personnage se distingue par ses savoir-faire,
        sans pouvoir maîtriser toutes les disciplines artisanales.</p>

        <p>Les huit métiers envisagés pour Warbound sont :</p>

        <table>

        <thead>

        <tr>

        <th>Métier</th>

        <th>Voie professionnelle</th>

        <th>Domaine de fabrication</th>

        <th>État de rédaction</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Forge</td>

        <td>Voie de la forge</td>

        <td>Armes et protections métalliques, outils, ferrures, pièces
        forgées</td>

        <td><strong>V0.2 détaillée</strong></td>

        </tr>

        <tr>

        <td>Alchimie</td>

        <td>Voie de l’alchimie</td>

        <td>Potions, remèdes, huiles, réactifs, antidotes</td>

        <td><strong>V0.2 détaillée</strong></td>

        </tr>

        <tr>

        <td>Ingénierie</td>

        <td>À développer</td>

        <td>Mécanismes, pièges, dispositifs, machines</td>

        <td>Cadre seulement</td>

        </tr>

        <tr>

        <td>Travail du cuir</td>

        <td>À développer</td>

        <td>Peaux, armures souples, sacs, selles, protections</td>

        <td>Cadre seulement</td>

        </tr>

        <tr>

        <td>Couture</td>

        <td>À développer</td>

        <td>Vêtements, étoffes, sacs, travaux textiles</td>

        <td>Cadre seulement</td>

        </tr>

        <tr>

        <td>Enchantement</td>

        <td>À développer</td>

        <td>Analyse et emploi de composants magiques, artisanat
        d’enchantement</td>

        <td><strong>À articuler avec la magie COF2</strong></td>

        </tr>

        <tr>

        <td>Cuisine</td>

        <td>À développer</td>

        <td>Préparation, conservation et transformation des aliments</td>

        <td>Cadre seulement</td>

        </tr>

        <tr>

        <td>Secourisme</td>

        <td>À développer</td>

        <td>Bandages, pansements, attelles, préparations de terrain</td>

        <td>Cadre seulement</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Cuisine et Secourisme comptent ici dans la limite de deux
        métiers</strong> : c’est la lecture cohérente de la règle « deux métiers
        parmi les huit ». Aucune exception gratuite pour les « métiers
        secondaires » du MMO n’a été validée.</p>

        <p>L’<strong>herboristerie, le minage, le dépeçage et la pêche</strong>
        sont des savoir-faire de collecte <strong>sans voie propre dans cette
        version</strong>. Ils ne consomment donc pas d’emplacement de métier.
        Ils peuvent nécessiter outils, temps, connaissances ou tests selon les
        circonstances.</p>

        <p><strong>[À TRANCHER]</strong> Le remplacement d’un métier déjà
        choisi, son éventuel oubli et les conséquences sur les rangs investis
        n’ont pas été définis. Ne pas permettre un changement sans coût sur
        simple demande entre deux scènes : décider ce point avec le joueur, de
        préférence lors d’une évolution importante du personnage.</p>

        <h3>2.2. Peut-on être artisan sans voie ? [VALIDÉ]</h3>

        <p><strong>Oui, mais à petite échelle et si l’historique le
        justifie.</strong></p>

        <p>Un personnage élevé auprès d’un forgeron peut savoir aiguiser une
        lame, reconnaître une pièce de métal ordinaire ou effectuer un entretien
        courant. Un personnage habitué aux plantes peut préparer une tisane
        ordinaire ou identifier une plante familière. Ces gestes ne demandent
        pas de PC.</p>

        <p>En revanche, cet historique ne confère pas :</p>

        <ul>

        <li>le <strong>bonus professionnel</strong> des voies ;</li>

        <li>la fabrication autonome de tous les équipements d’un métier ;</li>

        <li>le bénéfice de ses rangs 2 à 5 ;</li>

        <li>la capacité à reproduire des formules extraordinaires.</li>

        </ul>

        <p><strong>Repère pratique [MJ] :</strong> sans voie, autoriser les
        gestes d’entretien ou d’assistance cohérents ; réserver les travaux
        professionnels structurés à la voie correspondante ou à l’accompagnement
        effectif d’un artisan compétent.</p>

        <p><strong>Exemple :</strong> un guerrier ayant été apprenti chez un
        forgeron peut entretenir la hache du groupe. Pour fabriquer seul une
        épée dans une forge de village, le MJ attend normalement le rang 1 de la
        voie.</p>

        <h3>2.3. Acquérir un métier et monter en rang</h3>

        <p>Chaque métier est représenté par <strong>une voie à cinq
        rangs</strong>, achetés avec des <strong>points de capacité
        (PC)</strong>. Les rangs suivent les coûts et seuils habituels de COF2
        :</p>

        <table>

        <thead>

        <tr>

        <th>Rang</th>

        <th style="text-align:right">Niveau minimum du PJ</th>

        <th style="text-align:right">Coût du rang</th>

        <th style="text-align:right">PC cumulés dans ce métier</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>1</td>

        <td style="text-align:right">1</td>

        <td style="text-align:right"><strong>1 PC</strong></td>

        <td style="text-align:right">1</td>

        </tr>

        <tr>

        <td>2</td>

        <td style="text-align:right">2</td>

        <td style="text-align:right"><strong>1 PC</strong></td>

        <td style="text-align:right">2</td>

        </tr>

        <tr>

        <td>3</td>

        <td style="text-align:right">3</td>

        <td style="text-align:right"><strong>2 PC</strong></td>

        <td style="text-align:right">4</td>

        </tr>

        <tr>

        <td>4</td>

        <td style="text-align:right">5</td>

        <td style="text-align:right"><strong>2 PC</strong></td>

        <td style="text-align:right">6</td>

        </tr>

        <tr>

        <td>5</td>

        <td style="text-align:right">7</td>

        <td style="text-align:right"><strong>2 PC</strong></td>

        <td style="text-align:right">8</td>

        </tr>

        </tbody>

        </table>

        <p><strong>[COF2]</strong> Un rang supérieur suppose l’acquisition des
        rangs inférieurs. COF2 accorde normalement <strong>2 PC à chaque passage
        de niveau</strong> ; la dépense d’un rang suit les règles générales de
        progression du personnage (réf. §17).</p>

        <p><strong>[V0.2]</strong> Les voies professionnelles sont <strong>hors
        du plafond de six voies de COF2</strong> ; elles consomment néanmoins
        les PC ordinaires du PJ. Cette exception ne crée aucun PC gratuit.</p>

        <p><strong>[VALIDÉ]</strong> L’apprentissage et l’expérience en jeu
        donnent du sens à cette progression : avoir un mentor, fréquenter un
        atelier, pratiquer son métier, étudier une méthode. Ils n’accordent pas
        des rangs gratuits. Le rang devient mécaniquement acquis par la dépense
        des PC correspondants.</p>

        <p><strong>[MJ]</strong> Ne pas imposer une quête obligatoire longue
        pour chaque montée de rang. Si la fiction ne permet pas un apprentissage
        crédible immédiatement, en convenir en amont avec le joueur ; le coût en
        PC doit déjà rester la contrepartie principale.</p>

        <h4>Exemple de progression</h4>

        <p>Un guerrier investit 1 PC dans la forge. Au niveau 2, il dépense 1 PC
        pour le rang 2. Au niveau 3, il consacre 2 PC à la maîtrise du rang 3 :
        <strong>4 PC cumulés</strong> dans la forge, et donc 4 PC non dépensés
        dans ses voies de combat. Sa spécialisation a un prix réel.</p>

        <p>Dans la saison 1 envisagée de Durotar (fin autour du niveau 4), un PJ
        peut espérer atteindre au plus le <strong>rang 3</strong>. Les rangs 4
        et 5 concernent surtout la suite de la campagne.</p>

        <h3>2.4. Tronc commun des cinq rangs</h3>

        <table>

        <thead>

        <tr>

        <th>Rang</th>

        <th>Fonction</th>

        <th>Effet attendu</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>1 — Maîtrise</strong></td>

        <td>Exercer le métier</td>

        <td>Fabrication ordinaire, reconnaissance de l’objet, bonus
        professionnel</td>

        </tr>

        <tr>

        <td><strong>2 — Adaptation</strong></td>

        <td>Faire avec les moyens du bord</td>

        <td>Substitution, récupération, temps ou contraintes réduits</td>

        </tr>

        <tr>

        <td><strong>3 — Excellence</strong></td>

        <td>Mieux produire</td>

        <td>Qualité, productivité ou contrôle des ratés</td>

        </tr>

        <tr>

        <td><strong>4 — Innovation</strong></td>

        <td>Développer des techniques inédites</td>

        <td>Une propriété technique ou formule nouvelle</td>

        </tr>

        <tr>

        <td><strong>5 — Chef-d’œuvre</strong></td>

        <td>Entreprendre l’exceptionnel</td>

        <td>Combinaison de propriétés ou formule magistrale via un projet</td>

        </tr>

        </tbody>

        </table>

        <p><strong>Attention :</strong> c’est la structure de conception
        <strong>[V0.2]</strong>, pas cinq capacités identiques copiées d’un
        métier à l’autre. La forge et l’alchimie ont leurs propres bénéfices
        détaillés aux §8 et §9.</p>

        <hr>
