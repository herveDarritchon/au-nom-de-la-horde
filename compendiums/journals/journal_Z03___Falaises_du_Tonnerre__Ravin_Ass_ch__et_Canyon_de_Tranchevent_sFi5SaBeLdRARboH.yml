  - _id: 4e51feb0d0944873
    name: 02 · Factions et secrets MJ
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Factions et influences — Z03</h2><p><strong>Horde</strong> sur ses
        <strong>routes</strong> et équipements, non souveraine de tous les
        ravins ; <strong>Cercle de la Pierre Brisée</strong> comme
        <strong>hypothèse d'activité clandestine liée aux sabotages</strong>
        conforme à son périmètre [FAC] ; Lame ardente peut chercher du
        renseignement, <strong>sans position fixe attestée ici</strong>.
        <strong>Faune / créatures locales ≠ faction
        politique</strong>.</p><h3>Matrice des influences du
        référentiel</h3><table><thead><tr><th>Faction</th><th>Implantation /
        contrôle pertinent</th><th>Incursions, clandestinité ou influence
        indirecte</th><th>Effet sur les voyages (mise en
        scène)</th></tr></thead><tbody><tr><td><strong>Horde</strong></td><td>Z01,
        Z04, Z07 (Sombrelances), corridors de Z03 et Z10</td><td>Patrouilles /
        logistique en Z05, Z06, Z08</td><td>Convois, relais, pistes entretenues,
        sécurité variable</td></tr><tr><td><strong>Cercle de la Pierre
        Brisée</strong></td><td><strong>Pas de territoire
        officiel</strong></td><td>Logistique Z03, abords des travaux Z01 et
        routes de Durotar selon ses opérations</td><td>Sabotage non létal,
        fuite, matériel ciblé, fausses accusations
        possibles</td></tr><tr><td><strong>Lame ardente</strong></td><td>Repaire
        Z02</td><td>Agents infiltrés Z01 ; manipulation des irréductibles Z06 ;
        activités ailleurs <strong>non cartographiées
        précisément</strong></td><td>Indices discrets, fausses pistes,
        informations partielles, tension
        nourrie</td></tr></tbody></table><blockquote><p><strong>Attention
        :</strong> une infiltration, un sabotage ou une manipulation ne signifie
        pas que la faction contrôle publiquement le territoire. Les relations
        secrètes ne doivent pas être divulguées automatiquement. Une faction
        hostile ne rend pas mécaniquement toute la région « en guerre
        ».</p></blockquote>
