  - _id: cdde53538f36f1b7
    name: 04 · Incidents et rencontres
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Incidents et rencontres — Z03</h2><h3>Exemples situés dans la fiche
        de zone</h3><p>chariot immobilisé, éboulis peu grave, détour pour éviter
        une bête. <strong>Majeur :</strong> convoi abandonné et matériel précis
        disparu, survivant empoisonné, ravin obstrué. <strong>Toute attaque ne
        doit pas être attribuée mécaniquement à un ennemi
        unique.</strong></p><h3>Palette d’événements
        régionaux</h3><table><thead><tr><th>Zone</th><th>Mineur : observation,
        tension, détour</th><th>Majeur : choix significatif ou confrontation
        possible</th><th>Intention non hostile /
        alternative</th></tr></thead><tbody><tr><td>Z03</td><td>Chariot cassé,
        bête gardant un abri</td><td>Vol sélectif, convoi abandonné,
        éboulement</td><td>Secourir, suivre traces, changer de
        route</td></tr></tbody></table><h3>Application
        COF2</h3><table><thead><tr><th>Bilan</th><th>Événement</th></tr></thead><tbody><tr><td>−3
        ou moins (provisoire)</td><td>Arrêt + événement
        majeur</td></tr><tr><td>−2</td><td>Ralentissement + événement
        majeur</td></tr><tr><td>−1</td><td>Événement mineur</td></tr><tr><td>0
        et plus</td><td>Aucun événement <strong>imposé par le bilan</strong> ;
        suivre la table de progression
        COF2.</td></tr></tbody></table><blockquote><p><strong>Ne pas tirer une
        rencontre supplémentaire toutes les quatre heures.</strong> La palette
        sert à choisir <strong>quel incident</strong> jouer lorsqu’il est
        déclenché ou lorsqu’une scène prévue le justifie. Combat non obligatoire
        ; calibrer les affrontements avec les POP COF2.</p></blockquote>
