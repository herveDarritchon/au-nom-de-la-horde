  - _id: 355f26c1296d9261
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z03</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z03-01</code> Falaises du
        Tonnerre</td><td><strong>Nœud
        [5]</strong></td><td>[PC]</td></tr><tr><td><code>Z03-02</code> Ravin
        Asséché</td><td><strong>Nœud [5]</strong>,
        sous-secteur</td><td>[PC]</td></tr><tr><td><code>Z03-03</code> Canyon de
        Tranchevent</td><td>Relief</td><td>[CLASSIC]</td></tr><tr><td><code>Z03-04</code>
        Caverne des
        Terrevent</td><td>Grotte</td><td>[CLASSIC]</td></tr><tr><td><code>Z03-05</code>
        Route de matériaux, carrières et caches</td><td>Infrastructure / fil
        rouge</td><td>[GUIDE] — emplacements à
        préciser</td></tr><tr><td><code>Z03-06</code> Passage vers
        Z02</td><td>Route
        secrète</td><td>[PC]</td></tr></tbody></table><h3>Implantation et rôle
        des lieux</h3><p><code>Z03-01</code> Falaises du Tonnerre
        <strong>[5]</strong> ; <code>Z03-02</code> Ravin Asséché
        <strong>[5]</strong> ; <code>Z03-03</code> Canyon de Tranchevent
        <strong>[CLASSIC]</strong> ; <code>Z03-04</code> Caverne des Terrevent
        <strong>[CLASSIC]</strong> ; <code>Z03-05</code> route de matériaux,
        carrière et cache mobile <strong>[GUIDE / campagne, positions précises à
        fixer]</strong> ; <code>Z03-06</code> sentier caché vers le Rocher du
        crâne <strong>[PC]</strong>.</p><h3>Connaissance des PJ (à
        renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
