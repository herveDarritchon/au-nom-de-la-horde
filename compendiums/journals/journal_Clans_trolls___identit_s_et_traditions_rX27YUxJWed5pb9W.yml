  - name: 5 — Glace, sable, trolls sombres et Zandalar
    type: text
    text:
      format: 1
      content: >-
        <h1>6. Trolls des glaces, des sables et trolls sombres</h1>

        <h2>Frostmane</h2>

        <p><strong>Lieu :</strong> Dun Morogh.<br>

        <strong>Famille :</strong> trolls des glaces.</p>

        <p>Les Frostmane descendent de l’ancien monde drakkari et mènent à
        l’époque Classic des attaques répétées contre les Nains de Dun
        Morogh.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Les Nains ont bâti leurs foyers sur un territoire que nous
        n’avons jamais cessé de considérer comme nôtre. »</strong></p>

        <hr>

        <h2>Winterax</h2>

        <p><strong>Ancien territoire :</strong> Vallée d’Alterac.<br>

        <strong>Chef :</strong> Korrak le Bloodrager.</p>

        <p>Les Winterax ont longtemps défendu leur territoire contre les Nains
        Stormpike et les Orcs Frostwolf. Dans le <em>Troll Compendium</em>, ils
        ont récemment abandonné la vallée et leur destination est inconnue.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Quand rester signifie disparaître, même un peuple obstiné
        doit partir. »</strong></p>

        <p>Ils sont intéressants comme peuple déplacé, sans qu’il soit
        nécessaire de définir immédiatement où ils se sont installés.</p>

        <hr>

        <h2>Drakkari</h2>

        <p><strong>Lieu :</strong> Zul’Drak, Norfendre.</p>

        <p>Les Drakkari représentent la principale puissance troll des glaces.
        Dans le lore disponible à l’époque Classic, ils sont décrits comme
        particulièrement belliqueux et déjà sous la pression croissante du
        Fléau, qui s’empare notamment de Drak’Tharon.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Nous survivrons seuls, même face au roi des morts.
        »</strong></p>

        <p>Pour une campagne centrée sur Durotar, ils doivent rester lointains
        et presque légendaires.</p>

        <hr>

        <h2>Sandfury / Farraki</h2>

        <p><strong>Lieu :</strong> Zul’Farrak, Tanaris.<br>

        <strong>Famille :</strong> trolls des sables.</p>

        <p>Leurs ancêtres appartenaient au monde gurubashi avant que la Grande
        Fracture ne les isole dans ce qui devint le désert de Tanaris.</p>

        <p>Ils ont perdu une grande partie de leur territoire au fil des âges et
        défendent férocement les ruines et terres qu’ils contrôlent encore. Ils
        vénèrent notamment <strong>Gahz’rilla</strong>, l’immense hydre associée
        à Zul’Farrak.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Tout ce qui nous reste est entouré d’étrangers venus
        fouiller nos ruines. »</strong></p>

        <h3>Connexion directe à Durotar</h3>

        <p>Dans WoW Classic, la chaîne liée à <strong>The Spider God</strong>
        conduit la Horde vers Zul’Farrak et passe par <strong>Maître Gadrin à
        Sen’jin</strong>. Cela fournit une excellente passerelle canonique si
        Warbound veut un jour envoyer les PJ de Durotar vers Tanaris.</p>

        <hr>

        <h2>Shadowtooth — trolls sombres</h2>

        <p><strong>Lieu :</strong> mont Hyjal.</p>

        <p>Les Shadowtooth constituent le principal groupe connu de trolls
        sombres dans le lore de cette période. Ils honorent les puissances
        sauvages d’Hyjal comme des loa, notamment Agamaggan.</p>

        <p>Ils ont combattu pendant la bataille du mont Hyjal aux côtés des
        forces opposées à la Légion ardente, y compris la Horde, l’Alliance et
        les Elfes de la nuit.</p>

        <p>À l’époque Classic, un émissaire Shadowtooth intervient encore dans
        une affaire liée aux esprits sauvages d’Hyjal.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Nos alliances durent le temps nécessaire pour protéger les
        puissances qui gardent cette montagne. »</strong></p>

        <p>Ils constituent une bonne manière de rappeler que <strong>tribu troll
        ne signifie pas automatiquement ennemi</strong>.</p>

        <hr>

        <h1>7. Les Zandalar : l’ancienne autorité du monde troll</h1>

        <p><strong>Implantation Classic visible :</strong> île de Yojamba, au
        large de Strangleronce.<br>

        <strong>Statut :</strong> indépendant.</p>

        <p>Dans les textes Classic, les Zandalar sont présentés comme les plus
        anciens trolls connus et comme les gardiens d’une grande part de la
        mémoire religieuse et historique de leur peuple.</p>

        <p>Lors du retour d’Hakkar à Zul’Gurub, ils viennent à Yojamba pour
        recruter des champions capables de combattre le Dieu du Sang et ses
        serviteurs.</p>

        <p>Ils coopèrent avec les aventuriers sans pour autant rejoindre la
        Horde ou l’Alliance.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Vos royaumes et vos guerres sont récents. Nous nous
        souvenons de ce qui existait avant eux. »</strong></p>

        <p>Pour Warbound, un Zandalar doit être rare. Sa présence doit signifier
        qu’un problème dépasse une simple querelle locale.</p>

        <h3>Usage recommandé</h3>

        <p>Un émissaire Zandalar peut :</p>

        <ul>

        <li>reconnaître chez un Sombrelance une tradition ancienne que celui-ci
        connaît mal ;</li>

        <li>rappeler que les Darkspear ne sont qu’une branche du vaste monde
        troll ;</li>

        <li>transmettre un avertissement lié à Hakkar ;</li>

        <li>demander une médiation ou un service sans se placer sous l’autorité
        de la Horde ;</li>

        <li>traiter Orcs, Humains et Elfes comme des puissances relativement
        récentes.</li>

        </ul>

        <hr>
