  - name: 4 — Trolls des forêts
    type: text
    text:
      format: 1
      content: >-
        <h1>5. Les trolls des forêts</h1>

        <p>Les trolls des forêts héritent principalement de l’ancien monde
        <strong>Amani</strong>. Leur grande blessure historique est la perte de
        territoires face aux Hauts-Elfes et l’échec des Guerres trolls.</p>

        <p>Pendant la Deuxième Guerre, Zul’jin rallie plusieurs tribus à la
        Horde d’Orgrim Doomhammer en échange d’une promesse : aider les trolls à
        écraser Quel’Thalas et restaurer leur puissance. La défaite de la Horde
        laisse une profonde rancœur.</p>

        <h2>Amani</h2>

        <p><strong>Lieu :</strong> Zul’Aman et frontières de Quel’Thalas.<br>

        <strong>Figure majeure :</strong> Zul’jin.</p>

        <p>Les Amani refusent l’idée que les terres de Quel’Thalas appartiennent
        légitimement aux Elfes. Leur guerre est une guerre de mémoire, de
        territoire et de revanche.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Les Elfes vivent sur nos terres. Le temps ne transforme pas
        un vol en droit. »</strong></p>

        <p>Pour Warbound, les Amani sont particulièrement intéressants si un
        personnage sin’dorei entre en contact avec eux : l’hostilité n’est pas
        récente, elle plonge dans plusieurs millénaires de conflit.</p>

        <hr>

        <h2>Revantusk</h2>

        <p><strong>Lieu :</strong> côte des Hinterlands.<br>

        <strong>Statut :</strong> pacte d’amitié et d’assistance avec la Horde
        de Thrall.</p>

        <p>Les Revantusk ont presque été anéantis lors des anciennes guerres.
        Leur faiblesse numérique les a poussés vers une forme de pragmatisme que
        d’autres trolls des forêts méprisent.</p>

        <p>Lorsqu’ils apprennent l’existence de la nouvelle Horde de Thrall, ils
        voient une possibilité différente de l’ancienne alliance avec les Orcs.
        Ils concluent avec elle un accord de coopération.</p>

        <h3>Important pour Warbound</h3>

        <p>Les Revantusk sont <strong>les trolls non-Sombrelance les plus
        proches de la Horde</strong>, mais ils ne sont pas une option de PJ dans
        la campagne.</p>

        <p>Ils constituent en revanche d’excellents :</p>

        <ul>

        <li>ambassadeurs ;</li>

        <li>éclaireurs ;</li>

        <li>alliés ponctuels ;</li>

        <li>sources d’informations sur les Royaumes de l’Est ;</li>

        <li>contrepoint culturel aux Sombrelance.</li>

        </ul>

        <h3>Moteur narratif</h3>

        <p><strong>« Survivre vaut mieux que mourir pour prouver que l’on n’a
        besoin de personne. »</strong></p>

        <hr>

        <h2>Vilebranch</h2>

        <p><strong>Lieu :</strong> Hinterlands, notamment Jintha’Alor.<br>

        <strong>Rapport :</strong> ennemis des Revantusk.</p>

        <p>Après la Deuxième Guerre, les Vilebranch retournent dans les
        Hinterlands et considèrent les Revantusk comme une cible facile. Ils
        utilisent notamment des captifs pour leurs sacrifices rituels.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Notre nombre nous donne le droit de reprendre ce qui nous
        appartient. »</strong></p>

        <hr>

        <h2>Witherbark</h2>

        <p><strong>Lieu :</strong> Hinterlands et Hautes-terres d’Arathi.</p>

        <p>Les Witherbark sont eux aussi d’anciens alliés de la Horde de la
        Deuxième Guerre. Après la défaite, leurs différents groupes se
        retrouvent opposés aux Revantusk, aux Nains Wildhammer et, dans les
        Hautes-terres d’Arathi, aux forces de la Horde de Thrall.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Les anciennes alliances n’ont apporté que des promesses
        brisées. »</strong></p>

        <hr>

        <h2>Mossflayer</h2>

        <p><strong>Lieu :</strong> Maleterres de l’Est.</p>

        <p>Les Mossflayer avaient déjà perdu une grande partie de leur
        territoire face aux humains avant la Deuxième Guerre. Lorsque le Fléau
        ravage Lordaeron, ils profitent de l’effondrement des défenses humaines
        pour reprendre des terres anciennes.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« La catastrophe de nos ennemis est notre chance de rentrer
        chez nous. »</strong></p>

        <p>Ils illustrent bien la logique troll selon laquelle la disparition
        d’un occupant n’efface pas une revendication territoriale vieille de
        plusieurs siècles.</p>

        <hr>

        <h2>Firetree et Smolderthorn — les trolls de la Horde noire</h2>

        <p><strong>Lieu :</strong> Pic Rochenoire.<br>

        <strong>Affiliation :</strong> Horde noire de Rend Blackhand.</p>

        <p>Ces deux tribus constituent un excellent miroir de la Horde de
        Thrall.</p>

        <p>Elles continuent à servir une Horde héritière de la Deuxième Guerre,
        mêlée à la magie démoniaque et alliée au vol draconique noir. Le
        <em>Troll Compendium</em> les présente comme des forces qui savent leur
        guerre presque perdue mais continuent malgré tout.</p>

        <p>Ils vénèrent la mémoire de Zul’jin et méprisent notamment les
        Revantusk, qu’ils considèrent comme des déserteurs. Les Revantusk
        retournent exactement l’accusation : pour eux, <strong>Thrall dirige la
        véritable Horde</strong>.</p>

        <h3>Moteur narratif</h3>

        <p><strong>« Nous n’avons pas trahi la Horde. C’est vous qui avez
        abandonné la guerre. »</strong></p>

        <p>Pour Warbound, cette opposition permet de poser une question beaucoup
        plus intéressante que « Horde contre Alliance » :</p>

        <blockquote>

        <p><strong>Qu’est-ce qui fait de la Horde de Thrall la “vraie” Horde
        ?</strong></p>

        </blockquote>

        <hr>
