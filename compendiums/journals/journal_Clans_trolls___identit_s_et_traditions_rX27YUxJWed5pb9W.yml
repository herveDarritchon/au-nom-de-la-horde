  - name: 6 — Horde et personnages joueurs
    type: text
    text:
      format: 1
      content: >-
        <h1>8. Relations avec la Horde — règle de lecture Warbound</h1>

        <table>

        <thead>

        <tr>
          <th>Groupe</th>
          <th>Statut envers la Horde de Thrall</th>
          <th style="text-align:right">Jouable ?</th>
          <th>Usage recommandé</th>
        </tr>

        </thead>

        <tbody>

        <tr>
          <td><strong>Sombrelance</strong></td>
          <td>Membre constitutif de la nouvelle Horde</td>
          <td style="text-align:right"><strong>Oui</strong></td>
          <td>PJ, PNJ, famille, mentors, rivaux internes</td>
        </tr>

        <tr>
          <td><strong>Revantusk</strong></td>
          <td>Pacte d’amitié et d’assistance / affiliation lâche</td>
          <td style="text-align:right"><strong>Non</strong></td>
          <td>Alliés, ambassadeurs, contacts</td>
        </tr>

        <tr>
          <td>Bloodscalp</td>
          <td>Hostile</td>
          <td style="text-align:right">Non</td>
          <td>Cousins ennemis des Sombrelance</td>
        </tr>

        <tr>
          <td>Skullsplitter</td>
          <td>Hostile</td>
          <td style="text-align:right">Non</td>
          <td>Cousins ennemis des Sombrelance</td>
        </tr>

        <tr>
          <td>Gurubashi</td>
          <td>Hostile / liés à Zul’Gurub</td>
          <td style="text-align:right">Non</td>
          <td>Menace religieuse et impériale</td>
        </tr>

        <tr>
          <td>Shatterspear</td>
          <td>Indépendant à l’époque Classic</td>
          <td style="text-align:right">Non</td>
          <td>Mystère, enclave lointaine</td>
        </tr>

        <tr>
          <td>Amani</td>
          <td>Hostile ; ancienne alliance avec la Horde</td>
          <td style="text-align:right">Non</td>
          <td>Ennemi historique, conflit avec Quel’Thalas</td>
        </tr>

        <tr>
          <td>Vilebranch / Witherbark / Mossflayer</td>
          <td>Hostiles</td>
          <td style="text-align:right">Non</td>
          <td>Factions régionales</td>
        </tr>

        <tr>
          <td>Firetree / Smolderthorn</td>
          <td>Horde noire</td>
          <td style="text-align:right">Non</td>
          <td>Rivaux idéologiques de la Horde de Thrall</td>
        </tr>

        <tr>
          <td>Frostmane / Winterax / Drakkari</td>
          <td>Indépendants ou hostiles</td>
          <td style="text-align:right">Non</td>
          <td>Factions régionales / lointaines</td>
        </tr>

        <tr>
          <td>Sandfury</td>
          <td>Indépendant / hostile</td>
          <td style="text-align:right">Non</td>
          <td>Zul’Farrak, Tanaris</td>
        </tr>

        <tr>
          <td>Shadowtooth</td>
          <td>Indépendant, allié de circonstance contre la Légion</td>
          <td style="text-align:right">Non</td>
          <td>Mystère spirituel</td>
        </tr>

        <tr>
          <td>Zandalar</td>
          <td>Indépendant, coopération contre Hakkar</td>
          <td style="text-align:right">Non</td>
          <td>Diplomatie, savoir, menace majeure</td>
        </tr>

        </tbody>

        </table>

        <h2>Pourquoi la restriction Sombrelance fonctionne</h2>

        <p>Elle est cohérente avec les deux piliers du projet :</p>

        <ol>

        <li><strong>Le lore Classic :</strong> le <em>Troll Compendium</em>
        décrit les Sombrelance comme la tribu troll intégrée à la Horde, tandis
        que les Revantusk ne sont que liés par un pacte et une affiliation
        lâche.</li>

        <li><strong>Champions of Azeroth :</strong> la présentation de la race
        Troll jouable décrit explicitement les <strong>Darkspear</strong>
        chassés de Strangleronce puis accueillis dans la Horde de Thrall.</li>

        </ol>

        <p>Warbound n’a donc pas besoin de créer plusieurs sous-races trolls
        jouables pour être fidèle au matériau de départ.</p>

        <hr>

        <h1>9. Ce qu’un PJ Sombrelance sait probablement</h1>

        <p>La totalité de ce document est une ressource MJ. Un PJ troll ne
        connaît pas automatiquement la situation de toutes les tribus
        d’Azeroth.</p>

        <h2>Connaissance courante</h2>

        <p>Un Sombrelance adulte connaît probablement :</p>

        <ul>

        <li>Sen’jin, Vol’jin et l’histoire récente de l’alliance avec Thrall
        ;</li>

        <li>l’exil de Strangleronce ;</li>

        <li>l’existence des Bloodscalp, Skullsplitter et Gurubashi ;</li>

        <li>la haine entre les Sombrelance et plusieurs tribus des jungles
        ;</li>

        <li>Zalazane et la perte des Îles de l’Écho ;</li>

        <li>le rôle des loa dans la culture troll ;</li>

        <li>l’existence de grands peuples trolls au-delà de Durotar.</li>

        </ul>

        <h2>Connaissance culturelle ou historique</h2>

        <p>Un personnage instruit, un prêtre, un chaman ou un spécialiste des
        traditions peut davantage connaître :</p>

        <ul>

        <li>l’ancien Empire gurubashi ;</li>

        <li>Hakkar, les Hakkari et les Atal’ai ;</li>

        <li>l’histoire des Amani et de Zul’jin ;</li>

        <li>le rôle particulier des Zandalar ;</li>

        <li>l’existence des Revantusk et leurs rapports avec la Horde.</li>

        </ul>

        <h2>Connaissance spécialisée</h2>

        <p>Les détails concernant :</p>

        <ul>

        <li>les Drakkari du Norfendre ;</li>

        <li>les Winterax après leur départ d’Alterac ;</li>

        <li>les Shadowtooth d’Hyjal ;</li>

        <li>la politique interne précise des tribus des Hinterlands ;</li>

        </ul>

        <p>doivent plutôt venir d’un contact, d’un voyage, d’un récit, d’un
        mentor ou d’une recherche en jeu.</p>

        <hr>

        <h1>10. Jouer un Sombrelance dans Warbound</h1>

        <p>Un Sombrelance ne doit pas être réduit à « l’Orc bleu qui parle avec
        un accent ».</p>

        <p>Quelques tensions beaucoup plus intéressantes peuvent structurer un
        personnage.</p>

        <h2>La Horde est-elle devenue ta tribu ?</h2>

        <p>Les Sombrelance doivent une partie de leur survie à Thrall. Pour
        certains, la Horde est désormais une famille choisie. Pour d’autres,
        elle reste une alliance indispensable mais extérieure à l’identité
        troll.</p>

        <h2>Que reste-t-il des anciennes traditions ?</h2>

        <p>La tribu a officiellement abandonné certaines pratiques, dont le
        cannibalisme, mais n’a pas renié son héritage spirituel.</p>

        <p>Un personnage peut être :</p>

        <ul>

        <li>fier de l’évolution des Sombrelance ;</li>

        <li>inquiet de voir les anciennes coutumes disparaître ;</li>

        <li>convaincu qu’il faut distinguer tradition et barbarie ;</li>

        <li>attiré par des rites que Vol’jin ou les anciens jugent
        dangereux.</li>

        </ul>

        <h2>Comment vois-tu les cousins de Strangleronce ?</h2>

        <p>Un Bloodscalp est à la fois :</p>

        <ul>

        <li>un ennemi potentiel ;</li>

        <li>un troll ;</li>

        <li>un héritier du même monde gurubashi ;</li>

        <li>le descendant de ceux qui ont contribué à chasser ton peuple.</li>

        </ul>

        <p>Cette contradiction est plus intéressante qu’une haine
        automatique.</p>

        <h2>Que signifie reprendre les Îles de l’Écho ?</h2>

        <p>Pour certains, c’est une question militaire. Pour d’autres, c’est
        retrouver un foyer, des sanctuaires, des morts, des souvenirs ou la
        preuve que la tribu n’est plus condamnée à l’exil.</p>

        <hr>
