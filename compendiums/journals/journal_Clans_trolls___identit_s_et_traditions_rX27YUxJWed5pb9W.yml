        À l’époque Classic, un émissaire Shadowtooth intervient encore dans une
        affaire liée aux esprits sauvages d’Hyjal.


        ### Moteur narratif


        **« Nos alliances durent le temps nécessaire pour protéger les
        puissances qui gardent cette montagne. »**


        Ils constituent une bonne manière de rappeler que **tribu troll ne
        signifie pas automatiquement ennemi**.


        ---


        # 7. Les Zandalar : l’ancienne autorité du monde troll


        **Implantation Classic visible :** île de Yojamba, au large de
        Strangleronce.  

        **Statut :** indépendant.


        Dans les textes Classic, les Zandalar sont présentés comme les plus
        anciens trolls connus et comme les gardiens d’une grande part de la
        mémoire religieuse et historique de leur peuple.


        Lors du retour d’Hakkar à Zul’Gurub, ils viennent à Yojamba pour
        recruter des champions capables de combattre le Dieu du Sang et ses
        serviteurs.


        Ils coopèrent avec les aventuriers sans pour autant rejoindre la Horde
        ou l’Alliance.


        ### Moteur narratif


        **« Vos royaumes et vos guerres sont récents. Nous nous souvenons de ce
        qui existait avant eux. »**


        Pour Warbound, un Zandalar doit être rare. Sa présence doit signifier
        qu’un problème dépasse une simple querelle locale.


        ### Usage recommandé


        Un émissaire Zandalar peut :


        - reconnaître chez un Sombrelance une tradition ancienne que celui-ci
        connaît mal ;

        - rappeler que les Darkspear ne sont qu’une branche du vaste monde troll
        ;

        - transmettre un avertissement lié à Hakkar ;

        - demander une médiation ou un service sans se placer sous l’autorité de
        la Horde ;

        - traiter Orcs, Humains et Elfes comme des puissances relativement
        récentes.


