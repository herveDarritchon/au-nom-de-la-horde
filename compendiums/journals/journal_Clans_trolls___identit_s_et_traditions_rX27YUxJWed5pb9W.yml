        2. **Qu’est-ce que nous refusons d’abandonner ?**

        3. **Qui tenons-nous pour responsable ?**

        4. **Jusqu’où sommes-nous prêts à aller pour survivre ou reconquérir ?**


        Quelques réponses-types :


        - **Sombrelance** — nous avons perdu notre terre ; nous avons choisi une
        nouvelle famille.

        - **Bloodscalp / Skullsplitter** — nous refusons de céder le territoire
        que nous avons réussi à garder.

        - **Gurubashi** — nous avons perdu un empire et certains sont prêts à
        payer n’importe quel prix pour retrouver sa puissance.

        - **Amani** — nous n’acceptons pas que le temps rende légitime la
        conquête de nos terres.

        - **Revantusk** — nous avons appris que survivre exige parfois de
        traiter avec d’autres peuples.

        - **Firetree / Smolderthorn** — nous refusons d’admettre que notre
        guerre et notre Horde appartiennent au passé.

        - **Mossflayer** — si nos anciens ennemis s’effondrent, nous reprendrons
        ce qu’ils nous avaient pris.

        - **Sandfury** — nous sommes encerclés et chaque étranger venu fouiller
        nos ruines confirme que nous devons les défendre.

        - **Zandalar** — les autres tribus se divisent ; nous devons préserver
        la mémoire du peuple troll et empêcher certaines catastrophes de
        recommencer.


        Cette logique produit des factions avec lesquelles les PJ peuvent
        négocier, se tromper, pactiser ou entrer en conflit — pas simplement des
        variantes de « troll hostile ».


