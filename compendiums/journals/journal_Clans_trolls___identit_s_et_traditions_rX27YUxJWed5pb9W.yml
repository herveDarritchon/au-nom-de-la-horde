  - name: 3 — Trolls des jungles
    type: text
    text:
      format: 1
      content: >-
        <h1>4. Les trolls des jungles</h1><p>Les trolls des jungles sont
        particulièrement importants pour un PJ Sombrelance, car les principales
        tribus de Strangleronce partagent un héritage lié à l’ancien Empire
        gurubashi.</p><h2>Sombrelance / Darkspear — la tribu
        jouable</h2><p><strong>Implantation :</strong> Durotar, village de
        Sen’jin, Îles de l’Écho.<br><strong>Chef à l’époque Classic :</strong>
        Vol’jin.<br><strong>Statut Warbound :</strong> <strong>seule tribu troll
        jouable.</strong></p><p>Les Sombrelance descendent de l’ancien ensemble
        gurubashi. Plus petits et moins puissants que plusieurs tribus rivales,
        ils furent finalement chassés de Strangleronce et contraints à
        l’exil.</p><p>La rencontre avec Thrall change leur histoire. Sen’jin
        s’allie aux Orcs lorsque son peuple est menacé ; après sa mort, Vol’jin
        conduit les survivants au sein de la nouvelle Horde.</p><p>En Durotar,
        les Sombrelance tentent d’établir un foyer durable. Leur première
        installation sur les Îles de l’Écho est compromise par la trahison du
        sorcier-docteur <strong>Zalazane</strong>, qui asservit une partie de la
        tribu. Les trolls libres se replient sur le continent et fondent le
        village de Sen’jin.</p><h3>Ce qu’ils veulent</h3><ul><li><p>préserver la
        tribu ;</p></li><li><p>conserver leur identité au sein de la Horde
        ;</p></li><li><p>défendre Durotar avec leurs nouveaux alliés
        ;</p></li><li><p>libérer les Sombrelance soumis à Zalazane
        ;</p></li><li><p>reprendre les Îles de l’Écho
        ;</p></li><li><p>transmettre les traditions sans revenir nécessairement
        à toutes les anciennes pratiques.</p></li></ul><h3>Rapport aux autres
        trolls</h3><p>Les Sombrelance n’ont pas oublié que leurs cousins de
        Strangleronce les ont chassés. Le <em>Troll Compendium</em> indique
        qu’ils entretiennent une hostilité particulière envers les autres trolls
        des jungles.</p><p>Pour un PJ, cela produit une identité intéressante :
        <strong>être troll ne signifie pas automatiquement considérer les autres
        trolls comme des
        frères</strong>.</p><hr><h2>Bloodscalp</h2><p><strong>Lieu :</strong>
        nord-ouest de Strangleronce.<br><strong>Chef Classic :</strong>
        Gan’zulah.<br><strong>Rapport aux Sombrelance :</strong> mépris et
        hostilité.</p><p>Après l’éclatement du pouvoir gurubashi, les Bloodscalp
        s’installent dans le nord-ouest de la jungle et défendent violemment
        leurs territoires. Ils sont également en conflit avec les
        Skullsplitter.</p><h3>Moteur narratif</h3><p><strong>« Cette terre est à
        nous parce que nous avons réussi à la garder. »</strong></p><p>Ils
        peuvent considérer les Sombrelance comme des faibles qui ont abandonné
        Strangleronce, puis leurs traditions, pour se mettre sous la protection
        des Orcs.</p><hr><h2>Skullsplitter</h2><p><strong>Lieu :</strong> centre
        de Strangleronce.<br><strong>Chef Classic :</strong> Ana’thek le
        Cruel.<br><strong>Rapport aux Sombrelance :</strong> mépris et
        hostilité.</p><p>Les Skullsplitter partagent avec les Bloodscalp une
        culture de défense territoriale agressive et une rivalité ancienne pour
        le contrôle des jungles.</p><h3>Moteur narratif</h3><p><strong>« Nous
        avons survécu parce que nous n’avons jamais cédé notre place.
        »</strong></p><p>Un Skullsplitter n’a aucune raison de voir la Horde
        comme une réussite Sombrelance. À ses yeux, elle peut être la preuve que
        les exilés ont remplacé leur tribu par une puissance
        étrangère.</p><hr><h2>Gurubashi</h2><p><strong>Lieu :</strong>
        Zul’Gurub.<br><strong>Importance :</strong> héritiers directs du cœur de
        l’ancien Empire gurubashi.</p><p>Les Gurubashi portent le poids d’un
        passé impérial. Après la Fracture, leur civilisation affaiblie chercha
        l’aide de <strong>Hakkar l’Écorcheur d’âmes</strong>, dont la puissance
        exigeait des sacrifices de plus en plus terribles.</p><p>La révolte
        contre Hakkar brisa davantage encore l’ancien ordre. À l’époque Classic,
        Zul’Gurub devient de nouveau le centre du danger lorsque Hakkar est
        rappelé.</p><h3>Moteur narratif</h3><p><strong>« Nous étions un empire.
        Regardez ce que nous sommes devenus. »</strong></p><p>Leur identité
        fonctionne bien autour de la nostalgie, du ressentiment et de la
        tentation de retrouver une puissance perdue à n’importe quel
        prix.</p><hr><h2>Shatterspear</h2><p><strong>Lieu :</strong> enclave
        isolée au nord-est de Sombrivage.<br><strong>Statut Classic :</strong>
        indépendant et très reclus.</p><p>Les Shatterspear descendent eux aussi
        de l’éclatement gurubashi, mais ont quitté Strangleronce pour
        s’installer très loin de leurs cousins, dans une vallée difficile
        d’accès entourée de territoires kaldorei.</p><p>Le <em>Troll
        Compendium</em> souligne que leurs motivations exactes demeurent
        inconnues à l’époque.</p><h3>Moteur narratif</h3><p><strong>« Nous
        survivons parce que personne ne nous trouve. »</strong></p><p>Pour
        Warbound, ils fonctionnent mieux comme mystère que comme faction
        militaire.</p><hr><h2>Hakkari et Atal’ai — des cultes, pas un peuple
        distinct</h2><p>Les <strong>Hakkari</strong> sont les serviteurs
        religieux d’Hakkar. Les <strong>Atal’ai</strong> constituent une faction
        extrémiste de ce courant, déterminée à permettre à Hakkar de prendre
        forme physiquement en Azeroth.</p><p>Les Atal’ai s’installent dans le
        <strong>Temple d’Atal’Hakkar</strong>, dans le Marais des Chagrins, et
        pratiquent des magies interdites, notamment la nécromancie.</p><p>Pour
        le MJ, c’est une distinction importante
        :</p><blockquote><p><strong>Hakkari / Atal’ai décrivent d’abord une
        fidélité religieuse. Ils ne doivent pas être utilisés comme une simple
        “couleur de peau” troll supplémentaire.</strong></p></blockquote><p>Cela
        permet à l’influence d’Hakkar de traverser les frontières
        tribales.</p><hr>
