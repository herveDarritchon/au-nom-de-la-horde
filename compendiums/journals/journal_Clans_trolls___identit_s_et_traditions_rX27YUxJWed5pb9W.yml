  - name: 7 — Accroches et ligne directrice MJ
    type: text
    text:
      format: 1
      content: >-
        <h1>11. Accroches pour la campagne Warbound</h1>

        <p>Ces éléments ne sont pas des événements canoniques imposés : ce sont
        des <strong>usages possibles du lore</strong> pour nourrir la
        campagne.</p>

        <h2>L’émissaire Revantusk</h2>

        <p>Un troll des forêts arrive à Razor Hill avec des nouvelles des
        Royaumes de l’Est. Il traite les Sombrelance comme des alliés de la même
        Horde, mais ses coutumes, sa mémoire de Zul’jin et son rapport aux Elfes
        sont profondément différents.</p>

        <p><strong>Fonction :</strong> révéler qu’il existe une autre manière
        troll d’être proche de la Horde.</p>

        <h2>Le messager de Yojamba</h2>

        <p>Un Zandalar cherche un membre précis de la communauté de Sen’jin. Il
        refuse de traiter l’affaire comme une mission de la Horde : le problème
        concerne « les trolls avant de concerner vos nouvelles nations ».</p>

        <p><strong>Fonction :</strong> ouvrir une piste future vers Hakkar ou
        Zul’Gurub.</p>

        <h2>Le prisonnier Bloodscalp</h2>

        <p>Une patrouille de la Horde capture un troll venu de très loin. Les
        gardes voient un ennemi. Un ancien Sombrelance reconnaît ses tatouages
        et comprend que son arrivée en Kalimdor n’est probablement pas
        fortuite.</p>

        <p><strong>Fonction :</strong> confronter un PJ troll à l’histoire de
        son exil.</p>

        <h2>Une relique gurubashi à Durotar</h2>

        <p>Un objet transmis pendant l’exil refait surface. Plusieurs
        Sombrelance le considèrent comme un héritage ; un sorcier-docteur pense
        au contraire qu’il aurait dû rester enterré.</p>

        <p><strong>Fonction :</strong> introduire l’histoire de Strangleronce
        sans quitter Durotar.</p>

        <h2>L’ombre de la Horde noire</h2>

        <p>Un Firetree ou Smolderthorn capturé refuse d’être qualifié de
        traître.</p>

        <blockquote>

        <p>« Moi, j’ai jamais quitté la Horde. »</p>

        </blockquote>

        <p><strong>Fonction :</strong> opposer directement l’héritage de la
        Horde de Doomhammer à la Horde de Thrall.</p>

        <h2>La route de Zul’Farrak</h2>

        <p>Une information obtenue auprès de Maître Gadrin renvoie à une
        croyance ou à une créature vénérée à Zul’Farrak.</p>

        <p><strong>Fonction :</strong> préparer naturellement une future
        expédition vers Tanaris en utilisant une connexion déjà présente dans
        WoW Classic.</p>

        <hr>

        <h1>12. Ligne directrice MJ</h1>

        <p>Les tribus trolls ne doivent jamais servir uniquement de palette de
        monstres.</p>

        <p>Pour chacune, poser quatre questions :</p>

        <ol>

        <li><strong>Qu’avons-nous perdu ?</strong></li>

        <li><strong>Qu’est-ce que nous refusons d’abandonner ?</strong></li>

        <li><strong>Qui tenons-nous pour responsable ?</strong></li>

        <li><strong>Jusqu’où sommes-nous prêts à aller pour survivre ou
        reconquérir ?</strong></li>

        </ol>

        <p>Quelques réponses-types :</p>

        <ul>

        <li><strong>Sombrelance</strong> — nous avons perdu notre terre ; nous
        avons choisi une nouvelle famille.</li>

        <li><strong>Bloodscalp / Skullsplitter</strong> — nous refusons de céder
        le territoire que nous avons réussi à garder.</li>

        <li><strong>Gurubashi</strong> — nous avons perdu un empire et certains
        sont prêts à payer n’importe quel prix pour retrouver sa puissance.</li>

        <li><strong>Amani</strong> — nous n’acceptons pas que le temps rende
        légitime la conquête de nos terres.</li>

        <li><strong>Revantusk</strong> — nous avons appris que survivre exige
        parfois de traiter avec d’autres peuples.</li>

        <li><strong>Firetree / Smolderthorn</strong> — nous refusons d’admettre
        que notre guerre et notre Horde appartiennent au passé.</li>

        <li><strong>Mossflayer</strong> — si nos anciens ennemis s’effondrent,
        nous reprendrons ce qu’ils nous avaient pris.</li>

        <li><strong>Sandfury</strong> — nous sommes encerclés et chaque étranger
        venu fouiller nos ruines confirme que nous devons les défendre.</li>

        <li><strong>Zandalar</strong> — les autres tribus se divisent ; nous
        devons préserver la mémoire du peuple troll et empêcher certaines
        catastrophes de recommencer.</li>

        </ul>

        <p>Cette logique produit des factions avec lesquelles les PJ peuvent
        négocier, se tromper, pactiser ou entrer en conflit — pas simplement des
        variantes de « troll hostile ».</p>

        <hr>
