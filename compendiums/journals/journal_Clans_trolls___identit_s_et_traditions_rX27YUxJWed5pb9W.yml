  - name: 1 — Terminologie et socle culturel
    type: text
    text:
      format: 1
      content: >-
        <h1>1. Terminologie : « clan » ou « tribu » ?</h1>

        <p>Les sources Warcraft utilisent principalement le terme anglais
        <strong>tribe</strong>, traduit ici par <strong>tribu</strong>. Le mot
        <strong>clan</strong> apparaît parfois dans les jeux ou adaptations,
        mais il vaut mieux considérer que, chez les trolls, l’unité politique et
        culturelle fondamentale est la <strong>tribu</strong>.</p>

        <p>Une tribu troll n’est pas seulement une origine géographique. Elle
        porte généralement :</p>

        <ul>

        <li>un territoire ;</li>

        <li>une mémoire historique ;</li>

        <li>des ennemis héréditaires ;</li>

        <li>des pratiques religieuses ;</li>

        <li>des loa particulièrement honorés ;</li>

        <li>des traditions propres ;</li>

        <li>une conception de ce que les trolls ont perdu et de ce qu’ils
        doivent reconquérir.</li>

        </ul>

        <p>La meilleure manière de différencier les tribus en jeu n’est donc pas
        de changer uniquement leur apparence, mais de leur donner une
        <strong>blessure historique et un objectif collectif</strong>.</p>

        <hr>

        <h1>2. Ce qui relie les peuples trolls</h1>

        <p>Les trolls sont l’un des peuples les plus anciens d’Azeroth. Malgré
        leur fragmentation politique, plusieurs traits culturels se retrouvent
        dans de nombreuses tribus.</p>

        <h2>Les loa</h2>

        <p>La spiritualité troll s’organise largement autour des
        <strong>loa</strong> : esprits, puissances, ancêtres ou divinités avec
        lesquels les trolls entretiennent des relations de culte, de pacte, de
        dette ou d’échange.</p>

        <p>Toutes les tribus ne servent pas les mêmes loa et une même puissance
        peut être comprise différemment selon les peuples.</p>

        <p>Pour Warbound, un loa ne doit pas être traité comme une simple «
        divinité de classe ». Il peut être :</p>

        <ul>

        <li>protecteur d’une lignée ;</li>

        <li>maître d’un territoire ;</li>

        <li>puissance à satisfaire ;</li>

        <li>ancêtre consulté ;</li>

        <li>patron d’un rite ;</li>

        <li>force dangereuse dont il faut respecter les interdits.</li>

        </ul>

        <h2>Voodoo, sorcellerie et traditions spirituelles</h2>

        <p>Le <strong>voodoo</strong> est très répandu chez les trolls, sans
        être universel. Les savoirs rituels sont souvent jalousement conservés
        par les tribus. Chamans, prêtres, sorciers-docteurs et chasseurs des
        ombres peuvent donc appartenir à des traditions différentes tout en
        partageant un vocabulaire culturel commun.</p>

        <h2>Régénération</h2>

        <p>Les trolls possèdent une capacité de régénération exceptionnelle. Le
        <em>Troll Compendium</em> en fait un trait biologique général du peuple
        troll, et <em>Champions of Azeroth</em> en fait également un élément
        mécanique central de la race.</p>

        <h2>Cannibalisme</h2>

        <p>Le cannibalisme existe chez de nombreuses tribus, mais <strong>il
        n’est ni universel ni obligatoire</strong>.</p>

        <p>Le <em>Troll Compendium</em> précise notamment que :</p>

        <ul>

        <li>les Zandalar ne le pratiquent pas ;</li>

        <li>les Revantusk ne le pratiquent pas ;</li>

        <li>les Sombrelance le pratiquaient autrefois mais l’ont
        <strong>officiellement abandonné après leur intégration à la
        Horde</strong>.</li>

        </ul>

        <p>Pour Warbound, ce point est important : un PJ Sombrelance n’est pas
        supposé pratiquer le cannibalisme sous prétexte qu’il est troll.</p>

        <hr>
