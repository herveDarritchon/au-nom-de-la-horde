        <h1>WARBOUND — Les clans trolls d’Azeroth</h1>

        <h2>Guide de lore et d’utilisation en campagne</h2>

        <blockquote>

        <p><strong>Périmètre : WoW Vanilla / Classic.</strong><br>

        Ce document privilégie l’état du lore correspondant au <em>World of
        Warcraft</em> original, en particulier l’ancien <strong>Troll
        Compendium</strong> de Blizzard et le contenu Classic. Les évolutions
        introduites dans les extensions ultérieures ne sont pas utilisées pour
        définir l’état du monde de Warbound, sauf mention explicite.</p>

        </blockquote>

        <blockquote>

        <p><strong>Règle Warbound — Personnages joueurs</strong><br>

        <strong>Seuls les trolls Sombrelance (Darkspear) sont
        jouables.</strong><br>

        Dans le cadre Classic retenu pour la campagne, les Sombrelance
        constituent la tribu troll pleinement intégrée à la Horde de Thrall. Les
        Revantusk entretiennent un pacte d’amitié et d’assistance avec la Horde,
        mais demeurent une tribu distincte : ils peuvent être alliés, contacts
        ou PNJ, pas une option de PJ.</p>

        </blockquote>

        <hr>
      markdown: >-
        # WARBOUND — Les clans trolls d’Azeroth

        ## Guide de lore et d’utilisation en campagne


        > **Périmètre : WoW Vanilla / Classic.**  

        > Ce document privilégie l’état du lore correspondant au *World of
        Warcraft* original, en particulier l’ancien **Troll Compendium** de
        Blizzard et le contenu Classic. Les évolutions introduites dans les
        extensions ultérieures ne sont pas utilisées pour définir l’état du
        monde de Warbound, sauf mention explicite.


        > **Règle Warbound — Personnages joueurs**  

        > **Seuls les trolls Sombrelance (Darkspear) sont jouables.**  

        > Dans le cadre Classic retenu pour la campagne, les Sombrelance
        constituent la tribu troll pleinement intégrée à la Horde de Thrall. Les
        Revantusk entretiennent un pacte d’amitié et d’assistance avec la Horde,
        mais demeurent une tribu distincte : ils peuvent être alliés, contacts
        ou PNJ, pas une option de PJ.


