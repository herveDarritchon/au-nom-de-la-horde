  - name: 03 · Maîtrise 3 — Lien empathique
    type: text
    sort: 300000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Maîtrise 3 — Lien empathique</h1><p><em>Nouveau : rang 3 de
        la Voie du compagnon animal</em></p><h2>Un véritable lien à
        distance</h2><p><strong>[COF2]</strong> Tu peux <strong>communiquer avec
        ton loup par télépathie</strong>. Tu peux également <strong>le soigner à
        distance</strong> en lui cédant tes propres PV, à raison de <strong>1 PV
        dépensé pour 1 PV rendu</strong> au loup. Le soin demande une
        <strong>action limitée (L)</strong>.</p><h2>Exemple de soin</h2><p>Ton
        loup a 5 PV sur 16. Tu es à 18 PV. Tu utilises une action limitée et
        dépenses 6 de tes PV : tu passes à 12 PV ; ton loup passe à 11 PV. Tu
        peux choisir une autre quantité, sans dépasser les PV maximum du
        loup.</p><h2>Les limites</h2><ul><li>La télépathie n’est
        <strong>pas</strong> une vision partagée : tu ne regardes pas par ses
        yeux.</li><li>Ton loup reste un loup : il peut te communiquer des
        sensations simples, pas lire des cartes ni expliquer des stratégies
        militaires.</li><li>La portée exacte de la télépathie n’est pas donnée
        par le livre ; demande au MJ jusqu’où elle fonctionne dans la
        scène.</li><li>Communiquer brièvement et soigner ne sont pas forcément
        le même geste. L’action (L) est indiscutable pour transférer des PV ; le
        coût d’une simple communication est un point
        d’arbitrage.</li></ul><h2>Sa fiche, à ce rang</h2><p><strong>DEF
        15</strong> ; <strong>PV = 4 × ton niveau</strong> ; morsure <strong>1d4
        + 2</strong>, bonus de jet = ton attaque magique. Les dés bonus de
        Travail d’équipe restent actifs lorsque leur condition est
        remplie.</p><h2>Ce que tu conserves</h2><p>Tout ce que tu pouvais faire
        aux maîtrises 1 et 2 : ordres, attaque au contact, piste, vigilance et
        survie du compagnon.</p><p><small><strong>Sources COF2 :</strong>
        Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book
        Éditions (2024), p. 71–72 ; p. 210. Le détail ci-dessus est reformulé ;
        les éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
