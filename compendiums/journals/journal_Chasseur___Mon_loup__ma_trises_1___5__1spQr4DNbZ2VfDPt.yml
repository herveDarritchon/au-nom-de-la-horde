  - name: 05 · Maîtrise 5 — Tactiques de meute
    type: text
    sort: 500000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Maîtrise 5 — Tactiques de meute</h1><p><em>Nouveau : rang 5
        de la Voie du compagnon animal</em></p><h2>Votre duo atteint sa pleine
        coordination</h2><ol><li><strong>Même cible :</strong> lorsque ton loup
        attaque la même cible que toi, il ajoute <strong>+1d4° DM</strong> à sa
        morsure. Cela reste une seule morsure, avec des dégâts supplémentaires,
        pas une attaque gratuite de plus.</li><li><strong>Soin empathique
        renforcé :</strong> en dépensant 1 de tes PV, tu rends maintenant
        <strong>2 PV</strong> à ton loup. Le transfert se fait toujours avec une
        action limitée (L).</li><li><strong>Défense de meute :</strong> toi
        <em>et</em> ton loup gagnez <strong>+1 DEF pour chaque voie de
        rôdeur</strong> dans laquelle tu as atteint le rang 5, celle-ci
        comprise. Ce bonus pourra encore augmenter si tu atteins rang 5 dans
        d’autres voies de rôdeur.</li></ol><h2>Fiche complète à ce
        rang</h2><p><strong>DEF du loup : 18 + bonus de meute</strong> (au moins
        19 du fait de cette voie) ; <strong>PV = 5 × ton niveau</strong> ;
        morsure <strong>1d4° + 5</strong>, avec <strong>+1d4°</strong> si vous
        attaquez tous deux la même cible. Le jet pour toucher utilise toujours
        ta valeur d’attaque magique. Les valeurs CON +3* et FOR +5 sont
        conservées.</p><h2>Exemple de combat — niveau 9</h2><p>Tu attaques un
        centaure et ton loup attaque <em>le même centaure</em> : si sa morsure
        touche, elle inflige <strong>1d8 + 5 + 1d8 DM</strong>. Si le loup
        attaque un second centaure pendant que tu frappes le premier, il n’a pas
        le deuxième d8.</p><h2>Exemple de soin</h2><p>Le loup a perdu 10 PV : en
        action limitée, tu peux lui rendre 10 PV en en dépensant 5. Si tu
        disposes de moins de PV ou s’il lui manque moins de 10 PV, adapte la
        quantité.</p><h2>Rappel de tes capacités cumulées</h2><p>Tu conserves
        les ordres simples et la morsure du rang 1, les dés bonus conditionnels
        du rang 2, le lien empathique du rang 3 et les statistiques de loup
        alpha du rang 4. Les arbitrages d’ordres et de mouvement restent ceux
        convenus avec ton MJ ; la maîtrise 5 ne débloque pas automatiquement une
        « spécialisation familiers » façon WoW.</p><p><small><strong>Sources
        COF2 :</strong> Laurent Bernasconi, <em>Chroniques Oubliées Fantasy
        2</em>, Black Book Éditions (2024), p. 72 ; p. 43. Le détail ci-dessus
        est reformulé ; les éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
