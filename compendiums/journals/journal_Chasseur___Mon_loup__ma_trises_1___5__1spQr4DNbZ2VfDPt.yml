  - name: 02 · Maîtrise 2 — Travail d’équipe
    type: text
    sort: 200000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Maîtrise 2 — Travail d’équipe</h1><p><em>Nouveau : rang 2
        de la Voie du compagnon animal</em></p><h2>Ton nouveau
        pouvoir</h2><p><strong>[COF2]</strong> Lorsque ton loup et toi êtes « au
        contact », il gagne un <strong>dé bonus sur ses attaques</strong> et tu
        gagnes un <strong>dé bonus sur tes tests pour pister ou éviter d’être
        surpris (Vigilance)</strong>.</p><h2>Comment l’utiliser</h2><ul><li>En
        mêlée, tu annonces au MJ votre position respective et celle de
        l’adversaire : si la condition de contact est remplie, lance deux d20
        pour l’attaque du loup et garde le meilleur.</li><li>Pour chercher des
        traces ou détecter une embuscade, le dé bonus du <em>chasseur</em> ne
        s’applique que lorsque votre proximité correspond à la condition de la
        voie.</li><li>Le loup garde son propre dé bonus sur ses tests personnels
        de PER et de CON, obtenu dès la maîtrise 1. Ton bonus à toi est limité à
        la piste et à la Vigilance contre la surprise.</li></ul><h2>Sa fiche au
        rang 2</h2><p><strong>DEF 14</strong> ; <strong>PV = 4 × ton
        niveau</strong> ; attaque de morsure <strong>d20 + ton attaque magique,
        DM 1d4 + 2</strong>. Sa valeur d’initiative reste la tienne. Aucun autre
        bonus de dégâts n’est acquis.</p><h2>Exemple</h2><p>Tu examines des
        traces à l’entrée d’un canyon, ton loup à tes côtés. Avec la condition
        de proximité validée par le MJ, tu bénéficies du dé bonus pour pister.
        Si ton loup est parti flairer seul loin devant, ce bonus sur ton test ne
        suit pas magiquement.</p><p><strong>À préciser avec le MJ :</strong> «
        au contact » n’est pas défini plus finement dans la voie. La table doit
        fixer une lecture constante (contact de même cible en combat, proximité
        immédiate hors combat, par exemple). Cette lecture n’est pas une
        nouvelle capacité officielle.</p><h2>Tu conserves</h2><p>Les ordres
        simples, la morsure coordonnée, les caractéristiques naturelles du loup
        et les règles de soin, de fuite et de remplacement de la maîtrise
        1.</p><p><small><strong>Sources COF2 :</strong> Laurent Bernasconi,
        <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions (2024), p.
        71. Le détail ci-dessus est reformulé ; les éventuels arbitrages
        Warbound sont explicitement identifiés.</small></p></section>
