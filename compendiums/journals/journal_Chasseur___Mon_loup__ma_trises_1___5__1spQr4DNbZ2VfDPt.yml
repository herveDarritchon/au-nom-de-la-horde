  - name: 04 · Maîtrise 4 — Loup alpha
    type: text
    sort: 400000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Maîtrise 4 — Loup alpha</h1><p><em>Nouveau : rang 4 de la
        Voie du compagnon animal</em></p><h2>Ton loup devient un mâle
        alpha</h2><p><strong>[COF2, livre fourni]</strong> Les caractéristiques
        ci-dessous remplacent celles du profil de base uniquement lorsqu’elles
        sont mentionnées. Le reste est
        conservé.</p><table><thead><tr><th>Caractéristique</th><th>Valeur de
        maîtrise
        4</th></tr></thead><tbody><tr><td>CON</td><td><strong>+3*</strong> (dé
        bonus à ses tests de
        CON)</td></tr><tr><td>FOR</td><td><strong>+5</strong></td></tr><tr><td>DEF</td><td><strong>18</strong></td></tr><tr><td>PV
        maximum</td><td><strong>5 × ton
        niveau</strong></td></tr><tr><td>Morsure</td><td><strong>1d4° +
        5</strong></td></tr><tr><td>Attaque</td><td>toujours <strong>d20 + ta
        valeur d’attaque
        magique</strong></td></tr><tr><td>Initiative</td><td>toujours la
        tienne</td></tr><tr><td>Autres caractéristiques</td><td>AGI +1 ; PER +2*
        ; CHA −2 ; INT −3 ; VOL +2</td></tr></tbody></table><h2>Comprendre le
        d4°</h2><p>Le petit ° veut dire <strong>dé évolutif</strong> : 1d4
        jusqu’au niveau 5, <strong>1d6 dès le niveau 6</strong>, puis d8 au
        niveau 9, d10 au niveau 12 et d12 au niveau 15. Ce n’est pas un dé qui
        explose.</p><h2>Exemple au niveau 6</h2><p>Avec la maîtrise 4, ton loup
        a <strong>DEF 18, 30 PV maximum</strong>, et sa morsure inflige
        <strong>1d6 + 5 DM</strong>. Son jet pour toucher utilise toujours
        <em>ta</em> valeur d’attaque magique.</p><h2>Ce que tu
        conserves</h2><p>Ordres et morsure coordonnée (rang 1), Travail d’équipe
        (rang 2), télépathie et soin à distance 1 PV pour 1 PV (rang 3), ainsi
        que les règles de vie et de récupération.</p><p><strong>Note de
        référence :</strong> ces chiffres suivent le livre COF2 fourni par le MJ
        ; une version en ligne affiche des valeurs différentes, mais il ne faut
        pas les mélanger dans la fiche.</p><p><small><strong>Sources COF2
        :</strong> Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>,
        Black Book Éditions (2024), p. 72 ; p. 43. Le détail ci-dessus est
        reformulé ; les éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
