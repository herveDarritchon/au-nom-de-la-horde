pages:
  - name: 01 · Maîtrise 1 — Le loup
    type: text
    sort: 100000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Maîtrise 1 — Le loup</h1><p><em>Capacité débloquée : rang 1
        de la Voie du compagnon animal</em></p><blockquote><p>Ton loup est un
        compagnon animal. Il peut combattre à tes côtés dès maintenant. Il ne
        possède pas les compétences spéciales d’un familier de
        WoW.</p></blockquote><h2>Ce que tu sais faire</h2><ul><li><strong>Donner
        un ordre simple :</strong> reste, garde, suis-moi, apporte, attaque. Il
        comprend une intention brève, pas un plan
        complexe.</li><li><strong>Combattre :</strong> le loup attaque en même
        temps que toi quand il peut mordre une cible au contact. Il n’a pas
        besoin que tu renonces systématiquement à ton propre
        tir.</li><li><strong>Explorer :</strong> il peut sentir, écouter,
        chercher une odeur ou surveiller un accès, selon ses capacités de
        véritable loup.</li><li><strong>Protéger :</strong> il peut se poster
        pour surveiller et réagir aux menaces, sans interception ni provocation
        automatique.</li></ul><h2>Fiche du
        loup</h2><table><thead><tr><th>Caractéristique</th><th>Valeur</th></tr></thead><tbody><tr><td>AGI
        / CON / FOR</td><td>+1 / +1* / +2</td></tr><tr><td>PER / CHA / INT /
        VOL</td><td>+2* / −2 / −3 /
        +2</td></tr><tr><td>DEF</td><td><strong>13</strong> (12 + rang
        1)</td></tr><tr><td>PV maximum</td><td><strong>4 × ton niveau de
        personnage</strong></td></tr><tr><td>Initiative</td><td>la même que la
        tienne</td></tr><tr><td>Attaque de morsure</td><td><strong>d20 + ta
        valeur d’attaque magique</strong> contre
        DEF</td></tr><tr><td>Dommages</td><td><strong>1d4 +
        2</strong></td></tr><tr><td>*</td><td>dé bonus aux tests propres du loup
        en CON et PER</td></tr></tbody></table><h2>Ton tour, en
        pratique</h2><ol><li>Annonce ce que fait ton chasseur.</li><li>Indique
        un ordre simple au loup et où il se trouve sur la carte.</li><li>S’il
        peut atteindre l’adversaire au corps à corps pendant votre activation
        commune, effectue sa morsure.</li><li>Lance séparément ta propre attaque
        et celle du loup ; ne donne pas deux morsures parce que tu tires
        plusieurs projectiles.</li></ol><p><strong>Règles de table à confirmer
        avec le MJ :</strong> coût d’un ordre, mouvement précis du loup et
        morsure quand tu n’attaques pas toi-même. Ne considère pas ces détails
        comme des pouvoirs automatiques.</p><h2>Blessures et absence</h2><p>Il
        peut être soigné par magie. Une récupération complète lui rend tous ses
        PV. S’il tombe à 0 PV en milieu naturel et peut fuir, il revient après 8
        h avec tous ses PV ; sinon il faut le soigner comme un personnage. S’il
        meurt réellement, un remplaçant peut être trouvé à ton prochain niveau,
        avec le MJ.</p><h2>Exemple</h2><p>Tu décoches une flèche sur un pillard.
        Ton loup est déjà à ses pieds : il tente sa morsure. S’il est derrière
        un éboulement et ne peut rejoindre le pillard, il ne mord pas à travers
        les rochers.</p><p><small><strong>Sources COF2 :</strong> Laurent
        Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions
        (2024), p. 71–72, 210–212. Le détail ci-dessus est reformulé ; les
        éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
