    name: Durotar
    type: text
    text:
      content: >-
        <p><strong>Durotar</strong> est une région aride et rocailleuse située
        sur la côte est de
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.cb28ce8ef3d17087.JournalEntryPage.d26977c697af601a]{Kalimdor}</strong>.
        Nommée en l'honneur du père de Thrall, cette terre de terre rouge, de
        canyons brûlés par le soleil et de poussière a été choisie par la
        nouvelle Horde comme terre d'accueil. Malgré son climat rude et les
        dangers immédiats (scorpides géants, hurans, centaures), les pionniers y
        construisent infatigablement leur nation. C'est une région de frontière,
        rude mais pleine d'opportunités, centrée autour des premières fondations
        d'Orgrimmar et du carrefour névralgique de
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.accdb729c105149f.JournalEntryPage.7c145456209029db]{Tranchecolline}</strong>.</p>

        <p><img
        src="/worlds/au-nom-de-la-horde/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/durotar.webp?v=2e9afecb7cee"
        alt="durotar.webp" width="700"></p>
