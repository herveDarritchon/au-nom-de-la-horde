    text:
      content: >-
        <h2 id="1-cadre-de-création-des-personnages">1. Cadre de création des
        personnages</h2>

        <p>La campagne se déroule dans un cadre volontairement proche de
        <strong>World of Warcraft Classic / Vanilla</strong>, quelques années
        après la Troisième Guerre.</p>

        <p>Les personnages appartiennent à la <strong>Horde</strong> ou
        combattent durablement à ses côtés. La campagne commence en
        <strong>Durotar</strong>, autour de Razor Hill et d’Orgrimmar.</p>

        <p><em>Champions of Azeroth</em> contient les neuf classes originales de
        World of Warcraft et ne fixe volontairement <strong>aucune restriction
        race/classe universelle</strong> : l’auteur recommande au MJ d'appliquer
        les restrictions correspondant à l'époque jouée.</p>

        <p>Pour cette campagne, la règle retenue est donc :</p>

        <blockquote>

        <p><strong>Les combinaisons normales suivent celles de WoW Classic, avec
        une seule exception de campagne : le Paladin sin’dorei.</strong></p>

        </blockquote>

        <p>Blizzard donne pour WoW Classic quatre races de la Horde — Orc,
        Tauren, Troll et Mort-vivant — et les combinaisons race/classe
        correspondantes.</p>

        <hr>

