  - _id: 37cbedb0230c270a
    name: 'Option de personnage : Paladin Sin''dorei'
    type: text
    text:
      content: >-
        <h2 id="un-survivant-de-quelthalas">Un survivant de
        Quel'Thalas</h2><p>Dans cette campagne, incarner un <strong>Paladin Elfe
        de Sang (Sin'dorei)</strong> est une option de création
        <em>exceptionnelle</em>. Le personnage est un ancien Haut-Elfe de
        Quel'Thalas qui a survécu à la destruction de son royaume par le Fléau
        lors de la Troisième Guerre.</p><p>Contrairement aux célèbres Chevaliers
        de Sang (Blood Knights) qui apparaîtront plus tard dans l'histoire, ce
        personnage avait déjà reçu une formation paladine liée à la
        <strong>Lumière</strong> avant ou pendant la chute de son foyer (à
        l'image du canon officiel avec des personnages comme Mehlar Dawnblade,
        ancien élève d'Uther).</p><h2
        id="comment-et-pourquoi-est-il-en-durotar-">Comment et pourquoi est-il
        en Durotar ?</h2><p>La présence de ce personnage aux côtés de la Horde
        en Kalimdor est une démarche <strong>individuelle</strong>. Il n'y a pas
        encore d'alliance politique entre Lune-d'Argent et la Horde de Thrall à
        cette époque.</p><p>Le personnage a pu traverser la mer pour de
        multiples raisons :</p><ul><li><p>Poursuivre une quête personnelle de
        vengeance contre le Fléau.</p></li><li><p>Fuir la désolation des
        Royaumes de l'Est.</p></li><li><p>Chercher un remède à la soif de magie
        de son peuple.</p></li><li><p>S'allier pragmatiquement à la seule force
        militaire structurée capable de l'accepter.</p></li></ul><p>Il est rare,
        parfois observé avec méfiance par les Orcs ou les Taurens, et découvre
        lui-même un continent aride et une culture très éloignée de la splendeur
        de Quel'Thalas.</p><h2 id="une-exception-pas-une-règle">Une exception,
        pas une règle</h2><div data-callout="warning" class="callout
        callout-warning"><div class="callout-title"><p>Restriction de
        Campagne</p></div><p>L'autorisation de ce concept <strong>n'ouvre pas la
        race des Elfes de Sang de manière générale</strong>. Il s'agit d'une
        dérogation spécifique pour jouer un Paladin (classe initialement
        réservée à l'Alliance dans Vanilla) côté Horde, en s'appuyant sur une
        justification historique solide. Les autres classes pour les Sin'dorei
        ne sont pas disponibles.</p></div><p>Même si la mécanique s'appuie sur
        le <em>Silvermoon Blood Elf</em> du supplément <em>Champions of
        Outland</em>, la classe reste le <strong>Paladin</strong> standard du
        manuel de base <em>Champions of Azeroth</em>.</p>
