    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <p>Galgar a une livraison pour Tranchecolline.</p><p>La récolte de
        pommes-cactus a été généreuse. Grosk, l’aubergiste de
        <strong>Tranchecolline</strong>, avait commandé un sac de ces fruits
        pour sa cuisine. Galgar en a préparé <strong>deux</strong> : une
        commande et un supplément qui fera plaisir au destinataire.</p><p>Avant
        votre départ de la <strong>vallée des Épreuves</strong>, Galgar confie
        les sacs à votre groupe et les installe dans les sacoches du kodo de
        ravitaillement. Ils voyageront avec vous par la <strong>mine de
        Roche-Sèche</strong>, puis jusqu’à
        Tranchecolline.</p><p><strong>Rapportez à Grosk autant de sacs de
        pommes-cactus que possible et rendez-lui compte de la
        livraison.</strong></p><section id="secret-l2Lkcrn9DLF4hBr2"
        class="secret"><p>Sur les pistes de Durotar, les <strong>Kolkar</strong>
        guettent les chargements de vivres. Entre les pillards, les accidents de
        route et les réactions du kodo, rien ne garantit que les deux sacs
        arrivent entiers.</p></section>
