    text:
      format: 1
      content: >-
        <h2>Cadre de la quête</h2><p><strong>Donneur :</strong> Galgar (vallée
        des Épreuves). <strong>Destinataire :</strong> Grosk, aubergiste de
        Tranchecolline. <strong>Nature :</strong> commande commerciale locale,
        intégrée au voyage de l’escorte de Mâche-Roc.</p><p>Grosk a commandé un
        sac. La bonne récolte permet d’en envoyer un second. Les deux sacs
        voyagent dans les sacoches du <strong>même kodo de
        ravitaillement</strong> qui accompagne les PJ de la vallée jusqu’à
        Roche-Sèche, puis rejoint le convoi de Rukha pour
        Tranchecolline.</p><h2>Ce qui peut se produire sur la
        route</h2><ul><li>Les Kolkar cherchent à dérober des vivres, notamment
        les deux sacs, et à repartir vivants. Une préparation efficace des PJ
        peut empêcher l’embuscade.</li><li>Une panique du kodo peut compromettre
        l’arrimage. Un compteur de panique à quatre points a été envisagé ; ses
        seuils et DD restent à fixer, sans les inventer ici.</li><li>Une
        négociation, un secours à un compagnon ou la protection de l’animal
        peuvent justifier une perte partielle sans que les PJ aient
        démérité.</li></ul><p><strong>Ne pas créer de seconde escorte.</strong>
        Utiliser les mêmes scènes et incidents que la mission principale ; seule
        la destinée de ces deux sacs est suivie séparément. Les Kolkar ne sont
        pas responsables de la substitution des caisses de Mâche-Roc, réalisée
        auparavant.</p><h2>Relation avec Grosk —
        barème</h2><table><thead><tr><th>Résultat constaté</th><th>Variation
        relationnelle</th></tr></thead><tbody><tr><td>Deux sacs
        remis</td><td>+2</td></tr><tr><td>Un sac
        remis</td><td>+1</td></tr><tr><td>Aucun sac, mais défense réelle et
        explication honnête</td><td>0</td></tr><tr><td>Aucun sac, abandon ou
        fuite sans tentative de protection</td><td>−1</td></tr><tr><td>En plus :
        refus de rendre compte ou responsabilité délibérément
        dissimulée</td><td>−1 supplémentaire</td></tr></tbody></table><p>Ce
        barème alimente la relation personnelle avec Grosk (échelle envisagée de
        −5 à +5). Il <strong>ne représente pas</strong> des points de réputation
        génériques du module et ne doit pas être confondu avec les 30 points de
        l’escorte. Le champ de récompense automatique « Réputation » reste donc
        à zéro.</p><p>Un présent ou une faveur de Grosk est possible pour une
        livraison particulièrement réussie, mais aucun objet précis, aucune
        somme d’or et aucun montant d’XP n’ont été validés. Ne pas les attribuer
        automatiquement.</p><h2>Résolution et suivi</h2><p>À l’arrivée, jouer la
        remise des sacs <strong>auprès de Grosk</strong>, distinctement de la
        réception de Mâche-Roc par Takrin et du jugement de l’escorte par
        Gar’Thok. Noter le nombre de sacs livrés, les raisons des pertes et les
        paroles des PJ.</p><p>Les sous-objectifs peuvent être signalés échoués
        si un sac est définitivement perdu. La quête peut cependant être
        <strong>résolue</strong> avec zéro ou un sac lorsque les PJ rendent un
        compte honnête ; ne pas la marquer automatiquement « Échec » du seul
        fait d’une perte matérielle. La différence se joue dans la relation avec
        Grosk.</p><p><strong>Liens à compléter dans Foundry :</strong>
        renseigner Galgar comme donneur de quête et lier son journal lorsque son
        UUID est connu. Le lien avec la quête « Escorte de Convoi » a été ajouté
        grâce à l’UUID du fichier fourni.</p>
