      content: >-
        <h1>Grak</h1>

        <blockquote><p><strong>[ADAPTATION WARBAND]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Il rend le recrutement de Yarrog
        personnel. Il n'est pas membre de la Lame ardente au départ ; il a
        simplement trouvé quelqu'un qui l'écoute.</p>

        <h2>Présence</h2><p>Jeune Orc en équipement simple de recrue. Rien
        d'exceptionnel au premier regard, ce qui fait partie de son
        problème.</p>

        <h2>Voix et répliques</h2><ul><li>« Yarrog dit que… »</li><li>« Vous
        n'avez commencé à m'écouter qu'après avoir compris qu'il me parlait.
        »</li></ul>

        <h2>Veut</h2><p>Être pris au sérieux.</p>

        <h2>Craint</h2><ul><li>redevenir invisible</li><li>découvrir qu'il
        n'était qu'un outil pour Yarrog</li></ul>
