        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Les PJ le voient rire avec Yarrog pendant
        une activité parfaitement banale. Aucune preuve, aucun danger
        visible.</p>

        <h2>Évolution hors champ</h2><p>Si personne ne lui offre une autre
        place, Yarrog avance progressivement dans son recrutement parce que lui,
        continue d'agir.</p>

