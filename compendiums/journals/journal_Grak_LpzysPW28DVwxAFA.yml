      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>L'écouter avant de lui dire
        quoi penser, lui donner une responsabilité, s'intéresser à ce qu'il veut
        lui-même.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Ne s'intéresser à lui qu'à
        cause de Yarrog, le traiter comme une victime idiote, lui imposer une
        conclusion.</p>

        <h2>Liens personnels possibles</h2>

        <h3>L'alternative réelle</h3><p>Un PJ peut devenir une relation aussi
        importante que Yarrog, mais seulement s'il écoute réellement
        Grak.</p><h3>La honte</h3><p>Après la révélation, Grak peut comprendre
        qu'il a transmis des informations importantes sans le
        savoir.</p><h2>S'il devient un allié</h2><p>Ami à protéger, futur membre
        fiable de la Horde, personne qui connaît intimement les méthodes
        sociales de Yarrog.</p><h2>S'il devient hostile</h2><p>Il peut défendre
        Yarrog, accuser les PJ de l'avoir piégé ou basculer plus loin dans le
        recrutement s'il se sent rejeté.</p>
