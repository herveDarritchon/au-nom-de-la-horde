        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Les PJ voient Grak rire avec Yarrog
        pendant qu'il lui apprend simplement à réparer une boucle. La scène est
        normale, et c'est ce qui lui donnera du poids plus tard.</p>

        <h2>Évolution hors champ</h2><p>S'il n'est pas inquiété, il avance d'une
        étape dans le recrutement d'une personne. S'il se sait surveillé, il
        réduit sa visibilité sans devenir soudainement caricatural.</p>

