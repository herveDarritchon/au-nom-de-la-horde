  - sort: 200000
    name: Relations avec les PJ
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Il ne demande pas la
        confiance : il l'obtient en écoutant, rendant un service réel,
        valorisant et se souvenant des confidences.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Le confronter avec des
        preuves, exposer son réseau ou montrer que ses méthodes sont
        comprises.</p>

        <h2>Liens personnels possibles</h2>

        <h3>Le premier adulte qui a écouté</h3><p>Un PJ a été ignoré ou
        ridiculisé. Yarrog l'a écouté jusqu'au bout.</p><h3>Le secret
        protégé</h3><p>Yarrog connaît une faute du PJ mais ne fait aucun
        chantage. Il protège réellement ce secret.</p><h3>Le service qui
        compte</h3><p>Il a aidé un proche, trouvé un médicament, réparé un objet
        ou obtenu une information utile.</p><h3>La mauvaise cible</h3><p>Le PJ
        croit avoir été recruté. Il découvre que Yarrog cherchait surtout à
        atteindre quelqu'un à travers lui.</p><h2>S'il devient un
        allié</h2><p>Avant la révélation, il peut être réellement utile et
        chaleureux. Même après, la relation peut rester émotionnellement
        vraie.</p><h2>S'il devient hostile</h2><p>Démasqué, il devient un
        adversaire personnel. Capturé : relation non résolue. Échappé :
        excellent antagoniste récurrent.</p>
