      content: >-
        <h1>Yarrog Baneshadow</h1>

        <blockquote><p><strong>[CANON] Orc démoniste de la Lame ardente ; rôle
        social [ACQUIS WARBAND]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Premier antagoniste que les joueurs
        peuvent regretter d'avoir aimé. Certaines choses chez lui sont sincères
        malgré sa loyauté à la Lame ardente.</p>

        <h2>Présence</h2><p>Peau gris-vert pâle, cheveux noirs striés de blanc,
        vêtements usés, bâton simple, breloques discrètes, aucune démonologie
        ostensible en public.</p>

        <h2>Voix et répliques</h2><ul><li>« Et toi, qu'est-ce que tu en penses ?
        »</li><li>« Pourquoi ça t'énerve autant ? »</li><li>« Tu leur as dit ?
        »</li></ul>

        <h2>Veut</h2><p>Identifier les personnes utiles, influentes, isolées,
        ambitieuses ou capables de garder un secret.</p>

        <h2>Craint</h2><ul><li>que son réseau soit exposé</li><li>être forcé
        d'agir trop vite</li><li>avoir mal jugé une recrue ou un PJ</li></ul>
