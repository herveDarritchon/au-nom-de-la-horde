  - sort: 400000
    name: Secret MJ — Révélation
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Secret MJ — Révélation</h1>

        <blockquote><p><strong>Ne pas montrer cette page aux joueurs avant la
        révélation.</strong></p></blockquote>

        <p>Yarrog sert la Lame ardente. Avant sa révélation, il doit accomplir
        au moins un acte réellement positif pour un PJ ou quelqu'un qu'ils
        apprécient. Le conflit idéal au démasquage est d'abord émotionnel : «
        Est-ce qu'il y avait au moins quelque chose de vrai ? » — « Oui. C'est
        justement le problème. »</p>
