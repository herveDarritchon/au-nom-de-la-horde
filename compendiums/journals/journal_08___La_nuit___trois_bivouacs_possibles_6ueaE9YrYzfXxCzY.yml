      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Document maître évolutif — v0.2 (5 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>F. Halte prévue et bivouac</h3><p>[STRUCTURE RETENUE / À TERMINER]  Une halte caravanière de la Horde a été proposée sur la route au sud de Tranchecolline, entre Tranchecolline et Sen’jin. Il s’agirait d’une création Warbound et non d’un camp officiel identifié. Retard, lumière et état des attelages déterminent les options.</p>\n<p style=\"margin-left:1em\">• Décisions ouvertes aux PJ — installer le camp de jour ; installer à la torche ; chercher un autre emplacement ; poursuivre la route de nuit ; forcer l’allure lorsque cela reste plausible.</p>\n<p style=\"margin-left:1em\">• Conséquences à reporter — conditions de repos, sécurité et récupération ; fatigue et éventuelles tensions ; état de départ du lendemain.</p>\n<p><small>À définir : position exacte de la halte, distance et horaire de référence, description du gardien ; voir le module jouable § 4 bis pour la marche de nuit, le bivouac et la récupération.</small></p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.6ueaE9YrYzfXxCzY.JournalEntryPage.BVe2Ow8tudCrRSVz]{À jouer — récit &amp; situations}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.T7Oi8jfz3iDN1hbq.JournalEntryPage.YDSwd5unUaR6SHmb]{Procédure Warbound / COF2} \_ · \_ @UUID[JournalEntry.fdszkHXwm6HmfSAI.JournalEntryPage.sYVKJolTDX9dVmkJ]{Conditions et DR} \_ · \_ @UUID[JournalEntry.qERFsqM51AlqFbnx.JournalEntryPage.KNf6AOB6jD73KkQF]{Comportements, limites et connaissances}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.x3XLdzGIaU5xDuhh.JournalEntryPage.eR76EoKqNGdyiYQ7]{← Scène précédente} \