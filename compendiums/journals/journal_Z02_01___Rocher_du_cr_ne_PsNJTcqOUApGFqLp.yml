      content: |-
        <h1>PNJ — Zirka la Néophyte</h1>
            <p><strong>ID :</strong> PNJ-Z02-01-02 · <strong>POI :</strong> Z02-01 · <strong>Zone :</strong> Z02</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Recrue incertaine cherchant à quitter le Rocher · <strong>Faction / allégeance réelle (MJ) :</strong> Lame ardente (recrue sans conviction)</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Sortir avec une personne qu’elle protège.</td></tr><tr><th>Motivation profonde</th><td>Elle a compris le coût humain du rite.</td></tr><tr><th>Obstacle</th><td>Les accès sont surveillés et sa camarade est malade.</td></tr>
              <tr><th>Ligne rouge</th><td>Livrer un innocent aux sacrificateurs pour obtenir sa liberté.</td></tr><tr><th>Peut offrir</th><td>Routine des rondes, accès utilisé par les porteurs, nom d’un recruteur.</td></tr><tr><th>En échange</th><td>Extraction de sa camarade, pas seulement d’elle-même.</td></tr>
              <tr><th>Attitude initiale</th><td>Terrifiée, prête à mentir sur de petits détails.</td></tr><tr><th>S'il n'arrive rien</th><td>Tente seule la fuite ; son absence peut précipiter le rite.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Cordelette nouée autour du poignet et brûlure fraîche.</p><p><strong>Voix et comportement :</strong> Répond trop vite puis corrige sa phrase.</p><p><strong>Signe émotionnel :</strong> Cache ses mains brûlées dès qu’un cultiste approche.</p>
            <blockquote><p><strong>Première réplique :</strong> « Si vous partez maintenant, ils feront recommencer les autres. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Combien de gens pouvez-vous vraiment faire sortir ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Les nouveaux ne portent pas tous le même insigne.</td></tr><tr><th>Après échange, aide ou observation</th><td>Connaît une issue de service, mais pas son état actuel.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ignore les objectifs politiques du réseau ; croit que le rite la rendra prisonnière à vie.</td></tr><tr><th>Il demande</th><td>Extraction de sa camarade, pas seulement d’elle-même.</td></tr>
              <tr><th>Il peut proposer</th><td>Routine des rondes, accès utilisé par les porteurs, nom d’un recruteur.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Livrer un innocent aux sacrificateurs pour obtenir sa liberté.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Guide les PJ jusqu’à une sortie si sa camarade est incluse.</td></tr><tr><th>S'ils négocient</th><td>Marchande des informations en échange d’une promesse vérifiable.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Se cache, dénonce une fausse direction par panique.</td></tr><tr><th>S'ils l'ignorent</th><td>Tente seule la fuite ; son absence peut précipiter le rite.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z02-01. <strong>Relations / autres lieux :</strong> Peut être transférée comme réfugiée à Z04-01.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z02-01 : témoin secouru, accès révélé ou recrues déplacées.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
