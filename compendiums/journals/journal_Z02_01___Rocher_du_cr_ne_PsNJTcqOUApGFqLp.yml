  - name: 04 • PNJ — Gazz'uz
    type: text
    sort: 400000
    ownership:
      default: 0
      TjbWhMczNyKieD8D: 3
    text:
      format: 1
      content: |-
        <h1>PNJ — Gazz'uz</h1>
            <p><strong>ID :</strong> PNJ-Z02-01-01 · <strong>POI :</strong> Z02-01 · <strong>Zone :</strong> Z02</p>
            <p><strong>Origine / statut :</strong> Classic — chef local selon factions V3</p>
            <p><strong>Fonction :</strong> Responsable rituel visible du Rocher du crâne · <strong>Faction / allégeance réelle (MJ) :</strong> Lame ardente</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Achever un rituel et faire taire les hésitations des recrues.</td></tr><tr><th>Motivation profonde</th><td>Il veut démontrer sa valeur aux yeux d’un réseau plus vaste.</td></tr><tr><th>Obstacle</th><td>Le rituel instable dépend de participants peu fiables.</td></tr>
              <tr><th>Ligne rouge</th><td>Renoncer publiquement à son autorité sur le cercle.</td></tr><tr><th>Peut offrir</th><td>Informations ésotériques, pacte trompeur, retrait provisoire de certains cultistes.</td></tr><tr><th>En échange</th><td>Obéissance ou objet rituel exploitable.</td></tr>
              <tr><th>Attitude initiale</th><td>Arrogant mais prudent face à une menace crédible.</td></tr><tr><th>S'il n'arrive rien</th><td>Poursuit le rituel, au risque de perdre une recrue qui fuit.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Bijou noir porté contre le cou, doigts tachés de suie.</p><p><strong>Voix et comportement :</strong> Accentue les mots de pouvoir puis murmure les ordres ordinaires.</p><p><strong>Signe émotionnel :</strong> Ses doigts tremblent très brièvement lorsque le cercle rituel vacille.</p>
            <blockquote><p><strong>Première réplique :</strong> « Vous êtes arrivés au mauvais moment, ou au seul qui compte. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Que sauveriez-vous si le rite s’effondre maintenant ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Un cercle rituel mobilise des recrues aux convictions disparates.</td></tr><tr><th>Après échange, aide ou observation</th><td>L’instabilité du cercle offre une alternative à l’attaque frontale.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>MJ : appartient au réseau de la Lame ardente ; cela ne prouve pas qu’il commande les sabotages logistiques du Cercle.</td></tr><tr><th>Il demande</th><td>Obéissance ou objet rituel exploitable.</td></tr>
              <tr><th>Il peut proposer</th><td>Informations ésotériques, pacte trompeur, retrait provisoire de certains cultistes.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Renoncer publiquement à son autorité sur le cercle.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Tente d’acheter du temps puis rompt un lien fragile du rituel.</td></tr><tr><th>S'ils négocient</th><td>Peut laisser partir une recrue contre la conservation d’une pièce sensible.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Accélère le rite ; risque de créer un danger pour tous.</td></tr><tr><th>S'ils l'ignorent</th><td>Poursuit le rituel, au risque de perdre une recrue qui fuit.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z02-01. <strong>Relations / autres lieux :</strong> Connexion au réseau de Neeru : ne pas offrir toute la hiérarchie par défaut.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z02-01 : rite stabilisé, interrompu ou lieu abandonné ; réputation de la menace cultiste.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
