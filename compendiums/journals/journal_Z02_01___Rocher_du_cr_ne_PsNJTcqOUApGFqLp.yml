        <h1>Rocher du crâne</h1>

        <p><strong>Identifiant :</strong> Z02-01</p>

        <p><strong>Zone géographique :</strong> Z02 — Rocher du crâne et Baie de
        Lamepoing</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Nœud [6],
        donjon</p>

        <h2>Fonction dans la campagne</h2>

        <p>Repaire local de la Lame ardente ; mini-donjon du pointcrawl.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Nœud [6] du pointcrawl.</p>

        <p><strong>Repère géographique :</strong> Secteur nord-est de reliefs et
        de littoral autour du repaire de Gazz’uz.</p>

        <p><strong>Factions et influences :</strong> Lame ardente (repaire) ;
        Horde (abords).</p>

        <p><strong>Références et réserves :</strong> [PC] [FAC]</p>

        <p><em>Le sentier de crête vers Z03 est une connexion cachée : son
        existence dans l’atlas ne signifie pas qu’il soit déjà connu des
        PJ.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
