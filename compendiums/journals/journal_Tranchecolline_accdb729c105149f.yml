  - _id: 7c145456209029db
    name: Tranchecolline
    type: text
    text:
      content: >-
        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/razor-hill.webp?v=4dd325dac084"
        alt="razor-hill.webp" class="default-width"></p>

        <p>Le son lourd d'une hache fendant le bois, l'odeur âcre de la
        poussière rouge soulevée par les kodos de bât, et le brouhaha de
        voyageurs fatigués : bienvenue à Tranchecolline.</p>

        <h2 id="le-carrefour-de-durotar">Le Carrefour de Durotar</h2>

        <p>Bien plus qu'une simple halte entre la Vallée des Épreuves et
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.cd074187891352fa.JournalEntryPage.e0870bccc64bf3dc]{Orgrimmar}</strong>,
        Tranchecolline (<em>Razor Hill</em>) est le <strong>cœur
        névralgique</strong> de la région. C'est ici que se croisent les convois
        de ravitaillement, que s'échangent les nouvelles du front, et que la
        Horde tente de maintenir l'ordre sur un territoire encore sauvage.</p>

        <p>Autour de vous, l'activité est frénétique et permanente. Des gardes
        burinés scrutent l'horizon rocailleux, des chasseurs taurens et trolls
        discutent des derniers mouvements de raptors, des péons réparent des
        chariots en maugréant, tandis que des marchands négocient à voix haute
        leurs maigres réserves d'eau et de vivres à l'ombre de tentes en cuir
        grossier.</p>

        <h2 id="votre-point-dancrage">Votre Point d'Ancrage</h2>

        <p>Pour vous, <strong>Tranchecolline</strong> n'est pas un lieu de
        passage. <strong>Ce sera votre camp de base</strong>.</p>

        <p>Vous y reviendrez entre deux expéditions pour vous reposer, soigner
        vos blessures, vendre vos trouvailles ou chercher des réponses. C'est un
        campement vivant, intimement lié à vos choix :</p>

        <ul>

        <li>Les personnes que vous aiderez, contrarierez ou ignorerez s'en
        souviendront.</li>

        <li>Les problèmes que vous réglerez laisseront des traces concrètes sur
        la vie du camp.</li>

        <li>Les menaces que vous laisserez de côté pourront empirer pendant
        votre absence.</li>

        </ul>

        <p>Prenez le temps d'observer, d'écouter près du feu de camp ou de
        parler aux artisans. Dans cette terre de frontière impitoyable, chaque
        rencontre faite à <strong>Tranchecolline</strong> peut déterminer ce qui
        vous attend sur la route le lendemain.</p>
