    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Document maître évolutif — v0.2 (5 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>C. Mine de Roche-Sèche — le second convoi</h3><p>[ACQUIS / À COMPLÉTER]  Le second convoi attend. Une cargaison associée à Mâche-Roc a été frauduleusement remplacée avant l’arrivée des PJ ; ceux-ci peuvent remarquer une discordance, mais ne sont pas responsables de la substitution.</p>\n<p style=\"margin-left:1em\">• Décisions ouvertes aux PJ — vérification sommaire, examen approfondi, échange avec ouvriers, rapprochement des pièces de chargement, départ sans enquêter.</p>\n<p style=\"margin-left:1em\">• Conséquences à reporter — chaque examen ou détour peut coûter du temps ; les informations recueillies modifient ce que les PJ pourront établir plus tard devant Takrin.</p>\n<p><small>À écrire / vérifier : nature exacte des éléments substitués, acteurs et témoignages réellement disponibles, seuils d’information et réaction de Mâche-Roc.</small></p>\n<p><strong>Raccordement nouveau :</strong> à l’arrivée, consulter @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{le bilan de l’embuscade} (sacs, blessés, état du kodo, retard). Le second convoi est toujours présent ; l’accueil peut être tendu si le trajet a pris du temps, sans règle d’attitude chiffrée inventée.</p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.zlu5sM6eTQq7OTLN]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.NPTwTH0upnsZFYU2.JournalEntryPage.Y72hXnFxQYl6J7nJ]{Garde-fou de continuité}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.rtpCsLr6B1uDIraY.JournalEntryPage.Dj6dgeEyMeh9I0R1]{Bilan MJ — faits établis en jeu} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Compteur vivant — piloté par la macro} \_ · \_ @UUID[JournalEntry.ntFjmKdDE6Mcpsuc.JournalEntryPage.D4UtndmnLmtqTgNQ]{Informations établies &amp; limites} \_ · \_ @UUID[JournalEntry.CUSS9LNh1aVHmC4H.JournalEntryPage.3cuZoMID9cx1JnQ9]{À jouer — récit &amp; situations}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.f5qnlnbAhytcPhtk.JournalEntryPage.Ys8Pp6kgMAGHkmcG]{← Scène précédente} \_ · \_ @UUID[JournalEntry.CUSS9LNh1aVHmC4H.JournalEntryPage.3cuZoMID9cx1JnQ9]{Scène suivante →}</p>"
