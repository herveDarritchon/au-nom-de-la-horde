  - name: 4 intrigues à développer
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Quand une rumeur devient une aventure</h1>

        <p>Ces quatre rumeurs méritent particulièrement de devenir des
        situations récurrentes dans Durotar.</p>

        <h2>Le convoi Stonehoof</h2><p>Une livraison de pièces métalliques
        destinées aux travaux du nord passe par Razor Hill. Quelques jours plus
        tard, une partie du chargement disparaît. Les voleurs n'ont pris que ce
        qui sert à creuser, renforcer ou soutenir des
        galeries.</p><p><strong>Fonction :</strong> Indice du fil rouge sans
        révéler sa cause.</p><h2>Les bêtes quittent les crêtes</h2><p>Un
        Thunderhorn et un Runetotem constatent séparément des migrations
        inhabituelles. Ils sont d'accord sur le symptôme, pas sur sa cause.
        Pendant ce temps, les animaux déplacés commencent à créer de vrais
        problèmes sur les routes.</p><p><strong>Fonction :</strong> Faire
        arriver les conséquences avant l'explication.</p><h2>Le vieux
        Stonespire</h2><p>Un vieux Tauren fait halte à Razor Hill. En entendant
        parler avec fierté des nouveaux travaux de la Horde, il raconte ce que
        sa famille a connu lorsque d'autres peuples ont commencé à creuser et
        bâtir sur des terres qu'ils considéraient
        disponibles.</p><p><strong>Fonction :</strong> Installer le thème de
        l'exploitation de la terre sans donner d'information sur
        Ragefire.</p><h2>Les paroles des Grimtotem</h2><p>Des propos hostiles
        aux travaux et à l'alliance de Cairne avec Thrall circulent. Tout le
        monde conclut rapidement qu'un Grimtotem en est à l'origine, mais
        personne n'en a la preuve.</p><p><strong>Fonction :</strong> Créer une
        hypothèse politique crédible, pas une solution automatique.</p>
