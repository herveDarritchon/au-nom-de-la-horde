  - name: Derrière les rumeurs — MJ
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Ce qu'il y a réellement derrière les rumeurs</h1>

        <p><strong>Réservé au MJ.</strong> La rumeur n'est jamais une vérité
        brute : même lorsqu'elle est correcte, elle reste partielle, interprétée
        ou sortie de son contexte.</p>

        <table>

        <thead><tr><th>#</th><th>Statut</th><th>Réalité</th><th>Usage</th></tr></thead>

        <tbody><tr><td
        style="text-align:center"><strong>1</strong></td><td><strong>Vraie mais
        banale en apparence</strong></td><td>Le matériel est réellement destiné
        à des travaux liés au nord. Ce détail ne devient important que lorsque
        les PJ constatent que les sabotages ciblent précisément ce type
        d'équipement.</td><td>Fil rouge / logistique</td></tr><tr><td
        style="text-align:center"><strong>2</strong></td><td><strong>Vraie</strong></td><td>Le
        déplacement des scorpides et d'autres bêtes est anormal. Le Thunderhorn
        ne connaît pas la cause et peut très bien se tromper dans son
        interprétation.</td><td>Environnement / symptôme</td></tr><tr><td
        style="text-align:center"><strong>3</strong></td><td><strong>Vraie mais
        obscure</strong></td><td>Le chaman perçoit une perturbation réelle dans
        la zone. Il n'est pas capable d'en donner l'origine ni de relier cela à
        Ragefire.</td><td>Spirituel / présage sans révélation</td></tr><tr><td
        style="text-align:center"><strong>4</strong></td><td><strong>Vraie</strong></td><td>Certaines
        bêtes fuient effectivement leurs territoires habituels. Le Runetotem
        veut éviter que la Horde ne traite le symptôme en massacrant les animaux
        déplacés.</td><td>Choix / nature</td></tr><tr><td
        style="text-align:center"><strong>5</strong></td><td><strong>Vraie</strong></td><td>Le
        cavalier est vivant mais isolé dans un ravin. Il a aperçu un passage
        discret et des mouvements inhabituels avant sa
        chute.</td><td>Exploration / raccourci</td></tr><tr><td
        style="text-align:center"><strong>6</strong></td><td><strong>Vraie et
        importante</strong></td><td>Les voleurs ont volontairement laissé
        l'argent, les vivres et la plupart des armes. Les outils de forage, de
        soutènement et d'excavation étaient la cible.</td><td>Fil rouge
        direct</td></tr><tr><td
        style="text-align:center"><strong>7</strong></td><td><strong>Vraie,
        conclusion fausse</strong></td><td>Il n'y a pas d'épidémie à Thunder
        Bluff. Une Winterhoof étudie plusieurs plantes de Durotar dont les
        propriétés semblent changer.</td><td>Faune &amp; flore /
        enquête</td></tr><tr><td
        style="text-align:center"><strong>8</strong></td><td><strong>Vraie</strong></td><td>Le
        Ragetotem veut réellement aider. Le problème est politique et culturel :
        certains Grunts prennent son offre comme une remise en cause de leur
        capacité à tenir Durotar.</td><td>Social / Horde</td></tr><tr><td
        style="text-align:center"><strong>9</strong></td><td><strong>Opinion
        fondée sur une expérience réelle</strong></td><td>Le Stonespire ne sait
        rien du danger sous Orgrimmar. Son récit sert de miroir thématique :
        construire, creuser et s'approprier une terre ne sont jamais des gestes
        neutres.</td><td>Thème / foreshadowing</td></tr><tr><td
        style="text-align:center"><strong>10</strong></td><td><strong>Incertaine</strong></td><td>Aucune
        preuve ne confirme la présence d'un Grimtotem. La rumeur peut venir d'un
        véritable agent, d'un Tauren critique, d'un saboteur qui exploite leur
        réputation ou d'une simple déformation collective.</td><td>Fausse piste
        / politique</td></tr></tbody>

        </table>
