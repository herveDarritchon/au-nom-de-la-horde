  - name: Rumeurs à faire entendre
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Rumeurs à Razor Hill</h1>

        <p>Lance <strong>1d10</strong> ou choisis la rumeur la plus adaptée à
        l'état actuel de Durotar.</p>

        <table>

        <thead><tr><th>d10</th><th>Tribu</th><th>Rumeur</th></tr></thead>

        <tbody><tr><td
        style="text-align:center"><strong>1</strong></td><td><strong>Stonehoof</strong></td><td>«
        Trois kodos de Thunder Bluff sont arrivés hier. Ils transportaient assez
        de fer pour construire un pont. Tout est parti vers Orgrimmar.
        »</td></tr><tr><td
        style="text-align:center"><strong>2</strong></td><td><strong>Thunderhorn</strong></td><td>«
        Le grand Tauren au comptoir ? Un Thunderhorn. Il dit que les scorpides
        remontent vers les routes. Moi je dis qu'il a simplement perdu son
        flair. »</td></tr><tr><td
        style="text-align:center"><strong>3</strong></td><td><strong>Skychaser</strong></td><td>«
        Les chamans Skychaser n'aiment pas Thunder Ridge. Apparemment, le vent y
        parle de travers. »</td></tr><tr><td
        style="text-align:center"><strong>4</strong></td><td><strong>Runetotem</strong></td><td>«
        Un Runetotem a demandé qu'on arrête de tuer les bêtes qui descendent des
        collines. Il dit qu'elles ne chassent pas. Elles fuient.
        »</td></tr><tr><td
        style="text-align:center"><strong>5</strong></td><td><strong>Wildmane</strong></td><td>«
        Ils ont retrouvé une wyverne Wildmane sans cavalier. La bête refusait de
        repartir vers le nord. »</td></tr><tr><td
        style="text-align:center"><strong>6</strong></td><td><strong>Stonehoof</strong></td><td>«
        Les Stonehoof ont perdu une cargaison entière. Pas une pièce d'or volée.
        Seulement les outils. Des voleurs bien étranges. »</td></tr><tr><td
        style="text-align:center"><strong>7</strong></td><td><strong>Winterhoof</strong></td><td>«
        Les Winterhoof paient deux fois le prix habituel pour certaines racines
        de Durotar. Quelque chose doit se préparer à Thunder Bluff.
        »</td></tr><tr><td
        style="text-align:center"><strong>8</strong></td><td><strong>Ragetotem</strong></td><td>«
        Un Ragetotem a proposé de garder la route lui-même. Les Grunts lui ont
        expliqué que Durotar n'avait pas besoin des Taurens pour être défendu.
        Ça a failli finir avec les tables par terre. »</td></tr><tr><td
        style="text-align:center"><strong>9</strong></td><td><strong>Stonespire</strong></td><td>«
        Le vieux Stonespire dit que chaque fois qu'un peuple commence à creuser
        sous les pieds des autres, quelqu'un finit par mourir. Charmant
        compagnon de boisson. »</td></tr><tr><td
        style="text-align:center"><strong>10</strong></td><td><strong>Grimtotem</strong></td><td>«
        On raconte qu'un Grimtotem est passé par ici. Personne ne l'a vu,
        évidemment. Mais depuis quand faut-il voir quelqu'un pour savoir qu'il
        est coupable ? »</td></tr></tbody>

        </table>

        <h2>Variantes de mise en scène</h2>

        <p>Une rumeur peut être entendue dans l'auberge, au marché, auprès d'un
        garde, pendant le déchargement d'un convoi, autour d'un feu de camp ou
        durant une halte sur la route.</p>

        <p><strong>Conseil :</strong> ne demande pas de jet pour « trouver une
        rumeur ». Si elle doit être en circulation, les PJ l'entendent. Les jets
        servent ensuite à enquêter, vérifier, pister, convaincre ou
        interpréter.</p>
