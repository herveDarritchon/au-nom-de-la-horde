        <h1>Rumeurs taurènes de Durotar</h1>

        <p><strong>Fonction :</strong> faire sentir que Durotar appartient à un
        monde plus vaste et que des Taurens de Mulgore, Thunder Bluff et des
        Tarides traversent réellement les routes de la Horde.</p>

        <p>Ces rumeurs ne sont pas des quêtes à distribuer. Elles servent à
        <strong>amorcer une piste, annoncer une conséquence, faire exister une
        tribu</strong> ou introduire un doute.</p>

        <h2>Règle simple</h2>

        <ul>

        <li>À chaque retour important à Razor Hill, choisis <strong>1 ou 2
        rumeurs maximum</strong>.</li>

        <li>Ne précise jamais immédiatement si elles sont vraies.</li>

        <li>Une rumeur ignorée peut revenir plus tard, déformée ou
        aggravée.</li>

        <li>Les rumeurs taurènes ne doivent pas toutes pointer vers le fil rouge
        : certaines sont locales, culturelles ou fausses.</li>

        <li>Si les PJ s'intéressent à une rumeur, transforme-la en
        <strong>situation</strong>, pas en objectif imposé.</li>

        </ul>

        <p><em>Tout le contenu ci-dessous est une adaptation Warbound pour la
        campagne ; ce ne sont pas des événements canoniques de WoW
        Classic.</em></p>
