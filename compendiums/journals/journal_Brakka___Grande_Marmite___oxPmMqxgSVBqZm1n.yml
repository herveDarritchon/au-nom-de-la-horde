  - name: 01 · Portrait et accroche
    type: text
    sort: 100000
    text:
      format: 1
      content: >-
        <h1>Brakka « Grande-Marmite »</h1><p><em>Adaptation Warbound · Vallée
        des Épreuves · Journal MJ</em></p><blockquote><p>« Assieds-toi. Mange.
        Après, tu pourras m’expliquer pourquoi tu veux casser la tête de
        quelqu’un. »</p></blockquote><h2>En un
        regard</h2><dl><dt><p><strong>Rôle</strong></p></dt><dd><p>La cuisinière
        · solidarité /
        médiation</p></dd><dt><p><strong>Aspect</strong></p></dt><dd><p>Orque
        robuste au rire sonore, tablier de travail taché de farine et de
        poussière. Une grande louche lui sert à distribuer le repas autant qu’à
        interrompre les
        disputes.</p></dd><dt><p><strong>Désir</strong></p></dt><dd><p>Tenir un
        petit établissement où chacun peut manger chaud, idéalement à
        Tranchecolline.</p></dd><dt><p><strong>Crainte</strong></p></dt><dd><p>Devoir
        choisir entre nourrir ses amis et préserver les maigres réserves
        nécessaires à son
        projet.</p></dd><dt><p><strong>Défaut</strong></p></dt><dd><p>Elle
        couvre les bêtises de ses proches, surtout de Grubnak, quitte à être
        injuste avec les autres.</p></dd></dl><h2>Première impression à la
        table</h2><p>Elle accueille les PJ quel que soit leur rang, mais n’aime
        pas qu’on transforme sa table en interrogatoire. Un repas partagé est un
        geste plus fort qu’un discours.</p><h2>Contact avec les PJ</h2><p>Un
        repas préparé ensemble, une recette ratée, un mot de réconfort ou une
        vieille promesse échangée près du feu.</p><p><em>Statut : PNJ original
        de la campagne. Repère canonique du secteur : le contremaître Thazz’rill
        et les péons de la Vallée.</em></p>
