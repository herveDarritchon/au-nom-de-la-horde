  - name: 02 · Jouer ce péon
    type: text
    sort: 200000
    text:
      format: 1
      content: >-
        <h1>Interprétation et liens</h1><h2>Comment l’incarner</h2><p>Elle
        accueille les PJ quel que soit leur rang, mais n’aime pas qu’on
        transforme sa table en interrogatoire. Un repas partagé est un geste
        plus fort qu’un discours.</p><h2>Ce qu’il sait, croit et
        dissimule</h2><dl><dt><strong>Sait</strong></dt><dd>Les affinités,
        rancunes, espoirs et habitudes des péons. Elle ne révèle pas les
        confidences sans raison
        personnelle.</dd><dt><strong>Croit</strong></dt><dd>Qu’une table commune
        peut désamorcer presque toutes les querelles ; certaines demandent
        pourtant de vrais actes.</dd><dt><strong>Cache</strong></dt><dd>Elle
        puise parfois dans ses réserves personnelles pour donner à manger à ceux
        qui n’ont rien, et en fait porter la responsabilité à des « pertes
        ».</dd></dl><h2>Son
        entourage</h2><table><thead><tr><th>Personne</th><th>Relation
        actuelle</th></tr></thead><tbody><tr><td>Grubnak</td><td>Ami de longue
        date qu’elle protège un peu trop.</td></tr><tr><td>Dorga</td><td>Lui
        garde une portion et voit son
        épuisement.</td></tr><tr><td>Mogra</td><td>Admire son exigence, redoute
        son caractère entier.</td></tr><tr><td>Zugmog</td><td>Le nourrit et rit
        de ses récits héroïques.</td></tr></tbody></table><h2>Une phrase à
        placer</h2><blockquote><p>« Assieds-toi. Mange. Après, tu pourras
        m’expliquer pourquoi tu veux casser la tête de quelqu’un.
        »</p></blockquote>
