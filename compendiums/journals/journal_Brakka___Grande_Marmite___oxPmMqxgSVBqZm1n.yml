  - name: 03 · Scènes et réactions
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>Scènes et décisions</h1><h2>Trois occasions de jeu</h2><h3>Le ragoût
        du soir</h3><p>Au feu commun, chacun raconte ses exploits. Zugmog
        interroge les PJ ; Grubnak invente une victoire contre un
        ogre.</p><h3>Le repas manquant</h3><p>Elle découvre que les portions
        sont insuffisantes et doit décider qui sera servi en premier ; les PJ
        peuvent aider ou regarder.</p><h3>La confidence</h3><p>Elle sait
        pourquoi deux péons se sont disputés, mais demande aux PJ ce qu’ils
        comptent faire de cette information.</p><h2>Réactions à quelques choix
        des PJ</h2><table><thead><tr><th>Approche des PJ</th><th>Réaction ou
        conséquence</th></tr></thead><tbody><tr><td>Respecter ses
        confidences</td><td>Elle devient un contact discret et accueille les PJ
        comme des proches.</td></tr><tr><td>Exiger des informations au nom de
        l’autorité</td><td>Elle peut révéler uniquement des faits publics puis
        fermer sa table aux intrusifs.</td></tr><tr><td>L’aider à devenir
        indépendante</td><td>Elle accepte une aide, à condition de rester
        maîtresse de son établissement.</td></tr></tbody></table><h2>Si les PJ
        n’interviennent pas</h2><p>Elle nourrit toujours les autres au détriment
        de ses économies ; son rêve s’éloigne sans qu’elle cesse de sourire
        devant ses invités.</p><p><em>Ces scènes sont des opportunités, pas une
        suite de quêtes imposées. Elles peuvent se résoudre sans jet de
        dés.</em></p>
