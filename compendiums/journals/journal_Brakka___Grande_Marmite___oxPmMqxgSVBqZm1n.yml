  - name: 04 · Secrets et devenir (MJ)
    type: text
    sort: 400000
    text:
      format: 1
      content: >-
        <h1>MJ — Secrets et continuité</h1><h2>Vérité / point de
        vigilance</h2><p>Ne fais pas de Brakka une machine à révéler des
        secrets. Elle protège ses amis, peut se tromper et pourrait refuser une
        demande des PJ pour préserver la confiance de sa communauté.</p><h2>Ce
        que le PNJ ne dit pas spontanément</h2><p>Elle puise parfois dans ses
        réserves personnelles pour donner à manger à ceux qui n’ont rien, et en
        fait porter la responsabilité à des « pertes ».</p><h2>Évolution
        envisageable</h2><p>Sa future table à Tranchecolline peut devenir un
        point de retour chaleureux, sans servir artificiellement de « panneau de
        quêtes ».</p><h2>Fil de mémoire des PJ</h2><ul><li>Qui lui a parlé avec
        respect, et qui l’a humilié ?</li><li>Quelle promesse les PJ ont-ils
        faite ?</li><li>Quelle décision des PJ a réellement changé sa vie
        ?</li><li>Que demandera-t-il aux PJ la prochaine fois qu’ils se
        croiseront ?</li></ul><h2>Continuité ouverte</h2><p>Les événements
        ci-dessus sont des propositions. Les faits établis pendant la partie
        priment sur cette préparation. L’amitié, l’hostilité et le destin de ce
        péon ne sont pas décidés à l’avance.</p>
