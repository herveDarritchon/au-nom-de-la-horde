  - _id: 79c307bdfd552708
    name: Troll Darkspear
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/83/wallhaven-83ok5k.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="en-une-phrase">En une phrase</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/race_troll_male.jpg"
        alt="Troll" width="80">

        <p>Un survivant d'un peuple chassé de ses terres, désormais allié aux
        Orcs : rapide, résilient, profondément attaché à sa tribu et à des
        traditions que la nouvelle Horde ne comprend pas toujours.</p>

        <h2 id="place-dans-la-campagne">Place dans la campagne</h2>

        <p><strong>Statut : race standard de la campagne.</strong></p>

        <p>Les Trolls Darkspear sont directement liés à Durotar et à la Horde de
        Thrall. Leur présence autour de Sen'jin et dans le sud de la région en
        fait un choix aussi naturel qu'un Orc pour commencer la campagne.</p>

        <p>Dans <em>Champions of Azeroth</em>, on utilise le <strong>Jungle
        Troll</strong>, qui correspond bien aux Darkspear.</p>

        <h2 id="identité-warcraft">Identité Warcraft</h2>

        <p>Les Darkspear viennent des jungles de Strangleronce. Repoussés par
        des ennemis plus puissants, ils ont finalement rencontré les Orcs de
        Thrall et les ont suivis jusqu'en Kalimdor.</p>

        <p>Ils restent attachés à leurs pratiques propres, notamment la chasse,
        les traditions tribales et les rites liés aux <strong>Loa</strong>. Leur
        intégration à la Horde ne signifie pas qu'ils aient abandonné leur
        culture.</p>

        <h2 id="traits-mécaniques-marquants">Traits mécaniques marquants</h2>

        <ul>

        <li><strong>Dextérité +2</strong>.</li>

        <li>Le Jungle Troll choisit ensuite <strong>Sagesse +1</strong> ou
        <strong>Charisme +1</strong>.</li>

        <li><strong>Darkvision</strong>.</li>

        <li><strong>Regeneration</strong> : possibilité de dépenser un dé de vie
        en action bonus pour récupérer des PV ; la physiologie troll permet
        également la régénération de blessures graves sur la durée.</li>

        <li><strong>Da Voodoo Shuffle</strong> : vitesse accrue et déplacement
        facilité dans le terrain difficile non magique.</li>

        <li><strong>Headhunter</strong> : maîtrise d'une compétence parmi
        Nature, Perception, Stealth ou Survival.</li>

        <li><strong>Savage Attacks</strong> : critiques de mêlée plus
        violents.</li>

        <li>Langues : <strong>Orcish</strong> et <strong>Zandali</strong>.</li>

        </ul>

        <h2 id="classes-disponibles-dans-cette-campagne">Classes disponibles
        dans cette campagne</h2>

        <ul>

        <li><strong>Chasseur</strong></li>

        <li><strong>Mage</strong></li>

        <li><strong>Prêtre</strong></li>

        <li><strong>Voleur</strong></li>

        <li><strong>Chaman</strong></li>

        <li><strong>Guerrier</strong></li>

        </ul>

        <h2 id="ce-que-cette-race-encourage-naturellement">Ce que cette race
        encourage naturellement</h2>

        <p>Le Troll Darkspear convient bien à un personnage :</p>

        <ul>

        <li>pisteur, chasseur ou éclaireur ;</li>

        <li>lié aux Loa, à la spiritualité ou aux traditions de sa tribu ;</li>

        <li>partagé entre fidélité à la Horde et fidélité aux Darkspear ;</li>

        <li>habitué à vivre dans un environnement rude ;</li>

        <li>pragmatique face à la magie, aux esprits et aux pratiques que
        d'autres peuples jugent inquiétantes.</li>

        </ul>

        <h2 id="questions-de-background">Questions de background</h2>

        <ol>

        <li>Ton personnage a-t-il connu l'exil des Darkspear avant leur arrivée
        en Kalimdor ?</li>

        <li>Quel Loa respecte-t-il particulièrement, s'il en respecte un ?</li>

        <li>Comment voit-il l'alliance avec les Orcs ?</li>

        <li>Que pense-t-il des anciennes pratiques de sa tribu que la Horde
        pourrait trouver dérangeantes ?</li>

        <li>Sen'jin représente-t-il pour lui un foyer, une étape ou un symbole
        ?</li>

        <li>Quelle dette, promesse ou responsabilité le lie aux siens ?</li>

        </ol>

        <h2 id="dans-une-campagne-à-durotar">Dans une campagne à Durotar</h2>

        <p>Un Troll peut servir de pont entre Razor Hill et Sen'jin, mais il ne
        faut pas le réduire au rôle de « guide mystique ». Il peut être
        guerrier, opportuniste, érudit, voleur ou simple membre de la Horde
        comme n'importe quel autre PJ.</p>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>p.
        11</strong> — Troll / Jungle Troll.</li>

        </ul>
