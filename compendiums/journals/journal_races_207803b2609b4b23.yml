  - _id: 198016c647287ba8
    name: Tauren de Mulgore
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/nm/wallhaven-nm9zom.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="en-une-phrase">En une phrase</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/race_tauren_male.jpg"
        alt="Tauren" width="80">

        <p>Un membre d'un peuple puissant mais pacifique, allié à la Horde par
        dette et par amitié, qui cherche à préserver l'équilibre du monde tout
        en défendant farouchement ceux dont il a la charge.</p>

        <h2 id="place-dans-la-campagne">Place dans la campagne</h2>

        <p><strong>Statut : race standard de la campagne.</strong></p>

        <p>Les Taurens appartiennent déjà à la Horde, mais leur foyer est
        <strong>Mulgore</strong>. Un PJ tauren présent en Durotar doit donc
        simplement expliquer pourquoi il voyage ou sert auprès des Orcs et des
        Trolls.</p>

        <p>La sous-race utilisée est le <strong>Mulgore Tauren</strong>.</p>

        <h2 id="identité-warcraft">Identité Warcraft</h2>

        <p><em>Champions of Azeroth</em> insiste sur le rapport des Taurens à la
        nature, à l'équilibre et à la <strong>Earth Mother</strong>. L'alliance
        avec les Orcs vient du secours apporté par ceux-ci face aux
        Centaures.</p>

        <p>Le texte les décrit comme pacifiques mais redoutables lorsqu'ils
        doivent défendre leurs proches ou l'ordre naturel.</p>

        <h2 id="traits-mécaniques-marquants">Traits mécaniques marquants</h2>

        <ul>

        <li><strong>Constitution +2</strong>.</li>

        <li>Le Mulgore Tauren choisit <strong>Force +1</strong> ou
        <strong>Sagesse +1</strong>.</li>

        <li><strong>Brawn</strong> : compte comme une taille de plus pour la
        capacité de portage et les efforts de poussée/traction.</li>

        <li><strong>Horns</strong> : cornes utilisables comme armes
        naturelles.</li>

        <li><strong>Hammering Horns</strong> : possibilité de repousser un
        adversaire après une attaque de mêlée.</li>

        <li>Maîtrise de <strong>leatherworker's tools</strong> ou du
        <strong>herbalism kit</strong>.</li>

        <li><strong>Endurance</strong> : maximum de PV augmenté à chaque
        niveau.</li>

        <li><strong>War Stomp</strong> : accès racial à <em>earth tremor</em>,
        renforcé par le niveau du personnage.</li>

        <li>Langues : <strong>Orcish</strong> et <strong>Taur-ahe</strong>.</li>

        </ul>

        <h2 id="classes-disponibles-dans-cette-campagne">Classes disponibles
        dans cette campagne</h2>

        <ul>

        <li><strong>Druide</strong></li>

        <li><strong>Chasseur</strong></li>

        <li><strong>Chaman</strong></li>

        <li><strong>Guerrier</strong></li>

        </ul>

        <h2 id="ce-que-cette-race-encourage-naturellement">Ce que cette race
        encourage naturellement</h2>

        <p>Le Tauren est particulièrement adapté à un personnage lié à :</p>

        <ul>

        <li>la protection d'une communauté ;</li>

        <li>la nature et aux animaux ;</li>

        <li>la spiritualité élémentaire ;</li>

        <li>l'artisanat et aux ressources naturelles ;</li>

        <li>une réflexion sur ce que signifie bâtir, exploiter ou transformer
        une terre.</li>

        </ul>

        <h2 id="questions-de-background">Questions de background</h2>

        <ol>

        <li>Pourquoi ton personnage a-t-il quitté Mulgore ?</li>

        <li>A-t-il une dette personnelle envers les Orcs, ou seulement la
        mémoire de la dette de son peuple ?</li>

        <li>Quelle place occupe la Earth Mother dans sa vie ?</li>

        <li>Est-il plutôt protecteur, chasseur, guide, guerrier ou médiateur
        ?</li>

        <li>Comment réagit-il à la rudesse et à l'exploitation intensive de
        Durotar ?</li>

        <li>Que pense-t-il de la culture plus belliqueuse de certains membres de
        la Horde ?</li>

        </ol>

        <h2 id="dans-une-campagne-à-durotar">Dans une campagne à Durotar</h2>

        <p>Le Tauren est un excellent point de vue extérieur mais allié : il
        appartient pleinement à la Horde, tout en venant d'un territoire et
        d'une culture différents. Cette position permet de questionner les choix
        de la Horde sans jouer un étranger hostile.</p>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>p.
        10</strong> — Tauren / Mulgore Tauren.</li>

        </ul>
