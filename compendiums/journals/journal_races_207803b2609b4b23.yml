  - _id: 057a2594854d9aaf
    name: Orc de Durotar
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/vg/wallhaven-vgy193.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="en-une-phrase">En une phrase</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/race_orc_male.jpg"
        alt="Orc" width="80">

        <p>Un membre du peuple qui vient de fonder Durotar : robuste, martial,
        marqué par l'histoire de la Horde et déterminé à construire un nouveau
        foyer sans retomber sous l'emprise démoniaque.</p>

        <h2 id="place-dans-la-campagne">Place dans la campagne</h2>

        <p><strong>Statut : race standard de la campagne.</strong></p>

        <p>Les Orcs sont le choix le plus directement enraciné dans le cadre de
        départ. Durotar est leur nouvelle patrie et Orgrimmar leur capitale. Un
        Orc n'a donc pas besoin d'une justification particulière pour se trouver
        à Razor Hill ou sur les routes de la région.</p>

        <p>Dans <em>Champions of Azeroth</em>, la sous-race utilisée est le
        <strong>Durotar Orc</strong>.</p>

        <h2 id="identité-warcraft">Identité Warcraft</h2>

        <p>Le texte de <em>Champions of Azeroth</em> présente les Orcs comme un
        peuple originaire de Draenor, autrefois asservi par la Légion ardente et
        poussé à la guerre contre Azeroth. Libérés de cette corruption, ils
        cherchent désormais à vivre selon leurs propres valeurs, avec une forte
        importance donnée à l'honneur, à la force et à la liberté.</p>

        <p>Le <strong>Durotar Orc</strong> représente précisément cette
        génération installée dans la nouvelle nation fondée par Thrall après la
        Troisième Guerre.</p>

        <h2 id="traits-mécaniques-marquants">Traits mécaniques marquants</h2>

        <ul>

        <li><strong>Force +2</strong>.</li>

        <li>Le Durotar Orc choisit ensuite <strong>Constitution +1</strong> ou
        <strong>Sagesse +1</strong>.</li>

        <li><strong>Hardiness</strong> : résistance exceptionnelle à
        l'épuisement.</li>

        <li><strong>Relentless Endurance</strong> : capacité à rester debout
        lorsqu'un coup devrait normalement mettre le personnage à 0 PV.</li>

        <li><strong>Blood Fury</strong> à partir du niveau 3 : manifestation
        temporaire de la férocité orque, capable d'effrayer les ennemis proches
        et d'augmenter les dégâts infligés.</li>

        <li><strong>Rugged Survivalist</strong> : maîtrise d'une compétence
        parmi Animal Handling, Athletics, Intimidation ou Survival.</li>

        <li>Langues : <strong>Orcish</strong> + une langue supplémentaire.</li>

        </ul>

        <h2 id="classes-disponibles-dans-cette-campagne">Classes disponibles
        dans cette campagne</h2>

        <ul>

        <li><strong>Chasseur</strong></li>

        <li><strong>Voleur</strong></li>

        <li><strong>Chaman</strong></li>

        <li><strong>Démoniste</strong></li>

        <li><strong>Guerrier</strong></li>

        </ul>

        <blockquote>

        <p><em>Champions of Azeroth</em> ne fixe pas lui-même de restrictions
        race/classe universelles. La liste ci-dessus est la restriction retenue
        pour cette campagne située dans la période Classic.</p>

        </blockquote>

        <h2 id="ce-que-cette-race-encourage-naturellement">Ce que cette race
        encourage naturellement</h2>

        <p>L'Orc fonctionne particulièrement bien pour un personnage lié à :</p>

        <ul>

        <li>l'armée ou aux gardes de la Horde ;</li>

        <li>la chasse et la survie dans une terre hostile ;</li>

        <li>les traditions chamaniques ;</li>

        <li>les tensions entre honneur, colère et héritage de la corruption
        ;</li>

        <li>la construction concrète du nouveau foyer de la Horde.</li>

        </ul>

        <h2 id="questions-de-background">Questions de background</h2>

        <ol>

        <li>Ton personnage est-il né sur Draenor, dans les camps d'internement,
        ou après la libération des Orcs ?</li>

        <li>Quelle relation entretient-il avec Thrall et sa vision de la
        nouvelle Horde ?</li>

        <li>Que signifie <strong>l'honneur</strong> pour lui ?</li>

        <li>A-t-il personnellement connu ou subi la corruption démoniaque ?</li>

        <li>Que pense-t-il des Trolls Darkspear, des Taurens et des Réprouvés
        ?</li>

        <li>Quelle place souhaite-t-il prendre dans la construction de Durotar
        ?</li>

        </ol>

        <h2 id="dans-une-campagne-à-durotar">Dans une campagne à Durotar</h2>

        <p>Un Orc peut très naturellement connaître les usages militaires, les
        routes, les besoins des avant-postes, les problèmes de ravitaillement ou
        la culture quotidienne de la Horde. Cela ne lui donne pas
        automatiquement toutes les réponses : Durotar reste une terre nouvelle,
        rude et encore imparfaitement maîtrisée.</p>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>p.
        8</strong> — Orc / Durotar Orc.</li>

        </ul>
