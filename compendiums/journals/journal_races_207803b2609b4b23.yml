  - _id: c165cf43ff3c8454
    name: Réprouvé — Mort-vivant humain
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/nm/wallhaven-nm9zk8.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="en-une-phrase">En une phrase</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/race_scourge_male.jpg"
        alt="Réprouvé" width="80">

        <p>Un ancien humain revenu d'entre les morts, libéré du Roi-liche et
        désormais membre d'une société qui cherche à survivre dans un monde qui
        la craint et la hait.</p>

        <h2 id="place-dans-la-campagne">Place dans la campagne</h2>

        <p><strong>Statut : race standard de la campagne.</strong></p>

        <p>Les Réprouvés appartiennent à la Horde, mais leur centre de pouvoir
        se trouve dans les Royaumes de l'Est. Un PJ réprouvé présent en Durotar
        doit donc expliquer son voyage en Kalimdor : mission, curiosité, intérêt
        politique, étude, fuite ou choix personnel.</p>

        <p>Dans <em>Champions of Azeroth</em>, on utilise la race
        <strong>Undead</strong> avec la sous-race <strong>Undead
        Human</strong>.</p>

        <h2 id="identité-warcraft">Identité Warcraft</h2>

        <p>Libérés de l'emprise du Roi-liche et dirigés par Sylvanas, les
        Forsaken cherchent à se venger du Fléau et à survivre face aux vivants
        qui les considèrent souvent comme des monstres.</p>

        <p>Le livre souligne que leur rapport à la Horde peut varier : pour
        certains, il s'agit d'une alliance pratique ; pour d'autres, c'est
        réellement le premier foyer qui les accepte depuis leur mort.</p>

        <h2 id="traits-mécaniques-marquants">Traits mécaniques marquants</h2>

        <ul>

        <li>Race de base : <strong>Constitution +1</strong>.</li>

        <li>Sous-race Undead Human : <strong>+1 à trois caractéristiques
        différentes de votre choix</strong>.</li>

        <li><strong>Darkvision</strong>.</li>

        <li><strong>Undead Nature</strong> : le personnage est à la fois
        Humanoid et Undead pour les effets de règles.</li>

        <li>Avantage contre maladie et poison, résistance aux dégâts de
        poison.</li>

        <li>Avantage aux jets de sauvegarde contre la mort.</li>

        <li>Pas besoin de manger, boire ou respirer.</li>

        <li>Pas besoin de dormir ; repos long possible en restant immobile et
        conscient.</li>

        <li><strong>The Human Spirit</strong> : lorsqu'un d20 donne 1 sur une
        attaque, un test ou un jet de sauvegarde, possibilité de relancer.</li>

        <li>Langues : <strong>Orcish</strong> et
        <strong>Gutterspeak</strong>.</li>

        </ul>

        <h2 id="classes-disponibles-dans-cette-campagne">Classes disponibles
        dans cette campagne</h2>

        <ul>

        <li><strong>Mage</strong></li>

        <li><strong>Prêtre</strong></li>

        <li><strong>Voleur</strong></li>

        <li><strong>Démoniste</strong></li>

        <li><strong>Guerrier</strong></li>

        </ul>

        <h2 id="ce-que-cette-race-encourage-naturellement">Ce que cette race
        encourage naturellement</h2>

        <p>Le Réprouvé fonctionne particulièrement bien pour explorer :</p>

        <ul>

        <li>la mémoire de la vie avant la mort ;</li>

        <li>le rapport entre identité humaine et existence morte-vivante ;</li>

        <li>la confiance difficile entre alliés ;</li>

        <li>la vengeance contre le Fléau ;</li>

        <li>l'utilisation pragmatique de savoirs ou de méthodes que d'autres
        jugent inquiétants.</li>

        </ul>

        <h2 id="questions-de-background">Questions de background</h2>

        <ol>

        <li>Qui étais-tu avant ta mort ?</li>

        <li>Comment es-tu mort ?</li>

        <li>Que te reste-t-il de ta vie humaine ?</li>

        <li>Pourquoi as-tu choisi de rester avec les Forsaken ?</li>

        <li>Que représente la Horde pour toi : une alliance, une nécessité ou
        une nouvelle famille ?</li>

        <li>Pourquoi es-tu en Kalimdor ?</li>

        <li>Comment réagis-tu lorsqu'un vivant te traite comme un monstre ?</li>

        </ol>

        <h2 id="dans-une-campagne-à-durotar">Dans une campagne à Durotar</h2>

        <p>Un Réprouvé est rare sans être anormal. Son arrivée permet de montrer
        que la Horde est déjà une coalition de peuples très différents, mais il
        doit avoir une raison personnelle d'être aussi loin de Lordaeron.</p>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>p.
        9</strong> — Undead / Undead Human.</li>

        </ul>
      format: 1
    sort: 100000
