  - _id: 19639595858e1528
    name: Sin'dorei — Elfe de sang de Lune-d'Argent
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/x8/wallhaven-x8ylr3.png"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="en-une-phrase">En une phrase</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/race_bloodelf_male.jpg"
        alt="Sin'dorei" width="80">

        <p>Un survivant de Quel'Thalas, ancien Haut-Elfe désormais sin'dorei,
        qui porte encore l'héritage d'un royaume dévasté et cherche sa place
        dans un monde bouleversé.</p>

        <h2 id="place-dans-la-campagne">Place dans la campagne</h2>

        <p><strong>Statut : exception spécifique à la campagne.</strong></p>

        <p>Les Elfes de sang ne sont <strong>pas</strong> ouverts comme
        cinquième race standard de la Horde. Cette fiche existe uniquement pour
        permettre le concept déjà validé de <strong>Paladin
        sin'dorei</strong>.</p>

        <p>Mécaniquement :</p>

        <ul>

        <li>race <strong>Blood Elf</strong> ;</li>

        <li>sous-race <strong>Silvermoon Blood Elf</strong> ;</li>

        <li>source : <em>Champions of Outland</em> ;</li>

        <li>seule classe ouverte dans cette campagne : <strong>Paladin</strong>
        de <em>Champions of Azeroth</em>.</li>

        </ul>

        <p>Le personnage est un ancien Haut-Elfe formé à la Lumière avant ou
        pendant la Troisième Guerre. Il n'est pas obligé d'être un Blood Knight
        et ne représente pas une alliance politique générale entre Quel'Thalas
        et la Horde.</p>

        <h2 id="identité-warcraft-selon-champions-of-outland">Identité Warcraft
        selon Champions of Outland</h2>

        <p>Le supplément présente les Blood Elves comme les survivants de
        Quel'Thalas après l'invasion du Fléau et la destruction du Puits de
        soleil. Ils cherchent à reconstruire leur civilisation et à retrouver
        des sources de puissance arcanique.</p>

        <p>Le <strong>Silvermoon Blood Elf</strong> représente les sin'dorei
        liés à Lune-d'Argent, particulièrement connus pour leur culture et leur
        expertise magique.</p>

        <h2 id="traits-mécaniques-marquants">Traits mécaniques marquants</h2>

        <ul>

        <li><strong>Dextérité +2</strong>.</li>

        <li>Silvermoon Blood Elf : <strong>Intelligence +1</strong> ou
        <strong>Charisme +1</strong>.</li>

        <li><strong>Darkvision</strong>.</li>

        <li><strong>Elven Cunning</strong> : avantage pour résister aux
        enchantements et illusions.</li>

        <li><strong>Arcane Resistance</strong> : résistance aux dégâts de
        force.</li>

        <li><strong>Learned</strong> : maîtrise d'une compétence parmi Arcana,
        History, Nature ou Religion.</li>

        <li><strong>Arcane Affinity</strong> : un cantrip de mage et accès
        racial à <em>detect magic</em>.</li>

        <li>Langues : <strong>Orcish</strong> et
        <strong>Thalassian</strong>.</li>

        </ul>

        <p>Pour un Paladin, le choix de <strong>Charisme +1</strong> est
        mécaniquement naturel, sans être imposé.</p>

        <h2 id="classe-disponible-dans-cette-campagne">Classe disponible dans
        cette campagne</h2>

        <ul>

        <li><strong>Paladin uniquement</strong></li>

        </ul>

        <h2 id="ce-que-cette-option-encourage-naturellement">Ce que cette option
        encourage naturellement</h2>

        <p>Cette option est conçue pour un personnage qui porte plusieurs
        tensions :</p>

        <ul>

        <li>survivant d'une catastrophe récente ;</li>

        <li>héritier d'une tradition paladine antérieure à la chute de
        Quel'Thalas ;</li>

        <li>utilisateur de la Lumière dans une période de doute ;</li>

        <li>allié individuel de la Horde sans que celle-ci soit encore
        nécessairement « son peuple » ;</li>

        <li>étranger culturel au Durotar qu'il découvre.</li>

        </ul>

        <h2 id="questions-de-background">Questions de background</h2>

        <ol>

        <li>Qui t'a formé à la Lumière ?</li>

        <li>Où étais-tu lorsque le Fléau a détruit Quel'Thalas ?</li>

        <li>Qu'as-tu perdu pendant la chute ?</li>

        <li>Pourquoi continues-tu à servir la Lumière ?</li>

        <li>Pourquoi as-tu quitté Quel'Thalas ?</li>

        <li>Comment as-tu appris l'orc ?</li>

        <li>Pourquoi te trouves-tu maintenant en Durotar ?</li>

        <li>Que penses-tu des Orcs, des Trolls et des Réprouvés ?</li>

        </ol>

        <h2 id="ce-que-cette-option-nest-pas">Ce que cette option n'est pas</h2>

        <ul>

        <li>Elle ne rend pas les Elfes de sang normalement jouables dans toute
        la campagne.</li>

        <li>Elle ne crée pas une nouvelle classe de Paladin.</li>

        <li>Elle ne transforme pas le personnage en Blood Knight avant
        l'heure.</li>

        <li>Elle ne signifie pas que Quel'Thalas est déjà intégré politiquement
        à la Horde.</li>

        </ul>

        <h2 id="sources">Sources</h2>

        <ul>

        <li>Silverblade, <em>Champions of Outland</em>, 2 juin 2021, <strong>p.
        3</strong> — Blood Elf / Silvermoon Blood Elf.</li>

        <li>Document de campagne : <strong>Option de personnage — Paladin
        sin'dorei</strong>.</li>

        </ul>
