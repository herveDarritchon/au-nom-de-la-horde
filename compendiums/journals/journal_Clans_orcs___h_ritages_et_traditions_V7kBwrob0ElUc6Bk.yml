  - _id: 9fBw7kOQtD2vQpnc
    name: Frostwolf — Loup-de-givre
    type: text
    category: null
    text:
      content: >-
        <h1>Frostwolf — Loup-de-givre</h1>

        <p><strong>Figures de référence :</strong> Durotan, Thrall, Drek'Thar,
        Nazgrel.</p>

        <p><strong>Situation à l'époque de Classic :</strong> le clan
        Loup-de-givre reste une identité vivante. Drek'Thar dirige les Frostwolf
        de la vallée d'Alterac, tandis que Thrall et Nazgrel illustrent
        directement l'influence de cet héritage sur la Nouvelle Horde.</p>

        <h2>Héritage culturel</h2>

        <p>Le socle le plus sûr pour Warbound est celui d'un clan associé au
        <strong>chamanisme, à la communauté, au respect de la famille et à une
        relation étroite avec les loups</strong>. Thrall y retrouve les
        anciennes traditions spirituelles de son peuple sous l'enseignement de
        Drek'Thar.</p>

        <p>Dans une campagne Classic, le Frostwolf n'est pas « le clan gentil ».
        Son identité met plutôt l'accent sur une idée : <strong>la force doit
        servir le peuple au lieu de l'asservir</strong>.</p>

        <h2>Ce qu'un enfant Frostwolf pourrait avoir appris</h2>

        <ul>

        <li>La puissance d'un guerrier n'a de sens que si elle protège les
        siens.</li>

        <li>Les anciens et les chamans méritent d'être écoutés, même lorsqu'on
        décide finalement d'agir autrement.</li>

        <li>Un loup est un partenaire et un symbole de la communauté, pas
        seulement une monture.</li>

        <li>La corruption démoniaque fait partie de l'histoire orque : elle ne
        doit jamais être traitée comme une abstraction lointaine.</li>

        </ul>

        <h2>Tensions possibles</h2>

        <ul>

        <li>Admiration pour la fougue Warsong, mais crainte qu'elle ne
        redevienne incontrôlable.</li>

        <li>Méfiance envers les traditions liées aux démonistes et aux anciens
        serviteurs de la Légion.</li>

        <li>Difficulté à concilier spiritualité et construction rapide d'une
        nouvelle nation à Durotar.</li>

        </ul>

        <blockquote><p><strong>Piste de personnage :</strong> « On m'a appris
        que la rage est une force. On m'a aussi appris que celui qui ne la
        maîtrise pas finit par lui appartenir. »</p></blockquote>

        <p><em>Note de période :</em> de nombreux rites Frostwolf très détaillés
        ont été développés dans des œuvres et extensions postérieures. Warbound
        n'en fait pas automatiquement des traditions connues à l'époque de
        Classic.</p>
