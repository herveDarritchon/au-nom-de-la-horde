  - _id: mylyVbDi855rXggm
    name: Bleeding Hollow — Orbite-Sanglante
    type: text
    category: null
    text:
      content: >-
        <h1>Bleeding Hollow — Orbite-Sanglante</h1>

        <p><strong>Figure de référence :</strong> Kilrogg Deadeye.</p>

        <p><strong>Situation à l'époque de Classic :</strong> après la Deuxième
        Guerre, les membres restés sur Azeroth finirent par être capturés et
        enfermés dans les camps avant d'être libérés avec les autres Orcs de
        Thrall. D'autres survivants avaient regagné Draenor.</p>

        <h2>Héritage culturel</h2>

        <p>Les sources décrivent l'Orbite-Sanglante comme un clan
        <strong>endurci, superstitieux, très expérimenté dans la guerre, le raid
        et la reconnaissance</strong>. Son histoire est celle d'un clan qui a
        longtemps survécu dans des conditions extrêmes et dont le chef, Kilrogg,
        est devenu une figure légendaire de l'ancienne Horde.</p>

        <h2>Ce qu'un héritier pourrait avoir appris</h2>

        <ul>

        <li>Survivre aujourd'hui permet de choisir le combat de demain.</li>

        <li>Un présage n'est pas nécessairement un ordre, mais l'ignorer sans
        réfléchir est une forme d'orgueil.</li>

        <li>Un bon éclaireur vaut parfois davantage qu'une dizaine de guerriers
        arrivant trop tard.</li>

        <li>Les vétérans portent des souvenirs que la jeune Horde préférerait
        parfois oublier.</li>

        </ul>

        <h2>Prudence de lore</h2>

        <p>Les extensions ultérieures ont énormément développé les rites de
        sang, visions et pratiques occultes des Bleeding Hollow.
        <strong>Warbound ne considère pas automatiquement ces détails
        postérieurs — en particulier ceux liés au Draenor alternatif — comme la
        culture ordinaire d'un personnage de Durotar à l'époque
        Classic.</strong></p>

        <blockquote><p><strong>Piste de personnage :</strong> « Les autres
        appellent cela du fatalisme. Chez nous, on appelle cela regarder la mort
        en face et continuer d'avancer. »</p></blockquote>
