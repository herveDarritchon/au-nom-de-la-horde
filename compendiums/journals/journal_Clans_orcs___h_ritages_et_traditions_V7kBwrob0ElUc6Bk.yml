  - _id: H8s5JVT9Yre6LbkH
    name: Blackrock — Rochenoire
    type: text
    category: null
    text:
      content: >-
        <h1>Blackrock — Rochenoire</h1>

        <p><strong>Figures de référence :</strong> Blackhand, Orgrim Doomhammer,
        Eitrigg, Rend Blackhand.</p>

        <p><strong>Situation à l'époque de Classic :</strong> l'identité
        Blackrock est profondément divisée. Des Orcs issus du clan ont rejoint
        la Nouvelle Horde après leur libération, tandis que Rend Blackhand et
        ses partisans constituent encore une puissance hostile à Blackrock
        Spire.</p>

        <h2>Héritage culturel</h2>

        <p>Les Blackrock sont associés à une <strong>forte discipline militaire,
        à l'organisation, aux mines et à la forge</strong>. Le clan a fourni
        plusieurs figures majeures de l'ancienne Horde, dont Blackhand et Orgrim
        Doomhammer.</p>

        <p>Cette histoire rend l'héritage Blackrock particulièrement intéressant
        dans la Horde de Thrall : <strong>le clan n'est ni automatiquement loyal
        ni automatiquement ennemi</strong>.</p>

        <h2>Ce qu'un enfant Blackrock pourrait avoir appris</h2>

        <ul>

        <li>Une guerre se gagne par la préparation, les lignes de ravitaillement
        et la discipline autant que par la bravoure.</li>

        <li>Une arme mal entretenue révèle un guerrier négligent.</li>

        <li>L'autorité mérite d'être efficace ; la question de savoir si elle
        mérite d'être obéie est plus difficile.</li>

        <li>Le nom Blackrock peut évoquer Doomhammer et Eitrigg aussi bien que
        Blackhand et Rend.</li>

        </ul>

        <h2>Tensions possibles</h2>

        <ul>

        <li>Devoir sans cesse préciser de quel côté de l'histoire familiale on
        se place.</li>

        <li>Respect de la chaîne de commandement face à une Horde de Thrall
        moins autoritaire que l'ancienne.</li>

        <li>Fierté pour les savoir-faire du clan, honte ou colère face à ses
        anciens dirigeants.</li>

        </ul>

        <blockquote><p><strong>Piste de personnage :</strong> « Je n'ai pas
        renié mon clan. J'ai renié ceux qui prétendent parler pour lui.
        »</p></blockquote>
