  - _id: Vsjm7rVc8j6LjnVW
    name: Origines rares — autres clans
    type: text
    category: null
    text:
      content: >-
        <h1>Origines rares — autres clans</h1>

        <p>Le passé orc comprend bien davantage de clans que ceux rencontrés
        couramment en Durotar. Cependant, leur simple existence dans le lore ne
        signifie pas qu'ils constituent des communautés normales de la Nouvelle
        Horde de Classic.</p>

        <table>

        <thead><tr><th>Clan / héritage</th><th>Repère</th><th>Usage dans
        Warbound</th></tr></thead>

        <tbody>

        <tr><td><strong>Shadowmoon / Ombrelune</strong></td><td>Ancien clan
        associé à Ner'zhul et aux traditions spirituelles de
        Draenor.</td><td>Origine exceptionnelle. Éviter d'importer sans filtre
        les développements de <em>Warlords of Draenor</em>.</td></tr>

        <tr><td><strong>Stormreaver</strong></td><td>Clan fortement associé à
        Gul'dan et aux démonistes de l'ancienne Horde.</td><td>Héritage
        extrêmement lourd ; branche familiale, survivant ou descendant plutôt
        que communauté de Durotar.</td></tr>

        <tr><td><strong>Black Tooth Grin</strong></td><td>Clan historiquement
        lié aux fils de Blackhand.</td><td>À relier au problème de la Dark
        Horde, pas à traiter comme origine courante.</td></tr>

        <tr><td><strong>Bonechewer</strong></td><td>Clan de Draenor, davantage
        présent dans les récits et contenus liés à l'Outreterre.</td><td>Rare ;
        nécessite une raison crédible pour se trouver avec la Horde de
        Thrall.</td></tr>

        <tr><td><strong>Laughing Skull</strong></td><td>Clan de Draenor connu
        pour ses alliances changeantes et son indépendance.</td><td>Rare ; à
        construire avec le MJ.</td></tr>

        <tr><td><strong>Thunderlord</strong></td><td>Clan de chasseurs de
        Draenor, peu pertinent pour le Durotar du WoW original.</td><td>À
        réserver à une histoire exceptionnelle.</td></tr>

        </tbody>

        </table>

        <h2>Attention aux anachronismes</h2>

        <p><em>Warlords of Draenor</em> présente un <strong>Draenor
        alternatif</strong> et développe fortement l'identité visuelle, les
        rites et les spécialités de nombreux clans. Ces idées peuvent être
        inspirantes, mais elles ne doivent pas être présentées automatiquement
        comme des faits connus et pratiqués par les Orcs de Warbound.</p>

        <p>Lorsque le lore Classic est mince, il vaut mieux laisser un espace au
        joueur que remplir cet espace avec une tradition apparue dix ans plus
        tard dans la franchise.</p>
