  - _id: r3CL7h2KDTZB6jYY
    name: Créer son héritage orc
    type: text
    category: null
    text:
      content: >-
        <h1>Créer son héritage orc</h1>

        <p>Choisissez un clan seulement si cela produit quelque chose à jouer.
        Puis répondez à quelques questions.</p>

        <ol>

        <li><strong>Qui vous a transmis cet héritage ?</strong> Parent,
        grand-parent, vétéran, chaman, maître d'armes, autre survivant ?</li>

        <li><strong>Êtes-vous né dans ce clan ou l'avez-vous rejoint
        ?</strong></li>

        <li><strong>Quelle histoire de votre clan connaissez-vous par cœur
        ?</strong></li>

        <li><strong>Quel membre historique admirez-vous ?</strong> Pourquoi
        ?</li>

        <li><strong>Quel épisode de votre histoire familiale vous met mal à
        l'aise ?</strong></li>

        <li><strong>Quelle tradition avez-vous conservée ?</strong></li>

        <li><strong>Quelle tradition avez-vous rejetée ?</strong></li>

        <li><strong>Qu'attendent les anciens de vous que vous n'êtes pas certain
        de vouloir devenir ?</strong></li>

        <li><strong>Quelle idée vous oppose naturellement à un autre Orc du
        groupe ?</strong></li>

        <li><strong>Qu'est-ce qui compte davantage pour vous aujourd'hui : votre
        clan, votre famille, la Horde ou vos compagnons ?</strong></li>

        </ol>

        <h2>Trois phrases suffisent</h2>

        <p>Pour éviter un background encyclopédique, résumez ensuite votre
        héritage ainsi :</p>

        <blockquote>

        <p><strong>On m'a appris que…</strong></p>

        <p><strong>Je suis fier de…</strong></p>

        <p><strong>Mais je refuse de…</strong></p>

        </blockquote>

        <h2>Exemple</h2>

        <p><em>« Je suis Blackrock. On m'a appris qu'une bataille est gagnée
        avant le premier coup si les armes, les hommes et le terrain sont prêts.
        Je suis fier que Doomhammer soit sorti de notre clan. Mais je refuse de
        confondre discipline et obéissance aveugle. »</em></p>
