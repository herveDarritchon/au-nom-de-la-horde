  - _id: IgThCwzRAuWz3t25
    name: Héritages difficiles — Dragonmaw et Burning Blade
    type: text
    category: null
    text:
      content: >-
        <h1>Héritages difficiles — Dragonmaw et Burning Blade</h1>

        <p>Certains noms appartiennent bien à l'histoire des Orcs mais
        <strong>ne doivent pas être présentés comme des clans ordinaires de la
        Nouvelle Horde de Durotar à l'époque de Classic</strong>.</p>

        <h2>Dragonmaw — Gueule-de-dragon</h2>

        <p>Les Dragonmaw ont joué un rôle majeur pendant la Deuxième Guerre en
        asservissant des dragons rouges. Dans le WoW original, leurs survivants
        vivent encore dans les Wetlands, sous l'autorité de Nek'rosh
        Skullcrusher, et sont hostiles.</p>

        <p>Pour un PJ loyal à Thrall, une origine Dragonmaw demande donc une
        histoire particulière : <strong>transfuge, enfant séparé du clan,
        survivant ayant rejeté ses chefs ou descendant d'une branche
        dissidente</strong>.</p>

        <p>Le poids de l'héritage est plus intéressant que l'imitation :
        puissance, domination, rapport aux dragons, honte familiale et volonté
        éventuelle de rupture.</p>

        <h2>Burning Blade — Lame ardente</h2>

        <p>La Lame ardente possède une histoire ancienne complexe. Mais dans
        Durotar à l'époque de Classic, le nom désigne surtout un <strong>culte
        démoniaque hostile</strong> dont les agents sont déjà présents dans la
        Vallée des Épreuves et ailleurs dans la région.</p>

        <p>Un personnage ne devrait donc pas simplement inscrire « Burning Blade
        » comme clan loyal à la Horde sans en parler au MJ. En revanche,
        l'héritage peut produire des concepts puissants : famille compromise,
        ancien adepte ayant fui le culte, descendant d'un blademaster ayant
        choisi la Horde plutôt que les démons.</p>

        <blockquote><p><strong>Règle Warbound :</strong> Dragonmaw et Burning
        Blade sont des <em>origines problématiques</em>, pas des options
        équivalentes à Frostwolf ou Warsong.</p></blockquote>
