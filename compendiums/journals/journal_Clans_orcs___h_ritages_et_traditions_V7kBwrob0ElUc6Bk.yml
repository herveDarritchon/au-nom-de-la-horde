  - _id: EoeATHdsKruBpENY
    name: Clans orcs
    type: text
    category: null
    text:
      content: >-
        <h1>Héritages et traditions</h1><p><strong>Document de lore joueur —
        Warbound : Au Nom de la Horde</strong></p><p>Les Orcs de la Nouvelle
        Horde ne forment pas un peuple sans passé. Derrière la bannière de
        Thrall subsistent les noms, les souvenirs, les coutumes et les blessures
        des anciens clans de Draenor.</p><blockquote><p><strong>Dans Warbound,
        le clan est un héritage culturel et familial, pas une sous-race ni une
        classe.</strong></p></blockquote><p>Un clan peut avoir façonné
        l'éducation d'un personnage, sa manière de parler d'honneur, sa relation
        aux chamans, sa vision de la guerre ou les attentes que d'autres Orcs
        projettent sur lui. Il ne dicte cependant ni sa personnalité ni ses
        choix.</p><h2>Cadre utilisé</h2><ul><li><p><strong>Période de référence
        :</strong> ambiance <em>World of Warcraft Classic / Vanilla</em>, avant
        le Cataclysme.</p></li><li><p><strong>Principe :</strong> les
        informations visibles dans le WoW original et les héritages établis
        avant ou autour de cette période sont
        prioritaires.</p></li><li><p><strong>Prudence :</strong> des extensions
        ultérieures ont énormément développé les cultures claniques. Ces détails
        ne sont pas automatiquement rétro-injectés dans
        Warbound.</p></li><li><p><strong>Jeu :</strong> aucun clan ne donne, par
        lui-même, de bonus mécanique.</p></li></ul><h2>Question
        centrale</h2><p>Ne demandez pas seulement : <em>« De quel clan suis-je ?
        »</em> Demandez surtout : <strong>« Qu'est-ce que mon clan m'a appris —
        et qu'ai-je décidé d'en faire ? »</strong></p>
