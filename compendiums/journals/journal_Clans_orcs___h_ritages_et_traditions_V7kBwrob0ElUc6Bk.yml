  - _id: pfn9uWbiF3Ix1VQZ
    name: Relations claniques — pistes de jeu Warbound
    type: text
    category: null
    text:
      content: >-
        <h1>Relations claniques — pistes de jeu Warbound</h1>

        <p><strong>Cette page est une aide de roleplay Warbound.</strong> Les
        relations ci-dessous sont des tensions plausibles construites à partir
        des histoires claniques ; elles ne constituent pas un tableau officiel
        de diplomatie entre clans dans WoW Classic.</p>

        <table>

        <thead><tr><th>Rencontre</th><th>Tension possible</th></tr></thead>

        <tbody>

        <tr><td>Frostwolf ↔ Warsong</td><td>Maîtrise et prudence contre audace
        et recherche de l'épreuve ; admiration mutuelle possible entre deux
        traditions profondément liées à Thrall.</td></tr>

        <tr><td>Frostwolf ↔ Blackrock</td><td>Renouveau chamanique face au poids
        de la machine militaire de l'ancienne Horde.</td></tr>

        <tr><td>Warsong ↔ Blackrock</td><td>Élan, mobilité et gloire personnelle
        face à discipline, planification et chaîne de commandement.</td></tr>

        <tr><td>Tout clan ↔ Shattered Hand</td><td>Un membre de la Main-Brisée
        peut être respecté pour son efficacité ou méprisé parce qu'il agit sans
        gloire visible.</td></tr>

        <tr><td>Nouvelle Horde ↔ Dragonmaw</td><td>Un héritier Dragonmaw doit
        souvent expliquer ce qu'il a rejeté — ou ce qu'il refuse de
        renier.</td></tr>

        <tr><td>Nouvelle Horde ↔ Burning Blade</td><td>Le nom évoque la
        corruption démoniaque et des ennemis présents en Durotar ; la méfiance
        est naturelle.</td></tr>

        </tbody>

        </table>

        <h2>À éviter</h2>

        <ul>

        <li>« Tous les Warsong sont des brutes. »</li>

        <li>« Tous les Frostwolf sont sages. »</li>

        <li>« Tous les Blackrock sont suspects. »</li>

        <li>« Tous les membres d'un clan pensent pareil. »</li>

        </ul>

        <p>Une tradition devient intéressante quand le personnage peut
        <strong>l'accepter, la réinterpréter, la contester ou la
        trahir</strong>.</p>
