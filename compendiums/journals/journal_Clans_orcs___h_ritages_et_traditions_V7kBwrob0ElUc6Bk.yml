  - _id: UyzXYgAoGfz1R0SC
    name: La Nouvelle Horde et les clans
    type: text
    category: null
    text:
      content: >-
        <h1>La Nouvelle Horde et les clans</h1>

        <p>L'ancienne Horde avait été construite à partir de clans distincts,
        chacun avec ses chefs, ses territoires, ses rivalités et ses traditions.
        Après la défaite de la Deuxième Guerre, nombre d'Orcs restés sur Azeroth
        furent enfermés dans des camps d'internement. Des années plus tard,
        Thrall libéra ces captifs et rassembla plusieurs lignées sous une même
        bannière.</p>

        <p>La Nouvelle Horde ne supprime donc pas nécessairement l'identité
        clanique. Elle lui superpose une loyauté plus large : <strong>être
        Frostwolf, Warsong ou Blackrock n'empêche pas d'être d'abord membre de
        la Horde de Thrall.</strong></p>

        <h2>Ce que signifie « appartenir à un clan » dans Warbound</h2>

        <table>

        <thead><tr><th>Le clan peut influencer…</th><th>Mais il ne détermine
        pas…</th></tr></thead>

        <tbody>

        <tr><td>les récits racontés pendant l'enfance</td><td>l'alignement moral
        du personnage</td></tr>

        <tr><td>les modèles héroïques ou honteux</td><td>sa classe</td></tr>

        <tr><td>la façon d'envisager force, honneur et communauté</td><td>son
        tempérament</td></tr>

        <tr><td>certaines relations avec d'autres Orcs</td><td>son opinion sur
        tous les membres d'un autre clan</td></tr>

        <tr><td>des coutumes familiales ou militaires</td><td>une obligation de
        rester fidèle à ces coutumes</td></tr>

        </tbody>

        </table>

        <h2>Une génération de transition</h2>

        <p>Pour beaucoup d'Orcs de Durotar, le passé clanique est vécu à travers
        des parents, des vétérans, des récits de guerre et des traditions
        fragmentaires. Certains ont connu Draenor. D'autres sont nés sur
        Azeroth. Les plus jeunes peuvent connaître davantage Orgrimmar, Razor
        Hill et les idéaux de Thrall que les terres ancestrales de leur
        clan.</p>

        <p>Cela autorise des identités multiples : <strong>Orc de Durotar,
        membre de la Horde, héritier d'un clan</strong> — parfois dans cet
        ordre.</p>
