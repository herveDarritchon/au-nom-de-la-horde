  - _id: yt7lXyhD2noKG8sl
    name: Canon, adaptation et limites
    type: text
    category: null
    text:
      content: >-
        <h1>Canon, adaptation et limites</h1>

        <h2>Canon retenu</h2>

        <p>Le document privilégie les informations établies par
        <em>Warcraft</em>, <em>Warcraft II</em>, <em>Warcraft III</em>, le
        manuel du <em>World of Warcraft</em> original et le contenu visible dans
        WoW Classic.</p>

        <h2>Adaptation Warbound</h2>

        <p>Les rubriques « ce qu'un enfant pourrait avoir appris », certaines
        tensions interclaniques et les phrases de personnage sont des
        <strong>outils de roleplay</strong>. Elles synthétisent le lore sans
        prétendre être des citations ou des doctrines officielles de
        Blizzard.</p>

        <h2>Développements postérieurs</h2>

        <p>Les extensions ultérieures ont enrichi, précisé ou parfois
        recontextualisé l'histoire des clans. Warbound peut s'en inspirer, mais
        le projet applique une règle simple :</p>

        <blockquote><p><strong>Un détail apparu plus tard n'est pas
        automatiquement une tradition connue et pratiquée dans notre Durotar
        Classic.</strong></p></blockquote>

        <h2>Cas où le lore est volontairement laissé ouvert</h2>

        <p>Pour plusieurs clans mineurs, les sources Vanilla donnent peu de
        matière sur la vie quotidienne, les rites ou l'éducation. Dans ces cas,
        Warbound préfère écrire <em>« non établi pour notre période »</em>
        plutôt que d'inventer une coutume présentée comme canonique.</p>
