  - _id: HaR8wWsUgOcXzGk1
    name: Shattered Hand — Main-Brisée
    type: text
    category: null
    text:
      content: >-
        <h1>Shattered Hand — Main-Brisée</h1>

        <p><strong>Figure historique :</strong> Kargath Bladefist.
        <strong>Figure Classic à Orgrimmar :</strong> Shenthul.</p>

        <p><strong>Cas particulier :</strong> dans WoW Classic, la Main-Brisée
        n'est pas seulement un ancien clan de naissance. À Orgrimmar, son nom
        désigne aussi une <strong>organisation de voleurs, espions et
        assassins</strong> dans laquelle un personnage peut être recruté.</p>

        <h2>Ce que montre directement Classic</h2>

        <p>Les quêtes de voleur conduisent à Shenthul dans la Faille de l'Ombre.
        Elles insistent sur la <strong>furtivité, la tromperie, la collecte
        d'informations et la frappe discrète</strong>. Un candidat peut
        accomplir les épreuves de l'organisation, apprendre son salut et devenir
        explicitement un nouveau membre.</p>

        <h2>Conséquence pour Warbound</h2>

        <p>Deux histoires sont donc possibles et ne doivent pas être confondues
        :</p>

        <ul>

        <li><strong>Héritier de l'ancien clan :</strong> la Main-Brisée
        appartient à l'histoire familiale du personnage.</li>

        <li><strong>Membre de l'organisation moderne :</strong> le personnage a
        été recruté ou formé à Orgrimmar, quelle que soit son origine
        familiale.</li>

        </ul>

        <h2>Valeurs et tensions</h2>

        <ul>

        <li>Pragmatisme : le résultat compte plus que la démonstration de
        force.</li>

        <li>Secret : toute information n'a pas vocation à être partagée.</li>

        <li>Vigilance : les ennemis de la Horde ne se trouvent pas seulement sur
        un champ de bataille.</li>

        <li>Tension naturelle avec les traditions qui assimilent l'honneur à un
        affrontement ouvert.</li>

        </ul>

        <blockquote><p><strong>Piste de personnage :</strong> « Un guerrier veut
        que l'ennemi sache qui l'a vaincu. Moi, je préfère qu'il ne sache jamais
        que j'étais là. »</p></blockquote>
