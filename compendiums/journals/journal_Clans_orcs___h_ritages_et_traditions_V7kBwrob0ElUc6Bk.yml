  - _id: YGF6YPXKn8g4yXFO
    name: Sources de lore
    type: text
    category: null
    text:
      content: >-
        <h1>Sources de lore</h1>

        <p><strong>Sources consultées pour ce journal.</strong> Les pages
        Warcraft Wiki servent de synthèse et renvoient elles-mêmes aux jeux,
        manuels, romans et quêtes dont elles tirent leurs informations. Pour les
        éléments directement visibles dans Vanilla, les quêtes WoW Classic sont
        privilégiées lorsque possible.</p>

        <h2>Source primaire / période Classic</h2>

        <ul>

        <li><strong>Blizzard Entertainment — World of Warcraft Game Manual
        (2004)</strong> : présentation des Orcs, de Thrall, Drek'Thar et
        Nazgrel. <a
        href="https://warcraft.wiki.gg/wiki/World_of_Warcraft_manual">Warcraft
        Wiki — copie et références du manuel</a>.</li>

        <li><strong>WoW Classic — The Shattered Hand, quête 1963</strong> :
        doctrine de la Main-Brisée dans la Horde de Thrall. <a
        href="https://www.wowhead.com/classic/quest=1963/the-shattered-hand">Wowhead
        Classic</a>.</li>

        <li><strong>WoW Classic — The Shattered Hand, quête 1858</strong> :
        admission explicite du PJ comme nouveau membre de la Main-Brisée. <a
        href="https://www.wowhead.com/classic/quest=1858/the-shattered-hand">Wowhead
        Classic</a>.</li>

        <li><strong>WoW Classic — Eitrigg's Wisdom, quête 4941</strong> :
        Eitrigg à Orgrimmar et conflit avec les Blackrock de Rend. <a
        href="https://www.wowhead.com/classic/quest=4941/eitriggs-wisdom">Wowhead
        Classic</a>.</li>

        <li><strong>WoW Classic — Burning Blade Medallion, quête 794</strong> :
        présence du culte de la Lame ardente dans la Vallée des Épreuves. <a
        href="https://www.wowhead.com/classic/quest=794/burning-blade-medallion">Wowhead
        Classic</a>.</li>

        </ul>

        <h2>Synthèses de lore</h2>

        <ul>

        <li><a href="https://warcraft.wiki.gg/wiki/Frostwolf_clan">Warcraft Wiki
        — Frostwolf clan</a></li>

        <li><a href="https://warcraft.wiki.gg/wiki/Warsong_clan">Warcraft Wiki —
        Warsong clan</a></li>

        <li><a href="https://warcraft.wiki.gg/wiki/Blackrock_orc">Warcraft Wiki
