        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Thazz'rill l'accuse de paresse alors que
        Druk refuse de retourner près d'une crevasse où il a entendu quelque
        chose.</p>

        <h2>Évolution hors champ</h2><p>Il peut être déplacé sur un autre
        chantier et devenir plus tard un contact familier à Tranchecolline ou
        Orgrimmar.</p>

