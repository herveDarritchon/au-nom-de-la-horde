      content: >-
        <h1>Druk</h1>

        <blockquote><p><strong>[ADAPTATION WARBAND]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Le point de vue des travailleurs. Il
        n'est pas espion : il est simplement là tout le temps et entend ce que
        les autres disent devant lui.</p>

        <h2>Présence</h2><p>Péon observateur entouré d'outils, de charges et de
        cordes ; il donne un nom à chaque outil.</p>

        <h2>Voix et répliques</h2><ul><li>« Non. Pas celui-là. Ça c'est Gurka.
        Gurka casse les manches. »</li><li>« J'en parle pas au contremaître tant
        que toi tu l'as pas vu. »</li></ul>

        <h2>Veut</h2><p>Faire son travail sans mourir ni être insulté toutes les
        dix minutes.</p>

        <h2>Craint</h2><ul><li>être considéré comme lâche lorsqu'il signale un
        vrai danger</li><li>être envoyé dans une zone qu'il sait
        dangereuse</li></ul>
