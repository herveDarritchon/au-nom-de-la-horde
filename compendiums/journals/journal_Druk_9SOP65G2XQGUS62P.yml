    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Prendre ses observations au
        sérieux, l'aider sans le traiter comme un incapable, défendre un fait
        plutôt qu'un statut.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Le ridiculiser, l'utiliser
        comme chair à canon ou promettre de vérifier un danger puis
        l'oublier.</p>

        <h2>Liens personnels possibles</h2>

        <h3>La première personne à qui il parle</h3><p>Un PJ prend sa défense.
        Plus tard, Druk vient d'abord voir ce PJ lorsqu'il remarque quelque
        chose.</p><h3>Le nom des outils</h3><p>Un outil prêté ou cassé devient
        une petite histoire commune dont Druk se souvient.</p><h2>S'il devient
        un allié</h2><p>Informateur social et matériel crédible ; témoin de
        chantier ; ami discret autour du feu.</p><h2>S'il devient
        hostile</h2><p>Il ne devient pas un grand adversaire : il cesse surtout
        de parler spontanément devant les PJ.</p>
