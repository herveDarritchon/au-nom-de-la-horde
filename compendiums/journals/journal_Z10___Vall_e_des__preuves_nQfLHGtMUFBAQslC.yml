  - _id: e94c0096fb1fa763
    name: 02 · Factions et secrets MJ
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Factions et influences — Z10</h2><p><strong>Horde</strong> et
        encadrement local ; <strong>Convent de la Lame ardente</strong> est un
        lieu de Classic dans le secteur. <strong>Son rôle précis dans le plan
        d'excavation de la Saison 1 n'est pas établi par la synthèse des
        factions</strong> : ne pas lui attribuer automatiquement les ordres de
        Neeru.</p><h3>Matrice des influences du
        référentiel</h3><table><thead><tr><th>Faction</th><th>Implantation /
        contrôle pertinent</th><th>Incursions, clandestinité ou influence
        indirecte</th><th>Effet sur les voyages (mise en
        scène)</th></tr></thead><tbody><tr><td><strong>Horde</strong></td><td>Z01,
        Z04, Z07 (Sombrelances), corridors de Z03 et Z10</td><td>Patrouilles /
        logistique en Z05, Z06, Z08</td><td>Convois, relais, pistes entretenues,
        sécurité variable</td></tr><tr><td><strong>Lame
        ardente</strong></td><td>Repaire Z02</td><td>Agents infiltrés Z01 ;
        manipulation des irréductibles Z06 ; activités ailleurs <strong>non
        cartographiées précisément</strong></td><td>Indices discrets, fausses
        pistes, informations partielles, tension
        nourrie</td></tr></tbody></table><blockquote><p><strong>Attention
        :</strong> une infiltration, un sabotage ou une manipulation ne signifie
        pas que la faction contrôle publiquement le territoire. Les relations
        secrètes ne doivent pas être divulguées automatiquement. Une faction
        hostile ne rend pas mécaniquement toute la région « en guerre
        ».</p></blockquote>
