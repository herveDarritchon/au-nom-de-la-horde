  - _id: 70318a2122f3d082
    name: 03 · Voyage Warbound V2
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Voyager dans la zone — Z10</h2><h3>Classification et
        contraintes</h3><p>voies d'entraînement reconnues <strong>frontalières
        DD 10 / 1d4°</strong> proposées ; recoins plus hostiles <strong>sauvages
        DD 15 / 2d4°</strong> seulement lorsqu'ils le justifient. De nombreuses
        scènes de prologue sont <strong>courtes</strong> : préférer la scène
        ciblée au test quotidien artificiel.</p><h3>Décisions du Guide — avant
        son jet</h3><p>progression prudente et points de ralliement ;
        <strong>exploration</strong> des détours, <strong>endurance</strong>
        dans les journées réellement longues.</p><h3>Ce que voit
        l’Éclaireur</h3><p>traces d'apprentis, sentiers distincts, marques
        inhabituelles autour d'une caverne ; distinguer menace réelle et
        exercice connu.</p><h3>Repos, chasse, pêche et
        ravitaillement</h3><p>refuge des recrues uniquement lorsqu'il est
        effectivement accessible et sûr ; pas de campement bonus
        gratuit.</p><h3>Rappel officiel COF2 / adaptation Warbound
        V2</h3><table><thead><tr><th>Paramètre</th><th>Application</th></tr></thead><tbody><tr><td>Période
        / journée</td><td>4 h par période ; 2 périodes pour une journée
        ordinaire.</td></tr><tr><td>Hors piste / terrain
        difficile</td><td>Distance <strong>÷2</strong> pour chacun,
        <strong>÷4</strong> si cumul sur le même segment.</td></tr><tr><td>Choix
        de la DD</td><td>Fixée <strong>avant</strong> le jet du Guide selon
        l’itinéraire effectivement
        emprunté.</td></tr><tr><td>Guide</td><td><strong>INT (Survie)</strong>
        en premier ; annonce sa priorité (passage / endurance / bivouac /
        ravitaillement).</td></tr><tr><td>Compagnons</td><td>Éclaireur :
        <strong>PER (Survie)</strong> ; Voyageurs : <strong>CON
        (Survie)</strong>. Un seul test de progression
        chacun.</td></tr><tr><td>Préparation V2 <strong>à
        tester</strong></td><td>Réussite du Guide : <strong>un dé bonus ciblé à
        un test pertinent d’un compagnon</strong>, non à tout le
        groupe.</td></tr><tr><td>Bilan collectif</td><td>COF2 : de −3 (arrêt +
        événement majeur) à +3 (progression rapide + bivouac confortable) ;
        saturation hors bornes provisoire.</td></tr><tr><td>Événement et
        repos</td><td>Résolution COF2 ; pas de tirage additionnel systématique
        par zone ou période.</td></tr><tr><td>Distances</td><td><strong>À
        calibrer</strong> ; ne pas utiliser une vitesse maritime ou un
        kilométrage
        inventé.</td></tr></tbody></table><blockquote><p><strong>Question
        ouverte :</strong> si une journée franchit plusieurs zones à DD
        différentes, la DD pertinente reste à arbitrer. Ne pas effectuer
        automatiquement un nouveau test au franchissement d’une
        frontière.</p></blockquote>
