  - _id: 4aa8148a60c0c53f
    name: 04 · Incidents et rencontres
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Incidents et rencontres — Z10</h2><h3>Exemples situés dans la fiche
        de zone</h3><p>recrue isolée, piste effacée, passage rocheux.
        <strong>Majeur :</strong> danger local près d'une zone cultiste,
        disparition inquiétante dans un couloir de roche.</p><h3>Palette
        d’événements régionaux</h3><table><thead><tr><th>Zone</th><th>Mineur :
        observation, tension, détour</th><th>Majeur : choix significatif ou
        confrontation possible</th><th>Intention non hostile /
        alternative</th></tr></thead><tbody><tr><td>Z10</td><td>Recrue perdue,
        piste effacée</td><td>Disparition / danger cultiste
        local</td><td>Secourir, enquêter, guider une
        recrue</td></tr></tbody></table><h3>Application
        COF2</h3><table><thead><tr><th>Bilan</th><th>Événement</th></tr></thead><tbody><tr><td>−3
        ou moins (provisoire)</td><td>Arrêt + événement
        majeur</td></tr><tr><td>−2</td><td>Ralentissement + événement
        majeur</td></tr><tr><td>−1</td><td>Événement mineur</td></tr><tr><td>0
        et plus</td><td>Aucun événement <strong>imposé par le bilan</strong> ;
        suivre la table de progression
        COF2.</td></tr></tbody></table><blockquote><p><strong>Ne pas tirer une
        rencontre supplémentaire toutes les quatre heures.</strong> La palette
        sert à choisir <strong>quel incident</strong> jouer lorsqu’il est
        déclenché ou lorsqu’une scène prévue le justifie. Combat non obligatoire
        ; calibrer les affrontements avec les POP COF2.</p></blockquote>
