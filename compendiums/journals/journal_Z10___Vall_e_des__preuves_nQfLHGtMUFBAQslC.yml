  - _id: ecd81a80ab32d38d
    name: 00 · Vue d’ensemble
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Repères de zone —
        Z10</h2><table><thead><tr><th>Champ</th><th>Information</th></tr></thead><tbody><tr><td>Nom</td><td>Vallée
        des Épreuves</td></tr><tr><td>Situation / limite</td><td>Secteur
        méridional/sud-ouest de départ et de
        formation</td></tr><tr><td>Influence
        structurante</td><td><strong>Horde</strong> ; présence locale de la
        <strong>Lame ardente</strong> à documenter sans extrapoler sa chaîne de
        commandement</td></tr><tr><td>Statut dans la campagne</td><td>Prologue
        facultatif</td></tr><tr><td>Danger COF2 de départ (à
        confirmer)</td><td><strong>Frontalière DD 10</strong> pour pistes
        reconnues ; <strong>sauvage DD 15</strong> dans les recoins
        hostiles</td></tr><tr><td>Distance et durée</td><td><strong>Non
        calibrées</strong> : à renseigner par liaison /
        tronçon.</td></tr></tbody></table><h3>Situation de départ</h3><p>zone de
        départ des recrues, usage surtout en <strong>prologue ou détour de
        personnage</strong>, pas un pôle permanent supplémentaire à présenter à
        tous les PJ. [PC] [GUIDE] [CLASSIC]</p><blockquote><p><strong>Document
        réservé au MJ.</strong> Le zonage, les DD et les incidents sont des
        propositions Warbound. Les secrets des factions ne sont pas connus des
        PJ. La difficulté effective est fixée <strong>par trajet avant le jet du
        Guide</strong>, pas automatiquement pour toute la
        zone.</p></blockquote><h3>Mémo : comment utiliser cette zone</h3><ol>

        <li>Situer le trajet et les POI réellement connus.</li>

        <li>Montrer les itinéraires plausibles et leurs compromis.</li>

        <li>Choisir ellipse, scène ou journée de voyage Warbound V2.</li>

        <li>En cas de journée jouée : Guide INT (Survie) d’abord, Éclaireur PER
        (Survie) et Voyageurs CON (Survie) ensuite.</li>

        <li>Appliquer le bilan COF2, puis mettre à jour les POI, routes et
        factions concernés.</li>

        </ol>
