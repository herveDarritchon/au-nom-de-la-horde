  - _id: 32ebbdb841a8638b
    name: 05 · Critiques et découvertes
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Critiques et découvertes persistantes — Z10</h2><h3>Occasions
        plausibles dans cette zone</h3><p>raccourci de formation, abri ancien,
        repère utile aux nouveaux voyageurs ; pas de nouvel accès secret vers
        Orgrimmar sans cohérence. <strong>1 naturel :</strong> détour qui épuise
        les recrues ou mauvaise reconnaissance d'une voie de
        sortie.</p><h3>Réussite critique du Guide : 20 naturel</h3><ol>

        <li>Le joueur Guide raconte une <strong>opportunité concrète et
        plausible</strong> liée à sa préparation : passage, halte, source, piste
        ou information.</li>

        <li>Le MJ valide la cohérence géographique et politique ; il ne remplace
        pas arbitrairement l’idée du joueur.</li>

        <li>La découverte existe durablement, même si le bilan collectif empêche
        le groupe de l’atteindre immédiatement.</li>

        <li>Ajouter le lieu au journal de territoire <code>D-Zxx-nnn</code>,
        avec son accès et son statut.</li>

        </ol>

        <h3>Échec critique : 1 naturel</h3><p>Le MJ <strong>peut</strong>
        illustrer l’erreur de préparation par une complication. Le résultat du
        Guide est déjà <strong>−2</strong> au bilan collectif : <strong>pas de
        nouveau dé malus ni d’événement majeur automatique</strong>. La
        complication peut expliquer l’incident collectif plutôt que s’y
        ajouter.</p>

        <h3>Découverte : trame à
        dupliquer</h3><table><thead><tr><th>Champ</th><th>À
        renseigner</th></tr></thead><tbody><tr><td>ID</td><td><code>D-Z10-001</code>
        (incrémenter)</td></tr><tr><td>Origine</td><td>PJ / séance / 20 naturel
        ou autre</td></tr><tr><td>Lieu et description</td><td>Proposition du
        joueur approuvée par le MJ</td></tr><tr><td>Zone
        d’attache</td><td>Z10</td></tr><tr><td>Route associée</td><td>Rxx, RX-xx
        ou aucune</td></tr><tr><td>Connaissance</td><td>Repéré / connu /
        maîtrisé</td></tr><tr><td>Accessibilité</td><td>Ouvert / conditionnel /
        bloqué / caché</td></tr><tr><td>Fonction</td><td>Halte / eau / chasse /
        pêche / raccourci / information</td></tr><tr><td>Effet de
        règle</td><td><strong>Aucun effet chiffré automatique</strong> ; définir
        au cas par cas</td></tr><tr><td>Évolution</td><td>Nouvelle présence,
        détérioration ou protection éventuelle</td></tr></tbody></table>
