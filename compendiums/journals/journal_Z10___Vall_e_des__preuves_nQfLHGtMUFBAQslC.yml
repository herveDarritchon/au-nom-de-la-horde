  - _id: cdfdbc0fd421b62c
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z10</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z10-01</code> Vallée des
        Épreuves</td><td>Prologue</td><td>[PC]</td></tr><tr><td><code>Z10-02</code>
        L'Antre</td><td>Site
        secondaire</td><td>[CLASSIC]</td></tr><tr><td><code>Z10-03</code>
        Convent de la Lame ardente</td><td>Site hostile</td><td>[CLASSIC] —
        liens de campagne non fixés</td></tr><tr><td><code>Z10-04</code> Rocher
        des Esprits</td><td>Site
        local</td><td>[CLASSIC]</td></tr><tr><td><code>Z10-05</code> Chemin
        secret</td><td>Passage</td><td>[CLASSIC] — statut à
        confirmer</td></tr></tbody></table><h3>Implantation et rôle des
        lieux</h3><p><code>Z10-01</code> Vallée des Épreuves
        <strong>[prologue]</strong> ; <code>Z10-02</code> l'Antre
        <strong>[CLASSIC]</strong> ; <code>Z10-03</code> Convent de la Lame
        ardente <strong>[CLASSIC]</strong> ; <code>Z10-04</code> Rocher des
        Esprits <strong>[CLASSIC]</strong> ; <code>Z10-05</code> chemin secret
        <strong>[CLASSIC, pertinence et accès de l'époque à
        confirmer]</strong>.</p><h3>Connaissance des PJ (à renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
