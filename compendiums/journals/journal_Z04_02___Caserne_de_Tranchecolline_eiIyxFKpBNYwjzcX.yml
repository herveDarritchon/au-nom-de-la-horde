    text:
      format: 1
      content: |-
        <h1>PNJ — Orgnil</h1>
            <p><strong>ID :</strong> PNJ-Z04-02-01 · <strong>POI :</strong> Z04-02 · <strong>Zone :</strong> Z04</p>
            <p><strong>Origine / statut :</strong> Classic — présence dans les quêtes de liaison du hub</p>
            <p><strong>Fonction :</strong> Responsable de la sécurité de Tranchecolline · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — garnison locale</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Réouvrir une liaison sans déclencher une nouvelle guerre locale.</td></tr><tr><th>Motivation profonde</th><td>Il porte la responsabilité des civils avant celle des glorieux raids.</td></tr><tr><th>Obstacle</th><td>Il reçoit des rapports incomplets sur plusieurs factions.</td></tr>
              <tr><th>Ligne rouge</th><td>Envoyer une expédition punitive sans indice solide.</td></tr><tr><th>Peut offrir</th><td>Laissez-passer, escorte ponctuelle, ordres de patrouille, contact institutionnel.</td></tr><tr><th>En échange</th><td>Un rapport circonstancié et une alternative aux représailles.</td></tr>
              <tr><th>Attitude initiale</th><td>Direct, attentif aux conséquences des mots.</td></tr><tr><th>S'il n'arrive rien</th><td>Renforce une mauvaise piste par prudence administrative.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Armure marquée de la poussière des marches.</p><p><strong>Voix et comportement :</strong> Écoute les faits dans l’ordre puis décide.</p><p><strong>Signe émotionnel :</strong> Frotte la poussière d’un bord de carte avant de donner un ordre difficile.</p>
            <blockquote><p><strong>Première réplique :</strong> « Je dois protéger la route, pas nourrir dix nouvelles rancunes. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Quelle route protégez-vous en priorité ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Une patrouille manque à l’appel et un convoi a été retardé.</td></tr><tr><th>Après échange, aide ou observation</th><td>Montre des témoignages contradictoires sur le même incident.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ne connaît pas les secrets du Cercle ni ceux de Neeru ; les dossiers sont incomplets.</td></tr><tr><th>Il demande</th><td>Un rapport circonstancié et une alternative aux représailles.</td></tr>
              <tr><th>Il peut proposer</th><td>Laissez-passer, escorte ponctuelle, ordres de patrouille, contact institutionnel.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Envoyer une expédition punitive sans indice solide.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Accorde une autorisation ciblée avec obligation de rendre compte.</td></tr><tr><th>S'ils négocient</th><td>Négocie une escorte contre le respect des civils.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Saisit les preuves si les PJ présentent un danger.</td></tr><tr><th>S'ils l'ignorent</th><td>Renforce une mauvaise piste par prudence administrative.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z04-02. <strong>Relations / autres lieux :</strong> Poste d’Orgnil ; le PNJ peut apparaître à Z04-01 sans double fiche.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z04/R01–R04 : accès, patrouilles et confiance dans les PJ.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
