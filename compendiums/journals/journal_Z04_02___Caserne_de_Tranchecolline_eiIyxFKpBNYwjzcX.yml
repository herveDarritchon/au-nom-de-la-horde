        <h1>Caserne de Tranchecolline</h1>

        <p><strong>Identifiant :</strong> Z04-02</p>

        <p><strong>Zone géographique :</strong> Z04 — Tranchecolline et ses
        abords</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur —
        Infrastructure</p>

        <h2>Fonction dans la campagne</h2>

        <p>Bâtiment de la garnison locale.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Nœud [1] — hub principal.</p>

        <p><strong>Repère géographique :</strong> Carrefour central où les PJ
        reviennent, reçoivent des nouvelles et choisissent leurs prochaines
        directions.</p>

        <p><strong>Factions et influences :</strong> Horde ; pression des
        Tranchecrins aux marges occidentales.</p>

        <p><strong>Références et réserves :</strong> [CLASSIC]</p>

        <p><em>Les lieux internes détaillés de Tranchecolline devront être
        rapprochés de la fiche du village ; ils ne sont pas inventoriés
        séparément dans les 45 entrées de cet atlas.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
