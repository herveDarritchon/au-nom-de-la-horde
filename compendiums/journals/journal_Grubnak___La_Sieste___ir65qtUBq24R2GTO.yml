  - name: 02 · Jouer ce péon
    type: text
    sort: 200000
    text:
      format: 1
      content: >-
        <h1>Interprétation et liens</h1><h2>Comment l’incarner</h2><p>Il adore
        jouer avec les PJ, les flatter et leur raconter une histoire trop belle.
        Quand il est pris en faute, il fait d’abord une plaisanterie, puis
        négocie.</p><h2>Ce qu’il sait, croit et
        dissimule</h2><dl><dt><strong>Sait</strong></dt><dd>Les horaires du
        chantier, les lieux où se cacher, les habitudes de Kragosh et les
        petites dettes entre travailleurs. Il n’a pas de vérité secrète sur le
        fil rouge.</dd><dt><strong>Croit</strong></dt><dd>Qu’un individu
        débrouillard peut se tirer de n’importe quelle situation en
        plaisantant.</dd><dt><strong>Cache</strong></dt><dd>Il a laissé Dorga
        terminer plusieurs corvées à sa place. Brakka lui accorde régulièrement
        des repas non réglés.</dd></dl><h2>Son
        entourage</h2><table><thead><tr><th>Personne</th><th>Relation
        actuelle</th></tr></thead><tbody><tr><td>Dorga</td><td>Profite de sa
        conscience professionnelle ; elle commence à lui en
        vouloir.</td></tr><tr><td>Brakka</td><td>Vieille amie, le nourrit
        parfois et le défend trop.</td></tr><tr><td>Kragosh</td><td>Rivalité
        ouverte : accusations, provocations et mauvais
        tours.</td></tr><tr><td>Zugmog</td><td>Lui apprend surtout l’art de ne
        pas se faire prendre.</td></tr></tbody></table><h2>Une phrase à
        placer</h2><blockquote><p>« Si un boulot demande trois péons, c’est
        sûrement parce que deux ne savent pas se débrouiller. »</p></blockquote>
