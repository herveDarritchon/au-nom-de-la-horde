  - name: 01 · Portrait et accroche
    type: text
    sort: 100000
    text:
      format: 1
      content: >-
        <h1>Grubnak « La Sieste »</h1><p><em>Adaptation Warbound · Vallée des
        Épreuves · Journal MJ</em></p><blockquote><p>« Si un boulot demande
        trois péons, c’est sûrement parce que deux ne savent pas se débrouiller.
        »</p></blockquote><h2>En un
        regard</h2><dl><dt><strong>Rôle</strong></dt><dd>Le vrai paresseux ·
        comique / opportuniste</dd><dt><strong>Aspect</strong></dt><dd>Petit orc
        ventru, dent inférieure cassée. Une pelle traîne toujours près de lui,
        souvent intacte. Il choisit les endroits ombragés avec un talent
        remarquable.</dd><dt><strong>Désir</strong></dt><dd>Des repas chauds,
        peu d’efforts et la liberté de vivre à son rythme. Il aimerait à terme
        tenir un petit commerce de combines et de
        paris.</dd><dt><strong>Crainte</strong></dt><dd>Qu’on le force à assumer
        durablement ses engagements et qu’on lui retire la convivialité du
        camp.</dd><dt><strong>Défaut</strong></dt><dd>Il laisse délibérément sa
        part de travail aux autres, notamment à Dorga. Sa drôlerie ne supprime
        pas le tort qu’il cause.</dd></dl><h2>Première impression à la
        table</h2><p>Il adore jouer avec les PJ, les flatter et leur raconter
        une histoire trop belle. Quand il est pris en faute, il fait d’abord une
        plaisanterie, puis négocie.</p><h2>Contact avec les PJ</h2><p>Une dette,
        une soirée de jeu, une bonne blague commune ou une trahison mineure dont
        les PJ se souviendront.</p><p><em>Statut : PNJ original de la campagne.
        Repère canonique du secteur : le contremaître Thazz’rill et les péons de
        la Vallée.</em></p>
