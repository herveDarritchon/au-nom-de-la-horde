  - name: 03 · Scènes et réactions
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>Scènes et décisions</h1><h2>Trois occasions de jeu</h2><h3>La
        charrette oubliée</h3><p>Il demande aux PJ de pousser une charrette à sa
        place en promettant de payer leur prochain repas. Dorga apparaît et
        reconnaît sa corvée.</p><h3>L’ogre et la pelle</h3><p>Au dîner, il
        affirme avoir vaincu un ogre. Il se contredit si un PJ lui demande des
        détails ; il peut néanmoins faire rire toute la tablée.</p><h3>Le pari
        de trop</h3><p>Il lance un concours de vitesse entre deux équipes et
        parie les quelques outils qu’il était censé rapporter.</p><h2>Réactions
        à quelques choix des PJ</h2><table><thead><tr><th>Approche des
        PJ</th><th>Réaction ou conséquence</th></tr></thead><tbody><tr><td>Le
        dénoncer</td><td>Thazz’rill serre la discipline ; Kragosh se félicite.
        Dorga récupère du temps mais Grubnak gardera rancune s’il a été
        humilié.</td></tr><tr><td>Faire son travail</td><td>Grubnak remercie
        puis recommence, sauf si les PJ imposent une contrepartie
        claire.</td></tr><tr><td>Lui trouver un rôle utile</td><td>Ses talents
        de bavard peuvent servir à négocier ou organiser les repas ; il devra
        prouver sa fiabilité sur une tâche
        concrète.</td></tr></tbody></table><h2>Si les PJ n’interviennent
        pas</h2><p>Continue à se reposer sur Dorga, finit publiquement pris en
        défaut par Kragosh ; Brakka essaie d’éviter qu’il soit chassé du
        camp.</p><p><em>Ces scènes sont des opportunités, pas une suite de
        quêtes imposées. Elles peuvent se résoudre sans jet de dés.</em></p>
