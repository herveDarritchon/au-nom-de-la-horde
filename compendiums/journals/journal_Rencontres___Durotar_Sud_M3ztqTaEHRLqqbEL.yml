  - name: Le mauvais croisement
    type: text
    sort: 200000
    text:
      content: >-
        <h2>Le mauvais croisement</h2>

        <h3>En un regard</h3>

        <p>Trois recrues couvertes de poussière débattent devant un croisement
        secondaire. Chacune affirme avoir reçu de son instructeur une indication
        différente pour rejoindre Tranchecolline.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Les recrues ont quitté la Vallée des Épreuves par des pistes
        différentes après une série d’exercices. Elles se sont retrouvées ici
        par hasard. L’une d’elles a pris un raccourci réel, une autre a suivi de
        vieilles marques, la troisième s’est simplement trompée.</p>

        <h3>Acteurs</h3>

        <p><strong>Recrue orque — arriver la première — fière et
        pressée</strong></p>

        <p><strong>Recrue troll — comprendre où elle s’est trompée — amusée mais
        attentive</strong></p>

        <p><strong>Recrue blessée — ne pas ralentir les autres — cache une
        piqûre de scorpide</strong></p>

        <h3>Tension</h3>

        <p>La compétition les pousse à minimiser la blessure et à repartir trop
        vite.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>la recrue blessée pose mal un pied ;</li><li>l’une des pistes
        porte des marques anciennes mais cohérentes ;</li><li>un détour mène
        effectivement vers un sentier peu utilisé ;</li><li>les trois versions
        permettent de reconstituer la géographie locale.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Soigner, guider, vérifier les pistes, laisser les recrues résoudre
        seules leur problème, les accompagner un moment ou exploiter leurs
        informations sur la Vallée.</p>

        <h3>Évolution</h3>

        <p>Si personne n’intervient, le groupe repart ensemble mais ralentit
        rapidement à cause de la blessure. Leur arrivée tardive deviendra
        surtout une histoire embarrassante racontée à Tranchecolline.</p>

        <h3>Retombées possibles</h3>

        <p>Un repère de terrain, un futur contact parmi les recrues ou la
        découverte d’une piste secondaire entre la route et la Vallée.</p>
      format: 1
