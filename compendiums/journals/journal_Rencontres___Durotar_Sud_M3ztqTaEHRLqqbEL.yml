  - name: Le feu court plus vite
    type: text
    sort: 1400000
    text:
      content: >-
        <h2>Le feu court plus vite</h2>

        <h3>En un regard</h3>

        <p>Une ligne de fumée basse se rapproche de la route. Le vent pousse les
        flammes dans les broussailles sèches tandis qu’un petit convoi arrive de
        l’autre côté sans encore percevoir le danger.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Un feu de cuisson mal éteint a embrasé des herbes sèches. Il n’y a
        aucune intention hostile. La topographie canalise cependant le feu vers
        un passage fréquenté.</p>

        <h3>Acteurs</h3>

        <p><strong>Voyageurs du convoi — traverser avant d’être bloqués —
        inconscients du danger immédiat</strong></p>

        <p><strong>Deux travailleurs responsables du feu — l’éteindre avant
        d’être identifiés — paniqués</strong></p>

        <h3>Tension</h3>

        <p>Le feu progresse rapidement et réduit les options. Sauver la
        cargaison, les personnes et les animaux ne demande pas forcément les
        mêmes choix.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>la fumée part d’un ancien emplacement de bivouac ;</li><li>des
        traces de pas fuient le point de départ ;</li><li>une bande de terre nue
        peut servir de coupe-feu ;</li><li>le vent peut changer la direction des
        flammes.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Alerter le convoi, créer un coupe-feu, guider vers un détour,
        rechercher les responsables, protéger une partie précise du chargement
        ou se mettre eux-mêmes à l’abri.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, le convoi recule trop tard et abandonne une partie
        de ses biens. Le feu finit par mourir sur un terrain pierreux mais
        laisse la route noircie et une zone de pâture détruite.</p>

        <h3>Retombées possibles</h3>

        <p>Gratitude, perte ou sauvetage de ressources, modification temporaire
        d’un itinéraire et nouvelles tensions sur les zones de chasse
        proches.</p>
      format: 1
