  - name: Le premier compagnon
    type: text
    sort: 1600000
    text:
      content: >-
        <h2>Le premier compagnon</h2>

        <h3>En un regard</h3>

        <p>Un jeune chasseur reste parfaitement immobile face à une bête
        nerveuse. Il lui parle à voix basse depuis plusieurs minutes et fait
        signe aux PJ de ne surtout pas avancer trop vite.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Le chasseur tente d’établir son premier véritable lien avec une bête
        qu’il suit depuis plusieurs jours. Il n’est pas en danger immédiat, mais
        l’arrivée de voyageurs peut faire échouer l’approche.</p>

        <h3>Acteurs</h3>

        <p><strong>Jeune chasseur — gagner la confiance de la bête — concentré
        et anxieux</strong></p>

        <p><strong>Bête sauvage — décider si l’humanoïde représente une menace —
        méfiante</strong></p>

        <h3>Tension</h3>

        <p>Un simple bruit peut tout faire recommencer. Le chasseur hésite entre
        demander de l’aide et vouloir réussir seul.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>il a laissé de la nourriture à plusieurs distances ;</li><li>il
        connaît très bien les traces locales ;</li><li>il a déjà renoncé à
        utiliser une arme ;</li><li>la bête tolère sa présence mais pas encore
        son contact.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Attendre en silence, détourner d’autres voyageurs, conseiller le
        chasseur, observer, effrayer involontairement la bête ou simplement
        contourner la scène.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, l’approche réussit ou échoue selon le ton voulu
        par le MJ, mais le chasseur reste vivant et apprend de l’expérience.</p>

        <h3>Retombées possibles</h3>

        <p>Contact avec un jeune chasseur, information sur la faune locale,
        futur guide ou simple moment de reconnaissance pour les joueurs
        familiers des traditions de chasse de la Horde.</p>
      format: 1
