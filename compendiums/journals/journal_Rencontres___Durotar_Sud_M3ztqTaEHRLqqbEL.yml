  - name: Les chasseurs sans proie
    type: text
    sort: 300000
    text:
      content: >-
        <h2>Les chasseurs sans proie</h2><h3>En un regard</h3><p>Deux
        <strong>chasseurs Sombrelance</strong> reviennent vers Sen’jin les mains
        presque vides. Leurs armes portent de la poussière et des marques
        récentes, mais aucune dépouille n’est attachée à leurs sacs.</p><h3>Ce
        qui se passe réellement</h3><p>Ils ont trouvé leurs terrains de chasse
        habituels perturbés. Des passages <strong>Kolkar</strong> plus nombreux
        ont déplacé plusieurs bêtes et rendu certaines pistes dangereuses. Ils
        ont préféré abandonner leur chasse plutôt que risquer un affrontement
        inutile.</p><h3>Acteurs</h3><p><strong>Chasseuse Sombrelance — prévenir
        Sen’jin — méfiante et lucide</strong></p><p><strong>Jeune pisteur —
        retourner chercher une proie coûte que coûte —
        frustré</strong></p><h3>Tension</h3><p>Le village a besoin de
        ressources, mais repartir immédiatement transforme un manque matériel en
        risque humain.</p><h3>Ce qui peut attirer l’attention</h3><ul><li><p>les
        chasseurs ne prétendent pas avoir subi un raid ;</p></li><li><p>ils ont
        vu des traces <strong>Kolkar</strong>, pas une armée
        ;</p></li><li><p>plusieurs pistes de tigres changent de direction avant
        la zone observée ;</p></li><li><p>le jeune pisteur veut sauver la
        face.</p></li></ul><h3>Leviers des PJ</h3><p>Questionner, accompagner
        une nouvelle tentative, proposer un autre terrain, suivre les traces
        Kolkar, aider à convaincre le jeune pisteur de rentrer ou simplement
        transmettre l’information.</p><h3>Évolution</h3><p>Sans intervention,
        ils rentrent à Sen’jin. Le manque de peaux et de viande devient plus
        visible lors des jours suivants et d’autres chasseurs prennent davantage
        de risques.</p><h3>Retombées possibles</h3><p>Confiance auprès des
        chasseurs, information sur les mouvements Kolkar ou accès à un
        itinéraire de chasse moins connu.</p><p>Amélioration de la faction avec
        les <strong>Sombrelance</strong>.</p>
      format: 1
