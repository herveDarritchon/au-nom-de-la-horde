  - name: Le repas sous l’auvent
    type: text
    sort: 600000
    text:
      content: >-
        <h2>Le repas sous l’auvent</h2>

        <h3>En un regard</h3>

        <p>Une toile tendue entre deux rochers offre un carré d’ombre. Plusieurs
        voyageurs Darkspear y mangent du poisson fumé et font signe aux passants
        de venir boire avant de reprendre la route.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Rien ne va mal. Ces voyageurs font régulièrement la liaison entre
        Sen’jin et Tranchecolline et profitent du milieu de journée pour
        attendre que la chaleur baisse.</p>

        <h3>Acteurs</h3>

        <p><strong>Voyageuse âgée — échanger des nouvelles — curieuse et
        chaleureuse</strong></p>

        <p><strong>Pêcheur Darkspear — vendre ou troquer quelques provisions —
        détendu</strong></p>

        <p><strong>Jeune voyageur — entendre des histoires de la route —
        enthousiaste</strong></p>

        <h3>Tension</h3>

        <p>La scène n’a pas besoin d’un conflit. Le seul choix est de prendre le
        temps de s’arrêter ou de poursuivre.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>des nouvelles différentes selon ce que les voyageurs ont entendu
        à Sen’jin ou à Tranchecolline ;</li><li>un itinéraire conseillé pour
        éviter une portion exposée au soleil ;</li><li>quelques rumeurs
        clairement présentées comme telles ;</li><li>le jeune voyageur reconnaît
        certains PJ s’ils sont déjà connus dans la région.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Partager le repas, troquer, écouter, raconter leurs propres
        nouvelles, demander un conseil de route ou continuer sans s’arrêter.</p>

        <h3>Évolution</h3>

        <p>Après un moment, le groupe replie l’auvent et reprend la route. Les
        nouvelles qu’il transporte continueront de circuler, y compris les
        histoires racontées par les PJ.</p>

        <h3>Retombées possibles</h3>

        <p>Information légère, provisions, réputation, contact ordinaire à
        Sen’jin ou simple respiration donnant au sud de Durotar une vie
        quotidienne crédible.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sud-tranchecolline-senjin-vallee-epreuves-encounters
          entryId: repas-sous-lauvent
