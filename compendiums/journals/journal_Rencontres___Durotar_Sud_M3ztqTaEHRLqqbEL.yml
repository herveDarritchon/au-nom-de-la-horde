  - name: L’éclaireur isolé
    type: text
    sort: 400000
    text:
      content: >-
        <h2><span>L’éclaireur isolé</span></h2><h3><span>En un
        regard</span></h3><p><span>Un éclaireur Kolkar s’est abrité derrière un
        promontoire rocheux. Une de ses pattes arrière est blessée et il
        s’appuie difficilement dessus. Il garde son arme en main, mais cherche
        davantage à maintenir une voie de retraite qu’à prendre une position
        d’attaque.</span></p><h3><span>Ce qui se passe
        réellement</span></h3><p><span>Il observait les pistes utilisées par les
        chasseurs de Sen’jin lorsqu’il a fait une mauvaise chute dans les
        rochers et s’est sérieusement blessé à la jambe.</span></p><p><span>Sa
        bande a poursuivi sa reconnaissance sans lui : rester groupés aurait
        ralenti tout le monde et risqué d’attirer l’attention des
        Trolls.</span></p><p><span>Il cherche maintenant à rejoindre les siens
        sans être capturé. À son allure actuelle, il sait qu’il ne pourra pas
        distancer longtemps des
        poursuivants.</span></p><h3><span>Acteurs</span></h3><p><span><strong>Éclaireur
        Kolkar — rejoindre les siens vivant — tendu et
        calculateur</strong></span></p><p><span>Il est blessé, isolé et
        conscient de sa vulnérabilité. Il préférera mentir, négocier, intimider
        ou céder une information plutôt que mourir
        inutilement.</span></p><h3><span>Tension</span></h3><p><span>L’éclaireur
        possède des informations utiles sur les mouvements des Kolkar, mais il
        sait aussi que sa blessure le place en mauvaise
        posture.</span></p><p><span>Tout geste brusque peut transformer une
        rencontre négociable en affrontement : s’il pense que les PJ veulent le
        capturer ou l’achever, il frappera pour créer une ouverture et tenter de
        disparaître dans les reliefs.</span></p><h3><span>Ce qui peut attirer
        l’attention</span></h3><ul><li><p><span>il ne protège aucun camp,
        réserve ou butin ;</span></p></li><li><p><span>ses traces montrent de
        longs arrêts sur des hauteurs et des points d’observation
        ;</span></p></li><li><p><span>une partie des empreintes est irrégulière
        depuis sa chute ;</span></p></li><li><p><span>il évite instinctivement
        de prendre appui sur une patte arrière ;</span></p></li><li><p><span>il
        regarde souvent vers une crête où les traces de plusieurs autres Kolkar
        disparaissent ;</span></p></li><li><p><span>son équipement est léger,
        adapté à la reconnaissance plutôt qu’à un raid
        prolongé.</span></p></li></ul><h3><span>Leviers des
        PJ</span></h3><p><span>Parler, intimider, proposer de soigner sa
        blessure, échanger des soins ou sa liberté contre des informations, le
        laisser partir, le suivre discrètement ou tenter de le
        capturer.</span></p><p><span>Les PJ peuvent également comprendre qu’un
        Kolkar blessé constitue potentiellement une occasion rare de parler avec
        l’un d’eux sans avoir immédiatement toute une bande
        autour.</span></p><h3><span>Évolution</span></h3><p><span>Si les PJ
        passent leur chemin, il reste caché jusqu’à la tombée du jour puis
        reprend lentement la direction suivie par sa
        bande.</span></p><p><span>Sa blessure l’oblige à avancer prudemment et à
        faire plusieurs haltes.</span></p><p><span>S’il rejoint les siens, il
        rapportera avoir croisé les PJ et décrira précisément leur comportement
        envers lui.</span></p><h3><span>Retombées
        possibles</span></h3><p><span>Information sur un itinéraire Kolkar,
        localisation approximative d’une bande, réputation de clémence ou de
        brutalité, prisonnier éventuel, contact inattendu avec les Kolkar ou
        piste vers un groupe plus important.</span></p><p><span>Le comportement
        des PJ peut également influencer la manière dont cette bande Kolkar les
        considérera lors d’une rencontre future.</span></p><h3><span>Combat
        éventuel</span></h3><p><span>Le combat éclate surtout si les PJ tentent
        de le saisir sans discussion, l’encerclent ou bloquent clairement toute
        retraite.</span></p><p><span>L’éclaireur ne cherche pas à vaincre le
        groupe. Il cherche à <strong>ouvrir une brèche puis
        fuir</strong>.</span></p><p><span>Sa blessure limite cependant fortement
        ses déplacements : il peut encore charger sur quelques mètres sous
        l’effet de l’adrénaline, mais une poursuite prolongée lui est
        impossible.</span></p><p><span>Le terrain rocheux lui offre plusieurs
        couverts, des passages étroits et des ruptures de ligne de vue qu’il
        connaît suffisamment pour tenter de semer ses
        poursuivants.</span></p><p><span>Cette version fonctionne même un peu
        mieux que celle avec une monture : <strong>la blessure devient
        directement son point de vulnérabilité</strong>, donc le dilemme «
        ennemi / blessé / source d’information » est beaucoup plus
        immédiat.</span></p>
      format: 1
