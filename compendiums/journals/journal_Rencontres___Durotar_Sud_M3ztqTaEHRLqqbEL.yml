  - name: Le vieux sentier
    type: text
    sort: 1500000
    text:
      content: >-
        <h2>Le vieux sentier</h2>

        <h3>En un regard</h3>

        <p>Des pierres empilées et de vieilles entailles sur un rocher indiquent
        qu’une piste presque effacée quitte la route. Elle semble couper à
        travers un terrain que les voyageurs contournent habituellement.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Il s’agit d’un ancien passage utilisé par des recrues et des
        travailleurs entre les abords de la Vallée et les pistes du sud. Un
        petit éboulement l’a rendu moins pratique, puis il est tombé en
        désuétude.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur n’est nécessaire : le lieu lui-même constitue la
        rencontre.</p>

        <h3>Tension</h3>

        <p>Le sentier est réellement plus court, mais une portion instable peut
        ralentir ou blesser les voyageurs chargés.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>des marques anciennes de bottes et de roues légères ;</li><li>un
        cairn récemment déplacé, preuve que quelqu’un utilise encore le passage
        ;</li><li>une vue permettant de repérer la route principale plus loin
        ;</li><li>une zone éboulée franchissable avec un peu de
        travail.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Explorer, cartographier, sécuriser le passage, l’utiliser
        immédiatement, le garder secret ou signaler son existence aux habitants
        de Tranchecolline ou Sen’jin.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, le sentier reste discret et se dégrade lentement.
        D’autres voyageurs peuvent toutefois laisser de nouvelles traces
        montrant qu’il n’est pas complètement oublié.</p>

        <h3>Retombées possibles</h3>

        <p>Raccourci de pointcrawl, avantage logistique lors d’un trajet futur
        ou ressource à partager avec une faction ou une communauté.</p>
      format: 1
