  - name: Deux versions du même raid
    type: text
    sort: 1800000
    text:
      content: >-
        <h2>Deux versions du même raid</h2>

        <h3>En un regard</h3>

        <p>Un garde orc blessé et une chasseuse Darkspear parlent du même
        affrontement récent. Ils s’interrompent sans cesse pour corriger le
        nombre d’assaillants, leur direction et même ce qu’ils ont tenté de
        prendre.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Ils ont tous deux vu une courte action Kolkar depuis des positions
        différentes. Le groupe ennemi cherchait surtout à récupérer un éclaireur
        ou un équipement laissé derrière lui, pas à lancer un assaut contre
        Sen’jin. Chaque témoin a sincèrement interprété la scène selon ce qu’il
        pouvait voir.</p>

        <h3>Acteurs</h3>

        <p><strong>Garde orc — convaincre qu’une attaque plus large se prépare —
        inquiet et catégorique</strong></p>

        <p><strong>Chasseuse Darkspear — éviter une réaction disproportionnée —
        sceptique et précise</strong></p>

        <h3>Tension</h3>

        <p>Une mauvaise interprétation peut pousser la Horde à renforcer le
        mauvais endroit ou à déclencher une poursuite inutile.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>les deux témoins s’accordent sur certains détails physiques
        ;</li><li>ils divergent surtout sur l’intention ;</li><li>aucun civil
        n’a été poursuivi ;</li><li>les Kolkar se sont retirés dès qu’ils ont
        récupéré quelque chose au sol.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Comparer les récits, inspecter les lieux, calmer ou soutenir
        l’alerte, prévenir Sen’jin, rechercher ce qui a été récupéré ou laisser
        les autorités trancher.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, les deux versions circulent séparément. La rumeur
        grossit et Sen’jin reçoit des avertissements contradictoires.</p>

        <h3>Retombées possibles</h3>

        <p>Meilleure compréhension des intentions Kolkar, confiance d’un témoin
        ou exemple concret d’information imparfaite dans le sandbox.</p>
      format: 1
