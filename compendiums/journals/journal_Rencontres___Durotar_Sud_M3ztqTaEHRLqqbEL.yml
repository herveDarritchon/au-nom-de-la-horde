  - name: À qui vont les peaux ?
    type: text
    sort: 1700000
    text:
      content: >-
        <h2>À qui vont les peaux ?</h2>

        <h3>En un regard</h3>

        <p>Un chariot chargé de peaux est arrêté en travers de la route. Un
        représentant de Tranchecolline et deux chasseurs de Sen’jin discutent de
        plus en plus fort autour de la cargaison.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Les peaux ont été obtenues par les chasseurs de Sen’jin. Un
        responsable de Tranchecolline affirme qu’une partie doit être
        réquisitionnée pour des besoins urgents de la route. Les chasseurs
        répondent que leur village en manque déjà.</p>

        <h3>Acteurs</h3>

        <p><strong>Chasseuse Darkspear — ramener la cargaison à Sen’jin — ferme
        et méfiante</strong></p>

        <p><strong>Responsable orc — répondre à une pénurie locale — autoritaire
        mais pas malhonnête</strong></p>

        <h3>Tension</h3>

        <p>Les deux besoins sont réels. Une solution qui satisfait totalement un
        camp laisse probablement l’autre sans ressource.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>le responsable possède un ordre valable mais général
        ;</li><li>les chasseurs peuvent expliquer précisément à quoi servent les
        peaux ;</li><li>la cargaison n’est pas assez grande pour tout le monde
        ;</li><li>plusieurs voyageurs attendent déjà que la route se
        libère.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Négocier un partage, trouver une compensation, vérifier l’urgence
        invoquée, soutenir un camp, proposer une livraison différée ou refuser
        de devenir arbitres.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, le responsable prend une petite partie des peaux
        pour libérer la route, mais les chasseurs repartent irrités et
        raconteront l’épisode à Sen’jin.</p>

        <h3>Retombées possibles</h3>

        <p>Dette ou ressentiment auprès d’une communauté, meilleur aperçu des
        besoins matériels du sud ou possibilité de créer un arrangement
        récurrent entre Tranchecolline et Sen’jin.</p>
      format: 1
