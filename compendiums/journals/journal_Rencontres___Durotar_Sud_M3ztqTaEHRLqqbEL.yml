  - name: La roue fendue
    type: text
    sort: 100000
    text:
      content: >-
        <h2>La roue fendue</h2>

        <h3>En un regard</h3>

        <p>Un chariot penche dans un fossé, une roue presque arrachée de son
        moyeu. Deux péons tentent de le retenir avec une corde tout en
        s’accusant mutuellement d’avoir trop chargé l’essieu.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Le chariot fait partie d’un trajet ordinaire entre Tranchecolline et
        le sud. La roue a cédé à cause d’une ornière et d’un chargement mal
        réparti, pas d’un sabotage. Les péons veulent sauver les outils et les
        sacs avant que l’essieu ne casse complètement.</p>

        <h3>Acteurs</h3>

        <p><strong>Péon expérimenté — sauver le chariot — agacé et
        pragmatique</strong></p>

        <p><strong>Jeune porteur — éviter d’être tenu responsable — nerveux et
        bavard</strong></p>

        <h3>Tension</h3>

        <p>Le chariot glisse lentement. S’il bascule, une partie du chargement
        sera perdue dans la ravine et la route restera partiellement
        bloquée.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>aucune trace d’attaque autour du chariot ;</li><li>une roue
        réparée plusieurs fois ;</li><li>des outils, des vivres et des
        fournitures ordinaires mélangés dans le chargement ;</li><li>les deux
        péons connaissent les nouvelles récentes de la route.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Aider à stabiliser ou réparer, redistribuer la charge, simplement
        dégager la route, profiter de l’arrêt pour parler aux voyageurs ou
        poursuivre sans intervenir.</p>

        <h3>Évolution</h3>

        <p>Sans aide, les péons finissent par sacrifier une partie du chargement
        pour redresser le chariot. Le reste du trajet se fera lentement et
        l’incident alimentera les plaintes sur l’état de la route.</p>

        <h3>Retombées possibles</h3>

        <p>Une petite faveur auprès des travailleurs, des informations sur le
        trafic récent ou la certitude utile qu’un incident banal peut réellement
        n’être qu’un accident.</p>
