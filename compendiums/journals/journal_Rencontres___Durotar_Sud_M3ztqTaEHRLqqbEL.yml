pages:
  - name: Contexte
    type: text
    sort: 0
    text:
      content: >-
        <h1>Rencontres — Durotar Sud</h1><blockquote><p>Tranchecolline, Sen’jin
        et Vallée des Épreuves</p></blockquote><h2>Périmètre</h2><p>Cette table
        couvre le sud de Durotar compris entre <strong>Tranchecolline</strong>,
        <strong>Sen’jin</strong> et les accès de la <strong>Vallée des
        Épreuves</strong>. Elle est adaptée à la grande route du sud, aux pistes
        secondaires entre les collines rouges, aux abords des camps de travail,
        aux chemins de chasse <strong>Sombrelance</strong> et aux terres sèches
        qui annoncent la Vallée.</p><p>Elle ne couvre pas les <strong>Îles de
        l’Écho</strong>, <strong>Tiragarde</strong>, les <strong>Terriers de
        l’Épine-Rouge</strong> ni les secteurs du nord de Durotar. Plus on
        approche de <strong>Sen’jin</strong>, plus les chasseurs, les voyageurs
        Sombrelance et la pression <strong>Kolkar</strong> deviennent visibles.
        Plus on se rapproche de la Vallée des Épreuves, plus les recrues, les
        péons, les <strong>sangliers</strong>, les <strong>scorpides</strong> et
        les traces de petites menaces locales prennent de
        l’importance.</p><h2>Identité du territoire</h2><p>La terre est rouge,
        sèche et poussiéreuse. La chaleur déforme l’horizon. Des buissons
        épineux, des cactus, des ravines et des affleurements de roche découpent
        les lignes de vue. Les pas soulèvent une poussière fine qui révèle
        souvent un passage avant qu’on voie ceux qui arrivent.</p><p>Sur la
        route principale, on croise des chariots, des travailleurs, des
        chasseurs, des gardes et des voyageurs entre les deux communautés. Hors
        de la route, les traces de sabots, les pistes animales et les marques
        laissées par les recrues ou les éclaireurs deviennent plus nombreuses
        que les panneaux.</p><h2>Qui circule ici ?</h2><ul><li><p><strong>Gardes
        et travailleurs de la Horde</strong> : ils relient Tranchecolline aux
        installations du sud, transportent outils, vivres et nouvelles, ou
        maintiennent les chemins praticables.</p></li><li><p><strong>Sombrelance
        de Sen’jin</strong> : chasseurs, pêcheurs, messagers, éclaireurs et
        artisans circulent entre le village, les terrains de chasse et
        Tranchecolline.</p></li><li><p><strong>Recrues et encadrants de la
        Vallée des Épreuves</strong> : certains gagnent Tranchecolline, d’autres
        s’égarent, se blessent ou transportent des
        fournitures.</p></li><li><p><strong>Kolkar</strong> : leurs éclaireurs
        et petites bandes observent les itinéraires de chasse et testent les
        réactions de Sen’jin sans nécessairement rechercher un affrontement
        immédiat.</p></li><li><p><strong>Faune locale</strong> : sangliers
        tachetés, scorpides et tigres de Durotar occupent réellement le terrain
        et réagissent aux mouvements des habitants autant qu’aux
        PJ.</p></li><li><p><strong>Voyageurs ordinaires</strong> : porteurs,
        chasseurs, artisans, familles et petits commerçants donnent au sud de
        Durotar l’impression d’un territoire habité plutôt que d’une succession
        de zones de quête.</p></li></ul><h2>Ce qui se passe
        actuellement</h2><p><strong>Sen’jin</strong> subit une pression diffuse
        : les mouvements Kolkar compliquent la chasse, déplacent la faune et
        obligent les habitants à surveiller plusieurs accès. Les besoins
        ordinaires du village — peaux, nourriture, préparations, matériaux —
        continuent pourtant d’exiger des sorties.</p><p>La <strong>Vallée des
        Épreuves</strong> reste active : péons, recrues et encadrants y gèrent
        des problèmes très concrets. Des traces de corruption ou de la Lame
        ardente peuvent parfois affleurer, mais elles ne doivent pas expliquer
        chaque incident du sud.</p><p>Entre les deux, la route reste fréquentée.
        La plupart des rencontres concernent donc la vie quotidienne, les
        ressources, la chaleur, les déplacements, les maladresses, la faune ou
        les tensions locales. Le sud de Durotar doit sembler vivre
        indépendamment du fil rouge de la campagne.</p><h2>Utilisation de la
        table</h2><p>Cette table répond à :</p><blockquote><p><strong>« Quelle
        rencontre se produit ? »</strong></p></blockquote><p>Elle ne répond pas
        à :</p><blockquote><p>« Une rencontre se produit-elle ?
        »</p></blockquote><p>Le MJ décide quand effectuer un tirage. Il peut
        notamment tirer pour donner de la vie à un déplacement, montrer l’état
        du territoire, introduire une complication, faire apparaître une
        opportunité ou rappeler que les factions et habitants continuent d’agir
        hors champ.</p><h2>Quand ne pas tirer</h2><p>Ne tire pas si une scène
        importante est déjà engagée, si les PJ viennent de prendre une décision
        qui mérite d’être résolue immédiatement, si le trajet n’a aucune
        importance fictionnelle ou si une rencontre supplémentaire casserait le
        rythme.</p>
      format: 1
