  - name: Le garde qui tient encore
    type: text
    sort: 1000000
    text:
      content: >-
        <h2>Le garde qui tient encore</h2>

        <h3>En un regard</h3>

        <p>Un garde orc tient son poste au bord de la route avec une rigidité
        presque comique. Son souffle est court, ses lèvres sèches et il répond
        trop lentement aux voyageurs.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Sa relève est en retard. Il a décidé de ne pas quitter le poste, même
        après plusieurs heures supplémentaires sous le soleil. Il a besoin
        d’ombre, d’eau et surtout de quelqu’un qui prenne temporairement le
        relais.</p>

        <h3>Acteurs</h3>

        <p><strong>Garde de route — ne pas abandonner son devoir — épuisé et
        obstiné</strong></p>

        <h3>Tension</h3>

        <p>Il minimise son état. S’il s’effondre, le poste restera vide et les
        prochains voyageurs devront décider eux-mêmes quoi faire.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>son outre est presque vide ;</li><li>il se trompe sur l’heure de
        la dernière patrouille ;</li><li>il a observé plusieurs passages récents
        et peut les décrire ;</li><li>aucune menace immédiate n’explique son
        obstination.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Le forcer à s’asseoir, partager de l’eau, rester jusqu’à la relève,
        aller chercher celle-ci, exploiter ses observations ou passer leur
        chemin.</p>

        <h3>Évolution</h3>

        <p>Sans aide, il finit par s’asseoir puis s’endort malgré lui. La relève
        le trouvera honteux mais vivant.</p>

        <h3>Retombées possibles</h3>

        <p>Bonne relation avec les gardes, détails sur les circulations récentes
        ou réputation de personnes fiables auprès de Tranchecolline.</p>
      format: 1
