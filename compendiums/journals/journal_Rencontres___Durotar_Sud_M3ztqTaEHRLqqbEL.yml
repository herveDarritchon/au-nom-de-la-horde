  - name: Le tigre dans la ravine
    type: text
    sort: 800000
    text:
      content: >-
        <h2>Le tigre dans la ravine</h2>

        <h3>En un regard</h3>

        <p>Un tigre de Durotar blessé occupe tout le fond d’une ravine étroite.
        Il montre les crocs mais ne bondit pas, et une patte arrière porte une
        plaie récente.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>L’animal s’est pris dans un piège rudimentaire puis a réussi à s’en
        arracher. Il cherche un endroit sûr pour se coucher et réagit à toute
        approche comme à une menace.</p>

        <h3>Acteurs</h3>

        <p><strong>Tigre blessé — quitter la zone ou se cacher — paniqué et
        défensif</strong></p>

        <h3>Tension</h3>

        <p>Le passage est le chemin le plus court. Forcer l’animal à bouger peut
        déclencher une attaque ; attendre coûte du temps ; contourner impose un
        détour.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>un morceau de corde ou de cuir reste pris dans la plaie
        ;</li><li>les traces du piège se trouvent plus loin ;</li><li>le
        dispositif n’est pas assez sophistiqué pour identifier son auteur avec
        certitude ;</li><li>l’animal ne poursuit pas ceux qui
        reculent.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Attendre, contourner, calmer, soigner à distance, chercher l’origine
        du piège, attirer l’animal hors du passage ou l’abattre s’ils estiment
        le danger trop grand.</p>

        <h3>Évolution</h3>

        <p>Si les PJ patientent suffisamment, le tigre finit par quitter
        lentement la ravine. S’ils l’effraient, il peut se réfugier plus près
        d’une autre piste fréquentée.</p>

        <h3>Retombées possibles</h3>

        <p>Information sur les terrains de chasse, relation avec des chasseurs
        si l’animal est sauvé ou tué proprement, ou déplacement futur du
        danger.</p>

        <h3>Combat éventuel</h3>

        <p>Le tigre n’attaque que s’il est acculé, surpris à très courte
        distance ou blessé davantage. Il cherche ensuite à rompre le contact dès
        qu’une voie de fuite s’ouvre.</p>
      format: 1
