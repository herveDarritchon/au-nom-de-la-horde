  - name: Les tambours dans la poussière
    type: text
    sort: 2000000
    text:
      content: >-
        <h2>Les tambours dans la poussière</h2>

        <h3>En un regard</h3>

        <p>Trois battements sourds viennent d’une crête. Après quelques
        secondes, deux autres leur répondent au loin. Les voyageurs sur la route
        cessent de parler et cherchent instinctivement les hauteurs du
        regard.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Deux petits groupes Kolkar communiquent à distance. Le signal sert à
        coordonner un déplacement et à vérifier si les routes de chasse sont
        surveillées. Ce n’est pas forcément le début d’une attaque
        immédiate.</p>

        <h3>Acteurs</h3>

        <p><strong>Éclaireurs Kolkar hors vue — coordonner leur mouvement sans
        se montrer — prudents</strong></p>

        <p><strong>Voyageurs de la route — comprendre s’ils sont en danger —
        nerveux</strong></p>

        <h3>Tension</h3>

        <p>Personne ne sait ce que signifient les signaux. Une réaction trop
        agressive peut révéler les défenses de la Horde ; l’inaction peut
        laisser les Kolkar se déplacer librement.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>les signaux viennent de deux directions, pas d’un seul camp
        ;</li><li>ils s’interrompent si quelqu’un monte ouvertement vers la
        crête ;</li><li>certaines pistes de chasse proches deviennent soudain
        silencieuses ;</li><li>un Darkspear expérimenté peut reconnaître qu’il
        s’agit d’une coordination, sans connaître le message exact.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Observer depuis une hauteur, suivre une direction, prévenir Sen’jin,
        tendre une observation discrète, escorter les voyageurs, répondre avec
        un faux signal s’ils savent ce qu’ils font ou décider de ne pas se
        laisser détourner.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, les groupes Kolkar se déplacent puis disparaissent
        du secteur. Quelques heures plus tard, des traces montrent qu’ils ont
        testé plusieurs passages sans engager le village.</p>

        <h3>Retombées possibles</h3>

        <p>Information sur les méthodes Kolkar, déplacement futur de
        patrouilles, tension accrue à Sen’jin ou possibilité de préparer une
        rencontre avec leurs éclaireurs avant qu’un véritable raid ne soit
        envisagé.</p>

        <h3>Combat éventuel</h3>

        <p>Un affrontement n’est probable que si les PJ remontent directement
        jusqu’à un groupe Kolkar et cherchent à l’empêcher de se retirer. Les
        éclaireurs privilégient la fuite, le terrain élevé et les signaux à
        leurs alliés plutôt qu’un combat prolongé.</p>
      format: 1
    flags:
      warbound-campaign-content:
