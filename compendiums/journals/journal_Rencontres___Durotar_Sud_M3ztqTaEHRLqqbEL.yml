  - name: Le messager qui refuse l’escorte
    type: text
    sort: 1900000
    text:
      content: >-
        <h2>Le messager qui refuse l’escorte</h2>

        <h3>En un regard</h3>

        <p>Un jeune messager Darkspear reprend son souffle derrière un rocher.
        Lorsqu’il voit les PJ, il plaque une main sur sa sacoche et affirme
        immédiatement qu’il n’a besoin de personne.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Il transporte un rapport ordinaire pour Sen’jin après avoir observé
        des mouvements inhabituels sur une piste de chasse. Il a surtout peur
        qu’on considère sa première mission en solitaire comme un échec s’il
        accepte une escorte.</p>

        <h3>Acteurs</h3>

        <p><strong>Messager Darkspear — terminer seul sa mission — fier,
        essoufflé et sur la défensive</strong></p>

        <h3>Tension</h3>

        <p>Il a peut-être réellement été suivi, mais il n’en est pas certain.
        Son orgueil rend difficile de distinguer prudence et bravade.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>ses traces montrent qu’il a couru plus qu’un simple trajet
        normal ;</li><li>il regarde souvent derrière lui ;</li><li>sa sacoche
        est scellée mais ne contient rien de mystérieux pour la campagne
        ;</li><li>il peut décrire ce qu’il a vu sans révéler le contenu du
        message.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>L’accompagner discrètement, lui proposer de marcher ensemble sans
        parler d’escorte, vérifier s’il est suivi, le laisser continuer ou lui
        transmettre des conseils de route.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, il repart après quelques minutes. Selon l’état du
        secteur, il atteint Sen’jin sans incident ou arrive très tard après
        avoir fait un long détour.</p>

        <h3>Retombées possibles</h3>

        <p>Contact à Sen’jin, information locale, réputation de respect envers
        les Darkspear ou simple aperçu de la manière dont les nouvelles
        circulent dans le sud.</p>
      format: 1
