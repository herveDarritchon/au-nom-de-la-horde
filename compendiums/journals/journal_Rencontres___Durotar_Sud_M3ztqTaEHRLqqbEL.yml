  - name: Quelque chose bouge sous la bâche
    type: text
    sort: 700000
    text:
      content: >-
        <h2>Quelque chose bouge sous la bâche</h2>

        <h3>En un regard</h3>

        <p>Un porteur s’est arrêté au milieu de la route. Sous la bâche de son
        chargement, quelque chose gratte, heurte un panier puis se tait dès
        qu’on approche.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Un jeune scorpide s’est glissé dans les paniers lors d’un arrêt près
        de la Vallée des Épreuves. Il est maintenant coincé, paniqué et
        dangereux uniquement si on le force à sortir brutalement.</p>

        <h3>Acteurs</h3>

        <p><strong>Porteur — récupérer son chargement intact — embarrassé et
        prudent</strong></p>

        <p><strong>Jeune scorpide — trouver une issue — affolé</strong></p>

        <h3>Tension</h3>

        <p>Ouvrir la bâche au mauvais endroit peut libérer l’animal au milieu
        des voyageurs ou provoquer une piqûre.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>les griffures viennent de l’intérieur ;</li><li>le porteur a
        chargé ses paniers près d’un terrain connu pour les scorpides
        ;</li><li>l’animal cherche surtout l’ombre ;</li><li>un espace libre
        derrière les rochers permettrait de le relâcher sans foule.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Déplacer le chariot, attirer l’animal, démonter les paniers, utiliser
        nourriture ou bâton, laisser le porteur gérer seul ou transformer
        l’incident en petite démonstration pour les recrues présentes.</p>

        <h3>Évolution</h3>

        <p>Sans aide, le porteur finit par renverser un panier et le scorpide
        s’échappe sous les cris, laissant plusieurs marchandises au sol.</p>

        <h3>Retombées possibles</h3>

        <p>Aucune conséquence majeure nécessaire : gratitude, anecdote locale ou
        information sur la proximité de la faune autour des pistes de la
        Vallée.</p>
      format: 1
