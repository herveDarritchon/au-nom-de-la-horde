  - name: La jarre fendue
    type: text
    sort: 500000
    text:
      content: >-
        <h2>La jarre fendue</h2>

        <h3>En un regard</h3>

        <p>Une jeune préparatrice de Sen’jin est agenouillée devant une caisse
        renversée. Une matière collante s’écoule d’une jarre brisée et menace de
        ruiner le reste du chargement.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Elle transporte des composants destinés à des préparations utiles au
        village. Le trajet s’est mal passé et la casse est purement
        accidentelle. Elle tente de séparer ce qui peut encore être utilisé
        avant que tout ne colle ensemble ou ne soit contaminé.</p>

        <h3>Acteurs</h3>

        <p><strong>Préparatrice Darkspear — sauver les composants — concentrée
        et contrariée</strong></p>

        <p><strong>Porteur orc — éviter une seconde catastrophe — serviable mais
        maladroit</strong></p>

        <h3>Tension</h3>

        <p>Chaque minute réduit ce qui peut être récupéré. La jeune troll hésite
        entre sauver la cargaison ou repartir immédiatement chercher de nouveaux
        composants.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>des yeux de makrura soigneusement emballés ;</li><li>du mucus de
        crustacé conservé dans des récipients séparés ;</li><li>aucune trace
        d’agression ;</li><li>la préparatrice sait quels besoins de Sen’jin sont
        actuellement les plus urgents.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Aider à trier, improviser des contenants, proposer de remplacer
        certains composants, escorter le chargement restant, marchander ou
        simplement demander ce qui se passe à Sen’jin.</p>

        <h3>Évolution</h3>

        <p>Sans aide, elle sauve une partie du contenu mais renonce au reste. Un
        autre groupe devra repartir sur la côte, ce qui augmente la pression sur
        les chasseurs et cueilleurs du village.</p>

        <h3>Retombées possibles</h3>

        <p>Petite dette auprès d’un artisan de Sen’jin, accès à une préparation
        utile, information sur les besoins du village ou future demande de
        composants si les pertes sont importantes.</p>
      format: 1
