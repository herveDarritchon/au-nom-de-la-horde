  - name: Sous le panier
    type: text
    sort: 1200000
    text:
      content: >-
        <h2>Sous le panier</h2>

        <h3>En un regard</h3>

        <p>Un péon maintient un grand panier retourné avec son pied. Dessous,
        une petite créature griffe la terre et pousse des cris aigus tandis que
        le péon appelle quiconque passe à l’aide.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Un familier gangrené venu des environs de la Vallée s’est éloigné de
        son maître ou de son groupe. Le péon l’a surpris près de ses outils et
        l’a capturé par réflexe. Il ne sait pas quoi en faire.</p>

        <h3>Acteurs</h3>

        <p><strong>Péon — se débarrasser du problème sans être blessé — fier de
        sa capture mais inquiet</strong></p>

        <p><strong>Familier gangrené — s’échapper — agressif et
        affolé</strong></p>

        <h3>Tension</h3>

        <p>La créature est petite mais dangereuse. La relâcher n’importe où peut
        simplement déplacer le problème vers d’autres voyageurs.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>elle porte des traces de corruption évidentes ;</li><li>aucune
        piste ne prouve qu’un groupe important se trouve à proximité
        ;</li><li>le péon affirme l’avoir vue seule ;</li><li>elle réagit à
        certaines directions comme si elle cherchait à rejoindre un lieu
        précis.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>La neutraliser, l’observer, la suivre si elle est relâchée, prévenir
        un spécialiste, interroger le péon sur l’endroit exact de la capture ou
        décider que le risque ne justifie pas une enquête.</p>

        <h3>Évolution</h3>

        <p>Sans aide, le péon appelle finalement une patrouille qui tue
        probablement la créature et consigne l’incident comme menace locale.</p>

        <h3>Retombées possibles</h3>

        <p>Petit indice vers une présence gangrenée du sud, contact avec un
        spécialiste de la Vallée ou simple rappel que toutes les menaces ne sont
        pas liées aux Kolkar.</p>

        <h3>Combat éventuel</h3>

        <p>La créature attaque surtout si le panier est soulevé sans précaution.
        Elle tente ensuite de fuir vers les rochers plutôt que de rester au
        contact.</p>
      format: 1
