  - name: Les dernières pommes de cactus
    type: text
    sort: 900000
    text:
      content: >-
        <h2>Les dernières pommes de cactus</h2>

        <h3>En un regard</h3>

        <p>Autour d’un petit groupe de cactus presque dépouillé, des péons et
        deux recrues se disputent les derniers fruits encore accessibles.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Les péons veulent compléter des provisions pour un chantier. Les
        recrues cherchent de quoi améliorer un repas médiocre avant de retourner
        à la Vallée. Personne ne ment vraiment, mais tout le monde estime sa
        raison prioritaire.</p>

        <h3>Acteurs</h3>

        <p><strong>Péon responsable des provisions — finir sa tournée —
        irrité</strong></p>

        <p><strong>Deux recrues — rapporter quelque chose à leur groupe —
        compétitives</strong></p>

        <h3>Tension</h3>

        <p>La dispute est dérisoire en apparence, mais elle révèle une vraie
        pression sur les petites ressources accessibles près des routes.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>plusieurs cactus proches ont déjà été récoltés
        ;</li><li>certains fruits ne sont pas encore mûrs ;</li><li>les péons
        connaissent un autre secteur mais il impose un détour ;</li><li>les
        recrues pourraient repartir les mains vides sans conséquence
        grave.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Arbitrer, proposer un partage, indiquer un autre endroit, acheter les
        fruits pour les redistribuer, se moquer gentiment de la dispute ou ne
        pas s’en mêler.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, les péons prennent la majorité des fruits et les
        recrues repartent vexées. La dispute devient une anecdote plutôt qu’un
        conflit durable.</p>

        <h3>Retombées possibles</h3>

        <p>Petit gain de sympathie, information sur les ressources locales ou
        simple scène de vie rappelant que les besoins ordinaires produisent eux
        aussi des tensions.</p>
      format: 1
