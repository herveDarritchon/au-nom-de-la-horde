  - name: La sieste impossible
    type: text
    sort: 1300000
    text:
      content: >-
        <h2>La sieste impossible</h2>

        <h3>En un regard</h3>

        <p>Un péon dort profondément à l’ombre d’un chariot vide. Au loin,
        plusieurs voix l’appellent. À côté de lui repose un petit paquet
        soigneusement ficelé qui ne ressemble pas à son équipement.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Le péon s’est éclipsé pour dormir quelques minutes et a trouvé le
        paquet déjà présent. Il n’en connaît ni le propriétaire ni le contenu et
        a préféré ne pas y toucher.</p>

        <h3>Acteurs</h3>

        <p><strong>Péon endormi — éviter de retourner trop vite au travail —
        inconscient du remue-ménage</strong></p>

        <p><strong>Compagnons hors champ — retrouver leur collègue — agacés
        plutôt qu’inquiets</strong></p>

        <h3>Tension</h3>

        <p>Le paquet peut susciter plus de suspicion que la disparition
        elle-même. Il contient des effets ordinaires perdus par un voyageur
        précédent, pas un secret de campagne.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>le paquet n’est pas caché ;</li><li>aucune trace de lutte
        ;</li><li>le péon ronfle assez fort pour être retrouvé facilement
        ;</li><li>le contenu peut identifier son propriétaire par un détail
        banal.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Réveiller le péon, ouvrir ou laisser le paquet, retrouver son
        propriétaire, appeler les compagnons, jouer un tour au dormeur ou
        poursuivre leur route.</p>

        <h3>Évolution</h3>

        <p>Les compagnons finissent par retrouver le péon et le ramènent au
        travail sous les moqueries. Le paquet reste sur place si personne ne
        s’en occupe.</p>

        <h3>Retombées possibles</h3>

        <p>Rencontre humoristique, objet rendu à un voyageur reconnaissant ou
        petite relation avec les travailleurs de la route.</p>
      format: 1
