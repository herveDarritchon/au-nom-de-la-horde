  - name: Les traces qui se séparent
    type: text
    sort: 1100000
    text:
      content: >-
        <h2>Les traces qui se séparent</h2>

        <h3>En un regard</h3>

        <p>Une piste claire de sabots Kolkar coupe la route puis se divise en
        trois directions. Un éclaireur Darkspear étudie les marques depuis
        plusieurs minutes sans réussir à choisir laquelle suivre.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Les Kolkar ont volontairement dispersé leurs traces. Une piste
        correspond au groupe principal, une seconde à deux éclaireurs, la
        troisième est un leurre créé par plusieurs passages répétés.</p>

        <h3>Acteurs</h3>

        <p><strong>Éclaireur Darkspear — comprendre le mouvement avant d’alerter
        Sen’jin — prudent et frustré</strong></p>

        <h3>Tension</h3>

        <p>Suivre la mauvaise piste coûte du temps et peut faire manquer le
        prochain mouvement du groupe principal.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>une piste s’enfonce dans un terrain peu logique pour un groupe
        nombreux ;</li><li>une autre comporte des traces de montures chargées
        ;</li><li>certains sabots ont repassé plusieurs fois au même endroit
        ;</li><li>l’éclaireur préfère une bonne information à une poursuite
        héroïque.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Aider à lire les traces, suivre séparément plusieurs pistes, observer
        depuis une hauteur, prévenir Sen’jin sans poursuivre ou décider que
        l’information ne vaut pas le risque.</p>

        <h3>Évolution</h3>

        <p>Sans aide, l’éclaireur marque les trois directions puis rentre
        transmettre son incertitude. Sen’jin renforcera plusieurs accès au lieu
        d’un seul.</p>

        <h3>Retombées possibles</h3>

        <p>Une piste Kolkar exploitable, un lien avec les éclaireurs de Sen’jin
        ou un choix futur facilité si les PJ comprennent leurs méthodes.</p>
      format: 1
