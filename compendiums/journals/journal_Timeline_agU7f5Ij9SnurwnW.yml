  - sort: 400000
    name: Conclusion - L'Arrivée à Tranchecolline
    type: text
    _id: iKkcFNnE4ECUFPXq
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2 data-heading="Épilogue : L'Arrivée à
        Tranchecolline">Épilogue</h2><ul><li><p><strong>Ambiance :</strong> Le
        soulagement du camp fortifié. Les orcs déchargent les chariots sous le
        regard du commanditaire.</p></li><li><p><strong>Le Choc :</strong>
        Ouverture des caisses au
        pied-de-biche.</p></li><li><p><strong>Révélation :</strong> <em>« Des
        cailloux ! Ce ne sont que de foutus cailloux !
        »</em></p></li><li><p><strong>Fin de séance :</strong> Le vol n'a pas eu
        lieu sur la route. Il s'est produit à Roche-Sèche. Le mystère du Cercle
        commence ici.</p></li></ul>
