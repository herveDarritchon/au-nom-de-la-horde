  - sort: 250000
    name: Interlude II - La Route du Sud
    type: text
    _id: I5YP8zmeAIlxXOxr
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2 data-heading="1. PJ Concerné">1. PJ Concerné</h2><ul><li><p>Un PJ
        ayant grandi ou voyagé dans le sud (Vallée des Épreuves, Sen'jin, Razor
        Hill).</p></li><li><p>Profils idéaux : Chasseur, Troll Sombrelance,
        Chaman, Guerrier, ou artisan local.</p></li></ul><h2 data-heading="2.
        Déclencheur (Présent)">2. Déclencheur (Présent)</h2><ul><li><p>Pendant
        le trajet ou une halte.</p></li><li><p>Le PJ reconnaît un point de
        repère (arbre sec tordu, cairn, petite gorge, pierre avec symbole
        Horde).</p></li><li><p><strong>Transition :</strong> <em>"Tu es déjà
        passé ici. Mais la dernière fois, tu n'étais pas accompagné d'un
        convoi."</em></p></li></ul><h2 data-heading="3. La Situation (Passé)">3.
        La Situation (Passé)</h2><ul><li><p>Voyage entre Sen'jin et la Vallée
        des Épreuves avec un petit groupe.</p></li><li><p>Un problème banal :
        <strong>un kodo blessé refuse d'avancer</strong>.</p></li><li><p>Pas de
        monstres, pas de complots. Juste la réalité de
        Durotar.</p></li><li><p>Le groupe doit décider : abandonner la charge,
        attendre, détourner la route, soigner la bête ?</p></li><li><p>Un vieux
        voyageur dit : <em>"Ici, la route décide rarement de te tuer. Elle
        attend juste que tu fasses une erreur."</em></p></li></ul><h2
        data-heading="4. L'Action">4. L'Action</h2><ul><li><p>Le PJ raconte
        comment il a géré le problème (soigné l'animal, réparé le chariot, ou
        aidé à répartir la cargaison).</p></li></ul><h2 data-heading="5. Le
        Payoff (Retour au Présent &amp; Jeu)">5. Le Payoff (Retour au Présent
        &amp; Jeu)</h2><ul><li><p>L'expérience du PJ se concrétise en
        <strong>avantage tactique</strong>.</p></li><li><p>Tu révèles : <em>"Tu
        te souviens qu'il existe un ravin secondaire pour contourner cette
        portion exposée."</em></p></li><li><p>Plus tard (lors de l'embuscade
        Kolkar ou face à un obstacle), cette option tactique est activable par
        le joueur. Le souvenir donne directement du jeu.</p></li></ul>
