  - sort: 200000
    name: Acte II - Animaux en fuite !
    type: text
    _id: 2N8imUbpAAh0ARaF
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>L'Anomalie</h2><ul><li><p><strong>L'Entrée :</strong> Une harde de
        sangliers de Durotar surgit des fourrés épineux et charge le convoi de
        façon frénétique et désordonnée.</p></li><li><p><strong>L'Enjeu / Le
        Compteur :</strong> Des dizaines de kilos de viande lancés à pleine
        vitesse. Le danger n'est pas un massacre mais la physique : empêcher les
        chariots de se renverser, sauver un convoyeur tombé au sol, ou détourner
        la charge.</p></li><li><p><strong>La Vérité :</strong> Contrairement aux
        Kolkars, cette attaque n'est pas naturelle. Un chaman du Cercle de la
        Pierre Brisée, invisible et à distance, a perturbé les animaux pour
        paniquer le convoi, le ralentir et potentiellement endommager les
        preuves, sans pour autant viser une
        extermination.</p></li><li><p><strong>L'Indice du fil rouge :</strong>
        Les personnages compétents (Survie, Nature) remarquent que ce
        comportement est anormal pour un groupe de sangliers. Un chaman ou
        lanceur de sorts peut ressentir qu'une magie a influencé les bêtes.
        C'est le premier grain de sable du mystère.</p></li></ul>
