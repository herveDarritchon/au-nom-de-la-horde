  - sort: 300000
    name: Acte III - Patrouille de l'Alliance
    type: text
    _id: rwHYKr5gwyGQMg8A
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h3>Tension Diplomatique</h3><ul><li><p>L<strong>'Entrée :</strong> Le
        convoi croise la route d'une petite force humaine de Kul
        Tiras/Tiragarde.</p></li><li><p><strong>L'Enjeu / Le Compteur :</strong>
        Les soldats barrent ou surveillent la route. La tension est
        immédiatement palpable, mais <strong>la scène ne commence pas par
        l'initiative</strong>.</p><ul><li><p>Les joueurs réalisent que
        <em>Humains ≠ Combat
        obligatoire</em>.</p></li></ul></li><li><p><strong>La Vérité :</strong>
        Ces hommes cherchent du renseignement et contrôlent les mouvements de la
        Horde dans cette partie de Durotar. La situation est ouverte : les PJ
        peuvent parler, intimider, mentir, négocier, laisser passer, ou
        provoquer l'affrontement.</p></li></ul>
