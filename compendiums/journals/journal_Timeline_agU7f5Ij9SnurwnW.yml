  - sort: 100000
    name: Acte I - Embuscade Kolkar
    type: text
    _id: khjcK5XRezYcGEaN
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Défendre le contenu du convoi</h2><ul><li><p><strong>L'Entrée
        :</strong> Sur la route vers le nord, le convoi traverse un territoire
        où la présence Kolkar est connue. Les centaures attaquent
        véritablement.</p></li><li><p><strong>L'Enjeu / Le Compteur :</strong>
        Défendre le convoi, protéger les convoyeurs et les kodos contre une
        menace létale. C'est le premier test de combat de la
        campagne.</p></li><li><p><strong>La Vérité (Ce que les joueurs doivent
        croire et qui est vrai) :</strong> C'est une vraie attaque de pillards.
        Il n'y a rien de mystérieux. Tout ce qui arrive en Durotar n'est pas lié
        au complot. Les PJ peuvent capturer, tuer ou laisser fuir les
        assaillants.</p></li></ul>
