  - sort: 150000
    name: Interlude I - Le jour où Mâche-Roc n'a pas arrêté
    type: text
    _id: Ofr5OctQhwlQsoBk
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2 data-heading="1. PJ Concerné">1. PJ Concerné</h2><ul><li><p>Un PJ
        avec un lien avec le minage, la forge, l'armurerie, l'ingénierie, ou
        ayant travaillé à Roche-Sèche.</p></li><li><p><strong>Questions à poser
        en jeu :</strong> <em>"Tu as travaillé ici quelque temps. Était-ce dans
        les galeries ou à l'atelier ?"</em>, <em>"Qui t'avait pris sous son aile
        : Ragrah ou Moj'ka ?"</em></p></li></ul><h2 data-heading="2. Déclencheur
        (Présent)">2. Déclencheur (Présent)</h2><ul><li><p>Peu après le départ
        de Roche-Sèche.</p></li><li><p>Un mineur a frappé une caisse : <em>«
        Ramenez-la-nous entière. »</em></p></li><li><p>Le bruit répétitif des
        roues rappelle quelque chose.</p></li><li><p><strong>Transition
        :</strong> <em>"Tu connais ce bruit. Pas celui du chariot. Celui du
        métal sous contrainte. Tu l'as entendu à Roche-Sèche, il y a quelques
        mois..."</em></p></li></ul><h2 data-heading="3. La Situation (Passé)">3.
        La Situation (Passé)</h2><ul><li><p>Une galerie s'est effondrée.
        <strong>Six mineurs sont bloqués</strong> derrière le 3ème
        puits.</p></li><li><p>La contremaître <strong>Moj'ka
        Main-de-Graisse</strong> veut percer un conduit de secours avec
        Mâche-Roc, mais la machine va devoir tourner pendant des
        heures.</p></li><li><p>Moj'ka interpelle le PJ : <em>"Toi ! Si elle
        chauffe, elle casse. Si elle casse, eux restent là-dessous. Aide-moi à
        la garder en vie."</em></p></li></ul><h2 data-heading="4. L'Action &amp;
        Le Choix">4. L'Action &amp; Le Choix</h2><ul><li><p><strong>Rôle du PJ
        (selon métier) :</strong> Forgeron (redresser une pièce), Mineur (guider
        le forage), Ingénieur (refroidissement), Autre (déblayer,
        écouter).</p></li><li><p><strong>Le Choix :</strong> La machine vibre
        anormalement. Moj'ka hésite : <em>"On arrête dix minutes ou on continue
        ?"</em></p><ul><li><p>Soudain, <strong>trois coups</strong> se font
        entendre de l'autre côté.</p></li><li><p>Le PJ doit trancher. Aucune
        bonne réponse mécanique, c'est un choix moral. Les six mineurs seront
        sauvés de toute façon, mais cela change le souvenir du
        PJ.</p></li></ul></li></ul><h2 data-heading="5. Le Payoff (Retour au
        Présent)">5. Le Payoff (Retour au Présent)</h2><ul><li><p>Le sauvetage
        réussit. Pas de célébration, juste l'épuisement.</p></li><li><p>Un vieux
        mineur pose la main sur le châssis brûlant de la foreuse. <strong>Deux
        coups.</strong></p><ul><li><p><em>"Tok. Tok. Bonne
        bête."</em></p></li></ul></li><li><p><strong>Transition immédiate
        :</strong> <em>"Tok. Tok."</em> (Le chariot vient de passer sur deux
        pierres. Devant le PJ se trouvent les caisses censées contenir
        Mâche-Roc).</p></li><li><p><strong>Question finale :</strong>
        <em>"Pourquoi es-tu finalement parti de Roche-Sèche
        ?"</em></p></li></ul>
