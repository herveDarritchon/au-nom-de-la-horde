  - name: Les pierres en équilibre
    type: text
    sort: 1800000
    text:
      content: >-
        <h2>Les pierres en équilibre</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Si tu trouves trois pierres empilées, ne les touche
        pas. Quelqu'un compte sur elles pour retrouver son chemin.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Les chasseurs et voyageurs expérimentés reconnaissent certains de ces
        petits empilements comme des repères.</p>

        <p>Les personnes moins familières les prennent parfois pour des marques
        Tranchecrins ou des signes rituels.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> plusieurs voyageurs
        utilisent réellement de petits cairns temporaires pour signaler une
        bifurcation, un passage praticable ou leur trajet de retour.</p>

        <p>Ils ne suivent cependant aucun code universel.</p>

        <h3>Quand ?</h3>

        <p>Les empilements apparaissent et disparaissent au gré des passages, du
        vent, des animaux ou des personnes qui les déplacent.</p>

        <h3>Où ?</h3>

        <p>Principalement aux bifurcations discrètes et à proximité des sorties
        de ravins.</p>

        <h3>Pourquoi ?</h3>

        <p>Dans un paysage répétitif, un repère artificiel simple peut être
        extrêmement utile.</p>

        <p>L'absence de système commun crée cependant de nombreuses mauvaises
        interprétations.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent apprendre quels voyageurs utilisent quels types de
        repères ou créer leurs propres marques pour faciliter de futures
        traversées.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: pierres-en-equilibre
