  - name: Le tunnel a deux sorties
    type: text
    sort: 1000000
    text:
      content: >-
        <h2>Le tunnel a deux sorties</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Tu crois que le tunnel traverse la roche en ligne
        droite ? Alors explique-moi comment ils disparaissent toujours avant
        qu'on atteigne l'autre côté. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Secret ayant fuité.</p>

        <h3>Qui ?</h3>

        <p>Des voyageurs ayant aperçu des Tranchecrins entrer dans le tunnel
        puis perdu leur trace alimentent cette histoire.</p>

        <p>Certains gardes la considèrent comme une excuse inventée après une
        poursuite ratée.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> le Tunnel des Tranchecrins
        possède un passage secondaire étroit ou difficile à repérer permettant
        de quitter l'axe principal.</p>

        <p>Il ne s'agit pas nécessairement d'une véritable grande « seconde
        sortie ».</p>

        <h3>Quand ?</h3>

        <p>La rumeur est relativement récente et encore contestée.</p>

        <h3>Où ?</h3>

        <p>Dans le Tunnel des Tranchecrins.</p>

        <h3>Pourquoi ?</h3>

        <p>Un passage secondaire expliquerait plusieurs témoignages sans exiger
        que les Tranchecrins disparaissent mystérieusement.</p>

        <p>Sa discrétion lui donne cependant une réputation presque
        surnaturelle.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent examiner les parois, observer les courants d'air,
        chercher des traces de passages latéraux ou surveiller discrètement les
        utilisateurs du tunnel.</p>

        <h3>Si personne n'agit</h3>

        <p>Le passage reste un avantage pour ceux qui le connaissent.</p>
      format: 1
