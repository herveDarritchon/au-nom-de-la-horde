  - name: Personne ne prend le tunnel
    type: text
    sort: 100000
    text:
      content: >-
        <h2>Personne ne prend le tunnel</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Le tunnel ? Si quelqu'un te conseille de passer par là,
        demande-lui d'abord pourquoi il tient tant à récupérer tes bottes après
        ta mort. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Les voyageurs réguliers entre Tranchecolline et les terres
        occidentales répètent volontiers cet avertissement.</p>

        <p>Les gardes et les chasseurs expérimentés connaissent réellement le
        danger du passage, tandis que ceux qui n'y sont jamais allés amplifient
        souvent sa réputation.</p>

        <p>Les Tranchecrins ont évidemment intérêt à ce que les étrangers
        utilisent un passage facile à surveiller.</p>

        <h3>Quoi ?</h3>

        <p>Le Tunnel des Tranchecrins est effectivement un excellent point
        d'embuscade.</p>

        <p>Il n'est cependant ni infranchissable ni systématiquement gardé.</p>

        <p><strong>Adaptation de campagne :</strong> sa réputation est devenue
        si mauvaise que certains voyageurs préfèrent emprunter des détours
        objectivement plus dangereux.</p>

        <h3>Quand ?</h3>

        <p>La rumeur circule depuis suffisamment longtemps pour être devenue un
        conseil presque automatique à Tranchecolline.</p>

        <p>Elle reprend de la vigueur chaque fois qu'un voyageur manque à
        l'appel.</p>

        <h3>Où ?</h3>

        <p>Elle peut être entendue à Tranchecolline, sur les routes occidentales
        ou auprès de chasseurs revenant des ravins.</p>

        <p>Elle peut être vérifiée directement au Tunnel des Tranchecrins ou
        depuis les hauteurs qui le dominent.</p>

        <h3>Pourquoi ?</h3>

        <p>Le terrain rend l'histoire crédible et chaque disparition confirme le
        récit, même lorsqu'elle n'a rien à voir avec le tunnel.</p>

        <p>La peur transforme progressivement un danger tactique réel en lieu
        supposément suicidaire.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent observer le tunnel avant de l'emprunter, chercher des
        traces de passages récents, interroger des voyageurs l'ayant réellement
        traversé ou tenter de trouver une autre route.</p>

        <p>La rumeur peut surtout leur apprendre qu'un lieu dangereux n'est pas
        nécessairement un lieu inutilisable.</p>

        <h3>Si personne n'agit</h3>

        <p>Le tunnel reste utilisé sporadiquement par ceux qui acceptent le
        risque.</p>

        <p>Sa mauvaise réputation continue de croître à chaque incident non
        expliqué.</p>
      format: 1
