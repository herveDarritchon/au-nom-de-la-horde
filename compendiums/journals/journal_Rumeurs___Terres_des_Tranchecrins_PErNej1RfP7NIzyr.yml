  - name: Il n'y a rien dans la grotte
    type: text
    sort: 700000
    text:
      content: >-
        <h2>Il n'y a rien dans la grotte</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Les Échineurs ? Une histoire pour les enfants. La
        grotte est vide. Elle l'a toujours été. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Information dépassée.</p>

        <h3>Qui ?</h3>

        <p>Quelques chasseurs ayant visité ou approché la Grotte des Échineurs
        par le passé affirment n'y avoir rien trouvé.</p>

        <p>D'autres utilisent cette version pour ridiculiser les histoires les
        plus inquiétantes.</p>

        <h3>Quoi ?</h3>

        <p>La nature exacte des Échineurs et l'occupation actuelle de la grotte
        ne sont pas définies dans les sources fournies.</p>

        <p><strong>Adaptation de campagne :</strong> il est tout à fait possible
        que la grotte ait effectivement été vide lors de certaines visites.</p>

        <p>Cela ne prouve rien concernant son état actuel.</p>

        <h3>Quand ?</h3>

        <p>Les témoignages les plus catégoriques sont anciens.</p>

        <p>C'est précisément leur âge qui est souvent omis lorsqu'ils sont
        répétés.</p>

        <h3>Où ?</h3>

        <p>La Grotte des Échineurs, dans la partie occidentale du
        territoire.</p>

        <h3>Pourquoi ?</h3>

        <p>Un témoignage direct possède beaucoup de poids, même lorsqu'il décrit
        une situation ancienne.</p>

        <p>La rumeur persiste parce qu'elle fournit une explication
        rassurante.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent chercher à dater les témoignages, savoir qui a réellement
        pénétré dans la grotte ou observer ses abords avant de conclure.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution définie tant que la nature des Échineurs n'est pas
        fixée dans Warbound.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: rien-dans-la-grotte
