  - name: Le territoire bouge
    type: text
    sort: 2000000
    text:
      content: >-
        <h2>Le territoire bouge</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Les cartes mentent. Pas les mauvaises cartes : toutes.
        Chaque fois que tu reviens, un passage a disparu et un autre s'est
        ouvert. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Exagération.</p>

        <h3>Qui ?</h3>

        <p>Les voyageurs frustrés par les détours et les erreurs de navigation
        utilisent cette formule pour expliquer la difficulté à cartographier la
        zone.</p>

        <p>Les cartes anciennes entretiennent particulièrement cette
        réputation.</p>

        <h3>Quoi ?</h3>

        <p>Le territoire ne se transforme pas constamment.</p>

        <p><strong>Adaptation de campagne :</strong> certains passages peuvent
        cependant être temporairement bloqués par des éboulis, des branches, un
        camp, une surveillance ennemie ou simplement devenir impraticables avec
        les conditions locales.</p>

        <p>À l'inverse, un détour autrefois ignoré peut être découvert.</p>

        <h3>Quand ?</h3>

        <p>Les différences deviennent visibles surtout entre deux visites
        espacées.</p>

        <h3>Où ?</h3>

        <p>Dans l'ensemble des Terres des Tranchecrins, particulièrement dans
        les ravins secondaires.</p>

        <h3>Pourquoi ?</h3>

        <p>Une carte représente la géographie, mais pas toujours l'état actuel
        du terrain ni le contrôle exercé par ses occupants.</p>

        <p>Pour un voyageur, la distinction importe peu lorsqu'un itinéraire
        dessiné sur sa carte ne peut plus être emprunté.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent maintenir leur propre carte, noter l'état actuel des
        passages et progressivement acquérir une connaissance du territoire
        supérieure aux informations disponibles à Tranchecolline.</p>

        <h3>Si personne n'agit</h3>

        <p>La réputation d'un territoire « impossible à cartographier » persiste
        alors même que de nombreux changements ont des causes parfaitement
        ordinaires.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: territoire-bouge
          sourceHash: '91851312'
