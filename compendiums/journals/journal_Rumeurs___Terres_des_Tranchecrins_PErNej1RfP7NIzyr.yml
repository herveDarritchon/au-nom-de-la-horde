  - name: Le camp abandonné
    type: text
    sort: 1100000
    text:
      content: >-
        <h2>Le camp abandonné</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Couvertures, gourdes, même de quoi faire du feu. Ils
        ont tout laissé. Mais il n'y avait ni sang ni corps. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Un petit groupe de chasseurs affirme avoir découvert le
        campement.</p>

        <p>Le récit a rapidement été repris par ceux qui veulent démontrer que
        quelque chose de plus dangereux que les Tranchecrins rôde dans les
        ravins.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> un camp temporaire a
        effectivement été abandonné précipitamment.</p>

        <p>Les raisons ne sont pas visibles sur place.</p>

        <p>Ses occupants peuvent avoir fui une menace réelle, évité une
        patrouille ou simplement choisi de partir sans avoir le temps de
        récupérer tout leur matériel.</p>

        <h3>Quand ?</h3>

        <p>Le camp a été découvert récemment, mais personne ne sait exactement
        quand il a été abandonné.</p>

        <h3>Où ?</h3>

        <p>Dans un petit ravin secondaire à l'écart des passages les plus
        fréquentés.</p>

        <h3>Pourquoi ?</h3>

        <p>L'absence d'explication laisse un vide immédiatement rempli par les
        hypothèses les plus inquiétantes.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Les objets, traces de départ et environs du camp peuvent permettre de
        reconstituer une partie de ce qui s'est passé.</p>

        <p>Ils peuvent également rechercher ses anciens occupants.</p>

        <h3>Si personne n'agit</h3>

        <p>Les traces deviennent progressivement illisibles et le camp est
        récupéré, dispersé ou pillé par les prochains visiteurs.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: camp-abandonne
          sourceHash: 0274a7f3
