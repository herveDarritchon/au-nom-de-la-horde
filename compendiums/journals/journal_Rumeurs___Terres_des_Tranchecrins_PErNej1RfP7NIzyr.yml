  - name: Les Tranchecrins évitent la piste
    type: text
    sort: 1700000
    text:
      content: >-
        <h2>Les Tranchecrins évitent la piste</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Suis leurs traces si tu veux savoir où ils vont.
        Regarde où elles s'arrêtent si tu veux savoir ce qu'ils craignent.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Des chasseurs et pisteurs ayant étudié les déplacements autour de la
        Piste des Échineurs répètent cette observation.</p>

        <p>Les versions populaires affirment déjà que les Tranchecrins ont peur
        des Échineurs.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> certaines traces
        Tranchecrins deviennent effectivement moins fréquentes sur une portion
        de la piste.</p>

        <p>La raison n'est pas nécessairement la peur : mauvaise visibilité,
        absence de ressources, terrain inutile, autre itinéraire ou danger réel
        peuvent produire le même comportement.</p>

        <h3>Quand ?</h3>

        <p>L'observation est actuelle mais peut changer si les habitudes des
        occupants évoluent.</p>

        <h3>Où ?</h3>

        <p>Sur une portion occidentale de la Piste des Échineurs.</p>

        <h3>Pourquoi ?</h3>

        <p>Les voyageurs interprètent instinctivement l'évitement comme une
        crainte.</p>

        <p>Cette conclusion est plausible mais non démontrée.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent observer ce qui change précisément à l'endroit où les
        traces se raréfient et chercher si d'autres animaux ou voyageurs évitent
        eux aussi le secteur.</p>

        <h3>Si personne n'agit</h3>

        <p>Le comportement reste inexpliqué et renforce la réputation
        inquiétante des Échineurs.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: tranchecrins-evitent-piste
          sourceHash: ef5c6d9d
