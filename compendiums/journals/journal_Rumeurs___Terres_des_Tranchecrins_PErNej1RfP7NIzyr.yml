  - name: Le quilboar seul
    type: text
    sort: 900000
    text:
      content: >-
        <h2>Le quilboar seul</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Il y en a un qui voyage seul. Il te regarde depuis les
        hauteurs mais ne descend jamais. Même quand il pourrait te prendre
        facilement. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Plusieurs voyageurs indépendants disent avoir aperçu un Tranchecrin
        solitaire.</p>

        <p>Certains pensent qu'il s'agit d'un éclaireur ; d'autres d'un
        banni.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> un individu Tranchecrin
        circule effectivement seul sur une partie du territoire.</p>

        <p>Sa fonction et ses motivations ne sont volontairement pas fixées par
        la rumeur.</p>

        <p>Il peut simplement observer, éviter les groupes plus nombreux ou
        poursuivre une préoccupation qui lui est propre.</p>

        <h3>Quand ?</h3>

        <p>Les observations sont espacées de plusieurs jours.</p>

        <h3>Où ?</h3>

        <p>Principalement sur les hauteurs dominant les ravins orientaux.</p>

        <h3>Pourquoi ?</h3>

        <p>Son comportement inhabituel attire l'attention précisément parce
        qu'il ne correspond pas à l'image d'une présence systématiquement
        agressive.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent tenter de le suivre, de comprendre ses déplacements, de
        l'éviter ou éventuellement de provoquer une interaction.</p>

        <p>Aucune de ces options ne garantit qu'il souhaite communiquer.</p>

        <h3>Si personne n'agit</h3>

        <p>Il continue ses déplacements jusqu'à ce que ses propres objectifs
        l'amènent ailleurs.</p>
      format: 1
