  - name: Des feux dans le cratère
    type: text
    sort: 200000
    text:
      content: >-
        <h2>Des feux dans le cratère</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« La nuit, on voit des feux là-dessous. Pas un grand
        camp. Un feu ici, puis un autre plus loin. Comme si quelque chose se
        déplaçait dans le cratère. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Des voyageurs ayant contourné le secteur au crépuscule sont les
        principales sources de cette rumeur.</p>

        <p>Les gardes y voient volontiers la preuve d'une activité Tranchecrin
        croissante.</p>

        <h3>Quoi ?</h3>

        <p>Des feux sont réellement allumés dans le Cratère.</p>

        <p>Les informations fournies établissent que la dépression est favorable
        aux campements et aux déplacements dissimulés.</p>

        <p><strong>Adaptation de campagne :</strong> les feux correspondent à
        plusieurs petits foyers temporaires plutôt qu'à un unique grand camp
        permanent.</p>

        <h3>Quand ?</h3>

        <p>Les observations sont récentes et irrégulières.</p>

        <p>Les feux ne sont pas visibles chaque nuit.</p>

        <h3>Où ?</h3>

        <p>Le phénomène concerne le Cratère des Tranchecrins.</p>

        <p>Il est surtout observable depuis certaines hauteurs à l'est ou au
        nord de la dépression.</p>

        <h3>Pourquoi ?</h3>

        <p>Le relief masque suffisamment les occupants pour que seules les
        lueurs trahissent leur présence.</p>

        <p>Les témoins comblent ensuite les lacunes avec leurs propres
        interprétations.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent chercher un meilleur point d'observation, tenter de
        distinguer combien de foyers existent réellement ou comparer les
        témoignages selon les nuits.</p>

        <p>Observer peut fournir davantage d'informations qu'une descente
        immédiate dans le cratère.</p>

        <h3>Si personne n'agit</h3>

        <p>Les feux continuent d'apparaître et d'alimenter les spéculations sur
        l'importance de la présence Tranchecrin.</p>
      format: 1
