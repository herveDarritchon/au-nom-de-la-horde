pages:
  - name: Contexte
    type: text
    sort: 0
    text:
      content: >-
        <h1>Rumeurs — Terres des Tranchecrins</h1>

        <h2>En bref</h2>

        <p>Les <strong>Terres des Tranchecrins</strong> désignent une zone
        accidentée située à l’ouest de Tranchecolline. Ravins, roches rouges,
        taillis secs et passages étroits en font un territoire difficile à
        parcourir et particulièrement favorable aux embuscades.</p>

        <p>Les <strong>Tranchecrins</strong>, des quilboars Razormane, y
        constituent la présence dominante connue. Leur occupation est considérée
        comme hostile par la Horde et participe à un conflit territorial autour
        des marges occidentales de Tranchecolline.</p>

        <p>Pour le MJ, cette zone fonctionne surtout comme une <strong>frontière
        dangereuse</strong> : un espace assez proche des routes de la Horde pour
        que les incidents aient des conséquences concrètes, mais suffisamment
        sauvage et mal connu pour que les témoignages soient
        contradictoires.</p>

        <p>Les rumeurs qui circulent à son sujet doivent entretenir trois
        sensations : <strong>on connaît approximativement le danger, on connaît
        mal le territoire, et ceux qui prétendent tout savoir exagèrent
        probablement quelque chose</strong>.</p>

        <h2>Identité</h2>

        <p>Les éléments établis dans les informations fournies sont :</p>

        <ul><li>relief accidenté ;</li><li>roches rouges ;</li><li>ravins
        ;</li><li>taillis ;</li><li>passages étroits ;</li><li>présence hostile
        des Tranchecrins ;</li><li>existence d'un tunnel traversant leur
        territoire ;</li><li>existence d'un cratère central ;</li><li>existence
        d'une piste et d'une grotte associées aux <strong>Échineurs</strong>,
        dont la nature exacte n'est pas encore définie dans Warbound.</li></ul>

        <h3>Adaptation de campagne</h3>

        <p>Pour rendre le territoire immédiatement exploitable en jeu, les
        Terres des Tranchecrins sont traitées comme un espace où :</p>

        <ul><li>les lignes de vue sont souvent courtes ;</li><li>plusieurs
        passages se ressemblent ;</li><li>les traces disparaissent facilement
        sur la roche ;</li><li>certains itinéraires permettent de contourner les
        zones les plus surveillées ;</li><li>les occupants connaissent mieux les
        reliefs que les voyageurs ;</li><li>des lieux paraissant proches peuvent
        nécessiter un long détour.</li></ul>

        <p>Ces éléments décrivent une logique de terrain et ne constituent pas
        du lore Warcraft supplémentaire.</p>

        <h2>Territoire et lieux importants</h2>

        <table><thead><tr><th>Lieu</th><th>Usage
        MJ</th></tr></thead><tbody><tr><td><strong>Terres des
        Tranchecrins</strong></td><td>Ensemble du territoire hostile, composé de
        ravins, reliefs rouges et passages
        difficiles.</td></tr><tr><td><strong>Tunnel des
        Tranchecrins</strong></td><td>Passage à couvert et point d'embuscade
        naturel.</td></tr><tr><td><strong>Cratère des
        Tranchecrins</strong></td><td>Dépression centrale favorable aux
        campements et aux déplacements
        dissimulés.</td></tr><tr><td><strong>Piste des
        Échineurs</strong></td><td>Sentier secondaire reliant les reliefs
        occidentaux aux terres sauvages. La nature exacte des Échineurs reste à
        fixer.</td></tr><tr><td><strong>Grotte des
        Échineurs</strong></td><td>Refuge ou tanière occidentale associée aux
        Échineurs. Sa fonction précise reste à
        définir.</td></tr></tbody></table>

        <h2>Relations</h2>

        <h3>Tranchecolline</h3>

        <p>Les Terres des Tranchecrins représentent une menace proche des
        espaces fréquentés par la Horde. Les rumeurs venant de Tranchecolline
        tendent donc à présenter le territoire à travers les préoccupations des
        voyageurs, des gardes, des chasseurs et des habitants : routes menacées,
        disparitions, mouvements ennemis et sécurité des abords.</p>

        <h3>Tranchecrins</h3>

        <p><strong>Canon / établi dans les informations fournies :</strong> les
        Tranchecrins sont des quilboars Razormane et constituent la présence
        hostile dominante du territoire.</p>

        <p>Leur organisation locale précise, leurs motivations et leur
        répartition entre les différents lieux ne sont pas établies dans les
        sources fournies.</p>

        <h3>Échineurs</h3>

        <p><strong>Information à vérifier / non établie dans les sources
        fournies.</strong></p>

        <p>La Piste des Échineurs et la Grotte des Échineurs existent dans le
        découpage de zone fourni, mais la nature exacte des Échineurs doit
        encore être définie dans Warbound.</p>

        <p>Les rumeurs peuvent donc volontairement leur attribuer des
        descriptions contradictoires sans établir immédiatement laquelle est
        exacte.</p>

        <h2>Tensions actuelles</h2>

        <p>Les informations fournies permettent de poser plusieurs tensions
        directement utilisables :</p>

        <ul><li>empiètement Tranchecrin sur les marges occidentales de
        Tranchecolline ;</li><li>contrôle incertain des passages à travers les
        ravins ;</li><li>risque d'embuscade dans le Tunnel des Tranchecrins
        ;</li><li>difficulté à savoir ce qui se passe dans le Cratère
        ;</li><li>circulation sur la Piste des Échineurs malgré son caractère
        hostile ;</li><li>méconnaissance de la Grotte des Échineurs
        ;</li><li>confusion possible entre dangers réels, traces Tranchecrins et
        phénomènes naturels.</li></ul>

        <h3>Adaptation de campagne</h3>

        <p>Les rumeurs suivantes partent volontairement de ce socle limité et
        ajoutent des témoignages, erreurs, superstitions et situations locales
        destinées à donner de la profondeur au territoire.</p>

        <p>Aucune de ces adaptations ne doit être considérée comme du lore
        Warcraft officiel.</p>

        <h2>Secrets et zones d'ombre</h2>

        <h3>Canon / établi</h3>

        <ul><li>Les Tranchecrins occupent le territoire.</li><li>La zone est
        hostile.</li><li>Le Tunnel des Tranchecrins constitue un passage naturel
        propice aux embuscades.</li><li>Le Cratère est une dépression centrale
        utilisable pour des campements et des déplacements
        dissimulés.</li><li>La Piste et la Grotte des Échineurs existent comme
        lieux de la zone.</li></ul>

        <h3>Déduction raisonnable</h3>

        <ul><li>Les Tranchecrins connaissent vraisemblablement mieux leurs
        propres passages que les voyageurs.</li><li>Les reliefs peuvent masquer
        les mouvements d'un groupe à faible distance.</li><li>Plusieurs versions
        contradictoires d'un même incident peuvent être sincères en raison de la
        mauvaise visibilité du territoire.</li></ul>

        <h3>Adaptation de campagne</h3>

        <ul><li>Certaines marques laissées sur les chemins servent de repères
        plutôt que de menaces.</li><li>Plusieurs itinéraires secondaires
        changent d'utilité selon les mouvements des occupants.</li><li>Certaines
        rumeurs sur les Échineurs sont entretenues précisément parce que presque
        personne ne sait ce qu'ils sont réellement.</li></ul>

        <h2>Ce qu'un voyageur remarque</h2>

        <ul><li>Les roches rouges découpent rapidement l'horizon en couloirs
        étroits.</li><li>Les taillis secs accrochent vêtements, sacs et
        équipements.</li><li>Des pierres roulent parfois dans un ravin sans que
        l'on distingue ce qui les a déplacées.</li><li>Les traces sont faciles à
        suivre dans la poussière et presque impossibles à lire sur les plaques
        rocheuses.</li><li>Certains passages paraissent praticables de loin
        avant de se terminer brutalement.</li><li>Le vent transporte des sons
        difficiles à localiser entre les parois.</li><li>Les hauteurs offrent
        d'excellents points d'observation à ceux qui les occupent
        déjà.</li><li>Les voyageurs expérimentés évitent de rester longtemps au
        fond des ravins.</li><li>Plusieurs marques sur les rochers peuvent être
        prises pour des signes intentionnels ou de simples griffures
        naturelles.</li><li>À proximité des passages les plus étroits, les
        conversations deviennent spontanément plus discrètes.</li></ul>
      format: 1
