  - name: Les marques sur les rochers
    type: text
    sort: 800000
    text:
      content: >-
        <h2>Les marques sur les rochers</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Tu verras des entailles sur les pierres. Une marque
        signifie que tu es observé. Deux que tu dois faire demi-tour. Personne
        ne sait ce que trois veulent dire. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Mauvaise interprétation.</p>

        <h3>Qui ?</h3>

        <p>Les voyageurs découvrant les marques pour la première fois leur
        attribuent volontiers une fonction d'avertissement.</p>

        <p>Les récits diffèrent tellement que presque chaque groupe possède son
        propre système d'interprétation.</p>

        <h3>Quoi ?</h3>

        <p>Aucune signification canonique n'est établie dans les informations
        fournies.</p>

        <p><strong>Adaptation de campagne :</strong> certaines marques sont de
        simples traces naturelles, d'autres peuvent avoir été laissées par des
        voyageurs ou par les occupants du territoire comme repères.</p>

        <p>Elles n'appartiennent pas toutes au même système.</p>

        <h3>Quand ?</h3>

        <p>Les marques ont des âges différents.</p>

        <p>Certaines sont anciennes, d'autres récentes.</p>

        <h3>Où ?</h3>

        <p>Aux bifurcations, près des passages étroits et sur plusieurs hauteurs
        rocheuses.</p>

        <h3>Pourquoi ?</h3>

        <p>Les voyageurs cherchent naturellement un langage dans des motifs
        répétés.</p>

        <p>La menace Tranchecrin encourage à interpréter tout signe comme
        hostile.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Comparer les marques, leur usure et leur emplacement peut permettre
        d'identifier lesquelles ont réellement été faites
        intentionnellement.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: marques-sur-les-rochers
          sourceHash: 1906204a
