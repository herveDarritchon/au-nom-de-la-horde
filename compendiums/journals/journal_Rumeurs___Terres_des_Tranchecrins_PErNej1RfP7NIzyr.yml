  - name: Les Tranchecrins descendent
    type: text
    sort: 600000
    text:
      content: >-
        <h2>Les Tranchecrins descendent</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Ils étaient plus loin avant. Maintenant, on retrouve
        leurs traces presque aux portes de Tranchecolline. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Des gardes, voyageurs et habitants préoccupés par l'empiètement
        Tranchecrin font circuler cette rumeur.</p>

        <p>Certains ont vu des traces réelles ; d'autres répètent simplement ce
        qu'ils ont entendu.</p>

        <h3>Quoi ?</h3>

        <p>Les informations fournies établissent déjà une situation
        d'empiètement territorial.</p>

        <p>La rumeur transforme cependant chaque trace isolée en preuve d'une
        avancée organisée.</p>

        <p>Il n'est pas établi que tous les mouvements observés correspondent à
        une expansion coordonnée.</p>

        <h3>Quand ?</h3>

        <p>La rumeur est actuelle et gagne en importance lorsque plusieurs
        incidents surviennent dans un intervalle court.</p>

        <h3>Où ?</h3>

        <p>Sur les marges orientales des Terres des Tranchecrins, en direction
        de Tranchecolline.</p>

        <h3>Pourquoi ?</h3>

        <p>Une frontière mal définie donne facilement l'impression qu'elle se
        déplace.</p>

        <p>Les gardes interprètent logiquement toute présence nouvelle comme une
        menace potentielle.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent comparer d'anciennes traces avec les plus récentes,
        observer les mouvements réellement effectués ou chercher à comprendre si
        certains groupes Tranchecrins agissent différemment des autres.</p>

        <h3>Si personne n'agit</h3>

        <p>La méfiance augmente et les voyageurs commencent à considérer comme
        hostile une portion toujours plus large du territoire.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: tranchecrins-descendent
          sourceHash: 8399a14b
