  - name: L'eau du cratère
    type: text
    sort: 1200000
    text:
      content: >-
        <h2>L'eau du cratère</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Ils ne défendent pas ces cailloux pour rien. Il y a de
        l'eau au fond du cratère. Assez pour tenir tout un camp.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>La rumeur circule parmi les voyageurs qui cherchent une explication
        simple à l'intérêt des Tranchecrins pour le Cratère.</p>

        <p>Les personnes préoccupées par les ressources de Durotar lui accordent
        facilement du crédit.</p>

        <h3>Quoi ?</h3>

        <p>Aucune ressource en eau n'est établie dans les informations
        fournies.</p>

        <p><strong>Adaptation de campagne :</strong> une petite réserve
        saisonnière ou un suintement peut exister dans une partie protégée du
        cratère, sans constituer la source importante décrite par la rumeur.</p>

        <h3>Quand ?</h3>

        <p>La présence d'eau varie selon les conditions locales.</p>

        <p>La rumeur devient naturellement plus populaire lorsqu'elle est
        difficile à vérifier.</p>

        <h3>Où ?</h3>

        <p>Dans une partie basse et difficilement visible du Cratère des
        Tranchecrins.</p>

        <h3>Pourquoi ?</h3>

        <p>Dans une terre rude, une ressource en eau fournit une explication
        crédible à presque toute occupation durable.</p>

        <p>L'idée est suffisamment plausible pour être répétée comme un
        fait.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent rechercher les traces d'animaux, la végétation ou les
        chemins régulièrement empruntés vers les points les plus bas.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: eau-du-cratere
          sourceHash: f088fe5a
