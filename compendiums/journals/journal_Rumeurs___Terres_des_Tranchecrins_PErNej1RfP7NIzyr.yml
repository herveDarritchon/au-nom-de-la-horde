  - name: Les pierres qui sifflent
    type: text
    sort: 300000
    text:
      content: >-
        <h2>Les pierres qui sifflent</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Quand les pierres se mettent à siffler, baisse-toi. Les
        Tranchecrins sont déjà au-dessus de toi. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Déformée.</p>

        <h3>Qui ?</h3>

        <p>La rumeur circule surtout parmi les voyageurs nerveux et les
        personnes ayant entendu parler d'embuscades sans y avoir assisté.</p>

        <p>Quelques survivants sont persuadés que le phénomène est réel.</p>

        <h3>Quoi ?</h3>

        <p>Il n'existe pas, dans les informations fournies, de système
        Tranchecrin établi reposant sur des pierres sifflantes.</p>

        <p><strong>Adaptation de campagne :</strong> le vent peut produire des
        sons aigus lorsqu'il traverse certaines fissures étroites. Les mêmes
        reliefs constituent aussi de bons postes d'embuscade.</p>

        <p>Les deux phénomènes ont été associés.</p>

        <h3>Quand ?</h3>

        <p>Le bruit apparaît uniquement lorsque le vent souffle selon certains
        angles.</p>

        <p>La rumeur existe probablement depuis qu'un témoin a entendu le son
        juste avant une attaque.</p>

        <h3>Où ?</h3>

        <p>Principalement dans les ravins et passages rocheux étroits.</p>

        <h3>Pourquoi ?</h3>

        <p>Une coïncidence marquante est devenue un avertissement populaire.</p>

        <p>Comme il est parfois effectivement prudent de lever les yeux lorsque
        le vent change, la superstition continue de sembler utile.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent découvrir que le sifflement révèle surtout la forme du
        terrain et les courants d'air.</p>

        <p>Un groupe observateur pourrait même apprendre à l'utiliser comme
        repère géographique.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>
      format: 1
