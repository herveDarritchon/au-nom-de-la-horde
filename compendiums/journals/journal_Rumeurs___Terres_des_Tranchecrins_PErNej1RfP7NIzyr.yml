  - name: La route des chasseurs
    type: text
    sort: 1400000
    text:
      content: >-
        <h2>La route des chasseurs</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Les gardes disent d'éviter les Tranchecrins. Les
        chasseurs, eux, passent là chaque semaine. Cherche l'erreur.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Des habitants de Tranchecolline critiquent parfois les avertissements
        officiels en constatant que certains chasseurs continuent d'emprunter
        les marges du territoire.</p>

        <p>Les chasseurs concernés évitent généralement de détailler leurs
        itinéraires.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> certains chasseurs
        utilisent effectivement une portion relativement praticable des reliefs
        lorsque les conditions semblent favorables.</p>

        <p>Cela ne signifie pas que la zone soit sûre.</p>

        <h3>Quand ?</h3>

        <p>Le passage est utilisé irrégulièrement selon l'activité observée sur
        le territoire.</p>

        <h3>Où ?</h3>

        <p>Sur les marges des Terres des Tranchecrins, sans nécessairement
        pénétrer jusqu'au Cratère.</p>

        <h3>Pourquoi ?</h3>

        <p>Un trajet risqué peut rester rentable s'il permet d'éviter un long
        détour.</p>

        <p>Les habitués acceptent parfois un niveau de danger que les autorités
        déconseillent au voyageur ordinaire.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Un chasseur pourrait partager certains repères s'il leur fait
        confiance, ou simplement leur montrer comment reconnaître les signes
        indiquant qu'il vaut mieux rebrousser chemin.</p>

        <h3>Si personne n'agit</h3>

        <p>Le passage continue d'être utilisé jusqu'à ce qu'un incident
        suffisamment grave pousse les chasseurs à changer leurs habitudes.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: route-des-chasseurs
