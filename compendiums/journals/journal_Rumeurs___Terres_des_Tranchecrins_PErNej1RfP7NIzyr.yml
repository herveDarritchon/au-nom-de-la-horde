  - name: La piste sans retour
    type: text
    sort: 400000
    text:
      content: >-
        <h2>La piste sans retour</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Sur la Piste des Échineurs, tu crois toujours revenir
        sur tes pas. Puis le soleil descend et tu découvres que tu marches vers
        l'ouest depuis deux heures. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Exagération.</p>

        <h3>Qui ?</h3>

        <p>La rumeur est répétée par des voyageurs peu familiers du secteur et
        par ceux qui préfèrent justifier une mauvaise orientation par la
        réputation du lieu.</p>

        <p>Les chasseurs expérimentés la prennent moins au sérieux.</p>

        <h3>Quoi ?</h3>

        <p>La piste n'altère pas magiquement l'orientation des voyageurs.</p>

        <p><strong>Adaptation de campagne :</strong> plusieurs ravins et courbes
        du terrain rendent les repères visuels trompeurs. Des embranchements
        secondaires peuvent ramener vers des paysages presque identiques.</p>

        <h3>Quand ?</h3>

        <p>Le risque augmente lorsque la lumière baisse ou lorsque le ciel ne
        permet plus de s'orienter facilement.</p>

        <h3>Où ?</h3>

        <p>Sur la Piste des Échineurs et ses abords immédiats.</p>

        <h3>Pourquoi ?</h3>

        <p>Le territoire possède peu de repères distinctifs pour quelqu'un qui
        ne le connaît pas.</p>

        <p>Chaque voyageur perdu renforce ensuite l'idée que la piste elle-même
        est responsable.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent cartographier les bifurcations, identifier des repères
        fiables ou demander à un habitué comment reconnaître les mauvais
        embranchements.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>
      format: 1
