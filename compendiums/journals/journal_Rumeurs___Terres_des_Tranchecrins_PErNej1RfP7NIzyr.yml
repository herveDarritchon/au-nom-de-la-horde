  - name: Le bruit attire les Tranchecrins
    type: text
    sort: 1900000
    text:
      content: >-
        <h2>Le bruit attire les Tranchecrins</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Tu peux parler dans la plaine. Dans les ravins, même
        ton voisin n'a pas besoin de connaître ton opinion. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Les éclaireurs, chasseurs et voyageurs prudents transmettent ce
        conseil.</p>

        <p>Les versions les plus alarmistes prétendent que les Tranchecrins
        peuvent entendre une conversation à travers plusieurs parois
        rocheuses.</p>

        <h3>Quoi ?</h3>

        <p>Le relief peut transporter ou amplifier certains sons.</p>

        <p>Cela ne signifie pas qu'un ennemi puisse localiser automatiquement
        leur source.</p>

        <p>Le conseil de discrétion reste néanmoins pertinent dans un territoire
        hostile.</p>

        <h3>Quand ?</h3>

        <p>Le phénomène dépend du vent, de la position dans les ravins et de la
        nature des parois.</p>

        <h3>Où ?</h3>

        <p>Dans les passages étroits des Terres des Tranchecrins.</p>

        <h3>Pourquoi ?</h3>

        <p>Quelques expériences où des groupes bruyants ont été repérés ont
        transformé une règle de prudence ordinaire en capacité presque
        surnaturelle attribuée aux occupants.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent expérimenter avec les échos, utiliser volontairement un
        bruit pour détourner l'attention ou simplement comprendre quels passages
        transmettent le mieux les sons.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: bruit-attire-ennemis
          sourceHash: 126d6898
