  - name: Les Échineurs ne sont jamais les mêmes
    type: text
    sort: 1300000
    text:
      content: >-
        <h2>Les Échineurs ne sont jamais les mêmes</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Demande à cinq personnes ce qu'est un Échineur. Tu
        auras six réponses. Alors moi, je n'appelle plus rien comme ça.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Voyageurs, chasseurs et habitants ayant entendu différentes versions
        des histoires liées à la Piste et à la Grotte des Échineurs.</p>

        <h3>Quoi ?</h3>

        <p>La nature exacte des Échineurs n'est effectivement pas établie dans
        les informations fournies.</p>

        <p>En jeu, cela se traduit par des descriptions contradictoires :
        créature, groupe, surnom, menace précise ou terme local mal compris.</p>

        <h3>Quand ?</h3>

        <p>La confusion existe tant qu'aucune observation suffisamment fiable ne
        vient imposer une définition commune.</p>

        <h3>Où ?</h3>

        <p>Principalement autour de la Piste des Échineurs et de la Grotte du
        même nom.</p>

        <h3>Pourquoi ?</h3>

        <p>Très peu de témoins peuvent comparer directement leur expérience avec
        celle des autres.</p>

        <p>Le même nom peut donc être appliqué à plusieurs traces ou
        incidents.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent commencer par collecter les versions plutôt que chercher
        immédiatement une créature précise.</p>

        <p>Les contradictions elles-mêmes constituent une information.</p>

        <h3>Si personne n'agit</h3>

        <p>La réputation des Échineurs devient progressivement plus confuse et
        plus inquiétante.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: echineurs-changent
          sourceHash: 9bff25ec
