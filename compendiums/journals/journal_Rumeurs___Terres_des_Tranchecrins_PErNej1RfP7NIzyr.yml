  - name: Des tambours sous la roche
    type: text
    sort: 1500000
    text:
      content: >-
        <h2>Des tambours sous la roche</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« On les entend surtout le soir. Boum… silence… boum…
        comme si la montagne avait un cœur. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Déformée.</p>

        <h3>Qui ?</h3>

        <p>Des voyageurs ayant campé près des reliefs occidentaux sont à
        l'origine des témoignages.</p>

        <p>Les versions les plus récentes parlent déjà de cérémonies ou de
        signaux de guerre, sans preuve.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> des chocs réguliers
        résonnent effectivement parfois dans les ravins.</p>

        <p>Ils peuvent provenir d'activités ordinaires, de déplacements sur la
        roche ou d'un phénomène acoustique amplifiant des sons produits très
        loin.</p>

        <p>La rumeur leur attribue immédiatement une fonction rituelle.</p>

        <h3>Quand ?</h3>

        <p>Le phénomène est intermittent et plus facile à percevoir lorsque les
        autres bruits diminuent.</p>

        <h3>Où ?</h3>

        <p>Dans plusieurs zones rocheuses, particulièrement autour des passages
        où l'écho porte loin.</p>

        <h3>Pourquoi ?</h3>

        <p>Un rythme régulier paraît intentionnel.</p>

        <p>L'impossibilité d'en déterminer la direction renforce l'impression
        qu'il vient « de sous la roche ».</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent comparer l'intensité du son depuis plusieurs positions ou
        chercher sa source plutôt que se fier à sa direction apparente.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: tambours-sous-la-roche
