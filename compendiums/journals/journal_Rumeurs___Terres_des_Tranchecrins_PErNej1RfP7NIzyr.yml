  - name: Les trois passages
    type: text
    sort: 500000
    text:
      content: >-
        <h2>Les trois passages</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Le tunnel est pour ceux qui ne connaissent pas le pays.
        Il existe trois autres passages. J'en ai pris deux. Le troisième, je ne
        veux plus en parler. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>L'origine actuelle de la rumeur est attribuée à un ancien éclaireur
        dont plusieurs versions de l'histoire circulent.</p>

        <p>Les voyageurs cherchent régulièrement à lui faire préciser ses
        indications.</p>

        <h3>Quoi ?</h3>

        <p>Les informations fournies ne définissent pas trois routes
        alternatives précises.</p>

        <p><strong>Adaptation de campagne :</strong> plusieurs passages
        secondaires existent effectivement dans le relief, mais leur
        praticabilité varie et le nombre de routes réellement utilisables dépend
        du point de départ et de la destination.</p>

        <p>Le fameux « troisième passage » est surtout devenu un élément de
        folklore.</p>

        <h3>Quand ?</h3>

        <p>La rumeur ressurgit chaque fois que le Tunnel des Tranchecrins paraît
        trop dangereux.</p>

        <h3>Où ?</h3>

        <p>Les passages supposés se trouveraient dans les reliefs entourant le
        tunnel et le cratère.</p>

        <h3>Pourquoi ?</h3>

        <p>La possibilité d'éviter un passage contrôlé est crédible dans un
        terrain aussi accidenté.</p>

        <p>L'imprécision du récit permet à chacun d'y ajouter son propre
        raccourci.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent rechercher des itinéraires réellement praticables et
        éventuellement transformer une rumeur confuse en connaissance utile du
        pointcrawl.</p>

        <h3>Si personne n'agit</h3>

        <p>Les versions continuent de diverger et certains voyageurs se perdent
        en cherchant un raccourci qui n'existe peut-être que dans leur
        récit.</p>
      format: 1
