  - name: La charrette disparue
    type: text
    sort: 1600000
    text:
      content: >-
        <h2>La charrette disparue</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Elle est entrée dans les ravins avec deux bêtes et
        trois personnes. De l'autre côté : rien. Pas même une roue cassée.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Des voyageurs ayant croisé la charrette avant son entrée dans le
        secteur constituent la base du récit.</p>

        <p>Les détails varient déjà concernant le nombre de passagers et son
        chargement.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> une charrette n'est
        effectivement pas arrivée à destination.</p>

        <p>Il n'est cependant pas établi qu'elle ait disparu dans les Terres des
        Tranchecrins : elle a pu changer de route, subir un incident ou être
        volontairement détournée.</p>

        <h3>Quand ?</h3>

        <p>La disparition supposée est récente, ce qui explique la circulation
        rapide de la rumeur.</p>

        <h3>Où ?</h3>

        <p>Le dernier témoignage fiable la situe près d'un accès aux ravins.</p>

        <p>Sa destination exacte peut être connue de certaines personnes à
        Tranchecolline.</p>

        <h3>Pourquoi ?</h3>

        <p>L'absence de débris sur la route principale paraît plus mystérieuse
        qu'un accident ordinaire.</p>

        <p>La réputation du territoire fournit immédiatement un coupable
        plausible.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent vérifier les témoignages, identifier le chargement,
        retrouver les traces de roues ou chercher si la charrette a réellement
        emprunté la route que tout le monde suppose.</p>

        <h3>Si personne n'agit</h3>

        <p>Les traces s'effacent et les versions deviennent de moins en moins
        fiables.</p>

        <p>La disparition finit par être automatiquement attribuée aux
        Tranchecrins.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-rumors
          entryId: charrette-disparue
          sourceHash: 67b15b25
