  - _id: 0a1227415626434c
    name: 06 · Routes et accès
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Routes, accès et compromis — Z02</h2><h3>Liaisons principales
        R01–R08</h3><table><thead><tr><th>Route</th><th>Liaison / zones
        d'arrivée</th><th>Tag et compromis établis</th><th>Terrain / danger **de
        départ
        proposé**</th><th>Statut</th></tr></thead><tbody><tr><td><strong>R05</strong></td><td>Falaises
        du Tonnerre Z03 ↔ Rocher du crâne Z02</td><td><strong>Sentier des crêtes
        caché</strong> ; étroit, faune, discrétion</td><td>Sur le
        <strong>sentier découvert</strong> : ne pas appliquer « hors piste » par
        défaut ; <strong>terrain difficile ÷2</strong> si le passage le
        justifie, <strong>hors sentier ÷2</strong> ; sauvage <strong>DD
        15</strong></td><td><strong>Caché</strong> jusqu'à
        découverte</td></tr><tr><td><strong>R06</strong></td><td>Tranchecolline
        Z04 ↔ Rocher du crâne Z02</td><td><strong>Voie nord rapide et
        exposée</strong> ; circulation vers Orgrimmar</td><td>Voie connue
        <strong>DD 10 frontalière</strong> sur portion sûre ; sauvage <strong>DD
        15</strong> sur l'approche finale</td><td>Visible, non forcément
        sûr</td></tr></tbody></table><h3>État actuel (à
        compléter)</h3><table><thead><tr><th>Route</th><th>Connaissance des
        PJ</th><th>Accès</th><th>État /
        compromis</th></tr></thead><tbody><tr><td>R05</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>R06</td><td>À renseigner</td><td>À
        renseigner</td><td>À
        renseigner</td></tr></tbody></table><blockquote><p><strong>Les huit
        liaisons sont des choix qualitatifs, pas des distances.</strong> Les
        trajets Rxx et RX-xx n’ont pas de durée ni de kilométrage validés. Ne
        pas transformer une liaison cachée en chemin connu sans découverte en
        jeu.</p></blockquote>
