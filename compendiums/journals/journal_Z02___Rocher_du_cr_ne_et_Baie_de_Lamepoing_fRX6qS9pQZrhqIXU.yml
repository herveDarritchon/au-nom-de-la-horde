  - _id: 60487c7733e11833
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z02</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z02-01</code> Rocher du
        crâne</td><td><strong>Nœud [6]</strong>, donjon</td><td>[PC]
        [FAC]</td></tr><tr><td><code>Z02-02</code> Baie de
        Lamepoing</td><td>Littoral</td><td>[CLASSIC]</td></tr><tr><td><code>Z02-03</code>
        Sentier de crête depuis Z03</td><td>Route
        secrète</td><td>[PC]</td></tr><tr><td><code>Z02-04</code> Approche nord
        visible</td><td>Route</td><td>[GUIDE]</td></tr></tbody></table><h3>Implantation
        et rôle des lieux</h3><p><code>Z02-01</code> Rocher du crâne <strong>[6,
        mini-donjon]</strong> ; <code>Z02-02</code> Baie de Lamepoing
        <strong>[CLASSIC]</strong> ; <code>Z02-03</code> sentier des crêtes vers
        Z03 <strong>[PC, caché]</strong> ; <code>Z02-04</code> approches nord
        depuis l'axe d'Orgrimmar <strong>[PC /
        GUIDE]</strong>.</p><h3>Connaissance des PJ (à renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
