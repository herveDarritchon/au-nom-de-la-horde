  - name: Les cairns déplacés
    type: text
    sort: 900000
    text:
      content: >-
        <h2>Les cairns déplacés</h2>

        <h3>Situation</h3>

        <p>Les petits empilements de pierres utilisés comme repères dans les
        ravins ne mènent plus aux mêmes passages.</p>

        <p>Plusieurs voyageurs se sont égarés et certains accusent déjà les
        Tranchecrins de modifier volontairement les indications.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs habitués au secteur</strong> : veulent
        retrouver leurs repères.</li><li><strong>Nouveaux voyageurs</strong> :
        suivent aveuglément les cairns.</li><li><strong>Un utilisateur régulier
        de la piste</strong> : déplace certains repères pour protéger son propre
        itinéraire.</li><li><strong>Tranchecrins</strong> : sont accusés sans
        preuve.</li></ul>

        <h3>Quoi ?</h3>

        <p>Les cairns n'appartiennent pas à un système unique.</p>

        <p><strong>Adaptation de campagne :</strong> un voyageur expérimenté a
        commencé à déplacer certains repères parce que le passage qu’ils
        signalaient mène désormais trop près d’une zone dangereuse.</p>

        <p>Il pense protéger les autres mais n’a prévenu personne.</p>

        <h3>Quand ?</h3>

        <p>Les modifications ont commencé récemment après un changement d’état
        d’un des passages.</p>

        <h3>Où ?</h3>

        <p>Aux bifurcations reliant les ravins orientaux à la Piste des
        Échineurs.</p>

        <h3>Pourquoi ?</h3>

        <p>Un système informel fonctionne tant que tout le monde partage
        implicitement les mêmes habitudes.</p>

        <p>Une modification bien intentionnée suffit à transformer l’ensemble en
        piège.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ suivent un cairn et arrivent au mauvais
        endroit.</li><li>Des voyageurs reviennent furieux après s’être
        perdus.</li><li>Un chasseur remarque qu’un empilement a été reconstruit
        différemment.</li><li>Un garde veut détruire tous les cairns.</li></ul>

        <h3>Approches possibles</h3>

        <p>Cartographier les repères, identifier celui qui les déplace, établir
        un système commun, supprimer les cairns ou accepter qu’un réseau
        informel reste volontairement ambigu.</p>

        <h3>Complication</h3>

        <p>Certains repères ont également été déplacés par le vent, des animaux
        ou d’autres voyageurs. Tous les changements n’ont donc pas le même
        responsable.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les cairns perdent leur crédibilité. Les voyageurs créent chacun
        leurs propres marques, rendant la navigation encore plus confuse.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Un système fiable de repérage apparaît.</li><li>Les cairns
        disparaissent.</li><li>Le passage dangereux est identifié.</li><li>Le
        responsable est injustement traité comme saboteur.</li><li>Les PJ
        acquièrent leur propre connaissance fiable du terrain.</li></ul>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-hooks
          entryId: cairns-deplaces
          sourceHash: e329a535
