  - name: La piste effondrée
    type: text
    sort: 1300000
    text:
      content: >-
        <h2>La piste effondrée</h2>

        <h3>Situation</h3>

        <p>Une portion de la Piste des Échineurs s’est effondrée dans un
        ravin.</p>

        <p>Les personnes situées du mauvais côté n’ont plus de voie de retour
        évidente.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs isolés</strong> : cherchent une
        sortie.</li><li><strong>Leurs proches</strong> : ignorent encore
        précisément où ils se trouvent.</li><li><strong>Chasseurs
        locaux</strong> : connaissent certains détours
        possibles.</li><li><strong>Tranchecrins</strong> : voient les mouvements
        de voyageurs se déplacer vers leur territoire.</li></ul>

        <h3>Quoi ?</h3>

        <p>L’effondrement est naturel.</p>

        <p>Il transforme cependant la géographie pratique du secteur : un chemin
        auparavant secondaire devient soudain essentiel, tandis que plusieurs
        voyageurs doivent improviser.</p>

        <h3>Quand ?</h3>

        <p>L’effondrement vient de se produire.</p>

        <p>Les personnes isolées disposent de ressources limitées et devront
        bientôt décider si elles attendent ou tentent un passage risqué.</p>

        <h3>Où ?</h3>

        <p>Sur la Piste des Échineurs, avec plusieurs ravins permettant des
        détours plus ou moins dangereux.</p>

        <h3>Pourquoi ?</h3>

        <p>Le relief est instable et les itinéraires de la région ne sont pas
        garantis.</p>

        <p>Le problème devient territorial lorsque les détours passent par des
        zones contrôlées par d’autres.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ découvrent directement l’effondrement.</li><li>Des
        proches signalent plusieurs voyageurs en retard.</li><li>Une personne
        isolée réussit à envoyer un signal depuis une hauteur.</li><li>Des
        Tranchecrins sont observés près d’un détour possible.</li></ul>

        <h3>Approches possibles</h3>

        <p>Chercher un nouveau passage, atteindre les isolés par un autre côté,
        négocier un transit temporaire ou attendre qu’ils trouvent eux-mêmes une
        sortie.</p>

        <h3>Complication</h3>

        <p>Le chemin le plus sûr pour atteindre les voyageurs traverse
        précisément une zone que les Tranchecrins considèrent comme
        interdite.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les isolés tentent leur propre sortie. Certains y parviennent,
        d’autres aggravent leur situation.</p>

        <p>La circulation locale se réorganise durablement.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Un nouveau raccourci est découvert.</li><li>La Piste cesse
        d’être utilisée.</li><li>Un accord temporaire de passage est
        négocié.</li><li>Des voyageurs sont perdus ou blessés.</li><li>La carte
        pratique du territoire est modifiée.</li></ul>
      format: 1
