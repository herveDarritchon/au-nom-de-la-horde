  - name: Le raccourci des marchands
    type: text
    sort: 700000
    text:
      content: >-
        <h2>Le raccourci des marchands</h2>

        <h3>Situation</h3>

        <p>Quelques voyageurs commencent à emprunter la Piste des Échineurs pour
        raccourcir leurs trajets.</p>

        <p>Le gain de temps est réel. Les incidents aussi.</p>

        <p>Pourtant, ceux qui profitent du raccourci refusent de
        l’abandonner.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs et petits marchands</strong> : veulent réduire
        les détours.</li><li><strong>Guides improvisés</strong> : commencent à
        faire payer leur connaissance de la
        piste.</li><li><strong>Gardes</strong> : préfèrent concentrer la
        circulation sur les routes connues.</li><li><strong>Occupants du
        territoire</strong> : voient augmenter le nombre d’étrangers.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> la piste constitue
        réellement un raccourci dans certaines conditions.</p>

        <p>Le danger vient moins d’une menace unique que de son succès croissant
        : plus elle est utilisée, plus elle attire de personnes inexpérimentées
        et plus elle devient visible.</p>

        <h3>Quand ?</h3>

        <p>Le phénomène est récent et s’accélère à mesure que la réputation du
        raccourci se répand.</p>

        <h3>Où ?</h3>

        <p>Sur la Piste des Échineurs et ses accès orientaux.</p>

        <h3>Pourquoi ?</h3>

        <p>Le temps gagné possède une valeur concrète.</p>

        <p>Personne n’a besoin d’être malveillant pour qu’un raccourci rentable
        crée progressivement un nouveau problème territorial.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ croisent plusieurs voyageurs empruntant une route réputée
        hostile.</li><li>Un guide propose de leur vendre le passage.</li><li>Des
        gardes discutent de fermer l’accès.</li><li>Une cargaison arrive à
        Tranchecolline bien plus tôt que prévu.</li></ul>

        <h3>Approches possibles</h3>

        <p>Tester le raccourci, cartographier ses dangers, protéger un groupe,
        convaincre les voyageurs de l’éviter, réglementer son usage ou garder le
        passage secret.</p>

        <h3>Complication</h3>

        <p>Un guide commence à exagérer sa connaissance de la piste afin
        d’attirer davantage de clients.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le trafic augmente jusqu’à provoquer un accident grave ou une
        réaction des occupants du territoire.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>La piste devient un itinéraire connu.</li><li>Elle reste un
        secret partagé par quelques initiés.</li><li>Les gardes la
        ferment.</li><li>Des voyageurs cessent de faire confiance aux
        guides.</li><li>Son utilisation modifie l’équilibre local.</li></ul>
      format: 1
