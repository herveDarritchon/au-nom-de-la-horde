  - name: Les guetteurs des hauteurs
    type: text
    sort: 1600000
    text:
      content: >-
        <h2>Les guetteurs des hauteurs</h2>

        <h3>Situation</h3>

        <p>Depuis plusieurs jours, des silhouettes sont aperçues sur les
        hauteurs dominant les passages.</p>

        <p>Elles observent les voyageurs mais ne descendent presque jamais.</p>

        <p>Les gardes commencent à parler de préparation d’embuscades.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Guetteurs Tranchecrins</strong> : surveillent
        l’évolution du trafic.</li><li><strong>Gardes de la Horde</strong> :
        veulent faire cesser cette
        observation.</li><li><strong>Voyageurs</strong> : modifient leur
        comportement parce qu’ils se savent
        surveillés.</li><li><strong>Chasseurs</strong> : remarquent que les
        guetteurs s’intéressent surtout à certains trajets.</li></ul>

        <h3>Quoi ?</h3>

        <p>Les guetteurs collectent réellement des informations.</p>

        <p>Ils cherchent principalement à identifier quels passages deviennent
        régulièrement utilisés par la Horde.</p>

        <p>Ils ne préparent pas nécessairement une attaque immédiate.</p>

        <h3>Quand ?</h3>

        <p>La surveillance s’intensifie depuis que le nombre de voyageurs a
        augmenté sur plusieurs routes secondaires.</p>

        <h3>Où ?</h3>

        <p>Sur les crêtes dominant les ravins orientaux et certains accès au
        Tunnel.</p>

        <h3>Pourquoi ?</h3>

        <p>Une faction occupant un territoire hostile a intérêt à connaître les
        mouvements de ses voisins.</p>

        <p>La présence visible des guetteurs peut aussi servir
        d’avertissement.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ repèrent une silhouette les suivant depuis une
        hauteur.</li><li>Un garde veut organiser une opération pour capturer un
        observateur.</li><li>Un chasseur constate que certains itinéraires ne
        sont jamais surveillés.</li><li>Un guetteur abandonne précipitamment un
        poste d’observation.</li></ul>

        <h3>Approches possibles</h3>

        <p>Suivre les guetteurs, les éviter, leur fournir volontairement de
        fausses informations, chercher à établir un contact ou modifier les
        routes utilisées.</p>

        <h3>Complication</h3>

        <p>Les mouvements agressifs de la Horde contre les guetteurs deviennent
        eux-mêmes une information confirmant que certains passages sont
        importants.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les Tranchecrins améliorent progressivement leur connaissance des
        déplacements locaux et adaptent leurs propres mouvements.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Les PJ découvrent les habitudes de surveillance.</li><li>Les
        gardes chassent les guetteurs mais révèlent leurs priorités.</li><li>Un
        contact indirect devient possible.</li><li>Les routes
        changent.</li><li>Une future action Tranchecrin bénéficie des
        informations accumulées.</li></ul>
