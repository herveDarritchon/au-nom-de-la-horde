  - name: Le mort sans blessure
    type: text
    sort: 1700000
    text:
      content: >-
        <h2>Le mort sans blessure</h2>

        <h3>Situation</h3>

        <p>Un voyageur est retrouvé mort au fond d’un ravin.</p>

        <p>Son équipement est encore présent et son corps ne porte aucune
        blessure évidente provoquée par une arme.</p>

        <p>Cela n’empêche personne de proposer immédiatement un responsable.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Proches du voyageur</strong> : veulent comprendre sa
        mort.</li><li><strong>Gardes</strong> : cherchent à déterminer s’il
        existe une menace.</li><li><strong>Voyageurs</strong> : commencent à
        éviter le secteur.</li><li><strong>Tranchecrins</strong> : sont
        suspectés malgré l’absence de preuve directe.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> le voyageur est mort après
        avoir subi une combinaison d’épuisement, de chaleur et d’une mauvaise
        décision d’orientation.</p>

        <p>Des traces indiquent qu’il a longtemps marché en cercle avant de
        s’effondrer.</p>

        <h3>Quand ?</h3>

        <p>Le décès est récent.</p>

        <p>Plus le corps reste exposé, plus il devient difficile de distinguer
        les indices utiles des traces laissées ensuite.</p>

        <h3>Où ?</h3>

        <p>Dans un ravin secondaire accessible depuis plusieurs directions.</p>

        <h3>Pourquoi ?</h3>

        <p>Une mort sans explication visible paraît plus inquiétante qu’une
        attaque.</p>

        <p>La réputation hostile du territoire encourage l’hypothèse
        criminelle.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ découvrent le corps.</li><li>Un proche leur parle d’un
        objet manquant.</li><li>Une patrouille commence à suivre des traces
        proches.</li><li>Un voyageur raconte avoir vu la victime plusieurs
        heures avant sa mort.</li></ul>

        <h3>Approches possibles</h3>

        <p>Reconstituer le trajet, examiner l’environnement, rechercher des
        témoins, suivre les traces voisines ou accepter l’hypothèse dominante
        sans enquêter davantage.</p>

        <h3>Complication</h3>

        <p>Un objet appartenant au mort a réellement disparu, mais il a été
        récupéré après son décès par quelqu’un ignorant encore son identité.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>La mort est progressivement attribuée aux Tranchecrins ou aux
        Échineurs selon celui qui raconte l’histoire.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>La cause probable est comprise.</li><li>Un innocent est accusé
        de vol ou de meurtre.</li><li>Le ravin acquiert une réputation
        sinistre.</li><li>Les PJ découvrent une faiblesse dans les itinéraires
        utilisés.</li><li>Le décès provoque des mesures de sécurité utiles ou
        excessives.</li></ul>
      format: 1
