  - name: Les téméraires de Tranchecolline
    type: text
    sort: 1900000
    text:
      content: >-
        <h2>Les téméraires de Tranchecolline</h2>

        <h3>Situation</h3>

        <p>Plusieurs jeunes habitants sont partis vers les Terres des
        Tranchecrins après avoir affirmé que les adultes exagéraient tous les
        dangers de la région.</p>

        <p>Ils auraient prévu de revenir avant la nuit.</p>

        <p>La nuit approche.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Les jeunes téméraires</strong> : veulent prouver leur
        courage et revenir avec une histoire à raconter.</li><li><strong>Leurs
        proches</strong> : oscillent entre colère et
        inquiétude.</li><li><strong>Quelques amis restés à
        Tranchecolline</strong> : savent davantage qu’ils ne veulent
        l’avouer.</li><li><strong>Occupants du territoire</strong> : ignorent
        probablement tout de leur défi.</li></ul>

        <h3>Quoi ?</h3>

        <p>Les jeunes ne sont pas partis combattre les Tranchecrins.</p>

        <p>Ils voulaient atteindre un point remarquable, laisser une marque et
        rentrer.</p>

        <p><strong>Adaptation de campagne :</strong> ils ont été séparés après
        avoir fui un danger qu’ils n’avaient pas anticipé.</p>

        <h3>Quand ?</h3>

        <p>Ils sont partis quelques heures plus tôt.</p>

        <p>La tombée de la nuit transforme progressivement une imprudence en
        véritable situation de survie.</p>

        <h3>Où ?</h3>

        <p>Entre les marges orientales, plusieurs petits ravins et une hauteur
        visible depuis Tranchecolline.</p>

        <h3>Pourquoi ?</h3>

        <p>Les récits répétés sur le territoire ont fini par transformer le
        danger en défi.</p>

        <p>Pour certains jeunes, ne pas y aller revient à admettre qu’ils ont
        peur.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Une dispute familiale éclate à Tranchecolline.</li><li>Un ami
        finit par révéler leur itinéraire.</li><li>Les PJ trouvent une marque
        récente laissée sur un rocher.</li><li>Ils croisent l’un des jeunes
        revenant seul et paniqué.</li></ul>

        <h3>Approches possibles</h3>

        <p>Pister le groupe, attendre leur retour, obtenir des informations
        auprès de leurs amis, utiliser les hauteurs pour les repérer ou
        organiser plusieurs groupes de recherche.</p>

        <h3>Complication</h3>

        <p>Les jeunes se sont séparés volontairement après s’être disputés sur
        la direction à suivre.</p>

        <p>Les retrouver exige donc plusieurs décisions de priorité.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Certains finissent par revenir seuls. Les autres passent la nuit dans
        les ravins et leur situation devient plus dangereuse.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Tous rentrent avec une sérieuse leçon.</li><li>Certains cachent
        encore ce qu’ils ont réellement vu.</li><li>L’incident crée de nouvelles
        interdictions à Tranchecolline.</li><li>Une famille reproche aux autres
        d’avoir entraîné son enfant.</li><li>Les jeunes ont découvert par hasard
        un passage ou une activité jusque-là inconnue.</li></ul>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-hooks
          entryId: jeunes-temeraires
          sourceHash: fc52a17f
