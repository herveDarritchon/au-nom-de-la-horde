  - name: Le tunnel est fermé
    type: text
    sort: 100000
    text:
      content: >-
        <h2>Le tunnel est fermé</h2>

        <h3>Situation</h3>

        <p>Plusieurs voyageurs reviennent vers Tranchecolline après avoir
        renoncé à traverser le Tunnel des Tranchecrins. Certains parlent d’un
        éboulement, d’autres de barricades, d’autres encore affirment avoir
        aperçu des silhouettes derrière les rochers.</p>

        <p>Le résultat est le même : un passage jusque-là dangereux mais
        utilisable est devenu impraticable.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs et chasseurs</strong> : veulent retrouver un
        itinéraire praticable.</li><li><strong>Gardes de la Horde</strong> :
        veulent savoir si la fermeture annonce une action
        hostile.</li><li><strong>Tranchecrins du secteur</strong> : veulent
        empêcher l’utilisation du tunnel.</li><li><strong>Usagers des routes
        occidentales</strong> : subissent les détours et leurs
        conséquences.</li></ul>

        <h3>Quoi ?</h3>

        <p>Un éboulement partiel a réellement endommagé le tunnel.</p>

        <p><strong>Adaptation de campagne :</strong> les Tranchecrins ont
        ensuite exploité l’accident en renforçant les obstacles naturels. Ils
        n’ont pas provoqué l’effondrement initial, contrairement à ce que
        beaucoup supposent.</p>

        <p>Le passage peut encore être franchi, dégagé ou contourné, mais aucune
        option n’est simple.</p>

        <h3>Quand ?</h3>

        <p>L’effondrement est récent.</p>

        <p>La situation devient visible parce que plusieurs groupes arrivent
        simultanément aux abords du tunnel et commencent à chercher des
        alternatives.</p>

        <p>Sans décision rapide, les détours improvisés créeront de nouveaux
        incidents.</p>

        <h3>Où ?</h3>

        <ul><li>entrée orientale du Tunnel ;</li><li>entrée occidentale
        ;</li><li>hauteurs permettant d’observer le passage ;</li><li>ravins
        permettant éventuellement de contourner l’obstacle.</li></ul>

        <h3>Pourquoi ?</h3>

        <p>Les Tranchecrins utilisent un changement du terrain pour renforcer
        leur contrôle sans devoir défendre eux-mêmes chaque mètre du
        passage.</p>

        <p>La Horde interprète naturellement cette exploitation comme la preuve
        que l’effondrement était volontaire.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ arrivent devant une file de voyageurs incapables de
        poursuivre.</li><li>Un garde cherche à comprendre pourquoi plus personne
        ne revient par le tunnel.</li><li>Les PJ doivent eux-mêmes choisir entre
        le tunnel et un détour inconnu.</li><li>Une rumeur affirme que les
        Tranchecrins ont détruit le passage.</li></ul>

        <h3>Approches possibles</h3>

        <p>Observer le tunnel, chercher un détour, dégager une partie de
        l’éboulement, négocier un passage, espionner les positions Tranchecrins
        ou décider que le tunnel ne mérite plus d’être utilisé.</p>

        <h3>Complication</h3>

        <p>Dégager brutalement l’éboulement risque de provoquer un nouvel
        effondrement plus grave et de condamner définitivement le passage.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les voyageurs créent plusieurs itinéraires improvisés. Certains
        fonctionnent, d’autres exposent davantage les déplacements de la Horde
        aux occupants du territoire.</p>

        <p>Le tunnel cesse progressivement d’être la route normale.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Le tunnel redevient praticable mais reste disputé.</li><li>Un
        nouveau raccourci est découvert.</li><li>Les Tranchecrins obtiennent le
        contrôle durable du passage.</li><li>Une tentative de dégagement aggrave
        l’effondrement.</li><li>Une forme d’accord tacite établit des périodes
        ou conditions de passage.</li></ul>
      format: 1
