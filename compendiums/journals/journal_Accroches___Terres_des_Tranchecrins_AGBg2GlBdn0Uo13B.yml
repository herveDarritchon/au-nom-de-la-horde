  - name: Deux prisonniers pour une frontière
    type: text
    sort: 1200000
    text:
      content: >-
        <h2>Deux prisonniers pour une frontière</h2>

        <h3>Situation</h3>

        <p>Un Tranchecrin capturé est retenu près de Tranchecolline.</p>

        <p>Au même moment, un éclaireur de la Horde n’est pas revenu de sa
        patrouille. Beaucoup considèrent déjà qu’il est détenu en
        représailles.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Le prisonnier Tranchecrin</strong> : veut éviter d’être
        traité comme monnaie d’échange pour une affaire qu’il ne connaît
        peut-être pas.</li><li><strong>L’éclaireur disparu</strong> : sa
        situation réelle reste inconnue au départ.</li><li><strong>Les
        gardes</strong> : veulent récupérer leur
        camarade.</li><li><strong>Tranchecrins locaux</strong> : veulent
        récupérer leur membre capturé.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> l’éclaireur n’a pas été
        capturé. Il est immobilisé après un accident dans un ravin.</p>

        <p>Les Tranchecrins ignorent eux aussi sa position.</p>

        <p>Les deux camps risquent donc d’organiser un échange pour un
        prisonnier qui n’existe pas.</p>

        <h3>Quand ?</h3>

        <p>La disparition date de moins d’une journée.</p>

        <p>Chaque heure sans nouvelle renforce la certitude d’une capture.</p>

        <h3>Où ?</h3>

        <ul><li>poste de garde où se trouve le prisonnier ;</li><li>territoire
        où l’éclaireur patrouillait ;</li><li>passages pouvant servir à une
        éventuelle négociation.</li></ul>

        <h3>Pourquoi ?</h3>

        <p>La simultanéité de deux événements crée une causalité imaginaire.</p>

        <p>Les deux camps possèdent de bonnes raisons de croire à une prise
        d’otage adverse.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ assistent à l’interrogatoire du prisonnier.</li><li>Une
        patrouille part chercher un lieu d’échange.</li><li>Ils découvrent une
        trace de l’éclaireur ailleurs.</li><li>Un Tranchecrin tente de
        transmettre un message concernant le captif.</li></ul>

        <h3>Approches possibles</h3>

        <p>Chercher l’éclaireur, négocier la libération du captif
        indépendamment, utiliser l’échange comme prétexte de contact ou
        entretenir volontairement l’erreur pour obtenir un avantage.</p>

        <h3>Complication</h3>

        <p>Si l’éclaireur est retrouvé, certains gardes veulent malgré tout
        conserver le prisonnier pour obtenir d’autres concessions.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les deux camps se préparent à une négociation fondée sur une
        hypothèse fausse. La vérité peut arriver trop tard pour empêcher
        l’escalade.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Les deux individus rentrent vivants.</li><li>Un premier échange
        formel entre les camps crée un précédent.</li><li>La manipulation d’un
        prisonnier détruit la confiance.</li><li>L’éclaireur est retrouvé mais
        le conflit continue pour d’autres raisons.</li><li>Le prisonnier fournit
        volontairement des informations utiles.</li></ul>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-hooks
          entryId: deux-prisonniers
          sourceHash: 56705c8f
