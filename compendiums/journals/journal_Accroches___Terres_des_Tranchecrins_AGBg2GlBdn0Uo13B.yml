  - name: Pris entre deux feux
    type: text
    sort: 600000
    text:
      content: >-
        <h2>Pris entre deux feux</h2>

        <h3>Situation</h3>

        <p>Le Tunnel des Tranchecrins est actuellement occupé aux deux
        extrémités.</p>

        <p>Un groupe de voyageurs s’est retranché du côté oriental tandis que
        des Tranchecrins contrôlent l’autre accès. Chacun affirme que l’autre a
        commencé.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs bloqués</strong> : veulent sortir sans
        abandonner leurs biens.</li><li><strong>Tranchecrins</strong> : veulent
        faire quitter le tunnel aux intrus.</li><li><strong>Autres
        usagers</strong> : s’accumulent progressivement devant les
        accès.</li><li><strong>Gardes de la Horde</strong> : peuvent transformer
        l’incident en confrontation militaire.</li></ul>

        <h3>Quoi ?</h3>

        <p>Les voyageurs ont utilisé une alcôve du tunnel comme abri après avoir
        cru l’entrée occidentale abandonnée.</p>

        <p>Les Tranchecrins considèrent cette occupation comme une tentative
        d’installation.</p>

        <p>Aucun camp ne veut être le premier à reculer.</p>

        <h3>Quand ?</h3>

        <p>La situation dure depuis plusieurs heures.</p>

        <p>La tension augmente avec l’arrivée de nouveaux témoins et
        combattants.</p>

        <h3>Où ?</h3>

        <p>Dans le Tunnel et ses deux entrées.</p>

        <h3>Pourquoi ?</h3>

        <p>Un simple choix d’abri a été interprété comme une violation
        territoriale.</p>

        <p>Désormais, la question du prestige compte presque autant que la
        sécurité.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ arrivent devant l’un des accès bloqués.</li><li>Un
        voyageur réussit à sortir par un passage étroit et raconte sa
        version.</li><li>Une patrouille prépare une entrée en force.</li><li>Les
        PJ entendent des cris venant du tunnel.</li></ul>

        <h3>Approches possibles</h3>

        <p>Négocier, évacuer discrètement les voyageurs, utiliser un autre
        accès, faire pression sur un camp, créer une diversion ou attendre qu’un
        des groupes manque de ressources.</p>

        <h3>Complication</h3>

        <p>Parmi les voyageurs se trouve quelqu’un qui refuse d’abandonner une
        cargaison volumineuse, rendant toute évacuation discrète beaucoup plus
        difficile.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Des renforts arrivent des deux côtés. Un incident initialement mineur
        finit probablement en affrontement.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Les voyageurs évacuent sans combat.</li><li>La cargaison est
        abandonnée comme prix du passage.</li><li>Le tunnel devient
        temporairement fermé aux voyageurs.</li><li>Une confrontation crée
        plusieurs victimes.</li><li>Un précédent de négociation est
        établi.</li></ul>
      format: 1
