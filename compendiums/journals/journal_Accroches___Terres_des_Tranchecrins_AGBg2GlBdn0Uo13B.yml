  - name: Le feu dans les ravins
    type: text
    sort: 1500000
    text:
      content: >-
        <h2>Le feu dans les ravins</h2>

        <h3>Situation</h3>

        <p>Un feu se propage rapidement à travers les taillis secs.</p>

        <p>La fumée remplit plusieurs ravins et rend certains passages
        impossibles à utiliser. Des silhouettes sont visibles des deux côtés du
        front de flammes.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs et habitants pris dans le secteur</strong> :
        veulent sortir.</li><li><strong>Tranchecrins</strong> : voient une
        partie de leur territoire menacée.</li><li><strong>Gardes de la
        Horde</strong> : cherchent d’abord à protéger les routes
        orientales.</li><li><strong>Animaux</strong> : fuient le feu et créent
        leurs propres dangers.</li></ul>

        <h3>Quoi ?</h3>

        <p>L’incendie n’est pas une attaque.</p>

        <p>Son origine peut rester banale : feu mal éteint, étincelle ou
        accident.</p>

        <p>Le problème est que la géographie canalise les flammes, la fumée et
        les fuyards vers les mêmes passages.</p>

        <h3>Quand ?</h3>

        <p>L’incendie vient de commencer et évolue rapidement.</p>

        <p>Le vent peut transformer en quelques heures un incident local en
        crise régionale.</p>

        <h3>Où ?</h3>

        <p>Plusieurs ravins, taillis et accès autour des Terres des
        Tranchecrins.</p>

        <h3>Pourquoi ?</h3>

        <p>La sécheresse du terrain et l’étroitesse des passages rendent la
        circulation plus dangereuse que les flammes elles-mêmes.</p>

        <p>Chaque groupe protège naturellement son propre côté du
        territoire.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ voient la colonne de fumée.</li><li>Ils rencontrent des
        voyageurs fuyant vers Tranchecolline.</li><li>Une patrouille bloque une
        route devenue dangereuse.</li><li>Des Tranchecrins apparaissent sur un
        passage habituellement hostile mais semblent eux aussi fuir.</li></ul>

        <h3>Approches possibles</h3>

        <p>Participer aux évacuations, ouvrir un passage, créer un coupe-feu,
        profiter du chaos pour explorer une zone abandonnée ou se retirer
        entièrement.</p>

        <h3>Complication</h3>

        <p>Le passage le plus sûr pour plusieurs voyageurs traverse
        temporairement le territoire Tranchecrin, tandis qu’une voie sûre pour
        les Tranchecrins mène vers les positions de la Horde.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le feu finit par s’éteindre ou dépasser le secteur, mais laisse des
        blessés, des zones brûlées et de nouveaux itinéraires.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Une coopération temporaire apparaît.</li><li>Chaque camp bloque
        les fuyards adverses.</li><li>Le paysage ouvre de nouveaux
        passages.</li><li>D’anciens chemins deviennent inutilisables.</li><li>Le
        comportement des PJ durant la crise modifie durablement leur réputation
        locale.</li></ul>
      format: 1
