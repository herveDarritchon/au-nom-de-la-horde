  - name: Trois disparus, trois directions
    type: text
    sort: 200000
    text:
      content: >-
        <h2>Trois disparus, trois directions</h2>

        <h3>Situation</h3>

        <p>Trois personnes ayant traversé la même partie des Terres des
        Tranchecrins manquent à l’appel.</p>

        <p>Le problème paraît d’abord simple jusqu’à ce que les premières traces
        soient découvertes : elles ne conduisent pas toutes dans la même
        direction.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Les disparus</strong> : un voyageur, un chasseur et un
        travailleur ayant emprunté le secteur séparément.</li><li><strong>Leurs
        proches</strong> : veulent des réponses, mais chacun possède sa propre
        théorie.</li><li><strong>Les gardes</strong> : veulent déterminer s’il
        existe une menace commune.</li><li><strong>Les Tranchecrins
        locaux</strong> : sont immédiatement soupçonnés.</li></ul>

        <h3>Quoi ?</h3>

        <p>Les trois disparitions ne possèdent pas une cause unique.</p>

        <p><strong>Adaptation de campagne :</strong> l’un s’est perdu après
        avoir quitté la piste, le deuxième a volontairement changé d’itinéraire,
        et seul le troisième a réellement rencontré une opposition hostile.</p>

        <p>Chercher un responsable unique risque donc d’éloigner les recherches
        de deux des disparus.</p>

        <h3>Quand ?</h3>

        <p>Les disparitions se sont produites sur quelques jours.</p>

        <p>Leur rapprochement récent donne l’impression d’une série
        organisée.</p>

        <p>Plus le temps passe, plus les traces deviennent difficiles à
        distinguer.</p>

        <h3>Où ?</h3>

        <p>Plusieurs ravins autour d’un même carrefour naturel, avec des pistes
        pouvant conduire vers le Cratère, le Tunnel ou l’ouest.</p>

        <h3>Pourquoi ?</h3>

        <p>La proximité géographique crée une fausse cohérence.</p>

        <p>Chacun projette sur les trois cas son explication préférée : attaque,
        accident ou enlèvement.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Des proches se disputent publiquement sur la marche à
        suivre.</li><li>Les PJ découvrent un objet appartenant à l’un des
        disparus.</li><li>Un garde leur montre trois ensembles de traces
        incompatibles.</li><li>Ils rencontrent eux-mêmes l’un des disparus sans
        savoir qu’il est recherché.</li></ul>

        <h3>Approches possibles</h3>

        <p>Reconstituer séparément chaque trajet, interroger les témoins, suivre
        les traces, explorer les ravins ou concentrer les efforts sur la
        personne paraissant la plus menacée.</p>

        <h3>Complication</h3>

        <p>Résoudre rapidement l’un des cas risque de renforcer à tort l’idée
        que les trois disparitions ont la même origine.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Des recherches mal coordonnées commencent depuis Tranchecolline. Des
        groupes suivent les mauvaises pistes et ajoutent de nouvelles personnes
        en difficulté dans le secteur.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Les trois situations sont comprises séparément.</li><li>Une
        seule personne est retrouvée à temps.</li><li>Les gardes déclenchent une
        réponse contre les Tranchecrins sur la base d’une conclusion
        erronée.</li><li>Les recherches révèlent de nouveaux itinéraires dans
        les ravins.</li><li>Un des disparus choisit finalement de ne pas
        revenir.</li></ul>
      format: 1
