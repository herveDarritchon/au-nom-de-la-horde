  - name: L’embuscade sans ennemi
    type: text
    sort: 1100000
    text:
      content: >-
        <h2>L’embuscade sans ennemi</h2>

        <h3>Situation</h3>

        <p>Un groupe revient blessé des ravins et affirme avoir subi une attaque
        Tranchecrin.</p>

        <p>Pourtant, les premiers observateurs ne trouvent ni projectiles, ni
        traces d’assaillants, ni signes évidents de poursuite.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Les survivants</strong> : sont convaincus d’avoir été
        attaqués.</li><li><strong>Les gardes</strong> : veulent identifier les
        responsables.</li><li><strong>Les Tranchecrins</strong> : risquent des
        représailles.</li><li><strong>Un pisteur expérimenté</strong> : doute de
        la version dominante.</li></ul>

        <h3>Quoi ?</h3>

        <p>Un effondrement de pierres a frappé le groupe depuis une hauteur.</p>

        <p>Dans la confusion, plusieurs survivants ont cru entendre ou
        apercevoir des assaillants.</p>

        <p>L’accident n’exclut pas la présence Tranchecrin dans le secteur, mais
        aucune attaque n’a eu lieu.</p>

        <h3>Quand ?</h3>

        <p>L’incident vient de se produire.</p>

        <p>Une riposte peut être organisée avant même que le site ne soit
        inspecté.</p>

        <h3>Où ?</h3>

        <p>Dans un ravin particulièrement étroit, dominé par plusieurs
        corniches.</p>

        <h3>Pourquoi ?</h3>

        <p>Le contexte hostile fournit une explication immédiate à un événement
        violent.</p>

        <p>Les témoins sont sincères mais leurs souvenirs se sont formés sous
        stress.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ croisent les survivants.</li><li>Une patrouille se
        prépare à partir.</li><li>Ils passent eux-mêmes par le lieu de
        l’incident.</li><li>Un témoin leur demande de confirmer ce qu’il pense
        avoir vu.</li></ul>

        <h3>Approches possibles</h3>

        <p>Inspecter le site, confronter les récits, suivre les supposées traces
        ennemies, accompagner la patrouille ou laisser la Horde répondre selon
        ses propres conclusions.</p>

        <h3>Complication</h3>

        <p>Une véritable présence Tranchecrin existe non loin de là. La
        découvrir peut être interprétée à tort comme une preuve de leur
        responsabilité.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>La version de l’attaque devient le récit officiel local et une
        opération punitive est probable.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>L’accident est reconnu.</li><li>Personne ne croit totalement
        l’explication.</li><li>Une patrouille provoque un véritable
        affrontement.</li><li>Les survivants revoient leur
        témoignage.</li><li>Le ravin est identifié comme danger
        naturel.</li></ul>
      format: 1
