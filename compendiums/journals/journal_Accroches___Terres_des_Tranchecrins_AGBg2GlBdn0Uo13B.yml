pages:
  - name: Contexte
    type: text
    sort: 0
    text:
      content: >-
        <h1>Accroches — Terres des Tranchecrins</h1>

        <h2>En bref</h2>

        <p>Les <strong>Terres des Tranchecrins</strong> forment une zone
        accidentée à l’ouest de Tranchecolline : ravins, roches rouges, taillis
        secs et passages étroits composent un territoire difficile à surveiller
        et encore plus difficile à traverser lorsque quelque chose s’y passe
        mal.</p>

        <p>Les <strong>Tranchecrins</strong>, des quilboars Razormane,
        constituent la présence dominante connue. Leur empiètement en fait un
        territoire hostile du point de vue de la Horde, mais cette hostilité ne
        signifie pas que chaque incident survenant dans les ravins est provoqué
        par eux.</p>

        <p>Pour le MJ, cette zone doit fonctionner comme une <strong>frontière
        instable</strong>, pas comme un camp ennemi à nettoyer. Les personnages
        peuvent y rencontrer des problèmes de circulation, des disparitions, des
        accidents, des rivalités territoriales, des erreurs d’interprétation,
        des négociations impossibles en apparence ou des crises mettant
        simultanément en danger plusieurs camps.</p>

        <h2>Identité</h2>

        <p>Le territoire repose sur cinq repères principaux :</p>

        <ul><li>les <strong>Terres des Tranchecrins</strong>, ensemble de ravins
        et de reliefs occidentaux ;</li><li>le <strong>Tunnel des
        Tranchecrins</strong>, passage couvert et point d’embuscade naturel
        ;</li><li>le <strong>Cratère des Tranchecrins</strong>, dépression
        centrale propice aux campements et aux déplacements dissimulés
        ;</li><li>la <strong>Piste des Échineurs</strong>, sentier secondaire
        traversant les reliefs ;</li><li>la <strong>Grotte des
        Échineurs</strong>, refuge occidental dont la nature exacte reste à
        déterminer dans Warbound.</li></ul>

        <h3>Adaptation de campagne</h3>

        <p>Les accroches ci-dessous développent des situations de jeu autour de
        ce socle. Elles peuvent introduire :</p>

        <ul><li>des voyageurs ;</li><li>des chasseurs ;</li><li>des éclaireurs
        ;</li><li>des péons ;</li><li>des gardes ;</li><li>des groupes
        Tranchecrins aux objectifs ponctuellement différents ;</li><li>des
        incidents naturels ;</li><li>des activités clandestines.</li></ul>

        <p>Ces éléments sont des outils de campagne et ne doivent pas être
        considérés comme du lore Warcraft officiel.</p>

        <h2>Territoire et lieux importants</h2>

        <table><thead><tr><th>Lieu</th><th>Fonction de
        jeu</th></tr></thead><tbody><tr><td><strong>Terres des
        Tranchecrins</strong></td><td>Frontière disputée, exploration, pistage,
        survie et erreurs d’interprétation.</td></tr><tr><td><strong>Tunnel des
        Tranchecrins</strong></td><td>Passage stratégique où contrôle
        territorial, circulation et embuscades se
        rencontrent.</td></tr><tr><td><strong>Cratère des
        Tranchecrins</strong></td><td>Zone difficile à observer pouvant abriter
        camps, rassemblements et mouvements
        discrets.</td></tr><tr><td><strong>Piste des
        Échineurs</strong></td><td>Route secondaire pouvant devenir raccourci,
        voie de fuite ou source de disparitions.</td></tr><tr><td><strong>Grotte
        des Échineurs</strong></td><td>Lieu mal connu permettant d’introduire
        exploration et mystère sans fixer prématurément la nature des
        Échineurs.</td></tr></tbody></table>

        <h2>Tensions utiles au MJ</h2>

        <p>Le territoire peut faire naître du jeu sans qu’une intrigue
        principale soit nécessaire :</p>

        <ul><li>la Horde veut pouvoir circuler autour de Tranchecolline
        ;</li><li>les Tranchecrins occupent et défendent une partie du
        territoire ;</li><li>voyageurs et chasseurs cherchent des raccourcis
        malgré les risques ;</li><li>les cartes et témoignages sont incomplets
        ;</li><li>un accident peut facilement être interprété comme une attaque
        ;</li><li>les intérêts de la Horde ne sont pas toujours identiques entre
        gardes, travailleurs et voyageurs ;</li><li>les Tranchecrins peuvent
        eux-mêmes réagir différemment selon ce qui menace leur territoire
        ;</li><li>l’inconnu entourant les Échineurs nourrit erreurs, mensonges
        et opportunisme.</li></ul>

        <h2>Utilisation des accroches</h2>

        <p>Ces situations ne sont pas conçues comme vingt missions disponibles
        simultanément.</p>

        <p>Elles peuvent apparaître :</p>

        <ul><li>pendant un voyage ;</li><li>à la suite d’une rumeur
        ;</li><li>comme conséquence d’une excursion précédente
        ;</li><li>lorsqu’un trajet connu change d’état ;</li><li>lorsqu’une
        faction agit sans attendre les PJ ;</li><li>lorsqu’un retour vers
        Tranchecolline révèle que la situation locale a évolué.</li></ul>

        <p>Une accroche peut rester petite. Tout incident dans les Terres des
        Tranchecrins n’a pas besoin de cacher une menace majeure.</p>
      format: 1
