  - name: L’eau rouge
    type: text
    sort: 500000
    text:
      content: >-
        <h2>L’eau rouge</h2>

        <h3>Situation</h3>

        <p>Plusieurs voyageurs souffrent de douleurs et de fièvre après avoir bu
        dans un petit point d’eau situé dans les ravins.</p>

        <p>L’un d’eux affirme avoir vu des traces Tranchecrins autour de la
        mare. Le mot « poison » commence à circuler.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs malades</strong> : veulent être soignés et
        comprendre ce qui leur est arrivé.</li><li><strong>Gardes</strong> :
        soupçonnent un empoisonnement volontaire.</li><li><strong>Tranchecrins
        fréquentant le secteur</strong> : utilisent eux aussi les ressources
        locales.</li><li><strong>Chasseurs</strong> : savent que les points
        d’eau peuvent devenir dangereux naturellement.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> l’eau a été contaminée par
        un phénomène naturel lié à une carcasse ou à des matières organiques
        accumulées en amont.</p>

        <p>Les traces Tranchecrins sont réelles parce qu’ils utilisaient eux
        aussi cette eau auparavant.</p>

        <p>Ils ont cessé de le faire avant que les voyageurs ne comprennent
        pourquoi.</p>

        <h3>Quand ?</h3>

        <p>Le problème est récent et temporaire, mais les premiers malades
        donnent l’impression d’un acte prémédité.</p>

        <h3>Où ?</h3>

        <p>Un point d’eau encaissé et les ravins situés en amont.</p>

        <h3>Pourquoi ?</h3>

        <p>Dans une frontière hostile, une contamination devient facilement une
        attaque.</p>

        <p>Les Tranchecrins n’ont aucun intérêt à expliquer pourquoi ils ont
        abandonné une ressource locale à leurs adversaires.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ rencontrent un malade sur la route.</li><li>Un garde veut
        fermer l’accès au secteur.</li><li>Un guérisseur cherche à savoir ce que
        les victimes ont consommé.</li><li>Les PJ découvrent que les traces
        Tranchecrins s’arrêtent avant le point d’eau.</li></ul>

        <h3>Approches possibles</h3>

        <p>Remonter la source, étudier les traces, interroger les survivants,
        observer le comportement des animaux ou utiliser politiquement
        l’incident contre l’un des camps.</p>

        <h3>Complication</h3>

        <p>Une patrouille est déjà partie chercher les responsables d’un
        empoisonnement qui n’a jamais eu lieu.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>D’autres voyageurs tombent malades jusqu’à ce que la ressource soit
        abandonnée. La Horde retient surtout l’idée d’une attaque
        Tranchecrin.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>La véritable cause est comprise.</li><li>Une accusation
        injustifiée provoque des représailles.</li><li>Le point d’eau est
        condamné.</li><li>Les PJ découvrent d’autres ressources plus
        sûres.</li><li>Certains refusent de croire l’explication
        naturelle.</li></ul>
      format: 1
