  - name: Le blessé dans les taillis
    type: text
    sort: 800000
    text:
      content: >-
        <h2>Le blessé dans les taillis</h2>

        <h3>Situation</h3>

        <p>Un Tranchecrin grièvement blessé est découvert caché dans des taillis
        proches d’un passage fréquenté.</p>

        <p>Il est encore vivant.</p>

        <p>Des voix et bruits d’armes approchent depuis le ravin voisin.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Le blessé</strong> : veut survivre et éviter ceux qui le
        poursuivent.</li><li><strong>Ses poursuivants</strong> : veulent le
        retrouver.</li><li><strong>Voyageurs de la Horde</strong> : peuvent voir
        en lui un ennemi à capturer ou achever.</li><li><strong>Les PJ</strong>
        : sont les premiers à disposer de toute la situation
        immédiate.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> le blessé fuit un conflit
        interne ponctuel entre Tranchecrins.</p>

        <p>Il n’est ni un allié de la Horde ni nécessairement innocent. Son
        différend concerne son propre groupe.</p>

        <p>Ses poursuivants ignorent initialement qu’il a été trouvé par des
        étrangers.</p>

        <h3>Quand ?</h3>

        <p>La poursuite vient de se produire.</p>

        <p>Les poursuivants atteindront rapidement le secteur.</p>

        <h3>Où ?</h3>

        <p>Dans des taillis proches d’un ravin donnant accès à plusieurs
        directions.</p>

        <h3>Pourquoi ?</h3>

        <p>Tous les Tranchecrins ne poursuivent pas en permanence les mêmes
        objectifs individuels.</p>

        <p>Le conflit offre aux PJ une situation où « ennemi » ne signifie pas
        automatiquement « problème à éliminer ».</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ découvrent directement le blessé.</li><li>Ils remarquent
        des traces de sang quittant une piste Tranchecrin.</li><li>Des
        poursuivants les interrogent sur ce qu’ils ont vu.</li><li>Un voyageur
        affirme avoir aperçu un quilboar rampant dans les taillis.</li></ul>

        <h3>Approches possibles</h3>

        <p>Cacher le blessé, le livrer, le soigner, l’interroger, négocier avec
        les poursuivants, rester neutre ou simplement quitter les lieux.</p>

        <h3>Complication</h3>

        <p>Le blessé omet volontairement la raison exacte pour laquelle il est
        poursuivi.</p>

        <p>Il cherche d’abord à survivre, pas à fournir aux PJ une version
        équilibrée du conflit.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les poursuivants finissent probablement par le retrouver.</p>

        <p>Le conflit interne se règle sans implication extérieure.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Les PJ obtiennent un contact inattendu parmi les
        Tranchecrins.</li><li>Ils deviennent associés à un conflit qui ne les
        concernait pas.</li><li>Le blessé est capturé.</li><li>Les poursuivants
        interprètent leur intervention comme une ingérence.</li><li>Les PJ
        apprennent quelque chose sur les divisions locales sans choisir de
        camp.</li></ul>
      format: 1
