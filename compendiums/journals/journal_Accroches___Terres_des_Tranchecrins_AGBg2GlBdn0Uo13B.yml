  - name: Quelqu’un occupe la grotte
    type: text
    sort: 1000000
    text:
      content: >-
        <h2>Quelqu’un occupe la grotte</h2>

        <h3>Situation</h3>

        <p>Des traces récentes apparaissent autour de la Grotte des Échineurs :
        passages répétés, branches déplacées et restes d’activité.</p>

        <p>Les descriptions des rares témoins sont incompatibles.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Chasseurs et voyageurs</strong> : veulent savoir si le
        passage voisin reste praticable.</li><li><strong>Occupants actuels de la
        grotte</strong> : nature volontairement indépendante de la définition
        future des Échineurs.</li><li><strong>Curieux de Tranchecolline</strong>
        : alimentent les hypothèses.</li><li><strong>Tranchecrins du
        secteur</strong> : peuvent eux aussi surveiller le changement.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> un petit groupe de
        voyageurs clandestins utilise temporairement l’entrée extérieure de la
        grotte comme refuge.</p>

        <p>Ils évitent de pénétrer profondément dans les galeries et
        entretiennent volontairement les histoires sur les Échineurs pour
        éloigner les curieux.</p>

        <p>La nature réelle des Échineurs reste entièrement non définie.</p>

        <h3>Quand ?</h3>

        <p>L’occupation a commencé récemment.</p>

        <p>Elle devient visible parce que le nombre de passages autour de la
        grotte augmente.</p>

        <h3>Où ?</h3>

        <p>Aux abords et dans la première partie de la Grotte des Échineurs.</p>

        <p>Les profondeurs peuvent rester inconnues.</p>

        <h3>Pourquoi ?</h3>

        <p>Un lieu déjà réputé dangereux constitue un excellent refuge pour ceux
        qui souhaitent ne pas être dérangés.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ découvrent des traces humaines ou humanoïdes près de la
        grotte.</li><li>Un voyageur affirme avoir vu une lumière à
        l’intérieur.</li><li>Des affaires disparaissent sur la Piste des
        Échineurs.</li><li>Les Tranchecrins paraissent surveiller eux aussi
        l’entrée.</li></ul>

        <h3>Approches possibles</h3>

        <p>Observer, attendre la sortie des occupants, entrer discrètement, les
        confronter, utiliser leur présence comme source d’information ou décider
        que le mystère ne mérite pas le risque.</p>

        <h3>Complication</h3>

        <p>Les occupants ne connaissent pas mieux que les PJ ce qui se trouve
        plus profondément dans la grotte et refusent eux-mêmes d’y aller.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le groupe utilise le refuge quelque temps puis l’abandonne, laissant
        derrière lui suffisamment de traces pour renforcer encore la légende des
        Échineurs.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>La présence clandestine est révélée.</li><li>Les occupants
        deviennent contacts ou adversaires.</li><li>La grotte est explorée plus
        profondément.</li><li>Le mystère des Échineurs reste intact.</li><li>De
        nouvelles rumeurs apparaissent à partir d’une situation désormais
        terminée.</li></ul>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-hooks
