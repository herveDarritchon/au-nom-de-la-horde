  - name: Les outils volés
    type: text
    sort: 1400000
    text:
      content: >-
        <h2>Les outils volés</h2>

        <h3>Situation</h3>

        <p>Des outils disparaissent régulièrement dans les campements
        temporaires de travailleurs et voyageurs installés près des marges
        occidentales.</p>

        <p>Les gardes accusent les Tranchecrins de préparer un sabotage plus
        important.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Travailleurs</strong> : veulent conserver leur
        matériel.</li><li><strong>Gardes</strong> : cherchent un responsable
        identifiable.</li><li><strong>Tranchecrins</strong> : sont les suspects
        évidents.</li><li><strong>Un petit groupe de travailleurs</strong> :
        récupère en secret certains outils pour ses propres besoins.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> une partie des vols est
        interne.</p>

        <p>Plusieurs travailleurs ont commencé à mettre du matériel de côté pour
        réparer ou aménager un passage qu’ils considèrent plus sûr, sans
        autorisation.</p>

        <p>D’autres disparitions peuvent être de simples pertes ou vols
        opportunistes.</p>

        <h3>Quand ?</h3>

        <p>Les premiers objets manquants semblaient anecdotiques.</p>

        <p>Le problème devient sérieux parce que le manque commence à ralentir
        les activités.</p>

        <h3>Où ?</h3>

        <p>Campements temporaires, bord des routes et ravins utilisés par les
        travailleurs.</p>

        <h3>Pourquoi ?</h3>

        <p>Les responsables pensent agir pour leur propre sécurité et ne font
        pas confiance à ceux qui organisent officiellement les déplacements.</p>

        <p>Accuser les Tranchecrins leur permet de gagner du temps.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Une dispute éclate autour d’une caisse vide.</li><li>Les PJ
        découvrent un outil portant une marque identifiable ailleurs.</li><li>Un
        garde prépare une fouille des abords Tranchecrins.</li><li>Un
        travailleur demande discrètement qu’on ne cherche pas trop
        loin.</li></ul>

        <h3>Approches possibles</h3>

        <p>Enquêter, surveiller le matériel, confronter les travailleurs,
        laisser les vols continuer, négocier sur le véritable besoin ou utiliser
        l’affaire pour justifier une action contre les Tranchecrins.</p>

        <h3>Complication</h3>

        <p>Le passage aménagé clandestinement pourrait réellement devenir un
        itinéraire plus sûr que celui imposé aux travailleurs.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les vols continuent jusqu’à ce que le projet clandestin soit
        découvert ou que le manque de matériel interrompe certaines
        activités.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Les responsables sont sanctionnés.</li><li>Leur passage est
        officiellement adopté.</li><li>Les Tranchecrins subissent des
        représailles injustifiées.</li><li>Les travailleurs gagnent davantage
        d’autonomie.</li><li>La confiance entre gardes et travailleurs se
        dégrade.</li></ul>
      format: 1
