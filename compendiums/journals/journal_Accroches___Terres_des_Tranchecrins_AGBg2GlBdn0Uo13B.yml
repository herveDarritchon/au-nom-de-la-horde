  - name: La charrette dans le passage
    type: text
    sort: 1800000
    text:
      content: >-
        <h2>La charrette dans le passage</h2>

        <h3>Situation</h3>

        <p>Une lourde charrette s’est immobilisée dans l’un des goulets reliant
        les routes de Tranchecolline aux reliefs occidentaux.</p>

        <p>Impossible de passer avec une autre charge importante.</p>

        <p>Très vite, chaque voyageur considère son propre besoin comme
        prioritaire.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Conducteur de la charrette</strong> : veut sauver son
        véhicule et sa cargaison.</li><li><strong>Voyageurs bloqués</strong> :
        veulent passer.</li><li><strong>Gardes</strong> : veulent maintenir la
        circulation.</li><li><strong>Tranchecrins</strong> : peuvent profiter du
        ralentissement ou simplement constater l’intrusion croissante.</li></ul>

        <h3>Quoi ?</h3>

        <p>Il s’agit d’abord d’un problème logistique.</p>

        <p>Un essieu endommagé empêche tout déplacement simple.</p>

        <p>La vraie tension naît de l’accumulation de personnes et de biens dans
        un passage exposé.</p>

        <h3>Quand ?</h3>

        <p>L’incident vient de se produire.</p>

        <p>Chaque heure ajoute de nouveaux voyageurs, animaux et tensions autour
        du goulet.</p>

        <h3>Où ?</h3>

        <p>Dans un passage étroit où il est difficile de faire demi-tour avec un
        véhicule chargé.</p>

        <h3>Pourquoi ?</h3>

        <p>Personne n’a prévu qu’une route secondaire devienne suffisamment
        fréquentée pour qu’un simple accident bloque tout le secteur.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ arrivent derrière la file.</li><li>Ils se trouvent devant
        lorsque quelqu’un vient annoncer le blocage.</li><li>Un conducteur leur
        propose de contourner par un ravin.</li><li>Des gardes demandent à tout
        le monde de rebrousser chemin.</li></ul>

        <h3>Approches possibles</h3>

        <p>Réparer, décharger, abandonner la charrette, trouver un passage
        parallèle, organiser la circulation ou profiter du chaos pour poursuivre
        autrement.</p>

        <h3>Complication</h3>

        <p>Une partie de la cargaison ne peut pas être laissée sans surveillance
        et plusieurs voyageurs refusent de participer à une réparation qui ne
        les concerne pas directement.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le groupe finit par démonter ou abandonner une partie du véhicule.
        Des voyageurs partent seuls chercher des détours.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Le passage est dégagé rapidement.</li><li>La cargaison est
        partiellement perdue.</li><li>Un détour devient une nouvelle
        route.</li><li>L’incident attire une présence hostile.</li><li>La
        nécessité d’organiser réellement la circulation occidentale devient
        évidente.</li></ul>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-hooks
          entryId: charrette-dans-le-passage
          sourceHash: 1faac83c
