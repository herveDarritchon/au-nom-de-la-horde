  - name: Qui utilise le nom des Échineurs ?
    type: text
    sort: 2000000
    text:
      content: >-
        <h2>Qui utilise le nom des Échineurs ?</h2>

        <h3>Situation</h3>

        <p>Depuis quelque temps, presque tout incident inexpliqué sur la Piste
        ou près de la Grotte est attribué aux « Échineurs ».</p>

        <p>Le problème est simple : les descriptions ne correspondent
        jamais.</p>

        <p>Certains parlent de traces. D’autres de silhouettes. D’autres encore
        n’ont absolument rien vu.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Voyageurs</strong> : utilisent le nom pour désigner un
        danger mal identifié.</li><li><strong>Chasseurs</strong> : se divisent
        sur ce que le terme signifie réellement.</li><li><strong>Personnes
        menant des activités discrètes dans le secteur</strong> : profitent de
        la confusion.</li><li><strong>Tranchecrins</strong> : peuvent connaître
        le lieu sans partager les mêmes histoires.</li></ul>

        <h3>Quoi ?</h3>

        <p>La nature exacte des Échineurs reste volontairement non définie dans
        Warbound.</p>

        <p><strong>Adaptation de campagne :</strong> plusieurs individus ont
        compris que le nom constitue une explication pratique. Des vols, erreurs
        d’orientation ou activités clandestines sans lien entre elles sont
        désormais attribués à la même menace.</p>

        <p>Le problème jouable n’est donc pas encore « découvrir ce qu’est un
        Échineur », mais déterminer quels incidents possèdent réellement un
        lien.</p>

        <h3>Quand ?</h3>

        <p>La confusion s’est amplifiée à mesure que davantage de voyageurs ont
        commencé à emprunter la Piste.</p>

        <p>Chaque nouvelle histoire absorbe les précédentes.</p>

        <h3>Où ?</h3>

        <p>Piste des Échineurs, Grotte des Échineurs et ravins occidentaux.</p>

        <h3>Pourquoi ?</h3>

        <p>Un nom permet de donner une forme à ce que personne ne comprend.</p>

        <p>Il devient également très utile pour quelqu’un souhaitant expliquer
        une perte, cacher une activité ou détourner l’attention.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Deux témoins se disputent parce que leurs descriptions sont
        incompatibles.</li><li>Les PJ trouvent des traces manifestement
        produites par un voyageur alors qu’on leur affirme qu’elles viennent des
        Échineurs.</li><li>Quelqu’un attribue une disparition récente aux
        Échineurs sans aucune preuve.</li><li>Une personne surprise dans une
        activité suspecte invoque immédiatement leur présence.</li></ul>

        <h3>Approches possibles</h3>

        <p>Comparer les incidents, cartographier les témoignages, surveiller la
        piste, explorer les abords de la grotte, confronter ceux qui utilisent
        trop facilement le nom ou accepter que plusieurs mystères distincts
        coexistent.</p>

        <h3>Complication</h3>

        <p>Démontrer que certains incidents n’ont rien à voir avec les Échineurs
        ne prouve absolument pas qu’ils n’existent pas.</p>

        <p>Les PJ peuvent dissiper une partie du folklore tout en rendant le
        véritable mystère plus net.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le terme « Échineur » devient progressivement une explication
        universelle pour tout ce qui survient dans l’ouest.</p>

        <p>Les informations réellement utiles deviennent de plus en plus
        difficiles à distinguer des histoires.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Plusieurs faux incidents sont séparés du véritable
        mystère.</li><li>Un opportuniste perd sa couverture.</li><li>La Grotte
        devient le centre d’une investigation plus sérieuse.</li><li>Les PJ
        obtiennent une meilleure cartographie des témoignages sans encore savoir
        ce que sont les Échineurs.</li><li>La nature exacte des Échineurs reste
        disponible pour une définition ultérieure de Warbound.</li></ul>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-terres-tranchecrins-hooks
          entryId: nom-des-echineurs
          sourceHash: acd041b0
