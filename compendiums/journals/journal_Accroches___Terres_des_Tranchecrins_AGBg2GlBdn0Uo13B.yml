  - name: La frontière de pieux
    type: text
    sort: 300000
    text:
      content: >-
        <h2>La frontière de pieux</h2>

        <h3>Situation</h3>

        <p>Des pieux, amas de branches et marques apparaissent progressivement
        près des passages fréquentés à l’ouest de Tranchecolline.</p>

        <p>Chaque matin semble repousser un peu plus loin la limite implicite du
        territoire Tranchecrin.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Tranchecrins locaux</strong> : veulent matérialiser un
        espace qu’ils considèrent comme leur territoire.</li><li><strong>Gardes
        de Tranchecolline</strong> : voient une avancée
        hostile.</li><li><strong>Voyageurs et chasseurs</strong> : veulent
        conserver leurs itinéraires habituels.</li><li><strong>Travailleurs de
        la Horde</strong> : risquent de perdre l’accès à certains
        secteurs.</li></ul>

        <h3>Quoi ?</h3>

        <p>Les marques sont intentionnelles.</p>

        <p><strong>Adaptation de campagne :</strong> elles ne préparent pas
        nécessairement une attaque. Les Tranchecrins répondent à l’augmentation
        du passage de membres de la Horde en créant une limite visible.</p>

        <p>Le problème vient du fait que cette limite empiète sur des chemins
        déjà utilisés.</p>

        <h3>Quand ?</h3>

        <p>Les premières marques sont apparues récemment.</p>

        <p>La tension augmente à mesure que gardes et Tranchecrins déplacent ou
        détruisent mutuellement les signes.</p>

        <h3>Où ?</h3>

        <p>Sur plusieurs passages orientaux des Terres des Tranchecrins.</p>

        <h3>Pourquoi ?</h3>

        <p>Deux groupes utilisent le même espace sans partager la même
        définition de la frontière.</p>

        <p>Chaque déplacement de marque est interprété comme une provocation
        plutôt que comme une réponse au mouvement précédent.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Les PJ trouvent un passage habituel barré.</li><li>Des gardes
        détruisent publiquement plusieurs pieux.</li><li>Un chasseur explique
        que les marques étaient hier plusieurs dizaines de mètres plus
        loin.</li><li>Une patrouille prépare une démonstration de
        force.</li></ul>

        <h3>Approches possibles</h3>

        <p>Observer l’évolution des marques, chercher à comprendre leur logique,
        ouvrir une négociation, déplacer un itinéraire, soutenir l’un des camps
        ou laisser l’escalade suivre son cours.</p>

        <h3>Complication</h3>

        <p>Certaines marques ont été déplacées par des voyageurs cherchant
        simplement à préserver leur raccourci, ce qui donne aux deux camps une
        lecture fausse de la progression adverse.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Les destructions de marques se multiplient. Une altercation finit par
        provoquer des blessés et transforme une dispute de limites en véritable
        affrontement.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Une frontière temporaire est reconnue.</li><li>Un chemin change
        définitivement de contrôle.</li><li>La Horde impose le passage par la
        force.</li><li>Les Tranchecrins ferment plusieurs accès en
        représailles.</li><li>Les deux camps découvrent que certains incidents
        étaient causés par des tiers.</li></ul>
      format: 1
