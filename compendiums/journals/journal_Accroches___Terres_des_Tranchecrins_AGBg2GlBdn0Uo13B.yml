  - name: Le camp du cratère
    type: text
    sort: 400000
    text:
      content: >-
        <h2>Le camp du cratère</h2>

        <h3>Situation</h3>

        <p>Des feux sont observés plusieurs nuits de suite dans le Cratère des
        Tranchecrins.</p>

        <p>Cette fois, ils sont plus nombreux et restent visibles plus
        longtemps. À Tranchecolline, certains parlent déjà d’un rassemblement
        précédant une attaque.</p>

        <h3>Qui ?</h3>

        <ul><li><strong>Tranchecrins rassemblés dans le Cratère</strong> :
        veulent utiliser la dépression comme camp
        temporaire.</li><li><strong>Éclaireurs de la Horde</strong> : cherchent
        à mesurer la menace.</li><li><strong>Habitants de
        Tranchecolline</strong> : craignent une
        offensive.</li><li><strong>Groupes Tranchecrins extérieurs au
        camp</strong> : ne soutiennent pas nécessairement les mêmes
        décisions.</li></ul>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne :</strong> plusieurs groupes
        Tranchecrins se sont regroupés temporairement après la perte ou
        l’abandon d’un autre site.</p>

        <p>Ce rassemblement est réel et potentiellement dangereux, mais il ne
        constitue pas automatiquement une armée prête à marcher sur
        Tranchecolline.</p>

        <p>Des désaccords existent sur la conduite à adopter face à la
        Horde.</p>

        <h3>Quand ?</h3>

        <p>Le camp grandit depuis plusieurs jours.</p>

        <p>Il ne pourra pas rester indéfiniment dans le Cratère sans poser des
        problèmes de ressources et d’organisation.</p>

        <h3>Où ?</h3>

        <p>Dans le Cratère, avec des postes d’observation sur les hauteurs et
        plusieurs accès dissimulés par le relief.</p>

        <h3>Pourquoi ?</h3>

        <p>Le Cratère offre un lieu protégé permettant de réunir plusieurs
        groupes sans exposer immédiatement leur nombre.</p>

        <p>La Horde ne voit que les feux et interprète le reste.</p>

        <h3>Portes d'entrée</h3>

        <ul><li>Des éclaireurs demandent du renfort après avoir compté les
        feux.</li><li>Les PJ aperçoivent eux-mêmes le camp depuis une
        hauteur.</li><li>Des voyageurs modifient leur route par peur du
        rassemblement.</li><li>Un petit groupe Tranchecrin quitte le Cratère
        précipitamment.</li></ul>

        <h3>Approches possibles</h3>

        <p>Observer, infiltrer, suivre ceux qui quittent le camp, chercher un
        contact, préparer la défense de Tranchecolline ou provoquer une
        dispersion avant que le rassemblement ne grossisse.</p>

        <h3>Complication</h3>

        <p>Une intervention agressive pourrait précisément convaincre les
        différents groupes Tranchecrins de s’unir contre une menace commune.</p>

        <h3>Si les PJ ne font rien</h3>

        <p>Le rassemblement finit par devoir choisir entre dispersion,
        déplacement ou action commune.</p>

        <p>La décision dépendra de la pression exercée autour du territoire.</p>

        <h3>Conséquences possibles</h3>

        <ul><li>Le camp se disperse sans combat.</li><li>Une faction Tranchecrin
        prend l’ascendant sur les autres.</li><li>Une attaque préventive crée
        l’unité que la Horde redoutait.</li><li>Une observation patiente révèle
        les divisions internes.</li><li>Le Cratère devient durablement un centre
        d’activité.</li></ul>
      format: 1
