  - _id: 5b736ddcf4821c5a
    name: Annexe A — Équilibrer la rencontre avec les POP
    type: text
    sort: 1000000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Annexe A — Équilibrer la rencontre avec les POP</h2>

        <p>Pour évaluer un affrontement, convertir le NC de chaque adversaire en
        points d'opposition (POP) puis additionner les POP. Le budget indique
        une <strong>difficulté indicative</strong>, calculée pour quatre PJ de
        même niveau et disposant initialement de toutes leurs ressources.</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>NC</th>

        <th>0</th>

        <th>½</th>

        <th>1</th>

        <th>2</th>

        <th>3</th>

        <th>4</th>

        <th>5</th>

        <th>6</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>POP</td>

        <td>2</td>

        <td>5</td>

        <td>10</td>

        <td>20</td>

        <td>40</td>

        <td>60</td>

        <td>90</td>

        <td>120</td>

        </tr>

        </tbody>

        </table>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Niveau des PJ (4 PJ)</th>

        <th>Sans danger</th>

        <th>Facile</th>

        <th>Ordinaire</th>

        <th>Difficile</th>

        <th>Extrême</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>1</td>

        <td>2</td>

        <td>5</td>

        <td>10</td>

        <td>20</td>

        <td>30</td>

        </tr>

        <tr>

        <td>2</td>

        <td>5</td>

        <td>10</td>

        <td>20</td>

        <td>30</td>

        <td>40</td>

        </tr>

        <tr>

        <td>3</td>

        <td>10</td>

        <td>20</td>

        <td>40</td>

        <td>60</td>

        <td>80</td>

        </tr>

        <tr>

        <td>4</td>

        <td>15</td>

        <td>40</td>

        <td>60</td>

        <td>80</td>

        <td>120</td>

        </tr>

        </tbody>

        </table>

        <p>Pour <strong>3 PJ</strong>, réduire les budgets d'environ un tiers ;
        pour <strong>5 PJ</strong>, les augmenter d'environ un tiers. Pour
        <strong>6 PJ</strong>, augmenter de 75 % ; pour <strong>2 PJ</strong>,
        réduire d'environ deux tiers. Ces coefficients officiels sont donnés
        pour une composition de groupe classique : leur application reste
        indicative si le groupe dispose de synergies inhabituelles.</p>

        <p><strong>Exemple — quatre PJ niveau 1 :</strong> un adversaire NC 1
        (10 POP) correspond à une rencontre ordinaire ; un garde vétéran NC 2
        (20 POP) à une rencontre difficile. La surprise, le terrain et
        l'épuisement peuvent modifier fortement le résultat.</p>

        <p><em>Source : Bestiaire COF2, p. 188–192, tableaux de conversion
        NC/POP et difficulté des rencontres.</em></p>
      markdown: ''
