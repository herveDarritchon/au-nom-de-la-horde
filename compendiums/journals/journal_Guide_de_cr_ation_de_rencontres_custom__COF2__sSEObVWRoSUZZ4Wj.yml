  - _id: 1a205919fde69c78
    name: 5. Configurer les capacités spéciales
    type: text
    sort: 500000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>5. Configurer les capacités spéciales</h2>

        <p>Les capacités personnalisées doivent respecter le coût prévu par le
        Bestiaire.</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Modification</th>

        <th>Conséquence sur le NC</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Capacité issue d'une voie de créatures</td>

        <td>Généralement +½ NC, parfois +1 NC</td>

        </tr>

        <tr>

        <td>Capacité unique</td>

        <td>Entre 0 et +1 NC selon sa puissance</td>

        </tr>

        <tr>

        <td>Rang de boss classique</td>

        <td>+1 NC</td>

        </tr>

        <tr>

        <td>Rang de boss berserker</td>

        <td>+1 NC</td>

        </tr>

        <tr>

        <td>Rang de boss résistant</td>

        <td>+1 NC</td>

        </tr>

        </tbody>

        </table>

        <p>Une capacité purement narrative, sans incidence sur la létalité, peut
        avoir un coût de 0 NC. Le Bestiaire recommande également de limiter le
        coût total des capacités spéciales à environ un tiers du NC final.</p>

        <p>Dans Foundry, une capacité doit être ajoutée sous forme d'objet
        Capacité, pas sous forme de Voie ou de Profil. L'objet est
        automatiquement considéré comme appris lorsqu'il est glissé sur l'acteur
        Rencontre.</p>

        <p>Pour chaque capacité, renseigner son nom, son texte, son temps
        d'action (A, M, L ou G), sa fréquence éventuelle, et ses Actions/Effets
        si une automatisation est souhaitée.</p>

        <p><strong>Particularité de Foundry à connaître</strong></p>

        <p>Les acteurs Rencontre ne possèdent pas les mêmes valeurs d'attaque de
        base que les personnages. Les expressions <code>@atc</code>,
        <code>@atd</code> et <code>@arme.dmg</code> provenant de capacités de PJ
        peuvent donc ne pas fonctionner correctement.</p>

        <p>Il faut remplacer ces variables par des valeurs fixes ou des
        variables compatibles avec la rencontre. Le guide mentionne une
        exception pour <code>@atm</code>, qui dispose d'un calcul propre aux
        Rencontres.</p>

        <p><em>Source : Guide Foundry, p. 31 et 72.</em></p>

        <p>Pour les capacités à fréquence limitée, Foundry distingue notamment
        les usages récupérés après une récupération rapide et les usages
        quotidiens récupérés après une récupération complète.</p>

        <p>Lorsqu'une capacité impose un état, une sauvegarde ou une durée, il
        faut configurer la résolution adaptée et éventuellement un effet
        supplémentaire. L'onglet Effets permettra ensuite de suivre ces
        effets.</p>

        <p>Le guide précise aussi que, dans la version documentée, les
        résistances, vulnérabilités et immunités selon le type de dommages ne
        sont pas entièrement automatisées. Il faut donc prévoir des
        vérifications manuelles pour certains pouvoirs Warcraft.</p>
      markdown: ''
