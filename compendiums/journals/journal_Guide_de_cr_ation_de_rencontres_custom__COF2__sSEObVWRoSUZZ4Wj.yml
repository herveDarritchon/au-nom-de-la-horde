  - _id: 10e1d871cb72135a
    name: 3. Définir les statistiques selon les règles officielles
    type: text
    sort: 300000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>3. Définir les statistiques selon les règles officielles</h2>

        <h3>Étape A — Choisir le concept et l'archétype</h3>

        <p>Le Bestiaire, p. 196, distingue trois archétypes : inférieur,
        standard et puissant. Ils servent à déterminer AGI, CON et FOR en
        fonction de la taille.</p>

        <p>Pour une créature de taille moyenne :</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Archétype</th>

        <th>AGI</th>

        <th>CON</th>

        <th>FOR</th>

        <th>NC minimal</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Inférieur</td>

        <td>+2</td>

        <td>-1</td>

        <td>-1</td>

        <td>0</td>

        </tr>

        <tr>

        <td>Standard</td>

        <td>+1</td>

        <td>+1</td>

        <td>+1*</td>

        <td>½</td>

        </tr>

        <tr>

        <td>Puissant</td>

        <td>+0</td>

        <td>+3</td>

        <td>+3*</td>

        <td>1</td>

        </tr>

        </tbody>

        </table>

        <p>L'astérisque représente une caractéristique supérieure : dans
        Foundry, il faut cocher la case correspondante lorsque l'acteur est
        déverrouillé.</p>

        <p>Les valeurs physiques ne sont pas obligatoirement figées. Le
        Bestiaire précise notamment qu'un humanoïde expérimenté peut avoir des
        statistiques de combat supérieures sans modifier ses caractéristiques
        physiques.</p>

        <h3>Étape B — Choisir les autres caractéristiques</h3>

        <p>Pour PER, CHA, INT et VOL, le Bestiaire propose des qualificatifs
        allant de -4 à +6. Par exemple, une créature vigilante peut avoir PER
        +2, une créature d'intelligence animale INT -4 et un chef résolu VOL
        +2.</p>

        <p>Il ne faut pas confondre la valeur d'une caractéristique et son
        éventuel caractère supérieur. Une créature peut avoir FOR +3 et une
        autre FOR +3* ; la seconde bénéficie du dé bonus à ses tests de FOR.</p>

        <h3>Étape C — Définir les statistiques de combat</h3>

        <p>Voici une extraction de la table officielle de la page 198 du
        Bestiaire.</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>NC du profil</th>

        <th>DEF</th>

        <th>Vigueur</th>

        <th>Attaque principale</th>

        <th>Dégâts</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>0</td>

        <td>11</td>

        <td>3</td>

        <td>+2</td>

        <td>1d4-1</td>

        </tr>

        <tr>

        <td>½</td>

        <td>13</td>

        <td>9</td>

        <td>+3</td>

        <td>1d6+1</td>

        </tr>

        <tr>

        <td>1</td>

        <td>15</td>

        <td>15</td>

        <td>+4</td>

        <td>1d6+3</td>

        </tr>

        <tr>

        <td>2</td>

        <td>17</td>

        <td>30</td>

        <td>+6</td>

        <td>2d6+4</td>

        </tr>

        <tr>

        <td>3</td>

        <td>18</td>

        <td>50</td>

        <td>+8</td>

        <td>2d6+8</td>

        </tr>

        <tr>

        <td>4</td>

        <td>20</td>

        <td>70</td>

        <td>+10</td>

        <td>2d8+10</td>

        </tr>

        <tr>

        <td>5</td>

        <td>21</td>

        <td>90</td>

        <td>+11</td>

        <td>2d10+12</td>

        </tr>

        </tbody>

        </table>

        <p>Attention : le NC du profil de combat n'est pas toujours égal au NC
        final. Par exemple, une créature avec un profil de combat NC 2 et deux
        capacités à +½ NC possède un NC final de 3. On ne doit pas lui attribuer
        directement les statistiques de combat NC 3 en plus de ses capacités,
        sous peine de la surévaluer.</p>

        <p>La répartition des dégâts se fait sur l'ensemble d'un round. Si une
        créature effectue deux attaques, il faut répartir les dégâts prévus
        entre elles plutôt que multiplier les dégâts du tableau par deux.</p>

        <h3>Étape D — Les valeurs complémentaires</h3>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Statistique</th>

        <th>Règle de saisie</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Initiative</td>

        <td><code>10 + PER</code>, avec +3 supplémentaire si PER*</td>

        </tr>

        <tr>

        <td>RD</td>

        <td>0 par défaut ; renseigner une valeur si la créature bénéficie d'une
        réduction des dommages</td>

        </tr>

        <tr>

        <td>Déplacement</td>

        <td>Déterminé selon le mode de déplacement de la créature</td>

        </tr>

        <tr>

        <td>Attaque secondaire</td>

        <td>Peut être égale à l'attaque principale ou inférieure</td>

        </tr>

        <tr>

        <td>Attaque magique</td>

        <td><code>NC + VOL</code>, sans dépasser l'attaque principale</td>

        </tr>

        <tr>

        <td>Dégâts temporaires</td>

        <td>0 au départ</td>

        </tr>

        <tr>

        <td>Points de chance</td>

        <td>À renseigner lorsqu'une règle, notamment un rang de boss, en
        accorde</td>

        </tr>

        </tbody>

        </table>

        <p>Les attaques secondaires peuvent aussi être calculées avec <code>NC +
        FOR</code>, <code>NC + AGI</code> ou <code>NC + VOL</code>, selon leur
        nature. Il faut ensuite respecter la limite de l'attaque principale
        prévue par le Bestiaire, p. 197–199.</p>
      markdown: ''
