  - _id: f273ebc38f816d26
    name: 4. Créer les attaques dans Foundry
    type: text
    sort: 400000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>4. Créer les attaques dans Foundry</h2>

        <p>C'est probablement la partie la plus importante pour rendre ton
        acteur jouable.</p>

        <p>Dans l'onglet Principal, le bloc « Attaques » est actuellement
        vide.</p>

        <p><strong>Procédure</strong></p>

        <ol>

        <li>Déverrouiller la fiche Rencontre.</li>

        <li>Cliquer sur le <code>+</code> du bloc Attaques, ou créer un objet de
        type Attaque (de rencontre) dans le répertoire Objets.</li>

        <li>Donner un nom à l'attaque.</li>

        <li>Choisir le sous-type : contact, distance ou magique.</li>

        <li>Configurer l'onglet Actions/Effets de l'objet.</li>

        </ol>

        <p>Dans Actions/Effets, créer une résolution de type Attaque avec les
        paramètres suivants pour une attaque qui possède un bonus de +4 et
        inflige 1d6+3 dégâts.</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Paramètre</th>

        <th>Valeur</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Type d'action</td>

        <td>Attaque de contact</td>

        </tr>

        <tr>

        <td>Activable</td>

        <td>Oui</td>

        </tr>

        <tr>

        <td>Temporaire</td>

        <td>Non</td>

        </tr>

        <tr>

        <td>Type de résolution</td>

        <td>Attaque</td>

        </tr>

        <tr>

        <td>Formule de compétence</td>

        <td><code>4</code></td>

        </tr>

        <tr>

        <td>Difficulté</td>

        <td><code>@cible.def</code></td>

        </tr>

        <tr>

        <td>Dommages</td>

        <td><code>1d6+3</code></td>

        </tr>

        <tr>

        <td>Cible</td>

        <td>Unique — Ennemi</td>

        </tr>

        <tr>

        <td>Critique</td>

        <td>Laisser la valeur standard</td>

        </tr>

        </tbody>

        </table>

        <p>Le système ajoute automatiquement le d20 au bonus d'attaque : il ne
        faut donc pas saisir <code>1d20+4</code> dans la formule de
        compétence.</p>

        <p>De même, la formule de dégâts est complète. Il ne faut pas ajouter
        <code>@for</code> si le bonus de FOR est déjà intégré dans la
        formule.</p>

        <p>Pour une attaque à distance, la portée peut être renseignée, mais le
        guide de Foundry indique qu'elle reste informative et ne bloque pas
        automatiquement l'utilisation hors de portée.</p>

        <p>Source : Guide officiel Foundry COF2, p. 52 et 65–67.</p>
      markdown: ''
