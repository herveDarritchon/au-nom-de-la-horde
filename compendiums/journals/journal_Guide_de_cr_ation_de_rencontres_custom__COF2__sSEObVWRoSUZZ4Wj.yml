  - _id: 84e9f894815bb61a
    name: 8. Checklist de création et de validation
    type: text
    sort: 800000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>8. Checklist de création et de validation</h2>

        <p><strong>Checklist de contrôle de l'acteur</strong></p>

        <ul>

        <li class="task-list-item">☐ Concept, type, taille et archétype
        définis</li>

        <li class="task-list-item">☐ NC final calculé (profil + capacités +
        boss)</li>

        <li class="task-list-item">☐ Sept caractéristiques et caractéristiques
        supérieures configurées</li>

        <li class="task-list-item">☐ Initiative, DEF, RD, PV et déplacement
        renseignés</li>

        <li class="task-list-item">☐ Toutes les attaques créées avec leur
        formule correcte</li>

        <li class="task-list-item">☐ Capacités, fréquences et effets
        configurés</li>

        <li class="task-list-item">☐ Butin et notes publiques/privées
        complétés</li>

        <li class="task-list-item">☐ Portrait et prototype du token
        configurés</li>

        <li class="task-list-item">☐ Tests d'attaque, de dégâts et d'effets
        effectués</li>

        <li class="task-list-item">☐ POP et difficulté vérifiés pour les PJ</li>

        </ul>
      markdown: ''
