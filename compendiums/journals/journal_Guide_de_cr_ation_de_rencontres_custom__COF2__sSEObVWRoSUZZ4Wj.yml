  - _id: 6facb8f7c08401e8
    name: 2. Les champs de ton acteur Rencontre
    type: text
    sort: 200000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>2. Les champs de ton acteur Rencontre</h2>

        <p>En reprenant exactement l'interface de ta capture :</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Champ Foundry</th>

        <th>Règle ou méthode COF2</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Nom</td>

        <td>Nom libre du PNJ ou de la créature</td>

        </tr>

        <tr>

        <td>Image</td>

        <td>Portrait de l'acteur</td>

        </tr>

        <tr>

        <td>Type</td>

        <td>Vivante, Humanoïde, Végétale ou Non-vivante</td>

        </tr>

        <tr>

        <td>Taille</td>

        <td>Catégorie de taille, de Minuscule à Colossale</td>

        </tr>

        <tr>

        <td>NC</td>

        <td>Niveau de créature final</td>

        </tr>

        <tr>

        <td>AGI, CON, FOR</td>

        <td>Modificateurs physiques déterminés par l'archétype et le
        concept</td>

        </tr>

        <tr>

        <td>PER, CHA, INT, VOL</td>

        <td>Modificateurs choisis selon les aptitudes de la créature</td>

        </tr>

        <tr>

        <td>Caractéristique supérieure (*)</td>

        <td>Dé bonus aux tests de la caractéristique concernée</td>

        </tr>

        <tr>

        <td>Initiative</td>

        <td>10 + PER, avec +3 si PER supérieure</td>

        </tr>

        <tr>

        <td>Défense (DEF)</td>

        <td>Table des profils de combat ou profil adapté</td>

        </tr>

        <tr>

        <td>RD</td>

        <td>Réduction des dommages, si une règle ou une capacité l'accorde</td>

        </tr>

        <tr>

        <td>Vigueur (PV)</td>

        <td>Table des profils de combat ou profil adapté</td>

        </tr>

        <tr>

        <td>DM temporaires</td>

        <td>0 au départ, sauf situation particulière</td>

        </tr>

        <tr>

        <td>Déplacement</td>

        <td>Vitesse propre à la créature</td>

        </tr>

        <tr>

        <td>Attaques</td>

        <td>Objets « Attaque de rencontre » distincts</td>

        </tr>

        <tr>

        <td>Actions</td>

        <td>Générées par les capacités configurées</td>

        </tr>

        <tr>

        <td>États</td>

        <td>États et effets actifs, gérés par le système</td>

        </tr>

        </tbody>

        </table>

        <p>Le Type est purement informatif dans Foundry : choisir « Humanoïde »
        n'ajoute aucun bonus. La Taille, elle, est utilisée pour dimensionner le
        token lors de son placement.</p>

        <p>Autre distinction importante : les sept caractéristiques affichées
        sont bien des modificateurs, pas des scores à convertir. Pour une FOR
        +3, tu saisis directement <code>+3</code>.</p>

        <p>Source : Guide officiel Foundry COF2, p. 25–29 ; Livre de règles
        COF2, p. 302–303.</p>
