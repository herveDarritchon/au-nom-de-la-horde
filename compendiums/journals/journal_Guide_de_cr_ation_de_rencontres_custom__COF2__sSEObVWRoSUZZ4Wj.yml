  - _id: 63204f1fa3c35017
    name: 1. La règle fondamentale de Foundry
    type: text
    sort: 100000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>1. La règle fondamentale de Foundry</h2>

        <p>Le NC ne calcule pas automatiquement les statistiques de l'acteur
        Rencontre.</p>

        <p>C'est explicitement précisé dans le guide officiel de Foundry, page
        31. Tu dois renseigner manuellement la DEF, l'Initiative, la Vigueur,
        les caractéristiques et les attaques.</p>

        <p>Un acteur NC 3 avec 0 PV et 0 DEF reste à 0 PV et 0 DEF tant que tu
        ne les renseignes pas.</p>

        <p>C'est exactement la situation visible sur ta capture de Calgar : tu
        as créé la structure de l'acteur, mais elle ne possède encore aucune
        caractéristique de combat utilisable.</p>

        <p>Il faut donc travailler dans cet ordre :</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Étape</th>

        <th>Objet</th>

        <th>Objectif</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>1</td>

        <td>Conception</td>

        <td>Type, taille, rôle et NC</td>

        </tr>

        <tr>

        <td>2</td>

        <td>Statistiques</td>

        <td>Caractéristiques et valeurs de combat</td>

        </tr>

        <tr>

        <td>3</td>

        <td>Attaques</td>

        <td>Bonus, dégâts et actions</td>

        </tr>

        <tr>

        <td>4</td>

        <td>Capacités</td>

        <td>Pouvoirs, effets et limites</td>

        </tr>

        <tr>

        <td>5</td>

        <td>Foundry</td>

        <td>Butin, notes et token</td>

        </tr>

        <tr>

        <td>6</td>

        <td>Validation</td>

        <td>Tests et équilibrage POP</td>

        </tr>

        </tbody>

        </table>
      markdown: ''
