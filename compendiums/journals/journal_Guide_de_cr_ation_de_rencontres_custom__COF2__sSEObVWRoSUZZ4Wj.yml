    text:
      format: 1
      content: >-
        <h1>Guide de création d'une rencontre personnalisée COF2 dans Foundry
        VTT</h1>

        <p>Warbound — Chroniques Oubliées Fantasy 2 · Foundry VTT v14 ·
        Documentation COF2 2.1.0</p>

        <p><strong>Compatibilité :</strong> le journal JSON fourni pour modèle
        indique COF2 2.3.12. Le guide de l’interface qui sert de référence date
        de COF2 2.1.0 ; les étapes sont donc à vérifier sur la version
        installée.</p>

        <p>L'objectif est de pouvoir créer un acteur « Rencontre » entièrement
        opérationnel, avec toutes ses caractéristiques, ses attaques, ses
        capacités, ses défenses et son comportement, tout en respectant les
        règles de création et d'équilibrage de COF2.</p>

        <p>Je m'appuie sur les trois documents de référence présents dans notre
        projet : le Livre de règles COF2 (2024), le Bestiaire COF2 (2025) et le
        Guide du système COF2 pour Foundry (mai 2026).</p>

        <p><strong>Mode d’emploi :</strong> ouvrir les pages du journal dans
        l’ordre et utiliser la checklist en fin de guide. Le journal est réservé
        au MJ par défaut.</p>
