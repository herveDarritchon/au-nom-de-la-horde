  - _id: 0edcffeb13e1d669
    name: Annexe B — Vigilance de compatibilité et sources
    type: text
    sort: 1100000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Annexe B — Vigilance de compatibilité et sources</h2>

        <p><strong>Version Foundry utilisée pour concevoir ce document
        :</strong> la documentation disponible décrit Foundry VTT v14 et le
        système COF2 <strong>2.1.0</strong> (mai 2026). Le modèle de journal
        fourni par le MJ provient d'un monde sous <strong>COF2 2.3.12</strong>.
        Les étapes de l'interface et les automatisations doivent donc être
        contrôlées sur la version effectivement installée ; l'import du journal
        n'a pas été testé dans ce monde.</p>

        <p><strong>Origine des chiffres :</strong> les tables de NC,
        caractéristiques, combat, rangs de boss et POP proviennent des ouvrages
        de COF2 ; les choix de personnage Warcraft, les noms, les comportements
        et les valeurs explicitement identifiées comme « choix de conception »
        sont des adaptations Warbound.</p>

        <p><strong>Documents de référence :</strong></p>

        <ul>

        <li>Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2 — Livre de
        règles</em>, Black Book Éditions, 2024, p. 302–303.</li>

        <li>Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2 —
        Bestiaire</em>, Black Book Éditions, 2025, p. 188–204.</li>

        <li><em>Guide du système COF2 pour Foundry VTT</em>, système 2.1.0, mai
        2026, p. 25–32, 43–45, 52 et 65–73.</li>

        </ul>

        <p><strong>Rappel opérationnel :</strong> créer les acteurs et objets
        dans Foundry, puis tester une attaque et un effet sur une scène d'essai.
        Ce journal est une documentation, pas un Actor JSON prêt à importer.</p>
      markdown: ''
