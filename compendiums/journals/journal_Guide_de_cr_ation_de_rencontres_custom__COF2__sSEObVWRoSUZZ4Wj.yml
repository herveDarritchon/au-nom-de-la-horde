  - _id: 0b443a690644434e
    name: 6. Compléter tous les onglets de Foundry
    type: text
    sort: 600000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>6. Compléter tous les onglets de Foundry</h2>

        <h3>Principal</h3>

        <p>Contient les attaques, actions activables et propriétés. Je
        recommande d'y indiquer aussi le nombre d'attaques par round, les modes
        de déplacement particuliers, les réactions et les règles de combat
        importantes. Le champ « Propriétés » est prévu à cet effet.</p>

        <h3>Butin</h3>

        <p>Renseigner les pièces et les objets récupérables. Attention, les
        équipements de cet onglet ne sont pas utilisés pour attaquer. Une épée
        doit être représentée séparément par une Attaque (de rencontre) pour le
        combat.</p>

        <h3>Voies &amp; Capacités</h3>

        <p>Regroupe les capacités propres à l'adversaire. Malgré le nom de
        l'onglet, une feuille Rencontre n'accepte que les objets Capacité, pas
        les Voies complètes.</p>

        <h3>Effets</h3>

        <p>Affiche les effets passifs, activables et temporaires. Les effets
        personnalisés peuvent conserver leur durée en rounds pendant un
        combat.</p>

        <h3>Notes</h3>

        <p>Séparer les notes publiques (description perceptible et comportement
        général) des notes privées : motivations, tactiques, secrets et
        informations réservées au MJ.</p>

        <h3>Prototype du Token</h3>

        <p>Configurer indépendamment du portrait de la fiche : image du token,
        nom affiché, vision, taille, disposition et barres de ressources. Il
        faut vérifier le prototype avant de placer les créatures sur la
        scène.</p>

        <p>Source : Guide officiel Foundry COF2, p. 25–32.</p>
      markdown: ''
