  - _id: 0e22709fce4b0a06
    name: '7. Exemple complet : créer un garde orc de Durotar'
    type: text
    sort: 700000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>7. Exemple complet : créer un garde orc de Durotar</h2>

        <p>Voici une rencontre Warbound construite avec les profils officiels
        COF2. C'est une création illustrative, et non une fiche canonique d'un
        PNJ de Warcraft.</p>

        <h3>Garde orc de Durotar</h3>

        <p><em>Humanoïde · Taille moyenne · Archétype puissant · NC 1 · 10
        POP</em></p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Caractéristique</th>

        <th>AGI</th>

        <th>CON</th>

        <th>FOR</th>

        <th>PER</th>

        <th>CHA</th>

        <th>INT</th>

        <th>VOL</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Modificateur</td>

        <td>+0</td>

        <td>+3</td>

        <td>+3*</td>

        <td>+2</td>

        <td>+0</td>

        <td>+0</td>

        <td>+2</td>

        </tr>

        </tbody>

        </table>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Statistique</th>

        <th>Valeur</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Initiative</td>

        <td>12</td>

        </tr>

        <tr>

        <td>Défense (DEF)</td>

        <td>15</td>

        </tr>

        <tr>

        <td>Vigueur (PV)</td>

        <td>15</td>

        </tr>

        <tr>

        <td>RD</td>

        <td>0</td>

        </tr>

        <tr>

        <td>Déplacement</td>

        <td>10 m — choix de conception</td>

        </tr>

        <tr>

        <td>Attaque principale</td>

        <td>Hache (contact), +4, DM 1d6+3, une attaque par round</td>

        </tr>

        <tr>

        <td>Capacités, PC</td>

        <td>Aucune capacité spéciale, 0 PC</td>

        </tr>

        <tr>

        <td>Caractéristique supérieure</td>

        <td>FOR*</td>

        </tr>

        </tbody>

        </table>

        <p>Ce profil possède les statistiques officielles d'un NC 1 et des
        caractéristiques physiques correspondant à l'archétype moyen puissant.
        Les caractéristiques mentales, l'arme et le déplacement sont des choix
        de création.</p>

        <p>Pour quatre PJ de niveau 1, il s'agit d'une rencontre ordinaire selon
        le budget de POP du Bestiaire.</p>

        <h3>Variante : garde vétéran</h3>

        <p>En appliquant un rang de boss classique au garde précédent :</p>

        <table class="warbound-table">

        <thead>

        <tr>

        <th>Statistique</th>

        <th>Garde</th>

        <th>Vétéran</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>NC</td>

        <td>1</td>

        <td>2</td>

        </tr>

        <tr>

        <td>DEF</td>

        <td>15</td>

        <td>17</td>

        </tr>

        <tr>

        <td>PV</td>

        <td>15</td>

        <td>35</td>

        </tr>

        <tr>

        <td>Attaque</td>

        <td>+4</td>

        <td>+6</td>

        </tr>

        <tr>

        <td>Dégâts</td>

        <td>1d6+3</td>

        <td>1d6+5</td>

        </tr>

        <tr>

        <td>Points de chance</td>

        <td>0</td>

        <td>1</td>

        </tr>

        </tbody>

        </table>

        <p>Le NC passe à 2, soit 20 POP. Il devient une rencontre difficile pour
        quatre PJ de niveau 1. La VOL et une autre caractéristique pertinente
        peuvent également augmenter de +1 conformément aux règles des rangs de
        boss.</p>

        <p>Cette variante illustre les modifications officielles du rang de boss
        classique (Bestiaire, p. 194–195). Tu dois saisir toutes ces nouvelles
        valeurs manuellement dans Foundry.</p>
