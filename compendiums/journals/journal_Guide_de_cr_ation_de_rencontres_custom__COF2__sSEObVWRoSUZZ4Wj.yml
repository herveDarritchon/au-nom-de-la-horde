  - _id: 3f5f61af62da20b3
    name: 9. Le standard que je retiendrais pour Warbound
    type: text
    sort: 900000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>9. Le standard que je retiendrais pour Warbound</h2>

        <p>Il est préférable d'avoir un seul modèle de fiche de rencontre,
        identique pour toutes les créatures Warcraft que nous créerons. Il
        contiendrait trois niveaux :</p>

        <ul>

        <li>Statistiques officielles COF2 : toutes les valeurs mécaniques,
        accompagnées de leur calcul et du NC final.</li>

        <li>Configuration Foundry : les champs exacts, objets d'attaque,
        capacités, effets et paramètres de token.</li>

        <li>Comportement en rencontre : objectifs de la créature, réactions
        possibles, conditions de fuite ou de reddition, et interactions avec le
        terrain.</li>

        </ul>

        <p>La séparation est essentielle. Un acteur techniquement complet n'est
        pas nécessairement une rencontre intéressante, et inversement. Pour une
        harde en fuite, par exemple, nous devrons peut-être gérer surtout le
        mouvement, le danger de la charge et la protection des civils, plutôt
        qu'un affrontement traditionnel.</p>

        <p>Enfin, je recommande de réserver la feuille Personnage de Foundry aux
        adversaires exceptionnellement complexes. Le guide officiel indique
        clairement qu'elle est plus adaptée lorsqu'un PNJ doit exploiter de
        nombreuses voies, des équipements actifs ou des automatisations
        avancées.</p>

        <p>Notre format de base doit donc rester Rencontre, simple, rapide à
        instancier et entièrement compatible avec COF2.</p>

        <p>Sources principales : Laurent Bernasconi, Chroniques Oubliées Fantasy
        2 — Livre de règles, Black Book Éditions, 2024, p. 302–303 ; Bestiaire,
        Black Book Éditions, 2025, p. 188–204 ; Guide du système COF2 pour
        Foundry VTT, version 2.1.0, mai 2026, p. 25–32, 43–45, 52 et 65–73.</p>
      markdown: ''
    flags: {}
