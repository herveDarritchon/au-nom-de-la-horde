    text:
      format: 1
      content: >-
        <h1>Coulisses MJ</h1><p><strong>POI :</strong> Z07-01 — Village de
        Sen'jin | <strong>Catégorie :</strong> lieu</p><p><em>Compléter les
        champs entre crochets. Cette fiche est réservée au MJ. Elle n’impose pas
        de scène ni de jet supplémentaire.</em></p><h2>Factions et vérité
        derrière la scène</h2><table><tbody><tr><th>Implantation / autorité
        locale</th><td>[Qui contrôle réellement cet endroit ? Si inconnu,
        laisser ouvert.]</td></tr><tr><th>Présences / incursions</th><td>[Qui
        circule ou menace sans contrôler le lieu ?]</td></tr><tr><th>Influence
        clandestine</th><td>[Uniquement si établie par les documents / la
        campagne]</td></tr><tr><th>Secret à ne pas révéler
        immédiatement</th><td>[Une vérité MJ facultative]</td></tr><tr><th>Ce
        qui reste à décider</th><td>[Coupable, emplacement, nom ou lien non
        établi]</td></tr></tbody></table><h2>Indice : trois niveaux d’accès, pas
        trois jets</h2><table><tbody><tr><th>Visible sans test</th><td>[Fait
        observable dès l’arrivée]</td></tr><tr><th>En agissant /
        parlant</th><td>[Fait obtenu par question, observation active,
        aide]</td></tr><tr><th>En approfondissant / risquant quelque
        chose</th><td>[Fait plus sensible ou plus précis]</td></tr><tr><th>Si un
        test échoue</th><td>[Retard, coût ou complication ; éviter de
        verrouiller le scénario]</td></tr></tbody></table><h2>Improviser si les
        joueurs bifurquent — palette 1d6 facultative</h2><p><em>À utiliser pour
        nourrir une scène existante. Aucun tirage supplémentaire systématique en
        voyage.</em></p><table><thead><tr><th>1d6</th><th>Amorce à
        adapter</th></tr></thead><tbody><tr><th>1</th><td>Un habitant ou
        voyageur a besoin d’aide</td></tr><tr><th>2</th><td>Deux personnes
        revendiquent une ressource</td></tr><tr><th>3</th><td>Un témoin
        contredit une version des faits</td></tr><tr><th>4</th><td>La sécurité
        d’un abri ou bâtiment change</td></tr><tr><th>5</th><td>Une piste ou un
        objet inattendu est trouvé</td></tr><tr><th>6</th><td>Une décision
        ancienne produit une conséquence</td></tr></tbody></table><h2>Réaction
        des acteurs aux décisions</h2><p><strong>Les PJ aident :</strong>
        [réaction / récompense].</p><p><strong>Les PJ négocient :</strong>
        [limite / condition].</p><p><strong>Les PJ menacent ou attaquent
        :</strong> [réaction proportionnée].</p><p><strong>Les PJ repartent
        :</strong> [une évolution locale si justifiée].</p><h2>Conséquences
        persistantes</h2><table><tbody><tr><th>Si les PJ
        interviennent</th><td>[Plusieurs suites plausibles, sans imposer
        d’issue]</td></tr><tr><th>Si les PJ ignorent</th><td>[Prochaine
        évolution si personne n’intervient]</td></tr><tr><th>Au prochain
        retour</th><td>[Un effet des PJ et un changement du monde
        maximum]</td></tr><tr><th>Gain exploitable</th><td>[Route, contact,
        ressource, vérité, alliance, dette]</td></tr></tbody></table>
