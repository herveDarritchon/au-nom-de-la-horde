      content: |-
        <h1>PNJ — Vol'jin</h1>
            <p><strong>ID :</strong> PNJ-Z07-01-01 · <strong>POI :</strong> Z07-01 · <strong>Zone :</strong> Z07</p>
            <p><strong>Origine / statut :</strong> Classic — chef des Sombrelances ; présence occasionnelle décidée par MJ</p>
            <p><strong>Fonction :</strong> Chef du peuple sombrelance en visite au village · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — Sombrelances</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>S’assurer que Sen’jin reste capable de défendre ses habitants.</td></tr><tr><th>Motivation profonde</th><td>Il doit protéger son peuple sans l’enfermer dans une guerre d’usure.</td></tr><tr><th>Obstacle</th><td>Les Kolkar détournent les ressources de la reconquête des îles.</td></tr>
              <tr><th>Ligne rouge</th><td>Sacrifier ses villageois à une victoire de prestige.</td></tr><tr><th>Peut offrir</th><td>Audience rare, cadre d’une mission reconnue, arbitrage de priorité.</td></tr><tr><th>En échange</th><td>Preuve de discernement et respect de l’autonomie sombrelance.</td></tr>
              <tr><th>Attitude initiale</th><td>Calme, attentif aux conséquences à long terme.</td></tr><tr><th>S'il n'arrive rien</th><td>Répartit des forces vers une autre menace ; la pression du village change.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Bâton de cérémonie marqué par les voyages, regard fixe.</p><p><strong>Voix et comportement :</strong> Pose peu de questions mais attend la réponse entière.</p><p><strong>Signe émotionnel :</strong> Une longue pause précède toute réponse à une demande de vengeance.</p>
            <blockquote><p><strong>Première réplique :</strong> « Un chef doit savoir à quoi il renonce quand il dit oui. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Que défendez-vous d’abord : le village ou une victoire ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>La défense de Sen’jin mobilise des chasseurs et des guetteurs.</td></tr><tr><th>Après échange, aide ou observation</th><td>Peut exposer la nécessité de maintenir les routes et de préparer un retour aux îles.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>MJ : il ne connaît pas automatiquement le soutien secret de Zalazane aux Kolkar ; ne résout pas l’arc à la place des PJ.</td></tr><tr><th>Il demande</th><td>Preuve de discernement et respect de l’autonomie sombrelance.</td></tr>
              <tr><th>Il peut proposer</th><td>Audience rare, cadre d’une mission reconnue, arbitrage de priorité.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Sacrifier ses villageois à une victoire de prestige.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Confie une responsabilité locale limitée à des PJ fiables.</td></tr><tr><th>S'ils négocient</th><td>Accepte une priorité alternative si elle protège réellement le village.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Rappelle ses propres éclaireurs, laissant les PJ agir sans soutien.</td></tr><tr><th>S'ils l'ignorent</th><td>Répartit des forces vers une autre menace ; la pression du village change.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z07-01. <strong>Relations / autres lieux :</strong> Présence exceptionnelle ; hors scène, une délégation ou un ancien suffit.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z07/Z09 : confiance de la communauté, perspective de reconquête, pas intervention miraculeuse.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
