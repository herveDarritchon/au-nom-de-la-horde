      content: |-
        <h1>PNJ — Zelha Puits-Serein</h1>
            <p><strong>ID :</strong> PNJ-Z07-01-02 · <strong>POI :</strong> Z07-01 · <strong>Zone :</strong> Z07</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Soigneuse et médiatrice de Sen’jin · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — communauté sombrelance</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Faire soigner trois blessés tout en gardant des chasseurs en état de partir.</td></tr><tr><th>Motivation profonde</th><td>Elle préfère une communauté vivante à une vengeance spectaculaire.</td></tr><tr><th>Obstacle</th><td>Les remèdes et les bras manquent.</td></tr>
              <tr><th>Ligne rouge</th><td>Sacrifier un malade parce qu’il s’est approché d’un ennemi.</td></tr><tr><th>Peut offrir</th><td>Préparations simples, accueil, témoin blessé, contact de chasseurs.</td></tr><tr><th>En échange</th><td>Aide ciblée et protection d’un groupe parti chercher des composants.</td></tr>
              <tr><th>Attitude initiale</th><td>Ferme, chaleureuse seulement après les actes.</td></tr><tr><th>S'il n'arrive rien</th><td>Envoie des chasseurs malgré le risque, augmentant la pression sur une route.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Poches d’herbes suspendues à sa ceinture.</p><p><strong>Voix et comportement :</strong> Frappe doucement les mots sur une table en parlant.</p><p><strong>Signe émotionnel :</strong> Baisse la voix auprès d’un blessé, même en pleine dispute.</p>
            <blockquote><p><strong>Première réplique :</strong> « Une blessure raconte une histoire. Écoutez-la avant de chercher un coupable. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Qui gardera le village pendant que vous courrez après les cavaliers ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Un blessé a été retrouvé près d’une piste de chasse.</td></tr><tr><th>Après échange, aide ou observation</th><td>Les traces et blessures indiquent plusieurs groupes, pas une seule attaque frontale.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ignore l’accord Kolkar–Zalazane ; des signes peuvent éveiller ses soupçons plus tard.</td></tr><tr><th>Il demande</th><td>Aide ciblée et protection d’un groupe parti chercher des composants.</td></tr>
              <tr><th>Il peut proposer</th><td>Préparations simples, accueil, témoin blessé, contact de chasseurs.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Sacrifier un malade parce qu’il s’est approché d’un ennemi.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Fournit un témoin et un refuge quand le village est sûr.</td></tr><tr><th>S'ils négocient</th><td>Accepte de partager des composants contre une aide à la communauté.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Coupe l’accès à ses réserves mais continue de soigner les victimes.</td></tr><tr><th>S'ils l'ignorent</th><td>Envoie des chasseurs malgré le risque, augmentant la pression sur une route.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z07-01. <strong>Relations / autres lieux :</strong> À relier à Z07-02 ; Vol’jin ne la remplace pas.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z07 : ressources médicales préservées, confiance accrue ou pénurie.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
