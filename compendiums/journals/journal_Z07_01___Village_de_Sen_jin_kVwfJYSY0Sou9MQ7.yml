        <h1>Village de Sen'jin</h1>

        <p><strong>Identifiant :</strong> Z07-01</p>

        <p><strong>Zone géographique :</strong> Z07 — Village de Sen’jin et
        Grève des Sombrelances</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Nœud [2]</p>

        <h2>Fonction dans la campagne</h2>

        <p>Hub secondaire des Sombrelances ; ancrage régional des quêtes du
        sud.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Nœud [2] — hub secondaire.</p>

        <p><strong>Repère géographique :</strong> Communauté sombrelance du sud
        : pêche, chasse, départs vers la côte et les îles.</p>

        <p><strong>Factions et influences :</strong> Horde / trolls Sombrelances
        ; Kolkar (incursions) ; Zalazane (adversaire insulaire, soutien secret
        aux Kolkar).</p>

        <p><strong>Références et réserves :</strong> [PC] [FAC]</p>

        <p><em>La présence de Kolkar aux approches ne leur attribue pas le
        contrôle du village.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
