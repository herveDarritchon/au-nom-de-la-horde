  - name: Activation et évolution
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Faire vivre les accroches</h1>


        <h2>Quand déclencher une accroche ?</h2>

        <ul>

        <li><strong>Retour à Razor Hill :</strong> une conséquence ou un nouveau
        voyageur est arrivé pendant l'absence des PJ.</li>

        <li><strong>Voyage :</strong> l'accroche est rencontrée directement sur
        une route.</li>

        <li><strong>Temps calme :</strong> un Tauren donne un autre regard sur
        ce que les PJ viennent de vivre.</li>

        <li><strong>Après une décision :</strong> utiliser une accroche comme
        conséquence indirecte d'un choix antérieur.</li>

        </ul>


        <h2>Structure rapide</h2>

        <ol>

        <li><strong>Signal :</strong> ce que les PJ voient ou entendent.</li>

        <li><strong>Incertitude :</strong> deux explications au moins restent
        plausibles.</li>

        <li><strong>Choix :</strong> les PJ décident s'ils s'impliquent et
        comment.</li>

        <li><strong>Réaction :</strong> PNJ, tribus et Horde agissent en
        retour.</li>

        <li><strong>Trace :</strong> la situation modifie une relation, une
        route, une information ou l'état du territoire.</li>

        </ol>


        <h2>Ne pas faire</h2>

        <ul>

        <li>Transformer chaque Tauren en donneur de quête.</li>

        <li>Faire de chaque phénomène un présage de Ragefire.</li>

        <li>Présenter une tribu comme monolithique : un individu peut avoir sa
        propre opinion.</li>

        <li>Résoudre les tensions Horde/Taurens par un simple jet social
        unique.</li>

        <li>Faire des Grimtotem les coupables par défaut dès qu'une situation
        est hostile.</li>

        </ul>


        <h2>Mini-front tauren recommandé</h2>

        <table>

        <thead><tr><th>Fil</th><th>Rôle</th></tr></thead>

        <tbody>

        <tr><td><strong>Stonehoof</strong></td><td>Matériel, travaux et fil
        rouge.</td></tr>

        <tr><td><strong>Thunderhorn / Runetotem</strong></td><td>Environnement,
        faune et symptômes.</td></tr>

        <tr><td><strong>Stonespire</strong></td><td>Thème de la terre et de
        l'exploitation.</td></tr>

        <tr><td><strong>Grimtotem</strong></td><td>Tension politique, soupçon et
        fausse piste.</td></tr>

        </tbody>

        </table>
