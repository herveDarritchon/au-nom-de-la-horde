  - name: 4 situations récurrentes
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>4 situations récurrentes recommandées</h1>

        <p>Ces quatre fils peuvent revenir plusieurs fois au cours de la saison.
        Ils donnent une présence taurène cohérente sans transformer Durotar en
        catalogue de tribus.</p>


        <h2>1. Le convoi Stonehoof</h2>

        <p>Une caravane taurène arrive à Razor Hill avec des pièces métalliques
        inhabituellement lourdes : poutrelles ferrées, chaînes, pointes de
        forage et ferrures de soutènement.</p>

        <p>Les Stonehoof livrent simplement du matériel commandé par la Horde.
        Quelques jours plus tard, une partie du chargement disparaît.</p>

        <p><strong>Indice essentiel :</strong> les voleurs ont laissé armes,
        nourriture, argent et marchandises ordinaires. Ils ont pris uniquement
        ce qui sert à <strong>creuser, renforcer ou soutenir des
        galeries</strong>.</p>

        <p><strong>Ce que les PJ peuvent faire :</strong> inspecter le convoi,
        pister les voleurs, interroger les convoyeurs, tendre une embuscade,
        suivre les commandes ou ignorer l'incident.</p>

        <p><strong>Si personne n'agit :</strong> une autre livraison technique
        est ciblée plus tard et la Horde renforce les escortes.</p>

        <p><strong>Fonction de campagne :</strong> fil rouge direct, sans
        révéler pourquoi les travaux sont sabotés.</p>


        <h2>2. Les bêtes quittent les crêtes</h2>

        <p>Un chasseur <strong>Thunderhorn</strong> et un druide
        <strong>Runetotem</strong> constatent séparément des migrations
        inhabituelles au nord.</p>

        <p>Ils sont d'accord sur le symptôme mais pas sur la cause : le
        Thunderhorn soupçonne un prédateur, des chasseurs ou une présence
        hostile ; le Runetotem parle d'un territoire perturbé.</p>

        <p>Les conséquences deviennent concrètes autour de Razor Hill :
        scorpides, sangliers et autres créatures apparaissent près des routes et
        des convois.</p>

        <p><strong>Ce que les PJ peuvent faire :</strong> tuer les bêtes
        déplacées, les repousser, remonter leur piste, comparer les observations
        des deux Taurens ou chercher une cause commune.</p>

        <p><strong>Si personne n'agit :</strong> la Horde organise des battues
        qui règlent temporairement le symptôme et aggravent potentiellement le
        déséquilibre.</p>

        <p><strong>Fonction de campagne :</strong> faire arriver les
        conséquences avant l'explication.</p>


        <h2>3. Le vieux Stonespire</h2>

        <p>Un vieux Tauren fait halte à Razor Hill sur la route d'Orgrimmar. Le
        soir, quelqu'un vante les nouveaux tunnels, carrières et travaux de la
        Horde.</p>

        <blockquote>« Les nains aussi appelaient cela construire. »</blockquote>

        <p>Le Tauren raconte alors ce que sa famille a connu autour de Bael
        Modan. Il n'est ni prophète ni opposant secret au projet d'Orgrimmar et
        ne sait rien de Ragefire.</p>

        <p><strong>Ce que les PJ peuvent faire :</strong> discuter avec lui,
        rejeter sa comparaison, chercher à comprendre Bael Modan, confronter ses
        paroles à celles d'un ingénieur ou simplement garder ce récit en
        mémoire.</p>

        <p><strong>Fonction de campagne :</strong> poser la question de la
        terre, de l'exploitation et de la construction d'un foyer sans livrer
        d'indice factuel sur le climax.</p>


        <h2>4. Les paroles des Grimtotem</h2>

        <p>Des propos hostiles aux travaux et à l'alliance de Cairne avec Thrall
        circulent à Razor Hill :</p>

        <blockquote>« Même certains Taurens disent que Cairne s'est trompé en
        rejoignant Thrall. »</blockquote>

        <blockquote>« Les Orcs creusent sous leur propre capitale comme les
        nains creusent partout où ils passent. »</blockquote>

        <blockquote>« Les esprits finiront par leur répondre. »</blockquote>

        <p>Beaucoup concluent immédiatement qu'un <strong>Grimtotem</strong> se
        trouve à Durotar. Il n'existe pourtant aucune preuve.</p>

        <p><strong>Vérités possibles :</strong> véritable agent Grimtotem ;
        Tauren loyal à la Horde mais critique ; saboteur utilisant leur
        réputation ; simple rumeur devenue certitude collective.</p>

        <p><strong>Fonction de campagne :</strong> fausse piste politique et
        révélateur des préjugés internes à la Horde.</p>
