        <h1>Accroches taurènes — Durotar</h1>

        <p><strong>Fonction :</strong> faire entrer les Taurens dans la vie de
        Durotar sans en faire une nouvelle faction territoriale.</p>

        <p>Les Taurens apparaissent comme <strong>voyageurs, chasseurs, chamans,
        artisans, émissaires, caravanes et membres de la Horde</strong>. Une
        accroche doit créer une situation à laquelle les PJ peuvent choisir de
        réagir, pas une mission obligatoire.</p>


        <h2>Mode d'emploi</h2>

        <ul>

        <li>Expose <strong>1 accroche à la fois</strong>, exceptionnellement 2
        si elles se croisent naturellement.</li>

        <li>Commence par le <strong>symptôme visible</strong> : un disparu, une
        cargaison, une dispute, une bête, une anomalie.</li>

        <li>Ne donne pas immédiatement la vérité derrière la situation.</li>

        <li>Si les PJ ignorent l'accroche, fais évoluer la situation hors
        champ.</li>

        <li>Ne relie pas automatiquement toutes les accroches au fil rouge de
        Ragefire.</li>

        <li>Les Taurens doivent élargir le monde de la Horde, pas voler la
        vedette à Durotar.</li>

        </ul>


        <p><em>Ces situations sont des adaptations Warbound. Elles ne prétendent
        pas décrire des événements canoniques de WoW Classic.</em></p>
