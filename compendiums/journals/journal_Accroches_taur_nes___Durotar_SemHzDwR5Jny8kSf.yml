        <h1>12 accroches par tribu</h1>

        <p>Choisis une accroche selon le lieu, l'état de la campagne et les
        intérêts des PJ. La colonne <strong>Ce qui se passe réellement</strong>
        est réservée au MJ.</p>

        <table>

        <thead>

        <tr><th>Tribu</th><th>Horde</th><th>Accroche / rumeur</th><th>Réalité
        MJ</th><th>Lieu</th><th>Fonction</th></tr>

        </thead>

        <tbody>

        <tr><td><strong>Bloodhoof</strong></td><td
        style="text-align:center">✅</td><td>« Cairne aurait envoyé quelqu'un
        vérifier ce que les Orcs creusent sous Orgrimmar. »</td><td>Un émissaire
        Bloodhoof accompagne simplement une mission diplomatique et logistique.
        Il s'étonne toutefois de la quantité de matériel de soutènement envoyée
        vers le nord.</td><td>Razor Hill → route d'Orgrimmar</td><td>Diplomatie
        / logistique</td></tr><tr><td><strong>Hawkwind</strong></td><td
        style="text-align:center">✅</td><td>« Un jeune Tauren parti seul de Camp
        Narache aurait disparu dans les ravins. »</td><td>Le jeune Hawkwind
        accomplit un rite personnel et refuse d'abandonner une bête blessée
        qu'il piste. Il a cependant aperçu quelque chose qu'il n'aurait pas dû
        voir.</td><td>Thunder Ridge / Drygulch</td><td>Recherche /
        témoin</td></tr><tr><td><strong>Runetotem</strong></td><td
        style="text-align:center">✅</td><td>« Un druide tauren prétend que les
        animaux fuient le nord de Durotar. »</td><td>C'est vrai, mais il ignore
        pourquoi. Certains prédateurs quittent leurs territoires et déplacent le
        problème vers les routes de la Horde.</td><td>Thunder
        Ridge</td><td>Nature /
        symptôme</td></tr><tr><td><strong>Thunderhorn</strong></td><td
        style="text-align:center">✅</td><td>« Les Thunderhorn disent qu'il n'y a
        plus rien à chasser près des crêtes. »</td><td>Un pisteur a découvert
        plusieurs migrations anormales. Son enquête peut conduire les PJ à des
        traces de saboteurs… ou simplement à un phénomène naturel.</td><td>Route
        nord-ouest</td><td>Pistage /
        ambiguïté</td></tr><tr><td><strong>Wildmane</strong></td><td
        style="text-align:center">✅</td><td>« Une wyverne est revenue seule avec
        sa selle couverte de sang. »</td><td>Son cavalier Wildmane est vivant
        mais bloqué dans un ravin. Avant sa chute, il avait repéré un passage
        dissimulé utilisé par plusieurs inconnus.</td><td>Sentier vers Skull
        Rock</td><td>Sauvetage /
        exploration</td></tr><tr><td><strong>Ragetotem</strong></td><td
        style="text-align:center">✅</td><td>« Les Taurens commencent à penser
        que les Orcs ne savent plus tenir leurs propres routes. »</td><td>Un
        vétéran Ragetotem propose d'organiser des patrouilles taurènes. Il veut
        sincèrement aider, mais son intervention risque d'humilier certains
        Grunts et d'envenimer les relations.</td><td>Razor Hill</td><td>Social /
        tensions internes</td></tr><tr><td><strong>Dawnstrider</strong></td><td
        style="text-align:center">✅</td><td>« Un chaman affirme qu'une caisse
        d'outils chante quand on l'approche du feu. »</td><td>Certains éléments
        métalliques destinés aux travaux du nord portent une résonance
        élémentaire inhabituelle. Impossible encore de dire si c'est
        dangereux.</td><td>Dépôt de Razor Hill</td><td>Mystère /
        élémentaire</td></tr><tr><td><strong>Skychaser</strong></td><td
        style="text-align:center">✅</td><td>« Les esprits ne répondraient plus
        sur une vieille hauteur de Durotar. »</td><td>Ils répondent encore, mais
        quelque chose brouille les signes. Le problème peut venir d'un phénomène
        élémentaire, d'une perturbation souterraine ou d'une mauvaise
        interprétation du chaman.</td><td>Hauteurs de Thunder
        Ridge</td><td>Spirituel /
        investigation</td></tr><tr><td><strong>Winterhoof</strong></td><td
        style="text-align:center">✅</td><td>« Les Taurens achètent toutes les
        plantes médicinales qu'ils trouvent. Il doit y avoir une épidémie à
        Thunder Bluff. »</td><td>Faux. Une herboriste Winterhoof cherche à
        comprendre pourquoi plusieurs plantes de Durotar développent des
        propriétés inhabituelles.</td><td>Razor Hill / Sen'jin</td><td>Enquête /
        plantes</td></tr><tr><td><strong>Stonehoof</strong></td><td
        style="text-align:center">✅</td><td>« Une énorme commande de pièces de
        forge vient de partir vers Orgrimmar. »</td><td>Vrai. Les Stonehoof ont
        fabriqué des renforts, rails, coins, chaînes et outils destinés aux
        travaux souterrains. Certaines pièces disparaissent en
        route.</td><td>Fil rouge idéal</td><td>Fil rouge /
        sabotage</td></tr><tr><td><strong>Stonespire</strong></td><td
        style="text-align:center">✅⚠️</td><td>« Un vieux Tauren raconte que les
        peuples qui creusent trop profondément finissent toujours par voler la
        terre de quelqu'un. »</td><td>Un membre de la famille Stonespire
        traverse Durotar. Son histoire de Bael Modan donne une lecture
        troublante des travaux orcs sans qu'il sache quoi que ce soit du
        véritable danger.</td><td>Razor Hill / feu de camp</td><td>Thème /
        foreshadowing</td></tr><tr><td><strong>Grimtotem</strong></td><td
        style="text-align:center">❌</td><td>« Les Grimtotem seraient déjà en
        Durotar. »</td><td>Peut-être. Quelqu'un diffuse effectivement des
        discours accusant Cairne d'avoir livré les Taurens à une Horde qui
        éventre désormais les terres sacrées. Reste à déterminer qui parle
        réellement au nom des Grimtotem.</td><td>Partout, surtout Razor
        Hill</td><td>Politique / fausse piste</td></tr>

        </tbody>

        </table>
