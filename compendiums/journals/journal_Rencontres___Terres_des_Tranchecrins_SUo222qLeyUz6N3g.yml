  - name: Le passage qui se referme
    type: text
    sort: 100000
    text:
      content: >-
        <h2>Le passage qui se referme</h2>

        <h3>En un regard</h3>

        <p>Plusieurs Tranchecrins tirent des amas de branches épineuses à
        travers l’un des passages les plus étroits du ravin. Ils travaillent
        vite et regardent régulièrement vers les hauteurs.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Les Tranchecrins ferment un accès qu’ils ne souhaitent plus laisser
        praticable aux étrangers. Le barrage n’est pas encore terminé et peut
        toujours être franchi.</p>

        <p>Le groupe travaille depuis plusieurs heures et veut achever
        l’obstacle avant de repartir vers l’intérieur du territoire.</p>

        <h3>Acteurs</h3>

        <p><strong>Tranchecrins chargés du barrage — terminer le travail —
        concentrés mais vigilants</strong></p>

        <p><strong>Éclaireur en hauteur — éviter une surprise — attentif aux
        crêtes plus qu’au fond du ravin</strong></p>

        <h3>Tension</h3>

        <p>Le passage constitue probablement l’itinéraire le plus direct des
        PJ.</p>

        <p>Intervenir signifie révéler leur présence. Attendre laisse aux
        Tranchecrins le temps de rendre le passage beaucoup plus difficile à
        emprunter.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les matériaux proviennent des taillis voisins.</li><li>Le
        barrage est conçu pour empêcher le passage, pas simplement pour se
        protéger derrière.</li><li>L’éclaireur regarde régulièrement vers
        l’extérieur du territoire.</li><li>Un espace étroit demeure praticable
        sur un côté.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent attendre la fin des travaux, contourner le secteur,
        profiter de l’ouverture restante, observer la manière dont les
        Tranchecrins circulent ou tenter de détourner leur attention.</p>

        <p>Ils peuvent également décider de détruire le barrage, immédiatement
        ou plus tard.</p>

        <h3>Évolution</h3>

        <p>Une fois le travail terminé, les Tranchecrins quittent les lieux.</p>

        <p>Le passage devient alors un obstacle durable du pointcrawl tant qu’il
        n’est pas dégagé ou contourné.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ peuvent découvrir un itinéraire utilisé par les Tranchecrins,
        identifier un changement territorial ou créer eux-mêmes un futur
        raccourci en neutralisant l’obstacle.</p>

        <h3>Combat éventuel</h3>

        <p>Si les PJ sont repérés alors qu’ils tentent de franchir ou détruire
        le barrage, les Tranchecrins cherchent surtout à les <strong>repousser
        du passage</strong>.</p>

        <p>Ils utilisent l’étroitesse du ravin et les branches pour limiter les
        déplacements. Ils peuvent rompre le combat si les intrus battent en
        retraite.</p>
      format: 1
