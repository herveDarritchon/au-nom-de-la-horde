  - name: Trop loin de Tranchecolline
    type: text
    sort: 1700000
    text:
      content: >-
        <h2>Trop loin de Tranchecolline</h2>

        <h3>En un regard</h3>

        <p>Un petit groupe venu de Tranchecolline tente difficilement de faire
        demi-tour avec un chargement encombrant dans un ravin trop étroit.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Le groupe a cru emprunter un raccourci et s’est enfoncé bien plus
        loin que prévu dans le territoire Tranchecrin.</p>

        <p>Il essaie maintenant de repartir sans attirer l’attention.</p>

        <h3>Acteurs</h3>

        <p><strong>Voyageurs de la Horde — ressortir avec leur chargement —
        nerveux</strong></p>

        <p><strong>Responsable du groupe — éviter d’avouer son erreur —
        obstiné</strong></p>

        <h3>Tension</h3>

        <p>Faire demi-tour est bruyant et lent.</p>

        <p>Abandonner une partie du chargement permettrait de repartir
        rapidement mais représente une perte importante.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les roues ou les charges raclent constamment la
        roche.</li><li>Le groupe possède une mauvaise représentation du
        secteur.</li><li>Certains membres veulent abandonner le
        matériel.</li><li>Plusieurs traces Tranchecrins récentes traversent le
        passage.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent aider à manœuvrer, indiquer une autre route, convaincre
        le groupe d’abandonner une partie du chargement, masquer ses traces ou
        le laisser gérer seul son erreur.</p>

        <h3>Évolution</h3>

        <p>Plus le temps passe, plus le bruit augmente la probabilité d’attirer
        les occupants du territoire.</p>

        <h3>Retombées possibles</h3>

        <p>Une aide peut créer des contacts à Tranchecolline, permettre aux PJ
        de négocier du matériel ou révéler les conséquences très concrètes d’une
        mauvaise connaissance du terrain.</p>

        <h3>Combat éventuel</h3>

        <p>Si des Tranchecrins arrivent, ils cherchent prioritairement à
        <strong>chasser les intrus et récupérer ce qui reste sur leur
        territoire</strong>.</p>

        <p>Les voyageurs veulent dégager leur chargement ou fuir. Un départ
        réussi, l’abandon du matériel ou une diversion suffit à résoudre la
        confrontation.</p>
      format: 1
