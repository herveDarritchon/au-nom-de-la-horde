  - name: L’ennemi sous les ronces
    type: text
    sort: 700000
    text:
      content: >-
        <h2>L’ennemi sous les ronces</h2>

        <h3>En un regard</h3>

        <p>Un Tranchecrin blessé est coincé sous un amas de branches et de
        pierres. Il cesse immédiatement de bouger lorsqu’il aperçoit les PJ.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Il a été victime d’un accident du terrain pendant un déplacement
        solitaire.</p>

        <p>Il ne peut pas se dégager rapidement sans aide.</p>

        <h3>Acteurs</h3>

        <p><strong>Tranchecrin blessé — survivre et rejoindre les siens —
        hostile mais inquiet</strong></p>

        <h3>Tension</h3>

        <p>Les deux camps savent qu’ils sont ennemis.</p>

        <p>Pourtant, le Tranchecrin est momentanément vulnérable et les PJ ne
        savent pas si d’autres membres de son groupe se trouvent à
        proximité.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Ses blessures correspondent à une chute, pas à un
        combat.</li><li>Son arme reste à portée mais il ne peut pas l’utiliser
        correctement.</li><li>Il observe surtout la sortie du ravin.</li><li>Il
        tente de dissimuler son inquiétude.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent l’aider, le questionner, le désarmer, le laisser sur
        place, l’utiliser pour comprendre les chemins locaux ou tenter de le
        suivre s’il repart.</p>

        <h3>Évolution</h3>

        <p>Sans aide, il finit par se libérer difficilement ou par être retrouvé
        par d’autres Tranchecrins.</p>

        <h3>Retombées possibles</h3>

        <p>Une aide peut créer une dette individuelle sans transformer la
        faction entière en alliée.</p>

        <p>Une brutalité inutile peut au contraire nourrir une hostilité
        personnelle ultérieure.</p>
      format: 1
    flags:
      warbound-campaign-content:
