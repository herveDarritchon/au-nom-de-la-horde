pages:
  - name: Contexte
    type: text
    sort: 0
    text:
      content: >-
        <h1>Rencontres — Terres des Tranchecrins</h1>

        <h2>Périmètre</h2>

        <p>Cette table est destinée aux déplacements et explorations dans les
        <strong>Terres des Tranchecrins</strong>, à l’ouest de
        Tranchecolline.</p>

        <p>Elle couvre principalement :</p>

        <ul><li>les ravins et passages étroits du territoire Tranchecrin
        ;</li><li>le <strong>Tunnel des Tranchecrins</strong> ;</li><li>le
        <strong>Cratère des Tranchecrins</strong> ;</li><li>la <strong>Piste des
        Échineurs</strong> ;</li><li>les abords de la <strong>Grotte des
        Échineurs</strong>.</li></ul>

        <p>Le relief compartimente fortement le territoire. Deux groupes séparés
        de quelques dizaines de mètres peuvent ne ni se voir ni s’entendre. Les
        hauteurs permettent en revanche de surveiller les passages obligés.</p>

        <p>La table n’est pas destinée à représenter tout Durotar : elle doit
        faire sentir que les PJ ont pénétré dans un espace où les
        <strong>quilboars Tranchecrins occupent, surveillent et aménagent le
        terrain</strong>.</p>

        <h2>Identité du territoire</h2>

        <p>Roche rouge, ravins secs, taillis épineux, pentes friables et
        passages resserrés donnent au secteur une impression d’enfermement
        inhabituelle pour Durotar.</p>

        <p>La visibilité change constamment : un promontoire peut offrir une vue
        remarquable sur les environs, tandis qu’un détour suffit ensuite à
        masquer totalement le chemin parcouru.</p>

        <p>Les traces d’occupation sont fréquentes :</p>

        <ul><li>branchages coupés ;</li><li>pierres déplacées ;</li><li>sentiers
        élargis ou volontairement obstrués ;</li><li>traces de passage
        ;</li><li>postes d’observation improvisés ;</li><li>restes de campements
        ;</li><li>marques territoriales ;</li><li>passages connus des seuls
        habitués.</li></ul>

        <p>Le danger principal vient autant de cette <strong>maîtrise du
        terrain</strong> que de la présence des Tranchecrins eux-mêmes.</p>

        <h2>Background utile au MJ</h2>

        <p>Les Tranchecrins empiètent sur les terres proches de Tranchecolline.
        Ils ne doivent donc pas apparaître comme une succession de groupes
        attendant immobiles d’être combattus : ils circulent, surveillent,
        transportent des ressources et consolident leur présence.</p>

        <p>Leur hostilité envers les intrus est réelle, mais chaque rencontre ne
        provoque pas automatiquement une attaque. Un éclaireur isolé peut
        préférer prévenir les siens, un groupe chargé peut chercher à éviter un
        affrontement, et certains individus peuvent privilégier leur propre
        survie.</p>

        <p>La <strong>Piste des Échineurs</strong> et la <strong>Grotte des
        Échineurs</strong> signalent une autre présence régulière dans le
        secteur. La nature exacte des Échineurs n’est volontairement <strong>pas
        définie à ce stade de Warbound</strong>. Cette collection peut montrer
        leurs traces, leurs effets et les réactions qu’ils provoquent, mais elle
        ne fixe ni leur espèce, ni leur origine, ni leurs capacités.</p>

        <p>Le principe de conception utilisé ici est celui d’une rencontre comme
        <strong>situation déjà en train de se produire avant l’arrivée des
        PJ</strong>, et non comme simple apparition d’un groupe d’adversaires.
        :chatgpt-content-reference{index="0"}</p>

        <h2>Qui circule ici ?</h2>

        <p><strong>Tranchecrins</strong> — Ils constituent la présence
        dominante. Éclaireurs, gardes, transporteurs ou petits groupes utilisent
        les ravins et les passages couverts pour circuler sans être facilement
        repérés.</p>

        <p><strong>Patrouilles et éclaireurs de la Horde</strong> — Ils peuvent
        s’aventurer depuis Tranchecolline pour surveiller l’empiètement,
        reconnaître un passage ou rechercher des disparus, mais ils sont ici en
        territoire dangereux.</p>

        <p><strong>Voyageurs imprudents ou égarés</strong> — Peu nombreux. Ceux
        qui quittent les pistes sûres peuvent se retrouver bloqués dans les
        reliefs.</p>

        <p><strong>Faune et charognards</strong> — Le relief leur procure abris
        et points d’observation. Leur comportement peut également révéler la
        présence d’un danger invisible.</p>

        <p><strong>Échineurs</strong> — Leur fréquentation de la partie
        occidentale est perceptible, mais leur nature reste à fixer. Les
        rencontres qui leur sont liées doivent entretenir cette incertitude.</p>

        <h2>Ce qui se passe actuellement</h2>

        <p>Le territoire est dans son <strong>état de base hostile</strong>.</p>

        <p>Les Tranchecrins cherchent à conserver leur liberté de circulation et
        à maintenir leur emprise sur les passages qu’ils utilisent. La Horde
        sait que le secteur est dangereux, mais il ne s’agit pas encore d’un
        front militaire organisé.</p>

        <p>Le Tunnel et le Cratère permettent aux Tranchecrins de se déplacer à
        couvert et de dissimuler une partie de leur activité.</p>

        <p>À l’ouest, les traces liées aux Échineurs compliquent encore la
        lecture du territoire : certaines marques peuvent appartenir aux
        Tranchecrins, d’autres à la faune, d’autres enfin à cette présence
        encore mal connue.</p>

        <h2>Modificateurs du contexte actuel</h2>

        <p>Aucun événement exceptionnel ni conséquence antérieure des actions
        des PJ n’a été fourni.</p>

        <p>La table représente donc l’<strong>état normal actuel</strong> du
        territoire :</p>

        <ul><li>présence Tranchecrin régulière ;</li><li>vigilance envers les
        intrus ;</li><li>circulation difficile ;</li><li>contrôle imparfait mais
        réel des passages ;</li><li>présence des Échineurs encore indéterminée
        ;</li><li>absence d’alerte générale.</li></ul>

        <p>Si les PJ provoquent ultérieurement les Tranchecrins, détruisent un
        poste ou découvrent un raccourci, certaines entrées pourront être
        désactivées ou réinterprétées pour refléter ce changement.</p>

        <h2>Utilisation de la table</h2>

        <p>Cette table répond à :</p>

        <blockquote><p><strong>« Quelle rencontre se produit ?
        »</strong></p></blockquote>

        <p>Elle ne détermine pas si une rencontre doit avoir lieu.</p>

        <p>Effectue un tirage lorsque tu veux :</p>

        <ul><li>matérialiser l’entrée en territoire hostile ;</li><li>rappeler
        que les Tranchecrins vivent et circulent ici ;</li><li>rendre un trajet
        moins abstrait ;</li><li>introduire un choix de route ;</li><li>révéler
        progressivement l’organisation du territoire ;</li><li>montrer les
        traces des Échineurs sans encore les définir ;</li><li>créer une
        complication pendant une exploration.</li></ul>

        <h2>Quand ne pas tirer</h2>

        <p>Ne tire pas lorsque :</p>

        <ul><li>une confrontation importante est déjà en cours ;</li><li>les PJ
        viennent de prendre une décision qui mérite d’être résolue immédiatement
        ;</li><li>le déplacement est volontairement traité par ellipse
        ;</li><li>une nouvelle rencontre casserait la tension d’une scène
        existante ;</li><li>le résultat n’apporterait rien d’autre que du
        remplissage.</li></ul>
      format: 1
