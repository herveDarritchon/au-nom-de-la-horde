  - name: La grotte momentanément vide
    type: text
    sort: 1900000
    text:
      content: >-
        <h2>La grotte momentanément vide</h2>

        <h3>En un regard</h3>

        <p>L’entrée de la Grotte des Échineurs est silencieuse. De nombreuses
        traces quittent les lieux, mais presque aucune n’y revient.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>La présence habituellement associée à la grotte s’est déplacée
        ailleurs.</p>

        <p>La raison de cette absence n’est pas définie par la rencontre.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur visible.</p>

        <h3>Tension</h3>

        <p>L’absence constitue une occasion rare d’examiner les abords de la
        grotte.</p>

        <p>Elle implique aussi que ce qui la fréquente se trouve actuellement
        quelque part ailleurs dans le territoire.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les traces sortantes sont nombreuses.</li><li>Leur ancienneté
        n’est pas identique.</li><li>Les Tranchecrins n’ont pas profité de
        l’absence pour occuper les lieux.</li><li>Certains débris près de
        l’entrée ont été déplacés récemment.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent explorer les abords, entrer, suivre les traces sortantes,
        surveiller la grotte ou simplement profiter de cette fenêtre pour
        traverser le secteur.</p>

        <h3>Évolution</h3>

        <p>L’absence n’est que temporaire.</p>

        <p>À un moment choisi par le MJ, la fréquentation normale de la grotte
        peut reprendre.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ peuvent obtenir leurs premiers renseignements concrets sur la
        manière dont la Grotte des Échineurs est utilisée sans que la nature
        exacte de ses occupants soit encore révélée.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
          entryId: grotte-vide
          sourceHash: 7e19f61e
