  - name: Ceux qui reviennent trop vite
    type: text
    sort: 1400000
    text:
      content: >-
        <h2>Ceux qui reviennent trop vite</h2>

        <h3>En un regard</h3>

        <p>Deux éclaireurs de la Horde sortent précipitamment d’un ravin en
        soutenant un troisième compagnon blessé.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Le groupe est allé plus loin qu’il ne le souhaitait et cherche
        maintenant à regagner Tranchecolline.</p>

        <p>Les éclaireurs ne possèdent pas une explication complète de ce qu’ils
        ont rencontré.</p>

        <h3>Acteurs</h3>

        <p><strong>Éclaireurs de la Horde — ramener leur compagnon vivant —
        tendus</strong></p>

        <p><strong>Blessé — atteindre un lieu sûr — épuisé</strong></p>

        <h3>Tension</h3>

        <p>Les éclaireurs veulent partir immédiatement.</p>

        <p>Prendre le temps de raconter ce qu’ils ont vu augmente selon eux le
        risque d’être rejoints.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Le blessé présente plusieurs types de blessures.</li><li>Les
        éclaireurs ne sont pas d’accord sur leur origine.</li><li>Leur carte
        sommaire comporte un passage absent de celle des PJ.</li><li>Ils
        abandonnent volontiers du matériel pour alléger leur
        compagnon.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent aider au transport, soigner, échanger rapidement des
        informations, escorter le groupe, reprendre sa piste ou simplement lui
        indiquer l’itinéraire le plus sûr.</p>

        <h3>Évolution</h3>

        <p>Sans aide, les éclaireurs continuent vers Tranchecolline en
        abandonnant une partie de leur équipement.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ peuvent obtenir une information imparfaite mais utile, un
        contact à Tranchecolline ou une indication sur un secteur encore
        inexploré.</p>
      format: 1
