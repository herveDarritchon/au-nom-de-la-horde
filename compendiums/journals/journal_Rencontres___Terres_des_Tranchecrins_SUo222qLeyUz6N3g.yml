  - name: La fumée basse
    type: text
    sort: 1100000
    text:
      content: >-
        <h2>La fumée basse</h2>

        <h3>En un regard</h3>

        <p>Une fumée épaisse reste emprisonnée au fond du Cratère. Des
        silhouettes apparaissent puis disparaissent derrière les rochers.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Un petit camp Tranchecrin utilise la protection naturelle du Cratère
        pour effectuer des tâches ordinaires à l’abri des regards
        extérieurs.</p>

        <p>La fumée rend leur activité difficile à observer depuis les
        hauteurs.</p>

        <h3>Acteurs</h3>

        <p><strong>Occupants du camp — poursuivre leurs activités sans être
        dérangés — relativement détendus</strong></p>

        <p><strong>Guetteur — surveiller les accès — attentif</strong></p>

        <h3>Tension</h3>

        <p>Les PJ disposent d’un excellent point d’observation mais risquent
        d’être repérés s’ils cherchent à mieux voir.</p>

        <p>La fumée masque également le nombre exact d’occupants.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les déplacements suivent une routine.</li><li>Tous les occupants
        ne portent pas d’armes en main.</li><li>Des arrivées et départs
        empruntent toujours la même portion du Cratère.</li><li>La fumée révèle
        la direction du vent dans la dépression.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Observer, contourner, mémoriser les accès, attendre un départ ou
        utiliser la fumée comme couverture sont des options naturelles.</p>

        <h3>Évolution</h3>

        <p>Le camp finit par réduire son activité puis plusieurs occupants
        quittent les lieux.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ peuvent apprendre les rythmes d’occupation du Cratère et
        cesser de le considérer comme un simple espace de combat.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
