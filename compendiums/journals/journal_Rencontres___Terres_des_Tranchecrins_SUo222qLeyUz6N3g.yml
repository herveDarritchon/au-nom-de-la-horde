  - name: La bête abandonnée
    type: text
    sort: 600000
    text:
      content: >-
        <h2>La bête abandonnée</h2>

        <h3>En un regard</h3>

        <p>Une bête de bât affolée tire sur une longe coincée entre deux blocs
        de roche. Elle porte encore plusieurs sacs et une partie de son
        harnachement est déchirée.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Son propriétaire a été séparé d’elle plus loin dans les ravins.</p>

        <p>La bête a fui jusqu’ici avant de se retrouver bloquée.</p>

        <h3>Acteurs</h3>

        <p><strong>Bête de bât — se libérer et fuir — paniquée</strong></p>

        <p><strong>Propriétaire absent — situation inconnue — laissé
        volontairement indéterminé</strong></p>

        <h3>Tension</h3>

        <p>Les mouvements et les cris de l’animal peuvent attirer
        l’attention.</p>

        <p>La cargaison peut également fournir des indices sur l’identité de son
        propriétaire sans expliquer ce qui lui est arrivé.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Une longe rompue traîne derrière elle.</li><li>Une partie du
        chargement manque.</li><li>Les traces remontent vers un autre
        ravin.</li><li>L’animal réagit fortement à certaines
        directions.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent calmer et libérer la bête, examiner les sacs, suivre ses
        traces, l’emmener avec eux ou poursuivre leur route.</p>

        <h3>Évolution</h3>

        <p>Si personne n’intervient, la longe finit par céder ou l’animal
        s’épuise sur place.</p>

        <h3>Retombées possibles</h3>

        <p>La rencontre peut fournir une piste vers un voyageur disparu, une
        ressource temporaire ou simplement un avertissement sur ce qui se passe
        plus loin.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
