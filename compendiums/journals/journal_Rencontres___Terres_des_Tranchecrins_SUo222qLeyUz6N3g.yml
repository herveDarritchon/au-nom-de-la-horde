  - name: Quelque chose revient
    type: text
    sort: 2000000
    text:
      content: >-
        <h2>Quelque chose revient</h2>

        <h3>En un regard</h3>

        <p>Alors que les PJ approchent de la Grotte des Échineurs, plusieurs
        pierres roulent sur le chemin derrière eux. Quelque chose suit le même
        itinéraire.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Une présence revient vers la grotte.</p>

        <p>La scène doit rester compatible avec la future définition des
        Échineurs : le MJ décrit d’abord les signes de son approche plutôt que
        sa nature.</p>

        <h3>Acteurs</h3>

        <p><strong>Présence revenant vers la grotte — rejoindre son refuge ou
        son territoire — comportement à préciser lorsque les Échineurs seront
        définis</strong></p>

        <h3>Tension</h3>

        <p>Les PJ se trouvent entre la grotte et ce qui s’en approche.</p>

        <p>Plus ils attendent, moins ils disposent d’espace pour quitter
        discrètement la zone.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Le rythme des pierres indique une progression
        régulière.</li><li>Le déplacement emprunte manifestement la Piste des
        Échineurs.</li><li>La présence ne semble pas se cacher.</li><li>Aucun
        Tranchecrin n’est visible dans les environs immédiats.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent entrer dans la grotte, quitter la piste, prendre de la
        hauteur, se dissimuler, attendre pour observer ou repartir avant d’être
        rejoints.</p>

        <h3>Évolution</h3>

        <p>La présence continue vers la grotte indépendamment des PJ.</p>

        <p>S’ils partent, ils peuvent n’en conserver que des indices. S’ils
        restent, cette rencontre peut devenir le premier contact direct avec les
        Échineurs lorsque leur nature aura été définie dans Warbound.</p>

        <h3>Retombées possibles</h3>

        <p>La scène permet de transformer progressivement les Échineurs d’un
        simple nom de carte en présence tangible, tout en conservant
        volontairement leur définition ouverte.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
