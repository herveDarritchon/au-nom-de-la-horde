  - name: La piste devenue silencieuse
    type: text
    sort: 900000
    text:
      content: >-
        <h2>La piste devenue silencieuse</h2>

        <h3>En un regard</h3>

        <p>Sur une portion de la Piste des Échineurs, les bruits ordinaires du
        terrain disparaissent presque totalement.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Quelque chose perturbe régulièrement la faune du secteur.</p>

        <p>La rencontre ne révèle volontairement pas s’il s’agit des Échineurs
        eux-mêmes, d’un autre prédateur ou simplement d’une conséquence de leurs
        passages.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur visible au début de la rencontre.</p>

        <h3>Tension</h3>

        <p>Le silence transforme un chemin praticable en espace
        d’incertitude.</p>

        <p>Les PJ peuvent continuer sans savoir ce qui rend cette portion
        différente du reste de la piste.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>De petites traces quittent la piste plutôt que de la
        traverser.</li><li>Les empreintes Tranchecrins récentes font un
        détour.</li><li>Plusieurs pierres ont été déplacées sur la
        pente.</li><li>Le silence cesse progressivement après une certaine
        distance.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent observer, attendre, contourner la portion, suivre les
        traces de fuite ou continuer normalement.</p>

        <h3>Évolution</h3>

        <p>Si rien ne se manifeste, le silence finit par redevenir un simple
        indice que les PJ pourront relier à d’autres observations
        ultérieures.</p>

        <h3>Retombées possibles</h3>

        <p>La rencontre construit progressivement l’identité de la Piste des
        Échineurs sans imposer immédiatement une explication.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
