  - name: Le guetteur dans la poussière
    type: text
    sort: 200000
    text:
      content: >-
        <h2>Le guetteur dans la poussière</h2>

        <h3>En un regard</h3>

        <p>Une silhouette apparaît une fraction de seconde sur une crête avant
        de disparaître. Peu après, un petit nuage de poussière s’élève bien plus
        loin.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Un éclaireur Tranchecrin vient d’apercevoir les PJ.</p>

        <p>Il ne cherche pas à les affronter. Il utilise les hauteurs et les
        ravins pour transmettre leur présence à d’autres occupants du
        territoire.</p>

        <h3>Acteurs</h3>

        <p><strong>Éclaireur Tranchecrin — prévenir les siens — prudent et
        mobile</strong></p>

        <h3>Tension</h3>

        <p>Les PJ ne savent pas encore s’ils ont véritablement été repérés.</p>

        <p>S’ils continuent sans modifier leur comportement, leur présence
        cessera bientôt d’être une surprise.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Aucun cri d’alarme.</li><li>La silhouette ne réapparaît jamais
        au même endroit.</li><li>Le nuage de poussière se déplace vers
        l’intérieur du territoire.</li><li>Plusieurs hauteurs offrent une ligne
        de vue les unes sur les autres.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent poursuivre le guetteur, accélérer, changer d’itinéraire,
        se dissimuler, rebrousser chemin ou simplement accepter que leur
        présence soit connue.</p>

        <p>Observer les déplacements peut également révéler une route utilisée
        par les Tranchecrins.</p>

        <h3>Évolution</h3>

        <p>L’éclaireur transmet l’information puis disparaît dans le réseau de
        ravins.</p>

        <p>Les rencontres suivantes peuvent être jouées avec des Tranchecrins
        davantage préparés à la présence d’intrus.</p>

        <h3>Retombées possibles</h3>

        <p>La scène peut révéler la logique de surveillance du territoire et
        apprendre aux PJ à considérer les crêtes comme faisant partie intégrante
        du réseau de circulation local.</p>
      format: 1
