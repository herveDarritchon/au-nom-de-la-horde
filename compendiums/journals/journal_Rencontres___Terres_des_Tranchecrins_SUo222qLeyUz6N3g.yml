  - name: Les marques sur la roche
    type: text
    sort: 1000000
    text:
      content: >-
        <h2>Les marques sur la roche</h2>

        <h3>En un regard</h3>

        <p>De profondes marques traversent plusieurs blocs rocheux avant de
        disparaître vers la Grotte des Échineurs.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Ces marques témoignent du passage régulier de quelque chose dans
        cette partie du territoire.</p>

        <p>Elles doivent rester compatibles avec la future définition des
        Échineurs et ne permettent donc pas d’identifier leur nature avec
        certitude.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur visible.</p>

        <h3>Tension</h3>

        <p>Les marques croisent un ancien passage Tranchecrin puis le font
        disparaître sous les pierres et la terre déplacées.</p>

        <p>Quelque chose a modifié la circulation habituelle.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Plusieurs marques sont anciennes.</li><li>D’autres sont
        nettement plus fraîches.</li><li>Les Tranchecrins semblent éviter la
        trajectoire.</li><li>Le chemin rejoint indirectement les abords de la
        Grotte.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent suivre les traces, comparer leur ancienneté, observer les
        réactions d’autres occupants du territoire ou mémoriser l’itinéraire
        sans l’explorer immédiatement.</p>

        <h3>Évolution</h3>

        <p>Les traces restent en place mais leur fraîcheur devient plus
        difficile à déterminer avec le temps.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ gagnent un indice tangible sur la fréquentation de la Grotte
        et sur l’influence des Échineurs dans la partie occidentale du
        territoire.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
