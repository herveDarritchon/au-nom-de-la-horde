  - name: L’air derrière la pierre
    type: text
    sort: 1800000
    text:
      content: >-
        <h2>L’air derrière la pierre</h2>

        <h3>En un regard</h3>

        <p>Dans le Tunnel des Tranchecrins, un courant d’air passe entre des
        pierres empilées contre une paroi.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>La paroi dissimule un ancien passage ou une connexion secondaire.</p>

        <p>Quelqu’un connaît son existence : plusieurs pierres ont été déplacées
        puis remises en place.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur visible.</p>

        <h3>Tension</h3>

        <p>Dégager le passage demande du temps et risque de produire du
        bruit.</p>

        <p>Le laisser intact préserve la discrétion mais signifie renoncer à une
        connexion potentiellement importante.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Le courant d’air est régulier.</li><li>Les pierres ne portent
        pas la même poussière que la paroi.</li><li>Certaines sont placées pour
        pouvoir être retirées facilement.</li><li>Une faible odeur différente
        provient de l’autre côté.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent ouvrir le passage, mémoriser sa position, surveiller son
        utilisation ou replacer les pierres après exploration.</p>

        <h3>Évolution</h3>

        <p>Si rien n’est fait, un utilisateur habituel peut finir par traverser
        le passage à un autre moment.</p>

        <h3>Retombées possibles</h3>

        <p>Cette rencontre peut révéler une nouvelle connexion dans le Tunnel et
        devenir un raccourci particulièrement précieux pour de futures
        incursions.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
          entryId: tunnel-secondaire
          sourceHash: c9c7dd02
