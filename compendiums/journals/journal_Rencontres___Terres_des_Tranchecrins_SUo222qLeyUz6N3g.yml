  - name: La gorge coupée
    type: text
    sort: 300000
    text:
      content: >-
        <h2>La gorge coupée</h2>

        <h3>En un regard</h3>

        <p>Une partie du sentier vient de glisser dans le ravin. Des pierres
        roulent encore tandis qu’une corniche plus élevée semble rejoindre
        l’autre côté.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Le terrain friable s’est effondré récemment. Rien n’indique que
        l’éboulement ait été provoqué volontairement.</p>

        <p>Le passage habituel est inutilisable sans effort, mais l’accident
        vient de révéler d’autres possibilités.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur intelligent n’est nécessaire à cette rencontre.</p>

        <h3>Tension</h3>

        <p>Revenir en arrière coûte du temps.</p>

        <p>Escalader expose les PJ sur les hauteurs.</p>

        <p>Descendre dans le ravin permet peut-être de contourner l’obstacle
        mais les fait quitter les passages connus.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>L’effondrement est encore frais.</li><li>Des traces anciennes
        apparaissent sur la corniche supérieure.</li><li>Le fond du ravin semble
        rejoindre un autre couloir rocheux.</li><li>Quelques pierres continuent
        de céder sous le poids.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent escalader, sécuriser un passage, descendre, chercher un
        détour ou marquer les lieux pour une future expédition.</p>

        <h3>Évolution</h3>

        <p>Sans intervention, le passage continue à se dégrader et devient
        progressivement impraticable.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ peuvent découvrir une connexion nouvelle entre deux secteurs
        ou identifier un passage utilisable lors de prochaines excursions.</p>
      format: 1
