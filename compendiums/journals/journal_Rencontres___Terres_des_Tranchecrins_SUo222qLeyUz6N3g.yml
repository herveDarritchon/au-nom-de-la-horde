  - name: Le passage révélé
    type: text
    sort: 1300000
    text:
      content: >-
        <h2>Le passage révélé</h2>

        <h3>En un regard</h3>

        <p>L’érosion a arraché une partie d’un talus et révélé une étroite
        corniche invisible depuis le chemin principal.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>La corniche existait déjà et certains habitués du secteur l’utilisent
        depuis longtemps.</p>

        <p>L’effondrement vient simplement de la rendre beaucoup plus facile à
        repérer.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur nécessaire.</p>

        <h3>Tension</h3>

        <p>Le passage promet un véritable raccourci mais il est étroit, exposé
        et rejoint une partie inconnue du réseau de ravins.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Plusieurs pierres portent des traces d’usure.</li><li>Des appuis
        ont manifestement été utilisés à plusieurs reprises.</li><li>La corniche
        contourne une portion particulièrement encaissée.</li><li>Une extrémité
        disparaît derrière une crête.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent l’explorer immédiatement, le marquer sur leur carte, le
        sécuriser ou simplement retenir son existence pour une prochaine
        excursion.</p>

        <h3>Évolution</h3>

        <p>L’érosion peut continuer à élargir l’accès ou au contraire provoquer
        un nouvel effondrement.</p>

        <h3>Retombées possibles</h3>

        <p>La découverte peut devenir un <strong>raccourci permanent du
        pointcrawl</strong> si les PJ prennent le temps de comprendre où il
        débouche.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
