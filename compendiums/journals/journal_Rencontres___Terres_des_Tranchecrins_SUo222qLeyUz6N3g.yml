  - name: Ceux qui descendent au cratère
    type: text
    sort: 400000
    text:
      content: >-
        <h2>Ceux qui descendent au cratère</h2>

        <h3>En un regard</h3>

        <p>Une file de Tranchecrins descend lentement vers le Cratère avec des
        charges de bois, de peaux et de fagots. Deux éclaireurs ferment la
        marche.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Le groupe transporte du matériel nécessaire à l’occupation du
        secteur.</p>

        <p>Cette rencontre montre que le Cratère n’est pas seulement un repaire
        de combattants : il faut l’approvisionner et l’entretenir.</p>

        <h3>Acteurs</h3>

        <p><strong>Porteurs Tranchecrins — acheminer leurs charges — fatigués et
        concentrés</strong></p>

        <p><strong>Éclaireurs — protéger le déplacement — méfiants</strong></p>

        <h3>Tension</h3>

        <p>Le groupe est vulnérable pendant la descente mais n’a aucun intérêt à
        abandonner son chargement pour poursuivre des intrus.</p>

        <p>Suivre les porteurs peut cependant conduire les PJ vers une zone plus
        fréquentée.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les charges sont utilitaires plutôt que
        militaires.</li><li>Certains porteurs connaissent parfaitement les
        appuis de la pente.</li><li>Les éclaireurs surveillent surtout les accès
        latéraux.</li><li>La piste disparaît presque totalement une fois le
        groupe engagé dans la descente.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Observer, suivre à distance, laisser passer, chercher l’origine du
        convoi ou profiter de son passage pour apprendre le meilleur chemin vers
        le Cratère sont autant d’options.</p>

        <h3>Évolution</h3>

        <p>Le groupe atteint le fond du Cratère puis se disperse.</p>

        <p>La trace qu’il laisse reste visible quelque temps.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ peuvent apprendre comment le Cratère est approvisionné,
        identifier une voie sûre vers son fond ou comprendre que l’occupation
        Tranchecrin du territoire est durable.</p>
      format: 1
