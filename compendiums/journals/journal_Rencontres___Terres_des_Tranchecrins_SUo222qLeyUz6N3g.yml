  - name: La cache ouverte
    type: text
    sort: 1600000
    text:
      content: >-
        <h2>La cache ouverte</h2>

        <h3>En un regard</h3>

        <p>Derrière plusieurs pierres déplacées se trouve une petite réserve
        vidée à la hâte. Quelques objets encombrants restent au sol.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>La cache servait de point de stockage temporaire à des occupants
        réguliers du secteur.</p>

        <p>Elle a été abandonnée récemment pour une raison inconnue.</p>

        <h3>Acteurs</h3>

        <p>Aucun acteur présent.</p>

        <h3>Tension</h3>

        <p>Une cache vide peut signifier un simple déplacement, une fuite ou la
        préparation d’une opération ailleurs.</p>

        <p>Les PJ disposent de peu de temps pour l’examiner avant que son
        propriétaire éventuel ne revienne.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Rien n’a été détruit volontairement.</li><li>Les objets laissés
        sont surtout encombrants.</li><li>Plusieurs traces quittent les lieux
        dans la même direction.</li><li>Une petite niche reste dissimulée
        derrière les pierres.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent examiner, prendre, déplacer ou laisser les objets, suivre
        les traces ou surveiller la cache pour voir qui revient.</p>

        <h3>Évolution</h3>

        <p>Les propriétaires peuvent revenir plus tard ou considérer la cache
        définitivement abandonnée selon les besoins de la campagne.</p>

        <h3>Retombées possibles</h3>

        <p>La rencontre peut fournir du matériel ordinaire, une piste de
        déplacement ou un emplacement utilisable comme cache par les PJ
        eux-mêmes.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
          entryId: cache-abandonnee
          sourceHash: 4994e01c
