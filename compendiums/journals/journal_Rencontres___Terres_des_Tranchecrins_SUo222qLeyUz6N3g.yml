  - name: Le verrou du tunnel
    type: text
    sort: 500000
    text:
      content: >-
        <h2>Le verrou du tunnel</h2>

        <h3>En un regard</h3>

        <p>Des bruits de pierres déplacées résonnent depuis l’entrée du Tunnel
        des Tranchecrins. Plusieurs silhouettes travaillent derrière une
        protection sommaire.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Un petit groupe consolide un point de contrôle dans le Tunnel.</p>

        <p>Les Tranchecrins exploitent son étroitesse pour surveiller le passage
        avec peu de monde.</p>

        <h3>Acteurs</h3>

        <p><strong>Gardes du tunnel — contrôler l’accès — vigilants</strong></p>

        <p><strong>Travailleurs — terminer les protections — occupés et peu
        désireux de se battre</strong></p>

        <h3>Tension</h3>

        <p>Passer maintenant signifie affronter un poste encore incomplet.</p>

        <p>Attendre peut rendre le passage beaucoup plus difficile à
        utiliser.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les défenses sont tournées vers l’entrée la plus
        accessible.</li><li>Une partie du tunnel reste hors de leur champ de
        vision.</li><li>Des pierres sont préparées pour obstruer rapidement le
        passage.</li><li>Les travailleurs réagissent aux ordres des
        gardes.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent observer, rebrousser chemin, tenter une diversion,
        chercher un autre accès, attendre le départ des travailleurs ou forcer
        le passage.</p>

        <h3>Évolution</h3>

        <p>Le poste devient plus solide au fil des heures.</p>

        <p>Plus tard, les Tranchecrins peuvent contrôler efficacement cette
        portion du Tunnel.</p>

        <h3>Retombées possibles</h3>

        <p>La rencontre peut modifier l’accessibilité d’une liaison du
        pointcrawl ou révéler l’importance stratégique du Tunnel.</p>

        <h3>Combat éventuel</h3>

        <p>Les gardes cherchent à <strong>tenir l’accès</strong>, pas à
        poursuivre les PJ à travers tout le territoire.</p>

        <p>Les travailleurs essaient d’obstruer le passage ou de se mettre à
        l’abri. Faire céder la position, créer une diversion ou forcer le
        passage peut suffire à terminer la confrontation.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
