  - name: La marque renversée
    type: text
    sort: 1200000
    text:
      content: >-
        <h2>La marque renversée</h2>

        <h3>En un regard</h3>

        <p>Une marque territoriale faite de bois, de pierres et d’éléments
        récupérés gît brisée au milieu du chemin. Des Tranchecrins approchent
        pour l’examiner.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>La marque a été détruite récemment, mais rien ne permet d’identifier
        immédiatement le responsable.</p>

        <p>Les Tranchecrins venus constater les dégâts pensent d’abord à une
        intrusion.</p>

        <h3>Acteurs</h3>

        <p><strong>Tranchecrins du secteur — comprendre ce qui s’est passé —
        soupçonneux</strong></p>

        <h3>Tension</h3>

        <p>Si les PJ sont découverts près de la marque, leur présence constitue
        une explication évidente, même s’ils n’ont rien fait.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les morceaux sont dispersés dans une direction
        précise.</li><li>Certaines cassures ressemblent davantage à un choc qu’à
        un sabotage méthodique.</li><li>Des traces différentes se superposent
        autour de la marque.</li><li>Les Tranchecrins examinent le sol avant de
        chercher des ennemis.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent s’éloigner, observer discrètement l’enquête, examiner
        eux-mêmes les traces, se montrer ou utiliser la confusion pour traverser
        le secteur.</p>

        <h3>Évolution</h3>

        <p>Les Tranchecrins finissent par reconstruire la marque et deviennent
        temporairement plus attentifs aux passages proches.</p>

        <h3>Retombées possibles</h3>

        <p>La scène peut créer un malentendu, révéler une frontière invisible
        aux PJ ou fournir des indices sur une autre présence ayant traversé le
        secteur.</p>
      format: 1
