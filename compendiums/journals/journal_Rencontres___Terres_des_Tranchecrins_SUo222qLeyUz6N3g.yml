  - name: Les ronces prennent feu
    type: text
    sort: 1500000
    text:
      content: >-
        <h2>Les ronces prennent feu</h2>

        <h3>En un regard</h3>

        <p>Une fumée âcre envahit le ravin tandis qu’un feu court rapidement
        dans les broussailles sèches. Des cris résonnent plus loin derrière le
        front de flammes.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Un incendie local s’est déclaré et le relief canalise la fumée comme
        les flammes.</p>

        <p>Des occupants du territoire se trouvent coupés de leur itinéraire
        habituel.</p>

        <h3>Acteurs</h3>

        <p><strong>Occupants pris au piège — trouver une sortie —
        paniqués</strong></p>

        <p><strong>Incendie — progresser avec le vent et le terrain</strong></p>

        <h3>Tension</h3>

        <p>Le danger ignore les frontières de faction.</p>

        <p>Certains passages vont devenir temporairement impraticables tandis
        que d’autres s’ouvrent lorsque les occupants fuient.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Le vent pousse le feu vers un passage encaissé.</li><li>Une zone
        rocheuse offre un refuge temporaire.</li><li>Des silhouettes cherchent
        également une issue de l’autre côté.</li><li>La fumée masque presque
        totalement les hauteurs.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent fuir, guider d’autres victimes, profiter de la confusion,
        créer une coupure dans les broussailles ou choisir un passage
        normalement trop surveillé.</p>

        <h3>Évolution</h3>

        <p>Le feu traverse le secteur puis s’épuise sur les zones rocheuses.</p>

        <p>Il laisse derrière lui un terrain noirci et temporairement beaucoup
        plus ouvert.</p>

        <h3>Retombées possibles</h3>

        <p>Des passages deviennent visibles, certaines caches peuvent être
        révélées et les déplacements locaux sont modifiés pendant quelque
        temps.</p>

        <h3>Combat éventuel</h3>

        <p>Un affrontement peut éclater si deux groupes paniqués tentent
        d’utiliser simultanément le même passage étroit.</p>

        <p>L’objectif n’est alors pas de tuer l’adversaire, mais de
        <strong>franchir la zone avant l’arrivée des flammes</strong>. La menace
        environnementale doit pousser tous les participants à rompre rapidement
        le combat.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: terres-tranchecrins-encounters
          entryId: feu-taillis
          sourceHash: 4bdd57b0
