  - name: Des pas au-dessus des pas
    type: text
    sort: 800000
    text:
      content: >-
        <h2>Des pas au-dessus des pas</h2>

        <h3>En un regard</h3>

        <p>Les PJ découvrent que des empreintes parallèles aux leurs suivent les
        crêtes depuis plusieurs centaines de mètres.</p>

        <h3>Ce qui se passe réellement</h3>

        <p>Quelqu’un accompagne leur déplacement sans descendre dans les
        ravins.</p>

        <p>L’identité du pisteur n’est pas immédiatement visible et n’a pas
        besoin d’être déterminée avant que les PJ décident de réagir.</p>

        <h3>Acteurs</h3>

        <p><strong>Pisteur invisible — conserver l’avantage de l’observation —
        prudent</strong></p>

        <h3>Tension</h3>

        <p>Le poursuivant connaît la position des PJ, tandis qu’eux ignorent la
        sienne.</p>

        <p>Quitter le fond du ravin permettrait de renverser cette asymétrie
        mais les exposerait davantage.</p>

        <h3>Ce qui peut attirer l’attention</h3>

        <ul><li>Les traces s’interrompent aux points offrant une bonne
        vue.</li><li>Elles évitent les zones découvertes.</li><li>Elles ne
        descendent jamais jusqu’au sentier principal.</li><li>Leur rythme
        correspond à celui des PJ.</li></ul>

        <h3>Leviers des PJ</h3>

        <p>Ils peuvent tendre une contre-observation, changer brutalement de
        direction, accélérer, s’arrêter, monter vers les crêtes ou ignorer la
        présence.</p>

        <h3>Évolution</h3>

        <p>Le pisteur finit par quitter les PJ lorsqu’il estime avoir obtenu ce
        qu’il cherchait ou lorsqu’il risque d’être découvert.</p>

        <h3>Retombées possibles</h3>

        <p>Les PJ peuvent repérer un réseau de chemins en hauteur et comprendre
        qu’une grande partie du territoire se surveille depuis les crêtes.</p>
      format: 1
