        <h1>PNJ — Thotar</h1>
            <p><strong>ID :</strong> PNJ-Z04-01-03 · <strong>POI :</strong> Z04-01 · <strong>Zone :</strong> Z04</p>
            <p><strong>Origine / statut :</strong> Personnage du cadre Tranchecolline / WoW Classic (rôle à confirmer)</p>
            <p><strong>Fonction :</strong> Chasseur initiant aux pistes de Durotar · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — chasseurs</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Retrouver une jeune pisteuse partie seule vers les pistes de l’ouest.</td></tr><tr><th>Motivation profonde</th><td>Il veut former des chasseurs capables de revenir vivants.</td></tr><tr><th>Obstacle</th><td>Ses obligations le retiennent au carrefour.</td></tr>
              <tr><th>Ligne rouge</th><td>Envoyer des novices dans une zone qu’il sait impraticable.</td></tr><tr><th>Peut offrir</th><td>Conseils de traque, repères de faune, indication d’un passage connu.</td></tr><tr><th>En échange</th><td>Un engagement à ménager la faune et à rapporter les observations.</td></tr>
              <tr><th>Attitude initiale</th><td>Exigeant, protecteur sans le montrer.</td></tr><tr><th>S'il n'arrive rien</th><td>Envoie une autre équipe et augmente les risques d’un malentendu.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Carquois réparé et chausses couvertes de poussière rouge.</p><p><strong>Voix et comportement :</strong> Ne parle qu’après avoir regardé les chaussures de l’autre.</p><p><strong>Signe émotionnel :</strong> Vérifie une flèche intacte lorsqu’il est inquiet pour ses apprentis.</p>
            <blockquote><p><strong>Première réplique :</strong> « Les traces ne vous doivent aucune réponse. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Pouvez-vous renoncer à poursuivre quand il le faut ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Le mouvement des bêtes a changé près du ravin.</td></tr><tr><th>Après échange, aide ou observation</th><td>Connaît une halte régulière mais pas sa sécurité actuelle.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ignore les auteurs des sabotages ; il refuse de confondre faune et ennemis.</td></tr><tr><th>Il demande</th><td>Un engagement à ménager la faune et à rapporter les observations.</td></tr>
              <tr><th>Il peut proposer</th><td>Conseils de traque, repères de faune, indication d’un passage connu.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Envoyer des novices dans une zone qu’il sait impraticable.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Transmet une technique narrative de lecture de traces, sans bonus automatique.</td></tr><tr><th>S'ils négocient</th><td>Consent à une reconnaissance conjointe si un jeune est protégé.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Laisse partir les PJ sans ses conseils.</td></tr><tr><th>S'ils l'ignorent</th><td>Envoie une autre équipe et augmente les risques d’un malentendu.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z04-01. <strong>Relations / autres lieux :</strong> Enclos de Thotar ; pas de règle de classe nouvelle.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z04/Z03 : meilleur renseignement sur les chemins et les chasseurs.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
