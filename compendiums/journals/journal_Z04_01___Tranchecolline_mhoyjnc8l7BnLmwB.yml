              <tr><th>S'ils l'aident</th><td>Éclaire un phénomène sans résoudre l’enquête seul.</td></tr><tr><th>S'ils négocient</th><td>Échange son expertise contre un échantillon exploitable.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Demande le départ des PJ s’ils menacent les apprentis.</td></tr><tr><th>S'ils l'ignorent</th><td>Poursuit ses analyses et publie une conclusion provisoire contestable.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
