    text:
      format: 1
      content: |-
        <h1>PNJ — Grosk</h1>
            <p><strong>ID :</strong> PNJ-Z04-01-01 · <strong>POI :</strong> Z04-01 · <strong>Zone :</strong> Z04</p>
            <p><strong>Origine / statut :</strong> Personnage établi dans les POI de Tranchecolline (Warbound)</p>
            <p><strong>Fonction :</strong> Aubergiste et observateur des retours · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — habitant de Tranchecolline</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Assurer une nuit tranquille malgré les nouvelles des routes.</td></tr><tr><th>Motivation profonde</th><td>Son auberge est le seul lieu où rivaux et travailleurs acceptent encore de parler.</td></tr><tr><th>Obstacle</th><td>Les visiteurs réclament des nouvelles qu’il ne peut vérifier.</td></tr>
              <tr><th>Ligne rouge</th><td>Livrer sans nécessité le nom d’un témoin vulnérable.</td></tr><tr><th>Peut offrir</th><td>Couvert, repos si lieu sûr, rumeur sourcée, rendez-vous discret.</td></tr><tr><th>En échange</th><td>Respect de ses clients et réparation des dégâts éventuels.</td></tr>
              <tr><th>Attitude initiale</th><td>Accueillant, se ferme en cas de menaces.</td></tr><tr><th>S'il n'arrive rien</th><td>Protège ses témoins ; les informations s’éloignent du hub.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Grand tablier avec brûlure sur une poche.</p><p><strong>Voix et comportement :</strong> Essuie toujours le même bol en écoutant.</p><p><strong>Signe émotionnel :</strong> Pose le bol sur la table au lieu de le continuer à lustrer.</p>
            <blockquote><p><strong>Première réplique :</strong> « Des lits, oui. Des mensonges gratuits, non. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Qui voulez-vous croire quand les témoins se contredisent ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des convois reviennent plus légers que prévu.</td></tr><tr><th>Après échange, aide ou observation</th><td>Peut mettre les PJ en présence d’un survivant ou d’un convoyeur.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ne connaît pas l’identité des saboteurs ; refuse de transformer les rumeurs en accusations.</td></tr><tr><th>Il demande</th><td>Respect de ses clients et réparation des dégâts éventuels.</td></tr>
              <tr><th>Il peut proposer</th><td>Couvert, repos si lieu sûr, rumeur sourcée, rendez-vous discret.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Livrer sans nécessité le nom d’un témoin vulnérable.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Présente un contact sans demander un jet pour un indice essentiel.</td></tr><tr><th>S'ils négocient</th><td>Accepte de réserver une table discrète contre un service rendu.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Refuse l’accès à l’auberge aux fauteurs de troubles.</td></tr><tr><th>S'ils l'ignorent</th><td>Protège ses témoins ; les informations s’éloignent du hub.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z04-01. <strong>Relations / autres lieux :</strong> Auberge de Grosk, sous-POI de Tranchecolline.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z04-01 : auberge refuge, relations durables et changement des rumeurs.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
