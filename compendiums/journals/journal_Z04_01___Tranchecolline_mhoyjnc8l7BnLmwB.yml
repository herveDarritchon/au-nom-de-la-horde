        <h1>PNJ — Swart</h1>
            <p><strong>ID :</strong> PNJ-Z04-01-02 · <strong>POI :</strong> Z04-01 · <strong>Zone :</strong> Z04</p>
            <p><strong>Origine / statut :</strong> Personnage établi dans les POI de Tranchecolline (Warbound)</p>
            <p><strong>Fonction :</strong> Praticien animant un cercle d’étude et d’échanges · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — cercle local (fonction Warbound à préciser)</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Comprendre pourquoi plusieurs témoignages décrivent les mêmes symptômes chez les blessés.</td></tr><tr><th>Motivation profonde</th><td>Il cherche une méthode fiable face à des croyances contradictoires.</td></tr><tr><th>Obstacle</th><td>Ses moyens sont limités ; il dépend de composants de Sen’jin.</td></tr>
              <tr><th>Ligne rouge</th><td>Prétendre maîtriser une magie dont il ignore les effets.</td></tr><tr><th>Peut offrir</th><td>Lecture d’un indice étrange, contact de spécialiste, conseil rituel prudent.</td></tr><tr><th>En échange</th><td>Échantillon ou témoignage précis, jamais une simple impression.</td></tr>
              <tr><th>Attitude initiale</th><td>Curieux, irrité par la certitude non fondée.</td></tr><tr><th>S'il n'arrive rien</th><td>Poursuit ses analyses et publie une conclusion provisoire contestable.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Craie dans les plis des doigts, cordelettes de notes.</p><p><strong>Voix et comportement :</strong> Parle en hypothèses et corrige ses termes.</p><p><strong>Signe émotionnel :</strong> Efface frénétiquement un symbole dès qu’une hypothèse s’effondre.</p>
            <blockquote><p><strong>Première réplique :</strong> « Une trace n’est pas une preuve, mais c’est un excellent début. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Quelle conclusion changeriez-vous si ce signe était faux ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Plusieurs blessés décrivent une intoxication semblable.</td></tr><tr><th>Après échange, aide ou observation</th><td>Peut comparer un symbole ou une substance à un cas antérieur.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ignore la vérité du projet sous Orgrimmar ; ses hypothèses peuvent être incomplètes.</td></tr><tr><th>Il demande</th><td>Échantillon ou témoignage précis, jamais une simple impression.</td></tr>
              <tr><th>Il peut proposer</th><td>Lecture d’un indice étrange, contact de spécialiste, conseil rituel prudent.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Prétendre maîtriser une magie dont il ignore les effets.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
