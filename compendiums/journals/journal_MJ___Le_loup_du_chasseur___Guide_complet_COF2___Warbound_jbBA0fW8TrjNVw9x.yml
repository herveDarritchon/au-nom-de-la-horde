  - name: 01 · Profil de référence et formules
    type: text
    sort: 200000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Profil mécanique du loup</h1><p><strong>[COF2, rang
        1]</strong> Le loup possède des statistiques propres, qui évoluent avec
        deux paramètres distincts : le <em>niveau du chasseur</em> pour ses PV,
        et le <em>rang de la Voie du compagnon animal</em> pour sa DEF.
        L’attaque au contact reprend exceptionnellement la valeur d’attaque
        magique du rôdeur.</p><table><thead><tr><th>Statistique</th><th>Valeur /
        traitement</th></tr></thead><tbody><tr><td>AGI ; CON ; FOR</td><td>+1 ;
        +1 avec dé bonus aux tests ; +2</td></tr><tr><td>PER ; CHA ; INT ;
        VOL</td><td>+2 avec dé bonus aux tests ; −2 ; −3 ;
        +2</td></tr><tr><td>DEF au rang 1–3</td><td>12 + rang dans la voie (13,
        14, 15) ; voir exception du rang 4</td></tr><tr><td>PV avant rang
        4</td><td>niveau du chasseur × 4 ; pas le rang de la voie ×
        4</td></tr><tr><td>Attaque magique du chasseur</td><td>règle générale :
        niveau + VOL (et modificateurs éventuels) ; reprendre en pratique la
        valeur indiquée sur sa fiche</td></tr><tr><td>Initiative</td><td>même
        valeur d’initiative que le chasseur ; actions simultanées décrites par
        la voie</td></tr><tr><td>Attaque</td><td>au contact ; bonus du jet =
        valeur d’attaque <strong>magique</strong> du chasseur, non la FOR du
        loup</td></tr><tr><td>DM de base</td><td>1d4 + 2, physiques (morsure),
        sauf effet particulier explicite</td></tr><tr><td>Tests du
        loup</td><td>utiliser les caractéristiques du profil ; dé bonus sur ses
        propres tests de CON et PER.</td></tr></tbody></table><h2>Calculs
        fréquents</h2><ul><li>Chasseur niv. 1 / rang 1 : <strong>DEF 13 ; PV
        4</strong>.</li><li>Chasseur niv. 3 / rang 2 : <strong>DEF 14 ; PV
        12</strong>.</li><li>Chasseur niv. 5 / rang 3 : <strong>DEF 15 ; PV
        20</strong>.</li><li>Chasseur niv. 6 / rang 1 : <strong>DEF 13 ; PV
        24</strong> ; le niveau ne fait pas monter la DEF
        automatiquement.</li></ul><h2>Important : le d4° est
        évolutif</h2><p><strong>[COF2, p. 43]</strong> Un d4° devient d6 au
        niveau 6, d8 au niveau 9, d10 au niveau 12 et d12 au niveau 15. Il
        <strong>n’explose pas sur un 4</strong> : le symbole ° indique une
        progression avec le niveau. Cela concerne les DM du loup alpha et le
        bonus du rang 5, mais pas les 1d4 ordinaires du rang 1.</p><h2>Ne pas
        confondre les attaques</h2><p>La morsure est bien une <em>attaque au
        contact</em> même si son bonus est celui de l’attaque magique du
        chasseur. Elle n’est pas un sort, ne gagne pas automatiquement les
        propriétés d’une attaque magique et n’utilise pas le score de FOR du
        loup pour toucher. La DEF de la cible reste la difficulté habituelle du
        test d’attaque.</p><p><small><strong>Sources COF2 :</strong> Laurent
        Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions
        (2024), p. 43, 71–72 et 212–213. Le détail ci-dessus est reformulé ; les
        éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
