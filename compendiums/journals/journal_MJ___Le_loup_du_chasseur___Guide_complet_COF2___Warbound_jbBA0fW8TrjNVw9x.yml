  - name: 02 · Rang 1 — Le loup
    type: text
    sort: 300000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Rang 1 : Le loup</h1><p><strong>[COF2]</strong> Dès
        l’acquisition de ce rang, le rôdeur reçoit un loup, qui attaque en même
        temps que lui en combat. Il sait répondre à des ordres élémentaires
        (rester, garder, apporter, attaquer). Il ne faut donc pas attendre une
        spécialisation ultérieure pour qu’il puisse mordre un
        adversaire.</p><h2>Ce qui fonctionne</h2><ul><li>Loup présent
        physiquement dans la fiction, capable d’accompagner, se défendre et
        obéir à des consignes simples.</li><li>En combat, jet de morsure
        distinct quand il peut atteindre un adversaire au corps à corps :
        <strong>d20 + attaque magique du chasseur</strong> contre sa DEF ;
        succès : <strong>1d4 + 2 DM</strong>.</li><li>Loup et chasseur
        interviennent à la <strong>même initiative</strong>, tout en occupant
        des emplacements séparés.</li><li>Le chasseur ne perd pas
        automatiquement sa propre attaque pour permettre celle de son loup :
        aucune règle de la voie n’impose cet échange.</li></ul><h2>Limites
        immédiates</h2><ul><li>Aucune attaque à distance, aucun bonus de groupe,
        aucun « ordre spécial » de WoW, aucune provocation
        automatique.</li><li>Le loup ne franchit pas les obstacles et ne touche
        pas des adversaires hors d’atteinte sous prétexte qu’il attaque avec son
        maître.</li><li>Ne pas présumer d’une compréhension tactique élaborée,
        du langage humain/orc ou d’une télépathie avant le rang
        3.</li></ul><h2>Exemple</h2><p>La chasseuse désigne un pillard sur la
        route. Elle tire à l’arc ; son loup, déjà au contact du pillard, tente
        une morsure. Deux jets séparés. Si le pillard est à 20 m et que le loup
        n’est pas en position de l’atteindre, aucune morsure « à distance »
        n’est accordée.</p><h2>Silence des
        règles</h2><p><strong>[OUVERT]</strong> Le coût exact d’un ordre oral et
        l’articulation du déplacement du loup avec les actions du chasseur ne
        sont pas détaillés dans cette voie. Voir les arbitrages page
        14.</p><p><small><strong>Sources COF2 :</strong> Laurent Bernasconi,
        <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions (2024), p.
        71 ; p. 210–212. Le détail ci-dessus est reformulé ; les éventuels
        arbitrages Warbound sont explicitement identifiés.</small></p></section>
