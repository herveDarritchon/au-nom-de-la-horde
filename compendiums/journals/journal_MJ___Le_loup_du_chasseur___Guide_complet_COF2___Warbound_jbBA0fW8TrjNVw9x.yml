  - name: 05 · Rang 4 — Loup alpha
    type: text
    sort: 600000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Rang 4 : Loup alpha</h1><p><strong>[COF2, livre PDF fourni,
        p. 72]</strong> Le loup reçoit un profil « mâle alpha ». Les valeurs
        ci-dessous sont celles de <strong>l’ouvrage fourni</strong> ; elles
        diffèrent du DRS en ligne sur la DEF et les PV. Pour Warbound, cette
        version du livre fait référence tant qu’aucun erratum n’a été
        validé.</p><table><thead><tr><th>Statistique</th><th>Rang 4 et
        suite</th></tr></thead><tbody><tr><td>CON</td><td>+3 avec dé bonus aux
        tests (remplace +1*)</td></tr><tr><td>FOR</td><td>+5 (remplace
        +2)</td></tr><tr><td>DEF</td><td><strong>18</strong> dans le livre
        fourni ; bonus du rang 5 éventuel à ajouter ensuite</td></tr><tr><td>PV
        maximum</td><td><strong>niveau du chasseur × 5</strong> (remplace
        ×4)</td></tr><tr><td>DM morsure</td><td><strong>1d4° + 5</strong>
        (remplace 1d4+2)</td></tr><tr><td>Attaque au contact</td><td>reste égale
        à la valeur d’attaque magique du chasseur</td></tr><tr><td>AGI, PER,
        CHA, INT, VOL</td><td>restent les valeurs du profil de base si non
        remplacées</td></tr><tr><td>Initiative</td><td>reste identique à celle
        du chasseur</td></tr></tbody></table><h2>Évolution des dés</h2><p>Le
        1d4° de la morsure alpha suit le niveau du chasseur : 1d4° aux niveaux
        1–5, 1d6 au niveau 6, 1d8 au niveau 9, 1d10 au niveau 12, 1d12 au niveau
        15. Les points de vie dépendent du niveau du chasseur, pas du niveau de
        créature.</p><h2>Exemple</h2><p>Chasseur niveau 6 et rang 4 :
        <strong>DEF 18 ; PV 30 ; morsure 1d6 + 5</strong>, bonus d’attaque égal
        à l’attaque magique du PJ. Si le loup avait subi des blessures avant de
        monter de rang, l’ajustement de ses PV <em>actuels</em> lors du
        changement de maximum n’est pas réglé explicitement : noter le choix
        MJ.</p><h2>Divergence documentaire</h2><p><strong>[IMPORTANT]</strong>
        Le DRS accessible sur <a
        href="https://drs.chroniques-oubliees.fr/fantasy/profils/rodeur">drs.chroniques-oubliees.fr/fantasy/profils/rodeur</a>
        affiche le profil alpha avec DEF « 12 + rang » et PV « niveau × 4 ». Il
        ne faut pas combiner silencieusement ces formules avec celles du livre.
        Voir page 14 pour le suivi de version.</p><p><small><strong>Sources COF2
        :</strong> Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>,
        Black Book Éditions (2024), p. 72 et p. 43 ; DRS, consultation du 7
        novembre 2026. Le détail ci-dessus est reformulé ; les éventuels
        arbitrages Warbound sont explicitement identifiés.</small></p></section>
