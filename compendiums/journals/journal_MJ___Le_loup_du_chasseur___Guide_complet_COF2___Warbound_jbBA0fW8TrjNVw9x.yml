  - name: 04 · Rang 3 — Lien empathique
    type: text
    sort: 500000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Rang 3 : Lien empathique (L)</h1><p><strong>[COF2]</strong>
        Le chasseur peut communiquer par télépathie avec son loup et le soigner
        à distance en transférant ses propres PV : <strong>1 PV du chasseur
        dépensé = 1 PV rendu au loup</strong>, sans limite de quantité indiquée,
        au prix d’une <strong>action limitée
        (L)</strong>.</p><h2>Communiquer</h2><ul><li>La télépathie permet un
        échange avec son compagnon ; elle ne dit pas que le chasseur voit par
        ses yeux, entend par ses oreilles ou connaît automatiquement son
        emplacement.</li><li>Le loup reste un animal : la communication ne le
        transforme pas en éclaireur humain, en interprète ni en tacticien
        parfait.</li><li><strong>[OUVERT]</strong> Le livre ne fixe pas
        explicitement portée, nécessité de visibilité ni sophistication des
        images/concepts échangés ; éviter de les inventer en tant que règles
        officielles.</li></ul><h2>Soigner, étape par étape</h2><ol><li>Vérifier
        que le loup a perdu des PV et que le chasseur possède des PV
        disponibles.</li><li>Le chasseur consacre son action limitée (L) au
        pouvoir.</li><li>Il choisit combien de ses propres PV il sacrifie ; le
        loup récupère autant de PV, sans dépasser son maximum.</li><li>Suivre
        séparément les nouveaux PV du chasseur et du loup. Au rang 5, le
        rendement double.</li></ol><h2>Exemple</h2><p>Chasseur à 16/24 PV, loup
        à 7/20 PV : le chasseur cède 5 PV et passe à 11/24 ; le loup monte à
        12/20 PV. Il ne s’agit ni d’une guérison gratuite ni d’une récupération
        de DR.</p><h2>Nuances de résolution</h2><p><strong>[OUVERT]</strong> Le
        coût (L) est explicitement associé au soin ; le texte ne détaille pas si
        un simple échange télépathique consomme également une action. Pour une
        lecture pratique, laisser la communication brève dans la fiction et
        réserver l’action limitée au soin ; ceci reste à valider. Le plafond
        concret du transfert lorsque le chasseur descendrait à 0 PV n’est pas
        précisé : l’arbitrage prudent est d’éviter un sacrifice létal
        automatique, sauf décision explicite du MJ.</p><p><small><strong>Sources
        COF2 :</strong> Laurent Bernasconi, <em>Chroniques Oubliées Fantasy
        2</em>, Black Book Éditions (2024), p. 71–72 ; p. 210–211. Le détail
        ci-dessus est reformulé ; les éventuels arbitrages Warbound sont
        explicitement identifiés.</small></p></section>
