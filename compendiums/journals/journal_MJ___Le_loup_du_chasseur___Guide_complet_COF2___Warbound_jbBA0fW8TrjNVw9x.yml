  - name: 11 · Soins, 0 PV, mort et remplacement
    type: text
    sort: 1200000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>La survie du compagnon</h1><h2>Soins ordinaires
        [COF2]</h2><p>Le loup peut recevoir des soins magiques. Selon le
        paragraphe consacré au rôdeur, une <strong>récupération
        complète</strong> lui rend <strong>tous ses PV</strong>. La récupération
        complète est une période de 8 heures dans de bonnes conditions, sous
        réserve de l’arbitrage général du repos (COF2 p. 221). Ne pas lui
        imposer d’utiliser les dés de récupération d’un PJ pour contredire ce
        paragraphe spécifique.</p><h2>À 0 PV : trois
        situations</h2><table><thead><tr><th>Situation</th><th>Règle à
        appliquer</th></tr></thead><tbody><tr><td>Milieu naturel et possibilité
        de fuite</td><td>Le loup fuit et revient <strong>8 heures plus tard avec
        tous ses PV</strong>.</td></tr><tr><td>Fuite impossible : en cage,
        coincé ou autre</td><td>Le loup doit être <strong>soigné comme un
        personnage</strong> : utiliser les règles pertinentes de
        stabilisation/soins, sans déclarer un retour
        automatique.</td></tr><tr><td>Mort réelle retenue par la fiction et le
        MJ</td><td>Le chasseur peut obtenir un nouveau compagnon à son
        <strong>prochain passage de niveau</strong> ; le moment et la scène se
        définissent d’un commun accord.</td></tr></tbody></table><h2>Questions à
        prévoir</h2><ul><li>Le loup a-t-il pu physiquement s’enfuir avant d’être
        encerclé, immobilisé ou jeté dans une fosse ?</li><li>Le soin magique
        peut-il être administré à un loup impossible à évacuer ?</li><li>Le
        compagnon a-t-il été tué dans une situation où la fuite fictionnelle est
        réellement exclue ?</li><li>Quand le joueur pourra-t-il retrouver un
        compagnon après une perte permanente ?</li><li>Le nouveau loup
        reprend-il immédiatement le profil lié au rang de voie ? Le texte
        indique retrouver un compagnon au niveau suivant, mais pas un rituel
        long ni une pénalité de rang : ne pas en inventer.</li></ul><h2>Premiers
        soins lorsque la fuite est impossible [application de la règle
        PJ]</h2><p>COF2 p. 220 indique pour un personnage à 0 PV un test d’INT
        (Médecine) difficulté 10 : réussite = réveil au bout d’une minute avec
        1d4° PV ; échec = réveil après 30 minutes avec 1 PV. La difficulté
        augmente de +5 si le dernier coup était critique et de +5 si la cible
        est à 0 DR. <strong>[OUVERT]</strong> Le loup n’a pas de réserve de DR
        donnée par son profil ; appliquer la procédure de soins lorsqu’il ne
        peut fuir, sans lui inventer automatiquement des dés de récupération.
        Lorsque la valeur de DR importe au test, le MJ doit fixer un arbitrage
        compatible avec le statut de compagnon.</p><h2>Méfiance sur le transfert
        de PV</h2><p>Rang 3 : un soin à distance coûte des PV au chasseur ; rang
        5 : 1 PV dépensé soigne 2 PV. On ne peut pas dépasser les PV maximum du
        loup. Le texte ne fournit pas explicitement de limitation « une fois par
        repos » pour ce soin ; lui en ajouter serait une règle
        maison.</p><p><small><strong>Sources COF2 :</strong> Laurent Bernasconi,
        <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions (2024), p.
        71–72 ; règles d’inconscience et de récupération p. 220–222. Le détail
        ci-dessus est reformulé ; les éventuels arbitrages Warbound sont
        explicitement identifiés.</small></p></section>
