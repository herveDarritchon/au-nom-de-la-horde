  - name: 09 · Perception, discrétion et exploration
    type: text
    sort: 1000000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Loup éclaireur : ce qu’il peut vraiment faire</h1><p>Le
        loup dispose de <strong>PER +2 avec dé bonus à ses tests de
        PER</strong>, et d’<strong>INT −3</strong>. Sa physiologie et son
        comportement lui permettent de flairer, entendre, surveiller, suivre une
        odeur ou réagir à un danger. Les règles ne lui accordent ni lecture, ni
        cartographie, ni identification des pièges complexes, ni capacité à
        rapporter une description détaillée avant le rang 3.</p><h2>Déterminer
        le résultat</h2><ol><li>Demander au joueur une <strong>intention
        claire</strong> (« flairer une piste », « rester à l’entrée », « alerter
        si quelqu’un arrive »).</li><li>Vérifier que l’ordre reste simple et que
        l’environnement rend l’action possible (vent, odeurs concurrentes,
        bruit, relief, distance).</li><li>N’appeler un test de PER, AGI, CON ou
        autre que s’il existe un enjeu et une incertitude. Utiliser la valeur
        propre au loup et son dé bonus de PER/CON si applicable.</li><li>Décrire
        ce que le <em>loup</em> perçoit et comment il peut le manifester :
        attitude, grondement, arrêt brusque, retour vers le
        groupe.</li><li>Avant la télépathie, le maître déduit une information de
        ce comportement ; il ne reçoit pas un compte rendu
        verbal.</li></ol><h2>Ce qu’il ne faut pas accorder
        gratuitement</h2><ul><li>Repérage automatique d’une embuscade, d’un
        piège sans odeur ou d’une cible invisible.</li><li>Télépathie, vision
        partagée, reconnaissance cartographique et ordres conditionnels
        complexes avant les capacités adaptées.</li><li>Bonus chiffré
        automatique au PJ sur chaque test de survie ou de vigilance. Le rang 2
        définit déjà les bonus précis autorisés.</li></ul><h2>Exemple — le
        chemin sous les collines de Durotar</h2><p>Un pisteur demande au loup de
        flairer l’odeur d’un convoi passé quelques heures plus tôt. Le MJ peut
        solliciter PER du loup, avec dé bonus de son profil. Sur une réussite,
        il suit un sillage ; le joueur observe la direction qu’il prend. La
        nature exacte des personnes transportées ou le contenu des caisses ne se
        déduisent pas automatiquement de ce
        résultat.</p><p><small><strong>Sources COF2 :</strong> Laurent
        Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions
        (2024), p. 71 ; système des tests p. 198–202 ; perception/surprise p.
        208–209. Le détail ci-dessus est reformulé ; les éventuels arbitrages
        Warbound sont explicitement identifiés.</small></p></section>
