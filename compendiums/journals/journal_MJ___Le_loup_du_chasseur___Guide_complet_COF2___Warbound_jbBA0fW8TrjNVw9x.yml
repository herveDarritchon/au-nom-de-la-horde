  - name: 14 · Registre d’arbitrage Warbound
    type: text
    sort: 1500000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Décisions ouvertes à verrouiller</h1><p>Les propositions de
        cette page sont des <strong>arbitrages candidats</strong>, pas des
        règles officielles ni des décisions déjà validées. Elles évitent le
        blocage de la séance tout en réservant les vrais pouvoirs évolués à la
        spécialisation.</p><table><thead><tr><th>Point
        ouvert</th><th>Proposition minimale — NON
        VALIDÉE</th></tr></thead><tbody><tr><td>Coût d’un ordre
        simple</td><td>Quelques mots en action gratuite si le chasseur peut
        parler ; ordre nouveau élaboré peut demander plus selon la
        scène.</td></tr><tr><td>Nombre de morsures</td><td>Une morsure au
        maximum par activation normale du duo ; « Tir rapide » n’en donne pas
        automatiquement deux.</td></tr><tr><td>Chasseur sans
        attaque</td><td>Éviter une morsure automatique quand il consacre tout
        son tour à une action limitée ; permettre garde / déplacement
        crédible.</td></tr><tr><td>Mouvement du loup</td><td>Utiliser
        provisoirement la règle usuelle de M = 10 m, distincte du mouvement du
        chasseur ; terrain difficile 5 m.</td></tr><tr><td>Rang 2, « au contact
        »</td><td>En mêlée, deux partenaires engagés sur la même cible ; hors
        combat, proximité immédiate du duo.</td></tr><tr><td>Télépathie,
        portée</td><td>Au sein d’une même scène et d’un lien encore plausible ;
        pas d’interconnexion sans borne spatiale
        démontrée.</td></tr><tr><td>Télépathie, action</td><td>Échange bref sans
        action limitée ; le transfert de PV, lui, utilise explicitement
        (L).</td></tr><tr><td>Autonomie du loup hors vue</td><td>Exécuter une
        consigne simple puis se fier à son instinct ; aucune reconnaissance
        tactique détaillée.</td></tr><tr><td>PV du chasseur
        sacrificiel</td><td>Éviter de réduire volontairement le chasseur à 0 PV
        via le soin si cela n’a pas été explicitement
        convenu.</td></tr><tr><td>Rang 4, source de chiffres</td><td>Conserver
        DEF 18 et PV 5 × niveau selon livre officiel fourni ; documenter l’écart
        avec le DRS.</td></tr><tr><td>Mise à niveau des PV actuels</td><td>Après
        acquisition du rang 4, augmenter PV max ; décider si PV actuels
        progressent du même différentiel ou non.</td></tr><tr><td>Compagnon tué
        ou perdu en milieu urbain</td><td>Ne pas appliquer le retour 8 h par
        défaut hors nature ; suivre soin, danger réel et remplacement au niveau
        suivant.</td></tr></tbody></table><h2>Priorité de
        validation</h2><p><strong>P0 :</strong> coût des ordres, attaque quand
        chasseur n’attaque pas, nombre de morsures, déplacement, définition du
        contact. <strong>P1 :</strong> portée télépathique, passage de PV rang
        4, visibilité/perte de piste. <strong>P2 :</strong> habitudes urbaines
        et comportements spécifiques au loup.</p><p><small><strong>Sources COF2
        :</strong> Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>,
        Black Book Éditions (2024), p. 71–72 ; 210–216. Le détail ci-dessus est
        reformulé ; les éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
