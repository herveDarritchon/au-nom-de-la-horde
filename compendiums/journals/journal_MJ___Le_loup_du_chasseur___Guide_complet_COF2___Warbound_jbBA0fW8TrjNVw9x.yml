  - name: '12 · Scènes commentées : neuf cas de table'
    type: text
    sort: 1300000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Cas pratiques commentés</h1><ol><li><strong>Le chasseur
        tire dans un combat où son loup est déjà engagé.</strong> Loup : morsure
        au contact selon rang 1 ; chasseur : tir séparé avec malus éventuel de
        cible en mêlée (p. 214).</li><li><strong>Le loup doit atteindre un
        ennemi situé derrière une porte fermée.</strong> Il ne mord pas à
        travers la porte ; résoudre obstacle et déplacement
        d’abord.</li><li><strong>Le loup renifle une piste après le passage de
        soldats de Tiragarde.</strong> Test de PER possible avec dé bonus ; pas
        de bonus de piste du rang 2 au chasseur si le duo n’en remplit pas la
        condition.</li><li><strong>Le joueur dit « attaque celui qui criera
        ».</strong> Instruction conditionnelle complexe ; pas garantie comme
        ordre simple. MJ peut demander de reformuler ou appliquer un
        entraînement fictionnel.</li><li><strong>Le chasseur dépense tout son
        tour en soin limité (L).</strong> Le comportement offensif du loup n’est
        pas complètement réglé par la voie ; appliquer l’arbitrage retenu, sans
        créer une attaque libre garantie.</li><li><strong>Rang 3 : loup blessé
        au-delà d’un canyon.</strong> Télépathie autorisée, soin à distance
        selon sa capacité ; portée exacte non fixée, convenir d’une limite de
        scène plutôt que prétendre que la distance est
        infinie.</li><li><strong>Rang 4, niveau 6 : passage alpha.</strong> DEF
        18, PV max 30, morsure 1d6 + 5 ; ne pas appliquer par erreur « 12 + rang
        » du DRS.</li><li><strong>Rang 5 : chasseur et loup attaquent la même
        cible.</strong> Une morsure et son bonus de +1d4° DM, pas deux morsures.
        Leur DEF bénéficie du rang 5.</li><li><strong>Le loup atteint 0 PV en
        plaine mais est immobilisé au fond d’une fosse.</strong> La fuite
        naturelle paraît impossible ; appliquer le soin comme à un personnage au
        lieu d’imposer un retour après 8 heures.</li></ol><h2>Comment annoncer
        les arbitrages au groupe</h2><blockquote><p>« Le livre vous donne ces
        effets précis. La manière de combiner les déplacements et les ordres
        n’est pas complètement définie. Voici la convention provisoire que nous
        appliquons de façon identique pour tout le monde. Nous la modifierons si
        elle crée un déséquilibre. »</p></blockquote><p><small><strong>Sources
        COF2 :</strong> Laurent Bernasconi, <em>Chroniques Oubliées Fantasy
        2</em>, Black Book Éditions (2024), p. 71–72, 210–216, 221. Le détail
        ci-dessus est reformulé ; les éventuels arbitrages Warbound sont
        explicitement identifiés.</small></p></section>
