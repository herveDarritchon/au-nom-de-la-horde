  - name: 06 · Rang 5 — Tactiques de meute
    type: text
    sort: 700000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Rang 5 : Tactiques de meute</h1><p><strong>[COF2]</strong>
        Trois bénéfices distincts sont acquis : dégâts coordonnés, efficacité
        des soins empathiques et bonus progressif de DEF du
        duo.</p><ol><li><strong>Attaque sur la même cible :</strong> si le loup
        attaque la même cible que le chasseur, <strong>+1d4° DM</strong> sur
        l’attaque du loup. Cela n’ajoute pas une seconde morsure : c’est un
        bonus de dommages à la morsure qui touche.</li><li><strong>Soin
        empathique amélioré :</strong> chaque PV sacrifié par le chasseur permet
        au loup de récupérer <strong>2 PV</strong> (dans la limite du maximum du
        loup) ; le soin reste une action limitée (L) par le pouvoir du rang
        3.</li><li><strong>DEF de meute :</strong> le chasseur <em>et</em> le
        loup gagnent <strong>+1 DEF</strong> chaque fois que le personnage
        obtient le rang 5 dans une voie de rôdeur, y compris dans la Voie du
        compagnon animal. Le bonus s’étend si d’autres voies de rôdeur
        atteignent ce seuil.</li></ol><h2>Exemples</h2><ul><li>Au rang 5, avec
        une seule voie de rôdeur de rang 5 : DEF du loup alpha = <strong>18 + 1
        = 19</strong>. La DEF personnelle du chasseur augmente aussi de
        +1.</li><li>Chasseur niveau 9 / rang 5 : morsure alpha <strong>1d8 +
        5</strong>, puis <strong>+1d8</strong> DM supplémentaire si la cible est
        bien la même que celle qu’il attaque.</li><li>Le chasseur sacrifie 3 PV
        pendant l’action limitée de soin : le loup récupère jusqu’à 6
        PV.</li></ul><h2>Conditions, pièges</h2><p>La condition de « même cible
        » est plus stricte que le rang 2 : ne pas l’appliquer au loup attaquant
        une autre menace. Si le chasseur soigne au lieu d’attaquer, il n’a pas
        attaqué une cible pendant ce tour : il ne déclenche pas automatiquement
        le bonus de dommages. Si la cible du chasseur résiste à ses coups ou
        esquive, la phrase officielle ne demande pas explicitement que son
        attaque ait réussi : c’est la cible visée qui
        importe.</p><p><small><strong>Sources COF2 :</strong> Laurent
        Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions
        (2024), p. 72 ; p. 43. Le détail ci-dessus est reformulé ; les éventuels
        arbitrages Warbound sont explicitement identifiés.</small></p></section>
