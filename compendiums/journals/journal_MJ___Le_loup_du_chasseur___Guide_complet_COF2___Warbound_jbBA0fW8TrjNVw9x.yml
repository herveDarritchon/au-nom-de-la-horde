  - name: 08 · Combat avancé et menaces
    type: text
    sort: 900000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Interactions avec les règles générales de
        combat</h1><h2>Morsure, cible et critiques</h2><ul><li>Le loup effectue
        un jet d’attaque au contact contre la DEF de la cible. Sa valeur
        d’attaque vient du score d’attaque magique du chasseur, <em>exception
        explicite du profil</em>.</li><li>Les critiques d’une attaque de contact
        suivent normalement les règles des attaques physiques. Les dés
        supplémentaires obtenus en bonus (comme le +1d4° du rang 5) ne sont pas
        multipliés dans les mêmes conditions que les DM de base : consulter COF2
        p. 213.</li><li>Le loup n’est pas doté par défaut d’un effet de
        renversement, d’immobilisation, de saignement, de ralentissement ni de
        provocation. La morsure inflige des DM ; un effet supplémentaire exige
        une règle ou un arbitrage ponctuel.</li></ul><h2>Terrain, obstacles,
        tirs alliés</h2><ul><li>Une morsure réclame le contact réel avec une
        cible ; un mur, une grille infranchissable, une porte fermée ou une
        différence de niveau peuvent l’empêcher.</li><li>Le chasseur tirant dans
        une mêlée où son loup combat subit les modificateurs généraux d’attaque
        à distance selon la position des protagonistes (p. 214) : cible en mêlée
        −2, ou −5 si un allié masque la cible.</li><li>Le loup est une cible
        distincte, avec sa DEF, ses PV et ses états ; une attaque de zone peut
        donc l’atteindre si sa position est dans la zone.</li><li>Immobilisé,
        étourdi, ralenti, renversé, surpris, etc. : appliquer les définitions du
        système aux actions/mouvements de l’animal lorsque
        pertinents.</li></ul><h2>Soutien et tactiques : ne pas les confondre
        avec la voie</h2><p>COF2 décrit « Soutenir (L) » (p. 216) comme une
        option tactique permettant de donner +5 au contact à un allié contre une
        cible désignée ; cette option coûte ses actions et ne produit pas deux
        attaques. Elle ne doit pas être transformée en bonus passif du loup. Le
        rang 2 de la voie, lui, donne son dé bonus sous sa condition
        propre.</p><h2>Combats non létaux</h2><p>Si le joueur demande au loup de
        désarmer, intimider ou immobiliser sans infliger de DM, aucune manœuvre
        de morsure « WoW » ne le prévoit d’office. Le MJ peut arbitrer une
        tentative circonstancielle selon les options tactiques générales, sans
        créer une nouvelle capacité permanente.</p><p><small><strong>Sources
        COF2 :</strong> Laurent Bernasconi, <em>Chroniques Oubliées Fantasy
        2</em>, Black Book Éditions (2024), p. 212–217 ; p. 71–72. Le détail
        ci-dessus est reformulé ; les éventuels arbitrages Warbound sont
        explicitement identifiés.</small></p></section>
