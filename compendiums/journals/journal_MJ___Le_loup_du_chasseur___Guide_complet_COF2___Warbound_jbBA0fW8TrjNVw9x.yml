  - name: 15 · Frontière avec « Bêtes familières »
    type: text
    sort: 1600000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Périmètre de la future
        spécialisation</h1><p><strong>[ACQUIS — DIRECTION WARBOUND]</strong> Le
        loup doit rester fidèle à l’esprit du compagnon animal COF2 tant que le
        chasseur n’a pas investi dans sa voie de prestige. La spécialisation
        pourra devenir un engagement réel et visible du build du personnage,
        plutôt qu’une amélioration gratuite accordée à tous les
        chasseurs.</p><table><thead><tr><th>Compagnon COF2, déjà
        acquis</th><th>Réservé à une future voie de prestige (non
        conçu)</th></tr></thead><tbody><tr><td>Morsure normale et progression
        1–5</td><td>Commandes tactiques plus avancées, attaques spécifiques au
        rôle de l’animal</td></tr><tr><td>Ordres élémentaires et lien empathique
        au rang 3</td><td>Autonomie offensive/ défensive améliorée explicitement
        écrite</td></tr><tr><td>Dé bonus et synchronisation de meute selon
        rangs</td><td>Protection active ou interception avec coût et limites
        définis</td></tr><tr><td>PV/DEF/soin officiels</td><td>Capacités
        inspirées de WoW, sans rotas ni gestion MMO
        lourde</td></tr></tbody></table><h2>Garde-fous de design</h2><ul><li>Ne
        pas retirer l’attaque de base COF2 pour la revendre dans la future
        voie.</li><li>Ne pas permettre gratuitement de multiplier les morsures
        dès qu’un autre effet offre des attaques supplémentaires au
        chasseur.</li><li>Ne pas rendre le loup indispensable à toutes les
        scènes : d’autres personnages doivent garder leurs niches tactiques et
        d’exploration.</li><li>Concevoir le prestige plus tard sur des
        situations de table (protection, choix de cible, manœuvres,
        comportement), pas comme copie littérale de WoW
        Classic.</li></ul><h2>Situation actuelle</h2><p>Aucun rang de « Bêtes
        familières » n’est décrit ou attribué dans les présents journaux. Ils
        restent consacrés au compagnon animal COF2 et à sa progression
        native.</p><p><small>Source du choix de campagne : instruction du MJ
        dans cette conversation ; source mécanique : COF2 p.
        71–72.</small></p></section>
