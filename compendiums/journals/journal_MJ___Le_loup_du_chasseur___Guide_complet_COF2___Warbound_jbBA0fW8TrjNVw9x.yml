  - name: 10 · Voyage, vie sociale et milieu naturel
    type: text
    sort: 1100000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Vie quotidienne, déplacement hors combat et
        voyage</h1><h2>Nature et habitat [COF2]</h2><p>Le livre indique que le
        loup est généralement peu à l’aise en ville : il peut rester à
        l’extérieur de l’agglomération et y subsister en attendant son maître.
        En variante explicite, le joueur peut choisir un très gros chien, mieux
        adapté à la ville mais enclin à suivre son maître. Le loup n’est pas un
        équipement rangé automatiquement dans un inventaire.</p><h2>Choix
        concrets</h2><table><thead><tr><th>Situation</th><th>Arbitrage à partir
        de COF2</th></tr></thead><tbody><tr><td>Auberge de
        Tranchecolline</td><td>Se renseigner sur l’accueil des animaux ; le loup
        peut attendre hors du village, mais ce n’est pas une invisibilité
        hors-jeu.</td></tr><tr><td>Marche en Durotar</td><td>Il accompagne le
        groupe tant que c’est possible ; chaleur, eau, pistes, fatigue sont des
        contraintes fictionnelles, non de nouveaux malus
        automatiques.</td></tr><tr><td>Bateau, échelle ou souterrain</td><td>Ne
        pas supposer qu’il suit sans difficulté ; demander comment le groupe
        l’aide et n’imposer un test que si l’enjeu le
        justifie.</td></tr><tr><td>Rencontre sociale avec des civils</td><td>La
        présence d’un prédateur peut avoir des conséquences sociales crédibles ;
        aucun bonus/malus de CHA universel n’est
        créé.</td></tr><tr><td>Recherche de nourriture</td><td>Le loup peut se
        nourrir de façon plausible en milieu naturel ; aucune fonction «
        ravitaillement illimité » automatique pour toute la
        troupe.</td></tr></tbody></table><h2>Voyages Warbound [règle maison déjà
        existante]</h2><p>Le projet Warbound emploie une progression quotidienne
        avec Guide (INT Survie), Éclaireur (PER Survie), Voyageurs (CON Survie).
        <strong>Le loup ne remplace pas un poste de PJ et ne procure pas un
        succès collectif automatique.</strong> Il peut en revanche contribuer à
        une scène de piste ou de vigilance ponctuelle. Cette phrase est une
        <em>application proposée</em> pour éviter le cumul abusif dans le
        système de voyage Warbound, et ne provient pas du chapitre COF2 sur le
        loup.</p><p><small><strong>Sources COF2 :</strong> Laurent Bernasconi,
        <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions (2024), p.
        71–72 ; règles de voyage p. 233–236 ; Warbound, Synthèse des règles de
        voyage (règle maison). Le détail ci-dessus est reformulé ; les éventuels
        arbitrages Warbound sont explicitement identifiés.</small></p></section>
