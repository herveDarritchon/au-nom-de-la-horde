  - name: 03 · Rang 2 — Travail d’équipe
    type: text
    sort: 400000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Rang 2 : Travail d’équipe</h1><p><strong>[COF2]</strong>
        Quand le rôdeur et son loup sont « au contact », deux bénéfices
        différents s’appliquent : le loup obtient un <strong>dé bonus à son
        attaque</strong> ; le rôdeur obtient un <strong>dé bonus aux tests pour
        pister ou éviter d’être surpris (Vigilance)</strong>. Ces avantages
        s’ajoutent aux capacités déjà possédées, sans remplacer la morsure ni
        les ordres simples.</p><h2>À différencier</h2><ul><li><strong>Dé bonus
        du loup</strong> : sur le d20 de son attaque ; ne pas augmenter
        directement les dégâts.</li><li><strong>Dé bonus du rôdeur</strong> :
        uniquement sur les tests concernés ; pas un bonus général en PER ou à
        toutes les compétences.</li><li>La présence du loup compte pour cette
        capacité ; la règle n’autorise pas un bonus quand le compagnon est
        absent, parti explorer au loin ou incapable de participer à la
        situation.</li></ul><h2>Interprétation du « contact
        »</h2><p><strong>[OUVERT]</strong> Le texte officiel ne définit pas
        précisément s’il faut que les deux partenaires soient adjacents l’un à
        l’autre, chacun au contact d’une même cible, ou impliqués dans la même
        mêlée. Le groupe doit fixer une définition unique. <strong>[ARBITRAGE
        PROPOSÉ]</strong> : en combat, loup et chasseur à portée de mêlée de la
        même cible ; hors combat, le loup se tient à proximité immédiate du
        chasseur. Ce n’est pas une citation de la règle.</p><h2>Cas de la
        traque</h2><p>Un loup éloigné de 100 m pour flairer seul ne donne pas le
        dé bonus de la voie au chasseur. En revanche, l’animal peut faire son
        <em>propre</em> test de PER quand le MJ estime qu’il est en mesure de
        détecter une odeur. Le dé bonus à ses propres tests de PER vient du
        profil de base (rang 1).</p><p><small><strong>Sources COF2 :</strong>
        Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book
        Éditions (2024), p. 71 ; dés bonus, p. 198–202. Le détail ci-dessus est
        reformulé ; les éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
