  - name: 13 · Foundry VTT — mettre le loup en jeu
    type: text
    sort: 1400000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Paramétrage pratique dans Foundry VTT
        v14</h1><p><strong>[MODE OPÉRATOIRE PROPOSÉ]</strong> Cette page
        concerne l’interface, non les capacités officielles. Le monde fourni
        indique Foundry <strong>14.369</strong> et système <strong>co2
        2.3.12</strong>. Les noms des champs peuvent varier selon la fiche de
        rencontre utilisée : le MJ doit vérifier les comportements en
        jeu.</p><ol><li>Créer un acteur/une fiche de rencontre <strong>« Loup —
        compagnon du chasseur »</strong> (ou nom choisi par son joueur), avec
        token propre ; ne pas lui attribuer le profil du loup sauvage par
        défaut.</li><li>Renseigner AGI +1, CON +1 (dé bonus aux tests), FOR +2,
        PER +2 (dé bonus), CHA −2, INT −3, VOL +2 ; DM 1d4 + 2 ; DEF 12 + rang ;
        PV max 4 × niveau du chasseur.</li><li>Configurer l’attaque au contact
        avec le <strong>bonus d’attaque magique du chasseur</strong> (à
        synchroniser manuellement après un changement de niveau ou de
        VOL).</li><li>Donner à l’acteur la même initiative que son maître ; sur
        le tracker, jouer les déplacements et la morsure dans leur séquence
        coordonnée, sans multiplier les activations offensives.</li><li>Accorder
        au joueur le contrôle de l’acteur loup seulement si cela correspond à la
        pratique du groupe ; sinon le MJ peut déplacer son pion à sa
        demande.</li><li>À chaque rang, actualiser DEF, PV, DM, bonus au jet ou
        bonus conditionnel ; conserver une note sur les effets de rang 3 et 5
        qui concernent aussi le chasseur.</li><li>À l’obtention du rang 4,
        remplacer le profil par les valeurs alpha du <em>livre</em> ; au rang 5,
        ajouter les bonus de DEF pour le duo.</li></ol><h2>Journal progressif du
        joueur</h2><p>Le second JSON fourni comporte <strong>exactement cinq
        pages</strong> (rangs 1 à 5). Le journal est privé par défaut. Après
        import, accorder le droit « Observateur » sur le journal au joueur du
        chasseur, puis ne rendre visibles que les pages atteintes : rang 1
        visible au départ ; pages 2 à 5 explicitement masquées. Les pages
        futures pourront être débloquées via leurs droits individuels. Ne pas
        utiliser « Montrer aux joueurs » sur une page verrouillée si l’intention
        est de garder son contenu secret.</p><h2>Vérification</h2><p>Faire un
        test en se connectant comme joueur (ou avec une session de joueur
        dédiée) : vérifier que la page rang 1 apparaît mais pas les rangs
        ultérieurs, que le token peut être sélectionné comme souhaité et que les
        automatismes du système n’ajoutent pas un score de FOR à
        l’attaque.</p><p><small>Source technique : <a
        href="https://foundryvtt.com/article/journal/">Foundry VTT — Journal
        Entries</a> et <a
        href="https://foundryvtt.com/api/v14/interfaces/foundry.documents.types.JournalEntryPageData.html">API
        JournalEntryPageData v14</a> (consultés le 7 novembre
        2026).</small></p></section>
