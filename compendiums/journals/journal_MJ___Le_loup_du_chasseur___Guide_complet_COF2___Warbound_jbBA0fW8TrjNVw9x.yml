  - name: 07 · Actions, attaques et déplacement
    type: text
    sort: 800000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Le loup dans l’économie des actions</h1><p><strong>[COF2,
        général]</strong> Au cours de son tour, un personnage dispose en
        principe d’une action limitée (L), ou d’une action de mouvement et une
        action d’attaque (M + A), ou de deux mouvements (2 M). Des paroles très
        brèves peuvent constituer une action gratuite (G). Une action de
        mouvement couvre usuellement 10 m, 5 m en terrain difficile ; certaines
        créatures se déplacent autrement. Les deux partenaires sont placés sur
        une même initiative selon le rang 1.</p><h2>Ce qui est fixé / ce qui ne
        l’est
        pas</h2><table><thead><tr><th>Question</th><th>Traitement</th></tr></thead><tbody><tr><td>Le
        chasseur doit-il sacrifier son tir ?</td><td><strong>[COF2]</strong>
        Non, la voie ne dit pas qu’il échange son attaque contre celle du
        loup.</td></tr><tr><td>Le loup joue-t-il avec son propre déplacement
        ?</td><td><strong>[OUVERT]</strong> Aucune procédure détaillée de tour
        indépendant dans la voie. Le loup doit toutefois pouvoir rejoindre sa
        cible dans la fiction.</td></tr><tr><td>Deux actions d’attaque parce que
        le chasseur utilise Tir rapide ?</td><td><strong>[OUVERT]</strong> «
        attaque en même temps » ne signifie pas explicitement « copie chaque
        attaque » ; ne pas multiplier automatiquement les
        morsures.</td></tr><tr><td>Ordre oral « attaque » = action
        ?</td><td><strong>[OUVERT]</strong> Aucun coût fixé par la voie ; le
        système général admet quelques mots en G.</td></tr><tr><td>Soin (L) du
        chasseur puis morsure ?</td><td><strong>[OUVERT]</strong> La phrase de
        la voie ne résout pas le cas où le chasseur n’attaque
        pas.</td></tr><tr><td>Riposte / attaque d’opportunité automatique
        ?</td><td><strong>[COF2]</strong> Pas d’attaque d’opportunité générique
        sur simple déplacement ; ne pas en ajouter pour le
        loup.</td></tr><tr><td>Distance de déplacement du
        loup</td><td><strong>[OUVERT]</strong> Pas de vitesse chiffrée sur sa
        fiche. La règle générale M = 10 m peut être adoptée provisoirement, sans
        présenter ce nombre comme spécifique au
        loup.</td></tr></tbody></table><h2>Séquence de jeu conseillée [ARBITRAGE
        PROPOSÉ — NON VALIDÉ]</h2><ol><li>Au rang d’initiative du chasseur,
        annoncer l’action du chasseur et une consigne simple au
        loup.</li><li>Placer le loup sur son emplacement réel, appliquer le
        terrain et les obstacles.</li><li>Si le chasseur a attaqué et si le loup
        est en mesure de mordre, effectuer <strong>une seule morsure</strong> au
        cours de cette activation partagée.</li><li>Appliquer les bonus acquis
        et les conditions de cible/contact.</li><li>Si le chasseur n’attaque
        pas, ou utilise une action limitée, statuer selon la convention encore à
        valider plutôt que prétendre qu’une règle officielle donne une morsure
        gratuite.</li></ol><p><small><strong>Sources COF2 :</strong> Laurent
        Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book Éditions
        (2024), p. 71, 209–216. Le détail ci-dessus est reformulé ; les
        éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
