  - name: 16 · Fiche de contrôle, FAQ et sources
    type: text
    sort: 1700000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Aide-mémoire du MJ et
        vérifications</h1><table><thead><tr><th>Rang</th><th>Bonus / fonction
        principale</th><th>DEF loup</th><th>PV
        maximum</th><th>Morsure</th></tr></thead><tbody><tr><td>1</td><td>Ordres
        simples, attaque au tour du chasseur</td><td>13</td><td>4 ×
        niveau</td><td>1d4 + 2</td></tr><tr><td>2</td><td>Dé bonus au loup en
        attaque et au chasseur pour piste/surprise si « au contact
        »</td><td>14</td><td>4 × niveau</td><td>1d4 +
        2</td></tr><tr><td>3</td><td>Télépathie et soin à distance (L)
        1:1</td><td>15</td><td>4 × niveau</td><td>1d4 +
        2</td></tr><tr><td>4</td><td>Profil alpha : CON +3*, FOR
        +5</td><td>18</td><td>5 × niveau</td><td>1d4° +
        5</td></tr><tr><td>5</td><td>+1d4° DM si même cible ; soin 1:2 ; +1 DEF
        au duo par voie de rôdeur rang 5</td><td>18 + bonus de meute</td><td>5 ×
        niveau</td><td>1d4° + 5 (+1d4° sous
        condition)</td></tr></tbody></table><h2>FAQ
        rapide</h2><ul><li><strong>Est-ce une créature supplémentaire qui
        attaque ?</strong> Oui, dès le rang 1, mais la voie ne décrit pas une
        économie autonome complète des actions.</li><li><strong>Doit-il toucher
        la cible pour utiliser ses crocs ?</strong> Oui, attaque au contact
        contre DEF.</li><li><strong>Donne-t-il la perception de son maître
        ?</strong> Non. Il teste avec ses valeurs ; bonus au PJ seulement s’il
        est prévu par le rang.</li><li><strong>Un loup inconscient revient-il
        automatiquement ?</strong> La règle de retour à 8 h suppose qu’il puisse
        s’enfuir en milieu naturel.</li><li><strong>Les bonus du rang 5 sont-ils
        trois fois le même avantage ?</strong> Non : dommages, soin et DEF sont
        des effets distincts.</li></ul><h2>Références
        traçables</h2><ol><li><strong>Laurent Bernasconi</strong>,
        <em>Chroniques Oubliées Fantasy 2e édition</em>, Black Book Éditions,
        2024, <strong>p. 71–72</strong> : compagnon animal, gestion, cinq rangs
        ; <strong>p. 43</strong> : dés évolutifs.</li><li><strong>COF2 p.
        208–217</strong> : surprise, initiative, types d’action, mouvement,
        attaques, critiques et options tactiques ; <strong>p. 220–222</strong> :
        récupération.</li><li><a
        href="https://drs.chroniques-oubliees.fr/fantasy/profils/rodeur"><strong>DRS
        Chroniques Oubliées Fantasy — Rôdeur</strong></a>, consultation
        7/11/2026 : divergence de valeurs au rang 4, non tranchée par erratum
        retrouvé.</li><li><a
        href="https://foundryvtt.com/article/journal/"><strong>Foundry VTT —
        Journal Entries</strong></a> et <a
        href="https://foundryvtt.com/api/v14/interfaces/foundry.documents.types.JournalEntryPageData.html">API
        v14 JournalEntryPageData</a>, consultés 7/11/2026.</li><li><em>Warbound
        — Rôles et progression du voyage</em> (document de projet) : règle
        maison appliquée uniquement au voyage.</li></ol><p><small>Version de
        travail v1.0 — journal exhaustif côté MJ. Les [ARBITRAGES PROPOSÉS]
        restent à confirmer avant d’être considérés comme règles de
        Warbound.</small></p></section>
