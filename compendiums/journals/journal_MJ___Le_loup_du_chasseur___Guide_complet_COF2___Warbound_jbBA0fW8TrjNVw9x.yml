  - name: 00 · Mode d’emploi et statut des règles
    type: text
    sort: 100000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <section><h1>Le loup du chasseur — Manuel MJ</h1><p><em>Warbound · Au
        Nom de la Horde · COF2 · Référence MJ · Novembre
        2026</em></p><blockquote><p><strong>Principe arrêté :</strong> le
        chasseur ordinaire utilise la <em>Voie du compagnon animal</em> du
        rôdeur de COF2, sans lui ajouter les mécaniques du familier de WoW. Une
        future voie de prestige « Bêtes familières » pourra développer une
        relation de combat plus poussée ; elle est hors du présent
        guide.</p></blockquote><h2>Lire ce
        journal</h2><ul><li><strong>[COF2]</strong> : règle tirée du Livre des
        règles officiel fourni ; la page du livre est
        indiquée.</li><li><strong>[APPLICATION]</strong> : conséquence directe
        d’une règle générale ou exemple sans modification de
        capacité.</li><li><strong>[ARBITRAGE PROPOSÉ]</strong> : solution de
        fonctionnement pratique mais non écrite explicitement dans la voie,
        <strong>non validée</strong> à ce
        jour.</li><li><strong>[OUVERT]</strong> : le livre ne tranche pas
        complètement, ou un choix Warbound
        manque.</li><li><strong>[PRESTIGE]</strong> : piste future, non
        accessible au chasseur ordinaire.</li></ul><h2>Organisation</h2><p>Les
        pages 01 à 07 récapitulent le profil et les cinq rangs ; les pages 08 à
        15 couvrent combat, exploration, repos, cas particuliers et arbitrages ;
        la dernière page donne un aide-mémoire et la
        bibliographie.</p><h2>Distinction importante</h2><p>Le loup est un
        <strong>compagnon animal</strong>, et non un familier magique. Ce n’est
        ni une créature de la fiche standard du Bestiaire ni un second PJ doté
        automatiquement de toutes les options tactiques. Il possède cependant
        une attaque de combat dès le rang 1. Le terme « maîtrise » utilisé dans
        le journal joueur signifie <strong>rang dans la voie</strong>, pas
        niveau global du PJ.</p><p><small><strong>Sources COF2 :</strong>
        Laurent Bernasconi, <em>Chroniques Oubliées Fantasy 2</em>, Black Book
        Éditions (2024), p. 71–72 ; p. 210–216. Le détail ci-dessus est
        reformulé ; les éventuels arbitrages Warbound sont explicitement
        identifiés.</small></p></section>
