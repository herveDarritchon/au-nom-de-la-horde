  - _id: 9d7bde8d134824f2
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z09</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z09-01</code> Îles de
        l'Écho</td><td>Extension</td><td>[PC]
        [FAC]</td></tr><tr><td><code>Z09-02</code> Débarcadères /
        criques</td><td>Sites à
        définir</td><td>[PROP]</td></tr><tr><td><code>Z09-03</code> Présence
        rituelle de Zalazane</td><td>Site à définir</td><td>[FAC] — emplacement
        inconnu</td></tr></tbody></table><h3>Implantation et rôle des
        lieux</h3><p><code>Z09-01</code> Îles de l'Écho
        <strong>[extension]</strong> ; <code>Z09-02</code> éventuels sites de
        débarquement <strong>[PROP, à choisir]</strong> ; <code>Z09-03</code>
        présence / lieux rituels de Zalazane <strong>[FAC, localisation interne
        non fixée]</strong>.</p><h3>Connaissance des PJ (à renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
