  - _id: 6c20bdfafc657546
    name: 00 · Vue d’ensemble
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Repères de zone —
        Z09</h2><table><thead><tr><th>Champ</th><th>Information</th></tr></thead><tbody><tr><td>Nom</td><td>Îles
        de l'Écho</td></tr><tr><td>Situation / limite</td><td>Archipel au large
        du sud-est</td></tr><tr><td>Influence
        structurante</td><td><strong>Zalazane</strong> ; revendication des
        Sombrelances</td></tr><tr><td>Statut dans la
        campagne</td><td>Extension</td></tr><tr><td>Danger COF2 de départ (à
        confirmer)</td><td><strong>Sauvage DD 15</strong> sur les approches
        insulaires ; secteurs rituels à qualifier
        séparément</td></tr><tr><td>Distance et durée</td><td><strong>Non
        calibrées</strong> : à renseigner par liaison /
        tronçon.</td></tr></tbody></table><h3>Situation de
        départ</h3><p>archipel au large du sud-est de Durotar, ancienne
        implantation des Sombrelances devenue bastion de
        <strong>Zalazane</strong>. <strong>Extension optionnelle</strong> du
        pointcrawl, non trajet terrestre ordinaire. [PC]
        [FAC]</p><blockquote><p><strong>Document réservé au MJ.</strong> Le
        zonage, les DD et les incidents sont des propositions Warbound. Les
        secrets des factions ne sont pas connus des PJ. La difficulté effective
        est fixée <strong>par trajet avant le jet du Guide</strong>, pas
        automatiquement pour toute la zone.</p></blockquote><h3>Mémo : comment
        utiliser cette zone</h3><ol>

        <li>Situer le trajet et les POI réellement connus.</li>

        <li>Montrer les itinéraires plausibles et leurs compromis.</li>

        <li>Choisir ellipse, scène ou journée de voyage Warbound V2.</li>

        <li>En cas de journée jouée : Guide INT (Survie) d’abord, Éclaireur PER
        (Survie) et Voyageurs CON (Survie) ensuite.</li>

        <li>Appliquer le bilan COF2, puis mettre à jour les POI, routes et
        factions concernés.</li>

        </ol>
