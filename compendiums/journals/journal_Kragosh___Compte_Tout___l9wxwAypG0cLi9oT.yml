  - name: 04 · Secrets et devenir (MJ)
    type: text
    sort: 400000
    text:
      format: 1
      content: >-
        <h1>MJ — Secrets et continuité</h1><h2>Vérité / point de
        vigilance</h2><p>Il n’est pas secrètement corrompu. Il croit sincèrement
        qu’une Horde fragile doit travailler dur. Ses fautes viennent de son
        ambition et de sa peur, pas d’un complot.</p><h2>Ce que le PNJ ne dit
        pas spontanément</h2><p>Une partie de sa dureté vient d’une dette de
        gratitude envers Thazz’rill, qui l’a aidé lorsqu’il n’avait plus de
        travail.</p><h2>Évolution envisageable</h2><p>Contremaître à
        Tranchecolline ou Orgrimmar, selon sa trajectoire. Ses registres peuvent
        contenir des informations précieuses ou compromettantes.</p><h2>Fil de
        mémoire des PJ</h2><ul><li>Qui lui a parlé avec respect, et qui l’a
        humilié ?</li><li>Quelle promesse les PJ ont-ils faite ?</li><li>Quelle
        décision des PJ a réellement changé sa vie ?</li><li>Que demandera-t-il
        aux PJ la prochaine fois qu’ils se croiseront ?</li></ul><h2>Continuité
        ouverte</h2><p>Les événements ci-dessus sont des propositions. Les faits
        établis pendant la partie priment sur cette préparation. L’amitié,
        l’hostilité et le destin de ce péon ne sont pas décidés à l’avance.</p>
