  - name: 02 · Jouer ce péon
    type: text
    sort: 200000
    text:
      format: 1
      content: >-
        <h1>Interprétation et liens</h1><h2>Comment l’incarner</h2><p>S’adresse
        aux PJ comme à des collègues à évaluer. Il note les manquements mais
        respecte la constance et les promesses tenues.</p><h2>Ce qu’il sait,
        croit et dissimule</h2><dl><dt><strong>Sait</strong></dt><dd>Les
        présences, les horaires, les retards, les outils prêtés et les demandes
        officielles du chantier.</dd><dt><strong>Croit</strong></dt><dd>Que
        Mogra fomente une contestation pour obtenir un traitement de faveur ; il
        sous-estime ses compétences et l’état de
        Dorga.</dd><dt><strong>Cache</strong></dt><dd>Une partie de sa dureté
        vient d’une dette de gratitude envers Thazz’rill, qui l’a aidé lorsqu’il
        n’avait plus de travail.</dd></dl><h2>Son
        entourage</h2><table><thead><tr><th>Personne</th><th>Relation
        actuelle</th></tr></thead><tbody><tr><td>Thazz’rill</td><td>Le respecte
        comme celui qui lui a donné une
        chance.</td></tr><tr><td>Mogra</td><td>Sa rivale sur la manière
        d’organiser les
        travailleurs.</td></tr><tr><td>Grubnak</td><td>L’incarnation de ce qu’il
        méprise.</td></tr><tr><td>Dorga</td><td>Il apprécie son travail sans
        mesurer le coût humain.</td></tr></tbody></table><h2>Une phrase à
        placer</h2><blockquote><p>« Il faut bien que quelqu’un travaille pendant
        que vous discutez de justice. »</p></blockquote>
