  - name: 01 · Portrait et accroche
    type: text
    sort: 100000
    text:
      format: 1
      content: >-
        <h1>Kragosh « Compte-Tout »</h1><p><em>Adaptation Warbound · Vallée des
        Épreuves · Journal MJ</em></p><blockquote><p>« Il faut bien que
        quelqu’un travaille pendant que vous discutez de justice.
        »</p></blockquote><h2>En un
        regard</h2><dl><dt><strong>Rôle</strong></dt><dd>L’ambitieux · autorité
        / rivalité</dd><dt><strong>Aspect</strong></dt><dd>Orc grand et maigre,
        le regard incisif. Il transporte une tablette de pointage et sait
        exactement combien de paniers ont été déplacés durant chaque
        quart.</dd><dt><strong>Désir</strong></dt><dd>Devenir contremaître et
        prouver qu’un péon compétent peut gravir les échelons par le
        mérite.</dd><dt><strong>Crainte</strong></dt><dd>Revenir à la misère
        qu’il a connue avant que Thazz’rill ne lui donne du
        travail.</dd><dt><strong>Défaut</strong></dt><dd>Il confond loyauté
        envers l’autorité et justice. Il peut dénoncer un ami pour ne pas perdre
        sa place.</dd></dl><h2>Première impression à la table</h2><p>S’adresse
        aux PJ comme à des collègues à évaluer. Il note les manquements mais
        respecte la constance et les promesses tenues.</p><h2>Contact avec les
        PJ</h2><p>Un allié rigoureux qui honore les accords, ou un rival
        administratif qui connaît les petites failles des
        aventuriers.</p><p><em>Statut : PNJ original de la campagne. Repère
        canonique du secteur : le contremaître Thazz’rill et les péons de la
        Vallée.</em></p>
