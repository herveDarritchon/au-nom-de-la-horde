  - name: 03 · Scènes et réactions
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>Scènes et décisions</h1><h2>Trois occasions de jeu</h2><h3>Le
        registre</h3><p>Il montre aux PJ ses comptes pour prouver qu’un péon
        ment sur ses absences ; le registre est exact mais pas les raisons de
        l’absence.</p><h3>Le mérite</h3><p>Il propose une compétition de
        rendement dont le vainqueur recevra un outil ou la meilleure
        affectation.</p><h3>Le témoin</h3><p>Un ami lui demande de taire une
        faute mineure ; les PJ assistent à son hésitation avant de signaler
        l’incident.</p><h2>Réactions à quelques choix des
        PJ</h2><table><thead><tr><th>Approche des PJ</th><th>Réaction ou
        conséquence</th></tr></thead><tbody><tr><td>Lui donner de l’autorité
        sans contrôle</td><td>Il devient efficace mais dur, et accroît les
        tensions avec Mogra.</td></tr><tr><td>L’humilier publiquement</td><td>Il
        fait des PJ des adversaires personnels, même si leur critique est
        fondée.</td></tr><tr><td>Lui confier un poste avec responsabilités
        claires</td><td>Il peut apprendre à protéger son équipe autant qu’à la
        faire travailler.</td></tr></tbody></table><h2>Si les PJ n’interviennent
        pas</h2><p>Son influence grandit ; la productivité progresse un temps,
        puis les ouvriers les plus compétents s’éloignent et les conflits
        augmentent.</p><p><em>Ces scènes sont des opportunités, pas une suite de
        quêtes imposées. Elles peuvent se résoudre sans jet de dés.</em></p>
