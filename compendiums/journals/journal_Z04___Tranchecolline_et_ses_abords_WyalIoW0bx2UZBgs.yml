  - _id: 6e3d9d9c490bb9e9
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z04</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z04-01</code>
        Tranchecolline</td><td><strong>Nœud
        [1]</strong></td><td>[PC]</td></tr><tr><td><code>Z04-02</code> Caserne
        de
        Tranchecolline</td><td>Infrastructure</td><td>[CLASSIC]</td></tr><tr><td><code>Z04-03</code>
        Tour de
        guet</td><td>Infrastructure</td><td>[CLASSIC]</td></tr><tr><td><code>Z04-04</code>
        Cour des convois / halte</td><td>Fonction locale</td><td>[GUIDE] — fiche
        fine à rapprocher</td></tr><tr><td><code>Z04-05</code> Départs des axes
        régionaux</td><td>Nœud de
        routes</td><td>[PC]</td></tr></tbody></table><h3>Implantation et rôle
        des lieux</h3><p><code>Z04-01</code> Tranchecolline <strong>[1]</strong>
        ; <code>Z04-02</code> caserne de Tranchecolline <strong>[CLASSIC /
        GUIDE]</strong> ; <code>Z04-03</code> tour de guet
        <strong>[CLASSIC]</strong> ; <code>Z04-04</code> cour des convois /
        artisanat / halte <strong>[fonctions de campagne ; précision par fiche
        de hub]</strong> ; <code>Z04-05</code> départs des routes vers Z03, Z05,
        Z06, Z07 et la voie nord <strong>[PC]</strong>.</p><h3>Connaissance des
        PJ (à renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
