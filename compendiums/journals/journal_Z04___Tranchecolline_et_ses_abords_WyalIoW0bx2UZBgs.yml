    image: {}
    text:
      format: 1
      content: >-
        <h2>Routes, accès et compromis — Z04</h2><h3>Liaisons principales
        R01–R08</h3><table><thead><tr><th>Route</th><th>Liaison / zones
        d'arrivée</th><th>Tag et compromis établis</th><th>Terrain / danger **de
        départ
        proposé**</th><th>Statut</th></tr></thead><tbody><tr><td><strong>R01</strong></td><td>Tranchecolline
        Z04 ↔ Sen'jin Z07</td><td><strong>Route du sud fréquentée</strong> ;
        convois et chaleur</td><td>Route utilisable (pas de ÷2 automatique) ;
        <strong>frontalière DD 10</strong> sur partie exposée</td><td>Connue si
        révélée aux
        PJ</td></tr><tr><td><strong>R02</strong></td><td>Tranchecolline Z04 ↔
        Terres Tranchecrins Z05</td><td><strong>Piste ouest contestée</strong> ;
        incursions, négociation</td><td>Piste <strong>sauvage DD 15</strong>
        près du territoire</td><td>Information / sécurité
        variables</td></tr><tr><td><strong>R03</strong></td><td>Tranchecolline
        Z04 ↔ Tiragarde Z06</td><td><strong>Route est surveillée</strong> ;
        approche frontale ou discrète</td><td>Terrain ouvert puis côte ;
        <strong>frontalière DD 10</strong> hors risque, <strong>sauvage DD
        15</strong> en approche hostile</td><td>Accès conditionné par la
        fiction</td></tr><tr><td><strong>R04</strong></td><td>Tranchecolline Z04
        ↔ Falaises du Tonnerre Z03</td><td><strong>Route nord-ouest
        logistique</strong> ; chariots et matériaux</td><td>Piste entretenue
        <strong>frontalière DD 10</strong> ; ravin sauvage <strong>DD
        15</strong> en dehors</td><td>Variable selon
        sabotages</td></tr><tr><td><strong>R06</strong></td><td>Tranchecolline
        Z04 ↔ Rocher du crâne Z02</td><td><strong>Voie nord rapide et
        exposée</strong> ; circulation vers Orgrimmar</td><td>Voie connue
        <strong>DD 10 frontalière</strong> sur portion sûre ; sauvage <strong>DD
        15</strong> sur l'approche finale</td><td>Visible, non forcément
        sûr</td></tr></tbody></table><h3>Liaisons proposées non encore
        validées</h3><table><thead><tr><th>Code provisoire</th><th>Connexion
        logique</th><th>À régler avant
        utilisation</th></tr></thead><tbody><tr><td><code>RX-01</code></td><td>Z04
        / couloir nord ↔ <strong>Z01 Orgrimmar</strong></td><td>Tracé, durée,
        nécessité d'un jet, pression
        logistique</td></tr><tr><td><code>RX-04</code></td><td>Z04 ou Z07 ↔
        <strong>Z10 Vallée des Épreuves</strong></td><td>Connexion prologue à
        déterminer <strong>avant</strong> de l'affirmer
        accessible</td></tr></tbody></table><h3>État actuel (à
        compléter)</h3><table><thead><tr><th>Route</th><th>Connaissance des
        PJ</th><th>Accès</th><th>État /
        compromis</th></tr></thead><tbody><tr><td>R01</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>R02</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td></tr><tr><td>R03</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>R04</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td></tr><tr><td>R06</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr><tr><td>RX-01</td><td>À renseigner</td><td>À
        renseigner</td><td>À renseigner</td></tr><tr><td>RX-04</td><td>À
        renseigner</td><td>À renseigner</td><td>À
        renseigner</td></tr></tbody></table><blockquote><p><strong>Les huit
        liaisons sont des choix qualitatifs, pas des distances.</strong> Les
        trajets Rxx et RX-xx n’ont pas de durée ni de kilométrage validés. Ne
        pas transformer une liaison cachée en chemin connu sans découverte en
        jeu.</p></blockquote>
