  - name: 01 • À jouer maintenant
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>À jouer maintenant</h1><p><strong>POI :</strong> Z01-03 — Travaux /
        approvisionnement d'excavation | <strong>Catégorie :</strong>
        a_definir</p><p><em>Compléter les champs entre crochets. Cette fiche est
        réservée au MJ. Elle n’impose pas de scène ni de jet
        supplémentaire.</em></p><p><strong>Fonction issue de l’inventaire
        :</strong> Logistique de l’excavation ; emplacement opérationnel non
        fixé.</p><p><em>Placeholder de conception : garder « localisation non
        fixée » jusqu’à établissement en jeu.</em></p><h2>Carte minute — 30
        secondes</h2><table><tbody><tr><th>Pourquoi venir
        ?</th><td>[Information, contact, ressource, passage ou
        menace]</td></tr><tr><th>Qu’arrive-t-il maintenant ?</th><td>[Une
        situation visible qui évolue]</td></tr><tr><th>Tension
        centrale</th><td>[Deux intérêts en opposition]</td></tr><tr><th>Décision
        à prendre</th><td>[Choix ouvert ; aucune solution
        imposée]</td></tr><tr><th>Bénéfice durable possible</th><td>[Route,
        contact, information, ressource, changement]</td></tr><tr><th>Si les PJ
        n’interviennent pas</th><td>[Une évolution cohérente et
        limitée]</td></tr></tbody></table><h2>Première impression — à
        raconter</h2><blockquote><p>[2–4 phrases : image forte, détail
        sensoriel, signe d’activité. Pas de secrets
        MJ.]</p></blockquote><h2>Points d’interaction (2 ou 3 maximum)</h2><p>1.
        [Élément concret] → [action possible]</p><p>2. [Élément concret] →
        [action possible]</p><p>3. [Facultatif] → [action
        possible]</p><h2>Acteurs présents — intentions et
        leviers</h2><p><em>Faction(s) susceptibles d’y agir, à confirmer : ne
        pas conclure par défaut à leur
        implantation.</em></p><table><tbody><tr><th>Acteur A</th><td>[Qui ? Veut
        quoi ? Peut offrir quoi ? Refuse quoi ?]</td></tr><tr><th>Acteur
        B</th><td>[Qui ? Veut quoi ? Peut offrir quoi ? Refuse quoi
        ?]</td></tr></tbody></table><h2>Trois façons possibles de jouer (aucune
        n’est obligatoire)</h2><p><strong>Parler / négocier :</strong> [demande,
        concession, prix].</p><p><strong>Observer / enquêter :</strong> [signe,
        témoin, objet].</p><p><strong>Agir / explorer :</strong> [obstacle,
        responsabilité, choix].</p><p><strong>Question au MJ :</strong> Quelle
        scène ou quel indice permettrait de rendre ce site réel et localisé
        ?</p>
