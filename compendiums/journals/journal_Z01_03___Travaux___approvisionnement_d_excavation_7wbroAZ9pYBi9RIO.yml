        <h1>PNJ — Dara Casse-Rivet</h1>
            <p><strong>ID :</strong> PNJ-Z01-03-02 · <strong>POI :</strong> Z01-03 · <strong>Zone :</strong> Z01</p>
            <p><strong>Origine / statut :</strong> Original Warbound — affiliation secrète</p>
            <p><strong>Fonction :</strong> Manutentionnaire chargée du tri des outils · <strong>Faction / allégeance réelle (MJ) :</strong> Cercle de la Pierre Brisée (clandestin) ; couverture ouvrière de la Horde</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Faire sortir sans blessé une caisse d’outils destinés au forage profond.</td></tr><tr><th>Motivation profonde</th><td>Elle croit qu’une catastrophe surviendra si les travaux continuent.</td></tr><tr><th>Obstacle</th><td>Elle n’a ni autorité pour arrêter le projet ni confiance dans les chefs.</td></tr>
              <tr><th>Ligne rouge</th><td>Bousculer un ouvrier ou provoquer un effondrement pour couvrir son sabotage.</td></tr><tr><th>Peut offrir</th><td>Un avertissement cryptique, un rendez-vous discret, une preuve matérielle partielle.</td></tr><tr><th>En échange</th><td>Engagement de protéger les ouvriers avant toute accusation.</td></tr>
              <tr><th>Attitude initiale</th><td>Réservée, se tient toujours près d’une sortie.</td></tr><tr><th>S'il n'arrive rien</th><td>Le Cercle déplace son prochain sabotage loin de ce dépôt.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Petit anneau de cuivre rongé par l’acide, gants de travail reprisés.</p><p><strong>Voix et comportement :</strong> Chuchote en cas de foule ; vérifie les issues.</p><p><strong>Signe émotionnel :</strong> Cherche les issues du regard si l’on parle de sabotage.</p>
            <blockquote><p><strong>Première réplique :</strong> « Les outils ne tombent pas toujours en panne tout seuls. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Si des ordres mettent les nôtres en péril, obéissez-vous ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Constate publiquement l’usure prématurée d’un lot.</td></tr><tr><th>Après échange, aide ou observation</th><td>Admet, si mise en confiance, qu’un autre groupe surveille les chantiers.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>MJ : membre du Cercle ; elle sait que les sabotages doivent rester non létaux, mais pas tous les plans du réseau.</td></tr><tr><th>Il demande</th><td>Engagement de protéger les ouvriers avant toute accusation.</td></tr>
              <tr><th>Il peut proposer</th><td>Un avertissement cryptique, un rendez-vous discret, une preuve matérielle partielle.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Bousculer un ouvrier ou provoquer un effondrement pour couvrir son sabotage.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Détourne une cargaison sans accident et laisse un indice aux PJ.</td></tr><tr><th>S'ils négocient</th><td>Accepte une rencontre hors chantier en échange de garanties.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Fuit et détruit ses notes plutôt que blesser un poursuivant.</td></tr><tr><th>S'ils l'ignorent</th><td>Le Cercle déplace son prochain sabotage loin de ce dépôt.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z01-03. <strong>Relations / autres lieux :</strong> Référence possible à Z03-05, sans établir un trajet secret fixe.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z01-03 : chemin vers une autre interprétation des vols ; le secret est à gagner, pas révélé d’office.</p>
