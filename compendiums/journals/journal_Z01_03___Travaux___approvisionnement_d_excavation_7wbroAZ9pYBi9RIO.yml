      content: |-
        <h1>PNJ — Horga Taille-Fer</h1>
            <p><strong>ID :</strong> PNJ-Z01-03-01 · <strong>POI :</strong> Z01-03 · <strong>Zone :</strong> Z01</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Contremaîtresse du chantier logistique · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — travaux d’excavation</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Récupérer les pièces manquantes avant la relève.</td></tr><tr><th>Motivation profonde</th><td>Ses équipes dorment mal et risquent de travailler dans une galerie dangereuse.</td></tr><tr><th>Obstacle</th><td>Les ordres exigent de poursuivre sans le bon matériel.</td></tr>
              <tr><th>Ligne rouge</th><td>Mettre ses ouvriers en danger pour satisfaire un supérieur.</td></tr><tr><th>Peut offrir</th><td>Description des pièces volées, plan d’approvisionnement, appui des ouvriers.</td></tr><tr><th>En échange</th><td>Promesse de protéger les travailleurs et de ne pas interrompre tout le chantier sans preuve.</td></tr>
              <tr><th>Attitude initiale</th><td>Pressée, méfiante envers les donneurs de leçons.</td></tr><tr><th>S'il n'arrive rien</th><td>Reprend une excavation fragile sous pression hiérarchique.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Avant-bras couverts de poussière, marteau de mesure usé.</p><p><strong>Voix et comportement :</strong> Va droit au problème ; retape une pièce quand elle s’inquiète.</p><p><strong>Signe émotionnel :</strong> Serre si fort la mâchoire qu’elle interrompt sa propre phrase.</p>
            <blockquote><p><strong>Première réplique :</strong> « Une galerie ne tient pas debout avec des promesses. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Vous répareriez d’abord les galeries ou vous poursuivriez les voleurs ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des pièces de soutènement, et non des vivres, manquent en priorité.</td></tr><tr><th>Après échange, aide ou observation</th><td>Donne la liste exacte des cargaisons compromises et le nom de Rogha.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Elle ignore qui bénéficie réellement de l’avancement des travaux.</td></tr><tr><th>Il demande</th><td>Promesse de protéger les travailleurs et de ne pas interrompre tout le chantier sans preuve.</td></tr>
              <tr><th>Il peut proposer</th><td>Description des pièces volées, plan d’approvisionnement, appui des ouvriers.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Mettre ses ouvriers en danger pour satisfaire un supérieur.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Suspend un poste dangereux ; montre aux PJ l’organisation du chantier.</td></tr><tr><th>S'ils négocient</th><td>Consent à un retard mesuré contre un remplacement réaliste.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Fait escorter les PJ hors de la zone de travail.</td></tr><tr><th>S'ils l'ignorent</th><td>Reprend une excavation fragile sous pression hiérarchique.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z01-03. <strong>Relations / autres lieux :</strong> Lien logique vers Z03-05 et Rogha (Z01-01).</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z01-03 : amélioration de la sûreté ou aggravation du risque sous Orgrimmar.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
