    text:
      format: 1
      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Document maître évolutif — v0.2 (5 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>E. La piste et le point d’eau</h3><p>[ACQUIS / ENQUÊTE FACULTATIVE]  Après la ruée, une enquête peut remonter vers un point d’eau et suggérer que la panique n’était pas purement naturelle. Cette découverte n’est pas obligatoire pour poursuivre l’escorte.</p>\n<p style=\"margin-left:1em\">• Décisions ouvertes aux PJ — tous enquêtent et arrêtent le convoi ; groupe partagé et convoi arrêté ; enquête pendant que le convoi avance ; renoncement et départ.</p>\n<p style=\"margin-left:1em\">• Conséquences à reporter — retard certain si le convoi doit attendre ; exposition à un problème supplémentaire uniquement si le dispositif de protection le rend plausible ; degré d’information proportionnel aux investigations.</p>\n<p><small>À écrire / vérifier : description précise des indices et des restes rituels ; des paliers de temps sont proposés dans le module § 4 bis, à ajuster à la distance réelle.</small></p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.gQ9DSemaiBWIjW0r.JournalEntryPage.M3exRvSKspw29FSl]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.gQ9DSemaiBWIjW0r.JournalEntryPage.YOoj4KIMksPOn7Gd]{Garde-fou de continuité}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.fcZejQdm4u6iAZSe.JournalEntryPage.eWppQeTKF6MHRLF1]{Quatre dispositions possibles} \_ · \_ @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.zg0ZrdYd7H5Uc8gY.JournalEntryPage.4Z4q8B2PkX86MtE5]{← Scène précédente} \_ · \_ @UUID[JournalEntry.x3XLdzGIaU5xDuhh.JournalEntryPage.eR76EoKqNGdyiYQ7]{Scène suivante →}</p>"
