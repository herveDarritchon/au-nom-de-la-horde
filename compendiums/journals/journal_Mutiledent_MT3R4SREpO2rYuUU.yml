  - _id: HKx1sg5iuomxvY5M
    name: Personnalité, objectifs et manière de le jouer
    type: text
    sort: 300000
    flags: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Personnalité</h2>


        <p>Mutiledent ne supplie pas. Il négocie.</p>


        <p>Sa cage lui retire sa liberté, mais pas sa capacité à comprendre les
        rapports de force. Il sait que la Horde a besoin d’informations et que
        son savoir est désormais sa principale monnaie.</p>


        <h3>Traits de jeu</h3>

        <ul>
          <li><strong>Pragmatique :</strong> il traite avec ses ennemis si cela sert ses intérêts.</li>
          <li><strong>Rancunier :</strong> l’abandon par les siens est devenu une blessure politique et personnelle.</li>
          <li><strong>Manipulateur :</strong> il donne rarement une information sans obtenir quelque chose en échange.</li>
          <li><strong>Fier :</strong> il refuse d’être réduit au statut de prisonnier pitoyable.</li>
          <li><strong>Spirituel :</strong> sa connaissance d’Agamaggan et des Joyaux de sang est réelle et directement exploitable.</li>
        </ul>


        <h3>Ce qu’il veut maintenant</h3>

        <ol>
          <li>Survivre.</li>
          <li>Conserver une capacité d’action malgré sa captivité.</li>
          <li>Faire payer ceux qui l’ont abandonné.</li>
          <li>Utiliser les conflits entre Horde, Tranchecrins et Dos-hirsute à son avantage.</li>
        </ol>


        <h3>Ce qu’il ne veut pas</h3>

        <ul>
          <li>Être traité comme un informateur subalterne.</li>
          <li>Donner gratuitement tout ce qu’il sait.</li>
          <li>Voir les PJ confondre coopération ponctuelle et loyauté envers la Horde.</li>
        </ul>


        <h3>Interprétation à la table</h3>

        <p>Parle lentement, observe les PJ avant de répondre et laisse
        régulièrement entendre qu’il en sait davantage.</p>

        <p>Il peut volontairement répondre à une question par une autre : <em>«
        Pourquoi veux-tu savoir cela, Orc ? »</em></p>

        <p>Les phrases de jeu proposées dans cette page sont une
        <strong>adaptation Warbound</strong>, pas des citations du jeu
        vidéo.</p>
