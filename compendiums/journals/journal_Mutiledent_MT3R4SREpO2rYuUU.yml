  - _id: 0nn3UIPCwaJ91ufZ
    name: Canon, adaptation et sources
    type: text
    sort: 700000
    flags: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <h2>Canon et adaptation</h2>

        <h3>Canon Warcraft / WoW Classic</h3>
        <ul>
          <li>Mutiledent / Mangletooth est un Huran Tranchecrin.</li>
          <li>Il est retenu dans une cage au Camp Taurajo dans les Tarides.</li>
          <li>Il pousse d’abord la Horde à affaiblir les Dos-hirsute.</li>
          <li>Il se retourne ensuite contre Nak, Kuz et Lok Plaie-des-orcs après avoir été abandonné par les siens.</li>
          <li>Il connaît la magie des Joyaux de sang et les bénédictions d’Agamaggan.</li>
          <li>Il décrit les grandes zones de ronces comme des lieux sacrés pour les Hurans.</li>
        </ul>

        <h3>Adaptation Warbound</h3>
        <ul>
          <li>Mutiledent connaît personnellement une partie des Tranchecrins de Durotar.</li>
          <li>Il peut expliquer leurs motivations locales, une fois celles-ci définies dans la campagne.</li>
          <li>Il fonctionne comme intermédiaire culturel et informateur récurrent.</li>
          <li>Il peut devenir une pièce importante de la politique interne hurane si les PJ renforcent son influence.</li>
        </ul>

        <h3>À ne pas figer sans décision de campagne</h3>
        <ul>
          <li>Le nom exact du chef local des Tranchecrins de Durotar.</li>
          <li>Le lien hiérarchique précis entre ce chef et Mutiledent.</li>
          <li>La raison exacte de l’empiètement vers Tranchecolline.</li>
          <li>Le statut futur de Mutiledent après une éventuelle libération.</li>
        </ul>

        <h3>Sources de vérification</h3>
        <ul>
          <li><a href="https://www.wowhead.com/classic/fr/quest=878/tribus-en-guerre">Wowhead Classic — Tribus en guerre (878)</a></li>
          <li><a href="https://www.wowhead.com/classic/fr/quest=879/une-trahison-de-lint%C3%A9rieur">Wowhead Classic — Une trahison de l’intérieur (879)</a></li>
          <li><a href="https://www.wowhead.com/classic/fr/quest=5052/joyaux-de-sang-dagammagan">Wowhead Classic — Joyaux de sang d’Agammagan (5052)</a></li>
          <li><a href="https://www.wowhead.com/classic/fr/npc=3430/mangletooth">Wowhead Classic — Mangletooth (3430)</a></li>
        </ul>
