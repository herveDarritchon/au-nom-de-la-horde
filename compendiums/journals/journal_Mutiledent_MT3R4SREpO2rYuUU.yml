  - _id: 6zpJTv3Q7v3v2ddi
    name: Mutiledent — Vue d’ensemble
    type: text
    sort: 100000
    flags: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Mutiledent</h2>

        <p><em>Mangletooth — Huran Tranchecrin</em></p>


        <table>
          <tbody>
            <tr><th>Nom</th><td><strong>Mutiledent</strong> (Mangletooth)</td></tr>
            <tr><th>Peuple</th><td>Huran</td></tr>
            <tr><th>Tribu</th><td>Tranchecrins (Razormane)</td></tr>
            <tr><th>Lieu</th><td>Camp Taurajo, Tarides</td></tr>
            <tr><th>Situation</th><td>Prisonnier dans une cage, abandonné par une partie des siens</td></tr>
            <tr><th>Rôle</th><td>Mystique huran, informateur potentiel, manipulateur et intermédiaire culturel</td></tr>
            <tr><th>Disposition</th><td>Hostile à la Horde comme puissance, mais pragmatique avec les individus utiles</td></tr>
          </tbody>
        </table>


        <h3>En une phrase</h3>

        <p><strong>Mutiledent est un Tranchecrin emprisonné qui a encore assez
        de savoir, de rancune et de pouvoir rituel pour transformer sa cage en
        position de négociation.</strong></p>


        <h3>Pourquoi il est intéressant pour Warbound</h3>

        <p>Il permet de montrer que les Hurans ne sont pas seulement des
        adversaires occupant des camps : ils possèdent des rivalités tribales,
        une spiritualité, des lieux sacrés, une mémoire et une politique
        interne.</p>

        <p>Pour les PJ, Mutiledent peut devenir une source d’informations sur
        les Tranchecrins sans jamais devenir un allié docile.</p>
