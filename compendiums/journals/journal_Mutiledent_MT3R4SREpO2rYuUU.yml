  - _id: 1jfrvotEDzycTjFK
    name: Utilisation dans Au Nom de la Horde
    type: text
    sort: 600000
    flags: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Utilisation dans la campagne</h2>


        <p><strong>Recommandation :</strong> ne pas déplacer immédiatement
        Mutiledent à Durotar.</p>


        <p>Son emplacement canonique au <strong>Camp Taurajo</strong> est plus
        intéressant : il donne aux PJ une raison organique de sortir
        temporairement de Durotar lorsqu’ils veulent réellement comprendre les
        Tranchecrins.</p>


        <h3>Accroche</h3>

        <p>Lorsque les PJ commencent à chercher les raisons de l’empiètement
        Tranchecrin autour de Tranchecolline, un éclaireur, un Tauren ou un
        vétéran peut leur parler d’un prisonnier huran détenu plus au sud :</p>


        <blockquote>

        <p>« Il y en a un qui parlera. Il est en cage à Taurajo. Mais ne crois
        pas qu’il nous aime. »</p>

        </blockquote>


        <p><em>Cette réplique est une proposition Warbound.</em></p>


        <h3>Statut Warbound recommandé</h3>

        <p>Mutiledent connaît les groupes Tranchecrins présents à Durotar, mais
        <strong>il n’en est pas leur chef actuel</strong>.</p>


        <p>Il connaît certains de leurs responsables, leurs routes, leurs usages
        du terrain et une partie des raisons culturelles ou spirituelles de leur
        présence.</p>


        <p>Il n’a cependant plus aucune raison de protéger aveuglément ceux qui
        l’ont abandonné.</p>


        <h3>Fonctions possibles dans le bac à sable</h3>

        <ul>
          <li><strong>Informateur :</strong> il révèle progressivement l’organisation hurane.</li>
          <li><strong>Intermédiaire culturel :</strong> il explique ce que la Horde interprète mal.</li>
          <li><strong>Manipulateur :</strong> il utilise les PJ pour régler des comptes internes.</li>
          <li><strong>Source de rites :</strong> il peut reconnaître ou exploiter les Joyaux de sang.</li>
          <li><strong>Pont géographique :</strong> il relie naturellement Durotar aux Tarides.</li>
          <li><strong>Graine d’avenir :</strong> les PJ peuvent involontairement restaurer son influence chez les Tranchecrins.</li>
        </ul>


        <h3>Tension centrale</h3>

        <p>Mutiledent peut avoir raison sur la culture et les revendications de
        son peuple tout en étant parfaitement disposé à envoyer les PJ tuer ses
        propres rivaux.</p>


        <p>Les personnages doivent donc apprendre à distinguer <strong>ce qui
        est vrai dans ce qu’il raconte</strong> de <strong>ce qu’il cherche à
        leur faire faire avec cette vérité</strong>.</p>
      markdown: ''
