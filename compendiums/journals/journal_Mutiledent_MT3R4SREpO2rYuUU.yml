  - _id: hbCEz0X0BBRP2XJk
    name: Agamaggan, Joyaux de sang et spiritualité hurane
    type: text
    sort: 400000
    flags: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Agamaggan et les Joyaux de sang</h2>


        <p>Mutiledent connaît les secrets des <strong>Joyaux de sang
        d’Agamaggan</strong>, des pierres rouge sang que les Hurans utilisent
        comme totems et comme supports de leur magie.</p>


        <p>Il affirme que les tribus huranes se rassemblent dans les régions
        couvertes de ronces parce qu’elles sont <strong>sacrées</strong>. Dans
        cette tradition, les grandes zones de ronces sont associées au corps et
        à l’héritage d’<strong>Agamaggan</strong>, le grand Sanglier
        sauvage.</p>


        <h3>Ce que Mutiledent peut faire</h3>

        <p>Dans WoW Classic, il échange des Joyaux de sang contre différentes
        bénédictions d’Agamaggan, notamment liées à :</p>


        <ul>
          <li>la force ;</li>
          <li>l’agilité ;</li>
          <li>la sagesse ;</li>
          <li>l’esprit ;</li>
          <li>la vitesse ;</li>
          <li>une peau protectrice et hérissée.</li>
        </ul>


        <h3>Lecture Warbound</h3>

        <p>Pour la campagne, ce savoir permet de présenter Mutiledent comme un
        <strong>mystique huran compétent</strong>, sans devoir immédiatement lui
        attribuer un profil mécanique de chaman PJ.</p>


        <p>Il peut identifier des objets rituels, interpréter certaines marques
        territoriales, reconnaître les lieux considérés comme sacrés par les
        Hurans et expliquer pourquoi une terre que la Horde considère comme
        disponible peut être perçue tout autrement par les Tranchecrins.</p>
