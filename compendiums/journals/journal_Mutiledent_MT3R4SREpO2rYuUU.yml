  - _id: ssK1quyJJR7ZSAvE
    name: Situation canonique — WoW Classic
    type: text
    sort: 200000
    flags: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Situation canonique</h2>


        <p>À l’époque de <strong>World of Warcraft Classic</strong>, Mutiledent
        se trouve au <strong>Camp Taurajo</strong>, dans les Tarides, enfermé
        dans une cage.</p>


        <p>Il appartient aux <strong>Tranchecrins</strong>. Malgré sa captivité,
        il continue d’abord à chercher l’avantage de sa tribu : il pousse des
        aventuriers de la Horde à frapper les <strong>Dos-hirsute</strong>,
        rivaux des Tranchecrins.</p>


        <h3>Tribus en guerre</h3>

        <p>Mutiledent explique que les Tranchecrins et les Dos-hirsute sont deux
        tribus fortement liées à la terre et à la spiritualité. Il veut
        affaiblir les chefs spirituels Dos-hirsute afin que les Tranchecrins
        puissent prendre l’avantage.</p>


        <p>Mais une fois l’opération accomplie, son ressentiment éclate : sa
        propre tribu l’a laissé croupir dans sa cage et personne n’est venu le
        délivrer.</p>


        <h3>Une trahison de l’intérieur</h3>

        <p>Mutiledent livre ensuite les noms de trois membres importants de sa
        propre tribu : <strong>Nak</strong>, <strong>Kuz</strong> et <strong>Lok
        Plaie-des-orcs</strong>.</p>


        <ul>
          <li><strong>Nak</strong> : pisteur.</li>
          <li><strong>Kuz</strong> : lanceur de sorts.</li>
          <li><strong>Lok Plaie-des-orcs</strong> : guerrier et chef du groupe.</li>
        </ul>


        <p>Il demande leur élimination. Son retournement n’est donc pas une
        conversion à la cause de la Horde : c’est une vengeance contre ceux qui
        l’ont abandonné.</p>


        <h3>Point important</h3>

        <p><strong>Mutiledent n’est pas à traiter comme le chef des Tranchecrins
        de Durotar à cette époque.</strong> Le contenu Classic permet surtout de
        l’identifier comme un Tranchecrin influent, spirituellement compétent et
        très bien informé sur sa tribu.</p>
