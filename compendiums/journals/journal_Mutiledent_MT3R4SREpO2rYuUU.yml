  - _id: llqS9WQxR1yauSxe
    name: Ce qu’il sait sur les Hurans
    type: text
    sort: 500000
    flags: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Ce que Mutiledent sait</h2>


        <p>Mutiledent constitue une excellente source d’informations, mais il ne
        doit jamais fonctionner comme une encyclopédie automatique.</p>


        <h3>Informations qu’il peut raisonnablement posséder</h3>

        <ul>
          <li>Les rivalités entre <strong>Tranchecrins</strong> et <strong>Dos-hirsute</strong>.</li>
          <li>Le rôle des chefs spirituels, géomanciens et tisseurs d’épines.</li>
          <li>Les traditions et rituels associés à <strong>Agamaggan</strong>.</li>
          <li>L’utilisation des <strong>Joyaux de sang</strong>.</li>
          <li>Les habitudes de déplacement et de guerre de sa tribu.</li>
          <li>Les noms, fonctions et rivalités de certains Tranchecrins importants.</li>
          <li>La signification de certaines marques territoriales, totems ou amas de ronces aménagés.</li>
        </ul>


        <h3>Ce qu’il ne faut pas considérer comme automatiquement canonique</h3>

        <p>Le canon Classic ne détaille pas suffisamment l’organisation exacte
        des Tranchecrins présents dans les <strong>Terres des Tranchecrins de
        Durotar</strong>, ni leur relation personnelle avec Mutiledent.</p>


        <p>Les informations précises sur leurs chefs locaux, leurs objectifs
        immédiats et leur progression vers Tranchecolline doivent donc être
        établies par Warbound.</p>


        <h3>Principe de négociation</h3>

        <p>Une information importante doit avoir un prix : un service, une
        preuve, un Joyau de sang, la mort d’un rival, la transmission d’un
        message ou simplement une information que Mutiledent cherche
        lui-même.</p>


        <p>Plus les PJ lui donnent de leviers, plus il devient utile — et
        dangereux.</p>
      markdown: ''
