  - name: 03 • Accès et voyage
    type: text
    sort: 500000
    text:
      format: 1
      content: >-
        <h1>Accès, exploration et voyage Warbound V2</h1><p><strong>POI
        :</strong> Z03-05 — Route de matériaux, carrières et caches |
        <strong>Catégorie :</strong> a_definir</p><p><em>Compléter les champs
        entre crochets. Cette fiche est réservée au MJ. Elle n’impose pas de
        scène ni de jet supplémentaire.</em></p><p><strong>Attention spécifique
        :</strong> Localisation et raccords routiers non fixés ; noter comment
        les PJ pourront repérer ce site.</p><table><tbody><tr><th>Zone /
        liaison</th><td>[Z03 ; route Rxx ou RX-xx à renseigner, si
        existante]</td></tr><tr><th>Connaissance PJ</th><td>[inconnu / repéré /
        connu / maîtrisé]</td></tr><tr><th>Accessibilité</th><td>[ouvert /
        conditionnel / bloqué / caché ; condition]</td></tr><tr><th>Approches et
        alternatives</th><td>[Départ, arrivée, choix de rapidité / sûreté /
        discrétion]</td></tr><tr><th>Terrain par tronçon</th><td>[route / hors
        piste ÷2 / difficile ÷2 / hors piste ET difficile
        ÷4]</td></tr><tr><th>Distance / temps</th><td>[à calibrer — aucune
        distance déduite du MMO]</td></tr><tr><th>Danger du
        trajet</th><td>[catégorie COF2, DD, DM ; décidés avant jet selon
        itinéraire effectif]</td></tr><tr><th>Eau / chasse /
        pêche</th><td>[Ressources locales plausibles, accès, enjeu si
        scène]</td></tr><tr><th>Bivouac</th><td>[Abri, sécurité, conditions de
        récupération COF2]</td></tr><tr><th>Indices pour l’Éclaireur</th><td>[2
        observations utiles]</td></tr><tr><th>Choix de préparation du
        Guide</th><td>[exploration / endurance / bivouac /
        ravitaillement]</td></tr></tbody></table><h2>Quand lancer les dés
        ?</h2><p>Pas de jet supplémentaire pour entrer dans le POI ni à chaque
        frontière. Pour une journée de voyage significative : <strong>Guide INT
        (Survie) en premier</strong>, puis <strong>Éclaireur PER
        (Survie)</strong> et <strong>Voyageurs CON (Survie)</strong>, un seul
        test de progression par PJ. Résultat collectif, DR, événements et repos
        : COF2.</p><p><strong>Préparation du Guide :</strong> le dé bonus ciblé
        sur un test pertinent après réussite est un paramètre Warbound V2 <em>à
        tester</em>, pas une nouvelle règle automatique de
        déplacement.</p><h2>Critiques et découvertes</h2><p><strong>20 naturel
        du Guide :</strong> le joueur propose et raconte une opportunité locale
        plausible (piste, abri, eau, observation). Le MJ arbitre la cohérence et
        enregistre la découverte durable (D-Zxx-nnn). Une découverte peut être
        repérée mais non atteinte.</p><p><strong>1 naturel du Guide :</strong>
        le MJ peut contextualiser l’échec par une complication ; pas de deuxième
        rencontre ni malus systématique.</p><p><strong>Donjon :</strong> une
        fois l’entrée atteinte, se référer à sa fiche d’exploration propre ; ne
        pas confondre la DD du voyage et celle du donjon.</p><h2>Après la
        scène</h2><p>Mettre à jour la page « Suivi MJ » déjà présente :
        connaissance, accès, pression, transformation, évolution si les PJ
        reviennent.</p>
