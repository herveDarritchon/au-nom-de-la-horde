    text:
      format: 1
      content: |-
        <h1>PNJ — Tarka le Porte-Corde</h1>
            <p><strong>ID :</strong> PNJ-Z03-05-01 · <strong>POI :</strong> Z03-05 · <strong>Zone :</strong> Z03</p>
            <p><strong>Origine / statut :</strong> Original Warbound — identité clandestine</p>
            <p><strong>Fonction :</strong> Messager transportant des outils entre caches mouvantes · <strong>Faction / allégeance réelle (MJ) :</strong> Cercle de la Pierre Brisée (secret) ; apparence de porteur indépendant</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Déplacer le matériel pris avant l’arrivée d’une patrouille.</td></tr><tr><th>Motivation profonde</th><td>Il est convaincu que les forages menacent les ouvriers de la Horde.</td></tr><tr><th>Obstacle</th><td>Il ne peut révéler l’objectif du Cercle sans exposer d’autres membres.</td></tr>
              <tr><th>Ligne rouge</th><td>Blesser un membre de la Horde pour protéger une caisse.</td></tr><tr><th>Peut offrir</th><td>Indices matériels, avertissement sur un chantier dangereux, rencontre indirecte.</td></tr><tr><th>En échange</th><td>Garanties de non-violence et confidentialité.</td></tr>
              <tr><th>Attitude initiale</th><td>Sourcilleux sur les termes « voleur » et « traître ».</td></tr><tr><th>S'il n'arrive rien</th><td>Transfère le stock vers une autre cache ; une piste se refroidit.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Une corde trop neuve sur un sac très usé.</p><p><strong>Voix et comportement :</strong> Répond aux accusations par une question.</p><p><strong>Signe émotionnel :</strong> Ses mains agrippent la corde quand on dit « traître ».</p>
            <blockquote><p><strong>Première réplique :</strong> « Tout matériel volé est-il forcément utilisé contre la Horde ? »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Et si quelqu’un cherchait à vous empêcher de creuser ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Ses sacs contiennent des pièces de forage et non des vivres.</td></tr><tr><th>Après échange, aide ou observation</th><td>Une cache a été vidée dans l’urgence ; une preuve de danger sous Orgrimmar est évoquée.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Sait le but général du Cercle, pas toute sa direction ; aucune révélation automatique du chaman renégat.</td></tr><tr><th>Il demande</th><td>Garanties de non-violence et confidentialité.</td></tr>
              <tr><th>Il peut proposer</th><td>Indices matériels, avertissement sur un chantier dangereux, rencontre indirecte.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Blesser un membre de la Horde pour protéger une caisse.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Laisse une preuve partielle et s’éloigne sans combat.</td></tr><tr><th>S'ils négocient</th><td>Organise un contact différé, sous condition de sûreté.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Abandonne sa cargaison pour éviter un affrontement létal.</td></tr><tr><th>S'ils l'ignorent</th><td>Transfère le stock vers une autre cache ; une piste se refroidit.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z03-05. <strong>Relations / autres lieux :</strong> Lien possible avec Dara Z01-03 ; non confirmation du réseau sans enquête.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z03-05 : cache découverte, coopération naissante ou malentendu durable avec les autorités.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
