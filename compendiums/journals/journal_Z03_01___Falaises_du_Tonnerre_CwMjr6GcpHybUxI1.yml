  - name: 04 • PNJ — Rokha des Crêtes
    type: text
    sort: 400000
    ownership:
      default: 0
      TjbWhMczNyKieD8D: 3
    text:
      format: 1
      content: |-
        <h1>PNJ — Rokha des Crêtes</h1>
            <p><strong>ID :</strong> PNJ-Z03-01-01 · <strong>POI :</strong> Z03-01 · <strong>Zone :</strong> Z03</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Chasseuse et pisteuse des abords des Falaises du Tonnerre · <strong>Faction / allégeance réelle (MJ) :</strong> Horde locale, indépendante dans ses choix</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Retrouver une bête qui évite depuis peu les points d’eau habituels.</td></tr><tr><th>Motivation profonde</th><td>Elle craint une perturbation durable de la faune.</td></tr><tr><th>Obstacle</th><td>La piste animale croise une voie logistique surveillée.</td></tr>
              <tr><th>Ligne rouge</th><td>Accuser les chasseurs sans preuve.</td></tr><tr><th>Peut offrir</th><td>Observation de terrain, abri connu, guidage ponctuel.</td></tr><tr><th>En échange</th><td>Respect de la piste et attention aux traces plutôt qu’aux trophées.</td></tr>
              <tr><th>Attitude initiale</th><td>Sobre, jauge les gestes plus que les paroles.</td></tr><tr><th>S'il n'arrive rien</th><td>Poursuit la recherche et risque de croiser une cache déplacée.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Griffure ancienne sur l’avant-bras, arc enveloppé contre le sable.</p><p><strong>Voix et comportement :</strong> Imite un bref sifflement animal pour ponctuer son propos.</p><p><strong>Signe émotionnel :</strong> Cesse de siffler dès qu’on évoque un animal blessé.</p>
            <blockquote><p><strong>Première réplique :</strong> « Quand les bêtes fuient le ravin, les chariots devraient écouter. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Suivez-vous d’abord les roues ou les traces ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>La faune délaisse un ravin pourtant habituellement fréquenté.</td></tr><tr><th>Après échange, aide ou observation</th><td>Sépare traces naturelles et passage d’un petit groupe de porteurs.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Elle ne sait pas qui a organisé les vols de matériel.</td></tr><tr><th>Il demande</th><td>Respect de la piste et attention aux traces plutôt qu’aux trophées.</td></tr>
              <tr><th>Il peut proposer</th><td>Observation de terrain, abri connu, guidage ponctuel.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Accuser les chasseurs sans preuve.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Montre une traversée plus stable, sans raccourci chiffré automatique.</td></tr><tr><th>S'ils négocient</th><td>Partage un indice contre l’engagement de ne pas massacrer les bêtes.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Retire sa confiance et suit seule la piste.</td></tr><tr><th>S'ils l'ignorent</th><td>Poursuit la recherche et risque de croiser une cache déplacée.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z03-01. <strong>Relations / autres lieux :</strong> Liaison R04 ; connaissance locale sans succès COF2 automatique.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z03 : nouvelles observations, refuge révélé, piste qui change d’état.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
