  - sort: 200000
    name: Relations avec les PJ
    type: text
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Observer avec elle, partager
        des techniques, respecter une information même si elle ne donne pas
        immédiatement un combat.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Tuer pour le spectacle,
        ignorer volontairement ce que le terrain montre, ridiculiser sa
        prudence.</p>

        <h2>Liens personnels possibles</h2>

        <h3>Apprentissage réciproque</h3><p>Elle peut enseigner le pistage à un
        PJ ou demander à un chasseur PJ de lui apprendre quelque
        chose.</p><h3>Sarkoth</h3><p>Elle peut être la première à remarquer que
        Sarkoth défend un territoire, sans demander aux PJ de
        l'épargner.</p><h2>S'il devient un allié</h2><p>Éclaireuse, chasseuse,
        source d'informations sur la faune et potentielle amie de
        terrain.</p><h2>S'il devient hostile</h2><p>Plus qu'ennemie, elle peut
        perdre tout respect pour un PJ qui chasse uniquement pour sa gloire.</p>
