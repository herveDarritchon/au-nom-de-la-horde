      content: >-
        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Elle interrompt une discussion sur
        Sarkoth pour demander aux autres pourquoi ses traces ne dépassent jamais
        certaines limites naturelles.</p>

        <h2>Évolution hors champ</h2><p>Elle prépare puis accomplit sa première
        sortie solitaire. Les PJ peuvent ensuite découvrir qu'elle a appliqué —
        ou rejeté — leurs conseils.</p>

