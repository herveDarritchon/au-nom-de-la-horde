      content: >-
        <h1>Morka</h1>

        <blockquote><p><strong>[ADAPTATION WARBAND]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Contrepoint à la culture de l'exploit.
        Elle aime la chasse mais considère que comprendre une bête est plus
        difficile que la tuer.</p>

        <h2>Présence</h2><p>Jeune chasseuse en devenir, arc ou lance de chasse,
        posture attentive et équipement léger.</p>

        <h2>Voix et répliques</h2><ul><li>« Elle ne chasse pas. Elle garde
        quelque chose. »</li><li>« Regarde avant de tirer. »</li></ul>

        <h2>Veut</h2><p>Pouvoir traverser Durotar seule.</p>

        <h2>Craint</h2><ul><li>être poussée à tuer uniquement pour impressionner
        les autres</li><li>confondre bravoure et ignorance</li></ul>
