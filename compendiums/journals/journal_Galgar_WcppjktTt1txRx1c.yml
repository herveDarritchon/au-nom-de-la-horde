      content: >-
        <h1>Galgar</h1>

        <blockquote><p><strong>[CANON] lié aux pommes de cactus ; développement
        [ADAPTATION]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Une personne et un endroit où il fait
        simplement bon revenir. Sa valeur est affective avant d'être
        utilitaire.</p>

        <h2>Présence</h2><p>Orc d'âge mûr, peau vert mousse, cheveux bruns
        éclaircis par le soleil, grand panier, louche, marmite et couteaux de
        cuisine.</p>

        <h2>Voix et répliques</h2><ul><li>« Tu peux raconter après. Mange
        d'abord. »</li><li>« T'es empoisonné ou tu n'aimes juste pas ma sauce ?
        Parce que c'est pas pareil. »</li></ul>

        <h2>Veut</h2><p>Que les gens mangent et reconnaissent que sa recette est
        la meilleure de Durotar.</p>

        <h2>Craint</h2><ul><li>que son hospitalité soit utilisée pour nuire à
        quelqu'un</li><li>voir les jeunes partir sans rien dans le
        ventre</li></ul>
