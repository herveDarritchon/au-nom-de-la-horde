        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Galgar fait goûter une recette trop
        épicée ; Hana'zua prétend qu'elle ne l'est pas assez, Korga accepte le
        défi et Thazz'rill veut juste manger.</p>

        <h2>Évolution hors champ</h2><p>Il baptise une recette du nom d'un PJ ou
        se souvient exactement de ce que chacun aime quand ils reviennent
        plusieurs séances plus tard.</p>

