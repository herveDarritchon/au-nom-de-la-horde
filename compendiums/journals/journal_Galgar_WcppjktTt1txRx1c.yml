      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Manger ; aider ; critiquer
        honnêtement une recette ; rapporter un ingrédient inhabituel ; surtout
        revenir.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Utiliser son hospitalité
        pour piéger quelqu'un, mettre volontairement ses clients en danger ou
        voler dans ses réserves.</p>

        <h2>Liens personnels possibles</h2>

        <h3>Le bol réservé</h3><p>Galgar sert toujours le même PJ dans le même
        bol. Un jour, le bol n'est plus là : la rupture d'habitude signale
        immédiatement un problème.</p><h3>Le plat du retour</h3><p>« Quand vous
        reviendrez, je vous fais quelque chose de correct. » Plusieurs séances
        plus tard, il tient parole.</p><h2>S'il devient un allié</h2><p>Refuge
        social, rumeurs, repas, témoin des présences et absences, lieu naturel
        où les PNJ se croisent.</p><h2>S'il devient hostile</h2><p>Il n'est pas
        conçu comme grand antagoniste, mais peut être profondément blessé par
        une trahison de son hospitalité.</p>
