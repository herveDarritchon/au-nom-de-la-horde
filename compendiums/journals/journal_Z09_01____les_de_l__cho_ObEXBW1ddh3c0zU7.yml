      content: |-
        <h1>PNJ — Sazu Lien-Brisé</h1>
            <p><strong>ID :</strong> PNJ-Z09-01-02 · <strong>POI :</strong> Z09-01 · <strong>Zone :</strong> Z09</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Troll soumis au rituel qui cherche à parler librement · <strong>Faction / allégeance réelle (MJ) :</strong> Sombrelances sous contrainte de Zalazane</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Faire passer un message aux siens sans attirer l’attention.</td></tr><tr><th>Motivation profonde</th><td>Elle veut retrouver sa volonté et celle de sa sœur.</td></tr><tr><th>Obstacle</th><td>Des moments de lucidité alternent avec l’emprise rituelle.</td></tr>
              <tr><th>Ligne rouge</th><td>Conduire des étrangers à une cache où des captifs seront massacrés.</td></tr><tr><th>Peut offrir</th><td>Indice sur un rituel, signe de reconnaissance, chemin surveillé.</td></tr><tr><th>En échange</th><td>Protection de sa sœur et prise en compte de son état changeant.</td></tr>
              <tr><th>Attitude initiale</th><td>Inconstante en apparence, épuisée.</td></tr><tr><th>S'il n'arrive rien</th><td>Tente de fuir seule ; risque d’être reprise.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Bande de tissu sombrelance délavée au poignet.</p><p><strong>Voix et comportement :</strong> Sa voix se brise sur certains noms.</p><p><strong>Signe émotionnel :</strong> Serre le tissu de son poignet quand un souvenir remonte.</p>
            <blockquote><p><strong>Première réplique :</strong> « Si je vous oublie demain, souvenez-vous pour moi. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Pouvez-vous aider quelqu’un qui vous repoussera peut-être ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Son comportement change près d’un lieu de pouvoir.</td></tr><tr><th>Après échange, aide ou observation</th><td>Elle peut décrire des gestes qui précèdent une prise de contrôle.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ne connaît pas nécessairement le lien Zalazane–Kolkar ; ses souvenirs sont fragmentaires.</td></tr><tr><th>Il demande</th><td>Protection de sa sœur et prise en compte de son état changeant.</td></tr>
              <tr><th>Il peut proposer</th><td>Indice sur un rituel, signe de reconnaissance, chemin surveillé.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Conduire des étrangers à une cache où des captifs seront massacrés.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Indique un lieu de repli si sa sœur est incluse.</td></tr><tr><th>S'ils négocient</th><td>Négocie un signe permettant aux PJ de la reconnaître lors d’une crise.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Alerte involontairement des gardes sous influence.</td></tr><tr><th>S'ils l'ignorent</th><td>Tente de fuir seule ; risque d’être reprise.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z09-01. <strong>Relations / autres lieux :</strong> Ne pas représenter tous les trolls insulaires comme des ennemis volontaires.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z09 : témoin sauvé, accès vers un site rituel ou alerte accrue.</p>
