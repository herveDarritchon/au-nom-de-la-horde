        <h1>Îles de l'Écho</h1>

        <p><strong>Identifiant :</strong> Z09-01</p>

        <p><strong>Zone géographique :</strong> Z09 — Îles de l’Écho</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Extension</p>

        <h2>Fonction dans la campagne</h2>

        <p>Archipel contrôlé par Zalazane ; extension sombrelance.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Extension conditionnelle du
        pointcrawl.</p>

        <p><strong>Repère géographique :</strong> Archipel au large du sud de
        Durotar, où des trolls vivent sous domination ou sous contrainte.</p>

        <p><strong>Factions et influences :</strong> Zalazane et ses partisans ;
        Sombrelances (revendication et perspective de reconquête).</p>

        <p><strong>Références et réserves :</strong> [PC] [FAC]</p>

        <p><em>Les lieux de débarquement et les sites rituels sont à localiser ;
        aucun temps de traversée maritime n’est fixé dans l’atlas.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
