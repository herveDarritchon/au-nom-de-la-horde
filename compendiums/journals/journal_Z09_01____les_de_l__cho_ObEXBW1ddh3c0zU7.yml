    text:
      format: 1
      content: |-
        <h1>PNJ — Zalazane</h1>
            <p><strong>ID :</strong> PNJ-Z09-01-01 · <strong>POI :</strong> Z09-01 · <strong>Zone :</strong> Z09</p>
            <p><strong>Origine / statut :</strong> Classic — antagoniste de l’archipel</p>
            <p><strong>Fonction :</strong> Sorcier-docteur dominant les Îles de l’Écho · <strong>Faction / allégeance réelle (MJ) :</strong> Partisans de Zalazane ; emprise sur des trolls soumis</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Empêcher une tête de pont sombrelance sur les îles.</td></tr><tr><th>Motivation profonde</th><td>Il refuse de perdre son pouvoir sur l’archipel.</td></tr><tr><th>Obstacle</th><td>Tous ses partisans ne lui obéissent pas librement.</td></tr>
              <tr><th>Ligne rouge</th><td>Libérer volontairement ses sujets au premier ultimatum.</td></tr><tr><th>Peut offrir</th><td>Sursis, marché mensonger, vérité partielle sur un rituel local.</td></tr><tr><th>En échange</th><td>Retrait de la présence sombrelance ou engagement compromettant.</td></tr>
              <tr><th>Attitude initiale</th><td>Mielleux quand il peut manipuler ; cruel si son contrôle échappe.</td></tr><tr><th>S'il n'arrive rien</th><td>Renforce les défenses et accentue la pression indirecte sur Sen’jin.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Ornements rituels couverts de fils et de petits os.</p><p><strong>Voix et comportement :</strong> Rit avant d’énoncer ses conditions.</p><p><strong>Signe émotionnel :</strong> Son rire cesse net lorsqu’un captif résiste à son emprise.</p>
            <blockquote><p><strong>Première réplique :</strong> « Chaque île a besoin d’un maître. Vous en cherchez un autre ? »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Combien de proches sacrifierez-vous pour reprendre ces rivages ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des trolls semblent exécuter des ordres malgré leur peur.</td></tr><tr><th>Après échange, aide ou observation</th><td>Une faiblesse dans un contrôle rituel peut permettre une libération partielle.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>MJ : soutient secrètement les raids Kolkar pour immobiliser Sen’jin ; il ne commande pas les Kolkar comme des soldats.</td></tr><tr><th>Il demande</th><td>Retrait de la présence sombrelance ou engagement compromettant.</td></tr>
              <tr><th>Il peut proposer</th><td>Sursis, marché mensonger, vérité partielle sur un rituel local.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Libérer volontairement ses sujets au premier ultimatum.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Tente de gagner du temps avec une promesse ciblée.</td></tr><tr><th>S'ils négocient</th><td>Accepte un échange qui le renforce politiquement.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Déplace une partie de ses partisans vers un lieu rituel.</td></tr><tr><th>S'ils l'ignorent</th><td>Renforce les défenses et accentue la pression indirecte sur Sen’jin.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z09-01. <strong>Relations / autres lieux :</strong> Présence au POI principal ou lors de scène majeure ; ne pas l’imposer au premier débarquement.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z09/Z07/Z08 : emprise affaiblie, libération, fortification ou raid détourné.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
