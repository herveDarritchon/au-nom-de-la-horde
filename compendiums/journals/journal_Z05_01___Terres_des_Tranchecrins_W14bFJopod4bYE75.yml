    text:
      format: 1
      content: |-
        <h1>PNJ — Mutiledent</h1>
            <p><strong>ID :</strong> PNJ-Z05-01-01 · <strong>POI :</strong> Z05-01 · <strong>Zone :</strong> Z05</p>
            <p><strong>Origine / statut :</strong> Classic — implantation à Durotar : adaptation Warbound</p>
            <p><strong>Fonction :</strong> Porte-parole d’un courant pragmatique tranchecrin · <strong>Faction / allégeance réelle (MJ) :</strong> Tranchecrins — courant traditionaliste</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Faire reconnaître une limite de territoire avant un nouveau raid.</td></tr><tr><th>Motivation profonde</th><td>Il veut préserver la communauté sans guerre interminable.</td></tr><tr><th>Obstacle</th><td>Il est accusé de trahison par les guerriers.</td></tr>
              <tr><th>Ligne rouge</th><td>Accepter la domination permanente de la Horde.</td></tr><tr><th>Peut offrir</th><td>Entretien, trêve de passage, droit de négocier l’eau, accès conditionnel.</td></tr><tr><th>En échange</th><td>Respect d’une frontière et libération d’un captif.</td></tr>
              <tr><th>Attitude initiale</th><td>Froid, pas hostile sans raison.</td></tr><tr><th>S'il n'arrive rien</th><td>Les guerriers occupent la scène politique et relancent les raids.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Talisman de ronces entouré de fibres anciennes.</p><p><strong>Voix et comportement :</strong> Parle lentement, compte les silences.</p><p><strong>Signe émotionnel :</strong> Un muscle de sa mâchoire saute lorsqu’on évoque une soumission.</p>
            <blockquote><p><strong>Première réplique :</strong> « La paix d’un jour ne vaut rien si vous prenez notre source demain. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Quelle limite accepteriez-vous aussi chez vous ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Les familles ont quitté une galerie disputée.</td></tr><tr><th>Après échange, aide ou observation</th><td>Peut révéler une dissension interne et une ressource partagée.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Il ne soutient pas la Horde ; il pourrait livrer un rival si cela protège son peuple.</td></tr><tr><th>Il demande</th><td>Respect d’une frontière et libération d’un captif.</td></tr>
              <tr><th>Il peut proposer</th><td>Entretien, trêve de passage, droit de négocier l’eau, accès conditionnel.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Accepter la domination permanente de la Horde.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Autorise une discussion avec un ancien local.</td></tr><tr><th>S'ils négocient</th><td>Propose une trêve assortie d’un repère territorial vérifiable.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Coupe le dialogue mais protège les non-combattants.</td></tr><tr><th>S'ils l'ignorent</th><td>Les guerriers occupent la scène politique et relancent les raids.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z05-01. <strong>Relations / autres lieux :</strong> Rival du courant Lok/Nak/Kuz ; déplacement depuis le matériau des Tarides explicitement Warbound.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z05/R02/R08 : corridor négocié, tension réduite ou fracture ravivée.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
