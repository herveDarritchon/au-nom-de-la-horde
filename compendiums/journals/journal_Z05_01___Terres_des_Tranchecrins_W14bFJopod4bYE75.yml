        <h1>PNJ — Lok Plaie-des-orcs</h1>
            <p><strong>ID :</strong> PNJ-Z05-01-02 · <strong>POI :</strong> Z05-01 · <strong>Zone :</strong> Z05</p>
            <p><strong>Origine / statut :</strong> Classic — rôle à Durotar : adaptation Warbound</p>
            <p><strong>Fonction :</strong> Chef visible des guerriers tranchecrins · <strong>Faction / allégeance réelle (MJ) :</strong> Tranchecrins — courant guerrier</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Préparer une démonstration de force sur une route contestée.</td></tr><tr><th>Motivation profonde</th><td>Il croit qu’attendre signifie disparaître.</td></tr><tr><th>Obstacle</th><td>Une partie des familles juge ses raids coûteux.</td></tr>
              <tr><th>Ligne rouge</th><td>Laisser une colonne de la Horde traverser sans contrepartie.</td></tr><tr><th>Peut offrir</th><td>Trêve de quelques heures, échange de captifs, défi formel.</td></tr><tr><th>En échange</th><td>Retrait de la Horde d’un point contesté.</td></tr>
              <tr><th>Attitude initiale</th><td>Hostile à l’autorité de la Horde ; respecte la fermeté.</td></tr><tr><th>S'il n'arrive rien</th><td>Lance un raid symbolique qui peut devenir incontrôlable.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Épaulière de bois incrustée d’épines rompues.</p><p><strong>Voix et comportement :</strong> Répond par des phrases courtes, fixe les armes.</p><p><strong>Signe émotionnel :</strong> Frappe le sol d’un sabot lorsqu’un guerrier met sa loyauté en doute.</p>
            <blockquote><p><strong>Première réplique :</strong> « Ce sentier portait nos marques avant vos chariots. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Qui vous autorise à tracer une route ici ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des guetteurs protègent l’accès d’un point d’eau.</td></tr><tr><th>Après échange, aide ou observation</th><td>Reconnaît la pression sur les ressources et des familles affamées.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ignore la cause exacte des perturbations du sol et refuse de montrer sa faiblesse.</td></tr><tr><th>Il demande</th><td>Retrait de la Horde d’un point contesté.</td></tr>
              <tr><th>Il peut proposer</th><td>Trêve de quelques heures, échange de captifs, défi formel.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Laisser une colonne de la Horde traverser sans contrepartie.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Suspens un raid contre un retrait immédiatement vérifiable.</td></tr><tr><th>S'ils négocient</th><td>Accepte un échange de personnes mais pas une soumission.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Mobilise ses guerriers et coupe une liaison.</td></tr><tr><th>S'ils l'ignorent</th><td>Lance un raid symbolique qui peut devenir incontrôlable.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z05-01. <strong>Relations / autres lieux :</strong> Nak et Kuz dans son courant ; antagoniste de Mutiledent.</p>
