  - _id: 953c5145ec142450
    name: Portrait de la Mère rouge
    type: text
    sort: 100000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h1>Sarkoth — La Mère rouge</h1>

        <h2>Rencontre — Vallée des Épreuves</h2>

        <blockquote>

        <p><strong>Lieu :</strong> plateau rocheux au sud de la Vallée des
        Épreuves, Durotar<br>

        <strong>Créature :</strong> scorpide ancestral, matriarche des scorpides
        du secteur<br>

        <strong>Autres noms :</strong> la Mère rouge, l’Ancienne de la
        Vallée<br>

        <strong>État actuel :</strong> blessure récente à la pince droite ;
        comportement défensif accentué<br>

        <strong>Danger :</strong> pinces puissantes, aiguillon venimeux, terrain
        escarpé<br>

        <strong>Personnes concernées :</strong> Hana’zua, Gornek, les péons et
        les chasseurs de la vallée</p>

        </blockquote>

        <hr>

        <h2>Une présence ancienne</h2>

        <p>Sarkoth est une immense femelle scorpide aux écailles rouge sombre,
        parcourues de plaques noircies, de rayures et d’entailles anciennes. Sa
        carapace épaisse, son poids et ses gestes économes la distinguent des
        scorpides ordinaires. Elle ne gaspille pas son énergie dans des
        poursuites inutiles et connaît chaque abri du plateau.</p>

        <p>La Mère rouge a survécu à de nombreuses sécheresses. Plusieurs
        générations de scorpides du sud de Durotar descendent d’elle. Les plus
        jeunes utilisent les mêmes abris, suivent parfois ses pistes et
        s’écartent de son chemin. Sarkoth ne leur donne pas d’ordres : sa
        présence suffit à organiser les territoires de chasse et de
        reproduction.</p>

        <p>Certains chasseurs la considèrent comme la plus dangereuse des bêtes
        de la vallée. Des guérisseurs et des Sombrelances connaissent son
        ancienneté et la valeur de son venin. Les péons et les recrues, eux,
        redoutent surtout ses apparitions à proximité des chemins.</p>
