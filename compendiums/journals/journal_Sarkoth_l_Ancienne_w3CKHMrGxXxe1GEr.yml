    text:
      format: 1
      content: |-
        <h2>Repères immédiats</h2>
        <table>
        <thead>
        <tr>
        <th></th>
        <th></th>
        </tr>
        </thead>
        <tbody>
        <tr>
        <td><strong>Où la trouver</strong></td>
        <td>Plateau rocheux, au sud de la Vallée des Épreuves</td>
        </tr>
        <tr>
        <td><strong>Ce qu’elle cherche</strong></td>
        <td>Rejoindre son site de ponte condamné</td>
        </tr>
        <tr>
        <td><strong>Ce qui la gêne</strong></td>
        <td>Passage obstrué, pince droite blessée</td>
        </tr>
        <tr>
        <td><strong>Ce qu’elle protège</strong></td>
        <td>Son refuge et sa descendance</td>
        </tr>
        <tr>
        <td><strong>Quand elle attaque</strong></td>
        <td>Intrusion persistante, encerclement, menace contre ses jeunes</td>
        </tr>
        <tr>
        <td><strong>Quand elle laisse partir</strong></td>
        <td>Les intrus quittent le secteur sensible</td>
        </tr>
        <tr>
        <td><strong>Ce qui peut l’apaiser</strong></td>
        <td>Distance, nourriture, gestes réguliers, accès dégagé</td>
        </tr>
        <tr>
        <td><strong>Ce qu’on peut obtenir</strong></td>
        <td>Venin frais, accès à son territoire, tolérance progressive</td>
        </tr>
        <tr>
        <td><strong>Danger principal</strong></td>
        <td>Pince valide, aiguillon, poison et rochers difficiles</td>
        </tr>
        <tr>
        <td><strong>Si elle meurt</strong></td>
        <td>Le territoire des scorpides devient instable</td>
        </tr>
        </tbody>
        </table>
