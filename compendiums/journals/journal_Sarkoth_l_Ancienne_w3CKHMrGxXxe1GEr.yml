  - _id: 04c0d523082a4402
    name: Réactions des habitants
    type: text
    sort: 500000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Réactions des habitants</h2>

        <p><strong>Hana’zua</strong> considère Sarkoth comme l’adversaire qui a
        failli le tuer. Blessé et profondément atteint dans sa fierté, il peut
        demander que sa mort soit vengée. Il ignore la raison des déplacements
        de la matriarche.</p>

        <p><strong>Gornek</strong> veut préserver la sécurité des recrues et
        sauver Hana’zua. S’il estime que Sarkoth demeure une menace
        incontrôlable, il peut envoyer des chasseurs. Il peut aussi accepter
        qu’on rétablisse un passage naturel si cela éloigne durablement la bête
        de la route.</p>

        <p><strong>Les péons</strong> ont condamné la fissure sans connaître son
        importance. Ils souhaitent conserver une piste praticable et redoutent
        de devoir défaire les travaux réalisés.</p>

        <p><strong>Certains chasseurs et guérisseurs Sombrelance</strong>
        connaissent le nom de la Mère rouge. Ils peuvent conseiller la prudence,
        rappeler le rôle de la vieille femelle dans le secteur ou chercher à
        préserver une source rare de venin.</p>

        <p><strong>Les voyageurs et marchands</strong> s'intéressent surtout aux
        détours, aux attaques et à la valeur supposée du venin. Des récits
        exagérés peuvent attirer des chasseurs opportunistes.</p>

        <hr>
