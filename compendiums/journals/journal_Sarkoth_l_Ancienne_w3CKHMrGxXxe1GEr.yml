  - _id: fb87eac167b1682e
    name: Blessure, réactions et indices
    type: text
    sort: 300000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Une bête blessée</h2>

        <p>Hana’zua a affronté Sarkoth en espérant prouver sa valeur. Il lui a
        porté un coup de hache qui a profondément entaillé la pince droite.
        Sarkoth lui a saisi la jambe, puis l’a piqué à la poitrine avec son
        aiguillon. Hana’zua est parvenu à s’éloigner, mais il est resté
        grièvement blessé et empoisonné, incapable de rejoindre seul
        l’Antre.</p>

        <p>Sarkoth ne cherche pas à se venger de Hana’zua. Elle associe
        cependant les humanoïdes armés à une menace et réagit plus vivement
        depuis son combat. Sa pince blessée la gêne pour capturer ses proies ;
        elle compense avec sa pince valide et son aiguillon.</p>

        <p>Son objectif reste inchangé : <strong>rouvrir l’accès à son refuge et
        préserver ses jeunes</strong>.</p>

        <h3>Réactions de Sarkoth</h3>

        <table>

        <thead>

        <tr>

        <th>Ce que font les personnages</th>

        <th>Réaction de Sarkoth</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Ils passent au loin sans approcher de la fissure.</td>

        <td>Elle les observe et garde ses distances.</td>

        </tr>

        <tr>

        <td>Ils avancent lentement dans sa direction.</td>

        <td>Elle se redresse, claque sa pince et lève l’aiguillon.</td>

        </tr>

        <tr>

        <td>Ils reculent après ses menaces.</td>

        <td>Elle ne les poursuit pas longtemps.</td>

        </tr>

        <tr>

        <td>Ils tentent de toucher sa pince blessée.</td>

        <td>Elle se dérobe ou frappe pour se défendre.</td>

        </tr>

        <tr>

        <td>Ils approchent de la fissure ou de ses jeunes.</td>

        <td>Elle se place en travers et attaque si l’intrusion continue.</td>

        </tr>

        <tr>

        <td>Ils déposent de la nourriture puis s’éloignent.</td>

        <td>Elle examine l’offrande avec méfiance ; sa vigilance peut
        diminuer.</td>

        </tr>

        <tr>

        <td>Ils retirent les pierres qui barrent l’accès.</td>

        <td>Elle surveille leurs gestes et tente de rejoindre l’ouverture.</td>

        </tr>

        <tr>

        <td>Ils la blessent ou l’encerclent.</td>

        <td>Elle combat violemment, cherche une issue ou protège son
        refuge.</td>

        </tr>

        </tbody>

        </table>

        <hr>

        <h2>Traces et découvertes</h2>

        <p>Les personnages peuvent réunir ces informations par l’observation, le
        pistage, les témoignages ou l’exploration du plateau. Aucun indice
        essentiel ne nécessite de réussir un unique test.</p>

        <table>

        <thead>

        <tr>

        <th>Signe observable</th>

        <th>Ce qu’il permet de comprendre</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Des traces convergent vers la paroi au lieu de suivre des
        proies.</td>

        <td>Sarkoth recherche quelque chose à cet endroit.</td>

        </tr>

        <tr>

        <td>La fissure a été obstruée récemment.</td>

        <td>L’aménagement de la route a modifié son territoire.</td>

        </tr>

        <tr>

        <td>Les pierres neuves sont marquées par des pinces.</td>

        <td>Sarkoth tente régulièrement de rouvrir le passage.</td>

        </tr>

        <tr>

        <td>Des mues et de petites carapaces se trouvent près du refuge.</td>

        <td>Le secteur est fréquenté par des scorpides depuis longtemps.</td>

        </tr>

        <tr>

        <td>Des jeunes scorpides suivent d’anciennes pistes de la
        matriarche.</td>

        <td>Sarkoth joue un rôle important dans leur présence sur le
        plateau.</td>

        </tr>

        <tr>

        <td>Des proies ont été mal saisies ou laissées sur place.</td>

        <td>Sa blessure gêne sa chasse.</td>

        </tr>

        <tr>

        <td>Sarkoth cesse de poursuivre les intrus qui s’éloignent de la
        fissure.</td>

        <td>Elle défend un lieu plutôt qu’elle ne cherche à chasser des
        voyageurs.</td>

        </tr>

        </tbody>

        </table>

        <hr>
