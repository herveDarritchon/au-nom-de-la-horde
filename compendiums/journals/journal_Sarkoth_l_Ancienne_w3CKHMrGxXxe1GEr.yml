  - _id: 7c3cfb6fcd94fd8a
    name: Venin et communication
    type: text
    sort: 400000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Le venin de la Mère rouge</h2>

        <p>Le venin de Sarkoth est particulièrement virulent. Les antidotes
        préparés contre les scorpides ordinaires peuvent ralentir ses effets,
        sans suffire à neutraliser une intoxication grave.</p>

        <p>Son venin frais possède toutefois une propriété rare : <strong>un
        guérisseur ou un alchimiste compétent peut le préparer et le diluer pour
        obtenir un antivenin puissant</strong>. Le venin brut demeure mortel ;
        il ne soigne personne à l’état naturel.</p>

        <p>Cette substance est précieuse pour soigner Hana’zua, mais les
        personnages n’ont pas nécessairement besoin de tuer Sarkoth pour
        l’obtenir. Ils peuvent essayer de :</p>

        <ul>

        <li>recueillir du venin après une piqûre sur une proie ou un support
        préparé ;</li>

        <li>immobiliser l’aiguillon sans blesser mortellement la matriarche
        ;</li>

        <li>l’approcher par des gestes patients et des offrandes ;</li>

        <li>rétablir l’accès au refuge, puis tenter un prélèvement lorsqu’elle
        ne se sent plus menacée.</li>

        </ul>

        <p>Une récolte reste dangereuse. Sarkoth n’offre pas spontanément son
        aiguillon à un inconnu.</p>

        <hr>

        <h2>Comprendre Sarkoth</h2>

        <p>Sarkoth est une bête, pas une interlocutrice humanoïde. Elle
        reconnaît certains individus, les menaces répétées, les odeurs
        familières et les comportements qui lui ont déjà apporté du danger ou du
        répit. Elle peut tolérer progressivement la présence de personnes qui
        respectent ses distances.</p>

        <p>Un chasseur patient peut décrypter son comportement. Un druide, un
        chaman ou un personnage capable de communiquer avec les animaux peut
        percevoir des impressions très simples.</p>

        <p><strong>Sensations et images qu’elle peut transmettre :</strong></p>

        <blockquote>

        <p><em>Petits. Pierre fermée. Chaleur. Douleur. Deux-jambes. Passage.
        Reculer.</em></p>

        </blockquote>

        <p>Elle ne comprend ni la propriété des terres, ni les ordres de Gornek,
        ni les raisons des travaux. Elle comprend en revanche qu’un passage est
        dégagé, qu’une menace se retire ou qu’un individu apporte de la
        nourriture.</p>

        <p>Si des personnages établissent une relation suffisamment calme et
        concrète, Sarkoth peut tolérer un prélèvement ponctuel de venin, en
        particulier après la réouverture de son refuge. Cela reste une tolérance
        fragile, jamais un accord garanti ou définitif.</p>

        <hr>
