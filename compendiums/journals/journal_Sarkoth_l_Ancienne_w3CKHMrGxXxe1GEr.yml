  - _id: 316b182a05d6d9cb
    name: Première apparition et territoire
    type: text
    sort: 200000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Ce que voit le groupe</h2>

        <p><em>À lire lorsque les personnages découvrent Sarkoth :</em></p>

        <blockquote>

        <p>Une forme gigantesque se détache des rochers rougis par le soleil. Le
        scorpide avance lentement, sa carapace sombre hérissée d’épines et
        marquée de profondes cicatrices. Sa pince droite porte l’entaille
        fraîche d’un coup de hache. Elle se referme avec difficulté.</p>

        <p>La créature pivote pour vous faire face. Son autre pince s’ouvre avec
        un claquement sec ; son énorme queue se dresse, l’aiguillon dirigé vers
        vous. Elle ne charge pas. Derrière elle, un éboulement de pierres barre
        une étroite fissure dans la falaise.</p>

        </blockquote>

        <p>Sarkoth surveille les intrus et se place instinctivement entre eux et
        la fissure. Si les personnages restent à distance, elle les menace sans
        attaquer. Un retrait calme permet généralement d’éviter
        l’affrontement.</p>

        <hr>

        <h2>Le plateau de Sarkoth</h2>

        <p>Le territoire de la matriarche couvre un plateau accidenté où
        alternent dalles rocheuses, sable meuble, crevasses et éboulis.
        Plusieurs petites bêtes y cherchent refuge ; les scorpides plus jeunes
        occupent les interstices et les abris ombragés.</p>

        <p><strong>Le passage des recrues.</strong> Une piste consolidée permet
        aux péons et aux chariots de contourner le plateau. Des pierres et des
        déblais y ont été déposés récemment pour sécuriser le passage. Depuis,
        de profondes traces de scorpide traversent de plus en plus souvent la
        route.</p>

        <p><strong>La paroi remaniée.</strong> Au bord de la piste, une fissure
        a été comblée sous les nouveaux remblais. La pierre est rayée à
        plusieurs endroits, et le sol porte les marques de nombreuses tentatives
        pour dégager l’entrée.</p>

        <p><strong>L’ancien refuge.</strong> Derrière la fissure se trouve une
        cavité ombragée où Sarkoth vient pondre et abriter sa descendance. Des
        mues, de petites carapaces et des traces anciennes de scorpides
        témoignent de cet usage.</p>

        <p><strong>Le plateau de chasse.</strong> Des restes de proies et des
        pistes interrompues indiquent que Sarkoth a des difficultés à chasser
        depuis sa blessure. Certaines carcasses ont été abandonnées avant d’être
        consommées.</p>

        <h3>Ce qui a changé</h3>

        <p>Des péons ont condamné la fissure pour stabiliser la route. Ils ne
        savaient pas qu’ils bloquaient l’accès au site de ponte. Sarkoth cherche
        depuis un autre passage et revient sans cesse vers la paroi. Ses
        incursions se rapprochent désormais des voies fréquentées par la
        Horde.</p>

        <hr>
