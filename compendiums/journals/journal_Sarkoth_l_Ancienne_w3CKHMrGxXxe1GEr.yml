  - _id: c98d6a2786097403
    name: Déroulement et conséquences
    type: text
    sort: 600000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>Si personne n’intervient</h2>

        <p><strong>D’abord</strong>, Sarkoth continue à gratter les pierres et à
        chercher un autre accès. Sa blessure rend ses déplacements plus
        erratiques et ses rencontres avec les recrues plus dangereuses.</p>

        <p><strong>Ensuite</strong>, elle emprunte un passage plus fréquenté et
        provoque un nouvel incident. La rumeur d’une bête qui attaque les
        convois se répand.</p>

        <p><strong>Enfin</strong>, Gornek peut envoyer des chasseurs sur le
        plateau. Une confrontation près du refuge risque de disperser les jeunes
        scorpides dans les passages voisins.</p>

        <hr>

        <h2>Ce que change le sort de Sarkoth</h2>

        <h3>Si Sarkoth est tuée</h3>

        <p>Le danger immédiat sur le plateau disparaît. Son aiguillon peut
        fournir le venin recherché, à condition de pouvoir encore le prélever et
        le préparer.</p>

        <p>Le territoire libéré attire ou disperse les plus jeunes scorpides.
        Des individus peuvent s’installer près de pistes et d’abris jusque-là
        relativement épargnés.</p>

        <h3>Si Sarkoth est chassée</h3>

        <p>La route peut redevenir provisoirement praticable. Sarkoth cherche
        toutefois un nouveau refuge, et les incidents risquent de se déplacer
        vers un autre secteur du sud de Durotar.</p>

        <h3>Si la fissure est rouverte</h3>

        <p>Sarkoth retrouve son site de ponte. Ses incursions sur la route
        diminuent, même si elle continue à défendre violemment ses abords. Les
        péons doivent s'assurer que les travaux restent stables et que les
        voyageurs ne pénètrent pas dans ce secteur.</p>

        <h3>Si les personnages gagnent sa tolérance</h3>

        <p>Sarkoth peut reconnaître les aventuriers et cesser de les considérer
        comme une menace immédiate, tant qu’ils respectent son territoire. Un
        prélèvement ultérieur de venin devient envisageable.</p>

        <p>Elle demeure sauvage et dangereuse, en particulier près de ses
        jeunes.</p>

        <h3>Si son venin devient recherché</h3>

        <p>La matriarche risque d’attirer des braconniers ou des chasseurs
        attirés par sa valeur. Des tentatives de capture ou de récoltes répétées
        peuvent à nouveau bouleverser son comportement.</p>

        <hr>
