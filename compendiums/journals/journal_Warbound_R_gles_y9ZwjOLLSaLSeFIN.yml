  - sort: 250000
    name: Taurens
    type: text
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <blockquote><p><strong>« Une présence immense, faite pour protéger
        plutôt que pour chercher la guerre. »</strong></p></blockquote><p>Les
        Taurens sont un peuple des grandes plaines de Kalimdor, profondément
        attaché à la terre, aux cycles naturels et à la communauté. Leur stature
        impressionnante dissimule souvent une nature calme et réfléchie, mais
        lorsqu’un Tauren décide de tenir sa position, il devient extrêmement
        difficile à faire plier.</p><p>Leur constitution exceptionnelle leur
        permet d’endurer des blessures qui mettraient à terre des combattants
        moins robustes. Leur proximité avec le monde naturel leur confère
        également une résistance particulière à ses forces, tandis que leur
        puissant <strong>Piétinement de guerre</strong> peut renverser en
        quelques secondes le cours d’un affrontement.</p><p>Tous les Taurens ne
        suivent cependant pas la même voie. Certains approfondissent leur
        affinité naturelle, tandis que d’autres perpétuent les traditions de
        cueillette et de connaissance des plantes transmises au sein de leur
        peuple.</p><hr><h2>Traits raciaux</h2><p><strong data-start="466"
        data-end="485">Âge de départ :</strong> 15+<br data-start="489"
        data-end="492"><strong data-start="492" data-end="514">Espérance de vie
        :</strong> 150 ans<br data-start="522" data-end="525"><strong
        data-start="525" data-end="537">Taille :</strong> 2,40 m à 2,70 m
        lorsqu’il se tient complètement droit<br data-start="591"
        data-end="594"><strong data-start="594" data-end="605">Poids :</strong>
        environ 150 à 200 kg<br data-start="626" data-end="629"><strong
        data-start="629" data-end="641">Traits :</strong> très grand et
        extrêmement massif, avec une carrure puissante, de larges épaules et une
        musculature imposante. Corps couvert de fourrure, jambes terminées par
        des sabots, visage bovin et imposantes cornes dont la forme varie selon
        les individus.<br data-start="886" data-end="889"><strong
        data-start="889" data-end="901" data-is-only-node>Taille :</strong>
        Normale<br data-start="909" data-end="912"><strong data-start="912"
        data-end="929">Déplacement :</strong> 10 m<br data-start="934"
        data-end="937"><strong data-start="937" data-end="950">Langues
        :</strong> Taur-ahe et
        Orc.</p><h3><strong>@UUID[Item.0Zo1HOUUlZpFR48n]{Résistance à la
        nature}</strong></h3><h3><strong>@UUID[Item.Lp4uLqmy25YRbv6X]{Choc
        Martial}</strong></h3><h3><strong>@UUID[Item.1dYEOMDDEkWhSLR1]{Herboristerie
        Taurène}</strong></h3><hr><h2>Stature et cornes</h2><p>La silhouette
        massive d’un Tauren et ses imposantes cornes font immédiatement partie
        de son identité, mais elles ne constituent pas automatiquement des armes
        ou des avantages supplémentaires.</p><p>Un Tauren peut apprendre à
        exploiter davantage sa puissance physique au cours de ses aventures :
        développer sa vigueur, utiliser ses cornes lors d’une charge ou
        perfectionner d’autres techniques propres à son peuple pourra faire
        l’objet de <strong>futurs Atouts raciaux acquis par
        Progression</strong>.</p><hr><h2>Peuple et traditions</h2><p>Les Taurens
        ne forment pas une culture uniforme. Tribu, famille, mentor, rapport à
        la Terre-Mère et expérience personnelle peuvent profondément modifier la
        manière dont un personnage considère la chasse, la guerre, les esprits
        ou les autres peuples de la Horde.</p><p>Ces traditions ne constituent
        pas des sous-races et n’imposent aucune voie particulière. Un Tauren
        peut être guerrier, chasseur, chaman ou suivre une tout autre destinée
        sans perdre ce qui fait de lui un Tauren.</p><p>La spiritualité et le
        respect de la nature constituent une part importante de leur culture,
        mais ils ne signifient pas que chaque Tauren soit nécessairement
        <strong>Chaman ou Druide</strong>.</p>
