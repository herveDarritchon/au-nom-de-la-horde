  - sort: 250000
    name: Elfes de Sang
    type: text
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <p>Les <strong>Sin’dorei</strong>, ou Elfes de sang, sont les survivants
        de la destruction de Quel’Thalas par le Fléau. Privés du Puits de
        soleil, qui constituait depuis des générations le cœur magique de leur
        royaume, ils portent désormais l’héritage d’un peuple décimé qui refuse
        de disparaître.</p><p>Chez eux, la magie n’est ni exceptionnelle ni
        mystérieuse : elle imprègne leur culture, leur histoire et jusqu’à leur
        manière de percevoir le monde. Cette familiarité se traduit par une
        résistance naturelle aux effets magiques et par la capacité à perturber
        les forces arcaniques qui les entourent.</p><p>Dans la période actuelle
        de la campagne, un Sin’dorei demeure cependant <strong>une présence
        exceptionnelle en Durotar</strong>. Sa présence auprès de la Horde
        relève encore d’un parcours individuel et ne signifie pas que
        Quel’Thalas a déjà rejoint politiquement la Horde.</p><hr><h2>Capacités
        innées</h2><p>Tous les Elfes de sang possèdent les capacités raciales
        suivantes :</p><h3>@UUID[Item.NSCY8FWn2otHMNxQ]{Résistance à la
        magie}</h3><h3>@UUID[Item.szNIqnT0CirhDILO]{Torrent
        arcanique}</h3><h2>Héritage sin’dorei</h2><p>À la création, choisissez
        <strong>un</strong> des Atouts raciaux
        suivants.</p><h3>@UUID[Item.pxIRa356UqTnGPfl]{Affinité avec les
        arcanes}</h3><h3>@UUID[Item.nBbJWfmSImkJwOMI]{Ponction de
        mana}</h3><h2>Quel’Thalas et ses héritages</h2><p>Tous les Sin’dorei
        partagent la mémoire de la chute de Quel’Thalas, mais ils ne la vivent
        pas de la même manière.</p><p>Votre personnage peut être un ancien
        soldat de Lune-d’Argent, un artisan, un érudit, un survivant des
        campagnes contre le Fléau, un voyageur parti chercher de nouvelles
        sources de magie ou simplement quelqu’un qui refuse de laisser la
        catastrophe définir le reste de son existence.</p><p>L’appartenance à
        Quel’Thalas ne constitue donc pas une sous-race ou une orientation
        mécanique supplémentaire. Elle représente avant tout une
        <strong>origine, une culture, des relations et une manière personnelle
        de répondre à la perte du Puits de soleil</strong>.</p><p>Deux Sin’dorei
        peuvent avoir vécu la même catastrophe et en tirer des conclusions
        totalement opposées : préserver les anciennes traditions, rechercher de
        nouvelles sources de pouvoir, se rapprocher d’autres peuples ou au
        contraire considérer que Quel’Thalas ne doit plus jamais dépendre de
        personne.</p><hr><blockquote><p><strong>Être Sin’dorei, c’est survivre à
        la perte, comprendre la magie et décider ce que l’on est prêt à devenir
        pour ne plus jamais être impuissant.</strong></p></blockquote>
