  - sort: 287500
    name: Origine et Historique
    type: text
    _id: MwiIYEQZTLR1TZ8v
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <h2>Origine et historique</h2><p class="p2">Simultanément, vous pouvez
        déterminer l’historique et la provenance géographique de votre PJ
        :</p><ul><li><p class="p2">D’où vient‑il ?</p></li><li><p
        class="p2">Qu’a‑t‑il fait durant sa jeunesse ?</p></li><li><p
        class="p2">Quel événement l’a poussé à quitter son foyer
        ?</p></li><li><p class="p2">Quel est son but (devenir riche, puissant,
        célèbre, rendre justice, servir sa nation, répandre ses idées, percer
        des mystères, réparer une humiliation…) ?</p></li></ul><p
        class="p2">Pour répondre à ces questions, vous aurez besoin de l’aide du
        MJ, car vous devrez vous adapter au cadre de jeu, c’est‑à‑dire le monde
        dans lequel le personnage va
        évoluer.</p><table><thead><tr><th><p>d20</p></th><th><p>Secret
        intime</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p><strong>Je
        ne suis pas celui que je prétends être.</strong> Mon nom, mon origine ou
        mon allégeance véritable doit rester
        caché.</p></td></tr><tr><td><p>2</p></td><td><p><strong>Je recherche un
        proche disparu</strong> pendant une guerre, un exil ou une migration de
        mon peuple.</p></td></tr><tr><td><p>3</p></td><td><p><strong>Une
        malédiction ou une corruption me ronge.</strong> Pour l’instant,
        j’arrive encore à la
        dissimuler.</p></td></tr><tr><td><p>4</p></td><td><p><strong>Je suis
        recherché pour un crime ou une trahison.</strong> Même moi, je ne suis
        pas certain de connaître toute la
        vérité.</p></td></tr><tr><td><p>5</p></td><td><p><strong>Une partie de
        mes souvenirs a disparu</strong> après une bataille, un rituel, une
        captivité ou un événement
        surnaturel.</p></td></tr><tr><td><p>6</p></td><td><p><strong>Une chose
        que tout héros devrait pouvoir affronter me terrifie.</strong> Je fais
        tout pour que personne ne le
        découvre.</p></td></tr><tr><td><p>7</p></td><td><p><strong>Je dépends
        d’une substance, d’un rituel ou d’une forme de magie</strong> dont je
        sais qu’elle finira par me coûter
        cher.</p></td></tr><tr><td><p>8</p></td><td><p><strong>Une blessure
        ancienne suffit à me faire perdre tout contrôle</strong> : un symbole,
        un peuple, une faction, une insulte ou un souvenir
        précis.</p></td></tr><tr><td><p>9</p></td><td><p><strong>Un membre de ma
        famille, de mon clan ou de ma tribu a rejoint mes ennemis.</strong> Il
        connaît mes faiblesses mieux que
        personne.</p></td></tr><tr><td><p>10</p></td><td><p><strong>Je sers
        secrètement une seconde cause.</strong> Pour l’instant, mes deux
        loyautés ne sont pas encore entrées en
        conflit.</p></td></tr><tr><td><p>11</p></td><td><p><strong>J’ai déjà été
        déclaré mort.</strong> Ce qui s’est réellement passé ensuite est quelque
        chose que je préfère
        cacher.</p></td></tr><tr><td><p>12</p></td><td><p><strong>J’ai une dette
        que l’or ne peut pas rembourser.</strong> Une vie sauvée, une faveur, un
        serment ou une dette de sang me lie à
        quelqu’un.</p></td></tr><tr><td><p>13</p></td><td><p><strong>Je ne suis
        jamais vraiment seul dans mon propre esprit.</strong> Une voix, un
        esprit ou une présence
        m’accompagne.</p></td></tr><tr><td><p>14</p></td><td><p><strong>J’ai
        brisé un serment sacré</strong> envers mon peuple, mes ancêtres, les
        esprits, les éléments, la Lumière ou une autre
        puissance.</p></td></tr><tr><td><p>15</p></td><td><p><strong>Je
        transporte un objet dangereux ou interdit</strong> que beaucoup seraient
        prêts à tuer pour
        obtenir.</p></td></tr><tr><td><p>16</p></td><td><p><strong>Je porte le
        deuil de quelqu’un dont je n’ai jamais retrouvé le corps.</strong> Au
        fond de moi, je ne suis pas certain qu’il soit vraiment
        mort.</p></td></tr><tr><td><p>17</p></td><td><p><strong>J’ai abandonné
        quelqu’un qui comptait sur moi.</strong> Cette personne, ou ceux qui lui
        étaient fidèles, pourraient un jour me
        retrouver.</p></td></tr><tr><td><p>18</p></td><td><p><strong>Le même
        rêve me poursuit nuit après nuit.</strong> Je ne sais pas s’il s’agit
        d’un traumatisme, d’un avertissement ou de quelque chose qui cherche à
        me parler.</p></td></tr><tr><td><p>19</p></td><td><p><strong>Je n’ai pas
        réussi à empêcher une tragédie.</strong> Certaines personnes pensent
        même que j’en suis
        responsable.</p></td></tr><tr><td><p>20</p></td><td><p><strong>J’ai
        appartenu à une organisation, un culte, un ordre ou une société
        secrète.</strong> Je la sers encore… ou j’essaie désespérément de lui
        échapper.</p></td></tr></tbody></table><table><thead><tr><th><p>d20</p></th><th><p>Secret
        intime</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p><strong>Ma
        famille, mon clan ou ma tribu a été massacré, dispersé ou m’a
        renié.</strong> On ne m’a jamais dit toute la vérité sur ce qui s’est
        passé.</p></td></tr><tr><td><p>2</p></td><td><p><strong>On m’a chargé de
        surveiller, protéger ou espionner secrètement un autre membre du
        groupe.</strong> Il ignore
        pourquoi.</p></td></tr><tr><td><p>3</p></td><td><p><strong>Un voyant, un
        esprit ou une vision m’a annoncé que je provoquerais un jour une
        terrible
        catastrophe.</strong></p></td></tr><tr><td><p>4</p></td><td><p><strong>Je
        porte depuis toujours une marque étrange</strong> : cicatrice, rune,
        tatouage, tache ou signe dont j’ignore l’origine et la
        signification.</p></td></tr><tr><td><p>5</p></td><td><p><strong>Une
        personne qui m’est chère a disparu sans laisser de traces.</strong> Je
        refuse de croire qu’elle est
        morte.</p></td></tr><tr><td><p>6</p></td><td><p><strong>Je possède un
        héritage de mon peuple ou de ma famille</strong> et je préférerais
        mourir plutôt que de le
        perdre.</p></td></tr><tr><td><p>7</p></td><td><p><strong>J’ai conclu un
        pacte que je regrette aujourd’hui</strong> avec un démon, un esprit, une
        puissance magique ou une autre
        entité.</p></td></tr><tr><td><p>8</p></td><td><p><strong>Quelqu’un en
        qui j’avais une confiance absolue m’a trahi.</strong> Depuis, j’accorde
        difficilement ma
        confiance.</p></td></tr><tr><td><p>9</p></td><td><p><strong>Une ancienne
        blessure, une mutilation ou une séquelle me poursuit.</strong> Je refuse
        qu’elle définisse ce que je suis capable
        d’accomplir.</p></td></tr><tr><td><p>10</p></td><td><p><strong>Mon nom
        est connu pour un événement dont je préférerais que personne ne
        parle.</strong> La version racontée n’est peut-être même pas la
        vérité.</p></td></tr><tr><td><p>11</p></td><td><p><strong>Je veux
        accomplir quelque chose d’assez grand pour qu’une personne qui compte
        pour moi entende enfin parler de
        moi.</strong></p></td></tr><tr><td><p>12</p></td><td><p><strong>Je dois
        prouver ma valeur à ma famille, mon clan, ma tribu ou mon ancien
        maître.</strong> Leur jugement continue de me
        hanter.</p></td></tr><tr><td><p>13</p></td><td><p><strong>J’ai
        désespérément besoin de richesses ou de ressources</strong>, non pour
        moi, mais pour sauver quelqu’un, reconstruire quelque chose ou honorer
        une dette.</p></td></tr><tr><td><p>14</p></td><td><p><strong>La raison
        que je donne pour voyager avec mes compagnons n’est pas la véritable
        raison de ma présence
        ici.</strong></p></td></tr><tr><td><p>15</p></td><td><p><strong>Je
        cherche à devenir assez puissant pour abattre un ennemi que je ne
        pourrais pas encore affronter.</strong> Chef de guerre, démon, créature,
        sorcier ou autre
        menace.</p></td></tr><tr><td><p>16</p></td><td><p><strong>J’ai commis
        quelque chose que je considère impardonnable.</strong> Tout ce que je
        fais depuis vise, d’une manière ou d’une autre, à réparer cette
        faute.</p></td></tr><tr><td><p>17</p></td><td><p><strong>J’ai vu ma
        propre mort.</strong> Vision, prophétie ou souvenir impossible : je sais
        où, comment ou par qui elle devrait
        survenir.</p></td></tr><tr><td><p>18</p></td><td><p><strong>Je prétends
        avoir un passé beaucoup plus extraordinaire qu’il ne l’est
        réellement.</strong> Plus je mens, plus il devient difficile d’avouer la
        vérité.</p></td></tr><tr><td><p>19</p></td><td><p><strong>Je me comporte
        en compagnon loyal, mais je suis convaincu d’être destiné à commander un
        jour.</strong> Peut-être même à ceux qui voyagent actuellement à mes
        côtés.</p></td></tr><tr><td><p>20</p></td><td><p><strong>Je viens d’un
        endroit que presque personne ici ne connaît réellement.</strong> Une
        autre terre, un autre plan ou un territoire si lointain que ce monde me
        paraît encore étranger.</p></td></tr></tbody></table>
