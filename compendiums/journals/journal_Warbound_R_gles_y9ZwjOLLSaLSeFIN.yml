  - sort: 250000
    name: Trolls
    type: text
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <blockquote><p><strong>« Là où les autres pansent leurs plaies, le Troll
        revient déjà dans la chasse. »</strong></p></blockquote><p>Les
        <strong>Trolls Sombrelance</strong> appartiennent à un peuple ancien
        d’Azeroth, façonné par la survie, la chasse et une relation profondément
        spirituelle au monde qui l’entoure.</p><p>Leur corps possède une
        capacité de <strong>régénération exceptionnelle</strong> : les blessures
        qui immobiliseraient longtemps d’autres peuples ne suffisent pas
        toujours à tenir un Troll à terre. Lorsque la situation devient
        critique, ils peuvent également entrer dans un bref état de
        <strong>Berserker</strong>, poussant brutalement leur rythme d’action
        malgré la douleur et la pression du combat.</p><h2>Situation
        politique</h2><p>La situation des Sombrelance peut se résumer ainsi
        :</p><ul data-start="2588" data-end="3006"><li data-section-id="gtkgnn"
        data-start="2588" data-end="2619"><p><strong data-start="2590"
        data-end="2601">Vol’jin</strong> dirige la tribu ;</p></li><li
        data-section-id="1t3uexn" data-start="2620" data-end="2678"><p>les
        Sombrelance sont membres de la <strong data-start="2657"
        data-end="2676">Horde de Thrall</strong> ;</p></li><li
        data-section-id="12b0uif" data-start="2679" data-end="2738"><p><strong
        data-start="2681" data-end="2692">Sen’jin</strong> constitue leur
        principal village en Durotar ;</p></li><li data-section-id="1sh0jpy"
        data-start="2739" data-end="2802"><p>les <strong data-start="2745"
        data-end="2763">Îles de l’Écho</strong> restent sous l’influence de
        Zalazane ;</p></li><li data-section-id="dd85lc" data-start="2803"
        data-end="2862"><p>certains Sombrelance sont toujours victimes de sa
        magie ;</p></li><li data-section-id="ov6wh1" data-start="2863"
        data-end="2909"><p>la tribu espère un jour reprendre les îles
        ;</p></li><li data-section-id="98wcrt" data-start="2910"
        data-end="3006"><p>les Sombrelance participent également à la défense et
        à l’installation de la Horde en Durotar.</p></li></ul><hr><h2>Traits
        raciaux</h2><p><strong data-start="119" data-end="138">Âge de départ
        :</strong> 15+<br data-start="142" data-end="145"><strong
        data-start="145" data-end="167">Espérance de vie :</strong> 80 ans<br
        data-start="174" data-end="177"><strong data-start="177" data-end="189"
        data-is-only-node>Taille :</strong> 2,45 m à 2,75 m lorsqu’il se tient
        complètement droit<br data-start="243" data-end="246"><strong
        data-start="246" data-end="257">Poids :</strong> environ 90 kg<br
        data-start="271" data-end="274"><strong data-start="274"
        data-end="286">Traits :</strong> très grand et élancé, avec de longs
        membres et une posture souvent voûtée. Peau généralement bleue à
        bleu-vert, longues oreilles pointues, nez marqué et défenses
        proéminentes, particulièrement développées chez les mâles.<br
        data-start="507" data-end="510"><strong data-start="510"
        data-end="522">Taille :</strong> Normale<br data-start="530"
        data-end="533"><strong data-start="533" data-end="550">Déplacement
        :</strong> 10 m<br data-start="555" data-end="558"><strong
        data-start="558" data-end="571">Langues :</strong> Zandali et
        Orc.</p><hr><p>Choisir une <strong>capacité raciale</strong> à la
        création</p><h3>@UUID[Item.0u0dIPHzjuELJ3xi]{Berserker}</h3><h3>@UUID[Item.3hG2ZQ2aJRFcWujA]{Maîtrise
        de l'Arc}</h3><h3>@UUID[Item.XadXs8En7cU0tPvc]{Maîtrise du
        Lancer}</h3><hr><h2>Une faiblesse personnelle</h2><p>Les Sombrelance ont
        connu l’exil, les rivalités et les luttes pour leur survie, mais ces
        expériences n’ont pas façonné tous les Trolls de la même
        manière.</p><p>À la création, choisissez un<strong>
        @UUID[.iyIbv5JXRkcCObgH]{Travers}</strong> et un
        <strong>@UUID[.iyIbv5JXRkcCObgH]{Idéal}</strong> représentant une
        faiblesse liée à votre personnage, son clan, son passé ou sa
        réputation.</p><p>Tirage aléatoire d'un
        <strong>@UUID[RollTable.IQUsJLqTbkPdBbw3]{idéal}</strong> et d'un
        <strong>@UUID[RollTable.87WK59nyuvKNteFE]{travers}</strong></p><blockquote><p>Cette
        faiblesse décrit <strong>votre Troll</strong>, pas l’ensemble du peuple
        Sombrelance.</p></blockquote><hr><h2>Loas et traditions</h2><p>La
        spiritualité occupe une place importante dans la culture Sombrelance.
        Les Loas peuvent être des guides, des protecteurs, des figures redoutées
        ou les destinataires de rites et de serments transmis depuis des
        générations.</p><p>Cette relation ne constitue cependant pas une
        capacité automatique de tous les Trolls. Un personnage peut être
        profondément dévoué à un Loa, simplement respecter les traditions de son
        peuple ou entretenir avec elles une relation beaucoup plus
        distante.</p><p>Au fil de ses <strong>Progressions</strong>, un Troll
        pourra approfondir cette dimension et développer des Atouts liés à
        certains Loas ou à des traditions particulières.</p><hr><h2>Un peuple de
        chasseurs et de survivants</h2><p>Les longues silhouettes, les défenses
        et la régénération des Trolls les rendent immédiatement reconnaissables,
        mais ne déterminent ni leur métier ni leur tempérament.</p><p>Un
        Sombrelance peut être chasseur, guerrier, chaman, voleur, mage ou suivre
        une voie totalement différente. Ce qui unit son peuple n’est pas une
        manière unique de combattre, mais une extraordinaire capacité à
        <strong>survivre, s’adapter et revenir dans la lutte lorsque d’autres
        seraient déjà tombés</strong>.</p>
