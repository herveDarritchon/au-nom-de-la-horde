  - sort: 193750
    name: Choisir son profil
    type: text
    _id: uxkU36zfBN3i7btx
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <h1>Choisir son profil</h1><p>Commencez par l'idée du personnage, puis
        choisissez le profil Warbound qui traduit le mieux cette
        identité.</p><ol><li><p><strong>Choisissez votre classe
        Warcraft.</strong> Elle devient votre profil principal
        Warbound.</p></li><li><p><strong>Repérez sa famille.</strong> Elle fixe
        votre socle de PV, votre type de DR et votre éventuel avantage de
        famille.</p></li><li><p><strong>Regardez les caractéristiques
        prioritaires.</strong> Elles indiquent les caractéristiques qui
        soutiennent le mieux le fonctionnement du profil ; elles ne sont pas des
        obligations.</p></li><li><p><strong>Choisissez vos voies et
        capacités.</strong> Elles déterminent ensuite la manière dont votre
        héros exprime concrètement sa classe.</p></li></ol><h2>Correspondances
        avec COF2</h2><table><thead><tr><th><p>Warbound</p></th><th><p>Profil
        COF2 le plus
        proche</p></th></tr></thead><tbody><tr><td><p>Guerrier</p></td><td><p>Guerrier</p></td></tr><tr><td><p>Voleur</p></td><td><p>Voleur</p></td></tr><tr><td><p>Chasseur</p></td><td><p>Rôdeur</p></td></tr><tr><td><p>Mage</p></td><td><p>Magicien</p></td></tr><tr><td><p>Démoniste</p></td><td><p>Sorcier</p></td></tr><tr><td><p>Druide</p></td><td><p>Druide</p></td></tr><tr><td><p>Prêtre</p></td><td><p>Prêtre</p></td></tr><tr><td><p>Paladin</p></td><td><p>Chevalier
        + Prêtre</p></td></tr><tr><td><p>Chaman</p></td><td><p>Druide +
        Prêtre</p></td></tr></tbody></table><h2>Deux cas
        particuliers</h2><p><strong>Paladin → Combattant.</strong> Son identité
        repose d'abord sur un socle martial : armes, armure et présence en
        première ligne. Ses pouvoirs sacrés sont exprimés par ses voies et
        capacités plutôt que par un changement de famille.</p><p><strong>Chaman
        → Mystique.</strong> Même lorsqu'il combat au contact, son identité
        fondamentale vient de sa relation aux esprits et aux éléments. Le bonus
        de récupération des Mystiques traduit mieux ce socle que la vigueur
        brute d'un Combattant.</p><blockquote><p><strong>À retenir :</strong> la
        famille définit le châssis mécanique ; le profil définit la classe ; les
        voies définissent la manière de la jouer.</p></blockquote>
