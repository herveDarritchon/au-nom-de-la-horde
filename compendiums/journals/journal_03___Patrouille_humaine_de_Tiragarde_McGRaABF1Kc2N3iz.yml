      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Document maître évolutif — v0.2 (5 novembre 2026) ; Livret narratif — v0.1 (7 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><p><strong>[ACQUIS]</strong> Rencontre prévue au Jour 2 avec des soldats humains venus de Tiragarde.</p><p><strong>[À DÉFINIR]</strong> Mission, effectif, autorité, objectifs, attitude initiale, raison de leur position sur la route et conséquences diplomatiques.</p><p><strong>Options à préserver :</strong> voir avant d’être vu, observer, négocier, contourner, protéger le convoi, combattre si la situation dégénère.</p><p><strong>Ne pas prescrire</strong> de réaction humaine à partir d’une rumeur, ni traiter le combat comme issue garantie.</p><h3>G. Jour 2 — la patrouille de Tiragarde</h3><p>[À DÉFINIR]  Une rencontre avec une patrouille humaine de Tiragarde a été explicitement prévue pour le lendemain. Son effectif, sa mission, son attitude initiale et la raison de sa présence sur la route ne sont pas encore fixés.</p>\n<p style=\"margin-left:1em\">• Décisions ouvertes aux PJ — la scène devra permettre plusieurs issues crédibles (contourner, dialoguer, observer, défendre le convoi, combattre si la situation dégénère).</p>\n<p style=\"margin-left:1em\">• Conséquences à reporter — exploiter le repos, les pertes et les indices du jour 1 ; ne pas décider d’avance qu’un combat est inévitable.</p>\n<p><small>À écrire / vérifier : objectif de la patrouille, autorité/ordres, informations qu’elle détient, géographie, conséquences diplomatiques et mécaniques COF2.</small></p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.MsoGRC7psQf0kvNd.JournalEntryPage.rQLBJ5TIhx8qRgK8]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.eyuh7ClQeexhfd0c.JournalEntryPage.l8XmqZxFRQyZa387]{À jouer — récit &amp; situations} \_ · \_ @UUID[JournalEntry.1w5SomDLshDAWOoC.JournalEntryPage.MXJysq678UIyw76D]{Points ouverts, sans réponses inventées}</p>"
