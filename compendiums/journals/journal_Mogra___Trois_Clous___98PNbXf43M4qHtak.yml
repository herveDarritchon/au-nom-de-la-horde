  - name: 04 · Secrets et devenir (MJ)
    type: text
    sort: 400000
    text:
      format: 1
      content: >-
        <h1>MJ — Secrets et continuité</h1><h2>Vérité / point de
        vigilance</h2><p>Ne présume pas que Mogra a toujours raison : son talent
        n’empêche ni l’orgueil ni les erreurs. L’enjeu est la reconnaissance et
        la responsabilité, pas la victoire morale assurée de l’un des
        camps.</p><h2>Ce que le PNJ ne dit pas spontanément</h2><p>Elle a déjà
        envisagé de quitter la Vallée pour bâtir ailleurs, ce qui laisserait ses
        proches sans artisan qualifié.</p><h2>Évolution
        envisageable</h2><p>Artisane expérimentée à Tranchecolline : ateliers,
        équipements, réparations, chantier d’un refuge.</p><h2>Fil de mémoire
        des PJ</h2><ul><li>Qui lui a parlé avec respect, et qui l’a humilié
        ?</li><li>Quelle promesse les PJ ont-ils faite ?</li><li>Quelle décision
        des PJ a réellement changé sa vie ?</li><li>Que demandera-t-il aux PJ la
        prochaine fois qu’ils se croiseront ?</li></ul><h2>Continuité
        ouverte</h2><p>Les événements ci-dessus sont des propositions. Les faits
        établis pendant la partie priment sur cette préparation. L’amitié,
        l’hostilité et le destin de ce péon ne sont pas décidés à l’avance.</p>
