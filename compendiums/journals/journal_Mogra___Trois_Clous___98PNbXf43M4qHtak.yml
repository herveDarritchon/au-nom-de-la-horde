  - name: 01 · Portrait et accroche
    type: text
    sort: 100000
    text:
      format: 1
      content: >-
        <h1>Mogra « Trois-Clous »</h1><p><em>Adaptation Warbound · Vallée des
        Épreuves · Journal MJ</em></p><blockquote><p>« Donnez-moi du bois, je
        bâtirai un pont. Donnez-moi des ordres idiots, et bâtissez-le
        vous-mêmes. »</p></blockquote><h2>En un
        regard</h2><dl><dt><strong>Rôle</strong></dt><dd>La contestataire ·
        compétence / dignité</dd><dt><strong>Aspect</strong></dt><dd>Grande
        orque aux cheveux ras et à la ceinture d’outils entretenus avec soin.
        Trois vieux clous pendent à son cou ; elle examine chaque construction
        du regard.</dd><dt><strong>Désir</strong></dt><dd>Que ses compétences de
        charpentière soient reconnues et qu’elle participe à l’organisation des
        travaux.</dd><dt><strong>Crainte</strong></dt><dd>Que des ordres
        absurdes provoquent des blessures et qu’elle reste traitée comme une
        exécutante interchangeable.</dd><dt><strong>Défaut</strong></dt><dd>Elle
        est rancunière et peut laisser un chantier se compliquer pour démontrer
        qu’elle avait raison.</dd></dl><h2>Première impression à la
        table</h2><p>Évalue les actes plutôt que les titres. Les PJ qui portent
        réellement des poutres ou apprennent à manier un outil
        l’impressionnent.</p><h2>Contact avec les PJ</h2><p>Une alliée qui aide
        à construire quelque chose que les PJ retrouvent plusieurs séances plus
        tard. Elle peut aussi conserver une humiliation comme un grief
        durable.</p><p><em>Statut : PNJ original de la campagne. Repère
        canonique du secteur : le contremaître Thazz’rill et les péons de la
        Vallée.</em></p>
