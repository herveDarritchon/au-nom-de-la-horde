  - name: 02 · Jouer ce péon
    type: text
    sort: 200000
    text:
      format: 1
      content: >-
        <h1>Interprétation et liens</h1><h2>Comment l’incarner</h2><p>Évalue les
        actes plutôt que les titres. Les PJ qui portent réellement des poutres
        ou apprennent à manier un outil l’impressionnent.</p><h2>Ce qu’il sait,
        croit et dissimule</h2><dl><dt><strong>Sait</strong></dt><dd>Où le bois
        manque, quels abris sont mal étayés, et comment sécuriser une passerelle
        avec peu de matériaux.</dd><dt><strong>Croit</strong></dt><dd>Que
        Thazz’rill l’ignore volontairement par mépris ; il peut aussi agir dans
        l’urgence et sous des contraintes qu’elle connaît
        mal.</dd><dt><strong>Cache</strong></dt><dd>Elle a déjà envisagé de
        quitter la Vallée pour bâtir ailleurs, ce qui laisserait ses proches
        sans artisan qualifié.</dd></dl><h2>Son
        entourage</h2><table><thead><tr><th>Personne</th><th>Relation
        actuelle</th></tr></thead><tbody><tr><td>Dorga</td><td>Amie qu’elle
        protège parfois sans écouter ses
        préférences.</td></tr><tr><td>Rukgar</td><td>Le croit lorsqu’il évoque
        le danger des galeries.</td></tr><tr><td>Kragosh</td><td>S’oppose à sa
        discipline aveugle.</td></tr><tr><td>Thazz’rill</td><td>Cherche une
        place dans les décisions, pas forcément sa
        destitution.</td></tr></tbody></table><h2>Une phrase à
        placer</h2><blockquote><p>« Donnez-moi du bois, je bâtirai un pont.
        Donnez-moi des ordres idiots, et bâtissez-le vous-mêmes.
        »</p></blockquote>
