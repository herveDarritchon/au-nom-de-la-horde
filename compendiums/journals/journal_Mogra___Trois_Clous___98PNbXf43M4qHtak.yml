  - name: 03 · Scènes et réactions
    type: text
    sort: 300000
    text:
      format: 1
      content: >-
        <h1>Scènes et décisions</h1><h2>Trois occasions de jeu</h2><h3>Deux
        plans pour un abri</h3><p>Elle propose une structure plus lente mais
        plus solide que celle défendue par Kragosh ; elle demande aux PJ
        d’inspecter les deux projets.</p><h3>Une passerelle instable</h3><p>Elle
        refuse de signer la sécurité d’une réparation qu’elle juge
        bâclée.</p><h3>Le travail bien fait</h3><p>Elle apprend à un PJ à
        tailler une cheville ou à poser un renfort — conversation calme qui peut
        valoir davantage qu’un sermon.</p><h2>Réactions à quelques choix des
        PJ</h2><table><thead><tr><th>Approche des PJ</th><th>Réaction ou
        conséquence</th></tr></thead><tbody><tr><td>Soutenir son
        expertise</td><td>Thazz’rill peut lui confier une responsabilité ;
        Kragosh craint pour sa position.</td></tr><tr><td>La contraindre sans
        débat</td><td>Elle peut démissionner, exécuter le strict minimum ou
        faire savoir que les PJ méprisent les artisans.</td></tr><tr><td>Imposer
        un compromis concret</td><td>Le contremaître fixe l’objectif, Mogra
        propose les méthodes ; l’accord tient seulement si chacun respecte sa
        parole.</td></tr></tbody></table><h2>Si les PJ n’interviennent
        pas</h2><p>Après une dispute de plus, Mogra quitte le chantier ou refuse
        les travaux les plus délicats ; les réparations deviennent plus longues
        et moins sûres.</p><p><em>Ces scènes sont des opportunités, pas une
        suite de quêtes imposées. Elles peuvent se résoudre sans jet de
        dés.</em></p>
