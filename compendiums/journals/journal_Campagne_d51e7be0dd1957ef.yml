name: Campagne
folder: Cy5oV4lrmPkhyn6H
pages:
  - _id: 6f02e6b775e645ab
    name: Au Nom de la Horde — Saison
    type: text
    text:
      content: >-
        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Avatars/CoA-Thrall_TWW.webp?v=8daf0ec47239"
        alt="CoA-Thrall_TWW.webp" width="250"></p>

        <blockquote>

        <p><strong>Champions of Azeroth — Campagne Horde</strong></p>

        <p><strong>Durotar, environ quatre ans après la bataille du mont
        Hyjal.</strong></p>

        </blockquote>

        <h2 id="bienvenue-en-azeroth">Bienvenue en Azeroth</h2>

        <p>La guerre est terminée, mais la survie ne fait que commencer.</p>

        <p>Tu es en
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.cb28ce8ef3d17087.JournalEntryPage.d26977c697af601a]{Kalimdor}</strong>,
        sur les terres rouges, arides et impitoyables de
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.16b7eb16efab8226.JournalEntryPage.c27c85bb2e09710f]{Durotar}</strong>.
        Sous un soleil de plomb, entre les canyons balayés par la poussière et
        les côtes sauvages, une nouvelle nation tente de s'enraciner.</p>

        <p>La Horde ne cherche plus seulement à vaincre. Elle cherche à
        <strong>bâtir un foyer</strong>.</p>

        <p>Les routes sont longues, les points d'eau précieux et les ressources
        comptées. Des caravanes relient les avant-postes, des péons et des
        artisans construisent, réparent et fortifient sans relâche, tandis que
        gardes, chasseurs et éclaireurs tentent de maintenir ouvertes les lignes
        de ravitaillement.</p>

        <p>Au-delà de la lueur des feux de camp rôdent prédateurs, peuples
        hostiles, ennemis de la Horde et fantômes d'un passé encore récent.</p>

        <p>C'est ici, au milieu du fracas des pioches, du grondement des
        caravanes et de la poussière des routes, que ton histoire commence.</p>

        <h2 id="la-période--quatre-ans-après-hyjal">La période — Quatre ans
        après Hyjal</h2>

        <p>Nous sommes environ <strong>quatre ans après la bataille du mont
        Hyjal</strong>, qui vit les peuples d'Azeroth s'unir pour repousser la
        Légion ardente et mettre un terme à la Troisième Guerre.</p>

        <p>Ces événements ne sont pas de l'histoire ancienne. La plupart de ceux
        que tu rencontreras les ont vécus, directement ou à travers leurs
        conséquences.</p>

        <p>Sous la direction du Chef de guerre <strong>Thrall</strong>, les Orcs
        ont traversé l'océan et se sont installés en Kalimdor. Autour d'eux
        s'est formée une nouvelle Horde réunissant notamment les Orcs, les
        Trolls Darkspear et les Taurens. Les Réprouvés ont également rejoint
        cette alliance, même si leur présence reste lointaine pour beaucoup
        d'habitants de Durotar.</p>

        <p>La paix avec l'Alliance n'est pas assurée. Les blessures sont
        récentes, les intérêts contradictoires et les frontières encore
        instables. Les affrontements locaux, les provocations, la méfiance et
        les vieilles rancunes peuvent à tout moment mettre cette trêve à
        l'épreuve.</p>

        <h2 id="durotar-aujourdhui">Durotar aujourd'hui</h2>

        <p>Durotar est une <strong>terre de frontière</strong>.</p>

        <p>Vivre ici, c'est accepter la chaleur, le manque d'eau, les distances,
        la roche et une faune qui ne pardonne pas l'imprudence. Scorpides,
        raptors et autres prédateurs ne sont pas des monstres placés sur une
        route : ils font partie d'un territoire que la Horde apprend encore à
        habiter.</p>

        <p>Mais Durotar n'est pas un désert vide.</p>

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Maps/Durotar_map_fr.webp?v=bdc532d57ee3"
        alt="Durotar_map_fr.webp" width="700"></p>

        <p>Des convois chargés de bois, de pierre, de nourriture et d'outils
        circulent entre les différents établissements. Des postes de garde
        protègent les routes. Des artisans improvisent des ateliers. Des
        ouvriers ouvrent des pistes, creusent, bâtissent et consolident ce qui
        deviendra peut-être un jour une véritable patrie durable.</p>

        <p>Au nord se dresse <strong>Orgrimmar</strong>, jeune capitale et
        symbole de la volonté de la Horde de s'installer définitivement en
        Kalimdor. La ville est déjà le cœur politique et militaire de la
        nouvelle nation, mais elle continue de grandir, de s'étendre et de se
        transformer.</p>

        <p>Au sud, <strong>Sen'jin</strong> et les communautés Darkspear
        apportent une autre manière d'habiter cette terre, plus liée aux
        esprits, aux traditions et à la côte.</p>

        <p>Entre les deux, <strong>Tranchecolline</strong> est le carrefour de
        Durotar : un lieu de passage, de ravitaillement, de nouvelles et de
        tensions.</p>

        <h2 id="quelle-campagne-allons-nous-jouer-">Quelle campagne allons-nous
        jouer ?</h2>

        <p><strong>Au Nom de la Horde</strong> est une campagne de découverte,
        d'exploration et d'aventures locales qui te fera parcourir Durotar avant
        de te conduire progressivement vers des enjeux plus importants.</p>

        <p>Tu ne commences pas comme un de ces héros légendaires dont on chante
        déjà les exploits.</p>

        <p>Tu es encore au début de ton histoire : recrue, voyageur, éclaireur,
        artisan, combattant, mystique ou allié de la Horde cherchant à trouver
        sa place dans ce territoire.</p>

        <p>Tu vas notamment :</p>

        <ul>

        <li>parcourir les routes de Durotar ;</li>

        <li>rencontrer ses habitants et ses différentes communautés ;</li>

        <li>protéger, négocier, enquêter, explorer ou combattre selon tes choix
        ;</li>

        <li>prendre parti dans certains conflits locaux ;</li>

        <li>découvrir des lieux familiers aux anciens joueurs de <em>World of
        Warcraft</em> sous un angle nouveau ;</li>

        <li>voir les conséquences de tes décisions modifier les personnes, les
        routes, les campements et les rapports de force.</li>

        </ul>

        <p>La campagne ne consiste pas à reproduire une suite de quêtes du
        MMO.</p>

        <p>Les problèmes existent indépendamment de toi. Tu pourras décider
        lesquels méritent ton attention, comment intervenir et parfois s'il vaut
        mieux ne pas intervenir du tout.</p>

        <h2 id="la-promesse-de-jeu">La promesse de jeu</h2>

        <p>Si tu connais <em>World of Warcraft</em>, beaucoup de choses te
        sembleront familières.</p>

        <p>Tu reconnaîtras des lieux, des peuples, des créatures, des noms et
        des situations.</p>

        <p>Mais tes souvenirs du jeu vidéo ne seront pas des solutions.</p>

        <p>Ici, un ennemi peut négocier. Une faction peut être divisée. Un
        combat peut être évité. Une décision peut modifier durablement un lieu.
        Une personne que tu pensais connaître peut avoir des raisons que le MMO
        ne t'avait jamais permis d'explorer.</p>

        <p>Le plaisir recherché est simple :</p>

        <blockquote>

        <p><strong>Reconnaître Azeroth, puis découvrir que tu peux réellement
        agir dessus.</strong></p>

        </blockquote>

        <h2 id="quel-personnage-imaginer-">Quel personnage imaginer ?</h2>

        <p>Il n'y a pas de profil unique imposé.</p>

        <p>Tu peux être un Orc fier de participer à la construction de la
        nouvelle capitale, un Troll Darkspear attaché aux siens et aux esprits
        de Kalimdor, un Tauren venu aider ses frères d'armes, ou un personnage
        plus inhabituel dont la présence en <strong>Durotar</strong> devra être
        expliquée avec le MJ.</p>

        <p>Ton personnage peut être un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.6563275b1946c568]{guerrier}</strong>,
        un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.a62f8344c3d8c272]{chasseur}</strong>,
        un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.a78c04c3d8fb6a39]{chaman}</strong>,
        un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.f9c8907f3d862d58]{prêtre}</strong>,
        un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.4fdfe10aad332e08]{voleur}</strong>,
        un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.53c4bd2359f7f29c]{mage}</strong>,
        un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.d0dc7ec14d103a93]{démoniste}</strong>,
        un
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.216697f9320ef355]{druide}</strong>
        ou appartenir à une autre option autorisée pour la campagne, le
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.c7bf87a9785ebb74.JournalEntryPage.f00a917b33d03583]{paladin}</strong>.</p>

        <p>La question essentielle n'est pas seulement :</p>

        <blockquote>

        <p><strong>D'où viens-tu ?</strong></p>

        </blockquote>

        <p>Mais surtout :</p>

        <blockquote>

        <p><strong>Pourquoi es-tu ici maintenant ?</strong></p>

        </blockquote>

        <p>Réfléchis notamment à ces questions :</p>

        <ul>

        <li>Qu'est-ce que la Horde représente pour toi ?</li>

        <li>Pourquoi es-tu en Durotar ?</li>

        <li>Qu'as-tu perdu, quitté ou laissé derrière toi ?</li>

        <li>Qu'espères-tu construire, trouver ou devenir ici ?</li>

        <li>Que serais-tu prêt à défendre ?</li>

        <li>Qu'est-ce qui pourrait te faire douter de ceux auxquels tu as choisi
        de faire confiance ?</li>

        <li>Pourquoi accepterais-tu de lier ton destin à celui des autres
        personnages ?</li>

        </ul>

        <h2 id="ton-point-de-départ--tranchecolline">Ton point de départ —
        Tranchecolline</h2>

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/CoA-Durotar-Razor-Hill-Hub-landscape.webp?v=3d4f3d548881"
        alt="CoA-Durotar-Razor-Hill-Hub-landscape.jpeg" width="500"></p>

        <p>Ton aventure commence à
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.accdb729c105149f.JournalEntryPage.7c145456209029db]{Tranchecolline}
        — Razor Hill</strong>.</p>

        <p>Ce n'est pas seulement une étape entre la Vallée des Épreuves et
        Orgrimmar. Pour cette campagne, <strong>Tranchecolline</strong> sera ton
        <strong>point d'ancrage</strong>.</p>

        <p>Autour de toi, l'activité est permanente : des gardes observent les
        routes, des marchands négocient les derniers chargements arrivés, des
        chasseurs échangent des nouvelles, des péons réparent des chariots et
        des voyageurs se reposent avant de repartir vers le nord, le sud ou la
        côte.</p>

        <p>Tu y reviendras entre tes excursions.</p>

        <p>Les personnes que tu auras aidées, contrariées ou ignorées pourront
        encore être là.</p>

        <p>Les problèmes que tu auras résolus laisseront des traces.</p>

        <p>Ceux que tu auras laissés de côté pourront avoir empiré.</p>

        <p>Et au fil de tes voyages, certains détails commenceront peut-être à
        ne plus correspondre à l'image simple d'une terre sauvage qu'il
        suffirait de pacifier.</p>

        <p>Quelque chose se joue en
        <strong>@UUID[Compendium.world.vault-coa-7e7c5ff7-journal.JournalEntry.16b7eb16efab8226.JournalEntryPage.c27c85bb2e09710f]{Durotar}</strong>.</p>

        <p>Au début, cela ressemblera à des incidents ordinaires d'une terre de
        frontière.</p>

        <p>Puis tu devras comprendre <strong>pourquoi</strong>.</p>

        <hr>
