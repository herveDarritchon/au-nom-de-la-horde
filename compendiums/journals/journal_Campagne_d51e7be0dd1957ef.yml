  - _id: ac21c2995eee07a4
    name: Proposition de campagne
    type: text
    text:
      content: >-
        <h2 id="bienvenue-en-azeroth">Bienvenue en Azeroth</h2>

        <p>La guerre est terminée, mais la survie ne fait que commencer. Vous
        êtes en Kalimdor, sur les terres arides, rouges et impitoyables de
        Durotar. Sous un soleil de plomb, entre les canyons balayés par la
        poussière et les côtes sauvages, une nouvelle nation tente de
        s'enraciner. La Horde ne cherche plus seulement à vaincre ; elle cherche
        à bâtir un foyer. Mais Durotar est une terre de frontière. Les routes
        sont longues, les points d'eau précieux, et les prédateurs – bêtes
        sauvages, peuples hostiles ou fantômes du passé – rôdent au-delà de la
        lueur des feux de camp. C'est ici, au milieu du fracas des pioches et du
        grondement des caravanes, que votre histoire commence.</p>

        <h2 id="la-période--quatre-ans-après-hyjal">La période — Quatre ans
        après Hyjal</h2>

        <p>Nous sommes environ quatre ans après la bataille du mont Hyjal, qui a
        vu les peuples d'Azeroth s'unir pour repousser la Légion ardente. Ces
        événements ne sont pas de l'histoire ancienne : la plupart de ceux que
        vous croisez les ont vécus.</p>

        <p>Sous la direction du Chef de guerre Thrall, les Orcs ont traversé
        l'océan pour fonder la Nouvelle Horde en Kalimdor. Ils ont été rejoints
        par les fiers Taurens de Mulgore et les ingénieux Trolls Darkspear, avec
        qui ils partagent désormais le défi de survivre sur ces terres
        nouvelles. Les Réprouvés ont également rejoint l'alliance, bien que leur
        présence reste lointaine et nimbée de mystère. Si la grande guerre est
        achevée, la trêve avec l'Alliance est fragile. Les blessures sont
        récentes, et le maintien de la paix demande autant de force que la
        guerre elle-même.</p>

        <h2 id="durotar-aujourdhui">Durotar aujourd'hui</h2>

        <p>Vivre en Durotar, c'est accepter la rudesse de la terre. Le climat
        est brûlant, la roche omniprésente, et chaque ressource a de la valeur.
        Pourtant, la région bouillonne de vie. Des caravanes lourdement chargées
        sillonnent les routes poussiéreuses entre les avant-postes, escortées
        par des guerriers et des chasseurs aguerris. Les péons orcs et les
        artisans travaillent sans relâche pour fortifier les campements.</p>

        <p>Au nord se dresse Orgrimmar. La jeune capitale n'est pas un simple
        campement de fortune, c'est le cœur battant de la Horde, un symbole
        massif de puissance et de pérennité. Au sud, les Trolls Darkspear se
        sont établis sur la côte de Sen'jin, apportant leur mysticisme à cette
        alliance de survivants. Durotar est un chantier à ciel ouvert, une terre
        d'opportunités autant que de dangers constants.</p>

        <h2 id="quelle-campagne-allons-nous-jouer-">Quelle campagne allons-nous
        jouer ?</h2>

        <p><em>Champions of Azeroth</em> vous propose d'explorer cette frontière
        en pleine effervescence. Vous n'êtes pas encore les grands héros dont on
        chante les exploits dans les tavernes ; vous êtes ceux qui rendent la
        vie possible au quotidien.</p>

        <p>Vous allez parcourir les routes de Durotar, rencontrer ses habitants
        et prendre parti dans les conflits locaux. L'aventure émergera de vos
        choix et des responsabilités que vous accepterez de porter. Il y aura de
        l'exploration, de l'enquête, des combats viscéraux et des rencontres
        avec des figures familières. Vos décisions auront des conséquences
        visibles sur les campements et les communautés que vous aiderez. Vous
        participerez activement à la construction de la Horde.</p>

        <h2 id="quel-personnage-imaginer-">Quel personnage imaginer ?</h2>

        <p>Il n'y a pas de profil imposé. Vous pouvez être un Orc fier de sa
        nouvelle capitale, un Troll cherchant à honorer les esprits de Kalimdor,
        un Tauren venu prêter main-forte à ses frères d'armes, ou même un
        voyageur venu d'ailleurs, porteur d'un passé trouble. Vous pouvez être
        un jeune guerrier, un chaman en quête de sens, un éclaireur solitaire ou
        un artisan de la Horde.</p>

        <p>La question essentielle n'est pas seulement de savoir d'où vous
        venez, mais ce que vous faites ici aujourd'hui. Pourquoi êtes-vous en
        Durotar ? Qu'est-ce que cette nouvelle Horde représente pour vous ?
        Qu'espérez-vous y trouver, y construire ou y devenir ? Et surtout,
        qu'est-ce qui pourrait vous pousser à prendre la route, à risquer votre
        peau et à lier votre destin à celui d'autres voyageurs ?</p>

        <h2 id="le-point-de-départ">Le point de départ</h2>

        <p>Vous vous trouvez à Tranchecolline (Razor Hill), un avant-poste
        incontournable au carrefour des routes poussiéreuses de Durotar. Autour
        de vous, l'activité est incessante : des gardes scrutent l'horizon, des
        marchands négocient âprement et des voyageurs se reposent à l'ombre de
        l'auberge. Quelque part entre l'odeur du cuir tanné, les caravanes qui
        remontent vers Orgrimmar et les histoires que l'on échange le soir
        autour du feu, votre aventure est sur le point de commencer.</p>
