    name: Durotar, quatre ans après le mont Hyjal
    type: text
    text:
      content: >-
        <h2 id="là-où-commence-votre-histoire">Là où commence votre
        histoire</h2>

        <p>Quatre années se sont écoulées depuis la bataille du mont Hyjal, où
        les peuples d’Azeroth s’unirent pour repousser la Légion ardente et
        mettre un terme à la Troisième Guerre.</p>

        <p>La victoire n’a pourtant pas apporté la paix.</p>

        <p>Les anciennes alliances se sont défaites, les vieilles rancunes
        refont surface et chacun tente désormais de reconstruire ce que les
        guerres ont détruit.</p>

        <p>Pour la Horde de Thrall, cette reconstruction porte un nom :
        <strong>Durotar</strong>.</p>

        <hr>

        <h2 id="une-nouvelle-patrie">Une nouvelle patrie</h2>

        <p>Les Orcs ont longtemps vécu sans véritable foyer.</p>

        <p>Après leur arrivée en Kalimdor et les combats de la Troisième Guerre,
        Thrall choisit les terres arides de l’est pour établir une nouvelle
        patrie. Il leur donna le nom de <strong>Durotar</strong>, en mémoire de
        son père Durotan.</p>

        <p>Au nord s’élève désormais <strong>Orgrimmar</strong>, capitale de la
        Horde, nommée en l’honneur d’Orgrim Doomhammer.</p>

        <p>La cité est jeune, mais elle est déjà le cœur politique et militaire
        de la Horde. Ses murailles dominent les canyons, ses forges ne
        désemplissent pas et des Orcs, Trolls, Taurens et autres alliés y
        circulent chaque jour.</p>

        <p>Thrall y règne toujours comme <strong>Chef de guerre de la
        Horde</strong>.</p>

        <p>La Horde qu’il cherche à bâtir n’est plus celle des conquêtes
        d’autrefois. Son peuple doit maintenant survivre, construire, commercer,
        défendre ses frontières et prouver qu’il peut se forger un avenir sur
        cette terre.</p>

        <hr>

        <h2 id="durotar-nest-pas-encore-un-royaume-paisible">Durotar n’est pas
        encore un royaume paisible</h2>

        <p>Durotar est une patrie.</p>

        <p>Mais c’est encore une <strong>terre de frontière</strong>.</p>

        <p>Le climat est brutal. L’eau est rare. Les terres cultivables sont
        limitées. Les routes sont longues, poussiéreuses et parfois
        dangereuses.</p>

        <p>Les convois qui transportent nourriture, outils, minerai ou matériel
        sont essentiels à la survie des avant-postes et des villages.</p>

        <p>La Horde contrôle ses principales implantations, mais de nombreuses
        régions restent sauvages ou disputées.</p>

        <p>Des <strong>quilboars Razormane</strong> occupent toujours certaines
        parties du territoire et supportent mal l’expansion de la Horde.</p>

        <p>Des bandes de <strong>centaures Kolkar</strong> parcourent les terres
        voisines et représentent une menace régulière pour les routes et les
        communautés du sud.</p>

        <p>Sur la côte, des soldats humains liés à <strong>Kul Tiras</strong>
        sont encore présents autour de Tiragarde et les affrontements avec eux
        n’ont jamais totalement cessé.</p>

        <p>Et dans les ravins, les collines et les terres éloignées des routes,
        la faune de Durotar peut être aussi dangereuse que n’importe quel ennemi
        : scorpides, raptors, sangliers et autres prédateurs disputent eux aussi
        leur territoire aux nouveaux arrivants.</p>

        <hr>

        <h2 id="razor-hill">Razor Hill</h2>

        <p>Au centre de Durotar se trouve <strong>Razor Hill</strong>.</p>

        <p>Ce n’est pas une grande cité, mais c’est l’un des points essentiels
        de la région.</p>

        <p>Des soldats y montent la garde. Des chasseurs et des éclaireurs y
        passent régulièrement. Des convois s’y arrêtent avant de poursuivre vers
        Orgrimmar, Sen’jin ou les avant-postes plus éloignés.</p>

        <p>Pour beaucoup d’habitants de Durotar, Razor Hill est simplement
        l’endroit où l’on apprend ce qui se passe dans la région.</p>

        <p>Un convoi en retard.</p>

        <p>Une patrouille disparue.</p>

        <p>Des bêtes qui se rapprochent des routes.</p>

        <p>Des rumeurs venant de la côte.</p>

        <p>Un conflit pour un point d’eau.</p>

        <p>Des travailleurs qui ne sont pas revenus.</p>

        <p>Dans une terre encore jeune, ce sont souvent de petits problèmes qui
        décident si une communauté peut continuer à vivre normalement.</p>

        <hr>

        <h2 id="les-trolls-darkspear">Les Trolls Darkspear</h2>

        <p>Les Trolls Darkspear sont parmi les plus anciens alliés de
        Thrall.</p>

        <p>Après avoir combattu aux côtés des Orcs durant la Troisième Guerre,
        ils se sont installés dans le sud de Durotar et autour des <strong>Îles
        de l’Écho</strong>.</p>

        <p>Mais leur nouvelle patrie a elle aussi connu des troubles.</p>

        <p>Le sorcier <strong>Zalazane</strong>, autrefois membre de leur tribu,
        s’est retourné contre les siens et a pris le contrôle d’une partie des
        îles.</p>

        <p>De nombreux Darkspear vivent désormais autour de
        <strong>Sen’jin</strong>, sur la côte sud de Durotar, en attendant le
        jour où ils pourront reprendre pleinement possession de leur foyer.</p>

        <p>Leur chef, <strong>Vol’jin</strong>, demeure l’un des proches alliés
        de Thrall.</p>

        <hr>

        <h2 id="une-paix-fragile">Une paix fragile</h2>

        <p>La Horde et l’Alliance ont combattu côte à côte au mont Hyjal.</p>

        <p>Cette alliance appartient déjà au passé.</p>

        <p>Thrall et Jaina Proudmoore ont tenté de préserver une forme de paix
        entre leurs peuples, mais les blessures des guerres précédentes restent
        profondes.</p>

        <p>Sur plusieurs frontières, les incidents se multiplient.</p>

        <p>Des soldats combattent.</p>

        <p>Des patrouilles disparaissent.</p>

        <p>Des représailles sont organisées.</p>

        <p>Les dirigeants peuvent souhaiter éviter une nouvelle guerre totale,
        mais cela ne signifie pas que leurs peuples se font confiance.</p>

        <p>Dans Durotar, un uniforme humain aperçu sur une crête suffit encore à
        mettre une patrouille en alerte.</p>

        <hr>

        <h2 id="une-horde-en-construction">Une Horde en construction</h2>

        <p>Pour ceux qui vivent ici, la Horde n’est pas encore une vieille
        nation.</p>

        <p>Elle est quelque chose qu’il faut construire.</p>

        <p>Ses routes doivent être protégées.</p>

        <p>Ses villages doivent être ravitaillés.</p>

        <p>Ses frontières doivent être défendues.</p>

        <p>Ses alliances doivent être entretenues.</p>

        <p>Et ses habitants doivent apprendre à vivre ensemble après des années
        de guerre, d’exil et de survie.</p>

        <p>Les anciens se souviennent encore des camps d’internement, de
        Draenor, de la corruption démoniaque ou des guerres contre
        l’Alliance.</p>

        <p>Les plus jeunes, eux, peuvent espérer appartenir à la première
        génération qui connaîtra réellement Durotar comme <strong>sa
        maison</strong>.</p>

        <hr>

        <h2 id="ce-que-lon-dit-souvent-à-durotar">Ce que l’on dit souvent à
        Durotar</h2>

        <blockquote>

        <p><strong>Orgrimmar est déjà une capitale.<br>

        Durotar est encore une frontière.</strong></p>

        </blockquote>

        <p>Ici, personne ne s’étonne qu’un village demande de l’aide, qu’une
        route devienne dangereuse ou qu’une vieille rancune provoque un nouvel
        affrontement.</p>

        <p>La Horde a gagné une patrie.</p>

        <p>Il lui reste maintenant à apprendre à la conserver.</p>

        <p>Et c’est dans ce Durotar-là que commence votre histoire.</p>
