pages:
  - _id: 216697f9320ef355
    name: Druide
    type: text
    text:
      content: >-
        <div class="image-banner">

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/tauren-druid-artwork.webp?v=93de4bba30c6"
        alt="tauren-druid-artwork.webp" class="default-width"></p>

        </div>

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_druid.jpg"
        alt="Druide" width="80">

        <p>Le Druide protège l'équilibre naturel en combinant <strong>magie de
        la nature</strong> et <strong>métamorphose</strong>. Dans <em>Champions
        of Azeroth</em>, il peut frapper à distance avec les forces du soleil,
        de la lune et des étoiles, soigner, contrôler le terrain ou adopter des
        formes spirituelles animales.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>






































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d8</strong></td></tr><tr><td>Caractéristique
        principale</td><td><strong>Sagesse</strong></td></tr><tr><td>Jets de
        sauvegarde</td><td>Intelligence,
        Sagesse</td></tr><tr><td>Armures</td><td>Légères</td></tr><tr><td>Armes</td><td>Simples</td></tr><tr><td>Outil</td><td>Herbalism
        kit</td></tr><tr><td>Lancement de sorts</td><td>Préparé, basé sur la
        Sagesse</td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="spirit-shape">Spirit Shape</h3>

        <p>La métamorphose est au cœur de cette version du Druide. Le personnage
        adopte des <strong>formes spirituelles</strong> : Claw, Fang, Waves,
        Talon, puis éventuellement d'autres selon la spécialisation.</p>

        <p>Particularité importante de <em>Champions of Azeroth</em> : la
        transformation <strong>ne remplace pas les PV actuels ou maximums du
        Druide</strong>. Les dégâts subis sous forme spirituelle sont donc
        directement ceux du personnage.</p>

        <h3 id="wild-gifts">Wild Gifts</h3>

        <p>À partir du niveau 2, le Druide choisit des <strong>Wild
        Gifts</strong>, des techniques qui personnalisent sa relation à la
        nature et améliorent notamment ses transformations.</p>

        <h3 id="spellcasting">Spellcasting</h3>

        <p>Le Druide reste un lanceur de sorts complet utilisant la
        <strong>Sagesse</strong>, avec préparation des sorts après un repos
        long.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="équilibre--balance">Équilibre — Balance</h3>

        <blockquote>

        <p>Déchaîne la puissance du soleil, de la lune et des étoiles.</p>

        </blockquote>

        <p>Orientation : magie offensive, récupération de puissance magique,
        magie céleste.</p>

        <h3 id="farouche--feral">Farouche — Feral</h3>

        <blockquote>

        <p>Adopte des formes de grands prédateurs pour protéger ses alliés et
        chasser ses ennemis.</p>

        </blockquote>

        <p>Orientation : métamorphose et combat physique. Cette spécialisation
        réduit volontairement la progression de lancement de sorts au profit du
        combat en forme animale.</p>

        <h3 id="restauration--restoration">Restauration — Restoration</h3>

        <blockquote>

        <p>Utilise le pouvoir apaisant de la nature pour soigner et
        restaurer.</p>

        </blockquote>

        <p>Orientation : soins, soutien et résilience du groupe.</p>

        <h2 id="race-disponible-dans-cette-campagne">Race disponible dans cette
        campagne</h2>

        <ul>

        <li><strong>Tauren uniquement</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Druide peut naturellement briller dans :</p>

        <ul>

        <li>la lecture du comportement de la faune ;</li>

        <li>l'exploration de lieux naturels ;</li>

        <li>la recherche de passages ;</li>

        <li>l'interprétation de perturbations écologiques ;</li>

        <li>les interactions avec les animaux et les forces de la nature.</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>Le Druide demande de suivre à la fois :</p>

        <ul>

        <li>une liste de sorts préparés ;</li>

        <li>plusieurs formes spirituelles ;</li>

        <li>des Wild Gifts ;</li>

        <li>les capacités propres à sa spécialisation.</li>

        </ul>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>changer de rôle selon les situations ;</li>

        <li>te métamorphoser ;</li>

        <li>utiliser la nature comme outil d'exploration autant que de combat
        ;</li>

        <li>jouer un Tauren très lié à l'équilibre du monde.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        13–20</strong>.</li>

        </ul>
