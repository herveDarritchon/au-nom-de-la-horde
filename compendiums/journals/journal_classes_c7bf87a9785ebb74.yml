  - _id: a62f8344c3d8c272
    name: Chasseur
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/nm/wallhaven-nmxrr9.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_hunter.jpg"
        alt="Chasseur" width="80">

        <p>Le Chasseur est un maître de l'environnement : pisteur, combattant
        martial, spécialiste de la survie et éventuellement maître d'un
        compagnon animal.</p>

        <p><em>Champions of Azeroth</em> ne le traite pas comme un simple «
        archer ». Il peut combattre à distance ou au contact, poser des pièges,
        exploiter son environnement et concentrer ses techniques sur une
        proie.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>






































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d10</strong></td></tr><tr><td>Caractéristiques
        principales</td><td><strong>Dextérité et
        Sagesse</strong></td></tr><tr><td>Jets de sauvegarde</td><td>Force,
        Dextérité</td></tr><tr><td>Armures</td><td>Légères,
        intermédiaires</td></tr><tr><td>Boucliers</td><td>Oui</td></tr><tr><td>Armes</td><td>Simples
        et martiales</td></tr><tr><td>Compétences</td><td>3 au choix dans une
        liste orientée terrain/enquête</td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="trailblazer">Trailblazer</h3>

        <p>Le Chasseur facilite les voyages du groupe : terrain difficile,
        rythme de déplacement, vigilance et furtivité collective.</p>

        <h3 id="hunting-tactics">Hunting Tactics</h3>

        <p>Dès le niveau 1, le personnage choisit une orientation structurante
        :</p>

        <ul>

        <li><strong>Lone Wolf</strong> : marquer et traquer personnellement une
        proie ;</li>

        <li><strong>Animal Companion</strong> : voyager et combattre avec un
        compagnon animal.</li>

        </ul>

        <p>Ce choix est distinct de la spécialisation de niveau 3.</p>

        <h3 id="focus">Focus</h3>

        <p>À partir du niveau 2, le Chasseur dispose de <strong>Focus
        Dice</strong> et de <strong>Focus Techniques</strong>. Ces dés
        alimentent des techniques tactiques et deviennent progressivement plus
        puissants.</p>

        <h3 id="wild-lore">Wild Lore</h3>

        <p>Le Chasseur acquiert aussi une forme légère de magie sauvage,
        alimentée par la Sagesse et pouvant également consommer des dés de
        Focus.</p>

        <h3 id="animal-aspects">Animal Aspects</h3>

        <p>La progression donne accès à plusieurs aspects animaux apportant
        mobilité, défense ou furtivité.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="maîtrise-des-bêtes--beast-mastery">Maîtrise des bêtes — Beast
        Mastery</h3>

        <blockquote>

        <p>Maître du sauvage qui apprivoise et entraîne des bêtes
        puissantes.</p>

        </blockquote>

        <p><strong>Prérequiert d'avoir choisi Animal Companion.</strong></p>

        <p>Orientation : compagnon plus puissant, coopération avec le
        familier.</p>

        <h3 id="précision--marksmanship">Précision — Marksmanship</h3>

        <blockquote>

        <p>Tireur d'élite spécialisé dans l'élimination des ennemis à grande
        distance.</p>

        </blockquote>

        <p>Orientation : portée, précision, critiques et attaques à
        distance.</p>

        <h3 id="survie--survival">Survie — Survival</h3>

        <blockquote>

        <p>Pisteur robuste utilisant venins, explosifs et pièges comme
        armes.</p>

        </blockquote>

        <p>Orientation : terrain, pièges, bombes et contrôle.</p>

        <h2 id="races-disponibles-dans-cette-campagne">Races disponibles dans
        cette campagne</h2>

        <ul>

        <li><strong>Orc</strong></li>

        <li><strong>Troll</strong></li>

        <li><strong>Tauren</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Chasseur est particulièrement utile pour :</p>

        <ul>

        <li>suivre une piste ;</li>

        <li>identifier une créature ;</li>

        <li>repérer une embuscade ;</li>

        <li>reconnaître un terrain ;</li>

        <li>trouver ou sécuriser un itinéraire ;</li>

        <li>comprendre le comportement d'animaux ou de prédateurs.</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>La classe offre beaucoup de choix tactiques : Hunting Tactics, style
        de combat, techniques de Focus, Wild Lore, Animal Aspects et
        spécialisation.</p>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>être très utile en exploration ;</li>

        <li>jouer un éclaireur ;</li>

        <li>avoir éventuellement un compagnon animal ;</li>

        <li>utiliser des pièges et techniques plutôt qu'une liste de sorts
        complète.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        21–29</strong>.</li>

        </ul>
