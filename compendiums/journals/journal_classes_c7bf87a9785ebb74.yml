  - _id: f00a917b33d03583
    name: Paladin
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/8x/wallhaven-8x1ez1.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_paladin.jpg"
        alt="Paladin" width="80">

        <p>Le Paladin est un guerrier sacré qui utilise la
        <strong>Lumière</strong> pour protéger, soigner et frapper ses
        ennemis.</p>

        <p>Il combine une excellente protection martiale, des armes, des soins,
        des sorts et des effets de soutien de proximité.</p>

        <h2 id="statut-particulier-dans-cette-campagne">Statut particulier dans
        cette campagne</h2>

        <p>Dans la période jouée, le Paladin n'est <strong>pas</strong> une
        classe Horde standard.</p>

        <p>La seule option autorisée est :</p>

        <blockquote>

        <p><strong>Paladin sin'dorei</strong>, ancien Haut-Elfe de Quel'Thalas
        formé à la Lumière avant ou pendant la Troisième Guerre.</p>

        </blockquote>

        <p>La classe utilisée est exactement le <strong>Paladin de Champions of
        Azeroth</strong>. Seul le contexte racial et historique est spécifique à
        la campagne.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>






































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d10</strong></td></tr><tr><td>Caractéristiques
        principales</td><td><strong>Force et
        Charisme</strong></td></tr><tr><td>Jets de sauvegarde</td><td>Sagesse,
        Charisme</td></tr><tr><td>Armures</td><td>Toutes</td></tr><tr><td>Boucliers</td><td>Oui</td></tr><tr><td>Armes</td><td>Simples
        et martiales</td></tr><tr><td>Lancement de sorts</td><td>Préparé, basé
        sur le Charisme</td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="divine-sense">Divine Sense</h3>

        <p>Détection des célestes, fiélons, morts-vivants et lieux ou objets
        consacrés/profanés.</p>

        <h3 id="lay-on-hands">Lay on Hands</h3>

        <p>Réserve de soins utilisable pour restaurer des PV et traiter maladies
        ou poisons.</p>

        <h3 id="fighting-style">Fighting Style</h3>

        <p>Le Paladin choisit un style martial dès le niveau 2.</p>

        <h3 id="crusader-strike">Crusader Strike</h3>

        <p>Version <em>Champions of Azeroth</em> du smite : un coup de mêlée
        peut consommer un emplacement de sort pour infliger des dégâts radiants
        supplémentaires, renforcés contre morts-vivants et fiélons.</p>

        <h3 id="spellcasting-et-auras">Spellcasting et Auras</h3>

        <p>Le Paladin combine sorts de soutien et présence protectrice. Ses
        auras gagnent en importance au fil des niveaux.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="sacré--holy">Sacré — Holy</h3>

        <blockquote>

        <p>Invoque la Lumière pour protéger et soigner les alliés.</p>

        </blockquote>

        <p>Orientation : soins, soutien et efficacité accrue de Lay on
        Hands.</p>

        <h3 id="protection--protection">Protection — Protection</h3>

        <blockquote>

        <p>Utilise la magie sacrée pour se protéger et défendre ses alliés.</p>

        </blockquote>

        <p>Orientation : tanking, réduction des dégâts et incitation des ennemis
        à l'attaquer lui plutôt que les autres.</p>

        <h3 id="vindicte--retribution">Vindicte — Retribution</h3>

        <blockquote>

        <p>Croisé qui juge et punit ses adversaires avec armes et magie
        sacrée.</p>

        </blockquote>

        <p>Orientation : combat offensif, dégâts radiants et pression
        martiale.</p>

        <h2 id="race-disponible-dans-cette-campagne">Race disponible dans cette
        campagne</h2>

        <ul>

        <li><strong>Sin'dorei / Silvermoon Blood Elf uniquement</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Paladin peut naturellement intervenir dans :</p>

        <ul>

        <li>les questions de foi et de serment ;</li>

        <li>la protection de civils ou de blessés ;</li>

        <li>les relations d'autorité ;</li>

        <li>l'identification de corruption ou de profanation ;</li>

        <li>les dilemmes entre devoir, loyauté et conviction personnelle.</li>

        </ul>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>être solide au premier rang ;</li>

        <li>soigner sans être un lanceur de sorts pur ;</li>

        <li>mêler armes et magie ;</li>

        <li>jouer un personnage dont la foi et l'histoire comptent autant que
        l'efficacité martiale.</li>

        </ul>

        <h2 id="sources">Sources</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        36–41</strong>.</li>

        <li>Document de campagne : <strong>Option de personnage — Paladin
        sin'dorei</strong>.</li>

        </ul>
