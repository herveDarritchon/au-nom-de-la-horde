  - _id: a78c04c3d8fb6a39
    name: Chaman
    type: text
    text:
      content: >-
        <div class="image-banner">

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/orc-shaman-artwork.webp?v=23f4adc827d5"
        alt="orc-shaman-artwork.webp" class="default-width"></p>

        </div>

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_shaman.jpg"
        alt="Chaman" width="80">

        <p>Le Chaman est un médiateur entre les mortels et les éléments. Il ne «
        commande » pas simplement à la nature : il entre en relation avec les
        forces de <strong>l'Air, de la Terre, du Feu et de l'Eau</strong>, qui
        sont puissantes, changeantes et parfois conflictuelles.</p>

        <p>Il utilise la magie, les totems et sa compréhension spirituelle pour
        soutenir ses alliés ou combattre.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>






































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d8</strong></td></tr><tr><td>Caractéristique
        principale</td><td><strong>Sagesse</strong></td></tr><tr><td>Jets de
        sauvegarde</td><td>Sagesse,
        Charisme</td></tr><tr><td>Armures</td><td>Légères,
        intermédiaires</td></tr><tr><td>Boucliers</td><td>Oui</td></tr><tr><td>Armes</td><td>Simples</td></tr><tr><td>Lancement
        de sorts</td><td>Basé sur la Sagesse</td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="kalimag">Kalimag</h3>

        <p>Le Chaman connaît le langage sacré des élémentaires et est
        particulièrement compétent pour interagir avec eux.</p>

        <h3 id="elemental-attunement">Elemental Attunement</h3>

        <p>Dès le niveau 1, le personnage s'accorde à un élément :</p>

        <ul>

        <li>Air ;</li>

        <li>Earth ;</li>

        <li>Fire ;</li>

        <li>Water.</li>

        </ul>

        <p>Cet accord apporte des bénéfices différents et peut être changé après
        un repos long.</p>

        <h3 id="totemist">Totemist</h3>

        <p>À partir du niveau 2, le Chaman peut invoquer un <strong>totem
        élémentaire</strong>.</p>

        <p>Les totems proposent des pouvoirs différents selon l'élément :
        soutien, dégâts, contrôle ou protection.</p>

        <h3 id="shaman-specialization">Shaman Specialization</h3>

        <p>La spécialisation arrive au niveau 3.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="élémentaire--elemental">Élémentaire — Elemental</h3>

        <blockquote>

        <p>Utilise la magie primordiale pour frapper à distance avec éclairs,
        séismes et lave.</p>

        </blockquote>

        <p>Orientation : lanceur de sorts offensif et puissance élémentaire.</p>

        <h3 id="amélioration--enhancement">Amélioration — Enhancement</h3>

        <blockquote>

        <p>Appelle les esprits directement au combat et renforce ses coups avec
        la puissance des éléments.</p>

        </blockquote>

        <p>Orientation : combat martial renforcé par la magie.</p>

        <h3 id="restauration--restoration">Restauration — Restoration</h3>

        <blockquote>

        <p>Utilise son pouvoir spirituel pour rendre la santé aux alliés
        blessés.</p>

        </blockquote>

        <p>Orientation : soins et soutien.</p>

        <h2 id="races-disponibles-dans-cette-campagne">Races disponibles dans
        cette campagne</h2>

        <ul>

        <li><strong>Orc</strong></li>

        <li><strong>Troll</strong></li>

        <li><strong>Tauren</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Chaman peut naturellement :</p>

        <ul>

        <li>dialoguer avec des élémentaires ;</li>

        <li>ressentir ou interpréter une perturbation élémentaire ;</li>

        <li>accomplir des rites ;</li>

        <li>servir de médiateur entre besoins matériels et équilibre spirituel
        ;</li>

        <li>comprendre que la réaction d'un élément n'est pas nécessairement une
        simple « attaque de monstre ».</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>Le Chaman gère à la fois :</p>

        <ul>

        <li>des sorts ;</li>

        <li>une attunement élémentaire ;</li>

        <li>des totems ;</li>

        <li>les pouvoirs de sa spécialisation.</li>

        </ul>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>jouer la spiritualité de Warcraft ;</li>

        <li>utiliser des totems ;</li>

        <li>choisir entre lanceur offensif, combattant magique ou soigneur
        ;</li>

        <li>interagir directement avec les éléments.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        53–59</strong>.</li>

        </ul>
