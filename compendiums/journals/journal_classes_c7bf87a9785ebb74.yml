  - _id: 6563275b1946c568
    name: Guerrier
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/0w/wallhaven-0w2my6.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_warrior.jpg"
        alt="Guerrier" width="80">

        <p>Le Guerrier est le maître du combat armé. Il combine maîtrise des
        armes et armures, endurance, mobilité tactique et
        <strong>Rage</strong>.</p>

        <p>Dans <em>Champions of Azeroth</em>, il part largement du Fighter de
        D&amp;D 5e mais ajoute un véritable système de Rage et de manœuvres pour
        retrouver davantage la sensation Warcraft.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>


































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d10</strong></td></tr><tr><td>Caractéristique
        principale</td><td><strong>Force ou
        Dextérité</strong></td></tr><tr><td>Jets de sauvegarde</td><td>Force,
        Constitution</td></tr><tr><td>Armures</td><td>Toutes</td></tr><tr><td>Boucliers</td><td>Oui</td></tr><tr><td>Armes</td><td>Simples
        et martiales</td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="fighting-style">Fighting Style</h3>

        <p>Le personnage commence avec un style de combat adapté à son
        équipement et à sa manière de se battre.</p>

        <h3 id="second-wind">Second Wind</h3>

        <p>Récupération personnelle rapide de PV.</p>

        <h3 id="action-surge">Action Surge</h3>

        <p>Possibilité d'effectuer ponctuellement une action supplémentaire.</p>

        <h3 id="rage">Rage</h3>

        <p>À partir du niveau 2, le Guerrier génère progressivement des
        <strong>Rage Points</strong> pendant le combat.</p>

        <p>Ces points alimentent des <strong>Rage Maneuvers</strong> :
        techniques spéciales déclenchées au bon moment.</p>

        <p>La Rage est donc une ressource dynamique construite pendant
        l'affrontement, et non simplement un état de berserker.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="armes--arms">Armes — Arms</h3>

        <blockquote>

        <p>Maître d'armes aguerri utilisant mobilité et attaques écrasantes.</p>

        </blockquote>

        <p>Orientation : maîtrise d'une arme, lecture de l'adversaire et
        techniques martiales.</p>

        <h3 id="fureur--fury">Fureur — Fury</h3>

        <blockquote>

        <p>Berserker qui libère une véritable rafale d'attaques.</p>

        </blockquote>

        <p>Orientation : agressivité, cadence et pression offensive.</p>

        <h3 id="protection--protection">Protection — Protection</h3>

        <p>Orientation : bouclier, contrôle des ennemis et défense des
        alliés.</p>

        <h2 id="races-disponibles-dans-cette-campagne">Races disponibles dans
        cette campagne</h2>

        <ul>

        <li><strong>Orc</strong></li>

        <li><strong>Troll</strong></li>

        <li><strong>Tauren</strong></li>

        <li><strong>Réprouvé</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Guerrier n'est pas limité à « taper ». Il peut naturellement
        exploiter :</p>

        <ul>

        <li>connaissance militaire ;</li>

        <li>tactique ;</li>

        <li>lecture d'une position défensive ;</li>

        <li>commandement ;</li>

        <li>intimidation ;</li>

        <li>expérience des armes et armures.</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>La classe est mécaniquement martiale mais possède beaucoup de
        décisions en combat grâce :</p>

        <ul>

        <li>au choix de Fighting Style ;</li>

        <li>aux Rage Maneuvers ;</li>

        <li>à la spécialisation ;</li>

        <li>au timing d'Action Surge et de Second Wind.</li>

        </ul>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>maîtriser le combat sans gérer une liste complète de sorts ;</li>

        <li>porter n'importe quelle armure ou arme ;</li>

        <li>construire ta puissance au fil du combat grâce à la Rage ;</li>

        <li>jouer aussi bien un duelliste, un berserker qu'un protecteur.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        66–71</strong>.</li>

        </ul>
