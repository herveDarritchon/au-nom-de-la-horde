  - _id: 4fdfe10aad332e08
    name: Voleur
    type: text
    text:
      content: >-
        <div class="image-banner">

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/rogue-artwork.webp?v=2e67ca9c89ba"
        alt="rogue-artwork.jpg" class="default-width"></p>

        </div>

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_rogue.jpg"
        alt="Voleur" width="80">

        <p>Le Voleur est un spécialiste de la furtivité, du subterfuge, de
        l'opportunisme et des attaques décisives.</p>

        <p>La base reste très proche du Rogue de D&amp;D 5e, mais <em>Champions
        of Azeroth</em> lui ajoute des éléments Warcraft comme les <strong>Dirty
        Tricks</strong> et trois spécialisations adaptées à l'univers.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>






































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d8</strong></td></tr><tr><td>Caractéristique
        principale</td><td><strong>Dextérité</strong></td></tr><tr><td>Jets de
        sauvegarde</td><td>Dextérité,
        Intelligence</td></tr><tr><td>Armures</td><td>Légères</td></tr><tr><td>Armes</td><td>Simples
        + sélection d'armes fines</td></tr><tr><td>Outil</td><td>Thieves'
        tools</td></tr><tr><td>Compétences</td><td>4 au choix — une des classes
        les plus compétentes</td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="expertise">Expertise</h3>

        <p>Le Voleur excelle dans quelques domaines choisis, avec un bonus de
        maîtrise doublé.</p>

        <h3 id="sneak-attack">Sneak Attack</h3>

        <p>Une attaque bien placée inflige des dégâts supplémentaires
        importants.</p>

        <h3 id="cunning-action">Cunning Action</h3>

        <p>À partir du niveau 2, Dash, Disengage ou Hide peuvent être utilisés
        en action bonus.</p>

        <h3 id="dirty-tricks">Dirty Tricks</h3>

        <p>À partir du niveau 6, certaines Sneak Attacks peuvent infliger des
        handicaps temporaires sévères : aveugler, incapaciter ou immobiliser la
        cible.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="assassinat--assassination">Assassinat — Assassination</h3>

        <blockquote>

        <p>Maître des poisons et des frappes vicieuses destinées à éliminer
        rapidement une cible.</p>

        </blockquote>

        <p>Orientation : poison, préparation et létalité ciblée.</p>

        <h3 id="hors-la-loi--outlaw">Hors-la-loi — Outlaw</h3>

        <blockquote>

        <p>Bretteur audacieux utilisant agilité et ruse pour tenir tête à ses
        ennemis en mêlée.</p>

        </blockquote>

        <p>Orientation : mobilité, combat rapproché et attaques multiples.</p>

        <h3 id="finesse--subtlety">Finesse — Subtlety</h3>

        <blockquote>

        <p>Traqueur des ombres qui exploite l'obscurité pour surprendre ses
        proies.</p>

        </blockquote>

        <p>Orientation : infiltration, embuscade et magie d'ombre légère.</p>

        <h2 id="races-disponibles-dans-cette-campagne">Races disponibles dans
        cette campagne</h2>

        <ul>

        <li><strong>Orc</strong></li>

        <li><strong>Troll</strong></li>

        <li><strong>Réprouvé</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Voleur peut être central pour :</p>

        <ul>

        <li>infiltrer un lieu ;</li>

        <li>ouvrir ou contourner un accès ;</li>

        <li>observer sans être vu ;</li>

        <li>voler ou saboter ;</li>

        <li>manipuler un réseau criminel ;</li>

        <li>interroger la scène d'un cambriolage ou d'une intrusion avec un
        regard de professionnel.</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>Le Voleur fonctionne au mieux lorsqu'il cherche à créer les
        conditions de son avantage au lieu de simplement échanger des attaques
        de front.</p>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>jouer beaucoup avec les compétences ;</li>

        <li>trouver des solutions indirectes ;</li>

        <li>être mobile ;</li>

        <li>privilégier infiltration, ruse et précision.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        48–52</strong>.</li>

        </ul>
