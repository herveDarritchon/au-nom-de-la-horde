  - _id: d0dc7ec14d103a93
    name: Démoniste
    type: text
    text:
      content: >-
        <img src="https://w.wallhaven.cc/full/g8/wallhaven-g8evr7.jpg"
        alt="Bandeau">

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_warlock.jpg"
        alt="Démoniste" width="80">

        <p>Le Démoniste voit dans les puissances démoniaques une source de
        pouvoir à exploiter. Il invoque des démons, manipule le fel et les
        ombres, maudit ses ennemis et peut consumer ou détourner les âmes.</p>

        <p>Le texte de <em>Champions of Azeroth</em> insiste sur cette idée : là
        où d'autres voient un danger mortel, le Démoniste voit une
        <strong>opportunité</strong>.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>


































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d6</strong></td></tr><tr><td>Caractéristique
        principale</td><td><strong>Intelligence</strong></td></tr><tr><td>Jets
        de sauvegarde</td><td>Intelligence,
        Sagesse</td></tr><tr><td>Armure</td><td>Aucune</td></tr><tr><td>Armes</td><td>Dague,
        fléchettes, fronde, bâton, arbalète
        légère</td></tr><tr><td>Magie</td><td><strong>Pact
        Magic</strong></td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="eredun">Eredun</h3>

        <p>Le Démoniste connaît la langue démoniaque.</p>

        <h3 id="pact-magic">Pact Magic</h3>

        <p>Comme le Warlock de D&amp;D 5e, il utilise un petit nombre
        d'emplacements de haut niveau qui reviennent rapidement.</p>

        <h3 id="demon-summoning">Demon Summoning</h3>

        <p>Dès le niveau 1, il peut invoquer un <strong>demonic minion</strong>.
        Les démons disponibles évoluent avec la progression.</p>

        <p>Le démon apporte aussi temporairement au personnage certains sorts
        via <strong>Demonic Magic</strong>.</p>

        <h3 id="warlock-specialization">Warlock Specialization</h3>

        <p>La spécialisation arrive au niveau 2.</p>

        <h3 id="demonic-pact">Demonic Pact</h3>

        <p>Au niveau 3, le Démoniste choisit comment exploiter ses serviteurs
        :</p>

        <ul>

        <li><strong>Pact of Supremacy</strong> : améliore les démons invoqués
        ;</li>

        <li><strong>Pact of Sacrifice</strong> : détruit temporairement le
        serviteur pour absorber une partie de son pouvoir.</li>

        </ul>

        <h3 id="soul-shards">Soul Shards</h3>

        <p>À partir du niveau 5, le Démoniste récolte des <strong>Soul
        Shards</strong> et les dépense pour des rites comme les Healthstones ou
        Soulstones.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="affliction">Affliction</h3>

        <blockquote>

        <p>Maître de la magie d'ombre qui épuise la vie et la volonté des
        ennemis.</p>

        </blockquote>

        <p>Orientation : malédictions, dégâts persistants et
        affaiblissement.</p>

        <h3 id="démonologie--demonology">Démonologie — Demonology</h3>

        <blockquote>

        <p>Maître des démons, renforçant ses serviteurs ou revendiquant leur
        puissance pour lui-même.</p>

        </blockquote>

        <p>Orientation : invocation et synergie avec les minions.</p>

        <h3 id="destruction">Destruction</h3>

        <blockquote>

        <p>Maître du chaos utilisant feu, fel et magie destructrice.</p>

        </blockquote>

        <p>Orientation : dégâts directs massifs et magie explosive.</p>

        <h2 id="races-disponibles-dans-cette-campagne">Races disponibles dans
        cette campagne</h2>

        <ul>

        <li><strong>Orc</strong></li>

        <li><strong>Réprouvé</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Démoniste est particulièrement utile pour :</p>

        <ul>

        <li>reconnaître une vraie corruption démoniaque ;</li>

        <li>comprendre un rituel interdit ;</li>

        <li>négocier avec ou identifier un démon ;</li>

        <li>apporter un savoir que des personnages plus orthodoxes préfèreraient
        ignorer.</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>Le pouvoir du Démoniste est visible et socialement chargé. Être
        jouable ne signifie pas que toutes ses pratiques soient considérées
        comme normales ou rassurantes par les autres membres de la Horde.</p>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>invoquer des démons ;</li>

        <li>jouer avec des pouvoirs dangereux ;</li>

        <li>disposer d'une magie offensive très caractéristique ;</li>

        <li>explorer la frontière entre outil, corruption et domination.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        60–65</strong>.</li>

        </ul>
