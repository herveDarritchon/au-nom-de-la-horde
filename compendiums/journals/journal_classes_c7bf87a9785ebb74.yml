  - _id: 53c4bd2359f7f29c
    name: Mage
    type: text
    text:
      content: >-
        <div class="image-banner">

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/mage-artwork.webp?v=321ce91b6cfb"
        alt="mage-artwork.jpg" class="default-width"></p>

        </div>

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_mage.jpg"
        alt="Mage" width="80">

        <p>Le Mage est l'érudit des arcanes : un lanceur de sorts complet qui
        apprend, prépare et conserve ses sorts dans un
        <strong>spellbook</strong>.</p>

        <p>Cette classe reprend volontairement la structure du Wizard de D&amp;D
        5e, mais l'oriente vers les trois grandes spécialisations emblématiques
        de Warcraft : <strong>Arcane, Fire et Frost</strong>.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>


































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d6</strong></td></tr><tr><td>Caractéristique
        principale</td><td><strong>Intelligence</strong></td></tr><tr><td>Jets
        de sauvegarde</td><td>Intelligence,
        Sagesse</td></tr><tr><td>Armure</td><td>Aucune</td></tr><tr><td>Armes</td><td>Dague,
        fléchettes, fronde, bâton, arbalète légère</td></tr><tr><td>Lancement de
        sorts</td><td>Préparé depuis un spellbook</td></tr></tbody></table>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="spellbook">Spellbook</h3>

        <p>Le Mage commence avec un livre de sorts, apprend de nouveaux sorts en
        progressant et peut également en copier lorsqu'il en découvre en
        aventure.</p>

        <h3 id="evocation">Evocation</h3>

        <p>Cette capacité permet de récupérer une partie des emplacements de
        sorts dépensés pendant un repos court.</p>

        <h3 id="mage-specialization">Mage Specialization</h3>

        <p>La spécialisation arrive dès le <strong>niveau 2</strong>.</p>

        <h3 id="arcane-brilliance">Arcane Brilliance</h3>

        <p>À partir du niveau 3, l'intelligence exceptionnelle du Mage lui
        permet notamment :</p>

        <ul>

        <li>de lancer occasionnellement un sort du spellbook non préparé ;</li>

        <li>d'accélérer certains rituels ;</li>

        <li>de fiabiliser certains tests d'Intelligence.</li>

        </ul>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="arcanes--arcane">Arcanes — Arcane</h3>

        <blockquote>

        <p>Manipule l'essence pure de la magie, renforce ses sorts et retourne
        la magie ennemie contre elle.</p>

        </blockquote>

        <p>Orientation : gestion de <strong>Arcane Charges</strong>, puissance
        contrôlée et défense contre la magie.</p>

        <h3 id="feu--fire">Feu — Fire</h3>

        <blockquote>

        <p>Exploite la puissance destructrice et volatile du feu.</p>

        </blockquote>

        <p>Orientation : dégâts de feu, amplification des dés de dégâts et
        effets explosifs.</p>

        <h3 id="givre--frost">Givre — Frost</h3>

        <blockquote>

        <p>Immobilise et brise les ennemis avec la glace, en s'appuyant
        notamment sur des élémentaires et des protections.</p>

        </blockquote>

        <p>Orientation : contrôle, ralentissement, froid et <strong>Water
        Elemental</strong>.</p>

        <h2 id="races-disponibles-dans-cette-campagne">Races disponibles dans
        cette campagne</h2>

        <ul>

        <li><strong>Troll</strong></li>

        <li><strong>Réprouvé</strong></li>

        </ul>

        <blockquote>

        <p>Le sin'dorei exceptionnel de la campagne utilise bien des traits
        arcaniques, mais son unique classe ouverte est
        <strong>Paladin</strong>.</p>

        </blockquote>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Mage est naturellement très fort pour :</p>

        <ul>

        <li>identifier une anomalie magique ;</li>

        <li>analyser un rituel ;</li>

        <li>comprendre un objet ou dispositif arcanique ;</li>

        <li>utiliser divinations et utilitaires ;</li>

        <li>exploiter les sorts du spellbook préparés pour la situation.</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>Le Mage est fragile physiquement et dépend fortement :</p>

        <ul>

        <li>du choix de sorts ;</li>

        <li>de la préparation quotidienne ;</li>

        <li>de la gestion de ses emplacements ;</li>

        <li>de son spellbook.</li>

        </ul>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>disposer d'une grande boîte à outils magique ;</li>

        <li>préparer des solutions à l'avance ;</li>

        <li>jouer un érudit des arcanes ;</li>

        <li>choisir entre puissance pure, destruction ou contrôle.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        30–35</strong>.</li>

        </ul>
