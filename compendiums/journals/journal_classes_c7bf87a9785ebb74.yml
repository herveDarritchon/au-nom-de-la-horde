  - _id: f9c8907f3d862d58
    name: Prêtre
    type: text
    text:
      content: >-
        <div class="image-banner">

        <p><img
        src="/worlds/au-nom-de-la-horde-cof2/vaults-cache/vault-coa-7e7c5ff7/static/Images/Illustrations/priest-artwork.webp?v=3a7990fa79e1"
        alt="priest-artwork.png" class="default-width"></p>

        </div>

        <blockquote>

        <p><strong>Document méta joueur.</strong> Cette fiche sert à comprendre
        l'identité, le style de jeu et les choix structurants du personnage.
        Elle ne remplace pas les règles complètes de <em>Champions of
        Azeroth</em> ni la fiche Foundry VTT.</p>

        </blockquote>

        <h2 id="fantasy-de-classe">Fantasy de classe</h2>

        <img
        src="https://wow.zamimg.com/images/wow/icons/large/classicon_priest.jpg"
        alt="Prêtre" width="80">

        <p>Le Prêtre canalise des puissances spirituelles pour soutenir ses
        alliés, soigner ou frapper ses ennemis.</p>

        <p>La classe assume explicitement la coexistence de la <strong>Lumière
        et de l'Ombre</strong> : tous les prêtres peuvent toucher à ces deux
        dimensions, même si leur spécialisation détermine ce qu'ils
        approfondissent.</p>

        <h2 id="profil-mécanique">Profil mécanique</h2>


































        <table><thead><tr><th>Élément</th><th>Valeur</th></tr></thead><tbody><tr><td>Dé
        de vie</td><td><strong>d6</strong></td></tr><tr><td>Caractéristique
        principale</td><td><strong>Charisme</strong></td></tr><tr><td>Jets de
        sauvegarde</td><td>Sagesse,
        Charisme</td></tr><tr><td>Armure</td><td>Aucune</td></tr><tr><td>Armes</td><td>Simples</td></tr><tr><td>Lancement
        de sorts</td><td>Préparé, basé sur le Charisme</td></tr></tbody></table>

        <blockquote>

        <p>Particularité importante : dans <em>Champions of Azeroth</em>, la
        caractéristique de lancement des sorts du Prêtre est
        <strong>Charisme</strong>, pas Sagesse.</p>

        </blockquote>

        <h2 id="mécaniques-emblématiques">Mécaniques emblématiques</h2>

        <h3 id="light-and-shadow">Light and Shadow</h3>

        <p>Le Prêtre connaît toujours <strong>bless</strong> et
        <strong>bane</strong> et peut ponctuellement lancer l'un des deux sans
        emplacement de sort ni concentration.</p>

        <h3 id="enlightenment-et-faith-points">Enlightenment et Faith
        Points</h3>

        <p>À partir du niveau 2, le Prêtre reçoit des <strong>Faith
        Points</strong>.</p>

        <p>Ils servent notamment à :</p>

        <ul>

        <li>créer des emplacements de sorts ;</li>

        <li>convertir des emplacements en Faith Points ;</li>

        <li>alimenter différentes capacités de classe.</li>

        </ul>

        <p>Ce système rend la gestion des ressources du Prêtre plus flexible
        qu'un lanceur de sorts classique.</p>

        <h3 id="priest-specialization">Priest Specialization</h3>

        <p>La spécialisation arrive au <strong>niveau 2</strong>.</p>

        <h2 id="spécialisations">Spécialisations</h2>

        <h3 id="discipline">Discipline</h3>

        <blockquote>

        <p>Utilise la magie pour protéger les alliés, soigner leurs blessures et
        punir les ennemis.</p>

        </blockquote>

        <p>Orientation : boucliers, mitigation, soins et dégâts combinés.</p>

        <h3 id="sacré--holy">Sacré — Holy</h3>

        <p>Orientation : guérison directe et amélioration des soins.</p>

        <h3 id="ombre--shadow">Ombre — Shadow</h3>

        <blockquote>

        <p>Utilise des arts sombres issus notamment du Void et des Shadowlands
        pour détruire ses ennemis.</p>

        </blockquote>

        <p>Orientation : dégâts, magie d'Ombre et mécaniques offensives.</p>

        <h2 id="races-disponibles-dans-cette-campagne">Races disponibles dans
        cette campagne</h2>

        <ul>

        <li><strong>Troll</strong></li>

        <li><strong>Réprouvé</strong></li>

        </ul>

        <h2 id="en-dehors-du-combat">En dehors du combat</h2>

        <p>Le Prêtre est particulièrement pertinent pour :</p>

        <ul>

        <li>soigner des blessés ;</li>

        <li>soutenir une population en crise ;</li>

        <li>comprendre croyances, culpabilité et peur ;</li>

        <li>discuter religion, rites et morts-vivants ;</li>

        <li>agir comme conseiller spirituel ou figure d'autorité morale — sans
        obligation d'être moralement irréprochable.</li>

        </ul>

        <h2 id="à-garder-en-tête">À garder en tête</h2>

        <p>Le Prêtre cumule :</p>

        <ul>

        <li>une liste de sorts complète ;</li>

        <li>des sorts préparés ;</li>

        <li>des Faith Points ;</li>

        <li>des capacités propres à sa spécialisation.</li>

        </ul>

        <h2 id="bon-choix-si-tu-veux">Bon choix si tu veux…</h2>

        <ul>

        <li>être un soutien très flexible ;</li>

        <li>jouer avec la dualité Lumière/Ombre ;</li>

        <li>disposer de beaucoup de ressources magiques ;</li>

        <li>donner une forte place à la foi ou à la volonté du personnage.</li>

        </ul>

        <h2 id="source">Source</h2>

        <ul>

        <li>Silverblade, <em>Champions of Azeroth</em>, 30 mai 2021, <strong>pp.
        42–47</strong>.</li>

        </ul>
