        <h1>PNJ — Rogha la Comptable</h1>
            <p><strong>ID :</strong> PNJ-Z01-01-02 · <strong>POI :</strong> Z01-01 · <strong>Zone :</strong> Z01</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Intendante adjointe des approvisionnements · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — intendance</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Faire valider un registre de livraison contradictoire.</td></tr><tr><th>Motivation profonde</th><td>La jeune capitale doit survivre à ses erreurs administratives.</td></tr><tr><th>Obstacle</th><td>Les services exigent des preuves incompatibles ; ses supérieurs veulent aller vite.</td></tr>
              <tr><th>Ligne rouge</th><td>Falsifier la réception d’un convoi jamais arrivé.</td></tr><tr><th>Peut offrir</th><td>Dates de passage, noms de destinataires, accès à un dépôt.</td></tr><tr><th>En échange</th><td>Un témoignage ou une preuve matérielle.</td></tr>
              <tr><th>Attitude initiale</th><td>Pragmatique, agacée par les récits héroïques.</td></tr><tr><th>S'il n'arrive rien</th><td>Envoie le dossier au service central ; une preuve peut devenir plus difficile d’accès.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Ceinture chargée de tablettes et d’étiquettes de cargaison.</p><p><strong>Voix et comportement :</strong> Compte sur les doigts quand elle ment par omission.</p><p><strong>Signe émotionnel :</strong> Perd le fil de ses comptes lorsqu’un nom de supérieur revient.</p>
            <blockquote><p><strong>Première réplique :</strong> « J’ai trois registres pour deux convois ; lequel est censé dire vrai ? »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Vous protégeriez le chantier ou les ouvriers si les deux se contredisent ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Un lot d’outils est mentionné dans deux bordereaux.</td></tr><tr><th>Après échange, aide ou observation</th><td>Livre le nom du bureau ayant imposé un transfert inhabituel.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Elle pense d’abord à une fraude interne ordinaire ; ignore l’infiltration de la Lame ardente.</td></tr><tr><th>Il demande</th><td>Un témoignage ou une preuve matérielle.</td></tr>
              <tr><th>Il peut proposer</th><td>Dates de passage, noms de destinataires, accès à un dépôt.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Falsifier la réception d’un convoi jamais arrivé.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Ouvre des archives de transit et devient une alliée pratique.</td></tr><tr><th>S'ils négocient</th><td>Accepte un contrôle discret sans ordre écrit.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Fait venir un garde et gèle temporairement les documents.</td></tr><tr><th>S'ils l'ignorent</th><td>Envoie le dossier au service central ; une preuve peut devenir plus difficile d’accès.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z01-01. <strong>Relations / autres lieux :</strong> Peut renvoyer vers Z04-04 et Z03-02.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z01/RX-01 : registre fiabilisé, ou enquête administrative hostile aux PJ.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
