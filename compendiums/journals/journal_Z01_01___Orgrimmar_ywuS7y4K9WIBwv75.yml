    text:
      format: 1
      content: |-
        <h1>PNJ — Neeru Lamefeu</h1>
            <p><strong>ID :</strong> PNJ-Z01-01-01 · <strong>POI :</strong> Z01-01 · <strong>Zone :</strong> Z01</p>
            <p><strong>Origine / statut :</strong> Classic — rôle secret confirmé par factions V3</p>
            <p><strong>Fonction :</strong> Interlocuteur démoniste inséré dans Orgrimmar · <strong>Faction / allégeance réelle (MJ) :</strong> Lame ardente (allégeance réelle cachée)</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Obtenir des nouvelles des convois et orienter les soupçons vers un ennemi commode.</td></tr><tr><th>Motivation profonde</th><td>Le chantier souterrain sert les intérêts du réseau.</td></tr><tr><th>Obstacle</th><td>Il ne peut afficher ouvertement ses liens avec le Rocher du crâne.</td></tr>
              <tr><th>Ligne rouge</th><td>Dévoiler spontanément son réseau.</td></tr><tr><th>Peut offrir</th><td>Une introduction, des détails techniques sur les cargaisons ou un rendez-vous.</td></tr><tr><th>En échange</th><td>Une information fraîche et la discrétion.</td></tr>
              <tr><th>Attitude initiale</th><td>Affable, attentif aux nouveaux arrivants.</td></tr><tr><th>S'il n'arrive rien</th><td>Diffuse sa version avant que les PJ n’interrogent d’autres témoins.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Robes soignées, mains toujours propres malgré les chantiers.</p><p><strong>Voix et comportement :</strong> Parle posément; laisse son interlocuteur finir.</p><p><strong>Signe émotionnel :</strong> Replace tranquillement un objet quand on mentionne le Rocher du crâne.</p>
            <blockquote><p><strong>Première réplique :</strong> « Une cargaison disparaît rarement sans que quelqu’un y gagne. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Qui a intérêt à détourner les regards du chantier ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Connaît les rumeurs publiques sur les incidents de routes.</td></tr><tr><th>Après échange, aide ou observation</th><td>Peut identifier les fournitures d’excavation et cherche le nom de leurs convoyeurs.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>MJ : manipule les récits sur les sabotages ; ne révèle pas son rôle par un aveu gratuit.</td></tr><tr><th>Il demande</th><td>Une information fraîche et la discrétion.</td></tr>
              <tr><th>Il peut proposer</th><td>Une introduction, des détails techniques sur les cargaisons ou un rendez-vous.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Dévoiler spontanément son réseau.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Recommande un contact utile, puis tente de diriger les PJ contre une fausse piste.</td></tr><tr><th>S'ils négocient</th><td>Offre un accès limité en échange d’un rapport confidentiel.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Écarte les PJ et active une surveillance discrète.</td></tr><tr><th>S'ils l'ignorent</th><td>Diffuse sa version avant que les PJ n’interrogent d’autres témoins.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z01-01. <strong>Relations / autres lieux :</strong> Réseau de Z02-01 ; projet sous Orgrimmar. Pas de lien public direct avec la garnison de Tiragarde.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z01 : les informations de la capitale deviennent biaisées ; l’enquête peut, si les PJ recoupent leurs sources, exposer une contradiction.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
