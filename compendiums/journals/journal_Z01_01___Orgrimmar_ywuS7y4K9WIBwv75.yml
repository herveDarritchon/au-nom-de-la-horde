        <h1>Orgrimmar</h1>

        <p><strong>Identifiant :</strong> Z01-01</p>

        <p><strong>Zone géographique :</strong> Z01 — Orgrimmar et ses
        abords</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur —
        Convergence</p>

        <h2>Fonction dans la campagne</h2>

        <p>Centre politique et militaire ; convergence progressive des
        intrigues.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Destination de convergence.</p>

        <p><strong>Repère géographique :</strong> Capitale en construction,
        portes, convois et chantiers liés à la progression vers Ragefeu.</p>

        <p><strong>Factions et influences :</strong> Horde (administration) ;
        Lame ardente et Cercle de la Pierre Brisée (influences
        clandestines).</p>

        <p><strong>Références et réserves :</strong> [PC] [FAC]</p>

        <p><em>Le Gouffre de Ragefeu est un donjon accessible depuis ce secteur,
        et non une zone de voyage terrestre.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
