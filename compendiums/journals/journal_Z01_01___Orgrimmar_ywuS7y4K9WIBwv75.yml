        <tr><th>Accès</th><td>À renseigner : ouvert / conditionnel / bloqué /
        caché</td></tr>

        <tr><th>Pression actuelle</th><td>À renseigner : calme / tension /
        crise</td></tr>

        <tr><th>Transformation persistante</th><td>À renseigner</td></tr>

        <tr><th>Routes liées / état</th><td>À renseigner (R01–R08 ou
        RX-*)</td></tr>

        <tr><th>Situation si les PJ arrivent</th><td>À renseigner</td></tr>

        <tr><th>Dernière évolution / séance</th><td>À renseigner</td></tr>

        </tbody></table>

        <p><strong>Rappel :</strong> une découverte validée sur un 20 naturel du
        Guide peut créer un nouveau POI persistant, mais ne donne pas
        automatiquement de bonus de voyage.</p>
