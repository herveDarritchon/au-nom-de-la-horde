  - name: Vol’jin va reprendre les Îles
    type: text
    sort: 500000
    text:
      content: >-
        <h2>Vol’jin va reprendre les Îles</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Garde ta lance prête. Vol’jin attend juste le bon
        moment. Bientôt, on rentre aux Îles. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Déformée.</p>

        <h3>Qui ?</h3>

        <p>La rumeur est surtout portée par de jeunes Sombrelance impatients,
        des familles ayant perdu leur foyer et ceux qui souhaitent voir la
        communauté reprendre l’initiative.</p>

        <p>Les anciens peuvent l’accueillir avec davantage de prudence.</p>

        <h3>Quoi ?</h3>

        <p>Beaucoup de Sombrelance peuvent espérer une reprise des Îles.</p>

        <p>Les sources fournies ne donnent cependant aucun plan concret et
        immédiat de reconquête ordonné par Vol’jin.</p>

        <p>La rumeur transforme un espoir collectif en décision politique
        supposée.</p>

        <h3>Quand ?</h3>

        <p>Elle resurgit après chaque signe de faiblesse attribué à Zalazane,
        chaque retour de fugitif ou chaque observation inhabituelle sur les
        Îles.</p>

        <h3>Où ?</h3>

        <p>À Sen’jin principalement.</p>

        <p>Elle peut atteindre Razor Hill sous une forme encore plus
        catégorique.</p>

        <h3>Pourquoi ?</h3>

        <p>Dire que le chef prépare déjà quelque chose évite d’admettre que la
        communauté ne possède peut-être pas encore de solution.</p>

        <p>La rumeur peut aussi servir à convaincre des hésitants de soutenir
        une initiative locale.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent demander qui aurait réellement reçu des ordres, constater
        que chacun cite une source différente ou découvrir que certains jeunes
        utilisent volontairement le nom de Vol’jin pour donner du poids à leurs
        propres projets.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune reconquête générale ne se déclenche sur la seule base de cette
        rumeur.</p>

        <p>Elle peut toutefois encourager une initiative non autorisée de
        volontaires.</p>
      format: 1
