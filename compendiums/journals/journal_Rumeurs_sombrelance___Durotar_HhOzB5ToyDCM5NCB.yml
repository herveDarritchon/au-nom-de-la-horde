  - name: Le pêcheur revenu deux fois
    type: text
    sort: 1600000
    text:
      content: >-
        <h2>Le pêcheur revenu deux fois</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Il est rentré à Sen’jin au lever du soleil. À midi, une
        patrouille a juré avoir trouvé son corps sur la côte. Alors lequel des
        deux est revenu ? »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Le pêcheur revenu à Sen’jin, sa famille et les personnes affirmant
        avoir découvert un cadavre sont au centre de l’histoire.</p>

        <p>Les habitants se divisent rapidement entre ceux qui font confiance au
        survivant et ceux qui veulent vérifier son identité.</p>

        <h3>Quoi ?</h3>

        <p>Les deux témoignages existent réellement : un pêcheur porté disparu
        est revenu et un corps lui ressemblant aurait été retrouvé.</p>

        <p>La source ne fixe pas l’explication.</p>

        <p><strong>Information à vérifier / non établie dans les sources
        fournies.</strong></p>

        <p>Erreur d’identification, parent ressemblant au disparu, manipulation,
        magie ou simple récit déformé restent possibles.</p>

        <h3>Quand ?</h3>

        <p>Les deux événements se produisent le même jour, ce qui explique la
        vitesse de propagation de la rumeur.</p>

        <h3>Où ?</h3>

        <p>Le survivant se trouve à Sen’jin.</p>

        <p>Le corps aurait été découvert sur une portion de côte située à
        quelque distance du village.</p>

        <h3>Pourquoi ?</h3>

        <p>Deux faits apparemment incompatibles forcent immédiatement chacun à
        choisir lequel il juge crédible.</p>

        <p>Les expériences passées avec Zalazane rendent les explications
        surnaturelles particulièrement séduisantes.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent voir le survivant, demander à observer le corps, vérifier
        qui a procédé à l’identification ou rechercher les événements ayant
        précédé la disparition.</p>

        <h3>Si personne n'agit</h3>

        <p>La famille protège probablement le survivant tandis que d’autres
        habitants deviennent méfiants.</p>

        <p>Si aucun élément nouveau n’apparaît, l’affaire peut rester longtemps
        non résolue.</p>
      format: 1
