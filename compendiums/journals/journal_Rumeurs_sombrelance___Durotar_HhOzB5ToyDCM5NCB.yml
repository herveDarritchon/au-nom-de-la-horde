  - name: Ne donne pas ton nom
    type: text
    sort: 300000
    text:
      content: >-
        <h2>Ne donne pas ton nom</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Si un homme de Zalazane te demande ton vrai nom, mens.
        Avec ton nom, son maître peut entrer dans ta tête. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Déformée.</p>

        <h3>Qui ?</h3>

        <p>La rumeur circule surtout parmi ceux qui n’ont qu’une compréhension
        indirecte des maléfices de Zalazane.</p>

        <p>Elle est prise très au sérieux par certains jeunes ou voyageurs qui
        n’ont jamais approché les Îles.</p>

        <h3>Quoi ?</h3>

        <p>Les Sombrelance prennent réellement au sérieux la capacité de
        Zalazane à placer des individus sous son influence.</p>

        <p>En revanche, les sources fournies n’établissent pas qu’il puisse
        ensorceler quelqu’un simplement en connaissant son nom.</p>

        <p>L’histoire transforme donc un danger réel en règle magique facile à
        retenir.</p>

        <h3>Quand ?</h3>

        <p>Personne ne sait précisément quand cette version est apparue.</p>

        <p>Elle revient chaque fois qu’un nouveau cas d’ensorcellement est
        évoqué.</p>

        <h3>Où ?</h3>

        <p>À Sen’jin, dans les bivouacs du sud et parfois à Razor Hill lorsque
        des voyageurs répètent ce qu’ils ont entendu.</p>

        <h3>Pourquoi ?</h3>

        <p>Une menace invisible devient plus facile à supporter lorsque les gens
        pensent connaître une règle permettant de s’en protéger.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent demander aux anciens ou aux personnes familières des
        pratiques de Zalazane ce qui est réellement connu de ses maléfices.</p>

        <p>Ils peuvent également découvrir plusieurs versions incompatibles de
        la même histoire.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>

        <p>La superstition continue simplement à influencer la manière dont
        certains habitants parlent aux étrangers et aux prisonniers.</p>
      format: 1
