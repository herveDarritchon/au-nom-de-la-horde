  - name: Le loa parti
    type: text
    sort: 1500000
    text:
      content: >-
        <h2>Le loa parti</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Je chasse ici depuis assez longtemps pour savoir quand
        quelque chose manque. Un loa a quitté Durotar. Vous ne l’avez juste pas
        encore remarqué. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Superstition.</p>

        <h3>Qui ?</h3>

        <p>Un vieux chasseur est à l’origine de cette affirmation.</p>

        <p>Certains jeunes se moquent de lui ; d’autres commencent à relire
        chaque comportement inhabituel de la faune à travers cette histoire.</p>

        <h3>Quoi ?</h3>

        <p>Les sources fournies ne permettent pas d’établir qu’un loa ait
        réellement quitté Durotar.</p>

        <p>Le chasseur interprète plusieurs changements comme les signes d’une
        même absence.</p>

        <h3>Quand ?</h3>

        <p>Il affirme avoir observé une évolution progressive plutôt qu’un
        événement précis.</p>

        <p>La rumeur commence seulement à se répandre.</p>

        <h3>Où ?</h3>

        <p>Autour des territoires de chasse fréquentés par les Sombrelance.</p>

        <p>Elle est surtout entendue à Sen’jin.</p>

        <h3>Pourquoi ?</h3>

        <p>L’expérience du chasseur lui donne suffisamment d’autorité pour que
        son intuition soit prise au sérieux même lorsqu’il ne peut pas la
        prouver.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent lui demander quels signes précis il a observés, comparer
        ses affirmations avec celles d’autres chasseurs ou simplement garder
        l’information en tête lors de leurs déplacements.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>

        <p>La rumeur peut disparaître d’elle-même ou devenir plus importante si
        d’autres phénomènes semblent lui donner raison.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-rumors
          entryId: loa-a-quitte-durotar
          sourceHash: f66c1792
