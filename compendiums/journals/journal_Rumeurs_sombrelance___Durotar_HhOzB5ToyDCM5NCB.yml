pages:
  - name: Contexte
    type: text
    sort: 0
    text:
      content: >-
        <h1>Rumeurs sombrelance — Durotar</h1>

        <h2>En bref</h2>

        <p>Les Sombrelance ne constituent pas une campagne parallèle à Durotar :
        ils forment une couche vivante du sandbox. Sen’jin est à la fois un
        foyer de la Horde, un point d’accès aux routes côtières et au sud de
        Durotar, et une communauté qui garde les yeux tournés vers les Îles de
        l’Écho. Les Kolkar, les ressources rares, les pratiques spirituelles et
        l’influence de Zalazane donnent naturellement naissance à des histoires
        qui circulent entre pêcheurs, chasseurs, anciens et voyageurs.
        :chatgpt-content-reference{index="0"}</p>

        <p>Les rumeurs ci-dessous ne sont donc pas vingt quêtes déguisées.
        Certaines signalent un problème réel, d’autres reflètent une inquiétude,
        une superstition, une frustration politique ou une mauvaise
        interprétation. Elles peuvent être lancées à Sen’jin, sur les routes du
        sud ou à Razor Hill pour donner l’impression que les Sombrelance vivent,
        parlent et s’inquiètent même lorsque les PJ s’occupent d’autre
        chose.</p>

        <h2>Identité</h2>

        <p>La communauté sombrelance de Durotar est marquée par une tension
        simple : elle participe à la construction d’un nouveau foyer au sein de
        la Horde tout en vivant face aux Îles de l’Écho, associées à Zalazane,
        aux proches restés derrière et aux Sombrelance placés sous emprise.</p>

        <p>La mer, la pêche, la chasse, les pirogues, les petits sanctuaires,
        les rites, les tambours et les histoires racontées par les anciens sont
        autant de vecteurs naturels pour faire circuler l’information.</p>

        <p>La parole a ici une valeur particulière. Une rumeur peut être un
        avertissement, un souvenir, une manière de tester un étranger, une peur
        partagée ou une tentative de donner du sens à quelque chose que personne
        ne comprend encore.</p>

        <h2>Histoire utile</h2>

        <p>Le passé n’a besoin d’être rappelé que lorsqu’il agit sur le
        présent.</p>

        <p>Pour cette collection, trois éléments suffisent :</p>

        <ul><li>les Sombrelance vivent désormais sur le continent autour de
        Sen’jin ;</li><li>les Îles de l’Écho restent liées au problème de
        Zalazane ;</li><li>certains trolls présents auprès de Zalazane peuvent
        être des Sombrelance sous emprise plutôt que des ennemis
        volontaires.</li></ul>

        <p>Le souvenir des exils successifs nourrit également les discussions
        sur ce que signifie désormais « avoir un foyer ».</p>

        <h2>Territoire et lieux importants</h2>

        <p><strong>Sen’jin</strong> est le principal lieu de circulation de ces
        rumeurs. Les pêcheurs, chasseurs, familles, anciens et visiteurs y
        confrontent leurs versions des événements.</p>

        <p><strong>Les Îles de l’Écho</strong> restent visibles au large et
        forment un horizon permanent. On peut les observer, en revenir, y
        disparaître ou prétendre avoir vu quelque chose sur leurs plages.</p>

        <p><strong>La côte sud</strong> relie Sen’jin aux pêcheurs, aux épaves,
        aux déplacements par mer et aux incidents pouvant provenir de Tiragarde
        ou d’au-delà.</p>

        <p><strong>Les pistes du sud de Durotar</strong> sont fréquentées par
        les chasseurs, les patrouilles et les Kolkar.</p>

        <p><strong>Razor Hill</strong> relaie certaines histoires sombrelance,
        souvent déjà transformées par ceux qui les répètent.</p>

        <h2>Population et organisation</h2>

        <p>Il n’est pas nécessaire de nommer chaque habitant de Sen’jin.</p>

        <p>Les principaux relais de rumeurs sont :</p>

        <ul><li>les pêcheurs qui observent la côte et les Îles ;</li><li>les
        chasseurs qui connaissent les pistes et les sanctuaires ;</li><li>les
        anciens qui interprètent les événements à travers la mémoire de la tribu
        ;</li><li>les familles séparées de proches restés sur les Îles
        ;</li><li>les jeunes Sombrelance impatients d’agir ;</li><li>les chamans
        et autres gardiens de pratiques spirituelles ;</li><li>les patrouilles
        de la Horde qui rapportent ce qu’elles voient sans nécessairement
        comprendre le contexte troll ;</li><li>les voyageurs qui transforment
        rapidement une observation locale en histoire spectaculaire.</li></ul>

        <h2>Personnalités importantes</h2>

        <p><strong>Vol’jin — chef associé aux Sombrelance —</strong> son nom
        suffit à donner du poids à une rumeur, ce qui explique que certains lui
        attribuent des projets qu’il n’a jamais annoncés dans les sources
        fournies.</p>

        <p><strong>Zalazane — menace associée aux Îles de l’Écho —</strong> son
        influence réelle nourrit quantité de récits exagérés sur ce qu’il peut
        ou ne peut pas faire.</p>

        <p><strong>Maître Gadrin — figure sombrelance —</strong> ses recherches
        et son savoir peuvent naturellement devenir l’objet de spéculations.</p>

        <p><strong>Minshina — mémoire liée à l’arc des Îles —</strong> son nom
        et son crâne peuvent refaire surface dans les récits touchant aux rites
        et à Zalazane.</p>

        <h2>Relations</h2>

        <p>Les Sombrelance appartiennent au même foyer politique que les Orcs de
        Durotar, mais leurs priorités locales ne sont pas toujours
        identiques.</p>

        <p>Une pénurie d’eau, un usage différent du territoire ou l’urgence de
        la situation aux Îles peuvent créer des désaccords sans remettre en
        cause l’appartenance commune à la Horde.</p>

        <p>Les Kolkar exercent une pression réelle sur le sud et les routes
        proches de Sen’jin.</p>

        <p>Les trolls de Strangleronce occupent une place particulière dans
        l’imaginaire sombrelance : ils rappellent un passé et des appartenances
        plus anciennes que l’installation en Durotar.</p>

        <h2>Tensions actuelles</h2>

        <p>Les principales tensions susceptibles d’alimenter les conversations
        sont :</p>

        <ul><li>la présence durable de Zalazane aux Îles de l’Écho ;</li><li>le
        sort des Sombrelance placés sous emprise ;</li><li>le désir de certains
        jeunes de reprendre l’initiative ;</li><li>la rareté de l’eau et des
        ressources ;</li><li>la pression Kolkar ;</li><li>le rapport entre les
        traditions anciennes et le nouveau foyer de Durotar
        ;</li><li>l’apparition possible de signes spirituels difficiles à
        interpréter ;</li><li>les récits venus de Strangleronce ;</li><li>la
        question de savoir quand une inquiétude mérite réellement une
        action.</li></ul>

        <h2>Secrets et zones d’ombre</h2>

        <h3>Canon / établi dans les sources fournies</h3>

        <p>Les sources de campagne utilisées pour cette collection établissent
        notamment la présence de Sen’jin, le problème posé par Zalazane aux Îles
        de l’Écho, l’existence de Sombrelance sous emprise et la pression Kolkar
        dans le sud. :chatgpt-content-reference{index="1"}</p>

        <p>Cela ne signifie pas que chaque détail de cette collection constitue
        du lore officiel Warcraft.</p>

        <h3>Déduction raisonnable</h3>

        <p>Une communauté séparée d’un ancien foyer et confrontée à des proches
        sous emprise produit naturellement :</p>

        <ul><li>des témoignages contradictoires ;</li><li>des récits de
        survivants ;</li><li>des accusations ;</li><li>des superstitions
        ;</li><li>des projets de retour ;</li><li>des histoires de dettes et de
        familles séparées.</li></ul>

        <h3>Adaptation de campagne</h3>

        <p>Les détails précis concernant les feux clandestins, les offrandes
        disparues, certains survivants, les réactions spirituelles et plusieurs
        incidents décrits ci-dessous sont des éléments de campagne destinés à
        produire du jeu.</p>

        <p>Ils ne doivent pas être présentés comme du lore officiel de
        Warcraft.</p>

        <h2>Ce qu’un voyageur remarque</h2>

        <ul><li>Des pirogues sont tirées loin au-dessus de la ligne d’eau
        lorsqu’elles ne servent pas.</li><li>Au crépuscule, plusieurs habitants
        de Sen’jin regardent spontanément vers les Îles.</li><li>Les histoires
        importantes sont rarement racontées une seule fois de la même
        manière.</li><li>De petits lieux d’offrandes peuvent être trouvés près
        des pistes utilisées par les chasseurs.</li><li>Les pêcheurs savent
        reconnaître certaines lumières ordinaires sur la côte et s’inquiètent
        lorsque quelque chose ne correspond pas à leurs habitudes.</li><li>Les
        discussions sur Zalazane deviennent rapidement plus silencieuses
        lorsqu’elles touchent une famille précise.</li><li>Les jeunes parlent
        plus volontiers de reprendre les Îles que ceux qui ont déjà perdu
        quelqu’un.</li><li>Un étranger qui confond tous les trolls entre eux est
        immédiatement identifié comme quelqu’un qui connaît mal la
        région.</li></ul>
      format: 1
