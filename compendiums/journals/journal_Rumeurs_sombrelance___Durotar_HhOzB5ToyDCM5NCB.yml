  - name: Les sanctuaires dépouillés
    type: text
    sort: 900000
    text:
      content: >-
        <h2>Les sanctuaires dépouillés</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Quelqu’un vide les petits sanctuaires autour de
        Sen’jin. Même les coquillages et les bouts de bois sans valeur
        disparaissent. Ce n’est pas un voleur ordinaire. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Les chasseurs qui utilisent ces sanctuaires sont les premiers
        concernés.</p>

        <p>Les soupçons peuvent rapidement viser les Kolkar, Zalazane, de jeunes
        trolls ou des voyageurs orcs.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Les offrandes sont réellement déplacées.</p>

        <p>Le gardien d’au moins un sanctuaire peut les avoir retirées lui-même
        parce qu’il pense que le lieu n’est plus approprié ou que le loa ne
        répond plus comme auparavant.</p>

        <p>Il ne cherche pas à voler quoi que ce soit.</p>

        <h3>Quand ?</h3>

        <p>Les disparitions ont commencé récemment et touchent plusieurs
        passages de chasse.</p>

        <h3>Où ?</h3>

        <p>Dans de petits sanctuaires proches de Sen’jin et des pistes
        fréquentées par les chasseurs.</p>

        <h3>Pourquoi ?</h3>

        <p>L’absence de traces et la disparition d’objets sans valeur rendent
        l’hypothèse d’un simple pillage peu convaincante.</p>

        <p>Les habitants remplissent donc le vide avec leurs propres
        inquiétudes.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent surveiller un sanctuaire, parler aux chasseurs, chercher
        qui possède réellement la responsabilité de ces lieux ou comparer les
        objets retirés.</p>

        <h3>Si personne n'agit</h3>

        <p>Le gardien continue à vider les sanctuaires qu’il juge
        problématiques.</p>

        <p>Les accusations contre des innocents risquent de devenir plus fortes
        que le phénomène lui-même.</p>
      format: 1
