  - name: Les feux des Îles
    type: text
    sort: 100000
    text:
      content: >-
        <h2>Les feux des Îles</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Regarde bien les Îles quand la nuit tombe. Y a des feux
        là-bas que Zalazane n’a jamais allumés. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Les pêcheurs de Sen’jin sont les premiers à faire circuler cette
        histoire.</p>

        <p>Les familles ayant encore des proches disparus sur les Îles veulent
        particulièrement y croire.</p>

        <p>Les plus prudents pensent simplement qu’il s’agit de patrouilles ou
        de feux déplacés.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>De petits groupes de Sombrelance libres ou fugitifs peuvent encore se
        cacher sur certaines parties des Îles.</p>

        <p>Ils évitent les grands feux et utilisent parfois de brèves lumières
        pour se signaler entre eux.</p>

        <p>Tous les feux observés ne viennent cependant pas de fugitifs.</p>

        <h3>Quand ?</h3>

        <p>Les observations sont irrégulières.</p>

        <p>La rumeur circule davantage lorsqu’un pêcheur rentre tard ou
        lorsqu’une lumière inhabituelle reste visible plusieurs nuits au même
        endroit.</p>

        <h3>Où ?</h3>

        <p>La rumeur est surtout entendue à Sen’jin.</p>

        <p>Les meilleurs points d’observation se trouvent sur la côte face aux
        Îles de l’Écho.</p>

        <h3>Pourquoi ?</h3>

        <p>Les habitants connaissent suffisamment les habitudes des Îles pour
        remarquer certaines anomalies.</p>

        <p>L’espoir transforme ensuite rapidement une lumière lointaine en
        preuve qu’un proche est encore vivant.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent comparer plusieurs témoignages, observer les Îles
        plusieurs nuits, demander quelles lumières sont considérées comme
        normales ou tenter d’identifier un éventuel système de signaux.</p>

        <p>Rien ne les oblige à traverser immédiatement.</p>

        <h3>Si personne n'agit</h3>

        <p>Les fugitifs continuent à survivre discrètement tant qu’ils ne sont
        pas découverts.</p>

        <p>Si les feux deviennent trop fréquents, les hommes de Zalazane peuvent
        finir par comprendre qu’une présence leur échappe.</p>
      format: 1
