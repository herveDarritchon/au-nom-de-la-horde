  - name: Prisonniers dans leur tête
    type: text
    sort: 400000
    text:
      content: >-
        <h2>Prisonniers dans leur tête</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Tous ceux qui se battent pour Zalazane ne se battent
        pas pour lui. Certains te frappent pendant qu’au fond d’eux ils te
        supplient d’arrêter. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Cette rumeur circule surtout parmi les familles ayant perdu quelqu’un
        aux Îles et parmi ceux qui ont déjà observé les effets de l’emprise de
        Zalazane.</p>

        <p>Les guerriers les plus pragmatiques peuvent la trouver dangereuse si
        elle fait hésiter au mauvais moment.</p>

        <h3>Quoi ?</h3>

        <p>Certains des trolls associés à Zalazane sont des Sombrelance placés
        sous son emprise.</p>

        <p>Ils ne doivent donc pas tous être considérés automatiquement comme
        des alliés volontaires du sorcier.</p>

        <h3>Quand ?</h3>

        <p>La rumeur existe depuis que des cas d’ensorcellement sont connus.</p>

        <p>Elle revient fortement lorsqu’un fugitif ou un survivant revient des
        Îles.</p>

        <h3>Où ?</h3>

        <p>À Sen’jin et partout où l’on discute d’une éventuelle expédition vers
        les Îles de l’Écho.</p>

        <h3>Pourquoi ?</h3>

        <p>La distinction est essentielle pour les familles concernées.</p>

        <p>Elle complique cependant toute réponse militaire simple au
        problème.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent chercher comment reconnaître une personne sous emprise,
        demander si quelqu’un en a déjà été libéré ou observer les comportements
        de trolls rencontrés aux Îles avant de choisir comment agir.</p>

        <h3>Si personne n'agit</h3>

        <p>Les captifs restent sous la domination de Zalazane.</p>

        <p>La rumeur, elle, peut progressivement être oubliée par ceux qui
        préfèrent une distinction simple entre alliés et ennemis.</p>
      format: 1
