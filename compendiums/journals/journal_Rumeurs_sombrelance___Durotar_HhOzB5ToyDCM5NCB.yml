  - name: Les Orcs ont oublié
    type: text
    sort: 600000
    text:
      content: >-
        <h2>Les Orcs ont oublié</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Les Orcs nous avaient promis qu’on reprendrait les
        Îles. Maintenant ils ont leur grande ville à construire et plus personne
        ne regarde vers la mer. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Déformée.</p>

        <h3>Qui ?</h3>

        <p>Cette version circule parmi certains Sombrelance frustrés par la
        durée de la situation.</p>

        <p>Elle peut être répétée par des jeunes qui n’ont pas eux-mêmes entendu
        la prétendue promesse.</p>

        <h3>Quoi ?</h3>

        <p>La frustration est réelle.</p>

        <p>En revanche, les sources fournies n’établissent pas l’existence d’une
        promesse formelle des Orcs concernant une reconquête des Îles.</p>

        <p>La rumeur transforme donc un sentiment politique en fait
        historique.</p>

        <h3>Quand ?</h3>

        <p>Elle apparaît surtout lorsque des ressources ou des guerriers de la
        Horde sont mobilisés ailleurs.</p>

        <h3>Où ?</h3>

        <p>À Sen’jin, particulièrement lors de discussions sur l’avenir des Îles
        ou sur la répartition des ressources en Durotar.</p>

        <h3>Pourquoi ?</h3>

        <p>La rumeur donne une cause identifiable à une situation qui dure.</p>

        <p>Elle permet aussi de déplacer une partie de la colère dirigée contre
        Zalazane vers des alliés considérés comme trop occupés par leurs propres
        priorités.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent demander qui aurait entendu cette promesse, comparer les
        versions ou discuter avec des habitants ayant connu les premiers temps
        de l’installation en Durotar.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>

        <p>La rumeur reste une expression de frustration et peut gagner ou
        perdre en force selon la manière dont la Horde traite les préoccupations
        de Sen’jin.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-rumors
          entryId: orcs-ont-oublie
          sourceHash: 2f2d95a3
