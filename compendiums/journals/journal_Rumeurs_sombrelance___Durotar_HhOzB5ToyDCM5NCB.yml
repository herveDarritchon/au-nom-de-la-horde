  - name: Les Kolkar nous comptent
    type: text
    sort: 1000000
    text:
      content: >-
        <h2>Les Kolkar nous comptent</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Les Kolkar ne viennent plus seulement voler. Ils
        regardent. Ils comptent les chasseurs qui sortent et ceux qui
        reviennent. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Les chasseurs, pisteurs et patrouilleurs du sud font circuler
        l’information.</p>

        <p>Les habitants de Sen’jin la prennent au sérieux parce que la pression
        Kolkar est déjà connue.</p>

        <h3>Quoi ?</h3>

        <p>Les Kolkar observent réellement certaines pistes et cherchent à
        évaluer les habitudes de circulation autour de Sen’jin.</p>

        <p>Cela ne signifie pas nécessairement qu’une attaque générale est
        imminente.</p>

        <h3>Quand ?</h3>

        <p>Les signes sont récents : traces interrompues, silhouettes aperçues à
        distance et observateurs qui évitent le contact.</p>

        <h3>Où ?</h3>

        <p>Sur les pistes reliant Sen’jin aux zones de chasse et aux routes du
        sud.</p>

        <h3>Pourquoi ?</h3>

        <p>Observer coûte moins cher qu’attaquer.</p>

        <p>Les Kolkar peuvent chercher des opportunités, des routes mal
        protégées ou simplement comprendre comment les Sombrelance réagissent à
        leur présence.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent suivre les observateurs, modifier les habitudes de
        circulation, organiser une contre-observation ou chercher à comprendre
        ce que les Kolkar surveillent réellement.</p>

        <h3>Si personne n'agit</h3>

        <p>Les Kolkar obtiennent une meilleure connaissance des habitudes
        locales.</p>

        <p>Ils peuvent ensuite exploiter une faiblesse précise plutôt que lancer
        une attaque frontale.</p>
      format: 1
