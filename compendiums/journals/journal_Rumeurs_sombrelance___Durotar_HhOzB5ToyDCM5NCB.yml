  - name: Celui qui ne parle plus
    type: text
    sort: 1300000
    text:
      content: >-
        <h2>Celui qui ne parle plus</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Il est revenu des Îles vivant. Depuis, il parle orc
        quand il doit parler, mais pas un seul mot en troll. Même dans son
        sommeil. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Le Sombrelance revenu des Îles est directement concerné.</p>

        <p>Sa famille évite de répondre aux questions trop insistantes.</p>

        <p>Certains pensent qu’il est encore sous l’influence de Zalazane.</p>

        <h3>Quoi ?</h3>

        <p>Le survivant refuse réellement de parler troll depuis son retour.</p>

        <p>La raison exacte n’est pas définie par la source.</p>

        <p><strong>Information à vérifier / non établie dans les sources
        fournies.</strong></p>

        <p>Ce refus peut être traumatique, rituel, volontaire ou lié à ce qu’il
        croit que Zalazane peut faire.</p>

        <h3>Quand ?</h3>

        <p>Il est revenu récemment et son comportement est devenu visible dès
        les premières heures.</p>

        <h3>Où ?</h3>

        <p>À Sen’jin.</p>

        <p>Les événements à l’origine de son silence se sont produits quelque
        part sur les Îles de l’Écho.</p>

        <h3>Pourquoi ?</h3>

        <p>Son comportement est suffisamment précis et étrange pour susciter des
        interprétations.</p>

        <p>Chaque personne projette sur lui sa propre compréhension des pouvoirs
        de Zalazane.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent chercher à communiquer autrement, parler à sa famille,
        attendre qu’il prenne lui-même l’initiative ou vérifier s’il réagit à
        certains noms, lieux ou sons.</p>

        <h3>Si personne n'agit</h3>

        <p>Il continue à vivre à Sen’jin en évitant le sujet.</p>

        <p>Avec le temps, les histoires racontées à son propos deviennent
        probablement plus inquiétantes que son comportement réel.</p>
      format: 1
