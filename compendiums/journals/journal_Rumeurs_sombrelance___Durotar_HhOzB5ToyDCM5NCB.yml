  - name: Les vieux maléfices
    type: text
    sort: 800000
    text:
      content: >-
        <h2>Les vieux maléfices</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Zalazane n’a rien inventé. Ces choses-là existaient
        déjà dans les jungles bien avant qu’on mette les pieds en Durotar.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Superstition.</p>

        <h3>Qui ?</h3>

        <p>La rumeur est attribuée à des anciens ou à ceux qui aiment expliquer
        les événements présents par l’héritage ancien des peuples trolls.</p>

        <p>Elle intrigue particulièrement les jeunes qui connaissent
        Strangleronce surtout à travers les récits.</p>

        <h3>Quoi ?</h3>

        <p>Les sources fournies indiquent seulement que l’idée est
        plausible.</p>

        <p>Elles n’établissent pas l’origine exacte des pratiques de
        Zalazane.</p>

        <p><strong>Information à vérifier / non établie dans les sources
        fournies.</strong></p>

        <h3>Quand ?</h3>

        <p>Il s’agit moins d’une nouvelle rumeur que d’une explication ancienne
        qui revient chaque fois qu’un nouveau maléfice est découvert.</p>

        <h3>Où ?</h3>

        <p>À Sen’jin, particulièrement auprès des anciens et des personnes
        discutant des rites ou de Zalazane.</p>

        <h3>Pourquoi ?</h3>

        <p>Relier une menace récente à un héritage plus ancien permet de lui
        donner un sens.</p>

        <p>Cela peut aussi refléter les rapports complexes que les Sombrelance
        entretiennent avec leur passé.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent demander quelles histoires parlent de pratiques
        similaires, chercher plusieurs versions du même récit ou tenter de
        distinguer mémoire historique et interprétation actuelle.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>

        <p>La rumeur reste une grille d’interprétation des événements liés à
        Zalazane.</p>
      format: 1
