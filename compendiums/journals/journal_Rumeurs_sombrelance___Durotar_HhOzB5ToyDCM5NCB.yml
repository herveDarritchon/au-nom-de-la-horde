  - name: Ce que cherche Gadrin
    type: text
    sort: 1100000
    text:
      content: >-
        <h2>Ce que cherche Gadrin</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Maître Gadrin cherche quelque chose qu’on ne trouve pas
        en Durotar. Et s’il ne dit pas quoi, c’est que ça doit être important.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>La rumeur vient de personnes ayant remarqué les questions, les
        échanges ou les recherches de Maître Gadrin.</p>

        <p>Chacun propose ensuite sa propre explication.</p>

        <h3>Quoi ?</h3>

        <p>La source fournie établit cette recherche comme une porte possible
        vers des traditions trolls situées au-delà de Durotar.</p>

        <p>La nature précise de ce que Gadrin recherche n’est pas définie.</p>

        <p><strong>Information à vérifier / non établie dans les sources
        fournies.</strong></p>

        <h3>Quand ?</h3>

        <p>La recherche est actuelle mais ne possède pas nécessairement
        d’urgence.</p>

        <h3>Où ?</h3>

        <p>La rumeur peut être entendue à Sen’jin.</p>

        <p>Elle peut conduire vers des voyageurs, des connaissances venues
        d’ailleurs ou de futures pistes hors de Durotar.</p>

        <h3>Pourquoi ?</h3>

        <p>Un personnage reconnu qui pose des questions sans expliquer son
        objectif devient naturellement un sujet de conversation.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent simplement demander à Gadrin, observer les interlocuteurs
        qu’il consulte ou attendre qu’une information supplémentaire arrive.</p>

        <p>Il n’est pas nécessaire que sa recherche devienne immédiatement une
        aventure.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution particulière.</p>

        <p>Gadrin poursuit ses recherches par ses propres moyens.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-rumors
          entryId: recherche-de-gadrin
          sourceHash: 5a13937c
