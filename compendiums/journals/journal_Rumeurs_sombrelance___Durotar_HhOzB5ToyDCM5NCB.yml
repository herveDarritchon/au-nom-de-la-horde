  - name: Le mauvais troll
    type: text
    sort: 1800000
    text:
      content: >-
        <h2>Le mauvais troll</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Les gardes ont attrapé un troll au sud et ils disent
        que c’est un espion. Seulement voilà : les Sombrelance disent qu’il
        n’est pas des leurs. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Une patrouille de la Horde détient le prisonnier.</p>

        <p>Des Sombrelance ayant observé ses marques estiment qu’il pourrait
        venir de Strangleronce.</p>

        <p>Certains gardes considèrent son origine étrangère comme une raison
        supplémentaire de se méfier.</p>

        <h3>Quoi ?</h3>

        <p>Le prisonnier n’est effectivement pas Sombrelance.</p>

        <p>Ses marques rappellent celles de tribus de Strangleronce, mais son
        identité exacte et les raisons de sa présence ne sont pas encore
        établies.</p>

        <h3>Quand ?</h3>

        <p>La capture vient d’avoir lieu.</p>

        <p>La rumeur précède probablement tout interrogatoire sérieux.</p>

        <h3>Où ?</h3>

        <p>Le troll a été capturé près de la frontière sud ou sur une route
        entrant en Durotar.</p>

        <p>Il peut être retenu temporairement dans un poste ou conduit vers un
        lieu plus sûr.</p>

        <h3>Pourquoi ?</h3>

        <p>Pour certains Orcs, l’affaire est d’abord sécuritaire.</p>

        <p>Pour les Sombrelance, les marques tribales donnent au prisonnier un
        contexte culturel que les gardes ne possèdent pas.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent assister à son interrogatoire, demander à quelqu’un
        connaissant les tribus de l’est de l’identifier, chercher son point
        d’entrée en Durotar ou simplement écouter sa version des faits.</p>

        <h3>Si personne n'agit</h3>

        <p>La Horde traite l’affaire selon ses propres procédures.</p>

        <p>Le prisonnier peut être transféré, libéré faute de preuve ou
        considéré comme hostile selon ce que révèle l’interrogatoire.</p>
