  - name: Le masque disparu
    type: text
    sort: 1400000
    text:
      content: >-
        <h2>Le masque disparu</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Un masque funéraire a disparu cette nuit. Et si
        personne ne veut te dire à qui il appartenait, c’est peut-être ça le
        plus important. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Une famille de Sen’jin est directement concernée.</p>

        <p>Quelques anciens savent à qui appartenait le masque mais préfèrent
        éviter que l’affaire devienne publique.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Le masque a réellement disparu.</p>

        <p>La source ne fixe ni le responsable ni sa motivation.</p>

        <p>Il peut s’agir d’un vol, d’un conflit familial, d’un objet repris par
        quelqu’un estimant avoir un droit dessus ou d’une décision liée aux
        pratiques funéraires.</p>

        <h3>Quand ?</h3>

        <p>La disparition vient d’être constatée.</p>

        <p>La rumeur se répand plus vite que les informations fiables.</p>

        <h3>Où ?</h3>

        <p>À Sen’jin.</p>

        <p>Le masque peut encore se trouver dans le village ou avoir déjà quitté
        celui-ci.</p>

        <h3>Pourquoi ?</h3>

        <p>Le silence de la famille attire davantage l’attention qu’une
        accusation ouverte.</p>

        <p>Les habitants supposent donc que l’identité du défunt ou la fonction
        du masque explique l’affaire.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent chercher pourquoi la famille refuse d’en parler,
        découvrir qui savait où l’objet était conservé ou simplement attendre
        qu’un second événement donne un sens à la disparition.</p>

        <h3>Si personne n'agit</h3>

        <p>Le responsable poursuit son objectif.</p>

        <p>Si le masque n’était recherché que pour une affaire personnelle, la
        situation peut se résoudre sans intervention extérieure.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-rumors
          entryId: masque-funeraire-disparu
          sourceHash: c400c271
