  - name: Les jeunes vont partir
    type: text
    sort: 1900000
    text:
      content: >-
        <h2>Les jeunes vont partir</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Ils disent qu’ils vont seulement reconnaître une petite
        île. Quand des jeunes commencent à cacher des lances dans une pirogue,
        ce n’est jamais seulement pour regarder. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Un petit groupe de jeunes Sombrelance prépare une expédition.</p>

        <p>Leurs proches ignorent peut-être encore l’ampleur de leurs
        intentions.</p>

        <p>Certains habitants pourraient secrètement les soutenir sans vouloir
        partir eux-mêmes.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Les volontaires ont réellement identifié ce qu’ils pensent être une
        faiblesse sur une petite île périphérique tenue ou fréquentée par les
        hommes de Zalazane.</p>

        <p>Ils sont courageux et leur information peut même être correcte.</p>

        <p>Le problème est qu’ils sous-estiment les risques.</p>

        <h3>Quand ?</h3>

        <p>Le départ est proche, probablement dès que la mer ou l’obscurité leur
        donnera une occasion favorable.</p>

        <h3>Où ?</h3>

        <p>La préparation a lieu autour de Sen’jin.</p>

        <p>La destination est une petite île périphérique des Îles de
        l’Écho.</p>

        <h3>Pourquoi ?</h3>

        <p>L’attente est devenue insupportable pour certains jeunes.</p>

        <p>Ils préfèrent risquer une action limitée plutôt que continuer à
        parler d’une reconquête qui n’arrive jamais.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent vérifier ce que les volontaires savent réellement,
        essayer de modifier leur plan, les accompagner, prévenir les anciens ou
        décider que ce n’est pas leur affaire.</p>

        <h3>Si personne n'agit</h3>

        <p>Les volontaires partent.</p>

        <p>Ils peuvent réussir une reconnaissance partielle, revenir blessés ou
        provoquer une réaction de Zalazane sans pour autant déclencher une
        catastrophe automatique.</p>
      format: 1
