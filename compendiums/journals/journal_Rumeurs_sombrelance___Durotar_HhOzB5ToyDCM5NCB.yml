  - name: L’eau de Sen’jin
    type: text
    sort: 2000000
    text:
      content: >-
        <h2>L’eau de Sen’jin</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Les chasseurs disent que le puits est à eux. Les Orcs
        disent qu’une route de la Horde appartient à toute la Horde. On verra
        combien de temps ça reste une discussion. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Des chasseurs sombrelance utilisent régulièrement un point d’eau
        proche de Sen’jin.</p>

        <p>Une caravane ou des voyageurs venus de Razor Hill ont également
        besoin de cette ressource.</p>

        <p>Les deux groupes pensent avoir de bonnes raisons de passer en
        priorité.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Une véritable dispute a éclaté autour de l’accès à l’eau.</p>

        <p>Il ne s’agit pas d’une rupture entre Orcs et Sombrelance ni d’une
        haine raciale organisée.</p>

        <p>Deux groupes vivant sur une terre pauvre veulent simplement sécuriser
        une ressource indispensable.</p>

        <h3>Quand ?</h3>

        <p>La tension vient d’apparaître, probablement après plusieurs passages
        rapprochés de caravanes ou une période où le point d’eau donne moins
        qu’à l’habitude.</p>

        <h3>Où ?</h3>

        <p>À proximité de Sen’jin, sur un point d’eau également accessible
        depuis une route utilisée par des voyageurs de Razor Hill.</p>

        <h3>Pourquoi ?</h3>

        <p>Durotar offre peu de ressources faciles.</p>

        <p>Les chasseurs pensent que l’usage régulier crée une priorité.</p>

        <p>Les voyageurs pensent qu’une ressource située sur un axe de la Horde
        doit être partagée.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent écouter les deux groupes, rechercher un autre point
        d’eau, comprendre l’usage réel du site ou simplement empêcher qu’une
        dispute immédiate ne dégénère.</p>

        <p>Ils peuvent aussi décider que la communauté réglera elle-même le
        problème.</p>

        <h3>Si personne n'agit</h3>

        <p>Les responsables locaux finissent probablement par trouver un
        arrangement.</p>

        <p>Mais d’ici là, une altercation, un retard de caravane ou une rancœur
        personnelle peut transformer un problème pratique en conflit plus
        durable.</p>
