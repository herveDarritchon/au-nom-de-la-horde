  - name: Des trolls venus de l’est
    type: text
    sort: 700000
    text:
      content: >-
        <h2>Des trolls venus de l’est</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Un marchand des Tarides a vu des trolls avec des
        peintures qu’aucun Sombrelance ne porte. Des trolls de Strangleronce,
        ici, en Kalimdor. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>La rumeur vient de voyageurs et de marchands avant d’être reprise par
        des Sombrelance capables de reconnaître que la description ne correspond
        pas à leur tribu.</p>

        <h3>Quoi ?</h3>

        <p>Quelqu’un a bien signalé un troll inconnu.</p>

        <p>Son appartenance exacte n’est pas établie.</p>

        <p>Il pourrait s’agir d’un Bloodscalp, d’un Skullsplitter, d’un autre
        voyageur troll ou simplement d’une mauvaise identification.</p>

        <h3>Quand ?</h3>

        <p>La rumeur est récente.</p>

        <p>Elle devient plus crédible si d’autres voyageurs rapportent ensuite
        des observations similaires.</p>

        <h3>Où ?</h3>

        <p>Elle peut naître dans les Tarides puis atteindre Razor Hill et
        Sen’jin.</p>

        <p>Les PJ pourraient chercher à la vérifier sur les routes du sud ou
        auprès des patrouilles.</p>

        <h3>Pourquoi ?</h3>

        <p>Pour les Sombrelance, un troll venu de Strangleronce ne représente
        pas simplement « un autre troll ».</p>

        <p>Il peut rappeler des alliances, des rivalités, des dettes ou un passé
        que l’installation en Durotar n’a pas effacé.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent chercher le témoin initial, comparer les descriptions des
        marques tribales ou tenter de retrouver la piste du voyageur.</p>

        <h3>Si personne n'agit</h3>

        <p>L’étranger poursuit sa route ou disparaît du réseau de rumeurs.</p>

        <p>Son passage peut ne produire aucune conséquence immédiate.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-rumors
          entryId: trolls-de-strangleronce
          sourceHash: fb6cda8c
