  - name: Les esprits et les travaux
    type: text
    sort: 1200000
    text:
      content: >-
        <h2>Les esprits et les travaux</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Depuis qu’ils creusent davantage au nord, quelque chose
        répond autrement quand on parle aux esprits. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Des Sombrelance sensibles aux pratiques spirituelles font circuler
        cette inquiétude.</p>

        <p>Les ouvriers et soldats peuvent y voir une interprétation
        superstitieuse de phénomènes naturels.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Des signes spirituels inhabituels peuvent réellement être
        observés.</p>

        <p>Leur lien direct avec les travaux de la Horde n’est toutefois pas
        encore démontré.</p>

        <p>Cette rumeur peut constituer un indice très léger vers le fil rouge
        de la campagne sans fournir de réponse.</p>

        <h3>Quand ?</h3>

        <p>Les observations deviennent suffisamment fréquentes pour être
        comparées seulement depuis peu.</p>

        <h3>Où ?</h3>

        <p>Les effets sont évoqués autour de certains lieux de Durotar tandis
        que leur cause supposée est située plus au nord, vers les zones où la
        Horde creuse et construit.</p>

        <h3>Pourquoi ?</h3>

        <p>Les travaux visibles offrent une cause évidente à un phénomène que
        personne ne comprend encore.</p>

        <p>Les Sombrelance ne disposent pas nécessairement de davantage de
        réponses que les autres : ils possèdent simplement un vocabulaire
        différent pour décrire le problème.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent comparer plusieurs témoignages, rechercher si les
        phénomènes suivent réellement une direction ou une distance, ou
        interroger des personnes qui ne partagent pas l’interprétation
        spirituelle.</p>

        <h3>Si personne n'agit</h3>

        <p>Les signes restent faibles pour le moment.</p>

        <p>Ils peuvent se renforcer plus tard si le fil rouge de la campagne
        progresse.</p>
      format: 1
    flags:
      warbound-campaign-content:
        markdownImport:
          collectionId: durotar-sombrelance-rumors
          entryId: esprits-agites-au-nord
          sourceHash: 6ead548b
