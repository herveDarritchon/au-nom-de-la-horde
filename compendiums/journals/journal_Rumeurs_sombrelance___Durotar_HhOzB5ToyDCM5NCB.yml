  - name: Le tambour au large
    type: text
    sort: 1700000
    text:
      content: >-
        <h2>Le tambour au large</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Trois nuits que le vieux rythme vient des Îles. Mais
        écoute bien après le dernier battement : quelqu’un répond depuis notre
        rive. »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Vraie.</p>

        <h3>Qui ?</h3>

        <p>Les anciens reconnaissant le rythme sont les premiers à prendre le
        phénomène au sérieux.</p>

        <p>La personne qui répond depuis Sen’jin n’a pas encore expliqué
        publiquement ses raisons.</p>

        <h3>Quoi ?</h3>

        <p><strong>Adaptation de campagne.</strong></p>

        <p>Un tambour joue réellement depuis les Îles de l’Écho.</p>

        <p>Le rythme est reconnu comme un ancien signal sombrelance associé à un
        rassemblement.</p>

        <p>Quelqu’un à Sen’jin répond également au signal.</p>

        <h3>Quand ?</h3>

        <p>Le phénomène dure depuis trois nuits.</p>

        <p>Chaque répétition rend plus difficile l’idée d’un hasard.</p>

        <h3>Où ?</h3>

        <p>Le premier tambour vient d’une île ou d’une portion des Îles de
        l’Écho.</p>

        <p>La réponse est émise depuis Sen’jin ou ses abords immédiats.</p>

        <h3>Pourquoi ?</h3>

        <p>Le rythme constitue un moyen de communication que beaucoup de
        non-Sombrelance ne comprennent pas.</p>

        <p>La personne qui répond peut chercher à établir un contact sans
        attirer davantage l’attention.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent écouter les échanges, demander aux anciens ce que
        signifie le rythme, chercher la personne répondant depuis Sen’jin ou
        observer la côte lorsqu’un nouveau signal arrive.</p>

        <h3>Si personne n'agit</h3>

        <p>Le dialogue continue quelques nuits.</p>

        <p>Il peut ensuite s’interrompre brutalement si l’un des deux groupes
        estime avoir été repéré.</p>
      format: 1
