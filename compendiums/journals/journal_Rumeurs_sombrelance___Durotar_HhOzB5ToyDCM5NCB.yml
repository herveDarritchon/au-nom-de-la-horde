  - name: La voix du mort
    type: text
    sort: 200000
    text:
      content: >-
        <h2>La voix du mort</h2>

        <h3>Ce que l'on raconte</h3>

        <blockquote><p>« Taz’ko a entendu son frère l’appeler depuis la plage.
        Son frère est mort depuis deux saisons. Alors explique-moi ça.
        »</p></blockquote>

        <h3>Statut MJ</h3>

        <p>Partiellement vraie.</p>

        <h3>Qui ?</h3>

        <p>Un pêcheur de Sen’jin affirme avoir entendu la voix.</p>

        <p>Sa famille le croit suffisamment pour lui demander de ne plus
        retourner seul sur la côte.</p>

        <p>D’autres habitants pensent qu’il a simplement entendu ce qu’il
        voulait entendre.</p>

        <h3>Quoi ?</h3>

        <p>Le pêcheur a réellement entendu une voix qu’il a reconnue.</p>

        <p>La source fournie ne fixe pas l’explication.</p>

        <p><strong>Information à vérifier / non établie dans les sources
        fournies.</strong></p>

        <p>Il peut s’agir d’une imitation, d’un rite lié aux esprits, d’une
        confusion ou d’un phénomène encore incompris.</p>

        <h3>Quand ?</h3>

        <p>L’incident est récent et s’est produit de nuit.</p>

        <p>La rumeur se répand rapidement parce que le pêcheur refuse désormais
        de retourner à l’endroit concerné.</p>

        <h3>Où ?</h3>

        <p>Sur une portion de côte permettant d’entendre les sons provenant
        d’une petite île ou d’un banc rocheux.</p>

        <p>Elle est principalement répétée à Sen’jin.</p>

        <h3>Pourquoi ?</h3>

        <p>La rumeur touche une peur très simple : les Îles contiennent
        suffisamment de morts, de disparus et de captifs pour que chacun puisse
        imaginer reconnaître une voix.</p>

        <h3>Si les PJ s'y intéressent</h3>

        <p>Ils peuvent parler au témoin, revenir au même endroit à la même
        heure, chercher d’autres personnes ayant entendu quelque chose ou
        observer la côte depuis un autre point.</p>

        <h3>Si personne n'agit</h3>

        <p>Aucune évolution certaine.</p>

        <p>Le pêcheur évite simplement l’endroit et son récit devient
        progressivement plus spectaculaire à mesure qu’il est répété.</p>
      format: 1
