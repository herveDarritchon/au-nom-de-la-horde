        <h1>Les neuf profils de
        Warbound</h1><table><thead><tr><th><p>Profil</p></th><th><p>Famille</p></th><th><p>Caractéristiques
        prioritaires</p></th><th><p>Identité</p></th></tr></thead><tbody><tr><td><p><strong>Chasseur</strong></p></td><td><p>Aventurier</p></td><td><p>AGI,
        PER, CON</p></td><td><p>Tir, pistage, survie, mobilité et compagnon
        animal.</p></td></tr><tr><td><p><strong>Voleur</strong></p></td><td><p>Aventurier</p></td><td><p>AGI,
        INT, CHA</p></td><td><p>Furtivité, précision, ruse et
        infiltration.</p></td></tr><tr><td><p><strong>Guerrier</strong></p></td><td><p>Combattant</p></td><td><p>FOR,
        CON, AGI</p></td><td><p>Maîtrise martiale, résistance et contrôle du
        combat.</p></td></tr><tr><td><p><strong>Paladin</strong></p></td><td><p>Combattant</p></td><td><p>FOR,
        CHA, VOL</p></td><td><p>Guerrier lourd soutenu par la Lumière, capable
        de protéger, frapper et
        soutenir.</p></td></tr><tr><td><p><strong>Mage</strong></p></td><td><p>Mage</p></td><td><p>INT,
        VOL, AGI</p></td><td><p>Magie profane, puissance élémentaire et
        contrôle.</p></td></tr><tr><td><p><strong>Démoniste</strong></p></td><td><p>Mage</p></td><td><p>INT,
        VOL, CON</p></td><td><p>Magie gangrenée, malédictions, démons et
        puissance à
        risque.</p></td></tr><tr><td><p><strong>Druide</strong></p></td><td><p>Mystique</p></td><td><p>PER,
        VOL, CON ou AGI</p></td><td><p>Nature, métamorphose, magie et
        récupération.</p></td></tr><tr><td><p><strong>Prêtre</strong></p></td><td><p>Mystique</p></td><td><p>VOL,
        CHA, INT</p></td><td><p>Foi, soins, protection et pouvoirs spirituels ou
        d'Ombre.</p></td></tr><tr><td><p><strong>Chaman</strong></p></td><td><p>Mystique</p></td><td><p>VOL,
        PER, CON</p></td><td><p>Esprits, éléments, soutien et combat
        hybride.</p></td></tr></tbody></table>
