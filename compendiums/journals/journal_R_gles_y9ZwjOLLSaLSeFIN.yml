  - sort: 275000
    name: Idéal & Travers
    type: text
    _id: iyIbv5JXRkcCObgH
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <h2>Idéal et travers</h2><p>Si vous n’avez pas d’idée ou si le MJ le
        souhaite, vous pouvez déterminer un idéal héroïque et un travers au
        hasard, en lançant sur la table Idéaux et Travers et en consultant le
        résultat dans la liste. Cela vous donnera une sorte de boussole pour
        interpréter votre personnage afin de conserver un comportement à peu
        près cohérent d’une partie à l’autre.</p><p class="p1">Si vous jouez une
        campagne dont le prérequis implique des héros avec des idéaux positifs,
        le meneur de jeu pourra vous indiquer de déterminer deux idéaux
        héroïques (ou éventuellement deux travers si c’est l’inverse).</p><p
        class="p1">Enfin si vous tirez aléatoirement un idéal ou un travers qui
        ne correspond pas à votre envie de jouer ou à votre idée du personnage,
        n’hésitez pas à relancer.</p><h3>Travers</h3><p><strong><span
        style="text-decoration:underline">Règles:</span></strong>
        @UUID[JournalEntry.Nm4ZgYPSueiJkq04]{Travers}</p><p><strong><span
        style="text-decoration:underline">Table aléatoire:</span></strong>
        @UUID[RollTable.87WK59nyuvKNteFE]{Travers}</p><h3>Idéaux
        héroïques</h3><p><strong><span style="text-decoration:underline">Règles:
        </span></strong><span
        style="text-decoration:underline">@UUID[JournalEntry.76kslKkTI09XTJGD]{Idéaux
        héroïques}</span></p><p><strong><span
        style="text-decoration:underline">Table aléatoire:</span></strong>
        @UUID[RollTable.IQUsJLqTbkPdBbw3]{Idéaux
        héroïques}</p><h3><strong>Interprétation des traits (idéal et
        traits)</strong></h3><p class="p1">Ces traits vous permettent de
        déterminer la façon dont votre personnage devrait réagir dans les
        situations où vous hésitez sur la posture à adopter. Ils apportent
        également une certaine cohérence dans le comportement des PJ sur la
        durée, d’une aventure à l’autre.</p><p class="p2">Si votre
        interprétation d’un trait est particulièrement appropriée et qu’elle
        respecte les critères évoqués ci‑après, votre MJ pourra vous récompenser
        par la récupération d’un point de chance.</p><p class="p2">Attention
        toutefois, les traits ne doivent pas remplacer votre libre arbitre ni
        servir de prétexte à un comportement trop caricatural.</p>
