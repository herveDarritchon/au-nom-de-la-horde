      content: >-
        <h1>Les familles de
        profils</h1><table><thead><tr><th><p>Famille</p></th><th><p>PV de
        famille</p></th><th><p>DR</p></th><th><p>Avantage de
        famille</p></th><th><p>Profils
        Warbound</p></th></tr></thead><tbody><tr><td><p><strong>Aventurier</strong></p></td><td><p>4</p></td><td><p>d8</p></td><td><p>+1
        PC</p></td><td><p>Chasseur,
        Voleur</p></td></tr><tr><td><p><strong>Combattant</strong></p></td><td><p>5</p></td><td><p>d10</p></td><td><p>—</p></td><td><p>Guerrier,
        Paladin</p></td></tr><tr><td><p><strong>Mage</strong></p></td><td><p>3</p></td><td><p>d6</p></td><td><p>1
        capacité de rang 2 supplémentaire à la création</p></td><td><p>Mage,
        Démoniste</p></td></tr><tr><td><p><strong>Mystique</strong></p></td><td><p>4</p></td><td><p>d8</p></td><td><p>+1
        DR</p></td><td><p>Druide, Prêtre,
        Chaman</p></td></tr></tbody></table><h2>Points de vigueur au niveau
        1</h2><p>Au niveau 1, les PV sont calculés selon la règle COF2
        :</p><p><strong>PV = (2 × PV de famille) +
        CON</strong></p><table><thead><tr><th><p>Famille</p></th><th><p>PV au
        niveau
        1</p></th></tr></thead><tbody><tr><td><p>Aventurier</p></td><td><p>8 +
        CON</p></td></tr><tr><td><p>Combattant</p></td><td><p>10 +
        CON</p></td></tr><tr><td><p>Mage</p></td><td><p>6 +
        CON</p></td></tr><tr><td><p>Mystique</p></td><td><p>8 +
        CON</p></td></tr></tbody></table><h2>Lecture
        rapide</h2><p><strong>Aventurier.</strong> Mobile, polyvalent et
        débrouillard. <strong>Warbound</strong> y place le Chasseur et le
        Voleur.</p><p><strong>Combattant.</strong> Le socle martial le plus
        solide. <strong>Warbound</strong> y place le Guerrier et le
        Paladin.</p><p><strong>Mage.</strong> Peu de vigueur mais une
        progression magique précoce plus poussée. <strong>Warbound</strong> y
        place le Mage et le Démoniste.</p><p><strong>Mystique.</strong> Mélange
        de pouvoir surnaturel, soutien et capacités de combat intermédiaires.
        <strong>Warbound</strong> y place le Druide, le Prêtre et le Chaman.</p>
