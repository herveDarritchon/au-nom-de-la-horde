    text:
      format: 1
      content: >-
        <h2>Traits</h2><p>Les personnages sont définis par des Traits : les
        Attributs et les Compétences. Ils fonctionnent de la même façon.
        Attributs et Compétences sont classés par types de dés allant du d4 au
        d12, d6 étant la moyenne chez un humain adulte. Plus gros est le dé,
        plus vous êtes doué !</p>
