  - sort: 250000
    name: Orcs
    type: text
    _id: abdFf6AaiOWMLsgL
    system: {}
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <blockquote><p><strong>« Tenir. Frapper au bon moment. Choisir ce que
        l’honneur exige. »</strong></p></blockquote><p>Les Orcs sont un peuple
        de survivants. Arrachés à Draenor, marqués par les guerres et la
        corruption démoniaque, ils cherchent désormais à bâtir une nouvelle
        patrie en Azeroth.</p><p>Puissants et endurants, les Orcs sont capables
        d’encaisser des coups qui feraient plier d’autres combattants. Mais leur
        véritable force ne réside pas seulement dans leur physique : lorsqu’un
        Orc décide que le moment est venu de frapper, sa <strong>Fureur
        sanguinaire</strong> peut transformer quelques secondes de combat en un
        déchaînement brutal.</p><p>Tous les Orcs ne sont pourtant pas des
        guerriers sanguinaires. Leur caractère, leur rapport à l’honneur et
        leurs traditions varient profondément selon leur clan, leur histoire et
        leurs choix. Certains deviennent des meneurs respectés, d’autres
        perfectionnent une tradition martiale, tandis que d’autres encore
        suivent des voies très éloignées du champ de bataille.</p><hr><h2>Traits
        raciaux</h2><p><strong>Âge de départ :</strong> 15+<br><strong>Espérance
        de vie :</strong> 60 ans<br><strong>Taille :</strong> 1,70 m à 2,10
        m<br><strong>Poids :</strong> 70 à 150 kg<br><strong>Traits :</strong>
        grand et athlétique. Peau verdâtre qui tend parfois vers un vert plus
        franc, mâchoire large, front bas, petits yeux.<br><strong>Taille
        :</strong> Normale<br><strong>Déplacement :</strong>
        10m<br><strong>Langues :</strong> Orc et une autre langue selon
        l’origine du personnage ou la campagne.</p><hr><p>Choisir une
        <strong>capacité raciale</strong> à la
        création</p><h3>@UUID[Item.1uh8CzK7ojxKJQho]{Maîtrise de la
        hache}</h3><h3>@UUID[Item.MJ3KDauouJXSsSED]{Commandement}</h3><h3>@UUID[Item.Vknb84JVHRnwKiva]{Fureur
        sanguinaire}</h3><hr><h2>Traits personnels</h2><p>Les Orcs partagent une
        histoire difficile, mais ils ne portent pas tous les mêmes
        cicatrices.</p><p>À la création, choisissez un<strong>
        @UUID[.iyIbv5JXRkcCObgH]{Travers}</strong> et un
        <strong>@UUID[.iyIbv5JXRkcCObgH]{Idéal}</strong> représentant une
        faiblesse liée à votre personnage, son clan, son passé ou sa
        réputation.</p><p>Tirage aléatoire d'un
        <strong>@UUID[RollTable.IQUsJLqTbkPdBbw3]{idéal}</strong> et d'un
        <strong>@UUID[RollTable.87WK59nyuvKNteFE]{travers}</strong></p><blockquote><p>Ces
        traits décrivent <strong>votre Orc</strong>, pas l’ensemble du peuple
        orc.</p></blockquote><hr><h2>Clans et
        traditions</h2><p><strong>@UUID[JournalEntry.V7kBwrob0ElUc6Bk.JournalEntryPage.9fBw7kOQtD2vQpnc]{Frostwolf}</strong>,
        <strong>@UUID[JournalEntry.V7kBwrob0ElUc6Bk.JournalEntryPage.L0humuUjv5k4GQ7a]{Warsong}</strong>
        et les @UUID[JournalEntry.V7kBwrob0ElUc6Bk]{nombreux autres clans orcs
        }peuvent profondément influencer l’éducation, les convictions et les
        relations de votre personnage.</p><p>Ils ne constituent cependant pas
        des sous-races. Deux Orcs d’un même clan peuvent être très différents,
        tandis que deux membres de clans rivaux peuvent partager davantage de
        valeurs qu’ils ne l’imaginent.</p><p>Votre clan est avant tout une
        <strong>origine, une culture et un réseau de relations</strong> : à vous
        de déterminer ce que votre personnage en conserve, ce qu’il rejette et
        ce qu’il souhaite transmettre.</p><hr>
