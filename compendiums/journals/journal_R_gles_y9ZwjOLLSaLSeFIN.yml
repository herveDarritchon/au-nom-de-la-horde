  - sort: 100000
    name: LES PERSONNAGES
    type: text
    _id: YLQJh1WssMT3jJu8
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>CRÉATION DE PERSONNAGE</h1><p class="p2">Les grands héros sont
        davantage qu’une suite de caractéristiques et de chiffres, mais dans un
        système de jeu, c’est sans aucun doute un point de
        départ.</p><hr><h3><span>Personnages alternatifs —
        Rerolls</span></h3><p><span>Dans Warbound, votre personnage n'est pas
        nécessairement le seul héros que vous pourrez incarner au cours de la
        campagne.</span></p><p><span>Comme dans <em>World of Warcraft</em>, vous
        pourrez avoir l'occasion de créer des <strong>personnages alternatifs
        (rerolls)</strong> pour découvrir une autre race, une autre classe ou
        une autre manière de vivre les aventures en
        Azeroth.</span></p><p><span>Cette possibilité prendra notamment tout son
        sens lorsque les objectifs des personnages les conduiront à emprunter
        des chemins différents.</span></p><p><span>Si une partie des héros
        décide de poursuivre une mission tandis que d'autres partent vers un
        autre objectif, les joueurs pourront temporairement incarner d'autres
        personnages pour rejoindre l'expédition en
        cours.</span></p><p><span><strong>Le principe reste simple : nous
        continuons à jouer tous ensemble, même lorsque nos personnages suivent
        des chemins différents.</strong></span></p><p><span>Ces personnages
        alternatifs appartiendront au même monde, pourront vivre leurs propres
        aventures, nouer des relations et avoir une influence durable sur la
        campagne.</span></p><p><span>La création et l'intégration de ces
        personnages se feront en accord avec le MJ, en fonction des occasions
        offertes par l'histoire.</span></p>
