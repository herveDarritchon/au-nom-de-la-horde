  - sort: 900000
    name: Glossaire
    type: text
    _id: Ti8SmCXHQGRdKaQB
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1><span>Glossaire — Création de
        personnage</span></h1><p><span><strong>Chroniques Oubliées Fantasy 2
        (COF2)</strong></span></p><p><span><em>Un guide pour comprendre les
        termes utilisés lors de la création de votre
        héros.</em></span></p><h2><span>1. Les bases du
        personnage</span></h2><table><tbody><tr><th><p><span>Terme</span></p></th><th><p><span>Définition</span></p></th></tr><tr><td><p><span><strong>Rôle</strong></span></p></td><td><p><span>Le
        concept de votre personnage : sa personnalité, sa place dans le groupe
        et ce que vous souhaitez
        jouer.</span></p></td></tr><tr><td><p><span><strong>Profil</strong></span></p></td><td><p><span>L'archétype
        de votre héros : guerrier, voleur, mage, druide, etc. Il détermine ses
        possibilités de départ et ses voies de
        capacités.</span></p></td></tr><tr><td><p><span><strong>Famille de
        profils</strong></span></p></td><td><p><span>Catégorie à laquelle
        appartient votre profil : Aventurier, Combattant, Mage ou Mystique. Elle
        définit notamment votre vigueur, vos dés de récupération et un éventuel
        avantage.</span></p></td></tr><tr><td><p><span><strong>Peuple</strong></span></p></td><td><p><span>L'origine
        de votre personnage (humain, nain, elfe, etc.). Elle modifie certaines
        caractéristiques et donne accès à une voie de
        peuple.</span></p></td></tr><tr><td><p><span><strong>Niveau</strong></span></p></td><td><p><span>Mesure
        générale de l'expérience et de la puissance d'un héros. Tous les
        personnages commencent au niveau
        1.</span></p></td></tr></tbody></table><h2><span>2. Les sept
        caractéristiques</span></h2><p><span>Les caractéristiques représentent
        les aptitudes physiques et mentales de votre personnage. Contrairement à
        certains jeux, COF2 utilise directement des valeurs comme −1, +0, +2 ou
        +4.</span></p><table><tbody><tr><th><p><span>Abréviation</span></p></th><th><p><span>Caractéristique</span></p></th><th><p><span>À
        quoi sert-elle
        ?</span></p></th></tr><tr><td><p><span><strong>FOR</strong></span></p></td><td><p><span>Force</span></p></td><td><p><span>Puissance
        musculaire, soulever des charges, frapper au corps à
        corps.</span></p></td></tr><tr><td><p><span><strong>AGI</strong></span></p></td><td><p><span>Agilité</span></p></td><td><p><span>Réflexes,
        adresse, discrétion, esquive et attaques à
        distance.</span></p></td></tr><tr><td><p><span><strong>CON</strong></span></p></td><td><p><span>Constitution</span></p></td><td><p><span>Santé,
        résistance, endurance et nombre de points de
        vigueur.</span></p></td></tr><tr><td><p><span><strong>PER</strong></span></p></td><td><p><span>Perception</span></p></td><td><p><span>Observation,
        vigilance, intuition, pistage et
        initiative.</span></p></td></tr><tr><td><p><span><strong>INT</strong></span></p></td><td><p><span>Intelligence</span></p></td><td><p><span>Mémoire,
        connaissances, raisonnement et certaines formes de
        magie.</span></p></td></tr><tr><td><p><span><strong>VOL</strong></span></p></td><td><p><span>Volonté</span></p></td><td><p><span>Courage,
        force mentale, résistance à la peur, attaque magique et
        mana.</span></p></td></tr><tr><td><p><span><strong>CHA</strong></span></p></td><td><p><span>Charisme</span></p></td><td><p><span>Présence,
        persuasion, intimidation, certaines formes de magie et points de
        chance.</span></p></td></tr></tbody></table><h3><span>Les trois
        répartitions de caractéristiques</span></h3><p><span>À la création, vous
        choisissez une série de sept valeurs, puis vous les répartissez entre
        vos
        caractéristiques.</span></p><table><tbody><tr><th><p><span>Série</span></p></th><th><p><span>Valeurs
        à
        répartir</span></p></th></tr><tr><td><p><span><strong>Polyvalent</strong></span></p></td><td><p><span>+2,
        +2, +2, +1, +1, 0,
        −1</span></p></td></tr><tr><td><p><span><strong>Expert</strong></span></p></td><td><p><span>+3,
        +2, +1, +1, 0, 0,
        −1</span></p></td></tr><tr><td><p><span><strong>Spécialiste</strong></span></p></td><td><p><span>+4,
        +2, +1, 0, 0, −1, −1</span></p></td></tr></tbody></table><p><span>Les
        ajustements liés au peuple s'appliquent ensuite.</span></p><h2><span>3.
        Les voies et les
        capacités</span></h2><table><tbody><tr><th><p><span>Terme</span></p></th><th><p><span>Définition</span></p></th></tr><tr><td><p><span><strong>Voie</strong></span></p></td><td><p><span>Ensemble
        de capacités organisées autour d'un thème ou d'une spécialité. Chaque
        profil possède cinq voies de
        profil.</span></p></td></tr><tr><td><p><span><strong>Voie de
        profil</strong></span></p></td><td><p><span>Voie correspondant aux
        talents et compétences propres à un
        profil.</span></p></td></tr><tr><td><p><span><strong>Voie de
        peuple</strong></span></p></td><td><p><span>Voie représentant les
        particularités de votre peuple. Son premier rang est normalement obtenu
        gratuitement à la
        création.</span></p></td></tr><tr><td><p><span><strong>Voie du
        mage</strong></span></p></td><td><p><span>Voie spéciale que les profils
        de la famille des Mages peuvent choisir à la place de leur voie de
        peuple, selon des règles
        particulières.</span></p></td></tr><tr><td><p><span><strong>Capacité</strong></span></p></td><td><p><span>Aptitude
        particulière obtenue dans une voie : technique de combat, savoir-faire,
        pouvoir magique ou avantage
        spécial.</span></p></td></tr><tr><td><p><span><strong>Rang</strong></span></p></td><td><p><span>Degré
        de progression dans une voie. Les capacités sont numérotées par rang, du
        plus simple au plus
        avancé.</span></p></td></tr><tr><td><p><span><strong>Points de
        capacité</strong></span></p></td><td><p><span>Points gagnés au cours de
        la progression et dépensés pour acquérir de nouvelles capacités. Ils
        sont distincts des points de
        chance.</span></p></td></tr><tr><td><p><span><strong>Sort</strong></span></p></td><td><p><span>Capacité
        magique identifiée par un astérisque (*) dans les règles et utilisant
        généralement des points de
        mana.</span></p></td></tr></tbody></table><p><span><strong>Au niveau 1
        :</strong> votre personnage choisit deux voies parmi les cinq de son
        profil et reçoit sa voie de peuple. Il obtient gratuitement les
        capacités de rang 1 de ces trois
        voies.</span></p><p><span><strong>Exception des Mages :</strong> ils
        obtiennent également une capacité de rang 2, selon les choix prévus par
        les règles de leur famille.</span></p><h2><span>4. Les ressources du
        personnage</span></h2><table><tbody><tr><th><p><span>Terme</span></p></th><th><p><span>Définition</span></p></th></tr><tr><td><p><span><strong>Points
        de vigueur (PV)</strong></span></p></td><td><p><span>Représentent la
        résistance physique et la capacité à supporter des blessures. Ils
        diminuent lorsque vous subissez des
        dommages.</span></p></td></tr><tr><td><p><span><strong>Dé de
        récupération (DR)</strong></span></p></td><td><p><span>Dé utilisé pour
        récupérer des points de vigueur lors d'une récupération. Son type dépend
        de votre famille de
        profils.</span></p></td></tr><tr><td><p><span><strong>Points de chance
        (PC)</strong></span></p></td><td><p><span>Ressource permettant
        d'influencer certains résultats et de bénéficier d'un coup de chance.
        Leur nombre dépend notamment du
        Charisme.</span></p></td></tr><tr><td><p><span><strong>Points de mana
        (PM)</strong></span></p></td><td><p><span>Réserve d'énergie utilisée
        pour lancer des sorts. Un personnage sans sort n'en possède
        pas.</span></p></td></tr><tr><td><p><span><strong>Récupération
        rapide</strong></span></p></td><td><p><span>Période de repos permettant
        notamment de dépenser des dés de récupération pour regagner des
        PV.</span></p></td></tr><tr><td><p><span><strong>Récupération
        complète</strong></span></p></td><td><p><span>Repos prolongé permettant
        de restaurer les ressources du personnage suivant les règles de
        récupération.</span></p></td></tr></tbody></table><h3><span>Les quatre
        familles de
        profils</span></h3><table><tbody><tr><th><p><span>Famille</span></p></th><th><p><span>PV
        de base par niveau</span></p></th><th><p><span>Type de
        DR</span></p></th><th><p><span>Avantage de
        famille</span></p></th></tr><tr><td><p><span><strong>Aventurier</strong></span></p></td><td><p><span>4</span></p></td><td><p><span>d8</span></p></td><td><p><span>+1
        PC</span></p></td></tr><tr><td><p><span><strong>Combattant</strong></span></p></td><td><p><span>5</span></p></td><td><p><span>d10</span></p></td><td><p><span>Aucun
        bonus
        supplémentaire</span></p></td></tr><tr><td><p><span><strong>Mage</strong></span></p></td><td><p><span>3</span></p></td><td><p><span>d6</span></p></td><td><p><span>1
        capacité de rang 2
        supplémentaire</span></p></td></tr><tr><td><p><span><strong>Mystique</strong></span></p></td><td><p><span>4</span></p></td><td><p><span>d8</span></p></td><td><p><span>+1
        DR</span></p></td></tr></tbody></table><h3><span>Calcul des ressources
        au niveau 1</span></h3><p><span><strong>PV initiaux</strong> = (2 × PV
        de base de la famille) + CON</span></p><p><span><strong>Nombre de
        DR</strong> = 2 + CON (ou 3 + CON pour les
        Mystiques)</span></p><p><span><strong>PC</strong> = 2 + CHA (avec +1
        pour les Aventuriers)</span></p><p><span><strong>PM</strong> = VOL +
        nombre de sorts connus, si le personnage connaît au moins un
        sort.</span></p><h2><span>5. Les valeurs de
        combat</span></h2><table><tbody><tr><th><p><span>Terme</span></p></th><th><p><span>Définition</span></p></th></tr><tr><td><p><span><strong>Initiative
        (Init.)</strong></span></p></td><td><p><span>Détermine la rapidité de
        réaction du personnage et l'ordre d'action en combat. Valeur de base :
        10 + PER.</span></p></td></tr><tr><td><p><span><strong>Défense
        (DEF)</strong></span></p></td><td><p><span>Valeur que les adversaires
        doivent atteindre ou dépasser pour vous toucher. Valeur de base : 10 +
        AGI, modifiée notamment par l'armure, le bouclier ou des
        capacités.</span></p></td></tr><tr><td><p><span><strong>Attaque au
        contact</strong></span></p></td><td><p><span>Bonus utilisé pour attaquer
        un adversaire au corps à corps. Valeur de base : niveau +
        FOR.</span></p></td></tr><tr><td><p><span><strong>Attaque à
        distance</strong></span></p></td><td><p><span>Bonus utilisé pour
        attaquer avec une arme à distance. Valeur de base : niveau +
        AGI.</span></p></td></tr><tr><td><p><span><strong>Attaque
        magique</strong></span></p></td><td><p><span>Bonus utilisé pour les
        attaques magiques. Valeur de base : niveau +
        VOL.</span></p></td></tr><tr><td><p><span><strong>Dommages
        (DM)</strong></span></p></td><td><p><span>Quantité de dégâts infligée
        par une attaque ou un sort, généralement exprimée en
        dés.</span></p></td></tr><tr><td><p><span><strong>Armure</strong></span></p></td><td><p><span>Équipement
        qui augmente la Défense. Certaines armures limitent l'utilisation de
        l'Agilité ou de
        capacités.</span></p></td></tr><tr><td><p><span><strong>Maîtrise des
        armes</strong></span></p></td><td><p><span>Armes que le personnage sait
        utiliser conformément aux possibilités de son profil et de ses
        capacités.</span></p></td></tr></tbody></table><h2><span>6. Le
        vocabulaire de la fiche et des
        dés</span></h2><table><tbody><tr><th><p><span>Terme</span></p></th><th><p><span>Définition</span></p></th></tr><tr><td><p><span><strong>d4,
        d6, d8, d10, d12, d20</strong></span></p></td><td><p><span>Dés à 4, 6,
        8, 10, 12 ou 20
        faces.</span></p></td></tr><tr><td><p><span><strong>2d6</strong></span></p></td><td><p><span>Signifie
        lancer deux dés à six faces et additionner leurs
        résultats.</span></p></td></tr><tr><td><p><span><strong>Modificateur</strong></span></p></td><td><p><span>Valeur
        positive ou négative qui s'ajoute à un résultat ou à une
        statistique.</span></p></td></tr><tr><td><p><span><strong>Test de
        caractéristique</strong></span></p></td><td><p><span>Jet permettant de
        déterminer si une action réussit, en utilisant principalement un d20 et
        la caractéristique
        appropriée.</span></p></td></tr><tr><td><p><span><strong>Difficulté</strong></span></p></td><td><p><span>Valeur
        à atteindre ou dépasser lors d'un test pour réussir une
        action.</span></p></td></tr><tr><td><p><span><strong>Dé bonus / dé
        malus</strong></span></p></td><td><p><span>Mécanisme qui favorise ou
        pénalise un jet en faisant lancer un dé
        supplémentaire.</span></p></td></tr><tr><td><p><span><strong>Équipement
        de départ</strong></span></p></td><td><p><span>Armes, protections,
        objets et fournitures reçus lors de la
        création.</span></p></td></tr></tbody></table><h2><span>7. Donner vie à
        son
        personnage</span></h2><table><tbody><tr><th><p><span>Terme</span></p></th><th><p><span>Définition</span></p></th></tr><tr><td><p><span><strong>Concept</strong></span></p></td><td><p><span>Idée
        centrale qui résume le personnage en quelques
        mots.</span></p></td></tr><tr><td><p><span><strong>Historique
        (background)</strong></span></p></td><td><p><span>Passé du personnage :
        origine, formation, événements marquants et raisons de partir à
        l'aventure.</span></p></td></tr><tr><td><p><span><strong>Idéal
        héroïque</strong></span></p></td><td><p><span>Valeur qui guide ses
        décisions, comme l'honneur, la loyauté ou la
        justice.</span></p></td></tr><tr><td><p><span><strong>Travers</strong></span></p></td><td><p><span>Défaut
        de caractère qui peut influencer ses réactions, comme l'orgueil,
        l'impatience ou la
        gourmandise.</span></p></td></tr><tr><td><p><span><strong>Interprétation
        (roleplay)</strong></span></p></td><td><p><span>Manière d'incarner son
        personnage à travers ses paroles, ses choix et son
        comportement.</span></p></td></tr></tbody></table><div><hr></div><h3><span>L'essentiel
        à retenir</span></h3><p><span><strong>Le profil définit ce que votre
        héros sait faire. Le peuple définit une partie de son héritage. Les
        caractéristiques déterminent ses aptitudes. Les voies et capacités le
        distinguent des autres héros.</strong></span></p><p><span>Son histoire,
        sa personnalité et ses décisions lui donnent sa véritable
        identité.</span></p>
