  - sort: 287500
    name: Origine et Historique
    type: text
    _id: MwiIYEQZTLR1TZ8v
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <h1>Origine et historique</h1><p>Simultanément, vous pouvez déterminer
        l’historique et la provenance géographique de votre PJ
        :</p><ul><li><p>D’où vient-il ?</p></li><li><p>Qu’a-t-il fait durant sa
        jeunesse ?</p></li><li><p>Quel événement l’a poussé à quitter son foyer
        ?</p></li><li><p>Quel est son but (devenir riche, puissant, célèbre,
        rendre justice, servir sa nation, répandre ses idées, percer des
        mystères, réparer une humiliation…) ?</p></li></ul><p>Pour répondre à
        ces questions, vous aurez besoin de l’aide du MJ, car vous devrez vous
        adapter au cadre de jeu, c’est-à-dire le monde dans lequel le personnage
        va évoluer.</p><p>Dans <strong>Warbound</strong>, ces réponses se
        construisent à partir d’un historique lié à votre peuple et, si vous le
        souhaitez, de tables complémentaires. Les tables sont des sources
        d’inspiration, et non des obligations de résultat.<br>Consultez les
        règles
        d'<strong>@UUID[JournalEntry.vA4FO1gaUShHiGKr.JournalEntryPage.DjieV73PSg7Ohw4W]{Origine
        et Historiques}</strong><br></p>
