  - sort: 150000
    name: Profil
    type: text
    _id: 1yPswZCbzV0eh3az
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <h1>Profil</h1><p>Dans <strong>Warbound</strong>, le
        <strong>profil</strong> représente la classe Warcraft du héros et sa
        formation initiale. À la création, chaque personnage débute au
        <strong>niveau 1</strong> de son profil principal.</p><p>Le choix du
        profil détermine quatre éléments essentiels :</p><ul><li><p>sa
        <strong>famille de profils</strong> ;</p></li><li><p>ses <strong>points
        de vigueur</strong>, son type de <strong>dé de récupération</strong> et
        l'éventuel avantage de famille ;</p></li><li><p>les
        <strong>caractéristiques</strong> les plus utiles à la classe
        ;</p></li><li><p>les <strong>voies et capacités</strong> ainsi que les
        équipements auxquels le personnage a naturellement
        accès.</p></li></ul><blockquote><p><strong>Principe Warbound :</strong>
        la famille représente le <em>socle</em> de la classe, pas sa
        spécialisation. Un Paladin reste un Combattant quelle que soit son
        orientation ; un Chaman reste un Mystique même lorsqu'il privilégie le
        combat au contact.</p></blockquote><p>Warbound utilise les quatre
        familles de <em>Chroniques Oubliées Fantasy 2</em> :
        <strong>Aventuriers</strong>, <strong>Combattants</strong>,
        <strong>Mages</strong> et <strong>Mystiques</strong>.</p>
