    image: {}
    text:
      format: 1
      content: >-
        <h1>Relations avec les PJ</h1>

        <h2>Gagner sa confiance / son amitié</h2><p>Dire la vérité même
        lorsqu'elle est peu flatteuse ; protéger quelqu'un sans en faire un
        spectacle ; reconnaître une erreur ; prendre une décision difficile et
        l'assumer.</p>

        <h2>La perdre / devenir son adversaire</h2><p>Mentir dans un rapport ;
        sacrifier quelqu'un pour paraître héroïque ; accuser sans preuve puis
        refuser de reconnaître son erreur.</p>

        <h2>Liens personnels possibles</h2>

        <h3>Le nom qu'il connaît déjà</h3><p>Gornek connaît le clan, le parent
        ou l'ancien supérieur d'un PJ. « Je connais ce nom. On verra si tu le
        portes bien. »</p><h3>L'erreur pardonnée</h3><p>Un PJ commet une vraie
        faute. Gornek ne le couvre pas, mais lui accorde une seconde chance s'il
        assume publiquement sa responsabilité.</p><h3>Le rapport qu'il
        conserve</h3><p>Une décision des PJ l'a marqué. Beaucoup plus tard,
        Gornek ressort leur ancien rapport.</p><h2>S'il devient un
        allié</h2><p>Donner sa parole pour les PJ, leur confier une
        responsabilité importante, les défendre devant une autorité.</p><h2>S'il
        devient hostile</h2><p>Il ne cherche pas à se venger : il cesse de leur
        faire confiance. Il vérifie leurs récits et leur confie moins de
        responsabilités.</p>
