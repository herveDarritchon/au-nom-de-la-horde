        <h1>Gornek</h1>

        <blockquote><p><strong>[CANON] personnage ; développement relationnel
        [ADAPTATION WARBAND]</strong></p></blockquote>

        <h2>Rôle dans la Vallée</h2><p>Figure d'autorité de la Vallée. Il
        observe, juge et se souvient. Son approbation est rare mais
        signifiante.</p>

        <h2>Présence</h2><p>Orc vétéran, plus âgé que la majorité des recrues :
        peau olive sombre, cheveux et barbe grisonnants, nombreuses cicatrices,
        grande lance et rapports roulés.</p>

        <h2>Voix et répliques</h2><ul><li>« Pourquoi ? »</li><li>« Et ensuite ?
        »</li><li>« Qu'est-ce que tu as appris ? »</li></ul>

        <h2>Veut</h2><p>Que les recrues quittent la Vallée vivantes,
        compétentes, capables d'assumer leurs décisions et conscientes de leur
        responsabilité envers les autres.</p>

        <h2>Craint</h2><ul><li>les héros de façade</li><li>l'imprudence déguisée
        en honneur</li><li>les rapports arrangés</li><li>ceux qui refusent
        d'assumer leurs erreurs</li></ul>
