        <h1>Jeu et évolution</h1>

        <h2>Scène prête à jouer</h2><p>Après une situation difficile, Gornek
        écoute le rapport. Long silence. Puis : « Bien. » Et il repart.</p>

        <h2>Évolution hors champ</h2><p>Il peut confier une responsabilité à
        quelqu'un d'autre ou faire parvenir plus tard une recommandation liée
        aux actes des PJ.</p>

