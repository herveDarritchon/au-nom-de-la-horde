      content: "<p><small><strong>AU NOM DE LA HORDE • S02</strong> — MJ uniquement — Document maître évolutif — v0.2 (5 novembre 2026)</small></p><p>🧭 @UUID[JournalEntry.V8tflgkOwnuZH8IT.JournalEntryPage.Az8YDJnF2w65TQwr]{Sommaire} \_ · \_ @UUID[JournalEntry.0HeBXOBC0dnmnedP.JournalEntryPage.Wivdfv9Ym5d9ewNS]{Retard} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État des convois}</p><h3>D. La ruée dans le goulet</h3><p>[ACQUIS / RÉSOLUTION À AFFINER]  Des animaux affolés traversent un passage étroit. L’événement exige de coordonner le groupe plutôt que de combattre les bêtes. Tous les éléments du convoi ne peuvent pas être protégés simultanément.</p>\n<p style=\"margin-left:1em\">• Décisions ouvertes aux PJ — tenir un attelage, éloigner les péons, dégager un passage, sauver une caisse, immobiliser ou faire avancer les chariots.</p>\n<p style=\"margin-left:1em\">• Conséquences à reporter — dégâts matériels, blessures, dispersion possible, retard pour remettre les convois en ordre ; les actes envers les péons influencent leur confiance.</p>\n<p><small>À écrire / vérifier : séquençage des vagues, déclencheurs exacts et coûts de remises en route. Les effets sur le retard sont désormais suivis dans le module § 4 bis.</small></p><p><strong>Autres pages de ce journal :</strong> @UUID[JournalEntry.zg0ZrdYd7H5Uc8gY.JournalEntryPage.4Z4q8B2PkX86MtE5]{À jouer — récit &amp; situations}</p><hr><p><strong>Renvois utiles :</strong> @UUID[JournalEntry.NsTxqshtT9lLumN4.JournalEntryPage.0bD6SqPVwT3RVvJm]{Règle et barème contextuel} \_ · \_ @UUID[JournalEntry.fcZejQdm4u6iAZSe.JournalEntryPage.eWppQeTKF6MHRLF1]{Quatre dispositions possibles} \_ · \_ @UUID[JournalEntry.rkhqyTeD5YIgWE8y.JournalEntryPage.6AT60iHgtk5eqzsa]{État à renseigner à la table}</p><p><strong>Navigation :</strong> @UUID[JournalEntry.CUSS9LNh1aVHmC4H.JournalEntryPage.3cuZoMID9cx1JnQ9]{← Scène précédente} \_ · \_ @UUID[JournalEntry.gQ9DSemaiBWIjW0r.JournalEntryPage.M3exRvSKspw29FSl]{Scène suivante →}</p>"
