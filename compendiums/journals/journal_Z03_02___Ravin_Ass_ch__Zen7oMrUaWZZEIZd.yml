      content: |-
        <h1>PNJ — Morg Broie-Roche</h1>
            <p><strong>ID :</strong> PNJ-Z03-02-02 · <strong>POI :</strong> Z03-02 · <strong>Zone :</strong> Z03</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Garde chargé de rouvrir le ravin · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — patrouilles de route</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Obtenir un responsable visible du convoi perdu.</td></tr><tr><th>Motivation profonde</th><td>Ses supérieurs attendent une réponse rapide.</td></tr><tr><th>Obstacle</th><td>Il confond sécurité et arrestation immédiate.</td></tr>
              <tr><th>Ligne rouge</th><td>Mettre volontairement ses gardes au contact d’un danger inconnu.</td></tr><tr><th>Peut offrir</th><td>Escorte, renseignements sur le trajet, ordre de recherche temporaire.</td></tr><tr><th>En échange</th><td>Preuve d’une hypothèse alternative claire.</td></tr>
              <tr><th>Attitude initiale</th><td>Autoritaire mais pas cruel.</td></tr><tr><th>S'il n'arrive rien</th><td>Ordonne un contrôle renforcé qui perturbe les échanges.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Casque enfoncé et tablette d’inventaire maculée.</p><p><strong>Voix et comportement :</strong> Tape deux fois sur sa hampe avant de décider.</p><p><strong>Signe émotionnel :</strong> Ses phalanges blanchissent lorsque les supérieurs exigent un coupable.</p>
            <blockquote><p><strong>Première réplique :</strong> « Un ravin fermé affame plus vite une ville qu’un ennemi armé. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Quelle piste acceptez-vous de laisser ouverte ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Le convoi est arrivé intact jusqu’à un repère précis.</td></tr><tr><th>Après échange, aide ou observation</th><td>Comprend que les objets manquants ont un usage commun.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Soupçonne à tort les Tranchecrins ou des pillards ; n’a pas de preuve.</td></tr><tr><th>Il demande</th><td>Preuve d’une hypothèse alternative claire.</td></tr>
              <tr><th>Il peut proposer</th><td>Escorte, renseignements sur le trajet, ordre de recherche temporaire.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Mettre volontairement ses gardes au contact d’un danger inconnu.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Détache des gardes pour protéger les recherches.</td></tr><tr><th>S'ils négocient</th><td>Autorise une journée d’enquête avant représailles.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Saisit les preuves puis militarise la route.</td></tr><tr><th>S'ils l'ignorent</th><td>Ordonne un contrôle renforcé qui perturbe les échanges.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z03-02. <strong>Relations / autres lieux :</strong> Peut remonter ses rapports à Orgnil, Z04-02.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> R04 : surveillance accrue ou passage rétabli ; réputation des PJ.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
