      content: |-
        <h1>PNJ — Dorga Main-Sèche</h1>
            <p><strong>ID :</strong> PNJ-Z03-02-01 · <strong>POI :</strong> Z03-02 · <strong>Zone :</strong> Z03</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Conductrice blessée d’un convoi détourné · <strong>Faction / allégeance réelle (MJ) :</strong> Horde — convoyeurs</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Retrouver un aide disparu et récupérer la preuve de la destination du convoi.</td></tr><tr><th>Motivation profonde</th><td>Elle refuse d’être tenue pour responsable de l’échec.</td></tr><tr><th>Obstacle</th><td>Son empoisonnement progresse et son souvenir est fragmentaire.</td></tr>
              <tr><th>Ligne rouge</th><td>Accuser sans preuve le premier clan rencontré.</td></tr><tr><th>Peut offrir</th><td>Témoignage, marques de chargement, morceau de registre.</td></tr><tr><th>En échange</th><td>Soins rapides et promesse de chercher l’aide disparu.</td></tr>
              <tr><th>Attitude initiale</th><td>Fière, irritable à cause de la douleur.</td></tr><tr><th>S'il n'arrive rien</th><td>Sa santé se dégrade et son aide devient plus difficile à retrouver.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Écharpe serrée sur une piqûre, mains tremblantes.</p><p><strong>Voix et comportement :</strong> Parle par saccades et rectifie l’ordre des faits.</p><p><strong>Signe émotionnel :</strong> Resserre son écharpe sur la piqûre quand elle ment sur sa peur.</p>
            <blockquote><p><strong>Première réplique :</strong> « Ils ont laissé les vivres. Pourquoi laisser les vivres ? »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Retrouveriez-vous un vivant avant une caisse ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>L’or et les vivres sont restés dans la charrette.</td></tr><tr><th>Après échange, aide ou observation</th><td>Les caisses visées portaient des marques de soutènement.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Croit avoir aperçu deux attaques distinctes ; n’a pas identifié les auteurs du vol ciblé.</td></tr><tr><th>Il demande</th><td>Soins rapides et promesse de chercher l’aide disparu.</td></tr>
              <tr><th>Il peut proposer</th><td>Témoignage, marques de chargement, morceau de registre.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Accuser sans preuve le premier clan rencontré.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Remet un fragment d’inventaire à confronter à Z04-04.</td></tr><tr><th>S'ils négocient</th><td>Accepte d’attendre un jour si les PJ organisent ses soins.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>Cache un détail par honte et tente de reprendre la route seule.</td></tr><tr><th>S'ils l'ignorent</th><td>Sa santé se dégrade et son aide devient plus difficile à retrouver.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z03-02. <strong>Relations / autres lieux :</strong> À relier à un soigneur de Tranchecolline si disponible.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z03-02 : piste du convoi ouverte, survivante sauvée ou blessée perdue.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
