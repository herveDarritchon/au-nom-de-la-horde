        <h1>Ravin Asséché</h1>

        <p><strong>Identifiant :</strong> Z03-02</p>

        <p><strong>Zone géographique :</strong> Z03 — Falaises du Tonnerre,
        Ravin Asséché et Canyon de Tranchevent</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Nœud [5],
        sous-secteur</p>

        <h2>Fonction dans la campagne</h2>

        <p>Sous-secteur de ravins lié aux convois, aux pistes et aux
        incidents.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Nœud [5] du pointcrawl.</p>

        <p><strong>Repère géographique :</strong> Reliefs du nord intérieur,
        ravins, faune et circulation de matériaux.</p>

        <p><strong>Factions et influences :</strong> Horde (axes logistiques) ;
        Cercle de la Pierre Brisée et Lame ardente (activités clandestines
        possibles, non contrôle).</p>

        <p><strong>Références et réserves :</strong> [PC]</p>

        <p><em>Les caches, carrières et parcours de convois sont des éléments
        fonctionnels de campagne dont les positions exactes restent à
        fixer.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
