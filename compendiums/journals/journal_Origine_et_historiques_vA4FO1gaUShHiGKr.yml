    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>4. Taurens — [[/r 1d12]]</h2>

        <p><em>Peuple des plaines : migrations, Terre-Mère, ancêtres, troupeaux
        et protection des communautés.</em></p>

        <table><thead><tr><th style="text-align:center;width:8%">Dé</th><th
        style="width:28%">Historique</th><th>Ce que tu as vécu et ce que tu
        connais</th></tr></thead><tbody>

        <tr><td style="text-align:center">1</td><td><strong>Gardien de troupeau
        de kodos</strong></td><td>Tu guidais les grandes bêtes et veillais sur
        elles. Tu connais leurs comportements et les exigences des longues
        migrations.</td></tr>

        <tr><td style="text-align:center">2</td><td><strong>Chasseur des
        plaines</strong></td><td>Tu participais aux grandes chasses de Mulgore.
        Tu connais les animaux des plaines et les usages de la chasse
        communautaire.</td></tr>

        <tr><td style="text-align:center">3</td><td><strong>Apprenti
        marche-esprit</strong></td><td>Tu accompagnais les cérémonies dédiées
        aux ancêtres. Tu connais les coutumes spirituelles et les récits de ton
        peuple.</td></tr>

        <tr><td style="text-align:center">4</td><td><strong>Guérisseur des
        tribus</strong></td><td>Tu préparais remèdes, attelles et pansements. Tu
        connais les plantes médicinales et les soins des voyageurs.</td></tr>

        <tr><td style="text-align:center">5</td><td><strong>Survivant des raids
        centaures</strong></td><td>Tu as échappé à une attaque contre ton
        campement. Tu connais certaines tactiques centaures et les dangers des
        plaines.</td></tr>

        <tr><td style="text-align:center">6</td><td><strong>Artisan des
        peaux</strong></td><td>Tu confectionnais tentes, vêtements et
        protections. Tu connais le travail du cuir et la fabrication des
        équipements nomades.</td></tr>

        <tr><td style="text-align:center">7</td><td><strong>Gardien d’un lieu
        sacré</strong></td><td>Tu protégeais un site consacré aux ancêtres ou à
        la Terre-Mère. Tu connais les rites qui y étaient accomplis et les
        devoirs de ses gardiens.</td></tr>

        <tr><td style="text-align:center">8</td><td><strong>Éclaireur des
        migrations</strong></td><td>Tu cherchais les passages sûrs pour ton
        peuple. Tu connais l’orientation, les pistes et les dangers
        naturels.</td></tr>

        <tr><td style="text-align:center">9</td><td><strong>Conteur des
        plaines</strong></td><td>Tu conservais chants, généalogies et légendes.
        Tu connais la mémoire des tribus et l’art de raconter devant une
        assemblée.</td></tr>

        <tr><td style="text-align:center">10</td><td><strong>Gardien des
        jeunes</strong></td><td>Tu protégeais et instruisais les enfants lors
        des déplacements. Tu sais apaiser les conflits et prendre soin d’un
        groupe.</td></tr>

        <tr><td style="text-align:center">11</td><td><strong>Émissaire auprès
        des Orcs</strong></td><td>Tu as participé à des échanges entre
        communautés taurènes et orques. Tu connais leurs coutumes respectives et
        les difficultés de la coopération.</td></tr>

        <tr><td style="text-align:center">12</td><td><strong>Ermite des
        sommets</strong></td><td>Tu as vécu longtemps à l’écart, dans un lieu
        isolé. Tu connais les chemins escarpés, la méditation et la vie loin des
        campements.</td></tr>

        </tbody></table>
