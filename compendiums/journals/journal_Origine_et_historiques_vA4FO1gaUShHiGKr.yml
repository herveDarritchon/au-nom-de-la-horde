      content: >-
        <h2>Choisir son passé et ses attaches</h2><p>Commencez par la table de
        votre race. Vous pouvez ensuite ajouter une raison de venir à
        Tranchecolline et un secret intime. Votre historique décrit ce que vous
        avez appris <em>avant</em> votre vocation actuelle, quelle que soit
        votre classe.</p><p><em>Création de personnage · Règles optionnelles de
        Warbound · Campagne Au Nom de la
        Horde</em></p><blockquote><p><strong>Qui étais-tu avant de partir à
        l’aventure ?</strong> Avant les batailles et les exploits, tu as eu une
        vie : un métier, des proches, des maîtres, des erreurs, des rêves. Ton
        historique raconte ce que tu apportes avec toi dans la nouvelle
        Horde.</p></blockquote><p>Un <strong>historique</strong> représente la
        vie de ton personnage <strong>avant</strong> sa carrière d’aventurier.
        Il ne remplace ni sa <strong>race</strong> ni sa <strong>classe</strong>
        : un guerrier peut avoir été brasseur, un mage pêcheur et un voleur
        apprenti guérisseur.</p><h2>Choisir son
        historique</h2><ol><li><p><strong>Choisis ou tire</strong> dans la table
        de ta race : [[/r 1d20]] pour les Elfes de sang, les Orcs et les Trolls
        sombrelances ; [[/r 1d12]] pour les Taurens et les Réprouvés. Un tirage
        qui ne te plaît pas peut être remplacé par un choix en accord avec le
        MJ.</p></li><li><p><strong>Adopte ou adapte</strong> le passé décrit. Il
        s’agit d’une proposition à personnaliser, pas d’une biographie
        imposée.</p></li><li><p><strong>Facultatif :</strong> tire ou choisis
        une chose laissée derrière toi et une raison de venir à
        Tranchecolline.</p></li><li><p><strong>Complète en une phrase :</strong>
        « Aujourd’hui, je veux… » Tu n’es pas obligé de poursuivre un grand
        destin.</p></li></ol><h2>Savoir-faire issus du passé</h2><p>L’historique
        d’un personnage lui donne les <strong>connaissances et savoir-faire
        ordinaires</strong> correspondant à son ancienne activité. Il définit ce
        que le personnage a eu l’occasion d’apprendre, sans se substituer aux
        capacités de sa classe ou de ses voies.</p><p>Un ancien marin sait
        manœuvrer un bateau et reconnaître les dangers habituels de la
        navigation. Un ancien guérisseur connaît les plantes médicinales
        courantes et les pratiques de soin de sa
        profession.</p><table><thead><tr><th
        style="width:42%"><p>Situation</p></th><th><p>Résolution dans
        Warbound</p></th></tr></thead><tbody><tr><td><p><strong>Connaissance ou
        geste ordinaire</strong> directement lié au passé, sans difficulté
        particulière</p></td><td><p><strong>Réussite automatique</strong> :
        aucun jet n’est demandé.</p></td></tr><tr><td><p><strong>Action
        incertaine, difficile ou risquée</strong> relevant de cette
        expérience</p></td><td><p><strong>Test de caractéristique COF2</strong>
        approprié, avec le nom de la compétence quand il est pertinent : par
        exemple INT (Médecine) ou AGI
        (Discrétion).</p></td></tr><tr><td><p><strong>Expertise
        exceptionnelle</strong>, pouvoir ou effet réservé à une
        spécialisation</p></td><td><p>Seules les <strong>capacités du
        personnage</strong> et les autres règles applicables permettent
        d’obtenir les effets correspondants. L’historique ne les remplace
        pas.</p></td></tr></tbody></table><p><strong>Aucun bonus de compétence
        chiffré.</strong> L’historique n’accorde ni bonus de compétence, ni
        point de capacité, ni talent supplémentaire, ni pouvoir, ni équipement
        de valeur. Dans COF2, les bonus de compétence sont obtenus grâce aux
        capacités, notamment celles des voies de profil, de peuple et de
        prestige : ils ne découlent pas automatiquement du passé
        raconté.</p><p><strong>Relation et souvenir.</strong> Si tu le
        souhaites, définis avec le MJ un contact issu de cette vie passée et un
        objet ordinaire conservé en souvenir. Ce contact n’est ni un serviteur
        ni une faveur automatique.</p><blockquote><p><strong>Exemple :</strong>
        un ancien guérisseur peut reconnaître sans jet des plantes médicinales
        habituelles. Identifier un poison inconnu peut nécessiter un test d’INT
        (Médecine). En revanche, son historique ne lui donne aucun bonus de
        Médecine ni l’accès aux effets d’une capacité de
        soin.</p></blockquote><blockquote><p><strong>À distinguer :</strong>
        COF2 prévoit aussi une règle optionnelle de « talent secondaire » (p.
        37), accordé avec l’autorisation du MJ en remplacement d’une langue.
        Cette option est <strong>indépendante des historiques</strong> et n’est
        pas octroyée par les présentes
        tables.</p></blockquote><blockquote><p><strong>Important :</strong> ton
        historique donne des connaissances ordinaires de ton ancien milieu, pas
        les secrets d’une intrigue. Les informations exceptionnelles sont fixées
        avec le MJ.</p></blockquote><h2>Le cadre de la campagne</h2><p>Durotar
        est le territoire principal de la première saison et
        <strong>Tranchecolline</strong> son point d’ancrage. La jeune Horde
        cherche à faire de Kalimdor une terre d’avenir. Les personnages peuvent
        la soutenir sans partager tous ses choix.</p><p><strong>Elfes de sang
        :</strong> leur peuple n’a pas encore rejoint politiquement la Horde à
        cette époque. Un PJ sin’dorei présent en Durotar est un voyageur ou un
        allié individuel, dont le parcours doit être précisé avec le MJ. Un
        paladin sin’dorei de cette période n’appartient pas d’office aux futurs
        Chevaliers de sang.</p><p><strong>Trolls sombrelances :</strong> la
        table vise les Sombrelances, pas tous les peuples trolls d’Azeroth. Les
        loas et leurs traditions ne sont pas intrinsèquement
        maléfiques.</p><p><strong>Réprouvés :</strong> leur présence loin de
        Lordaeron mérite un motif personnel ; leur acceptation par les habitants
        dépend des circonstances.</p><hr><p><em>Références des règles COF2 :
        Laurent Bernasconi, Chroniques Oubliées Fantasy 2, Black Book Éditions,
        2024, p. 34, 37, 202–203 et 205.</em></p><h2>Secret intime
        (facultatif)</h2><p>Les deux tables <strong>Secrets intimes — table
        I</strong> et <strong>Secrets intimes — table II</strong> sont deux
        réserves distinctes de vingt propositions fournies pour la campagne.
        Vous pouvez en sélectionner une, ou lancer [[/r 1d20]] sur la table
        choisie. Aucun secret n’est exigé.</p><p>Votre personnage peut partager
        son secret avec le MJ seulement. Ce n’est ni un prétexte pour
        compromettre l’aventure collective ni un pouvoir supplémentaire. Les
        révélations, prophéties, pactes et objets évoqués restent à construire
        avec le MJ.</p>
