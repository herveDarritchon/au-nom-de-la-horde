        <h2>2. Orcs — [[/r 1d20]]</h2>

        <p><em>Bâtisseurs de la nouvelle Horde : travailleurs, vétérans,
        familles de clans et habitants d’une patrie encore en
        construction.</em></p>

        <table><thead><tr><th style="text-align:center;width:8%">Dé</th><th
        style="width:28%">Historique</th><th>Ce que tu as vécu et ce que tu
        connais</th></tr></thead><tbody>

        <tr><td style="text-align:center">1</td><td><strong>Ancien
        péon</strong></td><td>Tu as abattu des arbres, creusé des fossés et
        monté des bâtiments. Tu connais les travaux manuels, les outils et la
        vie des ouvriers.</td></tr>

        <tr><td style="text-align:center">2</td><td><strong>Vétéran de la
        Troisième Guerre</strong></td><td>Tu as combattu sous les bannières de
        la Horde. Tu connais les campements militaires, les formations et les
        usages des soldats.</td></tr>

        <tr><td style="text-align:center">3</td><td><strong>Enfant des camps
        d’internement</strong></td><td>Tu as grandi derrière les palissades
        humaines. Tu connais la discipline des gardes, les ruses des prisonniers
        et certaines habitudes humaines.</td></tr>

        <tr><td style="text-align:center">4</td><td><strong>Apprenti
        chaman</strong></td><td>Tu as servi un chaman, entretenu ses offrandes
        et accompagné ses rites. Tu reconnais les lieux sacrés et les usages de
        ta tradition.</td></tr>

        <tr><td style="text-align:center">5</td><td><strong>Chasseur de
        sangliers</strong></td><td>Tu vivais de la chasse et du dépeçage. Tu
        sais poser des pièges, préparer les peaux et reconnaître les traces
        animales.</td></tr>

        <tr><td style="text-align:center">6</td><td><strong>Forgeron de
        campagne</strong></td><td>Tu réparais les outils et les armes de ton
        clan. Tu sais juger la qualité du métal, réparer un équipement simple et
        utiliser une forge.</td></tr>

        <tr><td style="text-align:center">7</td><td><strong>Ancien garde de
        caravane</strong></td><td>Tu protégeais voyageurs et marchandises sur
        les pistes de Kalimdor. Tu connais les embuscades, les bivouacs et les
        marchands itinérants.</td></tr>

        <tr><td style="text-align:center">8</td><td><strong>Sang de
        clan</strong></td><td>Tu as grandi dans une famille attachée aux
        traditions d’un ancien clan orc. Tu connais ses récits, ses coutumes et
        ses vieilles rivalités.</td></tr>

        <tr><td style="text-align:center">9</td><td><strong>Apprenti maître des
        bêtes</strong></td><td>Tu soignais et dressais les animaux utilisés par
        ton peuple. Tu connais leurs comportements, leurs maladies et leurs
        besoins.</td></tr>

        <tr><td style="text-align:center">10</td><td><strong>Éclaireur des
        Tarides</strong></td><td>Tu parcourais les plaines pour observer les
        mouvements ennemis. Tu connais les pistes, les points d’eau et les
        méthodes de reconnaissance.</td></tr>

        <tr><td style="text-align:center">11</td><td><strong>Déserteur
        repenti</strong></td><td>Tu as abandonné ton poste lors d’une campagne
        ou d’une crise. Tu connais la discipline militaire et les moyens
        d’échapper à une poursuite.</td></tr>

        <tr><td style="text-align:center">12</td><td><strong>Brasseur de
        clan</strong></td><td>Tu fabriquais des boissons et préparais les
        festins. Tu connais la fermentation, les ingrédients et les traditions
        d’hospitalité.</td></tr>

        <tr><td style="text-align:center">13</td><td><strong>Assistant
        guérisseur</strong></td><td>Tu aidais à soigner les malades et blessés.
        Tu sais préparer des cataplasmes, poser des bandages et reconnaître les
        blessures courantes.</td></tr>

        <tr><td style="text-align:center">14</td><td><strong>Champion des arènes
        improvisées</strong></td><td>Tu participais à des luttes, duels et
        concours de force. Tu connais les règles des défis, les paris et les
        rivalités entre combattants.</td></tr>

        <tr><td style="text-align:center">15</td><td><strong>Ancien serviteur
        d’un démoniste</strong></td><td>Tu travaillais pour un adepte des arts
        interdits, volontairement ou non. Tu reconnais certains signes de
        corruption et les précautions des occultistes.</td></tr>

        <tr><td style="text-align:center">16</td><td><strong>Artisan des
        fortifications</strong></td><td>Tu construisais palissades, portes et
        tours. Tu sais repérer les points faibles d’une défense et organiser des
        travaux simples.</td></tr>

        <tr><td style="text-align:center">17</td><td><strong>Négociateur des
        frontières</strong></td><td>Tu participais aux échanges avec Taurens,
        Trolls ou communautés indépendantes. Tu connais plusieurs coutumes et
        les usages du troc.</td></tr>

        <tr><td style="text-align:center">18</td><td><strong>Fossoyeur des
        champs de bataille</strong></td><td>Tu ramassais les morts et
        entretenais leurs sépultures. Tu connais les rites funéraires et les
        traces laissées par les combats.</td></tr>

        <tr><td style="text-align:center">19</td><td><strong>Raconteur des
        clans</strong></td><td>Tu conservais les récits de Draenor et des
        guerres passées. Tu connais les anciennes lignées, les chants et les
        légendes orques.</td></tr>

        <tr><td style="text-align:center">20</td><td><strong>Hors-la-loi
        gracié</strong></td><td>Tu as été pillard, voleur ou contrebandier avant
        d’obtenir une nouvelle chance. Tu connais les filières clandestines et
        les cachettes des marges de Durotar.</td></tr>

        </tbody></table>
