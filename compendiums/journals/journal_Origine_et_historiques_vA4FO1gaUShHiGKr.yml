  - sort: 800000
    name: Secrets intimes — table I
    type: text
    _id: b9thwrg81DE1tLpD
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Secrets intimes — table I</h1><p><em>Table facultative de création
        de personnage — choisissez une proposition, tirez [[/r 1d20]] ou
        inventez votre propre secret avec le MJ.</em></p><p>Un secret est un
        <strong>élément de récit</strong>, pas une obligation de jouer contre le
        groupe. Il ne crée automatiquement aucun objet magique, pouvoir,
        malédiction, avantage ou information de scénario. Si un résultat
        implique un autre PJ, convenez-en avec son joueur et le
        MJ.</p><table><thead><tr><th
        style="width:9%;text-align:center">d20</th><th>Secret
        intime</th></tr></thead><tbody><tr><td
        style="text-align:center">1</td><td><strong>Je ne suis pas celui que je
        prétends être.</strong> Mon nom, mon origine ou mon allégeance véritable
        doit rester caché.</td></tr>

        <tr><td style="text-align:center">2</td><td><strong>Je recherche un
        proche disparu</strong> pendant une guerre, un exil ou une migration de
        mon peuple.</td></tr>

        <tr><td style="text-align:center">3</td><td><strong>Une malédiction ou
        une corruption me ronge.</strong> Pour l’instant, j’arrive encore à la
        dissimuler.</td></tr>

        <tr><td style="text-align:center">4</td><td><strong>Je suis recherché
        pour un crime ou une trahison.</strong> Même moi, je ne suis pas certain
        de connaître toute la vérité.</td></tr>

        <tr><td style="text-align:center">5</td><td><strong>Une partie de mes
        souvenirs a disparu</strong> après une bataille, un rituel, une
        captivité ou un événement surnaturel.</td></tr>

        <tr><td style="text-align:center">6</td><td><strong>Une chose que tout
        héros devrait pouvoir affronter me terrifie.</strong> Je fais tout pour
        que personne ne le découvre.</td></tr>

        <tr><td style="text-align:center">7</td><td><strong>Je dépends d’une
        substance, d’un rituel ou d’une forme de magie</strong> dont je sais
        qu’elle finira par me coûter cher.</td></tr>

        <tr><td style="text-align:center">8</td><td><strong>Une blessure
        ancienne suffit à me faire perdre tout contrôle</strong> : un symbole,
        un peuple, une faction, une insulte ou un souvenir précis.</td></tr>

        <tr><td style="text-align:center">9</td><td><strong>Un membre de ma
        famille, de mon clan ou de ma tribu a rejoint mes ennemis.</strong> Il
        connaît mes faiblesses mieux que personne.</td></tr>

        <tr><td style="text-align:center">10</td><td><strong>Je sers secrètement
        une seconde cause.</strong> Pour l’instant, mes deux loyautés ne sont
        pas encore entrées en conflit.</td></tr>

        <tr><td style="text-align:center">11</td><td><strong>J’ai déjà été
        déclaré mort.</strong> Ce qui s’est réellement passé ensuite est quelque
        chose que je préfère cacher.</td></tr>

        <tr><td style="text-align:center">12</td><td><strong>J’ai une dette que
        l’or ne peut pas rembourser.</strong> Une vie sauvée, une faveur, un
        serment ou une dette de sang me lie à quelqu’un.</td></tr>

        <tr><td style="text-align:center">13</td><td><strong>Je ne suis jamais
        vraiment seul dans mon propre esprit.</strong> Une voix, un esprit ou
        une présence m’accompagne.</td></tr>

        <tr><td style="text-align:center">14</td><td><strong>J’ai brisé un
        serment sacré</strong> envers mon peuple, mes ancêtres, les esprits, les
        éléments, la Lumière ou une autre puissance.</td></tr>

        <tr><td style="text-align:center">15</td><td><strong>Je transporte un
        objet dangereux ou interdit</strong> que beaucoup seraient prêts à tuer
        pour obtenir.</td></tr>

        <tr><td style="text-align:center">16</td><td><strong>Je porte le deuil
        de quelqu’un dont je n’ai jamais retrouvé le corps.</strong> Au fond de
        moi, je ne suis pas certain qu’il soit vraiment mort.</td></tr>

        <tr><td style="text-align:center">17</td><td><strong>J’ai abandonné
        quelqu’un qui comptait sur moi.</strong> Cette personne, ou ceux qui lui
        étaient fidèles, pourraient un jour me retrouver.</td></tr>

        <tr><td style="text-align:center">18</td><td><strong>Le même rêve me
        poursuit nuit après nuit.</strong> Je ne sais pas s’il s’agit d’un
        traumatisme, d’un avertissement ou de quelque chose qui cherche à me
        parler.</td></tr>

        <tr><td style="text-align:center">19</td><td><strong>Je n’ai pas réussi
        à empêcher une tragédie.</strong> Certaines personnes pensent même que
        j’en suis responsable.</td></tr>

        <tr><td style="text-align:center">20</td><td><strong>J’ai appartenu à
        une organisation, un culte, un ordre ou une société secrète.</strong> Je
        la sers encore… ou j’essaie désespérément de lui
        échapper.</td></tr></tbody></table>
