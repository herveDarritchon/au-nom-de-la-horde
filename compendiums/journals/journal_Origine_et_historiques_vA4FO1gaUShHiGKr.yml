        <h2>1. Elfes de sang — [[/r 1d20]]</h2>

        <p><em>Héritiers de Quel’Thalas : survivants, artisans, érudits et
        exilés, encore étrangers à la Horde de Kalimdor.</em></p>

        <table><thead><tr><th style="text-align:center;width:8%">Dé</th><th
        style="width:28%">Historique</th><th>Ce que tu as vécu et ce que tu
        connais</th></tr></thead><tbody>

        <tr><td style="text-align:center">1</td><td><strong>Pérégrin de
        Quel’Thalas</strong></td><td>Tu patrouillais les forêts de ton royaume.
        Tu connais la chasse, les traces et la surveillance des
        frontières.</td></tr>

        <tr><td style="text-align:center">2</td><td><strong>Apprenti
        magistère</strong></td><td>Tu étudiais les arcanes auprès d’un maître
        exigeant. Tu reconnais les écritures magiques et les traditions savantes
        de Quel’Thalas.</td></tr>

        <tr><td style="text-align:center">3</td><td><strong>Noble
        déchu</strong></td><td>Ta famille possédait titres, terres et
        serviteurs. Tu connais l’étiquette et les intrigues des grandes maisons,
        même si tu ne possèdes presque plus rien.</td></tr>

        <tr><td style="text-align:center">4</td><td><strong>Guérisseur de
        guerre</strong></td><td>Tu soignais les victimes de la Troisième Guerre.
        Tu sais traiter les blessures, reconnaître les infections et improviser
        des soins.</td></tr>

        <tr><td style="text-align:center">5</td><td><strong>Gardien des
        reliques</strong></td><td>Tu as sauvé des objets précieux lors de la
        chute de Quel’Thalas. Tu connais leur histoire, leurs symboles et
        parfois leurs anciens propriétaires.</td></tr>

        <tr><td style="text-align:center">6</td><td><strong>Novice de la
        Lumière</strong></td><td>Tu servais dans une communauté religieuse. Tu
        connais ses prières, ses rites et les devoirs de ceux qui se réclament
        de la Lumière.</td></tr>

        <tr><td style="text-align:center">7</td><td><strong>Marchand
        ruiné</strong></td><td>Tu négociais étoffes, vins ou bijoux. Tu connais
        la valeur des marchandises et sais reconnaître un négociant honnête d’un
        escroc.</td></tr>

        <tr><td style="text-align:center">8</td><td><strong>Survivant de la
        Malebrèche</strong></td><td>Tu as traversé les terres ravagées par le
        Fléau. Tu reconnais les traces de morts-vivants et sais éviter certains
        dangers des régions maudites.</td></tr>

        <tr><td style="text-align:center">9</td><td><strong>Artisan
        joaillier</strong></td><td>Tu travaillais les pierres précieuses et les
        ornements enchantés. Tu sais juger la qualité d’un joyau et repérer un
        travail contrefait.</td></tr>

        <tr><td style="text-align:center">10</td><td><strong>Archiviste
        royal</strong></td><td>Tu recopiais contrats, chroniques et généalogies.
        Tu connais les usages administratifs et peux reconnaître certains sceaux
        et documents anciens.</td></tr>

        <tr><td style="text-align:center">11</td><td><strong>Apprenti
        botaniste</strong></td><td>Tu étudiais les plantes et préparais des
        remèdes. Tu sais distinguer les herbes médicinales, toxiques ou
        simplement rares.</td></tr>

        <tr><td style="text-align:center">12</td><td><strong>Messager
        clandestin</strong></td><td>Tu transportais des lettres et des objets
        entre communautés isolées. Tu sais dissimuler un message, préparer une
        couverture et éviter les contrôles.</td></tr>

        <tr><td style="text-align:center">13</td><td><strong>Érudit des trolls
        amani</strong></td><td>Tu étudiais les anciennes guerres et les peuples
        voisins de Quel’Thalas. Tu connais certains symboles, coutumes et récits
        amani.</td></tr>

        <tr><td style="text-align:center">14</td><td><strong>Artiste de
        Lune-d’Argent</strong></td><td>Tu étais musicien, danseur, peintre ou
        sculpteur. Tu connais les arts de ton peuple et sais te produire devant
        un public.</td></tr>

        <tr><td style="text-align:center">15</td><td><strong>Ancien
        prisonnier</strong></td><td>Tu as connu les chaînes, les interrogatoires
        ou le travail forcé pendant les troubles récents. Tu sais observer tes
        gardiens et reconnaître les routines d’une prison.</td></tr>

        <tr><td style="text-align:center">16</td><td><strong>Navigateur des
        royaumes de l’Est</strong></td><td>Tu voyageais à bord de navires
        marchands. Tu connais les ports, la navigation côtière et les usages des
        marins humains.</td></tr>

        <tr><td style="text-align:center">17</td><td><strong>Chercheur de magie
        perdue</strong></td><td>Tu parcourais des sanctuaires abandonnés à la
        recherche de savoirs oubliés. Tu sais étudier les anciennes inscriptions
        et reconnaître les dispositifs arcaniques.</td></tr>

        <tr><td
        style="text-align:center">18</td><td><strong>Précepteur</strong></td><td>Tu
        enseignais à de jeunes Elfes issus de différentes familles. Tu connais
        l’histoire, les lettres et les méthodes pour transmettre un
        savoir.</td></tr>

        <tr><td style="text-align:center">19</td><td><strong>Exilé
        volontaire</strong></td><td>Tu as quitté Quel’Thalas après un désaccord
        religieux, politique ou familial. Tu connais les usages de ton ancienne
        communauté et ceux qui t’ont conduit à partir.</td></tr>

        <tr><td style="text-align:center">20</td><td><strong>Agent d’une maison
        disparue</strong></td><td>Tu étais serviteur, intendant, garde ou
        confident d’une puissante famille. Tu connais ses anciens secrets et les
        personnes qui pourraient vouloir les récupérer.</td></tr>

        </tbody></table>
