      content: >-
        <h1>Secrets intimes — table II</h1><p><em>Table facultative de création
        de personnage — choisissez une proposition, tirez [[/r 1d20]] ou
        inventez votre propre secret avec le MJ.</em></p><p>Un secret est un
        <strong>élément de récit</strong>, pas une obligation de jouer contre le
        groupe. Il ne crée automatiquement aucun objet magique, pouvoir,
        malédiction, avantage ou information de scénario. Si un résultat
        implique un autre PJ, convenez-en avec son joueur et le
        MJ.</p><table><thead><tr><th
        style="width:9%;text-align:center">d20</th><th>Secret
        intime</th></tr></thead><tbody><tr><td
        style="text-align:center">1</td><td><strong>Ma famille, mon clan ou ma
        tribu a été massacré, dispersé ou m’a renié.</strong> On ne m’a jamais
        dit toute la vérité sur ce qui s’est passé.</td></tr>

        <tr><td style="text-align:center">2</td><td><strong>On m’a chargé de
        surveiller, protéger ou espionner secrètement un autre membre du
        groupe.</strong> Il ignore pourquoi.</td></tr>

        <tr><td style="text-align:center">3</td><td><strong>Un voyant, un esprit
        ou une vision m’a annoncé que je provoquerais un jour une terrible
        catastrophe.</strong></td></tr>

        <tr><td style="text-align:center">4</td><td><strong>Je porte depuis
        toujours une marque étrange</strong> : cicatrice, rune, tatouage, tache
        ou signe dont j’ignore l’origine et la signification.</td></tr>

        <tr><td style="text-align:center">5</td><td><strong>Une personne qui
        m’est chère a disparu sans laisser de traces.</strong> Je refuse de
        croire qu’elle est morte.</td></tr>

        <tr><td style="text-align:center">6</td><td><strong>Je possède un
        héritage de mon peuple ou de ma famille</strong> et je préférerais
        mourir plutôt que de le perdre.</td></tr>

        <tr><td style="text-align:center">7</td><td><strong>J’ai conclu un pacte
        que je regrette aujourd’hui</strong> avec un démon, un esprit, une
        puissance magique ou une autre entité.</td></tr>

        <tr><td style="text-align:center">8</td><td><strong>Quelqu’un en qui
        j’avais une confiance absolue m’a trahi.</strong> Depuis, j’accorde
        difficilement ma confiance.</td></tr>

        <tr><td style="text-align:center">9</td><td><strong>Une ancienne
        blessure, une mutilation ou une séquelle me poursuit.</strong> Je refuse
        qu’elle définisse ce que je suis capable d’accomplir.</td></tr>

        <tr><td style="text-align:center">10</td><td><strong>Mon nom est connu
        pour un événement dont je préférerais que personne ne parle.</strong> La
        version racontée n’est peut-être même pas la vérité.</td></tr>

        <tr><td style="text-align:center">11</td><td><strong>Je veux accomplir
        quelque chose d’assez grand pour qu’une personne qui compte pour moi
        entende enfin parler de moi.</strong></td></tr>

        <tr><td style="text-align:center">12</td><td><strong>Je dois prouver ma
        valeur à ma famille, mon clan, ma tribu ou mon ancien maître.</strong>
        Leur jugement continue de me hanter.</td></tr>

        <tr><td style="text-align:center">13</td><td><strong>J’ai désespérément
        besoin de richesses ou de ressources</strong>, non pour moi, mais pour
        sauver quelqu’un, reconstruire quelque chose ou honorer une
        dette.</td></tr>

        <tr><td style="text-align:center">14</td><td><strong>La raison que je
        donne pour voyager avec mes compagnons n’est pas la véritable raison de
        ma présence ici.</strong></td></tr>

        <tr><td style="text-align:center">15</td><td><strong>Je cherche à
        devenir assez puissant pour abattre un ennemi que je ne pourrais pas
        encore affronter.</strong> Chef de guerre, démon, créature, sorcier ou
        autre menace.</td></tr>

        <tr><td style="text-align:center">16</td><td><strong>J’ai commis quelque
        chose que je considère impardonnable.</strong> Tout ce que je fais
        depuis vise, d’une manière ou d’une autre, à réparer cette
        faute.</td></tr>

        <tr><td style="text-align:center">17</td><td><strong>J’ai vu ma propre
        mort.</strong> Vision, prophétie ou souvenir impossible : je sais où,
        comment ou par qui elle devrait survenir.</td></tr>

        <tr><td style="text-align:center">18</td><td><strong>Je prétends avoir
        un passé beaucoup plus extraordinaire qu’il ne l’est
        réellement.</strong> Plus je mens, plus il devient difficile d’avouer la
        vérité.</td></tr>

        <tr><td style="text-align:center">19</td><td><strong>Je me comporte en
        compagnon loyal, mais je suis convaincu d’être destiné à commander un
        jour.</strong> Peut-être même à ceux qui voyagent actuellement à mes
        côtés.</td></tr>

        <tr><td style="text-align:center">20</td><td><strong>Je viens d’un
        endroit que presque personne ici ne connaît réellement.</strong> Une
        autre terre, un autre plan ou un territoire si lointain que ce monde me
        paraît encore étranger.</td></tr></tbody></table>
