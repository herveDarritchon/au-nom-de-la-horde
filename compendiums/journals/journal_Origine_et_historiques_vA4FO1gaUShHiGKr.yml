  - sort: 600000
    name: Réprouvés
    type: text
    _id: y9KHRZy8EajSOPgl
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>5. Réprouvés — [[/r 1d12]]</h2>

        <p><em>Libérés de l’emprise du Fléau : une existence nouvelle, parfois
        nourrie des métiers et souvenirs de Lordaeron.</em></p>

        <table><thead><tr><th style="text-align:center;width:8%">Dé</th><th
        style="width:28%">Historique</th><th>Ce que tu as vécu et ce que tu
        connais</th></tr></thead><tbody>

        <tr><td style="text-align:center">1</td><td><strong>Ancien soldat de
        Lordaeron</strong></td><td>Tu as servi dans une armée humaine avant ta
        mort. Tu connais ses tactiques, son organisation et ses usages
        militaires.</td></tr>

        <tr><td style="text-align:center">2</td><td><strong>Apprenti
        apothicaire</strong></td><td>Tu as appris à préparer des substances
        alchimiques. Tu connais les réactifs, les poisons et les précautions de
        laboratoire.</td></tr>

        <tr><td
        style="text-align:center">3</td><td><strong>Fossoyeur</strong></td><td>Tu
        travaillais dans les cimetières avant ou après ta mort. Tu connais les
        sépultures, les cryptes et les usages funéraires.</td></tr>

        <tr><td style="text-align:center">4</td><td><strong>Ancien érudit de
        Lordaeron</strong></td><td>Tu étais étudiant, copiste ou précepteur. Tu
        connais l’histoire humaine, les archives et certains savoirs du royaume
        disparu.</td></tr>

        <tr><td style="text-align:center">5</td><td><strong>Espion du Fléau
        libéré</strong></td><td>Tu as retrouvé ta volonté après avoir servi le
        Fléau. Tu connais certains signes de ses agents et leurs méthodes de
        surveillance.</td></tr>

        <tr><td style="text-align:center">6</td><td><strong>Ancien
        médecin</strong></td><td>Tu soignais autrefois des patients vivants. Tu
        connais l’anatomie, la chirurgie et les maladies ordinaires.</td></tr>

        <tr><td style="text-align:center">7</td><td><strong>Noble
        oublié</strong></td><td>Tu appartenais à une famille importante de
        Lordaeron. Tu connais ses lignées, ses alliances et les codes de la
        noblesse humaine.</td></tr>

        <tr><td style="text-align:center">8</td><td><strong>Éclaireur de
        Tirisfal</strong></td><td>Tu parcourais les bois et les ruines autour de
        Fossoyeuse. Tu connais les lieux abandonnés et les moyens de t’y
        déplacer discrètement.</td></tr>

        <tr><td style="text-align:center">9</td><td><strong>Ancien
        artisan</strong></td><td>Tu exerçais un métier avant ta mort et as
        repris tes outils depuis. Tu connais ton artisanat et les communautés
        qui le pratiquent.</td></tr>

        <tr><td style="text-align:center">10</td><td><strong>Déserteur du
        Fléau</strong></td><td>Tu as retrouvé ta liberté et fui les serviteurs
        du Roi-liche. Tu connais leurs habitudes et certaines de leurs méthodes
        d’intimidation.</td></tr>

        <tr><td style="text-align:center">11</td><td><strong>Marin
        mort-vivant</strong></td><td>Tu as navigué autrefois et peux encore
        servir sur un navire. Tu connais les cartes marines, les manœuvres et
        les dangers de la mer.</td></tr>

        <tr><td style="text-align:center">12</td><td><strong>Émissaire
        solitaire</strong></td><td>Tu voyages pour nouer des contacts au nom de
        ta communauté ou pour ton propre compte. Tu connais les usages
        diplomatiques et sais composer avec la méfiance des vivants.</td></tr>

        </tbody></table>
