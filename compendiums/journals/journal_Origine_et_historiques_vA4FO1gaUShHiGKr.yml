    image: {}
    text:
      format: 1
      content: >-
        <hr>

        <h2>Tables complémentaires (facultatives)</h2>

        <p>Ces tirages ajoutent de la couleur à ton passé, sans te donner une
        mission obligatoire. Tu peux répondre toi-même, choisir un résultat ou
        lancer les dés.</p>

        <h3>Ce que tu as laissé derrière toi — [[/r 1d12]]</h3>

        <table><thead><tr><th
        style="text-align:center;width:12%">1d12</th><th>Résultat</th></tr></thead><tbody>

        <tr><td style="text-align:center">1</td><td>Une personne à qui tu dois
        la vie.</td></tr>

        <tr><td style="text-align:center">2</td><td>Un ancien rival qui ne t’a
        pas oublié.</td></tr>

        <tr><td style="text-align:center">3</td><td>Une dette que tu n’as jamais
        pu rembourser.</td></tr>

        <tr><td style="text-align:center">4</td><td>Un objet modeste dont tu
        ignores la véritable importance.</td></tr>

        <tr><td style="text-align:center">5</td><td>Une promesse faite à un
        mourant.</td></tr>

        <tr><td style="text-align:center">6</td><td>Un ami qui a choisi un camp
        opposé au tien.</td></tr>

        <tr><td style="text-align:center">7</td><td>Une réputation que tu ne
        mérites peut-être pas.</td></tr>

        <tr><td style="text-align:center">8</td><td>Un maître, mentor ou parent
        qui attend ton retour.</td></tr>

        <tr><td style="text-align:center">9</td><td>Une erreur qui a coûté cher
        à quelqu’un.</td></tr>

        <tr><td style="text-align:center">10</td><td>Un secret que tu as choisi
        de protéger.</td></tr>

        <tr><td style="text-align:center">11</td><td>Un proche qui a disparu
        sans explication.</td></tr>

        <tr><td style="text-align:center">12</td><td>Une petite victoire dont tu
        restes fier.</td></tr>

        </tbody></table>

        <h3>Pourquoi es-tu à Tranchecolline ? — [[/r 1d12]]</h3>

        <table><thead><tr><th
        style="text-align:center;width:12%">1d12</th><th>Résultat</th></tr></thead><tbody>

        <tr><td style="text-align:center">1</td><td>Tu cherches du travail et
        une vie meilleure.</td></tr>

        <tr><td style="text-align:center">2</td><td>Tu accompagnes un ami ou un
        membre de ta famille.</td></tr>

        <tr><td style="text-align:center">3</td><td>Tu as entendu dire que la
        Horde avait besoin de volontaires.</td></tr>

        <tr><td style="text-align:center">4</td><td>Tu fuis un conflit, une
        dette ou une accusation.</td></tr>

        <tr><td style="text-align:center">5</td><td>Tu souhaites retrouver une
        personne.</td></tr>

        <tr><td style="text-align:center">6</td><td>Tu veux comprendre ce que
        devient la nouvelle Horde.</td></tr>

        <tr><td style="text-align:center">7</td><td>Tu as été engagé pour un
        travail temporaire.</td></tr>

        <tr><td style="text-align:center">8</td><td>Tu cherches un maître
        capable de poursuivre ta formation.</td></tr>

        <tr><td style="text-align:center">9</td><td>Tu suis la trace d’un objet
        ou d’une information.</td></tr>

        <tr><td style="text-align:center">10</td><td>Tu veux faire tes preuves
        loin de chez toi.</td></tr>

        <tr><td style="text-align:center">11</td><td>Tu avais une autre
        destination, mais un imprévu t’a retenu ici.</td></tr>

        <tr><td style="text-align:center">12</td><td>Tu es venu par curiosité et
        n’as pas encore décidé de repartir.</td></tr>

        </tbody></table>

        <h2>Exemple de création</h2>

        <p><strong>Grosh — Orc guerrier.</strong> Historique : <strong>Brasseur
        de clan</strong> (12). Passé : <strong>Une petite victoire dont tu
        restes fier</strong> (12). Arrivée : <strong>Tu cherches du travail et
        une vie meilleure</strong> (1).</p>

        <p>Grosh a remporté un concours de brassage et rêve désormais d’ouvrir
        une petite brasserie à Tranchecolline. Il sait choisir des ingrédients,
        faire fermenter une boisson et discuter avec les artisans. Il peut
        connaître un habitué de l’auberge de Grosk, avec l’accord du MJ. Son
        passé ne lui donne ni bonus au combat ni privilège particulier : il lui
        donne <strong>une place dans le monde</strong>.</p>

        <h2>Trois questions pour terminer</h2>

        <ul>

        <li><strong>Qui connais-tu encore</strong> grâce à ton ancien métier ou
        ta communauté ?</li>

        <li><strong>Qu’est-ce que tu ne veux pas revivre ?</strong></li>

        <li><strong>Quelle place souhaites-tu prendre</strong> dans cette
        nouvelle Horde ?</li>

        </ul>

        <blockquote><p><strong>Le meilleur historique n’est pas celui qui promet
        la plus grande destinée. C’est celui qui rend ton personnage capable
        d’agir, de connaître quelqu’un et d’avoir une raison de s’intéresser à
        ce qui l’entoure.</strong></p></blockquote>

        <p><em>Document de règles maison Warbound ; historiques et tables conçus
        pour la campagne Au Nom de la Horde. Les peuples, lieux et références à
        Warcraft appartiennent à l’univers de Blizzard Entertainment. Les
        situations personnelles sont des propositions de jeu, non des faits
        canoniques.</em></p>
