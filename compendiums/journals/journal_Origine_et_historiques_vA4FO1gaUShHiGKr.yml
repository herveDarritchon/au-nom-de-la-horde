        <h2>3. Trolls sombrelances — [[/r 1d20]]</h2>

        <p><em>Peuple des jungles et des îles : pêcheurs, guérisseurs,
        chasseurs, féticheurs et gardiens des traditions.</em></p>

        <table><thead><tr><th style="text-align:center;width:8%">Dé</th><th
        style="width:28%">Historique</th><th>Ce que tu as vécu et ce que tu
        connais</th></tr></thead><tbody>

        <tr><td style="text-align:center">1</td><td><strong>Chasseur de la
        jungle</strong></td><td>Tu traquais les bêtes dans les jungles de la
        vallée de Strangleronce. Tu connais la chasse, les poisons naturels et
        les techniques de camouflage.</td></tr>

        <tr><td style="text-align:center">2</td><td><strong>Pêcheur des Îles de
        l’Écho</strong></td><td>Tu vivais de la mer, des filets et des pièges à
        crustacés. Tu sais naviguer en pirogue et lire les courants
        côtiers.</td></tr>

        <tr><td style="text-align:center">3</td><td><strong>Apprenti
        féticheur</strong></td><td>Tu aidais un praticien du vaudou à préparer
        ses objets rituels. Tu connais les ingrédients, les fétiches et les
        cérémonies de sa tradition.</td></tr>

        <tr><td style="text-align:center">4</td><td><strong>Gardien des
        crânes</strong></td><td>Tu entretenais les reliques et les souvenirs de
        tes ancêtres. Tu connais les rites funéraires et les histoires
        familiales de ton village.</td></tr>

        <tr><td style="text-align:center">5</td><td><strong>Dompteur de
        raptors</strong></td><td>Tu élevais, surveillais ou tentais
        d’apprivoiser des raptors. Tu connais leurs habitudes, leurs blessures
        et leurs réactions.</td></tr>

        <tr><td style="text-align:center">6</td><td><strong>Ancien captif d’une
        tribu rivale</strong></td><td>Tu as passé du temps au sein d’une
        communauté troll hostile. Tu connais certaines de ses pratiques et sais
        survivre en captivité.</td></tr>

        <tr><td style="text-align:center">7</td><td><strong>Fabricant de
        poisons</strong></td><td>Tu préparais des mixtures pour les chasseurs.
        Tu sais reconnaître des venins, récolter des ingrédients et éviter les
        accidents.</td></tr>

        <tr><td style="text-align:center">8</td><td><strong>Guetteur du
        littoral</strong></td><td>Tu surveillais les côtes et annonçais
        l’arrivée des embarcations. Tu sais lire des signaux, observer de loin
        et identifier différents navires.</td></tr>

        <tr><td style="text-align:center">9</td><td><strong>Apprenti prêtre d’un
        loa</strong></td><td>Tu servais un officiant et participais aux
        cérémonies. Tu connais les récits, les offrandes et les tabous liés à
        ton culte.</td></tr>

        <tr><td style="text-align:center">10</td><td><strong>Danseur des
        cérémonies</strong></td><td>Tu menais ou accompagnais les célébrations
        communautaires. Tu connais les rythmes, les danses et les usages des
        rassemblements.</td></tr>

        <tr><td style="text-align:center">11</td><td><strong>Survivant de
        l’exil</strong></td><td>Tu as participé aux déplacements de ton peuple
        vers Kalimdor. Tu connais la vie en mer, les campements précaires et la
        solidarité des voyageurs.</td></tr>

        <tr><td style="text-align:center">12</td><td><strong>Ramasseur de
        juju</strong></td><td>Tu récoltais des ingrédients et préparais des
        composants rituels. Tu connais les lieux de cueillette et certaines
        pratiques des féticheurs.</td></tr>

        <tr><td style="text-align:center">13</td><td><strong>Porte-lance de
        Vol’jin</strong></td><td>Tu as servi parmi les combattants sombrelances.
        Tu connais la défense des villages, les rondes et les traditions
        guerrières de ta tribu.</td></tr>

        <tr><td style="text-align:center">14</td><td><strong>Soigneur
        tribal</strong></td><td>Tu préparais infusions, baumes et remèdes. Tu
        connais les maladies, les plantes médicinales et les soins
        quotidiens.</td></tr>

        <tr><td style="text-align:center">15</td><td><strong>Messager entre
        villages</strong></td><td>Tu transportais nouvelles et invitations entre
        communautés trolls. Tu sais suivre des sentiers discrets et identifier
        les marques tribales.</td></tr>

        <tr><td style="text-align:center">16</td><td><strong>Pirate des mers du
        Sud</strong></td><td>Tu naviguais avec des marins peu recommandables. Tu
        connais les abordages, les ports clandestins et les pratiques de
        contrebande.</td></tr>

        <tr><td style="text-align:center">17</td><td><strong>Conteur des
        anciens</strong></td><td>Tu mémorisais les légendes, les exploits et les
        disputes de ton peuple. Tu connais la tradition orale et sais captiver
        un auditoire.</td></tr>

        <tr><td style="text-align:center">18</td><td><strong>Exilé pour un tabou
        brisé</strong></td><td>Tu as enfreint une interdiction religieuse ou
        tribale, volontairement ou non. Tu connais les usages de ton village et
        les conséquences d’un sacrilège.</td></tr>

        <tr><td style="text-align:center">19</td><td><strong>Chasseur de trésors
        engloutis</strong></td><td>Tu explorais épaves, récifs et petites îles.
        Tu connais la plongée, les courants et la récupération d’objets
        immergés.</td></tr>

        <tr><td style="text-align:center">20</td><td><strong>Survivant de
        Zalazane</strong></td><td>Tu as échappé à l’emprise ou aux violences de
        ses partisans. Tu reconnais certains signes de leurs pratiques et
        connais des gens restés dans les îles.</td></tr>

        </tbody></table>
