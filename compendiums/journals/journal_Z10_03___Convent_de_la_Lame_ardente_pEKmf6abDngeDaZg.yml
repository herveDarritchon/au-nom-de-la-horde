      default: 0
      TjbWhMczNyKieD8D: 3
    text:
      format: 1
      content: |-
        <h1>PNJ — Ishka la Cendre</h1>
            <p><strong>ID :</strong> PNJ-Z10-03-01 · <strong>POI :</strong> Z10-03 · <strong>Zone :</strong> Z10</p>
            <p><strong>Origine / statut :</strong> Original Warbound</p>
            <p><strong>Fonction :</strong> Recrue du convent en rupture avec ses maîtres · <strong>Faction / allégeance réelle (MJ) :</strong> Lame ardente (recrue hésitante)</p>
            <p><em>Fiche réservée au MJ. L'incarnation et les paroles sont proposées pour Warbound, pas des dialogues officiels du jeu.</em></p>
            <h2>1. Carte minute — 15 secondes</h2><table><tbody>
              <tr><th>Veut maintenant</th><td>Effacer son nom d’un registre de recrutement et quitter le convent.</td></tr><tr><th>Motivation profonde</th><td>Elle craint d’être liée à un rituel qu’elle ne comprend pas.</td></tr><tr><th>Obstacle</th><td>Un surveillant possède un signe permettant de l’identifier.</td></tr>
              <tr><th>Ligne rouge</th><td>Amener une autre recrue à sa place.</td></tr><tr><th>Peut offrir</th><td>Description d’un signe, heure de relève, piste vers une entrée secondaire.</td></tr><tr><th>En échange</th><td>Sécurité et anonymat pour un départ.</td></tr>
              <tr><th>Attitude initiale</th><td>Soupçonneuse, prend peur à l’approche d’un uniforme.</td></tr><tr><th>S'il n'arrive rien</th><td>Un surveillant déplace les archives et resserre la discipline.</td></tr>
            </tbody></table>
            <h2>2. Comment l'incarner</h2>
            <p><strong>Premier regard :</strong> Marques de cendre en lignes répétées sur les doigts.</p><p><strong>Voix et comportement :</strong> Parle trop vite quand elle a peur.</p><p><strong>Signe émotionnel :</strong> Frotte ses doigts jusqu’à en effacer la cendre lorsque la peur monte.</p>
            <blockquote><p><strong>Première réplique :</strong> « Je n’ai signé que pour apprendre. Ils m’ont fait promettre autre chose. »</p></blockquote>
            <p><strong>Question posée aux PJ :</strong> « Vous pouvez aider sans savoir qui j’ai servi ? »</p>
            <h2>3. Informations et leviers (MJ)</h2><table><tbody>
              <tr><th>Spontané, sans jet</th><td>Des novices de niveaux d’engagement très différents sont présents.</td></tr><tr><th>Après échange, aide ou observation</th><td>Un symbole observé ici réapparaît potentiellement au Rocher du crâne.</td></tr>
              <tr><th>Secret / croyance / ignorance</th><td>Ne connaît pas les objectifs du chantier d’Orgrimmar ; peut décrire seulement son propre recrutement.</td></tr><tr><th>Il demande</th><td>Sécurité et anonymat pour un départ.</td></tr>
              <tr><th>Il peut proposer</th><td>Description d’un signe, heure de relève, piste vers une entrée secondaire.</td></tr><tr><th>Ne franchira pas sa ligne rouge</th><td>Amener une autre recrue à sa place.</td></tr>
            </tbody></table>
            <p><em>Un indice essentiel ne dépend jamais d'un seul jet obligatoire. Aucun test de voyage supplémentaire pour lui parler.</em></p>
            <h2>4. Réactions aux choix des PJ</h2><table><tbody>
              <tr><th>S'ils l'aident</th><td>Remet une page du registre de novices, sous condition de sécurité.</td></tr><tr><th>S'ils négocient</th><td>Conseille une approche qui évite d’exposer les captifs.</td></tr>
              <tr><th>S'ils le menacent ou s'opposent</th><td>S’enfuit et se cache ; pourrait prévenir les cultistes par panique.</td></tr><tr><th>S'ils l'ignorent</th><td>Un surveillant déplace les archives et resserre la discipline.</td></tr>
            </tbody></table>
            <p><strong>Improviser :</strong> objectif + contrainte + ligne rouge.</p>
            <h2>5. Relations, mobilité et présence</h2>
            <p><strong>Attache :</strong> Z10-03. <strong>Relations / autres lieux :</strong> Convent local Classic ; chaîne hiérarchique du complot reste à déterminer.</p>
            <h2>6. Suivi après la séance</h2>
            <p><strong>Conséquence possible :</strong> Z10/Z02 : indice du réseau cultiste sans révélation complète.</p>
            <p><strong>Statut / attitude envers les PJ :</strong> [à actualiser en jeu]</p>
            <p><strong>Dette, engagement, prochain geste :</strong> [à actualiser en jeu]</p>
            <p><strong>Répercussion sur le POI :</strong> à consigner dans « Suivi MJ ».</p>
            <h2>7. COF2 et Warbound (facultatif)</h2>
            <p><strong>Actor COF2 :</strong> non défini. <strong>Tests / POP :</strong> seulement si nécessaires, à déterminer selon la scène.</p>
            <p><em>Ne pas accorder un succès de guide PNJ COF2 automatiquement. Aucun pouvoir de Guide PJ Warbound attribué ici.</em></p>
