        <h1>Convent de la Lame ardente</h1>

        <p><strong>Identifiant :</strong> Z10-03</p>

        <p><strong>Zone géographique :</strong> Z10 — Vallée des Épreuves</p>

        <p><strong>Nature de l'entrée :</strong> Lieu / secteur — Site
        hostile</p>

        <h2>Fonction dans la campagne</h2>

        <p>Site de la Lame ardente connu dans le secteur ; articulation au fil
        rouge ouverte.</p>

        <h2>Contexte territorial — informations MJ</h2>

        <p><strong>Statut de la zone :</strong> Prologue ou détour
        facultatif.</p>

        <p><strong>Repère géographique :</strong> Secteur de formation des
        recrues, avec sites rocheux et présence cultiste.</p>

        <p><strong>Factions et influences :</strong> Horde ; présence locale de
        la Lame ardente (lien exact au fil rouge non fixé).</p>

        <p><strong>Références et réserves :</strong> [CLASSIC] — liens de
        campagne non fixés</p>

        <p><em>Le « chemin secret » est présent dans l’inventaire source avec un
        statut et une pertinence de campagne à confirmer.</em></p>

        <hr>

        <p><small>Source : Warbound — Durotar, découpage des POI par zone
        géographique V1. Certaines entrées sont des accès ou des emplacements
        encore à définir, et non des POI visitables indépendants.</small></p>
