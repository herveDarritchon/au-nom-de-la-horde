    name: 00 · Vue d’ensemble
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Repères de zone —
        Z06</h2><table><thead><tr><th>Champ</th><th>Information</th></tr></thead><tbody><tr><td>Nom</td><td>Côte
        des Naufrages et Donjon de Tiragarde</td></tr><tr><td>Situation /
        limite</td><td>Est / sud-est de Tranchecolline, côte et fort
        humain</td></tr><tr><td>Influence structurante</td><td><strong>Garnison
        de Tiragarde</strong> ; pression Horde ; manipulation indirecte de la
        Lame ardente</td></tr><tr><td>Statut dans la campagne</td><td>[4]
        cœur</td></tr><tr><td>Danger COF2 de départ (à
        confirmer)</td><td><strong>Sauvage DD 15</strong> sur approches non
        sûres ; <strong>en guerre DD 20</strong> seulement si combat
        ouvert</td></tr><tr><td>Distance et durée</td><td><strong>Non
        calibrées</strong> : à renseigner par liaison /
        tronçon.</td></tr></tbody></table><h3>Situation de départ</h3><p>côte
        orientale, épaves, postes d'observation et garnison humaine du
        <strong>lieutenant Benedict</strong> ; passage côtier potentiel depuis
        Sen'jin. [PC] [FAC] [GUIDE]</p><blockquote><p><strong>Document réservé
        au MJ.</strong> Le zonage, les DD et les incidents sont des propositions
        Warbound. Les secrets des factions ne sont pas connus des PJ. La
        difficulté effective est fixée <strong>par trajet avant le jet du
        Guide</strong>, pas automatiquement pour toute la
        zone.</p></blockquote><h3>Mémo : comment utiliser cette zone</h3><ol>

        <li>Situer le trajet et les POI réellement connus.</li>

        <li>Montrer les itinéraires plausibles et leurs compromis.</li>

        <li>Choisir ellipse, scène ou journée de voyage Warbound V2.</li>

        <li>En cas de journée jouée : Guide INT (Survie) d’abord, Éclaireur PER
        (Survie) et Voyageurs CON (Survie) ensuite.</li>

        <li>Appliquer le bilan COF2, puis mettre à jour les POI, routes et
        factions concernés.</li>

        </ol>
