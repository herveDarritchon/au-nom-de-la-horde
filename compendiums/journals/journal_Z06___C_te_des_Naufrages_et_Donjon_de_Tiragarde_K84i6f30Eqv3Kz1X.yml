  - _id: 242156279b4ca0cf
    name: 02 · Factions et secrets MJ
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Factions et influences — Z06</h2><p><strong>irréductibles de Kul
        Tiras</strong> dans la garnison ; sensibilités
        <strong>pragmatique</strong> et <strong>épuisée</strong>. <strong>Jaina
        / Alliance</strong> = politique d'apaisement extérieure, <strong>pas
        contrôle direct du fort</strong>. <strong>Lame ardente</strong> =
        manipulation secrète des irréductibles, <strong>pas
        alliance</strong>.</p><h3>Matrice des influences du
        référentiel</h3><table><thead><tr><th>Faction</th><th>Implantation /
        contrôle pertinent</th><th>Incursions, clandestinité ou influence
        indirecte</th><th>Effet sur les voyages (mise en
        scène)</th></tr></thead><tbody><tr><td><strong>Garnison de
        Tiragarde</strong></td><td>Fort et postes Z06</td><td>Reconnaissances
        vers Z04/Z07 possibles <strong>selon les actions de campagne</strong>,
        non acquises</td><td>Contrôles, patrouilles, signes de dissension,
        escalade</td></tr><tr><td><strong>Alliance / ligne de
        Jaina</strong></td><td><strong>Aucun territoire administré au cœur de
        Durotar</strong> dans le cadre de saison</td><td>Effet diplomatique
        distant sur l'enjeu Z06</td><td>Trêve fragile ; évite le raccourci «
        tous les humains veulent la guerre »</td></tr><tr><td><strong>Lame
        ardente</strong></td><td>Repaire Z02</td><td>Agents infiltrés Z01 ;
        manipulation des irréductibles Z06 ; activités ailleurs <strong>non
        cartographiées précisément</strong></td><td>Indices discrets, fausses
        pistes, informations partielles, tension
        nourrie</td></tr><tr><td><strong>Horde</strong></td><td>Z01, Z04, Z07
        (Sombrelances), corridors de Z03 et Z10</td><td>Patrouilles / logistique
        en Z05, Z06, Z08</td><td>Convois, relais, pistes entretenues, sécurité
        variable</td></tr></tbody></table><blockquote><p><strong>Attention
        :</strong> une infiltration, un sabotage ou une manipulation ne signifie
        pas que la faction contrôle publiquement le territoire. Les relations
        secrètes ne doivent pas être divulguées automatiquement. Une faction
        hostile ne rend pas mécaniquement toute la région « en guerre
        ».</p></blockquote>
