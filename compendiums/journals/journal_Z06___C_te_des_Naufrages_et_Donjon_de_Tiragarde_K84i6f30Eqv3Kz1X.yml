  - _id: e8525bddd8861e65
    name: 01 · Géographie et POI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h2>Points d’intérêt — Z06</h2><p>Chaque POI possède un rattachement
        territorial unique. Un accès ou un sentier local n’est pas
        nécessairement un nœud du pointcrawl.</p><table><thead><tr><th>POI /
        ID</th><th>Nature</th><th>Origine /
        réserve</th></tr></thead><tbody><tr><td><code>Z06-01</code> Donjon de
        Tiragarde</td><td><strong>Nœud [4]</strong>, mini-donjon</td><td>[PC]
        [FAC]</td></tr><tr><td><code>Z06-02</code> Côte des
        Naufrages</td><td><strong>Nœud [4]</strong>,
        littoral</td><td>[PC]</td></tr><tr><td><code>Z06-03</code> Épaves et
        postes de guet</td><td>Sites secondaires</td><td>[GUIDE] — à
        localiser</td></tr><tr><td><code>Z06-04</code> Sentier vers
        Sen'jin</td><td>Route
        alternative</td><td>[PC]</td></tr><tr><td><code>Z06-05</code> Approche
        depuis
        Tranchecolline</td><td>Route</td><td>[PC]</td></tr></tbody></table><h3>Implantation
        et rôle des lieux</h3><p><code>Z06-01</code> Donjon de Tiragarde
        <strong>[4, mini-donjon]</strong> ; <code>Z06-02</code> Côte des
        Naufrages <strong>[4]</strong> ; <code>Z06-03</code> épaves et postes
        côtiers <strong>[GUIDE ; positions à fixer]</strong> ;
        <code>Z06-04</code> sentier côtier vers Sen'jin <strong>[GUIDE /
        PC]</strong> ; <code>Z06-05</code> approche terrestre depuis
        Tranchecolline <strong>[PC]</strong>.</p><h3>Connaissance des PJ (à
        renseigner)</h3><ul>

        <li><strong>Inconnu</strong> : ne pas présenter l’accès ou le lieu comme
        une option.</li>

        <li><strong>Repéré</strong> : rumeur, indication ou repère visible.</li>

        <li><strong>Connu</strong> : visité ou documenté.</li>

        <li><strong>Maîtrisé</strong> : habitudes, accès, contacts et risques
        bien compris.</li>

        </ul>

        <blockquote><p><strong>À compléter en séance :</strong> pour chaque POI
        utilisé, noter sa connaissance, son accessibilité réelle et son état
        actuel. Ne pas divulguer le contenu des entrées secrètes aux
        joueurs.</p></blockquote>
