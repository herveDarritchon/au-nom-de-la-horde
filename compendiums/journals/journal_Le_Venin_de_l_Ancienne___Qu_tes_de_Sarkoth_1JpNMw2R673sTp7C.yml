  - _id: 4b129a32474e0991
    name: 3. La piste de Sarkoth
    type: text
    sort: 400000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>3. La piste de Sarkoth</h2>

        <h3>Sur le plateau</h3>

        <p><em>À lire aux personnages :</em></p>

        <blockquote>

        <p>Le sentier devient pierreux. Des dalles chauffées par le soleil
        émergent du sable rouge et de petites crevasses traversent le plateau.
        Des traces profondes de pinces rejoignent toutes un éboulis récent au
        pied d’une paroi. Ici et là, des carapaces vides et des restes de
        petites proies parsèment le sol.</p>

        </blockquote>

        <p>Des scorpides plus jeunes rôdent entre les rochers. Ils peuvent être
        observés, contournés ou repoussés ; ils n’attaquent pas
        systématiquement. Des restes de proies abandonnées laissent penser qu’un
        grand prédateur peine désormais à chasser.</p>

        <h3>Indices à découvrir</h3>

        <table>

        <thead>

        <tr>

        <th>Signe</th>

        <th>Ce qu’il révèle</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Sarkoth porte une profonde blessure à la pince droite.</td>

        <td>Hana’zua l’a réellement touchée.</td>

        </tr>

        <tr>

        <td>Ses traces convergent vers les mêmes rochers.</td>

        <td>Elle cherche quelque chose à cet endroit.</td>

        </tr>

        <tr>

        <td>Elle cesse de poursuivre ceux qui s’éloignent des rochers.</td>

        <td>Son comportement est principalement défensif.</td>

        </tr>

        <tr>

        <td>De gros blocs ont été déplacés récemment.</td>

        <td>Des travaux ont modifié le passage.</td>

        </tr>

        <tr>

        <td>Les blocs portent des marques répétées de pinces.</td>

        <td>Sarkoth tente de dégager l’ouverture.</td>

        </tr>

        <tr>

        <td>Des mues et de petites carapaces sont visibles dans les
        fissures.</td>

        <td>Des scorpides fréquentent depuis longtemps le secteur.</td>

        </tr>

        <tr>

        <td>Des proies mal saisies ont été abandonnées.</td>

        <td>Sa pince blessée gêne sa chasse.</td>

        </tr>

        </tbody>

        </table>

        <p>Les traces, les témoignages et l’exploration permettent de comprendre
        progressivement la situation. Aucun indice essentiel ne dépend d’un
        unique test.</p>

        <hr>
