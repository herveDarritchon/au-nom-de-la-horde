  - _id: c6ca968347c799d4
    name: 7. Si les personnages tardent
    type: text
    sort: 800000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>7. Si les personnages tardent</h2>

        <p><strong>Hana’zua s’affaiblit.</strong> L’antidote ordinaire ne fait
        que ralentir les symptômes. Sans venin adapté et sans secours efficace,
        sa respiration se dégrade puis il succombe.</p>

        <p><strong>Sarkoth s’approche davantage des pistes.</strong> En
        cherchant à contourner les déblais, elle provoque un incident avec un
        péon, une recrue ou un chariot.</p>

        <p><strong>Gornek prépare une chasse.</strong> Une troupe est envoyée
        pour abattre la bête. La confrontation près du refuge peut disperser les
        jeunes scorpides et rendre d’autres chemins dangereux.</p>

        <p>Même si Hana’zua meurt, les personnages peuvent encore décider de
        tuer Sarkoth, de déplacer la menace ou de rétablir un équilibre dans le
        secteur.</p>

        <hr>
