  - _id: 9cac7597bf5ee4dd
    name: 6. Le venin de Sarkoth
    type: text
    sort: 700000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>6. Le venin de Sarkoth</h2>

        <p>Le poison brut est extrêmement dangereux. En revanche, <strong>du
        venin frais correctement préparé et dilué</strong> par un guérisseur ou
        un alchimiste permet de fabriquer un antivenin capable de sauver
        Hana’zua.</p>

        <p>Les personnages disposent de plusieurs approches :</p>

        <p><strong>Tuer Sarkoth.</strong> Ils peuvent prélever du venin sur son
        aiguillon tant qu’il est exploitable et rapporter sa pince comme preuve
        de sa mort.</p>

        <p><strong>L’immobiliser ou la capturer.</strong> Un piège, un
        endormissement ou une prise soigneusement préparée peut permettre un
        prélèvement. Cette méthode est risquée et provoque une réaction violente
        si la bête se sent menacée.</p>

        <p><strong>Provoquer une piqûre contrôlée.</strong> Un récipient protégé
        par une membrane ou une pièce de cuir peut recueillir le venin. Il est
        également possible de chercher une proie tout juste piquée.</p>

        <p><strong>Gagner sa tolérance.</strong> Des offrandes, une approche
        prudente et la réouverture de son passage peuvent rendre possible un
        prélèvement limité sans tuer l’Ancienne. Elle n’accorde toutefois aucune
        garantie de coopération.</p>

        <p>La matière récoltée doit être confiée rapidement à un soigneur
        compétent. Les prélèvements supplémentaires, s’ils sont possibles,
        peuvent fournir <strong>une réserve d’antivenin rare</strong>.</p>

        <hr>
