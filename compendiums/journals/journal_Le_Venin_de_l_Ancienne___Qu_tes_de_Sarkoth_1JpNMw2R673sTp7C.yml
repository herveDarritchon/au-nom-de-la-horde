  - _id: c2a281ee81bf2f4f
    name: 4. Le passage condamné
    type: text
    sort: 500000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>4. Le passage condamné</h2>

        <p>Des péons ont récemment bouché une fissure rocheuse pour consolider
        une piste fréquentée par les recrues et les chariots. Ils ignoraient que
        cette ouverture menait à <strong>une cavité fraîche où Sarkoth pond et
        protège ses jeunes</strong>.</p>

        <p>La matriarche cherche depuis un autre accès. Ses déplacements
        l’amènent près des passages de la Horde, multipliant les rencontres
        dangereuses. Les péons voulaient simplement stabiliser la piste et
        craignent désormais qu’on leur demande de défaire leurs travaux.</p>

        <p>Les personnages peuvent examiner l’éboulis, interroger les ouvriers,
        suivre les pistes et repérer l’ancien refuge grâce aux mues et aux
        jeunes scorpides.</p>

        <p><strong>Rouvrir la fissure</strong> ou <strong>aménager un passage
        alternatif</strong> peut éloigner Sarkoth des chemins. Il faut cependant
        préserver la stabilité de la piste et empêcher les voyageurs de pénétrer
        dans la zone de ponte. Une entrée dégagée ne rend pas la matriarche
        inoffensive.</p>

        <hr>
