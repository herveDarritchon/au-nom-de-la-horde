  - _id: e1ddf7cb8237e6d9
    name: 2. Prévenir Gornek
    type: text
    sort: 300000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>2. Prévenir Gornek</h2>

        <p><strong>Gornek</strong> connaît la réputation de Sarkoth et la
        dangerosité du venin de scorpide. Il veut faire soigner Hana’zua et
        empêcher d’autres attaques sur les recrues.</p>

        <p>Il peut mobiliser des secouristes, faire apporter des antidotes
        ordinaires pour gagner du temps et transmettre des informations sur les
        travaux récents. Il peut également orienter les personnages vers des
        chasseurs ou des soigneurs capables de préparer l’antivenin.</p>

        <p>Si la seule solution paraît être de tuer Sarkoth, Gornek ne s’y
        oppose pas. Si les aventuriers démontrent que ses incursions proviennent
        d’un accès condamné et proposent un passage sûr, il peut accepter
        d’écarter les voyageurs de son territoire.</p>

        <p>En l’absence de solution, il finit par <strong>envoyer des
        chasseurs</strong> sur le plateau.</p>

        <hr>
