  - _id: 3a0a05424240c2b5
    name: 1. Le Troll sous l’arbre
    type: text
    sort: 200000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>1. Le Troll sous l’arbre</h2>

        <p>Les personnages peuvent découvrir l’affaire de plusieurs manières :
        Hana’zua gémit à l’écart d’un sentier ; Gornek s’inquiète de sa
        disparition ; des péons signalent une énorme scorpide près de leurs
        travaux ; un chasseur remarque d’étranges déplacements autour du
        plateau.</p>

        <h3>Découverte</h3>

        <p><em>À lire aux personnages :</em></p>

        <blockquote>

        <p>Au pied d’un arbre tordu, un jeune Troll respire péniblement. Sa
        jambe porte les marques profondes de deux pinces. Une tache sombre
        s’étend autour d’une piqûre à la poitrine. Il essaie de se redresser à
        votre approche, puis grimace et retombe contre le tronc.</p>

        </blockquote>

        <p><strong>Hana’zua</strong> explique qu’il traquait Sarkoth pour
        prouver sa valeur. Il a frappé le premier et blessé une pince. Le
        scorpide lui a saisi la jambe ; il n’a pas vu venir l’aiguillon. Le
        Troll est certain que la bête doit mourir et demande qu’on lui rapporte
        <strong>sa pince abîmée</strong> comme preuve.</p>

        <p>Il est sincère, mais ignore pourquoi Sarkoth se trouvait près des
        rochers.</p>

        <p><strong>Hana’zua sait :</strong> Sarkoth est beaucoup plus grande que
        les autres scorpides ; il a profondément entaillé sa pince droite ; son
        poison est anormalement violent.</p>

        <p><strong>Hana’zua ignore :</strong> l’existence du lieu de ponte, les
        conséquences des travaux des péons et la possibilité d’obtenir du venin
        sans tuer la matriarche.</p>

        <h3>Secours immédiats</h3>

        <p>Les personnages peuvent installer Hana’zua à l’abri, le transporter,
        faire prévenir Gornek ou demander l’aide d’un guérisseur. Les soins et
        l’antidote ordinaire peuvent ralentir son déclin, mais il faut du venin
        frais de Sarkoth, convenablement préparé, pour neutraliser le
        poison.</p>

        <hr>
