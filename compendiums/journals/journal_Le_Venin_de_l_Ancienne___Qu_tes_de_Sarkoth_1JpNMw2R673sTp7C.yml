  - _id: 9f5fd5cc149e96cf
    name: 5. Face à la Mère rouge
    type: text
    sort: 600000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>5. Face à la Mère rouge</h2>

        <p><em>À lire aux personnages :</em></p>

        <blockquote>

        <p>Un scorpide gigantesque surgit lentement d’entre les rochers. Sa
        carapace rouge sombre, noircie et entaillée par les saisons, brille sous
        le soleil. Une profonde cicatrice fend sa pince droite, qui ne se
        referme plus correctement. La créature pivote vers vous, ouvre sa pince
        valide et dresse son aiguillon. Elle se place entre vous et l’éboulis,
        mais ne charge pas immédiatement.</p>

        </blockquote>

        <p>Sarkoth est blessée et particulièrement méfiante, mais ne cherche ni
        vengeance ni affrontement gratuit. Elle défend l’accès à son ancien
        refuge.</p>

        <table>

        <thead>

        <tr>

        <th>Action des personnages</th>

        <th>Réaction de Sarkoth</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td>Passer à bonne distance</td>

        <td>Elle observe sans poursuivre.</td>

        </tr>

        <tr>

        <td>Approcher lentement</td>

        <td>Elle se redresse et menace.</td>

        </tr>

        <tr>

        <td>Reculer après la menace</td>

        <td>Elle cesse généralement de les suivre.</td>

        </tr>

        <tr>

        <td>Menacer sa pince blessée</td>

        <td>Elle recule ou frappe pour se défendre.</td>

        </tr>

        <tr>

        <td>S’approcher des jeunes ou de l’entrée</td>

        <td>Elle barre le passage puis attaque si l’intrusion persiste.</td>

        </tr>

        <tr>

        <td>Déposer de la nourriture</td>

        <td>Elle examine l’offrande avec prudence.</td>

        </tr>

        <tr>

        <td>Dégager l’éboulis</td>

        <td>Elle surveille le travail et essaie de rejoindre l’ouverture.</td>

        </tr>

        <tr>

        <td>L’encercler ou la blesser</td>

        <td>Elle combat violemment, protège le refuge ou cherche à
        s’échapper.</td>

        </tr>

        </tbody>

        </table>

        <p>Les dalles élevées, le sable meuble, les crevasses et les passages
        étroits peuvent devenir autant de refuges ou d’obstacles pendant la
        rencontre. De jeunes scorpides peuvent surgir des fissures si leur abri
        est menacé.</p>

        <h3>La comprendre</h3>

        <p>Sarkoth reconnaît des individus, des gestes répétés, les menaces et
        les offrandes. Un chasseur patient peut analyser ses réactions. Un
        chaman, un druide ou tout personnage disposant d’un moyen approprié peut
        percevoir des intentions et images rudimentaires :</p>

        <blockquote>

        <p><em>Petits — pierre fermée — douleur — passage — danger — reculer —
        donner.</em></p>

        </blockquote>

        <p>Elle ne comprend ni les lois de la Horde ni la propriété d’une route.
        Une relation de confiance reste fragile et liée à des actes
        concrets.</p>

        <hr>
