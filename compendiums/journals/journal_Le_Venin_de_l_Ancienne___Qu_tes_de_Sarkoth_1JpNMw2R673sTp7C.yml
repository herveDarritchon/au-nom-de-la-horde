      level: 1
    text:
      format: 1
      content: >-
        <h1>Sarkoth — Le Venin de l’Ancienne</h1><h2>Quêtes — Vallée des
        Épreuves, sud de Durotar</h2><blockquote><p><strong>Lieu :</strong>
        l’Antre, les sentiers de la Vallée des Épreuves, le plateau de
        Sarkoth<br><strong>Personnages :</strong> Hana’zua, Gornek, Sarkoth,
        péons, chasseurs et guérisseurs<br><strong>Enjeux :</strong> sauver
        Hana’zua, obtenir du venin, sécuriser un passage, décider du sort de la
        Mère rouge</p></blockquote><hr><h2>La
        situation</h2><p><strong>Hana’zua</strong>, un jeune Troll Sombrelance,
        a affronté seul
        <strong>@UUID[JournalEntry.w3CKHMrGxXxe1GEr]{Sarkoth}</strong>,
        l’immense scorpide appelée la Mère rouge. Il a ouvert une profonde
        entaille dans l’une de ses pinces, mais la créature l’a saisi à la jambe
        puis piqué à la poitrine. Le blessé est désormais incapable de rejoindre
        seul l’Antre.</p><p>Son état empire. Les antidotes habituels contre les
        scorpides ralentissent les effets du poison sans les neutraliser. Un
        guérisseur peut préparer un remède efficace à partir de <strong>venin
        frais de Sarkoth</strong>. Il faut d’abord retrouver la matriarche et
        obtenir ce venin.</p><p>De son côté, Sarkoth s’est rapprochée des pistes
        empruntées par les recrues et les chariots. Elle cherche à rejoindre son
        ancien lieu de ponte : une fissure rocheuse dont les péons ont bouché
        l’entrée en consolidant un chemin. Sa pince blessée complique sa chasse
        et renforce sa méfiance.</p><p><strong>Hana’zua veut sa mort. Gornek
        veut sauver le blessé et protéger la vallée. Sarkoth veut retrouver
        l’accès à ses jeunes.</strong></p><hr>
