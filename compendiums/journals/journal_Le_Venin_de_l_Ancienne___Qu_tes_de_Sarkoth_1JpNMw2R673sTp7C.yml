  - _id: 21515970bf209b00
    name: 9. Récompenses et repères MJ
    type: text
    sort: 1000000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>9. Récompenses possibles</h2>

        <p>Selon leurs actes, les personnages peuvent gagner la
        <strong>confiance de Gornek</strong>, la <strong>reconnaissance de
        Hana’zua</strong>, une <strong>réserve d’antivenin de Sarkoth</strong>,
        la connaissance de <strong>pistes plus sûres</strong> autour du plateau
        et une bonne réputation auprès de certains chasseurs ou guérisseurs.</p>

        <p>Si Sarkoth survit, les personnages peuvent revenir auprès d’elle ou
        de sa descendance, sans pouvoir compter sur une docilité permanente.</p>

        <p>Si la valeur de son venin se répand, des marchands et des braconniers
        peuvent à leur tour chercher à la capturer ou à l’exploiter, provoquant
        de nouveaux incidents autour du plateau.</p>

        <hr>

        <hr>

        <h2>Repères MJ</h2>

        <table>

        <thead>

        <tr>

        <th>Élément</th>

        <th>Réponse</th>

        </tr>

        </thead>

        <tbody>

        <tr>

        <td><strong>Danger immédiat</strong></td>

        <td>Hana’zua est empoisonné et décline.</td>

        </tr>

        <tr>

        <td><strong>Besoin</strong></td>

        <td>Du venin frais de Sarkoth, préparé en antivenin.</td>

        </tr>

        <tr>

        <td><strong>Demande de Hana’zua</strong></td>

        <td>Tuer Sarkoth et lui rapporter une preuve.</td>

        </tr>

        <tr>

        <td><strong>Priorité de Gornek</strong></td>

        <td>Sauver Hana’zua et sécuriser les chemins.</td>

        </tr>

        <tr>

        <td><strong>Désir de Sarkoth</strong></td>

        <td>Retrouver l’accès à son site de ponte.</td>

        </tr>

        <tr>

        <td><strong>Origine du conflit</strong></td>

        <td>Des péons ont condamné la fissure en renforçant la piste.</td>

        </tr>

        <tr>

        <td><strong>Indices essentiels</strong></td>

        <td>Traces convergentes, pierres rayées, mues et jeunes scorpides.</td>

        </tr>

        <tr>

        <td><strong>Autres solutions</strong></td>

        <td>Capture, prélèvement prudent, observation, accès restauré,
        tolérance.</td>

        </tr>

        <tr>

        <td><strong>Sans intervention</strong></td>

        <td>Hana’zua faiblit, les incidents augmentent, Gornek envoie des
        chasseurs.</td>

        </tr>

        <tr>

        <td><strong>Mort de Sarkoth</strong></td>

        <td>Soulagement immédiat, possible dispersion des jeunes scorpides.</td>

        </tr>

        <tr>

        <td><strong>Refuge restauré</strong></td>

        <td>Moins d’incursions, territoire de ponte à respecter.</td>

        </tr>

        </tbody>

        </table>
