  - _id: 448cfa79129aeee6
    name: 8. Conséquences
    type: text
    sort: 900000
    title:
      show: true
      level: 1
    text:
      format: 1
      content: >-
        <h2>8. Conséquences</h2>

        <h3>Sarkoth est tuée</h3>

        <p>Hana’zua peut être sauvé si un venin exploitable est prélevé et
        préparé à temps. La route redevient immédiatement plus sûre. Les jeunes
        scorpides, privés de la présence de la matriarche, peuvent se disperser
        et s’installer près de nouveaux chemins. Hana’zua peut ressentir de la
        fierté, puis devoir reconnaître que d’autres ont achevé son combat.</p>

        <h3>Sarkoth est chassée</h3>

        <p>L’accès aux routes est dégagé, mais la bête cherche un nouveau
        refuge. Le danger risque d’être déplacé vers d’autres pistes du sud de
        Durotar.</p>

        <h3>La fissure est rouverte</h3>

        <p>La matriarche retrouve son site de ponte et fréquente moins les
        chemins de la Horde. Gornek peut accepter la solution si la circulation
        est protégée et le refuge respecté. Les aventuriers doivent encore
        obtenir et faire préparer le venin pour sauver Hana’zua.</p>

        <h3>Une tolérance durable s’établit</h3>

        <p>Sarkoth peut reconnaître les aventuriers et les laisser approcher
        dans certaines circonstances. Des prélèvements ultérieurs deviennent
        possibles si elle survit et n’est pas de nouveau menacée. Elle reste une
        bête sauvage et dangereuse, surtout près de ses jeunes.</p>

        <h3>Hana’zua survit sans vengeance</h3>

        <p>Le Troll doit accepter que son honneur ne dépendait pas
        nécessairement de la mort de la matriarche. Il peut comprendre qu’il a
        attaqué une créature sans savoir ce qu’elle défendait.</p>

        <h3>Hana’zua meurt</h3>

        <p>Sa mort peut déclencher des demandes de vengeance. La sécurité de la
        vallée, le sort du refuge et la valeur du venin restent des enjeux pour
        les habitants.</p>

        <hr>
