      content: >-
        <h1>Caractère</h1>

        <p>Les Travers de cette famille sont adaptés des Handicaps de <em>Savage
        Worlds</em> au moteur de <strong>Chroniques Oubliées Fantasy 2</strong>
        utilisé par Warbound.</p>

        <table><thead><tr><th>Travers</th><th>Règle
        Warbound</th><th>Complications typiques</th></tr></thead><tbody>

        <tr><td><strong>Arrogant</strong></td><td>Tu es convaincu de ta
        supériorité. Tu cherches à affronter les adversaires les plus
        prestigieux, supportes mal qu’on mette ton talent en doute et préfères
        souvent dominer plutôt que simplement gagner.</td><td>Défi inutile,
        refus de battre en retraite, rivalité, ennemi humilié, plan abandonné
        pour prouver ta valeur.</td></tr>

        <tr><td><strong>Bavard</strong></td><td>Tu parles trop, remplis les
        silences et conserves difficilement une information pour toi lorsque la
        conversation t’emporte.</td><td>Secret dévoilé, plan éventé,
        interlocuteur irrité, information donnée au mauvais moment.</td></tr>

        <tr><td><strong>Bizarrerie</strong></td><td>Choisis une manie précise,
        reconnaissable et suffisamment gênante pour pouvoir revenir en jeu sans
        devenir une caricature permanente.</td><td>Retard, malaise social,
        rituel inutile, refus d’une solution pourtant simple.</td></tr>

        <tr><td><strong>Chimère</strong></td><td>Tu crois sincèrement à une idée
        étrange ou fausse. Définis-la avec le MJ. Elle doit pouvoir orienter
        certaines de tes décisions sans rendre le personnage
        injouable.</td><td>Mauvaise interprétation d’un indice, confiance
        accordée à tort, refus d’une explication pourtant crédible.</td></tr>

        <tr><td><strong>Couard</strong></td><td>Ta propre sécurité pèse lourd
        dans tes décisions. Lorsque tu dois résister à une peur, une menace ou
        une intimidation qui te vise directement, le MJ peut imposer un dé malus
        à un test de VOL approprié.</td><td>Retraite prématurée, hésitation à
        secourir quelqu’un, abandon d’une position avantageuse.</td></tr>

        <tr><td><strong>Cupide</strong></td><td>L’argent, les objets rares et le
        partage du butin influencent fortement tes décisions. Tu supportes mal
        de laisser passer une occasion de profit.</td><td>Marchandage au mauvais
        moment, détour pour un trésor, conflit sur un partage, confiance
        accordée à quelqu’un qui paie.</td></tr>

        <tr><td><strong>Curieux</strong></td><td>Les mystères t’attirent. Une
        porte fermée, une rumeur contradictoire, une caverne inconnue ou un
        mécanisme étrange constituent des invitations difficiles à
        ignorer.</td><td>Détour, danger réveillé, intrusion, information
        découverte au prix d’un risque.</td></tr>

        <tr><td><strong>Hésitant</strong></td><td>Sous pression, tu as du mal à
        trancher rapidement. Le Travers ne te fait pas automatiquement perdre un
        tour : il doit surtout se traduire par une décision tardive ou une
        occasion manquée quand la fiction s’y prête.</td><td>Fenêtre d’action
        perdue, ordre contradictoire, retard dans une décision
        urgente.</td></tr>

        <tr><td><strong>Impitoyable</strong></td><td>Lorsque tu poursuis un
        objectif important, tes scrupules passent après le résultat. Définis
        avec le MJ jusqu’où le personnage accepte réellement
        d’aller.</td><td>Allié choqué, témoin sacrifié, réputation dégradée,
        solution plus brutale que nécessaire.</td></tr>

        <tr><td><strong>Impulsif</strong></td><td>Tu préfères agir plutôt
        qu’attendre. Lorsque le groupe hésite trop longtemps, tu as tendance à
        prendre l’initiative avant que toutes les informations soient
        réunies.</td><td>Piège déclenché, négociation interrompue, combat
        commencé trop tôt, position révélée.</td></tr>

        <tr><td><strong>Jaloux</strong></td><td>Tu supportes mal qu’un autre
        obtienne reconnaissance, affection, pouvoir ou possession que tu estimes
        mériter.</td><td>Rivalité, tentative de voler la vedette, mauvaise
        décision motivée par l’envie.</td></tr>

        <tr><td><strong>Mauvaise habitude</strong></td><td>Tu possèdes une
        habitude gênante ou une dépendance définie avec le MJ. Une dépendance
        lourde peut nécessiter des effets spécifiques, décidés avant le début de
        la partie.</td><td>Besoin pressant, comportement déplacé, dette, manque,
        mauvaise réputation.</td></tr>

        <tr><td><strong>Obsession</strong></td><td>Tu poursuis un objectif
        personnel qui tend à prendre le pas sur le reste : vengeance,
        reconnaissance, perfection, recherche d’un objet, protection d’un lieu,
        etc.</td><td>Détour, risque disproportionné, conflit de priorité avec le
        groupe.</td></tr>

        <tr><td><strong>Phobie</strong></td><td>Choisis une peur irrationnelle
        suffisamment précise. Lorsqu’elle est directement présente et influence
        réellement la scène, le MJ peut imposer un dé malus aux tests accomplis
        sous son emprise.</td><td>Fuite, paralysie momentanée, refus d’entrer
        dans un lieu, choix d’une route plus dangereuse.</td></tr>

        <tr><td><strong>Poches percées</strong></td><td>Tu conserves
        difficilement ton argent : dépenses impulsives, générosité déplacée,
        paris, fêtes, achats inutiles ou mauvais investissements. Il n’y a pas
        de perte automatique d’argent entre les séances.</td><td>Fonds
        insuffisants au mauvais moment, dette, achat regrettable.</td></tr>

        <tr><td><strong>Présomptueux</strong></td><td>Tu surestimes
        régulièrement tes capacités et acceptes des défis qu’un personnage plus
        lucide éviterait.</td><td>Danger sous-estimé, duel accepté, tâche
        entreprise sans aide, adversaire provoqué.</td></tr>

        <tr><td><strong>Prudent</strong></td><td>Tu détestes agir sans
        information suffisante. Tu préfères observer, préparer une issue de
        secours et sécuriser les risques avant de te lancer.</td><td>Occasion
        manquée, temps perdu, allié impatient, adversaire qui prend
        l’initiative.</td></tr>

        <tr><td><strong>Rancunier</strong></td><td>Tu oublies difficilement les
        offenses. Une humiliation ou une trahison crée une dette personnelle que
        tu cherches tôt ou tard à régler.</td><td>Vengeance mal placée, refus
        d’une alliance utile, ennemi poursuivi malgré une urgence plus
        importante.</td></tr>

        <tr><td><strong>Sale caractère</strong></td><td>Tu es cassant,
        désagréable ou peu conciliant. Lorsque sympathie, chaleur humaine ou
        coopération volontaire sont essentielles, le MJ peut imposer un dé malus
        au test social approprié.</td><td>Contact vexé, négociation durcie,
        service refusé, réputation dégradée.</td></tr>

        <tr><td><strong>Sanguinaire</strong></td><td>Tu privilégies volontiers
        l’élimination définitive des ennemis et accordes difficilement la
        clémence. Ce Travers ne donne jamais le droit d’annuler une décision
        collective du groupe.</td><td>Prisonnier tué, information perdue,
        représailles, conflit avec une autorité ou un compagnon.</td></tr>

        <tr><td><strong>Sceptique</strong></td><td>En Azeroth, tu ne nies pas
        l’existence de la magie. En revanche, tu te méfies des prophéties,
        présages, esprits, superstitions et explications mystiques tant que tu
        n’as pas de preuve suffisante.</td><td>Avertissement ignoré, rituel
        sous-estimé, allié spirituel froissé, danger mal interprété.</td></tr>

        <tr><td><strong>Susceptible</strong></td><td>Les attaques personnelles
        t’atteignent facilement. Lorsque tu dois résister à une provocation ou
        une humiliation ciblée, le MJ peut imposer un dé malus à un test de VOL
        approprié.</td><td>Provocation acceptée, négociation rompue, duel,
        réponse disproportionnée.</td></tr>

        <tr><td><strong>Suspicieux</strong></td><td>Tu accordes difficilement ta
        confiance. Tu réclames des garanties, vérifies les accords et soupçonnes
        volontiers des arrière-pensées.</td><td>Aide sincère refusée, alliance
        retardée, compagnon vexé, temps perdu à vérifier l’évidence.</td></tr>

        <tr><td><strong>Têtu</strong></td><td>Tu reconnais difficilement avoir
        tort et persistes parfois dans une décision alors que des éléments
        sérieux la remettent en cause.</td><td>Plan maintenu trop longtemps,
        excuse improbable, conflit avec un allié.</td></tr>

        </tbody></table>
