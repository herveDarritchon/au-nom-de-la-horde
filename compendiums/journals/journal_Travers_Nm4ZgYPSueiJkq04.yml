  - sort: 500000
    name: Travers — Limitations
    type: text
    _id: a457fe3a30182c51
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Limitation</h1>

        <p>Les Travers de cette famille sont adaptés des Handicaps de <em>Savage
        Worlds</em> au moteur de <strong>Chroniques Oubliées Fantasy 2</strong>
        utilisé par Warbound.</p>

        <table><thead><tr><th>Travers</th><th>Règle
        Warbound</th><th>Complications typiques</th></tr></thead><tbody>

        <tr><td><strong>Âgé</strong></td><td>Ton âge rend certains efforts plus
        difficiles. Lorsque force, agilité ou endurance sont réellement mises à
        l’épreuve par un effort physique intense, le MJ peut imposer un dé
        malus. Les attaques et les dommages ne sont pas pénalisés
        automatiquement.</td><td>Course prolongée, escalade, chaleur,
        récupération difficile, besoin d’une autre approche.</td></tr>

        <tr><td><strong>Anémique</strong></td><td>Tu résistes mal à la fatigue,
        aux maladies et aux environnements éprouvants. Le MJ peut imposer un dé
        malus aux tests de CON concernés.</td><td>Marche forcée, poison ou
        maladie plus difficiles à supporter, chaleur de Durotar,
        privation.</td></tr>

        <tr><td><strong>Aveugle</strong></td><td>Tu ne peux pas accomplir
        normalement une tâche qui dépend exclusivement de la vue. Pour les
        actions où d’autres sens, une habitude ou une aide peuvent compenser, le
        MJ décide si l’action reste possible et peut imposer un dé malus. Les
        capacités spéciales de perception s’appliquent
        normalement.</td><td>Lecture impossible, cible silencieuse difficile à
        localiser, terrain inconnu, besoin d’un guide.</td></tr>

        <tr><td><strong>Borgne</strong></td><td>Ta perception de la profondeur
        est réduite. Le MJ peut imposer un dé malus aux tests visuels où
        distance, relief ou précision spatiale sont déterminants.</td><td>Tir
        difficile, saut délicat, estimation de distance, objet lancé.</td></tr>

        <tr><td><strong>Défaut d’élocution</strong></td><td>Ta parole est
        difficile à suivre : bégaiement, débit, digressions ou autre
        particularité définie à la création. Lorsque la clarté orale est
        déterminante, le MJ peut imposer un dé malus au test
        social.</td><td>Ordre mal compris, discours moins convaincant,
        intimidation ou négociation compliquée.</td></tr>

        <tr><td><strong>Deux mains gauches</strong></td><td>Tu es mauvais avec
        les mécanismes, machines et dispositifs techniques. Le MJ peut imposer
        un dé malus aux tests concernés, notamment avec l’ingénierie gobeline ou
        gnome.</td><td>Mécanisme bloqué, réparation ratée, dispositif activé au
        mauvais moment.</td></tr>

        <tr><td><strong>Dur d’oreille</strong></td><td>Tu entends mal. Le MJ
        impose un dé malus aux tests de PER reposant sur l’audition. Si le
        personnage est totalement sourd, une information exclusivement sonore ne
        peut pas être perçue sans moyen de compensation.</td><td>Alerte manquée,
        conversation mal comprise, ennemi approchant hors du champ de
        vision.</td></tr>

        <tr><td><strong>Frêle</strong></td><td>Tu es particulièrement léger,
        maigre ou peu robuste pour ton peuple. Le MJ peut imposer un dé malus
        lorsque masse, puissance physique ou endurance corporelle sont
        directement déterminantes.</td><td>Portage, lutte, marche exténuante,
        choc physique.</td></tr>

        <tr><td><strong>Gamin</strong></td><td>Ton personnage est beaucoup plus
        jeune que la norme des aventuriers. Ce Travers décrit surtout un statut
        : taille, autorité, accès et manière dont les adultes te considèrent.
        Aucun retrait automatique de caractéristiques n’est
        appliqué.</td><td>Accès interdit, autorité contestée, équipement mal
        adapté, sous-estimation.</td></tr>

        <tr><td><strong>Ignorant</strong></td><td>Tu connais mal le monde qui
        t’entoure ou tu prêtes peu d’attention à la culture générale. Le MJ peut
        imposer un dé malus aux tests d’INT ou de PER fondés sur des
        connaissances générales évidentes pour un aventurier
        ordinaire.</td><td>Coutume inconnue, symbole mal interprété, détail
        évident manqué.</td></tr>

        <tr><td><strong>Illettré</strong></td><td>Tu ne sais ni lire ni écrire
        dans les langues que tu parles, sauf éventuelle exception définie à la
        création. Les symboles extrêmement courants peuvent être reconnus sans
        être réellement lus.</td><td>Ordre écrit inaccessible, carte annotée
        inutilisable, contrat incompris.</td></tr>

        <tr><td><strong>Lent</strong></td><td>Une blessure, une infirmité ou ta
        constitution limite ta mobilité. Définis avec le MJ la réduction de
        déplacement adaptée au concept. Évite de cumuler plusieurs pénalités
        différentes pour représenter la même limitation.</td><td>Poursuite,
        retraite, obstacle vertical, groupe obligé de modifier son
        rythme.</td></tr>

        <tr><td><strong>Lourdaud</strong></td><td>Tu manques de coordination. Le
        MJ peut imposer un dé malus aux tests d’AGI liés à la discrétion,
        l’équilibre ou une manœuvre physique demandant de la
        finesse.</td><td>Bruit, chute, infiltration compromise, objet
        renversé.</td></tr>

        <tr><td><strong>Malchanceux</strong></td><td>La malchance semble te
        suivre. Warbound ne réduit pas ton maximum de PC. Une fois par séance au
        maximum, le MJ peut faire d’un détail aléatoire plausible une
        complication personnelle ; si elle est significative, elle peut
        déclencher la récupération de 1 PC comme tout autre
        Travers.</td><td>Sangle qui casse, mauvais interlocuteur présent, pluie
        au pire moment, objet nécessaire égaré.</td></tr>

        <tr><td><strong>Manchot</strong></td><td>Tu n’as l’usage que d’un bras.
        Les actions exigeant réellement deux mains sont impossibles ou demandent
        un moyen de compensation ; les autres ne reçoivent pas de malus
        automatique.</td><td>Arme à deux mains inutilisable, escalade ou
        manipulation complexe, nécessité d’adapter l’équipement.</td></tr>

        <tr><td><strong>Mauvais nageur</strong></td><td>Tu maîtrises mal la
        nage. Le MJ peut imposer un dé malus aux tests concernés et augmenter la
        difficulté fictionnelle dans le courant, en armure ou lors d’un
        sauvetage.</td><td>Traversée ralentie, panique, équipement perdu, besoin
        d’aide.</td></tr>

        <tr><td><strong>Moche / apparence repoussante</strong></td><td>Ton
        apparence provoque parfois malaise, crainte ou rejet. Il n’existe pas de
        malus universel de CHA : un dé malus ne s’applique que lorsque
        l’apparence est réellement déterminante pour obtenir sympathie ou
        confiance.</td><td>Première impression défavorable, témoin effrayé,
        accueil froid.</td></tr>

        <tr><td><strong>Muet</strong></td><td>Tu ne peux pas parler. Tu peux
        communiquer par gestes, écriture, langue des signes ou magie si le
        contexte le permet. Une action exigeant spécifiquement la parole reste
        impossible.</td><td>Alerte difficile à donner, ordre urgent impossible à
        crier, interlocuteur qui ne comprend pas les signes.</td></tr>

        <tr><td><strong>Myope</strong></td><td>Ta vision lointaine est mauvaise.
        Sans correction adaptée, le MJ peut imposer un dé malus aux tests de PER
        visuelle ou aux actions où identifier précisément quelque chose à
        distance est essentiel.</td><td>Cible mal identifiée, détail lointain
        manqué, lunettes perdues ou endommagées si le concept en
        utilise.</td></tr>

        <tr><td><strong>Obèse</strong></td><td>Ta forte corpulence peut être une
        contrainte dans certaines situations physiques, mais elle ne donne ni
        bonus ni malus universel. Le MJ ne l’invoque que lorsque l’espace,
        l’endurance, l’équipement ou le déplacement rendent réellement la
        corpulence pertinente.</td><td>Passage étroit, équipement inadapté,
        course prolongée, monture trop légère.</td></tr>

        <tr><td><strong>Timoré</strong></td><td>Tu dégages peu d’autorité ou de
        menace. Lorsque tu cherches spécifiquement à effrayer quelqu’un par ta
        présence, le MJ peut imposer un dé malus au test d’intimidation
        approprié.</td><td>Menace non prise au sérieux, adversaire qui appelle
        ton bluff.</td></tr>

        </tbody></table>
