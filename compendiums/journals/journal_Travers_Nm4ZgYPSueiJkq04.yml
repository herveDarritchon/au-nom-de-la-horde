  - sort: 600000
    name: Travers — Idéaux contraignants
    type: text
    _id: d2ac6b7da6029be2
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Idéal contraignant</h1>

        <p>Les Travers de cette famille sont adaptés des Handicaps de <em>Savage
        Worlds</em> au moteur de <strong>Chroniques Oubliées Fantasy 2</strong>
        utilisé par Warbound.</p>

        <table><thead><tr><th>Travers</th><th>Règle
        Warbound</th><th>Complications typiques</th></tr></thead><tbody>

        <tr><td><strong>Code d’honneur</strong></td><td>Ta parole, le traitement
        des prisonniers et les règles de conduite de ton peuple comptent
        davantage que la solution la plus facile. Définis les principes
        essentiels de ton code.</td><td>Ennemi épargné, duel accepté, avantage
        déloyal refusé, promesse tenue à un coût réel.</td></tr>

        <tr><td><strong>Héroïque</strong></td><td>Tu ne peux pas facilement
        détourner le regard lorsqu’une personne sans défense est en danger, même
        si intervenir est peu rentable ou dangereux.</td><td>Sauvetage risqué,
        mission retardée, ressources dépensées pour des inconnus.</td></tr>

        <tr><td><strong>Loyal</strong></td><td>Tu refuses d’abandonner
        facilement tes compagnons et ceux que tu considères comme les
        tiens.</td><td>Retraite refusée, danger pris pour couvrir un allié, plan
        modifié pour sauver un compagnon.</td></tr>

        <tr><td><strong>Pacifiste</strong></td><td>Tu cherches sincèrement à
        éviter la violence. Définis à la création jusqu’où va ce refus : éviter
        les combats inutiles, refuser l’exécution de prisonniers, ou ne jamais
        blesser volontairement un être conscient sauf pour défendre
        autrui.</td><td>Ennemi épargné, solution plus complexe, conflit avec un
        allié plus brutal.</td></tr>

        <tr><td><strong>Rien à perdre</strong></td><td>Un objectif précis compte
        davantage que ta propre sécurité. Tu n’es pas suicidaire, mais
        lorsqu’une véritable occasion d’atteindre ce but apparaît, tu acceptes
        des risques qu’un autre refuserait.</td><td>Sacrifice personnel,
        poursuite malgré le danger, refus d’abandonner l’objectif.</td></tr>

        </tbody></table>
