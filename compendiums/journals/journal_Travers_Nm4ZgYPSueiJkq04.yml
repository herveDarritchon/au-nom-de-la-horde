  - sort: 400000
    name: Travers — Fardeaux
    type: text
    _id: 7d7f3a6e4a703f8a
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h1>Fardeau</h1>

        <p>Les Travers de cette famille sont adaptés des Handicaps de <em>Savage
        Worlds</em> au moteur de <strong>Chroniques Oubliées Fantasy 2</strong>
        utilisé par Warbound.</p>

        <table><thead><tr><th>Travers</th><th>Règle
        Warbound</th><th>Complications typiques</th></tr></thead><tbody>

        <tr><td><strong>Déshonoré</strong></td><td>Une faute passée te hante :
        serment brisé, fuite, défaite, responsabilité dans un drame ou
        comportement dont tu as honte. Décide avec le MJ si elle est secrète ou
        connue.</td><td>Témoin du passé, accusation, décision dangereuse prise
        pour ne pas répéter la faute.</td></tr>

        <tr><td><strong>Ennemi</strong></td><td>Une personne, un clan ou une
        organisation te veut du mal. Définissez avec le MJ sa puissance, ses
        raisons et la fréquence raisonnable de ses
        interventions.</td><td>Embuscade, chantage, rumeur, allié menacé, piste
        sabotée.</td></tr>

        <tr><td><strong>Étranger</strong></td><td>Tu n’appartiens pas pleinement
        à la société dans laquelle se déroule la campagne. Il n’existe pas de
        malus universel : prix, accès, méfiance, statut et réactions dépendent
        de la situation et des cultures concernées.</td><td>Accès refusé,
        soupçon, négociation plus difficile, coutume inconnue, autorité non
        reconnue.</td></tr>

        <tr><td><strong>Obligations</strong></td><td>Famille, clan, maître,
        métier, garnison, dette ou responsabilité réclament régulièrement ton
        temps et ton attention.</td><td>Convocation, service à rendre, proche en
        danger, conflit entre mission et devoir.</td></tr>

        <tr><td><strong>Recherché</strong></td><td>Une autorité, une faction ou
        un clan cherche à t’arrêter, te capturer ou te tuer. Définissez
        clairement la raison, le territoire concerné et le niveau de
        mobilisation.</td><td>Contrôle, avis de recherche, dénonciation,
        chasseurs de primes, impossibilité d’utiliser un itinéraire.</td></tr>

        <tr><td><strong>Secret</strong></td><td>Tu protèges une vérité dont la
        révélation aurait des conséquences. Lorsqu’il devient public, ce Travers
        devrait évoluer plutôt que continuer à fonctionner comme
        avant.</td><td>Mensonge nécessaire, preuve découverte, témoin gênant,
        chantage. Une révélation peut transformer le Travers en Ennemi,
        Déshonoré ou Recherché.</td></tr>

        <tr><td><strong>Serment</strong></td><td>Tu as donné ta parole à une
        personne, un clan, un ordre, un esprit ou une cause. Le serment doit
        imposer de vraies obligations et être formulé assez précisément pour
        produire des choix.</td><td>Ordre coûteux, devoir opposé à l’intérêt
        immédiat du groupe, choix entre deux loyautés.</td></tr>

        </tbody></table>
