      content: >-
        <h1>Travers — Règles Warbound</h1>

        <blockquote>

        <p><strong>Principe :</strong> un Travers n’est pas un moyen d’optimiser
        un personnage. C’est une contrainte volontaire qui donne du relief au
        héros et crée parfois des décisions moins efficaces, plus risquées ou
        plus intéressantes.</p>

        </blockquote>


        <h2>1. Origine de la règle</h2>

        <p>Warbound reprend l’idée des <strong>Handicaps</strong> de <em>Savage
        Worlds</em>, mais l’intègre au fonctionnement de <strong>COF2</strong>.
        Certains Travers sont surtout interprétatifs ; d’autres décrivent une
        limitation concrète. Dans tous les cas, ils doivent produire du jeu et
        non une comptabilité de malus.</p>


        <h2>2. À la création</h2>

        <ul>

        <li>Chaque PJ choisit normalement <strong>1 Travers</strong>.</li>

        <li>Le Travers doit être accepté par le joueur et le MJ et correspondre
        au concept du personnage.</li>

        <li>Les catégories <strong>Mineur / Majeur</strong> de Savage Worlds ne
        sont pas conservées.</li>

        <li>Un Travers ne donne <strong>aucun point de création</strong>, aucun
        rang de Voie et aucun autre avantage automatique.</li>

        <li>Un Travers particulièrement lourd doit être discuté avant la partie
        afin de vérifier qu’il reste jouable dans la campagne.</li>

        </ul>


        <h2>3. Les quatre familles</h2>

        <table>

        <thead><tr><th>Famille</th><th>Fonction</th></tr></thead>

        <tbody>

        <tr><td><strong>Caractère</strong></td><td>Une manière récurrente de
        décider, réagir ou se comporter qui peut conduire le PJ à faire un choix
        peu prudent ou peu efficace.</td></tr>

        <tr><td><strong>Fardeau</strong></td><td>Une personne, une dette, une
        réputation, une obligation ou un élément du passé qui revient compliquer
        la vie du PJ.</td></tr>

        <tr><td><strong>Limitation</strong></td><td>Une difficulté physique,
        sensorielle, sociale ou pratique ayant parfois un effet mécanique
        concret.</td></tr>

        <tr><td><strong>Idéal contraignant</strong></td><td>Une valeur positive
        poussée assez loin pour obliger le PJ à accepter un coût, un risque ou
        une contrainte.</td></tr>

        </tbody>

        </table>


        <h2>4. Mettre un Travers en jeu</h2>

        <p>Un Travers compte lorsqu’il <strong>change réellement la
        situation</strong>. Il peut être proposé par le joueur ou amené
        naturellement par le MJ.</p>

        <p>Pour être significatif, il doit provoquer au moins un des éléments
        suivants :</p>

        <ul>

        <li>un risque supplémentaire ;</li>

        <li>un coût en temps, ressources ou position ;</li>

        <li>une complication relationnelle ;</li>

        <li>un choix difficile ;</li>

        <li>une occasion perdue ;</li>

        <li>une conséquence durable ou une nouvelle menace.</li>

        </ul>


        <h2>5. Récompense : récupérer 1 point de chance</h2>

        <p>Lorsqu’un joueur interprète son Travers d’une manière qui sert la
        scène et que celui-ci lui crée une <strong>complication
        significative</strong>, le MJ peut lui faire récupérer immédiatement
        <strong>1 point de chance (PC)</strong>, sans dépasser son maximum.</p>

        <p><strong>Important :</strong> appliquer simplement un malus prévu par
        le Travers ne suffit pas à récupérer un PC.</p>

        <p>Un même Travers ne devrait normalement permettre de récupérer
        qu’<strong>1 PC par scène</strong>. Le MJ reste seul juge de la
        récompense ; elle n’est jamais automatique.</p>


        <h2>6. Traduction mécanique vers COF2</h2>

        <table>

        <thead><tr><th>Dans Savage Worlds</th><th>Dans Warbound /
        COF2</th></tr></thead>

        <tbody>

        <tr><td>Petits malus permanents (-1, -2, etc.)</td><td>Préférer un
        <strong>dé malus</strong> seulement lorsque la limitation est réellement
        pertinente.</td></tr>

        <tr><td>Échec automatique</td><td>Réservé aux actions réellement
        impossibles dans la fiction : lire lorsqu’on est aveugle, crier
        lorsqu’on est muet, etc.</td></tr>

        <tr><td>Malus de caractéristique permanent</td><td>À éviter. Le Travers
        intervient selon la situation, pas sur chaque jet du
        personnage.</td></tr>

        <tr><td>Jetons Savage Worlds</td><td>Remplacés par la récupération
        éventuelle de <strong>1 PC</strong> conformément à la logique
        d’interprétation de COF2.</td></tr>

        <tr><td>Mineur / Majeur</td><td>Supprimé. Une version particulièrement
        sévère se définit avec le MJ et n’accorde aucun avantage
        supplémentaire.</td></tr>

        </tbody>

        </table>


        <h2>7. Ce qu’un Travers ne doit jamais faire</h2>

        <ul>

        <li>forcer le joueur à saboter volontairement la campagne ;</li>

        <li>retirer systématiquement le libre arbitre du personnage ;</li>

        <li>justifier un comportement qui gâche le plaisir des autres joueurs
        ;</li>

        <li>devenir une machine à récupérer des PC ;</li>

        <li>imposer un malus alors que la fiction ne rend pas la limitation
        pertinente.</li>

        </ul>


        <h2>8. Faire évoluer un Travers</h2>

        <p>Un Travers peut changer avec le personnage. S’il est résolu, dépassé
        ou rendu caduc par la fiction, le joueur et le MJ peuvent le remplacer
        par un autre Travers cohérent.</p>

        <p>Certains Travers se transforment naturellement : un
        <strong>Secret</strong> révélé peut devenir <strong>Recherché</strong>,
        <strong>Ennemi</strong> ou <strong>Déshonoré</strong> ; un
        <strong>Serment</strong> accompli peut disparaître ; une
        <strong>Obsession</strong> peut devenir une nouvelle motivation.</p>


        <blockquote>

        <p><strong>Test simple :</strong> si le Travers n’a jamais aucune chance
        de compliquer les aventures du personnage, ce n’est probablement pas un
        bon Travers. S’il complique chaque jet et chaque scène, il est
        probablement trop lourd.</p>

        </blockquote>
