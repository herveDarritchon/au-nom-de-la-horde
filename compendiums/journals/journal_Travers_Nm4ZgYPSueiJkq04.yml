      content: >-
        <h1>Choisir et utiliser un Travers</h1>


        <h2>Choix rapide</h2>

        <p>Choisis d’abord la question qui décrit le mieux ce que tu veux
        apporter à ton personnage :</p>

        <table>

        <thead><tr><th>Je veux que mon personnage…</th><th>Famille
        conseillée</th></tr></thead>

        <tbody>

        <tr><td>prenne parfois de mauvaises décisions à cause de sa
        personnalité.</td><td><strong>Caractère</strong></td></tr>

        <tr><td>traîne derrière lui des problèmes qui peuvent revenir dans la
        campagne.</td><td><strong>Fardeau</strong></td></tr>

        <tr><td>doive composer avec une difficulté
        concrète.</td><td><strong>Limitation</strong></td></tr>

        <tr><td>soit parfois victime de ses propres
        principes.</td><td><strong>Idéal contraignant</strong></td></tr>

        </tbody>

        </table>


        <h2>Questions à se poser</h2>

        <ol>

        <li><strong>Quand ce Travers devrait-il apparaître ?</strong></li>

        <li><strong>Quel type de problème peut-il créer ?</strong></li>

        <li><strong>Qu’est-ce que le PJ refuse, désire ou craint à cause de lui
        ?</strong></li>

        <li><strong>Comment peut-il produire une bonne scène sans bloquer le
        groupe ?</strong></li>

        </ol>


        <h2>Exemples Warbound</h2>

        <table>

        <thead><tr><th>Travers</th><th>Situation</th><th>Bonne mise en
        jeu</th></tr></thead>

        <tbody>

        <tr><td><strong>Curieux</strong></td><td>Une galerie de Ragefeu est
        condamnée et couverte de runes.</td><td>Le PJ insiste pour comprendre ce
        qu’il y a derrière et accepte de perdre du temps alors que la situation
        est urgente.</td></tr>

        <tr><td><strong>Loyal</strong></td><td>Un éclaireur de la Horde reste
        derrière pendant la retraite.</td><td>Le PJ revient le chercher malgré
        le risque et oblige le groupe à revoir son plan.</td></tr>

        <tr><td><strong>Cupide</strong></td><td>Une caisse de minerai rare se
        trouve dans une zone dangereuse.</td><td>Le PJ propose un détour risqué
        pour la récupérer.</td></tr>

        <tr><td><strong>Étranger</strong></td><td>Un personnage sin’dorei
        cherche l’aide d’un clan orc méfiant.</td><td>La scène devient une
        négociation culturelle au lieu d’un simple jet assorti d’un malus
        permanent.</td></tr>

        <tr><td><strong>Secret</strong></td><td>Un témoin reconnaît le PJ devant
        ses compagnons.</td><td>Le PJ doit choisir entre mentir, avouer ou faire
        taire la rumeur et accepte les conséquences.</td></tr>

        </tbody>

        </table>


        <h2>Quand ne pas donner de PC</h2>

        <ul>

        <li>Le joueur rappelle simplement qu’il possède le Travers.</li>

        <li>Un dé malus s’applique sans modifier la situation.</li>

        <li>Le comportement n’a aucune conséquence réelle.</li>

        <li>Le joueur crée artificiellement le même problème à répétition pour
        récupérer des PC.</li>

        <li>L’interprétation gêne la table davantage qu’elle ne sert la
        partie.</li>

        </ul>
