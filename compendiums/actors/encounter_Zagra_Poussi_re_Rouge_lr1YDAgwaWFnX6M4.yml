  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <p><strong>Conducteur de la carriole de ravitaillement</strong>. Orc
        plus léger et plus expressif que les autres, toujours chargé de sangles,
        de poches et de petits outils. Il sourit facilement, parle beaucoup et
        semble connaître chaque piste par un souvenir, une dette ou une
        histoire. Son équipement raconte quelqu’un qui a longtemps vécu sur les
        routes.</p>
                            <p><strong>Profil de rencontre Warbound :</strong> Travailleur robuste — variante conducteur — adaptation simple pour le convoi.</p>
                            <p><strong>Armes :</strong></p><ul><li><strong>Couteau.</strong> Attaque [[1d20+2]] ; DM [[1d4+1]].</li></ul>
      private: >-
        <p><strong>Traits :</strong> Bavard • Débrouillard • Sociable • Un peu
        filou</p>
                             <p><strong>Veut :</strong> Prouver qu’il peut enfin être considéré comme quelqu’un de fiable et conserver un emploi stable dans la jeune Horde.</p>
                             <p><strong>Craint :</strong> Voir son ancien réseau de dettes et de petits trafics ruiner la confiance qu’on commence à lui accorder.</p>
                             <p><strong>Spécialités :</strong></p><ul><li>Survie (pistes secondaires)</li><li>Baratin</li><li>Conduite d’attelage</li></ul>
                             <p><strong>Aptitudes :</strong></p><ul><li><strong>Habitué des pistes.</strong> Dé bonus aux tests d’INT (Survie) pour trouver un détour, estimer la praticabilité d’une piste ou identifier un ancien passage de caravane.</li></ul>
                             <p><strong>Liens :</strong> @UUID[JournalEntry.wkNQ1IQdxldIX7OA]{Journal — Zagra Poussière-Rouge} • @UUID[JournalEntry.TidBTLhr2XaYCqhL]{Index du convoi}</p>
    notes:
      public: ''
      private: >-
        <p><strong>Ce qu’il croit :</strong> Il existe presque toujours un autre
        chemin ; la vraie question est ce qu’il coûtera.</p>
                             <p><strong>Ce qu’il cache :</strong> Son passé de transporteur « gris », certaines dettes et des connaissances qu’il n’a aucune envie de présenter à Gorvak.</p>
                             
                             <blockquote>« Un chemin officiel ? Non. Un chemin ? Oui. »</blockquote>
                             <p>@UUID[JournalEntry.wkNQ1IQdxldIX7OA]{Journal — Zagra Poussière-Rouge}</p>
