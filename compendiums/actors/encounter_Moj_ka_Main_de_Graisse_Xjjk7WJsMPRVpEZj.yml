  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <h2>Moj’ka Main-de-Graisse</h2><p><strong>Race :</strong> Troll
        sombrelance</p><p><strong>Fonction :</strong> Mécanicien de
        Mâche-Roc</p><p>Entretient, répare et connaît mieux que personne la
        foreuse Mâche-Roc.</p>
      private: >-
        <p>A préparé les quatre composants ; n’a pas vu leur mise en caisse
        finale. Peut identifier des incohérences techniques dans un inventaire
        ou une cargaison.</p><p>Moj’ka n’a pas participé à la substitution. Le
        fait qu’il n’ait pas assisté au chargement final est un indice à obtenir
        en l’interrogeant, pas une révélation automatique.</p>
    notes:
      public: ''
      private: >-
        <h3>Dossier</h3><p>@UUID[JournalEntry.TpJVg7OJKENxlIju]{Histoire et
        relations de Moj’ka
        Main-de-Graisse}</p><p>@UUID[JournalEntry.WH5fpMRmRdITacHZ]{Mine de
        Roche-Sèche}</p><h3>Relations</h3><ul><li>@UUID[Actor.WZmhEhaByZJuADqs]{Ragrah
        Brise-Pic} — Répond à la contremaîtresse pour le matériel. (dossier
        @UUID[JournalEntry.f0bge3VQIuvXJozj]{MJ})</li><li>@UUID[Actor.KLbUH2aOlSyHUnae]{Krosh
        Pèse-Charge} — A accepté sa version du changement d’horaire, tout en en
        étant irrité. (dossier
        @UUID[JournalEntry.LTqyGnqj7sthbpmB]{MJ})</li><li>@UUID[Actor.xvIfsWKFd3XlxRDW]{Brazzik
        Main-Froide} — La foreuse est issue du travail d’ingénierie gobelin de
        Brazzik ; leurs compétences sont complémentaires. (dossier
        @UUID[JournalEntry.awzLezii4coZp6id]{MJ})</li><li>@UUID[Actor.NCPLhfMo4N80d8FV]{Borka}
        — Partage son attachement à la machine. (dossier
        @UUID[JournalEntry.NqoXip5E2kh0vxju]{MJ})</li></ul>
    languages: []
    properties: >-
      <section data-roche-seche-stats="2.0.0"><h2>Profil de rencontre — Moj’ka
      Main-de-Graisse (Warbound)</h2><p><em>Adaptation MJ, NC 2 ; profil non
      officiel Warcraft. Les attaques sont données pour utilisation manuelle
      (pas de bouton de jet intégré).</em></p><p><strong>NC 2</strong> —
      <strong>DEF 17</strong> — <strong>PV 28</strong> — <strong>RD 0</strong> —
      <strong>INIT 12</strong> — <strong>Déplacement 10 m</strong> —
      <strong>Critique 20</strong></p><p><strong>Caractéristiques :</strong> AGI
      +3* · CON +1 · FOR +1 · PER +2 · CHA +0 · INT +3* · VOL +1 (*
      caractéristique supérieure)</p><p><strong>Attaques :</strong> contact +6,
      distance +5, magique 0.</p><ul><li><strong>Clé de mécanicien</strong>
      (Contact) : +6 ; DM 2d6+2</li><li><strong>Outil lancé</strong> (Distance
      (10 m)) : +5 ; DM 1d6+2</li></ul><p><strong>Comportement en cas
      d'affrontement :</strong> Cherche à gêner ou se désengager plutôt qu'à
      tenir un duel. Son expertise mécanique est narrative et ne constitue pas
      un sort.</p><p><strong>Attention :</strong> le NC reflète une opposition
      possible, pas une obligation de combat. Il n'ajoute ni entraînement
      militaire ni pouvoirs surnaturels au PNJ.</p></section>
