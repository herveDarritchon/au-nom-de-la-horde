  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <h2>Ragrah Brise-Pic</h2><p><strong>Race :</strong>
        Orque</p><p><strong>Fonction :</strong> Contremaîtresse
        générale</p><p>Dirige Roche-Sèche, connaît les équipes et refuse de
        sacrifier ses mineurs à la production.</p>
      private: >-
        <p>Connaît le fonctionnement de la mine, les équipes et les horaires. Ne
        sait pas au départ que Krosh a substitué les caisses.</p><p>Elle est
        contrariée par la réquisition, mais n’a pas organisé le détournement.
        Son ressentiment envers Orgrimmar ne constitue pas une preuve de
        complicité.</p>
    notes:
      public: ''
      private: >-
        <h3>Dossier</h3><p>@UUID[JournalEntry.f0bge3VQIuvXJozj]{Histoire et
        relations de Ragrah
        Brise-Pic}</p><p>@UUID[JournalEntry.WH5fpMRmRdITacHZ]{Mine de
        Roche-Sèche}</p><h3>Relations</h3><ul><li>@UUID[Actor.Xjjk7WJsMPRVpEZj]{Moj’ka
        Main-de-Graisse} — S’appuie sur lui pour les problèmes mécaniques.
        (dossier
        @UUID[JournalEntry.TpJVg7OJKENxlIju]{MJ})</li><li>@UUID[Actor.KLbUH2aOlSyHUnae]{Krosh
        Pèse-Charge} — Lui confie les registres de chargement, sans connaître sa
        fraude. (dossier
        @UUID[JournalEntry.LTqyGnqj7sthbpmB]{MJ})</li><li>@UUID[Actor.XO981jkCXaPf7jDz]{Rukha}
        — Coordonne avec elle le départ du convoi. (dossier
        @UUID[JournalEntry.92Jaaithkve53hqJ]{MJ})</li><li>@UUID[Actor.NCPLhfMo4N80d8FV]{Borka}
        — Respecte son expérience des galeries. (dossier
        @UUID[JournalEntry.NqoXip5E2kh0vxju]{MJ})</li></ul>
    languages: []
    properties: >-
      <section data-roche-seche-stats="2.0.0"><h2>Profil de rencontre — Ragrah
      Brise-Pic (Warbound)</h2><p><em>Adaptation MJ, NC 3 ; profil non officiel
      Warcraft. Les attaques sont données pour utilisation manuelle (pas de
      bouton de jet intégré).</em></p><p><strong>NC 3</strong> — <strong>DEF
      18</strong> — <strong>PV 48</strong> — <strong>RD 1</strong> —
      <strong>INIT 14</strong> — <strong>Déplacement 10 m</strong> —
      <strong>Critique 20</strong></p><p><strong>Caractéristiques :</strong> AGI
      +0 · CON +3* · FOR +3* · PER +1 · CHA +2 · INT +1 · VOL +2 (*
      caractéristique supérieure)</p><p><strong>Attaques :</strong> contact +8,
      distance +4, magique 0.</p><ul><li><strong>Marteau de chantier</strong>
      (Contact) : +8 ; DM 2d6+5</li></ul><p><strong>Comportement en cas
      d'affrontement :</strong> Tient la position et protège les travailleurs ;
      peut appeler les mineurs à se mettre à couvert. Pas de pouvoir
      magique.</p><p><strong>Attention :</strong> le NC reflète une opposition
      possible, pas une obligation de combat. Il n'ajoute ni entraînement
      militaire ni pouvoirs surnaturels au PNJ.</p></section>
