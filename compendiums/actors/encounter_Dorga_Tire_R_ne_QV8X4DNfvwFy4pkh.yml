  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <p><strong>Conductrice de la carriole de la foreuse</strong>. Orque
        athlétique, tresses serrées, foulard rouge et cuir de voyage renforcé.
        Elle a les avant-bras marqués par les cordages, le harnais et le travail
        quotidien. Son calme contraste avec l’agitation d’un convoi : elle
        regarde d’abord le kodo, ensuite la route, enfin les autres.</p>
                            <p><strong>Profil de rencontre Warbound :</strong> Travailleur robuste — variante conducteur — adaptation simple pour le convoi.</p>
                            <p><strong>Armes :</strong></p><ul><li><strong>Gourdin.</strong> Attaque [[1d20+2]] ; DM [[1d4+1]].</li></ul>
      private: >-
        <p><strong>Traits :</strong> Calme • Attentive • Très bonne avec les
        bêtes • Têtue</p>
                             <p><strong>Veut :</strong> Ramener les deux kodos en état, et particulièrement Ruk, le kodo qui tire la foreuse.</p>
                             <p><strong>Craint :</strong> Voir une bête paniquer ou être blessée parce qu’un conducteur a voulu la forcer au mauvais moment.</p>
                             <p><strong>Spécialités :</strong></p><ul><li>Dressage</li><li>Vigilance</li><li>Conduite d’attelage</li></ul>
                             <p><strong>Aptitudes :</strong></p><ul><li><strong>Main sûre.</strong> Dé bonus aux tests de PER (Dressage) pour calmer un kodo, comprendre son comportement ou reprendre le contrôle d’un attelage.</li></ul>
                             <p><strong>Liens :</strong> @UUID[JournalEntry.GXG0bXJKFiDVCwFR]{Journal — Dorga Tire-Rêne} • @UUID[JournalEntry.TidBTLhr2XaYCqhL]{Index du convoi}</p>
    notes:
      public: ''
      private: >-
        <p><strong>Ce qu’il croit :</strong> Les bêtes perçoivent parfois un
        problème avant ceux qui les conduisent ; leur comportement est un
        indice, pas un caprice.</p>
                             <p><strong>Ce qu’il cache :</strong> Rien de criminel ou de dramatique. Elle est simplement plus attachée à Ruk qu’elle ne veut l’admettre devant ceux qui traitent les kodos comme du matériel.</p>
                             
                             <blockquote>« Doucement… doucement… voilà. Lui, au moins, il écoute. »</blockquote>
                             <p>@UUID[JournalEntry.GXG0bXJKFiDVCwFR]{Journal — Dorga Tire-Rêne}</p>
    languages:
      - Orc
    properties: >-
      <p>Orc • Conductrice de la carriole de la foreuse • Convoi de la
      foreuse</p>
