  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <h2>Borka</h2><p><strong>Race :</strong> Orc</p><p><strong>Fonction
        :</strong> Mineur vétéran</p><p>Ancien mineur de Roche-Sèche, témoin du
        sauvetage des six ouvriers par Mâche-Roc.</p>
      private: >-
        <p>Peut raconter l’éboulement et expliquer l’importance sociale de
        Mâche-Roc. Rien n’établit qu’il ait vu la substitution.</p><p>Aucune
        complicité connue. Borka est un témoin du quotidien de la mine, non un
        oracle sur le complot. Il ne faut pas lui prêter des indices qu’il n’a
        pas obtenus.</p>
    notes:
      public: ''
      private: >-
        <h3>Dossier</h3><p>@UUID[JournalEntry.NqoXip5E2kh0vxju]{Histoire et
        relations de Borka}</p><p>@UUID[JournalEntry.WH5fpMRmRdITacHZ]{Mine de
        Roche-Sèche}</p><h3>Relations</h3><ul><li>@UUID[Actor.WZmhEhaByZJuADqs]{Ragrah
        Brise-Pic} — Connaît ses exigences et les conditions de travail.
        (dossier
        @UUID[JournalEntry.f0bge3VQIuvXJozj]{MJ})</li><li>@UUID[Actor.Xjjk7WJsMPRVpEZj]{Moj’ka
        Main-de-Graisse} — Reconnaît le mécanicien comme celui qui comprend la
        foreuse. (dossier
        @UUID[JournalEntry.TpJVg7OJKENxlIju]{MJ})</li><li>@UUID[Actor.XO981jkCXaPf7jDz]{Rukha}
        — Lui confie son inquiétude au moment du départ. (dossier
        @UUID[JournalEntry.92Jaaithkve53hqJ]{MJ})</li></ul>
    languages: []
    properties: >-
      <section data-roche-seche-stats="2.0.0"><h2>Profil de rencontre — Borka
      (Warbound)</h2><p><em>Adaptation MJ, NC 3 ; profil non officiel Warcraft.
      Les attaques sont données pour utilisation manuelle (pas de bouton de jet
      intégré).</em></p><p><strong>NC 3</strong> — <strong>DEF 17</strong> —
      <strong>PV 52</strong> — <strong>RD 2</strong> — <strong>INIT 11</strong>
      — <strong>Déplacement 10 m</strong> — <strong>Critique
      20</strong></p><p><strong>Caractéristiques :</strong> AGI -1 · CON +4* ·
      FOR +3* · PER +1 · CHA +0 · INT +0 · VOL +2 (* caractéristique
      supérieure)</p><p><strong>Attaques :</strong> contact +8, distance +2,
      magique 0.</p><ul><li><strong>Pioche de mineur</strong> (Contact) : +8 ;
      DM 2d6+5</li></ul><p><strong>Comportement en cas d'affrontement :</strong>
      Encaisse et défend ses compagnons. Malgré l'âge, c'est un vétéran des
      galeries, pas un soldat de profession.</p><p><strong>Attention :</strong>
      le NC reflète une opposition possible, pas une obligation de combat. Il
      n'ajoute ni entraînement militaire ni pouvoirs surnaturels au
      PNJ.</p></section>
