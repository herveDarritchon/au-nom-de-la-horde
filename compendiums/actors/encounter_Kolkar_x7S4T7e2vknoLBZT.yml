  details:
    category: humanoid
    size: large
    notes:
      public: >-
        <p>CENTAURE</p><p>Le centaure est une créature pourvue d'un corps de
        cheval et d'un buste humanoïde.</p><p>Écologie</p><p>Les centaures
        vivent en petites communautés sur un assez vaste territoire de forêt ou
        de plaine. Ils sont très territoriaux. Ils habitent dans des huttes
        coniques de bois et de peau qu'ils organisent autour du tronc d'un grand
        arbre.</p><p>Sur les Terres d'Osgild, les centaures sont un peuple très
        ancien, sans doute contemporain des elfes et des nains du premier âge.
        Le peuple des hommes-cheval parcourait alors librement les grandes
        plaines. Chassés de leur habitat naturel par les humains, ils vivent
        désormais dans les forêts reculées, formant un peuple discret qui garde
        une haine farouche des envahisseurs. Un centaure voit dans le noir comme
        un elfe.</p><p>Il existe des centaures au buste d'orc, simplement
        appelés centorcs. Fruit des mutations de la transition vers le second
        âge, ils ont tendance à être maléfiques, ce qui explique qu'on les
        trouve plutôt dans les forêts ténébreuses comme la Forêt sombre. Leur
        profil technique est identique à celui du centaure.</p><p>Graine
        d'aventure</p><p>Les PJ passent dans un village dans lequel deux
        centaures sont rédu en esclavage et utilisés comme chevaux de bât. Le
        village est sous la coupe d'un ancien bandit récemment fait chevalier
        par le baron local. Les villageois ne sont guère plus sympathiques, bon
        nombre d'entre eux étant aussi d'anciens bandits.</p>
