  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <p><strong>Responsable du convoi</strong>. Orc solide et mûr, équipé
        pour la route plutôt que pour la parade. Son regard sévère vient
        davantage de l’habitude de compter les risques que d’un goût pour
        l’autorité. Il porte le matériel d’un chef de caravane : ceinture
        utilitaire, carte roulée, hache de travail et équipement de voyage
        usé.</p>
                            <p><strong>Profil de rencontre Warbound :</strong> Travailleur robuste — variante responsable de convoi — adaptation simple pour le convoi.</p>
                            <p><strong>Armes :</strong></p><ul><li><strong>Hache de travail.</strong> Attaque [[1d20+3]] ; DM [[1d6+2]].</li></ul>
      private: >-
        <p><strong>Traits :</strong> Prudent • Méthodique • Responsable • Peu
        démonstratif</p>
                             <p><strong>Veut :</strong> Faire arriver les deux carrioles et leur équipage à destination, sans transformer le trajet en démonstration de bravoure.</p>
                             <p><strong>Craint :</strong> Prendre une décision qui coûte inutilement la vie à quelqu’un.</p>
                             <p><strong>Spécialités :</strong></p><ul><li>Survie (routes et haltes)</li><li>Vigilance</li><li>Logistique et attelages</li></ul>
                             <p><strong>Aptitudes :</strong></p><ul><li><strong>Chef de convoi.</strong> Dé bonus aux tests d’INT ou de PER directement liés à l’état d’une route, d’un attelage ou d’un chargement.</li></ul>
                             <p><strong>Liens :</strong> @UUID[JournalEntry.pgcZmw8WXdF3b37m]{Journal — Gorvak Tient-la-Route} • @UUID[JournalEntry.TidBTLhr2XaYCqhL]{Index du convoi}</p>
    notes:
      public: ''
      private: >-
        <p><strong>Ce qu’il croit :</strong> Un responsable de convoi doit
        d’abord faire rentrer les gens, ensuite le matériel, et seulement après
        son honneur.</p>
                             <p><strong>Ce qu’il cache :</strong> La mort de l’ancien conducteur et la part de responsabilité qu’il s’attribue. Il ne raconte pas cet épisode spontanément.</p>
                             
                             <blockquote>« Un héros peut arriver en retard. Une carriole cassée n’arrive pas du tout. »</blockquote>
                             <p>@UUID[JournalEntry.pgcZmw8WXdF3b37m]{Journal — Gorvak Tient-la-Route}</p>
    languages:
      - Orc
    properties: Orc • Responsable du convoi • Convoi de la foreuse
