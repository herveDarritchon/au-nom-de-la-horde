  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <p><strong>Garde / manutentionnaire</strong>. Très grand Orc aux épaules
        massives, équipé d’une armure de travail renforcée. Les crochets, cordes
        et pièces de cuir comptent autant que sa hache. Son apparence est celle
        d’un garde, ses gestes sont ceux d’un ouvrier : avant de regarder
        l’ennemi, il regarde ce qui va tomber, casser ou écraser quelqu’un.</p>
                            <p><strong>Profil de rencontre Warbound :</strong> Garde — variante manutentionnaire — adaptation simple pour le convoi.</p>
                            <p><strong>Armes :</strong></p><ul><li><strong>Hache.</strong> Attaque [[1d20+4]] ; DM [[1d8+3]].</li></ul>
      private: >-
        <p><strong>Traits :</strong> Fort • Patient • Pragmatique •
        Protecteur</p>
                             <p><strong>Veut :</strong> Gagner assez de réputation et d’argent pour ne plus passer sa vie à porter les charges des autres et diriger un jour une petite équipe de manutentionnaires.</p>
                             <p><strong>Craint :</strong> Être considéré comme un simple « gros bras » incapable de comprendre ce qu’il transporte ou ce qui se passe autour de lui.</p>
                             <p><strong>Spécialités :</strong></p><ul><li>Athlétisme</li><li>Manutention</li><li>Mine et carrière</li></ul>
                             <p><strong>Aptitudes :</strong></p><ul><li><strong>Gros bras.</strong> Dé bonus aux tests de FOR pour soulever, retenir, pousser, redresser une charge ou effectuer une réparation physique d’urgence.</li></ul>
                             <p><strong>Liens :</strong> @UUID[JournalEntry.unXDn8E42FSnKBZd]{Journal — Grumek Gros-Bras} • @UUID[JournalEntry.TidBTLhr2XaYCqhL]{Index du convoi}</p>
    notes:
      public: ''
      private: >-
        <p><strong>Ce qu’il croit :</strong> Construire quelque chose qui tient
        vaut souvent davantage que gagner une bagarre.</p>
                             <p><strong>Ce qu’il cache :</strong> Il garde sur lui un petit éclat de roche sombre récupéré sur un ancien chantier. Il ne lui attribue aucune valeur magique ; c’est un souvenir de travail.</p>
                             <p><strong>SECRET MJ :</strong> voir la seconde page du journal de Grumek.</p>
                             <blockquote>« Tu veux courir après eux ? Très bien. Moi, je garde les caisses sur la route. »</blockquote>
                             <p>@UUID[JournalEntry.unXDn8E42FSnKBZd]{Journal — Grumek Gros-Bras}</p>
