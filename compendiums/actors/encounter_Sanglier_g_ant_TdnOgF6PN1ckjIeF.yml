  details:
    category: living
    size: large
    notes:
      public: >-
        <p>## SANGLIER GÉANT</p><p>Pourvu d'une crête osseuse et de défenses
        énormes, le sanglier géant est une créature véritablement
        impressionnante.</p><p>Certains clans d'orcs l'utilisent comme monture,
        mais il s'agit le plus souvent d'animaux un peu moins massifs (NC
        4</p><p>, 50 PV, 2d6+6 DM, capacité de charge uniquement). Un PJ
        semi-orc, voire un nain, pourrait choisir une telle monture s'il possède
        le rang 5 de la voie du cavalier. Seuls un roi ou une figure mythique
        ont la capacité de monter un vrai sanglier géant.</p><p>| ------ |
        -------- | ------ | ------ |</p>
