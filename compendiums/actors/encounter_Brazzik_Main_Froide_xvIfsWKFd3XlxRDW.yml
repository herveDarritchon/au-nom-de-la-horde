  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <h2>Brazzik Main-Froide</h2><p><strong>Race :</strong>
        Gobelin</p><p><strong>Fonction :</strong> Ingénieur du Cartel
        Baille-Fonds</p><p>Ingénieur et concepteur associé à Mâche-Roc, précis
        et méthodique.</p>
      private: >-
        <p>Connaît la conception de la machine et ses composants. Ses
        connaissances sur la substitution ne sont pas établies.</p><p>Le
        Dérivateur sismique constitue une information réservée au MJ, à ne pas
        révéler automatiquement dans la première séance. Ne pas décréter que
        Brazzik a facilité le vol ni qu’il se trouvait obligatoirement sur place
        pendant la mise en caisse.</p>
    notes:
      public: ''
      private: >-
        <h3>Dossier</h3><p>@UUID[JournalEntry.awzLezii4coZp6id]{Histoire et
        relations de Brazzik
        Main-Froide}</p><p>@UUID[JournalEntry.WH5fpMRmRdITacHZ]{Mine de
        Roche-Sèche}</p><h3>Relations</h3><ul><li>@UUID[Actor.Xjjk7WJsMPRVpEZj]{Moj’ka
        Main-de-Graisse} — Lui a laissé une machine que ce dernier entretient et
        adapte. (dossier
        @UUID[JournalEntry.TpJVg7OJKENxlIju]{MJ})</li><li>@UUID[Actor.KLbUH2aOlSyHUnae]{Krosh
        Pèse-Charge} — La documentation de chargement peut être comparée aux
        besoins techniques. (dossier
        @UUID[JournalEntry.LTqyGnqj7sthbpmB]{MJ})</li><li>@UUID[Actor.WZmhEhaByZJuADqs]{Ragrah
        Brise-Pic} — La mine dépend de l’efficacité de la machine qu’il a
        conçue. (dossier @UUID[JournalEntry.f0bge3VQIuvXJozj]{MJ})</li></ul>
    languages: []
    properties: >-
      <section data-roche-seche-stats="2.0.0"><h2>Profil de rencontre — Brazzik
      Main-Froide (Warbound)</h2><p><em>Adaptation MJ, NC 2 ; profil non
      officiel Warcraft. Les attaques sont données pour utilisation manuelle
      (pas de bouton de jet intégré).</em></p><p><strong>NC 2</strong> —
      <strong>DEF 17</strong> — <strong>PV 26</strong> — <strong>RD 0</strong> —
      <strong>INIT 12</strong> — <strong>Déplacement 8 m</strong> —
      <strong>Critique 20</strong></p><p><strong>Caractéristiques :</strong> AGI
      +3* · CON +0 · FOR -1 · PER +2 · CHA +2 · INT +4* · VOL +2 (*
      caractéristique supérieure)</p><p><strong>Attaques :</strong> contact +3,
      distance +6, magique 0.</p><ul><li><strong>Arbalète d'atelier à
      rivets</strong> (Distance (20 m)) : +6 ; DM 2d6+2</li><li><strong>Petit
      outil</strong> (Contact) : +3 ; DM 1d4</li></ul><p><strong>Comportement en
      cas d'affrontement :</strong> Évite le contact, utilise l'environnement et
      cherche à sauver ses prototypes. L'arbalète d'atelier est un ajout
      d'équipement propre à cette adaptation.</p><p><strong>Attention :</strong>
      le NC reflète une opposition possible, pas une obligation de combat. Il
      n'ajoute ni entraînement militaire ni pouvoirs surnaturels au
      PNJ.</p></section>
