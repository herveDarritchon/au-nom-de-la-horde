  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <h2>Rukha</h2><p><strong>Race :</strong> Orque</p><p><strong>Fonction
        :</strong> Cheffe des convoyeurs</p><p>Dirige les conducteurs, les
        attelages et l’organisation du transport de Mâche-Roc.</p>
      private: >-
        <p>Connaît les attelages, la route, les ouvriers et l’état matériel du
        convoi, mais pas les mouvements clandestins des caisses avant le
        départ.</p><p>Rukha n’est pas complice du vol. En cas de retard sérieux
        des PJ, elle préfère un départ à l’aube à une marche imprudente dans le
        noir. Elle peut demander une inspection contradictoire si les soupçons
        sont fondés.</p>
    notes:
      public: ''
      private: >-
        <h3>Dossier</h3><p>@UUID[JournalEntry.92Jaaithkve53hqJ]{Histoire et
        relations de Rukha}</p><p>@UUID[JournalEntry.WH5fpMRmRdITacHZ]{Mine de
        Roche-Sèche}</p><h3>Relations</h3><ul><li>@UUID[Actor.WZmhEhaByZJuADqs]{Ragrah
        Brise-Pic} — Reçoit la cargaison depuis le site de la mine. (dossier
        @UUID[JournalEntry.f0bge3VQIuvXJozj]{MJ})</li><li>@UUID[Actor.KLbUH2aOlSyHUnae]{Krosh
        Pèse-Charge} — A reçu de lui les bordereaux scellés ; n’a pas participé
        à leur falsification. (dossier
        @UUID[JournalEntry.LTqyGnqj7sthbpmB]{MJ})</li><li>@UUID[Actor.NCPLhfMo4N80d8FV]{Borka}
        — Connaît son attachement à la machine. (dossier
        @UUID[JournalEntry.NqoXip5E2kh0vxju]{MJ})</li></ul>
    languages: []
    properties: >-
      <section data-roche-seche-stats="2.0.0"><h2>Profil de rencontre — Rukha
      (Warbound)</h2><p><em>Adaptation MJ, NC 3 ; profil non officiel Warcraft.
      Les attaques sont données pour utilisation manuelle (pas de bouton de jet
      intégré).</em></p><p><strong>NC 3</strong> — <strong>DEF 18</strong> —
      <strong>PV 44</strong> — <strong>RD 1</strong> — <strong>INIT 16</strong>
      — <strong>Déplacement 10 m</strong> — <strong>Critique
      20</strong></p><p><strong>Caractéristiques :</strong> AGI +2* · CON +2 ·
      FOR +2 · PER +3* · CHA +1 · INT +1 · VOL +2 (* caractéristique
      supérieure)</p><p><strong>Attaques :</strong> contact +8, distance +7,
      magique 0.</p><ul><li><strong>Crochet de convoi</strong> (Contact) : +8 ;
      DM 2d6+4</li><li><strong>Javelot de route</strong> (Distance (20 m)) : +7
      ; DM 1d6+3</li></ul><p><strong>Comportement en cas d'affrontement
      :</strong> Protège d'abord les bêtes et les ouvriers ; utilise les
      chariots comme couvert et coordonne les
      déplacements.</p><p><strong>Attention :</strong> le NC reflète une
      opposition possible, pas une obligation de combat. Il n'ajoute ni
      entraînement militaire ni pouvoirs surnaturels au PNJ.</p></section>
