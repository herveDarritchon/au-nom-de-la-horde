  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <p><strong>Garde / éclaireur</strong>. Orc sec et athlétique, armure
        légère de route, lance, arc et carquois. Une de ses défenses inférieures
        est cassée : détail qui lui a valu son surnom. Il marche souvent
        légèrement à l’écart du convoi et regarde les crêtes plus que la piste
        elle-même.</p>
                            <p><strong>Profil de rencontre Warbound :</strong> Éclaireur — adaptation simple pour le convoi.</p>
                            <p><strong>Armes :</strong></p><ul><li><strong>Lance.</strong> Attaque [[1d20+2]] ; DM [[1d6+1]].</li><li><strong>Arc court.</strong> Attaque [[1d20+4]] ; DM [[1d6+2]] — portée 30 m.</li></ul>
      private: >-
        <p><strong>Traits :</strong> Vigilant • Professionnel • Méfiant •
        Réactif</p>
                             <p><strong>Veut :</strong> Ne jamais être surpris comme il l’a été autrefois, et garder le convoi hors des pièges qui se referment après une première attaque.</p>
                             <p><strong>Craint :</strong> Voir un groupe se lancer dans une poursuite impulsive et tomber dans une seconde embuscade.</p>
                             <p><strong>Spécialités :</strong></p><ul><li>Vigilance</li><li>Survie (pistage)</li><li>Discrétion</li></ul>
                             <p><strong>Aptitudes :</strong></p><ul><li><strong>Œil sur les crêtes.</strong> Dé bonus aux tests de PER (Vigilance) pour repérer une embuscade, un observateur dissimulé ou une position de tir.</li></ul>
                             <p><strong>Liens :</strong> @UUID[JournalEntry.Q3EoJE5eXAtNTsqu]{Journal — Jarkh Dent-Cassée} • @UUID[JournalEntry.TidBTLhr2XaYCqhL]{Index du convoi}</p>
    notes:
      public: ''
      private: >-
        <p><strong>Ce qu’il croit :</strong> La première attaque n’est pas
        toujours le vrai piège.</p>
                             <p><strong>Ce qu’il cache :</strong> Il parle peu des deux morts de sa patrouille. La dent cassée est visible ; ce qu’elle lui rappelle ne l’est pas.</p>
                             
                             <blockquote>« Là-haut. Quelque chose a bougé. »</blockquote>
                             <p>@UUID[JournalEntry.Q3EoJE5eXAtNTsqu]{Journal — Jarkh Dent-Cassée}</p>
