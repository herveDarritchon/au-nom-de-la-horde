  details:
    category: humanoid
    size: medium
    description:
      public: >-
        <h2>Krosh Pèse-Charge</h2><p><strong>Race :</strong>
        Orc</p><p><strong>Fonction :</strong> Responsable des cargaisons et
        bordereaux</p><p>Contrôle le pesage, les scellés, les stocks et le
        départ des cargaisons.</p>
      private: >-
        <p>Sait que les caisses de Mâche-Roc ont été remplacées par des caisses
        lestées de pierres et de métal. Connaît l’intermédiaire qui l’a payé,
        pas nécessairement la destination finale.</p><p>SECRET MJ — Un
        intermédiaire du Cercle de la Pierre Brisée l’a payé. Krosh n’est pas
        membre du Cercle et n’adhère pas à ses convictions. Il a fait déplacer
        les vraies caisses par le treuil vers une réserve proche de l’ancien
        chemin de service, substitué des caisses lestées et ajusté les
        registres. Une équipe extérieure est venue prendre les pièces avant le
        changement de garde. Krosh a accepté l’histoire d’un détournement
        commercial temporaire, car l’argent était important. Mis devant des
        preuves contradictoires, il peut mentir, tenter de gagner du temps, puis
        céder. Ne jamais présenter sa culpabilité aux joueurs avant leur
        enquête.</p>
    notes:
      public: ''
      private: >-
        <h3>Dossier</h3><p>@UUID[JournalEntry.LTqyGnqj7sthbpmB]{Histoire et
        relations de Krosh
        Pèse-Charge}</p><p>@UUID[JournalEntry.WH5fpMRmRdITacHZ]{Mine de
        Roche-Sèche}</p><h3>Relations</h3><ul><li>@UUID[Actor.WZmhEhaByZJuADqs]{Ragrah
        Brise-Pic} — Elle lui délègue les expéditions. (dossier
        @UUID[JournalEntry.f0bge3VQIuvXJozj]{MJ})</li><li>@UUID[Actor.Xjjk7WJsMPRVpEZj]{Moj’ka
        Main-de-Graisse} — L’a tenu à l’écart de la mise en caisse finale.
        (dossier
        @UUID[JournalEntry.TpJVg7OJKENxlIju]{MJ})</li><li>@UUID[Actor.XO981jkCXaPf7jDz]{Rukha}
        — Cherche à hâter son départ ; elle n’est pas complice. (dossier
        @UUID[JournalEntry.92Jaaithkve53hqJ]{MJ})</li><li>@UUID[Actor.xvIfsWKFd3XlxRDW]{Brazzik
        Main-Froide} — L’ingénieur connaît la machine ; Krosh évite une
        inspection technique. (dossier
        @UUID[JournalEntry.awzLezii4coZp6id]{MJ})</li></ul>
    languages: []
    properties: >-
      <section data-roche-seche-stats="2.0.0"><h2>Profil de rencontre — Krosh
      Pèse-Charge (Warbound)</h2><p><em>Adaptation MJ, NC 2 ; profil non
      officiel Warcraft. Les attaques sont données pour utilisation manuelle
      (pas de bouton de jet intégré).</em></p><p><strong>NC 2</strong> —
      <strong>DEF 16</strong> — <strong>PV 30</strong> — <strong>RD 0</strong> —
      <strong>INIT 11</strong> — <strong>Déplacement 10 m</strong> —
      <strong>Critique 20</strong></p><p><strong>Caractéristiques :</strong> AGI
      +0 · CON +2 · FOR +2 · PER +1 · CHA +1 · INT +2* · VOL +1 (*
      caractéristique supérieure)</p><p><strong>Attaques :</strong> contact +5,
      distance +3, magique 0.</p><ul><li><strong>Crochet de manutention</strong>
      (Contact) : +5 ; DM 2d6+3</li></ul><p><strong>Comportement en cas
      d'affrontement :</strong> Privilégie les excuses, la fuite et la reddition
      si sa fraude est prouvée ; ce n'est pas un combattant
      fanatique.</p><p><strong>Attention :</strong> le NC reflète une opposition
      possible, pas une obligation de combat. Il n'ajoute ni entraînement
      militaire ni pouvoirs surnaturels au PNJ.</p></section>
