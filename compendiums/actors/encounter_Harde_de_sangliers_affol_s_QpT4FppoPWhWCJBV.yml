  details:
    category: living
    size: medium
    notes:
      public: >-
        <p>Une harde de sangliers est un rassemblement d'une dizaine de bêtes
        robustes, au pelage sombre, aux défenses recourbées et aux épaules
        puissantes. Lorsqu'elles fuient ensemble, ces créatures forment une
        masse difficile à arrêter, capable de renverser un voyageur ou de
        disloquer un attelage.</p><p>Écologie</p><p>Les sangliers de Durotar
        parcourent les terres arides à la recherche de nourriture et de points
        d'eau. Habituellement prudents, ils peuvent se montrer agressifs
        lorsqu'ils sont blessés ou acculés.</p><p>Une harde prise de panique
        constitue un danger autrement plus imprévisible. Les animaux se pressent
        les uns contre les autres et suivent les premiers qui trouvent une
        issue, piétinant tout ce qui leur barre la route.</p><p>Graine
        d'aventure</p><p>Un chaman a installé plusieurs totems élémentaires à
        proximité d'un point d'eau fréquenté par les sangliers. Le rituel affole
        les animaux et les contraint à fuir dans une direction précise.</p><p>La
        harde dévale un goulet au moment où un convoi de la Horde s'y engage.
        Les personnages doivent réagir avant que les bêtes ne percutent les
        chariots et les kodos.</p><p>Les empreintes convergentes, le
        comportement inhabituel des animaux et les vestiges du rituel peuvent
        ensuite révéler que l'incident n'avait rien de naturel.</p><p>HARDE DE
        SANGLIERS</p><p>PAQUET DE CRÉATURES VIVANTES (ANIMAUX)</p><p>10 à 15
        sangliers de taille moyenne</p>
