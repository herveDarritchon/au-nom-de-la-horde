  details:
    category: humanoid
    size: large
    notes:
      public: >-
        <p>Centaure kolkar de taille Grande, membre d’une bande de pillards de
        Durotar. Lors de l’embuscade, il cherche à s’emparer des vivres, de
        l’eau et des charges plutôt qu’à éliminer les convoyeurs.</p>
      private: >-
        <p>Rôle : saisit les lots et se retire. Tactique : charge ponctuelle,
        puis appropriation de la cargaison. Une action au contact d’un lot libre
        permet de le saisir ; le lot est perdu s’il sort de la carte. À deux
        lots volés, la bande commence à décrocher. La bande ne combat pas
        jusqu’à la mort.</p>
