name: Au Nom de la Horde
img: modules/warbound-campaign-content/assets/images/illustrations/cof2-banner-image-au-nom-de-la-horde.png
caption: >-
  Durotar est une terre rude, mais c’est désormais la nôtre. Routes, villages et
  avant-postes bâtissent l’avenir de la Horde… tandis que, sous la poussière
  rouge, quelque chose commence à se fissurer.
description: >-
  <blockquote><p>Depuis <strong>Tranchecolline</strong>, routes, convois et
  avant-postes maintiennent tant bien que mal ce jeune territoire. Au sud, les
  Trolls Sombrelance reconstruisent leur avenir. Sur les frontières, Centaures,
  Hurans, soldats humains et créatures sauvages rappellent que rien ici n’est
  véritablement acquis.</p><p>Vous n’êtes pas encore des héros. Vous êtes ceux
  que l’on envoie lorsque quelque chose ne tourne pas rond : un convoi disparu,
  une patrouille qui ne revient pas, des traces étranges dans les ravins, des
  rumeurs venues des profondeurs…</p><p>Certaines histoires vous sembleront
  familières. Certains lieux réveilleront des souvenirs.</p><p><strong>Mais
  Azeroth n’est plus un jeu vidéo.</strong></p><p>Ici, les ennemis peuvent
  parler. Les quêtes peuvent être refusées. Les problèmes ont rarement une seule
  solution. Et vos décisions laisseront des traces.</p><p><strong>Bienvenue en
  Durotar.</strong></p><p><strong>Pour la Horde !</strong></p></blockquote>
