          content: >-
            <h2 data-heading="1. Identité &amp; Influence">1. Identité &amp;
            Influence</h2><p><strong>Nature :</strong> Culte démonique
            infiltré<br><strong>Zone d'influence :</strong> Cavernes des Ombres,
            Cœur de Ragefeu (sous Orgrimmar), campements cachés de
            Durotar.<br><strong>Mythe fondateur / Devise :</strong> Le chaos par
            le feu et la lame ; la chute de la fausse Horde et le retour de la
            vraie puissance gangrenée.</p><h2 data-heading="2. Buts &amp;
            Faiblesses">2. Buts &amp; Faiblesses</h2><p><strong>Objectif
            immédiat :</strong> Saboter les efforts d'unification de Thrall et
            semer la paranoïa dans Orgrimmar.<br><strong>Objectif final
            :</strong> Invoquer des entités démoniques (Légion Ardente) depuis
            les profondeurs de Ragefeu pour consumer
            Durotar.<br><strong>Faiblesse majeure :</strong> Leur besoin vital
            de garder le secret. S'ils sont exposés, la Horde entière les
            purgera.<br><strong>Méthodes favorites :</strong> Assassinats ciblés
            / Manipulation politique occulte / Magie gangrenée /
            Sabotage.</p><h2 data-heading="3. Relations &amp; Leviers">3.
            Relations &amp; Leviers</h2><p><strong>Alliés :</strong> Démons
            mineurs, politiciens locaux corrompus.<br><strong>Ennemis jurés
            :</strong> La Horde loyaliste (Thrall), les chamans
            traditionnels.<br><strong>Attitude avec les PJ :</strong> Hostile et
            dissimulée (potentiellement manipulatrice si les PJ peuvent leur
            servir de pions).<br><strong>Ce qu'elle peut offrir aux PJ
            :</strong> Puissance magique interdite, richesses volées, secrets
            compromettants sur d'autres PNJ.<br><strong>Ce qu'elle peut faire
            subir aux PJ :</strong> Embuscades mortelles dans l'ombre,
            accusations de trahison (les faire passer pour le culte).</p><h2
            data-heading="4. PNJ &amp; Lieux clés">4. PNJ &amp; Lieux
            clés</h2><ul><li><p><strong>Le chef / dirigeant :</strong> Neeru
            Fireblade (Infiltré en plein cœur
            d'Orgrimmar).</p></li><li><p><strong>Le bras droit / exécutant
            :</strong> Zureetha Farsight (Chef de secte sur le
            terrain).</p></li><li><p><strong>Lieux contrôlés :</strong> Grottes
            secrètes des crêtes de Durotar, sections condamnées de
            Ragefeu.</p></li></ul><h2 data-heading="5. Horloge Stratégique &amp;
            Mouvements">5. Horloge Stratégique &amp;
            Mouvements</h2><p><strong>Horloge (6 segments) : L'Éveil de
            Ragefeu</strong></p><ul><li><p><em>Avance si :</em> Les PJ ignorent
            les sabotages locaux ou s'en prennent aux mauvais suspects, laissant
            le culte agir.<br><strong>Mouvement autonome (Échelle Locale)
            :</strong> Quand la faction agit hors-champ,
            elle...</p></li></ul><ol><li><p>Manipule un leader local pour qu'il
            prenne une décision militaire ou politique
            désastreuse.</p></li><li><p>Déclenche une attaque surprise, violente
            et suicidaire de fanatiques et de démons mineurs sur un
            campement.</p></li><li><p>Propage silencieusement une malédiction
            gangrenée ou un poison occulte dans les réserves d'eau de la
            Horde.</p></li></ol>
