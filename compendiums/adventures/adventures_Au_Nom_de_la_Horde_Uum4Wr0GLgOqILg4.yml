        title:
          show: true
          level: 1
        text:
          format: 1
          content: >-
            <p>Krosh est un <strong>orc de Durotar affecté à la logistique de la
            Mine de Roche-Sèche</strong>, chargé des registres, des sceaux et
            des mouvements de caisse dans la cour de chargement.</p><p>Joue-le
            comme un <strong>employé compétent mais à bout de nerfs</strong>,
            usé par le manque de sommeil, la peur et la culpabilité. Il
            <strong>évite le regard</strong>, parle d’une voix grave mais
            tendue, et se réfugie constamment dans les procédures, les registres
            et les détails matériels pour ne pas affronter ce qu’il a fait. Ce
            n’est <strong>ni un idéologue ni un vrai traître politique</strong>
            : c’est un homme faible qui a accepté de l’argent pour fermer les
            yeux et falsifier quelques lignes, avant de comprendre trop tard
            qu’il s’était mêlé à quelque chose de plus grave.</p><p>Il sert très
            bien comme <strong>suspect nerveux, informateur fragile ou obstacle
            par omission</strong> : il peut ralentir l’enquête, mentir
            maladroitement, paniquer, puis craquer dès qu’il comprend qu’on ne
            cherche pas à l’abattre sur-le-champ.</p><p>Sa phrase-réflexe à
            table :</p><p><strong>« J’ai juste fait mon travail. Les registres
            sont en règle, allez vérifier vous-mêmes. »</strong></p>
        ownership:
          default: -1
        flags:
          core:
            sheetClass: campaign-codex.CampaignCodexContentPageSheet
          campaign-codex:
            contentKey: info
