            widgetName: Progress Clock
            counter: 1
            active: true
            tab: info
          - id: e6BXwubgloSAdKLn
            widgetName: Relationship Tracker Scale
            counter: 1
            active: true
            tab: widgets
        data:
          widgets:
            progressclock:
              3jpreUM3z93gInf8:
                max: 6
                current: 0
                title: Récupérer le Dérivateur Sismique
            relationshiptrackerscale:
              e6BXwubgloSAdKLn:
                relationships:
                  - uuid: Actor.vZ85XbeOu8dHT6QH
                    value: 0
                    name: Personnage joueur
                    img: systems/dnd5e/icons/svg/actors/character.svg
        image: modules/warbound-campaign-content/assets/images/icons/factions/coa-icone-faction-cartel_baille-fonds.png
      core:
        sheetClass: campaign-codex.TagSheet
    _id: sTry2ekVrtg71TQo
    pages:
      - name: Information
        type: text
        sort: 100000
        title:
          show: true
          level: 1
        text:
          format: 1
          content: >-
            <h2 data-heading="Statut">Statut</h2><p>Active, corporatiste,
            impitoyablement expansionniste. Actuellement en mode "Opérations
            spéciales et recouvrement" en Durotar et aux Tarides.</p><h2
            data-heading="Fonction dans la campagne">Fonction dans la
            campagne</h2><p>Le Cartel agit comme un <strong>antagoniste tiers et
            un perturbateur</strong>. Ils ne sont pas le méchant principal (le
            Cercle), mais une épine dans le pied de tout le monde. Leur avidité
            et leur technologie avancée ajoutent une pression constante. Ils
            sont la raison pour laquelle la quête de Mâche-Roc est une "bombe à
            retardement".</p><h2 data-heading="Ce que la faction veut">Ce que la
            faction veut</h2><p>Dans l'absolu : l'exploitation totale des
            ressources d'Azeroth, sans considération pour la nature, la
            politique ou la vie.<br><strong>Dans l'immédiat :</strong> Retrouver
            leur ancien ingénieur en chef, <strong>Brazzik Main-Froide</strong>,
            et récupérer le prototype volé du Dérivateur Sismique caché dans
            Mâche-Roc. Le "brevet" vaut des millions, l'arme elle-même vaut des
            empires.</p><h2 data-heading="Ce qu'elle fait déjà">Ce qu'elle fait
            déjà</h2><ul><li><p><strong>Infiltration :</strong> Des chasseurs de
            primes et des espions mercenaires à la solde du Cartel traînent dans
            les tavernes de Cabestan, posant des questions insistantes (et
            distribuant des pots-de-vin) au sujet d'un "gobelin aux mains
            propres".</p></li><li><p><strong>Reconnaissance :</strong> De petits
            drones d'observation rudimentaires survolent discrètement les ravins
            rocheux de Durotar à la recherche des traces thermiques spécifiques
            de la foreuse.</p></li></ul><h2 data-heading="Moyens
            disponibles">Moyens disponibles</h2><ul><li><p><strong>Capital
            écrasant :</strong> Le Cartel peut acheter la loyauté de n'importe
            quel bandit local.</p></li><li><p><strong>Mercenaires :</strong>
            Ruffians, cogneurs orcs, et snipers gobelins lourdement armés
            (déchiqueteurs, pistolets à silex
            perfectionnés).</p></li><li><p><strong>Technologie :</strong> Outils
            de pistage, explosifs, et gadgets de communication à
            distance.</p></li></ul><h2 data-heading="Limites et
            vulnérabilités">Limites et
            vulnérabilités</h2><ul><li><p><strong>Diplomatie inexistante
            :</strong> Le Cartel est hostile envers la Horde et l'Alliance. Ils
            ne peuvent pas agir au grand jour près d'Orgrimmar sans déclencher
            une réponse militaire foudroyante.</p></li><li><p><strong>Arrogance
            :</strong> Les superviseurs du Cartel sous-estiment systématiquement
            leurs opposants, les considérant comme de la main d'œuvre non
            qualifiée ou des sauvages.</p></li><li><p><strong>Manque de loyauté
            interne :</strong> Leurs agents travaillent pour l'or. Si la
            situation devient mortelle ou si quelqu'un paie mieux, ils fuiront
            ou trahiront.</p></li></ul><h2 data-heading="Ce qu'elle sait /
            ignore / croit">Ce qu'elle sait / ignore /
            croit</h2><ul><li><p><strong>Elle sait</strong> que Brazzik a caché
            le Dérivateur Sismique dans le châssis d'une foreuse nommée
            Mâche-Roc.</p></li><li><p><strong>Elle sait</strong> que la machine
            était récemment à la Mine de
            Roche-Sèche.</p></li><li><p><strong>Elle ignore</strong> que
            Mâche-Roc a été réquisitionnée par Orgrimmar ET qu'elle a été volée
            par le Cercle de la Pierre Brisée.</p></li><li><p><strong>Elle
            croit</strong> que Brazzik agit seul pour revendre l'arme au plus
            offrant, alors qu'il veut en réalité la mettre hors d'état de
            nuire.</p></li></ul><h2 data-heading="Relations avec les autres
            factions">Relations avec les autres
            factions</h2><ul><li><p><strong>La Horde :</strong> Cible
            d'exploitation et obstacle militaire. Hostilité
            ouverte.</p></li><li><p><strong>Cartel Gentepression (Steamwheedle)
            :</strong> Concurrents méprisés. Le Cartel Baille-Fonds les trouve
            trop politisés et frileux.</p></li><li><p><strong>Le Cercle de la
            Pierre Brisée :</strong> Inconnus. Si le Cartel apprend que le
            Cercle détient l'arme, ils déploieront un escadron de la mort pour
            les éliminer.</p></li></ul><h2 data-heading="Réactions aux
            PJ">Réactions aux PJ</h2><ul><li><p><strong>Approche mercantile
            (Tromperie) :</strong> S'ils apprennent que les PJ cherchent
            Mâche-Roc, les agents du Cartel peuvent se faire passer pour des
            "représentants légaux" de Baille-Fonds réclamant la machine pour
            défaut de paiement.</p></li><li><p><strong>Violence froide
            :</strong> Si les PJ ont le Dérivateur Sismique ou savent où il est,
            le Cartel emploiera la force létale sans sommation, ciblant les plus
            faibles d'abord.</p></li></ul><h2 data-heading="Horloge de
            faction">Horloge de faction</h2><p><strong>Objectif : "Récupérer le
            Dérivateur Sismique" (6 segments)</strong></p><ol><li><p>Un
            informateur repère Brazzik à Cabestan.</p></li><li><p>Le Cartel
            découvre le vol de Mâche-Roc par une "troisième
            faction".</p></li><li><p>Des mercenaires Baille-Fonds tendent une
            embuscade sur une route de Durotar pour interroger des
            témoins.</p></li><li><p>L'escouade d'élite "Les Huissiers" est
            déployée secrètement en Durotar.</p></li><li><p>Le Cartel attaque la
            planque du Cercle de la Pierre Brisée ou des
            PJ.</p></li><li><p><strong>Le Dérivateur est récupéré.</strong> (Le
            Cartel quitte Durotar, s'apprêtant à tester l'arme sur une ville
            mineure, déclenchant une crise majeure).</p></li></ol><h2
            data-heading="PNJ représentatifs">PNJ
            représentatifs</h2><ul><li><p><strong>Snikk "Double-Facture"
            :</strong> Un superviseur gobelin impitoyable, vêtu d'un manteau
            trop grand, qui dirige les opérations de recherche en Durotar. Lâche
            au corps à corps, mais protégé par des
            brutes.</p></li><li><p><strong>Grash la Tenaille :</strong> Un
            mercenaire orc lourdement cybernétisé, payé par Snikk pour faire le
            sale boulot.</p></li></ul><h2 data-heading="Utilisation en
            table">Utilisation en table</h2><p>Utilisez le Cartel Baille-Fonds
            pour <strong>complexifier une scène</strong>. S'il y a une fusillade
            entre les PJ et le Cercle de la Pierre Brisée, faites intervenir un
            troisième groupe (les mercenaires du Cartel) qui veut voler l'objet
            et tirer sur tout le monde. Ils sont d'excellents éléments
            perturbateurs.</p><h2 data-heading="Notes de validation lore et
            continuité">Notes de validation lore et
            continuité</h2><ul><li><p>Cette faction respecte l'histoire
            officielle du Cartel Baille-Fonds dans WoW (Venture Company) tout en
            s'adaptant à l'intrigue spécifique de Mâche-Roc (GDR-022 et
            GDR-009).</p></li><li><p>Il n'y a pas d'omniscience : l'horloge de
            faction représente leurs efforts actifs
            d'investigation.</p></li></ul>
