  - folder: kOBYmenw1N0X0CpB
    name: Mâche-Roc
    flags:
      campaign-codex:
        type: shop
        contentStorageVersion: 1
        contentPages:
          info: f9174UZU6CBKOJZ1
          notes: oYSwll9Yw5DyXmKR
        image: modules/warbound-campaign-content/assets/images/illustrations/coa-illustration-mache-roc.png
      core:
        sheetClass: campaign-codex.ShopSheet
    _id: H8dpEah73C7TluZP
    pages:
      - name: Information
        type: text
        sort: 100000
        title:
          show: true
          level: 1
        text:
          format: 1
          content: >-
            <h2 data-heading="L'Âme Mécanique de la Mine de Roche-Sèche">L'Âme
            Mécanique de la Mine de Roche-Sèche</h2><p>Dans la touffeur
            écrasante du sud de Durotar, là où la poussière ocre s'infiltre dans
            les moindres interstices des armures et des peaux, il est une
            légende qui ne parle ni de grands guerriers, ni de magie ancestrale.
            Elle grince, elle fume, et elle sent la graisse noire cuite au
            soleil. C'est Mâche-Roc.</p><p>Officiellement, cette merveille
            d'ingénierie gobeline sortie des ateliers les plus confidentiels du
            Cartel Baille-Fonds n'a probablement qu'un numéro de série obscur
            gravé sur une plaque de laiton. Mais pour les orcs, les trolls et
            les gobelins qui s'échinent quotidiennement dans la Mine de
            Roche-Sèche, elle est bien plus qu'un assemblage de pistons et
            d'engrenages. Elle est l'âme mécanique du campement. Mâche-Roc est
            une foreuse titanesque, un monstre d'acier capricieux et bruyant
            dont le seul but est de broyer la roche volcanique la plus
            intraitable que la terre ait jamais vomie.</p><p>Ses entrailles
            mécaniques palpitent grâce à un moteur massif, raccordé à un volant
            d'entraînement lourd et menaçant, tandis que sa tête de forage
            asymétrique semble prête à dévorer la pierre avec une voracité
            terrifiante. Son inventeur, un ingénieur à moitié fou du Cartel, la
            considérait comme l'œuvre de sa vie. Mais aujourd'hui, c'est le
            troll Moj'ka Main-de-Graisse qui la maintient en vie, rapiéçant ses
            tuyauteries soufflantes, l'insultant copieusement, mais la
            bichonnant comme s'il s'agissait de sa propre progéniture.</p><h2
            data-heading="Le Triomphe du Dos-Noir et le Sauvetage du 3ème
            Puits">Le Triomphe du Dos-Noir et le Sauvetage du 3ème
            Puits</h2><p>Si Mâche-Roc a acquis son surnom et sa réputation,
            c'est sur le terrain, dans la sueur et le bruit assourdissant des
            galeries. L'exploitation de Roche-Sèche s'était retrouvée
            brutalement freinée par le "Dos-Noir", une veine de roche si
            compacte qu'elle émoussait les pioches et que l'usage d'explosifs
            menaçait de faire effondrer toute la montagne. Mâche-Roc, bien que
            lente et d'une consommation effroyable en carburant et en
            refroidissement, fut la seule à pouvoir percer des orifices assez
            nets pour permettre la pose d'étais et de charges calibrées,
            débloquant l'accès à de nouvelles richesses pour la
            Horde.</p><p>Cependant, la véritable consécration de la machine eut
            lieu lors d'une tragédie évitée de justesse. Un jour, la montagne
            trembla et un effondrement massif scella le 3ème puits, piégeant six
            mineurs dans l'obscurité suffocante. Sous les ordres de la
            contremaître Ragrah Brise-Pic et avec Moj'ka veillant désespérément
            sur ses indicateurs de pression, Mâche-Roc fut lancée dans une
            course contre la mort. Poussée bien au-delà de ses limites
            techniques, la foreuse tourna en surchauffe pendant de longues et
            interminables heures, son moteur hurlant et crachant une fumée âcre,
            jusqu'à percer un conduit de sauvetage.</p><p>Les six mineurs furent
            extraits vivants. Depuis ce jour béni, Mâche-Roc n'est plus
            seulement perçue comme un outil. Les vieux de la mine ont adopté un
            rituel tacite et presque sacré : avant de s'enfoncer dans les
            ténèbres des galeries, ils frappent deux coups nets sur son lourd
            châssis couvert de graisse. <em>« Tok. Tok. Bonne bête.
            »</em></p><h2 data-heading="Le Crépuscule d'une Ère : Réquisition et
            Trahison">Le Crépuscule d'une Ère : Réquisition et
            Trahison</h2><p>La renommée de l'engin finit inévitablement par
            remonter jusqu'aux hautes sphères d'Orgrimmar. La construction de la
            capitale, avec ses ambitions souterraines d'expansion, nécessitait
            de creuser profondément sans risquer des détonations qui pourraient
            ébranler les fondations de la ville. Les bureaucrates de la Horde
            exigèrent alors la réquisition temporaire de Mâche-Roc. À
            Roche-Sèche, l'annonce fut reçue avec une amertume profonde. Sans la
            machine, le travail allait redevenir un calvaire éreintant, et
            beaucoup voyaient d'un très mauvais œil le départ de celle qui leur
            avait sauvé la mise.</p><p>Mais le véritable drame se joua dans
            l'ombre, bien avant que le convoi ne prenne la route du nord. Le
            Cercle de la Pierre Brisée, faction conspiratrice agissant dans les
            coulisses de Durotar, vit en cette réquisition une opportunité
            rêvée. Par l'entremise de pièces d'or glissées discrètement dans la
            paume de Krosh Pèse-Charge, le responsable orc des cargaisons, la
            légende fut volée.</p><p>Dans le plus grand secret, à la faveur de
            la nuit, Mâche-Roc fut déplacée par un ancien chemin de service pour
            être livrée aux agents du Cercle. Dans la cour de chargement, les
            quatre gigantesques caisses — censées abriter le moteur, la tête de
            forage, le châssis et les pièces de rechange de la machine — furent
            méthodiquement remplacées par des caisses identiques, lourdement
            lestées de roches denses.</p><p>Aujourd'hui, sous un soleil de
            plomb, un convoi s'éloigne lentement de Roche-Sèche en direction de
            Tranchecolline. Des soldats fiers et vigilants, ignorant tout de la
            trahison, escortent ces caisses scellées au péril de leur vie,
            croyant protéger le cœur mécanique de Durotar. Mais ils ne protègent
            qu'un mensonge de pierre, un leurre magistral qui marque le point de
            départ d'une intrigue bien plus vaste...</p>
        ownership:
          default: -1
