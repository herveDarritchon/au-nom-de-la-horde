            <p>La Horde a besoin de bras sûrs.</p><p data-start="276"
            data-end="525">La Mine de Roche-Sèche doit faire parvenir jusqu’à
            <strong data-start="327" data-end="345">Tranchecolline</strong> une
            cargaison importante destinée à Orgrimmar.</p><p data-start="527"
            data-end="722">La route n’est pas longue, 2 jours tout au plus, mais
            Durotar n’est jamais vraiment sûr. Les bêtes rôdent, les pillards
            guettent les convois isolés et les ennemis de la Horde ne manquent
            jamais d’occasions de frapper.</p><p data-start="724"
            data-end="839">Rejoignez le convoi à la <strong data-start="749"
            data-end="772">Mine de Roche-Sèche</strong> et veillez à ce que
            <strong data-start="793" data-end="838">son contenu </strong>arrive
