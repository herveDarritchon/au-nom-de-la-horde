        type: text
        sort: 100000
        title:
          show: true
          level: 1
        text:
          format: 1
          content: >-
            <p>Takrin Cherche-voie est un <strong>éclaireur orc expérimenté basé
            à Tranchecolline</strong>, habitué à parcourir les routes de Durotar
            et à lire le terrain, les traces et les mouvements
            inhabituels.</p><p>Joue-le comme un <strong>professionnel calme, sec
            et très observateur</strong>, qui parle peu, déteste les conclusions
            hâtives et fait toujours la différence entre ce qu’il
            <strong>sait</strong>, ce qu’il <strong>suppose</strong> et ce qu’on
            lui <strong>a raconté</strong>. </p><p>Il respecte davantage la
            précision que la bravoure et teste les PJ sur leur capacité à
            revenir avec une information fiable plutôt qu’avec un beau récit.
            </p><p>Il sert de relais naturel entre Razor Hill, les patrouilles,
            les convois et les pistes de Durotar, sans jamais devenir un donneur
            de quête omniscient. </p><p>Sa phrase-reflexe à table :
            </p><p><strong>« Ne me dis pas ce que tu crois. Dis-moi ce que tu as
            vu. »</strong> </p><p></p>
