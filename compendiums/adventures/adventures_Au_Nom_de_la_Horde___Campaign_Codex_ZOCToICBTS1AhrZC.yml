    pages:
      - name: Information
        type: text
        sort: 100000
        title:
          show: true
          level: 1
        text:
          format: 1
          content: >-
            <h2 data-heading="1. Fonction dans la campagne">1. Fonction dans la
            campagne</h2><p>Le Cercle est le <strong>faux antagoniste
            principal</strong> des premiers scénarios (cf. <a
            href="Campagne_Champions_of_Azeroth_Saison_1"
            data-href="Campagne_Champions_of_Azeroth_Saison_1"
            class="internal-link">Campagne_Champions_of_Azeroth_Saison_1</a>).
            Il introduit le mystère de l'excavation du Gouffre de Ragefeu
            (Ragefire Chasm). Il sert de miroir moral aux PJs : ses membres
            agissent violemment pour une cause fondamentalement juste (empêcher
            le réveil d'une menace souterraine).</p><h2 data-heading="2. Ce que
            la faction veut (But)">2. Ce que la faction veut
            (But)</h2><p><strong>Stopper définitivement l'excavation de
            Ragefeu.</strong><br>Le Cercle est persuadé que les travaux ordonnés
            par la Horde vont briser un scellement antique et libérer une entité
            cataclysmique (potentiellement liée au feu ou à la
            corruption).</p><h2 data-heading="3. Ce qu'elle fait déjà
            (Introduction &amp; Méthodes)">3. Ce qu'elle fait déjà (Introduction
            &amp; Méthodes)</h2><p>Le Cercle est introduit dès le
            <strong>Scénario 01 (Le Sang dans la
            Poussière)</strong>.</p><ul><li><p><strong>L'Infiltration (Le vrai
            vol) :</strong> Ils se sont infiltrés dans la mine de Durotar avec
            la complicité d'ouvriers et ont volé une <strong>foreuse
            lourde</strong> <em>avant</em> le départ du convoi, en la remplaçant
            par des caisses de pierres.</p></li><li><p><strong>L'Écran de fumée
            (L'embuscade) :</strong> Pour couvrir ce vol à la mine, ils ont
            détourné une patrouille de Tiragarde (via une fausse piste de vivres
            volés) pour qu'elle croise le convoi de la Horde. Depuis les crêtes,
            ils ont tiré le premier coup de feu pour déclencher la bataille, et
            utilisé la magie chamanique pour désavantager le convoi. Leur but
            était de faire croire que l'Alliance avait volé et détruit la
            machine.</p></li><li><p>Ils continuent de piller systématiquement
            tout le matériel minier de pointe destiné à
            Orgrimmar.</p></li></ul><h2 data-heading="4. Moyens, Ressources et
            Abris">4. Moyens, Ressources et
            Abris</h2><ul><li><p><strong>Effectifs :</strong> Un petit groupe
            (guérilla) très mobile, composé principalement de chamans, de
            pisteurs orcs, de chasseurs des ombres trolls, et de
            taurens.</p></li><li><p><strong>Ressources Magiques :</strong>
            Maîtrise de la magie élémentaire (Terre et Vent), ce qui leur permet
            d'effacer leurs traces, de provoquer des éboulements et de manipuler
            le terrain.</p></li><li><p><strong>Abris <code>[Proposition]</code>
            :</strong> Ils se terrent dans les canyons reculés de Durotar. Leur
            camp principal pourrait être caché dans les <strong>Ravins de la
            Sécheresse (Drygulch Ravine)</strong> ou dans une grotte dissimulée
            sur la crête des <strong>Collines du Tonnerre (Thunder
            Ridge)</strong>, protégée par des élémentaires de terre
            asservis.</p></li><li><p><strong>Appuis au sein de la Horde
            <code>[Proposition]</code> :</strong> Ils bénéficient de la
            sympathie silencieuse de certains Anciens (chamans conservateurs du
            Cercle Terrestre) et de gardes locaux qui ferment les yeux, effrayés
            par les secousses sismiques récentes sous
            Orgrimmar.</p></li></ul><h2 data-heading="5. Limites et
            vulnérabilités">5. Limites et
            vulnérabilités</h2><ul><li><p><strong>Nombre réduit :</strong> Ils
            ne peuvent pas survivre à un affrontement frontal contre l'armée de
            la Horde. Ils fuient si acculés.</p></li><li><p><strong>Fanatisme et
            isolement :</strong> Leurs actions violentes et leurs manipulations
            (comme faire s'entretuer la Horde et l'Alliance) les privent de tout
            soutien public.</p></li><li><p><strong>Ressources logistiques
            faibles :</strong> Ils dépendent entièrement des vols pour survivre
            et s'équiper.</p></li></ul><h2 data-heading="6. Ce qu'elle sait /
            ignore / croit">6. Ce qu'elle sait / ignore /
            croit</h2><ul><li><p><strong>Elle sait :</strong> Qu'un scellement
            antique est sur le point d'être brisé à
            Ragefeu.</p></li><li><p><strong>Elle ignore :</strong> La nature
            exacte et totale de la menace (elle la perçoit par des visions
            chamaniques partielles). Elle ignore aussi que le commanditaire de
            la Horde finira par utiliser leurs propres brèches pour avancer les
            travaux.</p></li><li><p><strong>Elle croit :</strong> Que la Horde
            actuelle est trop arrogante et aveuglée par le progrès industriel
            (ingénierie gobeline/orque) pour entendre la voix des
            Esprits.</p></li></ul><h2 data-heading="7. Relations et Ennemis">7.
            Relations et Ennemis</h2><ul><li><p><strong>La Horde (Commandement
            &amp; Ingénieurs) :</strong> <strong>Ennemis naturels.</strong> Les
            ingénieurs, les Voraces et l'officier commanditaire sont leurs
            cibles prioritaires.</p></li><li><p><strong>Les Humains de Tiragarde
            :</strong> <strong>Pions.</strong> Le Cercle les manipule pour créer
            des diversions et épuiser les forces de la garnison locale de la
            Horde.</p></li><li><p><strong>Les PJs :</strong> <strong>Adversaires
            puis alliés potentiels.</strong> Au départ, ils les considèrent
            comme des laquais du commanditaire.</p></li></ul><h2
            data-heading="8. Horloge de faction (Doom Clock)">8. Horloge de
            faction (Doom Clock)</h2><p><strong>Horloge à 6 segments : La Horde
            perd patience et frappe.</strong><br><em>(S'ils ne sont pas stoppés,
            ils commettront l'irréparable par désespoir).</em></p><ul
            class="contains-task-list"><li data-task="x" class="task-list-item
            is-checked"><p></p></li></ul><ol><li><p>Un petit convoi est
            pillé.</p></li></ol><ol><li data-task="x" class="task-list-item
            is-checked"><p></p></li></ol><ol
            start="2"><li><p><strong>L'embuscade du convoi de la
            Foreuse.</strong> (Scénario 01)</p></li></ol><ol><li data-task=" "
            class="task-list-item"><p></p></li></ol><ol start="3"><li><p>Des
            ingénieurs gobelins refusent de continuer à travailler par peur des
            esprits.</p></li></ol><ol><li data-task=" "
            class="task-list-item"><p></p></li></ol><ol start="4"><li><p>Le
            commanditaire d'Orgrimmar envoie des tueurs spécialisés (ou les PJs)
            traquer le Cercle.</p></li></ol><ol><li data-task=" "
            class="task-list-item"><p></p></li></ol><ol start="5"><li><p>Les
            saboteurs sont acculés dans leur repaire et s'y
            retranchent.</p></li></ol><ol><li data-task=" "
            class="task-list-item"><p></p></li></ol><ol
            start="6"><li><p><strong>Action finale :</strong> Le Cercle prépare
            un attentat massif (éboulement magique) contre les fondations mêmes
            de la cité pour ensevelir Ragefeu à jamais, au risque de tuer des
            centaines d'innocents.</p></li></ol><h2 data-heading="9. PNJ
            représentatifs (Membres les plus influents)">9. PNJ représentatifs
            (Membres les plus influents)</h2><p><em>Ces personnages sont des
            <code>[Propositions]</code> pour répondre au besoin
            d'incarnation.</em></p><ul><li><p><strong>Kador Totem-Fendu (Tauren,
            Chaman Renégat) :</strong> Le leader. Un tauren vieillissant, ancien
            héros de guerre, dont les cornes sont brisées. Il a des visions
            apocalyptiques de flammes consumant Durotar. Il est prêt à sacrifier
            son honneur pour sauver la terre. <em>(C'est lui qui laisse des
            empreintes de sabots).</em></p></li><li><p><strong>Maka la Balafre
            (Orc, Maîtresse des Bêtes) :</strong> Lieutenant tactique. Une orque
            austère qui dresse des wyvernes et des scorpides pour attaquer les
            convois. Elle s'occupe de la logistique des
            sabotages.</p></li><li><p><strong>Zul'jin le Chuchoteur (Troll,
            Sorcier-Docteur) :</strong> L'espion. Il maintient le contact avec
            les sympathisants au sein de la Horde (notamment à Razor Hill) et
            fournit au Cercle les itinéraires des convois
            miniers.</p></li></ul><h2 data-heading="10. Utilisation en table
            (Moves du MJ)">10. Utilisation en table (Moves du MJ)</h2><p>Quand
            le Cercle passe à l'offensive ou complique la vie des PJs, le MJ
            peut utiliser ces actions :</p><ol><li><p><strong>Faire disparaître
            une ressource critique :</strong> Voler ou saboter l'équipement des
            PJs ou de leurs alliés, sans effusion de sang, mais en bloquant leur
            progression matérielle.</p></li><li><p><strong>Manipuler
            l'environnement :</strong> Déclencher un éboulement (magie de la
            terre) dans un canyon pour bloquer une route, séparer le groupe de
            PJs, ou forcer un détour par un territoire hostile (Centaures,
            Harpies).</p></li><li><p><strong>Placer un dilemme moral (Fausse
            piste) :</strong> Laisser délibérément des preuves pointant vers
            l'Alliance ou une autre tribu, forçant les PJs à enquêter au-delà
            des apparences sous peine de déclencher une guerre
            diplomatique.</p></li></ol><h2 data-heading="11. Comment enquêter
            sur le Cercle (Pistes pour les PJs)">11. Comment enquêter sur le
            Cercle (Pistes pour les PJs)</h2><ul><li><p><strong>Analyser les
            scènes de crime :</strong> Constater l'anomalie des vols (seuls les
            forets et outils disparaissent).</p></li><li><p><strong>Traces
            physiques :</strong> Suivre les empreintes de sabots (Tauren) et
            déceler les résidus de magie élémentaire (scories, terre retournée
            anormalement) là où on s'attendait à trouver de la poudre à canon
            humaine.</p></li><li><p><strong>Interrogatoires :</strong>
            Questionner les prisonniers humains qui jureront n'avoir pas
            commencé l'incendie, ou confronter les alliés silencieux (Anciens) à
            Razor Hill qui semblent en savoir trop.</p></li></ul><h2
            data-heading="12. Notes de validation lore et continuité">12. Notes
            de validation lore et continuité</h2><ul><li><p>Respecte le twist
            planté dès le Mouvement 1 (les saboteurs visaient déjà le projet
            d'excavation).</p></li><li><p>Connecté au Front : <a
            href="Front_Les_Sabotages_de_Durotar"
            data-href="Front_Les_Sabotages_de_Durotar"
            class="internal-link">Front_Les_Sabotages_de_Durotar</a>.</p></li><li><p>Ne
            viole pas le lore officiel : Les dissidences chamaniques (type
            Marteau du Crépuscule ou dérivés) existent dans WoW, cette faction
            s'intègre parfaitement dans la genèse d'Orgrimmar.</p></li></ul>
