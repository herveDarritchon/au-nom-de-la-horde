            Nains)<br><strong>Zone d'influence :</strong> Theramore (Marécage
            d'Âprefange), Teldrassil, et divers avant-postes
            côtiers/nordiques.<br><strong>Mythe fondateur / Devise :</strong>
            "Pour l'Alliance !" Justice, lumière et défense inébranlable des
            royaumes civilisés.</p><h2 data-heading="2. Buts &amp;
            Faiblesses">2. Buts &amp; Faiblesses</h2><p><strong>Objectif
            immédiat :</strong> Sécuriser les bastions de l'Alliance sur
            Kalimdor et surveiller/endiguer l'expansion de la
            Horde.<br><strong>Objectif final :</strong> Établir une hégémonie
            militaire et commerciale incontestée sur l'ensemble des
            continents.<br><strong>Faiblesse majeure :</strong> Lignes de
            ravitaillement étirées, fierté mal placée et arrogance
            diplomatique.<br><strong>Méthodes favorites :</strong> Diplomatie
            coercitive / Magie arcanique et sacrée / Puissance navale navale /
            Infanterie ordonnée.</p><h2 data-heading="3. Relations &amp;
            Leviers">3. Relations &amp; Leviers</h2><p><strong>Alliés :</strong>
            Factions neutres ralliées à la Lumière ou à l'Ordre, clans nains
            explorateurs.<br><strong>Ennemis jurés :</strong> La
            @UUID[JournalEntry.yWqSuSmq7d7CyDlu]{Horde}, le Fléau, la
            Légion.<br><strong>Attitude avec les PJ :</strong> Hostile par
            défaut (les PJ étant de la Horde), mais encline à des trêves
            opportunistes face à un péril plus grand.<br><strong>Ce qu'elle peut
            offrir aux PJ :</strong> (En cas de trêve ou trahison)
            Renseignements, libre passage maritime, technologie
            gnome/naine.<br><strong>Ce qu'elle peut faire subir aux PJ
            :</strong> Bombardements côtiers massifs, blocus portuaire,
            emprisonnement brutal, purges de la Lumière.</p><h2 data-heading="4.
            PNJ &amp; Lieux clés">4. PNJ &amp; Lieux
            clés</h2><ul><li><p><strong>Le chef / dirigeant :</strong> Jaina
            Portvaillant (Theramore), Tyrande Murmurevent
            (Darnassus).</p></li><li><p><strong>Le bras droit / exécutant
            :</strong> Hauts-officiers de marine de Kul Tiras, Généraux
            Sentinelles Elfes de la nuit.</p></li><li><p><strong>Lieux contrôlés
            :</strong> Cité-bastion de Theramore, Île de Teldrassil, bases
            naines isolées.</p></li></ul><h2 data-heading="5. Horloge
            Stratégique &amp; Mouvements">5. Horloge Stratégique &amp;
            Mouvements</h2><p><strong>Horloge (8 segments) : L'Hégémonie de
            l'Alliance</strong></p><ul><li><p><em>Avance si :</em> L'Alliance
            conclut des pactes majeurs avec des factions neutres ou détruit des
            bases critiques de la Horde.<br><strong>Mouvement autonome (Échelle
            Continentale) :</strong> Quand la faction agit hors-champ,
            elle...</p></li></ul><ol><li><p>Lance une flotte de guerre massive
            pour verrouiller une route maritime entière.</p></li><li><p>Déploie
            un contingent de paladins d'élite ou de sentinelles pour "purger"
            militairement une région.</p></li><li><p>Établit un embargo
            diplomatique et commercial total contre un rival, l'isolant du reste
            du monde.</p></li></ol>
        ownership:
