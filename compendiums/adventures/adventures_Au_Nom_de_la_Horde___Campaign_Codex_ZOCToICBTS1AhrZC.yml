        text:
          format: 1
          content: >-
            <h2 data-heading="1. Identité &amp; Influence">1. Identité &amp;
            Influence</h2><p><strong>Nature :</strong> Coalition de survie
            (Orcs, Trolls Sombrelance, Taurens)<br><strong>Zone d'influence
            :</strong> Kalimdor (Orgrimmar, Les Pitons-du-Tonnerre, Les
            Tarides)<br><strong>Mythe fondateur / Devise :</strong> "Lok'tar
            Ogar ! La victoire ou la mort !" Survie et rédemption dans un monde
            hostile.</p><h2 data-heading="2. Buts &amp; Faiblesses">2. Buts
            &amp; Faiblesses</h2><p><strong>Objectif immédiat :</strong>
            Consolider leur nouveau foyer sur Kalimdor face aux menaces locales
            et aux éléments.<br><strong>Objectif final :</strong> Assurer la
            pérennité et la souveraineté absolue de la Horde en tant que
            superpuissance continentale.<br><strong>Faiblesse majeure :</strong>
            Les divisions internes entre les clans et la dépendance logistique
            dans des terres arides.<br><strong>Méthodes favorites :</strong>
            Force brute / Chamanisme / Tactiques de meute / Ingénierie de siège
            orque et gobeline.</p><h2 data-heading="3. Relations &amp;
            Leviers">3. Relations &amp; Leviers</h2><p><strong>Alliés :</strong>
            Tribus taurens locales, certains clans gobelins
            (opportunistes).<br><strong>Ennemis jurés :</strong>
            L'@UUID[JournalEntry.zSxA4Net2AD248EW]{Alliance}, les restes de la
            Légion, les tribus hostiles (Hurans, Centaures).<br><strong>Attitude
            avec les PJ :</strong> Protectrice mais exigeante (faction par
            défaut des PJ).<br><strong>Ce qu'elle peut offrir aux PJ :</strong>
            Grades militaires, ressources lourdes, soutien chamanique, accès
            privilégié aux capitales.<br><strong>Ce qu'elle peut faire subir aux
            PJ :</strong> Missions suicides, cour martiale, exil, conscription
            forcée dans des zones de guerre.</p><h2 data-heading="4. PNJ &amp;
            Lieux clés">4. PNJ &amp; Lieux clés</h2><ul><li><p><strong>Le chef /
            dirigeant :</strong> Thrall, le Chef de Guerre
            (Orgrimmar).</p></li><li><p><strong>Le bras droit / exécutant
            :</strong> Cairne Sabot-de-Sang (Taurens), Vol'jin (Trolls), Varok
            Saurcroc (Armée).</p></li><li><p><strong>Lieux contrôlés :</strong>
            Orgrimmar, Tranchecolline, Les Pitons-du-Tonnerre, divers
            avant-postes en Kalimdor.</p></li></ul><h2 data-heading="5. Horloge
            Stratégique &amp; Mouvements">5. Horloge Stratégique &amp;
            Mouvements</h2><p><strong>Horloge (8 segments) : La Forteresse
            Inexpugnable</strong></p><ul><li><p><em>Avance si :</em> La Horde
            remporte des victoires décisives, sécurise des ressources majeures
            ou écrase l'Alliance localement.<br><strong>Mouvement autonome
            (Échelle Continentale) :</strong> Quand la faction agit hors-champ,
            elle...</p></li></ul><ol><li><p>Déploie une armée écrasante ou une
            flotte pour raser une place forte ennemie.</p></li><li><p>Établit un
            nouvel avant-poste lourdement fortifié dans une zone contestée
            (changeant la carte).</p></li><li><p>Impose un blocus commercial et
            militaire sur un territoire entier, affamant ses
            rivaux.</p></li></ol>
