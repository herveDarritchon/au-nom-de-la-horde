    pages:
      - name: Information
        type: text
        sort: 100000
        title:
          show: true
          level: 1
        text:
          format: 1
          content: >-
            <h2 data-heading="1. Identité &amp; Influence">1. Identité &amp;
            Influence</h2><p><strong>Nature :</strong> Tribu nomade guerrière et
            agressive.<br><strong>Zone d'influence :</strong> Sud-ouest de
            Durotar et est des Tarides.<br><strong>Mythe fondateur / Devise
            :</strong> Écraser les faibles, dominer les terres arides.</p><h2
            data-heading="2. Buts &amp; Faiblesses">2. Buts &amp;
            Faiblesses</h2><p><strong>Objectif immédiat :</strong> Harceler et
            repérer les défenses de la Horde (Vallée des Épreuves, Sen'jin
            Village).<br><strong>Objectif final :</strong> Mener une offensive
            totale (en 3 étapes : Vallée des Épreuves, Sen'jin, Orgrimmar) pour
            chasser la Horde de leurs territoires de
            chasse.<br><strong>Faiblesse majeure :</strong> Faction isolée,
            aucune diplomatie, prévisibilité de leurs assauts
            frontaux.<br><strong>Méthodes favorites :</strong> Intimidation /
            Raids éclairs / Force brute.</p><h2 data-heading="3. Relations &amp;
            Leviers">3. Relations &amp; Leviers</h2><p><strong>Alliés :</strong>
            Aucun (isolés, rejettent toute alliance).<br><strong>Ennemis jurés
            :</strong> La Horde (Trolls Sombrelance en première ligne, Orcs),
            autres tribus centaures.<br><strong>Attitude avec les PJ :</strong>
            Hostile (Attaque à vue).<br><strong>Ce qu'elle peut offrir aux PJ
            :</strong> Butin de guerre (armes brutes), montures capturées, plans
            d'attaque (Ordres d'attaque Kolkar).<br><strong>Ce qu'elle peut
            faire subir aux PJ :</strong> Embuscades meurtrières sur les routes
            du sud, tirs de flèches à distance, poursuites montées
            inévitables.</p><h2 data-heading="4. PNJ &amp; Lieux clés">4. PNJ
            &amp; Lieux clés</h2><ul><li><p><strong>Le chef / dirigeant
            :</strong> Barak Codekodo (Seigneur de guerre orchestrant
            l'offensive sur Durotar) [Canon].</p></li><li><p><strong>Le bras
            droit / exécutant :</strong> Capitaines de raids Kolkar, géomanciens
            centaures.</p></li><li><p><strong>Lieux contrôlés :</strong>
            Campements nomades fortifiés au sud-ouest de Durotar, crêtes
            rocheuses surveillant les routes.</p></li></ul><h2 data-heading="5.
            Horloge Stratégique &amp; Mouvements">5. Horloge Stratégique &amp;
            Mouvements</h2><p><strong>Horloge (4 segments) : L'Invasion
            Kolkar</strong></p><ol><li><p>Les éclaireurs Kolkar cartographient
            les défenses de la Vallée des Épreuves.</p></li><li><p>Raid violent
            sur la Vallée des Épreuves.</p></li><li><p>Attaque coordonnée sur le
            village de Sen'jin.</p></li><li><p>Assaut final suicidaire sur les
            portes d'Orgrimmar.</p></li></ol><ul><li><p><em>Avance si :</em> Les
            PJ ignorent la menace dans le sud, ou échouent à intercepter les
            plans d'attaque (cf. quête <em>Thwarting Kolkar
            Aggression</em>).<br><strong>Mouvement autonome :</strong> Les
            Kolkar déplacent périodiquement leurs campements pour surprendre les
            patrouilles de la Horde ou encercler un groupe isolé.</p></li></ul>
        ownership:
          default: -1
