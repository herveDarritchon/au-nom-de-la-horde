system:
  description: >-
    <p>Après un rituel de 30 min, la forêt s’éveille dans un rayon de 1 km par
    rang et devient une alliée du druide pendant 24 h. Dans ce périmètre, les
    ennemis du druide sont désorientés et gênés par les branches et les racines.
    Ils divisent leur déplacement par deux et subissent un dé malus à tous les
    tests de survie, d’orientation, de perception ou de discrétion. Le druide
    peut lancer ce sort une seule fois par jour.</p><p>Si deux druides essaient
    d’influencer la forêt, c’est celui dont le niveau est le plus élevé qui
    l’emporte</p>
  inGame: <p>Le joueur dépense ses PM manuellement. Pas d'effets automatiques.</p>
