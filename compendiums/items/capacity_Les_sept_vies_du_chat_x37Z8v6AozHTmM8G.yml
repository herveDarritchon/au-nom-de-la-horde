name: Les sept vies du chat
type: capacity
img: icons/magic/life/ankh-gold-blue.webp
system:
  description: >-
    <p style="text-align:justify">Cette capacité ne peut être utilisée que six
    fois, et pas plus d’une fois par niveau. Lorsque les PV du druide tombent à
    0 ou qu’il meurt, le druide peut choisir d’ignorer ce qui a provoqué la mort
    ou l’inconscience ! Le MJ et le joueur doivent se mettre d’accord et trouver
    une raison plausible (ou pas !) pour expliquer la survie du personnage, et
    le faire réapparaître immédiatement ou un peu plus tard dans l’aventure si
    nécessaire</p>
  inGame: >-
    <p>Pas d'effets automatiques. A gérer à la main par le MJ, pour
    l'instant.</p>
