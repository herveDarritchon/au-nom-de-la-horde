  description: >-
    <p>Le Tauren bénéficie d’un <strong>bonus de +5 aux tests de protection
    contre les sorts de Nature</strong>. </p><p><strong data-start="49"
    data-end="72">Une fois par combat</strong>, lorsqu’il est ciblé par un
    <strong data-start="101" data-end="140">sort de Nature qui inflige des
    dégâts</strong>, le Tauren peut choisir de <strong data-start="170"
    data-end="207">ne subir que la moitié des dégâts</strong>.</p><p>Cette
    capacité est sans effet contre une créature dont le <strong data-start="482"
    data-end="530" data-is-only-node>NC est au moins égal au double du niveau
    </strong>du Tauren.</p>
