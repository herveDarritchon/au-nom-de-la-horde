name: Parade croisée
type: capacity
img: icons/skills/melee/swords-parry-block-blue.webp
system:
  description: >-
    <p>Le rôdeur obtient un bonus de +1 en DEF lorsqu’il combat avec une arme
    dans chaque main. Ce bonus passe à +2 au rang 5 de la voie.</p>

    <p>Au début de son tour, s’il renonce à toute attaque de la main secondaire,
    il double ce bonus jusqu’à son prochain tour</p>
  inGame: >-
    <p>Propose 2 actions "activable/désactivable"</p>

    <p>Si le joueur compte utiliser ses 2 armes, activez l'option "Parade
    croisée : 2 attaques".</p>

    <p>Si le joueur ne compte utiliser qu'une seule attaque, activez l'option
    "Parade croisée : 1 attaque".</p>
