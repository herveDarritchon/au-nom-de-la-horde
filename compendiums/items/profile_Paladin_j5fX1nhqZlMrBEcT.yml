name: Paladin
type: profile
img: modules/warbound-campaign-content/assets/images/profils/cof2-profil-paladin.png
system:
  description: >-
    <p><span><strong>Points de vigueur :</strong> 5 par
    niveau</span></p><p><span>Le paladin est un guerrier sacré qui associe la
    maîtrise des armes à une foi inébranlable en la Lumière. Revêtu d'une armure
    lourde, il protège ses compagnons, soigne les blessés et combat les forces
    des ténèbres grâce à ses pouvoirs divins. Guidé par des idéaux de justice,
    de courage et de compassion, il consacre généralement sa vie à défendre les
    innocents et à lutter contre le mal. Toutefois, la foi ne garantit pas la
    vertu : certains paladins peuvent devenir fanatiques, aveuglés par leurs
    convictions ou prêts à commettre des actes terribles au nom d'une cause
    qu'ils estiment juste.</span></p><h2><span>Sur
    Azeroth</span></h2><p><span>Les premiers paladins furent formés au sein de
    l'ordre de la Main d'argent, fondé par l'archevêque Alonsus Faol pendant la
    Deuxième Guerre. Sous le commandement d'Uther le Porteur de Lumière, ces
    chevaliers sacrés combattirent la Horde et devinrent les défenseurs des
    royaumes humains. Mais la Troisième Guerre et la trahison d'Arthas portèrent
    un coup terrible à leur ordre. Nombre de paladins périrent face au Fléau,
    tandis que les survivants poursuivirent leur combat au sein d'ordres
    dispersés ou de nouvelles organisations, comme l'Aube
    d'argent.</span></p><p><span>Les paladins sont principalement des Humains et
    des Nains, traditionnellement liés à l'Alliance et à l'Église de la Lumière
    sacrée. Quelques Hauts-Elfes de Quel'Thalas avaient également rejoint la
    Main d'argent avant la chute de leur royaume. Parmi leurs survivants,
    désormais appelés Sin'dorei, certains ont conservé leur foi et leurs
    pouvoirs sacrés malgré les épreuves traversées.</span></p><p><span>Au sein
    de la jeune Horde de Thrall, un paladin demeure donc une exception. Un
    ancien chevalier de Quel'Thalas peut néanmoins choisir de combattre aux
    côtés de ses nouveaux compagnons sans renoncer à ses convictions. Sa
    présence suscitera probablement la curiosité ou la méfiance, tant la Lumière
    reste associée aux anciens ennemis de la Horde. Pour un tel personnage,
    concilier sa foi, son héritage et sa loyauté envers ses compagnons peut
    constituer une épreuve aussi importante que les combats qu'il
    mène.</span></p><h2><span>Armes &amp; armures</span></h2><p><span>Le paladin
    sait manier toutes les armes de contact. Les voies de paladin lui permettent
    de porter une armure allant jusqu'à l'armure de plaque (l'armure de plaque
    complète nécessite une capacité particulière). Il peut utiliser tous les
    boucliers.</span></p><h2><span>Équipement de départ</span></h2><p><span>Épée
    longue (DM 1d8), grand bouclier (DEF +2), dague (DM 1d4), cotte de mailles
    (DEF +5), symbole sacré de la Lumière.</span></p>
