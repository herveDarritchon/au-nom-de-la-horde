system:
  description: >-
    <p style="text-align:justify">La foudre frappe toutes les créatures
    désignées dans un rayon de 10 m autour du prêtre et leur inflige [2d4°+CHA]
    DM (pas de test d’attaque requis). Ce sort est gourmand en énergie et son
    coût augmente de +1 PM à chaque utilisation tant que le prêtre n’a pas
    terminé une récupération rapide.</p>
  inGame: >-
    <p>L'action permet de réaliser une attaque automatique qui inflige les DM.
    Les DM seront à appliquer manuellement sur chaque cible. Le surcoût de 1PM
    n'est pas automatisé, il faudra le retirer manuellement</p>
