name: Lumière
type: capacity
img: icons/magic/light/torch-fire-orange.webp
system:
  description: >-
    <p style="text-align:justify">Le magicien désigne un objet à moins de 10 m.
    Celui‑ci produit de la lumière dans un rayon de 10 m pendant INT heures.
    Cette source de lumière n’émet pas de chaleur. Une fois par combat, le
    magicien peut lancer ce sort sur les yeux d’une créature dont le NC ne
    dépasse pas le rang atteint dans la voie. S’il réussit un test opposé
    d’attaque magique, elle est aveuglée pendant 1 round.</p>
  inGame: >-
    <p>Pour faire simplement de la lumière, le joueur depense manuellement 1
    PM</p><p>Pour aveugler la cible, il doit la selectionner et utiliser
    l'action "Aveugler une cible" et le test opposé se fera tout seul et en cas
    de succès appliquera l'état "aveuglé" à la cible.</p> <p>L'application du
    statut fonctionne uniquement en mode Combat.</p>
