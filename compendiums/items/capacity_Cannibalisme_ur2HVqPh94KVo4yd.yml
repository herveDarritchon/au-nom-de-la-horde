    un jet de guérison naturelle. Mouvement volontaire, autre action ou dégâts
    subis interrompent l’assimilation sans effet. Après qu’un jet a été
    effectué, il ne peut en obtenir un nouveau par Assimilation nécrotique avant
    d’avoir subi une nouvelle Blessure.</p>
