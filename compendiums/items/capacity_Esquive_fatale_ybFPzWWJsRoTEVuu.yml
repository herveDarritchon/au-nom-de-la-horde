system:
  description: >-
    <p style="text-align:justify">Une fois par combat, le voleur peut esquiver
    une attaque et s’arranger pour que celle‑ci affecte un autre adversaire à
    son contact. Comparez le test d’attaque à la DEF de la nouvelle cible pour
    savoir si celle‑ci subit des DM. Cette capacité ne peut pas être utilisée si
    le voleur n’a qu’un seul adversaire au contact et jamais contre une réussite
    critique (un critique touche toujours sa cible).</p>
  inGame: >-
    <p>Pas d'effets automatiques. A gérer à la main par le MJ, pour
    l'instant.</p>
