system:
  description: >-
    <p style="text-align:justify">Une fois par combat, lorsqu’il tombe à 0PV, le
    rôdeur peut récupérer [4d4° + CON] PV au début de son prochain tour.
    Lorsqu’il se relève, il bénéficie d’un bonus de +5 en DEF pendant 1 round et
    il se débarrasse de tous les états préjudiciables non permanents qui
    l’affectent</p>
  inGame: >-
    <p>Cette capacité propose deux actions. La première soigne, au joueur de
    cliquer dessus lorsqu'il tombe à 0 PV. La deuxième donne le bonus
    activable/desactivable de +5 en DEF, à désactiver manuellement du coup.</p>
