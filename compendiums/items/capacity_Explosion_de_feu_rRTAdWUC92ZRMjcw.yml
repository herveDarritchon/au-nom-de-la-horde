system:
  description: >-
    <p style="text-align:justify">Le magicien choisit un point situé à moins de
    30 m. Toutes les créatures (y compris le magicien et ses compagnons) se
    trouvant dans un rayon de 5 m autour de ce point subissent [4d4°+INT] DM et
    peuvent effectuer un test d’AGI difficulté [10 + INT] pour ne subir que la
    moitié des DM.</p>
  inGame: >-
    <p>Le joueur sélectionne ses cibles puis clique sur l'action pour lancer le
    sort qui va lancer les dommages et demander un test de sauvegarde d'AGI. En
    cas de réussite, les DM sont divisés par 2.</p>
