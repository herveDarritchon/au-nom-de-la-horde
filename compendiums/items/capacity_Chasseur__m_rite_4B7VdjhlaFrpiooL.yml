system:
  description: >-
    <p>Le rôdeur obtient +1d4° aux DM de ses attaques au contact ou à distance
    lorsqu’il combat des animaux (même géants). Chaque fois qu’il atteint le
    rang 5 dans une voie de rôdeur, il peut choisir un ennemi juré contre lequel
    il obtient le même avantage parmi les goblinoïdes, les géants, les dragons,
    les morts‑vivants, les insectes*, les démons.</p>

    <ul>

    <li><em>arthropodes inclus.</em></li>

    </ul>
  inGame: >-
    <p>Cette capacité propose une action activable/désactivable donnant le bonus
    de DM. A activer dans les circonstances correspondantes.</p>
