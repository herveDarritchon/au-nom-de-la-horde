system:
  description: >-
    <p style="text-align:justify">Une fois par round, si le voleur réussit un
    test d’AGI difficulté 15, il peut effectuer une acrobatie pour franchir un
    obstacle (qui peut être un adversaire) ou attaquer dans le dos un adversaire
    au contact. Il peut alors au choix utiliser l’attaque sournoise ou infliger
    +1d4° DM.</p>
  inGame: >-
    <p>La première action permet de réaliser le test de sauvegarde.</p><p>La
    deuxième action est à activer pour obtenir le +1d4° DM de contact.</p>
