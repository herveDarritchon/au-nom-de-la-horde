system:
  description: >-
    <p style="text-align:justify">Une fois par jour, lorsque le personnage tombe
    à 0 PV, il se relève, nimbé d’une aura de lumière. Il produit alors une onde
    d’énergie positive qui restitue [2d4°+CHA du prêtre] PV à tous ses alliés
    dans un rayon de 20 m, et il récupère lui‑même le double de PV.</p>
  inGame: >-
    <p>Le joueur sélectionne ses cibles puis clique sur l'action pour lancer le
    sort qui va automatiquement appliquer les soins. A noter que : on ne vérifie
    pas que le joueur ai 0 PV, et n'applique pas le double de PV sur le PJ (pas
    possible actuellement). Il faudra bien un repos complet pour pouvoir
    réutiliser cette action.</p>
