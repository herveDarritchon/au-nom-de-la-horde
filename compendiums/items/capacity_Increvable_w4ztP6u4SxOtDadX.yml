system:
  description: >-
    <p>Une fois par combat, lorsqu’une attaque obtient une réussite critique
    contre le Réprouvé, celui-ci peut dépenser 1 DR.</p><p>L’attaque reste une
    réussite, mais cesse d’être considérée comme une réussite critique pour tous
    ses autres effets : les DM ne sont pas multipliés ou augmentés grâce au
    critique et aucun effet dépendant spécifiquement de cette réussite critique
    ne s’applique.</p>
