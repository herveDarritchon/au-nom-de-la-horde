name: Rituel de sang
type: capacity
img: icons/skills/wounds/blood-drip-droplet-red.webp
system:
  description: >-
    <p>Le sorcier s’ouvre les veines et sacrifie 1d4° PV pour cibler une
    créature vivante (portée 20 m), la victime saigne à la moindre blessure.
    Tous les DM infligés à la cible par des armes tranchantes ou perçantes
    (griffes et crocs inclus) augmentent de +1d4° pendant INT rounds.</p>
  inGame: >-
    <p>L'action "Activation" permet de dépenser les PM et de faire perdre 1d4°
    au Sorcier. L'action "Dommages à la cible" permet de réaliser le jet de
    Dommages lorsque la cible subit le bon type de blessures.</p>
