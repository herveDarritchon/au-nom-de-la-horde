name: Lien de sang
type: capacity
img: icons/magic/unholy/projectiles-blood-salvo-red.webp
system:
  description: >-
    <p style="text-align:justify">En réussissant un test opposé d’attaque
    magique (portée 20 m), le sorcier tisse un lien avec sa victime. Pendant INT
    minutes, la moitié des DM reçus par le sorcier sont également subis par la
    cible (les DM infligés au sorcier ne sont pas pour autant réduits) et le
    sorcier peut lui lancer un sort sans la voir (si elle est à portée).</p>
  inGame: >-
    <p>Le joueur sélectionne sa cible puis clique sur l'action pour lancer le
    sort qui va faire le test d'attaque magique le reste est à gérer
    manuellement par le MJ.</p>
