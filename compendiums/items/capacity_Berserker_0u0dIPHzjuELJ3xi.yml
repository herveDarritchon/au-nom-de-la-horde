system:
  description: >-
    <p>Le Troll déchaîne sa rapidité pendant 2 rounds. L’effet dépend de ses PV
    au moment de l’activation. Au-dessus de 50 % de ses PV maximum : +3 en
    Initiative. À 50 % de ses PV maximum ou moins : +5 en Initiative et, une
    fois pendant la durée, il obtient une action d’attaque supplémentaire (A).
    Cette action peut servir à effectuer une attaque, utiliser une capacité (A)
    ou lancer un sort (A). Cette action supplémentaire respecte la limite
    normale de COF2 d’une seule action supplémentaire par round. Le Troll doit
    terminer une Récupération rapide avant de pouvoir utiliser à nouveau
    Berserker.</p>
