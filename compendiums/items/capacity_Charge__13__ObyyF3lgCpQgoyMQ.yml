  description: >-
    <p>La créature parcourt une distance maximale de 20 m et réalise une attaque
    avec <strong>un dé bonus</strong>. Si l’attaque est réussie, en plus des DM
    normaux, une victime de taille inférieure ou égale à la créature, doit faire
    un <strong>test de FOR difficulté 13</strong> ou être <em>renversée</em>.
    Dans ce cas, la créature piétine (ou embroche) sa victime et les <strong>DM
    sont doublés</strong>.</p>
