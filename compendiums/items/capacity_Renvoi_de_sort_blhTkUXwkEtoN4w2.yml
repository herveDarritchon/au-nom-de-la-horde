img: modules/warbound-campaign-content/assets/images/icons/capacites/classes/guerrier/cof2-renvoi-de-sort.png
system:
  description: >-
    <p style="text-align:justify">Le guerrier peut décider de renvoyer un sort
    qu’il vient d’absorber grâce à sa capacité Absorber un sort. Au lieu d’être
    annulé, le sort absorbé est immédiatement retourné contre son expéditeur :
    le lanceur du sort subit alors les effets de sa propre attaque ! Cet effet
    ne fonctionne pas contre les sorts de zone.</p>
  inGame: >-
    <p>Pas d'effets automatiques. A gérer à la main par le MJ, pour
    l'instant.</p>
