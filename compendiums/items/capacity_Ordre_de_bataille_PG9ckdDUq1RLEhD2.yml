system:
  description: >-
    <p>Le chevalier donne des ordres tactiques pertinents au coeur de la
    bataille. Une fois par round, il octroie une action supplémentaire gratuite
    à un allié en vue (une action de mouvement ou une action d’attaque, mais pas
    une action limitée). Chaque allié ne peut profiter d’un ordre de bataille
    qu’une seule fois par combat.</p>
  inGame: >-
    <p>Pas d'effets automatiques. A gérer à la main par le MJ, pour
    l'instant.</p>
