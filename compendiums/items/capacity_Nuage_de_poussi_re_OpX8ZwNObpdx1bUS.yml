system:
  description: >-
    <p>Le Manœuvre frappe violemment le sol et soulève un épais nuage de
    poussière.</p><p dir="auto" data-start="1226" data-end="1357">Toutes les
    créatures adverses à son contact subissent un <strong data-start="1283"
    data-end="1356">dé malus à leurs attaques jusqu'au début du prochain tour du
    Manœuvre</strong>.</p>
  source: ''
  origin: Warbound
  slug: ''
  gmNotes: >-
    <p>Cette capacité traduit le <em data-start="1385" data-end="1397">Dust
    Cloud</em> de WoW sans créer un nouvel état et reste cohérente avec la
    logique COF2 des dés malus. COF2 privilégie justement la réutilisation de
    ses mécanismes existants plutôt que la multiplication des états.</p>
