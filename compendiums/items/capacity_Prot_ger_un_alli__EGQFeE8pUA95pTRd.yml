name: Protéger un allié
type: capacity
img: worlds/au-nom-de-la-horde-cof2/assets/images/icons/capacites/classes/guerrier/cof2-prote%CC%81ger-un-allie.png
system:
  description: >-
    <p style="text-align:justify">S’il n’est pas surpris, le guerrier peut
    accorder un bonus de DEF de +2 à un allié à son contact contre une attaque
    par round. Il doit annoncer son intention avant de connaître le résultat de
    l’attaque. De plus, vous ajoutez votre rang + 2 à tous les tests destinés à
    éviter d’être surpris</p>
  inGame: >-
    <p>Cette capacité gère le bonus permanent aux jet de caractéristique pour
    éviter d'être surpris.</p>  <p>De plus elle propose une action qui si elle
    est activée après avoir ciblé un allié, va lui appliquer un bonus de +2 en
    DEF pendant 1 round. Cet effet ne fonctionne qu'en mode combat.</p>
