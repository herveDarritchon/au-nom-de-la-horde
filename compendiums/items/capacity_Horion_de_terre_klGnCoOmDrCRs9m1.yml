system:
  description: >-
    <p>Rang 2 — Horion de terre (A)*, 2 PM. Cible visible à 10 m. Attaque
    magique contre DEF ; réussite : 1d4° + VOL DM physiques élémentaires
    (minimum 1). La cible fait ensuite un test de CON difficulté 10 + VOL. Sur
    un échec, elle est Ralentie jusqu’à la fin de son prochain tour ; sur une
    réussite, elle n’est pas ralentie. Une même cible ne peut subir le Ralenti
    de cet Horion qu’une fois par récupération rapide, qu’elle résiste ou non ;
    les DM restent possibles aux usages suivants.</p>
