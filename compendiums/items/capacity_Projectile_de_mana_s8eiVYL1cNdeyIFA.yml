system:
  description: >-
    <p style="text-align:justify">Le magicien choisit une cible visible située à
    moins de 30 m et lance sur elle un projectile d’énergie ésotérique pure,
    déformant la trame de la réalité. La cible subit automatiquement 1d4° DM. Si
    le joueur obtient le résultat maximal sur son dé de dommages, il peut le
    relancer et ajouter le nouveau résultat (une seule fois). Les DM du
    projectile de mana augmentent de +1 chaque fois que le personnage atteint le
    rang 4 dans une voie de magicien jusqu’à un maximum égal à sa valeur
    d’INT.</p>
  inGame: >-
    <p>Le joueur sélectionne sa cible puis clique sur l'action pour lancer le
    sort qui va faire le jet de dégats.</p>
