name: Démoniste
type: profile
img: modules/warbound-campaign-content/assets/images/profils/cof2-profil-demoniste.png
system:
  description: >-
    <p><span><strong>Points de vigueur :</strong> 3 par
    niveau</span></p><p><span>Le démoniste est un lanceur de sorts qui puise son
    pouvoir dans les énergies de l'Ombre et la magie gangrenée. Maître des
    malédictions, des flammes infernales et de l'invocation démoniaque, il
    manipule des forces que la plupart des mortels craignent ou condamnent.
    Contrairement aux magiciens, qui cherchent à maîtriser les arcanes, les
    démonistes n'hésitent pas à exploiter les âmes, à drainer l'énergie vitale
    de leurs ennemis et à soumettre des démons à leur
    volonté.</span></p><p><span>Leur réputation est sinistre, et souvent à juste
    titre : la recherche de puissance a conduit nombre d'entre eux à la
    corruption et à la servitude envers la Légion ardente. Pourtant, tous les
    démonistes ne servent pas les démons qu'ils invoquent. Certains considèrent
    au contraire que la meilleure façon de combattre les puissances infernales
    consiste à retourner leurs propres armes contre elles. D'autres poursuivent
    simplement un savoir interdit ou une puissance que les voies traditionnelles
    de la magie ne peuvent leur offrir. Mais quelle que soit leur motivation,
    <strong>jouer avec de telles forces n'est jamais sans
    danger.</strong></span></p><h2><span>Sur Azeroth</span></h2><p><span>La
    magie démoniaque a profondément marqué l'histoire d'Azeroth,
    particulièrement celle des Orcs. Sous l'influence de Gul'dan et du Conseil
    des ombres, les anciens chamans orcs furent détournés des esprits
    élémentaires pour embrasser les arts gangrenés. Les démonistes contribuèrent
    ainsi à l'asservissement de l'ancienne Horde par la Légion ardente et à la
    corruption de leur propre peuple.</span></p><p><span>Aujourd'hui, la
    nouvelle Horde de Thrall cherche à rompre avec cet héritage. Les traditions
    chamaniques retrouvent leur place et la sorcellerie démoniaque demeure
    profondément suspecte. Quelques démonistes continuent néanmoins de pratiquer
    leurs arts, souvent dans la discrétion, parfois avec la tolérance méfiante
    des autorités. Leur savoir peut se révéler précieux face aux démons et aux
    cultes qui menacent encore la Horde, mais la frontière entre les combattre
    et succomber à leurs promesses reste dangereusement
    mince.</span></p><p><span>L'apprentissage de la démonologie exige des
    connaissances interdites, acquises auprès d'un maître, dans d'anciens
    grimoires ou au contact des démons eux-mêmes. Certains héritent des
    enseignements de l'ancienne Horde ; d'autres découvrent ces pratiques par
    ambition, nécessité ou désespoir. Un pacte démoniaque peut ouvrir la voie à
    de grands pouvoirs, mais il n'est pas indispensable pour devenir
    démoniste.</span></p><p><span>À travers Azeroth, ces praticiens sont
    généralement craints et tenus à l'écart. Chez les Orcs, ils rappellent les
    heures les plus sombres de leur histoire. Les chamans se méfient de leur
    magie corruptrice, tandis que les adeptes de la Lumière voient dans leurs
    pratiques une menace spirituelle. Pourtant, certains démonistes parviennent
    à mettre leurs terribles pouvoirs au service d'une cause qu'ils estiment
    juste.</span></p><h2><span>Armes &amp; armures</span></h2><p><span>Le
    démoniste sait manier la dague et le bâton. Les voies de démoniste
    interdisent de porter une armure ou d'utiliser un
    bouclier.</span></p><h2><span>Équipement de départ</span></h2><p><span>Bâton
    ferré (DM 1d6), dague (DM 1d4), grimoire de sorts ou parchemins anciens
    contenant des formules démoniaques.</span></p>
