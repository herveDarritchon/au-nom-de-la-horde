name: Provocation
type: capacity
img: icons/creatures/magical/construct-face-stone-pink.webp
system:
  description: >-
    <p style="text-align:justify">Le voleur maîtrise l’art de se rendre
    désagréable, voire insupportable. S’il emporte un test opposé de CHA contre
    INT d’un adversaire humanoïde à moins de 10 m, il force la cible à
    l’attaquer à son prochain tour. À ce moment‑là, si le voleur est au contact,
    il peut riposter par une attaque de contact gratuite pour laquelle il
    bénéficie au choix d’une attaque sournoise ou d’un bonus de 1d4° aux DM.</p>
  inGame: >-
    <p>Cette capacité propose une action qui va lancer une action de CHA vs INT
    et indiquer le résultat. Le reste est à gérer à la main.</p> <p>Note: A
    coder : lancer un test de compétence et non pas d'attaque.</p>
