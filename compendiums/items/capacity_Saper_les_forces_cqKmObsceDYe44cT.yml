name: Saper les forces
type: capacity
img: icons/magic/light/hand-sparks-smoke-teal.webp
system:
  description: >-
    <p style="text-align:justify">Le magicien choisit une cible vivante située à
    une distance maximum de 10 m. S’il réussit un test opposé d’attaque magique,
    la cible subit un malus de ‑2 à ses tests de FOR, d’attaque au contact et
    aux DM, jusqu’à la fin du combat. Le sort n’est pas cumulable plusieurs fois
    sur la même cible.</p>
  inGame: >-
    <p>Le joueur sélectionne sa cible puis clique sur l'action pour lancer le
    sort qui va faire le test d'attaque magique et lui appliquer un effet de
    "debuff" pendant la durée du sort.</p> <p>L'effet périodique fonctionne
    uniquement en mode Combat.</p>
