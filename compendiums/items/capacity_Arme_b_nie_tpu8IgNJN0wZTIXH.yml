system:
  description: >-
    <p style="text-align:justify">Le paladin effectue un court rituel et son
    arme est bénie pour une durée de 24 h. Lorsqu’il obtient un résultat de 1
    sur son dé de DM, il relance le dé et garde le second résultat. Les DM de
    l’arme sont considérés comme magiques. L’arme n’est plus bénie si une autre
    créature l’utilise.</p>
  inGame: >-
    <p>Pas d'effets automatiques. A gérer à la main par le MJ, pour l'instant.
    Pensez à dépenser 1 PM à l'usage.</p>
