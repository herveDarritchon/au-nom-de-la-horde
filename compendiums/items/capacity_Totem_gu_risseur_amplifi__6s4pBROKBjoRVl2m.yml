system:
  description: >-
    <p>Rang 4 — Totem guérisseur amplifié (M)*, 4 PM. Poser un totem d’Eau à 2 m
    maximum. À la fin de chaque tour du Chaman, il rend 1d4° PV à l’allié
    conscient le plus blessé dans son rayon de 5 m ; en cas d’égalité, le Chaman
    choisit. Trois soins au maximum, puis disparition ; aucune charge perdue si
    aucune cible valide. Ne soigne pas une cible à 0 PV. Ne peut pas coexister
    avec un Totem guérisseur ou un autre totem d’Eau. Pas de brûlure de
    mana.</p>
