name: Attaque bondissante
type: capacity
img: icons/creatures/abilities/paw-glowing-yellow.webp
system:
  description: >-
    <p>Le druide ou son félin parcourt de 5 à 10 m et bénéficie d’un dé bonus au
    test d’attaque et de +1d4° aux DM contre sa cible. Il ne peut pas effectuer
    d’attaque bondissante s’il est au contact d’un adversaire.</p>
  inGame: >-
    <p>Si cela concerne le joueur, celui-ci sélectionne sa cible et clique sur
    l'action "Attaque bondissante" qui prendra en compte les bonus pour
    l'attaque et l'arme tenu en main.</p>

    <p>Si cela concerne la panthère il faudra lui donner cette capacité pour en
    faire de même</p>
