system:
  description: >-
    <blockquote><p><em>« Là où les autres pansent leurs plaies, le Troll revient
    déjà dans la chasse. »</em></p></blockquote><p>Grands, élancés et nerveux,
    les <strong data-start="55" data-end="77">Trolls Sombrelance</strong> sont
    des survivants endurcis, réputés pour leur agilité, leurs talents de
    chasseurs et leur étonnante capacité de régénération. Habiles à l’arc comme
    aux armes de jet, ils peuvent libérer dans les situations les plus
    dangereuses une redoutable <strong data-start="322" data-end="342">frénésie
    berserk</strong>. Profondément attachés à leur tribu, aux esprits et aux
    Loas, les Sombrelances sont un peuple <strong data-start="437"
    data-end="475">pragmatique, adaptable et farouche</strong>, qui a trouvé
    auprès de la Horde une nouvelle terre à défendre sans renier ses anciennes
    traditions.</p>
