system:
  description: >-
    <p style="text-align:justify">L’ensorceleur crée un mur de force invisible
    et indestructible (portée 10 m, maximum 5 m de haut et 10 m de long,
    vertical, sans coudes), ou bien un hémisphère de 3 m de rayon centré sur
    lui‑même, tous les deux immobiles. Le sort dure CHA minutes. Aucune matière
    ni force ne peut passer à travers le mur de force. En revanche, les attaques
    mentales ne sont pas stoppées et une porte dimensionnelle (ou une
    téléportation) permet de le franchir.</p>
  inGame: >-
    <p>Activer l'action permet de dépenser les PM. Les effets sont à gérer en
    jeu.</p>
