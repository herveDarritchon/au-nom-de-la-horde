system:
  description: >-
    <p style="text-align:justify">Par sa science de l’escrime (et de la
    fourberie), le voleur augmente ses chances de faire des coups critiques avec
    une arme légère de 2 points (ainsi, au lieu de 20, le critique standard est
    obtenu entre 18 et 20). Toutefois, la valeur minimale requise pour obtenir
    un critique ne peut être inférieure à 16 (voir page 213).</p>
  inGame: >-
    <p>Cette capacité propose un bouton activable/désactivable pour appliquer le
    bonus au seuil de critique. A activer si le joueur utilise une arme
    légère.</p>
