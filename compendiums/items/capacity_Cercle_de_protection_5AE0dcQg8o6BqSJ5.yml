name: Cercle de protection
type: capacity
img: icons/magic/defensive/barrier-shield-dome-deflect-teal.webp
system:
  description: >-
    <p style="text-align:justify">Le magicien peut tracer un cercle sur le sol
    (environ 2 m de diamètre) afin de se protéger et d’inclure à sa protection
    un nombre de personnes égal à son INT. Une fois par round, lorsqu’un sort
    prend pour cible un personnage protégé, le magicien fait un test d’attaque
    magique opposé avec l’auteur du sort. Si le test est réussi, le sort adverse
    est annulé et n’a aucun effet. De plus, toutes les créatures invoquées
    (élémentaires, démons) et les morts‑vivants qui veulent attaquer une
    créature dans le cercle subissent un dé malus en attaque. Si le magicien
    sort du cercle, le sort est dissipé.</p>
  inGame: >-
    <p>Le joueur clique sur l'action "activation du sort" pour dépenser ses PM.
    Puis il clique sur l'action "attaque magique" qui fera le jet opposé. Le
    reste est interprété par le MJ.</p>
