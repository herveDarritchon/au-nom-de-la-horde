    <p>Rang 3 — Bouclier de foudre (M)*, 3 PM. Pendant 10 rounds, jusqu’à trois
    fois, quand le Chaman subit une attaque de contact qui touche, l’attaquant
    subit 1d4° DM d’électricité après la résolution de l’attaque, sans jet
    supplémentaire. Au plus un déclenchement par round ; il perd une charge à
    chaque déclenchement. Le sort cesse après la troisième décharge ou après 10
    rounds.</p>
