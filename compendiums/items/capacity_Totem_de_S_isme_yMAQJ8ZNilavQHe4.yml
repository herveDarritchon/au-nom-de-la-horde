system:
  description: >-
    <p>Rang 3 — Totem de Séisme (M)*, 3 PM. Le Chaman pose un totem de Terre
    près de lui. À la pose puis à la fin de ses deux prochains tours (trois
    pulsations maximum), les alliés à 5 m sont libérés d’un effet de peur ou de
    fuite imposée non permanent chacun. Si plusieurs effets de peur coexistent
    sur une même cible, une pulsation n’en retire qu’un. Le totem disparaît
    après la troisième pulsation, après 10 rounds au plus ou s’il est détruit.
    Il ne dissipe pas les charmes, dominations mentales, paralysies ou autres
    états non liés à la peur. Une invocation par récupération rapide. Ce
    fonctionnement reprend le rôle anti-peur du totem WoW Classic, plutôt que de
    transformer son nom en effet de renversement.</p>
