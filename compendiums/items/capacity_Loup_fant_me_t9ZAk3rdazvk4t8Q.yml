system:
  description: >-
    <p>Rang 2 — Loup fantôme (M)*, 2 PM. Le Chaman prend une forme lupine
    spectrale pour 10 minutes, avec une vitesse de déplacement augmentée de 5 m
    par action de mouvement. Il peut se déplacer, pister, sentir et fuir mais ne
    peut ni utiliser une arme ni lancer de sort sous cette forme. Une attaque,
    une incantation ou une dissolution volontaire met immédiatement fin à la
    transformation. Ses totems préexistants continuent jusqu’à leur fin normale.
    Son équipement accompagne la forme sans procurer d’action
    supplémentaire.</p>
