system:
  description: >-
    <p>Rang 4 — Totem de Glèbe (M)*, 4 PM. Un totem d’Air est posé pour 10
    rounds, avec une seule interception. Lorsqu’un sort ennemi cible directement
    une seule créature à 5 m ou moins du totem, le Chaman peut déclarer
    l’interception hors de son tour, gratuitement. Il oppose son attaque magique
    à celle du lanceur ennemi : en cas de réussite, le sort est annulé pour
    cette cible ; en cas d’échec, le sort agit normalement. Dans les deux cas,
    le totem est consommé. Ne fonctionne pas sur les sorts de zone ni sur les
    effets déjà actifs ; 1 invocation par récupération rapide.</p>
