name: Terrains difficiles
type: capacity
img: icons/magic/nature/root-vines-grow-brown.webp
system:
  description: >-
    <p>Le druide ne subit aucune pénalité de déplacement en terrain difficile
    (natation, neige, boue, broussailles, pente abrupte, etc.). Il obtient un
    bonus de +3 en initiative, et +1 en attaque et en DEF lors d’un combat dans
    ces conditions.</p>
  inGame: >-
    <p>Il s'agit d'un bonus activable/désactivable si le druide est dans les
    conditions indiquées. Les modificateurs aux déplacements ne sont pas
    automatisés.</p>
