name: Survie
type: capacity
img: icons/environment/wilderness/cave-entrance-rocky.webp
system:
  description: >-
    <p style="text-align:justify">Le rôdeur ajoute son rang + 2 à tous les tests
    d’escalade et de survie en milieu naturel (s’orienter, trouver un abri et de
    la nourriture, etc.) dont les tests de récupération effectués chaque nuit.
    Lorsqu’il dort en milieu naturel, s’il dépense 1 dé de récupération (DR), il
    guérit 1d4° PV supplémentaire (en plus de [DR max + ½ niveau]).</p>
  inGame: >-
    <p>Pour le bonus en survie, il s'agit d'un bonus permanent à partir du
    moment où il est appris.</p>

    <p>Pour le bonus de PV récupéré c'est laissé géré par le MJ</p>
