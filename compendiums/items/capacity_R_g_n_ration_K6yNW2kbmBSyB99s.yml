system:
  description: >-
    <p>L’organisme des Trolls possède une faculté de régénération
    exceptionnelle.</p><p>Récupération : lorsqu’un Troll dépense un Dé de
    récupération (DR) pour récupérer des PV pendant une récupération, il
    récupère normalement les PV accordés par ce DR et gagne en plus 1d4 PV. Ce
    bonus ne peut être obtenu qu’une seule fois par
    récupération.</p><p>Régénération de combat : une fois par combat, le Troll
    peut dépenser 1 DR pour récupérer immédiatement 1d4 PV. Dans ce cas, il ne
    lance pas son DR et ne bénéficie d’aucun des PV normalement accordés par sa
    dépense : le DR est simplement consommé pour activer la régénération. La
    Régénération de combat redevient disponible après une Récupération
    rapide.</p>
