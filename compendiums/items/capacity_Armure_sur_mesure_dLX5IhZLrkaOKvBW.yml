system:
  description: >-
    <p>L’armure du chevalier est parfaitement ajustée, aussi il n’ajoute que la
    moitié de sa DEF à la difficulté des tests pour lesquels l’armure inflige
    une pénalité. De plus, lorsqu’il porte une armure lourde (plaque ou plaque
    complète), il obtient un bonus de +1 en DEF à chaque fois qu’il atteint le
    rang 5 dans une voie de chevalier</p>
  inGame: >-
    <p>Activer l'action lorsque le personnage porte une armure lourde pour
    appliquer le bonus. Pour les tests d'agilité, c'est au MJ de gérer
    manuellement.</p>
