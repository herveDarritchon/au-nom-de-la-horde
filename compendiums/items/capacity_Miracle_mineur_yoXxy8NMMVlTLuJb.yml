name: Miracle mineur
type: capacity
img: icons/magic/holy/chalice-glowing-gold-water.webp
system:
  description: >-
    <p style="text-align:justify">Le prêtre réalise un petit miracle. Par
    exemple, purifier de l’eau croupie pour qu’elle devienne buvable ou des
    aliments avariés (mais il ne peut pas en créer), apaiser une douleur mineure
    (qui n’entraîne pas de malus) ou même une douleur majeure pendant un seul
    round, soigner une maladie bénigne (rhume, grippe, etc.). Ce sort permet
    aussi de rendre 1d4° PV à une créature à 0 PV.</p>
  inGame: >-
    <p>Le joueur sélectionne sa cible puis clique sur l'action pour lancer le
    sort qui applique les soins sur la cible. Attention ne vérifie pas si la
    cible est à 0 PV !</p>
