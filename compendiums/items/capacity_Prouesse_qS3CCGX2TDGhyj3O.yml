system:
  description: >-
    <p>Le guerrier réussit souvent des exploits physiques hors‑norme. Une fois
    par round, vous pouvez sacrifier 1d4° PV pour obtenir +5 sur un test de FOR
    ou de CON. Vous pouvez annoncer l’utilisation de cette capacité après avoir
    pris connaissance du résultat du test de caractéristique.</p>
  inGame: >-
    <p>En activant l'action, le jet de Dommages est effectué et le bonus aux
    tests de compétences s'active. Le joueur doit désactiver l'action dès qu'il
    a effectué le ou les tests de compétence. Si le bonus est rajouté après
    avoir prit connaissance du résultat, l'action permet tout de même
    d'effectuer le jet de Dommages.</p>
