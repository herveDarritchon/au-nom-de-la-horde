system:
  description: >-
    <p>En milieu naturel, le rôdeur ajoute son rang + 2 à ses tests de
    discrétion et de vigilance ainsi qu’aux tests pour pister. De plus, le
    rôdeur peut remplacer le bonus de +1 PC de la famille des aventuriers par un
    bonus de +1 DR si le joueur le souhaite.</p>
  inGame: >-
    <p>Cette capacité propose 2 améliorations :</p>

    <p>Un bonus pour le bonus de discrétion et vigilance. L'autre augmente les
    DR de 1 et diminue les PC de 1. Si vous ne souhaitez pas cette modification,
    supprimez l'action "Remplace 1 PC par 1 DR".</p>
