system:
  description: >-
    <p style="text-align:justify">Le voleur ajoute son rang + 2 aux tests
    destinés à baratiner, séduire, négocier, mentir ou pour trouver un objet au
    marché noir. De plus, il devient capable d’utiliser les parchemins ou les
    baguettes magiques en réussissant un test d’attaque magique (L) contre une
    difficulté de (10 + (2 x rang du sort inscrit)). En cas d’échec, le sort
    n’est pas lancé et le voleur peut faire une nouvelle tentative.</p>
  inGame: >-
    <p>Le bonus aux jet pour baratiner est un bonus permanent à partir du moment
    où il est appris. L'action d'attaque magique permet au personnage de tester
    d'utiliser un parchemin ou une baguette magique. Reste au MJ de comparer
    avec la Difficulté.</p>
