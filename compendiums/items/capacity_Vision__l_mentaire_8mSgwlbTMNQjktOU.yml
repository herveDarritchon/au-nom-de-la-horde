    invisibles. Les créatures cachées seulement par un voile surnaturel
    deviennent perceptibles mais ne sont pas automatiquement identifiées, ni
    visibles par ses alliés. Un mur plein bloque la perception. Une utilisation
    par récupération rapide.</p>
