system:
  description: >-
    <p style="text-align:justify">Une fois par jour, le magicien disparaît et
    réapparaît à un autre endroit situé à moins de (niveau x INT) kilomètres. Le
    lieu d’arrivée doit être soit en vue, soit parfaitement connu par le
    magicien. Le magicien peut emmener avec lui un allié à partir du niveau 10,
    un deuxième au niveau 13, un troisième au niveau 16 et enfin un quatrième au
    niveau 19.</p>
  inGame: >-
    <p>Le joueur clique sur l'action "activation du sort" pour dépenser ses PM.
