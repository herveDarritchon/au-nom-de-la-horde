system:
  description: >-
    <p style="text-align:justify">Le prêtre entonne un chant pour encourager ses
    compagnons en vue. Ses alliés et lui bénéficient d’un bonus de +1 à tous
    leurs tests de caractéristique et d’attaque pendant CHA minutes. Ce bonus
    passe à +2 au rang 5. De plus, le prêtre obtient un bonus égal à son rang +
    2 à tous les tests de théologie ou de cosmologie.</p>
  inGame: >-
    <p>2 actions</p><p>Une amélioration permanente pour la théologie et la
    cosmologie</p><p>Une action pour laquelle le joueur cible les cibles et
    lorsqu'il clique sur l'action, chaque token ciblé reçoit un bonus à tous ses
    jets de caractéristique et d'attaque. Utilisable uniquement en combat.</p>
