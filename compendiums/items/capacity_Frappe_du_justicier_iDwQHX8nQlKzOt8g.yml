system:
  description: >-
    <p>Lorsque le chevalier réalise cette attaque au contact, si le test
    d’attaque est un échec, il inflige tout de même ½ DM à sa cible. Un résultat
    de 1 au d20 n’inflige aucun DM.</p>
  inGame: >-
    <p>Cette capacité propose une action d'attaque qui reprend les informations
    de l'arme équipée. Si l'attaque est un echec un effet de dégat périodique de
    round et 1/2 dégats de l'arme est appliqué à la cible. Ne fonctionne qu'en
    mode combat.</p>
