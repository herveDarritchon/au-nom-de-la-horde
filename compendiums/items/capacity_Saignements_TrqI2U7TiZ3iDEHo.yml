system:
  description: >-
    <p>Le sorcier doit réussir un test d’attaque magique (portée 10 m) contre
    une difficulté de [10 + CON de la cible]. Du sang s’écoule de la bouche, du
    nez, des oreilles et même des yeux de la victime, qui subit 1d4° DM par
    round pendant INT rounds.</p>
