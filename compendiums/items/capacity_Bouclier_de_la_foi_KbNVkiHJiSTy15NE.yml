system:
  description: >-
    <p style="text-align:justify">Le prêtre porte le symbole de sa foi sur son
    bouclier, ce qui lui confère un bonus supplémentaire de +1 en DEF lorsqu’il
    l’utilise. Ce bonus passe à +2 au rang 5. Comme pour l’arme bénie, le
    symbole de la foi n’est d’aucune utilité si le bouclier est utilisé par
    quelqu’un d’autre</p>
  inGame: >-
    <p>Il s'agit ici d'une amélioration activable/désactivable vu la nécessité
    d'être équipé d'un bouclier.</p>
