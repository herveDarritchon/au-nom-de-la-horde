system:
  description: >-
    <p>Le Tauren obtient un dé bonus aux tests de FOR ou de CON lorsqu’il
    résiste à un effet visant explicitement à le renverser, le repousser ou le
    déplacer contre son gré.</p><p>De plus, une fois avant sa prochaine
    récupération rapide, lorsqu’un effet devrait lui appliquer l’état Renversé,
    il peut choisir de l’ignorer.</p><p>Cette capacité ne crée pas de test de
    résistance lorsqu’un effet n’en prévoit normalement aucun.</p>
