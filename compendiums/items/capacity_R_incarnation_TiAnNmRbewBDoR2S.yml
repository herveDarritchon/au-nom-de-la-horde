system:
  description: >-
    <p>Rang 5 — Réincarnation (G)*, 5 PM. Une fois par aventure, au moment où le
    Chaman devrait tomber à 0 PV à cause de DM mais avant de devenir
    inconscient, il peut invoquer l’esprit de ses ancêtres : il reste conscient
    et revient immédiatement à 1d4° + VOL PV (minimum 1), sans dépasser ses PV
    maximum. Il doit réellement disposer des 5 PM, sans brûlure de mana. Cette
    capacité ne ressuscite pas un personnage déjà mort et ne retire pas
    automatiquement les états préjudiciables. La dépense de l’action gratuite
    est déclenchée hors de son tour si nécessaire. Une seule activation possible
    par aventure, même après plusieurs récupérations.</p>
