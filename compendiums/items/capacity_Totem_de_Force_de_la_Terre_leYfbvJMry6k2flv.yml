system:
  description: >-
    <p>Rang 2 — Totem de Force de la Terre (M)*, 2 PM. Au lieu d’un autre totem
    de Terre, le Chaman en plante un qui donne de la vigueur au corps à corps. À
    chaque round, la première attaque de contact réussie par un allié dans son
    rayon de 5 m inflige +1d4° DM physiques. Maximum 3 déclenchements pendant sa
    vie, puis le totem disparaît. Effet limité à une attaque améliorée par round
    dans toute la zone (pas une par allié). Dure au plus 10 rounds.</p>
