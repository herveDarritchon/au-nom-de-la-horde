name: Tactiques de meute
type: capacity
img: icons/creatures/abilities/wolf-howl-moon-white.webp
system:
  description: >-
    <p>Lorsque le loup attaque la même cible que le rôdeur, il obtient un bonus
    de 1d4° aux DM. Chaque fois que le rôdeur dépense 1 PV pour soigner son
    loup, le loup récupère 2 PV. De plus, le rôdeur et son loup augmentent leur
    DEF de +1 chaque fois que le personnage atteint le rang 5 dans une voie de
    rôdeur (celle‑ci incluse).</p>
  inGame: >-
    <p>Seul le bonus de DEF est pris en compte ici. Les bonus sur le loup
    doivent être glissés-déposés sur la fiche à partir de la capacité de
    rencontre :
    @UUID[Compendium.cof2-base.cof-2-base-items.Item.HZr0arkAqWKbiNmN]{Tactiques
    de meute}. Il faudra adapter le bonus de DEF de cette capacité qui ne se met
    pas à jour automatiquement</p>
