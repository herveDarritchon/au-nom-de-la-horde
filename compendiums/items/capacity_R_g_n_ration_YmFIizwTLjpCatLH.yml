system:
  description: >-
    <p>Une cible touchée par le druide récupère [3d4°+PER] PV par un rituel de
    10 min (la cible et le druide doivent rester au calme). À partir du rang 5,
    ce sort permet aussi de faire repousser les membres ou les parties du corps
    amputées. Une cible peut bénéficier de ce sort seulement une fois par
    jour.</p>
  inGame: >-
    <p>Le joueur sélectionne sa cible puis clique sur l'action pour lancer le
    sort qui va faire le jet de soin et appliquer les soins à la cible.</p>
