system:
  description: >-
    <p>Rang 1 — Écoute des ancêtres (passif). Le Chaman gagne +3 aux tests de
    VOL visant à communiquer avec des esprits consentants et +3 aux tests de PER
    pour remarquer des traces rituelles ou manifestations spirituelles sur un
    lieu. Une fois par récupération rapide, après avoir médité une minute près
    d’une trace spirituelle, il peut poser au MJ une question précise sur
    l’événement surnaturel récent le plus marquant de ce lieu. Le MJ transmet un
    indice sincère mais limité à ce que les esprits pourraient percevoir ; si
    aucune trace pertinente n’existe, le Chaman apprend cette absence, sans
    révélation inventée. Ce n’est pas un sort.</p>
