system:
  description: >-
    <p>La cible au contact est guérie d’un poison ou d’une maladie. Si
    l’infection est surnaturelle, un test d’attaque magique (éventuellement
    opposé) peut être demandé par le MJ. De plus, le prêtre obtient un bonus
    égal au rang + 2 aux tests effectués pour résister aux maladies et aux
    poisons</p>
  inGame: >-
    <p>Le bonus résistance maladie/poisons est pris en compte sous forme de
    bonus permanent. L'action permet de réaliser une Attaque magique. Si une
    cible est sélectionnée ce sera en opposition. L'action dépense les PM par
    contre pour des maladies et poisons naturels, le PJ dépense manuellement les
    PM.</p>
