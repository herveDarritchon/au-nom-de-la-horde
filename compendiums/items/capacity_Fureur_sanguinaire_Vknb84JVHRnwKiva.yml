system:
  description: >-
    <p class="MsoNormal"><span lang="EN-US"
    style="mso-fareast-font-family:'DejaVu Serif';mso-bidi-font-family:'DejaVu
    Serif'">Orc peut dépenser 1 DR pour puiser brutalement dans ses réserves
    physiques.</span></p><p class="MsoNormal"><span lang="EN-US"
    style="mso-fareast-font-family:'DejaVu Serif';mso-bidi-font-family:'DejaVu
    Serif'">Jusqu’à la fin de son prochain tour, une fois par round, lorsqu’il
    réussit une attaque au contact, il ajoute +1d4 aux DM de cette attaque.
    </span></p><p class="MsoNormal"><span lang="EN-US"
    style="mso-fareast-font-family:'DejaVu Serif';mso-bidi-font-family:'DejaVu
    Serif'">Fureur sanguinaire n’empêche pas l’Orc de fuir ou d’effectuer des
    attaques à distance, mais celles-ci ne bénéficient pas du bonus.
    </span></p><p class="MsoNormal"><span lang="EN-US"
    style="mso-fareast-font-family:'DejaVu Serif';mso-bidi-font-family:'DejaVu
    Serif'">Après utilisation, Fureur sanguinaire ne peut être utilisée de
    nouveau avant une récupération rapide.</span></p>
