system:
  description: >-
    <p>Une fois par combat, lorsque le chevalier déclare l’utilisation de cette
    capacité, tous ses alliés en vue et lui obtiennent 10 m de déplacement
    supplémentaire au début de leur tour puis un dé bonus et +1d4° DM à toutes
    leurs attaques. Ne se cumule ni avec exemplaire ni avec ordre de
    bataille.</p>
  inGame: >-
    <p>Le joueur sélectionne ses cibles puis clique sur l'action pour lancer un
    effet de 1 round sur lui et tous ses alliés et qui va leurs donner un bonus
    de 10 en déplacement, un bonus de 1d4° DM ainsi que des dé bonus en
    attaque</p>
