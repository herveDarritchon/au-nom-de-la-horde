name: Désintégration
type: capacity
img: icons/magic/fire/flame-burning-skull-orange.webp
system:
  description: >-
    <p style="text-align:justify">Le magicien projette un rayon mortel dont la
    portée est de 20 m et qui annule la cohésion de la matière, ne laissant
    derrière lui qu’un amas de poussière. Un test d’attaque magique réussi
    contre la DEF de la cible inflige [5d4°+INT] DM. Si le magicien vise un
    objet porté par une créature, le test d’attaque subit un dé malus. Les
    objets magiques sont insensibles à ce sort et les objets normaux (jusqu’à
    100 kg) sont réduits en poussière. Une créature réduite à 0 PV par ce sort
    est proprement désintégrée, ne laissant aucun cadavre derrière elle ! (Ses
    objets magiques sont épargnés).</p>
  inGame: >-
    <p>Le joueur sélectionne sa cible puis clique sur l'action pour lancer le
    sort qui va faire le test d'attaque magique et appliquer les dommages.</p>
