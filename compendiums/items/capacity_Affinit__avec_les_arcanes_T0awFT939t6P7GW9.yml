system:
  description: >-
    <p>Ponction de mana représente une technique spécifique des Sin’dorei plutôt
    qu’une simple affinité elfique à la magie. Une fois avant sa prochaine
    récupération rapide, le Sin’dorei peut tenter d’absorber une partie de
    l’énergie magique d’une créature à courte portée possédant des PM. Sur un
    test réussi, la cible perd une petite quantité de PM et le Sin’dorei
    récupère une partie de cette énergie. La nature du test, la quantité exacte
    de PM perdue et récupérée, les cibles valides et les interactions avec une
    créature sans PM doivent être définies avant playtest chiffré.</p>
