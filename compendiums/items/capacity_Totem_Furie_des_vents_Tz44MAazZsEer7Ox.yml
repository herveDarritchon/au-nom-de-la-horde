  description: >-
    <p>Rang 5 — Totem Furie-des-vents (M)*, 5 PM. Un totem d’Air augmente les
    attaques au contact : à chaque round, la première attaque de contact réussie
    d’un allié à 5 m ou moins inflige +1d4° DM d’électricité. Au plus 3
    déclenchements, puis il disparaît ; au plus un par round pour toute l’aura.
    Ce totem ne donne pas une attaque supplémentaire. Dure au plus 10
    rounds.</p>
