  description: >-
    <p>Rang 3 — Chaîne d’éclairs (A)*, 3 PM. Choisir une cible visible à 20 m,
    puis une deuxième cible visible à 5 m ou moins de la première (facultative).
    Faire un jet d’attaque magique distinct contre la DEF de chaque cible. La
    première subit 2d4° + VOL DM d’électricité sur une réussite ; la seconde
    1d4° + VOL DM sur une réussite. Une créature ne peut pas être touchée deux
    fois par la même Chaîne d’éclairs.</p>
