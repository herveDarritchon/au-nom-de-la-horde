    data-end="207">ne subir que la moitié des dégâts</strong>.</p><p>Cette
    capacité est sans effet contre une créature dont le <strong data-start="482"
    data-end="530" data-is-only-node>NC est au moins égal au double du niveau
    </strong>du Réprouvé.</p>
