name: Chasseur
type: profile
img: modules/warbound-campaign-content/assets/images/profils/cof2-profil-chasseur.png
system:
  description: >-
    <p><span><strong>Points de vigueur :</strong> 4 par
    niveau</span></p><p><span>Le chasseur est un maître de la survie, du pistage
    et du combat à distance. Aussi à l'aise dans les forêts profondes que dans
    les plaines sauvages ou les déserts arides, il connaît les habitudes des
    animaux et sait déceler les dangers de son environnement. Redoutable avec un
    arc, une arbalète ou un fusil, il utilise également des pièges et des
    techniques de traque pour prendre l'avantage sur ses adversaires. Certains
    chasseurs développent un lien privilégié avec une bête sauvage qui devient
    leur fidèle compagnon, combattant et parcourant le monde à leurs
    côtés.</span></p><h2><span>Sur Azeroth</span></h2><p><span>On rencontre des
    chasseurs parmi de nombreux peuples d'Azeroth, où ils remplissent les
    fonctions de pisteurs, d'éclaireurs, de pourvoyeurs et de protecteurs des
    communautés. Chez les Orcs, la chasse est une tradition ancienne et les
    liens avec les loups occupent une place particulière dans leur culture. Les
    Trolls Sombrelances sont réputés pour leur habileté à traquer le gibier et
    les créatures dangereuses, tandis que les Taurens pratiquent la chasse comme
    une activité essentielle à leur subsistance, profondément liée à leur
    respect de la nature et de la Terre-Mère. Chez les Nains, la maîtrise du
    fusil et la chasse au gros gibier sont également des traditions bien
    établies, tandis que les Elfes de la nuit comptent d'excellents archers et
    forestiers parmi les défenseurs de leurs terres.</span></p><p><span>Dans la
    jeune Horde de Thrall, les chasseurs jouent un rôle essentiel. Ils explorent
    les territoires encore mal connus de Kalimdor, protègent les routes,
    traquent les prédateurs et fournissent nourriture et ressources aux
    nouvelles communautés. Certains parcourent seuls les étendues sauvages,
    d'autres servent d'éclaireurs aux forces de la Horde ou mettent leurs
    talents au service de leur clan. Leur connaissance du terrain et des
    créatures qui le peuplent fait souvent la différence entre une expédition
    réussie et une disparition sans laisser de traces.</span></p><h2><span>Armes
    &amp; armures maîtrisées</span></h2><p><span>Le chasseur sait manier les
    armes de contact à une main et toutes les armes à distance, notamment les
    arcs, les arbalètes et les armes à feu. Les voies de chasseur limitent
    l'armure au cuir renforcé et interdisent le port du
    bouclier.</span></p><h2><span>Équipement de départ</span></h2><p><span>Épée
    longue (DM 1d8), arc court et carquois (DM 1d6, portée 30 m) ou une autre
    arme de contact (épée courte, hachette, lance), dague (DM 1d4), armure de
    cuir renforcé (DEF +3).</span></p>
