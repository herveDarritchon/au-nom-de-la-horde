  description: >-
    <p>Rang 2 — Horion de flammes (A)*, 2 PM. Une cible visible à 10 m. Attaque
    magique contre DEF ; réussite : 1d4° + VOL DM de feu (minimum 1), puis 1 DM
    de feu supplémentaire au début du prochain tour de la cible. Ce DM différé
    n’est infligé qu’une fois, ne se cumule pas avec un autre Horion de flammes,
    et disparaît si la cible consacre une action de mouvement à éteindre les
    flammes avant ce déclenchement.</p>
