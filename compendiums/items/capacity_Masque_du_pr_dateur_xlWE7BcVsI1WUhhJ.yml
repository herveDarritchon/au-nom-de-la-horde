system:
  description: >-
    <p>Pendant PER minutes, le druide prend les traits d’un fauve ou d’un loup.
    Il gagne +2 en Initiative, en DEF, en attaque et aux DM au contact et peut
    voir dans la nuit (comme un elfe).</p>
  inGame: >-
    <p>Action activable/désactivable en cliquant/recliquant dessus. Lorsqu'elle
    est active la capacité donne les bonus ci dessus. Mais le token du joueur ne
    change pas pour prendre l'apparence d'un loup...</p>
