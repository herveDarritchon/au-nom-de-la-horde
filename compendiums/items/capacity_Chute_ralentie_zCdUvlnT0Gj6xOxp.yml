name: Chute ralentie
type: capacity
img: icons/magic/nature/leaf-oak-glow-green.webp
system:
  description: >-
    <p style="text-align:justify">Le magicien peut désigner un nombre de cibles
    maximal (dont lui‑même) égal à son INT à une portée de 10 m, même en dehors
    de son tour. Les cibles peuvent chuter de n’importe quelle hauteur sans
    subir de dommages. En cas de chute inattendue, le magicien doit faire un
    test d’INT difficulté 15 pour chacun de ses compagnons afin d’avoir le temps
    de lancer le sort (réussite automatique sur lui‑même).</p>
  inGame: >-
    <p>Le joueur clique sur l'action pour dépenser les PM. </p><p>La deuxième
    action permet de réaliser le test de sauvegarde en cas de chte inattendue
    pour chacun des compagnons.</p>
