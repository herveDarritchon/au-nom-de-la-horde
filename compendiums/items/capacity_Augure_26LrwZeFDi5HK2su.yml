system:
  description: >-
    <p>Le prêtre entre en contact avec les forces de l’au‑delà et demande un
    avis sur les conséquences d’une action (par exemple « quelles seront les
    conséquences si j’ouvre cette porte ? »). Il doit faire un test de CHA
    difficulté 10. En cas de succès, il reçoit une réponse déterminée par le MJ
    parmi : <strong>bénéfique, incertain, risqué ou préjudiciable</strong>. Le
    MJ essaie de donner la réponse la plus utile possible au scénario.</p>
  inGame: >-
    <p>L'action permet de réaliser le test de sauvegarde de CHA difficulté 10 et
    de dépenser les PM.</p>
