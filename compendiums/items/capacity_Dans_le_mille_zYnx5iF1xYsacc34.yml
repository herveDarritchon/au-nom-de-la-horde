name: Dans le mille
type: capacity
img: icons/skills/ranged/target-bullseye-archer-orange.webp
system:
  description: >-
    <p>Pour une attaque à distance, le rôdeur peut choisir de s’imposer un dé
    malus en attaque. Si elle est réussie, il ajoute 2d4° aux DM. Cette capacité
    peut être utilisée avec Tir rapide ou Flèche de mort par exemple.
    Transformez cette capacité en action limitée (L) pour obtenir +3d4° aux DM
    au lieu de 2d4°.</p>
  inGame: >-
    <p>Cette capacité propose 2 actions. La première (A) avec +2d4° DM et le dé
    malus. La 2eme (L) avec +3d4° DM et le dé malus. Comme d'habitude il faut
    d'abord cibler un token.</p>
