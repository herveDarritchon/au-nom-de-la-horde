system:
  description: >-
    <p>Lorsque le loup et le rôdeur sont au contact, le loup obtient un dé bonus
    en attaque et le rôdeur obtient un dé bonus aux tests effectués pour pister
    ou pour éviter d’être surpris (Vigilance).</p>
  inGame: >-
    <p>Il s'agit ici d'une action activable/désactivable à activer si le loup
    est à proximité et le joueur doit faire un jet de pistage ou vigilance.</p>

