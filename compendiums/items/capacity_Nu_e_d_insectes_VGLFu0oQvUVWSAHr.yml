name: Nuée d’insectes
type: capacity
img: icons/creatures/invertebrates/wasp-swarm-movement.webp
system:
  description: >-
    <p style="text-align:justify">En réussissant un test d’attaque magique
    contre la DEF de sa cible (portée 20 m), le druide libère sur celle‑ci une
    nuée d’insectes volants qui piquent, aveuglent et la suivent pendant [3 +
    PER] rounds. La victime subit 1 DM par round et un malus de ‑2 à tous les
    tests. Les DM de zone détruisent la nuée.</p>
  inGame: >-
    <p style="text-align:justify">Le joueur sélectionne sa cible puis clique sur
    l'action pour lancer le sort qui va automatiquement faire le jet d'attaque
    et lancer les Dommages. De plus, un effet de DM périodiques sera appliqué à
    la cible en cas de succès. L'attaque ne fonctionne qu'en Mode Combat.</p>
