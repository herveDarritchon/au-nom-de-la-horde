system:
  description: >-
    <p style="text-align:justify">Le prêtre fait appel à son dieu pour changer
    le cours des événements. Une fois par combat, il peut décider qu’un test du
    MJ ou des joueurs est une réussite ou un échec, même après que les dés ont
    révélé leur résultat. Il ne peut pas modifier le résultat du test obtenu par
    une créature d’un NC supérieur à son niveau.</p>
  inGame: <p>L'action permet de prendre en compte l'utilisation.</p>
