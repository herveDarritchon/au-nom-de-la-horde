system:
  description: >-
    <p style="text-align:justify">Le guerrier peut choisir de s’imposer un dé
    malus sur une attaque au contact et il ajoute +2d4° aux DM. Cette capacité
    peut être utilisée avec Double attaque, Attaque circulaire ou Attaque
    parfaite (voir exemple). Transformez cette capacité en action limitée (L)
    pour obtenir +3d4° aux DM au lieu de +2d4°.</p>
  inGame: >-
    <p>Cette capacité propose 2 actions d'attaque, la première (A) avec un dé
    malus et +2d4°DM et la 2eme (L) avec un dé malus et +3d4°DM.</p>
