name: Défense au bouclier
type: capacity
img: modules/warbound-campaign-content/assets/images/icons/capacites/classes/guerrier/cof2-defense-au-bouclier.png
system:
  description: >-
    <p style="text-align:justify">Le guerrier obtient un bonus de +1 en DEF
    lorsqu’il manie un bouclier. Ce bonus passe à +2 au rang 5. De plus,
    lorsqu’il tient son bouclier en main, il retranche son rang à tous les DM
    des attaques de zone (sorts d'Explosion de feu, mains brûlantes, foudre,
    etc. et aux souffles) sauf s’il est surpris.</p>
  inGame: >-
    <p>Cette capacité propose une action activable/désactivable pour appliquer
    un bonus de DEF comme indiqué. A activer si le joueur est équipé de son
    bouclier.</p> <p>Pour la réduction de DM, il faudra le compter à la
    main.</p>
