name: Expert en criminalité
type: capacity
img: icons/sundries/documents/document-symbol-eye.webp
system:
  description: >-
    <p>Le voleur obtient un dé bonus sur tous les tests de recherche d’indice
    (Trouver une preuve [PER], Faire une déduction [INT] et Obtenir un aveu
    [CHA]) ainsi que pour tous les tests réalisés pour brouiller des pistes,
    réaliser de faux indices ou de faux documents. De plus, lorsqu’il est dans
    un lieu, s’il dépense 1 PC, le MJ devra lui donner un indice qui lui a
    échappé jusque‑là. S’il n’y a pas d’indice, le PC n’est pas dépensé.</p>
  inGame: >-
    <p>Cette capacité propose une action activable/désactivable accordant un dé
    bonus sur les jets de caractéristiques mentionnées ci-dessus. A activer si
    les circonstances correspondent, sinon laisser désactivé.</p>
