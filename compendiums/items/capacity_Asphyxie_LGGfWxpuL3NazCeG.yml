name: Asphyxie
type: capacity
img: icons/skills/wounds/injury-face-impact-orange.webp
system:
  description: >-
    <p style="text-align:justify">Si le magicien réussit un test opposé
    d’attaque magique (avec une portée de 20 m), la créature ciblée est privée
    d’air. La victime étouffe progressivement et subit 1d4° DM par round pendant
    INT rounds. Les créatures qui ne respirent pas (morts‑vivants, créatures
    artificielles) sont immunisées à ce sort. En revanche, les réductions de
    dommages (voie du colosse, par exemple) ne s’appliquent pas.</p>
  inGame: >-
    <p>Le joueur clique sur l'action pour lancer le sort qui va faire le test
    d'attaque magique et appliquer un effet de dommages périodiques.
    L'automatisation des dommages périodiques ne fonctionne qu'en combat</p>
