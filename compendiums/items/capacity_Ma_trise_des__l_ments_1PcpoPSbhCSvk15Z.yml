name: Maîtrise des éléments
type: capacity
img: icons/magic/symbols/elements-air-earth-fire-water.webp
system:
  description: >-
    <p style="text-align:justify">Le magicien retranche son rang + 2 à tous les
    DM de feu, de froid, d’électricité ou d’acide subis pendant INT minutes. De
    plus, pendant la durée du sort, lorsqu’il lance un sort d’un élément, le
    magicien peut échanger un élément contre un autre (par exemple, une
    explosion de froid ou une flèche acide).</p>
  inGame: >-
    <p>Le PJ clique sur "activation du sort" pour dépenser les PM. Lorsque le
    Personnage est la cible de DM élémentaires, il peut activer l'action "RD
    contre DM élémentaires" et la désactiver ensuite pour les autres
    attaques</p>
