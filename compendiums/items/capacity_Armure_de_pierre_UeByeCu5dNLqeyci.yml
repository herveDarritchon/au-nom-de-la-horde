name: Armure de pierre
type: capacity
img: icons/magic/defensive/armor-stone-skin.webp
system:
  description: >-
    <p style="text-align:justify">Pendant INT minutes, le magicien retranche 5
    points à tous les DM subis. Le sort prend fin dès qu’il a absorbé [niveau du
    magicien × 3] DM. Cette réduction se cumule à celle offerte par la Maîtrise
    des éléments. Armure de pierre est incompatible avec le sort Déphasage (voie
    de la magie protectrice), il y met fin immédiatement.</p>
  inGame: >-
    <p>Le joueur clique sur l'action pour "l'activer" et lancer le sort qui va
    lui appliquer un "buff" augmentant automatiquement sa DEF. Pour prendre en
    compte la fin du sort, il faut "désactiver" l'action en recliquant
    dessus.</p>
