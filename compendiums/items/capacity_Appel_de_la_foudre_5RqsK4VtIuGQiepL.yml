name: Appel de la foudre
type: capacity
img: icons/magic/lightning/bolt-forked-large-blue.webp
system:
  description: >-
    <p style="text-align:justify">Le magicien projette des traits de foudre sur
    toutes les cibles de son choix dans un rayon de 10 m autour de lui. Il fait
    un seul test d’attaque magique et toutes les créatures ciblées dont il
    atteint la DEF subissent [2d4°+INT] DM d’électricité.</p>
  inGame: >-
    <p>Le joueur sélectionne ses cibles puis clique sur l'action pour lancer le
    sort qui va automatiquement lancer un jet d'attaque magique à difficulté 0.
    Au MJ de comparer le résultat de l'attaque aux défenses des cibles et
    d'appliquer les dommages.</p>
