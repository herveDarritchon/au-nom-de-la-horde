name: Archer émérite
type: capacity
img: icons/weapons/bows/shortbow-recurve-yellow-blue.webp
system:
  description: >-
    <p style="text-align:justify">Le rôdeur ajoute sa PER aux DM qu’il inflige à
    l’arc et +1 par rang dans la voie en initiative. Le joueur peut souhaiter
    une variante de cette capacité s’appliquant aux armes de jet (dague,
    hachette, javelot) plutôt qu’à l’arc (rebaptisez‑la voie du lancer). Dans ce
    cas, le PJ ajoute sa FOR aux DM qu’il inflige et double la portée de jet
    (pas de bonus d’Init.). Par ailleurs, toutes les capacités de la voie qui
    suivent s’appliquent aux armes de jet plutôt qu’à l’arc</p>
  inGame: >-
    <p>Cette capacité propose deux actions activables/désactivables. Le première
    est à activer s'il utilise un arc, à désactiver sinon. La deuxième est dans
    le cas où il utilise une arme de jet plutôt qu'un arc.</p>
