name: Pacte démoniaque
type: capacity
img: icons/magic/death/skull-horned-goat-pentagram-red.webp
system:
  description: >-
    <p>Le sorcier sacrifie 1d4° PV et gagne immédiatement +INT sur le résultat
    d’un d20 qu’il vient de lancer ou en DEF contre une attaque (avant de savoir
    si une attaque touche). De plus, il ajoute désormais sa VOL au nombre de dés
    de récupération (DR) qu’il possède.</p>
  inGame: >-
    <p>Crée 2 actions lors de l'apprentissage.</p>

    <p>1 action cliquable qui va retirer 1d4° PV au personnage mais ne gère pas
    le + INT sur un test ou la DEF, à gérer manuellement.</p>

    <p>Une amélioration permanente qui ajoute la VOL du personnage aux DR.</p>
