system:
  description: >-
    <p>Le Réprouvé obtient un dé bonus aux tests de VOL destinés à résister à la
    peur, au charme, au sommeil surnaturel et aux effets cherchant à contrôler
    directement son esprit, ses émotions ou ses actions.</p><p>De plus, une fois
    avant sa prochaine récupération rapide, s’il est déjà affecté par l’un de
    ces effets, il peut immédiatement effectuer de nouveau le test de résistance
    initial, avec ce dé bonus, même si l’effet ne prévoit normalement pas de
    nouveau test à cet instant.</p><p>Si l’effet n’autorisait initialement aucun
    test de résistance, cette capacité n’en crée pas.</p>
