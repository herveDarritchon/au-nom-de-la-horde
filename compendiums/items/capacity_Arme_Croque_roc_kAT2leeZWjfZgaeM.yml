    <p>Rang 1 — Arme Croque-roc (M)*, 1 PM. Enchanter une arme de contact tenue
    par le Chaman pendant 10 rounds. Elle devient magique contre les résistances
    et inflige +1 DM physique sur la première attaque de contact réussie à
    chaque round. Le bonus n’est pas cumulable avec une autre imprégnation
    d’arme de cette voie ; lancer un nouveau sort d’imprégnation met fin au
    précédent.</p>
