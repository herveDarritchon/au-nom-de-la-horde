name: Disparition
type: capacity
img: icons/magic/control/debuff-energy-hold-levitate-blue-yellow.webp
system:
  description: >-
    <p style="text-align:justify">Une fois par combat, le voleur peut
    disparaître dans un flash lumineux et un nuage de fumée. Aucun adversaire ne
    peut l’attaquer pendant qu’il a disparu, mais il peut subir des DM de zone.
    Il ne réapparaît qu’au début de son prochain tour à une distance maximale de
    20 m de sa position initiale. À ce moment, si le voleur a l’initiative, il
    peut réaliser une attaque sournoise.</p>
  inGame: >-
    <p>Pas d'effets automatiques. A gérer à la main par le MJ, pour
    l'instant.</p>
