system:
  description: >-
    <p>En milieu naturel, le rôdeur se déplace de 30 m en s’éloignant de ses
    ennemis. Le joueur fait un test d’AGI difficulté 10, en cas de succès, il
    disparaît de la vue de ses poursuivants. Il peut s’éloigner ou rester caché
    sans risque d’être retrouvé ou rattrapé. Si le terrain est découvert
    (désert, plaine), la difficulté passe à 15.</p>
  inGame: >-
    <p>Les deux actions permettent de réaliser un test de sauvegarde en fonction
    du milieu.</p>
